# GNOME Shell search provider: Katna's mail and contacts in the Activities
# search, served by katna-daemon over D-Bus (docs/ARCHITECTURE.md §15.3).
# Installed in /usr/share/gnome-shell/search-providers/.
[Shell Search Provider]
DesktopId=in.invenia.katna.Mail.desktop
BusName=in.invenia.katna.Daemon
ObjectPath=/in/invenia/katna/Daemon/SearchProvider
Version=2
