title = "Zoho takvimleri Zoho'nun kendi bağlantısıyla"
text = """
Zoho, takvimleri diğer uygulamalara birçok ağın engellediği bir bağlantı
noktasından sunuyor; bu yüzden Zoho ile oturum açtıktan sonra Takvim
onları Zoho'nun kendi API'si üzerinden okuyor. Zoho etkinlikleriniz
diğer takvimlerinizin yanında görünüyor; bunları Katna'dan değiştirmek
daha sonra gelecek.
"""

["2026-09-30-0216-zoho-tasks"]
title = "Zoho görevleri"
text = """
Bir Zoho hesabında Zoho ile oturum açın; hesabın Zoho ToDo görevleri
Görevler'de iki yönlü görünür: Katna'da bir görevi ekleyin, düzenleyin,
işaretleyin ya da silin, Zoho'da da değişir.
"""

["2026-09-30-0224-checkbox-tick-centred"]
title = "İşaret her boyutta ortada"
text = """
Ayarlar > Görünüm'deki Ölçekleme %100'ün üzerindeyken onay kutusunun
işareti biraz yukarıda ve solda duruyordu. Onay kutularının ve yuvarlak
düğmelerin kenarları artık ölçekle birlikte büyüyor; böylece işaret her
boyutta ortada.
"""

["2026-09-30-0230-edges-follow-scaling"]
title = "Kenar çizgileri Ölçekleme ile büyür"
text = """
Ayarlar > Görünüm'deki Ölçekleme %100'ün üzerinde ya da altındayken, odaklı
arama kutusunun ve alanların vurgu çizgisi, seçim kartlarının ve görev
halkalarının kenarları artık ince kalmak yerine her şeyle birlikte büyüyüp
küçülür.
"""

["2026-09-30-0326-google-sign-in-network"]
title = "Her ağda Google ile oturum açın"
text = """
Google ile oturum açma, Google bağlantısını erken kesen ağlarda artık
“peer closed connection” hatasıyla durmuyor. Google'ın sayfasında Gmail
işaretini kaldırırsanız, Katna sonradan başarısız olmak yerine bunu hemen
söyler.
"""

["2026-09-30-0504-google-api-turned-off"]
title = "Hangi Google API'sinin kapalı olduğunu söyler"
text = """
Google bir API'yi Katna için kapatmışsa, Kişiler, Takvim, Görevler ve Drive
dosyaları artık Google'ın ham hatası yerine hangisinin kapalı olduğunu kısa
bir satırla söyler; Aç düğmesi de Google'ın ilgili sayfasını açar.
"""

["2026-09-30-0507-newest-mail-first"]
title = "En yeni postalar önce gelir"
text = """
Bir hesap eklediğinizde Katna Mail artık önce en son postalarınızı indirir,
sonra eskilere doğru ilerler; böylece bugünün iletileri gelen kutusunun
en üstünde hemen görünür. İndirme yarıda kalırsa, eski postaları bir
sonraki sefere kaldığı yerden alır.
"""

["2026-09-30-0601-keyring-at-login"]
title = "Oturum açılışında cüzdanınızı bekler"
text = """
Katna başladığında KWallet ya da GNOME Keyring hâlâ kilitliyse ve kilit
açma penceresi kapatılmışsa, hesaplarınız artık yanlış parola göstermez.
Beklerler ve cüzdanın kilidini açtığınız anda, Katna'dan çıkmanıza gerek
kalmadan kendiliğinden eşitlemeye başlarlar. Eşitle artık kilidi yeniden
açmanızı ister.
"""

["2026-09-30-0606-pdf-rotate-and-top-bar"]
title = "PDF sayfalarını döndürün"
text = """
PDF görüntüleyici artık sayfaları saat yönünde ya da saat yönünün tersine
döndürebilir (Ctrl+R ve Ctrl+Shift+R); işaretlenmiş bir kopya da
döndürdüğünüz gibi kaydedilir. Sayfa numarası ve yakınlaştırma üst çubuğa
taşındı, böylece sayfanın üstünü hiçbir şey kapatmaz.
"""

["2026-09-30-0610-calendar-events-stay-put"]
title = "Etkinlikler yerinde kalır"
text = """
Takvim'de bir etkinliğe ya da göreve tıklayıp görünümü değiştirmek artık
onu işaretçinin peşinden sürüklemez. Bir etkinlik yalnızca düğmeyi basılı
tutup sürüklediğiniz sürece taşınır; görünümü ya da sayfayı değiştirmek,
Esc'e basmak ya da kartını açmak onu değiştirmeden yerine koyar.
"""

["2026-09-30-0620-checkbox-partial-centred"]
title = "Kısmen işaretli kutular düzgün görünür"
text = """
Yalnızca bazı iletiler seçiliyken, tümünü seç kutusunun içindeki kare,
arayüz ölçeğiniz ne olursa olsun artık her yandan aynı boşluğa sahip.
"""

["2026-09-30-0632-year-view-day-peek"]
title = "Yıl görünümünden bir günün planlarını görün"
text = """
Takvim'in Yıl görünümünde, noktalı bir günün üzerinde işaretçiyi
bekletin; o günün etkinlikleri ve görevleri yanında küçük bir açılır
pencerede, her biri ne olduğunu ve saatini gösteren bir simgeyle görünür.
Açmak için birine, günü açmak için günün adına tıklayın. Telefonda güne
dokunun.
"""

["2026-09-30-0650-notification-opens-own-window"]
title = "Bildirimler postayı önde açar"
text = """
Yeni posta bildirimine tıklamak, Katna o anda ne gösteriyor olursa olsun
o postayı kendi penceresinde, önde açar. Tümünü yanıtla onu yanıt yazmaya
hazır halde açar. Arşivle ise hiçbir şey açmadan postayı kaldırır ve bunu
Geri al düğmeli kısa bir notla bildirir.
"""

["2026-09-30-0700-event-card-join-any-call"]
title = "Teams ve Zoom görüşmelerine Takvim'den katılın"
text = """
Bir etkinliğin kartı artık açıklamasındaki ya da yerindeki görüşmeyi
bulur; böylece Microsoft Teams, Zoom, Webex, Jitsi ya da Google Meet
davetinin en üstünde bir “Şununla katıl” düğmesi olur. Açıklamadaki web
adresleri bağlantıya dönüşür, alt çizgi satırları kalktı ve ayrıntılar
kaydırılırken Katılıyor musunuz? altta kalır.
"""

["2026-09-30-0715-click-away-closes-viewer"]
title = "Kapatmak için dışarı tıklayın"
text = """
Görüntüleyiciyi kapatmak için geri düğmesine uzanmak yerine ekin
çevresindeki soluk alana tıklayın. Sayfanın kendisine yapılan tıklamalar
eskisi gibi metin seçer ve işaretleme yapar.
"""

["2026-09-30-0729-add-account-and-pop3"]
title = "Yeni Hesap ekle ekranı ve POP3"
text = """
Hesap eklemek sağlayıcınızla başlar: Google, Yahoo, iCloud, Zoho, Fastmail,
GMX, Yandex ya da başka biri. Katna önce sağlayıcının neye ihtiyaç
duyduğunu söyler, bağlanırken her adımı gösterir ve sonunda neyi
kurduğunu anlatır. POP3 hesapları da çalışır; postalarının sunucuda ne
kadar kalacağını Ayarlar > Hesaplar'dan seçebilirsiniz.
"""

["2026-09-30-0802-ctrl-wheel-zoom"]
title = "Ctrl ve tekerlekle yakınlaştırın"
text = """
Ek görüntüleyicide Ctrl'yi basılı tutup fare tekerleğini çevirerek
işaretçinin çevresinde yakınlaştırıp uzaklaştırın ya da dokunmatik
yüzeyde iki parmakla kıstırın. PDF'lerde, resimlerde, metin dosyalarında,
elektronik tablolarda ve belgelerde çalışır.
"""

["2026-09-30-0817-event-open-the-mail"]
title = "Bir etkinliğin arkasındaki postayı açın"
text = """
Gmail'in bir postadan oluşturduğu tren, uçuş ve otel gibi etkinliklerin
kartında artık bir E-postayı aç düğmesi var. Postayı Katna'da, Katna'da
yoksa Gmail'de açar. Bir postadan oluşturulan görev de Takvim'deki
kartından postasını açar; Toplantı notları al da artık hiç takılmadan
açılır.
"""

["2026-09-30-0843-calendar-side-panel-menus"]
title = "Takvimleri yan panelden yönetin"
text = """
Yalnızca onu göstermek, rengini değiştirmek, yeniden adlandırmak ya da
silmek için Takvim'in yan panelinde bir takvime sağ tıklayın. O hesapta
yeni bir takvim oluşturmak ya da tüm takvimlerini gösterip gizlemek için
hesabın adına sağ tıklayın. Değişiklikler posta hizmetinize gider,
böylece onu kullandığınız her yerde görünür.
"""

["2026-09-30-1010-unread-list-keeps-open-mail"]
title = "Okunmamış postalar açık kalır"
text = """
Tüm Hesaplar > Okunmamış'ta bir ileti dizisini açmak artık onu hemen
kapatmıyor. Okumak onu okundu olarak işaretler ve siz kapatana ya da
başka birini açana kadar listede kalır.
"""

["2026-09-30-1045-tracked-mail-arrives"]
title = "İzlenen postalar yeniden ulaşıyor"
text = """
İzleme açıkken gönderilen postalar Gönderilen'de görünüp kimseye
ulaşmayabiliyordu. Artık her alıcıya gidiyor. Bu şekilde kaybolan
postaların yeniden gönderilmesi gerekir.
"""

["2026-09-30-1114-no-checking-pill"]
title = "Artık denetleme balonu yok"
text = """
“Yeni postalar denetleniyor…” artık listenin üzerinde belirmiyor. Yenile
düğmesindeki ve her hesabın gelen kutusundaki dönen oklar postaların
denetlendiğini zaten gösteriyor; başarısız bir denetim de neyin ters
gittiğini yine söylüyor.
"""

["2026-09-30-1300-windows-sign-in-and-domains"]
title = "Windows'ta Google ile oturum açın"
text = """
Windows için Katna artık Linux'ta olduğu gibi Google ve Zoho ile oturum
açmayı sunar ve hesabı eklerken Google Workspace adresi gibi kendi alan
adınızdaki postaları kimin barındırdığını bilir.
"""

["2026-09-30-1511-mail-tables"]
title = "Postalardaki tablolar düzgün okunur"
text = """
GitHub Actions bildirimindeki iş listesi gibi postalardaki tablolar,
bir başlığı satır başına tek harf olacak şekilde bölmek yerine sütunlarını
yan yana tutar ve satırdan satıra hizalar. Bir iletinin bölümleri
arasındaki ayırıcı çizgiler de artık görünür.
"""

["2026-09-30-1550-taller-important-marker"]
title = "Daha uzun Önemli işareti"
text = """
Yıldızın yanındaki Önemli işareti 2 px daha uzun; böylece yıldızın ve onay
kutusunun yanında artık basık görünmüyor. Satırda ortalı kalır.
"""

["2026-09-30-1617-folder-click-goes-to-top"]
title = "Listenin başına dönün"
text = """
Posta listesi bir ekran aşağı kaydırıldığında, sağ alt köşesindeki yuvarlak
bir düğme onu en üste geri götürür. Gmail'deki gibi, zaten içinde
olduğunuz klasöre (örneğin Gelen Kutusu'na) tıklamak da aynısını yapar;
Home tuşu da öyle.
"""

["2026-09-30-1622-send-from-file-manager"]
title = "Dosyaları dosya yöneticinizden gönderin"
text = """
Dolphin, GNOME Dosyalar ya da Windows Gezgini'nde dosyalara veya
klasörlere sağ tıklayıp Katna Mail ile gönder'i seçin: onları ek olarak
taşıyan yeni bir ileti açılır, klasörler zip olarak gider. Birden çok
posta hesabınız varsa, hangisinden gönderileceğini alt menüden seçin.
"""

["2026-09-30-1624-files-page"]
title = "Tüm dosyalar tek yerde"
text = """
Uygulama çubuğunun altındaki yeni Dosyalar sayfası, her hesaptaki her eki
en yeniden başlayarak gösterir. Resimlere, PDF'lere ya da belgelere, tek
bir hesaba, bir kişiye ya da bir zaman aralığına göre daraltın veya ada,
gönderene ya da konuya göre arayın. Daha fazlası için bir dosyaya sağ
tıklayın; Postayı göster sizi dosyanın geldiği postaya götürür.
"""

["2026-09-30-1643-dimmer-row-markers"]
title = "Daha sakin posta listesi"
text = """
Posta listesindeki boş onay kutusu, yıldız ya da Önemli işareti, işaretçi
satırın üzerine gelene kadar daha soluk durur. Etkin yıldızlar ve
işaretler renklerini korur.
"""

["2026-09-30-1704-folder-arrows-on-hover"]
title = "Daha düzenli klasör bölmesi"
text = """
Gelen Kutusu, Yıldızlı ve diğer klasörlerin yanındaki küçük oklar yalnızca
işaretçi o klasörün üzerindeyken görünür. Açtığınız klasör okunu korur.
"""

["2026-09-30-1712-arrow-keys-in-times"]
title = "Saat kutularında ok tuşları"
text = """
Tarih ve saat seç'te ve bir görevin saatinde, Yukarı ve Aşağı tuşları
imlecin bulunduğu kısmı değiştirir: saati, dakikayı ya da ÖÖ/ÖS'yi.
"""

["2026-09-30-1742-check-one-folder"]
title = "Tek bir klasörde yeni posta denetleyin"
text = """
Bir klasörün sağ tık menüsündeki “Yeni postaları denetle” artık yalnızca
o klasörü denetler, bu yüzden hızlıdır. Tüm Hesaplar altındaki bir hesabın
gelen kutusunda o hesabın gelen kutusunu, Tüm Hesaplar altındaki Gelen
Kutusu ya da Gönderilen gibi bir listede ise her hesaptaki o klasörü
denetler.
"""

["2026-09-30-1742-frosted-viewer"]
title = "Daha hafif, buzlu bir görüntüleyici"
text = """
Ek görüntüleyicinin üst çubuğu daha ince ve hafif; sayfa, yakınlaştırma ve
döndürme bir balonda duruyor. Dosyanın çevresinde Katna Mail, yumuşak
koyu bir perdenin altında bulanık görünür; araç çubukları da buzlu cam.
Bulanıklık Ayarlar > Deneysel'i izler; kapalıyken görüntüleyici düz koyu
bir perde kullanır.
"""

["2026-09-30-1752-touchpad-glide"]
title = "Dokunmatik yüzeyde hızlı kaydırma süzülür"
text = """
Dokunmatik yüzeyde iki parmakla hızlıca kaydırınca, diğer uygulamalardaki
gibi kaydırma devam eder ve yavaşlayarak durur. Durdurmak için dokunmatik
yüzeye yeniden dokunun. Wayland'de.
"""

["2026-09-30-1800-inbox-tabs-in-top-row"]
title = "Gelen kutusu sekmeleri üst satırda"
text = """
Birincil, Tanıtımlar, Sosyal ve diğer gelen kutusu sekmeleri artık
listenin üst satırında bir balon çubukta, her biri okunmamış postalarının
renkli sayısıyla duruyor. Vurgu seçtiğiniz sekmeye kayar; açık sekmeye
tıklamak listesini en üste götürür. Liste darken çubuk kendi satırına
geçer ve açık sekmenin adını koruyarak simgeler gösterir; telefonda
listenin çubuğunda durur, Yenile de Diğer menüsündedir.
"""

["2026-09-30-1805-account-menu"]
title = "Sağ tık menüsünde hesap bilgileri"
text = """
Adresini, eşitlenip eşitlenmediğini, en son ne zaman denetlendiğini ve ne
kadar depolama alanı kullandığını görmek için klasör listesinde bir
hesabın adına ya da Tüm Hesaplar altındaki gelen kutusuna sağ tıklayın.
Buradan o gelen kutusunu denetleyebilir, o hesaptan yeni posta
yazabilir, ayarlarını açabilir ya da oturumun süresi dolduysa yeniden
oturum açabilirsiniz.
"""

["2026-09-30-1819-glass-search-box"]
title = "Cam bir arama kutusu"
text = """
Bulanık arka plan açıkken arama kutusu, kullanmadığınız sürece ince bir
kenarlı buzlu camdır; yazmak için içine tıkladığınızda opaklaşır.
"""

["2026-09-30-1820-search-cancel-restores"]
title = "Aramayı iptal edin, postalarınıza dönün"
text = """
Esc'e basmak ya da arama kutusunu temizlemek artık sizi kaldığınız yere
döndürür: aynı klasöre, listede aynı yere ve açık olan postaya. Bunun
yerine bir sonucu açarsanız arama eskisi gibi devam eder.
"""

["2026-09-30-1840-first-run-window"]
title = "Daha samimi bir ilk açılış"
text = """
Katna Mail'i kurarken pencere, kurulum sayfalarının arkasında hafif bir
perdenin altında görünür: uygulamalar, Oluştur ve arama kutusu, klasörlerin
ve postaların görüneceği yerlerde de yumuşak yer tutucular. Yeni bir adım
bir Katna hesabı önerir ve neleri açtığını listeler (okundu bilgileri,
bağlantı izleme, Etkinlik ve çeviri); dilerseniz atlayabilirsiniz.
"""

["2026-09-30-1850-windows-frame-and-blur"]
title = "Windows'ta Katna'nın çerçevesi ve bulanıklığı"
text = """
Windows'ta Katna Mail artık ekranın içinde açılır, ekran küçükse ekranı
kaplar. Ayarlar > Deneysel pencerenin arkasındakini bulanıklaştırabilir;
Katna'nın kendi çerçevesi de Katna Mail'i bir sonraki açışınızda üst
çubuğu başlık çubuğuna dönüştürür.
"""

["2026-09-30-1851-dark-depth"]
title = "Koyu renklerde daha kolay görünür"
text = """
Koyu renklerde, posta listesinin üzerinde yüzen öğeler artık bir ton daha
açık ve ince açık bir kenarlı, çünkü gölgeler koyu arka planda pek
görünmüyor. Başa dön düğmesi, menüler, Oluştur penceresi ve iletişim
kutuları belirgin biçimde öne çıkar. Açık renkler eskisi gibi görünür.
"""

["2026-09-30-1911-files-scrollbar"]
title = "Dosyalar sayfasında kaydırma çubuğu"
text = """
Sığandan fazla dosya olduğunda, kaydırırken ya da işaretçi dosyaların
üzerindeyken sağda ince bir kaydırma çubuğu belirir, sonra kaybolur.
Dosyalar arasında hızla ilerlemek için onu sürükleyin ya da oraya atlamak
için üstüne veya altına tıklayın.
"""

["2026-09-30-1919-tabs-keep-open-mail"]
title = "Sekme değiştirmek açık postayı korur"
text = """
Okuma bölmesi listenin yanındayken başka bir gelen kutusu sekmesi seçmek
artık okuduğunuz postayı kapatmıyor; liste değişir, posta açık kalır.
"""

["2026-09-30-1925-inbox-tabs-centred"]
title = "Gelen kutusu sekmeleri ortada"
text = """
Gelen kutusu sekmeleri artık listenin üst satırının ortasında durur ve
yalnızca düğmelerinin gerektirdiği kadar kenara kayar.
"""

["2026-09-30-1945-page-box-arrow-keys"]
title = "Sayfa kutusunda ok tuşları"
text = """
Bir PDF'te sayfa numarasına tıklayın ve bir sayfa geri ya da ileri gitmek
için Yukarı veya Aşağı'ya basın. Sayfaları hızla çevirmek için tuşu basılı
tutun.
"""

["2026-09-30-1952-phone-bar-labels"]
title = "Telefonda uygulama adları ayarınızı izler"
text = """
Ayarlar'da uygulama adları kapalıyken, telefon boyutundaki bir pencerenin
altındaki çubuk artık yan ray gibi yalnızca simgeleri, ortalanmış olarak
gösterir.
"""

["2026-09-30-1955-account-menu-icons"]
title = "Hesap menüsünde Ayarlar ve dil"
text = """
Hesap resminizin altındaki menü artık bir simge satırıyla açılır: Ayarlar'ı
açın ya da dili değiştirin. Yer açmak için dil bayrağı üst çubuktan
kaldırıldı.
"""

["2026-09-30-2001-phone-tabs-fold"]
title = "Her gelen kutusu sekmesi elinizin altında"
text = """
Pencere darken gelen kutusu sekmeleri gizlenmek yerine akıcı biçimde
katlanır: etiketler daha büyük simgelere dönüşür, sonra sayılar kenara
çekilir. Telefonda sekmeler tüm çubuğa yayılır, dokunması kolaydır; Diğer
de aynı balonun sonunda durur.
"""

["2026-09-30-2012-fit-and-page-arrows"]
title = "Görüntüleyicide Sığdır, sayfa okları ve dahası"
text = """
Ek görüntüleyicide bir Sığdır düğmesi var: PDF sayfası pencerenin
yüksekliğine, resim pencereye, belgeler, slaytlar ve elektronik tablolar
da genişliğine sığar. Resimlerde ayrıca Gerçek boyut var ve döndürülebilir.
Bir sayfa geri ya da ileri gitmek için küçük okları görmek üzere sayfa
kutusunun üzerine gelin; slaytların da kendi kutusu var.
"""

["2026-09-30-2019-folder-icon-colours"]
title = "Renkli klasör simgeleri"
text = """
Klasör bölmesindeki simgeler artık her klasörün ne tuttuğunu söyleyen
renklere sahip: Okunmamış mavi, Yıldızlı sarı, Önemli kehribar, Gönderilen
yeşil, Spam kırmızı, Taslaklar mor ve Gelen Kutusu masaüstünüzün vurgu
renginde. Posta sayıları küçük, soluk balonlarda durur.
"""

["2026-09-30-2040-tabs-no-slide"]
title = "Daha hızlı gelen kutusu sekmeleri"
text = """
