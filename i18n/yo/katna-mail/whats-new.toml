"""

["2026-10-01-1112-left-bar-button"]
title = "Bọ́tìnnì ńlá kan, ìkájọ kan, lórí gbogbo ojú-ìwé"
text = """
Bọ́tìnnì ńlá lókè ọ̀pá òsì rí bákan náà ó sì wà ní ibi kan náà lórí gbogbo ojú-ìwé báyìí, ó sì ń ṣe iṣẹ́ ojú-ìwé náà: Kọ̀wé nínú Lẹ́tà àti Fáìlì, Ìṣẹ̀lẹ̀ tuntun, Olùbásọ̀rọ̀ tuntun, Iṣẹ́ tuntun àti Àkọsílẹ̀ tuntun. Kíká ọ̀pá òsì jọ ń ká a jọ níbi gbogbo, nígbà tí ó bá sì wà ní kíká, bọ́tìnnì ojú-ìwé kọ̀ọ̀kan ń dúró lókè ọ̀pá ẹ̀gbẹ́. Lórí fóònù, òun ni bọ́tìnnì tó ń fò.
"""

["2026-10-01-1115-color-picker"]
title = "Olùyan àwọ̀ nínú olóòtú ètò àwọ̀"
text = """
