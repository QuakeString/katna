text = """
Fáìlì ń fi drive àkáǹtì Google kọ̀ọ̀kan hàn báyìí lábẹ́ Àwọn drive nínú ọ̀wọ̀n ẹ̀gbẹ́. Ṣí àwọn fódà rẹ̀, wá nínú rẹ̀, kí o sì ṣí fáìlì kan, so ó mọ́ lẹ́tà tàbí gbà á sílẹ̀ níbẹ̀ gan-an. Ní ìgbà àkọ́kọ́, tẹ Gbà láàyè kí Katna lè ka drive náà.
"""

["2026-10-02-0515-rephrase-subject"]
title = "Sọ àkọlé lọ́nà míì"
text = """
