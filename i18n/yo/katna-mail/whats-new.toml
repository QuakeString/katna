"""

["2026-10-01-1130-contact-card-folds-folders"]
title = "Káàdì olùbásọ̀rọ̀ ń ṣe ààyè fúnra rẹ̀"
text = """
Nínú fèrèsé tó tóóró jù fún pánẹ́ẹ̀lì fódà àti káàdì olùbásọ̀rọ̀ ní ẹ̀gbẹ́ ara wọn, káàdì náà ń ká àwọn fódà jọ báyìí bí ó ṣe ń ṣí, wọ́n sì ń padà wá nígbà tí káàdì bá pa dé. Àwọn fódà tí o ká jọ fúnra rẹ ń wà ní kíká.
