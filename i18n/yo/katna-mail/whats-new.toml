title = "Àwọn àpótí ìbánisọ̀rọ̀ tó farabalẹ̀ jù"
text = """
Àwọn àpótí ìbánisọ̀rọ̀ oníkùrukùru le ju àwọn mẹ́nù lọ, nítorí náà àkójọ lẹ́tà tó kún kò hàn láti inú wọn mọ́. Nípa Katna, Kí ló jẹ́ tuntun àti Ṣàyẹ̀wò àwọn ìmúdójúìwọ̀n ń ṣí láìmú fèrèsé lẹ́yìn wọn ṣókùnkùn.
