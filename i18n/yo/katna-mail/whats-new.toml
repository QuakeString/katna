"""

["2026-10-01-1240-contact-card-close"]
title = "Kó káàdì olùbásọ̀rọ̀ kúrò, wo ẹni tó wà nínú ìtàkùrọ̀sọ"
text = """
Káàdì olùbásọ̀rọ̀ lẹ́gbẹ̀ẹ́ ìjíròrò ní ✕ ní igun rẹ̀, títẹ àwòrán tàbí àdírẹ́sì ẹni kan náà lẹ́ẹ̀kan sí i sì ń kó káàdì náà kúrò. Nínú ìwòye ìtàkùrọ̀sọ, títẹ àkọlé ń ṣe àkójọ gbogbo ẹni tó wà nínú ìtàkùrọ̀sọ pẹ̀lú àdírẹ́sì wọn àti iye lẹ́tà tí ẹnìkọ̀ọ̀kan fi ránṣẹ́.
"""

["2026-10-01-1241-two-blur-switches"]
