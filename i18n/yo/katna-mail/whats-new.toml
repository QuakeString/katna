"""

["2026-10-02-0236-chat-on-phones"]
title = "Ìtàkùrọ̀sọ bá fóònù mu"
text = """
Nínú fèrèsé tó tóbi bí fóònù, ìtàkùrọ̀sọ (Ètò > Àdánwò) ń wà ní ìlà àkọlé kan pẹ̀lú Padà àti ⋮, àwọn àpò ọ̀rọ̀ rẹ̀ sì ń lo púpọ̀ sí i nínú ìbú. Di àpò ọ̀rọ̀ kan mú láti mú mẹ́nù rẹ̀ wá láti ìsàlẹ̀, tẹ orúkọ tàbí àwòrán kan láti rí káàdì ẹni náà lọ́nà kan náà. Gbá èyíkéyìí sísàlẹ̀ tàbí tẹ ìta láti kó o kúrò.
