"""

["2026-09-30-1850-windows-frame-and-blur"]
title = "Férémù àti ìṣúmọ́ Katna lórí Windows"
text = """
Lórí Windows, Katna Mail ń ṣí nínú ojú-ìbojú báyìí, ní títóbi jùlọ nígbà tí ojú-ìbojú bá kéré. Ètò > Àdánwò lè mú ohun tó wà lẹ́yìn fèrèsé ṣú, férémù Katna fúnra rẹ̀ sì ń sọ ọ̀pá òkè di ọ̀pá àkọlé nígbà tó kàn tí o bá ṣí Katna Mail.
"""

["2026-09-30-1851-dark-depth"]
title = "Ó rọrùn láti rí nínú àwọ̀ òkùnkùn"
text = """
Nínú àwọ̀ òkùnkùn, àwọn nǹkan tó ń fò lórí àkójọ lẹ́tà ti mọ́lẹ̀ díẹ̀ sí i báyìí pẹ̀lú ẹ̀gbẹ́ ìmọ́lẹ̀ fẹ́ẹ́rẹ́, nítorí òjìji kì í fi bẹ́ẹ̀ hàn lórí ẹ̀yìn dúdú. Bọ́tìnnì Padà sí òkè, àwọn mẹ́nù, fèrèsé Kọ̀wé àti àwọn àpótí ìbánisọ̀rọ̀ ń hàn kedere. Àwọ̀ ìmọ́lẹ̀ rí bí ti tẹ́lẹ̀.
"""

["2026-09-30-1911-files-scrollbar"]
title = "Ọ̀pá yíyí lórí ojú-ìwé Fáìlì"
text = """
Nígbà tí fáìlì bá pọ̀ ju ohun tí ó gbà lọ, ọ̀pá yíyí tín-ínrín máa ń hàn ní apá ọ̀tún nígbà tí o bá ń yí lọ tàbí nígbà tí ìtọ́ka bá wà lórí àwọn fáìlì, lẹ́yìn náà á pòórá. Fà á láti la àwọn fáìlì kọjá kíákíá, tàbí tẹ òkè tàbí ìsàlẹ̀ rẹ̀ láti fò síbẹ̀.
"""

["2026-09-30-1919-tabs-keep-open-mail"]
title = "Yíyí táàbù padà ń pa lẹ́tà tó ṣí mọ́"
text = """
Nígbà tí Pánẹ́ẹ̀lì kíkà bá wà lẹ́gbẹ̀ẹ́ àkójọ, yíyan táàbù àpótí-ìwọlé mìíràn kò pa lẹ́tà tí o ń kà dé mọ́; àkójọ ń yí padà, lẹ́tà náà sì ń wà ní ṣíṣí.
"""

["2026-09-30-1925-inbox-tabs-centred"]
title = "Àwọn táàbù àpótí-ìwọlé ní àárín"
text = """
Àwọn táàbù àpótí-ìwọlé wà ní àárín ìlà òkè àkójọ báyìí, wọ́n sì ń yẹ̀ sí ẹ̀gbẹ́ kìkì bí àwọn bọ́tìnnì rẹ̀ ṣe nílò tó.
"""

["2026-09-30-1945-page-box-arrow-keys"]
title = "Àwọn bọ́tìnnì ọfà nínú àpótí ojú-ìwé"
text = """
Nínú PDF kan, tẹ nọ́mbà ojú-ìwé kí o sì tẹ Òkè tàbí Ìsàlẹ̀ láti padà sí ojú-ìwé tó ṣáájú tàbí lọ sí èyí tó kàn. Di bọ́tìnnì náà mú láti yí àwọn ojú-ìwé kọjá kíákíá.
"""

["2026-09-30-1952-phone-bar-labels"]
title = "Orúkọ áàpù lórí fóònù ń tẹ̀lé ètò rẹ"
text = """
Nígbà tí orúkọ áàpù bá wà ní pípa nínú Ètò, ọ̀pá tó wà nísàlẹ̀ fèrèsé tó tóbi bí fóònù ń fi àwọn àmì nìkan hàn báyìí, ní àárín, bí ọ̀pá ẹ̀gbẹ́ ṣe ń ṣe.
"""

["2026-09-30-1955-account-menu-icons"]
title = "Ètò àti èdè nínú mẹ́nù àkáǹtì"
text = """
Mẹ́nù tó wà lábẹ́ àwòrán àkáǹtì rẹ ń ṣí pẹ̀lú ìlà àwọn àmì báyìí: ṣí Ètò tàbí yí èdè padà. Àsíá èdè ti kúrò lórí ọ̀pá òkè láti fi ààyè sílẹ̀.
"""

["2026-09-30-2001-phone-tabs-fold"]
title = "Gbogbo táàbù àpótí-ìwọlé ń wà ní àrọ́wọ́tó"
text = """
Nígbà tí fèrèsé bá tóóró, àwọn táàbù àpótí-ìwọlé máa ń ká jọ díẹ̀díẹ̀ dípò kí wọ́n fara pamọ́: orúkọ máa ń di àmì tó tóbi jù, lẹ́yìn náà iye náà á yẹ̀ sí ẹ̀gbẹ́. Lórí fóònù, àwọn táàbù ń tàn kálẹ̀ lórí gbogbo ọ̀pá, ó rọrùn láti tẹ̀, pẹ̀lú Síwájú sí i ní òpin ọ̀pá kan náà.
"""

["2026-09-30-2012-fit-and-page-arrows"]
title = "Bá a mu, ọfà ojú-ìwé àti púpọ̀ sí i nínú olùwò"
text = """
Olùwò àfikún ní bọ́tìnnì Bá a mu: ojú-ìwé PDF máa ń bá gíga fèrèsé mu, àwòrán máa ń bá fèrèsé mu, ìwé, sílááìdì àti spreadsheet sì máa ń bá ìbú rẹ̀ mu. Àwọn àwòrán tún ní Ìwọ̀n gidi, a sì lè yí wọn. Tọ́ka sí àpótí ojú-ìwé fún àwọn ọfà kékeré láti padà tàbí lọ síwájú ní ojú-ìwé kan, àwọn sílááìdì sì ní àpótí tiwọn.
"""

["2026-09-30-2019-folder-icon-colours"]
title = "Àwọn àmì fódà aláwọ̀"
text = """
Àwọn àmì inú pánẹ́ẹ̀lì fódà ní àwọ̀ tó ń sọ ohun tí fódà kọ̀ọ̀kan ní báyìí: Àìkà jẹ́ búlúù, Oní ìràwọ̀ jẹ́ yẹ́lò, Pàtàkì jẹ́ ọsàn, Tí a fi ránṣẹ́ jẹ́ ewé, Àwúrúju jẹ́ pupa, Àwọn àkọ̀pamọ́ jẹ́ àlùkò, Àpótí-ìwọlé sì jẹ́ àwọ̀ àfihàn déskítọ́ọ̀pù rẹ. Iye lẹ́tà wà nínú àmì yíká kékeré, fẹ́ẹ́rẹ́.
"""

["2026-09-30-2040-tabs-no-slide"]
title = "Àwọn táàbù àpótí-ìwọlé tó yára jù"
text = """
Títẹ táàbù àpótí-ìwọlé kan ń tàn ìmọ́lẹ̀ sí i lẹ́sẹ̀kẹsẹ̀ báyìí, pẹ̀lú ìgbì títẹ̀ nìkan, dípò kí ìtànmọ́lẹ̀ yọ̀ kọjá àwọn táàbù mìíràn.
"""

["2026-10-01-0145-files-tidy"]
title = "Ojú-ìwé Fáìlì tó wà ní mímọ́ jù"
text = """
Iye tó wà lẹ́gbẹ̀ẹ́ irú fáìlì kọ̀ọ̀kan àti àkáǹtì kọ̀ọ̀kan wà nínú àmì yíká kékeré kan náà bí iye fódà nínú Lẹ́tà báyìí. Ìlà tó wà lábẹ́ àkọlé ojú-ìwé náà àti àwọn ìlà fáìlì tún ń bẹ̀rẹ̀ tí wọ́n sì ń parí ní ẹ̀gbẹ́ kan náà.
"""

["2026-10-01-0147-today-marker-fits"]
title = "Ọjọ́ òní bá àmì rẹ̀ mu"
text = """
Nínú ìwòye Oṣù ti Kàlẹ́ńdà, àmì òní ń gba gbogbo ọjọ́ náà báyìí. Ní ọjọ́ 1, ó máa ń di àmì yíká ní àyíká "01 Oct" dípò òbìrí kékeré tí orúkọ náà ń ṣàn jáde kúrò nínú rẹ̀.
"""

["2026-10-01-0208-tab-counts-stay"]
title = "Iye táàbù ń dúró sí ipò"
text = """
Ṣíṣí táàbù àpótí-ìwọlé kan kò mú ọ̀pá táàbù fò mọ́. Táàbù tó ṣí ń pa iye lẹ́tà tuntun rẹ̀ mọ́, tí ó ń rẹ̀ díẹ̀díẹ̀ di eérú, iye náà sì ń ká lọ díẹ̀díẹ̀ ní kété tí o bá ti ka gbogbo ohun tó wà nínú táàbù náà.
"""

["2026-10-01-0225-files-keyboard"]
title = "Lọ láàrin àwọn fáìlì rẹ pẹ̀lú kíbọ́ọ̀dù"
text = """
Lórí ojú-ìwé Fáìlì, àwọn bọ́tìnnì ọfà ń gbé ọ láàrin àwọn fáìlì báyìí, Home àti End ń lọ sí àkọ́kọ́ àti ìkẹyìn, Enter sì ń ṣí ọ̀kan. Nínú olùwò tí a ṣí láti ibẹ̀, àwọn ọfà ń lọ sí fáìlì tó kàn lójú-ìwé náà, lẹ́tà yòówù tí ó bá wá; Shift pẹ̀lú ọfà ń dúró pẹ̀lú àwọn àfikún lẹ́tà kan náà.
"""

["2026-10-01-0254-files-dates"]
title = "Yan àwọn ọjọ́ lórí ojú-ìwé Fáìlì"
text = """
Àmì àkókò lórí ojú-ìwé Fáìlì ń ṣí kàlẹ́ńdà oṣù méjì báyìí pẹ̀lú àṣàyàn kíákíá bí Ọ̀sẹ̀ tó kọjá àti Oṣù yìí. Tẹ ọjọ́ kan, tàbí fà á láti ọjọ́ kan sí òmíràn, àwọn fáìlì á sì tẹ̀lé bí o ṣe ń fà á. Lẹ́yìn náà yí kẹ̀kẹ́ màúsì lórí àmì náà láti gbé gígùn àkókò kan náà sẹ́yìn tàbí síwájú.
"""

["2026-10-01-0256-color-schemes"]
title = "Ètò àwọ̀ àti àwọ̀ àfihàn"
text = """
Ètò > Ìrísí ní Ipò, Àwọ̀ àti Àwọ̀ àfihàn gẹ́gẹ́ bí àṣàyàn ọ̀tọ̀ọ̀tọ̀ báyìí. Yan ìmọ́lẹ̀ tàbí òkùnkùn, lẹ́yìn náà èyíkéyìí nínú ètò àwọ̀ 14, bí Clear, Nord, Solarized tàbí Catppuccin, tàbí pa ti déskítọ́ọ̀pù rẹ mọ́. Ọ̀kọ̀ọ̀kan ń ṣiṣẹ́ ní ìmọ́lẹ̀ àti òkùnkùn, àwọ̀ àfihàn èyíkéyìí sì lè wà lórí rẹ̀.
"""

["2026-10-01-0310-badge-counts-what-notifies"]
title = "Iye lórí ọ̀pá iṣẹ́ bá ìfitónilétí rẹ mu"
text = """
Iye àìkà lórí ọ̀pá iṣẹ́ àti àtẹ ń ka lẹ́tà kan náà tí ó ń fi tó ọ létí báyìí: táàbù Àkọ́kọ́ ti Àpótí-ìwọlé rẹ. Ìpolówó, Àwùjọ, Ìmúdójúìwọ̀n àti Àpérò kò fi kún un mọ́.
"""

["2026-10-01-0312-quiet-selected-row"]
title = "Fódà tó ṣí tó farabalẹ̀ jù"
text = """
Fódà tó ṣí nínú Lẹ́tà, àti ìwòye tó ṣí nínú Olùbásọ̀rọ̀, Iṣẹ́, Àkọsílẹ̀ àti Fáìlì, ni a ń sàmì sí ní eérú rírọ̀ báyìí dípò àwọ̀ àfihàn, kí Kọ̀wé àti ọ̀pá áàpù lè yọ jáde, kí àwọn àmì fódà sì pa àwọ̀ tiwọn mọ́.
"""

["2026-10-01-0315-desktop-schemes"]
title = "Ètò àwọ̀ déskítọ́ọ̀pù rẹ"
text = """
Ètò > Ìrísí > Àwọ̀ tún ń ṣe àkójọ ètò àwọ̀ déskítọ́ọ̀pù rẹ: gbogbo ètò àwọ̀ tí a fi sórí KDE Plasma, àti lórí Windows àwọn àwọ̀ rẹ̀ àti àwọn àkòrí Contrast. Ètò ń ṣiṣẹ́ ní ìmọ́lẹ̀ àti òkùnkùn lórí KDE náà báyìí, ní lílo alábàáṣepọ̀ ìmọ́lẹ̀ tàbí òkùnkùn ti ètò rẹ, Katna sì ń tẹ̀lé àwọ̀ àfihàn Windows.
"""

["2026-10-01-0329-mute-folders"]
title = "Pa ohùn fódà, táàbù tàbí àkáǹtì kan"
text = """
Agogo tó wà lórí àkójọ ń pa ohùn fódà tó ṣí tàbí táàbù Àpótí-ìwọlé fún wákàtí kan, títí di òwúrọ̀ ọ̀la, tàbí títí tí o fi tún un tàn. Tẹ fódà tàbí àkáǹtì kan ní apá ọ̀tún fún bákan náà. Ètò > Ìfitónilétí ń fi àwọn fódà tó ń fi tó ọ létí hàn, àwọn tó ń kà lórí ọ̀pá iṣẹ́, àti gbogbo ohun tí a pa ohùn rẹ̀.
"""

["2026-10-01-0335-tray-style"]
title = "Àmì-àwòrán àtẹ ní àwọ̀ tàbí àwọ̀ kan"
text = """
Ètò > Gbogbogbò > Déskítọ́ọ̀pù > Àmì-àwòrán àtẹ ní àwọ̀ ń yan àwọn àwọ̀ Katna tàbí àwọ̀ kan bí àwọn àmì mìíràn lórí pánẹ́ẹ̀lì. Àwọ̀ kan ń wà ní àwọ̀ kan pẹ̀lú lẹ́tà àìkà, iye àìkà sì máa ń jẹ́ pupa nígbà gbogbo. Lórí Linux, àmì-àwòrán àtẹ jẹ́ àwọ̀ kan ní àtilẹ̀wá; lórí Windows ó jẹ́ aláwọ̀.
"""

["2026-10-01-0354-mute-conversations"]
title = "Pa ohùn ìjíròrò tàbí olùfiránṣẹ́ kan"
text = """
Agogo tó wà lórí ìjíròrò tó ṣí ń pa ohùn rẹ̀: èsì tuntun kò ní fi tó ọ létí mọ́, wọn kò sì ní fi kún iye ọ̀pá iṣẹ́, agogo tí a fà ìlà kọjá sì ń sàmì sí i nínú àkójọ. Tẹ ìjíròrò kan ní apá ọ̀tún fún Pa ohùn ìjíròrò tàbí Pa ohùn olùfiránṣẹ́, tàbí tẹ M.
"""

["2026-10-01-0410-your-color-schemes"]
title = "Ṣẹ̀dá ètò àwọ̀ tìrẹ"
text = """
Ètò > Ìrísí > Àwọ̀ > Ṣe é bí o ṣe fẹ́ ń da ètò tí o ń lò kọ sínú olóòtú kan: yí èyíkéyìí nínú àwọ̀ mẹ́jọ rẹ̀ padà ní apá ìmọ́lẹ̀ àti apá òkùnkùn, wo fèrèsé lẹ́tà nínú wọn, Katna á sì sọ ohun tí yóò ṣòro láti kà fún ọ. Gbé wọlé ń gba fáìlì ètò àwọ̀ Katna tàbí KDE, títẹ ètò rẹ ní apá ọ̀tún sì ń ṣàtúnṣe rẹ̀, ń ṣe ẹ̀dà rẹ̀, ń gbé e jáde tàbí ń pa á rẹ́.
"""

["2026-10-01-0527-calendar-opens-on-week"]
title = "Kàlẹ́ńdà ń ṣí ní Ọ̀sẹ̀"
text = """
Katna Calendar ń ṣí ní ìwòye Ọ̀sẹ̀ lẹ́ẹ̀kan sí i, pẹ̀lú àwọn ọjọ́ tó ń bọ̀ ní wákàtí. Oṣù, Ọjọ́, Ọdún àti àwọn yòókù wà ní títẹ̀ kan ṣoṣo lórí ọ̀pá òkè.
"""

["2026-10-01-0552-lighter-count-on-open-row"]
title = "Iye ń yọ jáde lórí fódà tó ṣí"
text = """
Iye lẹ́gbẹ̀ẹ́ fódà tó ṣí nínú Lẹ́tà, àti lẹ́gbẹ̀ẹ́ irú tó ṣí nínú Fáìlì, wà nínú àmì yíká tó mọ́lẹ̀ ju eérú ìlà náà lọ báyìí, nítorí náà kò rì sínú rẹ̀ mọ́, ní ìmọ́lẹ̀ àti òkùnkùn.
"""

["2026-10-01-0652-files-leave-out-small-pictures"]
title = "Fáìlì ń yọ àwọn àmì ìbuwọ́lù sílẹ̀"
text = """
Ojú-ìwé Fáìlì kò kún fún àwọn àmì ìdánimọ̀ kékeré àti àwọn àmì tó ń wá nínú ìbuwọ́lù ímeèlì mọ́: àwọn àwòrán tí kò tó 12 KB, tàbí tí kò tó 100 píksẹ́ẹ̀lì ní ìbú tàbí gíga, ń wà lábẹ́ lẹ́tà wọn. Yí àwọn ààlà méjèèjì padà, tàbí fi gbogbo àwòrán hàn, nínú Ètò > Àwọn áàpù àtilẹ̀wá > Ojú-ìwé Fáìlì.
"""

["2026-10-01-0700-mute-from-contact"]
title = "Pa ohùn olùfiránṣẹ́ láti káàdì olùbásọ̀rọ̀ rẹ̀"
text = """
Káàdì olùbásọ̀rọ̀ lẹ́gbẹ̀ẹ́ lẹ́tà kan ní agogo ní àkọ́kọ́ láàrin àwọn bọ́tìnnì rẹ̀: ó ń pa ohùn gbogbo ohun tó ń wá láti ọ̀dọ̀ olùfiránṣẹ́ náà, agogo tí a fà ìlà kọjá lẹ́yìn orúkọ wọn sì ń fi hàn. Tẹ ẹ́ lẹ́ẹ̀kan sí i láti gbọ́ láti ọ̀dọ̀ wọn.
"""

["2026-10-01-0803-select-hover-fits"]
title = "Bọ́tìnnì yíyan tó wà ní mímọ́ jù"
text = """
Ìtànmọ́lẹ̀ lẹ́yìn àpótí àmì yíyan lókè àkójọ lẹ́tà ga tó àwọn bọ́tìnnì lẹ́gbẹ̀ẹ́ rẹ̀ báyìí, ó jìnnà sí ẹ̀gbẹ́ káàdì bí ó ṣe jìnnà sí òkè rẹ̀, àwọn igun rẹ̀ sì ń tẹ̀lé igun káàdì náà.
"""

["2026-10-01-0807-files-leave-out-signature-pictures"]
title = "Fáìlì ń yọ àwọn àwòrán ìbuwọ́lù ńlá sílẹ̀ pẹ̀lú"
text = """
Àwòrán tí ẹnìkan ń fi ránṣẹ́ nínú ìjíròrò mẹ́ta tàbí jù bẹ́ẹ̀ lọ, bí àsíá tàbí fọ́tò nínú ìbuwọ́lù wọn, kò hàn lórí ojú-ìwé Fáìlì mọ́, bẹ́ẹ̀ ni àwọn àmì nẹ́tíwọ́ọ̀kì àwùjọ, bí wọ́n ti wù kí wọ́n tóbi tó. Wọ́n ṣì ń hàn lábẹ́ lẹ́tà wọn, pípa "Fi àwọn àwòrán kékeré sílẹ̀" sì ń mú gbogbo wọn padà.
"""

["2026-10-01-0830-muted-contact-mark"]
title = "Wo ẹni tí a pa ohùn rẹ̀"
text = """
Agogo tí a fà ìlà kọjá ń tẹ̀lé orúkọ olùfiránṣẹ́ tí a pa ohùn rẹ̀ báyìí níbikíbi tí wọ́n bá ti hàn: àkójọ lẹ́tà, lẹ́tà tó ṣí, Olùbásọ̀rọ̀, àwọn àpótí Sí àti Ẹ̀dà àti àwọn àbá wọn, ojú-ìwé Fáìlì, àwọn àlejò ìṣẹ̀lẹ̀ àti ìròyìn Ìgbòkègbodò. Kò sí ìyàlẹ́nu mọ́ nípa ìdí tí lẹ́tà wọn fi dákẹ́.
"""

["2026-10-01-0839-sounds"]
title = "Ohùn fún lẹ́tà tuntun, ìránnilétí àti fífiránṣẹ́"
text = """
Ètò > Ìfitónilétí ní apá Ohùn: lẹ́tà tuntun, ìránnilétí, lẹ́tà tó padà sí àpótí-ìwọlé, lẹ́tà tí a fi ránṣẹ́ àti lẹ́tà tí a kò fi ránṣẹ́ ọ̀kọ̀ọ̀kan ń yan ohùn láti déskítọ́ọ̀pù rẹ, ń dún un pẹ̀lú bọ́tìnnì lẹ́gbẹ̀ẹ́ rẹ̀, tàbí ń pa á. Àwọn ohùn ń dún lórí KDE Plasma náà báyìí, wọ́n sì ń dákẹ́ fún lẹ́tà tí a pa ohùn rẹ̀ àti nígbà Má ṣe dí mi lọ́wọ́.
"""

["2026-10-01-0925-chat-view"]
title = "Ka àwọn ìjíròrò bí ìtàkùrọ̀sọ (àdánwò)"
text = """
Tan Ètò > Àdánwò > Ìjíròrò bí ìtàkùrọ̀sọ, lẹ́tà láàrin àwọn ènìyàn á sì kà bí ìtàkùrọ̀sọ ẹgbẹ́: àpò ọ̀rọ̀ kan fún lẹ́tà kọ̀ọ̀kan pẹ̀lú ohun tí a kọ nìkan, tìrẹ ní apá ọ̀tún, àwòrán àti fáìlì gẹ́gẹ́ bí mídíà ìtàkùrọ̀sọ. Lẹ́tà tí a fà yọ àti ìbuwọ́lù ń dúró lẹ́yìn ··· nínú àpò ọ̀rọ̀ kọ̀ọ̀kan, títẹ orúkọ kan sì ń fi káàdì wọn hàn pẹ̀lú ìbuwọ́lù wọn. Fèsì láti inú àpótí nísàlẹ̀, pẹ̀lú Ctrl+Enter, ọ̀pá ìgúnrege lẹ́yìn Aa àti pínnì ìwé fún fáìlì, àwòṣe àti ìbuwọ́lù. Àwọn ìwé ìròyìn ń pa ìwòye àtẹ̀yìnwá mọ́, ìyípadà Ìtàkùrọ̀sọ | Lẹ́tà sì ń yí ìjíròrò èyíkéyìí sí ọ̀nà méjèèjì.
"""

["2026-10-01-0946-forward-keeps-files"]
title = "Fífi ránṣẹ́ síwájú ń pa àwọn fáìlì mọ́"
text = """
Fífi ìfiránṣẹ́ kan ránṣẹ́ síwájú ń mú àwọn àfikún rẹ̀ wá pẹ̀lú báyìí, wọ́n ń hàn lábẹ́ ìfiránṣẹ́ náà kí o lè yọ èyíkéyìí kúrò ṣáájú fífiránṣẹ́. Yíyí ìfiránṣẹ́-síwájú padà sí èsì ń yọ wọ́n kúrò lẹ́ẹ̀kan sí i.
"""

["2026-10-01-1009-forward-a-file"]
title = "Fi fáìlì nìkan ránṣẹ́ síwájú"
text = """
Olùwò àfikún ní bọ́tìnnì Fi ránṣẹ́ síwájú lórí ọ̀pá òkè rẹ̀: ó ń bẹ̀rẹ̀ lẹ́tà tuntun pẹ̀lú fáìlì náà nìkan ní àfikún, láìsí lẹ́tà tí ó bá wá. Àwọn fáìlì tí kò ní àyẹ̀wò ṣáájú ń pèsè Fi ránṣẹ́ síwájú pẹ̀lú, bẹ́ẹ̀ sì ni àwọn káàdì àfikún lábẹ́ lẹ́tà tó ṣí, lẹ́gbẹ̀ẹ́ Fi pamọ́.
"""

["2026-10-01-1039-rephrase-with-ai"]
title = "Sọ ọ́ lọ́nà míì pẹ̀lú AI"
text = """
Yan ọ̀rọ̀ nínú ìfiránṣẹ́ kan kí o sì tẹ àmì ìtànná lẹ́gbẹ̀ẹ́ rẹ̀, tàbí Ctrl+J, kí a tún un kọ ní kedere jù, ní kúkúrú jù, ní ọ̀rẹ́ jù tàbí ní ìlànà jù, lẹ́yìn náà Rọ́pò. Katna AI jẹ́ ọ̀fẹ́ fún ọjọ́ 30, tàbí lo kọ́kọ́rọ́ tìrẹ láti Google Gemini, OpenAI, Claude, Mistral, DeepSeek, OpenRouter tàbí àwòṣe kan lórí kọ̀ǹpútà yìí. AI tún lè parí àwọn gbólóhùn rẹ ní eérú; tàn án nínú Ètò > Kíkọ̀wé.
"""

["2026-10-01-1043-header-details-selectable"]
title = "Da ọ̀rọ̀ kọ láti inú àlàyé lẹ́tà kan"
text = """
