"""

["2026-10-02-0559-draft-saved-signature-tag"]
title = "Àwọn àkọ̀pamọ́ ń fi ara wọn pamọ́ bí o ṣe ń kọ̀wé"
text = """
Ìfiránṣẹ́ tí o ń kọ ń fi ara rẹ̀ pamọ́ sí Àwọn àkọ̀pamọ́ ní ìṣẹ́jú-àáyá díẹ̀ díẹ̀ báyìí, "A ti fi àkọ̀pamọ́ pamọ́" sì ń hàn jẹ́jẹ́ lẹ́gbẹ̀ẹ́ àkọlé rẹ̀. Àmì fẹ́ẹ́rẹ́ kan lẹ́gbẹ̀ẹ́ ìbuwọ́lù rẹ ń dárúkọ rẹ̀; tẹ ẹ́ láti yan òmíràn. Igun fèrèsé Kọ̀wé tún bá káàdì lẹ́gbẹ̀ẹ́ rẹ̀ mu.
"""

["2026-10-02-0654-attach-from-drive"]
title = "So fáìlì mọ́ láti Google Drive"
text = """
Pínnì ìwé Kọ̀wé ń ṣí olùyan Fáìlì báyìí, èyí kan náà bí Láti Fáìlì ti ìtàkùrọ̀sọ, pẹ̀lú Google Drive rẹ lẹ́gbẹ̀ẹ́ àwọn fáìlì lẹ́tà rẹ àti Kọ̀ǹpútà yìí… fún ohunkóhun mìíràn. Àwọn fáìlì tó bá ààyè mu ń lọ nínú lẹ́tà; àwọn fáìlì ńlá àti Google Docs ń lọ bí ìjápọ̀, tí a pín pẹ̀lú àwọn olùgbà nígbà tí o bá fi ránṣẹ́.
"""

["2026-10-02-0734-peek-and-reply-in-notifications"]
title = "Yọjú wò kí o sì fèsì láti inú ìfitónilétí"
text = """
Ìfitónilétí lẹ́tà tuntun ní Yọjú wò ó báyìí, tó ń fi lẹ́tà náà fúnra rẹ̀ hàn nínú ìfitónilétí kan náà, àti Fèsì, níbi tí o ti ń tẹ ìdáhùn rẹ níbẹ̀ gan-an tí o sì tẹ Fi ránṣẹ́. Ó ń lọ láti àkáǹtì tí lẹ́tà náà dé sí, lẹ́yìn àkókò Dá fífiránṣẹ́ padà rẹ; Dá padà ń ṣí i nínú Katna Mail láti máa kọ ọ́ lọ. Lórí Linux, lẹ́tà tuntun tún ní ohùn agogo tirẹ̀ tó ròkè jù; yan òmíràn nínú Ètò > Ìfitónilétí.
"""

["2026-10-02-0735-drive-viewer-opens-at-once"]
title = "Àwọn fáìlì drive ń ṣí lẹ́sẹ̀kẹsẹ̀"
text = """
