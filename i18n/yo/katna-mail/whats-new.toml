["2026-10-02-0210-conversation-summaries"]
title = "Ṣàkópọ̀ ìjíròrò kan"
text = """
Tẹ ìjíròrò kan ní apá ọ̀tún kí o sì yan Ṣe àkópọ̀, tàbí tẹ Shift+S, fún káàdì lẹ́gbẹ̀ẹ́ rẹ̀ tó ń sọ ohun tí ó jẹ mọ́, ohun tí a ti yanjú àti ohun tó ń dúró dè ọ́, láìṣí i tàbí sàmì sí i bí èyí tí a ti kà. Nínú ìjíròrò tó ṣí, àmì ìtànná lókè rẹ̀ ń fi àkópọ̀ sí abẹ́ àkọlé; nínú ìwòye ìtàkùrọ̀sọ ó wà nínú ìlà kan lábẹ́ àkọlé. Kókó kọ̀ọ̀kan ń dárúkọ lẹ́tà tí ó ti wá, nígbà tí lẹ́tà tuntun bá sì ti dé láti ìgbà tí o kà á kẹ́yìn, àkópọ̀ náà ń sọ nípa ìyẹn nìkan. Ó nílò ìrànlọ́wọ́ kíkọ̀wé pẹ̀lú AI ní títàn nínú Ètò > Kíkọ̀wé.
"""

["2026-10-02-0215-system-colors-follow-mode"]
title = "Ìmọ́lẹ̀ àti Òkùnkùn ń ṣiṣẹ́ pẹ̀lú àwọ̀ Ètò"
text = """
Nígbà tí Àwọ̀ bá jẹ́ Ètò, tí ètò àwọ̀ déskítọ́ọ̀pù sì jẹ́ òkùnkùn nìkan (tàbí ìmọ́lẹ̀ nìkan), Ètò > Ìrísí > Ipò ń yí Katna padà láàrin ìmọ́lẹ̀ àti òkùnkùn lẹ́ẹ̀kan sí i: apá kejì ń lo àwọn àwọ̀ Katna fúnra rẹ̀ nínú àwọ̀ àfihàn déskítọ́ọ̀pù rẹ.
"""

["2026-10-02-0218-signature-details-on-card"]
title = "Àlàyé ìbuwọ́lù ní ibi tí wọ́n yẹ"
text = """
Káàdì ènìyàn kan kò fi ìbuwọ́lù wọn hàn bí ìdìpọ̀ kan mọ́. Àwọn àlàyé rẹ̀ ń lọ sí ibi tí wọ́n yẹ: gbogbo nọ́mbà fóònù, tí a sàmì sí bí alágbèéká, tààrà tàbí fáàsì, nínú àlàyé olùbásọ̀rọ̀, àti ẹgbẹ́ ilé-iṣẹ́ náà, àwọn ọ́fíìsì, ojúlé wẹ́ẹ̀bù àti àwọn ojú-ìwé rẹ̀ nínú apá Ilé-iṣẹ́. Àwọn ojú-ìwé àwùjọ ń hàn bí àwọn àmì kékeré aláwọ̀ kan, a sì ń yọ àwọn àwòrán, àsíá àti ọ̀rọ̀ ìsàlẹ̀ sílẹ̀.
"""

["2026-10-02-0225-chat-subject-line"]
title = "Wo ìgbà tí àkọlé ìtàkùrọ̀sọ bá yí padà"
text = """
