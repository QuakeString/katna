"""

["2026-10-02-0525-quieter-compose"]
title = "Fèrèsé Kọ̀wé tó farabalẹ̀ jù"
text = """
Fèrèsé Ìfiránṣẹ́ tuntun ń fò pẹ̀lú àyè tó dọ́gba láti ẹ̀gbẹ́ fèrèsé. Sí, Ẹ̀dà, Ẹ̀dà àṣírí àti Láti wà papọ̀ láìsí ìlà láàrin wọn, àwọn olùgbà jẹ́ àmì rírọ̀ tí a kún, Láti sì jẹ́ ìlà jẹ́jẹ́ kan. Ìfi-àṣírí-pamọ́, ìbuwọ́lù oní-nọ́ńbà, títọpa àti ìjẹ́rìí ń pín ẹgbẹ́ kékeré kan, àwọn irinṣẹ́ kíkọ̀wé sì wà lórí ọ̀pá rírọ̀ lẹ́gbẹ̀ẹ́ Fi ránṣẹ́.
"""

["2026-10-02-0553-upload-to-drive"]
