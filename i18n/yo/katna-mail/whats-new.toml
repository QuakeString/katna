Nígbà tí àwọn mẹ́nù oníkùrukùru bá wà ní títàn, káàdì Sọ ọ́ lọ́nà míì (Ctrl+J) ń ṣí ní òfo; àwọn àbá rẹ̀ ń hàn lórí dígí oníkùrukùru báyìí. Google Gemini ń lo gemini-3.5-flash-lite báyìí àyàfi bí o bá tẹ àwòṣe mìíràn, nítorí kọ́kọ́rọ́ Gemini tuntun kò lè lo 2.5 Flash-Lite mọ́, kọ́kọ́rọ́ tí kò tọ́ sì ń sọ bẹ́ẹ̀.
"""

["2026-10-01-1624-rephrase-button"]
