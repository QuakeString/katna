text = """
Nígbà tí àwọn mẹ́nù àti àpótí ìbánisọ̀rọ̀ oníkùrukùru bá wà ní títàn, àwọn àpótí ìbánisọ̀rọ̀ dà bí dígí oníkùrukùru pẹ̀lú: Ṣàfikún àkáǹtì lẹ́tà, Nípa Katna, Kí ló jẹ́ tuntun, ìmúdójúìwọ̀n, pínpín, àyẹ̀wò ṣáájú ìtẹ̀wé, àwọn àmì, ìbéèrè pípa rẹ́ àti yíyọ kúrò, káàdì ìbẹ̀rẹ̀ àkọ́kọ́ àti fèrèsé ìjápọ̀ ti Kọ̀wé.
