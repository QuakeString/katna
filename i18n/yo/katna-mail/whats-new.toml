text = """
Fèrèsé àwọn ìmúdójúìwọ̀n ń sọ àyípadà tó kẹ́yìn ti ẹ̀yà kọ̀ọ̀kan báyìí, ó sì ń sọ ibi tí ẹ̀dà rẹ ti wá
àti ìgbà tí Katna ṣàyẹ̀wò àwọn ìmúdójúìwọ̀n gbẹ̀yìn.
"""

["2026-09-29-0213-coffee-button-play"]
title = "Eré kékeré nínú Ra kọfí kan fún mi"
text = """
Gbé atọ́ka lé Ra kọfí kan fún mi nínú Nípa Katna: ó ń béèrè kọfí, tii, píìsà, lẹ́yìn náà kò fẹ́
nǹkan kan rárá, ó yọ̀ǹda fún omi, ó sì dúpẹ́ pẹ̀lú ìtànṣán díẹ̀. Ó ń ṣeré lẹ́ẹ̀kan ṣoṣo ní ìgbà
kọ̀ọ̀kan, ó sì dúró jẹ́ẹ́ nígbà tí a bá dín ìṣípòpadà kù.
"""

["2026-09-29-0215-update-checking-bar"]
title = "Fèrèsé ìmúdójúìwọ̀n tí ó túbọ̀ hàn kedere"
text = """
Ọ̀pá tí ń sáré yóò hàn nígbà tí Katna ń ṣàyẹ̀wò àwọn ìmúdójúìwọ̀n, ẹ̀yà tuntun yóò sì hàn gbangba
pẹ̀lú àwọ̀ tirẹ̀ lẹ́gbẹ̀ẹ́ èyí tí o ní.
"""

["2026-09-29-0231-keys-beside-the-list"]
title = "Àwọn kọ́kọ́rọ́ tó ń tẹ̀lé pánẹ́ẹ̀lì tí o wà"
text = """
Nígbà tí ìjíròrò bá wà lẹ́gbẹ̀ẹ́ àkójọ, ↑ àti ↓ ń rìn nínú àkójọ, wọ́n sì ń fi ìjíròrò kọ̀ọ̀kan hàn.
Tab tàbí Enter ń wọ inú ìjíròrò, níbi tí ↑ àti ↓ ti ń yí i; Esc tàbí Shift+Tab ń padà sí àkójọ. F6 ń
lọ láàrín àwọn pánẹ́ẹ̀lì, bí i nínú àwọn ohun èlò meeli mìíràn.
"""

["2026-09-29-0258-folders-slide-open"]
title = "Àwọn fódà ń yọ́ ṣí, wọ́n sì ń yọ́ tì"
text = """
Títẹ ọfà tó wà lẹ́gbẹ̀ẹ́ àkáǹtì tàbí fódà nínú pánẹ́ẹ̀lì fódà ń yọ́ ṣí tàbí tì ohun tó wà nínú rẹ̀
nísinsin yìí, àwọn fódà tó wà nísàlẹ̀ sì ń yọ́ lọ pẹ̀lú rẹ̀, dípò kí wọ́n fò.
"""

["2026-09-29-0301-keys-menus-dialogs"]
title = "Àwọn fódà, mẹ́nù àti àpótí ọ̀rọ̀ lórí kíbọ́ọ̀dù"
text = """
Shift+Tab tàbí F6 ń dé pánẹ́ẹ̀lì fódà, níbi tí ↑ àti ↓ ti ń ṣí fódà kọ̀ọ̀kan, Enter sì ń lọ sí meeli
rẹ̀. ↑ àti ↓ ń rìn nínú mẹ́nù kankan, Enter sì ń yàn. Shift+F10 tàbí kọ́kọ́rọ́ mẹ́nù ń ṣí mẹ́nù
ìtẹ̀ọ̀tún ti meeli tí a yàn. Àwọn àpótí ọ̀rọ̀ ń gba àwọn kọ́kọ́rọ́ nígbà tí wọ́n bá ṣí: Enter ń
dáhùn, Esc ń fagilé, Tab sì ń dúró nínú wọn. Nínú ìfiránṣẹ́ tuntun, Ctrl+Enter ń fi ránṣẹ́ láti pápá
kankan, Esc sì ń pa á, ó ń pa àkọ̀pamọ́ kan mọ́.
"""

["2026-09-29-0309-clock-tasks"]
title = "Àwọn iṣẹ́ nínú aago orí tábìlì rẹ"
text = """
Tẹ aago náà láti fi iṣẹ́ kún un àti láti fi àmì sí àwọn iṣẹ́ tí a ti parí. Lórí Plasma, tẹ aago
náà lọ́tùn-ún kí o sì yan Fi Àwọn Àṣàyàn Mìíràn Hàn láti yan Aago Dijítàlì Katna. Lórí GNOME,
káàdì Iṣẹ́ yóò hàn lábẹ́ kàlẹ́ńdà aago náà láti ìgbà tí o bá wọlé lẹ́ẹ̀kan sí i.
"""

["2026-09-29-0329-pages-by-keyboard"]
title = "Àwọn ojú-ìwé pẹ̀lú kọ́kọ́rọ́ àti láti pẹpẹ iṣẹ́"
text = """
Ctrl+1 sí Ctrl+5 ń yípadà láàárín Lẹ́tà, Kàlẹ́ńdà, Olùbásọ̀rọ̀, Iṣẹ́ àti Àkọsílẹ̀, bí ti
Outlook, mẹ́nù Lọ sì ń tò wọ́n pẹ̀lú. Tẹ Katna Mail lọ́tùn-ún lórí pẹpẹ iṣẹ́ láti ṣí Kàlẹ́ńdà
tàbí Olùbásọ̀rọ̀ lẹ́sẹ̀kẹsẹ̀.
"""

["2026-09-29-0412-tasks-page"]
title = "Katna Iṣẹ́"
text = """
Tẹ Ctrl+4 tàbí yan Iṣẹ́ ní ẹ̀gbẹ́ òsì: gbogbo àtòjọ ní ẹ̀gbẹ́ ara wọn bíi ti Google Tasks,
pẹ̀lú iṣẹ́ kékeré, ìràwọ̀, ọjọ́ ìparí, àtúnṣe àti àlàyé. Àwọn àtòjọ máa ń bá Google Tasks
àti Microsoft To Do ṣiṣẹ́ pọ̀, àwọn iṣẹ́ láti aago orí kọ̀ǹpútà sì máa hàn níbí pẹ̀lú.
"""

["2026-09-29-0352-contacts"]
title = "Àwọn olùbásọ̀rọ̀ rẹ, láti gbogbo àkọọ́lẹ̀"
text = """
Àwọn olùbásọ̀rọ̀ tó wà lórí ọwọ̀n òsì báyìí ń ṣàkójọ àwọn ènìyàn tí a fipamọ́ sí àwọn àkọọ́lẹ̀ Gmail àti Outlook rẹ àti lórí àwọn olupín CardDAV,
lẹ́ẹ̀kan ṣoṣo fún ẹnì kọ̀ọ̀kan bó tilẹ̀ jẹ́ pé àkọọ́lẹ̀ púpọ̀ ni ó fi wọ́n pamọ́, pẹ̀lú àwọn àmì, àwòrán àti àlàyé wọn.
Àwọn orúkọ àti àwòrán wọn tún ń hàn nínú meeli rẹ àti nínú ìmọ̀ràn àdírẹ́sì.
"""

["2026-09-29-0350-katna-notes"]
title = "Katna Àkọsílẹ̀"
text = """
Yan Àkọsílẹ̀ ní ẹ̀gbẹ́ láti ṣí Katna Àkọsílẹ̀, tí a ṣètò bíi Google Keep. Kọ àkọsílẹ̀ tàbí àtòjọ àyẹ̀wò, fún un ní àwọ̀, dè é mọ́ òkè, kí o sì ṣàmì sí àwọn nǹkan taara lórí pátákó.
A máa ń fi àkọsílẹ̀ pamọ́ bí o ṣe ń tẹ̀; àpótí ìwádìí máa ń rí wọn; Ibi ìpamọ́ àti Àpótí ìdọ̀tí máa ń gbé wọn kúrò lójú ọ̀nà, pẹ̀lú Dá padà.
"""

["2026-09-29-0412-notes-sync"]
title = "Àkọsílẹ̀ lórí gbogbo ẹ̀rọ"
text = """
Àkọsílẹ̀ báyìí wà nínú fóldà Àkọsílẹ̀ ti àkọọ́lẹ̀ ímeèlì rẹ, níbi tí Notes ti iPhone àti Mac ti ń tọ́jú tiwọn, nítorí náà wọ́n ń tẹ̀lé ọ lọ sórí àwọn ẹ̀rọ rẹ mìíràn, wọ́n sì ń padà wá láti ibẹ̀.
Orúkọ àkọọ́lẹ̀ tó wà lábẹ́ àkọsílẹ̀ fi ibi tí a tọ́jú rẹ̀ sí hàn; tẹ̀ ẹ́ láti gbé àkọsílẹ̀ náà lọ, tàbí kí o fi sílẹ̀ lórí kọ̀ǹpútà yìí nìkan.
"""

["2026-09-29-0451-add-mail-to-tasks"]
title = "Fi lẹ́tà kún Iṣẹ́"
text = """
Tẹ Shift+T, bíi ti Gmail, tàbí tẹ lẹ́tà lọ́tùn-ún kí o yan Fi kún Iṣẹ́.
Iṣẹ́ náà máa gba àkọlé lẹ́tà, àmì Lẹ́tà rẹ̀ nínú Iṣẹ́ sì máa ṣí lẹ́tà náà padà.
"""

["2026-09-29-0412-calendar"]
title = "Kàlẹ́ńdà rẹ, lẹ́gbẹ̀ẹ́ meeli rẹ"
text = """
Kàlẹ́ńdà ń fi àwọn kàlẹ́ńdà Google, Microsoft àti àwọn mìíràn rẹ hàn ní ọjọ́, ọ̀sẹ̀, oṣù tàbí gẹ́gẹ́ bí àtòjọ àkókò, pẹ̀lú àwọn kọ́kọ́rọ́ Google Calendar.
Bọ́tìnì kàlẹ́ńdà ní ìhà ọ̀tún meeli rẹ ń ṣí àtòjọ ọjọ́ náà, pẹ̀lú Darapọ̀ fún àwọn ìpè.
Wọlé sí àkọọ́lẹ̀ kan lẹ́ẹ̀kan sí i kí Katna lè ka kàlẹ́ńdà rẹ̀.
"""

["2026-09-29-0442-contacts-edit"]
title = "Ṣíṣẹ̀dá àti yíyí àwọn olùbásọ̀rọ̀ padà"
text = """
Ṣẹ̀dá olùbásọ̀rọ̀ lórí ojú ìwé Àwọn olùbásọ̀rọ̀ máa ń fi ẹnì kan kún àkọọ́lẹ̀ tí o yàn, Ṣàtúnṣe lórí ojú ìwé olùbásọ̀rọ̀ sì máa ń yí i padà níbẹ̀ náà.
Pa rẹ́ ní Dá padà, Google àti Outlook sì máa ń tọ́jú àwọn olùbásọ̀rọ̀ tí a pa rẹ́ sínú àpò ìdọ̀tí fún ìgbà díẹ̀.
"""

["2026-09-29-0538-notes-on-mail"]
title = "Àkọsílẹ̀ lórí lẹ́tà"
text = """
Tẹ lẹ́tà kan ní bọ́tìnnì ọ̀tún, tàbí ṣí àtòjọ ⋮ rẹ̀, kí o sì yan Fi àkọsílẹ̀ kún un: àkọsílẹ̀ tí àkọlé rẹ̀ jẹ́ kókó lẹ́tà náà yóò ṣí lórí lẹ́tà náà.
Àwọn àkọsílẹ̀ rẹ̀ máa ń hàn lábẹ́ kókó lẹ́tà náà nígbàkúùgbà tí o bá tún ṣí lẹ́tà yẹn, ìdámọ̀ Lẹ́tà lórí àkọsílẹ̀ sì máa ń mú ọ padà sórí lẹ́tà náà.
"""

["2026-09-29-0542-caldav-tasks"]
title = "Iṣẹ́ lórí olupèsè lẹ́tà tìrẹ"
text = """
Àwọn àkọọ́lẹ̀ tí a fi ọ̀rọ̀ìgbaniwọlé wọlé máa ń tọ́jú iṣẹ́ wọn sórí olupèsè lẹ́tà wọn báyìí nígbà tí ó bá fúnni ní CalDAV,
nítorí náà iṣẹ́ náà tún máa ń hàn nínú àwọn ohun èlò olupèsè fúnra rẹ̀ àti lórí fóònù.
"""

["2026-09-29-0521-calendar-edit"]
title = "Fi àwọn ìṣẹ̀lẹ̀ kún kí o sì yí wọn padà"
text = """
Tẹ̀ tàbí fà lórí kàlẹ́ńdà, tàbí tẹ C, láti fi ìṣẹ̀lẹ̀ kún. Fa ìṣẹ̀lẹ̀ láti gbé e, tàbí etí ìsàlẹ̀ rẹ̀ láti yí gígùn rẹ̀ padà,
kí o sì ṣí i láti yí àkókò, ìtúnṣẹlẹ̀, àwọn ìránnilétí, àwọn àlejò padà tàbí láti fi ìpè Meet tàbí Teams kún.
Fèsì sí àwọn ìpè pẹ̀lú Bẹ́ẹ̀ni, Rárá tàbí Bóyá. Dá padà máa ń dá gbogbo nǹkan padà sí bó ṣe wà.
"""

["2026-09-29-0546-calendar-any-account"]
title = "Kàlẹ́ńdà láti àwọn àkọọ́lẹ̀ púpọ̀ sí i"
text = """
Katna ti ń rí àwọn kàlẹ́ńdà Yahoo, Zoho, iCloud, Fastmail, GMX àti àwọn àkọọ́lẹ̀ mìíràn báyìí, kódà nígbà tí wọ́n bá wà lórí olupèsè tí kì í ṣe ti lẹ́tà.
Ó máa ń gbìyànjú ọ̀nà tó dára jù lọ ti àkọọ́lẹ̀ kọ̀ọ̀kan ná, àti ọ̀nà mìíràn nígbà tí ọ̀nà yẹn bá ti wà ní pípa.
"""

["2026-09-29-0625-tasks-today"]
title = "“Òní” nínú Iṣẹ́"
text = """
“Òní”, lábẹ́ “Gbogbo iṣẹ́”, ń kó ohun tó yẹ lónìí àti èyíkéyìí tó ti kọjá àkókò jọ láti gbogbo àtòjọ, pẹ̀lú àtòjọ tí ọ̀kọ̀ọ̀kan wà.
Iṣẹ́ tí a bá fi kún un níbẹ̀ yẹ lónìí.
"""

["2026-09-29-0631-invitation-card"]
title = "Àwọn ìkésíni nínú lẹ́tà rẹ"
text = """
Ìkésíni ń hàn báyìí gẹ́gẹ́ bí káàdì lókè lẹ́tà: ìgbà àti ibi, ẹni tó ṣètò rẹ̀, ọjọ́ rẹ yí i ká pẹ̀lú àmì ìkọlù èyíkéyìí, Darapọ̀,
àti Ṣé o ń lọ? Bẹ́ẹ̀ni, Rárá tàbí Bóyá, tí a lè dáhùn níbẹ̀ gan-an.
"""

["2026-09-29-0616-note-labels"]
title = "Àwọn àmì lórí àkọsílẹ̀"
text = """
Bọ́tìnì àmì lórí àkọsílẹ̀ ni a fi ń fi àmì sí i, bíi ti Keep. A ṣàtòkọ àwọn àmì rẹ sí ẹ̀gbẹ́ “Àkọsílẹ̀”, ọ̀kọ̀ọ̀kan sì ń fi àwọn àkọsílẹ̀ rẹ̀ nìkan hàn.
“Ṣàtúnṣe àwọn àmì” ń yí orúkọ wọn padà tàbí pa wọ́n rẹ́, pẹ̀lú Undo.
"""

["2026-09-29-0630-tasks-more-accounts"]
title = "Iṣẹ́ láti àwọn àkọọ́lẹ̀ púpọ̀ sí i"
text = """
Iṣẹ́ ti ń bá Yahoo, Zoho, iCloud, Fastmail àti àwọn àkọọ́lẹ̀ mìíràn tí iṣẹ́ wọn wà lórí olupin tó yàtọ̀ sí ti ìmẹ́ẹ̀lì wọn sọ̀rọ̀ báyìí.
Katna kọ́kọ́ máa ń gbìyànjú ọ̀nà tó dára jù fún àkọọ́lẹ̀ kọ̀ọ̀kan, á sì rántí èyí tó ṣiṣẹ́.
"""

["2026-09-29-0651-schedule-meeting"]
title = "Ṣètò ìpàdé láti inú lẹ́tà"
text = """
Tẹ ọ̀rọ̀ àsọyépọ̀ lọ́tùn-ún, tàbí ṣí ⋮, kí o yan Ṣètò ìpàdé: ìṣẹ̀lẹ̀ tuntun yóò ṣí lórí ojúewé Kàlẹ́ńdà
pẹ̀lú àkòrí rẹ̀ gẹ́gẹ́ bí orúkọ, àti gbogbo ẹni inú àsọyépọ̀ gẹ́gẹ́ bí àlejò.
"""

["2026-09-29-0705-running-late"]
title = "Ò ń pẹ́? Sọ fún gbogbo ènìyàn pẹ̀lú títẹ̀ kan"
text = """
Ìṣẹ̀lẹ̀ tó ní àlejò báyìí ní Fi lẹ́tà ránṣẹ́ sí àwọn àlejò, àti láti wákàtí kan ṣáájú ìbẹ̀rẹ̀, Mo ń pẹ́:
lẹ́tà sí gbogbo ènìyàn, láti àkáǹtì kàlẹ́ńdà náà, tó ṣetán láti fi ránṣẹ́.
"""

["2026-09-29-0607-contact-labels"]
title = "Àwọn àmì olùbásọ̀rọ̀"
text = """
Àmì lórí ojú-ìwé olùbásọ̀rọ̀ ń tan àmì tàbí pa á, tàbí ṣẹ̀dá tuntun, ⋮ tó wà ní ẹ̀gbẹ́ àmì sì ń tún orúkọ rẹ̀ ṣe, pa á rẹ́ tàbí kọ̀wé sí gbogbo ẹni tó wà nínú rẹ̀.
Àwọn àmì ń bá Google Contacts àti Outlook rìn pọ̀, gbogbo àyípadà sì ní Undo.
"""

["2026-09-29-0640-add-to-contacts"]
title = "Fi kún àwọn olùbásọ̀rọ̀ láti Mail"
text = """
Pánẹ́ẹ̀lì olùbásọ̀rọ̀ tó wà ní ẹ̀gbẹ́ ìjíròrò ní Fi kún àwọn olùbásọ̀rọ̀ fún ẹni tí o kò tíì fipamọ́: ìkọlù kan ń fi orúkọ àti àdírẹ́sì rẹ̀ pamọ́, pẹ̀lú fóònù, akọlé iṣẹ́ àti ilé-iṣẹ́ láti ibuwọ́lù rẹ̀, pẹ̀lú Undo.
Fún ẹni tí a ti fipamọ́, bọ́tìnì kan náà ń ṣí i ní ojú-ìwé Àwọn olùbásọ̀rọ̀.
"""

["2026-09-29-0720-focus-time"]
title = "Àkókò ìfọkànsìn, Kò sí ní ọ́fíìsì àti Ibi iṣẹ́"
text = """
Ìṣẹ̀lẹ̀ tuntun lè jẹ́ Àkókò ìfọkànsìn, Kò sí ní ọ́fíìsì tàbí Ibi iṣẹ́ báyìí, bí ní Google Calendar: yàn án lókè àwọn àkókò.
Google àti Outlook rí wọn bí wọ́n ṣe jẹ́, wọ́n sì ń hàn pẹ̀lú àmì tiwọn ní Katna.
"""

["2026-09-29-0704-task-chips"]
title = "Àwọn iṣẹ́ lórí lẹ́tà rẹ"
text = """
Lẹ́tà tí o sọ di iṣẹ́ báyìí ń fi ọjọ́ ìparí iṣẹ́ náà hàn nínú àkójọ, ní pupa tó bá ti pẹ́.
Tẹ̀ ẹ́ láti ṣí iṣẹ́ náà.
"""

["2026-09-29-0638-other-contacts"]
title = "Àwọn olùbásọ̀rọ̀ mìíràn"
text = """
Àwọn olùbásọ̀rọ̀ báyìí ní Àwọn olùbásọ̀rọ̀ mìíràn: àwọn tí o ti fi ìmeèlì ránṣẹ́ sí láti Gmail ṣùgbọ́n tí o kò fipamọ́ rí, gẹ́gẹ́ bí Gmail ṣe ń pa wọ́n mọ́.
Fi ẹnikẹ́ni pamọ́ pẹ̀lú títẹ̀ ẹ̀ẹ̀kan, pẹ̀lú Dá padà, tàbí bẹ̀rẹ̀ ìmeèlì sí wọn.
"""

["2026-09-29-0745-answer-by-mail"]
title = "Fèsì sí ìpè láti àkọọ́lẹ̀ èyíkéyìí"
text = """
Ìpè tó dé àkọọ́lẹ̀ tí kò ní kàlẹ́ńdà báyìí ní Bẹ́ẹ̀ni, Rárá àti Bóyá pẹ̀lú:
ìdáhùn rẹ ń lọ sí ọ̀dọ̀ olùṣètò nípasẹ̀ ìmeèlì, kàlẹ́ńdà rẹ̀ sì ń fi àmì sí i.
"""

["2026-09-29-0710-meeting-notes"]
title = "Àkọsílẹ̀ ìpàdé"
text = """
Ṣí ìṣẹ̀lẹ̀ kan lórí Kàlẹ́ńdà kí o sì yan Ṣe àkọsílẹ̀ ìpàdé: àkọsílẹ̀ tó ní orúkọ ìṣẹ̀lẹ̀ náà yóò ṣí, pẹ̀lú àwọn tó wá àti ibi fún àwọn ohun tí a máa ṣe.
Káàdì ìṣẹ̀lẹ̀ náà ń ṣàkójọ àwọn àkọsílẹ̀ rẹ̀, àmì Ìṣẹ̀lẹ̀ tó wà lára àkọsílẹ̀ sì máa mú ọ padà sí ọjọ́ náà.
"""

["2026-09-29-0751-go-to-pdf-page"]
title = "Lọ tààrà sí ojú ìwé PDF"
text = """
Nọ́mbà ojú ìwé tó wà lábẹ́ PDF ti di àpótí báyìí:
Tẹ̀ ẹ́ tàbí tẹ Ctrl+G, tẹ nọ́mbà ojú ìwé, lẹ́yìn náà tẹ Enter láti fò lọ síbẹ̀.
"""

["2026-09-29-0715-tasks-on-calendar"]
title = "Àwọn iṣẹ́ lórí kàlẹ́ńdà"
text = """
Àwọn iṣẹ́ tí ó ní ọjọ́ ìparí báyìí máa ń hàn lórí Kàlẹ́ńdà, ní àkókò wọn tàbí pẹ̀lú àwọn ìṣẹ̀lẹ̀ gbogbo ọjọ́.
O lè sàmì sí wọn bí ti parí níbẹ̀, tẹ̀ láti ṣí ọ̀kan, tàbí fà á lọ sí ọjọ́ tàbí àkókò mìíràn láti fi àkókò yẹn pamọ́ fún un.
"""

["2026-09-29-0756-event-reminders"]
title = "Àwọn ìránnilétí fún àwọn ìṣẹ̀lẹ̀ rẹ"
text = """
Àwọn ìṣẹ̀lẹ̀ máa ń rán ọ létí pẹ̀lú ìwifúnni báyìí, àní nígbà tí Katna bá wà ní títìpa.
Darapọ̀ ń ṣí ìpè fídíò, Sún síwájú ní ìṣẹ́jú 5 sì ń rán ọ létí lẹ́ẹ̀kan sí i lẹ́yìn ìṣẹ́jú márùn-ún.
"""

["2026-09-29-0758-contacts-merge-import"]
title = "Dàpọ̀ àwọn olùbásọ̀rọ̀ tó jọra, gbé wọlé àti gbé jáde"
text = """
Àwọn olùbásọ̀rọ̀ ní Àtúnṣe àti ìṣàkóso báyìí: Dàpọ̀ àti àtúnṣe ń wá àwọn ènìyàn tí a fipamọ́ lẹ́ẹ̀mejì (orúkọ tàbí nọ́ńbà fóònù kan náà) ó sì ń dà wọ́n pọ̀ pẹ̀lú títẹ̀ ẹ̀ẹ̀kan, pẹ̀lú Dá padà.
Gbé wọlé ń mú àwọn ènìyàn wá láti fáìlì vCard, ó ń fi àwọn tí a ti fipamọ́ sílẹ̀, Gbé jáde sì ń fi gbogbo wọn, tàbí àmì kan, pamọ́ bí fáìlì vCard.
"""

["2026-09-29-0835-contacts-birthdays-qr-print"]
title = "Àwọn ọjọ́ ìbí lórí kàlẹ́ńdà, àwọn olùbásọ̀rọ̀ bí kóòdù QR"
text = """
Àwọn ọjọ́ ìbí àwọn olùbásọ̀rọ̀ rẹ ti hàn lórí Kàlẹ́ńdà báyìí, nínú kàlẹ́ńdà Àwọn ọjọ́ ìbí tí o lè yọ àmì rẹ̀ kúrò.
Ojú-ìwé olùbásọ̀rọ̀ lè fi wọ́n hàn bí kóòdù QR tí kámẹ́rà fóònù ń fipamọ́, kí ó sì tẹ̀ wọ́n jáde; Tẹ̀jáde lábẹ́ Àtúnṣe àti ìṣàkóso ń tẹ̀ gbogbo ẹni tó wà lórí ìfihàn jáde.
Gbé wọlé ti ń ka àwọn fáìlì CSV láti Àwọn olùbásọ̀rọ̀ Google àti Outlook pẹ̀lú báyìí, KRunner àti àwárí GNOME sì ń rí àwọn olùbásọ̀rọ̀ rẹ tí a fipamọ́.
"""

["2026-09-29-0830-calendar-density-time-zones"]
title = "Ìwọ̀n ìkọ̀pọ̀ Kàlẹ́ńdà àti agbègbè àkókò kejì"
text = """
Bọ́tìnì Àwọn àṣàyàn nínú Kàlẹ́ńdà ń ṣètò gíga àwọn wákàtí (Ó ń bá ojú-ìwé rẹ mu, Ìtura tàbí Kékeré ṣinṣin) ó sì ń fi agbègbè àkókò kejì kún èyí tìrẹ, fún àwọn ènìyàn tí o ń pàdé ní ilẹ̀ òkèèrè.
"""

["2026-09-29-0809-video-calls"]
title = "Bẹ̀rẹ̀ ìpè fídíò láti inú ìfiránṣẹ́"
text = """
Tẹ ìsọ̀rọ̀ kan pẹ̀lú bọ́tìnì ọ̀tún, tàbí ṣí ⋮, kí o sì yan Bẹ̀rẹ̀ ìpè fídíò: ìpè náà yóò ṣí, pẹ̀lú ìfiránṣẹ́ tuntun sí gbogbo ènìyàn tó wà nínú ìsọ̀rọ̀ náà tó gbé ìjápọ̀ rẹ̀ dání. Àwọn àkọọ́lẹ̀ Gmail ń lo Google Meet; àwọn mìíràn ń gba yàrá Jitsi Meet. Ìfiránṣẹ́ tó ní ìjápọ̀ ìpè Meet, Teams, Zoom, Webex, Jitsi, WhatsApp tàbí Telegram nísinsin yìí ń ṣàfihàn bọ́tìnì Darapọ̀.
"""

["2026-09-29-0815-note-line-task"]
title = "Sọ ìlà àtòjọ àyẹ̀wò di iṣẹ́"
text = """
Gbé kọ́sọ̀ sórí ìlà àtòjọ àyẹ̀wò nínú àkọsílẹ̀, kí o yan Ṣe é ní iṣẹ́: ìlà náà á lọ sínú àwọn iṣẹ́ rẹ. Àmì Àkọsílẹ̀ rẹ̀ lórí ojú-ìwé Iṣẹ́ á tún ṣí àkọsílẹ̀ náà.
"""

["2026-09-29-0836-active-pane-stands-out"]
title = "Ìgbóríyọ̀ tí o wà nínú rẹ̀ ta yọ"
text = """
Lẹ́gbẹ̀ẹ́ àtòjọ náà, ìgbóríyọ̀ tó ń gba àwọn kọ́kọ́rọ́ nìkan ló ń pa òjìji rẹ̀ mọ́; àtòjọ, ìjíròrò tàbí pánẹ́lì olùbáraẹni tí o kò lò á padà sẹ́yìn pẹ̀lú etí tó fẹ́rẹ̀ẹ́, ìyípadà náà á sì tẹ̀lé ọ ní ìrọ̀rùn bí o ṣe ń tẹ̀.
"""

["2026-09-29-0840-task-reminders"]
title = "Àwọn ìránnilétí iṣẹ́ àti àtúnṣe"
text = """
Ṣí iṣẹ́ kan kí o yan Rán mi létí: ní àkókò náà, wákàtí kan tàbí ọjọ́ kan ṣáájú. Ìránnilétí náà á yọ jáde kódà bí Katna bá wà ní títì, pẹ̀lú àwọn bọ́tìnì Ṣàmì sí pé ó ti parí àti Sún síwájú. Tí o bá ṣàmì sí iṣẹ́ àtúnṣe pé ó ti parí, ó á padà ní ọjọ́ rẹ̀ tó kàn.
"""

["2026-09-29-0849-tasks-in-desktop-search"]
title = "Wá àwọn iṣẹ́ láti orí déskitọ́pù"
text = """
Tẹ ọ̀rọ̀ díẹ̀ nínú iṣẹ́ kan sínú àwárí KRunner tàbí GNOME, yóò sì hàn lábẹ́ Iṣẹ́. Tẹ Enter, Katna yóò sì ṣí i, ó ṣetán fún àtúnṣe.
"""

["2026-09-29-0832-clock-day-menu"]
title = "Fi àwọn ìṣẹ̀lẹ̀ àti iṣẹ́ kún un láti aago orí tábìlì"
text = """
Nínú Aago Dijítàlì Katna, tẹ ọjọ́ kan nínú oṣù lọ́tùn-ún láti fi iṣẹ́ tàbí ìṣẹ̀lẹ̀ kún un fún ọjọ́ náà; ìṣẹ̀lẹ̀ náà yóò ṣí nínú Kàlẹ́ńdà Katna. Títẹ ọ̀kan lára àwọn ìṣẹ̀lẹ̀ rẹ yóò ṣí Kàlẹ́ńdà ní ọjọ́ rẹ̀.
"""

["2026-09-29-0855-type-an-event"]
title = "Tẹ ìṣẹ̀lẹ̀ kan sínú ìlà kan"
text = """
Tẹ "Oúnjẹ ọ̀sán pẹ̀lú Anita ọjọ́ Ẹtì 1 ọ̀sán ní Cafe Mocha" tàbí "Ìpàdé kúkúrú ní gbogbo ọjọ́ iṣẹ́ 9:30" gẹ́gẹ́ bí àkọlé ìṣẹ̀lẹ̀ tuntun, Kàlẹ́ńdà yóò sì kún ọjọ́, àkókò, àtúnṣe àti ibi bí o ṣe ń tẹ̀.
"""

["2026-09-29-0915-year-view"]
title = "Wo gbogbo ọdún ní ẹ̀ẹ̀kan"
text = """
Kàlẹ́ńdà ní ìwòye Ọdún: gbogbo oṣù méjìlá papọ̀, pẹ̀lú ìkáwọ́ kékeré lábẹ́ àwọn ọjọ́ tí ó ní ìṣẹ̀lẹ̀. Tẹ Y, kí o sì tẹ ọjọ́ kan láti ṣí i.
"""

["2026-09-29-0930-share-free-times"]
title = "Pín àwọn àkókò òmìnira rẹ"
text = """
Pín àwọn àkókò òmìnira nínú àwọn àṣàyàn Kàlẹ́ńdà yóò bẹ̀rẹ̀ ìfiránṣẹ́ tó ń ṣàkójọ àwọn àkókò tí o wà ní òmìnira ní àwọn ọjọ́ iṣẹ́ tó ń bọ̀, ó ṣetán láti fi ránṣẹ́ sí ẹnikẹ́ni.
"""

["2026-09-29-0952-calendar-sets"]
title = "Àwọn àkójọ kàlẹ́ńdà"
text = """
Fi àwọn kàlẹ́ńdà tí ò ń fihàn pamọ́ gẹ́gẹ́ bí àkójọ kan, bí "Iṣẹ́" tàbí "Ẹbí", pẹ̀lú + lẹ́gbẹ̀ẹ́ Àwọn àkójọ kàlẹ́ńdà. Títẹ àkójọ kan lẹ́ẹ̀kan yóò fi àwọn kàlẹ́ńdà rẹ̀ hàn, yóò sì fi àwọn yòókù pamọ́.
"""

["2026-09-29-0947-tasks-typed-quick-add"]
title = "Tẹ iṣẹ́ kan ní ìlà kan"
text = """
Fi iṣẹ́ kan kún un bíi "Pe báńkì ní ọ̀la ní aago mẹ́ta ọ̀sán" tàbí "Bomi rin àwọn ohun ọ̀gbìn ní gbogbo ọjọ́ Ajé ní aago mẹ́jọ àárọ̀", Iṣẹ́ yóò sì ṣètò ọjọ́, àkókò àti àtúnṣe fún ọ, yóò máa fi ohun tó yé e hàn bí o ṣe ń tẹ̀ ẹ́.
"""

["2026-09-29-1028-calendar-narrow-windows"]
title = "Kàlẹ́ńdà nínú fèrèsé tóóró"
text = """
Nínú fèrèsé tóóró, Kàlẹ́ńdà máa ń pa Òní àti àwọn ọjọ́ mọ́ sórí ọ̀pá rẹ̀, yóò sì kó àwọn ìwò sínú àkójọ-àṣàyàn kan. Àkókò ìṣẹ̀lẹ̀ kò ní já láàárín ọ̀rọ̀ mọ́, Tab sì ń dé gbogbo bọ́tìnnì àti kàlẹ́ńdà.
"""

["2026-09-29-1039-contact-panel-tasks"]
title = "Iṣẹ́ pẹ̀lú wọn, lẹ́gbẹ̀ẹ́ lẹ́tà wọn"
text = """
Pánẹ́ẹ̀lì olùbásọ̀rọ̀ lẹ́gbẹ̀ẹ́ ìjíròrò kan ti ń ṣàkójọ àwọn iṣẹ́ rẹ tó ṣí sílẹ̀ tí a ṣe láti inú lẹ́tà pẹ̀lú ẹni náà báyìí. Fi àmì sí ọ̀kan láti parí rẹ̀, tàbí tẹ̀ ẹ́ láti ṣí i nínú Iṣẹ́.
"""

["2026-09-29-1046-contact-panel-meetings"]
title = "Àwọn ìpàdé rẹ tó kàn pẹ̀lú wọn"
text = """
Pánẹ́ẹ̀lì olùbásọ̀rọ̀ lẹ́gbẹ̀ẹ́ ìjíròrò kan ti ń fi àwọn ìpàdé rẹ tó kàn pẹ̀lú ẹni náà hàn báyìí. Tẹ ọ̀kan láti ṣí i nínú Kàlẹ́ńdà.
"""

["2026-09-29-1051-tasks-drag-to-list"]
title = "Wọ́ iṣẹ́ kan lọ sí àtòjọ mìíràn"
text = """
Nínú Iṣẹ́, wọ́ iṣẹ́ kan sórí àtòjọ mìíràn láti gbé e lọ síbẹ̀. Dá padà yóò dá a padà sí ibi tó wà.
"""

["2026-09-29-1111-tasks-search"]
title = "Ṣàwárí àwọn iṣẹ́ rẹ"
text = """
Lójú ewé Iṣẹ́, àpótí ìwádìí lókè ti ń ṣàwárí àwọn iṣẹ́ rẹ, àwọn àkọsílẹ̀ wọn àti àwọn iṣẹ́ kékeré báyìí, dípò lẹ́tà rẹ.
"""

["2026-09-29-1130-calendar-search"]
title = "Ṣàwárí àwọn ìṣẹ̀lẹ̀ rẹ"
text = """
Lójú ewé Kàlẹ́ńdà, àpótí ìwádìí lókè ti ń rí àwọn ìṣẹ̀lẹ̀ nípa àkọlé, ibi, àkọsílẹ̀ tàbí àwọn àlejò báyìí, tí a tò ní ìbámu pẹ̀lú ọjọ́. Tẹ ọ̀kan láti ṣí i ní ọjọ́ rẹ̀; Esc máa mú ọ padà sí àwọn àbájáde.
"""

["2026-09-29-1045-note-formatting"]
title = "Ìgúnrege nínú àkọsílẹ̀"
text = """
Yan Ìgúnrege nínú àkọsílẹ̀ kan fún Àkọlé 1, Àkọlé 2, nípọn, dagun àti
ìlà sábẹ́, bí ti Keep. Pátákó náà ń fi hàn pẹ̀lú, ó sì ń bá àkọsílẹ̀ náà
lọ sí fóldà Àkọsílẹ̀ nínú àkọọ́lẹ̀ ímeèlì rẹ, níbi tí ìgúnrege láti iPhone
ti ń padà wá báyìí bí ó ṣe wà tẹ́lẹ̀.
"""

["2026-09-29-0934-custom-days-view"]
title = "Fi ọjọ́ díẹ̀ péré hàn"
text = """
Kàlẹ́ńdà ní Ìwòye àdáni lẹ́gbẹ̀ẹ́ Àtòjọ àkókò: ọjọ́ 4 láti ọjọ́ tí o
yàn, tàbí láti 2 sí 7. Tẹ X, kí o sì yan iye rẹ̀ nínú Àwọn àṣàyàn.
"""

["2026-09-29-0939-events-in-desktop-search"]
title = "Wá àwọn ìṣẹ̀lẹ̀ láti orí tábìlì"
text = """
Tẹ orúkọ ìṣẹ̀lẹ̀ kan sínú KRunner tàbí ìwádìí GNOME láti rí ìgbà tí yóò
wáyé tókàn, kí o sì tẹ Enter láti ṣí ọjọ́ náà nínú Kàlẹ́ńdà.
"""

["2026-09-29-1102-apps-on-a-phone"]
title = "Kàlẹ́ńdà, Olùbásọ̀rọ̀, Iṣẹ́ àti Àkọsílẹ̀ lórí fóònù"
text = """
Nínú fèrèsé tóóró, àwọn ojú ewé wọ̀nyí ti bá ìbòjú mu báyìí bí Lẹ́tà ṣe
ń ṣe: àtòjọ ẹ̀gbẹ́ wọn ń ṣí láti bọ́tìnnì àkójọ, Olùbásọ̀rọ̀ ń fi orúkọ
kọ̀ọ̀kan hàn pẹ̀lú àdírẹ́sì rẹ̀ nísàlẹ̀, Àkọsílẹ̀ sì ń to káàdì méjì sí
ẹ̀gbẹ́ ara wọn.
"""

["2026-09-29-1236-agenda-button-top-bar"]
title = "Ètò ọjọ́ náà, láti ọ̀pá òkè"
text = """
Bọ́tìnnì tí ń fi ètò ọjọ́ náà hàn lẹ́gbẹ̀ẹ́ lẹ́tà rẹ ti wà lórí ọ̀pá òkè
báyìí, nítòsí bọ́tìnnì èdè, lẹ́tà rẹ sì ń gba àyè tí ìlà ẹ̀gbẹ́ ti ń gbà
tẹ́lẹ̀.
"""

["2026-09-29-1243-hide-side-panel-on-every-page"]
title = "Fi pánẹ́lì ẹ̀gbẹ́ pamọ́ ní gbogbo ojú ewé"
text = """
Bọ́tìnnì àkójọ lókè lápá òsì ti ń ká pánẹ́lì ẹ̀gbẹ́ jọ báyìí ní
Kàlẹ́ńdà, Olùbásọ̀rọ̀, Iṣẹ́ àti Àkọsílẹ̀ pẹ̀lú, ó ń yọ̀ ọ́ kúrò bí ó ṣe
ń ṣe fún àwọn fóldà Lẹ́tà. Ojú ewé kọ̀ọ̀kan ń rántí bóyá o fi í sílẹ̀ ní
ṣíṣí.
"""

["2026-09-29-1251-app-menu-on-a-phone"]
title = "Àkójọ àkọ́kọ́ lórí fóònù"
text = """
Lórí fóònù, àkójọ àkọ́kọ́ lẹ́yìn àwòrán àkọọ́lẹ̀ ń ṣí Fáìlì, Ṣàtúnṣe,
Ìwò àti àwọn yòókù níbẹ̀ gan-an, pẹ̀lú ìlà Padà lókè, dípò kí ó jáde sí
ẹ̀gbẹ́ ìbòjú.
"""

["2026-09-29-1256-calendar-every-account"]
title = "Gbogbo àkọọ́lẹ̀ lórí Kàlẹ́ńdà"
text = """
Àtòjọ ẹ̀gbẹ́ Kàlẹ́ńdà ti ń fi gbogbo àkọọ́lẹ̀ rẹ hàn báyìí. Nígbà tí
àwọn kàlẹ́ńdà àkọọ́lẹ̀ kan kò bá lè ṣí, ìlà kan nísàlẹ̀ rẹ̀ ń sọ ìdí,
pẹ̀lú títẹ̀ kan ṣoṣo tí ó ń yanjú rẹ̀, bí “Wọlé lẹ́ẹ̀kan sí i láti fi
àwọn kàlẹ́ńdà hàn”.
"""

["2026-09-29-1300-switch-account-stay-on-page"]
title = "Yí àkọọ́lẹ̀ padà láì kúrò lójú ewé"
text = """
Yíyan àkọọ́lẹ̀ míràn láti inú àwòrán rẹ lókè lápá ọ̀tún, tàbí yíyí
kẹ̀kẹ́ lórí rẹ̀, ti ń jẹ́ kí o dúró sí Kàlẹ́ńdà, Iṣẹ́, Olùbásọ̀rọ̀ tàbí
Àkọsílẹ̀ báyìí. Àwọn nǹkan tuntun ń lọ sí àkọọ́lẹ̀ yẹn, Lẹ́tà sì ń fi í
hàn nígbà tí o bá padà.
"""

["2026-09-29-1317-contacts-every-account"]
title = "Gbogbo àkáǹtì nínú Olùbásọ̀rọ̀"
text = """
Olùbásọ̀rọ̀ ti ń to gbogbo àkáǹtì rẹ sábẹ́ Àwọn àkáǹtì báyìí, pẹ̀lú iye
ènìyàn tí ọ̀kọ̀ọ̀kan ní; tẹ ọ̀kan láti rí àwọn ènìyàn rẹ̀ nìkan. Nígbà
tí àwọn olùbásọ̀rọ̀ àkáǹtì kan kò bá lè ṣí, ìlà kan nísàlẹ̀ rẹ̀ ń sọ
ìdí, pẹ̀lú títẹ̀ kan ṣoṣo tí ó ń yanjú rẹ̀, bí “Wọlé lẹ́ẹ̀kan sí i láti
fi àwọn olùbásọ̀rọ̀ hàn” tàbí “Gbìyànjú lẹ́ẹ̀kan sí i”.
"""

["2026-09-29-1327-tasks-every-account"]
title = "Gbogbo àkáǹtì lójú ewé Iṣẹ́"
text = """
Gbogbo àkáǹtì ti ń hàn nínú pánẹ́lì ẹ̀gbẹ́ Iṣẹ́ báyìí. Nígbà tí àwọn
iṣẹ́ àkáǹtì kan kò bá lè ṣí, ìlà kan nísàlẹ̀ rẹ̀ ń sọ ìdí, pẹ̀lú títẹ̀
kan ṣoṣo láti yanjú rẹ̀: wọlé lẹ́ẹ̀kan sí i, tàbí gbìyànjú lẹ́ẹ̀kan sí
i.
"""

["2026-09-29-1404-compose-dialogs-in-view"]
title = "Àwọn ìbéèrè kí o tó fi ránṣẹ́ máa ń hàn"
text = """
Àwọn ìbéèrè bí “Ṣé o fẹ́ so àwọn fáìlì mọ́ ọn ni?” ti ń ṣí ní àárín
fèrèsé báyìí, bó ti wù kí lẹ́tà tí ò ń kọ tàbí tí ò ń fi ránṣẹ́ síwájú
gùn tó, nítorí náà wọn kò ní farapamọ́ sísàlẹ̀ ojú ewé mọ́. Enter ń
dáhùn pẹ̀lú bọ́tìnnì àkọ́kọ́, Esc sì ń padà sí lẹ́tà náà.
"""

["2026-09-29-1530-mark-up-pdfs"]
title = "Sàmì sí àwọn PDF"
text = """
Tẹ kálàmù nínú olùwò PDF láti ṣàfihàn, fa ìlà sábẹ́, fa ìlà wíwọ́ tàbí
fa ìlà kọjá ọ̀rọ̀, tàbí yàwòrán pẹ̀lú kálàmù, ní àwọ̀ tí o yàn. Dá padà
pẹ̀lú Ctrl+Z, pa àmì rẹ́ pẹ̀lú ìparẹ́, lẹ́yìn náà fi ẹ̀dà tí a sàmì sí
pamọ́. Àsomọ́ àtilẹ̀wá yóò wà bí ó ṣe wà.
"""

["2026-09-29-1557-calendar-accounts-why"]
title = "Ìdí tí àkáǹtì kan kò fi ní kàlẹ́ńdà"
text = """
Nígbà tí àwọn kàlẹ́ńdà àkáǹtì kan kò bá hàn, Kàlẹ́ńdà ti ń sọ ohun tí
sáfà dáhùn báyìí, “Gbìyànjú lẹ́ẹ̀kan sí i” sì ń wá wọn lẹ́ẹ̀kan sí i
lẹ́sẹ̀kẹsẹ̀. Àkáǹtì Gmail tàbí Outlook tí a fi ọ̀rọ̀ aṣínà kún máa ń
fúnni láti wọlé pẹ̀lú Google tàbí Microsoft, èyí tí àwọn kàlẹ́ńdà wọn
nílò.
"""

["2026-09-29-1610-one-checkbox"]
title = "Àwọn àpótí àmì tí ń fi àmì hàn"
text = """
Gbogbo àpótí àmì nínú Katna Mail ti tóbi tó àwọn bọ́tìnnì yíká tó wà
lẹ́gbẹ̀ẹ́ wọn báyìí. Àmì rẹ̀ máa ń ya ara rẹ̀ nígbà tí o bá sàmì sí i, ó
sì máa ń parẹ́ nígbà tí o bá yọ ọ́, nínú Ètò, àtòjọ lẹ́tà, Kàlẹ́ńdà,
Olùbásọ̀rọ̀, Àkọsílẹ̀ àti àwọn àpótí ìbánisọ̀rọ̀.
"""

["2026-09-29-1622-right-click-menu-fits"]
title = "Àkójọ títẹ̀ ọ̀tún tó kúrú tí ó máa ń bá a mu"
text = """
Àkójọ títẹ̀ ọ̀tún àtòjọ lẹ́tà ń fi àwọn ìṣe ojoojúmọ́ sí òkè, ó sì ń fi
ìyókù sábẹ́ Tẹ̀lé e (iṣẹ́, àkọsílẹ̀, ìpàdé, ìpè) àti Síwájú sí i
(àwúrúju, pàtàkì, lílẹ̀ mọ́). Ó máa ń ṣí níbi tí o tẹ̀, ó sì máa ń dúró
nínú fèrèsé; nínú fèrèsé kúkúrú tàbí tóóró, àkójọ kékeré máa ń ṣí ní ipò
àkójọ náà.
"""

["2026-09-29-1627-contacts-accounts-why"]
title = "Ìdí tí àkáǹtì kan kò fi ní olùbásọ̀rọ̀"
text = """
Nígbà tí àwọn olùbásọ̀rọ̀ àkáǹtì kan kò bá hàn, Olùbásọ̀rọ̀ ti ń sọ ohun
tí sáfà dáhùn báyìí, “Gbìyànjú lẹ́ẹ̀kan sí i” sì ń wá wọn lẹ́ẹ̀kan sí i
lẹ́sẹ̀kẹsẹ̀. Àkáǹtì Gmail tàbí Outlook tí a fi ọ̀rọ̀ aṣínà kún máa ń
fúnni láti wọlé pẹ̀lú Google tàbí Microsoft, èyí tí àwọn olùbásọ̀rọ̀ wọn
nílò.
"""

["2026-09-29-1640-search-box-focus"]
title = "Àpótí ìwádìí ń fi hàn nígbà tó bá ń ṣiṣẹ́"
text = """
Àpótí ìwádìí lókè ń ní etí àwọ̀ àfihàn nígbà tí o bá ń tẹ̀ sínú rẹ̀, bí
gbogbo ààyè mìíràn, ìtọ́sọ́nà Ctrl+F rẹ̀ sì ń yẹra títí tí o bá fi í
sílẹ̀ ní òfo.
"""

["2026-09-29-1612-tasks-board-rows"]
title = "Gbogbo àtòjọ iṣẹ́ ń hàn"
text = """
“Gbogbo iṣẹ́” ti ń fi àtòjọ púpọ̀ hàn lẹ́gbẹ̀ẹ́ ara wọn báyìí bí fèrèsé
ṣe gbà tó, pẹ̀lú àwọn ìlà mìíràn nísàlẹ̀, kí gbogbo àtòjọ lè dé. Àtòjọ
tuntun máa ń yí wá sójú ní kété tí o bá ṣe é.
"""

["2026-09-29-1653-smooth-attachment-paging"]
title = "Yíyí láàárín àwọn àsomọ́ láìsí ìdíwọ́"
text = """
Lílọ sí àsomọ́ tó kàn tàbí èyí tó ṣáájú nínú olùwò pẹ̀lú àwọn ọfà kò tún
ń ṣẹ́jú mọ́. Olùwò máa ń wà ní ṣíṣí, fáìlì tó kàn sì máa ń gba ipò èyí
tó ṣáájú ní kété tí ó bá ti ṣetán.
"""

["2026-09-29-1656-drag-notes"]
title = "Fà àwọn àkọsílẹ̀ sí ètò"
text = """
Fà àkọsílẹ̀ kan lórí pátákó Àkọsílẹ̀ láti gbé e, bí ti Keep. Àwọn
àkọsílẹ̀ yòókù máa ń yọ̀ sẹ́gbẹ̀ẹ́ láti fi ààyè sílẹ̀, ó sì máa ń dúró
síbi tí o jù ú sí. Ctrl+Z máa ń dá a padà. Àwọn káàdì ti ń jókòó dáadáa
nínú àwọn ọ̀wọ̀n wọn báyìí, láìsí àlàfo lábẹ́ àwọn àkọsílẹ̀ kúkúrú.
"""

["2026-09-29-1707-calendar-right-click"]
title = "Títẹ̀ ọ̀tún lórí Kàlẹ́ńdà"
text = """
Tẹ ọ̀tún lórí àkókò tàbí ọjọ́ tí ó ṣófo láti fi ìṣẹ̀lẹ̀, àkókò ìfọkànsìn
tàbí àkókò tí o kò sí ní ọ́fíìsì kún ibẹ̀. Tẹ ọ̀tún lórí ìṣẹ̀lẹ̀ kan
láti ṣàtúnṣe rẹ̀, ṣe ẹ̀dà rẹ̀, pa á rẹ́, fèsì, darapọ̀, fi lẹ́tà ránṣẹ́
sí àwọn àlejò, fún un ní àwọ̀ tàbí gbé e lọ sí kàlẹ́ńdà mìíràn, àti lórí
iṣẹ́ kan láti sàmì sí i pé ó ti parí, fi ìràwọ̀ sí i, fún un ní ọjọ́
mìíràn tàbí pa á rẹ́. Dá padà ń dá àyípadà kan padà.
"""

["2026-09-29-1725-pdf-notes-and-text"]
title = "Àkọsílẹ̀ àti ọ̀rọ̀ lórí PDF"
text = """
Sísàmì sí PDF ní àkọsílẹ̀ alálẹ̀mọ́ àti àpótí ọ̀rọ̀ báyìí: tẹ ojú-ìwé
náà, tẹ ọ̀rọ̀, kí o sì tẹ Ctrl+Enter. Gbé atọ́ka lé àkọsílẹ̀ kan láti
kà á, tàbí tẹ̀ ẹ́ láti yí i padà. Fèsì ń fi ẹ̀dà tí o sàmì sí ránṣẹ́
padà tààrà nínú èsì sí ìfiránṣẹ́ náà.
"""

["2026-09-29-1657-tasks-drag-to-place"]
title = "Fa àwọn iṣẹ́ sí ibi tí o fẹ́"
text = """
Fa iṣẹ́ kan sókè tàbí sísàlẹ̀ nínú àtòjọ rẹ̀, tàbí sínú àtòjọ mìíràn,
àwọn iṣẹ́ tó wà níbẹ̀ á sì yẹ̀ sẹ́gbẹ̀ẹ́ láti fi ibi tí yóò bọ́ sí hàn.
Google Tasks ń pa ètò tuntun mọ́ lórí fóònù rẹ náà, Dá padà sì ń dá
iṣẹ́ náà padà sí ààyè rẹ̀.
"""

["2026-09-29-1719-calendar-task-tab"]
title = "Fi iṣẹ́ kún un láti Kàlẹ́ńdà"
text = """
Káàdì ìṣẹ̀lẹ̀ tuntun ní táàbù Iṣẹ́, bíi ti Google Calendar. Tẹ àkókò
kan, yan Iṣẹ́, àkọlé, ọjọ́ àti àkókò á sì di iṣẹ́ kan nínú àtòjọ tí
o yàn, pẹ̀lú àpèjúwe tí o bá fẹ́.
"""

["2026-09-29-1758-calendar-new-task-here"]
title = "Fi iṣẹ́ kún un láti Kàlẹ́ńdà"
text = """
Tẹ ọ̀tún lórí àkókò tàbí ọjọ́ tí ó ṣófo lórí Kàlẹ́ńdà kí o sì yan Iṣẹ́
láti fi iṣẹ́ kan kún ibẹ̀. Káàdì ìṣẹ̀lẹ̀ tuntun á ṣí sí táàbù Iṣẹ́ rẹ̀,
pẹ̀lú ọjọ́ àti àkókò náà tí a ti kọ sínú rẹ̀.
"""

["2026-09-30-0113-calendar-server-unreachable"]
title = "Àwọn kàlẹ́ńdà tún ń wò lẹ́yìn sáfà tó lọ́ra"
text = """
Nígbà tí sáfà kàlẹ́ńdà àkọọ́lẹ̀ kan kò bá dáhùn lásìkò, Kàlẹ́ńdà ti ń sọ
bẹ́ẹ̀ báyìí, àti bóyá ìsopọ̀ ni tàbí ìbọwọ́ ààbò ló dúró, dípò "A kò rí
kàlẹ́ńdà kankan". Ó tún ń gbìyànjú láàrín ìṣẹ́jú díẹ̀ dípò wákàtí.
"""

["2026-09-30-0123-contact-files-fill"]
title = "Àwọn fáìlì olùbásọ̀rọ̀ ń fi ìgbàsílẹ̀ wọn hàn"
text = """
Fáìlì kan nínú pánẹ́ẹ̀lì olùbásọ̀rọ̀ tí lẹ́tà rẹ̀ kò tíì sí lórí kọ̀ǹpútà yìí ti ń kún báyìí bí ó ṣe ń gbà sílẹ̀, bí àwọn àfikún inú àkójọ ṣe ń ṣe, lẹ́yìn náà ó ṣí.
"""
