Nígbà tí èsì tàbí ìfiránṣẹ́-síwájú bá ṣì wà ní òfo, àmì ìtànná lẹ́gbẹ̀ẹ́ Ìgúnrege (tàbí Ctrl+J) ń kọ ọ́ fún ọ. Yan ọ̀kan nínú èrò mẹ́ta tí a mú láti inú ìjíròrò náà, tàbí sọ ohun tí ó yẹ kí ó sọ ní ọ̀rọ̀ tìrẹ, lẹ́yìn náà tẹ Fi sínú láti fi àkọ̀pamọ́ náà sínú, kí o sì yí ohun tí o bá fẹ́ padà. Ní kété tí o bá tẹ̀wé, àmì ìtànná á tún máa sọ ọ́ lọ́nà míì. Ó nílò ìrànlọ́wọ́ kíkọ̀wé pẹ̀lú AI ní títàn nínú Ètò > Kíkọ̀wé.
"""

