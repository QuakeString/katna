title = "Lẹ́tà tí a ṣètò ń lọ bí kọ̀ǹpútà rẹ tilẹ̀ wà ní pípa"
text = """
Nígbà tí sáfà lẹ́tà rẹ bá lè di lẹ́tà mú títí di àkókò kan, bí Stalwart
ṣe lè ṣe, Ṣètò fífiránṣẹ́ yóò fi ìfiránṣẹ́ náà lé e lọ́wọ́ báyìí lẹ́yìn tí
Dá padà bá ti lọ, kí ó lè lọ lásìkò bí kọ̀ǹpútà yìí bá tilẹ̀ wà ní pípa.
Mẹ́nù ìṣètò máa ń sọ bóyá sáfà lẹ́tà rẹ ni tàbí Katna ni yóò fi ránṣẹ́.
"""

["2026-09-27-1730-softer-row-hover"]
title = "Ìtọ́ka tó fúyẹ́ jù"
text = """
Ìlà tó wà lábẹ́ atọ́ka nínú àkójọ lẹ́tà ti ń gbéra sókè báyìí pẹ̀lú
òjìji bàìbàì, bí ó ṣe rí nínú Gmail, dípò ẹ̀gbẹ́ dúdú kan nísàlẹ̀ rẹ̀.
"""

["2026-09-27-1745-drag-recipients"]
title = "Fa àwọn àdírẹ́sì láàrin Sí, Ẹ̀dà àti Ẹ̀dà àṣírí"
text = """
Fa ṣíìpù àdírẹ́sì kan lọ sí pápá mìíràn láti gbé e lọ; Ẹ̀dà àti Ẹ̀dà
àṣírí máa ń ṣí nígbà tí o bá ń fà á, kódà bí wọ́n bá farapamọ́. Títọ́ka
sí ṣíìpù kan máa ń fi x kan hàn tí ó ń yọ ọ́ kúrò.
"""

["2026-09-27-1722-katna-account"]
title = "Àkáǹtì Katna"
text = """
Ètò > Ìforúkọsílẹ̀ ń jẹ́ kí o ṣẹ̀dá àkáǹtì lórí sáfà Katna fúnra rẹ̀,
pẹ̀lú ọ̀rọ̀ aṣínà tirẹ̀, kì í ṣe ọ̀rọ̀ aṣínà lẹ́tà láé. Àwọn ẹ̀yà orí
ayélujára Katna, bí ìwé-ẹ̀rí kíkà àti títọpa ìjápọ̀, máa nílò rẹ̀. O lè
rí àwọn kọ̀ǹpútà tó ti wọlé, kí o sì mú èyíkéyìí nínú wọn jáde.
"""

["2026-09-27-1805-reopens-as-you-left-it"]
title = "Padà sí ibi tí o wà"
text = """
Pípa Katna Mail dé àti ṣíṣí i padà máa ń dá ohun èlò, fódà àti táàbù
àpótí-ìwọlé tí o ṣí padà, pẹ̀lú àwọn fódà tí o ti ṣí sílẹ̀ àti bóyá
pánẹ́ẹ̀lì fódà ti ká. Jíjáde kúrò nínú Katna láti inú tìréè máa ń bẹ̀rẹ̀
rẹ̀ lọ́tun.
"""

["2026-09-27-1724-snooze-and-reminders"]
title = "Sún síwájú àti ìránnilétí èsì"
text = """
Sún ìjíròrò síwájú pẹ̀lú aago tó wà lórí ìlà rẹ̀ tàbí láti inú mẹ́nù
títẹ̀ apá ọ̀tún: ó máa dúró nínú fódà Tí a sún síwájú, á sì padà sí
Àpótí-ìwọlé, láìkà, ní àkókò tí o yàn. Nígbà tí o bá ń fi ránṣẹ́, ọfà
tó wà lẹ́gbẹ̀ẹ́ Fi ránṣẹ́ lè rán ọ létí tí kò bá sí ẹni tó fèsì láàárín
ọjọ́ 1, 3 tàbí 7. Méjèèjì ń ṣiṣẹ́ nígbà tí kọ̀ǹpútà rẹ bá wà ní títàn,
wọ́n sì máa ń ṣe ohun tí wọ́n pàdánù lẹ́yìn tí ó bá jí.
"""

["2026-09-27-1717-translate-mail"]
title = "Ka lẹ́tà ní èdè rẹ"
text = """
Ìfiránṣẹ́ ní èdè mìíràn ti ń fi bọ́tìnnì Túmọ̀ hàn lókè rẹ̀ báyìí, Fi ti
àtilẹ̀wá hàn sì máa ń dá a padà. Katna máa ń dá èdè mọ̀ lórí kọ̀ǹpútà rẹ;
kìkì nígbà tí o bá béèrè ni ọ̀rọ̀ ìfiránṣẹ́ náà máa ń lọ sí sáfà Katna
fúnra rẹ̀ fún ìtúmọ̀. Ètò > Gbogbogbò > Ìtúmọ̀ ni o ti lè yan èdè rẹ àti
àwọn tí a ó máa túmọ̀ nígbà gbogbo.
"""

["2026-09-27-1744-open-and-click-tracking"]
title = "Wo ìgbà tí a ṣí lẹ́tà"
text = """
Tan ojú tó wà lẹ́gbẹ̀ẹ́ àwọn olùgbà láti rí ìgbà tí ẹnìkọ̀ọ̀kan bá ṣí
ìfiránṣẹ́ rẹ tàbí tẹ̀lé ìjápọ̀ kan nínú rẹ̀, tàbí béèrè ìwé-ẹ̀rí kíkà dípò
bẹ́ẹ̀. Lẹ́tà tí a fi ránṣẹ́ máa ń fi ẹni tó ṣí i hàn, ìfitónilétí kan sì
máa sọ fún ọ ní ìgbà àkọ́kọ́. Méjèèjì wà ní pípa fún gbogbo ìfiránṣẹ́
tuntun, títọpa sì nílò àkáǹtì Katna (Ètò > Ìforúkọsílẹ̀).
"""

["2026-09-27-2042-activity"]
title = "Ìgbòkègbodò fún lẹ́tà tí a ń tọpa"
text = """
Ìgbòkègbodò lẹ́gbẹ̀ẹ́ àpótí àwárí máa ń fi iye ìfiránṣẹ́ rẹ tí a ń tọpa
tí a ti ṣí hàn, àti bí a ṣe ń tẹ̀lé àwọn ìjápọ̀ wọn tó, pẹ̀lú àwọn àkọlé
rẹ tí a tò lẹ́sẹẹsẹ gẹ́gẹ́ bí a ṣe ń ṣí wọn tó.
"""

["2026-09-27-2204-search-trigger-words"]
title = "Ṣàwárí lẹ́tà rẹ láti inú KRunner pẹ̀lú k"
text = """
Tẹ k tàbí m, àlàfo kan, lẹ́yìn náà ohun tí o fẹ́ wá nínú KRunner tàbí
àwárí GNOME láti rí àbájáde kan náà bí ti àpótí àwárí Katna Mail, bí
àpẹẹrẹ “k budget”. Yan àwọn ọ̀rọ̀ tìrẹ nínú Ètò > Gbogbogbò.
"""

["2026-09-27-2224-activity-button"]
title = "Ìgbòkègbodò lẹ́gbẹ̀ẹ́ àpótí àwárí"
text = """
Bọ́tìnnì Ìgbòkègbodò lẹ́gbẹ̀ẹ́ àpótí àwárí máa ń ka ṣíṣí àti títẹ̀ tuntun
lórí lẹ́tà rẹ tí a ń tọpa, ó sì máa ń fi ẹni tó ṣí kí ni àti àwọn ìjápọ̀
tí wọ́n tẹ̀lé hàn; tẹ ọ̀kan láti ṣí ìfiránṣẹ́ yẹn. Àlàyé máa ń fi ìwọ̀n
ṣíṣí àti títẹ̀, ṣíṣí lójoojúmọ́ àti àwọn àkọlé rẹ tó dára jù hàn fún ọjọ́
7 tàbí 30 sẹ́yìn, gbogbo ìgbà tàbí àwọn ọjọ́ tí o yàn. Ìfiránṣẹ́ tí a fi
ránṣẹ́ ti ń fi iye ìgbà tí ẹnìkọ̀ọ̀kan ṣí i àti tẹ̀lé ìjápọ̀ hàn báyìí.
"""

["2026-09-27-2239-mailbox-insights"]
title = "Òye nípa àpótí lẹ́tà"
text = """
Ìgbòkègbodò > Àlàyé tún ń fi iye lẹ́tà tí o fi ránṣẹ́ àti tí o gbà ní
àkókò náà hàn báyìí, bí ìwọ àti àwọn míì ṣe ń dáhùn lóòrèkóòrè àti bí ó
ṣe yára tó, àwọn tí o ń kọ̀wé sí jù, àti àwọn ọjọ́ àti wákàtí tí lẹ́tà rẹ
máa ń dé. A ń kà á lórí kọ̀ǹpútà rẹ láti inú lẹ́tà tí Katna ti ní tẹ́lẹ̀.
"""

["2026-09-28-0059-sign-in-with-google"]
title = "Wọlé pẹ̀lú Google tàbí Microsoft"
text = """
Ṣàfikún àkáǹtì Gmail tàbí Outlook nípa wíwọlé lórí ojú-ìwé Google tàbí
Microsoft fúnra wọn nínú aṣàwákiri rẹ, láìsí ọ̀rọ̀ aṣínà áàpù. Àwọn
àdírẹ́sì Outlook.com àti Hotmail náà ń ṣiṣẹ́ báyìí. Bí wíwọlé bá dẹ́kun
iṣẹ́, àkíyèsí kan ní ìsàlẹ̀ fèrèsé yóò fún ọ láǹfààní láti tún wọlé.
"""

["2026-09-28-0054-tracking-on-by-default"]
title = "Títọpa àti ìwé-ẹ̀rí ti wà ní títàn láti ìbẹ̀rẹ̀"
text = """
Àwọn ìfiránṣẹ́ tuntun àti àwọn èsì ti ń bẹ̀rẹ̀ báyìí pẹ̀lú títọpa ṣíṣí
àti títẹ̀, ìwé-ẹ̀rí kíkà àti ìwé-ẹ̀rí ìfijíṣẹ́ ní títàn; tẹ bọ́tìnnì kan
lẹ́gbẹ̀ẹ́ àwọn olùgbà láti pa ọ̀kan nínú wọn fún ìfiránṣẹ́ náà. Títọpa
nílò kí o ti wọlé sí àkáǹtì Katna rẹ. Ìwé-ẹ̀rí ìfijíṣẹ́ jẹ́ ímeèlì tí
sáfà lẹ́tà rẹ ń fi ránṣẹ́ sí ọ nígbà tí sáfà olùgbà kọ̀ọ̀kan bá gba
ìfiránṣẹ́ náà; bọ́tìnnì náà máa ń ṣú níbi tí sáfà lẹ́tà rẹ kò ti pèsè
wọn.
"""

["2026-09-28-0120-delivered-read-ticks"]
title = "Àmì fún lẹ́tà tó dé àti tí a kà"
text = """
Lẹ́tà tí o fi ránṣẹ́ ti ń fi àmì hàn báyìí lẹ́gbẹ̀ẹ́ olùgbà kọ̀ọ̀kan.
Àmì eérú kan túmọ̀ sí pé sáfà lẹ́tà wọn ti gbà á: láti inú ìwé-ẹ̀rí
ìfijíṣẹ́, tàbí, níbi tí iṣẹ́ lẹ́tà rẹ kò ti fi í ránṣẹ́ (Gmail), nígbà
tí kò sí lẹ́tà ìpadàbọ̀ tó padà láàárín ààbọ̀ wákàtí. Àmì méjì ní àwọ̀
àfihàn rẹ túmọ̀ sí pé wọ́n ti kà á, láti inú ìwé-ẹ̀rí kíkà tàbí títọpa
ṣíṣí, ìkìlọ̀ sì túmọ̀ sí pé ó padà. Tọ́ka sí àmì kan láti rí ìgbà àti bí
ó ṣe ṣẹlẹ̀. Àwọn ímeèlì ìwé-ẹ̀rí máa ń wà nínú àpótí lẹ́tà rẹ lábẹ́
Ìmúdójúìwọ̀n, láìsí ìfitónilétí.
"""

["2026-09-28-0143-gmail-new-mail-notifications"]
title = "Ìfitónilétí fún lẹ́tà Gmail tuntun"
text = """
Lẹ́tà tuntun nínú àpótí-ìwọlé Gmail ti ń fi ìfitónilétí hàn lẹ́ẹ̀kan sí
i báyìí. Tẹ́lẹ̀, Katna máa ń pàdánù lẹ́tà tí Gmail fi sí Gbogbo lẹ́tà ní
ìṣẹ́jú díẹ̀ ṣáájú àpótí-ìwọlé.
"""

["2026-09-28-0156-attachment-types"]
title = "Wá nípa irú àfikún"
text = """
Nínú Àwọn àṣàyàn àwárí, “Ní àfikún” ń fúnni ní PDF, XLSX, ODF, XLS, ODS,
PPT àti PPTX báyìí, àti “Àdáni” fún ìtẹ̀síwájú fáìlì mìíràn, bí png tàbí
avif. Méèlì tí ó ní àfikún irú tí a yàn nìkan ló ń hàn.
"""

["2026-09-28-0106-original-colors"]
title = "Àwọn àwọ̀ ìpilẹ̀ nínú àwọ̀ ìrísí òkùnkùn"
text = """
Nínú àwọ̀ ìrísí òkùnkùn, lẹ́tà tí ó ní àwọ̀ tirẹ̀ máa hàn ní àwọ̀ òkùnkùn.
Bọ́tìnnì ìdajì àyíká tuntun lórí pátákó irinṣẹ́ pánẹ́ẹ̀lì kíkà máa fi í hàn
ní àwọ̀ ìpilẹ̀ ẹni tó rán an, àti padà.
"""

["2026-09-28-0127-print-as-shown"]
title = "Ìtẹ̀jáde máa pa ìṣàtúnṣe mọ́"
text = """
Lẹ́tà máa tẹ̀ jáde bí ó ṣe hàn nínú pánẹ́ẹ̀lì kíkà, pẹ̀lú àwọn tábìlì, àwọ̀,
ààlà, àkójọ àti àwòrán rẹ̀. Àwòtẹ́lẹ̀ ìtẹ̀jáde lè fi àwọn àwọ̀ ẹ̀yìn sílẹ̀
láti dín inki kù, tàbí kí ó tẹ ọ̀rọ̀ nìkan jáde pẹ̀lú Ọ̀rọ̀ nìkan.
"""

["2026-09-28-0141-ask-before-deleting"]
title = "Bèèrè kí o pa á rẹ́"
text = """
Pípa ìjíròrò púpọ̀ rẹ́ lẹ́ẹ̀kan náà yóò kọ́kọ́ bèèrè bóyá kí a gbé wọn lọ sí
Ìdọ̀tí. Sàmì sí “Má bèèrè mọ́” láti fo ìbéèrè náà, tàbí tàn án padà nínú
Ètò > Gbogbogbò. Pípa rẹ́ títí láé, nínú Ìdọ̀tí, máa bèèrè nígbà gbogbo.
"""

["2026-09-28-0019-katna-for-windows"]
title = "Katna fún Windows"
text = """
Katna Mail ti ń ṣiṣẹ́ lórí Windows 10 àti 11 pẹ̀lú báyìí, tí a ń fi Katna
Setup tirẹ̀ ṣètò rẹ̀, pẹ̀lú àmì-àwòrán àtẹ, ìfitónilétí, bíbẹ̀rẹ̀ nígbà
ìwọlé àti ìjápọ̀ lẹ́tà tí ń ṣí nínú Katna.
"""

["2026-09-28-0236-chip-remove-always"]
title = "Bọ́tìnnì yíyọ kúrò lórí gbogbo àdírẹ́sì"
text = """
Ṣíìpù àdírẹ́sì kọ̀ọ̀kan nínú Sí, Ẹ̀dà àti Ẹ̀dà àṣírí ti ń fi x rẹ̀ hàn nígbà
gbogbo báyìí, kí o lè yọ ọ́ kúrò láìkọ́kọ́ tọ́ka sí i.
"""

["2026-09-28-0244-pill-format-bar"]
title = "Ọ̀pá ìgúnrege tó rí roboto jù"
text = """
Ọ̀pá ìgúnrege nínú Kọ̀wé (Aa) ti rí bí òògùn kóró báyìí pẹ̀lú etí tó ṣe
bàìbàì, kí ó lè dá yàtọ̀ sí ọ̀rọ̀ rẹ nínú àkòrí ìmọ́lẹ̀ àti òkùnkùn.
"""

["2026-09-28-0325-long-threads-smooth"]
title = "Ẹ̀wọ̀n ímeèlì gígùn ń ṣí kíákíá"
text = """
Lẹ́tà onígúnrege tó fa ọ̀pọ̀ èsì àtẹ̀yìnwá yọ, bí ẹ̀wọ̀n ìfàyọ gígùn, ti ń
ṣí lẹ́sẹ̀kẹsẹ̀ báyìí, ó sì ń yí lọ geerege dípò kí ó dín gbogbo fèrèsé kù ní
ìyára.
"""

["2026-09-28-0830-who-has-seen-it"]
title = "Ẹni tó ti rí i, lẹ́yìn ojú kan"
text = """
Lẹ́tà tí o fi ránṣẹ́ pẹ̀lú títọpa kò ní àpótí ìlà lókè rẹ̀ mọ́. Ojú kan
lẹ́gbẹ̀ẹ́ ìràwọ̀ máa ń di àwọ̀ àfihàn rẹ ní kété tí ẹnìkan bá ṣí i; tọ́ka sí
i láti rí ẹni tó ṣí i tàbí tẹ̀lé ìjápọ̀ kan, àti ìgbà wo.
"""

["2026-09-28-0831-contact-call-copy"]
title = "Pè kí o sì ṣe ẹ̀dà láti inú àlàyé olùbásọ̀rọ̀"
text = """
Nínú àlàyé olùbásọ̀rọ̀ lẹ́gbẹ̀ẹ́ ìjíròrò kan, tẹ nọ́mbà fóònù kan láti pè é
pẹ̀lú áàpù fóònù rẹ tàbí KDE Connect, tàbí lo bọ́tìnnì ẹ̀dà lẹ́gbẹ̀ẹ́ rẹ̀.
Gbogbo ọ̀rọ̀ inú pánẹ́ẹ̀lì náà ni o tún lè yàn kí o sì ṣe ẹ̀dà rẹ̀ báyìí.
"""

["2026-09-28-0848-quoted-text-hide-remove"]
title = "Fi lẹ́tà tí a fà yọ pamọ́ tàbí yọ ọ́ kúrò nínú èsì"
text = """
Bọ́tìnnì "..." lábẹ́ èsì kan ti ń fi lẹ́tà tí a fà yọ pamọ́ padà báyìí
lẹ́yìn tí o bá ṣí i. Tọ́ka sí i kí o sì tẹ x ní igun rẹ̀ láti yọ lẹ́tà tí a
fà yọ kúrò nínú èsì rẹ; Dá padà tàbí Ctrl+Z ń dá a padà. Ọ̀pá irinṣẹ́ èsì
náà tún ń dúró sí ààyè rẹ̀ bí o ṣe ń yí lọ.
"""

["2026-09-28-0854-floating-folders"]
title = "Fódà tí ń léfòó, àti àwárí tó fẹ̀ jù"
text = """
Nígbà tí àwọn fódà bá pamọ́, gbígbé atọ́ka lé Kọ̀wé tàbí Lẹ́tà ń ṣí wọn bí
pánẹ́ẹ̀lì tó jìnnà sí àwọn etí, pẹ̀lú ṣóńṣó kékeré tó tọ́ka sí bọ́tìnnì náà.
Àpótí àwárí ń fẹ̀ láti kún ààyè tí àwọn fódà fi sílẹ̀, títẹ fódà tí o ti wà
nínú rẹ̀ kò sì ń mú kí àkójọ náà ṣẹ́jú mọ́.
"""

["2026-09-28-0928-search-address-suggestions"]
title = "Àbá àdírẹ́sì nínú Àwọn àṣàyàn àwárí"
text = """
Láti ọ̀dọ̀ àti Sí nínú Àwọn àṣàyàn àwárí ti ń dábàá àdírẹ́sì báyìí bí o ṣe ń
tẹ̀wé, bí Sí, Ẹ̀dà àti Ẹ̀dà àṣírí ṣe ń ṣe nínú Kọ̀wé. Yan ọ̀kan pẹ̀lú Enter,
Tab tàbí títẹ̀.
"""

["2026-09-28-0935-app-menu-reply-all-window"]
title = "Mẹ́nù pàtàkì nínú káàdì àkáǹtì, Fèsì sí gbogbo ní fèrèsé tirẹ̀"
text = """
Káàdì àkáǹtì ní bọ́tìnnì ☰ lẹ́gbẹ̀ẹ́ Ṣàkóso àwọn àkáǹtì. Ó ń ṣí àwọn mẹ́nù
