["2026-10-02-0111-chat-pin-text"]
title = "Lẹ̀ ọ̀rọ̀ díẹ̀ láti inú ìtàkùrọ̀sọ mọ́ òkè"
text = """
Nínú ìtàkùrọ̀sọ (Ètò > Àdánwò), a lè yan ọ̀rọ̀ inú àpò ọ̀rọ̀ kan kí a sì dà á kọ báyìí bí lẹ́tà èyíkéyìí. Tẹ àwọn ọ̀rọ̀ tí o yàn nínú àpò ọ̀rọ̀ kan ní apá ọ̀tún kí o sì yan Lẹ̀ mọ́ òkè láti pa wọ́n mọ́ nínú ọ̀pá ohun tí a lẹ̀ mọ́ ti ìtàkùrọ̀sọ náà.
"""

["2026-10-02-0124-event-editor-clear"]
title = "Olóòtú ìṣẹ̀lẹ̀ kò ní Ìṣẹ̀lẹ̀ tuntun lórí mọ́"
text = """
