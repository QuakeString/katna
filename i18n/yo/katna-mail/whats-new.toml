text = """
Nínú ìtàkùrọ̀sọ (Ètò > Àdánwò), gbé ìtọ́ka sórí àpò ọ̀rọ̀ kan kí o sì tẹ pínnì, tàbí tẹ fáìlì kan ní apá ọ̀tún, láti pa á mọ́ lókè. Ọ̀pá tín-ínrín lábẹ́ àkọlé ń fi àwọn ohun tí o lẹ̀ mọ́ hàn: tẹ ẹ́ láti fò sí ọ̀kọ̀ọ̀kan ní ìtẹ̀léra, tàbí ṣí àkójọ láti fà wọ́n sí ìtòlẹ́sẹẹsẹ tàbí yọ wọ́n kúrò. Àwọn ohun tí a lẹ̀ mọ́ ń wà lórí kọ̀ǹpútà yìí.
"""

["2026-10-01-1655-chat-signatures"]
title = "Ìtàkùrọ̀sọ ń yọ ìbuwọ́lù àti ọ̀rọ̀ ìsàlẹ̀ sílẹ̀"
text = """
Àwọn àpò ọ̀rọ̀ ìtàkùrọ̀sọ ń fi ohun tí àwọn ènìyàn kọ nìkan hàn báyìí. Ọ̀rọ̀ ìdágbére bí "Best regards", ìbuwọ́lù ilé-iṣẹ́ lábẹ́ ìlà tàbí pẹ̀lú àdírẹ́sì àti nọ́mbà fóònù, àti ọ̀rọ̀ ìsàlẹ̀ pẹ̀lú ìjápọ̀ yíyọ orúkọ kúrò tàbí àkíyèsí ń dúró lẹ́yìn àmì ···, pẹ̀lú ìbuwọ́lù tí ẹnìkan ń tún kọ nínú gbogbo lẹ́tà.
"""

["2026-10-01-1805-blur-amount"]
title = "Yan bí àwọn mẹ́nù oníkùrukùru ṣe rí"
text = """
Àwọn mẹ́nù àti àpótí ìbánisọ̀rọ̀ oníkùrukùru ti mọ́ kedere sí i báyìí, wọ́n sì ń tẹ̀lé agbára ìṣúmọ́ KDE. Tan Ìwọ̀n ìṣúmọ́ àdáni nínú Ètò, Àdánwò, Ìṣúmọ́ láti ṣètò agbára ìṣúmọ́ àti àìríkọjá fúnra rẹ.
