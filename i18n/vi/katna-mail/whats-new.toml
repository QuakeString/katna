text = """
Để con trỏ trên một từ bị gạch chân, hoặc nhấp vào nó, và các gợi ý sửa
hiện ngay bên dưới: gợi ý chính tả, sửa ngữ pháp và Bỏ qua, trong nội
dung và tiêu đề. Nhấp chuột phải vẫn mở menu đầy đủ.
"""

["2026-09-27-1201-recipient-chips"]
title = "Người nhận hiện dưới dạng thẻ"
text = """
Địa chỉ trong Tới, Cc và Bcc trở thành các thẻ chỉ hiện tên. Mũi tên
trên thẻ cho xem địa chỉ của thẻ, và nhấp đúp để sửa. Những gì không
phải là địa chỉ hợp lệ sẽ được đánh dấu màu đỏ, và Gửi sẽ yêu cầu bạn
sửa trước.
"""

["2026-09-27-1253-start-at-login"]
title = "Katna khởi động khi đăng nhập"
text = """
Giờ đây Katna khởi động lặng lẽ khi bạn đăng nhập: thư được đồng bộ,
thông báo thư mới và biểu tượng ở khay xuất hiện mà không cần mở cửa sổ.
Tắt tính năng này, hoặc cho cửa sổ mở cùng, trong Cài đặt > Chung > Môi
trường máy tính.
"""

["2026-09-27-1215-paste-and-drop"]
title = "Dán và thả mọi thứ vào thư"
text = """
Văn bản sao chép từ Word, LibreOffice hay một trang web giữ nguyên phông
chữ, màu sắc và danh sách, còn các ô từ Excel, LibreOffice Calc hay
Google Sheets được đưa vào dưới dạng bảng. Một thanh nhỏ bên dưới phần
bạn vừa dán cho phép đổi nó thành bảng, ảnh hoặc văn bản thuần;
Ctrl+Shift+V dán văn bản thuần. Tệp được sao chép trong Dolphin hoặc kéo
vào thư sẽ được đính kèm, còn ảnh sẽ hỏi bạn muốn chèn vào nội dung hay
đính kèm.
"""

["2026-09-27-1300-new-logo"]
title = "Logo mới của Katna"
text = """
Katna giờ đã có logo riêng: chữ কাটনা trên một tấm thẻ đặt trên phong
bì. Bạn sẽ thấy nó trong menu ứng dụng, bảng điều khiển, khay, thanh
trên cùng và Giới thiệu về Katna.
"""

["2026-09-27-1335-account-names-pictures-order"]
title = "Tài khoản của bạn, theo cách của bạn"
text = """
Mỗi tài khoản giờ hiện chữ cái có màu riêng thay vì cùng một ảnh cho tất
cả. Trong Cài đặt > Tài khoản, bạn có thể chọn ảnh cho từng tài khoản,
đổi tên và sắp xếp các tài khoản theo thứ tự mình muốn bằng mũi tên hoặc
bằng cách kéo; ngăn thư mục và menu tài khoản sẽ theo thứ tự đó.
"""

["2026-09-27-0826-reset-cache"]
title = "Đặt lại bộ nhớ đệm"
text = """
Cài đặt > Chung > Đặt lại bộ nhớ đệm sẽ xóa thư Katna đã tải xuống, ảnh
người gửi và chỉ mục tìm kiếm, rồi tải xuống lại thư gần đây. Tiện khi
có gì đó trông lỗi thời hoặc để giải phóng dung lượng ổ đĩa; tài khoản,
cài đặt, thư nháp và thư của bạn trên máy chủ vẫn được giữ.
"""

["2026-09-27-1308-auto-advance"]
title = "Thư tiếp theo tự mở"
text = """
Xóa, lưu trữ hoặc di chuyển thư bạn đang đọc thì thư tiếp theo sẽ mở
ngay tại chỗ, thay vì ngăn đọc bị đóng lại. Hoàn tác sẽ đưa thư trở lại
và mở lại thư đó. Cài đặt > Chung > Tự động chuyển có thể mở thư trước
đó thay vào, hoặc quay lại danh sách.
"""

["2026-09-27-1348-quiet-row-markers"]
title = "Danh sách thư dịu mắt hơn"
text = """
Ô đánh dấu, dấu sao và điểm đánh dấu Quan trọng của mỗi thư giờ hiện mờ
và rõ hẳn lên khi bạn trỏ vào dòng đó, giống như trong Gmail. Thư đã
chọn, gắn dấu sao hoặc quan trọng luôn hiện đủ màu.
"""

["2026-09-27-1512-buy-me-a-coffee"]
title = "Mời tôi một ly cà phê"
text = """
Nếu Katna có ích với bạn, Giới thiệu về Katna giờ có nút Mời tôi một ly
cà phê.
"""

["2026-09-27-1615-from-row"]
title = "Chọn người gửi thư"
text = """
Thư mới giờ có hàng Từ bên dưới Tới. Nhấp vào mũi tên của hàng này để
gửi từ một tài khoản khác của bạn. Thư mới bắt đầu từ tài khoản đầu tiên
của bạn, trừ khi bạn chọn mặc định khác trong Cài đặt > Soạn thư > Gửi
thư mới từ.
"""

["2026-09-27-1621-unified-inbox"]
title = "Hộp thư đến hợp nhất"
text = """
Bật Cài đặt > Tài khoản > Hộp thư đến hợp nhất để xem thư của tất cả tài
khoản cùng lúc. “Tất cả tài khoản” nằm ở đầu ngăn thư mục với một Hộp
thư đến, Chưa đọc, Có gắn dấu sao, Quan trọng, Đã gửi, Thư nháp và nhiều
mục khác chung cho mọi tài khoản; mũi tên bên cạnh mỗi mục mở ra một
dòng cho từng tài khoản. Giờ đây tên của mỗi tài khoản có một mũi tên để
thu gọn các thư mục của nó.
"""

["2026-09-27-1627-right-click-move-and-not-spam"]
title = "Menu chuột phải phù hợp với từng thư mục"
text = """
Chọn một thư mục hoặc nhãn trong Di chuyển tới ở menu chuột phải giờ sẽ
chuyển thư, có Hoàn tác, kể cả từ kết quả tìm kiếm. Trong Thư rác, Báo
cáo thư rác đổi thành Không phải thư rác. Thùng rác có Chuyển vào Hộp
thư đến và Xóa vĩnh viễn, Lưu trữ có Chuyển vào Hộp thư đến, còn Thư
nháp và Đã gửi bỏ đi các mục không áp dụng ở đó.
"""

["2026-09-27-1633-drag-accounts"]
title = "Kéo tài khoản để sắp xếp"
text = """
Trong Cài đặt > Tài khoản, khi kéo một tài khoản, giờ cả hàng của nó
được nhấc lên và các tài khoản khác dạt sang bên để nhường chỗ. Chuyển
lên và Chuyển xuống hiện ra khi bạn trỏ vào một hàng.
"""

["2026-09-27-1637-drafts"]
title = "Thư nháp được giữ lại"
text = """
Đóng thư đang soạn giờ sẽ lưu nó vào Thư nháp, cả trên máy chủ thư của
bạn, như trong Gmail. Mở nó từ Thư nháp để viết tiếp. Chỉ nút thùng rác
mới bỏ nó đi, và Hoàn tác sẽ lấy lại.
"""

["2026-09-27-1609-many-attachments"]
title = "Chỗ cho nhiều tệp đính kèm"
text = """
Dù bạn đính kèm bao nhiêu tệp, danh sách giờ cuộn phía trên thanh Gửi
thay vì tràn đè lên nó, hiện tệp mới nhất, và cho biết có bao nhiêu tệp
cùng tổng dung lượng của chúng.
"""

["2026-09-27-1628-select-on-screen-first"]
title = "Chọn thư chưa đọc hoặc có gắn dấu sao, kiểu Gmail"
text = """
Đã đọc, Chưa đọc, Có gắn dấu sao và Không có dấu sao trong menu Chọn lại
đánh dấu chọn các thư khớp trên màn hình. Một dòng phía trên danh sách
đề nghị chọn mọi cuộc hội thoại khớp trong thư mục, và Bỏ chọn sẽ hoàn
tác việc đó.
"""

["2026-09-27-1632-leave-settings-by-folder"]
title = "Thư mục đưa bạn ra khỏi Cài đặt"
text = """
Khi Cài đặt đang mở, nhấp vào một thư mục hoặc biểu tượng Thư giờ sẽ
đóng Cài đặt và mở thư mục đó, như trong Gmail. Mũi tên Quay lại vẫn
hoạt động như trước.
"""

["2026-09-27-1641-drop-pictures-in-text"]
title = "Thả ảnh vào giữa văn bản"
text = """
Khi kéo một ảnh lên thư, một dấu nháy hiện ra ở chỗ ảnh sẽ được đặt, để
bạn có thể thả nó vào giữa câu. Các tệp khác vẫn hiện vùng thả dành cho
tệp đính kèm, và giờ việc thả vẫn hoạt động sau khi bạn đã gõ.
"""

["2026-09-27-1707-quick-quit"]
title = "Thoát là đóng ngay"
text = """
Thoát trong menu của biểu tượng ở khay không còn chờ những thư đang đồng
bộ hoặc đang được lập chỉ mục: Katna và biểu tượng ở khay đóng ngay lập
tức, phần còn lại sẽ tiếp tục vào lần tới Katna khởi động.
"""

["2026-09-27-1715-contact-panel"]
title = "Thông tin liên hệ bên cạnh thư"
text = """
Trong cửa sổ rộng, một thẻ bên cạnh cuộc hội thoại đang mở giờ hiện
thông tin người gửi: số điện thoại, chức danh và công ty lấy từ chữ ký
của họ, giờ hiện tại chỗ họ, lượng thư hai bên đã trao đổi, các cuộc hội
thoại gần đây và các tệp giữa bạn với họ. Nhấp vào một cuộc hội thoại
hoặc tệp để mở, hoặc vào một người khác trong cuộc hội thoại để xem
người đó. Thông tin chỉ được đọc từ thư của bạn trên máy tính này. Nút
liên hệ trên thanh công cụ của Ngăn đọc sẽ ẩn thẻ này.
"""

["2026-09-27-1640-storage-used"]
title = "Dung lượng đã dùng"
text = """
Khi máy chủ thư cho biết, phần dưới cùng của Ngăn thư mục sẽ hiện dung
lượng lưu trữ thư của tài khoản đã đầy đến đâu, chẳng hạn “Đã dùng 34%
trong 15 GB”.
"""

["2026-09-27-1651-desktop-search"]
title = "Tìm thư từ KRunner và tìm kiếm của GNOME"
text = """
Gõ một tên vào KRunner (Alt+Space) hoặc ô tìm kiếm Activities để viết
thư cho người đó, sao chép địa chỉ hoặc tìm thư của họ. Những thư có
tiêu đề hoặc người gửi chứa mọi từ bạn gõ sẽ hiện ra; hãy bắt đầu bằng
mail: để tìm trong toàn bộ thư, giống như trong ô tìm kiếm của Katna
Mail.
"""

["2026-09-27-1727-mail-templates"]
title = "Mẫu cho những thư bạn hay viết"
text = """
Viết thư một lần rồi lưu lại bằng nút Mẫu thư mới trong cửa sổ soạn thư,
sau đó chèn nó vào bất kỳ thư mới hay thư trả lời nào chỉ với một cú
nhấp. Viết {first name}, {name} hoặc {my name} và Katna sẽ điền chúng
cho từng người nhận. Sửa, đổi tên hoặc xóa mẫu thư trong Cài đặt > Soạn
thư.
"""

["2026-09-27-1724-server-send-later"]
title = "Thư hẹn giờ vẫn được gửi khi máy tính đã tắt"
text = """
Khi máy chủ thư của bạn có thể giữ thư đến một thời điểm định sẵn, như
Stalwart, Lên lịch gửi giờ sẽ giao thư cho máy chủ ngay khi Hoàn tác biến
mất, để thư đi đúng giờ kể cả khi máy tính này đã tắt. Menu lên lịch cho
biết máy chủ thư của bạn hay Katna sẽ gửi thư.
"""

["2026-09-27-1730-softer-row-hover"]
title = "Hiệu ứng trỏ chuột nhẹ nhàng hơn"
text = """
Dòng dưới con trỏ trong danh sách thư giờ nổi lên với một bóng mờ nhạt,
giống như trong Gmail, thay cho một dải tối bên dưới.
"""

["2026-09-27-1745-drag-recipients"]
title = "Kéo địa chỉ giữa Tới, Cc và Bcc"
text = """
Kéo thẻ địa chỉ sang trường khác để chuyển nó; Cc và Bcc sẽ mở ra khi
bạn kéo, kể cả khi đang ẩn. Trỏ vào thẻ sẽ hiện dấu x để xóa nó.
"""

["2026-09-27-1722-katna-account"]
title = "Tài khoản Katna"
text = """
Cài đặt > Gói đăng ký cho phép bạn tạo tài khoản trên máy chủ riêng
của Katna, với mật khẩu riêng, không bao giờ là mật khẩu thư. Các tính
năng trực tuyến của Katna, như xác nhận đã đọc và theo dõi liên kết, sẽ
cần đến tài khoản này. Bạn có thể xem các máy tính đang đăng nhập và
đăng xuất bất kỳ máy nào.
"""

["2026-09-27-1805-reopens-as-you-left-it"]
title = "Trở lại đúng chỗ cũ"
text = """
Đóng Katna Mail rồi mở lại sẽ đưa trở lại ứng dụng, thư mục và tab hộp
thư đến bạn đang mở, các thư mục bạn đã mở rộng và việc ngăn thư mục có
đang thu gọn hay không. Thoát Katna từ khay hệ thống sẽ khởi động lại từ
đầu.
"""

["2026-09-27-1724-snooze-and-reminders"]
title = "Tạm ẩn và nhắc khi chưa có trả lời"
text = """
Tạm ẩn một cuộc hội thoại bằng biểu tượng đồng hồ trên dòng của nó hoặc
từ menu chuột phải: cuộc hội thoại chờ trong thư mục Đã tạm ẩn và quay
lại Hộp thư đến, ở trạng thái chưa đọc, vào thời điểm bạn chọn. Khi gửi,
mũi tên bên cạnh nút Gửi có thể nhắc bạn nếu không ai trả lời trong vòng
1, 3 hoặc 7 ngày. Cả hai hoạt động khi máy tính đang bật, và làm bù phần
còn lại sau khi máy thức dậy.
"""

["2026-09-27-1717-translate-mail"]
title = "Đọc thư bằng ngôn ngữ của bạn"
text = """
Thư bằng ngôn ngữ khác giờ có nút Dịch ở phía trên, và Hiện bản gốc đưa
thư trở lại như cũ. Katna nhận biết ngôn ngữ ngay trên máy tính của bạn;
chỉ khi bạn yêu cầu, nội dung thư mới được gửi đến máy chủ riêng của Katna
để dịch. Cài đặt > Chung > Dịch cho bạn chọn ngôn ngữ của mình và những
ngôn ngữ luôn được dịch.
"""

["2026-09-27-1744-open-and-click-tracking"]
title = "Biết khi nào thư được mở"
text = """
Bật biểu tượng con mắt cạnh người nhận để thấy khi mỗi người mở thư của
bạn hoặc mở một liên kết trong thư, hoặc yêu cầu xác nhận đã đọc thay vào
đó. Thư đã gửi cho thấy ai đã mở, và một thông báo cho bạn biết ở lần đầu
tiên. Cả hai đều tắt với mọi thư mới, và việc theo dõi cần tài khoản Katna
(Cài đặt > Gói đăng ký).
"""

["2026-09-27-2042-activity"]
title = "Hoạt động của thư được theo dõi"
text = """
Hoạt động bên cạnh ô tìm kiếm cho thấy bao nhiêu thư được theo dõi của
bạn đã được mở và các liên kết trong đó được mở thường xuyên đến đâu,
kèm các tiêu đề của bạn xếp theo mức độ thường được mở.
"""

["2026-09-27-2204-search-trigger-words"]
title = "Tìm trong thư từ KRunner bằng k"
text = """
Gõ k hoặc m, một dấu cách, rồi điều cần tìm trong KRunner hoặc ô tìm
kiếm của GNOME để có cùng kết quả như ô tìm kiếm của Katna Mail, ví dụ
“k budget”. Chọn từ của riêng bạn trong Cài đặt > Chung.
"""

["2026-09-27-2224-activity-button"]
title = "Hoạt động bên cạnh ô tìm kiếm"
text = """
Nút Hoạt động bên cạnh ô tìm kiếm đếm các lượt mở và lượt nhấp mới
trên thư được theo dõi của bạn, đồng thời liệt kê ai đã mở thư nào và
đã mở những liên kết nào; nhấp vào một mục để mở thư đó. Chi tiết cho
thấy tỷ lệ mở và tỷ lệ nhấp, lượt mở theo ngày và các tiêu đề hiệu quả
nhất của bạn trong 7 hoặc 30 ngày qua, mọi lúc hoặc những ngày bạn
chọn. Thư đã gửi giờ cho thấy mỗi người đã mở thư và mở liên kết bao
nhiêu lần.
"""

["2026-09-27-2239-mailbox-insights"]
title = "Thông tin về hộp thư"
text = """
Hoạt động > Chi tiết giờ còn cho thấy bạn đã gửi và nhận bao nhiêu thư
trong khoảng thời gian đó, bạn và người khác trả lời thường xuyên và
nhanh đến đâu, những người bạn viết thư nhiều nhất, và thư của bạn đến
vào những ngày và giờ nào. Mọi thứ được đếm trên máy tính của bạn từ
những thư Katna đã có.
"""

["2026-09-28-0059-sign-in-with-google"]
title = "Đăng nhập bằng Google hoặc Microsoft"
text = """
Thêm tài khoản Gmail hoặc Outlook bằng cách đăng nhập trên trang riêng
của Google hoặc Microsoft trong trình duyệt, không cần mật khẩu ứng dụng.
Địa chỉ Outlook.com và Hotmail giờ cũng dùng được. Nếu việc đăng nhập
ngừng hoạt động, một ghi chú ở cuối cửa sổ sẽ đề nghị bạn đăng nhập lại.
"""

["2026-09-28-0054-tracking-on-by-default"]
title = "Theo dõi và xác nhận được bật ngay từ đầu"
text = """
Thư mới và thư trả lời giờ bắt đầu với tính năng theo dõi lượt mở và
lượt nhấp, xác nhận đã đọc và xác nhận đã chuyển phát được bật sẵn; nhấp
vào nút bên cạnh người nhận để tắt một mục cho thư đó. Theo dõi cần bạn
đăng nhập tài khoản Katna. Xác nhận đã chuyển phát là email mà máy chủ
thư của bạn gửi cho bạn khi máy chủ của mỗi người nhận nhận thư; nút sẽ
bị làm mờ nếu máy chủ thư của bạn không hỗ trợ.
"""

["2026-09-28-0120-delivered-read-ticks"]
title = "Dấu tích cho thư đã chuyển phát và đã đọc"
text = """
Thư bạn đã gửi giờ hiển thị dấu tích bên cạnh từng người nhận. Một dấu
tích xám nghĩa là máy chủ thư của họ đã nhận thư: dựa trên xác nhận đã
chuyển phát, hoặc, nơi dịch vụ thư của bạn không gửi xác nhận (Gmail),
khi không có thư trả về trong nửa giờ. Hai dấu tích màu nhấn của bạn
nghĩa là họ đã đọc thư, dựa trên xác nhận đã đọc hoặc theo dõi lượt mở,
còn một cảnh báo nghĩa là thư bị trả về. Trỏ vào dấu tích để xem khi nào
và bằng cách nào. Email xác nhận vẫn nằm trong hộp thư của bạn ở mục Cập
nhật, không có thông báo.
"""

["2026-09-28-0143-gmail-new-mail-notifications"]
title = "Thông báo cho thư Gmail mới"
text = """
Thư mới trong hộp thư đến Gmail giờ lại hiển thị thông báo. Trước đây
Katna bỏ lỡ thư mà Gmail xếp vào Tất cả thư ngay trước khi vào hộp thư
đến.
"""

["2026-09-28-0156-attachment-types"]
title = "Tìm theo loại tệp đính kèm"
text = """
Trong Tùy chọn tìm kiếm, “Có tệp đính kèm” giờ có PDF, XLSX, ODF, XLS,
ODS, PPT và PPTX, cùng Tùy chỉnh cho mọi đuôi tệp khác, như png hoặc
avif. Chỉ thư có tệp đính kèm thuộc loại đã chọn mới hiện ra.
"""

["2026-09-28-0106-original-colors"]
title = "Màu gốc trong chủ đề tối"
text = """
Với chủ đề tối, thư tự đặt màu riêng sẽ hiện bằng màu tối. Nút nửa hình
tròn mới trên thanh công cụ của ngăn đọc hiện thư bằng màu gốc của người
gửi, rồi trở lại.
"""

["2026-09-28-0127-print-as-shown"]
title = "Bản in giữ nguyên định dạng"
text = """
Thư được in đúng như khi xem trong ngăn đọc, với bảng, màu, đường viền,
danh sách và hình ảnh. Khi xem trước khi in, bạn có thể bỏ màu nền để
tiết kiệm mực, hoặc chỉ in phần chữ với Chỉ văn bản.
"""

["2026-09-28-0141-ask-before-deleting"]
title = "Hỏi trước khi xóa"
text = """
Xóa nhiều cuộc hội thoại cùng lúc giờ sẽ hỏi trước xem có chuyển chúng
vào Thùng rác không. Chọn “Không hỏi lại” để bỏ qua câu hỏi, hoặc bật lại
trong Cài đặt > Chung. Xóa vĩnh viễn, trong Thùng rác, thì luôn hỏi.
"""

["2026-09-28-0019-katna-for-windows"]
title = "Katna cho Windows"
text = """
Katna Mail giờ chạy được cả trên Windows 10 và 11, được cài bằng Katna Setup
riêng, có biểu tượng ở khay hệ thống, thông báo, tự khởi động khi đăng nhập
và mở liên kết thư trong Katna.
"""

["2026-09-28-0236-chip-remove-always"]
title = "Nút xóa trên mọi địa chỉ"
text = """
Mỗi thẻ địa chỉ trong Tới, Cc và Bcc giờ luôn hiện dấu x, để bạn có thể xóa
địa chỉ mà không cần trỏ vào nó trước.
"""

["2026-09-28-0244-pill-format-bar"]
title = "Thanh định dạng tròn hơn"
text = """
Thanh định dạng khi soạn thư (Aa) giờ có hình viên thuốc với viền mờ, nên
tách biệt khỏi phần chữ của bạn trong cả chủ đề sáng lẫn tối.
"""

["2026-09-28-0325-long-threads-smooth"]
title = "Chuỗi thư dài mở nhanh"
text = """
Thư có định dạng trích dẫn nhiều thư trả lời trước đó, như một chuỗi trích
dẫn dài, giờ mở ngay lập tức và cuộn mượt mà thay vì làm chậm cả cửa sổ.
"""

["2026-09-28-0830-who-has-seen-it"]
title = "Ai đã xem thư, sau một con mắt"
text = """
Thư bạn gửi có theo dõi không còn khung các dòng phía trên nữa. Con mắt cạnh
ngôi sao chuyển sang màu nhấn của bạn khi có người mở thư; trỏ vào đó để xem
ai đã mở thư hoặc mở liên kết, và vào lúc nào.
"""

["2026-09-28-0831-contact-call-copy"]
title = "Gọi và sao chép từ thông tin liên hệ"
text = """
Trong thông tin liên hệ bên cạnh cuộc hội thoại, nhấp vào số điện thoại để
gọi bằng ứng dụng điện thoại hoặc KDE Connect, hoặc dùng nút sao chép bên
cạnh. Toàn bộ chữ trong ngăn này giờ cũng có thể chọn và sao chép.
"""

["2026-09-28-0848-quoted-text-hide-remove"]
title = "Ẩn hoặc xóa thư được trích dẫn trong thư trả lời"
text = """
Nút “...” bên dưới thư trả lời giờ ẩn lại phần thư được trích dẫn sau khi
bạn mở nó. Trỏ vào nút và nhấp vào dấu x ở góc để bỏ phần thư được trích dẫn
khỏi thư trả lời; Hoàn tác hoặc Ctrl+Z sẽ đưa nó trở lại. Thanh công cụ của
thư trả lời cũng giữ nguyên vị trí khi bạn cuộn.
"""

["2026-09-28-0854-floating-folders"]
title = "Thư mục nổi và ô tìm kiếm rộng hơn"
text = """
Khi thư mục bị ẩn, đặt con trỏ lên Soạn thư hoặc Thư sẽ mở chúng thành một
bảng cách xa các cạnh, có một khấc nhỏ chỉ vào nút. Ô tìm kiếm giãn ra lấp
chỗ trống mà thư mục để lại, và nhấp vào thư mục bạn đang mở không còn làm
danh sách nhấp nháy.
"""

["2026-09-28-0928-search-address-suggestions"]
title = "Gợi ý địa chỉ trong Tùy chọn tìm kiếm"
text = """
Từ và Đến trong Tùy chọn tìm kiếm giờ gợi ý địa chỉ khi bạn gõ, giống như
Tới, Cc và Bcc khi soạn thư. Chọn một địa chỉ bằng Enter, Tab hoặc một cú
nhấp.
"""

["2026-09-28-0935-app-menu-reply-all-window"]
title = "Menu chính trong thẻ tài khoản, Trả lời tất cả trong cửa sổ riêng"
text = """
Thẻ tài khoản có nút ☰ bên cạnh Quản lý tài khoản. Nút này mở các menu Tệp,
Sửa, Xem, Đi tới, Thư, Cài đặt và Trợ giúp giống như menu toàn cục của môi
trường máy tính, dành cho những môi trường không hiển thị menu này. Trả lời
tất cả trên thông báo thư mới giờ mở cuộc hội thoại trong cửa sổ riêng, sẵn
sàng để gõ, và giữ nguyên cửa sổ chính.
"""

["2026-09-28-1011-tray-brings-window-forward"]
title = "Nhấp vào khay hệ thống và thông báo đưa Katna Mail lên trước"
text = """
Nhấp vào biểu tượng khay hệ thống, hoặc Mở Hộp thư đến, Thư mới hay Cài đặt
trong menu của nó, giờ đưa cửa sổ Katna Mail lên trước trên Wayland, kể cả
khi cửa sổ đang thu nhỏ hoặc nằm sau các cửa sổ khác. Nhấp vào thông báo thư
mới sẽ mở đúng thư đó, kể cả khi danh sách Hộp thư đến không hiển thị thư
ấy.
"""

["2026-09-28-1053-send-countdown-reply-in-place"]
title = "Gửi có đếm ngược, và thư trả lời ở lại trong cuộc hội thoại"
text = """
Sau khi nhấn Gửi, một vòng tròn thu nhỏ dần đếm ngược thời gian hoàn tác bên
cạnh Hoàn tác, rồi thông báo nhỏ hiện Đã gửi thư (kèm một âm thanh ngắn) khi
thư đã đi. Có thể tắt âm thanh này trong Cài đặt > Chung > Gửi thư. Thư trả
lời viết trong cuộc hội thoại trở thành một thư ngay tại chỗ bạn viết. Phần
đầu của thư chỉ cho biết thư gửi tới ai; nhấp vào để xem Từ, Tới, Cc và Bcc.
Mũi tên bên cạnh biểu tượng trả lời chuyển giữa Trả lời, Trả lời tất cả và
Chuyển tiếp, vẫn giữ nguyên những gì bạn đã viết.
"""

["2026-09-28-1110-search-options-narrow"]
title = "Tùy chọn tìm kiếm vừa với cửa sổ hẹp"
text = """
Trong cửa sổ hẹp hoặc thấp, Tùy chọn tìm kiếm giờ giãn rộng theo chỗ trống
có được, đặt nhãn phía trên ô nhập trên điện thoại và cuộn được khi không
vừa, nên nút Tìm kiếm luôn trong tầm tay.
"""

["2026-09-28-1119-replies-from-right-account"]
title = "Thư trả lời được gửi từ đúng tài khoản"
text = """
Trả lời hoặc Chuyển tiếp một thư mở từ Hộp thư đến hợp nhất hay từ kết quả
tìm kiếm giờ được gửi từ tài khoản đã nhận thư đó, không phải tài khoản được
chọn dưới ảnh hồ sơ của bạn.
"""

["2026-09-28-1436-calmer-search-box"]
title = "Ô tìm kiếm hiện phím tắt"
text = """
Ô tìm kiếm hiện phím tắt của nó bên cạnh "Tìm trong thư", theo thiết lập
trong Cài đặt > Phím tắt. Khi được nhấp vào, ô giữ nguyên màu và chỉ hiện
một viền mờ thay vì tối đi kèm bóng đổ. Các thư mục nổi phía trên danh sách
giờ cũng không còn sát mép dưới.
"""

["2026-09-28-1450-clear-activity"]
title = "Dọn gọn Hoạt động"
text = """
Trỏ vào một lượt mở hoặc lượt nhấp trong Hoạt động rồi nhấn × để gỡ nó khỏi
danh sách, hoặc nhấn Xóa tất cả để bắt đầu lại từ đầu. Lượt mở và lượt nhấp
mới vẫn hiện ra, và báo cáo Chi tiết vẫn tính mọi thứ.
"""

["2026-09-28-1541-round-logo"]
title = "Logo tròn mới của Katna"
text = """
Katna có logo mới: chữ "k" viết tay trên một hình tròn màu xanh
ngọc — trong menu ứng dụng, thanh trên cùng và bảng điều khiển. Khay
hệ thống hiển thị logo bằng một màu phù hợp với thanh của bạn, còn
Giới thiệu về Katna và trang chào mừng hiển thị đầy đủ tên "katna
mail".
"""

["2026-09-28-1546-contact-cards"]
title = "Thông tin liên hệ gọn gàng hơn"
text = """
Thông tin liên hệ giờ hiện mỗi phần trên thẻ mềm riêng, với các nút
tròn dưới tên để gửi email cho người đó, tìm thư với họ hoặc gọi cho
họ. Cuộc hội thoại gần đây hiện vài cuộc mới nhất; nhấn Thêm để xem
phần còn lại và Thu gọn để ẩn chúng lại.
"""

["2026-09-28-1507-reply-box-recipients"]
title = "Hộp trả lời gọn gàng hơn"
text = """
Người nhận giờ đây hiển thị cùng ảnh đại diện của họ, còn Cc và Bcc
được gộp vào một nút nhỏ. Mở danh sách người nhận của một trả lời sẽ
làm hộp mở rộng lên trên một cách mượt mà, và tin nhắn được trích dẫn
mở ra và đóng lại mượt mà bên dưới một đường lượn sóng mà bạn có thể
nhấp để gấp nó lại.
"""

["2026-09-28-1620-softer-window-shadow"]
title = "Bóng cửa sổ mềm hơn và các nút cỡ như KDE"
text = """
Với khung cửa sổ của Katna, bóng quanh cửa sổ giờ hẹp hơn và mờ dần
hoàn toàn, không còn viền cứng mà trước đây để lại bên cạnh cửa sổ.
Các nút cửa sổ giờ có kích thước như của KDE, và cách mép cửa sổ một
khoảng bằng khoảng cách tới đỉnh của nó.
"""

["2026-09-28-1622-update-from-the-app"]
title = "Cập nhật Katna ngay trong ứng dụng"
text = """
Giờ đây Katna tự tải xuống các phiên bản mới và báo cho bạn biết khi
có bản sẵn sàng. Nhấn Cập nhật trong thông báo hoặc trong Giới thiệu:
Katna Mail sẽ báo rằng nó sắp khởi động lại, hỏi mật khẩu của bạn, cài
đặt bản cập nhật rồi mở lại đúng chỗ bạn đang dừng. Cài đặt > Chung >
Cập nhật tắt việc tự động tải xuống.
"""

["2026-09-28-1520-track-sealed-and-plain"]
title = "Theo dõi thư đã ký, đã mã hóa và văn bản thuần"
text = """
Biểu tượng con mắt giờ cũng hoạt động trên thư đã ký và đã mã hóa: bản sao
của mỗi người nhận được ký hoặc mã hóa riêng, nên chữ ký vẫn hợp lệ. Thư văn
bản thuần không thể hiển thị lượt mở, nhưng các liên kết trong đó được theo
dõi, nên bạn thấy khi ai đó mở một liên kết.
"""

["2026-09-28-1834-reply-after-closed-window"]
title = "Trả lời bắt đầu lại từ đầu sau khi đóng cửa sổ thư"
text = """
Đóng một thư được soạn trong cửa sổ riêng giờ sẽ giữ nó trong Thư nháp, còn
Trả lời, Trả lời tất cả và Chuyển tiếp lại mở một thư mới thay vì đưa thư cũ
trở lại.
"""

["2026-09-28-1852-frosted-search-bar"]
title = "Thanh tìm kiếm mờ như kính"
text = """
Khi bật nền mờ, thanh tìm kiếm để lớp mờ xuyên qua giống như thanh xung
quanh nó, thay vì nằm trên đó như một viên thuốc màu xám đặc.
"""

["2026-09-28-1906-scroll-to-switch-accounts"]
title = "Cuộn trên ảnh của bạn để chuyển tài khoản"
text = """
Khi con trỏ nằm trên ảnh tài khoản ở góc trên bên phải, hãy xoay con lăn
chuột để chuyển sang tài khoản kế tiếp hoặc trước đó, mỗi nấc một tài khoản.
Ảnh cuộn sang tài khoản mới, giống như tên ứng dụng cuộn khi bạn chuyển ứng
dụng, và chọn một tài khoản từ thẻ cũng làm nó cuộn theo cách đó.
"""

["2026-09-28-1918-many-recipients"]
title = "Đủ chỗ cho nhiều người nhận"
text = """
Người nhận sau dòng đầu tiên giờ dùng toàn bộ chiều rộng, và một danh sách
dài cuộn trong vài dòng, nên bản thân thư luôn nằm trong tầm với. Rời khỏi
trường và nó gập lại thành một dòng, chẳng hạn "Kay, Sam, 19 người nữa";
nhấp vào đó để xem lại tất cả.
"""

["2026-09-28-1952-activity-by-account"]
title = "Báo cáo hoạt động cho một tài khoản"
text = """
Báo cáo hoạt động giờ có bộ chọn tài khoản bên cạnh ngày. Chọn Tất cả
tài khoản hoặc một tài khoản, và thư được theo dõi, tỷ lệ, biểu đồ, tiêu
đề cùng Hộp thư của bạn sẽ theo lựa chọn đó. Báo cáo cho biết tài khoản
đang hiển thị và ghi nhớ lựa chọn của bạn.
"""

["2026-09-28-2002-reader-arrows-always-shown"]
title = "Mũi tên Mới hơn và Cũ hơn luôn hiện trên thanh công cụ"
text = """
Dù ngăn đọc hẹp đến đâu, bộ đếm cùng các mũi tên Mới hơn và Cũ hơn vẫn nằm
ở bên phải thanh công cụ của nó. Thay vào đó, các nút bạn ít dùng nhất sẽ
lần lượt chuyển vào menu Thêm, gồm cả các công tắc chi tiết liên hệ và màu
gốc.
"""

["2026-09-28-2026-large-files-drive"]
title = "Gửi tệp với mọi dung lượng"
text = """
Với tài khoản đăng nhập bằng Google, tệp vượt quá giới hạn thư 25 MB sẽ
được đưa lên Google Drive của bạn ngay khi bạn đính kèm, và thư sẽ kèm
liên kết của tệp, như trong Gmail. Tệp được chia sẻ với người nhận khi bạn
nhấn Gửi; Katna chỉ hỏi nếu không thể cấp quyền truy cập cho ai đó.
"""

["2026-09-28-2059-recipient-list-scrolling"]
title = "Danh sách người nhận dài mượt hơn"
text = """
Danh sách người nhận dài giờ có thanh cuộn riêng và cuộn từng dòng một;
cuộc hội thoại chỉ cuộn tiếp khi danh sách đã tới cuối. Thêm người nhận
không còn làm các nút bên dưới nhảy nữa.
"""

["2026-09-28-2106-check-for-new-mail"]
title = "Kiểm tra thư mới"
text = """
Nhấp chuột phải vào một thư mục hoặc tài khoản trong ngăn thư mục để
chọn “Kiểm tra thư mới”, “Đánh dấu tất cả là đã đọc”, thư mục mới bên
trong hoặc “Dọn sạch Thùng rác”. “Làm mới” phía trên danh sách giờ cũng
tải từ máy chủ. Khi Katna đang kiểm tra, các mũi tên xoay trên “Làm mới”
và bên cạnh Hộp thư đến, còn “Đang kiểm tra thư mới…” hiện ở trên cùng
nếu mất hơn một lúc.
"""

["2026-09-28-2101-large-files-onedrive"]
title = "Tệp lớn qua OneDrive"
text = """
Các tài khoản Outlook.com, Hotmail và tài khoản Microsoft khác nay gửi
tệp vượt quá giới hạn thư giống như tài khoản Google: tệp được đưa lên
OneDrive của bạn ngay khi bạn đính kèm, và thư kèm liên kết của tệp, như
trong Outlook.
"""

["2026-09-28-2108-activity-checking"]
title = "Không còn nháy Đăng nhập trong Hoạt động"
text = """
Ngay sau khi Katna khởi động, Hoạt động hiển thị một thanh tải mỏng
trong khi kiểm tra tài khoản Katna của bạn, thay vì nhắc bạn đăng nhập
trong chốc lát. Katna cũng kiểm tra tài khoản ngay khi khởi động, nên
thời gian chờ ngắn hơn.
"""

["2026-09-28-2130-update-dialog"]
title = "Cập nhật có cửa sổ riêng"
text = """
Trợ giúp > Kiểm tra cập nhật mở một cửa sổ riêng. Cửa sổ hiển thị phiên
bản của bạn cạnh phiên bản mới, thời điểm tạo và dung lượng tải xuống
của mỗi bản, những điểm mới trong bản cập nhật và mọi thay đổi kể từ
phiên bản của bạn.
"""

["2026-09-28-2204-faster-start"]
title = "Khởi động nhanh hơn, đồng bộ mượt hơn"
text = """
Katna Mail mở hộp thư đến lớn nhanh hơn khoảng một phần tư, và khi thư
đang tải về, danh sách chỉ được cập nhật một lần cho mỗi lô thay vì sau
mỗi vài thư, nên việc cuộn và gõ vẫn mượt trong lúc đồng bộ.
"""

["2026-09-28-2111-link-addresses"]
title = "Xem liên kết dẫn đến đâu"
text = """
Đặt con trỏ lên một liên kết trong thư, địa chỉ mà liên kết thực sự mở
ra sẽ hiện ở cuối ngăn đọc, với tên trang web được làm nổi bật, bất kể
văn bản của liên kết ghi gì. Hình ảnh từ người gửi mà bạn luôn hiển thị
hình ảnh nay chỉ được tải khi nhà cung cấp thư của bạn xác nhận thư thực
sự đến từ họ.
"""

["2026-09-29-0120-update-build-details"]
title = "Thêm về bản dựng của bạn"
text = """
Cửa sổ Cập nhật giờ cho biết thay đổi mới nhất của từng phiên bản, bản
của bạn đến từ đâu và lần gần nhất Katna kiểm tra cập nhật là khi nào.
"""

["2026-09-29-0213-coffee-button-play"]
title = "Một màn diễn nhỏ ở nút Mời tôi một ly cà phê"
text = """
Đặt con trỏ lên nút Mời tôi một ly cà phê trong Giới thiệu về Katna: nút
sẽ xin cà phê, trà, pizza, rồi chẳng xin gì nữa, chịu uống nước lọc và
cảm ơn bạn bằng vài tia lấp lánh. Mỗi lần chỉ diễn một lượt và đứng yên
khi bạn đã giảm chuyển động.
"""

["2026-09-29-0215-update-checking-bar"]
title = "Cửa sổ Cập nhật rõ ràng hơn"
text = """
Một thanh chạy hiện ra khi Katna kiểm tra bản cập nhật, và phiên bản mới
nổi bật với màu riêng bên cạnh phiên bản bạn đang dùng.
"""

["2026-09-29-0231-keys-beside-the-list"]
title = "Phím đi theo ngăn bạn đang ở"
text = """
Khi cuộc trò chuyện nằm cạnh danh sách, Lên và Xuống giờ di chuyển trong
danh sách và hiện từng cuộc trò chuyện. Tab hoặc Enter vào cuộc trò
chuyện, nơi Lên và Xuống cuộn nó; Esc hoặc Shift+Tab quay về danh sách.
F6 chuyển giữa các ngăn, như trong các ứng dụng thư khác.
"""

["2026-09-29-0258-folders-slide-open"]
title = "Thư mục trượt mở và trượt đóng"
text = """
Nhấp vào mũi tên bên cạnh một tài khoản hoặc thư mục trong ngăn thư mục
giờ sẽ trượt mở hoặc trượt đóng nội dung bên trong, các thư mục bên dưới
trượt theo, thay vì nhảy.
"""

["2026-09-29-0301-keys-menus-dialogs"]
title = "Thư mục, menu và hộp thoại bằng bàn phím"
text = """
Shift+Tab hoặc F6 đưa bạn tới ngăn thư mục, nơi Lên và Xuống mở từng thư
mục và Enter chuyển sang thư của nó. Lên và Xuống di chuyển trong mọi
menu, và Enter chọn. Shift+F10 hoặc phím Menu mở menu chuột phải của thư
đang chọn. Hộp thoại nhận phím ngay khi mở: Enter trả lời, Esc hủy và
Tab ở lại bên trong. Trong thư mới, Ctrl+Enter gửi từ bất kỳ trường nào
và Esc đóng thư, giữ lại một thư nháp.
"""

["2026-09-29-0309-clock-tasks"]
title = "Việc cần làm ngay trong đồng hồ màn hình nền"
text = """
Bấm vào đồng hồ để thêm việc cần làm và đánh dấu các việc đã xong. Trong
Plasma, bấm chuột phải vào đồng hồ và chọn Hiện các lựa chọn thay thế để
chọn Đồng hồ số Katna. Trong GNOME, thẻ Việc cần làm sẽ hiện bên dưới
lịch của đồng hồ từ lần đăng nhập tiếp theo.
"""

["2026-09-29-0329-pages-by-keyboard"]
title = "Chuyển trang bằng bàn phím và từ thanh tác vụ"
text = """
Ctrl+1 đến Ctrl+5 chuyển giữa Thư, Lịch, Danh bạ, Việc cần làm và Ghi
chú, như trong Outlook, và menu Đi tới cũng liệt kê chúng. Bấm chuột
phải vào Katna Mail trên thanh tác vụ để mở ngay Lịch hoặc Danh bạ.
"""

["2026-09-29-0412-tasks-page"]
title = "Katna Việc cần làm"
text = """
Nhấn Ctrl+4 hoặc chọn Việc cần làm ở bên trái: mọi danh sách nằm cạnh
nhau như trong Google Tasks, với việc phụ, dấu sao, ngày đến hạn, lặp
lại và chi tiết. Các danh sách đồng bộ với Google Tasks và Microsoft To
Do, và việc cần làm từ đồng hồ trên máy tính cũng hiện ở đây.
"""

["2026-09-29-0352-contacts"]
title = "Danh bạ của bạn, từ mọi tài khoản"
text = """
Danh bạ trên thanh bên trái giờ hiển thị những người được lưu trong tài
khoản Gmail và Outlook của bạn và trên máy chủ CardDAV, mỗi người chỉ
một lần dù nhiều tài khoản cùng lưu, kèm nhãn, ảnh và chi tiết của họ.
Tên và ảnh của họ cũng hiện trong thư của bạn và trong gợi ý địa chỉ.
"""

["2026-09-29-0350-katna-notes"]
title = "Katna Ghi chú"
text = """
Ghi chú trên thanh bên giờ mở Katna Ghi chú, bố cục giống Google Keep.
Tạo ghi chú hoặc danh sách kiểm tra, chọn màu, ghim lên đầu và đánh dấu
các mục ngay trên bảng. Ghi chú được lưu khi bạn gõ; hộp tìm kiếm sẽ tìm
thấy chúng; Lưu trữ và Thùng rác giúp cất chúng đi, có thể Hoàn tác.
"""

["2026-09-29-0412-notes-sync"]
title = "Ghi chú trên mọi thiết bị"
text = """
Ghi chú giờ nằm trong thư mục Ghi chú của tài khoản thư, nơi Ghi chú
trên iPhone và Mac cũng lưu ghi chú của chúng, nên ghi chú đi theo bạn
sang các thiết bị khác và quay lại từ đó. Tên tài khoản bên dưới ghi chú
cho biết nơi lưu; nhấp vào đó để chuyển ghi chú, hoặc chỉ giữ trên máy
tính này.
"""

["2026-09-29-0451-add-mail-to-tasks"]
title = "Thêm thư vào Việc cần làm"
text = """
Nhấn Shift+T, như trong Gmail, hoặc chọn Thêm vào Việc cần làm khi nhấp
chuột phải vào một thư. Việc cần làm lấy tiêu đề của thư, và thẻ Thư của
nó trong Việc cần làm sẽ mở lại thư.
"""

["2026-09-29-0412-calendar"]
title = "Lịch của bạn, ngay cạnh thư"
text = """
Lịch hiển thị lịch Google, Microsoft và các lịch khác của bạn theo
ngày, tuần, tháng hoặc dưới dạng lịch biểu, với các phím tắt của Google
Calendar. Nút lịch ở bên phải thư của bạn mở chương trình trong ngày, có
nút Tham gia cho các cuộc gọi. Hãy đăng nhập lại vào tài khoản để Katna
có thể đọc lịch của tài khoản đó.
"""

["2026-09-29-0442-contacts-edit"]
title = "Tạo và sửa liên hệ"
text = """
Tạo người liên hệ trên trang Danh bạ sẽ thêm một người vào tài khoản bạn
chọn, còn Sửa trên trang của một liên hệ cũng thay đổi họ ngay tại đó.
Xóa có Hoàn tác, và Google cùng Outlook giữ các liên hệ đã xóa trong
thùng rác của họ một thời gian.
"""

["2026-09-29-0538-notes-on-mail"]
title = "Ghi chú về một thư"
text = """
Nhấp chuột phải vào một thư, hoặc mở menu ⋮ của thư, rồi chọn Thêm ghi
chú: một ghi chú lấy chủ đề làm tiêu đề sẽ mở ra phía trên thư. Các
ghi chú hiện dưới chủ đề mỗi khi bạn mở lại thư đó, và nhãn Thư của
ghi chú đưa bạn quay lại thư.
"""

["2026-09-29-0542-caldav-tasks"]
title = "Việc cần làm trên máy chủ thư của riêng bạn"
text = """
Các tài khoản đăng nhập bằng mật khẩu giờ đây lưu việc cần làm trên
máy chủ thư nếu máy chủ đó hỗ trợ CalDAV, nên việc cần làm cũng hiện
trong các ứng dụng của chính máy chủ và trên điện thoại.
"""

["2026-09-29-0521-calendar-edit"]
title = "Thêm và thay đổi sự kiện"
text = """
Nhấp hoặc kéo trên lịch, hoặc nhấn C, để thêm sự kiện. Kéo một sự kiện
để di chuyển hoặc kéo cạnh dưới của nó để đổi thời lượng, rồi mở sự kiện
để đổi giờ, cách lặp lại, lời nhắc và khách hoặc thêm cuộc gọi Meet hoặc
Teams. Trả lời lời mời bằng Có, Không hoặc Có thể. Hoàn tác sẽ khôi phục
mọi thứ.
"""

["2026-09-29-0546-calendar-any-account"]
title = "Lịch từ nhiều tài khoản hơn"
text = """
Katna giờ đây tìm thấy lịch của Yahoo, Zoho, iCloud, Fastmail, GMX và
các tài khoản khác, ngay cả khi chúng nằm trên máy chủ khác với thư.
Katna thử cách tốt nhất của từng tài khoản trước và một cách khác khi
cách đó không dùng được.
"""

["2026-09-29-0625-tasks-today"]
title = "Hôm nay trong Việc cần làm"
text = """
Hôm nay, trong Tất cả việc cần làm, tập hợp những việc đến hạn hôm nay
và mọi việc quá hạn từ tất cả danh sách, kèm danh sách chứa từng việc.
Việc được thêm ở đó sẽ đến hạn hôm nay.
"""

["2026-09-29-0631-invitation-card"]
title = "Lời mời trong thư của bạn"
text = """
Lời mời giờ đây hiển thị dưới dạng thẻ ở đầu thư: khi nào và ở đâu, ai
tổ chức, ngày của bạn xung quanh với các xung đột được đánh dấu, Tham
gia và Bạn có tham dự không? Có, Không hoặc Có thể, trả lời ngay tại đó.
"""

["2026-09-29-0616-note-labels"]
title = "Nhãn cho ghi chú"
text = """
Nút nhãn trên một ghi chú gắn nhãn cho ghi chú đó, như trong Keep. Các
nhãn của bạn được liệt kê bên cạnh Ghi chú, mỗi nhãn chỉ hiển thị các
ghi chú của nó, và Chỉnh sửa nhãn cho phép đổi tên hoặc xóa chúng, kèm
Hoàn tác.
"""

["2026-09-29-0630-tasks-more-accounts"]
title = "Việc cần làm từ nhiều tài khoản hơn"
text = """
Việc cần làm giờ cũng đồng bộ với Yahoo, Zoho, iCloud, Fastmail và các
tài khoản khác có việc cần làm nằm trên máy chủ khác với thư. Katna thử
cách tốt nhất của từng tài khoản trước và ghi nhớ cách hoạt động.
"""

["2026-09-29-0651-schedule-meeting"]
title = "Lên lịch cuộc họp từ một thư"
text = """
Nhấp chuột phải vào một cuộc trò chuyện, hoặc mở ⋮, rồi chọn Lên lịch
cuộc họp: một sự kiện mới mở ra ở trang Lịch với chủ đề làm tiêu đề và
mọi người trong cuộc trò chuyện làm khách.
"""

["2026-09-29-0705-running-late"]
title = "Đến muộn? Báo cho mọi người chỉ với một cú nhấp"
text = """
Sự kiện có khách giờ có Gửi thư cho khách và, từ một giờ trước khi bắt
đầu, Tôi đến muộn: một thư gửi mọi người, từ tài khoản của lịch đó, sẵn
sàng để gửi.
"""

["2026-09-29-0607-contact-labels"]
title = "Nhãn liên hệ"
text = """
Nút Gắn nhãn trên trang của một người liên hệ bật tắt các nhãn hoặc tạo
nhãn mới, và ⋮ bên cạnh một nhãn cho phép đổi tên, xóa hoặc viết cho mọi
người trong nhãn đó. Nhãn luôn đồng bộ với Google Contacts và Outlook,
và mọi thay đổi đều có Hoàn tác.
"""

["2026-09-29-0640-add-to-contacts"]
title = "Thêm vào danh bạ từ thư"
text = """
Bảng liên hệ bên cạnh một cuộc trò chuyện có Thêm vào danh bạ cho người
bạn chưa lưu: một cú nhấp lưu tên, địa chỉ cùng điện thoại, chức danh và
công ty từ chữ ký của họ, kèm Hoàn tác. Với người đã lưu, cùng nút đó mở
họ trên trang Danh bạ.
"""

["2026-09-29-0720-focus-time"]
title = "Thời gian tập trung, vắng mặt và địa điểm làm việc"
text = """
Sự kiện mới giờ có thể là Thời gian tập trung, Vắng mặt hoặc Địa điểm
làm việc, như trong Google Calendar: chọn ở phía trên các mốc giờ.
Google và Outlook nhận ra chúng đúng như bản chất, và trong Katna chúng
hiển thị với biểu tượng riêng.
"""

["2026-09-29-0704-task-chips"]
title = "Việc cần làm ngay trên thư"
text = """
Thư bạn đã chuyển thành việc cần làm giờ hiển thị ngày đến hạn của việc
đó trong danh sách, màu đỏ khi đã quá hạn. Nhấp vào để mở việc cần làm.
"""

["2026-09-29-0638-other-contacts"]
title = "Danh bạ khác"
text = """
Danh bạ giờ có Danh bạ khác: những người bạn đã gửi email từ Gmail nhưng
chưa bao giờ lưu, đúng như cách Gmail giữ họ. Lưu bất kỳ ai chỉ bằng một
lần bấm, có Hoàn tác, hoặc bắt đầu một email gửi họ.
"""

["2026-09-29-0745-answer-by-mail"]
title = "Trả lời lời mời từ mọi tài khoản"
text = """
Lời mời gửi đến một tài khoản không có lịch giờ cũng có Có, Không và Có
thể: câu trả lời của bạn được gửi đến người tổ chức qua email, và lịch
của họ ghi nhận nó.
"""

["2026-09-29-0710-meeting-notes"]
title = "Ghi chú cuộc họp"
text = """
Mở một sự kiện trong Lịch rồi chọn Ghi chú cuộc họp: một ghi chú mang
tiêu đề của sự kiện sẽ mở ra, có sẵn người tham dự và chỗ cho các việc
cần làm. Thẻ của sự kiện liệt kê các ghi chú của nó, và chip Sự kiện
trong ghi chú đưa bạn quay lại ngày đó.
"""

["2026-09-29-0751-go-to-pdf-page"]
title = "Đi thẳng tới một trang PDF"
text = """
Số trang bên dưới tệp PDF nay là một ô nhập: nhấp vào đó hoặc nhấn
Ctrl+G, nhập số trang rồi nhấn Enter để chuyển tới đó.
"""

["2026-09-29-0715-tasks-on-calendar"]
title = "Tác vụ trên lịch"
text = """
Tác vụ có ngày đến hạn giờ hiển thị trên Lịch, đúng giờ của chúng hoặc cùng các sự kiện cả ngày. Đánh dấu hoàn tất ngay tại đó, nhấp để mở một tác vụ, hoặc kéo sang ngày hay giờ khác để dành khoảng thời gian đó cho tác vụ.
"""

["2026-09-29-0756-event-reminders"]
title = "Nhắc nhở cho sự kiện của bạn"
text = """
Sự kiện giờ sẽ nhắc bạn bằng thông báo, kể cả khi Katna đã đóng. Tham gia sẽ mở cuộc gọi video, còn Báo lại sau 5 phút sẽ nhắc bạn lại sau năm phút.
"""

["2026-09-29-0758-contacts-merge-import"]
title = "Hợp nhất liên hệ trùng lặp, nhập và xuất liên hệ"
text = """
Danh bạ giờ có Sửa và quản lý: Hợp nhất và sửa tìm những người được lưu hai lần (cùng tên hoặc số điện thoại) và hợp nhất họ chỉ bằng một cú nhấp, kèm Hoàn tác. Nhập đưa người từ tệp vCard vào và bỏ qua những ai đã được lưu, còn Xuất lưu tất cả mọi người, hoặc một nhãn, thành tệp vCard.
"""

["2026-09-29-0835-contacts-birthdays-qr-print"]
title = "Sinh nhật trên lịch, liên hệ dưới dạng mã QR"
text = """
Sinh nhật của các liên hệ giờ hiển thị trên Lịch, trong một lịch Sinh nhật mà bạn có thể bỏ chọn. Trang của một liên hệ có thể hiện liên hệ đó dưới dạng mã QR để camera điện thoại lưu lại, và in ra; In trong Sửa và quản lý sẽ in tất cả những người đang hiển thị. Tính năng nhập giờ cũng đọc được tệp CSV từ Danh bạ Google và Outlook, còn KRunner và tìm kiếm của GNOME tìm được các liên hệ đã lưu của bạn.
"""

["2026-09-29-0830-calendar-density-time-zones"]
title = "Mật độ Lịch và múi giờ thứ hai"
text = """
Nút Tùy chọn trong Lịch đặt độ cao của các giờ (Tự điều chỉnh theo màn hình của bạn, Thoải mái hoặc Gọn) và thêm múi giờ thứ hai bên cạnh múi giờ của bạn, dành cho những người bạn gặp ở nước ngoài.
"""

["2026-09-29-0809-video-calls"]
title = "Bắt đầu cuộc gọi video từ một thư"
text = """
Nhấp chuột phải vào một cuộc trò chuyện, hoặc mở ⋮, rồi chọn Bắt đầu cuộc gọi video: cuộc gọi sẽ mở ra, kèm một thư mới chứa liên kết gửi đến mọi người trong cuộc trò chuyện. Tài khoản Gmail dùng Google Meet; các tài khoản khác nhận một phòng Jitsi Meet. Thư có liên kết cuộc gọi Meet, Teams, Zoom, Webex, Jitsi, WhatsApp hoặc Telegram nay hiển thị nút Tham gia.
"""

["2026-09-29-0815-note-line-task"]
title = "Biến một dòng danh sách kiểm tra thành việc cần làm"
text = """
Đặt con trỏ vào một dòng danh sách kiểm tra trong ghi chú và chọn Biến thành việc cần làm: dòng đó sẽ chuyển sang mục Việc cần làm của bạn. Thẻ Ghi chú trên trang Việc cần làm sẽ mở lại ghi chú.
"""

["2026-09-29-0836-active-pane-stands-out"]
title = "Ngăn bạn đang dùng nổi bật lên"
text = """
Bên cạnh danh sách, chỉ ngăn đang nhận bàn phím mới giữ bóng đổ; danh sách, cuộc trò chuyện hoặc bảng liên hệ mà bạn không dùng sẽ lùi xuống với viền nhạt hơn, và thay đổi đó nhẹ nhàng theo bạn khi bạn nhấp chuột.
"""

["2026-09-29-0840-task-reminders"]
title = "Lời nhắc và lặp lại của công việc"
text = """
Mở một công việc và chọn Nhắc tôi: đúng giờ, trước một giờ hoặc một ngày. Lời nhắc hiện ra ngay cả khi Katna đã đóng, kèm Đánh dấu là đã hoàn thành và Báo lại. Khi đánh dấu xong một công việc lặp lại, giờ đây nó sẽ quay lại vào ngày kế tiếp.
"""

["2026-09-29-0849-tasks-in-desktop-search"]
title = "Tìm việc cần làm từ màn hình nền"
text = """
Gõ vài từ của một việc cần làm trong KRunner hoặc trong tìm kiếm của GNOME, việc đó sẽ hiện ở mục Việc cần làm. Nhấn Enter và Katna sẽ mở nó, sẵn sàng để chỉnh sửa.
"""

["2026-09-29-0832-clock-day-menu"]
title = "Thêm sự kiện và việc cần làm từ đồng hồ trên màn hình nền"
text = """
Trong Katna Digital Clock, nhấp chuột phải vào một ngày trong tháng để
thêm việc cần làm hoặc sự kiện cho ngày đó; sự kiện sẽ mở trong Lịch của
Katna. Nhấp vào một sự kiện của bạn sẽ mở Lịch ở đúng ngày đó.
"""

["2026-09-29-0855-type-an-event"]
title = "Gõ một sự kiện trong một dòng"
text = """
Gõ “Ăn trưa với Anita thứ Sáu 1pm tại Cafe Mocha” hoặc “Họp nhanh mỗi
ngày làm việc 9:30” làm tiêu đề của sự kiện mới, và Lịch sẽ điền ngày,
giờ, lặp lại và địa điểm khi bạn gõ.
"""

["2026-09-29-0915-year-view"]
title = "Xem cả năm"
text = """
Lịch có chế độ xem Năm: cả mười hai tháng cùng lúc, có một dấu chấm dưới
những ngày có sự kiện. Nhấn Y, rồi nhấp vào một ngày để mở nó.
"""

["2026-09-29-0930-share-free-times"]
title = "Chia sẻ giờ rảnh của bạn"
text = """
Chia sẻ giờ rảnh trong các tùy chọn của Lịch sẽ mở một thư liệt kê lúc
bạn rảnh trong vài ngày làm việc tới, sẵn sàng gửi cho bất kỳ ai.
"""

["2026-09-29-0952-calendar-sets"]
title = "Bộ lịch"
text = """
Lưu các lịch bạn đang hiển thị thành một bộ, như “Công việc” hoặc “Gia
đình”, bằng nút + cạnh Bộ lịch. Một cú nhấp vào một bộ sẽ hiện các lịch
của bộ đó và ẩn phần còn lại.
"""

["2026-09-29-0947-tasks-typed-quick-add"]
title = "Nhập một việc cần làm trên một dòng"
text = """
Thêm một việc như “Gọi ngân hàng lúc 15h ngày mai” hoặc “Tưới cây lúc 8h
sáng thứ Hai hằng tuần”, và Việc cần làm sẽ đặt ngày, giờ và lặp lại cho
bạn, đồng thời hiện những gì nó hiểu ngay khi bạn gõ.
"""

["2026-09-29-1028-calendar-narrow-windows"]
title = "Lịch trong cửa sổ hẹp"
text = """
Trong cửa sổ hẹp, Lịch giữ Hôm nay và các ngày trên thanh của nó và gom
các chế độ xem vào một menu. Giờ sự kiện không còn bị ngắt giữa chữ, và
Tab đi tới được mọi nút và mọi lịch.
"""

["2026-09-29-1039-contact-panel-tasks"]
title = "Việc cần làm với họ, ngay cạnh thư của họ"
text = """
Bảng liên hệ cạnh một cuộc trò chuyện giờ liệt kê các việc cần làm đang
mở được tạo từ thư với người đó. Đánh dấu một việc để hoàn thành, hoặc
nhấp vào để mở nó trong Việc cần làm.
"""

["2026-09-29-1046-contact-panel-meetings"]
title = "Các cuộc họp sắp tới của bạn với họ"
text = """
Bảng liên hệ cạnh một cuộc trò chuyện giờ hiển thị các cuộc họp sắp tới
của bạn với người đó. Nhấp vào một cuộc họp để mở nó trong Lịch.
"""

["2026-09-29-1051-tasks-drag-to-list"]
title = "Kéo một việc cần làm sang danh sách khác"
text = """
Trong Việc cần làm, kéo một việc sang danh sách khác để chuyển nó tới
đó. Hoàn tác sẽ đưa nó về chỗ cũ.
"""

["2026-09-29-1111-tasks-search"]
title = "Tìm trong việc cần làm của bạn"
text = """
Trên trang Việc cần làm, ô tìm kiếm ở trên cùng giờ tìm trong các việc
cần làm, ghi chú và việc phụ của bạn thay vì trong thư.
"""

["2026-09-29-1130-calendar-search"]
title = "Tìm sự kiện của bạn"
text = """
Trên trang Lịch, ô tìm kiếm ở trên cùng giờ tìm sự kiện theo tiêu đề,
địa điểm, ghi chú hoặc khách mời, liệt kê theo ngày. Nhấp vào một sự kiện
để mở nó ở ngày của nó; Esc đưa bạn trở lại kết quả.
"""

["2026-09-29-1045-note-formatting"]
title = "Định dạng trong ghi chú"
text = """
Chọn Định dạng trong một ghi chú để dùng Tiêu đề 1, Tiêu đề 2, in đậm,
in nghiêng và gạch chân, như trong Keep. Bảng cũng hiển thị định dạng,
và định dạng đi cùng ghi chú đến thư mục Ghi chú trong tài khoản thư của
bạn, nơi định dạng từ iPhone giờ trở lại đúng như cũ.
"""

["2026-09-29-0934-custom-days-view"]
title = "Chỉ hiện vài ngày"
text = """
Lịch có Chế độ xem tùy chỉnh bên cạnh Lịch biểu: 4 ngày kể từ ngày bạn
chọn, hoặc từ 2 đến 7 ngày. Nhấn X, rồi chọn số ngày trong Tùy chọn.
"""

["2026-09-29-0939-events-in-desktop-search"]
title = "Tìm sự kiện từ màn hình nền"
text = """
Gõ tên một sự kiện vào KRunner hoặc ô tìm kiếm của GNOME để xem lần tới
của nó là khi nào, rồi nhấn Enter để mở ngày đó trong Lịch.
"""

["2026-09-29-1102-apps-on-a-phone"]
title = "Lịch, Danh bạ, Việc cần làm và Ghi chú trên điện thoại"
text = """
Trong cửa sổ hẹp, các trang này giờ vừa màn hình như Thư: danh sách bên
mở từ nút menu, Danh bạ hiện mỗi tên kèm địa chỉ bên dưới, và Ghi chú
xếp hai thẻ trên một hàng.
"""

["2026-09-29-1236-agenda-button-top-bar"]
title = "Lịch trình trong ngày, từ thanh trên cùng"
text = """
Nút hiện lịch trình trong ngày bên cạnh thư của bạn giờ nằm trên thanh
trên cùng, cạnh nút ngôn ngữ, và phần thư có thêm chỗ mà dải bên từng
chiếm.
"""

["2026-09-29-1243-hide-side-panel-on-every-page"]
title = "Ẩn bảng bên trên mọi trang"
text = """
Nút menu ở góc trên bên trái giờ cũng thu gọn bảng bên trong Lịch, Danh
bạ, Việc cần làm và Ghi chú, trượt nó đi như với các thư mục của Thư.
Mỗi trang nhớ bạn có để nó mở hay không.
"""

["2026-09-29-1251-app-menu-on-a-phone"]
title = "Menu chính trên điện thoại"
text = """
Trên điện thoại, menu chính sau ảnh tài khoản giờ mở Tệp, Sửa, Xem và
các mục khác ngay tại chỗ, với một hàng Quay lại ở trên cùng, thay vì
tràn ra ngoài cạnh màn hình.
"""

["2026-09-29-1256-calendar-every-account"]
title = "Mọi tài khoản trong Lịch"
text = """
Danh sách bên của Lịch giờ hiện tất cả tài khoản của bạn. Khi lịch của
một tài khoản không tải được, một dòng bên dưới cho biết lý do, kèm một
cú nhấp để khắc phục, chẳng hạn “Đăng nhập lại để hiện lịch”.
"""

["2026-09-29-1300-switch-account-stay-on-page"]
title = "Đổi tài khoản mà không rời trang"
text = """
Chọn tài khoản khác từ ảnh của bạn ở góc trên bên phải, hoặc lăn con lăn
trên ảnh, giờ vẫn giữ bạn ở Lịch, Việc cần làm, Danh bạ hoặc Ghi chú.
Mục mới sẽ vào tài khoản đó, và Thư sẽ hiện tài khoản đó khi bạn quay
lại.
"""

["2026-09-29-1317-contacts-every-account"]
title = "Mọi tài khoản trong Danh bạ"
text = """
Danh bạ giờ liệt kê tất cả tài khoản của bạn dưới mục Tài khoản, kèm số
người trong mỗi tài khoản; nhấp vào một tài khoản để chỉ xem người của
tài khoản đó. Khi danh bạ của một tài khoản không tải được, một dòng bên
dưới cho biết lý do, kèm một cú nhấp để khắc phục, chẳng hạn “Đăng nhập
lại để hiện danh bạ” hoặc “Thử lại”.
"""

["2026-09-29-1327-tasks-every-account"]
title = "Mọi tài khoản trên trang Việc cần làm"
text = """
Mọi tài khoản giờ đều hiện trong bảng bên của Việc cần làm. Khi việc cần
làm của một tài khoản không tải được, một dòng bên dưới cho biết lý do,
kèm một cú nhấp để khắc phục: đăng nhập lại hoặc thử lại.
"""

["2026-09-29-1404-compose-dialogs-in-view"]
title = "Câu hỏi trước khi gửi luôn trong tầm nhìn"
text = """
Các câu hỏi như “Bạn có định đính kèm tệp không?” giờ mở ở giữa cửa sổ,
dù thư bạn đang viết hay chuyển tiếp dài đến đâu, nên chúng không bao
giờ bị khuất ở phía dưới trang. Enter trả lời bằng nút chính và Esc quay
lại thư.
"""

["2026-09-29-1530-mark-up-pdfs"]
title = "Đánh dấu PDF"
text = """
Nhấn vào cây bút trong trình xem PDF để tô sáng, gạch chân, gạch lượn
sóng hoặc gạch ngang văn bản, hoặc vẽ bằng bút, với màu bạn chọn. Hoàn
tác bằng Ctrl+Z, xóa một dấu bằng tẩy, rồi lưu một bản sao đã đánh dấu.
Tệp đính kèm gốc vẫn giữ nguyên.
"""

["2026-09-29-1557-calendar-accounts-why"]
title = "Vì sao một tài khoản không có lịch"
text = """
Khi lịch của một tài khoản không hiện, Lịch giờ cho biết máy chủ đã trả
lời gì, và “Thử lại” tìm lại ngay. Tài khoản Gmail hoặc Outlook được
thêm bằng mật khẩu sẽ đề nghị đăng nhập bằng Google hoặc Microsoft, điều
mà lịch của chúng cần.
"""

["2026-09-29-1610-one-checkbox"]
title = "Ô đánh dấu có dấu tích"
text = """
Mọi ô đánh dấu trong Katna Mail giờ có cùng kích thước với các nút tròn
bên cạnh. Dấu tích tự vẽ ra khi bạn đánh dấu và xóa đi khi bạn bỏ đánh
dấu, trong Cài đặt, danh sách thư, Lịch, Danh bạ, Ghi chú và các hộp
thoại.
"""

["2026-09-29-1622-right-click-menu-fits"]
title = "Menu chuột phải ngắn hơn và luôn vừa vặn"
text = """
Menu chuột phải của danh sách thư giữ các thao tác hằng ngày ở trên cùng
và đưa phần còn lại vào Theo dõi (việc cần làm, ghi chú, cuộc họp, cuộc
gọi) và Thêm (thư rác, mức quan trọng, ghim). Menu mở tại chỗ bạn nhấp
và luôn nằm trong cửa sổ; trong cửa sổ thấp hoặc hẹp, menu con mở ngay
tại chỗ của menu.
"""

["2026-09-29-1627-contacts-accounts-why"]
title = "Vì sao một tài khoản không có danh bạ"
text = """
Khi danh bạ của một tài khoản không hiện, Danh bạ giờ cho biết máy chủ
đã trả lời gì, và “Thử lại” tìm lại ngay. Tài khoản Gmail hoặc Outlook
được thêm bằng mật khẩu sẽ đề nghị đăng nhập bằng Google hoặc Microsoft,
điều mà danh bạ của chúng cần.
"""

["2026-09-29-1640-search-box-focus"]
title = "Ô tìm kiếm cho thấy khi nào đang hoạt động"
text = """
Ô tìm kiếm ở trên cùng có viền màu nhấn khi bạn gõ vào, như mọi trường
khác, và gợi ý Ctrl+F tạm ẩn đi cho đến khi bạn để trống ô.
"""

["2026-09-29-1612-tasks-board-rows"]
title = "Mọi danh sách việc cần làm đều trong tầm nhìn"
text = """
“Tất cả việc cần làm” giờ hiện nhiều danh sách cạnh nhau nhất có thể vừa
cửa sổ, cùng thêm các hàng bên dưới, để danh sách nào cũng xem được.
Danh sách mới sẽ được cuộn vào tầm nhìn ngay khi bạn tạo.
"""

["2026-09-29-1653-smooth-attachment-paging"]
title = "Chuyển giữa các tệp đính kèm mượt mà"
text = """
Chuyển sang tệp đính kèm kế tiếp hoặc trước đó trong trình xem bằng các
mũi tên không còn nhấp nháy. Trình xem vẫn mở và tệp kế tiếp sẽ thay chỗ
tệp trước ngay khi sẵn sàng.
"""

["2026-09-29-1656-drag-notes"]
title = "Kéo ghi chú để sắp xếp"
text = """
Kéo một ghi chú trên bảng Ghi chú để di chuyển nó, như trong Keep. Các
ghi chú khác lướt sang bên để nhường chỗ, và ghi chú nằm lại đúng nơi
bạn thả. Ctrl+Z đưa nó về chỗ cũ. Các thẻ giờ xếp khít trong cột, không
còn khoảng trống dưới các ghi chú ngắn.
"""

["2026-09-29-1707-calendar-right-click"]
title = "Nhấp chuột phải trong Lịch"
text = """
Nhấp chuột phải vào một khoảng thời gian hoặc ngày trống để thêm sự
kiện, thời gian tập trung hoặc thời gian vắng mặt tại đó. Nhấp chuột
phải vào một sự kiện để chỉnh sửa, tạo bản sao, xóa, trả lời, tham gia,
gửi thư cho khách, đổi màu hoặc chuyển sang lịch khác, và vào một việc
cần làm để đánh dấu hoàn thành, gắn dấu sao, dời sang ngày khác hoặc
xóa. Hoàn tác sẽ hoàn lại một thay đổi.
"""

["2026-09-29-1725-pdf-notes-and-text"]
title = "Ghi chú và văn bản trên PDF"
text = """
Khi đánh dấu PDF, giờ đây bạn có ghi chú dán và hộp văn bản: nhấp vào
trang, nhập nội dung rồi nhấn Ctrl+Enter. Di chuột lên ghi chú để đọc,
hoặc nhấp vào để sửa. Trả lời gửi ngay bản sao đã đánh dấu của bạn
trong thư trả lời cho thư đó.
"""

["2026-09-29-1657-tasks-drag-to-place"]
title = "Kéo việc cần làm đến nơi bạn muốn"
text = """
Kéo một việc cần làm lên hoặc xuống trong danh sách, hoặc sang danh
sách khác, các việc ở đó sẽ trượt sang bên để cho thấy nó sẽ nằm ở
đâu. Google Tasks cũng giữ thứ tự mới trên điện thoại của bạn, và Hoàn
tác sẽ đặt việc cần làm về chỗ cũ.
"""

["2026-09-29-1719-calendar-task-tab"]
title = "Thêm việc cần làm từ Lịch"
text = """
Thẻ sự kiện mới có thẻ Việc cần làm, giống như trong Google Lịch. Nhấp
vào một thời điểm, chọn Việc cần làm, và tiêu đề, ngày cùng giờ sẽ trở
thành một việc cần làm trong danh sách bạn chọn, kèm mô tả nếu muốn.
"""

["2026-09-29-1758-calendar-new-task-here"]
title = "Thêm việc cần làm từ Lịch"
text = """
Nhấp chuột phải vào một khoảng thời gian hoặc ngày trống trong Lịch và
chọn Việc cần làm để thêm việc cần làm tại đó. Thẻ sự kiện mới mở ở
thẻ Việc cần làm với ngày và giờ đó đã được điền sẵn.
"""

["2026-09-30-0113-calendar-server-unreachable"]
title = "Lịch thử lại sau khi máy chủ phản hồi chậm"
text = """
Khi máy chủ lịch của một tài khoản không phản hồi kịp, Lịch giờ sẽ báo
như vậy, cùng việc kết nối hay bước bắt tay bảo mật bị treo, thay vì
"Không tìm thấy lịch nào". Lịch thử lại trong vòng vài phút thay vì vài
giờ.
"""

["2026-09-30-0123-contact-files-fill"]
title = "Tệp của liên hệ hiện tiến trình tải xuống"
text = """
Một tệp trong bảng liên hệ mà thư của nó chưa có trên máy tính này giờ
sẽ đầy dần khi đang tải xuống, giống tệp đính kèm trong danh sách, rồi
mở ra.
"""

["2026-09-30-0135-new-account-mail-shows-as-it-arrives"]
title = "Thư của tài khoản mới hiện ra ngay khi đến"
text = """
Sau khi bạn thêm tài khoản, hộp thư đến của tài khoản đó được tải về
trước và đầy dần ngay trước mắt bạn, thay vì cứ dừng ở “Đang tải thư của
bạn…” cho đến khi mọi thư mục xong. Các thư mục khác cũng đầy dần theo
cách đó.
"""

["2026-09-30-0159-checkbox-matches-icons"]
title = "Ô đánh dấu ngang hàng với biểu tượng"
text = """
Ô đánh dấu giờ nhỏ hơn một chút, cùng kích thước với biểu tượng dấu sao và
nhãn bên cạnh trong danh sách thư. Chúng vẫn dễ bấm như trước, và dấu tích
vẫn tự vẽ ra.
"""

["2026-09-30-0201-zoho-calendars"]
title = "Lịch Zoho qua kết nối riêng của Zoho"
text = """
Zoho cung cấp lịch cho các ứng dụng khác qua một cổng mà nhiều mạng
chặn, nên sau khi Đăng nhập bằng Zoho, Lịch sẽ đọc chúng qua API riêng
của Zoho. Các sự kiện Zoho của bạn hiện bên cạnh các lịch khác; việc
thay đổi chúng từ Katna sẽ có sau.
"""

["2026-09-30-0216-zoho-tasks"]
title = "Việc cần làm của Zoho"
text = """
Đăng nhập bằng Zoho trên một tài khoản Zoho và việc cần làm trong Zoho
ToDo của tài khoản đó sẽ hiện trong Việc cần làm, theo cả hai chiều:
thêm, sửa, đánh dấu hoặc xóa một việc trong Katna và nó cũng thay đổi
trong Zoho.
"""

["2026-09-30-0224-checkbox-tick-centred"]
title = "Dấu tích nằm giữa ở mọi kích thước"
text = """
Khi Tỷ lệ trong Cài đặt > Giao diện trên 100%, dấu tích của ô đánh dấu
hơi lệch lên trên và sang trái. Viền của ô đánh dấu và nút tròn giờ lớn
theo tỷ lệ, nên dấu tích nằm giữa ở mọi kích thước.
"""

["2026-09-30-0230-edges-follow-scaling"]
title = "Đường viền to lên theo Tỷ lệ"
text = """
Khi Tỷ lệ trong Cài đặt > Giao diện lớn hơn hoặc nhỏ hơn 100%, đường viền
màu nhấn của ô tìm kiếm và ô nhập đang được chọn, cùng viền của các thẻ
lựa chọn và vòng việc cần làm, giờ to lên và nhỏ lại cùng mọi thứ khác
thay vì luôn mảnh.
"""

["2026-09-30-0326-google-sign-in-network"]
title = "Đăng nhập bằng Google trên mọi mạng"
text = """
Đăng nhập bằng Google không còn dừng lại với lỗi “peer closed connection”
trên những mạng ngắt kết nối tới Google quá sớm. Nếu bạn bỏ chọn Gmail
trên trang của Google, Katna giờ sẽ nói rõ điều đó thay vì báo lỗi sau.
"""

["2026-09-30-0504-google-api-turned-off"]
title = "Cho biết API Google nào đang tắt"
text = """
Khi Google tắt một API đối với Katna, Danh bạ, Lịch, Việc cần làm và tệp
Drive giờ cho biết đó là API nào trong một dòng ngắn, kèm nút Bật để mở
trang tương ứng của Google, thay vì hiện nguyên lỗi thô của Google.
"""

["2026-09-30-0507-newest-mail-first"]
title = "Thư mới nhất về trước"
text = """
Khi bạn thêm tài khoản, Katna Mail giờ tải thư gần đây nhất trước rồi mới
lùi dần về thư cũ hơn, nên thư hôm nay hiện ngay ở đầu hộp thư đến. Nếu
việc tải bị gián đoạn, lần sau nó sẽ tiếp tục với thư cũ hơn.
"""

["2026-09-30-0601-keyring-at-login"]
title = "Chờ ví mật khẩu khi đăng nhập"
text = """
Nếu KWallet hoặc GNOME Keyring vẫn đang khóa khi Katna khởi động và cửa
sổ mở khóa đã bị đóng, tài khoản của bạn không còn báo sai mật khẩu.
Chúng sẽ chờ và tự bắt đầu đồng bộ ngay khi bạn mở khóa ví, không cần
thoát Katna. Giờ khi đồng bộ, Katna sẽ đề nghị mở khóa lại.
"""

["2026-09-30-0606-pdf-rotate-and-top-bar"]
title = "Xoay trang PDF"
text = """
Trình xem PDF giờ có thể xoay trang theo chiều kim đồng hồ hoặc ngược
chiều (Ctrl+R và Ctrl+Shift+R), và bản sao có đánh dấu sẽ được lưu theo
hướng bạn đã xoay. Số trang và thu phóng chuyển lên thanh trên cùng, nên
không còn gì che trang.
"""

["2026-09-30-0610-calendar-events-stay-put"]
title = "Sự kiện nằm yên tại chỗ"
text = """
Nhấp vào một sự kiện hoặc việc cần làm trong Lịch rồi đổi chế độ xem
không còn khiến nó chạy theo con trỏ. Sự kiện giờ chỉ di chuyển khi bạn
giữ nút chuột và kéo nó; đổi chế độ xem hoặc trang, nhấn Esc hay mở thẻ
của nó sẽ trả nó về chỗ cũ, không thay đổi gì.
"""

["2026-09-30-0620-checkbox-partial-centred"]
title = "Ô chọn một phần trông cân đối"
text = """
Khi chỉ một số thư được chọn, hình vuông bên trong ô chọn tất cả giờ cách
đều mọi cạnh, dù tỷ lệ giao diện của bạn là bao nhiêu.
"""

["2026-09-30-0632-year-view-day-peek"]
title = "Xem kế hoạch trong ngày từ chế độ Năm"
text = """
Trong chế độ xem Năm của Lịch, để con trỏ trên một ngày có dấu chấm để
xem các sự kiện và việc cần làm của ngày đó trong một cửa sổ nhỏ bên
cạnh, mỗi mục có biểu tượng cho biết đó là gì và giờ của nó. Nhấp vào
một mục để mở, hoặc vào tên ngày để mở ngày đó. Trên điện thoại, chạm
vào ngày.
"""

["2026-09-30-0650-notification-opens-own-window"]
title = "Thông báo mở thư lên phía trước"
text = """
Nhấp vào thông báo thư mới sẽ mở thư đó trong cửa sổ riêng, ở phía
trước, dù Katna đang hiện gì. Trả lời tất cả mở thư với phần trả lời sẵn
sàng để gõ. Lưu trữ cất thư đi mà không mở gì cả và báo lại bằng một ghi
chú ngắn có nút Hoàn tác.
"""

["2026-09-30-0700-event-card-join-any-call"]
title = "Tham gia cuộc gọi Teams và Zoom từ Lịch"
text = """
Thẻ sự kiện giờ tìm cuộc gọi trong phần mô tả hoặc địa điểm, nên lời mời
Microsoft Teams, Zoom, Webex, Jitsi hay Google Meet có nút “Tham gia bằng”
ở đầu thẻ. Địa chỉ web trong phần mô tả trở thành liên kết, các dòng gạch
dưới không còn nữa, và Bạn có tham dự không? luôn ở dưới cùng khi phần
chi tiết cuộn.
"""

["2026-09-30-0715-click-away-closes-viewer"]
title = "Nhấp ra ngoài để đóng"
text = """
Nhấp vào vùng tối quanh tệp đính kèm để đóng trình xem, thay vì phải tìm
nút quay lại. Nhấp trên chính trang vẫn chọn văn bản và đánh dấu như
trước.
"""

["2026-09-30-0729-add-account-and-pop3"]
title = "Thêm tài khoản kiểu mới, và POP3"
text = """
Thêm tài khoản giờ bắt đầu từ nhà cung cấp của bạn: Google, Yahoo,
iCloud, Zoho, Fastmail, GMX, Yandex hoặc bất kỳ nhà cung cấp nào khác.
Katna cho biết trước nhà cung cấp cần gì, hiện từng bước khi kết nối, và
kết thúc bằng những gì đã thiết lập. Tài khoản POP3 cũng dùng được, và
Cài đặt > Tài khoản chọn thư của chúng được giữ trên máy chủ bao lâu.
"""

["2026-09-30-0802-ctrl-wheel-zoom"]
title = "Thu phóng bằng Ctrl và con lăn"
text = """
Trong trình xem tệp đính kèm, giữ Ctrl và lăn con lăn chuột để phóng to,
thu nhỏ quanh con trỏ, hoặc chụm hai ngón trên bàn di chuột. Cách này
dùng được với PDF, ảnh, tệp văn bản, bảng tính và tài liệu.
"""

["2026-09-30-0817-event-open-the-mail"]
title = "Mở thư đằng sau một sự kiện"
text = """
Các sự kiện Gmail tạo từ thư, như tàu, chuyến bay và khách sạn, có nút
Mở thư trên thẻ. Nút này mở thư đó trong Katna, hoặc trong Gmail khi
Katna không có. Việc cần làm tạo từ thư cũng mở được thư của nó từ thẻ
trên Lịch, và Ghi chú cuộc họp mở ra ngay, không chớp màn hình.
"""

["2026-09-30-0843-calendar-side-panel-menus"]
title = "Quản lý lịch từ bảng bên"
text = """
Nhấp chuột phải vào một lịch trong bảng bên của Lịch để chỉ hiện lịch đó,
đổi màu, đổi tên hoặc xóa nó. Nhấp chuột phải vào tên tài khoản để tạo
lịch mới trong tài khoản đó, hoặc hiện và ẩn mọi lịch của nó. Thay đổi
được gửi tới dịch vụ thư của bạn, nên hiện ở mọi nơi bạn dùng dịch vụ đó.
"""

["2026-09-30-1010-unread-list-keeps-open-mail"]
title = "Thư chưa đọc vẫn mở"
text = """
Mở một cuộc hội thoại trong Tất cả tài khoản > Chưa đọc không còn đóng nó
ngay lập tức. Đọc thư sẽ đánh dấu là đã đọc, và thư vẫn nằm trong danh
sách cho tới khi bạn đóng nó hoặc mở cuộc khác.
"""

["2026-09-30-1045-tracked-mail-arrives"]
title = "Thư có theo dõi lại đến nơi"
text = """
Thư gửi khi bật theo dõi có thể hiện trong Đã gửi mà không tới được ai.
Giờ thư được gửi tới mọi người nhận. Những thư bị mất theo cách này cần
được gửi lại.
"""

["2026-09-30-1114-no-checking-pill"]
title = "Không còn nhãn đang kiểm tra"
text = """
“Đang kiểm tra thư mới…” không còn bật lên trên danh sách. Mũi tên xoay
trên nút làm mới và trên hộp thư đến của từng tài khoản đã cho thấy thư
đang được kiểm tra, và lần kiểm tra thất bại vẫn cho biết lỗi gì.
"""

["2026-09-30-1300-windows-sign-in-and-domains"]
title = "Đăng nhập bằng Google trên Windows"
text = """
Katna cho Windows giờ có Đăng nhập bằng Google và Zoho như trên Linux, và
biết ai lưu trữ thư cho tên miền riêng của bạn, chẳng hạn địa chỉ Google
Workspace, khi bạn thêm tài khoản.
"""

["2026-09-30-1511-mail-tables"]
title = "Bảng trong thư hiển thị đúng"
text = """
Bảng trong thư, như danh sách công việc trong thông báo của GitHub
Actions, giữ các cột nằm cạnh nhau và thẳng hàng từ dòng này sang dòng
khác, thay vì bẻ tiêu đề thành mỗi dòng một chữ cái. Đường phân cách giữa
các phần của thư giờ cũng hiện ra.
"""

["2026-09-30-1550-taller-important-marker"]
title = "Dấu Quan trọng cao hơn"
text = """
Dấu Quan trọng bên cạnh ngôi sao cao thêm 2 px, nên không còn trông bị
ép dẹt cạnh ngôi sao và ô chọn. Nó vẫn nằm giữa dòng.
"""

["2026-09-30-1617-folder-click-goes-to-top"]
title = "Trở về đầu danh sách"
text = """
Khi danh sách thư đã cuộn xuống một màn hình, một nút tròn ở góc dưới bên
phải đưa nó trở về đầu. Nhấp vào thư mục bạn đang ở, như Hộp thư đến,
cũng vậy, giống trong Gmail, và phím Home cũng thế.
"""

["2026-09-30-1622-send-from-file-manager"]
title = "Gửi tệp từ trình quản lý tệp"
text = """
Nhấp chuột phải vào tệp hoặc thư mục trong Dolphin, GNOME Files hay
Windows Explorer và chọn Gửi bằng Katna Mail: một thư mới mở ra với các
tệp đã đính kèm, còn thư mục được gửi dưới dạng tệp zip. Nếu có nhiều
tài khoản thư, hãy chọn tài khoản gửi trong menu con.
"""

["2026-09-30-1624-files-page"]
title = "Mọi tệp ở một nơi"
text = """
Trang Tệp mới, ở cuối thanh ứng dụng, hiện mọi tệp đính kèm từ mọi tài
khoản, mới nhất trước. Lọc theo ảnh, PDF hoặc tài liệu, theo một tài
khoản, một người hay một khoảng thời gian, hoặc tìm theo tên, người gửi
hay tiêu đề. Nhấp chuột phải vào tệp để có thêm tùy chọn, và Hiện thư sẽ
đưa bạn tới thư đi kèm tệp đó.
"""

["2026-09-30-1643-dimmer-row-markers"]
title = "Danh sách thư dịu mắt hơn"
text = """
Ô chọn trống, ngôi sao hay dấu Quan trọng trong danh sách thư sẽ mờ hơn
cho tới khi con trỏ nằm trên dòng đó. Ngôi sao và dấu đã bật vẫn giữ màu.
"""

["2026-09-30-1704-folder-arrows-on-hover"]
title = "Ngăn thư mục gọn gàng hơn"
text = """
Các mũi tên nhỏ bên cạnh Hộp thư đến, Có gắn dấu sao và các thư mục khác
chỉ hiện khi con trỏ nằm trên thư mục đó. Thư mục bạn đã mở rộng vẫn giữ
mũi tên của nó.
"""

["2026-09-30-1712-arrow-keys-in-times"]
title = "Phím mũi tên trong ô thời gian"
text = """
Trong Chọn ngày và giờ, và trong giờ của một việc cần làm, phím Lên và
Xuống thay đổi phần mà con trỏ đang ở: giờ, phút hoặc SA/CH.
"""

["2026-09-30-1742-check-one-folder"]
title = "Kiểm tra thư mới cho một thư mục"
text = """
“Kiểm tra thư mới” trong menu chuột phải của thư mục giờ chỉ kiểm tra thư
mục đó, nên rất nhanh. Trên hộp thư đến của một tài khoản trong Tất cả
tài khoản, nó kiểm tra hộp thư đến của tài khoản đó, còn trên danh sách
như Hộp thư đến hay Đã gửi trong Tất cả tài khoản, nó kiểm tra thư mục
đó ở từng tài khoản.
"""

["2026-09-30-1742-frosted-viewer"]
title = "Trình xem nhẹ nhàng, phủ kính mờ"
text = """
Thanh trên cùng của trình xem tệp đính kèm mảnh và sáng hơn, còn trang,
thu phóng và xoay nằm gọn trên một thanh bo tròn. Quanh tệp, Katna Mail
hiện mờ dưới một lớp phủ tối nhẹ, và các thanh công cụ cũng là kính mờ.
Hiệu ứng mờ theo Cài đặt > Thử nghiệm; nếu tắt, trình xem dùng lớp phủ
tối đơn giản.
"""

["2026-09-30-1752-touchpad-glide"]
title = "Vuốt bàn di chuột trôi mượt"
text = """
Vuốt nhanh hai ngón trên bàn di chuột sẽ tiếp tục cuộn rồi chậm dần, như
trong các ứng dụng khác. Chạm lại vào bàn di chuột để dừng. Trên Wayland.
"""

["2026-09-30-1800-inbox-tabs-in-top-row"]
title = "Các thẻ hộp thư đến trên hàng đầu"
text = """
Chính, Quảng cáo, Mạng xã hội và các thẻ hộp thư đến khác giờ nằm trên
một thanh bo tròn ở hàng đầu của danh sách, mỗi thẻ có số thư chưa đọc
được tô màu. Vùng tô sáng trượt tới thẻ bạn chọn, và nhấp vào thẻ đang
mở sẽ đưa danh sách của nó về đầu. Khi danh sách hẹp, thanh này chiếm
một hàng riêng và hiện biểu tượng, vẫn giữ tên của thẻ đang mở; trên
điện thoại nó nằm trong thanh của danh sách, còn Làm mới nằm trong menu
Thêm.
"""

["2026-09-30-1805-account-menu"]
title = "Thông tin tài khoản trong menu chuột phải"
text = """
Nhấp chuột phải vào tên tài khoản trong danh sách thư mục, hoặc vào hộp
thư đến của nó trong Tất cả tài khoản, để xem địa chỉ, tình trạng đồng
bộ, lần kiểm tra gần nhất và dung lượng đã dùng. Từ đó bạn có thể kiểm
tra hộp thư đến, viết thư mới từ tài khoản đó, mở cài đặt của nó, hoặc
đăng nhập lại khi phiên đăng nhập đã hết hạn.
"""

["2026-09-30-1819-glass-search-box"]
title = "Ô tìm kiếm bằng kính"
text = """
Khi bật nền mờ, ô tìm kiếm là kính mờ với viền nhạt khi bạn không dùng
nó, và trở nên đặc khi bạn nhấp vào để gõ.
"""

["2026-09-30-1820-search-cancel-restores"]
title = "Hủy tìm kiếm, lấy lại thư của bạn"
text = """
Nhấn Escape hoặc xóa ô tìm kiếm giờ đưa bạn về đúng chỗ cũ: cùng thư
mục, cùng vị trí trong danh sách và thư bạn đang mở. Còn nếu bạn mở một
kết quả, phần tìm kiếm sẽ thay chỗ như trước.
"""

["2026-09-30-1840-first-run-window"]
title = "Lần khởi động đầu thân thiện hơn"
text = """
Trong lúc bạn thiết lập Katna Mail, cửa sổ hiện phía sau các trang thiết
lập dưới một lớp phủ nhạt: các ứng dụng, Soạn thư và ô tìm kiếm, với các
khung chờ mờ ở nơi thư mục và thư của bạn sẽ xuất hiện. Một bước mới giới
thiệu tài khoản Katna và liệt kê những gì nó bật (xác nhận đã đọc, theo
dõi liên kết, Hoạt động và dịch), hoặc bạn có thể bỏ qua.
"""

["2026-09-30-1850-windows-frame-and-blur"]
title = "Khung cửa sổ và hiệu ứng mờ của Katna trên Windows"
text = """
Trên Windows, Katna Mail giờ mở trong phạm vi màn hình, và phóng to khi
màn hình nhỏ. Cài đặt > Thử nghiệm có thể làm mờ những gì phía sau cửa
sổ, và khung riêng của Katna biến thanh trên cùng thành thanh tiêu đề
vào lần tới bạn mở Katna Mail.
"""

["2026-09-30-1851-dark-depth"]
title = "Dễ nhìn hơn với màu tối"
text = """
Với màu tối, những thứ nổi trên danh sách thư giờ sáng hơn một chút với
viền sáng nhạt, vì bóng đổ hầu như không thấy trên nền tối. Nút Lên đầu
trang, menu, cửa sổ Soạn thư và hộp thoại nổi bật rõ ràng. Màu sáng vẫn
như trước.
"""

["2026-09-30-1911-files-scrollbar"]
title = "Thanh cuộn trên trang Tệp"
text = """
Khi có nhiều tệp hơn sức chứa, một thanh cuộn mảnh hiện ở bên phải khi
bạn cuộn hoặc khi con trỏ nằm trên các tệp, rồi mờ dần. Kéo nó để lướt
nhanh qua các tệp, hoặc nhấp phía trên hay phía dưới nó để nhảy tới đó.
"""

["2026-09-30-1919-tabs-keep-open-mail"]
title = "Đổi thẻ vẫn giữ thư đang mở"
text = """
Khi ngăn đọc nằm cạnh danh sách, chọn thẻ hộp thư đến khác không còn
đóng thư bạn đang đọc; danh sách thay đổi còn thư vẫn mở.
"""

["2026-09-30-1925-inbox-tabs-centred"]
title = "Các thẻ hộp thư đến ở giữa"
text = """
Các thẻ hộp thư đến giờ nằm giữa hàng đầu của danh sách, chỉ dịch sang
bên vừa đủ chỗ cho các nút.
"""

["2026-09-30-1945-page-box-arrow-keys"]
title = "Phím mũi tên trong ô số trang"
text = """
Trong PDF, nhấp vào số trang và nhấn Lên hoặc Xuống để lùi hoặc tiến
một trang. Giữ phím để lật nhanh qua các trang.
"""

["2026-09-30-1952-phone-bar-labels"]
title = "Tên ứng dụng trên điện thoại theo cài đặt của bạn"
text = """
Khi tắt tên ứng dụng trong Cài đặt, thanh ở cạnh dưới của cửa sổ cỡ
điện thoại giờ chỉ hiện biểu tượng, căn giữa, giống thanh bên.
"""

["2026-09-30-1955-account-menu-icons"]
title = "Cài đặt và ngôn ngữ trong menu tài khoản"
text = """
Menu dưới ảnh tài khoản của bạn giờ mở ra với một hàng biểu tượng: mở
Cài đặt hoặc đổi ngôn ngữ. Lá cờ ngôn ngữ đã rời thanh trên cùng để
nhường chỗ.
"""

["2026-09-30-2001-phone-tabs-fold"]
title = "Mọi thẻ hộp thư đến luôn trong tầm tay"
text = """
Khi cửa sổ hẹp, các thẻ hộp thư đến thu gọn mượt mà thay vì bị ẩn: nhãn
biến thành biểu tượng lớn hơn, rồi số đếm lùi sang bên. Trên điện thoại,
các thẻ trải khắp thanh, dễ chạm, với Thêm ở cuối cùng thanh bo tròn đó.
"""

["2026-09-30-2012-fit-and-page-arrows"]
title = "Vừa khít, mũi tên trang và hơn thế trong trình xem"
text = """
Trình xem tệp đính kèm có nút Vừa khít: trang PDF vừa chiều cao cửa sổ,
ảnh vừa cửa sổ, còn tài liệu, trang chiếu và bảng tính vừa chiều ngang.
Ảnh còn có Kích thước thật và có thể xoay. Trỏ vào ô số trang để thấy
các mũi tên nhỏ giúp lùi hoặc tiến một trang, và trang chiếu có ô riêng.
"""

["2026-09-30-2019-folder-icon-colours"]
title = "Biểu tượng thư mục nhiều màu"
text = """
Biểu tượng trong ngăn thư mục giờ có màu cho biết mỗi thư mục chứa gì:
Chưa đọc màu xanh dương, Có gắn dấu sao màu vàng, Quan trọng màu hổ
phách, Đã gửi màu xanh lá, Thư rác màu đỏ, Thư nháp màu tím, và Hộp thư
đến theo màu nhấn của màn hình nền. Số thư nằm trong những ô bo tròn nhỏ
và nhạt.
"""

["2026-09-30-2040-tabs-no-slide"]
title = "Thẻ hộp thư đến nhanh hơn"
text = """
Nhấp vào một thẻ hộp thư đến giờ tô sáng nó ngay lập tức, chỉ với hiệu
ứng gợn sóng của cú nhấp, thay vì trượt vùng tô sáng qua các thẻ khác.
"""

["2026-10-01-0145-files-tidy"]
title = "Trang Tệp gọn gàng hơn"
text = """
Số đếm bên cạnh mỗi loại tệp và mỗi tài khoản giờ nằm trong cùng kiểu ô
bo tròn nhỏ như số đếm thư mục trong Thư. Đường kẻ dưới tiêu đề trang và
các hàng tệp cũng bắt đầu và kết thúc ở cùng một mép.
"""

["2026-10-01-0147-today-marker-fits"]
title = "Ngày hôm nay vừa khít dấu đánh dấu"
text = """
Trong chế độ xem Tháng của Lịch, dấu đánh dấu hôm nay giờ chứa trọn ngày.
Vào ngày mùng 1, nó trở thành ô bo tròn quanh “01 Th10” thay vì một vòng
tròn nhỏ mà nhãn tràn ra ngoài.
"""

["2026-10-01-0208-tab-counts-stay"]
title = "Số đếm trên thẻ đứng yên"
text = """
Mở một thẻ hộp thư đến không còn làm thanh thẻ nhảy. Thẻ đang mở giữ số
thư mới của nó, số này từ từ mờ thành màu xám dịu, và thu gọn mượt mà
khi bạn đã đọc hết thư trong thẻ đó.
"""

["2026-10-01-0225-files-keyboard"]
title = "Duyệt tệp bằng bàn phím"
text = """
Trên trang Tệp, các phím mũi tên giờ di chuyển giữa các tệp, Home và End
tới tệp đầu và cuối, và Enter mở tệp. Trong trình xem mở từ đó, mũi tên
chuyển tới tệp kế tiếp trên trang, bất kể nó đi kèm thư nào; Shift cùng
mũi tên thì chỉ đi qua các tệp đính kèm của cùng một thư.
"""

["2026-10-01-0254-files-dates"]
title = "Chọn ngày trên trang Tệp"
text = """
Ô thời gian trên trang Tệp giờ mở lịch hai tháng với các lựa chọn nhanh
như Tuần trước và Tháng này. Nhấp vào một ngày, hoặc kéo từ ngày này sang
ngày khác, và danh sách tệp thay đổi theo khi bạn kéo. Sau đó lăn con
lăn chuột trên ô để dời cùng khoảng thời gian đó sớm hơn hoặc muộn hơn.
"""

["2026-10-01-0256-color-schemes"]
title = "Bảng màu và màu nhấn"
text = """
Cài đặt > Giao diện giờ có Chế độ, Màu sắc và Màu nhấn là các lựa chọn
riêng. Chọn sáng hoặc tối, rồi một trong 14 bảng màu, như Trong sáng, Nord,
Solarized hay Catppuccin, hoặc giữ bảng màu của màn hình nền. Mỗi bảng
màu đều dùng được ở chế độ sáng và tối, và có thể đặt bất kỳ màu nhấn
nào lên trên.
"""

["2026-10-01-0310-badge-counts-what-notifies"]
title = "Số trên thanh tác vụ khớp với thông báo"
text = """
Số thư chưa đọc trên thanh tác vụ và khay hệ thống giờ đếm đúng những
thư gửi thông báo cho bạn: thẻ Chính của Hộp thư đến. Quảng cáo, Mạng xã
hội, Cập nhật và Diễn đàn không còn được cộng vào.
"""

["2026-10-01-0312-quiet-selected-row"]
title = "Thư mục đang mở nhẹ nhàng hơn"
text = """
Thư mục đang mở trong Thư, và chế độ xem đang mở trong Danh bạ, Việc cần
làm, Ghi chú và Tệp, giờ được đánh dấu bằng màu xám dịu thay vì màu
nhấn, nên Soạn thư và thanh ứng dụng nổi bật hơn còn biểu tượng thư mục
giữ màu riêng của chúng.
"""

["2026-10-01-0315-desktop-schemes"]
title = "Bảng màu của màn hình nền"
text = """
Cài đặt > Giao diện > Màu sắc còn liệt kê các bảng màu riêng của màn
hình nền: mọi bảng màu đã cài trên KDE Plasma, và trên Windows là màu
của Windows cùng các chủ đề Tương phản. Hệ thống giờ cũng dùng được ở
chế độ sáng và tối trên KDE, bằng bảng màu sáng hoặc tối đi cặp với bảng
màu của bạn, và Katna theo màu nhấn của Windows.
"""

["2026-10-01-0329-mute-folders"]
title = "Tắt tiếng một thư mục, một thẻ hoặc một tài khoản"
text = """
Chiếc chuông phía trên danh sách tắt tiếng thư mục hoặc thẻ Hộp thư đến
đang mở trong một giờ, đến sáng mai, hoặc cho tới khi bạn bật lại. Nhấp
chuột phải vào thư mục hoặc tài khoản để làm tương tự. Cài đặt >
Thông báo cho biết thư mục nào gửi thông báo, thư mục nào được đếm trên
thanh tác vụ, và mọi thứ đang bị tắt tiếng.
"""

["2026-10-01-0335-tray-style"]
title = "Biểu tượng khay có màu hoặc một màu"
text = """
Cài đặt > Chung > Môi trường máy tính > Biểu tượng khay có màu chọn
màu của Katna hoặc một màu giống các biểu tượng khác trên bảng điều
khiển. Kiểu một màu vẫn một màu khi có thư chưa đọc, và số thư chưa đọc
luôn màu đỏ. Trên Linux, biểu tượng khay mặc định là một màu; trên
Windows là có màu.
"""

["2026-10-01-0354-mute-conversations"]
title = "Tắt tiếng một cuộc hội thoại hoặc người gửi"
text = """
Chiếc chuông phía trên cuộc hội thoại đang mở sẽ tắt tiếng nó: thư trả
lời mới không còn gửi thông báo hay cộng vào số trên thanh tác vụ, và
một chiếc chuông gạch chéo đánh dấu nó trong danh sách. Nhấp chuột phải
vào cuộc hội thoại để chọn Tắt tiếng cuộc hội thoại hoặc Tắt tiếng người
gửi, hoặc nhấn M.
"""

["2026-10-01-0410-your-color-schemes"]
title = "Tự tạo bảng màu của bạn"
text = """
Cài đặt > Giao diện > Màu sắc > Tùy chỉnh sao chép bảng màu bạn đang
dùng vào một trình chỉnh sửa: đổi bất kỳ màu nào trong tám màu của nó ở
phía sáng và phía tối, xem cửa sổ thư với các màu đó, và Katna cho bạn
biết chỗ nào sẽ khó đọc. Nhập nhận tệp bảng màu của Katna hoặc KDE, và
nhấp chuột phải vào bảng màu của bạn để sửa, nhân bản, xuất hoặc xóa nó.
"""

["2026-10-01-0527-calendar-opens-on-week"]
title = "Lịch mở ở chế độ Tuần"
text = """
Katna Calendar lại mở ở chế độ xem Tuần, với những ngày sắp tới chia
theo giờ. Tháng, Ngày, Năm và các chế độ khác chỉ cách một cú nhấp trên
thanh trên cùng.
"""

["2026-10-01-0552-lighter-count-on-open-row"]
title = "Số đếm nổi bật trên thư mục đang mở"
text = """
Số đếm bên cạnh thư mục đang mở trong Thư, và bên cạnh loại tệp đang mở
trong Tệp, giờ nằm trong ô bo tròn sáng hơn màu xám của dòng, nên không
còn bị chìm vào đó, ở cả chế độ sáng và tối.
"""

["2026-10-01-0652-files-leave-out-small-pictures"]
title = "Tệp bỏ qua logo trong chữ ký"
text = """
Trang Tệp không còn đầy những logo và biểu tượng nhỏ đi kèm chữ ký email:
ảnh dưới 12 KB, hoặc rộng hay cao dưới 100 điểm ảnh, chỉ nằm dưới thư
của chúng. Thay đổi cả hai giới hạn, hoặc hiện mọi ảnh, trong Cài đặt >
Ứng dụng mặc định > Trang Tệp.
"""

["2026-10-01-0700-mute-from-contact"]
title = "Tắt tiếng người gửi từ thẻ liên hệ"
text = """
Thẻ liên hệ bên cạnh thư có chiếc chuông đứng đầu các nút: nó tắt tiếng
mọi thứ từ người gửi đó, và một chiếc chuông gạch chéo sau tên họ cho
thấy điều đó. Nhấp lại để nhận thư của họ như cũ.
"""

["2026-10-01-0803-select-hover-fits"]
title = "Nút chọn gọn gàng hơn"
text = """
Nền khi trỏ chuột phía sau ô chọn ở đầu danh sách thư giờ cao bằng các
nút bên cạnh, cách mép thẻ bằng khoảng cách tới đỉnh thẻ, và các góc của
nó theo góc của thẻ.
"""

["2026-10-01-0807-files-leave-out-signature-pictures"]
title = "Tệp cũng bỏ qua ảnh lớn trong chữ ký"
text = """
Ảnh mà ai đó gửi trong từ ba cuộc hội thoại trở lên, như biểu ngữ hay
ảnh chân dung trong chữ ký của họ, không còn hiện trên trang Tệp, biểu
tượng mạng xã hội cũng vậy, dù to đến đâu. Chúng vẫn hiện dưới thư của
mình, và tắt “Bỏ qua hình ảnh nhỏ” sẽ đưa tất cả trở lại.
"""

["2026-10-01-0830-muted-contact-mark"]
title = "Xem ai đang bị tắt tiếng"
text = """
Một chiếc chuông gạch chéo giờ đi theo tên người gửi bị tắt tiếng ở mọi
nơi họ xuất hiện: danh sách thư, thư đang mở, Danh bạ, ô Tới và Cc cùng
các gợi ý, trang Tệp, khách mời sự kiện và Báo cáo hoạt động. Không còn
phải thắc mắc vì sao thư của họ im lặng.
"""

["2026-10-01-0839-sounds"]
title = "Âm thanh cho thư mới, lời nhắc và khi gửi"
text = """
Cài đặt > Thông báo có mục Âm thanh: thư mới, lời nhắc, thư trở lại hộp
thư đến, thư đã gửi và thư không gửi được đều có thể chọn một âm thanh
từ màn hình nền, phát thử bằng nút bên cạnh, hoặc tắt đi. Âm thanh giờ
cũng phát trên KDE Plasma, và im lặng với thư bị tắt tiếng và khi bật
Không làm phiền.
"""

["2026-10-01-0925-chat-view"]
title = "Đọc hội thoại như trò chuyện (thử nghiệm)"
text = """
Bật Cài đặt > Thử nghiệm > Cuộc hội thoại dạng trò chuyện và thư giữa mọi
người sẽ đọc như một nhóm trò chuyện: mỗi thư là một bong bóng chỉ chứa
những gì được viết, thư của bạn ở bên phải, ảnh và tệp hiện như nội dung
đa phương tiện. Thư được trích dẫn và chữ ký nằm sau ··· trong mỗi bong
bóng, và nhấp vào tên sẽ hiện thẻ của người đó kèm chữ ký. Trả lời từ ô
ở dưới cùng, với Ctrl+Enter, thanh định dạng sau nút Aa và kẹp giấy cho
tệp, mẫu thư và chữ ký. Bản tin vẫn giữ cách xem thông thường, và nút
chuyển Trò chuyện | Thư đổi bất kỳ cuộc hội thoại nào sang cách xem kia.
"""

["2026-10-01-0946-forward-keeps-files"]
title = "Chuyển tiếp giữ nguyên tệp"
text = """
Chuyển tiếp một thư giờ mang theo các tệp đính kèm của nó, hiện dưới thư
để bạn có thể bỏ bớt bất kỳ tệp nào trước khi gửi. Đổi thư chuyển tiếp
thành thư trả lời sẽ lại bỏ chúng ra.
"""

["2026-10-01-1009-forward-a-file"]
title = "Chỉ chuyển tiếp tệp"
text = """
Trình xem tệp đính kèm có nút Chuyển tiếp trên thanh trên cùng: nó bắt
đầu một thư mới chỉ đính kèm tệp đó, không kèm thư gốc. Những tệp không
có bản xem trước cũng có Chuyển tiếp, và các thẻ tệp đính kèm dưới thư
đang mở cũng vậy, bên cạnh Lưu.
"""

["2026-10-01-1039-rephrase-with-ai"]
title = "Viết lại bằng AI"
text = """
Chọn văn bản trong thư và nhấn biểu tượng lấp lánh bên cạnh, hoặc
Ctrl+J, để viết lại cho rõ ràng hơn, ngắn gọn hơn, thân thiện hơn hoặc
trang trọng hơn, rồi chọn Thay thế. Katna AI miễn phí trong 30 ngày,
hoặc dùng khóa riêng của bạn từ Google Gemini, OpenAI, Claude, Mistral,
DeepSeek, OpenRouter hay một mô hình trên máy tính này. AI cũng có thể
viết nốt câu của bạn bằng chữ màu xám; bật tính năng này trong Cài đặt >
Soạn thư.
"""

["2026-10-01-1043-header-details-selectable"]
title = "Sao chép từ phần chi tiết của thư"
text = """
Phần chi tiết dưới “tới tôi” giờ có thể chọn và sao chép như chính nội
dung thư. Nhấp vào một địa chỉ để xem thẻ của người đó bên cạnh thư,
hoặc nhấp chuột phải để chọn Sao chép địa chỉ. Người bị tắt tiếng cũng
hiện chiếc chuông gạch chéo ở đó.
"""

["2026-10-01-1112-left-bar-button"]
title = "Một nút lớn, một cách thu gọn, trên mọi trang"
text = """
Nút lớn ở đầu thanh bên trái giờ trông giống nhau và nằm cùng chỗ trên
mọi trang, và làm đúng việc của trang đó: Soạn thư trong Thư và Tệp, Sự
kiện mới, Người liên hệ mới, Việc cần làm mới và Ghi chú mới. Thu gọn thanh
bên trái sẽ thu gọn nó ở mọi nơi, và khi đã thu gọn, nút của mỗi trang
chờ sẵn ở đầu thanh ứng dụng. Trên điện thoại, đó là nút nổi.
"""

["2026-10-01-1115-color-picker"]
title = "Bộ chọn màu trong trình sửa bảng màu"
text = """
Nhấp vào một màu trong trình sửa bảng màu và bộ chọn màu mở ra ngay bên
cạnh: kéo trên ô vuông và thanh sắc độ, gõ giá trị hex, dùng lại các màu
của bảng màu hoặc màu vừa chọn, hoặc lấy màu từ bất kỳ đâu trên màn
hình bằng ống hút màu trên KDE và GNOME.
"""

["2026-10-01-1130-contact-card-folds-folders"]
title = "Thẻ liên hệ tự tạo chỗ"
text = """
Trong cửa sổ quá hẹp để ngăn thư mục và thẻ liên hệ nằm cạnh nhau, thẻ
giờ thu gọn thư mục khi mở ra, và thư mục trở lại khi thẻ đóng. Thư mục
bạn tự thu gọn vẫn giữ nguyên trạng thái thu gọn.
"""

["2026-10-01-1132-open-mail-scroll-bar"]
title = "Thanh cuộn trong thư dài"
text = """
Một cuộc hội thoại dài giờ hiện thanh cuộn kín đáo giống trang Tệp khi
bạn cuộn hoặc trỏ vào nó. Cả hai thanh giờ đều mảnh hơn và to ra khi con
trỏ tới gần. Kéo thanh, hoặc nhấp dọc theo nó, để nhảy tới bất kỳ đâu.
"""

["2026-10-01-1240-contact-card-close"]
title = "Cất thẻ liên hệ, xem ai đang trong cuộc trò chuyện"
text = """
Thẻ liên hệ bên cạnh cuộc hội thoại có nút ✕ ở góc, và nhấp lại vào ảnh
hoặc địa chỉ của cùng người đó sẽ cất thẻ đi. Trong cách xem trò chuyện,
nhấp vào phần đầu sẽ liệt kê mọi người trong cuộc trò chuyện kèm địa chỉ
và số thư mỗi người đã gửi.
"""

["2026-10-01-1241-two-blur-switches"]
title = "Hiệu ứng mờ theo ý bạn"
text = """
Hiệu ứng mờ giờ có hai công tắc trong Cài đặt > Thử nghiệm: một cho nền
cửa sổ và một cho menu và hộp thoại. Menu kính mờ được bật mặc định, kể
cả khi nền cửa sổ vẫn để đặc.
"""

["2026-10-01-1502-fainter-row-lines"]
title = "Đường kẻ giữa các thư nhẹ hơn"
text = """
Đường kẻ giữa các thư trong danh sách giờ nhạt hơn, nên danh sách trông
như một cột liền mạch, dịu mắt ở cả chế độ sáng và tối.
"""

["2026-10-01-1505-contact-close-round"]
title = "Một nút đóng cho mọi ngăn"
text = """
Nút ✕ trên thẻ liên hệ giờ là nút tròn giống nút ✕ trên thư đang mở, với
cùng vòng tròn xám khi bạn trỏ vào.
"""

["2026-10-01-1525-thread-count"]
title = "Số thư gọn gàng hơn"
text = """
Số thư trong cuộc hội thoại giờ nằm cạnh các tên với một biểu tượng trò
chuyện nhỏ, căn giữa theo dòng tên thay vì nhô lên phía trên.
"""

["2026-10-01-1541-chat-attach-from-files"]
title = "Đính kèm từ Tệp trong cuộc trò chuyện"
text = """
Trong cuộc trò chuyện (Cài đặt > Thử nghiệm), kẹp giấy có Từ Tệp: chọn
bất kỳ tệp nào đã đến hoặc đi cùng thư của bạn, tệp của cuộc hội thoại
này lên trước. Đánh dấu nhiều tệp, xem một tệp bằng biểu tượng con mắt,
và xem tổng dung lượng so với 25 MB mà một thư có thể mang. Kẹp giấy giờ
nằm trong ô trả lời, còn Aa mở một thanh mảnh chỉ với các kiểu chữ mà
cuộc trò chuyện cần.
"""

["2026-10-01-1553-rephrase-card-text"]
title = "Viết lại dùng được với khóa Gemini mới"
text = """
Khi bật menu kính mờ, thẻ Viết lại (Ctrl+J) từng mở ra trống trơn; giờ
các gợi ý hiện trên lớp kính mờ. Google Gemini giờ dùng
gemini-3.5-flash-lite trừ khi bạn gõ mô hình khác, vì khóa Gemini mới
không còn dùng được 2.5 Flash-Lite, và khóa sai sẽ được báo rõ.
"""

["2026-10-01-1624-rephrase-button"]
title = "Viết lại không cần chọn, và gợi ý nhanh hơn"
text = """
Biểu tượng lấp lánh bên cạnh Định dạng ở cuối thư mới, và trong ô trả
lời của cách xem trò chuyện, viết lại mọi thứ bạn đã viết khi không chọn
gì, hoặc chỉ phần được chọn khi có; Ctrl+J cũng vậy. Gợi ý dài hơn bằng
AI đến nhanh hơn nhiều, và ô Mô hình trong Cài đặt > Soạn thư liệt kê
các mô hình dịch vụ của bạn cung cấp khi bạn gõ.
"""

["2026-10-01-1626-dimmer-preview"]
title = "Dòng xem trước nhẹ nhàng hơn"
text = """
Văn bản xem trước dưới tiêu đề của mỗi thư trong danh sách giờ mờ hơn,
nên người gửi và tiêu đề nổi bật hơn, ở cả chế độ sáng và tối.
"""

["2026-10-01-1645-frosted-dialogs"]
title = "Hộp thoại kính mờ"
text = """
Khi bật menu và hộp thoại kính mờ, hộp thoại cũng là kính mờ: Thêm tài
khoản thư, Giới thiệu, Có gì mới, cập nhật, chia sẻ, xem trước khi in,
nhãn, câu hỏi xóa và gỡ bỏ, thẻ lần chạy đầu và hộp thoại liên kết của
Soạn thư.
"""

["2026-10-01-1650-chat-pins"]
title = "Ghim tối đa 5 mục trong cuộc trò chuyện"
text = """
Trong cuộc trò chuyện (Cài đặt > Thử nghiệm), trỏ vào một bong bóng và
nhấn biểu tượng ghim, hoặc nhấp chuột phải vào một tệp, để giữ nó ở trên
cùng. Một thanh mảnh dưới phần đầu hiện các mục đã ghim: nhấp vào để lần
lượt nhảy tới từng mục, hoặc mở danh sách để kéo sắp xếp hay bỏ ghim.
Các mục ghim chỉ lưu trên máy tính này.
"""

["2026-10-01-1655-chat-signatures"]
title = "Cuộc trò chuyện bỏ chữ ký và chân thư"
text = """
Bong bóng trò chuyện giờ chỉ hiện những gì người ta viết. Lời chào cuối
thư như “Trân trọng”, chữ ký công ty dưới một đường kẻ hoặc kèm địa chỉ
và số điện thoại, và chân thư có liên kết hủy đăng ký hay thông báo đều
nằm sau ô ···, cùng với chữ ký mà ai đó lặp lại trong mọi thư.
"""

["2026-10-01-1805-blur-amount"]
title = "Chọn độ mờ của menu kính mờ"
text = """
Menu và hộp thoại kính mờ giờ trong hơn và theo cường độ làm mờ của KDE.
Bật Tùy chỉnh mức làm mờ trong Cài đặt > Thử nghiệm > Làm mờ để tự đặt
mức làm mờ và độ mờ đục.
"""

["2026-10-01-1825-chat-company"]
title = "Nơi họ làm việc, ngay trên thẻ"
text = """
Trong cuộc trò chuyện (Cài đặt > Thử nghiệm), thẻ của một người giờ có
mục Công ty: công ty làm gì, ở đâu, thành lập từ khi nào, và liên kết tới
trang web cùng các trang của công ty, lấy từ trang chủ của chính công ty
và Wikipedia. Mục này theo công tắc Ảnh người gửi.
"""

["2026-10-02-0052-smooth-start-after-updates"]
title = "Khởi động mượt mà sau khi cập nhật"
text = """
Sau khi cập nhật, Katna Mail không còn báo không mở được kho thư trong
lúc chuẩn bị thư của bạn cho phiên bản mới. Nó hiện hình đang tải quen
thuộc trong vài giây đó, rồi tới thư của bạn.
"""

["2026-10-02-0106-calmer-dialogs"]
title = "Hộp thoại dịu mắt hơn"
text = """
Hộp thoại kính mờ đặc hơn menu, nên danh sách thư nhiều chữ không còn
lộ qua chúng. Giới thiệu, Có gì mới và Kiểm tra cập nhật mở ra mà không
làm tối cửa sổ phía sau.
"""

["2026-10-02-0111-chat-pin-text"]
title = "Ghim vài chữ từ cuộc trò chuyện"
text = """
Trong cuộc trò chuyện (Cài đặt > Thử nghiệm), văn bản trong bong bóng
giờ có thể chọn và sao chép như mọi thư. Nhấp chuột phải vào những chữ
bạn đã chọn trong một bong bóng và chọn Ghim lên đầu để giữ chúng trên
thanh ghim của cuộc trò chuyện.
"""

["2026-10-02-0124-event-editor-clear"]
title = "Nút Sự kiện mới không che trình sửa sự kiện"
text = """
Nút Sự kiện mới của thanh bên trái không còn đè lên tiêu đề của sự kiện
bạn đang viết hoặc sửa trong trình sửa đầy đủ. Nút trở lại khi trình
sửa đóng.
"""

["2026-10-02-0150-chat-format-bar"]
title = "Thanh Aa đầy đủ hơn trong cuộc trò chuyện"
text = """
Thanh Aa của ô trả lời trò chuyện giờ có các công cụ của Soạn thư: hoàn
tác, phông chữ, cỡ chữ, căn lề và thụt lề, bên cạnh các kiểu chữ sẵn có.
Trong cửa sổ hẹp, thanh xuống dòng thứ hai. Nút màu hiện màu chữ và màu
tô sáng của bạn cạnh nhau, trong cả Soạn thư.
"""

["2026-10-02-0210-conversation-summaries"]
title = "Tóm tắt cuộc hội thoại"
text = """
Nhấp chuột phải vào một cuộc hội thoại và chọn Tóm tắt, hoặc nhấn
Shift+S, để có một thẻ bên cạnh cho biết cuộc hội thoại nói về gì, điều
gì đã được thống nhất và việc gì đang chờ bạn, mà không cần mở hay đánh
dấu là đã đọc. Trong cuộc hội thoại đang mở, biểu tượng lấp lánh phía
trên đặt bản tóm tắt dưới tiêu đề; trong cách xem trò chuyện, nó nằm
trong một dải dưới phần đầu. Mỗi ý đều ghi rõ thư mà nó lấy từ đó, và
khi có thư mới từ lần bạn đọc trước, bản tóm tắt chỉ nói về phần đó. Cần
bật trợ giúp viết bằng AI trong Cài đặt > Soạn thư.
"""

["2026-10-02-0215-system-colors-follow-mode"]
title = "Sáng và Tối dùng được với màu Hệ thống"
text = """
Khi Màu sắc đặt là Hệ thống và bảng màu của màn hình nền chỉ có tối
(hoặc chỉ có sáng), Cài đặt > Giao diện > Chế độ giờ lại chuyển Katna
giữa sáng và tối: phía còn lại dùng màu riêng của Katna với màu nhấn
của màn hình nền.
"""

["2026-10-02-0218-signature-details-on-card"]
title = "Thông tin chữ ký về đúng chỗ"
text = """
Thẻ của một người không còn hiện chữ ký của họ thành một khối. Các thông
tin trong đó về đúng chỗ: mọi số điện thoại, ghi rõ di động, trực tiếp
hay fax, nằm trong thông tin liên hệ, còn tập đoàn, văn phòng, trang web
và các trang của công ty nằm trong mục Công ty. Trang mạng xã hội hiện
dưới dạng biểu tượng nhỏ một màu, còn ảnh, biểu ngữ và chân thư được bỏ
đi.
"""

["2026-10-02-0225-chat-subject-line"]
title = "Biết khi tiêu đề cuộc trò chuyện thay đổi"
text = """
Trong cuộc trò chuyện (Cài đặt > Thử nghiệm), một dòng nhỏ ở giữa giờ
cho biết khi ai đó đổi tiêu đề, giống như cách nó cho biết ai đã thêm
ai.
"""

["2026-10-02-0225-no-blur-ghost"]
title = "Không còn vệt mờ khi đóng hộp thoại"
text = """
Đóng Giới thiệu, Có gì mới, Kiểm tra cập nhật hay bất kỳ hộp thoại hoặc
menu kính mờ nào không còn để lại một mảng mờ trong chốc lát: hiệu ứng
mờ tan đi cùng hộp thoại.
"""

["2026-10-02-0236-chat-on-phones"]
title = "Cuộc trò chuyện vừa với điện thoại"
text = """
Trong cửa sổ cỡ điện thoại, cuộc trò chuyện (Cài đặt > Thử nghiệm) chỉ
có một hàng đầu với Quay lại và ⋮, và bong bóng dùng nhiều chiều ngang
hơn. Giữ một bong bóng để mở menu của nó từ dưới lên, và chạm vào tên
hoặc ảnh để xem thẻ của người đó theo cùng cách. Vuốt xuống hoặc chạm ra
ngoài để cất đi.
"""

["2026-10-02-0258-frost-stays-on-scroll"]
title = "Lớp kính mờ đứng yên khi danh sách cuộn"
text = """
Trong danh sách kính mờ có cuộn, như danh sách người trong cuộc trò
chuyện hay một menu dài, nền kính mờ giờ đứng yên trong khi các hàng
cuộn qua trên nó.
"""

["2026-10-02-0301-rephrase-card-above-tools"]
title = "Viết lại nằm phía trên thanh định dạng"
text = """
Thẻ Viết lại giờ mở ngay phía trên thanh định dạng, trong ô trả lời và
trong Soạn thư, thay vì đè lên danh sách thư. Kéo tay nắm nhỏ ở đầu thẻ
để dời nó sang chỗ khác; lần sau nó lại mở ở vị trí quen thuộc.
"""

["2026-10-02-0306-fainter-lines-light"]
title = "Đường kẻ nhạt hơn ở chế độ sáng"
text = """
Ở chế độ sáng, đường kẻ giữa các thư trong danh sách và giữa các thư của
một cuộc hội thoại đang mở nhạt hơn, nên trang trông dịu hơn.
"""

["2026-10-02-0315-card-button-bar"]
title = "Thẻ người giữ các nút trong tầm tay"
text = """
Cuộn thẻ người và các nút của nó trượt lên thành một thanh kính mờ mảnh
bên cạnh nút đóng, kèm ảnh nhỏ của người đó. Nút đóng không còn che nội
dung bạn đang đọc.
"""

["2026-10-02-0412-button-hover"]
title = "Nút phản hồi mượt mà khi trỏ chuột"
text = """
Khi bạn trỏ vào một nút, nền tròn của nó giờ lớn dần từ giữa và hiện
dần lên, như trong Gmail, rồi tan nhanh khi bạn trỏ đi. Trả lời, Chuyển
tiếp và các nút bo tròn khác hiện lên nhẹ nhàng.
"""

["2026-10-02-0425-chat-draft-to-mail"]
title = "Thư trả lời trong trò chuyện theo bạn sang Thư"
text = """
Chuyển cuộc trò chuyện sang Thư trong lúc đang viết trả lời giờ cuộn
xuống phần trả lời với con trỏ vẫn ở trong đó, và chuyển ngược lại cũng
giữ nguyên.
"""

["2026-10-02-0425-write-reply"]
title = "Viết thư trả lời bằng AI"
text = """
Khi thư trả lời hoặc chuyển tiếp vẫn còn trống, biểu tượng lấp lánh bên
cạnh Định dạng (hoặc Ctrl+J) sẽ viết giúp bạn. Chọn một trong ba ý lấy
từ cuộc hội thoại, hoặc tự nói nội dung cần viết, rồi Chèn bản nháp và
sửa tùy ý. Khi bạn đã gõ, biểu tượng lấp lánh lại dùng để viết lại. Cần
bật trợ giúp viết bằng AI trong Cài đặt > Soạn thư.
"""

["2026-10-02-0430-compose-beside-reply"]
title = "Soạn thư khi đang viết dở thư trả lời"
text = """
Soạn thư giờ mở thư mới ngay cả khi bạn đang viết thư trả lời, trong
cuộc trò chuyện hay dưới cuộc hội thoại. Thư trả lời chờ nguyên như lúc
bạn để lại và trở lại khi thư mới được gửi hoặc đóng, hoặc khi bạn nhấp
để trả lời lại cuộc hội thoại đó.
"""

["2026-10-02-0436-mark-unread-icon"]
title = "Biểu tượng Đánh dấu là chưa đọc rõ ràng hơn"
text = """
Đánh dấu là chưa đọc giờ hiện hình phong bì có dấu chấm, trong menu, trên
thanh công cụ và trên các nút khi trỏ vào thư, nên không còn trông như
biểu tượng thư thông thường.
"""

["2026-10-02-0452-fainter-pane-lines"]
title = "Thanh công cụ và thẻ nhẹ nhàng hơn"
text = """
Ở chế độ sáng, đường kẻ dưới các thanh công cụ và phần đầu của thư đang
mở, và phía trên Trả lời và Chuyển tiếp, nhạt như đường kẻ giữa các thư.
Nền phía sau các thẻ hộp thư đến cũng sáng hơn.
"""

["2026-10-02-0453-google-drive-in-files"]
title = "Google Drive của bạn trong Tệp"
text = """
Tệp giờ hiện ổ Drive của mỗi tài khoản Google dưới mục Ổ lưu trữ ở cột
bên. Mở các thư mục, tìm kiếm trong đó, và mở, đính kèm hoặc tải xuống
tệp ngay tại chỗ. Lần đầu tiên, nhấn Cho phép để Katna được đọc ổ Drive.
"""

["2026-10-02-0515-rephrase-subject"]
title = "Viết lại tiêu đề"
text = """
Khi bạn đã gõ tiêu đề, biểu tượng lấp lánh ở cuối dòng sẽ gợi ý ba cách
nói khác, dựa trên tiêu đề và nội dung thư bạn đã viết tới lúc đó. Chọn
một cách để dùng; Hoàn tác trả lại những gì bạn đã gõ. Cần bật trợ giúp
viết bằng AI trong Cài đặt > Soạn thư.
"""

["2026-10-02-0525-quieter-compose"]
title = "Cửa sổ Soạn thư dịu mắt hơn"
text = """
Cửa sổ Thư mới nổi lên với khoảng cách đều tới các mép cửa sổ. Tới, Cc,
Bcc và Từ nằm sát nhau không có đường kẻ giữa, người nhận là các thẻ tô
màu nhẹ, và Từ chỉ là một dòng kín đáo. Mã hóa, ký số, theo dõi và xác
nhận đã đọc chung một nhóm nhỏ, còn công cụ viết nằm trên một thanh nhẹ
bên cạnh Gửi.
"""

["2026-10-02-0553-upload-to-drive"]
title = "Tải lên Google Drive từ Tệp"
text = """
Khi đang mở một Google Drive trong Tệp, nút Soạn thư trở thành Tải lên.
Nhấp vào để gửi tệp vào thư mục đang mở, hoặc dùng mũi tên của nó để tải
lên cả một thư mục. Lần đầu tiên, nhấn Cho phép để Katna được thêm tệp
vào ổ Drive của bạn.
"""

["2026-10-02-0555-reply-from-summary"]
title = "Trả lời từ bản tóm tắt"
text = """
Thẻ tóm tắt bạn mở bằng nhấp chuột phải giờ có Trả lời. Nút này biến
chính thẻ đó thành thư trả lời: chọn một ý hoặc nói nội dung cần viết,
sửa bản nháp nếu muốn, rồi Gửi, hoặc mở nó trong cuộc hội thoại để viết
tiếp. Thư trả lời bạn đóng mà không gửi sẽ chờ trong ô trả lời. Thẻ giờ
cũng mở ngay tại chỗ bạn nhấp.
"""

["2026-10-02-0559-draft-saved-signature-tag"]
title = "Thư nháp tự lưu khi bạn viết"
text = """
Thư bạn đang viết giờ tự lưu vào Thư nháp vài giây một lần, và dòng “Đã
lưu thư nháp” hiện kín đáo bên cạnh tiêu đề. Một nhãn nhạt bên cạnh chữ
ký cho biết tên chữ ký; nhấp vào để chọn chữ ký khác. Góc của cửa sổ
Soạn thư cũng thẳng hàng với thẻ bên cạnh.
"""

["2026-10-02-0654-attach-from-drive"]
title = "Đính kèm từ Google Drive"
text = """
Kẹp giấy của Soạn thư giờ mở bộ chọn Tệp, giống Từ Tệp trong cuộc trò
chuyện, với Google Drive của bạn bên cạnh các tệp trong thư và Máy tính
này… cho mọi thứ khác. Tệp vừa dung lượng được đưa vào thư; tệp lớn và
Google Docs được gửi dưới dạng liên kết, chia sẻ với người nhận khi bạn
gửi.
"""

["2026-10-02-0734-peek-and-reply-in-notifications"]
title = "Xem nhanh và trả lời từ thông báo"
text = """
Thông báo thư mới giờ có Xem nhanh, hiện chính nội dung thư ngay trong
thông báo, và Trả lời, nơi bạn gõ câu trả lời tại chỗ rồi nhấn Gửi. Thư
được gửi từ tài khoản đã nhận thư, sau thời gian Hủy gửi của bạn; Hoàn
tác sẽ mở nó trong Katna Mail để viết tiếp. Trên Linux, thư mới còn có
tiếng chuông riêng to hơn; chọn tiếng khác trong Cài đặt > Thông báo.
"""

["2026-10-02-0735-drive-viewer-opens-at-once"]
title = "Tệp trên Drive mở ngay"
text = """
Mở một tệp từ ổ Drive giờ hiện trình xem ngay lập tức, với một vòng cung
xoay cho tới khi tệp tải xong. Các ghi chú ở cuối cửa sổ giờ nhận cú
nhấp của riêng chúng, nên Đóng không còn nhấp nhầm vào thứ nằm bên dưới.
"""

["2026-10-02-0740-smaller-updates"]
title = "Bản cập nhật nhỏ hơn"
text = """
Bản cập nhật giờ chỉ tải những gì thay đổi, thường chỉ vài megabyte thay
vì toàn bộ gói. Katna dựng phiên bản mới từ phiên bản bạn đang có và
kiểm tra trước khi cài, và tải cả gói bất cứ khi nào không làm được như
vậy.
"""

["2026-10-02-0755-faint-lines-everywhere"]
title = "Đường kẻ nhạt ở mọi nơi"
text = """
Ở chế độ sáng, mọi đường kẻ giữa các thành phần, dưới phần đầu và quanh
các thẻ giờ đều nhạt như đường kẻ giữa các thư, kể cả thẻ tóm tắt. Ô
nhập, thẻ nhỏ và nút vẫn giữ đường viền rõ ràng.
"""

["2026-10-02-0756-ai-replies-signed"]
title = "Thư trả lời bằng AI kết thúc bằng chữ ký của bạn"
text = """
Thư trả lời và ghi chú do AI viết không còn kết thúc bằng “Trân trọng” và
tên bạn. Thay vào đó, chữ ký của bạn sẽ ký tên: trong thư trả lời của
thẻ tóm tắt, nhãn chữ ký dưới văn bản chọn chữ ký nào, như trong Soạn
thư.
"""

["2026-10-02-0801-unified-inbox-tabs"]
title = "Thẻ trong hộp thư đến hợp nhất"
text = """
Hộp thư đến chung của mọi tài khoản giờ cũng có thẻ: Chính, Quảng cáo,
Mạng xã hội, Cập nhật và Diễn đàn, với thư của từng tài khoản
nằm trong thẻ đúng loại. Một dấu chấm bên cạnh mỗi người gửi cho biết
thư đến tài khoản nào. Chọn một tài khoản bên dưới để xem các thẻ riêng
của tài khoản đó, hoặc chọn bộ thẻ khác trong Cài đặt > Hộp thư đến.
"""

["2026-10-02-0805-feeds-removed"]
title = "Nguồn tin đã rời thanh bên trái"
text = """
Katna sẽ không đọc nguồn tin RSS và Atom nữa, nên nút Nguồn tin và trang
“sắp ra mắt” của nó đã rời thanh bên trái. Tệp vẫn giữ Ctrl+7.
"""

["2026-10-02-0820-drive-bin-and-rename"]
title = "Đổi tên và xóa tệp trên ổ lưu trữ"
text = """
Trong Tệp, tệp hoặc thư mục trong Google Drive hay OneDrive giờ có Đổi
tên và Chuyển vào thùng rác trong menu. Đổi tên cho bạn gõ đè tên ngay
tại chỗ (F2), còn Chuyển vào thùng rác (Del) đi kèm Hoàn tác.
"""

["2026-10-02-0827-files-chips-on-phones"]
title = "Bộ lọc của Tệp vừa với điện thoại"
text = """
Trên điện thoại, các bộ lọc của trang Tệp không còn bị cắt ở mép. Các
loại tệp thu gọn thành biểu tượng, loại bạn đã chọn vẫn giữ nhãn, còn
bộ lọc người, ngày và thứ tự có một hàng riêng.
"""

["2026-10-02-0828-uploads-tray"]
title = "Theo dõi tệp đang tải lên"
text = """
Tệp bạn tải lên Google Drive hay OneDrive giờ hiện trong một khay ở góc
dưới bên phải, mỗi tệp có một vòng đầy dần khi tải lên và thời gian còn
lại. Hủy một tệp hoặc tất cả, thu gọn khay, và nhấp vào tệp đã xong để
mở thư mục của nó.
"""

["2026-10-02-0838-drive-share"]
title = "Chia sẻ tệp trên ổ lưu trữ từ Katna"
text = """
Chia sẻ… trong menu của tệp Google Drive hay OneDrive trong Tệp mở hộp
thoại Chia sẻ: thêm người với vai trò Người xem, Người nhận xét hoặc
Người chỉnh sửa, thay đổi hoặc gỡ quyền của người đã có, và mở cho bất
kỳ ai có đường liên kết. Dịch vụ lưu trữ chỉ gửi email cho họ nếu bạn
đánh dấu chọn.
"""

["2026-10-02-0909-soft-search-box"]
title = "Ô tìm kiếm mềm mại hơn"
text = """
Ô tìm kiếm ở trên cùng nhẹ nhàng hơn: viền và nền rất nhạt khi bạn không
dùng, và là ô trắng với viền màu nhấn nhẹ khi bạn gõ, thay vì thanh bo
tròn màu xám với vòng màu dày.
"""

["2026-10-02-0942-hourly-update-check"]
title = "Bản cập nhật đến sớm hơn"
text = """
Katna giờ kiểm tra phiên bản mới mỗi giờ và ngay khi máy tính thức dậy từ chế độ ngủ, nên thông báo cập nhật sẽ đến ngay sau khi có bản phát hành.
"""

["2026-10-02-0958-faint-lines-dark"]
title = "Đường kẻ mờ cả ở chế độ tối"
text = """
Ở chế độ tối, các đường kẻ giữa các thư, dưới tiêu đề và quanh các thẻ giờ mờ như ở chế độ sáng. Ô nhập, chip và nút vẫn giữ đường viền rõ ràng.
"""

["2026-10-02-1200-smaller-updates-after-a-break"]
title = "Bản cập nhật nhỏ sau thời gian vắng mặt"
text = """
Bản cập nhật vẫn nhỏ ngay cả khi bạn bỏ qua một hai ngày phiên bản mới.
Katna giờ đi từng bước từ phiên bản bạn đang có qua các phiên bản trước đó,
mỗi bước vài megabyte, thay vì tải lại toàn bộ gói.
"""

["2026-10-02-1218-replied-arrow"]
title = "Biết thư nào bạn đã trả lời"
text = """
Một mũi tên trả lời nhỏ trên dòng của danh sách thư cho biết bạn đã trả lời
thư đó: bạn đã viết thư mới nhất của cuộc hội thoại, tại đây hoặc trên web.
Mũi tên biến mất khi người kia viết lại.
"""

["2026-10-02-1219-tray-icon-follows-dark"]
title = "Biểu tượng khay theo chế độ sáng và tối"
text = """
Biểu tượng khay một màu giờ đổi theo bảng điều khiển ngay khi bạn chuyển
giữa chế độ sáng và tối, thay vì đợi đến khi có thư mới.
"""

["2026-10-02-1220-reply-ideas-breathe"]
title = "Gợi ý trả lời cho biết chúng đang đến"
text = """
Trong khi đang yêu cầu gợi ý trả lời, ở Trả lời của bản tóm tắt hoặc trong
Viết thư trả lời, các khung hình của chúng giờ nhấp nhô như của chính bản
