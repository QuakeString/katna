text = """
Để con trỏ trên một từ bị gạch chân, hoặc nhấp vào nó, và các gợi ý sửa
hiện ngay bên dưới: gợi ý chính tả, sửa ngữ pháp và Bỏ qua, trong nội
dung và tiêu đề. Nhấp chuột phải vẫn mở menu đầy đủ.
"""

["2026-09-27-1201-recipient-chips"]
title = "Người nhận hiện dưới dạng thẻ"
text = """
Địa chỉ trong Tới, Cc và Bcc trở thành các thẻ chỉ hiện tên. Mũi tên
trên thẻ cho xem địa chỉ của thẻ, và nhấp đúp để sửa. Những gì không
phải là địa chỉ hợp lệ sẽ được đánh dấu màu đỏ, và Gửi sẽ yêu cầu bạn
sửa trước.
"""

["2026-09-27-1253-start-at-login"]
title = "Katna khởi động khi đăng nhập"
text = """
Giờ đây Katna khởi động lặng lẽ khi bạn đăng nhập: thư được đồng bộ,
thông báo thư mới và biểu tượng ở khay xuất hiện mà không cần mở cửa sổ.
Tắt tính năng này, hoặc cho cửa sổ mở cùng, trong Cài đặt > Chung > Môi
trường máy tính.
"""

["2026-09-27-1215-paste-and-drop"]
title = "Dán và thả mọi thứ vào thư"
text = """
Văn bản sao chép từ Word, LibreOffice hay một trang web giữ nguyên phông
chữ, màu sắc và danh sách, còn các ô từ Excel, LibreOffice Calc hay
Google Sheets được đưa vào dưới dạng bảng. Một thanh nhỏ bên dưới phần
bạn vừa dán cho phép đổi nó thành bảng, ảnh hoặc văn bản thuần;
Ctrl+Shift+V dán văn bản thuần. Tệp được sao chép trong Dolphin hoặc kéo
vào thư sẽ được đính kèm, còn ảnh sẽ hỏi bạn muốn chèn vào nội dung hay
đính kèm.
"""

["2026-09-27-1300-new-logo"]
title = "Logo mới của Katna"
text = """
Katna giờ đã có logo riêng: chữ কাটনা trên một tấm thẻ đặt trên phong
bì. Bạn sẽ thấy nó trong menu ứng dụng, bảng điều khiển, khay, thanh
trên cùng và Giới thiệu về Katna.
"""

["2026-09-27-1335-account-names-pictures-order"]
title = "Tài khoản của bạn, theo cách của bạn"
text = """
Mỗi tài khoản giờ hiện chữ cái có màu riêng thay vì cùng một ảnh cho tất
cả. Trong Cài đặt > Tài khoản, bạn có thể chọn ảnh cho từng tài khoản,
đổi tên và sắp xếp các tài khoản theo thứ tự mình muốn bằng mũi tên hoặc
bằng cách kéo; ngăn thư mục và menu tài khoản sẽ theo thứ tự đó.
"""

["2026-09-27-0826-reset-cache"]
title = "Đặt lại bộ nhớ đệm"
text = """
Cài đặt > Chung > Đặt lại bộ nhớ đệm sẽ xóa thư Katna đã tải xuống, ảnh
người gửi và chỉ mục tìm kiếm, rồi tải xuống lại thư gần đây. Tiện khi
có gì đó trông lỗi thời hoặc để giải phóng dung lượng ổ đĩa; tài khoản,
cài đặt, thư nháp và thư của bạn trên máy chủ vẫn được giữ.
"""

["2026-09-27-1308-auto-advance"]
title = "Thư tiếp theo tự mở"
text = """
Xóa, lưu trữ hoặc di chuyển thư bạn đang đọc thì thư tiếp theo sẽ mở
ngay tại chỗ, thay vì ngăn đọc bị đóng lại. Hoàn tác sẽ đưa thư trở lại
và mở lại thư đó. Cài đặt > Chung > Tự động chuyển có thể mở thư trước
đó thay vào, hoặc quay lại danh sách.
"""

["2026-09-27-1348-quiet-row-markers"]
title = "Danh sách thư dịu mắt hơn"
text = """
Ô đánh dấu, dấu sao và điểm đánh dấu Quan trọng của mỗi thư giờ hiện mờ
và rõ hẳn lên khi bạn trỏ vào dòng đó, giống như trong Gmail. Thư đã
chọn, gắn dấu sao hoặc quan trọng luôn hiện đủ màu.
"""

["2026-09-27-1512-buy-me-a-coffee"]
title = "Mời tôi một ly cà phê"
text = """
Nếu Katna có ích với bạn, Giới thiệu về Katna giờ có nút Mời tôi một ly
cà phê.
"""

["2026-09-27-1615-from-row"]
title = "Chọn người gửi thư"
text = """
Thư mới giờ có hàng Từ bên dưới Tới. Nhấp vào mũi tên của hàng này để
gửi từ một tài khoản khác của bạn. Thư mới bắt đầu từ tài khoản đầu tiên
của bạn, trừ khi bạn chọn mặc định khác trong Cài đặt > Soạn thư > Gửi
thư mới từ.
"""

["2026-09-27-1621-unified-inbox"]
title = "Hộp thư đến hợp nhất"
text = """
Bật Cài đặt > Tài khoản > Hộp thư đến hợp nhất để xem thư của tất cả tài
khoản cùng lúc. “Tất cả tài khoản” nằm ở đầu ngăn thư mục với một Hộp
thư đến, Chưa đọc, Có gắn dấu sao, Quan trọng, Đã gửi, Thư nháp và nhiều
mục khác chung cho mọi tài khoản; mũi tên bên cạnh mỗi mục mở ra một
dòng cho từng tài khoản. Giờ đây tên của mỗi tài khoản có một mũi tên để
thu gọn các thư mục của nó.
"""

["2026-09-27-1627-right-click-move-and-not-spam"]
title = "Menu chuột phải phù hợp với từng thư mục"
text = """
Chọn một thư mục hoặc nhãn trong Di chuyển tới ở menu chuột phải giờ sẽ
chuyển thư, có Hoàn tác, kể cả từ kết quả tìm kiếm. Trong Thư rác, Báo
cáo thư rác đổi thành Không phải thư rác. Thùng rác có Chuyển vào Hộp
thư đến và Xóa vĩnh viễn, Lưu trữ có Chuyển vào Hộp thư đến, còn Thư
nháp và Đã gửi bỏ đi các mục không áp dụng ở đó.
"""

["2026-09-27-1633-drag-accounts"]
title = "Kéo tài khoản để sắp xếp"
text = """
Trong Cài đặt > Tài khoản, khi kéo một tài khoản, giờ cả hàng của nó
được nhấc lên và các tài khoản khác dạt sang bên để nhường chỗ. Chuyển
lên và Chuyển xuống hiện ra khi bạn trỏ vào một hàng.
"""

["2026-09-27-1637-drafts"]
title = "Thư nháp được giữ lại"
text = """
Đóng thư đang soạn giờ sẽ lưu nó vào Thư nháp, cả trên máy chủ thư của
bạn, như trong Gmail. Mở nó từ Thư nháp để viết tiếp. Chỉ nút thùng rác
mới bỏ nó đi, và Hoàn tác sẽ lấy lại.
"""

["2026-09-27-1609-many-attachments"]
title = "Chỗ cho nhiều tệp đính kèm"
text = """
Dù bạn đính kèm bao nhiêu tệp, danh sách giờ cuộn phía trên thanh Gửi
thay vì tràn đè lên nó, hiện tệp mới nhất, và cho biết có bao nhiêu tệp
cùng tổng dung lượng của chúng.
"""

["2026-09-27-1628-select-on-screen-first"]
title = "Chọn thư chưa đọc hoặc có gắn dấu sao, kiểu Gmail"
text = """
Đã đọc, Chưa đọc, Có gắn dấu sao và Không có dấu sao trong menu Chọn lại
đánh dấu chọn các thư khớp trên màn hình. Một dòng phía trên danh sách
đề nghị chọn mọi cuộc hội thoại khớp trong thư mục, và Bỏ chọn sẽ hoàn
tác việc đó.
"""

["2026-09-27-1632-leave-settings-by-folder"]
title = "Thư mục đưa bạn ra khỏi Cài đặt"
text = """
Khi Cài đặt đang mở, nhấp vào một thư mục hoặc biểu tượng Thư giờ sẽ
đóng Cài đặt và mở thư mục đó, như trong Gmail. Mũi tên Quay lại vẫn
hoạt động như trước.
"""

["2026-09-27-1641-drop-pictures-in-text"]
title = "Thả ảnh vào giữa văn bản"
text = """
Khi kéo một ảnh lên thư, một dấu nháy hiện ra ở chỗ ảnh sẽ được đặt, để
bạn có thể thả nó vào giữa câu. Các tệp khác vẫn hiện vùng thả dành cho
tệp đính kèm, và giờ việc thả vẫn hoạt động sau khi bạn đã gõ.
"""

["2026-09-27-1707-quick-quit"]
title = "Thoát là đóng ngay"
text = """
Thoát trong menu của biểu tượng ở khay không còn chờ những thư đang đồng
bộ hoặc đang được lập chỉ mục: Katna và biểu tượng ở khay đóng ngay lập
tức, phần còn lại sẽ tiếp tục vào lần tới Katna khởi động.
"""

["2026-09-27-1715-contact-panel"]
title = "Thông tin liên hệ bên cạnh thư"
text = """
Trong cửa sổ rộng, một thẻ bên cạnh cuộc hội thoại đang mở giờ hiện
thông tin người gửi: số điện thoại, chức danh và công ty lấy từ chữ ký
của họ, giờ hiện tại chỗ họ, lượng thư hai bên đã trao đổi, các cuộc hội
thoại gần đây và các tệp giữa bạn với họ. Nhấp vào một cuộc hội thoại
hoặc tệp để mở, hoặc vào một người khác trong cuộc hội thoại để xem
người đó. Thông tin chỉ được đọc từ thư của bạn trên máy tính này. Nút
liên hệ trên thanh công cụ của Ngăn đọc sẽ ẩn thẻ này.
"""

["2026-09-27-1640-storage-used"]
title = "Dung lượng đã dùng"
text = """
Khi máy chủ thư cho biết, phần dưới cùng của Ngăn thư mục sẽ hiện dung
lượng lưu trữ thư của tài khoản đã đầy đến đâu, chẳng hạn “Đã dùng 34%
trong 15 GB”.
"""

["2026-09-27-1651-desktop-search"]
title = "Tìm thư từ KRunner và tìm kiếm của GNOME"
text = """
Gõ một tên vào KRunner (Alt+Space) hoặc ô tìm kiếm Activities để viết
thư cho người đó, sao chép địa chỉ hoặc tìm thư của họ. Những thư có
tiêu đề hoặc người gửi chứa mọi từ bạn gõ sẽ hiện ra; hãy bắt đầu bằng
mail: để tìm trong toàn bộ thư, giống như trong ô tìm kiếm của Katna
Mail.
"""

["2026-09-27-1727-mail-templates"]
title = "Mẫu cho những thư bạn hay viết"
text = """
Viết thư một lần rồi lưu lại bằng nút Mẫu thư mới trong cửa sổ soạn thư,
sau đó chèn nó vào bất kỳ thư mới hay thư trả lời nào chỉ với một cú
nhấp. Viết {first name}, {name} hoặc {my name} và Katna sẽ điền chúng
cho từng người nhận. Sửa, đổi tên hoặc xóa mẫu thư trong Cài đặt > Soạn
thư.
"""

["2026-09-27-1724-server-send-later"]
title = "Thư hẹn giờ vẫn được gửi khi máy tính đã tắt"
text = """
Khi máy chủ thư của bạn có thể giữ thư đến một thời điểm định sẵn, như
Stalwart, Lên lịch gửi giờ sẽ giao thư cho máy chủ ngay khi Hoàn tác biến
mất, để thư đi đúng giờ kể cả khi máy tính này đã tắt. Menu lên lịch cho
biết máy chủ thư của bạn hay Katna sẽ gửi thư.
"""

["2026-09-27-1730-softer-row-hover"]
title = "Hiệu ứng trỏ chuột nhẹ nhàng hơn"
text = """
Dòng dưới con trỏ trong danh sách thư giờ nổi lên với một bóng mờ nhạt,
giống như trong Gmail, thay cho một dải tối bên dưới.
"""

["2026-09-27-1745-drag-recipients"]
title = "Kéo địa chỉ giữa Tới, Cc và Bcc"
text = """
Kéo thẻ địa chỉ sang trường khác để chuyển nó; Cc và Bcc sẽ mở ra khi
bạn kéo, kể cả khi đang ẩn. Trỏ vào thẻ sẽ hiện dấu x để xóa nó.
"""

["2026-09-27-1722-katna-account"]
title = "Tài khoản Katna"
text = """
Cài đặt > Gói đăng ký cho phép bạn tạo tài khoản trên máy chủ riêng
của Katna, với mật khẩu riêng, không bao giờ là mật khẩu thư. Các tính
năng trực tuyến của Katna, như xác nhận đã đọc và theo dõi liên kết, sẽ
cần đến tài khoản này. Bạn có thể xem các máy tính đang đăng nhập và
đăng xuất bất kỳ máy nào.
"""

["2026-09-27-1805-reopens-as-you-left-it"]
title = "Trở lại đúng chỗ cũ"
text = """
Đóng Katna Mail rồi mở lại sẽ đưa trở lại ứng dụng, thư mục và tab hộp
thư đến bạn đang mở, các thư mục bạn đã mở rộng và việc ngăn thư mục có
đang thu gọn hay không. Thoát Katna từ khay hệ thống sẽ khởi động lại từ
đầu.
"""

["2026-09-27-1724-snooze-and-reminders"]
title = "Tạm ẩn và nhắc khi chưa có trả lời"
text = """
Tạm ẩn một cuộc hội thoại bằng biểu tượng đồng hồ trên dòng của nó hoặc
từ menu chuột phải: cuộc hội thoại chờ trong thư mục Đã tạm ẩn và quay
lại Hộp thư đến, ở trạng thái chưa đọc, vào thời điểm bạn chọn. Khi gửi,
mũi tên bên cạnh nút Gửi có thể nhắc bạn nếu không ai trả lời trong vòng
1, 3 hoặc 7 ngày. Cả hai hoạt động khi máy tính đang bật, và làm bù phần
còn lại sau khi máy thức dậy.
"""

["2026-09-27-1717-translate-mail"]
title = "Đọc thư bằng ngôn ngữ của bạn"
text = """
Thư bằng ngôn ngữ khác giờ có nút Dịch ở phía trên, và Hiện bản gốc đưa
thư trở lại như cũ. Katna nhận biết ngôn ngữ ngay trên máy tính của bạn;
chỉ khi bạn yêu cầu, nội dung thư mới được gửi đến máy chủ riêng của Katna
để dịch. Cài đặt > Chung > Dịch cho bạn chọn ngôn ngữ của mình và những
ngôn ngữ luôn được dịch.
"""

["2026-09-27-1744-open-and-click-tracking"]
title = "Biết khi nào thư được mở"
text = """
Bật biểu tượng con mắt cạnh người nhận để thấy khi mỗi người mở thư của
bạn hoặc mở một liên kết trong thư, hoặc yêu cầu xác nhận đã đọc thay vào
đó. Thư đã gửi cho thấy ai đã mở, và một thông báo cho bạn biết ở lần đầu
tiên. Cả hai đều tắt với mọi thư mới, và việc theo dõi cần tài khoản Katna
(Cài đặt > Gói đăng ký).
"""

["2026-09-27-2042-activity"]
title = "Hoạt động của thư được theo dõi"
text = """
Hoạt động bên cạnh ô tìm kiếm cho thấy bao nhiêu thư được theo dõi của
bạn đã được mở và các liên kết trong đó được mở thường xuyên đến đâu,
kèm các tiêu đề của bạn xếp theo mức độ thường được mở.
"""

["2026-09-27-2204-search-trigger-words"]
title = "Tìm trong thư từ KRunner bằng k"
text = """
Gõ k hoặc m, một dấu cách, rồi điều cần tìm trong KRunner hoặc ô tìm
kiếm của GNOME để có cùng kết quả như ô tìm kiếm của Katna Mail, ví dụ
“k budget”. Chọn từ của riêng bạn trong Cài đặt > Chung.
"""

["2026-09-27-2224-activity-button"]
title = "Hoạt động bên cạnh ô tìm kiếm"
text = """
Nút Hoạt động bên cạnh ô tìm kiếm đếm các lượt mở và lượt nhấp mới
trên thư được theo dõi của bạn, đồng thời liệt kê ai đã mở thư nào và
đã mở những liên kết nào; nhấp vào một mục để mở thư đó. Chi tiết cho
thấy tỷ lệ mở và tỷ lệ nhấp, lượt mở theo ngày và các tiêu đề hiệu quả
nhất của bạn trong 7 hoặc 30 ngày qua, mọi lúc hoặc những ngày bạn
chọn. Thư đã gửi giờ cho thấy mỗi người đã mở thư và mở liên kết bao
nhiêu lần.
"""

["2026-09-27-2239-mailbox-insights"]
title = "Thông tin về hộp thư"
text = """
Hoạt động > Chi tiết giờ còn cho thấy bạn đã gửi và nhận bao nhiêu thư
trong khoảng thời gian đó, bạn và người khác trả lời thường xuyên và
nhanh đến đâu, những người bạn viết thư nhiều nhất, và thư của bạn đến
vào những ngày và giờ nào. Mọi thứ được đếm trên máy tính của bạn từ
những thư Katna đã có.
"""

["2026-09-28-0059-sign-in-with-google"]
title = "Đăng nhập bằng Google hoặc Microsoft"
text = """
Thêm tài khoản Gmail hoặc Outlook bằng cách đăng nhập trên trang riêng
của Google hoặc Microsoft trong trình duyệt, không cần mật khẩu ứng dụng.
Địa chỉ Outlook.com và Hotmail giờ cũng dùng được. Nếu việc đăng nhập
ngừng hoạt động, một ghi chú ở cuối cửa sổ sẽ đề nghị bạn đăng nhập lại.
"""

["2026-09-28-0054-tracking-on-by-default"]
title = "Theo dõi và xác nhận được bật ngay từ đầu"
text = """
Thư mới và thư trả lời giờ bắt đầu với tính năng theo dõi lượt mở và
lượt nhấp, xác nhận đã đọc và xác nhận đã chuyển phát được bật sẵn; nhấp
vào nút bên cạnh người nhận để tắt một mục cho thư đó. Theo dõi cần bạn
đăng nhập tài khoản Katna. Xác nhận đã chuyển phát là email mà máy chủ
thư của bạn gửi cho bạn khi máy chủ của mỗi người nhận nhận thư; nút sẽ
bị làm mờ nếu máy chủ thư của bạn không hỗ trợ.
"""

["2026-09-28-0120-delivered-read-ticks"]
title = "Dấu tích cho thư đã chuyển phát và đã đọc"
text = """
Thư bạn đã gửi giờ hiển thị dấu tích bên cạnh từng người nhận. Một dấu
tích xám nghĩa là máy chủ thư của họ đã nhận thư: dựa trên xác nhận đã
chuyển phát, hoặc, nơi dịch vụ thư của bạn không gửi xác nhận (Gmail),
khi không có thư trả về trong nửa giờ. Hai dấu tích màu nhấn của bạn
nghĩa là họ đã đọc thư, dựa trên xác nhận đã đọc hoặc theo dõi lượt mở,
còn một cảnh báo nghĩa là thư bị trả về. Trỏ vào dấu tích để xem khi nào
và bằng cách nào. Email xác nhận vẫn nằm trong hộp thư của bạn ở mục Cập
nhật, không có thông báo.
"""

["2026-09-28-0143-gmail-new-mail-notifications"]
title = "Thông báo cho thư Gmail mới"
text = """
Thư mới trong hộp thư đến Gmail giờ lại hiển thị thông báo. Trước đây
Katna bỏ lỡ thư mà Gmail xếp vào Tất cả thư ngay trước khi vào hộp thư
đến.
"""

["2026-09-28-0156-attachment-types"]
title = "Tìm theo loại tệp đính kèm"
text = """
Trong Tùy chọn tìm kiếm, “Có tệp đính kèm” giờ có PDF, XLSX, ODF, XLS,
ODS, PPT và PPTX, cùng Tùy chỉnh cho mọi đuôi tệp khác, như png hoặc
avif. Chỉ thư có tệp đính kèm thuộc loại đã chọn mới hiện ra.
"""

["2026-09-28-0106-original-colors"]
title = "Màu gốc trong chủ đề tối"
text = """
Với chủ đề tối, thư tự đặt màu riêng sẽ hiện bằng màu tối. Nút nửa hình
tròn mới trên thanh công cụ của ngăn đọc hiện thư bằng màu gốc của người
gửi, rồi trở lại.
"""

["2026-09-28-0127-print-as-shown"]
title = "Bản in giữ nguyên định dạng"
text = """
Thư được in đúng như khi xem trong ngăn đọc, với bảng, màu, đường viền,
danh sách và hình ảnh. Khi xem trước khi in, bạn có thể bỏ màu nền để
tiết kiệm mực, hoặc chỉ in phần chữ với Chỉ văn bản.
"""

["2026-09-28-0141-ask-before-deleting"]
title = "Hỏi trước khi xóa"
text = """
Xóa nhiều cuộc hội thoại cùng lúc giờ sẽ hỏi trước xem có chuyển chúng
vào Thùng rác không. Chọn “Không hỏi lại” để bỏ qua câu hỏi, hoặc bật lại
trong Cài đặt > Chung. Xóa vĩnh viễn, trong Thùng rác, thì luôn hỏi.
"""

["2026-09-28-0019-katna-for-windows"]
title = "Katna cho Windows"
text = """
Katna Mail giờ chạy được cả trên Windows 10 và 11, được cài bằng Katna Setup
riêng, có biểu tượng ở khay hệ thống, thông báo, tự khởi động khi đăng nhập
và mở liên kết thư trong Katna.
"""

["2026-09-28-0236-chip-remove-always"]
title = "Nút xóa trên mọi địa chỉ"
text = """
Mỗi thẻ địa chỉ trong Tới, Cc và Bcc giờ luôn hiện dấu x, để bạn có thể xóa
địa chỉ mà không cần trỏ vào nó trước.
"""

["2026-09-28-0244-pill-format-bar"]
title = "Thanh định dạng tròn hơn"
text = """
Thanh định dạng khi soạn thư (Aa) giờ có hình viên thuốc với viền mờ, nên
tách biệt khỏi phần chữ của bạn trong cả chủ đề sáng lẫn tối.
"""

["2026-09-28-0325-long-threads-smooth"]
title = "Chuỗi thư dài mở nhanh"
text = """
Thư có định dạng trích dẫn nhiều thư trả lời trước đó, như một chuỗi trích
dẫn dài, giờ mở ngay lập tức và cuộn mượt mà thay vì làm chậm cả cửa sổ.
"""

["2026-09-28-0830-who-has-seen-it"]
title = "Ai đã xem thư, sau một con mắt"
text = """
Thư bạn gửi có theo dõi không còn khung các dòng phía trên nữa. Con mắt cạnh
ngôi sao chuyển sang màu nhấn của bạn khi có người mở thư; trỏ vào đó để xem
ai đã mở thư hoặc mở liên kết, và vào lúc nào.
"""

["2026-09-28-0831-contact-call-copy"]
title = "Gọi và sao chép từ thông tin liên hệ"
text = """
Trong thông tin liên hệ bên cạnh cuộc hội thoại, nhấp vào số điện thoại để
gọi bằng ứng dụng điện thoại hoặc KDE Connect, hoặc dùng nút sao chép bên
cạnh. Toàn bộ chữ trong ngăn này giờ cũng có thể chọn và sao chép.
"""

["2026-09-28-0848-quoted-text-hide-remove"]
title = "Ẩn hoặc xóa thư được trích dẫn trong thư trả lời"
text = """
Nút “...” bên dưới thư trả lời giờ ẩn lại phần thư được trích dẫn sau khi
bạn mở nó. Trỏ vào nút và nhấp vào dấu x ở góc để bỏ phần thư được trích dẫn
khỏi thư trả lời; Hoàn tác hoặc Ctrl+Z sẽ đưa nó trở lại. Thanh công cụ của
thư trả lời cũng giữ nguyên vị trí khi bạn cuộn.
"""

["2026-09-28-0854-floating-folders"]
title = "Thư mục nổi và ô tìm kiếm rộng hơn"
text = """
Khi thư mục bị ẩn, đặt con trỏ lên Soạn thư hoặc Thư sẽ mở chúng thành một
bảng cách xa các cạnh, có một khấc nhỏ chỉ vào nút. Ô tìm kiếm giãn ra lấp
chỗ trống mà thư mục để lại, và nhấp vào thư mục bạn đang mở không còn làm
danh sách nhấp nháy.
"""

["2026-09-28-0928-search-address-suggestions"]
title = "Gợi ý địa chỉ trong Tùy chọn tìm kiếm"
text = """
Từ và Đến trong Tùy chọn tìm kiếm giờ gợi ý địa chỉ khi bạn gõ, giống như
Tới, Cc và Bcc khi soạn thư. Chọn một địa chỉ bằng Enter, Tab hoặc một cú
nhấp.
"""

["2026-09-28-0935-app-menu-reply-all-window"]
title = "Menu chính trong thẻ tài khoản, Trả lời tất cả trong cửa sổ riêng"
text = """
Thẻ tài khoản có nút ☰ bên cạnh Quản lý tài khoản. Nút này mở các menu Tệp,
Sửa, Xem, Đi tới, Thư, Cài đặt và Trợ giúp giống như menu toàn cục của môi
trường máy tính, dành cho những môi trường không hiển thị menu này. Trả lời
tất cả trên thông báo thư mới giờ mở cuộc hội thoại trong cửa sổ riêng, sẵn
sàng để gõ, và giữ nguyên cửa sổ chính.
"""

["2026-09-28-1011-tray-brings-window-forward"]
title = "Nhấp vào khay hệ thống và thông báo đưa Katna Mail lên trước"
text = """
Nhấp vào biểu tượng khay hệ thống, hoặc Mở Hộp thư đến, Thư mới hay Cài đặt
trong menu của nó, giờ đưa cửa sổ Katna Mail lên trước trên Wayland, kể cả
khi cửa sổ đang thu nhỏ hoặc nằm sau các cửa sổ khác. Nhấp vào thông báo thư
mới sẽ mở đúng thư đó, kể cả khi danh sách Hộp thư đến không hiển thị thư
ấy.
"""

["2026-09-28-1053-send-countdown-reply-in-place"]
title = "Gửi có đếm ngược, và thư trả lời ở lại trong cuộc hội thoại"
text = """
Sau khi nhấn Gửi, một vòng tròn thu nhỏ dần đếm ngược thời gian hoàn tác bên
cạnh Hoàn tác, rồi thông báo nhỏ hiện Đã gửi thư (kèm một âm thanh ngắn) khi
thư đã đi. Có thể tắt âm thanh này trong Cài đặt > Chung > Gửi thư. Thư trả
lời viết trong cuộc hội thoại trở thành một thư ngay tại chỗ bạn viết. Phần
đầu của thư chỉ cho biết thư gửi tới ai; nhấp vào để xem Từ, Tới, Cc và Bcc.
Mũi tên bên cạnh biểu tượng trả lời chuyển giữa Trả lời, Trả lời tất cả và
Chuyển tiếp, vẫn giữ nguyên những gì bạn đã viết.
"""


["2026-09-28-1110-search-options-narrow"]
title = "Tùy chọn tìm kiếm vừa với cửa sổ hẹp"
text = """
Trong cửa sổ hẹp hoặc thấp, Tùy chọn tìm kiếm giờ giãn rộng theo chỗ trống
có được, đặt nhãn phía trên ô nhập trên điện thoại và cuộn được khi không
vừa, nên nút Tìm kiếm luôn trong tầm tay.
"""

["2026-09-28-1119-replies-from-right-account"]
title = "Thư trả lời được gửi từ đúng tài khoản"
text = """
Trả lời hoặc Chuyển tiếp một thư mở từ Hộp thư đến hợp nhất hay từ kết quả
tìm kiếm giờ được gửi từ tài khoản đã nhận thư đó, không phải tài khoản được
chọn dưới ảnh hồ sơ của bạn.
"""

["2026-09-28-1436-calmer-search-box"]
title = "Ô tìm kiếm hiện phím tắt"
text = """
Ô tìm kiếm hiện phím tắt của nó bên cạnh "Tìm trong thư", theo thiết lập
trong Cài đặt > Phím tắt. Khi được nhấp vào, ô giữ nguyên màu và chỉ hiện
một viền mờ thay vì tối đi kèm bóng đổ. Các thư mục nổi phía trên danh sách
giờ cũng không còn sát mép dưới.
"""

["2026-09-28-1450-clear-activity"]
title = "Dọn gọn Hoạt động"
text = """
Trỏ vào một lượt mở hoặc lượt nhấp trong Hoạt động rồi nhấn × để gỡ nó khỏi
danh sách, hoặc nhấn Xóa tất cả để bắt đầu lại từ đầu. Lượt mở và lượt nhấp
mới vẫn hiện ra, và báo cáo Chi tiết vẫn tính mọi thứ.
"""

["2026-09-28-1541-round-logo"]
title = "Logo tròn mới của Katna"
text = """
Katna có logo mới: chữ "k" viết tay trên một hình tròn màu xanh
ngọc — trong menu ứng dụng, thanh trên cùng và bảng điều khiển. Khay
hệ thống hiển thị logo bằng một màu phù hợp với thanh của bạn, còn
Giới thiệu về Katna và trang chào mừng hiển thị đầy đủ tên "katna
mail".
"""

["2026-09-28-1546-contact-cards"]
title = "Thông tin liên hệ gọn gàng hơn"
text = """
Thông tin liên hệ giờ hiện mỗi phần trên thẻ mềm riêng, với các nút
tròn dưới tên để gửi email cho người đó, tìm thư với họ hoặc gọi cho
họ. Cuộc hội thoại gần đây hiện vài cuộc mới nhất; nhấn Thêm để xem
phần còn lại và Thu gọn để ẩn chúng lại.
"""

["2026-09-28-1507-reply-box-recipients"]
title = "Hộp trả lời gọn gàng hơn"
text = """
Người nhận giờ đây hiển thị cùng ảnh đại diện của họ, còn Cc và Bcc
được gộp vào một nút nhỏ. Mở danh sách người nhận của một trả lời sẽ
làm hộp mở rộng lên trên một cách mượt mà, và tin nhắn được trích dẫn
mở ra và đóng lại mượt mà bên dưới một đường lượn sóng mà bạn có thể
nhấp để gấp nó lại.
"""

["2026-09-28-1620-softer-window-shadow"]
title = "Bóng cửa sổ mềm hơn và các nút cỡ như KDE"
text = """
Với khung cửa sổ của Katna, bóng quanh cửa sổ giờ hẹp hơn và mờ dần
hoàn toàn, không còn viền cứng mà trước đây để lại bên cạnh cửa sổ.
Các nút cửa sổ giờ có kích thước như của KDE, và cách mép cửa sổ một
khoảng bằng khoảng cách tới đỉnh của nó.
"""

["2026-09-28-1622-update-from-the-app"]
title = "Cập nhật Katna ngay trong ứng dụng"
text = """
Giờ đây Katna tự tải xuống các phiên bản mới và báo cho bạn biết khi
có bản sẵn sàng. Nhấn Cập nhật trong thông báo hoặc trong Giới thiệu:
Katna Mail sẽ báo rằng nó sắp khởi động lại, hỏi mật khẩu của bạn, cài
đặt bản cập nhật rồi mở lại đúng chỗ bạn đang dừng. Cài đặt > Chung >
Cập nhật tắt việc tự động tải xuống.
"""

["2026-09-28-1520-track-sealed-and-plain"]
title = "Theo dõi thư đã ký, đã mã hóa và văn bản thuần"
text = """
Biểu tượng con mắt giờ cũng hoạt động trên thư đã ký và đã mã hóa: bản sao
của mỗi người nhận được ký hoặc mã hóa riêng, nên chữ ký vẫn hợp lệ. Thư văn
bản thuần không thể hiển thị lượt mở, nhưng các liên kết trong đó được theo
dõi, nên bạn thấy khi ai đó mở một liên kết.
"""

["2026-09-28-1834-reply-after-closed-window"]
title = "Trả lời bắt đầu lại từ đầu sau khi đóng cửa sổ thư"
text = """
Đóng một thư được soạn trong cửa sổ riêng giờ sẽ giữ nó trong Thư nháp, còn
Trả lời, Trả lời tất cả và Chuyển tiếp lại mở một thư mới thay vì đưa thư cũ
trở lại.
"""

["2026-09-28-1852-frosted-search-bar"]
title = "Thanh tìm kiếm mờ như kính"
text = """
Khi bật nền mờ, thanh tìm kiếm để lớp mờ xuyên qua giống như thanh xung
quanh nó, thay vì nằm trên đó như một viên thuốc màu xám đặc.
"""

["2026-09-28-1906-scroll-to-switch-accounts"]
title = "Cuộn trên ảnh của bạn để chuyển tài khoản"
text = """
Khi con trỏ nằm trên ảnh tài khoản ở góc trên bên phải, hãy xoay con lăn
chuột để chuyển sang tài khoản kế tiếp hoặc trước đó, mỗi nấc một tài khoản.
Ảnh cuộn sang tài khoản mới, giống như tên ứng dụng cuộn khi bạn chuyển ứng
dụng, và chọn một tài khoản từ thẻ cũng làm nó cuộn theo cách đó.
"""

["2026-09-28-1918-many-recipients"]
title = "Đủ chỗ cho nhiều người nhận"
text = """
Người nhận sau dòng đầu tiên giờ dùng toàn bộ chiều rộng, và một danh sách
dài cuộn trong vài dòng, nên bản thân thư luôn nằm trong tầm với. Rời khỏi
trường và nó gập lại thành một dòng, chẳng hạn "Kay, Sam, 19 người nữa";
nhấp vào đó để xem lại tất cả.
"""

["2026-09-28-1952-activity-by-account"]
title = "Báo cáo hoạt động cho một tài khoản"
text = """
Báo cáo hoạt động giờ có bộ chọn tài khoản bên cạnh ngày. Chọn Tất cả
tài khoản hoặc một tài khoản, và thư được theo dõi, tỷ lệ, biểu đồ, tiêu
đề cùng Hộp thư của bạn sẽ theo lựa chọn đó. Báo cáo cho biết tài khoản
đang hiển thị và ghi nhớ lựa chọn của bạn.
"""

["2026-09-28-2002-reader-arrows-always-shown"]
title = "Mũi tên Mới hơn và Cũ hơn luôn hiện trên thanh công cụ"
text = """
Dù ngăn đọc hẹp đến đâu, bộ đếm cùng các mũi tên Mới hơn và Cũ hơn vẫn nằm
ở bên phải thanh công cụ của nó. Thay vào đó, các nút bạn ít dùng nhất sẽ
lần lượt chuyển vào menu Thêm, gồm cả các công tắc chi tiết liên hệ và màu
gốc.
"""

["2026-09-28-2026-large-files-drive"]
title = "Gửi tệp với mọi dung lượng"
text = """
Với tài khoản đăng nhập bằng Google, tệp vượt quá giới hạn thư 25 MB sẽ
được đưa lên Google Drive của bạn ngay khi bạn đính kèm, và thư sẽ kèm
liên kết của tệp, như trong Gmail. Tệp được chia sẻ với người nhận khi bạn
nhấn Gửi; Katna chỉ hỏi nếu không thể cấp quyền truy cập cho ai đó.
"""

["2026-09-28-2059-recipient-list-scrolling"]
title = "Danh sách người nhận dài mượt hơn"
text = """
Danh sách người nhận dài giờ có thanh cuộn riêng và cuộn từng dòng một;
cuộc hội thoại chỉ cuộn tiếp khi danh sách đã tới cuối. Thêm người nhận
không còn làm các nút bên dưới nhảy nữa.
"""

["2026-09-28-2106-check-for-new-mail"]
title = "Kiểm tra thư mới"
text = """
Nhấp chuột phải vào một thư mục hoặc tài khoản trong ngăn thư mục để
chọn “Kiểm tra thư mới”, “Đánh dấu tất cả là đã đọc”, thư mục mới bên
trong hoặc “Dọn sạch Thùng rác”. “Làm mới” phía trên danh sách giờ cũng
tải từ máy chủ. Khi Katna đang kiểm tra, các mũi tên xoay trên “Làm mới”
và bên cạnh Hộp thư đến, còn “Đang kiểm tra thư mới…” hiện ở trên cùng
nếu mất hơn một lúc.
"""

["2026-09-28-2101-large-files-onedrive"]
title = "Tệp lớn qua OneDrive"
text = """
Các tài khoản Outlook.com, Hotmail và tài khoản Microsoft khác nay gửi
tệp vượt quá giới hạn thư giống như tài khoản Google: tệp được đưa lên
OneDrive của bạn ngay khi bạn đính kèm, và thư kèm liên kết của tệp, như
trong Outlook.
"""

["2026-09-28-2108-activity-checking"]
title = "Không còn nháy Đăng nhập trong Hoạt động"
text = """
Ngay sau khi Katna khởi động, Hoạt động hiển thị một thanh tải mỏng
trong khi kiểm tra tài khoản Katna của bạn, thay vì nhắc bạn đăng nhập
trong chốc lát. Katna cũng kiểm tra tài khoản ngay khi khởi động, nên
thời gian chờ ngắn hơn.
"""

["2026-09-28-2130-update-dialog"]
title = "Cập nhật có cửa sổ riêng"
text = """
Trợ giúp > Kiểm tra cập nhật mở một cửa sổ riêng. Cửa sổ hiển thị phiên
bản của bạn cạnh phiên bản mới, thời điểm tạo và dung lượng tải xuống
của mỗi bản, những điểm mới trong bản cập nhật và mọi thay đổi kể từ
phiên bản của bạn.
"""

["2026-09-28-2204-faster-start"]
title = "Khởi động nhanh hơn, đồng bộ mượt hơn"
text = """
Katna Mail mở hộp thư đến lớn nhanh hơn khoảng một phần tư, và khi thư
đang tải về, danh sách chỉ được cập nhật một lần cho mỗi lô thay vì sau
mỗi vài thư, nên việc cuộn và gõ vẫn mượt trong lúc đồng bộ.
"""

["2026-09-28-2111-link-addresses"]
title = "Xem liên kết dẫn đến đâu"
text = """
Đặt con trỏ lên một liên kết trong thư, địa chỉ mà liên kết thực sự mở
ra sẽ hiện ở cuối ngăn đọc, với tên trang web được làm nổi bật, bất kể
văn bản của liên kết ghi gì. Hình ảnh từ người gửi mà bạn luôn hiển thị
hình ảnh nay chỉ được tải khi nhà cung cấp thư của bạn xác nhận thư thực
sự đến từ họ.
"""

["2026-09-29-0120-update-build-details"]
title = "Thêm về bản dựng của bạn"
text = """
Cửa sổ Cập nhật giờ cho biết thay đổi mới nhất của từng phiên bản, bản
của bạn đến từ đâu và lần gần nhất Katna kiểm tra cập nhật là khi nào.
"""

["2026-09-29-0213-coffee-button-play"]
title = "Một màn diễn nhỏ ở nút Mời tôi một ly cà phê"
text = """
Đặt con trỏ lên nút Mời tôi một ly cà phê trong Giới thiệu về Katna: nút
sẽ xin cà phê, trà, pizza, rồi chẳng xin gì nữa, chịu uống nước lọc và
cảm ơn bạn bằng vài tia lấp lánh. Mỗi lần chỉ diễn một lượt và đứng yên
khi bạn đã giảm chuyển động.
"""

["2026-09-29-0215-update-checking-bar"]
title = "Cửa sổ Cập nhật rõ ràng hơn"
text = """
Một thanh chạy hiện ra khi Katna kiểm tra bản cập nhật, và phiên bản mới
nổi bật với màu riêng bên cạnh phiên bản bạn đang dùng.
"""

["2026-09-29-0231-keys-beside-the-list"]
title = "Phím đi theo ngăn bạn đang ở"
text = """
Khi cuộc trò chuyện nằm cạnh danh sách, Lên và Xuống giờ di chuyển trong
danh sách và hiện từng cuộc trò chuyện. Tab hoặc Enter vào cuộc trò
chuyện, nơi Lên và Xuống cuộn nó; Esc hoặc Shift+Tab quay về danh sách.
F6 chuyển giữa các ngăn, như trong các ứng dụng thư khác.
"""

["2026-09-29-0258-folders-slide-open"]
title = "Thư mục trượt mở và trượt đóng"
text = """
Nhấp vào mũi tên bên cạnh một tài khoản hoặc thư mục trong ngăn thư mục
giờ sẽ trượt mở hoặc trượt đóng nội dung bên trong, các thư mục bên dưới
trượt theo, thay vì nhảy.
"""

["2026-09-29-0301-keys-menus-dialogs"]
title = "Thư mục, menu và hộp thoại bằng bàn phím"
text = """
Shift+Tab hoặc F6 đưa bạn tới ngăn thư mục, nơi Lên và Xuống mở từng thư
mục và Enter chuyển sang thư của nó. Lên và Xuống di chuyển trong mọi
menu, và Enter chọn. Shift+F10 hoặc phím Menu mở menu chuột phải của thư
đang chọn. Hộp thoại nhận phím ngay khi mở: Enter trả lời, Esc hủy và
Tab ở lại bên trong. Trong thư mới, Ctrl+Enter gửi từ bất kỳ trường nào
và Esc đóng thư, giữ lại một thư nháp.
"""

["2026-09-29-0309-clock-tasks"]
title = "Việc cần làm ngay trong đồng hồ màn hình nền"
text = """
Bấm vào đồng hồ để thêm việc cần làm và đánh dấu các việc đã xong. Trong
Plasma, bấm chuột phải vào đồng hồ và chọn Hiện các lựa chọn thay thế để
chọn Đồng hồ số Katna. Trong GNOME, thẻ Việc cần làm sẽ hiện bên dưới
lịch của đồng hồ từ lần đăng nhập tiếp theo.
"""

["2026-09-29-0329-pages-by-keyboard"]
title = "Chuyển trang bằng bàn phím và từ thanh tác vụ"
text = """
Ctrl+1 đến Ctrl+5 chuyển giữa Thư, Lịch, Danh bạ, Việc cần làm và Ghi
chú, như trong Outlook, và menu Đi tới cũng liệt kê chúng. Bấm chuột
phải vào Katna Mail trên thanh tác vụ để mở ngay Lịch hoặc Danh bạ.
"""

["2026-09-29-0412-tasks-page"]
title = "Katna Việc cần làm"
text = """
Nhấn Ctrl+4 hoặc chọn Việc cần làm ở bên trái: mọi danh sách nằm cạnh
nhau như trong Google Tasks, với việc phụ, dấu sao, ngày đến hạn, lặp
lại và chi tiết. Các danh sách đồng bộ với Google Tasks và Microsoft To
Do, và việc cần làm từ đồng hồ trên máy tính cũng hiện ở đây.
"""

["2026-09-29-0352-contacts"]
title = "Danh bạ của bạn, từ mọi tài khoản"
text = """
Danh bạ trên thanh bên trái giờ hiển thị những người được lưu trong tài
khoản Gmail và Outlook của bạn và trên máy chủ CardDAV, mỗi người chỉ
một lần dù nhiều tài khoản cùng lưu, kèm nhãn, ảnh và chi tiết của họ.
Tên và ảnh của họ cũng hiện trong thư của bạn và trong gợi ý địa chỉ.
"""

["2026-09-29-0350-katna-notes"]
title = "Katna Ghi chú"
text = """
Ghi chú trên thanh bên giờ mở Katna Ghi chú, bố cục giống Google Keep.
Tạo ghi chú hoặc danh sách kiểm tra, chọn màu, ghim lên đầu và đánh dấu
các mục ngay trên bảng. Ghi chú được lưu khi bạn gõ; hộp tìm kiếm sẽ tìm
thấy chúng; Lưu trữ và Thùng rác giúp cất chúng đi, có thể Hoàn tác.
"""

["2026-09-29-0412-notes-sync"]
title = "Ghi chú trên mọi thiết bị"
text = """
Ghi chú giờ nằm trong thư mục Ghi chú của tài khoản thư, nơi Ghi chú
trên iPhone và Mac cũng lưu ghi chú của chúng, nên ghi chú đi theo bạn
sang các thiết bị khác và quay lại từ đó. Tên tài khoản bên dưới ghi chú
cho biết nơi lưu; nhấp vào đó để chuyển ghi chú, hoặc chỉ giữ trên máy
tính này.
"""

["2026-09-29-0451-add-mail-to-tasks"]
title = "Thêm thư vào Việc cần làm"
text = """
Nhấn Shift+T, như trong Gmail, hoặc chọn Thêm vào Việc cần làm khi nhấp
chuột phải vào một thư. Việc cần làm lấy tiêu đề của thư, và thẻ Thư của
nó trong Việc cần làm sẽ mở lại thư.
"""

["2026-09-29-0412-calendar"]
title = "Lịch của bạn, ngay cạnh thư"
text = """
Lịch hiển thị lịch Google, Microsoft và các lịch khác của bạn theo
ngày, tuần, tháng hoặc dưới dạng lịch biểu, với các phím tắt của Google
Calendar. Nút lịch ở bên phải thư của bạn mở chương trình trong ngày, có
nút Tham gia cho các cuộc gọi. Hãy đăng nhập lại vào tài khoản để Katna
có thể đọc lịch của tài khoản đó.
"""

["2026-09-29-0442-contacts-edit"]
title = "Tạo và sửa liên hệ"
text = """
Tạo người liên hệ trên trang Danh bạ sẽ thêm một người vào tài khoản bạn
chọn, còn Sửa trên trang của một liên hệ cũng thay đổi họ ngay tại đó.
Xóa có Hoàn tác, và Google cùng Outlook giữ các liên hệ đã xóa trong
thùng rác của họ một thời gian.
"""

["2026-09-29-0538-notes-on-mail"]
title = "Ghi chú về một thư"
text = """
Nhấp chuột phải vào một thư, hoặc mở menu ⋮ của thư, rồi chọn Thêm ghi
chú: một ghi chú lấy chủ đề làm tiêu đề sẽ mở ra phía trên thư. Các
ghi chú hiện dưới chủ đề mỗi khi bạn mở lại thư đó, và nhãn Thư của
ghi chú đưa bạn quay lại thư.
"""

["2026-09-29-0542-caldav-tasks"]
title = "Việc cần làm trên máy chủ thư của riêng bạn"
text = """
Các tài khoản đăng nhập bằng mật khẩu giờ đây lưu việc cần làm trên
máy chủ thư nếu máy chủ đó hỗ trợ CalDAV, nên việc cần làm cũng hiện
trong các ứng dụng của chính máy chủ và trên điện thoại.
"""

["2026-09-29-0521-calendar-edit"]
title = "Thêm và thay đổi sự kiện"
text = """
Nhấp hoặc kéo trên lịch, hoặc nhấn C, để thêm sự kiện. Kéo một sự kiện
để di chuyển hoặc kéo cạnh dưới của nó để đổi thời lượng, rồi mở sự kiện
để đổi giờ, cách lặp lại, lời nhắc và khách hoặc thêm cuộc gọi Meet hoặc
Teams. Trả lời lời mời bằng Có, Không hoặc Có thể. Hoàn tác sẽ khôi phục
mọi thứ.
"""

["2026-09-29-0546-calendar-any-account"]
title = "Lịch từ nhiều tài khoản hơn"
text = """
Katna giờ đây tìm thấy lịch của Yahoo, Zoho, iCloud, Fastmail, GMX và
các tài khoản khác, ngay cả khi chúng nằm trên máy chủ khác với thư.
Katna thử cách tốt nhất của từng tài khoản trước và một cách khác khi
cách đó không dùng được.
"""

["2026-09-29-0625-tasks-today"]
title = "Hôm nay trong Việc cần làm"
text = """
Hôm nay, trong Tất cả việc cần làm, tập hợp những việc đến hạn hôm nay
và mọi việc quá hạn từ tất cả danh sách, kèm danh sách chứa từng việc.
Việc được thêm ở đó sẽ đến hạn hôm nay.
"""

["2026-09-29-0631-invitation-card"]
title = "Lời mời trong thư của bạn"
text = """
Lời mời giờ đây hiển thị dưới dạng thẻ ở đầu thư: khi nào và ở đâu, ai
tổ chức, ngày của bạn xung quanh với các xung đột được đánh dấu, Tham
gia và Bạn có tham dự không? Có, Không hoặc Có thể, trả lời ngay tại đó.
"""

["2026-09-29-0616-note-labels"]
title = "Nhãn cho ghi chú"
text = """
Nút nhãn trên một ghi chú gắn nhãn cho ghi chú đó, như trong Keep. Các
nhãn của bạn được liệt kê bên cạnh Ghi chú, mỗi nhãn chỉ hiển thị các
ghi chú của nó, và Chỉnh sửa nhãn cho phép đổi tên hoặc xóa chúng, kèm
Hoàn tác.
"""

["2026-09-29-0630-tasks-more-accounts"]
title = "Việc cần làm từ nhiều tài khoản hơn"
text = """
Việc cần làm giờ cũng đồng bộ với Yahoo, Zoho, iCloud, Fastmail và các
tài khoản khác có việc cần làm nằm trên máy chủ khác với thư. Katna thử
cách tốt nhất của từng tài khoản trước và ghi nhớ cách hoạt động.
"""

["2026-09-29-0651-schedule-meeting"]
title = "Lên lịch cuộc họp từ một thư"
text = """
Nhấp chuột phải vào một cuộc trò chuyện, hoặc mở ⋮, rồi chọn Lên lịch
cuộc họp: một sự kiện mới mở ra ở trang Lịch với chủ đề làm tiêu đề và
mọi người trong cuộc trò chuyện làm khách.
"""

["2026-09-29-0705-running-late"]
title = "Đến muộn? Báo cho mọi người chỉ với một cú nhấp"
text = """
Sự kiện có khách giờ có Gửi thư cho khách và, từ một giờ trước khi bắt
đầu, Tôi đến muộn: một thư gửi mọi người, từ tài khoản của lịch đó, sẵn
sàng để gửi.
"""

["2026-09-29-0607-contact-labels"]
title = "Nhãn liên hệ"
text = """
Nút Gắn nhãn trên trang của một người liên hệ bật tắt các nhãn hoặc tạo
nhãn mới, và ⋮ bên cạnh một nhãn cho phép đổi tên, xóa hoặc viết cho mọi
người trong nhãn đó. Nhãn luôn đồng bộ với Google Contacts và Outlook,
và mọi thay đổi đều có Hoàn tác.
"""

["2026-09-29-0640-add-to-contacts"]
title = "Thêm vào danh bạ từ thư"
text = """
Bảng liên hệ bên cạnh một cuộc trò chuyện có Thêm vào danh bạ cho người
bạn chưa lưu: một cú nhấp lưu tên, địa chỉ cùng điện thoại, chức danh và
công ty từ chữ ký của họ, kèm Hoàn tác. Với người đã lưu, cùng nút đó mở
họ trên trang Danh bạ.
"""

["2026-09-29-0720-focus-time"]
title = "Thời gian tập trung, vắng mặt và địa điểm làm việc"
text = """
Sự kiện mới giờ có thể là Thời gian tập trung, Vắng mặt hoặc Địa điểm
làm việc, như trong Google Calendar: chọn ở phía trên các mốc giờ.
Google và Outlook nhận ra chúng đúng như bản chất, và trong Katna chúng
hiển thị với biểu tượng riêng.
"""

["2026-09-29-0704-task-chips"]
title = "Việc cần làm ngay trên thư"
text = """
Thư bạn đã chuyển thành việc cần làm giờ hiển thị ngày đến hạn của việc
đó trong danh sách, màu đỏ khi đã quá hạn. Nhấp vào để mở việc cần làm.
"""

["2026-09-29-0638-other-contacts"]
title = "Danh bạ khác"
text = """
Danh bạ giờ có Danh bạ khác: những người bạn đã gửi email từ Gmail nhưng
chưa bao giờ lưu, đúng như cách Gmail giữ họ. Lưu bất kỳ ai chỉ bằng một
lần bấm, có Hoàn tác, hoặc bắt đầu một email gửi họ.
"""

["2026-09-29-0745-answer-by-mail"]
title = "Trả lời lời mời từ mọi tài khoản"
text = """
Lời mời gửi đến một tài khoản không có lịch giờ cũng có Có, Không và Có
thể: câu trả lời của bạn được gửi đến người tổ chức qua email, và lịch
của họ ghi nhận nó.
"""

["2026-09-29-0710-meeting-notes"]
title = "Ghi chú cuộc họp"
text = """
Mở một sự kiện trong Lịch rồi chọn Ghi chú cuộc họp: một ghi chú mang
tiêu đề của sự kiện sẽ mở ra, có sẵn người tham dự và chỗ cho các việc
cần làm. Thẻ của sự kiện liệt kê các ghi chú của nó, và chip Sự kiện
trong ghi chú đưa bạn quay lại ngày đó.
"""

["2026-09-29-0751-go-to-pdf-page"]
title = "Đi thẳng tới một trang PDF"
text = """
Số trang bên dưới tệp PDF nay là một ô nhập: nhấp vào đó hoặc nhấn
Ctrl+G, nhập số trang rồi nhấn Enter để chuyển tới đó.
"""

["2026-09-29-0715-tasks-on-calendar"]
title = "Tác vụ trên lịch"
text = """
Tác vụ có ngày đến hạn giờ hiển thị trên Lịch, đúng giờ của chúng hoặc cùng các sự kiện cả ngày. Đánh dấu hoàn tất ngay tại đó, nhấp để mở một tác vụ, hoặc kéo sang ngày hay giờ khác để dành khoảng thời gian đó cho tác vụ.
"""

["2026-09-29-0756-event-reminders"]
title = "Nhắc nhở cho sự kiện của bạn"
text = """
Sự kiện giờ sẽ nhắc bạn bằng thông báo, kể cả khi Katna đã đóng. Tham gia sẽ mở cuộc gọi video, còn Báo lại sau 5 phút sẽ nhắc bạn lại sau năm phút.
"""

["2026-09-29-0758-contacts-merge-import"]
title = "Hợp nhất liên hệ trùng lặp, nhập và xuất liên hệ"
text = """
Danh bạ giờ có Sửa và quản lý: Hợp nhất và sửa tìm những người được lưu hai lần (cùng tên hoặc số điện thoại) và hợp nhất họ chỉ bằng một cú nhấp, kèm Hoàn tác. Nhập đưa người từ tệp vCard vào và bỏ qua những ai đã được lưu, còn Xuất lưu tất cả mọi người, hoặc một nhãn, thành tệp vCard.
"""

["2026-09-29-0835-contacts-birthdays-qr-print"]
title = "Sinh nhật trên lịch, liên hệ dưới dạng mã QR"
text = """
Sinh nhật của các liên hệ giờ hiển thị trên Lịch, trong một lịch Sinh nhật mà bạn có thể bỏ chọn. Trang của một liên hệ có thể hiện liên hệ đó dưới dạng mã QR để camera điện thoại lưu lại, và in ra; In trong Sửa và quản lý sẽ in tất cả những người đang hiển thị. Tính năng nhập giờ cũng đọc được tệp CSV từ Danh bạ Google và Outlook, còn KRunner và tìm kiếm của GNOME tìm được các liên hệ đã lưu của bạn.
"""

["2026-09-29-0830-calendar-density-time-zones"]
title = "Mật độ Lịch và múi giờ thứ hai"
text = """
Nút Tùy chọn trong Lịch đặt độ cao của các giờ (Tự điều chỉnh theo màn hình của bạn, Thoải mái hoặc Gọn) và thêm múi giờ thứ hai bên cạnh múi giờ của bạn, dành cho những người bạn gặp ở nước ngoài.
"""

["2026-09-29-0809-video-calls"]
title = "Bắt đầu cuộc gọi video từ một thư"
text = """
Nhấp chuột phải vào một cuộc trò chuyện, hoặc mở ⋮, rồi chọn Bắt đầu cuộc gọi video: cuộc gọi sẽ mở ra, kèm một thư mới chứa liên kết gửi đến mọi người trong cuộc trò chuyện. Tài khoản Gmail dùng Google Meet; các tài khoản khác nhận một phòng Jitsi Meet. Thư có liên kết cuộc gọi Meet, Teams, Zoom, Webex, Jitsi, WhatsApp hoặc Telegram nay hiển thị nút Tham gia.
"""

["2026-09-29-0815-note-line-task"]
title = "Biến một dòng danh sách kiểm tra thành việc cần làm"
text = """
Đặt con trỏ vào một dòng danh sách kiểm tra trong ghi chú và chọn Biến thành việc cần làm: dòng đó sẽ chuyển sang mục Việc cần làm của bạn. Thẻ Ghi chú trên trang Việc cần làm sẽ mở lại ghi chú.
"""

["2026-09-29-0836-active-pane-stands-out"]
title = "Ngăn bạn đang dùng nổi bật lên"
text = """
Bên cạnh danh sách, chỉ ngăn đang nhận bàn phím mới giữ bóng đổ; danh sách, cuộc trò chuyện hoặc bảng liên hệ mà bạn không dùng sẽ lùi xuống với viền nhạt hơn, và thay đổi đó nhẹ nhàng theo bạn khi bạn nhấp chuột.
"""

["2026-09-29-0840-task-reminders"]
title = "Lời nhắc và lặp lại của công việc"
text = """
Mở một công việc và chọn Nhắc tôi: đúng giờ, trước một giờ hoặc một ngày. Lời nhắc hiện ra ngay cả khi Katna đã đóng, kèm Đánh dấu là đã hoàn thành và Báo lại. Khi đánh dấu xong một công việc lặp lại, giờ đây nó sẽ quay lại vào ngày kế tiếp.
"""

["2026-09-29-0849-tasks-in-desktop-search"]
title = "Tìm việc cần làm từ màn hình nền"
text = """
Gõ vài từ của một việc cần làm trong KRunner hoặc trong tìm kiếm của GNOME, việc đó sẽ hiện ở mục Việc cần làm. Nhấn Enter và Katna sẽ mở nó, sẵn sàng để chỉnh sửa.
"""

["2026-09-29-0832-clock-day-menu"]
title = "Thêm sự kiện và việc cần làm từ đồng hồ trên màn hình nền"
text = """
Trong Katna Digital Clock, nhấp chuột phải vào một ngày trong tháng để
thêm việc cần làm hoặc sự kiện cho ngày đó; sự kiện sẽ mở trong Lịch của
Katna. Nhấp vào một sự kiện của bạn sẽ mở Lịch ở đúng ngày đó.
"""

["2026-09-29-0855-type-an-event"]
title = "Gõ một sự kiện trong một dòng"
text = """
Gõ “Ăn trưa với Anita thứ Sáu 1pm tại Cafe Mocha” hoặc “Họp nhanh mỗi
ngày làm việc 9:30” làm tiêu đề của sự kiện mới, và Lịch sẽ điền ngày,
giờ, lặp lại và địa điểm khi bạn gõ.
"""

["2026-09-29-0915-year-view"]
title = "Xem cả năm"
text = """
Lịch có chế độ xem Năm: cả mười hai tháng cùng lúc, có một dấu chấm dưới
những ngày có sự kiện. Nhấn Y, rồi nhấp vào một ngày để mở nó.
"""

["2026-09-29-0930-share-free-times"]
title = "Chia sẻ giờ rảnh của bạn"
text = """
Chia sẻ giờ rảnh trong các tùy chọn của Lịch sẽ mở một thư liệt kê lúc
bạn rảnh trong vài ngày làm việc tới, sẵn sàng gửi cho bất kỳ ai.
"""

["2026-09-29-0952-calendar-sets"]
title = "Bộ lịch"
text = """
Lưu các lịch bạn đang hiển thị thành một bộ, như “Công việc” hoặc “Gia
đình”, bằng nút + cạnh Bộ lịch. Một cú nhấp vào một bộ sẽ hiện các lịch
của bộ đó và ẩn phần còn lại.
"""

["2026-09-29-0947-tasks-typed-quick-add"]
title = "Nhập một việc cần làm trên một dòng"
text = """
Thêm một việc như “Gọi ngân hàng lúc 15h ngày mai” hoặc “Tưới cây lúc 8h
sáng thứ Hai hằng tuần”, và Việc cần làm sẽ đặt ngày, giờ và lặp lại cho
bạn, đồng thời hiện những gì nó hiểu ngay khi bạn gõ.
"""

["2026-09-29-1028-calendar-narrow-windows"]
title = "Lịch trong cửa sổ hẹp"
text = """
Trong cửa sổ hẹp, Lịch giữ Hôm nay và các ngày trên thanh của nó và gom
các chế độ xem vào một menu. Giờ sự kiện không còn bị ngắt giữa chữ, và
Tab đi tới được mọi nút và mọi lịch.
"""

["2026-09-29-1039-contact-panel-tasks"]
title = "Việc cần làm với họ, ngay cạnh thư của họ"
text = """
Bảng liên hệ cạnh một cuộc trò chuyện giờ liệt kê các việc cần làm đang
mở được tạo từ thư với người đó. Đánh dấu một việc để hoàn thành, hoặc
nhấp vào để mở nó trong Việc cần làm.
"""

["2026-09-29-1046-contact-panel-meetings"]
title = "Các cuộc họp sắp tới của bạn với họ"
text = """
Bảng liên hệ cạnh một cuộc trò chuyện giờ hiển thị các cuộc họp sắp tới
của bạn với người đó. Nhấp vào một cuộc họp để mở nó trong Lịch.
"""

["2026-09-29-1051-tasks-drag-to-list"]
title = "Kéo một việc cần làm sang danh sách khác"
text = """
Trong Việc cần làm, kéo một việc sang danh sách khác để chuyển nó tới
đó. Hoàn tác sẽ đưa nó về chỗ cũ.
"""

["2026-09-29-1111-tasks-search"]
title = "Tìm trong việc cần làm của bạn"
text = """
Trên trang Việc cần làm, ô tìm kiếm ở trên cùng giờ tìm trong các việc
cần làm, ghi chú và việc phụ của bạn thay vì trong thư.
"""

["2026-09-29-1130-calendar-search"]
title = "Tìm sự kiện của bạn"
text = """
Trên trang Lịch, ô tìm kiếm ở trên cùng giờ tìm sự kiện theo tiêu đề,
địa điểm, ghi chú hoặc khách mời, liệt kê theo ngày. Nhấp vào một sự kiện
để mở nó ở ngày của nó; Esc đưa bạn trở lại kết quả.
"""

["2026-09-29-1045-note-formatting"]
title = "Định dạng trong ghi chú"
text = """
Chọn Định dạng trong một ghi chú để dùng Tiêu đề 1, Tiêu đề 2, in đậm,
in nghiêng và gạch chân, như trong Keep. Bảng cũng hiển thị định dạng,
và định dạng đi cùng ghi chú đến thư mục Ghi chú trong tài khoản thư của
bạn, nơi định dạng từ iPhone giờ trở lại đúng như cũ.
"""

["2026-09-29-0934-custom-days-view"]
title = "Chỉ hiện vài ngày"
text = """
Lịch có Chế độ xem tùy chỉnh bên cạnh Lịch biểu: 4 ngày kể từ ngày bạn
chọn, hoặc từ 2 đến 7 ngày. Nhấn X, rồi chọn số ngày trong Tùy chọn.
"""

["2026-09-29-0939-events-in-desktop-search"]
title = "Tìm sự kiện từ màn hình nền"
text = """
Gõ tên một sự kiện vào KRunner hoặc ô tìm kiếm của GNOME để xem lần tới
của nó là khi nào, rồi nhấn Enter để mở ngày đó trong Lịch.
"""

["2026-09-29-1102-apps-on-a-phone"]
title = "Lịch, Danh bạ, Việc cần làm và Ghi chú trên điện thoại"
text = """
Trong cửa sổ hẹp, các trang này giờ vừa màn hình như Thư: danh sách bên
mở từ nút menu, Danh bạ hiện mỗi tên kèm địa chỉ bên dưới, và Ghi chú
xếp hai thẻ trên một hàng.
"""

["2026-09-29-1236-agenda-button-top-bar"]
title = "Lịch trình trong ngày, từ thanh trên cùng"
text = """
Nút hiện lịch trình trong ngày bên cạnh thư của bạn giờ nằm trên thanh
trên cùng, cạnh nút ngôn ngữ, và phần thư có thêm chỗ mà dải bên từng
chiếm.
"""

["2026-09-29-1243-hide-side-panel-on-every-page"]
title = "Ẩn bảng bên trên mọi trang"
text = """
Nút menu ở góc trên bên trái giờ cũng thu gọn bảng bên trong Lịch, Danh
bạ, Việc cần làm và Ghi chú, trượt nó đi như với các thư mục của Thư.
Mỗi trang nhớ bạn có để nó mở hay không.
"""

["2026-09-29-1251-app-menu-on-a-phone"]
title = "Menu chính trên điện thoại"
text = """
Trên điện thoại, menu chính sau ảnh tài khoản giờ mở Tệp, Sửa, Xem và
các mục khác ngay tại chỗ, với một hàng Quay lại ở trên cùng, thay vì
tràn ra ngoài cạnh màn hình.
"""

["2026-09-29-1256-calendar-every-account"]
title = "Mọi tài khoản trong Lịch"
text = """
Danh sách bên của Lịch giờ hiện tất cả tài khoản của bạn. Khi lịch của
một tài khoản không tải được, một dòng bên dưới cho biết lý do, kèm một
cú nhấp để khắc phục, chẳng hạn “Đăng nhập lại để hiện lịch”.
"""

["2026-09-29-1300-switch-account-stay-on-page"]
title = "Đổi tài khoản mà không rời trang"
text = """
Chọn tài khoản khác từ ảnh của bạn ở góc trên bên phải, hoặc lăn con lăn
trên ảnh, giờ vẫn giữ bạn ở Lịch, Việc cần làm, Danh bạ hoặc Ghi chú.
Mục mới sẽ vào tài khoản đó, và Thư sẽ hiện tài khoản đó khi bạn quay
lại.
"""

["2026-09-29-1317-contacts-every-account"]
title = "Mọi tài khoản trong Danh bạ"
text = """
Danh bạ giờ liệt kê tất cả tài khoản của bạn dưới mục Tài khoản, kèm số
người trong mỗi tài khoản; nhấp vào một tài khoản để chỉ xem người của
tài khoản đó. Khi danh bạ của một tài khoản không tải được, một dòng bên
dưới cho biết lý do, kèm một cú nhấp để khắc phục, chẳng hạn “Đăng nhập
lại để hiện danh bạ” hoặc “Thử lại”.
"""
