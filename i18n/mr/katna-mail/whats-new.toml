तुम्ही निवडलेल्या टॅबकडे हायलाइट सरकते, आणि उघड्या टॅबवर क्लिक केल्यास
त्याची यादी परत वर जाते. यादी अरुंद असताना बार स्वतःची ओळ घेतो आणि आयकॉन
दाखवतो, उघड्या टॅबचे नाव ठेवून; फोनवर तो यादीच्या बारमध्ये असतो, आणि रिफ्रेश
