इनबॉक्सच्या थोडे आधी सर्व मेल मध्ये ठेवलेली मेल Katna पूर्वी चुकवत असे.
"""

["2026-09-28-0156-attachment-types"]
title = "अटॅचमेंटच्या प्रकारानुसार शोधा"
text = """
शोध पर्यायांमध्ये “अटॅचमेंट असलेले” आता PDF, XLSX, ODF, XLS, ODS, PPT
आणि PPTX देते, तसेच png किंवा avif सारख्या इतर कोणत्याही एक्स्टेंशनसाठी
“सानुकूल”. फक्त निवडलेल्या प्रकारचे अटॅचमेंट असलेले मेल दिसतात.
"""

["2026-09-28-0106-original-colors"]
title = "डार्क थीममध्ये मूळ रंग"
text = """
डार्क थीममध्ये स्वतःचे रंग ठरवणारा मेल गडद रंगांत दाखवला जातो. वाचन पेनच्या
टूलबारमधले नवे अर्धवर्तुळ बटण तो प्रेषकाच्या मूळ रंगांत दाखवते आणि पुन्हा
मागे आणते.
"""

["2026-09-28-0127-print-as-shown"]
title = "प्रिंट स्वरूप तसेच ठेवते"
text = """
मेल वाचन पेनमध्ये दिसतो तसाच प्रिंट होतो — त्याचे टेबल, रंग, किनारी, याद्या
आणि चित्रांसह. प्रिंट पूर्वावलोकन शाई वाचवण्यासाठी पार्श्वभूमीचे रंग वगळू
शकते, किंवा फक्त मजकूर वापरून केवळ मजकूर प्रिंट करू शकते.
"""

["2026-09-28-0141-ask-before-deleting"]
title = "हटवण्यापूर्वी विचारणा"
text = """
एकाच वेळी अनेक संभाषणे हटवताना आता प्रथम ती कचरापेटीत हलवायची का असे विचारले
जाते. हा प्रश्न वगळण्यासाठी “पुन्हा विचारू नका” खुणा करा, किंवा सेटिंग्ज >
सामान्य मधून तो पुन्हा सुरू करा. कचरापेटीतून कायमचे हटवताना नेहमी विचारले
जाते.
"""

["2026-09-28-0019-katna-for-windows"]
title = "Windows साठी Katna"
text = """
Katna Mail आता Windows 10 आणि 11 वरही चालते. ते स्वतःच्या Katna Setup ने
इंस्टॉल होते, आणि त्यात ट्रे आयकन, सूचना, लॉग इन केल्यावर सुरू होणे आणि
Katna मध्ये उघडणाऱ्या मेल लिंक आहेत.
"""

["2026-09-28-0236-chip-remove-always"]
title = "प्रत्येक पत्त्यावर काढण्याचे बटण"
text = """
प्रति, Cc आणि Bcc मधील प्रत्येक पत्त्याची चिप आता नेहमी तिचा x दाखवते,
त्यामुळे आधी तिच्यावर पॉइंटर न नेता तुम्ही ती काढू शकता.
"""

["2026-09-28-0244-pill-format-bar"]
title = "अधिक गोलाकार फॉरमॅटिंग बार"
text = """
मेल लिहिताना दिसणारा फॉरमॅटिंग बार (Aa) आता हलक्या कडेसह कॅप्सूलच्या आकाराचा
आहे, त्यामुळे लाइट आणि डार्क दोन्ही थीममध्ये तो तुमच्या मजकुरापासून वेगळा
दिसतो.
"""

["2026-09-28-0325-long-threads-smooth"]
title = "लांब ईमेल थ्रेड पटकन उघडतात"
text = """
आधीच्या अनेक उत्तरांचे अवतरण असलेला फॉरमॅट केलेला मेल, जसे कोटेशनचा लांब
थ्रेड, आता संपूर्ण विंडो मंद न करता लगेच उघडतो आणि सहजपणे स्क्रोल होतो.
"""

["2026-09-28-0830-who-has-seen-it"]
title = "कोणी पाहिला, एका डोळ्यामागे"
text = """
ट्रॅकिंगसह पाठवलेल्या मेलवर आता ओळींचा बॉक्स नसतो. कोणी तो उघडताच
तारेशेजारचा डोळा तुमच्या ॲक्सेंट रंगात बदलतो; तो कोणी उघडला किंवा लिंक
उघडली, आणि केव्हा, हे पाहण्यासाठी त्यावर पॉइंटर ठेवा.
"""

["2026-09-28-0831-contact-call-copy"]
title = "संपर्क तपशीलातून कॉल आणि कॉपी"
text = """
संभाषणाशेजारील संपर्क तपशीलात, फोन नंबरवर क्लिक करून तुमच्या फोन ॲपने किंवा
KDE Connect ने कॉल करा, किंवा शेजारचे कॉपी बटण वापरा. पॅनलमधील सर्व मजकूर
आता निवडून कॉपीही करता येतो.
"""

["2026-09-28-0848-quoted-text-hide-remove"]
title = "उत्तरातील अवतरित मेल लपवा किंवा काढा"
text = """
उत्तराखालचे “...” बटण उघडल्यानंतर आता अवतरित मेल पुन्हा लपवते. तुमच्या
उत्तरातून अवतरित मेल काढण्यासाठी त्यावर पॉइंटर ठेवा आणि त्याच्या कोपऱ्यातील
x वर क्लिक करा; “पूर्ववत करा” किंवा Ctrl+Z तो परत आणते. स्क्रोल करताना
उत्तराचा टूलबारही जागेवरच राहतो.
"""

["2026-09-28-0854-floating-folders"]
title = "तरंगणारे फोल्डर आणि रुंद शोध"
text = """
फोल्डर लपवलेले असताना “लिहा” किंवा “मेल” वर पॉइंटर ठेवल्यास ते कडांपासून दूर
राहणाऱ्या पॅनलच्या रूपात उघडतात, आणि एक छोटी खाच बटणाकडे निर्देश करते.
फोल्डरनी सोडलेली जागा भरण्यासाठी शोध बॉक्स वाढतो, आणि तुम्ही आधीच ज्या
फोल्डरमध्ये आहात त्यावर क्लिक केल्याने यादी आता लुकलुकत नाही.
"""

["2026-09-28-0928-search-address-suggestions"]
title = "शोध पर्यायांमध्ये पत्त्यांच्या सूचना"
text = """
शोध पर्याय मधील “कडून” आणि “प्रति” आता तुम्ही टाइप करताना पत्ते सुचवतात, जसे
मेल लिहिताना प्रति, Cc आणि Bcc सुचवतात. Enter, Tab किंवा क्लिकने एक निवडा.
"""

["2026-09-28-0935-app-menu-reply-all-window"]
title = "खाते कार्डमध्ये मुख्य मेनू, सर्वांना उत्तर स्वतंत्र विंडोमध्ये"
text = """
खाते कार्डमध्ये “खाती व्यवस्थापित करा” शेजारी एक ☰ बटण आहे. ते डेस्कटॉपच्या
ग्लोबल मेनूसारखेच फाइल, संपादन, दृश्य, जा, मेसेज, सेटिंग्ज आणि मदत मेनू
उघडते, जे डेस्कटॉप ग्लोबल मेनू दाखवत नाहीत त्यांच्यासाठी. नवीन मेलच्या
सूचनेवरील “सर्वांना उत्तर द्या” आता संभाषण स्वतःच्या विंडोमध्ये, टाइप
करण्यास तयार, उघडते आणि मुख्य विंडो आहे तिथेच ठेवते.
"""

["2026-09-28-1011-tray-brings-window-forward"]
title = "ट्रे आणि सूचनेवरील क्लिक Katna Mail पुढे आणतात"
text = """
ट्रे आयकॉनवर, किंवा त्याच्या मेनूतील “इनबॉक्स उघडा”, “नवीन मेसेज” किंवा
“सेटिंग्ज” वर क्लिक केल्यावर आता Wayland वर Katna Mail ची विंडो पुढे येते, ती
लहान केलेली असली किंवा इतर विंडोंच्या मागे असली तरीही. नवीन मेलच्या सूचनेवर
क्लिक केल्यावर तो मेल उघडतो, इनबॉक्सच्या यादीत तो दिसत नसला तरीही.
"""

["2026-09-28-1053-send-countdown-reply-in-place"]
title = "पाठवण्याची उलटी गणना, आणि तुमचे उत्तर संभाषणातच राहते"
text = """
“पाठवा” नंतर, “पूर्ववत करा” शेजारी एक आकुंचन पावणारे वर्तुळ पूर्ववत करण्याचा
वेळ मोजते, आणि मेल गेल्यावर सूचनेत “मेसेज पाठवला” दिसते (एका छोट्या आवाजासह).
हा आवाज सेटिंग्ज > सामान्य > पाठवणे मध्ये बंद करता येतो. संभाषणात लिहिलेले
उत्तर तुम्ही जिथे लिहिले तिथेच मेसेज बनते. त्याच्या वरच्या भागात फक्त ते
कोणाला जात आहे ते दिसते; “प्रेषक”, “प्रति”, Cc आणि Bcc साठी त्यावर क्लिक करा.
उत्तर आयकॉनशेजारील बाण “उत्तर द्या”, “सर्वांना उत्तर द्या” आणि “फॉरवर्ड करा”
यांमध्ये बदलतो, आणि तुम्ही लिहिलेले तसेच ठेवतो.
"""

["2026-09-28-1110-search-options-narrow"]
title = "शोध पर्याय अरुंद विंडोमध्येही नीट बसतात"
text = """
अरुंद किंवा कमी उंचीच्या विंडोमध्ये “शोध पर्याय” आता उपलब्ध जागेइतके रुंद
होतात, फोनवर लेबल त्यांच्या फील्डच्या वर दाखवतात आणि जागा पुरत नसल्यास
स्क्रोल होतात, त्यामुळे “शोधा” बटण नेहमी हाताशी राहते.
"""

["2026-09-28-1119-replies-from-right-account"]
title = "उत्तरे योग्य खात्यातून जातात"
text = """
एकत्रित इनबॉक्स किंवा शोधातून उघडलेल्या मेलवरील “उत्तर द्या” किंवा “फॉरवर्ड
करा” आता तो मेल ज्या खात्यावर आला त्याच खात्यातून जाते, तुमच्या प्रोफाइल
चित्राखाली निवडलेल्या खात्यातून नाही.
"""

["2026-09-28-1436-calmer-search-box"]
title = "शोध आपला शॉर्टकट दाखवतो"
text = """
शोध बॉक्स “मेल शोधा” च्या शेजारी त्याचा कीबोर्ड शॉर्टकट दाखवतो, जसा सेटिंग्ज >
शॉर्टकट मध्ये सेट केला आहे. त्यात क्लिक केल्यावर तो आपला रंग तसाच ठेवतो आणि
गडद होऊन सावली दाखवण्याऐवजी एक फिकट कडा दाखवतो. यादीवर तरंगणारे फोल्डर आता
तळाच्या कडेपासूनही दूर राहतात.
"""

["2026-09-28-1450-clear-activity"]
title = "ॲक्टिव्हिटी नीटनेटकी ठेवा"
text = """
ॲक्टिव्हिटीमधील एखाद्या उघडण्यावर किंवा क्लिकवर पॉइंटर न्या आणि ते यादीतून
काढण्यासाठी × दाबा, किंवा नव्याने सुरुवात करण्यासाठी “सर्व साफ करा” दाबा. नवीन
उघडणे आणि क्लिक तरीही दिसतात, आणि “तपशील” अहवाल अजूनही सर्व काही मोजतो.
"""

["2026-09-28-1541-round-logo"]
title = "Katna चा नवा गोल लोगो"
text = """
Katna चा आता एक नवा लोगो आहे: टील रंगाच्या वर्तुळावर एक स्क्रिप्ट “k”,
जो ॲप मेनू, वरचा बार आणि टास्कबारमध्ये दिसतो. ट्रे तो अशा एका रंगात
दाखवतो जो तुमच्या पॅनलशी जुळतो, आणि “Katna बद्दल” व स्वागत पानावर पूर्ण
“katna mail” दिसते.
"""

["2026-09-28-1546-contact-cards"]
title = "अधिक स्वच्छ संपर्क पॅनल"
text = """
संपर्क पॅनल आता प्रत्येक भाग स्वतःच्या वेगळ्या मऊ कार्डवर दाखवतो, नावाखाली
गोल बटणांसह ज्यांनी त्या व्यक्तीला मेल पाठवा, त्यांचे मेल शोधा किंवा
त्यांना कॉल करा. अलीकडील संभाषणांमध्ये फक्त अलीकडची काही दिसतात; बाकीची
पाहण्यासाठी आणखी दाबा आणि ती परत लपवण्यासाठी कमी दाबा.
"""

["2026-09-28-1507-reply-box-recipients"]
title = "एक अधिक नीटनेटकी उत्तर पेटी"
text = """
प्राप्तकर्ते आता त्यांच्या चित्रांसह दिसतात, आणि Cc व Bcc एका लहान
बटणात एकत्र राहतात. उत्तराचे प्राप्तकर्ते उघडल्यावर पेटी सहजपणे वर
वाढते, आणि अवतरित मेल एका लहरी रेषेखाली सहजपणे उघडते व बंद होते,
ज्यावर क्लिक करून तुम्ही ते पुन्हा दुमडून ठेवू शकता.
"""

["2026-09-28-1620-softer-window-shadow"]
title = "एक मऊ विंडो सावली आणि KDE आकाराची बटणे"
text = """
Katna विंडो फ्रेमसह, विंडोभोवतीची सावली आता अधिक घट्ट आहे आणि पूर्णपणे
मिटते, विंडोच्या बाजूला उरणाऱ्या त्या कठोर कडेशिवाय. विंडोची बटणे आता
KDE च्या स्वतःच्या बटणांइतक्याच आकाराची आहेत, आणि विंडोच्या बाजूपासून
तितकीच दूर राहतात जितकी तिच्या वरून.
"""

["2026-09-28-1622-update-from-the-app"]
title = "ॲपमधूनच Katna अपडेट करा"
text = """
Katna आता स्वतःहून नव्या आवृत्त्या डाउनलोड करते आणि तयार झाल्यावर
तुम्हाला सांगते. सूचनेत किंवा “Katna बद्दल” मध्ये अपडेट दाबा: Katna
Mail सांगते की ते रीस्टार्ट होईल, तुमचा पासवर्ड विचारते, अपडेट
इंस्टॉल करते आणि तुम्ही जिथे थांबला होता तिथून पुन्हा उघडते.
सेटिंग्ज > सामान्य > अपडेट आपोआप डाउनलोड होणे बंद करते.
"""

["2026-09-28-1520-track-sealed-and-plain"]
title = "स्वाक्षरी केलेला, एन्क्रिप्ट केलेला आणि साध्या मजकुराचा मेल ट्रॅक करा"
text = """
