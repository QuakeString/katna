text = """
Gmail ने मेलवरून बनवलेल्या इव्हेंटना, जसे ट्रेन, विमान प्रवास आणि हॉटेल,
त्यांच्या कार्डवर मेल उघडा बटण मिळते. ते तो मेल Katna मध्ये उघडते, किंवा
Katna कडे तो नसल्यास Gmail मध्ये. मेलवरून बनवलेले कार्यही कॅलेंडरवरील
त्याच्या कार्डमधून त्याचा मेल उघडते, आणि मीटिंग नोंद घ्या क्षणात उघडते.
"""

["2026-09-30-0843-calendar-side-panel-menus"]
