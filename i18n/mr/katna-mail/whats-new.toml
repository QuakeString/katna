text = """
कॅलेंडरच्या बाजूच्या पॅनलमधील कॅलेंडरवर उजवे क्लिक करून फक्त तेच दाखवा,
त्याचा रंग बदला, नाव बदला किंवा ते हटवा. त्या खात्यात नवीन कॅलेंडर
बनवण्यासाठी किंवा त्याची सर्व कॅलेंडर दाखवण्यासाठी व लपवण्यासाठी खात्याच्या
नावावर उजवे क्लिक करा. बदल तुमच्या मेल सेवेकडे जातात, त्यामुळे ते तुम्ही
सेवा वापरता त्या सर्व ठिकाणी दिसतात.
"""

["2026-09-30-1010-unread-list-keeps-open-mail"]
