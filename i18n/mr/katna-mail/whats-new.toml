Fastmail, GMX, Yandex किंवा इतर कोणताही. प्रदात्याला आधी काय हवे ते Katna
सांगते, कनेक्ट होताना प्रत्येक टप्पा दाखवते, आणि शेवटी काय सेट केले ते
सांगते. POP3 खातीही चालतात, आणि सेटिंग्ज > खाती त्यांचे मेल सर्व्हरवर किती
काळ राहतील ते ठरवते.
"""

