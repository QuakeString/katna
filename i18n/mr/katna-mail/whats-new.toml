आणि ते किती स्टोरेज वापरते ते पाहा. तिथून तुम्ही तो इनबॉक्स तपासू शकता, त्या
खात्यातून नवीन मेल लिहू शकता, त्याची सेटिंग्ज उघडू शकता, किंवा साइन इनची
