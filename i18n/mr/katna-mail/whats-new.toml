मेल यादीचा राइट-क्लिक मेनू रोजच्या क्रिया वर ठेवतो आणि बाकीच्या “पाठपुरावा” (कार्ये, नोट्स, मीटिंग, कॉल) आणि “अधिक” (स्पॅम, महत्त्व, पिन) खाली ठेवतो. तो तुम्ही क्लिक कराल तिथे उघडतो आणि विंडोच्या आतच राहतो; कमी उंचीच्या किंवा अरुंद विंडोमध्ये सबमेनू मेनूच्या जागी उघडतो.
"""

["2026-09-29-1627-contacts-accounts-why"]
title = "खात्यात संपर्क का नाहीत"
text = """
एखाद्या खात्याचे संपर्क दिसत नसतील, तेव्हा सर्व्हरने काय उत्तर दिले ते संपर्क आता सांगते, आणि “पुन्हा प्रयत्न करा” ते लगेच पुन्हा शोधते. पासवर्डने जोडलेले Gmail किंवा Outlook खाते Google किंवा Microsoft ने साइन इन करण्याचा पर्याय देते, जे त्यांच्या संपर्कांसाठी आवश्यक आहे.
"""

["2026-09-29-1640-search-box-focus"]
title = "शोध बॉक्स सक्रिय असताना ते दाखवतो"
text = """
वरच्या शोध बॉक्समध्ये तुम्ही टाइप करत असताना, इतर प्रत्येक फील्डप्रमाणे त्याला ॲक्सेंट रंगाची कड मिळते, आणि तुम्ही तो रिकामा ठेवेपर्यंत त्याची Ctrl+F सूचना बाजूला होते.
"""

["2026-09-29-1612-tasks-board-rows"]
title = "प्रत्येक कार्य सूची नजरेसमोर"
text = """
“सर्व कार्ये” आता विंडोमध्ये बसतील तितक्या सूची शेजारी शेजारी, खाली आणखी ओळींसह दाखवते, त्यामुळे प्रत्येक सूचीपर्यंत पोहोचता येते. नवीन सूची तयार करताच ती दिसेल अशी स्क्रोल होते.
"""

["2026-09-29-1653-smooth-attachment-paging"]
title = "अटॅचमेंटमध्ये सहज पुढे-मागे जा"
text = """
व्ह्यूअरमध्ये बाणांनी पुढच्या किंवा मागच्या अटॅचमेंटवर जाताना आता लुकलुकत नाही. व्ह्यूअर उघडाच राहतो आणि पुढची फाइल तयार होताच मागच्या फाइलची जागा घेते.
"""

["2026-09-29-1656-drag-notes"]
title = "नोट्स ओढून क्रम लावा"
text = """
Keep प्रमाणे, नोट हलवण्यासाठी नोट्स बोर्डवर ती ओढा. इतर नोट्स जागा करून देण्यासाठी बाजूला सरकतात, आणि तुम्ही जिथे सोडाल तिथे ती राहते. Ctrl+Z ती परत ठेवते. कार्ड आता त्यांच्या स्तंभांमध्ये नीट बसतात, लहान नोट्सखाली रिकामी जागा राहत नाही.
"""

["2026-09-29-1707-calendar-right-click"]
title = "कॅलेंडरमध्ये राइट-क्लिक"
text = """
तिथे इव्हेंट, फोकस वेळ किंवा कार्यालयाबाहेर जोडण्यासाठी मोकळ्या वेळेवर किंवा दिवसावर राइट-क्लिक करा. इव्हेंट संपादित करण्यासाठी, डुप्लिकेट करण्यासाठी, हटवण्यासाठी, उत्तर देण्यासाठी, सहभागी होण्यासाठी, पाहुण्यांना ईमेल करण्यासाठी, रंग देण्यासाठी किंवा दुसऱ्या कॅलेंडरमध्ये हलवण्यासाठी त्यावर राइट-क्लिक करा, आणि कार्य पूर्ण झाले म्हणून खूण करण्यासाठी, तारांकित करण्यासाठी, दुसरा दिवस देण्यासाठी किंवा हटवण्यासाठी कार्यावर. पूर्ववत करा बदल मागे घेते.
"""

["2026-09-29-1725-pdf-notes-and-text"]
title = "PDF वर टिपा आणि मजकूर"
text = """
PDF वर खुणा करताना आता चिकट टिपा आणि मजकूर बॉक्स आहेत: पानावर क्लिक करा, टाइप करा आणि Ctrl+Enter दाबा. टीप वाचण्यासाठी तिच्यावर पॉइंटर न्या, किंवा बदलण्यासाठी तिच्यावर क्लिक करा. उत्तर द्या तुमची खुणा केलेली प्रत थेट संदेशाच्या उत्तरात परत पाठवते.
"""

["2026-09-29-1657-tasks-drag-to-place"]
title = "कार्ये हवी तिथे ड्रॅग करा"
text = """
कार्य त्याच्या सूचीत वर किंवा खाली, किंवा दुसऱ्या सूचीत ड्रॅग करा, आणि तिथली कार्ये बाजूला सरकून ते कुठे जाईल ते दाखवतात. Google Tasks नवा क्रम तुमच्या फोनवरही ठेवते, आणि पूर्ववत करा कार्य परत जागी ठेवते.
"""

["2026-09-29-1719-calendar-task-tab"]
title = "कॅलेंडरमधून कार्य जोडा"
text = """
नवीन इव्हेंट कार्डमध्ये Google Calendar प्रमाणे कार्य टॅब आहे. वेळेवर क्लिक करा, कार्य निवडा, आणि शीर्षक, दिवस व वेळ तुम्ही निवडलेल्या सूचीत कार्य बनतात, हवे असल्यास वर्णनासह.
"""

["2026-09-29-1758-calendar-new-task-here"]
title = "कॅलेंडरमधून कार्य जोडा"
text = """
तिथे कार्य जोडण्यासाठी कॅलेंडरवरील मोकळ्या वेळेवर किंवा दिवसावर राइट-क्लिक करा आणि कार्य निवडा. नवीन इव्हेंट कार्ड तो दिवस व वेळ भरलेले असताना त्याच्या कार्य टॅबवर उघडते.
"""

["2026-09-30-0113-calendar-server-unreachable"]
title = "धीम्या सर्व्हरनंतर कॅलेंडर पुन्हा शोधते"
text = """
खात्याचा कॅलेंडर सर्व्हर वेळेत उत्तर देत नाही तेव्हा, कॅलेंडर आता "कोणतेही कॅलेंडर सापडले नाही" ऐवजी तसे सांगते, आणि कनेक्शन थांबले की सुरक्षित हँडशेक हेही सांगते. ते तासांऐवजी काही मिनिटांतच पुन्हा प्रयत्न करते.
"""

["2026-09-30-0123-contact-files-fill"]
title = "संपर्काच्या फाइल्स डाउनलोड दाखवतात"
text = """
ज्याचा मेल अजून या संगणकावर नाही अशी संपर्क पॅनलमधील फाइल आता, यादीतील
अटॅचमेंटप्रमाणेच, डाउनलोड होत असताना भरत जाते आणि मग उघडते.
"""

["2026-09-30-0135-new-account-mail-shows-as-it-arrives"]
title = "नवीन खात्याचा मेल येईल तसा दिसतो"
text = """
तुम्ही खाते जोडल्यानंतर, सर्व फोल्डर पूर्ण होईपर्यंत "तुमचा मेल आणत आहे…" वरच
थांबण्याऐवजी, त्याचा इनबॉक्स आधी डाउनलोड होतो आणि तुम्ही पाहत असतानाच भरत जातो.
इतर फोल्डरही तसेच भरत जातात.
"""

["2026-09-30-0159-checkbox-matches-icons"]
title = "आयकॉनच्या रांगेत बसणारे चेकबॉक्स"
text = """
चेकबॉक्स आता थोडे लहान आहेत, मेल यादीत शेजारच्या तारा आणि लेबल आयकॉनइतकेच. त्यांवर क्लिक करणे तितकेच सोपे आहे, आणि टिक अजूनही आपोआप उमटते.
"""

["2026-09-30-0201-zoho-calendars"]
title = "Zoho च्या स्वतःच्या कनेक्शनमधून Zoho कॅलेंडर"
text = """
Zoho इतर ॲप्सना कॅलेंडर अशा पोर्टवर देते जो अनेक नेटवर्क ब्लॉक करतात, म्हणून “Zoho ने साइन इन
करा” नंतर कॅलेंडर ती त्याऐवजी Zoho च्या स्वतःच्या API मधून वाचते. तुमचे Zoho इव्हेंट तुमच्या इतर
कॅलेंडरशेजारी दिसतात; ते Katna मधून बदलणे नंतर येईल.
"""

["2026-09-30-0216-zoho-tasks"]
title = "Zoho कार्ये"
text = """
Zoho खात्यावर Zoho ने साइन इन करा आणि त्याची Zoho ToDo कार्ये कार्येमध्ये दोन्ही दिशांनी दिसतात:
Katna मध्ये कार्य जोडा, संपादित करा, टिक करा किंवा हटवा, आणि ते Zoho मध्येही बदलते.
"""

["2026-09-30-0224-checkbox-tick-centred"]
title = "कोणत्याही आकारात मध्यभागी बसणारी टिक"
text = """
सेटिंग्ज > स्वरूप > स्केलिंग 100% पेक्षा जास्त असताना चेकबॉक्सची टिक थोडी वर आणि डावीकडे सरकलेली असायची. चेकबॉक्स आणि गोल बटणांच्या कडा आता स्केलसोबत वाढतात, त्यामुळे टिक प्रत्येक आकारात मध्यभागी असते.
"""

["2026-09-30-0230-edges-follow-scaling"]
title = "स्केलिंगसोबत कडा वाढतात"
text = """
सेटिंग्ज > स्वरूप मधील स्केलिंग 100% पेक्षा जास्त किंवा कमी असताना, फोकस
असलेल्या शोध बॉक्सची आणि फील्डची ॲक्सेंट कड, तसेच पर्याय कार्डांच्या आणि
कार्य वर्तुळांच्या कडा आता पातळ न राहता बाकी सर्वांसोबत मोठ्या-लहान होतात.
"""

["2026-09-30-0326-google-sign-in-network"]
title = "प्रत्येक नेटवर्कवर Google ने साइन इन"
text = """
Google चे कनेक्शन लवकर तोडणाऱ्या नेटवर्कवर Google ने साइन इन आता “peer
closed connection” म्हणून थांबत नाही. Google च्या पानावर तुम्ही Gmail वरील
टिक काढल्यास, Katna नंतर अयशस्वी होण्याऐवजी आता लगेच तसे सांगते.
"""

["2026-09-30-0504-google-api-turned-off"]
title = "कोणता Google API बंद आहे ते सांगते"
text = """
Google ने Katna साठी एखादा API बंद ठेवला असल्यास, संपर्क, कॅलेंडर, कार्ये
आणि Drive फाइल आता Google ची कच्ची त्रुटी दाखवण्याऐवजी एका छोट्या ओळीत
कोणता ते सांगतात, सोबत Google चे संबंधित पान उघडणारे चालू करा बटण असते.
"""

["2026-09-30-0507-newest-mail-first"]
title = "सर्वात नवीन मेल आधी"
text = """
तुम्ही खाते जोडता तेव्हा Katna Mail आता आधी तुमचे सर्वात अलीकडचे मेल डाउनलोड
करते आणि मग जुन्या मेलकडे जाते, त्यामुळे आजचे संदेश लगेच इनबॉक्सच्या वर
दिसतात. डाउनलोड मध्येच थांबल्यास, पुढच्या वेळी ते जुने मेल पुढे घेते.
"""

["2026-09-30-0601-keyring-at-login"]
title = "लॉग इनच्या वेळी तुमच्या वॉलेटची वाट पाहते"
text = """
Katna सुरू होताना KWallet किंवा GNOME Keyring अजून लॉक असेल आणि त्याची अनलॉक
विंडो बंद केली असेल, तरी तुमची खाती आता चुकीचा पासवर्ड दाखवत नाहीत. ती वाट
पाहतात, आणि तुम्ही वॉलेट अनलॉक करताच Katna बंद न करता आपोआप सिंक सुरू
करतात. सिंक आता ते पुन्हा अनलॉक करायला सांगते.
"""

["2026-09-30-0606-pdf-rotate-and-top-bar"]
title = "PDF पाने फिरवा"
text = """
PDF दर्शक आता पाने घड्याळाच्या दिशेने किंवा उलट दिशेने फिरवू शकतो (Ctrl+R
आणि Ctrl+Shift+R), आणि खुणा केलेली प्रत तुम्ही फिरवल्याप्रमाणेच सेव्ह होते.
पान क्रमांक आणि झूम वरच्या बारमध्ये गेले आहेत, त्यामुळे पान काहीही झाकत नाही.
"""

["2026-09-30-0610-calendar-events-stay-put"]
title = "इव्हेंट जागेवरच राहतात"
text = """
कॅलेंडरमध्ये इव्हेंट किंवा कार्यावर क्लिक करून नंतर दृश्य बदलल्यास ते आता
पॉइंटरच्या मागे फिरत राहत नाही. इव्हेंट आता फक्त बटण दाबून ओढताना हलतो, आणि
दृश्य किंवा पान बदलणे, Esc दाबणे किंवा त्याचे कार्ड उघडणे त्याला न बदलता
परत ठेवते.
"""

["2026-09-30-0620-checkbox-partial-centred"]
title = "अर्धवट टिक केलेले बॉक्स नीट दिसतात"
text = """
फक्त काही संदेश निवडलेले असताना, सर्व निवडा बॉक्समधील चौकोनाभोवती आता
प्रत्येक बाजूला समान अंतर असते, तुमचे इंटरफेस स्केल काहीही असो.
"""

["2026-09-30-0632-year-view-day-peek"]
title = "वर्ष दृश्यातून दिवसाचे बेत पाहा"
text = """
कॅलेंडरच्या वर्ष दृश्यात, ठिपका असलेल्या दिवसावर पॉइंटर ठेवा आणि
त्याशेजारच्या छोट्या पॉपओव्हरमध्ये त्याचे इव्हेंट आणि कार्ये पाहा,
प्रत्येकासोबत ते काय आहे ते सांगणारा आयकॉन आणि वेळ. उघडण्यासाठी एकावर क्लिक
करा, किंवा तो दिवस उघडण्यासाठी दिवसाच्या नावावर. फोनवर दिवसावर टॅप करा.
"""

["2026-09-30-0650-notification-opens-own-window"]
title = "सूचना मेल समोर उघडतात"
text = """
नवीन मेलच्या सूचनेवर क्लिक केल्यास तो मेल स्वतःच्या विंडोमध्ये, सर्वात समोर
उघडतो, Katna त्या वेळी काहीही दाखवत असो. सर्वांना उत्तर द्या तो उत्तर
टाइप करण्यासाठी तयार ठेवून उघडतो. संग्रहित करा काहीही न उघडता मेल बाजूला
ठेवते आणि पूर्ववत करा असलेल्या छोट्या सूचनेत तसे सांगते.
"""

["2026-09-30-0700-event-card-join-any-call"]
title = "कॅलेंडरमधून Teams आणि Zoom कॉलमध्ये सामील व्हा"
text = """
इव्हेंटचे कार्ड आता त्याच्या वर्णनात किंवा ठिकाणात कॉल शोधते, त्यामुळे
Microsoft Teams, Zoom, Webex, Jitsi किंवा Google Meet आमंत्रणाला वरच्या बाजूला
“यासह सामील व्हा” बटण मिळते. वर्णनातील वेब पत्ते लिंक असतात, अंडरस्कोअरच्या
ओळी गेल्या आहेत, आणि तपशील स्क्रोल होताना “तुम्ही जात आहात का?” तळाशी राहते.
"""

["2026-09-30-0715-click-away-closes-viewer"]
