# The languages Katna offers, in the picker's order (docs/ARCHITECTURE.md §13.10).
#
# tag:         the setting's value (general.language), BCP 47
# name:        the language's own name; english: its English name
# flag:        a flag in apps/katna-mail/assets/flags (ISO 3166 code)
# translation: the folder under i18n/ with its text (English entries share `en`)
# formats:     the locale dates and numbers are formatted in
# rtl:         reads right to left, so the layout mirrors
# status:      "source", "machine" (drafted by AI, needs a native speaker's
#              review) or "reviewed"; reviewers: who reviewed it

[[language]]
tag = "en-IN"
name = "English (India)"
english = "English (India)"
flag = "in"
translation = "en"
