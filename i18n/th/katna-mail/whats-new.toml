และเมนูไปที่ก็แสดงรายการเหล่านี้ด้วย คลิกขวาที่ Katna Mail
บนแถบงานเพื่อเปิดปฏิทินหรือรายชื่อติดต่อได้ทันที
"""

["2026-09-29-0412-tasks-page"]
title = "Katna งาน"
text = """
กด Ctrl+4 หรือเลือกงานทางด้านซ้าย: ทุกรายการเรียงข้างกันเหมือน Google Tasks
พร้อมงานย่อย ดาว วันครบกำหนด การทำซ้ำ และรายละเอียด รายการซิงก์กับ Google Tasks
และ Microsoft To Do และงานจากนาฬิกาบนเดสก์ท็อปก็แสดงที่นี่ด้วย
"""

["2026-09-29-0352-contacts"]
title = "รายชื่อติดต่อของคุณจากทุกบัญชี"
