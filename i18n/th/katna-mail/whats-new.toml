title = "“ออก” ปิดทันที"
text = """
“ออก” ในเมนูของไอคอนในถาด ไม่ต้องรออีเมลที่ยังซิงค์อยู่
หรือกำลังจัดทำดัชนีอีกต่อไป Katna และไอคอนในถาดจะปิดทันที
ส่วนที่เหลือจะทำต่อ เมื่อ Katna เริ่มทำงานครั้งถัดไป
"""

["2026-09-27-1715-contact-panel"]
title = "รายละเอียดผู้ติดต่อข้างอีเมลของคุณ"
text = """
ในหน้าต่างที่กว้าง ตอนนี้การ์ดข้างการสนทนาที่เปิดอยู่
จะแสดงผู้ส่ง: โทรศัพท์ ตำแหน่ง และบริษัทจากลายเซ็นของเขา
เวลาของเขาตอนนี้ ปริมาณอีเมลที่คุณติดต่อกัน
การสนทนาล่าสุดของคุณ และไฟล์ระหว่างคุณกับเขา
คลิกการสนทนาหรือไฟล์เพื่อเปิด หรือคลิกบุคคลอื่นในการสนทนา
เพื่อดูข้อมูลของคนนั้น ข้อมูลนี้อ่านจากอีเมลของคุณ
ในคอมพิวเตอร์เครื่องนี้เท่านั้น ปุ่มผู้ติดต่อบนแถบเครื่องมือ
ของบานหน้าต่างการอ่านจะซ่อนการ์ดนี้
"""

["2026-09-27-1640-storage-used"]
title = "พื้นที่ที่ใช้ไป"
text = """
ส่วนล่างของบานหน้าต่างโฟลเดอร์จะแสดงว่า
พื้นที่เก็บอีเมลของบัญชีเต็มแค่ไหน เช่น “ใช้ไป 34% จาก 15 GB”
เมื่อเซิร์ฟเวอร์อีเมลแจ้งข้อมูลนี้
"""

["2026-09-27-1651-desktop-search"]
title = "ค้นหาอีเมลจาก KRunner และการค้นหาของ GNOME"
text = """
พิมพ์ชื่อใน KRunner (Alt+Space) หรือในการค้นหาของ Activities
เพื่อเขียนถึงคนนั้น คัดลอกที่อยู่ หรือค้นหาอีเมลของเขา
ข้อความจะแสดงขึ้นเมื่อหัวเรื่องหรือผู้ส่งมีทุกคำที่คุณพิมพ์
ขึ้นต้นด้วย mail: เพื่อค้นหาในอีเมลทั้งหมดของคุณ
เหมือนในช่องค้นหาของ Katna Mail
"""

["2026-09-27-1727-mail-templates"]
title = "เทมเพลตสำหรับอีเมลที่คุณเขียนบ่อย"
text = """
เขียนข้อความครั้งเดียว แล้วบันทึกด้วยปุ่ม “เทมเพลต” ใหม่ในหน้าต่างเขียน
จากนั้นใส่ลงในอีเมลใหม่หรือการตอบกลับใดก็ได้ในคลิกเดียว
เขียน {first name} {name} หรือ {my name}
แล้ว Katna จะเติมให้สำหรับผู้รับแต่ละคน
แก้ไข เปลี่ยนชื่อ หรือลบเทมเพลตได้ใน การตั้งค่า > การเขียน
"""

["2026-09-27-1724-server-send-later"]
title = "อีเมลที่กำหนดเวลาไว้ส่งออกได้แม้ปิดคอมพิวเตอร์"
text = """
เมื่อเซิร์ฟเวอร์อีเมลของคุณเก็บอีเมลไว้จนถึงเวลาที่กำหนดได้ อย่างที่ Stalwart ทำได้
กำหนดเวลาส่งจะมอบข้อความให้เซิร์ฟเวอร์ทันทีที่ปุ่มเลิกทำหายไป
ข้อความจึงออกตรงเวลา แม้คอมพิวเตอร์เครื่องนี้ปิดอยู่ก็ตาม
เมนูกำหนดเวลาจะบอกว่าเซิร์ฟเวอร์อีเมลของคุณหรือ Katna จะเป็นผู้ส่ง
"""

["2026-09-27-1730-softer-row-hover"]
title = "ไฮไลต์ตอนชี้ที่ดูเบาขึ้น"
text = """
บรรทัดที่อยู่ใต้ตัวชี้ในรายการอีเมล ตอนนี้จะยกขึ้นพร้อมเงาจางๆ เหมือนใน Gmail
แทนแถบสีเข้มด้านล่าง
"""

["2026-09-27-1745-drag-recipients"]
title = "ลากที่อยู่ระหว่างถึง สำเนา และสำเนาลับ"
text = """
ลากชิปที่อยู่ไปยังช่องอื่นเพื่อย้าย ช่องสำเนาและสำเนาลับจะเปิดขึ้นขณะลาก
แม้จะซ่อนอยู่ก็ตาม และเมื่อชี้ที่ชิปจะมี x สำหรับนำออก
"""

["2026-09-27-1722-katna-account"]
title = "บัญชี Katna"
text = """
การตั้งค่า > การสมัครสมาชิก ให้คุณสร้างบัญชีบนเซิร์ฟเวอร์ของ Katna เอง
ซึ่งมีรหัสผ่านของตัวเอง ไม่ใช่รหัสผ่านอีเมลเด็ดขาด
ฟีเจอร์ออนไลน์ของ Katna เช่น ใบตอบรับการอ่าน และการติดตามลิงก์
จะต้องใช้บัญชีนี้ คุณดูคอมพิวเตอร์ที่ลงชื่อเข้าใช้อยู่
และนำเครื่องใดก็ได้ออกจากระบบ
"""

["2026-09-27-1805-reopens-as-you-left-it"]
title = "กลับมาที่เดิม"
text = """
การปิด Katna Mail แล้วเปิดใหม่ จะนำแอป โฟลเดอร์
และแท็บกล่องจดหมายที่คุณเปิดไว้กลับมา รวมถึงโฟลเดอร์ที่คุณขยายไว้
และสถานะว่าบานหน้าต่างโฟลเดอร์ถูกพับไว้หรือไม่
การออกจาก Katna จากถาดระบบจะเริ่มใหม่ทั้งหมด
"""

["2026-09-27-1724-snooze-and-reminders"]
title = "เลื่อนเวลาและการเตือนเมื่อไม่มีการตอบกลับ"
text = """
เลื่อนเวลาการสนทนาได้ด้วยนาฬิกาบนแถวของการสนทนา หรือจากเมนูคลิกขวา
การสนทนาจะรออยู่ในโฟลเดอร์ “เลื่อนเวลาแล้ว” แล้วกลับมาที่กล่องจดหมาย
ในสถานะยังไม่ได้อ่าน ตามเวลาที่คุณเลือก เมื่อส่งจดหมาย
ลูกศรข้างปุ่มส่งช่วยเตือนคุณได้ หากไม่มีใครตอบกลับภายใน 1, 3 หรือ 7 วัน
ทั้งสองอย่างทำงานขณะที่คอมพิวเตอร์เปิดอยู่
และจะทำส่วนที่ค้างไว้ให้ทันหลังเครื่องตื่นจากโหมดพัก
"""

["2026-09-27-1717-translate-mail"]
title = "อ่านอีเมลเป็นภาษาของคุณ"
text = """
ข้อความภาษาอื่นจะมีปุ่มแปลอยู่ด้านบน
และ แสดงต้นฉบับ จะนำข้อความเดิมกลับมา
Katna ตรวจหาภาษาบนคอมพิวเตอร์ของคุณเอง
เนื้อหาของข้อความจะส่งไปยังเซิร์ฟเวอร์ของ Katna เพื่อแปล
เฉพาะเมื่อคุณขอเท่านั้น
การตั้งค่า > ทั่วไป > การแปล ใช้เลือกภาษาของคุณ
และภาษาที่จะแปลเสมอ
"""

["2026-09-27-1744-open-and-click-tracking"]
title = "ดูได้ว่าอีเมลถูกเปิดเมื่อไร"
text = """
เปิดรูปดวงตาข้างผู้รับ
เพื่อดูว่าผู้รับแต่ละคนเปิดข้อความหรือคลิกลิงก์ในข้อความเมื่อไร
หรือจะขอใบตอบรับการอ่านแทนก็ได้
อีเมลที่ส่งแล้วจะแสดงว่าใครเปิดบ้าง และการแจ้งเตือนจะบอกคุณในครั้งแรก
ทั้งสองอย่างปิดอยู่สำหรับข้อความใหม่ทุกฉบับ
และการติดตามต้องใช้บัญชี Katna (การตั้งค่า > การสมัครสมาชิก)
"""

["2026-09-27-2042-activity"]
title = "กิจกรรมของอีเมลที่ติดตาม"
text = """
กิจกรรม ข้างช่องค้นหา แสดงว่าข้อความที่ติดตามถูกเปิดไปกี่ฉบับ
และลิงก์ถูกคลิกบ่อยแค่ไหน
พร้อมจัดอันดับหัวเรื่องของคุณตามความถี่ที่ถูกเปิด
"""

["2026-09-27-2204-search-trigger-words"]
title = "ค้นหาอีเมลจาก KRunner ด้วย k"
text = """
พิมพ์ k หรือ m เว้นวรรค แล้วตามด้วยสิ่งที่ต้องการหา ใน KRunner
หรือการค้นหาของ GNOME เพื่อให้ได้ผลลัพธ์เดียวกับช่องค้นหาของ Katna Mail
เช่น “k budget” เลือกคำของคุณเองได้ที่ การตั้งค่า > ทั่วไป
"""

["2026-09-27-2224-activity-button"]
title = "กิจกรรม ข้างช่องค้นหา"
text = """
ปุ่ม กิจกรรม ข้างช่องค้นหา นับการเปิดและการคลิกใหม่ของอีเมลที่ติดตาม
และแสดงว่าใครเปิดอะไร และคลิกลิงก์ไหนบ้าง คลิกรายการเพื่อเปิดข้อความนั้น
รายละเอียด แสดงอัตราการเปิดและอัตราการคลิก การเปิดรายวัน
และหัวเรื่องที่ดีที่สุดของคุณ ในช่วง 7 หรือ 30 วันที่ผ่านมา ทั้งหมด
หรือวันที่ที่คุณเลือก ตอนนี้ข้อความที่ส่งแล้วยังแสดงด้วยว่า
แต่ละคนเปิดและคลิกลิงก์ไปกี่ครั้ง
"""

["2026-09-27-2239-mailbox-insights"]
title = "ข้อมูลเชิงลึกของกล่องจดหมาย"
text = """
ตอนนี้ กิจกรรม > รายละเอียด ยังแสดงด้วยว่าในช่วงนั้นคุณส่งและได้รับอีเมลไปเท่าไร
คุณและคนอื่นตอบกลับบ่อยและเร็วแค่ไหน คนที่คุณติดต่อบ่อยที่สุด
และอีเมลของคุณเข้ามาในวันและเวลาใด
ทั้งหมดนับในคอมพิวเตอร์ของคุณจากอีเมลที่ Katna มีอยู่แล้ว
"""

["2026-09-28-0059-sign-in-with-google"]
title = "ลงชื่อเข้าใช้ด้วย Google หรือ Microsoft"
text = """
เพิ่มบัญชี Gmail หรือ Outlook ได้โดยลงชื่อเข้าใช้ในหน้าของ Google
หรือ Microsoft เองในเบราว์เซอร์ของคุณ โดยไม่ต้องใช้รหัสผ่านสำหรับแอป
ที่อยู่ Outlook.com และ Hotmail ก็ใช้ได้แล้วเช่นกัน
หากการลงชื่อเข้าใช้หยุดทำงาน
ข้อความที่ด้านล่างของหน้าต่างจะเสนอให้ลงชื่อเข้าใช้อีกครั้ง
"""

["2026-09-28-0054-tracking-on-by-default"]
title = "เปิดการติดตามและใบตอบรับไว้ตั้งแต่แรก"
text = """
ข้อความใหม่และการตอบกลับจะเริ่มต้นโดยเปิดการติดตามการเปิดและการคลิก
ใบตอบรับการอ่าน และใบตอบรับการส่งถึงไว้แล้ว
คลิกปุ่มข้างผู้รับเพื่อปิดรายการใดรายการหนึ่งสำหรับข้อความนั้น
การติดตามต้องลงชื่อเข้าใช้บัญชี Katna ของคุณ
ใบตอบรับการส่งถึงคืออีเมลที่เซิร์ฟเวอร์อีเมลของคุณส่งถึงคุณ
เมื่อเซิร์ฟเวอร์ของผู้รับแต่ละคนรับข้อความไว้
ปุ่มจะเป็นสีเทาหากเซิร์ฟเวอร์อีเมลของคุณไม่มีบริการนี้
"""

["2026-09-28-0120-delivered-read-ticks"]
title = "เครื่องหมายถูกสำหรับส่งถึงและอ่านแล้ว"
text = """
อีเมลที่คุณส่งจะแสดงเครื่องหมายถูกข้างผู้รับแต่ละคน
เครื่องหมายถูกสีเทาหนึ่งอันหมายความว่าเซิร์ฟเวอร์อีเมลของผู้รับรับไว้แล้ว
โดยดูจากใบตอบรับการส่งถึง
หรือหากบริการอีเมลของคุณไม่ส่งใบตอบรับ (Gmail)
ก็ดูจากการที่ไม่มีอีเมลตีกลับภายในครึ่งชั่วโมง
เครื่องหมายถูกสองอันในสีเน้นของคุณหมายความว่าผู้รับอ่านแล้ว
โดยดูจากใบตอบรับการอ่านหรือการติดตามการเปิด
และคำเตือนหมายความว่าอีเมลถูกตีกลับ
ชี้ที่เครื่องหมายถูกเพื่อดูว่าเมื่อไรและอย่างไร
อีเมลใบตอบรับจะอยู่ในกล่องจดหมายของคุณใต้ “อัปเดต”
โดยไม่มีการแจ้งเตือน
"""

["2026-09-28-0143-gmail-new-mail-notifications"]
title = "การแจ้งเตือนสำหรับอีเมลใหม่ใน Gmail"
text = """
อีเมลใหม่ในกล่องจดหมาย Gmail จะแสดงการแจ้งเตือนอีกครั้งแล้ว
ก่อนหน้านี้ Katna พลาดอีเมลที่ Gmail จัดเก็บไว้ใน “จดหมายทั้งหมด”
ก่อนเข้ากล่องจดหมายเพียงครู่เดียว
"""

["2026-09-28-0156-attachment-types"]
title = "ค้นหาตามประเภทไฟล์แนบ"
text = """
ใน ตัวเลือกการค้นหา “มีไฟล์แนบ” ตอนนี้มี PDF, XLSX, ODF, XLS, ODS, PPT
และ PPTX รวมถึง “กำหนดเอง” สำหรับนามสกุลไฟล์อื่นใด เช่น png หรือ avif
โดยจะแสดงเฉพาะอีเมล ที่มีไฟล์แนบประเภทที่เลือกเท่านั้น
"""

["2026-09-28-0106-original-colors"]
title = "สีดั้งเดิมในธีมมืด"
text = """
ในธีมมืด อีเมลที่กำหนดสีของตัวเองจะแสดงด้วยสีเข้ม
ปุ่มครึ่งวงกลมปุ่มใหม่บนแถบเครื่องมือของบานหน้าต่างการอ่าน
จะแสดงอีเมลด้วยสีดั้งเดิมของผู้ส่ง และสลับกลับได้
"""

["2026-09-28-0127-print-as-shown"]
title = "การพิมพ์คงรูปแบบไว้"
text = """
อีเมลจะพิมพ์ออกมาเหมือนที่เห็นในบานหน้าต่างการอ่าน
พร้อมตาราง สี เส้นขอบ รายการ และรูปภาพ
ตัวอย่างก่อนพิมพ์สามารถไม่พิมพ์สีพื้นหลังเพื่อประหยัดหมึก
หรือพิมพ์เฉพาะข้อความด้วย ข้อความเท่านั้น
"""

["2026-09-28-0141-ask-before-deleting"]
title = "ถามก่อนลบ"
text = """
การลบการสนทนาหลายรายการพร้อมกันจะถามก่อนว่าจะย้ายไปที่ถังขยะหรือไม่
ทำเครื่องหมาย “ไม่ต้องถามอีก” เพื่อข้ามคำถามนี้
หรือเปิดกลับมาได้ใน การตั้งค่า > ทั่วไป
