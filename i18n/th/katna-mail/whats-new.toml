สิ่งที่อยู่ข้างในจะเลื่อนเปิดหรือปิดอย่างนุ่มนวล โดยโฟลเดอร์ด้านล่างเลื่อนตามไปด้วย
ไม่กระโดดอีกต่อไป
"""

["2026-09-29-0301-keys-menus-dialogs"]
title = "ใช้แป้นพิมพ์กับโฟลเดอร์ เมนู และกล่องโต้ตอบ"
text = """
กด Shift+Tab หรือ F6 เพื่อไปที่บานหน้าต่างโฟลเดอร์ ซึ่ง ↑ และ ↓ จะเปิดแต่ละโฟลเดอร์ และ Enter
จะไปยังอีเมลในโฟลเดอร์นั้น ในเมนูทุกแบบ ↑ และ ↓ ใช้เลื่อน และ Enter ใช้เลือก กด Shift+F10
หรือปุ่มเมนูเพื่อเปิดเมนูคลิกขวาของอีเมลที่เลือกอยู่ กล่องโต้ตอบรับปุ่มทันทีเมื่อเปิด: Enter
ใช้ตอบรับ Esc ใช้ยกเลิก และ Tab จะวนอยู่ภายในกล่อง ในข้อความใหม่ กด Ctrl+Enter
เพื่อส่งจากช่องใดก็ได้ และกด Esc เพื่อปิดโดยเก็บเป็นฉบับร่างไว้
"""

["2026-09-29-0309-clock-tasks"]
title = "งานบนนาฬิกาของเดสก์ท็อป"
