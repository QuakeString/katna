หัวเรื่อง และกล่องจดหมายของคุณจะเปลี่ยนตามทั้งหมด รายงานจะบอกว่าแสดงบัญชีใด
และจดจำตัวเลือกของคุณ
"""

["2026-09-28-2002-reader-arrows-always-shown"]
title = "ปุ่มใหม่กว่าและเก่ากว่าอยู่บนแถบเครื่องมือเสมอ"
text = """
