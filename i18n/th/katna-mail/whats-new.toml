ตอนนี้จะย้ายจดหมายจริง พร้อม “เลิกทำ” แม้จากผลการค้นหา
ในโฟลเดอร์ “สแปม” “รายงานสแปม” จะกลายเป็น “ไม่ใช่สแปม”
“ถังขยะ” มี “ย้ายไปที่กล่องจดหมาย” และ “ลบอย่างถาวร”
“เก็บถาวร” มี “ย้ายไปที่กล่องจดหมาย” ส่วน “ฉบับร่าง” และ
“ส่งแล้ว” จะไม่แสดงรายการ ที่ใช้ไม่ได้ในโฟลเดอร์นั้น
"""

