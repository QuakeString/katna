โดยแสดงเพียงครั้งเดียวแม้หลายบัญชีจะเก็บไว้ พร้อมป้ายกำกับ รูปภาพ และรายละเอียด
ชื่อและรูปภาพของพวกเขายังแสดงในอีเมลและในคำแนะนำที่อยู่ด้วย
"""

["2026-09-29-0350-katna-notes"]
title = "Katna โน้ต"
text = """
การเลือกโน้ตที่แถบด้านซ้ายจะเปิด Katna โน้ต ซึ่งจัดวางเหมือน Google Keep จดโน้ตหรือรายการตรวจสอบ ใส่สี ปักหมุดไว้ด้านบน และติ๊กรายการบนกระดานได้ทันที
โน้ตจะบันทึกขณะที่พิมพ์ ค้นหาได้จากช่องค้นหา ส่วนเก็บถาวรและถังขยะช่วยเก็บโน้ตให้พ้นทาง พร้อมเลิกทำได้
"""

["2026-09-29-0412-notes-sync"]
title = "โน้ตบนทุกอุปกรณ์"
text = """
ตอนนี้โน้ตจะอยู่ในโฟลเดอร์โน้ตของบัญชีอีเมล ซึ่งเป็นที่เดียวกับที่โน้ตของ iPhone และ Mac เก็บไว้ จึงตามไปยังอุปกรณ์อื่นของคุณและกลับมาจากที่นั่นด้วย
ชื่อบัญชีใต้โน้ตบอกว่าเก็บไว้ที่ไหน คลิกเพื่อย้ายโน้ต หรือเก็บไว้ในคอมพิวเตอร์เครื่องนี้เท่านั้น
"""

["2026-09-29-0451-add-mail-to-tasks"]
title = "เพิ่มอีเมลลงในงาน"
text = """
กด Shift+T เหมือนใน Gmail หรือคลิกขวาที่อีเมลแล้วเลือกเพิ่มในงาน
งานจะใช้หัวเรื่องของอีเมล และชิปอีเมลในงานจะเปิดอีเมลนั้นอีกครั้ง
"""

["2026-09-29-0412-calendar"]
title = "ปฏิทินของคุณ อยู่ข้างอีเมล"
text = """
ปฏิทินแสดงปฏิทิน Google, Microsoft และปฏิทินอื่นๆ ของคุณเป็นวัน สัปดาห์ เดือน หรือเป็นกำหนดการ พร้อมแป้นลัดแบบเดียวกับ Google ปฏิทิน
ปุ่มปฏิทินทางด้านขวาของอีเมลจะเปิดกำหนดการของวัน โดยมีปุ่มเข้าร่วมสำหรับการโทร
ลงชื่อเข้าใช้บัญชีอีกครั้งเพื่อให้ Katna อ่านปฏิทินของบัญชีนั้นได้
"""

["2026-09-29-0442-contacts-edit"]
title = "สร้างและแก้ไขรายชื่อติดต่อ"
text = """
