ตัวนับและลูกศรใหม่กว่า/เก่ากว่าจะยังอยู่ทางขวาของแถบเครื่องมือ
ส่วนปุ่มที่ใช้น้อยที่สุดจะย้ายเข้าไปอยู่ในเมนูเพิ่มเติมทีละปุ่มแทน
รวมถึงสวิตช์รายละเอียดผู้ติดต่อและสีดั้งเดิมด้วย
"""

["2026-09-28-2026-large-files-drive"]
title = "ส่งไฟล์ขนาดเท่าใดก็ได้"
text = """
สำหรับบัญชีที่ลงชื่อเข้าใช้ด้วย Google ไฟล์ที่เกินขีดจำกัดอีเมล 25 MB จะถูกส่งไปที่
Google Drive ของคุณทันทีที่แนบ และข้อความจะมีลิงก์ของไฟล์ เหมือนใน Gmail
ไฟล์จะถูกแชร์ให้ผู้รับเมื่อคุณกดส่ง Katna
จะถามก็ต่อเมื่อไม่สามารถให้สิทธิ์เข้าถึงแก่ใครบางคนได้เท่านั้น
"""

["2026-09-28-2059-recipient-list-scrolling"]
title = "รายชื่อผู้รับที่ยาวเลื่อนได้ลื่นขึ้น"
text = """
รายชื่อผู้รับที่ยาวตอนนี้มีแถบเลื่อนของตัวเองและเลื่อนทีละบรรทัด
การสนทนาจะเลื่อนต่อก็ต่อเมื่อรายชื่อเลื่อนถึงจุดสิ้นสุดแล้วเท่านั้น
การเพิ่มผู้รับจะไม่ทำให้ปุ่มด้านล่างกระโดดอีกต่อไป
"""

["2026-09-28-2106-check-for-new-mail"]
title = "ตรวจสอบอีเมลใหม่"
text = """
คลิกขวาที่โฟลเดอร์หรือบัญชีในบานหน้าต่างโฟลเดอร์ เพื่อเลือก “ตรวจสอบอีเมลใหม่”
“ทำเครื่องหมายทั้งหมดว่าอ่านแล้ว” สร้างโฟลเดอร์ใหม่ข้างใน หรือ “ล้างถังขยะ” ปุ่ม
“รีเฟรช” เหนือรายการตอนนี้ดึงข้อมูลจากเซิร์ฟเวอร์ด้วย ขณะที่ Katna กำลังตรวจสอบ ลูกศรบน
“รีเฟรช” และข้างกล่องจดหมายจะหมุน และจะมี “กำลังตรวจสอบอีเมลใหม่…”
แสดงที่ด้านบนเมื่อใช้เวลานานกว่าปกติ
"""

["2026-09-28-2101-large-files-onedrive"]
title = "ส่งไฟล์ขนาดใหญ่ผ่าน OneDrive"
text = """
บัญชี Outlook.com, Hotmail และบัญชี Microsoft อื่น ๆ
ส่งไฟล์ที่เกินขีดจำกัดอีเมลได้แล้วเหมือนบัญชี Google คือไฟล์จะถูกส่งไปที่ OneDrive
ของคุณทันทีที่แนบ และข้อความจะมีลิงก์ของไฟล์ เหมือนใน Outlook
"""

["2026-09-28-2108-activity-checking"]
title = "ไม่มีหน้าลงชื่อเข้าใช้แวบขึ้นมาใน กิจกรรม อีกต่อไป"
text = """
หลังจาก Katna เริ่มทำงาน กิจกรรม จะแสดงแถบโหลดบาง ๆ ระหว่างตรวจสอบบัญชี Katna ของคุณ
แทนที่จะขอให้ลงชื่อเข้าใช้ชั่วขณะ นอกจากนี้ Katna ยังตรวจสอบบัญชีทันทีที่เริ่มทำงาน
จึงรอน้อยลง
"""

["2026-09-28-2130-update-dialog"]
title = "การอัปเดตมีหน้าต่างเป็นของตัวเอง"
text = """
ความช่วยเหลือ > ตรวจสอบการอัปเดต จะเปิดหน้าต่างของตัวเอง โดยแสดงเวอร์ชันของคุณ
เทียบกับเวอร์ชันใหม่ พร้อมเวลาที่สร้างและขนาดดาวน์โหลดของแต่ละเวอร์ชัน
สิ่งใหม่ในการอัปเดต และทุกการเปลี่ยนแปลงนับจากเวอร์ชันของคุณ
"""

["2026-09-28-2204-faster-start"]
title = "เริ่มทำงานเร็วขึ้น ซิงก์ราบรื่นขึ้น"
text = """
Katna Mail เปิดกล่องจดหมายขนาดใหญ่ได้เร็วขึ้นราวหนึ่งในสี่ และระหว่างดาวน์โหลดอีเมล
จะอัปเดตรายการทีละชุดแทนที่จะอัปเดตทุก ๆ ไม่กี่ฉบับ
การเลื่อนและการพิมพ์จึงยังราบรื่นระหว่างซิงก์
"""

["2026-09-28-2111-link-addresses"]
title = "ดูว่าลิงก์พาไปที่ไหน"
text = """
วางตัวชี้บนลิงก์ในข้อความ ที่อยู่ที่ลิงก์เปิดจริงจะแสดงที่ด้านล่างของบานหน้าต่างการอ่าน
โดยเน้นชื่อเว็บไซต์ให้เด่นชัด ไม่ว่าข้อความของลิงก์จะเขียนว่าอะไร รูปภาพจากผู้ส่งที่คุณตั้งให้แสดงรูปภาพเสมอ
จะโหลดก็ต่อเมื่อผู้ให้บริการอีเมลของคุณยืนยันว่าข้อความนั้นมาจากผู้ส่งรายนั้นจริง
"""

["2026-09-29-0120-update-build-details"]
title = "รายละเอียดเพิ่มเติมของบิลด์"
text = """
หน้าต่างการอัปเดตตอนนี้ระบุการเปลี่ยนแปลงล่าสุดของแต่ละเวอร์ชัน บอกว่าสำเนาของคุณมาจากไหน
และ Katna ตรวจสอบการอัปเดตครั้งล่าสุดเมื่อใด
"""

["2026-09-29-0213-coffee-button-play"]
title = "ละครสั้นในปุ่ม เลี้ยงกาแฟฉันสักแก้ว"
text = """
วางตัวชี้ไว้บนปุ่ม เลี้ยงกาแฟฉันสักแก้ว ในหน้าเกี่ยวกับ Katna แล้วมันจะขอกาแฟ ชา พิซซ่า
จนถึงไม่ขออะไรเลย แล้วยอมรับแค่น้ำเปล่า ก่อนกล่าวขอบคุณพร้อมประกายระยิบระยับ
เล่นเพียงครั้งเดียวในแต่ละรอบ และจะนิ่งอยู่เมื่อเปิดใช้การลดการเคลื่อนไหว
"""

["2026-09-29-0215-update-checking-bar"]
title = "หน้าต่างการอัปเดตที่ชัดเจนขึ้น"
text = """
ขณะที่ Katna ตรวจหาการอัปเดต จะมีแถบเคลื่อนไหวแสดงให้เห็น
และเวอร์ชันใหม่จะเด่นขึ้นด้วยสีของตัวเองข้างเวอร์ชันที่คุณใช้อยู่
"""

["2026-09-29-0231-keys-beside-the-list"]
title = "ปุ่มลัดที่ทำงานตามบานหน้าต่างที่คุณอยู่"
text = """
เมื่อแสดงการสนทนาไว้ข้างรายการ ปุ่ม ↑ และ ↓ จะเลื่อนในรายการและแสดงแต่ละการสนทนา กด Tab หรือ Enter
เพื่อเข้าไปในการสนทนา ซึ่ง ↑ และ ↓ จะเลื่อนดูเนื้อหา กด Esc หรือ Shift+Tab เพื่อกลับไปที่รายการ ส่วน
F6 ใช้สลับระหว่างบานหน้าต่างเหมือนแอปอีเมลอื่น ๆ
"""

["2026-09-29-0258-folders-slide-open"]
title = "โฟลเดอร์เลื่อนเปิดและปิดอย่างนุ่มนวล"
text = """
