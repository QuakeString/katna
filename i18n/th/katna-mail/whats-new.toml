text = """
คลิกขวาที่อีเมล หรือเปิดเมนู ⋮ ของอีเมล แล้วเลือกเพิ่มโน้ต โน้ตที่ใช้หัวข้อเป็นชื่อจะเปิดขึ้นเหนืออีเมล
โน้ตของอีเมลจะแสดงใต้หัวข้อทุกครั้งที่คุณเปิดอีเมลนั้นอีก และชิปอีเมลของโน้ตจะพาคุณกลับไปที่อีเมล
"""

["2026-09-29-0542-caldav-tasks"]
title = "งานบนเมลเซิร์ฟเวอร์ของคุณเอง"
text = """
บัญชีที่ลงชื่อเข้าใช้ด้วยรหัสผ่านจะเก็บงานไว้บนเมลเซิร์ฟเวอร์เมื่อเซิร์ฟเวอร์รองรับ CalDAV
งานจึงแสดงในแอปของเซิร์ฟเวอร์เองและบนโทรศัพท์ด้วย
"""

["2026-09-29-0521-calendar-edit"]
