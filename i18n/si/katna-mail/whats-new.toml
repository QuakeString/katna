title = "අරාබි, හීබෲ, පර්සියානු සහ උර්දු සඳහා Katna Mail කැඩපතක් මෙන් පෙරළේ"
text = """
අරාබි, හීබෲ, පර්සියානු සහ උර්දු භාෂාවලින් මුළු කවුළුවම හැරේ: යෙදුම් තීරුව සහ ෆෝල්ඩර දකුණු පසින්, මෙනු වමට විවෘත වේ, ඊතල සහ ඊතල යතුරු තිරය කියවෙන දිශාවට. ඉංග්‍රීසි නම්, ලිපින සහ කෙටිමං ඒවායේම අනුපිළිවෙල රඳවා ගන්නා අතර, පර්සියානු දින සූර්ය හිජ්රි දින දර්ශනයට අනුව ගණන් කෙරේ.
"""
