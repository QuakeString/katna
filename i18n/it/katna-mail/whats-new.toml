In fondo al riquadro delle cartelle ora compare quanto è pieno lo spazio
per la posta dell'account, ad esempio «34% di 15 GB in uso», quando il
server di posta lo comunica.
"""

["2026-09-27-1651-desktop-search"]
title = "Trova la posta da KRunner e dalla ricerca di GNOME"
text = """
Digita un nome in KRunner (Alt+Space) o nella ricerca di Attività per
scrivere a quella persona, copiarne l'indirizzo o trovarne la posta. I
messaggi compaiono quando l'oggetto o il mittente contiene ogni parola
digitata; inizia con mail: per cercare in tutta la posta, come nella
casella di ricerca di Katna Mail.
"""

["2026-09-27-1727-mail-templates"]
title = "Modelli per la posta che scrivi spesso"
text = """
Scrivi un messaggio una volta e salvalo con il nuovo pulsante Modelli
nella finestra di scrittura, poi inseriscilo in un nuovo messaggio o in
una risposta con un clic. Scrivi {first name}, {name} o {my name} e
Katna li compila per ogni destinatario. Modifica, rinomina o elimina i
modelli in Impostazioni > Scrittura.
"""

["2026-09-27-1724-server-send-later"]
title = "La posta programmata parte anche a computer spento"
text = """
Quando il tuo server di posta può trattenere la posta fino a un'ora
stabilita, come fa Stalwart, Programma invio ora gli consegna il messaggio
appena sparisce Annulla, così parte in orario anche con questo computer
spento. Il menu di programmazione dice se lo invierà il tuo server di
posta o Katna.
"""

["2026-09-27-1730-softer-row-hover"]
title = "Un passaggio del puntatore più leggero"
text = """
La riga sotto il puntatore nell'elenco della posta ora si solleva con
un'ombra leggera, come in Gmail, invece di una fascia scura sotto.
"""

["2026-09-27-1745-drag-recipients"]
title = "Trascina gli indirizzi tra A, Cc e Ccn"
text = """
Trascina il chip di un indirizzo in un altro campo per spostarlo; Cc e
Ccn si aprono mentre trascini, anche se nascosti. Puntando un chip compare
una x che lo rimuove.
"""

["2026-09-27-1722-katna-account"]
title = "Account Katna"
text = """
Impostazioni > Abbonamento ti permette di creare un account sul server di
Katna, con una password sua, mai quella della posta. Le funzioni online di
Katna, come le conferme di lettura e il tracciamento dei link, ne avranno
bisogno. Puoi vedere i computer connessi e disconnetterne uno qualsiasi.
"""

["2026-09-27-1805-reopens-as-you-left-it"]
title = "Di nuovo dove eri"
text = """
Chiudendo e riaprendo Katna Mail ritrovi l’app, la cartella e la scheda
della posta in arrivo che avevi aperto, le cartelle espanse e il riquadro
delle cartelle compresso o no. Se esci da Katna dall’area di notifica,
riparte da zero.
"""

["2026-09-27-1724-snooze-and-reminders"]
title = "Posticipa e promemoria di risposta"
text = """
Posticipa una conversazione con l'orologio sulla sua riga o dal menu del
clic destro: resta nella cartella Posticipati e torna in Posta in arrivo,
da leggere, all'ora che hai scelto. Quando invii, la freccia accanto a
Invia può ricordartelo se nessuno risponde entro 1, 3 o 7 giorni.
Entrambi funzionano mentre il computer è acceso e recuperano quando si
riattiva.
"""

["2026-09-27-1717-translate-mail"]
title = "Leggi le email nella tua lingua"
text = """
Sopra un messaggio in un’altra lingua ora c’è un pulsante Traduci, e
Mostra originale lo riporta com’era. Katna riconosce la lingua sul tuo
computer; il testo del messaggio va al server di Katna per la traduzione
solo quando lo chiedi. Impostazioni > Generali > Traduzione sceglie la tua
lingua e quelle da tradurre sempre.
"""

["2026-09-27-1744-open-and-click-tracking"]
title = "Scopri quando un’email viene aperta"
text = """
Attiva l’occhio accanto ai destinatari per vedere quando ognuno apre il
messaggio o segue un suo link, oppure chiedi una conferma di lettura.
Nella posta inviata vedi chi l’ha aperta, e una notifica te lo dice la
prima volta. Entrambi sono disattivati per ogni nuovo messaggio, e il
tracciamento richiede un account Katna (Impostazioni > Abbonamento).
"""

["2026-09-27-2042-activity"]
title = "Attività per le email tracciate"
text = """
Attività, accanto alla casella di ricerca, mostra quanti
dei tuoi messaggi tracciati sono stati aperti e quanto
spesso sono stati seguiti i loro link, con gli oggetti
ordinati in base a quanto spesso vengono aperti.
"""

["2026-09-27-2204-search-trigger-words"]
title = "Cerca nella posta da KRunner con k"
text = """
Digita k o m, uno spazio, poi ciò che vuoi trovare in KRunner o nella
ricerca di GNOME per ottenere gli stessi risultati della casella di
ricerca di Katna Mail, come «k budget». Scegli le tue parole in
Impostazioni, sotto Generali.
"""

["2026-09-27-2224-activity-button"]
title = "Attività accanto alla casella di ricerca"
text = """
Il pulsante Attività accanto alla casella di ricerca conta le nuove
aperture e i nuovi clic della posta tracciata e mostra chi ha aperto
cosa e quali link ha seguito; fai clic su una voce per aprire quel
messaggio. Dettagli mostra i tassi di apertura e di clic, le aperture
per giorno e i tuoi oggetti migliori degli ultimi 7 o 30 giorni, di
sempre o delle date che scegli. Un messaggio inviato ora mostra quante
volte ogni persona l’ha aperto e ha seguito un link.
"""

["2026-09-27-2239-mailbox-insights"]
title = "Statistiche della casella di posta"
text = """
Attività > Dettagli ora mostra anche quanta posta hai inviato e ricevuto
nel periodo, quanto spesso e quanto in fretta rispondi tu e rispondono
gli altri, le persone con cui scrivi di più e in quali giorni e a quali
ore arriva la tua posta. Il conteggio avviene sul tuo computer, a
partire dalla posta che Katna ha già.
"""

["2026-09-28-0059-sign-in-with-google"]
title = "Accedi con Google o Microsoft"
text = """
Aggiungi un account Gmail o Outlook accedendo dalla pagina di Google o di
Microsoft nel browser, senza password per le app. Ora funzionano anche gli
indirizzi Outlook.com e Hotmail. Se un accesso smette di funzionare, un
avviso in fondo alla finestra propone di accedere di nuovo.
"""

["2026-09-28-0054-tracking-on-by-default"]
title = "Tracciamento e conferme attivi fin dall’inizio"
text = """
I nuovi messaggi e le risposte ora partono con il tracciamento di aperture
e clic, la conferma di lettura e la conferma di consegna attivi; fai clic
su un pulsante accanto ai destinatari per disattivarne uno per quel
messaggio. Il tracciamento richiede l’accesso al tuo account Katna. Una
conferma di consegna è un’email che il tuo server di posta ti invia quando
il server di ogni destinatario accetta il messaggio; il pulsante appare in
grigio se il tuo server di posta non le offre.
"""

["2026-09-28-0120-delivered-read-ticks"]
title = "Spunte per consegnato e letto"
text = """
La posta che invii mostra ora delle spunte accanto a ogni destinatario.
Una spunta grigia significa che il suo server di posta l’ha presa: da una
conferma di consegna oppure, quando il tuo servizio di posta non ne invia
(Gmail), quando entro mezz’ora non è tornato alcun avviso di mancata
consegna. Due spunte nel tuo colore di risalto significano che l’ha letta,
da una conferma di lettura o dal tracciamento delle aperture, e un avviso
significa che è stata respinta. Punta una spunta per vedere quando e come.
Le email di conferma restano nella casella in
«Aggiornamenti», senza notifica.
"""

["2026-09-28-0143-gmail-new-mail-notifications"]
title = "Notifiche per la nuova posta Gmail"
text = """
La posta nuova in una casella Gmail mostra di nuovo una notifica. Prima
Katna perdeva i messaggi che Gmail archiviava in
«Tutti i messaggi» un attimo prima della posta in arrivo.
"""

["2026-09-28-0156-attachment-types"]
title = "Cerca per tipo di allegato"
text = """
In Opzioni di ricerca, «Con allegato» ora offre PDF, XLSX, ODF, XLS,
ODS, PPT e PPTX, e Personalizzato per qualsiasi altra estensione, come
png o avif. Compare solo la posta con un allegato di un tipo scelto.
"""

["2026-09-28-0106-original-colors"]
title = "Colori originali con un tema scuro"
text = """
Con un tema scuro, la posta che imposta i propri colori viene mostrata in
colori scuri. Il nuovo pulsante a mezzo cerchio nella barra degli strumenti
del riquadro di lettura la mostra nei colori originali del mittente, e
torna indietro.
"""

["2026-09-28-0127-print-as-shown"]
title = "La stampa mantiene la formattazione"
text = """
La posta si stampa come appare nel riquadro di lettura, con le sue tabelle,
i colori, i bordi, gli elenchi e le immagini. L’anteprima di stampa può
tralasciare i colori di sfondo per risparmiare inchiostro, oppure stampare
solo il testo con Testo semplice.
"""

["2026-09-28-0141-ask-before-deleting"]
title = "Chiedere prima di eliminare"
text = """
Eliminando più conversazioni in una volta, ora viene chiesto prima se
spostarle nel Cestino. Spunta «Non chiedere più» per saltare la domanda,
oppure riattivala in Impostazioni > Generali. L’eliminazione definitiva,
nel Cestino, chiede sempre.
"""

["2026-09-28-0019-katna-for-windows"]
title = "Katna per Windows"
text = """
Katna Mail ora funziona anche su Windows 10 e 11, installato dal suo Katna
Setup, con l'icona nell'area di notifica, le notifiche, l'avvio all'accesso
e i link email che si aprono in Katna.
"""

["2026-09-28-0236-chip-remove-always"]
title = "Pulsante di rimozione su ogni indirizzo"
text = """
Ogni indirizzo in A, Cc e Ccn ora mostra sempre la sua x, così puoi
rimuoverlo senza doverci prima puntare sopra.
"""

["2026-09-28-0244-pill-format-bar"]
title = "Una barra di formattazione più arrotondata"
text = """
La barra di formattazione della scrittura (Aa) ora ha la forma di una
pillola con un bordo tenue, così si stacca dal tuo testo sia nel tema chiaro
sia in quello scuro.
"""

["2026-09-28-0325-long-threads-smooth"]
title = "Le lunghe catene di email si aprono in fretta"
text = """
La posta formattata che cita molte risposte precedenti, come una lunga
catena di citazioni, ora si apre subito e scorre in modo fluido invece di
rallentare tutta la finestra.
"""

["2026-09-28-0830-who-has-seen-it"]
title = "Chi l'ha vista, dietro un occhio"
text = """
La posta inviata con il tracciamento non ha più un riquadro di righe sopra.
Un occhio accanto alla stella prende il tuo colore di risalto appena
qualcuno la apre; punta l'occhio per vedere chi l'ha aperta o ha seguito un
link, e quando.
"""

["2026-09-28-0831-contact-call-copy"]
title = "Chiama e copia dai dettagli del contatto"
text = """
Nei dettagli del contatto accanto a una conversazione, fai clic su un numero
di telefono per chiamarlo con l'app del telefono o KDE Connect, oppure usa
il pulsante di copia accanto. Ora puoi anche selezionare e copiare tutto il
testo del pannello.
"""

["2026-09-28-0848-quoted-text-hide-remove"]
title = "Nascondi o rimuovi l'email citata in una risposta"
text = """
Il pulsante "..." sotto una risposta ora nasconde di nuovo l'email citata
dopo che l'hai aperta. Punta il pulsante e fai clic sulla x nel suo angolo
per togliere l'email citata dalla risposta; Annulla o Ctrl+Z la rimette.
Inoltre la barra degli strumenti della risposta resta al suo posto mentre
scorri.
"""

["2026-09-28-0854-floating-folders"]
title = "Cartelle fluttuanti e una ricerca più ampia"
text = """
Con le cartelle nascoste, soffermarti su Scrivi o Posta le apre come un
pannello staccato dai bordi, con una piccola punta rivolta verso il
pulsante. La casella di ricerca si allarga fino a riempire lo spazio
lasciato dalle cartelle, e fare clic sulla cartella in cui sei già non fa
più lampeggiare l'elenco.
"""

["2026-09-28-0928-search-address-suggestions"]
title = "Suggerimenti di indirizzi in Opzioni di ricerca"
text = """
Da e A in Opzioni di ricerca ora suggeriscono indirizzi mentre digiti, come
fanno A, Cc e Ccn nella scrittura. Scegline uno con Invio, Tab o un clic.
"""

["2026-09-28-0935-app-menu-reply-all-window"]
title = "Menu principale nella scheda dell'account, Rispondi a tutti in una finestra sua"
text = """
La scheda dell'account ha un pulsante ☰ accanto a Gestisci gli account. Apre
gli stessi menu File, Modifica, Visualizza, Vai, Messaggio, Impostazioni e
Aiuto del menu globale del desktop, per i desktop che non ne mostrano uno.
Rispondi a tutti in una notifica di nuova email ora apre la conversazione in
una finestra tutta sua, pronta per scrivere, e lascia la finestra principale
dov'è.
"""

["2026-09-28-1011-tray-brings-window-forward"]
title = "I clic sull'area di notifica e sulle notifiche portano Katna Mail in primo piano"
text = """
Fare clic sull'icona nell'area di notifica, o su Apri Posta in arrivo, Nuovo
messaggio o Impostazioni nel suo menu, ora porta in primo piano la finestra
di Katna Mail su Wayland, anche se era ridotta a icona o dietro altre
finestre. Fare clic su una notifica di nuova posta apre quel messaggio,
anche quando l'elenco di Posta in arrivo non lo mostra.
"""

["2026-09-28-1053-send-countdown-reply-in-place"]
title = "Invia fa il conto alla rovescia, e la tua risposta resta nella conversazione"
text = """
Dopo Invia, un anello che si restringe fa il conto alla rovescia del tempo
per annullare accanto ad Annulla, poi l'avviso dice Messaggio inviato (con
un breve suono) quando la posta è partita. Il suono si può disattivare in
Impostazioni > Generali > Invio. Una risposta scritta in una conversazione
diventa un messaggio proprio dove l'hai scritta. La sua intestazione mostra
solo a chi va; fai clic per vedere Da, A, Cc e Ccn. La freccia accanto
all'icona di risposta passa tra Rispondi, Rispondi a tutti e Inoltra,
mantenendo quello che hai scritto.
"""

["2026-09-28-1110-search-options-narrow"]
title = "Le Opzioni di ricerca si adattano alle finestre strette"
text = """
In una finestra stretta o bassa, le Opzioni di ricerca ora si allargano allo
spazio disponibile, mettono le etichette sopra i campi su un telefono e
scorrono quando non ci stanno, così il pulsante Cerca è sempre a portata di
mano.
"""

["2026-09-28-1119-replies-from-right-account"]
title = "Le risposte partono dall'account giusto"
text = """
Con Rispondi o Inoltra su un messaggio aperto dalla Posta in arrivo
unificata o dalla ricerca, il messaggio ora parte dall'account a cui è
arrivata la posta, non da quello scelto sotto la tua immagine del profilo.
"""

["2026-09-28-1436-calmer-search-box"]
title = "La ricerca mostra la sua scorciatoia"
text = """
La casella di ricerca mostra la sua scorciatoia da tastiera accanto a
«Cerca nella posta», come impostato in Impostazioni > Scorciatoie. Quando
ci fai clic, mantiene il suo colore e mostra un bordo leggero invece di
scurirsi con un’ombra. Anche le cartelle che fluttuano sopra l’elenco ora
restano staccate dal bordo inferiore.
"""

["2026-09-28-1450-clear-activity"]
title = "Fai ordine in Attività"
text = """
Punta un’apertura o un clic in Attività e premi × per toglierlo
dall’elenco, oppure premi Cancella tutto per ricominciare da capo. Le nuove
aperture e i nuovi clic continuano a comparire, e il resoconto Dettagli
continua a contare tutto.
"""

["2026-09-28-1541-round-logo"]
title = "Il nuovo logo rotondo di Katna"
text = """
Katna ha un nuovo logo: una k corsiva su un cerchio verde acqua, nel menu
delle applicazioni, nella barra in alto e nella barra delle applicazioni.
L’area di notifica lo mostra in un colore adatto al tuo pannello, e
Informazioni su Katna e la pagina di benvenuto mostrano per esteso «katna
mail».
"""

["2026-09-28-1546-contact-cards"]
title = "Dettagli del contatto più ordinati"
text = """
I dettagli del contatto ora mostrano ogni parte nella propria scheda
morbida, con pulsanti rotondi sotto il nome per scrivere alla persona,
cercare la tua posta con lei o chiamarla. Conversazioni recenti mostra le
ultime; premi Altro per vedere il resto e Meno per richiuderle.
"""

["2026-09-28-1507-reply-box-recipients"]
title = "Una casella di risposta più ordinata"
text = """
I destinatari ora mostrano la loro immagine, e Cc e Ccn stanno insieme in
un unico piccolo pulsante. Aprire i destinatari di una risposta fa
crescere la casella verso l’alto in modo fluido, e il messaggio citato si
apre e si chiude in modo fluido sotto una linea ondulata su cui puoi fare
clic per richiuderlo di nuovo.
"""

["2026-09-28-1620-softer-window-shadow"]
title = "Un’ombra della finestra più morbida e pulsanti grandi come quelli di KDE"
text = """
Con la cornice della finestra di Katna, l’ombra intorno alla finestra è
più stretta e sfuma del tutto, senza il bordo netto che lasciava prima
accanto alla finestra. I pulsanti della finestra ora hanno la stessa
dimensione di quelli di KDE, e stanno alla stessa distanza dal lato della
finestra e dalla sua parte superiore.
"""

["2026-09-28-1622-update-from-the-app"]
title = "Aggiorna Katna dall’app"
text = """
Katna ora scarica da solo le nuove versioni e ti avvisa quando una è
pronta. Premi Aggiorna nella notifica o in Informazioni su Katna: Katna
Mail avvisa che si riavvierà, chiede la tua password, installa
l’aggiornamento e si apre di nuovo da dove avevi interrotto. Impostazioni >
Generali > Aggiornamenti disattiva lo scaricamento automatico.
"""

["2026-09-28-1520-track-sealed-and-plain"]
title = "Tracciamento per email firmate, crittografate e in testo semplice"
text = """
L’occhio ora funziona anche sulle email firmate e crittografate: la copia di
ogni destinatario viene firmata o crittografata singolarmente, così le firme
restano valide. Le email in testo semplice non possono mostrare le aperture,
ma i loro link vengono tracciati, così vedi quando qualcuno ne segue uno.
"""

["2026-09-28-1834-reply-after-closed-window"]
title = "Rispondi riparte da zero dopo la chiusura della finestra di un messaggio"
text = """
Chiudere un messaggio scritto nella sua finestra ora lo conserva in Bozze, e
Rispondi, Rispondi a tutti e Inoltra aprono di nuovo un messaggio nuovo
invece di riportare quello vecchio.
"""

["2026-09-28-1852-frosted-search-bar"]
title = "Una barra di ricerca satinata"
text = """
Con lo sfondo sfocato attivo, la barra di ricerca lascia passare la
sfocatura come la barra che la circonda, invece di poggiarci sopra come una
pillola grigia opaca.
"""

["2026-09-28-1906-scroll-to-switch-accounts"]
title = "Scorri sulla tua immagine per cambiare account"
text = """
Con il puntatore sull'immagine dell'account in alto a destra, gira la
rotellina del mouse per passare all'account successivo o precedente, un
account per scatto. L'immagine scorre fino al nuovo account, come il nome
dell'app scorre quando cambi app, e scegliere un account dalla scheda lo fa
scorrere allo stesso modo.
"""

["2026-09-28-1918-many-recipients"]
title = "Spazio per tanti destinatari"
text = """
I destinatari dopo la prima riga ora usano tutta la larghezza, e un lungo
elenco scorre entro poche righe, così il messaggio resta sempre a portata di
mano. Esci dal campo e si riduce a una riga, come "Kay, Sam, altri 19"; fai
clic per rivederli tutti.
"""

["2026-09-28-1952-activity-by-account"]
title = "Report attività per un account"
text = """
Il report attività ora ha un selettore di account accanto alle date.
Scegli Tutti gli account o uno di essi, e i messaggi tracciati, i tassi,
il grafico, gli oggetti e La tua casella di posta si adeguano. Il report
indica quale account mostra e ricorda la tua scelta.
"""

["2026-09-28-2002-reader-arrows-always-shown"]
title = "Più recente e Meno recente sempre nella barra"
text = """
Per quanto sia stretto il riquadro di lettura, il contatore e le frecce
Più recente e Meno recente restano a destra della sua barra degli
strumenti. I pulsanti che usi meno passano invece uno a uno nel menu
Altro, compresi gli interruttori dei dettagli del contatto e dei colori
originali.
"""

["2026-09-28-2026-large-files-drive"]
title = "Invia file di qualsiasi dimensione"
text = """
Con un account che ha effettuato l’accesso con Google, un file oltre il
limite di 25 MB della posta va nel tuo Google Drive appena lo alleghi, e
il messaggio contiene il suo link, come in Gmail. Viene condiviso con i
destinatari quando premi Invia; Katna chiede solo se a qualcuno non si può
dare l’accesso.
"""

["2026-09-28-2059-recipient-list-scrolling"]
title = "Elenchi di destinatari lunghi più scorrevoli"
text = """
Un lungo elenco di destinatari ha ora una barra di scorrimento propria e
avanza una riga alla volta; la conversazione scorre solo quando l’elenco
è arrivato in fondo. Aggiungere destinatari non fa più saltare i
pulsanti sotto.
"""

["2026-09-28-2106-check-for-new-mail"]
title = "Controlla nuova posta"
text = """
Fai clic con il pulsante destro su una cartella o un account nel
pannello delle cartelle per scegliere «Controlla nuova posta», «Segna
tutti come già letti», una nuova cartella al suo interno o «Svuota il
Cestino». «Aggiorna», sopra l’elenco, ora interroga anche il server.
Mentre Katna controlla, le frecce girano su «Aggiorna» e accanto a Posta
in arrivo, e «Controllo della nuova posta…» compare in alto se ci vuole
più di un momento.
"""

["2026-09-28-2101-large-files-onedrive"]
title = "File grandi con OneDrive"
text = """
Outlook.com, Hotmail e gli altri account Microsoft ora inviano i file
oltre il limite della posta come gli account Google: il file va nel tuo
OneDrive appena lo alleghi, e il messaggio contiene il suo link, come in
Outlook.
"""

["2026-09-28-2108-activity-checking"]
title = "Niente più lampo di «Accedi» in Attività"
text = """
Subito dopo l’avvio di Katna, Attività mostra una sottile barra di
caricamento mentre controlla il tuo account Katna, invece di chiederti
per un attimo di accedere. Katna controlla l’account anche appena si
avvia, quindi l’attesa è più breve.
"""

["2026-09-28-2130-update-dialog"]
title = "Gli aggiornamenti hanno una finestra tutta loro"
text = """
Aiuto > Controlla aggiornamenti apre una finestra dedicata. Mostra la
