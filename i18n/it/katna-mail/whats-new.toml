In fondo al riquadro delle cartelle ora compare quanto è pieno lo spazio
per la posta dell'account, ad esempio «34% di 15 GB in uso», quando il
server di posta lo comunica.
"""

["2026-09-27-1651-desktop-search"]
title = "Trova la posta da KRunner e dalla ricerca di GNOME"
text = """
Digita un nome in KRunner (Alt+Space) o nella ricerca di Attività per
scrivere a quella persona, copiarne l'indirizzo o trovarne la posta. I
messaggi compaiono quando l'oggetto o il mittente contiene ogni parola
digitata; inizia con mail: per cercare in tutta la posta, come nella
casella di ricerca di Katna Mail.
"""

["2026-09-27-1727-mail-templates"]
title = "Modelli per la posta che scrivi spesso"
text = """
Scrivi un messaggio una volta e salvalo con il nuovo pulsante Modelli
nella finestra di scrittura, poi inseriscilo in un nuovo messaggio o in
una risposta con un clic. Scrivi {first name}, {name} o {my name} e
Katna li compila per ogni destinatario. Modifica, rinomina o elimina i
modelli in Impostazioni > Scrittura.
"""

["2026-09-27-1724-server-send-later"]
title = "La posta programmata parte anche a computer spento"
text = """
Quando il tuo server di posta può trattenere la posta fino a un'ora
stabilita, come fa Stalwart, Programma invio ora gli consegna il messaggio
appena sparisce Annulla, così parte in orario anche con questo computer
spento. Il menu di programmazione dice se lo invierà il tuo server di
posta o Katna.
"""

["2026-09-27-1730-softer-row-hover"]
title = "Un passaggio del puntatore più leggero"
text = """
La riga sotto il puntatore nell'elenco della posta ora si solleva con
un'ombra leggera, come in Gmail, invece di una fascia scura sotto.
"""

["2026-09-27-1745-drag-recipients"]
title = "Trascina gli indirizzi tra A, Cc e Ccn"
text = """
Trascina il chip di un indirizzo in un altro campo per spostarlo; Cc e
Ccn si aprono mentre trascini, anche se nascosti. Puntando un chip compare
una x che lo rimuove.
"""

["2026-09-27-1722-katna-account"]
title = "Account Katna"
text = """
Impostazioni > Abbonamento ti permette di creare un account sul server di
Katna, con una password sua, mai quella della posta. Le funzioni online di
Katna, come le conferme di lettura e il tracciamento dei link, ne avranno
bisogno. Puoi vedere i computer connessi e disconnetterne uno qualsiasi.
"""

["2026-09-27-1805-reopens-as-you-left-it"]
title = "Di nuovo dove eri"
text = """
Chiudendo e riaprendo Katna Mail ritrovi l’app, la cartella e la scheda
della posta in arrivo che avevi aperto, le cartelle espanse e il riquadro
delle cartelle compresso o no. Se esci da Katna dall’area di notifica,
riparte da zero.
"""

["2026-09-27-1724-snooze-and-reminders"]
title = "Posticipa e promemoria di risposta"
text = """
Posticipa una conversazione con l'orologio sulla sua riga o dal menu del
clic destro: resta nella cartella Posticipati e torna in Posta in arrivo,
da leggere, all'ora che hai scelto. Quando invii, la freccia accanto a
Invia può ricordartelo se nessuno risponde entro 1, 3 o 7 giorni.
Entrambi funzionano mentre il computer è acceso e recuperano quando si
riattiva.
"""

["2026-09-27-1717-translate-mail"]
title = "Leggi le email nella tua lingua"
text = """
Sopra un messaggio in un’altra lingua ora c’è un pulsante Traduci, e
Mostra originale lo riporta com’era. Katna riconosce la lingua sul tuo
computer; il testo del messaggio va al server di Katna per la traduzione
solo quando lo chiedi. Impostazioni > Generali > Traduzione sceglie la tua
lingua e quelle da tradurre sempre.
"""

["2026-09-27-1744-open-and-click-tracking"]
title = "Scopri quando un’email viene aperta"
text = """
Attiva l’occhio accanto ai destinatari per vedere quando ognuno apre il
messaggio o segue un suo link, oppure chiedi una conferma di lettura.
Nella posta inviata vedi chi l’ha aperta, e una notifica te lo dice la
prima volta. Entrambi sono disattivati per ogni nuovo messaggio, e il
tracciamento richiede un account Katna (Impostazioni > Abbonamento).
"""

["2026-09-27-2042-activity"]
title = "Attività per le email tracciate"
text = """
Attività, accanto alla casella di ricerca, mostra quanti
dei tuoi messaggi tracciati sono stati aperti e quanto
spesso sono stati seguiti i loro link, con gli oggetti
ordinati in base a quanto spesso vengono aperti.
"""

["2026-09-27-2204-search-trigger-words"]
title = "Cerca nella posta da KRunner con k"
text = """
Digita k o m, uno spazio, poi ciò che vuoi trovare in KRunner o nella
ricerca di GNOME per ottenere gli stessi risultati della casella di
ricerca di Katna Mail, come «k budget». Scegli le tue parole in
Impostazioni, sotto Generali.
"""

["2026-09-27-2224-activity-button"]
title = "Attività accanto alla casella di ricerca"
text = """
Il pulsante Attività accanto alla casella di ricerca conta le nuove
aperture e i nuovi clic della posta tracciata e mostra chi ha aperto
cosa e quali link ha seguito; fai clic su una voce per aprire quel
messaggio. Dettagli mostra i tassi di apertura e di clic, le aperture
per giorno e i tuoi oggetti migliori degli ultimi 7 o 30 giorni, di
sempre o delle date che scegli. Un messaggio inviato ora mostra quante
volte ogni persona l’ha aperto e ha seguito un link.
"""

["2026-09-27-2239-mailbox-insights"]
title = "Statistiche della casella di posta"
text = """
Attività > Dettagli ora mostra anche quanta posta hai inviato e ricevuto
nel periodo, quanto spesso e quanto in fretta rispondi tu e rispondono
gli altri, le persone con cui scrivi di più e in quali giorni e a quali
ore arriva la tua posta. Il conteggio avviene sul tuo computer, a
partire dalla posta che Katna ha già.
"""

["2026-09-28-0059-sign-in-with-google"]
title = "Accedi con Google o Microsoft"
text = """
Aggiungi un account Gmail o Outlook accedendo dalla pagina di Google o di
Microsoft nel browser, senza password per le app. Ora funzionano anche gli
indirizzi Outlook.com e Hotmail. Se un accesso smette di funzionare, un
avviso in fondo alla finestra propone di accedere di nuovo.
"""
