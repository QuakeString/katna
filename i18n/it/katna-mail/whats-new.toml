Sul telefono il menu principale dietro l'immagine dell'account apre
File, Modifica, Visualizza e il resto sul posto, con una riga Indietro
in alto, invece che fuori dal bordo dello schermo.
"""

["2026-09-29-1256-calendar-every-account"]
title = "Tutti gli account nel Calendario"
text = """
L'elenco laterale del Calendario ora mostra tutti i tuoi account. Quando
i calendari di uno non si caricano, una riga sotto spiega perché, con il
clic che risolve, come «Accedi di nuovo per mostrare i calendari».
"""

["2026-09-29-1300-switch-account-stay-on-page"]
title = "Cambia account senza lasciare la pagina"
text = """
Scegliere un altro account dalla tua immagine in alto a destra, o girare
la rotellina sopra di essa, ora ti lascia su Calendario, Attività,
Contatti o Note. I nuovi elementi vanno a quell'account, e Posta lo
mostra quando torni indietro.
"""

["2026-09-29-1317-contacts-every-account"]
title = "Tutti gli account in Contatti"
text = """
Contatti ora elenca tutti i tuoi account sotto Account, con quante
persone contiene ciascuno; fai clic su uno per vedere solo le sue
persone. Quando i contatti di un account non si caricano, una riga sotto
spiega perché, con il clic che risolve, come «Accedi di nuovo per
mostrare i contatti» o «Riprova».
"""

["2026-09-29-1327-tasks-every-account"]
title = "Tutti gli account nella pagina Attività"
text = """
Ogni account ora compare nel pannello laterale di Attività. Quando le
attività di un account non si caricano, una riga sotto spiega perché,
con un clic per risolvere: accedere di nuovo o riprovare.
"""

["2026-09-29-1404-compose-dialogs-in-view"]
title = "Le domande prima dell'invio restano in vista"
text = """
Domande come «Volevi allegare dei file?» ora si aprono al centro della
finestra, per quanto lungo sia il messaggio che stai scrivendo o
inoltrando, così non restano mai nascoste più in basso nella pagina.
Invio risponde con il pulsante principale ed Esc torna al messaggio.
"""

["2026-09-29-1530-mark-up-pdfs"]
title = "Annota i PDF"
text = """
Premi la penna nel visualizzatore PDF per evidenziare, sottolineare,
sottolineare con un'onda o barrare il testo, o per disegnare con una
penna, nel colore che scegli. Annulla con Ctrl+Z, cancella un segno con
la gomma, poi salva una copia annotata. L'allegato originale resta
com'era.
"""

["2026-09-29-1557-calendar-accounts-why"]
title = "Perché un account non ha calendari"
text = """
Quando i calendari di un account non compaiono, Calendario ora dice cosa
ha risposto il server, e «Riprova» li cerca di nuovo subito. Un account
Gmail o Outlook aggiunto con una password propone di accedere con Google
o Microsoft, come richiedono i loro calendari.
"""

["2026-09-29-1610-one-checkbox"]
title = "Caselle di controllo con la spunta"
text = """
Ogni casella di controllo in Katna Mail ora ha la stessa dimensione dei
pulsanti rotondi accanto. La spunta si disegna quando la selezioni e si
cancella quando la deselezioni, allo stesso modo in Impostazioni,
nell'elenco dei messaggi, in Calendario, Contatti, Note e nelle finestre
di dialogo.
"""

["2026-09-29-1622-right-click-menu-fits"]
title = "Un menu del clic destro più corto che entra sempre"
text = """
Il menu del clic destro dell'elenco dei messaggi tiene in alto le azioni
di tutti i giorni e mette il resto sotto «Dai seguito» (attività, note,
riunioni, chiamate) e «Altro» (spam, importanza, fissaggio). Si apre
dove fai clic e resta dentro la finestra; in una finestra bassa o
stretta un sottomenu si apre al posto del menu.
"""

