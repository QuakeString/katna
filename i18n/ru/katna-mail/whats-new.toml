На телефоне выдвижная панель с папками теперь показывает логотип Katna
рядом с названием, в вашем акцентном цвете, а не простой конверт. На
планшете, где они уже есть на верхней панели, выдвижная панель начинается
сразу с папок.
"""

["2026-10-07-0118-clock-popup"]
title = "Аккуратнее часы на рабочем столе"
text = """
В Katna Digital Clock ваши часовые пояса теперь стоят рядом с датой
вверху, а список задач сворачивается щелчком по его заголовку. Добавление
мероприятия открывает небольшое окно «Новое мероприятие», а не всё
приложение. Новые задачи больше не появляются дважды после сбоя
синхронизации.
"""

["2026-10-07-0232-mcp-server"]
title = "Дайте ИИ-ассистентам доступ к почте"
text = """
«Настройки > Сервер MCP» позволяет ИИ-ассистентам на этом компьютере,
например Claude Desktop, Claude Code и LM Studio, искать и читать вашу
почту и сохранять черновики, которые вы проверите. Это выключено, пока вы
не включите. Выберите, какие аккаунты им видны, скопируйте то, что нужно
вставить в ассистент, и смотрите, что они делали недавно. Ассистенты
никогда не отправляют, не удаляют и не перемещают письма.
"""

["2026-10-07-0359-waiting-for-reply"]
title = "Что ждёт ответа"
text = """
Письма, отправленные с повторным письмом или напоминанием, перечислены в
папке «Ждут ответа» под «Отправленными». В их строках плашка показывает,
что произойдёт дальше и когда, — и в «Ждут ответа», и во «Входящих».
Откройте такое письмо, чтобы перенести повторное письмо на другое время,
отправить его сейчас или отменить.
"""

["2026-10-07-0505-follow-ups-in-chats"]
title = "Повторные письма в виде чата"
text = """
В виде чата повторное письмо, ожидающее отправки, показывается бледным
пузырём в конце чата с кнопками «Изменить», «Отправить сейчас» и
«Остановить». Чтобы настроить его, щёлкните правой кнопкой или удерживайте
«Отправить» и выберите «Напомнить, если нет ответа…».
"""

["2026-10-07-0603-remind-me"]
title = "Напоминание о любом письме"
text = """
Нажмите H на письме или «Напомнить» рядом с «Отложить», чтобы получить
напоминание в нужное время, а письмо останется на месте. Если в письме
сказано, что что-то нужно сделать к определённому дню, Katna предложит
утро накануне. Напоминания — это задачи в «Задачах», они перечислены в
«Напоминаниях» и видны в строке письма. B откладывает письмо.
"""

["2026-10-07-0718-snooze-extras"]
title = "«Отложить» знает, когда кто-то ответил"
text = """
Отложенная переписка сразу возвращается, когда в неё кто-то пишет. В
«Выбрать дату и время» можно ввести «вт 15:00» или «через 2 часа».
Уведомление о новом письме может отложить его на час или до завтра.
"""

["2026-10-07-0802-your-snooze-times"]
title = "Откладывайте по-своему"
text = """
Задайте, что значат «Сегодня, позже», «Завтра», «В эти выходные» и «На
следующей неделе», и добавьте своё время в «Настройки > Входящие».
«Отложенные» показывают письма по времени их возвращения. На телефоне
смахните строку влево, чтобы отложить письмо.
"""

["2026-10-07-0913-pick-date-in-place"]
title = "Дата выбирается там, где вы щёлкнули"
text = """
«Выбрать дату и время» теперь выдвигается прямо в меню «Отложить» и
«Напомнить», а не открывается окном посреди экрана. Стрелка «назад»
возвращает к списку времени.
"""

["2026-10-07-0953-nudges"]
title = "Вопросы без ответа возвращаются"
text = """
Отправленное вами письмо с вопросом, на который три дня нет ответа,
возвращается в начало «Входящих» с надписью «Отправлено 3 дня назад.
Написать повторно?». Щёлкните, чтобы написать повторно, или по крестику,
чтобы убрать. Отключить это можно в «Настройки > Входящие».
"""

["2026-10-08-0128-settings-menu-tint"]
title = "У «Настроек» своё меню"
text = """
Список страниц слева в «Настройках» слегка окрашен сверху вниз, поэтому он
отделяется от страницы, которую вы читаете.
"""

["2026-10-08-0136-schedule-pick-in-place"]
title = "«Запланировать отправку» выбирает дату на месте"
text = """
«Выбрать дату и время» в «Запланировать отправку» и «Напомнить, если нет
ответа» теперь выдвигается прямо в меню, из которого вы его открыли, как в
«Отложить», а не открывается окном поверх письма. Стрелка «назад» или Esc
возвращает к списку времени.
"""

["2026-10-08-0141-tray-icon-follows-colors-after-login"]
title = "Значок в трее подходит к панели сразу после входа"
text = """
В KDE Plasma одноцветный значок в трее теперь принимает цвет вашей панели
сразу после входа в систему и меняется при каждом переключении между
светлой и тёмной темой, без перезапуска Katna.
"""

["2026-10-08-0153-search-attachment-types"]
title = "Поиск чертежей и картинок"
text = """
В «Параметрах поиска» появились два новых типа вложений: DWG для чертежей
AutoCAD (и DXF) и «Изображение» для фотографий и картинок. XLSX теперь
находит и старые файлы XLS, а PPTX — PPT, так что для каждого формата одна
кнопка.
"""

["2026-10-08-0157-menus-one-of-each-pair"]
title = "В меню только то, что подходит"
text = """
Меню «Ещё» больше не показывает оба действия из пары. Для прочитанного
письма есть «Отметить как непрочитанное», для помеченного — «Снять
пометку», для важного — «Отметить как неважное», для закреплённого —
«Открепить». Если выбрано несколько разных писем, вы увидите действие,
которое сделает их все одинаковыми, — здесь и в контекстном меню.
"""

["2026-10-08-0210-settings-card-edge"]
title = "«Настройки» на карточке"
text = """
В светлой теме страница «Настройки» теперь имеет такую же тонкую обводку и
мягкую тень, как список писем, поэтому она отделяется от окна позади неё.
"""

["2026-10-08-0212-steady-app-buttons"]
title = "Плавные кнопки приложений"
text = """
Щелчок по приложению на левой панели или на нижней панели на телефоне
больше не вызывает дрожания: волна нажатия доигрывает до конца, а
подсветка выбора растёт от центра, пока кнопка сохраняет свой размер.
