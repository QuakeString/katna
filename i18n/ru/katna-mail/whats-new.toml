title = "Нажатие заполняет всю кнопку"
text = """
При нажатии на чип или кнопку с контуром она теперь заполняется до своих
краёв и углов, а не показывает внутри себя меньшую плашку.
"""

["2026-10-08-0802-command-palette"]
title = "Палитра команд"
text = """
Нажмите Ctrl+Shift+P и начните вводить, чтобы найти любое действие или
