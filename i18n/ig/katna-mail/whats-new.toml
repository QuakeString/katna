title = "Enweghị ndebiri efu"
text = """
Ozi ọhụrụ i mere ka ọ tọgharịa efu tupu i mechie ya anaghịzi anọ na Ndebiri, dị ka nzaghachi efu na mkparịta ụka.
"""

["2026-10-02-1513-dark-pages"]
title = "Peeji gbara ọchịchịrị n'ihe nlele"
text = """
N'ọnọdụ ọchịchịrị, ihe nlele mgbakwunye nwere bọtịnụ ọnwa ọkara na-egosi
PDF, akwụkwọ, slaịdị, mpempe mgbakọ na faịlụ ederede na-enwu gbaa ka ha
gbaa ọchịchịrị. Agba na-ejide ụdị ha, foto dị n'ime peeji na-ebelata ìhè
kama ka agba ha tụgharịa n'azụ, akwụkwọ e nyochara na-agbakwa ọchịchịrị dị ka
ederede. Katna na-echeta nhọrọ gị maka faịlụ na-esote.
"""

["2026-10-02-1522-window-corners"]
title = "Họrọ nkuku na ókè windo gị"
text = """
Ya na ogwe aha nke Katna n'onwe ya, Ntọala > Nnwale nwere ugbu a
slaịda Ịgba okirikiri nkuku, site na square ruo gburugburu, na mgba ọkụ Ọnụ nwere
ọkpụrụkpụ nke ya. Mgbe Ọnụ ụzụzụ nke gị gbanyere, slaịda Ọkpụrụkpụ na-ekpebikwa
ugbu a ole azụ windo gbara ụzụzụ na-ahapụ ka ọ gafee.
"""

["2026-10-02-1535-ctrl-shift-click-select"]
title = "Họrọ ozi site na Ctrl na Shift"
text = """
Pịa Ctrl+click n'ozi dị na ndepụta ka ị họrọ ya, ma pịa Ctrl+click ndị
ọzọ ka ị tinyekwuo ha. Shift+click na-ahọrọ ozi niile site n'nke ikpeazụ
ị pịara. Iji mepee ozi na windo nke ya, pịa ya aka nri ma họrọ Mepee na
windo ọhụrụ.
"""

["2026-10-02-1610-frosted-panes"]
title = "Paịn, nkata na ọchụchọ gbara ụzụzụ"
text = """
Mgbe Mee ka ihe dị n'azụ windo gbaa ụzụzụ gbanyere, ndepụta ozi, ozi
e mepere na kaadị mmadụ na-ahapụkwa ụzụzụ ahụ ka ọ gafee ugbu a, ya na
slaịda Ọkpụrụkpụ paịn. Ebe dị n'azụ afụ nkata na-egosi ya ntakịrị karịa,
igbe ọchụchọ na-anọkwa na-agba ụzụzụ ka ị na-ede. Nke ọ bụla nwere mgba
ọkụ nke ya na Ntọala > Nnwale.
"""

["2026-10-02-1618-fainter-hints"]
title = "Ntụziaka na-adịchaghị ìhè n'igbe efu"
text = """
Ntụziaka ntụ ntụ dị n'igbe efu, dị ka "Zaa…" n'okpuru nkata ma ọ bụ
"Chọọ ozi", adịwanyela ìhè karịa ugbu a, ka ọ ghara iyi ederede i dere.
"""

["2026-10-02-1642-drag-from-empty-space"]
title = "Bugharịa windo site n'oghere efu"
text = """
Na Linux, ị nwere ike ịbugharị windo ugbu a site n'ịdọkpụ oghere efu ọ
bụla dị n'ogwe aka ekpe, na folda ma ọ bụ n'ogwe dị n'elu ozi gị, ọ bụghị
naanị ogwe dị n'elu.
"""

["2026-10-02-1643-space-folds-folders"]
title = "Space na-apịaji folda"
text = """
Pịa folda nwere folda n'ime ya, wee pịa Space ka imepe ya ma ọ bụ
pịajie ya, dị ka ịpị akụ ya. Mgbe ịpị gasịrị, igodo akụ na-agagharịkwa
na paịn folda, Tab na-agakwa na ndepụta ozi.
"""

["2026-10-02-1646-viewer-more-menu"]
title = "Njikwa ihe nlele na-adaba na windo warara"
text = """
Na windo warara, njikwa dị n'ala ihe nlele mgbakwunye na-anọ ugbu a n'ime
ya. Bọtịnụ ndị na-adabaghị na-abanye na menu ⋮ Ọzọ: ntụgharị na mbụ, wee
Dabara, wee Peeji gbara ọchịchịrị. Nọmba peeji na mbuli nha na-anọ na
nlele ogologo oge kachasị.
"""

["2026-10-02-1743-activity-report-fits"]
title = "Akụkọ Ihe omume na-adaba na windo"
text = """
Akụkọ Ihe omume na-anọ ugbu a n'ime windo ya na oghere hà nhata n'akụkụ,
ọ na-akpụgharịkwa mgbe windo dị mkpụmkpụ, ka a ghara ịbipụ ahịrị ya
ikpeazụ.
"""

["2026-10-02-1846-folders-and-labels"]
title = "Gbanwee aha, hichapụ ma dọkpụrụ gaa na folda"
text = """
Pịa aka nri na folda i mere ka ị gbanwee aha ya ma ọ bụ hichapụ ya;
ihichapụ na-ebu ụzọ buga ozi ya na Ihe mkpofu. Dọkpụrụ ozi site na
ndepụta gaa na folda ka ị bugara ya ebe ahụ. Bugharịa gaa nwere igbe
ọchụchọ: dee ka ịchọta folda, ma ọ bụ ka ị mepụta nke ọhụrụ ma bugara ozi
ahụ n'ime ya. Na Gmail, Tinye leebụl na-etinye leebụl n'ozi ma wepụ ha,
ịtụba ozi na leebụl na-etinyekwa leebụl ahụ.
"""

["2026-10-02-1928-mail-rules"]
title = "Iwu ozi"
text = """
Iwu na-ahazi ozi ọhụrụ n'onwe ha: site n'onye zitere, isiokwu ma ọ bụ
okwu, ha na-ebugharị ya, tinye leebụl, tinye kpakpando, zigaa ya ma ọ bụ
mee ka ọ gbachi nkịtị. Mee otu na Ntọala > Folda na iwu, ma ọ bụ pịa ozi
aka nri ma họrọ Mee iwu…, ma hụ ole ozi na nso nso a ọ dabara tupu i
chekwaa ya. Na Bugharịa gaa, kaa akara "Na-ebuga ozi si n'aka … ebe a mgbe niile"
ka ị bugharịa ozi onye zitere na ozi ya n'ọdịnihu n'otu ịpị.
"""

["2026-10-02-2017-rules-on-the-server"]
title = "Iwu na-arụ ọrụ mgbe kọmputa gị gbanyụrụ"
text = """
Iwu ozi na-arụ ọrụ ugbu a na Gmail, ma ọ bụ na sava ozi gị mgbe ọ na-anabata
iwu Sieve, ka ha hazie ozi na ekwentị gị kwa, na mgbe kọmputa a gbanyụrụ.
Ntọala > Folda na iwu na-egosi ebe iwu ọ bụla na-arụ ọrụ, na ihe mere
otu ji anọ na Katna.
"""

["2026-10-03-0046-smooth-folded-tabs"]
title = "Taabụ apịajiri na-agbanwe nke ọma"
text = """
Mgbe windo warara pịajiri taabụ igbe ozi mbata ka ha bụrụ akara ngosi,
ịgbanwe taabụ anaghịzi awụli elu: taabụ ị hapụrụ na-ebelata laghachi
n'akara ngosi ya ka aha ya na-apụ n'anya, nke ị mepere na-ebuwanye ka
aha ya na-apụta.
"""

["2026-10-03-0051-read-rows-frosted"]
title = "Ozi a gụrụ na-agbakwa ụzụzụ"
text = """
Mgbe paịn gbara ụzụzụ gbanyere, ozi ị gụrụ na-egosi ugbu a ụzụzụ dị n'azụ
ndepụta dị ka ozi a gụghị na-eme, naanị na agba dị iche ntakịrị, kama
ịbụ ogwe siri ike.
"""

["2026-10-03-0101-rounder-corners"]
title = "Nkuku windo gbara gburugburu karịa"
text = """
Ịgba okirikiri nkuku na Ntọala > Nnwale na-erute ugbu a pikselụ 32, okpukpu abụọ
karịa nke mbụ, ị nwekwara ike ide nọmba ahụ n'igbe dị n'akụkụ slaịda.
"""

["2026-10-03-0113-viewer-round-corners"]
title = "Ihe nlele na-eso nkuku windo gbara gburugburu"
text = """
Ya na ogwe aha nke Katna n'onwe ya na nkuku gbara gburugburu, ihe nlele
mgbakwunye na-eme ka nkuku ala ya gbaa gburugburu ugbu a ka ọ dabara
windo, kama igosi nkuku square ntụ ntụ gafere nsọtụ windo.
"""

["2026-10-03-0147-chat-go-down"]
title = "Laghachi n'ozi kacha ọhụrụ"
text = """
Mgbe ị kpụgharịrị elu nke ukwuu na nkata, bọtịnụ gburugburu na-apụta
n'ala aka nri. Ọ na-akpọghachi gị nwayọọ n'ozi kacha ọhụrụ, ọ na-agụkwa
ndị ọ bụla bịara n'oge ahụ.
"""

["2026-10-03-0147-chat-long-mails"]
title = "Ozi ogologo na nkata"
text = """
N'afụ ogologo, foto onye zitere na-anọ n'ala ihe ị na-ahụ, bọtịnụ
nzaghachi, kwụnye na ọzọ na-anọkwa n'akụkụ ị na-ahụ. Pịa ederede ahụ aka
nri ka i rute ha niile.
"""

["2026-10-03-0147-chat-scroll-bar"]
title = "Ogwe nkpụgharị na nkata"
text = """
Nkata nwere otu ogwe nkpụgharị dị jụụ dị ka ozi e mepere, nke na-egosi
mgbe ihe ntụaka nọ n'elu ha.
"""

["2026-10-03-0147-chat-translate"]
title = "Tụgharịa na nkata"
text = """
Ozi dị n'asụsụ ọzọ na-enye ntụgharị ya na nkata kwa, dị ka na Ozi. Pịa
afụ ọ bụla aka nri ma họrọ Tụgharịa ka ị tụgharịa ya n'onwe gị, ma mee ya
ọzọ ka i gosi nke mbụ.
"""

["2026-10-03-0150-search-pill-hovers"]
title = "Ntụaka hà nhata n'ogwe ọchụchọ ekwentị"
text = """
Na ekwentị, bọtịnụ folda na foto akaụntụ gị na-anọ ugbu a n'etiti nsọtụ
gbara gburugburu nke ogwe ọchụchọ, bọtịnụ ọ bụla dị n'ogwe ahụ nwekwara
otu ntụaka gburugburu, nke dị anya hà nhata site na nsọtụ ogwe ahụ.
"""

["2026-10-03-0159-starter-rules"]
title = "Iwu mmalite"
text = """
Ntọala > Folda na iwu na-enye ugbu a iwu emeburu, gbanyụrụ agbanyụ: mee
ka mkpọsa gbachi nkịtị, akwụkwọ akụkọ gaa na Ịgụ, risiti, nnyefe, tiketi
ụgbọ oloko na ụgbọ elu (IRCTC, Air India, IndiGo na ndị ọzọ), koodu otu
oge, ọkwa nchekwa, ozi mmekọrịta na òkù kalịnda. Gbanye otu ọ ga-arụ ọrụ
maka akaụntụ gị niile, na-eme folda dị ka Njem mgbe ọ dị mkpa. Iwu nwekwara
ike ilele taabụ igbe ozi mbata na ma ozi ahụ si na ndepụta ozi.
"""

["2026-10-03-0200-chat-file-hover"]
title = "Kaadị faịlụ dị nro na nkata"
text = """
Faịlụ dị n'afụ nkata anaghịzi agba ọchịchịrị n'okpuru ihe ntụaka. Ọ
na-ebuli ntakịrị ya na agba dị nro, aha ya na-adịkwa mfe ịgụ.
"""

["2026-10-03-0210-opened-mail-stays-in-view"]
title = "Ozi i mepere na-anọ na nlele"
text = """
Mgbe paịn ọgụgụ dị n'akụkụ ndepụta, ozi ị pịara na-anọ ebe ọ nọ na
ndepụta ka paịn ahụ na-emepe, ma ọ bụ ndepụta ahụ na-akpụgharị nke ga-ezu
igosi ya niile. Ọ naghịzi apụ n'anya, ma i mepere ya site na ndepụta ma
ọ bụ site na nsonaazụ ọchụchọ.
"""

["2026-10-03-0212-about-header-stays"]
title = "Banyere na-edebe isi ya na nlele"
text = """
Ịkpụgharị Banyere na-eme ugbu a ka akara ngosi buru ibu ghọọ obere n'elu
aka ekpe, ya na Katna, ahịrịokwu ya na ụdị ya n'akụkụ ya, isi ahụ na-anọkwa
n'ọnọdụ ya ka ihe ndị ọzọ na-akpụgharị n'okpuru ya.
"""

["2026-10-03-0221-folded-tab-icon-settles"]
title = "Taabụ apịajiri na-akwụsị n'ebe ziri ezi"
text = """
Mgbe ị gbanwere n'etiti taabụ igbe ozi mbata apịajiri, taabụ ị hapụrụ
na-akwụsị ugbu a kpọmkwem ebe ọ belatara, akara ngosi ya anaghị apụ
pikselụ otu ma ọ bụ abụọ mgbe mmegharị ahụ kwụsịrị.
"""

["2026-10-03-0228-right-click-another-mail"]
title = "Otu ịpị aka nri zuru"
text = """
Mgbe menu ozi ma ọ bụ folda mepere, ịpị aka nri n'ozi ma ọ bụ folda ọzọ
na-emechi menu ahụ ugbu a ma mepee nke ọhụrụ ozugbo, kama ịchọ ịpị aka
nri nke abụọ.
"""

["2026-10-03-0235-rule-editor-fits"]
title = "Ihe ndezi iwu na-adaba"
text = """
N'ihe ndezi iwu, okwu ogologo ma ọ bụ ndepụta adreesị na-agbatị gaa
n'ahịrị ndị ọzọ kama ịbụ ndị a bipụrụ, "dabara ụkpụrụ ahụ" na-egosi
zuru oke, ihe ndezi ahụ na-anọkwa n'ime windo, na-akpụgharị mgbe o nwere
ọtụtụ ọnọdụ.
"""

["2026-10-03-0235-soft-button-hover"]
title = "Ntụaka bọtịnụ dị nro"
text = """
Ịtụ aka na bọtịnụ gburugburu na-eme ugbu a ka okirikiri ya nwayọọ too
site na ụzọ abụọ n'ime ụzọ atọ nke nha ya ma pụta, bọtịnụ dị ka Zaa
na-apụtakwa nwayọọ karịa. Ịpụ na ya na-ebelata okirikiri ahụ ntakịrị ka
ọ na-apụ n'anya.
"""

["2026-10-03-0249-account-ring"]
title = "Mgbanaka akaụntụ doro anya karịa"
text = """
Mgbanaka nwere agba gburugburu foto akaụntụ ọ bụla dị oke karịa, ya na
oghere ntakịrị karịa n'etiti ya na foto ahụ, n'ogwe dị n'elu, na menu
akaụntụ na na Ntọala.
"""

["2026-10-03-0335-chat-picture-steady"]
title = "Foto kwụsiri ike na nkata"
text = """
Ịkpụgharị gafere njedebe nkata, ma ọ bụ nkata na-enweghị ihe a ga-akpụgharị,
anaghịzi eme ka foto onye zitere na bọtịnụ afụ ahụ wụlie elu.
"""

["2026-10-03-0355-no-hover-while-scrolling"]
title = "Nkpụgharị dị jụụ na ndepụta ozi"
text = """
Ka ị na-akpụgharị ndepụta ozi, ozi na-agafe n'okpuru ihe ntụaka anaghịzi
enwu ma gosi bọtịnụ ha. Dị ka na Gmail, ozi dị n'okpuru ihe ntụaka
na-enwu ozugbo nkpụgharị kwụsịrị.
"""

["2026-10-03-0541-rule-rows-drag"]
title = "Iwu na-adọkpụ dị ka akaụntụ"
text = """
Na Ntọala > Folda na iwu, ịdọkpụ iwu na-ebuli ahịrị ya niile ugbu a, iwu
ndị ọzọ na-ahapụ ya ụzọ, ọ na-akwụsịkwa ebe ị hapụrụ ya, dị ka ịhazigharị
akaụntụ.
"""

["2026-10-03-0545-chat-go-down-aligned"]
title = "Bọtịnụ ịgbada kwụ n'ahịrị"
text = """
Na nkata, bọtịnụ gburugburu na-akpọga gị n'ozi kacha ọhụrụ na-anọ ugbu a
kpọmkwem n'elu bọtịnụ izipu, n'otu ahịrị.
"""

["2026-10-03-0555-bottom-corners-round"]
title = "Nkuku ala gbara gburugburu na-anọ gburugburu"
text = """
Ya na ogwe aha nke Katna n'onwe ya na nkuku gbara gburugburu, nkuku ala
windo anaghịzi egosi square nke azụ ya gafere ókè gbara gburugburu.
"""

["2026-10-03-0606-account-dot-only"]
title = "Ndepụta ozi dị jụụ karịa"
text = """
Ahịrị dị n'igbe ozi mbata jikọtara ọnụ na-egosi naanị ntụpọ agba akaụntụ
n'akụkụ onye zitere. Tụọ aka na ntụpọ ahụ ka ị hụ akaụntụ ozi ahụ
bụ nke ya.
"""

["2026-10-03-0623-windows-updates"]
title = "Imelite na Windows"
text = """
Katna na Windows na-emelite onwe ya ugbu a. Ọ na-elele ụdị ọhụrụ kwa
elekere, na-ebudata ha n'azụ ma na-etinye ha mgbe ị pịara Melite, wee
mepee ọzọ.
"""

["2026-10-03-0643-files-wildcard-search"]
title = "Akara ọ bụla n'ọchụchọ Faịlụ"
text = """
Na Faịlụ, ịchọ *.pdf na-achọta ugbu a PDF niile, * na ? na-arụkwa ọrụ
ebe ọ bụla n'aha: invoice*2026* na-achọta akwụkwọ ụgwọ niile nke 2026. Ọ
na-arụ ọrụ maka faịlụ ozi gị yana na Google Drive na OneDrive.
"""

["2026-10-03-0643-linux-package-updates"]
title = "Imelite maka ngwugwu Linux ọ bụla"
text = """
AppImage na tarball Linux na-emelite onwe ha ugbu a dị ka ngwugwu Arch.
Ya na ngwugwu Fedora, Snap, Flatpak ma ọ bụ Nix, Katna na-agwa gị mgbe
ụdị ọhụrụ pụtara ma gosi otu iwu na-etinye ya, dị njikere idetuo.
"""

["2026-10-03-0708-copy-codes"]
title = "Detuo koodu site n'ọkwa"
text = """
Ọkwa ozi ọhụrụ nwere koodu mbanye ma ọ bụ nkwenye nwere ugbu a bọtịnụ
Detuo maka ya, nke nwere njikọ iji kwado ma ọ bụ kwenye adreesị gị nwere
bọtịnụ na-akpọ aha saịtị ọ na-emepe. Bọtịnụ dị n'ọkwa anaghịzi eme ka
akara ngosi Katna na-awụli elu soro ihe ntụaka òké.
"""

["2026-10-03-0730-contact-card-popover"]
title = "Kaadị kọntaktị na windo warara"
text = """
Mgbe windo enweghị ohere maka paịn kọntaktị, ịpị aha mmadụ ma ọ bụ foto
ya na-emepe kaadị dị mkpụmkpụ n'elu ozi ahụ, na-atụ aka n'ebe ị pịara.
Mee ka windo saa mbara, paịn zuru oke ga-anọchi ya.
"""

["2026-10-03-0733-compose-icon-turns"]
title = "Akara ngosi bọtịnụ ukwu na-atụgharị ka ị na-agbanwe peeji"
text = """
Ịgbanwe n'etiti Ozi, Kalịnda, Kọntaktị, Ọrụ na Ndetu anaghịzi agbanwe
akara ngosi dị na bọtịnụ ukwu dị n'elu ogwe aka ekpe n'otu mwụli. Akara
ngosi ochie na-atụgharị pụọ ma belata ka nke ọhụrụ na-atụgharị bata, na
bọtịnụ ekwentị kwa.
"""

["2026-10-03-0746-sound-sets"]
title = "Otu ụda ọkwa"
text = """
Ntọala > Ọkwa nwere ugbu a otu ụda: Nnụnụ, Okike, Anụmanụ, Ụmụ ahụhụ,
Elektrọnik, Ụtụtụ, mgbịrịgba Katna, ma ọ bụ nke desktọpụ gị. Ozi ọhụrụ
