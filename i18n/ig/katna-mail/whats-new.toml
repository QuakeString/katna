title = "Agba mbụ n'ụdị agba ọchịchịrị"
text = """
N'ụdị agba ọchịchịrị, a na-egosi ozi nke na-edozi agba nke ya n'agba gbara
ọchịchịrị. Bọtịnụ ọhụrụ dị ka ọkara okirikiri dị na toolbar nke paịn ọgụgụ
na-egosi ya n'agba mbụ nke onye zitere ya, ma na-eweghachi ya.
"""

["2026-09-28-0127-print-as-shown"]
title = "Ibipụta na-edobe nhazi ya"
text = """
A na-ebipụta ozi otú ọ dị na paịn ọgụgụ, tinyere tebụl ya, agba ya, oke ya,
ndepụta ya na foto ya. Nlele tupu ibipụta nwere ike ịhapụ agba ndabere iji
chekwaa inki, ma ọ bụ bipụta naanị ederede ya site na Ederede nkịtị.
"""

["2026-09-28-0141-ask-before-deleting"]
title = "Jụọ tupu ihichapụ"
text = """
Ihichapụ ọtụtụ mkparịta ụka n'otu oge ugbu a na-ajụ mbụ ma a ga-ebuga ha na
Ihe mkpofu. Pịa “Ajụla ọzọ” iji wụfee ajụjụ ahụ, ma ọ bụ gbanye ya ọzọ na
Ntọala > Izugbe. Ihichapụ ruo mgbe ebighị ebi, na Ihe mkpofu, na-ajụ mgbe
niile.
"""

["2026-09-28-0019-katna-for-windows"]
title = "Katna maka Windows"
text = """
Katna Mail na-arụ ọrụ ugbu a na Windows 10 na 11 kwa, nke Katna Setup nke ya
na-etinye, ya na akara ngosi tray, ọkwa, ịmalite mgbe ị banyere, na njikọ
ozi na-emeghe na Katna.
"""

["2026-09-28-0236-chip-remove-always"]
title = "Bọtịnụ iwepụ n'adreesị ọ bụla"
text = """
Mpempe adreesị ọ bụla dị na Gaa, Cc na Bcc na-egosi x ya mgbe niile ugbu a,
ka i wee wepụ ya n'ebughị pointa gaa na ya na mbụ.
"""

["2026-09-28-0244-pill-format-bar"]
title = "Ogwe nhazi gbara okirikiri karịa"
text = """
Ogwe nhazi dị na windo ide ozi (Aa) nwere ọdịdị ọgwụ ugbu a, ya na oke dị
nro, ka o wee kewapụ onwe ya na ederede gị n'ụdị agba ìhè na nke ọchịchịrị.
"""

["2026-09-28-0325-long-threads-smooth"]
title = "Ogologo usoro email na-emeghe ngwa ngwa"
text = """
Ozi a haziri ahazi nke na-ehota ọtụtụ nzaghachi gara aga, dị ka ogologo
usoro nhota, na-emeghe ozugbo ugbu a ma na-atụgharị nke ọma kama ime ka
windo niile dị nwayọ.
"""

["2026-09-28-0830-who-has-seen-it"]
title = "Onye hụrụ ya, n'azụ anya"
text = """
Ozi i zitere na nsochi enweghịzi igbe ahịrị n'elu ya. Anya dị n'akụkụ
kpakpando na-agbanwe gaa n'agba mmesi ike gị ozugbo mmadụ mepere ya; bugara
ya pointa ka ị hụ onye mepere ya ma ọ bụ soro njikọ, na mgbe ọ bụ.
"""

["2026-09-28-0831-contact-call-copy"]
title = "Kpọọ ma detuo site na nkọwa kọntaktị"
text = """
Na nkọwa kọntaktị dị n'akụkụ mkparịta ụka, pịa nọmba ekwentị ka ị kpọọ ya
site na ngwa ekwentị gị ma ọ bụ KDE Connect, ma ọ bụ jiri bọtịnụ Detuo dị
n'akụkụ ya. Ị nwekwara ike ịhọrọ ma detuo ederede niile dị na paịn ahụ ugbu
a.
"""

["2026-09-28-0848-quoted-text-hide-remove"]
title = "Zoo ma ọ bụ wepụ ozi e hotara na nzaghachi"
text = """
Bọtịnụ “...” dị n'okpuru nzaghachi na-ezozi ozi e hotara ugbu a mgbe i
meghechara ya. Bugara ya pointa ma pịa x dị na nkuku ya iji wepụ ozi e
hotara na nzaghachi gị; Megharịa ma ọ bụ Ctrl+Z na-eweghachi ya. Toolbar
nzaghachi ahụ na-anọkwa otu ebe mgbe ị na-atụgharị.
"""

["2026-09-28-0854-floating-folders"]
title = "Folda na-ese n'elu, na ọchụchọ sara mbara"
text = """
Mgbe folda zoro ezo, idebe pointa na Dee ma ọ bụ Ozi na-emeghe ha dị ka paịn
nọ anya site na nsọtụ, ya na obere ntụ na-atụ aka na bọtịnụ ahụ. Igbe
ọchụchọ na-eto iji jupụta ohere folda hapụrụ, na ịpị folda ị nọ na ya
anaghịzi eme ka ndepụta ahụ na-egbu maramara.
"""

["2026-09-28-0928-search-address-suggestions"]
title = "Ntụnye adreesị na Nhọrọ ọchụchọ"
text = """
Si na Gaa na Nhọrọ ọchụchọ na-atụ aro adreesị ugbu a ka ị na-ede, otu ụzọ
Gaa, Cc na Bcc si eme ya na ide ozi. Were Enter, Tab ma ọ bụ ịpị họrọ otu.
"""

["2026-09-28-0935-app-menu-reply-all-window"]
title = "Menu isi na kaadị akaụntụ, Zaa mmadụ niile na windo nke ya"
text = """
Kaadị akaụntụ nwere bọtịnụ ☰ n'akụkụ Jikwaa akaụntụ. Ọ na-emeghe otu menu
Faịlụ, Dezie, Lelee, Gaa, Ozi, Ntọala na Enyemaka dị ka menu zuru ụwa ọnụ
nke desktọpụ, maka desktọpụ ndị na-anaghị egosi otu. Zaa mmadụ niile n'ọkwa
ozi ọhụrụ na-emeghe mkparịta ụka ahụ ugbu a na windo nke ya, dị njikere ka i
dee, ma hapụ windo isi ebe ọ dị.
"""

["2026-09-28-1011-tray-brings-window-forward"]
title = "Ịpị tree na ọkwa na-ebute Katna Mail n'ihu"
text = """
Ịpị akara ngosi tree, ma ọ bụ Mepee Igbe ozi mbata, Ozi ọhụrụ ma ọ bụ
Ntọala na menu ya, na-ebute windo Katna Mail n'ihu ugbu a na Wayland,
ọbụlagodi mgbe e mere ka ọ dị nta ma ọ bụ ọ nọ n'azụ windo ndị ọzọ. Ịpị
ọkwa ozi ọhụrụ na-emepe ozi ahụ, ọbụlagodi mgbe ndepụta Igbe ozi mbata
egosighị ya.
"""

["2026-09-28-1053-send-countdown-reply-in-place"]
title = "Zipu na-agụ oge, nzaghachi gị na-anọ na mkparịta ụka"
text = """
Mgbe Zipu gasịrị, okirikiri na-ebelata n'akụkụ Megharịa na-agụ oge fọdụrụ
iji megharịa, mgbe ahụ ndetu dị n'okpuru na-ekwu “Ezigara ozi” (ya na
obere ụda) ozugbo ozi ahụ apụla. Ị nwere ike ịgbanyụ ụda ahụ na Ntọala >
Izugbe > Izipu. Nzaghachi e dere na mkparịta ụka na-aghọ ozi n'ebe ahụ i
dere ya. Isi ya na-egosi naanị onye ọ na-aga; pịa ya maka Si, Gaa, Cc na
Bcc. Akụ dị n'akụkụ akara ngosi nzaghachi na-agbanwe n'etiti Zaa, Zaa
mmadụ niile na Zigaa, na-edebe ihe i dere.
"""

["2026-09-28-1110-search-options-narrow"]
title = "Nhọrọ ọchụchọ na-adaba na windo dị warara"
text = """
Na windo dị warara ma ọ bụ dị mkpụmkpụ, Nhọrọ ọchụchọ na-agbasa ugbu a ruo
ebe ohere dị, na-etinye aha n'elu ogige ha na ekwentị ma na-akpụgharị mgbe
ha na-adabaghị, ka bọtịnụ Chọọ wee dị gị nso mgbe niile.
"""

["2026-09-28-1119-replies-from-right-account"]
title = "Nzaghachi na-esi n'akaụntụ ziri ezi apụ"
text = """
Zaa ma ọ bụ Zigaa n'ozi e mepere site na Igbe ozi mbata jikọtara ọnụ ma ọ
bụ site n'ọchụchọ na-esi ugbu a n'akaụntụ ozi ahụ bịarutere apụ, ọ bụghị
akaụntụ a họọrọ n'okpuru foto profaịlụ gị.
"""

["2026-09-28-1436-calmer-search-box"]
title = "Ọchụchọ na-egosi ụzọ mkpirisi ya"
text = """
Igbe ọchụchọ na-egosi ụzọ mkpirisi keyboard ya n'akụkụ Chọọ ozi, dị ka e
setịrị ya na Ntọala > Ụzọ mkpirisi. Mgbe ị pịrị n'ime ya, ọ na-edobe agba ya
ma na-egosi ọnụ dị nro kama ịgba ọchịchịrị na onyinyo. Folda ndị na-ese n'elu
ndepụta ahụ na-anọkwa n'ebe dị anya site n'ọnụ ala ugbu a.
"""

["2026-09-28-1450-clear-activity"]
title = "Hazie Ihe omume"
text = """
Tụkwasị pointa n'otu mmeghe ma ọ bụ mpị na Ihe omume wee pịa × iji wepụ ya
na ndepụta, ma ọ bụ pịa Kpochapụ ha niile iji malite ọhụrụ. Mmeghe na mpị
ọhụrụ ka na-apụta, akụkọ Nkọwa zuru ezu ka na-agụkwa ihe niile.
"""

["2026-09-28-1541-round-logo"]
title = "Akara ngosi ọhụrụ dị okirikiri nke Katna"
text = """
Katna nwere akara ngosi ọhụrụ ugbu a: mkpụrụedemede "k" na okirikiri
agba akwụkwọ ndụ, dị na menu ngwa, ogwe elu na akara ngosi ogwe ọrụ.
Tray na-egosi ya na otu agba dabara na paneli gị; Maka Katna na ibe
nnabata na-egosikwa “katna mail” n'uju ugbu a.
"""

["2026-09-28-1546-contact-cards"]
title = "Panel kọntaktị dị ọcha karịa"
text = """
Panel kọntaktị na-egosi ugbu a akụkụ ọ bụla na kaadị ya nke dị nro,
na-enwe bọtịnụ okirikiri n'okpuru aha ahụ iji degara onye ahụ akwụkwọ,
chọọ ozi ya ma ọ bụ kpọọ ya. Mkparịta ụka na-adịbeghị anya na-egosi
ole na ole ikpeazụ; pịa Ọzọ ka ị hụ ndị fọdụrụ, pịa Ntakịrị ka ị
zochie ha.
"""

["2026-09-28-1507-reply-box-recipients"]
title = "Igbe azịza dị mma karị"
text = """
Ndị nnata na-egosi ugbu a ya na foto ha, Cc na Bcc na-anọkọ n'otu bọtịnụ nta.
Imepe ndị nnata nke azịza na-eme ka igbe ahụ too elu nke ọma, ederede e hotara
na-emepe na-emechikwa nke ọma n'okpuru otu ahịrị dị ka ebili mmiri nke ị nwere
ike pịa ka ọ chịkọtaghachi ya.
"""

["2026-09-28-1620-softer-window-shadow"]
title = "Onyinyo windo dị nro na bọtịnụ ha buru ibu dịka nke KDE"
text = """
Site na ngwaike windo Katna, onyinyo gburugburu windo na-adị nkọ ma na-apụ zuo
oke, na-enweghị nsọtụ siri ike ọ hapụrụ n'akụkụ windo ahụ. Bọtịnụ windo ndị
ahụ bụ ugbu a buru ibu dịka nke KDE, ma nọdụ n'ebe dị anya site n'akụkụ windo
ahụ dịka o si dị anya site n'elu ya.
"""

["2026-09-28-1622-update-from-the-app"]
title = "Melite Katna site na ngwa ahụ"
text = """
Katna na-ebudata ugbu a ụdị ọhụrụ n'onwe ya ma na-agwa gị mgbe otu dị njikere.
Pịa Melite n'ọkwa ahụ ma ọ bụ na Maka Katna: Katna Mail ga-ekwu na ọ
ga-amaligharị, jụọ okwuntughe gị, wụnye imelite ahụ wee meghee ọzọ n'ebe ị
hapụrụ. Ntọala > Izugbe > Imelite na-agbanyụ nbudata na-akpaghị aka.
"""

["2026-09-28-1520-track-sealed-and-plain"]
title = "Soro ozi enyere aka, ezoro ezo na ederede nkịtị"
text = """
Anya ahụ ugbu a na-arụ ọrụ na ozi enyere aka na nke ezoro ezo kwa: e nyere
aka ma ọ bụ zoo ozi onye nnata ọ bụla n'onwe ya, ya mere mbinye aka ndị ahụ
na-adịgide adị. Ozi ederede nkịtị enweghị ike igosi mmeghe, ma a na-esochi
njikọ ya, ya mere ị ga-ahụ mgbe mmadụ soro otu njikọ.
"""

["2026-09-28-1834-reply-after-closed-window"]
title = "Nzaghachi na-amalite ọhụrụ mgbe emechiri windo ozi"
text = """
Ịmechi ozi e dere n'windo nke ya na-ejigide ya ugbu a na Ndebiri, ma
Zaa, Zaa mmadụ niile na Zigaa na-emepe ozi ọhụrụ ọzọ kama ịchọta nke
ochie.
"""

["2026-09-28-1852-frosted-search-bar"]
title = "Mmanya ọchụchọ nwere ntụ"
text = """
Mgbe ndabere ntụ dị n'ọrụ, mmanya ọchụchọ na-ekwe ka ntụ gafee dị ka
mmanya dị gburugburu ya, kama ịnọdụ n'elu ya dị ka mkpụrụ ọgwụ isi awọ
siri ike.
"""

["2026-09-28-1906-scroll-to-switch-accounts"]
title = "Mpịnye n'elu foto gị ka i gbanwee akaụntụ"
text = """
Mgbe pọintọ nọ n'elu foto akaụntụ dị n'elu aka nri, tụgharịa wiil òké ka
ị gaa n'akaụntụ na-esote ma ọ bụ nke gara aga, otu akaụntụ maka ọ bụla.
Foto ahụ na-agbagharị gaa n'akaụntụ ọhụrụ, dị ka aha ngwa si agbagharị
mgbe ị na-agbanwe ngwa, ma ịhọrọ akaụntụ site na kaadị na-agbagharị ya
otu ahụ.
"""

["2026-09-28-1918-many-recipients"]
title = "Ohere maka ndị nnata ọtụtụ"
text = """
Ndị nnata mgbe ahịrị mbụ na-eji obosara niile ugbu a, ma ndepụta ogologo
na-agbagharị n'ime ahịrị ole na ole, ka ozi ahụ nọrọ n'aka mgbe niile.
Hapụ ebe ahụ ọ na-eketụ n'otu ahịrị, dị ka “Kay, Sam, 19 ọzọ”; pịa ya ka
ị hụ ha niile ọzọ.
"""

["2026-09-28-1952-activity-by-account"]
title = "Akụkọ ihe omume maka otu akaụntụ"
text = """
Akụkọ ihe omume nwere ugbu a ihe nhọrọ akaụntụ n'akụkụ ụbọchị. Họrọ
akaụntụ niile ma ọ bụ otu n'ime ha, ozi a na-esochi, ọnụ ọgụgụ, eserese,
isiokwu na igbe ozi gị niile ga-eso ya gbanwee. Akụkọ ahụ na-agwa gị akaụntụ
ọ na-egosi ma na-echeta nhọrọ gị.
"""

["2026-09-28-2002-reader-arrows-always-shown"]
title = "Nke ọhụrụ na Nke ochie na-anọ mgbe niile n'ogwe ngwa ọrụ"
text = """
Ma ebe a na-agụ ihe dị warara ka o dị, ọnụọgụ na ube Nke ọhụrụ na Nke ochie
na-anọgide n'aka nri ogwe ngwa ọrụ ya. Bọtịnụ ndị ị na-ejikarị obere na-agbanwe
n'ime menu Ọzọ otu n'otu kama, gụnyere ihe mgbanwe nkọwa kọntaktị na agba mbụ.
"""

["2026-09-28-2026-large-files-drive"]
title = "Zipu faịlụ nke nha ọ bụla"
text = """
Na akaụntụ ebanyere na Google, faịlụ karịrị ókè ozi nke 25 MB na-aga na Google
Drive gị ozugbo ị gbakwunyere ya, ozi ahụ na-ebukwa njikọ ya, dị ka ọ dị na
Gmail. A na-ekekọrịta ya na ndị na-anabata ya mgbe ị pịrị Zipu; Katna na-ajụ
naanị ma a pụghị inye onye mmadụ ohere.
"""

["2026-09-28-2059-recipient-list-scrolling"]
title = "Ndepụta ndị nataara ozi toro ogologo dị nfe karị"
text = """
Ndepụta ogologo nke ndị nataara ozi nwere ogwe mmịgharị nke ya ugbu a, ọ
na-aga otu ahịrị n'otu oge, mkparịta ụka na-agafe naanị mgbe ndepụta ahụ ruru
njedebe ya. Ịgbakwunye ndị nataara ozi anaghịzi eme ka bọtịn ndị dị n'okpuru
wụpụ.
"""

["2026-09-28-2106-check-for-new-mail"]
title = "Lelee ozi ọhụrụ"
text = """
Pịa aka nri na folda ma ọ bụ akaụntụ dị na mpaghara folda maka "Lelee ozi
ọhụrụ", "Kaa akara na niile dị ka agụrụ", folda ọhụrụ n'ime ya, ma ọ bụ
"Kpochapụ Ihe mkpofu". "Mee ọhụrụ" dị n'elu ndepụta na-ewetakwa ozi site na
sava ugbu a. Mgbe Katna na-elele, akụ na-agba gburugburu na "Mee ọhụrụ" na
n'akụkụ Igbe ozi mbata, ma "Na-elele ozi ọhụrụ…" na-egosi n'elu ma ọ bụrụ na ọ
were ihe karịrị obere oge.
"""

["2026-09-28-2101-large-files-onedrive"]
title = "Nnukwu faịlụ site na OneDrive"
text = """
Akaụntụ Outlook.com, Hotmail na akaụntụ Microsoft ndị ọzọ na-ezipụkwa ugbu a
faịlụ karịrị ókè ozi dị ka akaụntụ Google si eme: faịlụ ahụ na-aga na
OneDrive gị ozugbo ị gbakwunyere ya, ozi ahụ na-ebukwa njikọ ya, dị ka ọ dị
na Outlook.
"""

["2026-09-28-2108-activity-checking"]
title = "Enweghị ọzọ ngosi Banye n'Ihe omume"
text = """
Ozugbo Katna malitere, Ihe omume na-egosi ogwe ibu dị gịrịgịrị mgbe ọ
na-enyocha akaụntụ Katna gị, kama ịjụ gị ka i banye nwa oge. Katna na-
enyochakwa akaụntụ ozugbo ọ malitere, ya mere ogologo oge ichere dị
mkpụmkpụ.
"""

["2026-09-28-2130-update-dialog"]
title = "Mmelite nwere windo nke ya"
text = """
Enyemaka > Lelee imelite na-emepe windo nke ya. Ọ na-egosi ụdị
gị n'akụkụ ụdị ọhụrụ ahụ, yana mgbe e mere nke ọ bụla, otú
nbudata ahụ si ukwuu, ihe ọhụrụ dị n'imelite ahụ na mgbanwe ọ
bụla kemgbe ụdị gị.
"""

["2026-09-28-2204-faster-start"]
title = "Mmalite ngwa ngwa, njikọ dị nro"
text = """
Katna Mail na-emepe igbe ozi mbata buru ibu ihe dị ka otu ụzọ
n'ụzọ anọ ngwa ngwa, ma mgbe a na-ebudata ozi ọ na-emelite
ndepụta ahụ otu ugboro maka otu ìgwè kama mgbe ozi ole na ole
ọ bụla, ya mere ịrị elu na ide ihe na-adịgide dị nro n'oge
njikọ.
"""

["2026-09-28-2111-link-addresses"]
title = "Hụ ebe njikọ na-eduga"
text = """
Debe pọyịntị n'elu njikọ dị n'ozi, ọ bụladị ihe ederede njikọ
ahụ na-ekwu, adreesị ọ na-emeghe n'ezie ga-egosi n'ala paịn
ọgụgụ, ma aha saịtị ahụ ga-apụta ìhè. Foto sitere n'aka onye
zitere ị na-egosi mgbe niile ga-ebu ugbu a naanị mgbe onye na-
enye gị ozi email kwadoro na ozi ahụ sitere n'aka ya n'ezie.
"""

["2026-09-29-0120-update-build-details"]
title = "Ihe ndị ọzọ banyere build gị"
text = """
Windo Mmelite ugbu a na-ekwu maka mgbanwe kachasị ọhụrụ nke
ụdị ọ bụla, na-ekwu ebe kọpị gị si bịa na oge ikpeazụ Katna
lelere imelite ndị dị.
"""

["2026-09-29-0213-coffee-button-play"]
title = "Obere egwuregwu na Zụtara m kọfị"
text = """
Debe ntụaka n'elu Zụtara m kọfị na Maka Katna: ọ na-arịọ kọfị, mgbe ahụ
tii, pizza, mgbe ahụ ọ dịghị ihe ọ bụla, ọ na-anabata mmiri, ma na-ekele
gị site n'ụfọdụ ihe na-egbuke egbuke. Ọ na-egwu otu ugboro oge ọ bụla,
ma na-anọ jụụ mgbe a belatara mmegharị.
"""

["2026-09-29-0215-update-checking-bar"]
title = "Windo Melite nke doro anya karịa"
text = """
Ogwe na-agba ọsọ na-egosi mgbe Katna na-elele imelite, ma ụdị ọhụrụ
na-eguzo ọtọ n'agba nke ya n'akụkụ nke ị nwere.
"""

["2026-09-29-0231-keys-beside-the-list"]
title = "Igodo na-eso paịn ị nọ na ya"
text = """
Mgbe mkparịta ụka mepere n'akụkụ ndepụta ahụ, akara akụ elu na ala
na-agagharị ugbu a na ndepụta ma na-egosi mkparịta ụka ọ bụla. Tab ma ọ
bụ Enter na-abanye n'ime mkparịta ụka, ebe akara akụ elu na ala
na-ebugharị ya; Esc ma ọ bụ Shift+Tab na-ekpọghachi gị na ndepụta. F6
na-agagharị n'etiti paịn, dị ka ọ dị n'ngwa ozi ndị ọzọ.
"""

["2026-09-29-0258-folders-slide-open"]
title = "Folda na-emepe ma na-emechi nke ọma"
text = """
Ịpị akara akụ dị n'akụkụ akaụntụ ma ọ bụ folda n'ime paịn folda ugbu a
na-emepe ma ọ bụ na-emechi ihe ọ nwere n'ụzọ na-esi nwayọọ, ọ bụghị
ịgbagwoju, ebe folda ndị dị n'okpuru na-esoro na-aga.
"""

["2026-09-29-0301-keys-menus-dialogs"]
title = "Folda, menu na igbe mkparịta ụka site n'igodo"
text = """
Shift+Tab ma ọ bụ F6 na-eru paịn folda, ebe akara akụ elu na ala
na-emepe folda ọ bụla, Enter na-ebugakwa gị n'ozi ya. Akara akụ elu na
ala na-agagharị n'menu ọ bụla, Enter na-ahọrọ. Shift+F10 ma ọ bụ igodo
Menu na-emepe menu pịa-aka-nri nke ozi ahọrọ. Igbe mkparịta ụka na-anara
igodo ozugbo ha mepere: Enter na-aza, Esc na-akagbu, Tab na-anọkwa n'ime
ha. N'ozi ọhụrụ, Ctrl+Enter na-ezipụ site n'ebe ọ bụla, Esc na-emechi
ya, na-echekwa ndebiri.
"""

["2026-09-29-0309-clock-tasks"]
title = "Ọrụ n'elekere desktọọpụ gị"
text = """
Pịa elekere iji tinye ọrụ ma kaa ọrụ ndị gụchara. Na Plasma, pịa elekere
aka nri wee họrọ Gosi Nhọrọ Ndị Ọzọ iji họrọ Katna Elekere Dijitalụ. Na
GNOME, kaadị Ọrụ na-apụta n'okpuru kalịnda elekere site n'ịbanye nke
ọzọ.
"""

["2026-09-29-0329-pages-by-keyboard"]
title = "Ibe site na kiiboodu na site na taskbar"
text = """
Ctrl+1 ruo Ctrl+5 na-agbanwe n'etiti Ozi, Kalịnda, Kọntaktị, Ọrụ na
Ndetu, dị ka ọ dị na Outlook, menu Gaa na-edekwa ha. Pịa Katna Mail aka
nri na taskbar iji mepee Kalịnda ma ọ bụ Kọntaktị ozugbo.
"""

["2026-09-29-0412-tasks-page"]
title = "Ọrụ Katna"
text = """
Pịa Ctrl+4 ma ọ bụ họrọ Ọrụ n'aka ekpe: ndepụta ọ bụla n'akụkụ ibe
ya dị ka Google Tasks, yana obere ọrụ, kpakpando, ụbọchị ikpeazụ,
nmegharị na nkọwa. Ndepụta na-ejikọ na Google Tasks na Microsoft
To Do, ọrụ sitere na elekere kọmputa ga-apụtakwa ebe a.
"""

["2026-09-29-0352-contacts"]
title = "Kọntaktị gị, si n'akaụntụ ọ bụla"
text = """
Kọntaktị dị n'akụkụ aka ekpe ugbu a na-egosi ndị echekwara n'akaụntụ
Gmail na Outlook gị na n'sava CardDAV, otu ugboro ọ bụla ọbụlagodi mgbe
akaụntụ ole na ole nwere ha, yana leebụl, foto na nkọwa ha. Aha na foto
ha na-apụtakwa n'ozi gị na n'echiche adreesị.
"""

["2026-09-29-0350-katna-notes"]
title = "Ndetu Katna"
text = """
Ndetu dị n'akụkụ ugbu a na-emepe Ndetu Katna, nke a haziri dị ka Google
Keep. Dee ndetu ma ọ bụ ndepụta nyocha, nye ya agba, kwụnye ya n'elu, ma
kaa akara na ihe ndị dị na bọọdụ ozugbo. A na-echekwa ndetu ka ị na-ede;
igbe ọchụchọ na-achọta ha; Ebe nchekwa na Ihe mkpofu na-edowe ha n'akụkụ,
yana ohere ịkagbu ya.
"""

["2026-09-29-0412-notes-sync"]
title = "Ndetu na ngwaọrụ ọ bụla"
text = """
Ndetu na-anọ ugbu a n'ime folda Notes nke akaụntụ ozi gị, ebe Notes nke
iPhone na Mac na-edowe nke ha, ya mere ha na-eso gị gaa ngwaọrụ gị ndị
ọzọ ma laghachikwute gị site na ha. Aha akaụntụ dị n'okpuru ndetu na-egosi
ebe echekwara ya; pịa ya ka ị bugharịa ndetu, ma ọ bụ debe ya naanị na
kọmputa a.
"""

["2026-09-29-0451-add-mail-to-tasks"]
title = "Tinye ozi na Ọrụ"
text = """
Pịa Shift+T, dị ka ọ dị na Gmail, ma ọ bụ họrọ Tinye na Ọrụ mgbe ị pịrị
ozi aka nri. Ọrụ ahụ na-were isiokwu ozi ahụ, ma akara Ozi ya dị na Ọrụ na-emepe
ozi ahụ ọzọ.
"""

["2026-09-29-0412-calendar"]
title = "Kalịnda gị, n'akụkụ ozi gị"
text = """
Kalịnda na-egosi kalịnda Google, Microsoft na ndị ọzọ gị site n'ụbọchị,
izu, onwa ma ọ bụ nhazi oge, yana igodo Google Calendar. Bọtịnụ kalịnda
n'aka nri ozi na-emepe atụmatụ ụbọchị ahụ, yana Sonye maka oku. Banye
ọzọ n'akaụntụ ka Katna nwee ike ịgụ kalịnda ya.
"""

["2026-09-29-0442-contacts-edit"]
title = "Mepụta ma gbanwee kọntaktị"
text = """
Mepụta kọntaktị na peeji Kọntaktị na-agbakwunye onye n'akaụntụ ị họọrọ,
Dezie na peeji kọntaktị na-agbanwe ya n'ebe ahụ kwa. Hichapụ nwere
Megharịa, Google na Outlook na-edebekwa kọntaktị ndị a hichapụrụ n'ọkpọ
ahịhịa ha nwa oge.
"""

["2026-09-29-0538-notes-on-mail"]
title = "Ndetu na ozi"
text = """
Pịa aka nri n'ozi ma ọ bụ mepee menu ⋮ ya, họrọ Tinye ndetu: ndetu
nwere isiokwu ozi ahụ ga-emeghe n'elu ozi ahụ. Ndetu ya ga-apụta
n'okpuru isiokwu ahụ mgbe ọ bụla ị meghegharịrị ozi ahụ, ma chip Ozi
nke ndetu ahụ na-eduga gị azụ n'ozi ahụ.
"""

["2026-09-29-0542-caldav-tasks"]
title = "Ọrụ dị na sava ozi gị"
text = """
Akaụntụ ndị na-abanye site na okwuntughe na-edebe ọrụ ha ugbu a na sava
ozi ha mgbe ọ na-enye CalDAV, ya mere ọrụ ndị ahụ na-apụtakwa n'ngwa
sava ahụ na n'ekwentị.
"""

["2026-09-29-0521-calendar-edit"]
title = "Tinye ma gbanwee ihe omume"
text = """
Pịa ma ọ bụ dọrọ na kalenda, ma ọ bụ pịa C, ka ịtinye ihe
omume. Dọrọ ihe omume ka ị kpugharịa ya ma ọ bụ dọrọ ọnụ ala
ya ka ịgbanwe ogologo ya, meghee ya ka ịgbanwe oge,
nmegharị, ihe ncheta, ndị ọbịa ma ọ bụ tinye ọkpụkpọ Meet ma
ọ bụ Teams. Zaa oku a kpọrọ gị site na Ee, Mba ma ọ bụ
Ikekwe. Megharịa na-eweghachi ihe niile.
"""

["2026-09-29-0546-calendar-any-account"]
title = "Kalenda sitere n'akaụntụ ndị ọzọ"
text = """
Katna na-achọtazi kalenda nke Yahoo, Zoho, iCloud, Fastmail,
GMX na akaụntụ ndị ọzọ ugbu a, ọbụlagodi mgbe ha nọ na sava
ọzọ karịa nke ozi ebe. Ọ na-anwa ụzọ kacha mma nke akaụntụ ọ
bụla mbụ, wee nwaa nke ọzọ mgbe nke ahụ anaghị arụ ọrụ.
"""

["2026-09-29-0625-tasks-today"]
title = "Taa n'ime Ọrụ"
text = """
Taa, n'okpuru Ọrụ niile, na-ekpokọta ihe ga-emecha taa na nke gafere oge
site n'ndepụta niile, ya na ndepụta nke ọ bụla dị n'ime ya. Ọrụ agbakwunyere
ebe ahụ ga-emecha taa.
"""

["2026-09-29-0631-invitation-card"]
title = "Oku n'ime ozi"
text = """
Oku na-apụta ugbu a dị ka kaadị n'elu ozi: mgbe na ebe,
onye nhazi ya, ụbọchị gị gburugburu ya na ihe ọ bụla na-
agbakọta akara, Sonye, na Ị ga-aga? Ee, Mba ma ọ bụ
Ikekwe, ebe ahụ n'onwe ya.
"""

["2026-09-29-0616-note-labels"]
title = "Leebụl na ndetu"
text = """
Bọtịnụ leebụl dị na ndetu na-etinye leebụl na ya, dị ka ọ dị na Keep. A
na-edepụta leebụl gị n'akụkụ Ndetu, nke ọ bụla na-egosi naanị ndetu ya,
Dezie leebụl na-agbanwe aha ha ma ọ bụ hichapụ ha, ya na Megharịa.
"""

["2026-09-29-0630-tasks-more-accounts"]
title = "Ọrụ site n'akaụntụ ndị ọzọ"
text = """
Ọrụ na-emekọrịtakwa ugbu a na Yahoo, Zoho, iCloud, Fastmail na akaụntụ
ndị ọzọ nke ọrụ ha dị na sava ọzọ karịa ozi ha. Katna na-anwale ụzọ
kacha mma nke akaụntụ ọ bụla ka ọ malite, ma na-echeta nke na-arụ ọrụ.
"""

["2026-09-29-0651-schedule-meeting"]
title = "Hazie nnọkọ site na mail"
text = """
Pịa aka nri na mkparịta ụka, ma ọ bụ mepee ⋮ họrọ Hazie nnọkọ:
ihe omume ọhụrụ ga-emepe na ibe Kalịnda, isiokwu ya ga-abụ aha
ya, ndị niile nọ na mkparịta ụka ga-abụkwa ndị ọbịa.
"""

["2026-09-29-0705-running-late"]
title = "Ana-egbu oge? Gwa mmadụ niile n'otu ntinye"
text = """
Ihe omume nwere ndị ọbịa nwere Zipụ ndị ọbịa email ugbu a, na
site n'otu awa tupu ọ malite, Ana m egbu oge: mail nye mmadụ
niile, site na akaụntụ kalịnda ahụ, dị njikere izipu.
"""

["2026-09-29-0607-contact-labels"]
title = "Leebụl kọntaktị"
text = """
Bọtịnụ leebụl dị na peeji kọntaktị na-emeghe ma na-emechi leebụl ma ọ bụ
na-emepụta nke ọhụrụ, ⋮ dị n'akụkụ leebụl na-agbanwe aha ya, na-ehichapụ
ya ma ọ bụ na-eziga ndị niile nọ na ya ozi. Leebụl na-adịgide n'otu
n'otu na Google Contacts na Outlook, mgbanwe ọ bụla nwekwara Megharịa.
"""

["2026-09-29-0640-add-to-contacts"]
title = "Tinye na kọntaktị site na Ozi"
text = """
Ogwe kọntaktị dị n'akụkụ mkparịta ụka nwere Tinye na kọntaktị maka onye
ị chekwabeghị: otu ogbugba na-echekwa aha ya, adreesị, na ekwentị, ọkwa
na ụlọ ọrụ sitere na mbinye aka ya, yana Megharịa. Maka onye echekwara,
otu bọtịnụ ahụ na-emeghe ya na peeji Kọntaktị.
"""

["2026-09-29-0720-focus-time"]
title = "Oge nlekwasị anya, n'èzí ọfịs na ebe ị na-arụ ọrụ"
text = """
Ugbu a, ihe omume ọhụrụ nwere ike ịbụ Oge nlekwasị anya, N'èzí ọfịs ma ọ
bụ Ebe ọrụ, dị ka ọ dị na Google Calendar: họrọ ya n'elu oge ndị ahụ.
Google na Outlook na-ahụ ha dị ka ha bụ, ha na-apụtakwa na Katna nwere
akara nke ha.
"""

["2026-09-29-0704-task-chips"]
title = "Ọrụ dị na ozi"
text = """
Ozi i mere ọrụ site na ya ga-egosi ụbọchị ọrụ ahụ kwesịrị ịgwụ n'ndepụta ugbu a,
na uhie ma ọ gafee oge. Pịa ya ka imepe ọrụ ahụ.
"""

["2026-09-29-0638-other-contacts"]
title = "Kọntaktị ndị ọzọ"
text = """
Kọntaktị nwere Kọntaktị ndị ọzọ ugbu a: ndị i zigara ozi site na Gmail
ma i chekwabeghị ha ma ọlị, dị ka Gmail si edobe ha. Chekwaa onye ọ bụla
site n'otu ihe mkpịa, na Megharịa, ma ọ bụ malite ide ha ozi.
"""

["2026-09-29-0745-answer-by-mail"]
title = "Zaghachi oku sitere n'akaụntụ ọ bụla"
text = """
Oku bịara n'akaụntụ na-enweghị kalịnda nwere Ee, Mba na Ikekwe ugbu a:
azịza gị na-aga n'aka onye nhazi site na ozi, kalịnda ya ga-akaritekwa
ya.
"""

["2026-09-29-0710-meeting-notes"]
title = "Ndetu nzuko"
text = """
Meghee ihe omume na Kalịnda wee họrọ Dee ndetu nzuko: ndetu nwere aha
ihe omume ga-emepe, ya na ndị bịara na ebe maka ihe a ga-eme dị njikere.
Kaadị ihe omume na-egosi ndetu ya, chip Ihe omume nke ndetu na-eduga gị
azụ n'ụbọchị ahụ.
"""

["2026-09-29-0751-go-to-pdf-page"]
title = "Gaa ozugbo na peeji PDF"
text = """
Nọmba peeji dị n'okpuru PDF bụ igbe ugbu a: pịa ya ma ọ bụ pịa Ctrl+G,
pịnye peeji wee pịa Enter ka i gaa ebe ahụ ozugbo.
"""

["2026-09-29-0715-tasks-on-calendar"]
title = "Ọrụ n’elu kalịnda"
text = """
Ọrụ ndị nwere ụbọchị e kwesịrị ime ha na-apụta ugbu a n’elu Kalịnda,
n’oge ha ma ọ bụ n’akụkụ ihe omume ụbọchị niile nke ụbọchị ahụ. Kaa
akara na ha n’ebe ahụ, pịa ka i meghee otu, ma ọ bụ dọkpụrụ ya gaa
ụbọchị ma ọ bụ oge ọzọ iji chekwaa oge ahụ maka ya.
"""

["2026-09-29-0756-event-reminders"]
title = "Ihe ncheta maka ihe omume gị"
text = """
Ihe omume na-echetara gị ugbu a site n’ọkwa, ọbụlagodi mgbe Katna
emechiri. Sonye na-emepe oku vidiyo, Yigharịa na-echetara gị ọzọ mgbe
nkeji ise gasịrị.
"""

["2026-09-29-0758-contacts-merge-import"]
title = "Jikọta ihe myirịta, bubata ma bupụ kọntaktị"
text = """
Kọntaktị nwere Dozie ma jikwaa ugbu a: Jikọta ma dozie chọtara ndị
echekwara ugboro abụọ (otu aha ma ọ bụ otu ọnụọgụ ekwentị) ma jikọta ha
n'otu pịa, yana Megharịa. Bubata na-ebubata ndị si na faịlụ vCard ma
hapụ onye ọ bụla echekwarala, Bupụ na-echekwa mmadụ niile, ma ọ bụ otu
leebụl, dị ka faịlụ vCard.
"""

["2026-09-29-0835-contacts-birthdays-qr-print"]
title = "Ụbọchị ọmụmụ na Kalịnda, kọntaktị dị ka koodu QR"
text = """
Ụbọchị ọmụmụ kọntaktị gị na-egosi ugbu a na Kalịnda, na kalịnda Ụbọchị
ọmụmụ ị nwere ike wepụ akara ya. Ibe kọntaktị nwere ike igosi kọntaktị
ahụ dị ka koodu QR igwefoto foonu na-echekwa, ma bipụta ya; Bipụta
n'okpuru Dozie ma jikwaa na-ebipụta onye ọ bụla e gosiri. Bubata ugbu a
na-agụkwa faịlụ CSV sitere na Google Contacts na Outlook, KRunner na
nchọta GNOME na-achọtakwa kọntaktị ị chekwara.
"""

["2026-09-29-0830-calendar-density-time-zones"]
title = "Njupụta kalịnda na mpaghara oge nke abụọ"
text = """
Bọtịnụ nhọrọ dị na Kalịnda na-ekpebi ogologo awa dị (Na-eso ihuenyo gị,
Ọ dị mma ma ọ bụ Nke dị nso) ma na-agbakwunye mpaghara oge nke abụọ n'akụkụ nke gị,
maka ndị ị na-ezute n'mba ọzọ.
"""

["2026-09-29-0809-video-calls"]
title = "Malite oku vidio site na ozi"
text = """
Pịa aka nri na mkparịta ụka, ma ọ bụ mepee ⋮ họrọ Malite oku vidio: oku ahụ na-
emepe, ozi ọhụrụ nwere njikọ ya na-aga n'aka mmadụ niile nọ na mkparịta ụka ahụ.
Akaụntụ Gmail na-eji Google Meet; ndị ọzọ na-enweta ụlọ Jitsi Meet. Ozi nwere njikọ
oku Meet, Teams, Zoom, Webex, Jitsi, WhatsApp ma ọ bụ Telegram ugbu a na-egosi
bọtịnụ Sonye.
"""

["2026-09-29-0815-note-line-task"]
title = "Mee ahịrị ndepụta nyocha ọrụ"
text = """
Tinye cursor n'ahịrị ndepụta nyocha dị na ndetu wee họrọ Mee ya ọrụ: ahịrị ahụ
na-aga na ọrụ gị. Mgbe ị pịrị Ndetu chip dị na ibe Ọrụ, ọ na-emepe ndetu ahụ ọzọ.
"""

["2026-09-29-0836-active-pane-stands-out"]
title = "Pane ị nọ na ya pụtara ìhè"
text = """
N'akụkụ ndepụta ahụ, naanị pane nwere ndabere igodo na-edebe ndò ya; ndepụta,
mkparịta ụka ma ọ bụ pane kọntaktị ị na-anaghị eji na-ada azụ na ọnụ ọnụ dị nro,
mgbanwe ahụ na-esokwa gị nwayọọ mgbe ị pịrị.
"""

["2026-09-29-0840-task-reminders"]
title = "Ncheta ọrụ na ọrụ na-emegharị"
text = """
Mepee ọrụ ma họrọ Chetara m: n'oge ahụ, otu awa ma ọ bụ otu ụbọchị tupu oge ahụ.
Ncheta ahụ na-apụta ọbụna mgbe Katna emechiri, yana Maa ka emechara na Yigharịa.
Ọ bụrụ na ị maa ọrụ na-emegharị ka emechara, ọ na-alọghachi n'ụbọchị ya
na-esote.
"""

["2026-09-29-0849-tasks-in-desktop-search"]
title = "Chọta ọrụ site na desktọọpụ"
text = """
Pịnye ụfọdụ okwu nke ọrụ na ọchụchọ KRunner ma ọ bụ GNOME, ọ ga-apụta n’okpuru Ọrụ.
Pịa Enter, Katna ga-emeghe ya ka i dezie ya.
"""

["2026-09-29-0832-clock-day-menu"]
title = "Tinye ihe omume na ọrụ site n'elekere desktọọpụ"
text = """
Na Katna Elekere Dijitalụ, pịa aka nri n'ụbọchị dị n'ọnwa iji tinye ọrụ ma ọ bụ ihe omume maka ụbọchị ahụ; ihe omume ahụ na-emeghe na Kalịnda Katna. Ịpị otu n'ime ihe omume gị na-emeghe Kalịnda n'ụbọchị ya.
"""

["2026-09-29-0855-type-an-event"]
title = "Pịnye ihe omume n'otu ahịrị"
text = """
Pịnye "Nri ehihie na Anita Fraịde elekere 1 ehihie na Cafe Mocha" ma ọ bụ "Standup kwa ụbọchị ọrụ 9:30" dị ka aha ihe omume ọhụrụ, Kalịnda ga-ejupụta ụbọchị, oge, ugboro ugboro na ebe ka ị na-ede.
"""

["2026-09-29-0915-year-view"]
title = "Hụ afọ niile"
text = """
Kalịnda nwere ọhụhụ Afọ: ọnwa iri na abụọ niile n'otu oge, yana ntụpọ n'okpuru ụbọchị ndị nwere ihe omume. Pịa Y, wee pịa ụbọchị ka i meghee ya.
"""

["2026-09-29-0930-share-free-times"]
title = "Kesaa oge ị nwere"
text = """
Ịhọrọ Kesaa oge ị nwere na nhọrọ Kalịnda na-amalite ozi na-edepụta mgbe ị nwere oge n'ụbọchị ọrụ ndị na-abịa, nke dị njikere izipụ onye ọ bụla.
"""

["2026-09-29-0952-calendar-sets"]
title = "Otu kalịnda"
text = """
Chekwaa kalịnda ndị ị na-egosi dị ka otu, dị ka "Ọrụ" ma ọ bụ "Ezinụlọ", site na + dị n'akụkụ Otu kalịnda. Ịpị otu ugboro n'otu otu na-egosi kalịnda ya ma zoo ndị ọzọ.
"""

["2026-09-29-0947-tasks-typed-quick-add"]
title = "Pịnye ọrụ n'otu ahịrị"
text = """
Tinye ọrụ dị ka "Kpọọ bank echi elekere 3 ehihie" ma ọ bụ "Wụsa osisi mmiri kwa Mọnde elekere 8 ụtụtụ", Ọrụ ga-edozi ụbọchị, oge na nmegharị maka gị, na-egosi ihe ọ ghọtara ka ị na-ede.
"""

["2026-09-29-1028-calendar-narrow-windows"]
title = "Kalịnda na windo dị warara"
text = """
Na windo dị warara, Kalịnda na-edebe Taa na ụbọchị ndị ahụ n'ogwe ya ma tinye ọhụhụ niile n'otu nhọrọ. Oge ihe omume anaghịzi agbaji n'etiti okwu, Tab na-erutekwa bọtịnụ na kalịnda ọ bụla.
"""

["2026-09-29-1039-contact-panel-tasks"]
title = "Ọrụ gị na ha, n'akụkụ ozi ha"
text = """
Mpempe onye kọntaktị dị n'akụkụ mkparịta ụka na-edepụta ugbu a ọrụ gị ndị na-emeghe e mere site n'ozi gị na onye ahụ. Kaa akara n'otu ka i mechaa ya, ma ọ bụ pịa ya ka i meghee ya n'Ọrụ.
"""

["2026-09-29-1046-contact-panel-meetings"]
title = "Nnọkọ gị ndị na-esote na ha"
text = """
Mpempe onye kọntaktị dị n'akụkụ mkparịta ụka na-egosi ugbu a nnọkọ gị ndị na-esote na onye ahụ. Pịa otu ka i meghee ya na Kalịnda.
"""

["2026-09-29-1051-tasks-drag-to-list"]
title = "Dọkpụrụ ọrụ gaa na ndepụta ọzọ"
text = """
N'Ọrụ, dọkpụrụ ọrụ gaa na ndepụta ọzọ ka i bugharịa ya ebe ahụ. Megharịa na-eweghachi ya.
"""

["2026-09-29-1111-tasks-search"]
title = "Chọọ ọrụ gị"
text = """
N'Ọrụ, igbe ọchụchọ dị n'elu na-achọ ugbu a n'ọrụ gị, ndetu ha na obere ọrụ ha, kama ozi gị.
"""

["2026-09-29-1130-calendar-search"]
title = "Chọọ ihe omume gị"
text = """
Na peeji Kalịnda, igbe ọchụchọ dị n'elu na-achọta ugbu a ihe omume site n'aha, ebe, ndetu ma ọ bụ ndị ọbịa, ma depụta ha n'usoro ụbọchị. Pịa otu ka i meghee ya n'ụbọchị ya; Esc na-akpọghachi gị na nsonaazụ ya.
"""

["2026-09-29-1045-note-formatting"]
title = "Nhazi na ndetu"
text = """
Pịa Nhazi na ndetu maka Isiokwu 1, Isiokwu 2, ọkpụrụkpụ, mkpọda na akara n'okpuru, dị ka na Keep. Bọọdụ na-egosikwa ya, ọ na-esokwa ndetu ahụ gaa na folda Notes nke akaụntụ ozi gị, ebe nhazi sitere na iPhone na-alaghachi ugbu a otu o si dị.
"""

["2026-09-29-0934-custom-days-view"]
title = "Gosi naanị ụbọchị ole na ole"
text = """
Kalịnda nwere Ọhụhụ ahaziri n'akụkụ Nhazi oge: ụbọchị 4 site n'ụbọchị ị họọrọ, ma ọ bụ site na 2 ruo 7. Pịa X, ma họrọ ole n'ime Nhọrọ.
"""

["2026-09-29-0939-events-in-desktop-search"]
title = "Chọta ihe omume site na desktọọpụ"
text = """
Pịnye aha ihe omume na KRunner ma ọ bụ ọchụchọ GNOME ka ịhụ mgbe ọ ga-eme ọzọ, ma pịa Enter ka i meghee ụbọchị ahụ na Kalịnda.
"""

["2026-09-29-1102-apps-on-a-phone"]
title = "Kalịnda, Kọntaktị, Ọrụ na Ndetu na ekwentị"
text = """
Na windo dị warara, peeji ndị a na-adaba ugbu a na ihuenyo dị ka Ozi si eme: ndepụta n'akụkụ ha na-emepe site na bọtịnụ menu, Kọntaktị na-egosi aha ọ bụla na adreesị n'okpuru ya, Ndetu na-edokwa kaadị abụọ n'ahịrị.
"""

["2026-09-29-1236-agenda-button-top-bar"]
title = "Usoro ihe omume ụbọchị, site n'ogwe dị n'elu"
text = """
Bọtịnụ na-egosi usoro ihe omume ụbọchị n'akụkụ ozi gị dị ugbu a n'ogwe dị n'elu, n'akụkụ bọtịnụ asụsụ, ozi gị na-enwetakwa ohere nke ogwe dị n'akụkụ were na mbụ.
"""

["2026-09-29-1243-hide-side-panel-on-every-page"]
title = "Zoo ogwe n'akụkụ na peeji ọ bụla"
text = """
Bọtịnụ menu dị n'elu aka ekpe na-apịaji ugbu a ogwe n'akụkụ na Kalịnda, Kọntaktị, Ọrụ na Ndetu kwa, na-esegharị ya pụọ dị ka ọ na-eme folda Ozi. Peeji ọ bụla na-echeta ma ị hapụrụ ya ka o meghe.
"""

["2026-09-29-1251-app-menu-on-a-phone"]
title = "Menu isi na ekwentị"
text = """
Na ekwentị, menu isi dị n'azụ foto akaụntụ na-emepe Faịlụ, Dezie, Lelee na ndị ọzọ n'otu ebe ahụ, ya na ahịrị Laghachi n'elu, kama ịpụ n'akụkụ ihuenyo.
"""

["2026-09-29-1256-calendar-every-account"]
title = "Akaụntụ ọ bụla na Kalịnda"
text = """
Ndepụta n'akụkụ Kalịnda na-egosi ugbu a akaụntụ gị niile. Mgbe kalịnda nke otu akaụntụ enweghị ike ibu, ahịrị dị n'okpuru ya na-akọwa ihe kpatara ya, ya na otu pịa na-edozi ya, dị ka “Banye ọzọ iji gosi kalịnda”.
"""

["2026-09-29-1300-switch-account-stay-on-page"]
title = "Gbanwee akaụntụ n'ahapụghị peeji"
text = """
Ịhọrọ akaụntụ ọzọ site na foto gị dị n'elu aka nri, ma ọ bụ ịtụgharị wiil n'elu ya, na-ahapụ gị ugbu a na Kalịnda, Ọrụ, Kọntaktị ma ọ bụ Ndetu. Ihe ọhụrụ na-aga n'akaụntụ ahụ, Ozi na-egosikwa ya mgbe ị laghachiri.
"""

["2026-09-29-1317-contacts-every-account"]
title = "Akaụntụ ọ bụla na Kọntaktị"
text = """
Kọntaktị na-edepụta ugbu a akaụntụ gị niile n'okpuru Akaụntụ, ya na ọnụọgụ mmadụ nke ọ bụla nwere; pịa otu ka ịhụ naanị ndị nke ya. Mgbe kọntaktị nke akaụntụ enweghị ike ibu, ahịrị dị n'okpuru ya na-akọwa ihe kpatara ya, ya na otu pịa na-edozi ya, dị ka “Banye ọzọ iji gosi kọntaktị” ma ọ bụ “Nwaa ọzọ”.
"""

["2026-09-29-1327-tasks-every-account"]
title = "Akaụntụ ọ bụla na peeji Ọrụ"
text = """
Akaụntụ ọ bụla na-egosi ugbu a n'ogwe n'akụkụ nke Ọrụ. Mgbe ọrụ nke akaụntụ enweghị ike ibu, ahịrị dị n'okpuru ya na-akọwa ihe kpatara ya, ya na otu pịa iji dozie ya: banye ọzọ, ma ọ bụ nwaa ọzọ.
"""

["2026-09-29-1404-compose-dialogs-in-view"]
title = "Ajụjụ tupu izipu na-anọ n'anya"
text = """
Ajụjụ dị ka “Ị bu n'obi ịgbakwunye faịlụ?” na-emepe ugbu a n'etiti windo, n'agbanyeghị ogologo ozi ị na-ede ma ọ bụ na-ezipụ, ya mere ha anaghị ezo n'ala peeji ahụ. Enter na-aza site na bọtịnụ isi, Esc na-akpọghachi gị n'ozi ahụ.
"""

["2026-09-29-1530-mark-up-pdfs"]
title = "Tinye akara na PDF"
text = """
Pịa pen dị na onye nlele PDF iji mee ka ederede pụta ìhè, kpọọ akara n'okpuru ya, akara ebili mmiri ma ọ bụ gbachapụ ya, ma ọ bụ see ihe na pen, na agba ị họọrọ. Megharịa na Ctrl+Z, hichapụ akara na ihe nhichapụ, wee chekwaa mbipụta nwere akara. Mgbakwunye mbụ ahụ ka dị ka ọ dị.
"""

["2026-09-29-1557-calendar-accounts-why"]
title = "Ihe mere akaụntụ enweghị kalịnda"
text = """
Mgbe kalịnda nke akaụntụ anaghị egosi, Kalịnda na-ekwu ugbu a ihe sava zara, “Nwaa ọzọ” na-achọkwa ha ọzọ ozugbo. Akaụntụ Gmail ma ọ bụ Outlook e ji okwuntughe tinye na-enye ohere ịbanye na Google ma ọ bụ Microsoft, nke kalịnda ha chọrọ.
"""

["2026-09-29-1610-one-checkbox"]
title = "Igbe nlele na-akara"
text = """
Igbe nlele ọ bụla na Katna Mail nwere ugbu a otu nha dị ka bọtịnụ gburugburu dị n'akụkụ ya. Akara ya na-ese onwe ya mgbe ị pịrị ya ma na-ehichapụ mgbe ị kagharịrị ya, n'otu ụzọ na Ntọala, ndepụta ozi, Kalịnda, Kọntaktị, Ndetu na igbe mkparịta ụka.
"""

["2026-09-29-1622-right-click-menu-fits"]
title = "Menu pịa aka nri dị mkpụmkpụ nke na-adaba mgbe niile"
text = """
Menu pịa aka nri nke ndepụta ozi na-edebe omume kwa ụbọchị n'elu ma tinye ndị ọzọ n'okpuru “Soro ya” (ọrụ, ndetu, nzukọ, oku) na “Ndị ọzọ” (spam, mkpa, ntụkwasị). Ọ na-emepe ebe ị pịrị ma na-anọ n'ime windo; na windo dị mkpụmkpụ ma ọ bụ warara, menu nta na-emepe n'ọnọdụ menu ahụ.
"""

["2026-09-29-1627-contacts-accounts-why"]
title = "Ihe mere akaụntụ enweghị kọntaktị"
text = """
Mgbe kọntaktị nke akaụntụ anaghị egosi, Kọntaktị na-ekwu ugbu a ihe sava zara, “Nwaa ọzọ” na-achọkwa ha ọzọ ozugbo. Akaụntụ Gmail ma ọ bụ Outlook e ji okwuntughe tinye na-enye ohere ịbanye na Google ma ọ bụ Microsoft, nke kọntaktị ha chọrọ.
"""

["2026-09-29-1640-search-box-focus"]
title = "Igbe ọchụchọ na-egosi mgbe ọ na-arụ ọrụ"
text = """
Igbe ọchụchọ dị n'elu na-enweta ọnụ agba ntụpọ mgbe ị na-ede na ya, dị ka ogige ọ bụla ọzọ, ntụziaka Ctrl+F ya na-ewepụkwa onwe ya ruo mgbe ị hapụrụ ya ka ọ tọgbọ chakoo.
"""

["2026-09-29-1612-tasks-board-rows"]
title = "Ndepụta ọrụ ọ bụla n'anya"
text = """
“Ọrụ niile” na-egosi ugbu a ọtụtụ ndepụta n'akụkụ ibe ha dị ka windo nwere ike ịnabata, ya na ahịrị ndị ọzọ n'okpuru, ka e wee ruo ndepụta ọ bụla. Ndepụta ọhụrụ na-apụta n'anya ozugbo ị mere ya.
"""

["2026-09-29-1653-smooth-attachment-paging"]
title = "Ịgafe n'ụzọ dị nro n'etiti mgbakwunye"
text = """
Ịga na mgbakwunye na-esote ma ọ bụ nke gara aga n'ime onye nlele site na akụ anaghịzi eme ka ihuenyo na-amụnye amụnye. Onye nlele na-anọgide na-emeghe, faịlụ na-esote na-anọchikwa nke gara aga ozugbo ọ dị njikere.
"""

["2026-09-29-1656-drag-notes"]
title = "Dọrọ ndetu ka ị hazie ha"
text = """
Dọrọ ndetu na bọọdụ Ndetu iji bugharịa ya, dị ka na Keep. Ndetu ndị ọzọ na-amịfe n'akụkụ iji nye ohere, ọ na-anọkwa ebe ị tụbara ya. Ctrl+Z na-eweghachi ya. Kaadị na-anọ ugbu a nke ọma n'ogidi ha, na-enweghị oghere n'okpuru ndetu dị mkpụmkpụ.
"""

["2026-09-29-1707-calendar-right-click"]
title = "Pịa aka nri na Kalịnda"
text = """
Pịa aka nri n'oge efu ma ọ bụ ụbọchị iji tinye ihe omume, oge nlekwasị anya ma ọ bụ n'èzí ọfịs n'ebe ahụ. Pịa aka nri n'ihe omume iji dezie, mepụta oyiri, hichapụ, zaa, sonye, zipụ ndị ọbịa email, nye ya agba ma ọ bụ bugara ya na kalịnda ọzọ, na n'ọrụ iji kaa ya dị ka emechara, tinye ya kpakpando, nye ya ụbọchị ọzọ ma ọ bụ hichapụ ya. Mwepu na-eweghachi mgbanwe.
"""

["2026-09-29-1725-pdf-notes-and-text"]
title = "Ndetu na ederede na PDF"
text = """
Ịtinye akara na PDF ugbu a nwere ndetu nrapado na igbe ederede: pịa peeji ahụ, pịnye, ma pịa Ctrl+Enter. Bugharịa ntụaka n'elu ndetu iji gụọ ya, ma ọ bụ pịa ya iji gbanwee ya. Zaa na-eziga mbipụta gị nwere akara ozugbo n'ime nzaghachi na ozi ahụ.
"""

["2026-09-29-1657-tasks-drag-to-place"]
title = "Dọrọ ọrụ ebe ị chọrọ ha"
text = """
Dọrọ ọrụ elu ma ọ bụ ala na ndepụta ya, ma ọ bụ banye n'ndepụta ọzọ, ọrụ ndị nọ ebe ahụ ga-esebe n'akụkụ iji gosi ebe ọ ga-adakwasị. Google Tasks na-edebe usoro ọhụrụ ahụ na ekwentị gị kwa, ma Mebie na-eweghachi ọrụ ahụ.
"""

["2026-09-29-1719-calendar-task-tab"]
title = "Tinye ọrụ site na Kalịnda"
text = """
Kaadị ihe omume ọhụrụ nwere taabụ Ọrụ, dịka na Google Calendar. Pịa oge, họrọ Ọrụ, ma isiokwu, ụbọchị na oge ga-aghọ ọrụ n'ndepụta ị họọrọ, ya na nkọwa ma ọ bụrụ na ị chọrọ.
"""

["2026-09-29-1758-calendar-new-task-here"]
title = "Tinye ọrụ site na Kalịnda"
text = """
Pịa aka nri n'oge efu ma ọ bụ ụbọchị na Kalịnda ma họrọ Ọrụ iji tinye ọrụ n'ebe ahụ. Kaadị ihe omume ọhụrụ na-emepe na taabụ Ọrụ ya, ya na ụbọchị na oge ahụ ejupụtara.
"""

["2026-09-30-0113-calendar-server-unreachable"]
title = "Kalịnda na-achọ ọzọ mgbe sava dị nwayọ"
text = """
Mgbe sava kalịnda nke akaụntụ azaghị n'oge, Kalịnda na-ekwu nke a ugbu a, na ma njikọ ahụ ma ọ bụ nkwekọrịta echekwara kwụsịrị, kama "Ahụghị kalịnda ọ bụla". Ọ na-anwa ọzọ n'ime nkeji ole na ole kama ọtụtụ awa.
"""

["2026-09-30-0123-contact-files-fill"]
title = "Faịlụ kọntaktị na-egosi ibudata ha"
text = """
Faịlụ dị na panel kọntaktị nke ozi ya na-adịbeghị na kọmputa a na-ejupụta
ugbu a ka ọ na-ebudata, dịka mgbakwunye ndị dị na ndepụta na-eme, wee meghee.
"""

["2026-09-30-0135-new-account-mail-shows-as-it-arrives"]
title = "Ozi akaụntụ ọhụrụ na-apụta ka ọ na-abata"
text = """
Mgbe ị tinyere akaụntụ, igbe ozi mbata ya na-ebudata mbụ ma na-ejupụta ka
ị na-ele, kama ịnọgide na "Na-enweta ozi gị…" ruo mgbe folda niile gwụrụ.
Folda ndị ọzọ na-ejupụta n'otu ụzọ ahụ.
"""

["2026-09-30-0159-checkbox-matches-icons"]
title = "Igbe nlele kwụ otu ọkwa na akara ngosi"
text = """
Igbe nlele dị ntakịrị ugbu a, otu nha dị ka akara ngosi kpakpando na leebụl dị n'akụkụ ha na ndepụta ozi. Ọ ka dị mfe ịpị ha, akara ya ka na-esekwa onwe ya.
"""

["2026-09-30-0201-zoho-calendars"]
title = "Kalịnda Zoho site n'njikọ nke Zoho n'onwe ya"
text = """
Zoho na-enye ngwa ndị ọzọ kalịnda site n'ọdụ (port) nke ọtụtụ netwọk
na-egbochi, ya mere mgbe “Banye na Zoho” gasịrị, Kalịnda na-agụ ha site
na API nke Zoho n'onwe ya kama. Ihe omume Zoho gị na-egosi n'akụkụ kalịnda
gị ndị ọzọ; ịgbanwe ha site na Katna ga-abịa ma emechaa.
"""

