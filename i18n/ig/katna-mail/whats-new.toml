dịkwa ka iko gbara ụzụzụ. Ụzụzụ ahụ na-agbaso Ntọala > Nnwale; ma ọ bụrụ
na ọ nweghị, ihe nlele ahụ na-eji ákwà ojii nkịtị.
"""

["2026-09-30-1752-touchpad-glide"]
title = "Mkpali touchpad na-amị amị"
text = """
Mkpali ngwa ngwa nke mkpịsị aka abụọ na touchpad na-aga n'ihu na-akpụgharị
ma na-ebelata ọsọ, dị ka n'ngwa ndị ọzọ. Metụ touchpad ọzọ iji kwụsị ya.
Na Wayland.
"""

["2026-09-30-1800-inbox-tabs-in-top-row"]
title = "Taabụ igbe ozi mbata n'ahịrị elu"
text = """
Isi, Nkwalite, Mmekọrịta ọha na taabụ igbe ozi mbata ndị ọzọ na-anọ ugbu
a n'ogwe gburugburu n'ahịrị elu nke ndepụta, nke ọ bụla nwere ọnụọgụ
nwere agba nke ozi ya a gụghị. Ìhè nhọrọ na-amị gaa na taabụ ị họrọ,
ịpị taabụ mepere emepe na-alaghachikwa ndepụta ya n'elu. Mgbe ndepụta dị
warara, ogwe ahụ na-ewere ahịrị nke ya ma gosi akara ngosi, na-edobe aha
taabụ mepere emepe; na ekwentị ọ na-anọ n'ogwe ndepụta, ya na Mee ọhụrụ
na menu Ọzọ.
"""

["2026-09-30-1805-account-menu"]
title = "Ozi akaụntụ na menu ịpị aka nri"
text = """
Pịa aka nri n'aha akaụntụ na ndepụta folda, ma ọ bụ igbe ozi mbata ya
n'okpuru Akaụntụ niile, iji hụ adreesị ya, ma ọ na-emekọrịta na mgbe e
lelere ya ikpeazụ, na oke nchekwa ọ na-eji. Site ebe ahụ ị nwere ike
ilele igbe ozi mbata ahụ, dee ozi ọhụrụ site n'akaụntụ ahụ, mepee
ntọala ya, ma ọ bụ banye ọzọ mgbe ịbanye agwụla.
"""

["2026-09-30-1819-glass-search-box"]
title = "Igbe ọchụchọ yiri iko"
text = """
Mgbe azụ gbara ụzụzụ gbanyere, igbe ọchụchọ na-adị ka iko gbara ụzụzụ
nwere nsọtụ dị nro mgbe ị naghị eji ya, ma na-esi ike mgbe ị pịrị n'ime
ya ide ihe.
"""

["2026-09-30-1820-search-cancel-restores"]
title = "Kagbuo ọchụchọ, nweta ozi gị azụ"
text = """
Esc ma ọ bụ ihichapụ igbe ọchụchọ na-alaghachi ugbu a ebe ị nọ: otu folda
ahụ, otu ebe na ndepụta na ozi i meghere. Mepee nsonaazụ kama, ọchụchọ
ahụ na-ewere ọnọdụ dị ka ọ dị na mbụ.
"""

["2026-09-30-1840-first-run-window"]
title = "Mmalite mbụ dị mma karịa"
text = """
Ka ị na-edozi Katna Mail, windo ahụ na-egosi n'azụ ibe ndozi n'okpuru
ákwà dị nro: ngwa, Dee na igbe ọchụchọ, ya na ihe nnọchi dị nro ebe
folda na ozi gị ga-apụta. Nzọụkwụ ọhụrụ na-enye akaụntụ Katna ma depụta
