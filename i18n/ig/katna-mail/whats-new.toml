Taabụ igbe ozi mbata na-anọ ugbu a n'etiti ahịrị elu nke ndepụta, na-akpụ
n'akụkụ naanị ruo ebe bọtịnụ ya chọrọ.
"""

["2026-09-30-1945-page-box-arrow-keys"]
title = "Igodo akụ n'igbe peeji"
text = """
Na PDF, pịa nọmba peeji ma pịa Elu ma ọ bụ Ala iji laghachi otu peeji ma
ọ bụ gaa n'ihu. Jide igodo ahụ iji gafee peeji ngwa ngwa.
"""

["2026-09-30-1952-phone-bar-labels"]
title = "Aha ngwa na ekwentị na-agbaso ntọala gị"
text = """
Mgbe aha ngwa gbanyụrụ na Ntọala, ogwe dị n'okpuru windo nha ekwentị
na-egosi naanị akara ngosi ugbu a, n'etiti, dị ka ogwe akụkụ na-eme.
"""

["2026-09-30-1955-account-menu-icons"]
title = "Ntọala na asụsụ na menu akaụntụ"
text = """
Menu dị n'okpuru foto akaụntụ gị na-emepe ugbu a ya na ahịrị akara ngosi:
mepee Ntọala ma ọ bụ gbanwee asụsụ. Ọkọlọtọ asụsụ ahụ ahapụla ogwe elu
iji nye ohere.
"""

["2026-09-30-2001-phone-tabs-fold"]
title = "Taabụ igbe ozi mbata niile na-anọ nso"
text = """
Mgbe windo dị warara, taabụ igbe ozi mbata na-apịaji nke ọma kama izo:
aha na-aghọ akara ngosi buru ibu, mgbe ahụ ọnụọgụ na-ewepụ onwe ha. Na
ekwentị, taabụ na-agbasa n'ogwe ahụ dum, dị mfe ịpị, ya na Ọzọ na njedebe
otu ogwe ahụ.
"""

["2026-09-30-2012-fit-and-page-arrows"]
title = "Dabara, akụ peeji na ihe ndị ọzọ n'ihe nlele"
text = """
Ihe nlele mgbakwunye nwere bọtịnụ Dabara: peeji PDF na-adaba n'ogo windo,
foto na windo, akwụkwọ, slaịdị na spredshiit n'obosara ya. Foto na-enweta
Nha n'ezie, a pụkwara ịtụgharị ha. Dobe ntụnye n'elu igbe peeji maka
obere akụ iji laghachi otu peeji ma ọ bụ gaa n'ihu, slaịdị na-enwetakwa
igbe nke ha.
"""

["2026-09-30-2019-folder-icon-colours"]
title = "Akara ngosi folda nwere agba"
text = """
Akara ngosi nke paịn folda nwere agba ugbu a na-ekwu ihe folda ọ bụla
jidere: A gụghị acha anụnụ anụnụ, Nwere kpakpando edo edo, Dị mkpa
amber, Ezigara akwụkwọ ndụ, Spam uhie, Ndebiri odo odo, Igbe ozi mbata
n'agba mmesi ike nke desktọpụ gị. Ọnụọgụ ozi na-anọ n'obere mpekere dị
nro.
"""

["2026-09-30-2040-tabs-no-slide"]
title = "Taabụ igbe ozi mbata dị ngwa karịa"
text = """
Ịpị taabụ igbe ozi mbata na-enye ya ìhè nhọrọ ozugbo ugbu a, ya na naanị
ebili mmiri nke ịpị ahụ, kama ime ka ìhè ahụ mịa gafee taabụ ndị ọzọ.
"""

["2026-10-01-0145-files-tidy"]
title = "Peeji Faịlụ dị ọcha karịa"
text = """
Ọnụọgụ dị n'akụkụ ụdị faịlụ ọ bụla na akaụntụ ọ bụla na-anọ ugbu a n'otu
obere mpekere ahụ dị ka ọnụọgụ folda na Ozi. Ahịrị dị n'okpuru aha ibe
ahụ na ahịrị faịlụ na-amalitekwa ma na-ejedebe n'otu nsọtụ.
"""

["2026-10-01-0147-today-marker-fits"]
title = "Ụbọchị taa na-adaba n'akara ya"
text = """
Na nlele Onwa nke Kalịnda, akara taa na-ejide ụbọchị ahụ dum ugbu a. N'ụbọchị
mbụ, ọ na-aghọ mpekere gburugburu "01 Okt" kama obere okirikiri aha ahụ
gafere.
"""

["2026-10-01-0208-tab-counts-stay"]
title = "Ọnụọgụ taabụ na-anọ ebe ha nọ"
text = """
Imepe taabụ igbe ozi mbata anaghịzi eme ka ogwe taabụ wụlie. Taabụ mepere
emepe na-edobe ọnụọgụ ozi ọhụrụ ya, nke na-eji nwayọọ ghọọ ntụ dị jụụ,
ọnụọgụ ahụ na-apịajikwa nke ọma ozugbo ị gụchara ihe niile dị na taabụ
ahụ.
"""

["2026-10-01-0225-files-keyboard"]
title = "Gafee faịlụ gị site na keyboard"
text = """
Na peeji Faịlụ, igodo akụ na-aga n'etiti faịlụ ugbu a, Home na End na-aga
na nke mbụ na nke ikpeazụ, Enter na-emepekwa otu. N'ihe nlele e meghere
site ebe ahụ, akụ na-aga na faịlụ na-esote na peeji ahụ, n'agbanyeghị
ozi o sooro bịa; Shift na akụ na-anọ na mgbakwunye nke otu ozi ahụ.
"""

["2026-10-01-0254-files-dates"]
title = "Họrọ ụbọchị na peeji Faịlụ"
text = """
Mpekere oge na peeji Faịlụ na-emepe ugbu a kalịnda ọnwa abụọ ya na nhọrọ
ngwa ngwa dị ka Izu gara aga na Ọnwa a. Pịa otu ụbọchị, ma ọ bụ dọrọ site
n'otu ụbọchị gaa n'ọzọ, faịlụ na-esokwa ka ị na-adọrọ. Mgbe ahụ tụgharịa
wiil ụmụ oke n'elu mpekere ahụ iji kpụga otu ogologo oge ahụ n'azụ ma ọ
bụ n'ihu.
"""

["2026-10-01-0256-color-schemes"]
title = "Atụmatụ agba na agba mmesi ike"
text = """
Ntọala > Ọdịdị nwere ugbu a Ọnọdụ, Agba na Agba mmesi ike dị ka nhọrọ
dị iche iche. Họrọ ìhè ma ọ bụ ọchịchịrị, wee họrọ otu n'ime atụmatụ agba
14, dị ka Clear, Nord, Solarized ma ọ bụ Catppuccin, ma ọ bụ debe nke
desktọpụ gị. Nke ọ bụla na-arụ ọrụ n'ìhè na n'ọchịchịrị, agba mmesi ike
ọ bụla nwekwara ike ịnọ n'elu ya.
"""

["2026-10-01-0310-badge-counts-what-notifies"]
title = "Ọnụọgụ ogwe ọrụ dabara n'ọkwa gị"
text = """
Ọnụọgụ ndị a gụghị na ogwe ọrụ na tree na-agụ ugbu a otu ozi ahụ na-enye
gị ọkwa: taabụ Isi nke Igbe ozi mbata gị. Nkwalite, Mmekọrịta ọha,
Mmelite na Ọgbakọ anaghịzi agbakwunye na ya.
"""

["2026-10-01-0312-quiet-selected-row"]
title = "Folda mepere emepe dị jụụ karịa"
text = """
Folda mepere emepe na Ozi, na nlele mepere emepe na Kọntaktị, Ọrụ, Ndetu
na Faịlụ, ka a na-aka akara ugbu a na ntụ dị nro kama agba mmesi ike,
ka Dee na ogwe ngwa pụta ìhè, akara ngosi folda edobekwa agba nke ha.
"""

["2026-10-01-0315-desktop-schemes"]
title = "Atụmatụ agba desktọpụ gị"
text = """
Ntọala > Ọdịdị > Agba na-edepụtakwa atụmatụ desktọpụ gị: atụmatụ agba
ọ bụla etinyere na KDE Plasma, na Windows agba ya na isiokwu Contrast ya.
Sistemụ na-arụ ọrụ n'ìhè na n'ọchịchịrị na KDE kwa ugbu a, na-eji onye
òtù ìhè ma ọ bụ ọchịchịrị nke atụmatụ gị, Katna na-agbasokwa agba mmesi
ike nke Windows.
"""

["2026-10-01-0329-mute-folders"]
title = "Gbachie folda, taabụ ma ọ bụ akaụntụ"
text = """
Mgbịrịgba dị n'elu ndepụta na-agbachi folda mepere emepe ma ọ bụ taabụ
Igbe ozi mbata maka otu awa, ruo echi ụtụtụ, ma ọ bụ ruo mgbe i gbanyere
ya ọzọ. Pịa aka nri na folda ma ọ bụ akaụntụ maka otu ihe ahụ. Ntọala ›
Ọkwa na-egosi folda ndị na-enye ọkwa na ndị na-agụ na ogwe ọrụ, na ihe
niile a gbachiri.
"""

["2026-10-01-0335-tray-style"]
title = "Akara ngosi tree n'agba ma ọ bụ otu agba"
text = """
Ntọala > Izugbe > Desktọpụ > Akara ngosi tree n'agba na-ahọrọ agba Katna
ma ọ bụ otu agba dị ka akara ngosi ndị ọzọ nke panel. Otu agba na-anọ otu
agba mgbe ozi a gụghị dị, ọnụọgụ ndị a gụghị na-achakwa uhie mgbe niile.
Na Linux, akara ngosi tree bụ otu agba na ndabara; na Windows ọ nwere
agba.
"""

["2026-10-01-0354-mute-conversations"]
title = "Gbachie mkparịta ụka ma ọ bụ onye zitere"
text = """
Mgbịrịgba dị n'elu mkparịta ụka mepere emepe na-agbachi ya: nzaghachi
ọhụrụ anaghịzi enye gị ọkwa ma ọ bụ agbakwunye na ọnụọgụ ogwe ọrụ,
mgbịrịgba nwere ahịrị gafere ya na-akakwa ya akara na ndepụta. Pịa aka nri
na mkparịta ụka maka Mee ka mkparịta ụka gbachi nkịtị ma ọ bụ Mee ka onye
zitere gbachi nkịtị,
ma ọ bụ pịa M.
"""

["2026-10-01-0410-your-color-schemes"]
title = "Mepụta atụmatụ agba nke gị"
text = """
Ntọala > Ọdịdị > Agba > Hazie na-edepụta atụmatụ ị na-eji n'ime ihe
ndezi: gbanwee agba ya asatọ ọ bụla n'akụkụ ìhè na nke ọchịchịrị, hụ
windo ozi n'ime ha, Katna na-agwakwa gị ihe ga-esi ike ịgụ. Bubata
na-anabata faịlụ atụmatụ agba Katna ma ọ bụ KDE, ịpị aka nri n'atụmatụ
gị na-edezi ya, na-emepụta ọzọ ya, na-ebupụ ya ma ọ bụ na-ehichapụ ya.
"""

["2026-10-01-0527-calendar-opens-on-week"]
title = "Kalịnda na-emepe na Izu"
text = """
Katna Calendar na-emepe ọzọ na nlele Izu, ya na ụbọchị ndị na-abịa n'awa.
Onwa, Ụbọchị, Afọ na ndị ọzọ dị otu ịpị n'ogwe elu.
"""

["2026-10-01-0552-lighter-count-on-open-row"]
title = "Ọnụọgụ na-apụta ìhè na folda mepere emepe"
text = """
Ọnụọgụ dị n'akụkụ folda mepere emepe na Ozi, na n'akụkụ ụdị mepere emepe
na Faịlụ, na-anọ ugbu a n'mpekere na-enwu karịa ntụ nke ahịrị ahụ, ka ọ
ghara imikpu n'ime ya, n'ìhè na n'ọchịchịrị.
"""

["2026-10-01-0652-files-leave-out-small-pictures"]
title = "Faịlụ na-ahapụ logo mbinye aka"
text = """
Peeji Faịlụ anaghịzi ejupụta n'obere logo na akara ngosi ndị na-abịa na
mbinye aka email: foto erughị 12 KB, ma ọ bụ erughị pikselụ 100 n'obosara
ma ọ bụ n'ogo, na-anọ n'okpuru ozi ha. Gbanwee oke abụọ ahụ, ma ọ bụ gosi
foto niile, na Ntọala > Ngwa ndabara > Peeji Faịlụ.
"""

["2026-10-01-0700-mute-from-contact"]
title = "Gbachie onye zitere site na kaadị kọntaktị ya"
text = """
Kaadị kọntaktị dị n'akụkụ ozi nwere mgbịrịgba na mbụ n'etiti bọtịnụ ya:
ọ na-agbachi ihe niile si n'aka onye zitere ahụ, mgbịrịgba nwere ahịrị gafere
ya n'azụ aha ya na-egosikwa ya. Pịa ya ọzọ iji nụ site n'aka ha.
"""

["2026-10-01-0803-select-hover-fits"]
title = "Bọtịnụ nhọrọ dị ọcha karịa"
text = """
Ìhè dị n'azụ igbe akara nhọrọ n'elu ndepụta ozi mgbe ntụnye nọ n'elu ya
toro ogologo ugbu a dị ka bọtịnụ ndị dị n'akụkụ ya, dị anya site na
nsọtụ kaadị ahụ dị ka site n'elu ya, nkuku ya na-agbasokwa nkuku kaadị
ahụ.
"""

["2026-10-01-0807-files-leave-out-signature-pictures"]
title = "Faịlụ na-ahapụkwa foto mbinye aka buru ibu"
text = """
Foto mmadụ na-ezipu na mkparịta ụka atọ ma ọ bụ karịa, dị ka banner ma ọ
bụ foto dị na mbinye aka ya, anaghịzi egosi na peeji Faịlụ, ma ọ bụ akara
ngosi netwọk mmekọrịta, n'agbanyeghị ka ha buru ibu. Ha ka na-egosi
n'okpuru ozi ha, ịgbanyụ "Hapụ foto ndị dị obere" na-eweghachikwa ha niile.
"""

["2026-10-01-0830-muted-contact-mark"]
title = "Hụ onye a gbachiri"
text = """
Mgbịrịgba nwere ahịrị gafere ya na-eso ugbu a aha onye zitere a gbachiri
ebe ọ bụla ha pụtara: ndepụta ozi, ozi mepere emepe, Kọntaktị, igbe Gaa
na Cc na aro ha, peeji Faịlụ, ndị ọbịa ihe omume na akụkọ Ihe omume. Ọ
dịghịzi ịnọ na-eche ihe kpatara ozi ha ji dị jụụ.
"""

["2026-10-01-0839-sounds"]
title = "Ụda maka ozi ọhụrụ, ncheta na izipu"
text = """
Ntọala > Ọkwa nwere ngalaba Ụda: ozi ọhụrụ, ncheta, ozi laghachiri
n'igbe ozi mbata, ozi e zipuru na ozi a na-ezipughị na-ahọrọ ụda site na
desktọpụ gị, kpọọ ya site na bọtịnụ dị n'akụkụ ya, ma ọ bụ gbanyụọ ya.
Ụda na-akpọkwa na KDE Plasma ugbu a, ma na-agbachi nkịtị maka ozi a
gbachiri na n'oge Akpaghasịla m.
"""

["2026-10-01-0925-chat-view"]
title = "Gụọ mkparịta ụka dị ka nkata (nnwale)"
text = """
Gbanye Ntọala > Nnwale > Mkparịta ụka dị ka nkata, ozi n'etiti ndị mmadụ
na-agụkwa dị ka nkata otu: afụ maka ozi ọ bụla na naanị ihe e dere, nke
gị n'aka nri, foto na faịlụ dị ka mgbasa ozi nkata. Ozi e hotara na
mbinye aka na-echere n'azụ ··· n'afụ ọ bụla, ịpị n'aha na-egosikwa kaadị
ha ya na mbinye aka ha. Zaa site n'igbe dị n'okpuru, ya na Ctrl+Enter,
ogwe nhazi n'azụ Aa na mkpachi akwụkwọ maka faịlụ, ndebiri ụkpụrụ na
mbinye aka. Akwụkwọ akụkọ na-edobe nlele nkịtị, mgbanwe Nkata | Ozi
na-atụgharịkwa mkparịta ụka ọ bụla n'ụzọ ọ bụla.
"""

["2026-10-01-0946-forward-keeps-files"]
title = "Zigaa na-edobe faịlụ"
text = """
Iziga ozi n'ihu na-ebute mgbakwunye ya ugbu a, e gosiri n'okpuru ozi ka i
nwee ike iwepụ nke ọ bụla tupu izipu. Ịgbanwe ozi e ziga n'ihu ka ọ
bụrụ nzaghachi na-ahapụ ha ọzọ.
"""

["2026-10-01-1009-forward-a-file"]
title = "Zigaa naanị faịlụ ahụ"
text = """
Ihe nlele mgbakwunye nwere bọtịnụ Zigaa n'ogwe elu ya: ọ na-amalite ozi
ọhụrụ nwere naanị faịlụ ahụ, na-enweghị ozi o sooro bịa. Faịlụ na-enweghị
nlele mbụ na-enyekwa Zigaa, otu ahụkwa ka kaadị mgbakwunye n'okpuru ozi
mepere emepe, n'akụkụ Chekwaa.
"""

["2026-10-01-1039-rephrase-with-ai"]
title = "Dee ya ọzọ site na AI"
text = """
Họrọ ederede n'ozi ma pịa akara mmụke dị n'akụkụ ya, ma ọ bụ Ctrl+J, ka
e degharịa ya ka o doo anya karịa, dị mkpụmkpụ karịa, nwee obi ọma karịa
ma ọ bụ dị nkwanye ùgwù karịa, wee Dochie. Katna AI bụ n'efu ruo ụbọchị
30, ma ọ bụ jiri igodo nke gị site na Google Gemini, OpenAI, Claude,
Mistral, DeepSeek, OpenRouter ma ọ bụ ụdị dị na kọmputa a. AI nwekwara
ike imecha ahịrịokwu gị n'agba ntụ; gbanye ya na Ntọala > Ide ozi.
"""

["2026-10-01-1043-header-details-selectable"]
title = "Detuo site na nkọwa ozi"
text = """
Nkọwa dị n'okpuru "gaa mụ" nwere ike ịhọrọ ma detuo ugbu a dị ka ozi n'onwe
ya. Pịa adreesị iji hụ kaadị onye ahụ n'akụkụ ozi, ma ọ bụ pịa ya aka
nri maka Detuo adreesị. Ndị a gbachiri na-egosikwa mgbịrịgba ha nwere
ahịrị gafere ya ebe ahụ.
"""

["2026-10-01-1112-left-bar-button"]
title = "Otu bọtịnụ ukwu, otu mpịaji, na peeji ọ bụla"
text = """
Bọtịnụ ukwu dị n'elu ogwe aka ekpe na-adị ma na-anọ ugbu a otu ụzọ ahụ
na peeji ọ bụla ma na-arụ ọrụ peeji ahụ: Dee na Ozi na Faịlụ, Ihe omume
