ntụgharị asụsụ), ma ọ bụ ị nwere ike ịwụfe ya.
"""

["2026-09-30-1850-windows-frame-and-blur"]
title = "Etiti na ụzụzụ Katna na Windows"
text = """
Na Windows, Katna Mail na-emepe ugbu a n'ime ihuenyo, buru ibu kacha mgbe
ihuenyo dị obere. Ntọala > Nnwale nwere ike ime ka ihe dị n'azụ windo
gbaa ụzụzụ, etiti Katna n'onwe ya na-emekwa ka ogwe elu ghọọ ogwe aha
oge ọzọ i meghere Katna Mail.
"""

["2026-09-30-1851-dark-depth"]
title = "Dị mfe ịhụ n'agba ọchịchịrị"
text = """
N'agba ọchịchịrị, ihe ndị na-ese n'elu ndepụta ozi na-enwu ntakịrị ugbu
a, nwee nsọtụ ìhè dị nro, n'ihi na onyinyo anaghị egosi nke ọma n'azụ
gbara ọchịchịrị. Bọtịnụ Laghachi n'elu, menu, windo Dee na igbe mkparịta
na-apụta ìhè. Agba ìhè dị ka ọ dị na mbụ.
"""

["2026-09-30-1911-files-scrollbar"]
title = "Ogwe ịkpụgharị na peeji Faịlụ"
text = """
Mgbe faịlụ karịrị ihe ga-adaba, ogwe ịkpụgharị dị gịrịgịrị na-egosi
n'aka nri ka ị na-akpụgharị ma ọ bụ mgbe ntụnye nọ n'elu faịlụ, wee
kpochapụ. Dọrọ ya iji gafee faịlụ ngwa ngwa, ma ọ bụ pịa n'elu ma ọ bụ
n'okpuru ya iji wụlie ebe ahụ.
"""

["2026-09-30-1919-tabs-keep-open-mail"]
title = "Ịgbanwe taabụ na-edobe ozi mepere emepe"
