title = "تسجيل الدخول باستخدام Google على أي شبكة"
text = """
لم يعد تسجيل الدخول باستخدام Google يتوقف برسالة «أغلق الطرف الآخر الاتصال»
على الشبكات التي تقطع اتصال Google مبكرًا. وإذا ألغيت تحديد Gmail في صفحة
Google، يخبرك Katna بذلك الآن بدلًا من أن يفشل لاحقًا.
"""

["2026-09-30-0504-google-api-turned-off"]
title = "يخبرك أي واجهة API من Google متوقفة"
text = """
عندما تكون إحدى واجهات API متوقفة في Google بالنسبة إلى Katna، صارت جهات
الاتصال والتقويم والمهام وملفات Drive تذكر أيها في سطر قصير، مع زر «تشغيل»
يفتح صفحة Google الخاصة بها، بدلًا من خطأ Google الخام.
"""

["2026-09-30-0507-newest-mail-first"]
title = "أحدث البريد أولًا"
text = """
عند إضافة حساب، يُنزّل Katna Mail الآن أحدث بريدك أولًا ثم يعود إلى البريد
الأقدم، فتظهر رسائل اليوم في أعلى البريد الوارد على الفور. وإذا انقطع
التنزيل، يكمل البريد الأقدم في المرة التالية.
"""

["2026-09-30-0601-keyring-at-login"]
title = "ينتظر محفظتك عند تسجيل الدخول"
text = """
إذا كانت KWallet أو GNOME Keyring لا تزال مقفلة عند بدء Katna، وأُغلقت نافذة
فتح قفلها، فلم تعد حساباتك تعرض أن كلمة المرور خاطئة. بل تنتظر، ثم تبدأ
المزامنة وحدها حالما تفتح قفل المحفظة، دون الحاجة إلى إنهاء Katna. ويطلب
«مزامنة الآن» فتح قفلها مجددًا.
"""

["2026-09-30-0606-pdf-rotate-and-top-bar"]
title = "تدوير صفحات PDF"
text = """
يستطيع عارض PDF الآن تدوير الصفحات باتجاه عقارب الساعة أو عكسها (Ctrl+R
وCtrl+Shift+R)، وتُحفظ النسخة المعلَّمة بالاتجاه الذي أدرتها إليه. وانتقل رقم
الصفحة والتكبير إلى الشريط العلوي، فلا شيء يغطي الصفحة.
"""

["2026-09-30-0610-calendar-events-stay-put"]
title = "الأحداث تبقى في مكانها"
text = """
لم يعد النقر على حدث أو مهمة في التقويم ثم تغيير طريقة العرض يجعلها تلاحق
المؤشر. صار الحدث يتحرك فقط ما دمت تضغط الزر وتسحبه، وتغيير طريقة العرض أو
الصفحة، أو الضغط على Esc، أو فتح بطاقته يعيده كما كان.
"""

["2026-09-30-0620-checkbox-partial-centred"]
title = "المربعات المحددة جزئيًا متوازنة"
text = """
عند تحديد بعض الرسائل فقط، صار المربع داخل مربع «تحديد الكل» يترك المسافة
نفسها من كل جانب، أيًّا كان حجم الواجهة.
"""

["2026-09-30-0632-year-view-day-peek"]
title = "اطّلع على خطط يوم من عرض السنة"
text = """
في عرض السنة في التقويم، ضع المؤشر على يوم تحته نقطة لترى أحداثه ومهامه في
نافذة صغيرة بجانبه، مع أيقونة لكل منها تبين نوعه ووقته. انقر أحدها لفتحه، أو
انقر اسم اليوم لفتح اليوم. وعلى الهاتف، المس اليوم.
"""

["2026-09-30-0650-notification-opens-own-window"]
title = "الإشعارات تفتح البريد في المقدمة"
text = """
النقر على إشعار بريد جديد يفتح تلك الرسالة في نافذة خاصة بها، في المقدمة،
أيًّا كان ما يعرضه Katna حينها. ويفتحها «الرد على الكل» والرد جاهز للكتابة.
أما «أرشفة» فتنقل الرسالة دون فتح أي شيء، وتخبرك بذلك في ملاحظة قصيرة مع
«تراجع».
"""

["2026-09-30-0700-event-card-join-any-call"]
title = "انضم إلى مكالمات Teams وZoom من التقويم"
text = """
صارت بطاقة الحدث تعثر على المكالمة في وصفه أو مكانه، فتحصل دعوة Microsoft
Teams أو Zoom أو Webex أو Jitsi أو Google Meet على زر «انضمام عبر» في الأعلى.
وصارت عناوين الويب في الوصف روابط، واختفت أسطر الشرطات السفلية، ويبقى «هل
ستحضر؟» في الأسفل بينما تُمرَّر التفاصيل.
"""

["2026-09-30-0715-click-away-closes-viewer"]
title = "انقر خارجه للإغلاق"
text = """
انقر المساحة المعتمة حول المرفق لإغلاق العارض، بدلًا من البحث عن زر الرجوع.
أما النقر على الصفحة نفسها فلا يزال يحدد النص ويضع العلامات كما من قبل.
"""

["2026-09-30-0729-add-account-and-pop3"]
title = "«إضافة حساب» جديدة، وPOP3"
text = """
تبدأ إضافة حساب بمزوّد خدمتك: Google أو Yahoo أو iCloud أو Zoho أو Fastmail
أو GMX أو Yandex أو أي مزوّد آخر. يخبرك Katna أولًا بما يحتاجه المزوّد،
ويعرض كل خطوة أثناء الاتصال، وينتهي بما أعدّه. وتعمل حسابات POP3 أيضًا،
ويحدد «الإعدادات > الحسابات» مدة بقاء بريدها على الخادم.
"""

["2026-09-30-0802-ctrl-wheel-zoom"]
title = "التكبير بـ Ctrl والعجلة"
text = """
في عارض المرفقات، اضغط Ctrl مع تدوير عجلة الفأرة للتكبير والتصغير حول
المؤشر، أو اقرص بإصبعين على لوحة اللمس. يعمل ذلك مع ملفات PDF والصور والملفات
النصية وجداول البيانات والمستندات.
"""

["2026-09-30-0817-event-open-the-mail"]
title = "افتح الرسالة وراء الحدث"
text = """
الأحداث التي أنشأها Gmail من رسالة، كالقطارات والرحلات الجوية والفنادق، صار في
بطاقتها زر «فتح الرسالة». يفتح تلك الرسالة في Katna، أو في Gmail إن لم تكن في
Katna. والمهمة المنشأة من رسالة تفتح رسالتها من بطاقتها في التقويم أيضًا،
ويُفتح «تدوين ملاحظات الاجتماع» دون أي وميض.
"""

["2026-09-30-0843-calendar-side-panel-menus"]
title = "أدر التقاويم من اللوحة الجانبية"
text = """
انقر بزر الفأرة الأيمن على تقويم في اللوحة الجانبية للتقويم لعرضه وحده، أو
تغيير لونه، أو إعادة تسميته، أو حذفه. وانقر بزر الفأرة الأيمن على اسم حساب
لإنشاء تقويم جديد فيه أو إظهار كل تقاويمه وإخفائها. تصل التغييرات إلى خدمة
بريدك، فتظهر في كل مكان تستخدمها فيه.
"""

["2026-09-30-1010-unread-list-keeps-open-mail"]
title = "البريد غير المقروء يبقى مفتوحًا"
text = """
لم يعد فتح محادثة في «كل الحسابات > غير المقروءة» يغلقها فورًا. قراءتها تضع
عليها علامة «مقروءة»، وتبقى في القائمة حتى تغلقها أو تفتح غيرها.
"""

["2026-09-30-1045-tracked-mail-arrives"]
title = "البريد المتتبَّع يصل من جديد"
text = """
كان البريد المرسل مع تشغيل التتبع قد يظهر في «المُرسَلة» دون أن يصل إلى أحد.
صار الآن يُرسل إلى كل المستلمين. أما البريد الذي ضاع بهذه الطريقة فيحتاج إلى
إرساله مجددًا.
"""

["2026-09-30-1114-no-checking-pill"]
title = "لا مزيد من شارة التحقق"
text = """
لم تعد «جارٍ التحقق من وجود بريد جديد…» تظهر فوق القائمة. فالأسهم الدوّارة على
زر إعادة التحميل وعلى البريد الوارد لكل حساب تبيّن أصلًا أن البريد قيد التحقق،
والتحقق الفاشل لا يزال يخبرك بما حدث.
"""

["2026-09-30-1300-windows-sign-in-and-domains"]
title = "تسجيل الدخول باستخدام Google على Windows"
text = """
صار Katna لنظام Windows يتيح تسجيل الدخول باستخدام Google وZoho، كما يفعل على
Linux، ويعرف من يستضيف البريد على نطاقك الخاص، مثل عنوان Google Workspace،
عند إضافة الحساب.
"""

["2026-09-30-1511-mail-tables"]
title = "الجداول في البريد تُقرأ كما ينبغي"
text = """
تحتفظ الجداول في البريد، مثل قائمة المهام في إشعار GitHub Actions، بأعمدتها جنبًا إلى جنب وتصفّها من صف إلى صف، بدلًا من تكسير العنوان حرفًا في كل سطر. وصارت الخطوط الفاصلة بين أجزاء الرسالة تظهر أيضًا.
"""

["2026-09-30-1550-taller-important-marker"]
title = "علامة «مهم» أطول"
text = """
صارت علامة «مهم» بجانب النجمة أطول بمقدار 2 بكسل، فلم تعد تبدو مضغوطة بجانب
النجمة ومربع الاختيار. وتبقى في منتصف الصف.
"""

["2026-09-30-1617-folder-click-goes-to-top"]
title = "العودة إلى أعلى القائمة"
text = """
بعد أن تنزل قائمة البريد شاشة كاملة، يعيدها زر دائري في أسفلها على اليمين إلى
الأعلى. والنقر على المجلد الذي أنت فيه، مثل «البريد الوارد»، يفعل الشيء نفسه،
كما في Gmail، وكذلك المفتاح Home.
"""

["2026-09-30-1622-send-from-file-manager"]
title = "أرسل الملفات من مدير الملفات"
text = """
انقر بزر الفأرة الأيمن على ملفات أو مجلدات في Dolphin أو GNOME Files أو مستكشف Windows واختر «إرسال باستخدام Katna Mail»: تُفتح رسالة جديدة وهي مرفقة بها، ويُرسل المجلد كملف zip. وإن كان لديك أكثر من حساب بريد، فاختر الحساب الذي تُرسل منه من قائمتها الفرعية.
"""

["2026-09-30-1624-files-page"]
title = "كل ملف في مكان واحد"
text = """
تعرض صفحة «الملفات» الجديدة، في أسفل شريط التطبيقات، كل مرفق من كل حساب، الأحدث أولًا. ضيّقها إلى الصور أو ملفات PDF أو المستندات، أو إلى حساب واحد، أو إلى شخص أو فترة زمنية، أو ابحث بالاسم أو المرسل أو الموضوع. انقر بزر الفأرة الأيمن على ملف لمزيد من الخيارات، ويأخذك «إظهار الرسالة» إلى الرسالة التي جاء معها.
"""

["2026-09-30-1643-dimmer-row-markers"]
title = "قائمة بريد أهدأ"
text = """
صار مربع الاختيار الفارغ والنجمة وعلامة «مهم» في قائمة البريد أخفت حتى يمر
المؤشر فوق صفها. أما النجوم والعلامات المفعّلة فتحتفظ بلونها.
"""

["2026-09-30-1704-folder-arrows-on-hover"]
title = "جزء مجلدات أرتب"
text = """
لا تظهر الأسهم الصغيرة بجانب «البريد الوارد» و«المميّزة بنجمة» وغيرها من
المجلدات إلا حين يكون المؤشر فوق ذلك المجلد. ويحتفظ المجلد الذي فتحته بسهمه.
"""

["2026-09-30-1712-arrow-keys-in-times"]
title = "مفاتيح الأسهم في مربعات الوقت"
text = """
في «اختيار التاريخ والوقت»، وفي وقت المهمة، يغيّر المفتاحان Up وDown الجزء
الذي فيه المؤشر: الساعة أو الدقائق أو ص/م.
"""

["2026-09-30-1742-check-one-folder"]
title = "تحقق من بريد جديد في مجلد واحد"
text = """
صار «التحقق من وجود بريد جديد» في قائمة النقر الأيمن للمجلد يتحقق من ذلك
المجلد وحده، فيكون سريعًا. وعلى البريد الوارد لحساب تحت «كل الحسابات» يتحقق
من البريد الوارد لذلك الحساب، وعلى قائمة مثل «البريد الوارد» أو «المُرسَلة»
تحت «كل الحسابات» يتحقق من ذلك المجلد في كل حساب.
"""

["2026-09-30-1742-frosted-viewer"]
title = "عارض أخف كالزجاج المصنفر"
text = """
صار الشريط العلوي لعارض المرفقات أنحف وأفتح، وتجلس أدوات الصفحة والتكبير
والتدوير على شارة. وحول الملف يظهر Katna Mail ضبابيًا تحت غشاء داكن ناعم،
وأشرطة الأدوات كالزجاج المصنفر أيضًا. يتبع التمويه «الإعدادات > تجريبي»؛
ودونه يستخدم العارض غشاءً داكنًا عاديًا.
"""

["2026-09-30-1752-touchpad-glide"]
title = "تمرير لوحة اللمس ينزلق"
text = """
النقرة السريعة بإصبعين على لوحة اللمس تواصل التمرير ثم تتباطأ، كما في
التطبيقات الأخرى. المس لوحة اللمس مجددًا لإيقافه. على Wayland.
"""

["2026-09-30-1800-inbox-tabs-in-top-row"]
title = "تبويبات البريد الوارد في الصف العلوي"
text = """
صارت «الأساسية» و«العروض الترويجية» و«الشبكات الاجتماعية» وبقية تبويبات
البريد الوارد في شريط على شكل شارة في الصف العلوي من القائمة، ولكل منها عدد
ملوّن لبريدها غير المقروء. ينزلق التمييز إلى التبويب الذي تختاره، والنقر على
التبويب المفتوح يعيد قائمته إلى الأعلى. وحين تضيق القائمة يأخذ الشريط صفًا
خاصًا به ويعرض أيقونات، مع إبقاء اسم التبويب المفتوح؛ وعلى الهاتف يجلس في
شريط القائمة، و«إعادة التحميل» في قائمة «المزيد».
"""

["2026-09-30-1805-account-menu"]
title = "معلومات الحساب في قائمة النقر الأيمن"
text = """
انقر بزر الفأرة الأيمن على اسم حساب في قائمة المجلدات، أو على بريده الوارد
تحت «كل الحسابات»، لترى عنوانه، وهل هو متزامن ومتى جرى التحقق منه آخر مرة،
وكم من مساحة التخزين يستخدم. ومن هناك يمكنك التحقق من ذلك البريد الوارد، أو
كتابة رسالة جديدة من ذلك الحساب، أو فتح إعداداته، أو تسجيل الدخول مجددًا حين
تنتهي صلاحية تسجيل الدخول.
"""

["2026-09-30-1819-glass-search-box"]
title = "مربع بحث زجاجي"
text = """
عند تشغيل الخلفية الضبابية، يكون مربع البحث زجاجًا مصنفرًا بحافة خفيفة ما دمت
لا تستخدمه، ويصبح صلبًا حين تنقر فيه لتكتب.
"""

["2026-09-30-1820-search-cancel-restores"]
title = "ألغِ البحث واستعد بريدك"
text = """
صار الضغط على Esc أو مسح مربع البحث يعيدك إلى حيث كنت: المجلد نفسه، والموضع
نفسه في القائمة، والرسالة التي كانت مفتوحة. أما إذا فتحت نتيجة فيتولى البحث
الأمر كما من قبل.
"""

["2026-09-30-1840-first-run-window"]
title = "بداية أولى ألطف"
text = """
أثناء إعداد Katna Mail، تظهر النافذة خلف صفحات الإعداد تحت غشاء خفيف:
التطبيقات و«إنشاء» ومربع البحث، مع عناصر نائبة ناعمة حيث ستظهر مجلداتك
وبريدك. وتعرض خطوة جديدة حساب Katna وتسرد ما يشغّله (إيصالات القراءة، وتتبع
الروابط، و«النشاط»، والترجمة)، أو يمكنك تخطيها.
"""

["2026-09-30-1850-windows-frame-and-blur"]
title = "إطار Katna وتمويهه على Windows"
text = """
على Windows، صار Katna Mail يُفتح داخل الشاشة، مكبّرًا حين تكون الشاشة صغيرة.
ويمكن لـ «الإعدادات > تجريبي» تمويه ما خلف النافذة، ويحوّل إطار Katna الخاص
الشريط العلوي إلى شريط العنوان في المرة التالية التي تفتح فيها Katna Mail.
"""

["2026-09-30-1851-dark-depth"]
title = "رؤية أسهل في الألوان الداكنة"
text = """
في الألوان الداكنة، صارت العناصر التي تطفو فوق قائمة البريد أفتح بدرجة، مع
حافة فاتحة خفيفة، لأن الظلال لا تكاد تظهر على خلفية داكنة. فيبرز زر العودة إلى
الأعلى والقوائم ونافذة «إنشاء» ومربعات الحوار بوضوح. أما الألوان الفاتحة فتبدو
كما من قبل.
"""

["2026-09-30-1911-files-scrollbar"]
title = "شريط تمرير في صفحة «الملفات»"
text = """
حين تكون الملفات أكثر مما يتسع له المكان، يظهر شريط تمرير رفيع على اليمين أثناء التمرير أو حين يكون المؤشر فوق الملفات، ثم يتلاشى. اسحبه للتنقل بين الملفات بسرعة، أو انقر فوقه أو تحته للقفز إلى هناك.
"""

["2026-09-30-1919-tabs-keep-open-mail"]
title = "تبديل التبويبات يُبقي الرسالة مفتوحة"
text = """
حين يكون جزء القراءة بجانب القائمة، لم يعد اختيار تبويب آخر في البريد الوارد
يغلق الرسالة التي تقرؤها؛ تتغير القائمة وتبقى الرسالة مفتوحة.
"""

["2026-09-30-1925-inbox-tabs-centred"]
title = "تبويبات البريد الوارد في المنتصف"
text = """
صارت تبويبات البريد الوارد في منتصف الصف العلوي من القائمة، ولا تتنحى جانبًا
إلا بقدر ما تحتاجه أزراره.
"""

["2026-09-30-1945-page-box-arrow-keys"]
title = "مفاتيح الأسهم في مربع الصفحة"
text = """
في ملف PDF، انقر رقم الصفحة واضغط Up أو Down للرجوع صفحة أو التقدم صفحة.
واستمر في الضغط على المفتاح لتقليب الصفحات بسرعة.
"""

["2026-09-30-1952-phone-bar-labels"]
title = "أسماء التطبيقات على الهاتف تتبع إعدادك"
text = """
حين تكون أسماء التطبيقات متوقفة في «الإعدادات»، صار الشريط على طول أسفل نافذة
بحجم الهاتف يعرض الأيقونات فقط، في المنتصف، كما يفعل الشريط الجانبي.
"""

["2026-09-30-1955-account-menu-icons"]
title = "الإعدادات واللغة في قائمة الحساب"
text = """
صارت القائمة تحت صورة حسابك تبدأ بصف من الأيقونات: افتح «الإعدادات» أو غيّر
اللغة. وغادر علم اللغة الشريط العلوي ليفسح المجال.
"""

["2026-09-30-2001-phone-tabs-fold"]
title = "كل تبويبات البريد الوارد في المتناول"
text = """
حين تضيق النافذة، تنطوي تبويبات البريد الوارد بسلاسة بدلًا من أن تختفي: تتحول
التسميات إلى أيقونات أكبر، ثم تتنحى الأعداد جانبًا. وعلى الهاتف تمتد التبويبات
على الشريط كله، فيسهل لمسها، و«المزيد» في نهاية الشارة نفسها.
"""

["2026-09-30-2012-fit-and-page-arrows"]
title = "الملاءمة وأسهم الصفحات والمزيد في العارض"
text = """
صار في عارض المرفقات زر «ملاءمة»: تلائم صفحة PDF ارتفاع النافذة، والصورة
النافذة، والمستندات والشرائح وجداول البيانات عرضها. وتحصل الصور أيضًا على
«الحجم الحقيقي» ويمكن تدويرها. أشِر إلى مربع الصفحة لتظهر أسهم صغيرة للرجوع
صفحة أو التقدم صفحة، وتحصل الشرائح على مربع خاص بها.
"""

["2026-09-30-2019-folder-icon-colours"]
title = "أيقونات مجلدات ملوّنة"
text = """
صارت لأيقونات جزء المجلدات ألوان تبيّن ما يحويه كل مجلد: «غير المقروءة» بالأزرق،
و«المميّزة بنجمة» بالأصفر، و«المهمة» بالكهرماني، و«المُرسَلة» بالأخضر،
و«الرسائل غير المرغوب فيها» بالأحمر، و«المسودات» بالبنفسجي، و«البريد الوارد»
بلون التمييز في سطح مكتبك. وتجلس أعداد البريد في شارات صغيرة خافتة.
"""

["2026-09-30-2040-tabs-no-slide"]
title = "تبويبات بريد وارد أسرع"
text = """
صار النقر على تبويب في البريد الوارد يميّزه فورًا، مع تموّج النقرة فقط، بدلًا
من انزلاق التمييز عبر التبويبات الأخرى.
"""

["2026-10-01-0145-files-tidy"]
title = "صفحة «ملفات» أرتب"
text = """
صارت الأعداد بجانب كل نوع من الملفات وكل حساب في الشارات الصغيرة نفسها التي تحمل أعداد المجلدات في البريد. ويبدأ الخط تحت عنوان الصفحة وصفوف الملفات وينتهيان عند الحواف نفسها.
"""

["2026-10-01-0147-today-marker-fits"]
title = "تاريخ اليوم يتسع في علامته"
text = """
في عرض الشهر في التقويم، صارت علامة اليوم تحمل التاريخ كاملًا. وفي اليوم الأول
من الشهر تصبح شارة حول «01 أكتوبر» بدلًا من دائرة صغيرة تفيض منها التسمية.
"""

["2026-10-01-0208-tab-counts-stay"]
title = "أعداد التبويبات تبقى في مكانها"
text = """
لم يعد فتح تبويب في البريد الوارد يجعل شريط التبويبات يقفز. يحتفظ التبويب
المفتوح بعدد بريده الجديد، الذي يبهت ببطء إلى رمادي هادئ، ثم ينطوي العدد بسلاسة
حين تقرأ كل ما في ذلك التبويب.
"""

["2026-10-01-0225-files-keyboard"]
title = "تنقّل بين ملفاتك بلوحة المفاتيح"
text = """
في صفحة «الملفات» صارت مفاتيح الأسهم تنقلك بين الملفات، وHome وEnd إلى الأول والأخير، وEnter يفتح الملف. وفي العارض المفتوح من هناك، تنتقل الأسهم إلى الملف التالي في الصفحة، أيًّا كانت الرسالة التي جاء معها؛ أما Shift مع سهم فيبقى مع مرفقات الرسالة نفسها.
"""

["2026-10-01-0254-files-dates"]
title = "اختر الأيام في صفحة «الملفات»"
text = """
صارت شريحة الوقت في صفحة «الملفات» تفتح تقويمًا لشهرين مع اختيارات سريعة مثل «الأسبوع الماضي» و«هذا الشهر». انقر يومًا، أو اسحب من يوم إلى آخر، فتتبعك الملفات أثناء السحب. ثم دوّر عجلة الفأرة فوق الشريحة لتنتقل بالمدة نفسها إلى الأبكر أو الأحدث.
"""

["2026-10-01-0256-color-schemes"]
title = "مخططات الألوان وألوان التمييز"
text = """
صار في «الإعدادات > المظهر» «الوضع» و«الألوان» و«لون التمييز» خيارات منفصلة.
اختر الفاتح أو الداكن، ثم أيًّا من 14 مخطط ألوان، مثل Clear أو Nord أو
Solarized أو Catppuccin، أو احتفظ بمخطط سطح مكتبك. يعمل كل منها في الفاتح
والداكن، ويمكن وضع أي لون تمييز فوقه.
"""

["2026-10-01-0310-badge-counts-what-notifies"]
title = "عدد شريط المهام يطابق إشعاراتك"
text = """
صار عدد غير المقروء على شريط المهام ومنطقة الإعلام يحسب البريد نفسه الذي يُشعرك:
تبويب «الأساسية» في بريدك الوارد. فلم تعد «العروض الترويجية» و«الشبكات
الاجتماعية» و«التحديثات» و«المنتديات» تضيف إليه.
"""

["2026-10-01-0312-quiet-selected-row"]
title = "مجلد مفتوح أهدأ"
text = """
صار المجلد المفتوح في البريد، والعرض المفتوح في جهات الاتصال والمهام والملاحظات
و«الملفات»، مميّزًا برمادي ناعم بدلًا من لون التمييز، فيبرز «إنشاء» وشريط
التطبيقات وتحتفظ أيقونات المجلدات بألوانها.
"""

["2026-10-01-0315-desktop-schemes"]
title = "مخططات ألوان سطح مكتبك"
text = """
يسرد «الإعدادات > المظهر > الألوان» أيضًا مخططات سطح مكتبك: كل مخطط ألوان
مثبّت على KDE Plasma، وعلى Windows ألوانه الخاصة وسمات التباين. وصار «النظام»
يعمل في الفاتح والداكن على KDE أيضًا، مستخدمًا النظير الفاتح أو الداكن لمخططك،
ويتبع Katna لون التمييز في Windows.
"""

["2026-10-01-0329-mute-folders"]
title = "اكتم مجلدًا أو تبويبًا أو حسابًا"
text = """
الجرس فوق القائمة يكتم المجلد المفتوح أو تبويب البريد الوارد لمدة ساعة، أو حتى
صباح الغد، أو حتى تعيد تشغيله. وانقر بزر الفأرة الأيمن على مجلد أو حساب للشيء
نفسه. ويبيّن «الإعدادات > الإشعارات» أي المجلدات تُشعرك وأيها يُحسب على شريط
المهام، وكل ما هو مكتوم.
"""

["2026-10-01-0335-tray-style"]
title = "أيقونة منطقة الإعلام ملوّنة أو بلون واحد"
text = """
يختار «الإعدادات > عام > سطح المكتب > أيقونة منطقة الإعلام ملوّنة» ألوان Katna
أو لونًا واحدًا مثل أيقونات اللوحة الأخرى. ويبقى اللون الواحد لونًا واحدًا حتى
مع وجود بريد غير مقروء، وعدد غير المقروء أحمر دائمًا. على Linux تكون الأيقونة
بلون واحد افتراضيًا؛ وعلى Windows ملوّنة.
"""

["2026-10-01-0354-mute-conversations"]
title = "اكتم محادثة أو مرسلًا"
text = """
الجرس فوق المحادثة المفتوحة يكتمها: لم تعد الردود الجديدة تُشعرك أو تُضاف إلى
عدد شريط المهام، ويميّزها جرس مشطوب في القائمة. انقر بزر الفأرة الأيمن على
محادثة لاختيار «كتم المحادثة» أو «كتم المرسل»، أو اضغط M.
"""

["2026-10-01-0410-your-color-schemes"]
title = "أنشئ مخطط ألوانك الخاص"
text = """
ينسخ «الإعدادات > المظهر > الألوان > تخصيص» المخطط الذي تستخدمه إلى محرر: غيّر
أيًّا من ألوانه الثمانية في الجانب الفاتح والداكن، وشاهد نافذة البريد بها،
ويخبرك Katna بما قد تصعب قراءته. يأخذ «استيراد» ملف مخطط ألوان من Katna أو KDE،
والنقر بزر الفأرة الأيمن على مخططك يحرره أو يكرره أو يصدّره أو يحذفه.
"""

["2026-10-01-0527-calendar-opens-on-week"]
title = "التقويم يُفتح على الأسبوع"
text = """
صار تقويم Katna يُفتح على عرض الأسبوع مجددًا، والأيام القادمة بالساعات. أما
الشهر واليوم والسنة وغيرها فعلى بُعد نقرة في الشريط العلوي.
"""

["2026-10-01-0552-lighter-count-on-open-row"]
title = "الأعداد تبرز على المجلد المفتوح"
text = """
صار العدد بجانب المجلد المفتوح في البريد، وبجانب النوع المفتوح في «الملفات»، في
شارة أفتح من رمادي السطر، فلم يعد يغرق فيه، في الفاتح والداكن.
"""

["2026-10-01-0652-files-leave-out-small-pictures"]
title = "«الملفات» تستبعد شعارات التوقيعات"
text = """
لم تعد صفحة «الملفات» تمتلئ بالشعارات والأيقونات الصغيرة التي تأتي في توقيعات
البريد: الصور الأصغر من 12 كيلوبايت، أو التي يقل عرضها أو ارتفاعها عن 100
بكسل، تبقى تحت رسالتها. غيّر الحدّين، أو أظهر كل الصور، في «الإعدادات >
التطبيقات التلقائية > صفحة الملفات».
"""

["2026-10-01-0700-mute-from-contact"]
title = "اكتم مرسلًا من بطاقة جهة اتصاله"
text = """
صار أول أزرار بطاقة جهة الاتصال بجانب الرسالة جرسًا: يكتم كل ما يأتي من ذلك
المرسل، ويظهر جرس مشطوب بعد اسمه. انقره مجددًا لتسمع منه من جديد.
"""

["2026-10-01-0803-select-hover-fits"]
title = "زر تحديد أرتب"
text = """
صار التمييز عند التمرير خلف مربع التحديد في أعلى قائمة البريد بارتفاع الأزرار
بجانبه، وبُعده عن حافة البطاقة كبُعده عن أعلاها، وزواياه تتبع زاوية البطاقة
نفسها.
"""

["2026-10-01-0807-files-leave-out-signature-pictures"]
title = "«الملفات» تستبعد صور التوقيعات الكبيرة أيضًا"
text = """
الصورة التي يرسلها شخص في ثلاث محادثات أو أكثر، كاللافتة أو الصورة الشخصية في
توقيعه، لم تعد تظهر في صفحة «الملفات»، ولا أيقونات الشبكات الاجتماعية مهما كان
حجمها. ولا تزال تظهر تحت رسالتها، وإيقاف «استبعاد الصور الصغيرة» يعيدها كلها.
"""

["2026-10-01-0830-muted-contact-mark"]
title = "اعرف من هو مكتوم"
text = """
صار جرس مشطوب يتبع اسم المرسل المكتوم أينما ظهر: قائمة البريد، والرسالة
المفتوحة، وجهات الاتصال، ومربعا «إلى» و«نسخة» واقتراحاتهما، وصفحة «الملفات»،
وضيوف الأحداث، وتقرير «النشاط». فلا داعي للتساؤل بعد الآن عن سبب هدوء بريده.
"""

["2026-10-01-0839-sounds"]
title = "أصوات للبريد الجديد والتذكيرات والإرسال"
text = """
صار في «الإعدادات > الإشعارات» قسم «الأصوات»: البريد الجديد، والتذكيرات،
والبريد العائد إلى البريد الوارد، والبريد المُرسل، والبريد الذي لم يُرسل، يختار
كل منها صوتًا من سطح مكتبك، ويمكن تشغيله بالزر بجانبه، أو إيقافه. وصارت الأصوات
تعمل على KDE Plasma أيضًا، وتبقى صامتة للبريد المكتوم وأثناء «عدم الإزعاج».
"""

["2026-10-01-0925-chat-view"]
title = "اقرأ المحادثات كدردشات (تجريبي)"
text = """
شغّل «الإعدادات > تجريبي > المحادثات كدردشات» فيُقرأ البريد بين الأشخاص كدردشة
جماعية: فقاعة لكل رسالة فيها ما كُتب فقط، ورسائلك على اليمين، والصور والملفات
كوسائط دردشة. وينتظر البريد المقتبس والتوقيعات خلف ··· في كل فقاعة، والنقر على
اسم يعرض بطاقة صاحبه مع توقيعه. رُدّ من المربع في الأسفل، مع Ctrl+Enter، وشريط
التنسيق خلف Aa، ومشبك الورق للملفات والقوالب والتوقيعات. وتحتفظ النشرات البريدية
بالعرض المعتاد، ومفتاح «دردشة | بريد» يحوّل أي محادثة إلى أي من الطريقتين.
"""

["2026-10-01-0946-forward-keeps-files"]
title = "إعادة التوجيه تحتفظ بالملفات"
text = """
صارت إعادة توجيه رسالة تأخذ معها مرفقاتها، معروضة تحت الرسالة لتزيل ما تشاء منها
قبل الإرسال. وتحويل إعادة التوجيه إلى رد يستبعدها مجددًا.
"""

["2026-10-01-1009-forward-a-file"]
title = "أعد توجيه الملف وحده"
text = """
صار في الشريط العلوي لعارض المرفقات زر «إعادة توجيه»: يبدأ رسالة جديدة مرفقًا
بها ذلك الملف وحده، دون الرسالة التي جاء معها. وتعرض الملفات التي لا معاينة لها
«إعادة توجيه» أيضًا، وكذلك بطاقات المرفقات تحت الرسالة المفتوحة، بجانب «حفظ».
"""

["2026-10-01-1039-rephrase-with-ai"]
title = "إعادة الصياغة بالذكاء الاصطناعي"
text = """
حدّد نصًا في رسالة واضغط النجمة اللامعة بجانبه، أو Ctrl+J، لإعادة كتابته أوضح أو
أقصر أو أودّ أو أكثر رسمية، ثم «استبدال». Katna AI مجاني لمدة 30 يومًا، أو استخدم
مفتاحك الخاص من Google Gemini أو OpenAI أو Claude أو Mistral أو DeepSeek أو
OpenRouter أو نموذجًا على هذا الحاسوب. ويمكن للذكاء الاصطناعي أيضًا إكمال جملك
بالرمادي؛ شغّله في «الإعدادات > الكتابة».
"""

["2026-10-01-1043-header-details-selectable"]
title = "انسخ من تفاصيل الرسالة"
text = """
صار بالإمكان تحديد التفاصيل تحت «إليّ» ونسخها كالرسالة نفسها. انقر عنوانًا لترى
بطاقة صاحبه بجانب الرسالة، أو انقره بزر الفأرة الأيمن لاختيار «نسخ العنوان».
ويظهر الجرس المشطوب للأشخاص المكتومين هناك أيضًا.
"""

["2026-10-01-1112-left-bar-button"]
title = "زر كبير واحد وطيّ واحد في كل صفحة"
text = """
صار الزر الكبير في أعلى الشريط الأيسر يبدو ويجلس بالطريقة نفسها في كل صفحة،
ويؤدي مهمة تلك الصفحة: «إنشاء» في البريد و«الملفات»، و«حدث جديد»، و«جهة اتصال
جديدة»، و«مهمة جديدة»، و«ملاحظة جديدة». وطيّ الشريط الأيسر يطويه في كل مكان،
وأثناء طيّه ينتظر زر كل صفحة في أعلى الشريط الجانبي. وعلى الهاتف هو الزر العائم.
"""

["2026-10-01-1115-color-picker"]
title = "منتقي ألوان في محرر المخططات"
text = """
انقر لونًا في محرر المخططات فيُفتح منتقٍ بجانبه مباشرة: اسحب عبر المربع وشريط
التدرج، أو اكتب قيمة سداسية عشرية، أو أعد استخدام ألوان المخطط نفسه أو اختياراتك
الأخيرة، أو التقط لونًا من أي مكان على الشاشة بالقطّارة على KDE وGNOME.
"""

["2026-10-01-1130-contact-card-folds-folders"]
title = "بطاقة جهة الاتصال تُفسح لنفسها المكان"
text = """
في نافذة أضيق من أن تتسع لجزء المجلدات وبطاقة جهة الاتصال جنبًا إلى جنب، صارت
البطاقة تطوي المجلدات عند فتحها، وتعود المجلدات حين تُغلق البطاقة. أما المجلدات
التي تطويها بنفسك فتبقى مطوية.
"""

["2026-10-01-1132-open-mail-scroll-bar"]
title = "شريط تمرير في الرسائل الطويلة"
text = """
صارت المحادثة الطويلة تعرض شريط التمرير الهادئ نفسه الذي في صفحة «الملفات» أثناء
تمريرها أو الإشارة إليها. وصار الشريطان أرفع، ويكبران كلما اقترب منهما المؤشر.
اسحب أحدهما، أو انقر على امتداده، للقفز إلى أي مكان.
"""

["2026-10-01-1240-contact-card-close"]
title = "أبعِد بطاقة جهة الاتصال، واعرف من في الدردشة"
text = """
صار في زاوية بطاقة جهة الاتصال بجانب المحادثة ✕، والنقر مجددًا على صورة الشخص
نفسه أو عنوانه يُبعد البطاقة. وفي عرض الدردشة، النقر على الترويسة يسرد كل من في
الدردشة مع عناوينهم وعدد الرسائل التي أرسلها كل منهم.
"""

["2026-10-01-1241-two-blur-switches"]
title = "التمويه كما تريد"
text = """
صار للتمويه مفتاحان في «الإعدادات > تجريبي»: واحد لخلفية النافذة وآخر للقوائم
