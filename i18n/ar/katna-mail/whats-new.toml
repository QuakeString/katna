البريد والرسالة المفتوحة والأجزاء الجانبية تظهر كاملة حين لا تكون النافذة
مكبّرة، بدلًا من أن تبدو مقطوعة بشكل مسطح تحت الشريط العلوي.
"""

["2026-10-04-0354-account-offline"]
title = "اقطع اتصال حساب"
text = """
انقر حسابًا بالزر الأيمن واختر «قطع الاتصال»، لساعة أو حتى الغد إن شئت.
يتوقف Katna عن الاتصال به، وتظهر سحابة مشطوبة بجانب عدده وعلى صورتك. ويبقى
بريده هنا للقراءة، وما تؤرشفه أو تحذفه أو ترسله في الأثناء يُنفَّذ حين تنقر
السحابة للعودة إلى الاتصال. وفي «الإعدادات > الحسابات» مفتاح «متصل» لكل
حساب، ويمكن لبطاقة الحساب قطع اتصال كل الحسابات دفعة واحدة.
"""

["2026-10-04-0420-resize-steady"]
title = "ثبات أثناء تغيير الحجم"
text = """
مع شريط العنوان الخاص بـ Katna على Wayland، يبقى محتوى النافذة ثابتًا
بينما تسحب حافة لتغيير حجمها، بدلًا من أن يهتز.
"""

["2026-10-04-0531-turn-apps-off"]
title = "أوقف التطبيقات التي لا تستخدمها"
text = """
صار في «الإعدادات > التطبيقات» مفتاح لـ«التقويم» و«جهات الاتصال» و«المهام»
و«الملاحظات» و«الملفات»، والنقر بالزر الأيمن على أحدها في شريط التطبيقات
يعرض «إيقاف». يغادر التطبيق الموقوف شريط التطبيقات ومفاتيحه، ولا يتغير شيء
في حساباتك. ومع تشغيل «البريد» وحده يختفي شريط التطبيقات ويصير Katna تطبيق
بريد فقط.
"""

["2026-10-04-0635-remove-app-copy"]
title = "حرّر مساحة تطبيق أوقفته"
text = """
صار إيقاف تطبيق في «الإعدادات > التطبيقات» يعرض إزالة نسخته على هذا
الحاسوب. لا يتغير شيء في حساباتك، وإعادة تشغيله تنزّلها مجددًا. ولا تُطلب من
الحسابات الجديدة إلا الأذونات التي تحتاجها التطبيقات التي تستخدمها.
"""

["2026-10-04-1100-account-problems"]
title = "شاهد مشكلات الحساب وأصلحها في مكان واحد"
text = """
حين يحتاجك حساب، يخبرك سطر أعلى قائمة البريد بما حدث بكلمات بسيطة، مع
الحل بجانبه. وكلمة المرور المتغيرة تفتح بطاقة صغيرة تكتب فيها الجديدة،
ويتحقق منها Katna قبل حفظها. وتميّز علامة كهرمانية الحساب أيضًا في جزء
المجلدات وعلى صورتك. وحين ينقطع اتصالك، يخبرك سطر هادئ واحد بأنك غير متصل
وبأن البريد الذي ترسله ينتظر حتى تعود.
"""

["2026-10-04-1110-contact-card-placeholder"]
title = "بطاقات جهات الاتصال تُفتح دفعة واحدة"
text = """
حين تستغرق تفاصيل شخص لحظة لتُحمَّل، صارت بطاقة جهة الاتصال التي تنبثق فوق
اسم أو صورة تُفتح بحجمها المعتاد مع خطوط باهتة مكان التفاصيل، ثم تملؤها
وتتكيف بهدوء، بدلًا من أن تُفتح صغيرة ثم تقفز أطول.
"""

["2026-10-04-1144-account-problems-settings"]
title = "مشكلات الحساب في الإعدادات أيضًا"
text = """
صار «الإعدادات > الحسابات» يخبرك بما هو خطأ في حساب تحت اسمه، مثل كلمة
مرور مرفوضة، مع الحل هناك مباشرة.
"""

["2026-10-04-1147-subject-scrolls-again"]
title = "الموضوع يتمرر مع الرسالة مجددًا"
text = """
في عرض البريد عاد الموضوع يتمرر بعيدًا مع الرسائل، تحت شريط أدوات بسيط. وفي
عرض الدردشة ينضم شريط الأدوات إلى الرأس المثبت، فتنزلق الفقاعات تحتهما
معًا، كالزجاج المصنفر حين تكون «الضبابية» مشغّلة. وصار الشريط العلوي لقائمة
البريد يحتفظ بزوايا البطاقة المستديرة، ومع إيقاف «رؤوس كالزجاج المصنفر» لم
تعد الصفوف تظهر من خلاله. وفي نافذة بحجم الهاتف تصير الزوايا السفلية
مستديرة أيضًا.
"""

["2026-10-04-1223-outbox"]
title = "«صندوق الصادر» للبريد الذي لم يُرسَل"
text = """
صار البريد الذي تعذّر إرساله ينتظر في «صندوق الصادر» تحت «المُرسَلة»، ولا
يظهر إلا ما دام فيه شيء. وتوضح كل رسالة السبب بكلمات بسيطة، مع «إعادة
المحاولة» و«تعديل» و«حذف». والبريد الذي ترسله بينما تغيّرت كلمة مرور الحساب
أو انتهى تسجيل دخوله ينتظر هناك ويُرسَل فور إصلاح ذلك، بدلًا من أن يفشل.
"""

["2026-10-04-1246-refused-changes"]
title = "التغييرات التي رفضها الخادم لم تعد تُلغى بصمت"
text = """
حين يواصل خادم البريد رفض تغيير، مثل نقل رسالة إلى مجلد حُذف من مكان آخر،
يعيدها Katna كما كانت وصار يخبرك بذلك بكلمات بسيطة، مع «التفاصيل» لرد
الخادم نفسه.
"""

["2026-10-04-1250-phone-scroll-steady"]
title = "قائمة ثابتة في نافذة بحجم الهاتف"
text = """
لم يعد التمرير السريع في قائمة البريد في نافذة بحجم الهاتف يتركها تهتز
صعودًا ونزولًا بينما تنزلق التبويبات بعيدًا.
"""

["2026-10-04-1309-needs-you-notifications"]
title = "تنبيه واحد حين يحتاجك حساب أو رسالة"
text = """
حين يرفض خادم البريد كلمة مرورك، أو ينتهي تسجيل دخول، أو يتعذر إرسال رسالة،
