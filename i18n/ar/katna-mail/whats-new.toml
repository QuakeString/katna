الصورة يتوقف عند «كل الحسابات» أيضًا.
"""

["2026-10-05-1257-service-starts-again"]
title = "Katna يشغّل خدمته في الخلفية بنفسه"
text = """
إذا لم تكن الخدمة التي تزامن بريدك وتعرض أيقونة صينية النظام قيد التشغيل،
يعيد Katna Mail تشغيلها بنفسه. لا حاجة إلى الطرفية. وإن ظلت لا تعمل، يخبرك
سطر فوق بريدك بذلك، مع «البدء مجددًا» والتفاصيل لنسخها في بلاغ.
"""

["2026-10-05-1430-stuck-window-replaced"]
title = "Katna Mail يُفتح حتى لو علقت نسخة منه"
text = """
إذا توقف Katna Mail عن الاستجابة في الخلفية، صار فتحه مجددًا يغلق النسخة
العالقة ويفتح نافذة جديدة، بدلًا من ألا يفعل شيئًا.
"""

["2026-10-05-1605-read-receipts-as-ticks"]
title = "إيصالات القراءة لم تعد تظهر كرسائل"
text = """
حين يرسل تطبيق بريد لدى أحدهم إيصال قراءة لبريد أرسلته، لم يعد يظهر كرسالة
