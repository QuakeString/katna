أبيض بحافة ناعمة بلون التمييز أثناء الكتابة، بدلًا من الشارة الرمادية ذات الحلقة
الملوّنة السميكة.
"""

["2026-10-02-0942-hourly-update-check"]
title = "التحديثات تصل أسرع"
text = """
يبحث Katna الآن عن إصدار جديد كل ساعة وفور استيقاظ حاسوبك من السكون، فيصلك إشعار التحديث بعد صدور الإصدار بوقت قصير.
"""

["2026-10-02-0958-faint-lines-dark"]
title = "خطوط باهتة في الوضع الداكن أيضًا"
text = """
في الوضع الداكن، صارت الخطوط بين الرسائل وتحت العناوين وحول البطاقات باهتة كما في الوضع الفاتح. أما الحقول والشرائح والأزرار فتبقى حوافها واضحة.
"""

["2026-10-02-1200-smaller-updates-after-a-break"]
title = "تحديثات صغيرة بعد انقطاع"
text = """
تبقى التحديثات صغيرة حتى لو فاتك يوم أو يومان من الإصدارات الجديدة. صار
Katna ينتقل من إصدارك عبر الإصدارات السابقة، ببضعة ميغابايتات لكل منها،
بدلًا من تنزيل الحزمة كاملة مجددًا.
"""

["2026-10-02-1218-replied-arrow"]
title = "اعرف الرسائل التي رددت عليها"
text = """
