«البحث في البريد»، أخفت، فلا يبدو أبدًا كنص كتبته أنت.
"""

["2026-10-02-1642-drag-from-empty-space"]
title = "حرّك النافذة من أي مساحة فارغة"
text = """
على Linux صار بإمكانك تحريك النافذة بسحب أي مساحة فارغة في الشريط الأيسر
أو المجلدات أو الشريط فوق بريدك، لا الشريط العلوي فقط.
"""

["2026-10-02-1643-space-folds-folders"]
title = "مفتاح المسافة يطوي المجلدات"
text = """
انقر مجلدًا يضم مجلدات أخرى، ثم اضغط مفتاح المسافة لفتحه أو طيّه، تمامًا
كالنقر على سهمه. وبعد النقر تتنقل مفاتيح الأسهم في جزء المجلدات أيضًا،
وينتقل Tab إلى قائمة البريد.
"""

["2026-10-02-1646-viewer-more-menu"]
title = "أدوات العارض تتسع في النوافذ الضيقة"
text = """
في النافذة الضيقة، صارت الأدوات أسفل عارض المرفقات تبقى داخله. والأزرار
التي لا تتسع تنتقل إلى قائمة ⋮ «المزيد»: التدوير أولًا، ثم «ملاءمة»، ثم
«صفحات داكنة». ويبقى رقم الصفحة والتكبير ظاهرين أطول مدة.
"""

["2026-10-02-1743-activity-report-fits"]
title = "تقرير النشاط يتسع في النافذة"
text = """
صار تقرير «النشاط» يبقى داخل النافذة بهوامش متساوية، ويتمرر حين تكون
النافذة قصيرة، فلا تُقطع صفوفه الأخيرة أبدًا.
"""

["2026-10-02-1846-folders-and-labels"]
title = "إعادة التسمية والحذف والسحب إلى المجلدات"
text = """
انقر بالزر الأيمن مجلدًا أنشأته لإعادة تسميته أو حذفه؛ والحذف ينقل بريده
إلى «المهملات» أولًا. اسحب البريد من القائمة إلى مجلد لنقله إليه. وفي
«نقل إلى» مربع بحث: اكتب لتجد مجلدًا، أو لتنشئ مجلدًا جديدًا وتنقل البريد
إليه. وعلى Gmail يضع «التصنيف كـ» التصنيفات على البريد ويزيلها، وإفلات
البريد على تصنيف يضيف ذلك التصنيف.
"""

["2026-10-02-1928-mail-rules"]
title = "قواعد البريد"
text = """
تفرز القواعد البريد الجديد بنفسها: حسب المرسل أو الموضوع أو الكلمات، تنقله
أو تصنّفه أو تميّزه بنجمة أو تعيد توجيهه أو تُسكته. أنشئ قاعدة في
«الإعدادات > المجلدات والقواعد»، أو انقر رسالة بالزر الأيمن واختر «إنشاء
قاعدة…»، وشاهد كم رسالة حديثة تطابقها قبل الحفظ. وفي «نقل إلى» علّم «نقل
البريد من … إلى هنا دائمًا» لنقل بريد مرسل وبريده القادم بنقرة واحدة.
"""

["2026-10-02-2017-rules-on-the-server"]
title = "قواعد تعمل وحاسوبك مطفأ"
text = """
صارت قواعد البريد تعمل على Gmail، أو على خادم بريدك حين يقبل قواعد Sieve،
فتفرز البريد على هاتفك أيضًا وأثناء إطفاء هذا الحاسوب. ويعرض «الإعدادات >
المجلدات والقواعد» أين تعمل كل قاعدة، ولماذا تبقى إحداها في Katna.
"""

["2026-10-03-0046-smooth-folded-tabs"]
title = "التبويبات المطوية تتبدل بسلاسة"
text = """
حين تطوي النافذة الضيقة تبويبات البريد الوارد إلى أيقونات، لم يعد التبديل
بينها مفاجئًا: يتقلص التبويب الذي تغادره إلى أيقونته بينما يتلاشى اسمه،
ويكبر التبويب الذي تفتحه بينما يظهر اسمه تدريجيًا.
"""

["2026-10-03-0051-read-rows-frosted"]
title = "البريد المقروء كالزجاج المصنفر أيضًا"
text = """
عند تشغيل الأجزاء كالزجاج المصنفر، صار البريد الذي قرأته يُظهر الضبابية خلف
القائمة كما يفعل البريد غير المقروء، بدرجة مختلفة قليلًا فقط، بدلًا من شريط
مصمت.
"""

["2026-10-03-0101-rounder-corners"]
title = "زوايا نافذة أكثر استدارة"
text = """
صارت «استدارة الزوايا» في «الإعدادات > تجريبي» تصل إلى 32 بكسل، أي ضعف
الاستدارة السابقة، ويمكنك كتابة الرقم في المربع بجانب شريط التمرير.
"""

["2026-10-03-0113-viewer-round-corners"]
title = "العارض يتبع زوايا النافذة المستديرة"
text = """
مع شريط العنوان الخاص بـ Katna والزوايا المستديرة، صار عارض المرفقات يدوّر
زاويتيه السفليتين لتطابقا النافذة، بدلًا من إظهار زوايا رمادية مربعة تتجاوز
حافة النافذة.
"""

["2026-10-03-0147-chat-go-down"]
title = "عودة إلى أحدث رسالة"
text = """
حين تمرّر بعيدًا إلى أعلى الدردشة، يظهر زر مستدير تدريجيًا في أسفل اليمين.
ينقلك بسلاسة إلى أحدث رسالة ويعدّ الرسائل التي وصلت في الأثناء.
"""

["2026-10-03-0147-chat-long-mails"]
title = "الرسائل الطويلة في الدردشات"
text = """
في الفقاعة الطويلة، تبقى صورة المرسل في أسفل ما تراه، وتبقى أزرار الرد
والتثبيت والمزيد في الجزء الظاهر. وانقر النص بالزر الأيمن للوصول إليها
كلها.
"""

["2026-10-03-0147-chat-scroll-bar"]
title = "شريط تمرير في الدردشات"
text = """
صار للدردشات شريط التمرير الهادئ نفسه الذي للرسالة المفتوحة، ويظهر حين
يكون المؤشر فوقها.
"""

["2026-10-03-0147-chat-translate"]
title = "الترجمة في الدردشات"
text = """
الرسالة المكتوبة بلغة أخرى تعرض ترجمتها في الدردشة أيضًا، كما في البريد.
انقر أي فقاعة بالزر الأيمن واختر «ترجمة» لترجمتها بنفسك، ومرة أخرى لعرض
الأصل.
"""

["2026-10-03-0150-search-pill-hovers"]
title = "تمرير متناسق في شريط البحث على الهاتف"
text = """
على الهاتف، صار زر المجلدات وصورة حسابك في وسط طرفي شريط البحث المستديرين،
ولكل زر في الشريط تأثير التمرير المستدير نفسه، على مسافة متساوية من حافة
الشريط.
"""

["2026-10-03-0159-starter-rules"]
title = "قواعد جاهزة للبدء"
text = """
صار «الإعدادات > المجلدات والقواعد» يقدّم قواعد جاهزة، متوقفة: إسكات
العروض الترويجية، ونقل النشرات الإخبارية إلى «للقراءة»، والإيصالات،
والشحنات، وتذاكر القطارات والطيران (IRCTC وAir India وIndiGo وغيرها)،
والرموز لمرة واحدة، والتنبيهات الأمنية، وبريد الشبكات الاجتماعية، ودعوات
التقويم. شغّل إحداها فتعمل لكل حساباتك، وتنشئ مجلدات مثل «السفر» عند
الحاجة. ويمكن للقواعد أيضًا فحص تبويب البريد الوارد، وما إذا كان البريد
آتيًا من قائمة بريدية.
"""

["2026-10-03-0200-chat-file-hover"]
title = "بطاقات ملفات أنعم في الدردشات"
text = """
لم يعد الملف في فقاعة الدردشة يصير داكنًا تحت المؤشر. بل يرتفع قليلًا
بصبغة خفيفة، ويبقى اسمه سهل القراءة.
"""

["2026-10-03-0210-opened-mail-stays-in-view"]
title = "الرسالة التي تفتحها تبقى ظاهرة"
text = """
حين يكون جزء القراءة بجانب القائمة، تبقى الرسالة التي تنقرها في مكانها من
القائمة عند فتح الجزء، أو تتمرر القائمة بالقدر الكافي لإظهارها كاملة. ولم
تعد تختفي عن النظر، سواء فتحتها من القائمة أو من نتائج البحث.
"""

["2026-10-03-0212-about-header-stays"]
title = "«حول» يُبقي رأسه ظاهرًا"
text = """
صار التمرير في «حول» يصغّر الشعار الكبير إلى شعار صغير في أعلى اليسار،
وبجانبه Katna وشعاره النصي والإصدار، ويبقى هذا الرأس في مكانه بينما
يتمرر الباقي تحته.
"""

["2026-10-03-0221-folded-tab-icon-settles"]
title = "التبويبات المطوية تستقر دون اهتزاز"
text = """
حين تتنقل بين تبويبات البريد الوارد المطوية، صار التبويب الذي تغادره يستقر
تمامًا حيث تقلّص، دون أن تنزاح أيقونته بكسلًا أو اثنين بعد انتهاء الحركة.
"""

["2026-10-03-0228-right-click-another-mail"]
title = "نقرة يمنى واحدة تكفي"
text = """
حين تكون قائمة رسالة أو مجلد مفتوحة، صار النقر بالزر الأيمن على رسالة أو
مجلد آخر يغلق القائمة المفتوحة ويفتح الجديدة فورًا، بدلًا من الحاجة إلى
نقرة يمنى ثانية.
"""

["2026-10-03-0235-rule-editor-fits"]
title = "محرر القواعد يتسع"
text = """
في محرر القواعد، تلتف الكلمات الطويلة وقوائم العناوين على أسطر أكثر بدلًا
من أن تُقطع، ويظهر «يطابق النمط» كاملًا، ويبقى المحرر داخل النافذة ويتمرر
حين تكثر شروطه.
"""

["2026-10-03-0235-soft-button-hover"]
title = "تمرير أنعم على الأزرار"
text = """
صارت الإشارة إلى زر مستدير تكبّر دائرته بلطف من ثلثي حجمها وتُظهرها
تدريجيًا، والأزرار البيضوية مثل «رد» تظهر تدريجيًا بإبطاء أكثر قليلًا. وعند
الابتعاد تتقلص الدائرة قليلًا وهي تتلاشى.
"""

["2026-10-03-0249-account-ring"]
title = "حلقة حساب أوضح"
text = """
صارت الحلقة الملونة حول صورة كل حساب أسمك، مع مسافة أكبر قليلًا بينها وبين
الصورة، في الشريط العلوي وقائمة الحساب و«الإعدادات».
"""

["2026-10-03-0335-chat-picture-steady"]
title = "صور ثابتة في الدردشات"
text = """
لم يعد التمرير بعد نهاية الدردشة، أو في دردشة لا شيء فيها للتمرير، يجعل
صورة المرسل وأزرار الفقاعة تقفز.
"""

["2026-10-03-0355-no-hover-while-scrolling"]
title = "تمرير أهدأ في قائمة البريد"
text = """
أثناء تمرير قائمة البريد، لم تعد الرسائل التي تمر تحت المؤشر تُضاء وتُظهر
أزرارها. وكما في Gmail، تُضاء الرسالة التي تحت المؤشر حين يتوقف التمرير.
"""

["2026-10-03-0541-rule-rows-drag"]
title = "القواعد تُسحب كالحسابات"
text = """
في «الإعدادات > المجلدات والقواعد»، صار سحب قاعدة يرفع صفها كاملًا، وتنزاح
القواعد الأخرى من طريقها، وتستقر حيث تفلتها، تمامًا كإعادة ترتيب الحسابات.
"""

["2026-10-03-0545-chat-go-down-aligned"]
title = "زر النزول في صف واحد"
text = """
في الدردشات، صار الزر المستدير الذي ينقلك إلى أحدث رسالة يقع فوق زر
الإرسال مباشرة، على الخط نفسه.
"""

["2026-10-03-0555-bottom-corners-round"]
title = "الزوايا السفلية المستديرة تبقى مستديرة"
text = """
مع شريط العنوان الخاص بـ Katna والزوايا المستديرة، لم تعد زاويتا النافذة
السفليتان تُظهران مربعًا من خلفيتها خارج الحد المستدير.
"""

["2026-10-03-0606-account-dot-only"]
title = "قائمة بريد أهدأ"
text = """
صارت أسطر البريد الوارد الموحّد تُظهر فقط نقطة الحساب الملونة بجانب
المرسل. مرّر المؤشر فوق النقطة لترى الحساب الذي تنتمي إليه الرسالة.
"""

["2026-10-03-0623-windows-updates"]
title = "التحديثات على Windows"
text = """
صار Katna على Windows يحدّث نفسه. يبحث عن إصدارات جديدة كل ساعة، وينزّلها
في الخلفية ويثبّتها حين تضغط «تحديث»، ثم يُفتح من جديد.
"""

["2026-10-03-0643-files-wildcard-search"]
title = "أحرف البدل في بحث «الملفات»"
text = """
في «الملفات»، صار البحث عن *.pdf يجد كل ملفات PDF، ويعمل * و? في أي موضع
من الاسم: invoice*2026* يجد كل فواتير 2026. ويعمل ذلك لملفات بريدك وفي
Google Drive وOneDrive.
"""

["2026-10-03-0643-linux-package-updates"]
title = "تحديثات لكل حزمة Linux"
text = """
صار AppImage وأرشيف Linux المضغوط يحدّثان نفسيهما مثل حزمة Arch. ومع حزمة
Fedora أو Snap أو Flatpak أو Nix، يخبرك Katna حين يصدر إصدار جديد ويعرض
الأمر الوحيد الذي يثبّته، جاهزًا للنسخ.
"""

["2026-10-03-0708-copy-codes"]
title = "انسخ الرموز من الإشعارات"
text = """
صار لإشعار البريد الجديد الذي يحمل رمز تسجيل دخول أو تحقق زر «نسخ» له،
وللإشعار الذي يحمل رابطًا للتحقق من عنوانك أو تأكيده زر يحمل اسم الموقع
الذي يفتحه. ولم تعد الأزرار في الإشعارات تجعل أيقونة Katna قافزة تتبع مؤشر
الفأرة.
"""

["2026-10-03-0730-contact-card-popover"]
title = "بطاقة جهة الاتصال في النوافذ الضيقة"
text = """
حين لا يتسع في النافذة مكان لجزء جهة الاتصال، يفتح النقر على اسم شخص أو
صورته بطاقة قصيرة فوق الرسالة، تشير إلى حيث نقرت. وسّع النافذة فيحل الجزء
الكامل محلها.
"""

["2026-10-03-0733-compose-icon-turns"]
title = "أيقونة الزر الكبير تدور عند تبديل الصفحات"
text = """
لم يعد التبديل بين «البريد» و«التقويم» و«جهات الاتصال» و«المهام»
و«الملاحظات» يستبدل أيقونة الزر الكبير أعلى الشريط الأيسر دفعة واحدة. بل
تدور الأيقونة القديمة مبتعدة وتتقلص بينما تدور الجديدة إلى مكانها، وعلى زر
الهاتف أيضًا.
"""

["2026-10-03-0746-sound-sets"]
title = "مجموعات أصوات الإشعارات"
text = """
صار في «الإعدادات > الإشعارات» مجموعات أصوات: طيور، وطبيعة، وحيوانات،
وحشرات، وإلكترونية، وصباح، وأجراس Katna، أو أصوات سطح مكتبك. يغرّد البريد
الجديد كطائر أبي الحناء ما لم تختر مجموعة أخرى. ويمكن أن يكون لأي حدث صوته
الخاص، أو ملف صوتي تختاره.
"""

["2026-10-03-0750-chat-seen-ticks"]
title = "من رأى رسالتك، في الدردشات"
text = """
في عرض الدردشة، تتلون علامات الصح على البريد الذي أرسلته مع التتبع حين يفتحه
أحد. وبجانبها عين صغيرة تعدّ مرات الفتح ورابط يعدّ الروابط المتبعة. أبقِ
المؤشر عليها لترى من فتحها أو تبع رابطًا، كما تُظهر العين في عرض البريد.
"""

["2026-10-03-0834-drawer-edge-clean"]
title = "لا خط بجانب المجلدات المنزلقة"
text = """
على الهاتف أو الجهاز اللوحي، صارت المجلدات التي تنزلق من القائمة تستقر عند
الحافة دون أن يومض خط رفيع بجانبها أثناء استقرارها.
"""

["2026-10-03-0845-chat-summary-button-hides"]
title = "زر الملخص يخفيه مجددًا"
text = """
في عرض الدردشة، صارت الشرارة في الأعلى تخفي الملخص حين يكون ظاهرًا،
وتُظهره مجددًا عند النقرة التالية، كما تفعل في عرض البريد.
"""

["2026-10-03-0915-big-button-glides"]
title = "الزر الكبير ينساب بين الصفحات"
text = """
حين تكون المجلدات مفتوحة، لم يعد تبديل الصفحات يقفز بالزر الكبير في الأعلى
إلى عرضه الجديد أو يستبدل كلمته دفعة واحدة. بل يتمدد الزر بهدوء إلى عرضه
الجديد بينما تتلاشى الكلمة القديمة صاعدة وترتفع الجديدة، مع الأيقونة الدوّارة.
"""

["2026-10-03-0945-flat-row-hover"]
title = "تمرير أوضح في قائمة البريد"
text = """
لم يعد السطر الذي تحت المؤشر يرتفع بظل ناعم. بل يأخذ صبغة مسطحة أقوى
قليلًا، فتبقى حوافه حادة في الألوان الفاتحة والداكنة.
"""

["2026-10-03-0959-drawer-bounce-back"]
title = "المجلدات تنزلق بارتدادها وبحافة نظيفة"
text = """
على الهاتف أو الجهاز اللوحي، استعادت المجلدات التي تنزلق من القائمة ارتدادها
الصغير، ولم يعد هناك ظل على حافتها بجانب شريط التطبيقات.
"""

["2026-10-03-1030-crisp-card-edges"]
title = "حواف بطاقات أوضح في الألوان الفاتحة"
text = """
في الألوان الفاتحة، صار لقائمة البريد والرسالة المفتوحة والبطاقات الأخرى
حافة رفيعة واضحة وظل قصير جدًا بدلًا من ضبابية ناعمة، فتبرز عن الصفحة بالوضوح
نفسه الذي تبرز به في الألوان الداكنة.
"""

["2026-10-03-1206-matching-choice-chips"]
title = "رقاقات اختيار متطابقة"
text = """
صارت الخيارات في «خيارات البحث» و«النشاط» والكتابة بالذكاء الاصطناعي ودفاتر
عناوين جهة الاتصال رقاقة واحدة: بالحجم نفسه في كل مكان، مع علامة صح على
المختارة.
