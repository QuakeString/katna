"""

["2026-09-27-1615-from-row"]
title = "اختر مُرسِل الرسالة"
text = """
تعرض الرسائل الجديدة الآن صف «من» أسفل «إلى». انقر سهمه للإرسال من حساب
آخر من حساباتك. ويبدأ البريد الجديد من حسابك الأول، ما لم تختر حسابًا
افتراضيًا آخر في «الإعدادات > الكتابة > إرسال الرسائل الجديدة من».
"""

["2026-09-27-1621-unified-inbox"]
title = "البريد الوارد الموحّد"
text = """
شغّل «الإعدادات > الحسابات > البريد الوارد الموحّد» لترى بريد كل حساباتك
معًا. يتصدّر «كل الحسابات» جزء المجلدات، وفيه البريد الوارد وغير
