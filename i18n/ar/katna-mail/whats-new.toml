خادم Katna الخاص لترجمته إلا عندما تطلب ذلك. ومن «الإعدادات > عام >
الترجمة» تختار لغتك واللغات التي تُترجم دائمًا.
"""

["2026-09-27-1744-open-and-click-tracking"]
title = "اعرف متى يُفتح بريدك"
text = """
شغّل العين بجوار المستلمين لترى متى يفتح كل منهم رسالتك أو يتابع رابطًا
