"""

["2026-10-02-1451-card-shows-signer"]
title = "البطاقة تُظهر من وقّع الرسالة المفتوحة"
text = """
صارت بطاقة الشخص تقرأ توقيع الرسالة المفتوحة لديك، لا أحدث رسالة فقط. فحين
