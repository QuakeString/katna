توقيع آخر. وصارت زاوية نافذة «إنشاء» أيضًا تتحاذى مع البطاقة بجانبها.
"""

["2026-10-02-0654-attach-from-drive"]
title = "أرفق من Google Drive"
text = """
صار مشبك الورق في «إنشاء» يفتح منتقي «الملفات»، وهو نفسه «من الملفات» في الدردشة،
وفيه Google Drive بجانب ملفات بريدك و«هذا الحاسوب…» لأي شيء آخر. الملفات التي
تتسع تدخل في الرسالة؛ أما الملفات الكبيرة ومستندات Google فتُرسل كرابط، يُشارك مع
المستلمين عند الإرسال.
"""

["2026-10-02-0734-peek-and-reply-in-notifications"]
title = "ألقِ نظرة ورُدّ من الإشعار"
text = """
صار في إشعار البريد الجديد «نظرة سريعة»، الذي يعرض الرسالة نفسها في الإشعار ذاته،
و«رد»، حيث تكتب جوابك هناك مباشرة وتضغط «إرسال». يُرسل الرد من الحساب الذي وصلت
إليه الرسالة، بعد مهلة «التراجع عن الإرسال»؛ ويفتحه «تراجع» في Katna Mail لتكمل
الكتابة. وعلى Linux صار للبريد الجديد أيضًا رنين خاص أعلى صوتًا؛ اختر غيره في
«الإعدادات > الإشعارات».
"""

["2026-10-02-0735-drive-viewer-opens-at-once"]
title = "ملفات Drive تُفتح فورًا"
text = """
صار فتح ملف من Drive يُظهر العارض مباشرة، مع قوس دوّار حتى يصل الملف. وصارت
الملاحظات في أسفل النافذة تستقبل نقراتها بنفسها، فلم يعد «إغلاق» ينقر ما تحتها.
"""

["2026-10-02-0740-smaller-updates"]
title = "تحديثات أصغر"
text = """
