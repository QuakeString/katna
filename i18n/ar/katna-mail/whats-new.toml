أيقونة صينية النظام ما ينتظرك.
"""

["2026-10-04-1510-dialogs-fit-phone"]
title = "نوافذ الحوار تتسع في نافذة بحجم الهاتف"
text = """
صارت «ما الجديد» و«حول» و«التحديثات» و«اختصارات لوحة المفاتيح» ونوافذ
الحوار الأخرى تتسع داخل النافذة الضيقة ذات إطار Katna الخاص، بدلًا من أن
تتجاوز حوافها.
"""

["2026-10-04-1511-solid-mail-list-bar"]
title = "لا شيء ينزلق تحت الأشرطة"
text = """
صارت رسائل قائمة البريد والرسالة المفتوحة وفقاعات الدردشة تبدأ تحت أشرطتها
بدلًا من الانزلاق تحتها، وتبقى الأشرطة مصمتة. وأُزيل مفتاح «رؤوس كالزجاج
المصنفر»، ومعه الزوايا الغريبة التي جلبها.
"""

["2026-10-04-1525-menus-inside-window"]
title = "القوائم والتلميحات تبقى داخل النافذة"
text = """
مع إطار النافذة الخاص بـ Katna، لم تعد قوائم النقر بالزر الأيمن والنوافذ
المنبثقة والتلميحات القريبة من الحافة تفيض فوق ظل النافذة؛ بل تبقى داخلها.
"""

["2026-10-04-1525-unified-stacked-picture"]
title = "«كل الحسابات» تُظهر كل الصور"
text = """
مع فتح «كل الحسابات»، صارت الصورة في أعلى اليمين كومة صغيرة من صور حساباتك،
مع +N للبقية، فتميّزها عن حساب واحد بنظرة. أشر إليها فتتباعد الصور بهدوء.
"""

["2026-10-04-2338-all-accounts-row"]
title = "عودة إلى «كل الحسابات» من قائمة الحساب"
text = """
صارت قائمة الحساب تبدأ بـ«كل الحسابات»، مع عدد غير المقروء، فتعيدك نقرة
