«مشاركة»: أضف أشخاصًا بصفة «عارض» أو «معلّق» أو «محرّر»، وغيّر صلاحية من لديه وصول
أو أزلها، وافتحه لأي شخص لديه الرابط. ولا يراسلهم Drive بالبريد إلا إذا حددت ذلك.
"""

["2026-10-02-0909-soft-search-box"]
title = "مربع بحث أنعم"
text = """
