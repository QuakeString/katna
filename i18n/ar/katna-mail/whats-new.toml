الواضحة.
"""

["2026-10-02-0756-ai-replies-signed"]
title = "ردود الذكاء الاصطناعي تنتهي بتوقيعك"
text = """
لم تعد الردود والملاحظات التي يكتبها الذكاء الاصطناعي تنتهي بـ «مع أطيب التحيات»
واسمك. بل يوقّعها توقيعك: في رد بطاقة الملخص، يختار وسم التوقيع تحت النص أيّ
توقيع، كما في «إنشاء».
"""

["2026-10-02-0801-unified-inbox-tabs"]
title = "تبويبات في البريد الوارد الموحّد"
text = """
صار للبريد الوارد لكل حساباتك تبويبات أيضًا: «الأساسية» و«العروض الترويجية»
و«الشبكات الاجتماعية» و«التحديثات» و«المنتديات»، وبريد كل حساب في تبويب نوعه.
وتبيّن نقطة بجانب كل مرسل الحساب الذي جاءت إليه الرسالة. اختر حسابًا واحدًا تحته
لترى تبويبات ذلك الحساب الخاصة، أو اختر مجموعة أخرى في «الإعدادات > البريد
الوارد».
"""

["2026-10-02-0805-feeds-removed"]
title = "«الخلاصات» غادرت الشريط الأيسر"
text = """
لن يقرأ Katna خلاصات RSS وAtom في النهاية، لذا غادر زر «الخلاصات» وصفحة «قريبًا»
الخاصة به الشريط الأيسر. وتحتفظ «الملفات» بـ Ctrl+7.
"""

["2026-10-02-0820-drive-bin-and-rename"]
title = "أعد تسمية ملفات Drive وانقلها إلى سلة المهملات"
text = """
