وهاتفه وعنوان الشركة من تلك الرسالة.
"""

["2026-10-02-1510-search-click-away"]
title = "انقر في أي مكان لمغادرة مربع البحث"
text = """
صار النقر على المساحة الفارغة في الشريط العلوي، بجوار مربع البحث، يُخرجك
من المربع، تمامًا كما يفعل النقر على قائمة البريد. ويبقى بحثك كما هو.
"""

["2026-10-02-1515-empty-message-no-draft"]
title = "لا مسودات فارغة"
text = """
الرسالة الجديدة التي أفرغتها مجددًا قبل إغلاقها لم تعد تبقى في «المسودات»،
تمامًا كالرد الفارغ في محادثة.
"""

["2026-10-02-1513-dark-pages"]
title = "صفحات داكنة في العارض"
text = """
في الوضع الداكن، صار لعارض المرفقات زر على شكل نصف قمر يعرض ملفات PDF
والمستندات والشرائح وجداول البيانات والملفات النصية الساطعة بلون داكن.
تحتفظ الألوان بدرجتها، وتُخفَّت الصور داخل الصفحة بدلًا من أن تنقلب إلى
صور سالبة، ويصير الورق الممسوح ضوئيًا داكنًا كالنص. ويتذكر Katna اختيارك
للملف التالي.
"""

["2026-10-02-1522-window-corners"]
title = "اختر زوايا نافذتك وحدّها"
text = """
مع شريط العنوان الخاص بـ Katna، صار في «الإعدادات > تجريبي» شريط تمرير
«استدارة الزوايا»، من المربعة إلى المستديرة، ومفتاح «الحد» بعتامته
