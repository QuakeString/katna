"""

["2026-09-27-1628-select-on-screen-first"]
title = "تحديد غير المقروءة أو المميّزة بنجمة، كما في Gmail"
text = """
عادت «المقروءة» و«غير المقروءة» و«المميّزة بنجمة» و«غير المميّزة بنجمة» في
قائمة «تحديد» تحدد البريد المطابق الظاهر على الشاشة. ويعرض سطر فوق القائمة
