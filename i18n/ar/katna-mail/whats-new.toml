كتب أحدث رسالة في المحادثة، هنا أو على الويب. ويختفي حين يردّ الطرف الآخر.
"""

["2026-10-02-1219-tray-icon-follows-dark"]
title = "أيقونة علبة النظام تتبع الوضع الفاتح والداكن"
