الحسابات؛ والسهم بجانب كلٍّ منها يفتح سطرًا لكل حساب. وصار لاسم كل حساب
الآن سهم يطوي مجلداته.
"""

["2026-09-27-1627-right-click-move-and-not-spam"]
title = "قوائم السياق تناسب كل مجلد"
text = """
صار اختيار مجلد أو تصنيف من «نقل إلى» في قائمة السياق ينقل البريد فعلًا،
مع إمكانية «تراجع»، حتى من نتائج البحث. وفي «الرسائل غير المرغوب فيها»
يصبح «الإبلاغ عن محتوى غير مرغوب فيه» «ليس محتوى غير مرغوب فيه». وتعرض
«المهملات» «نقل إلى البريد الوارد» و«حذف نهائي»، ويعرض «الأرشيف» «نقل
إلى البريد الوارد»، وتُسقط «المسودات» و«المُرسَلة» العناصر التي لا تنطبق
عليها.
"""

["2026-09-27-1633-drag-accounts"]
title = "اسحب الحسابات لترتيبها"
text = """
