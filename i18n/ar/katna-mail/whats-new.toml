text = """
انقر رسالة في القائمة مع Ctrl لتحديدها، وانقر غيرها مع Ctrl لإضافتها.
والنقر مع Shift يحدد كل الرسائل بدءًا من آخر رسالة نقرتها. ولفتح رسالة
في نافذتها الخاصة، انقرها بالزر الأيمن واختر «فتح في نافذة جديدة».
"""

["2026-10-02-1610-frosted-panes"]
title = "أجزاء ودردشة وبحث كالزجاج المصنفر"
text = """
عند تشغيل «إضفاء ضبابية على خلفية النافذة»، صارت قائمة البريد والرسالة
المفتوحة وبطاقة الشخص تُظهر الضبابية أيضًا، مع شريط «عتامة الأجزاء».
وتُظهر المساحة خلف فقاعات الدردشة قدرًا أكبر منها قليلًا، ويبقى مربع البحث
كالزجاج المصنفر أثناء الكتابة. ولكلٍّ منها مفتاحه في «الإعدادات > تجريبي».
"""

["2026-10-02-1618-fainter-hints"]
title = "تلميحات أخفت في المربعات الفارغة"
text = """
