وفي البحث.
"""

["2026-10-05-1620-reply-tools-fold"]
title = "أدوات الرد تتسع في النافذة الضيقة"
text = """
حين يكون جزء القراءة أو النافذة ضيقًا، لم يعد شريط التنسيق والصف بجانب
«إرسال» يتجاوزان الرد. فالأدوات التي لا تتسع تنتقل إلى ⋮ «المزيد»، الأقل
استخدامًا أولًا، وعلى الهاتف يُظهر «إرسال» أيقونته فقط.
"""

["2026-10-05-1637-read-receipts-out-of-the-list"]
title = "إيصالات القراءة تبقى خارج قائمة البريد"
text = """
لم يعد إيصال القراءة لبريد أرسلته يظهر في قائمة البريد كسطر «Read: …».
وتحتفظ المحادثة بموضوعها ومعاينتها، ويُظهر بريدك المرسل علامات الصح.
"""

["2026-10-05-1640-windows-frost"]
title = "زجاج مصنفر على Windows"
text = """
صارت القوائم والنوافذ المنبثقة ونوافذ الحوار وأشرطة العارض والأجزاء
كالزجاج المصنفر تُضفي ضبابية على ما تحتها على Windows أيضًا، بإعدادات قوة
