تجريبي > قوائم ونوافذ حوار كالزجاج المصنفر».
"""

["2026-10-06-0156-phone-activity"]
title = "النشاط على الهاتف"
text = """
في نافذة بحجم الهاتف، صار «النشاط» في شريط البحث بجانب صورة حسابك، مع عدد
مرات الفتح والنقرات الجديدة. وتتسع قائمته داخل النافذة.
"""

["2026-10-06-0215-pin-bar-no-jump"]
title = "التثبيت يُبقي الدردشة ثابتة"
text = """
في عرض الدردشة، لم يعد تثبيت رسالة أو إلغاء تثبيتها يجعل المحادثة تقفز، حتى
في نهايتها تمامًا: يظهر الشريط المثبت تدريجيًا فوقها وتبقى الرسائل حيث
كانت.
"""

["2026-10-06-0942-fainter-row-marks"]
title = "مربعات تحديد ونجوم أهدأ"
text = """
في قائمة البريد، صار مربع التحديد والنجمة وعلامة «المهمة» في السطر باهتة
حتى تشير إلى السطر. وتظهر النجوم والعلامات المفعّلة كما كانت.
"""

["2026-10-06-1448-activity-beside-calendar"]
title = "النشاط مع الأزرار الأخرى"
text = """
في النافذة الأعرض، صار زر «النشاط» على اليمين مع «التقويم» و«الإعدادات».
ومع فتح «كل الحسابات»، تتباعد صور الحسابات عند التمرير دون تحريك الأزرار
بجانبها.
"""

["2026-10-06-1524-search-fills-bar"]
title = "مربع بحث أطول"
text = """
في النافذة العريضة، صار مربع البحث يمتد إلى الأزرار على اليمين بدلًا من أن
يتوقف في منتصف الطريق. وتُفتح «خيارات البحث» في الوسط تحته وتبقى بعرض مريح.
"""

["2026-10-07-0110-follow-up-for-you"]
title = "متابعات ترسل نفسها"
text = """
في القائمة بجانب «إرسال»، صار بإمكان «المتابعة إن لم يصل رد» إرسال رسالة
متابعة قصيرة نيابة عنك حين لا يجيب أحد: اكتبها مرة واحدة، واختر الموعد،
وقرّر إن كنت تريد المحاولة مرة أخرى. تُرسَل في أيام العمل خلال ساعات العمل،
وتتوقف فور رد أي أحد (الردود التلقائية لا تُحتسب)، وتنتظرك بدلًا من أن تُرسَل
متأخرة إن كان حاسوبك مطفأ. وتُظهر رقاقة بجانب «إرسال» ما ضُبط. أو اكتفِ
بتذكير، صار الآن بأي تاريخ تختاره.
"""

["2026-10-07-0117-drawer-logo"]
title = "شعار Katna في الدرج"
text = """
على الهاتف، صار الدرج الذي يضم مجلداتك يُظهر شعار Katna بجانب اسمه، بلون
التمييز الخاص بك، بدلًا من ظرف عادي. وعلى الجهاز اللوحي، حيث يُظهرهما الشريط
العلوي أصلًا، يبدأ الدرج بمجلداتك.
"""

["2026-10-07-0118-clock-popup"]
title = "ساعة سطح مكتب أكثر ترتيبًا"
text = """
في Katna Digital Clock، صارت مناطقك الزمنية بجانب التاريخ في الأعلى، وتنطوي
قائمة «المهام» بنقرة على عنوانها. وإضافة حدث تفتح نافذة «حدث جديد» صغيرة
بدلًا من التطبيق كاملًا. ولم تعد المهام الجديدة تظهر مرتين بعد خلل في
المزامنة.
"""

["2026-10-07-0232-mcp-server"]
title = "دع مساعدي الذكاء الاصطناعي يستخدمون بريدك"
text = """
يتيح «الإعدادات > خادم MCP» لمساعدي الذكاء الاصطناعي على هذا الحاسوب، مثل
Claude Desktop وClaude Code وLM Studio، البحث في بريدك وقراءته وحفظ مسودات
لتراجعها. وهو متوقف حتى تشغّله. اختر الحسابات التي يرونها، وانسخ ما تلصقه
في مساعدك، وشاهد ما فعلوه مؤخرًا. ولا يرسل المساعدون البريد أو يحذفونه أو
ينقلونه أبدًا.
"""

["2026-10-07-0359-waiting-for-reply"]
title = "شاهد ما ينتظر ردًا"
text = """
البريد الذي أرسلته مع متابعة أو تذكير يُدرَج تحت «بانتظار الرد»، أسفل
«المُرسَلة». وتُظهر أسطره رقاقة بما سيحدث بعدها ومتى، في «بانتظار الرد» وفي
«البريد الوارد» أيضًا. افتح إحداها لنقل المتابعة إلى وقت آخر، أو إرسالها
الآن، أو إيقافها.
"""

["2026-10-07-0505-follow-ups-in-chats"]
title = "المتابعات في عرض الدردشة"
text = """
في عرض الدردشة، تظهر المتابعة التي تنتظر الإرسال كفقاعة باهتة في نهاية
الدردشة، مع «تعديل» و«الإرسال الآن» و«إيقاف». ولضبط واحدة، انقر «إرسال»
بالزر الأيمن أو اضغط عليه مطولًا واختر «المتابعة إن لم يصل رد».
"""

["2026-10-07-0603-remind-me"]
title = "ذكّرني بأي رسالة"
text = """
اضغط H على رسالة، أو استخدم «ذكّرني» بجانب «تأجيل»، ليُذكّرك في وقت ما بينما
تبقى الرسالة في مكانها. وإن ذكرت الرسالة أن شيئًا مستحق بحلول يوم ما، يقترح
Katna صباح اليوم السابق. والتذكيرات مهام في «المهام»، مدرجة تحت «التذكيرات»
وظاهرة على سطر الرسالة. ومفتاح B يؤجّل.
"""

["2026-10-07-0718-snooze-extras"]
title = "التأجيل يعرف حين يرد أحدهم"
text = """
تعود المحادثة المؤجَّلة فورًا حين يكتب فيها أحد. وفي «اختيار التاريخ والوقت»
يمكنك كتابة «tue 3pm» أو «in 2 hours». ويمكن لإشعار رسالة جديدة تأجيلها
لساعة أو حتى الغد.
"""

["2026-10-07-0802-your-snooze-times"]
title = "التأجيل على طريقتك"
text = """
حدّد ما تعنيه «لاحقًا اليوم» و«غدًا» و«نهاية هذا الأسبوع» و«الأسبوع القادم»،
وأضف وقتًا خاصًا بك، في «الإعدادات > البريد الوارد». ويعرض «المؤجَّلة»
البريد حسب موعد عودته. وعلى الهاتف، اسحب سطرًا إلى اليسار لتأجيله.
"""

["2026-10-07-0913-pick-date-in-place"]
title = "اختر تاريخًا حيث نقرت"
text = """
صار «اختيار التاريخ والوقت» ينزلق داخل قائمة التأجيل و«ذكّرني» نفسها، بدلًا
من مربع في وسط النافذة. وسهم الرجوع يعيدك إلى الأوقات.
"""

["2026-10-07-0953-nudges"]
title = "الأسئلة التي لم يجب عنها أحد تعود"
text = """
البريد الذي أرسلته وسألت فيه شيئًا ولم يصلك رد خلال ثلاثة أيام يعود إلى
أعلى «البريد الوارد» مع «أُرسلت قبل 3 أيام. هل تريد المتابعة؟». انقره
للمتابعة، أو انقر x لإبعاده. ويوقفه «الإعدادات > البريد الوارد».
"""

["2026-10-08-0128-settings-menu-tint"]
title = "لـ«الإعدادات» قائمتها الخاصة"
text = """
قائمة الصفحات على يسار «الإعدادات» صارت بلون خفيف متدرج من الأعلى إلى
الأسفل، فتبدو منفصلة عن الصفحة التي تقرؤها.
"""

["2026-10-08-0136-schedule-pick-in-place"]
title = "«جدولة الإرسال» تختار التاريخ في مكانها"
text = """
صار «اختيار التاريخ والوقت» في «جدولة الإرسال» و«المتابعة إن لم يصل رد»
ينزلق داخل القائمة التي فتحته منها، كما في «تأجيل»، بدلًا من نافذة فوق
الرسالة. ويعيدك سهم الرجوع أو Esc إلى الأوقات.
"""

["2026-10-08-0141-tray-icon-follows-colors-after-login"]
title = "أيقونة علبة النظام تطابق لوحتك منذ تسجيل الدخول"
text = """
في KDE Plasma، تأخذ أيقونة علبة النظام أحادية اللون الآن لون لوحتك بعد
تسجيل الدخول مباشرة، وتتبع كل تبديل بين الفاتح والداكن، دون إعادة تشغيل
Katna.
"""

["2026-10-08-0153-search-attachment-types"]
title = "ابحث عن الرسومات والصور"
text = """
في «خيارات البحث» نوعا مرفقات جديدان: DWG لرسومات AutoCAD (وملفات DXF)،
و«صورة» للصور الفوتوغرافية وغيرها. وصار XLSX يجد ملفات XLS القديمة أيضًا،
وPPTX يجد PPT، فلكل منها زر واحد.
"""

["2026-10-08-0157-menus-one-of-each-pair"]
title = "القوائم تعرض ما ينطبق فقط"
text = """
لم تعد قائمة «المزيد» تعرض الخيارين المتقابلين معًا. فالرسالة المقروءة تعرض
«وضع علامة «غير مقروءة»»، والمميزة بنجمة «إزالة النجمة»، والمهمة «وضع
علامة «غير مهمة»»، والمثبتة «إلغاء التثبيت». وعند تحديد عدة رسائل مختلفة،
يظهر الإجراء الذي يجعلها كلها متماثلة، هنا وفي قائمة النقر بالزر الأيمن.
"""

["2026-10-08-0210-settings-card-edge"]
title = "«الإعدادات» على بطاقة"
text = """
في الألوان الفاتحة صار لصفحة «الإعدادات» الحد الرفيع نفسه والظل الناعم
نفسه اللذان لقائمة البريد، فتبدو منفصلة عن النافذة خلفها.
"""

["2026-10-08-0212-steady-app-buttons"]
title = "أزرار تطبيقات أنعم"
text = """
لم يعد النقر على تطبيق في الشريط الجانبي الأيسر، أو في الشريط السفلي على
الهاتف، يجعله يهتز: تكتمل موجة الضغط، وتكبر علامة التحديد من المنتصف
بينما يحافظ الزر على حجمه.
"""

["2026-10-08-0232-account-card-pages"]
title = "القوائم تنزلق داخل بطاقة الحساب"
text = """
صارت قائمة ☰ وقائمة اللغات تنزلقان داخل بطاقة الحساب بدلًا من الظهور فجأة،
مع زر رجوع على اليمين للعودة.
"""

["2026-10-08-0618-app-card-edges"]
title = "كل التطبيقات على البطاقة نفسها"
text = """
صارت «التقويم» و«جهات الاتصال» و«المهام» و«الملاحظات» و«الملفات» تستقر على
بطاقة لها الحافة الرفيعة نفسها والظل الناعم نفسه اللذان لـ«البريد» و«الإعدادات».
"""

["2026-10-08-0621-capture-keys-on-gnome"]
title = "مفاتيح التدوين السريع في GNOME"
text = """
صار Meta+Alt+T لإضافة مهمة وMeta+Alt+N لتدوين ملاحظة يعملان في GNOME أيضًا.
في المرة الأولى يسألك GNOME هل يمكن لـ Katna استخدامهما، ويمكنك تغيير
المفاتيح من إعداداته.
"""

["2026-10-08-0629-movable-markup-tools"]
title = "حرّك أدوات وضع العلامات"
text = """
عند وضع علامات على ملف PDF، اسحب النقاط في طرف الأدوات لتحريكها إلى أي
مكان فوق الصفحة، فلا تغطي أبدًا ما تعلّم عليه. وانقر النقاط نقرًا مزدوجًا
لإرجاعها إلى مكانها.
"""

["2026-10-08-0641-screen-readers"]
title = "يعمل مع قارئات الشاشة"
text = """
صار بإمكان Orca وقارئات الشاشة الأخرى قراءة Katna Mail: قائمة البريد،
والمجلدات، والرسالة المفتوحة، والأزرار، والقوائم، والمفاتيح، والنوافذ الحوارية.
"""

["2026-10-08-0641-send-feedback"]
title = "إرسال ملاحظات"
text = """
يرسل «مساعدة > إرسال ملاحظات»، الموجود أيضًا في «الإعدادات السريعة» و«الإعدادات >
ملاحظات المستخدمين»، مشكلة أو فكرة مباشرةً إلى Katna. ويعرض «ما يُرسَل» النص
بالضبط قبل إرساله، والبريد الإلكتروني للرد اختياري.
"""

["2026-10-08-0641-usage-statistics"]
title = "إحصاءات استخدام مجهولة الهوية، إن شئت"
text = """
في «الإعدادات > ملاحظات المستخدمين» مفتاح جديد، متوقف حتى تشغّله: يرسل مرة
في الأسبوع الميزات التي استخدمتها، بنعم أو لا، لتنال الميزات الأكثر استخدامًا
أكبر قدر من العناية. وتسرد الصفحة كل ما يُحتسب وتعرض تقرير هذا الأسبوع.
"""

["2026-10-08-0655-more-results-on-server"]
title = "البحث يجد البريد الأقدم على الخادم"
text = """
لا يُنزَّل البريد الأقدم كاملًا، لذا لا يستطيع البحث قراءة كلماته هنا. والآن،
بعد توقف قصير عن الكتابة أو عند الضغط على Enter، يسأل Katna خادم بريدك أيضًا
ويسرد ما يجده تحت «نتائج أخرى على الخادم».
"""

["2026-10-08-0657-search-unspaced-scripts"]
title = "البحث بالتايلاندية واللاوية والخميرية والبورمية"
text = """
يجد البحث الكلمة في البريد المكتوب بالتايلاندية أو اللاوية أو الخميرية أو
البورمية حتى حين لا تفصل المسافات بين كلمات الجملة.
"""

["2026-10-08-0704-wrap-between-words"]
title = "الأسطر الطويلة تلتف بين الكلمات"
text = """
صار النص بالعربية والهندية وغيرها من الكتابات الهندية، وبالتايلاندية
واللاوية والخميرية والبورمية، يلتف بين الكلمات بدلًا من كسر الكلمة في
وسطها، ولم تعد أسطر الصينية واليابانية تبدأ بعلامة إغلاق.
"""

["2026-10-08-0755-press-fills-buttons"]
title = "الضغط يملأ الزر كله"
text = """
صار النقر على رقاقة أو زر محدَّد الإطار يملؤه حتى حافته وزواياه، بدلًا من
إظهار شكل أصغر داخله.
"""

["2026-10-08-0802-command-palette"]
title = "لوحة الأوامر"
text = """
اضغط Ctrl+Shift+P واكتب للعثور على أي إجراء أو إعداد، ثم اضغط Enter
لتشغيله. يعرض كل إجراء اختصار لوحة المفاتيح الخاص به، وما استخدمته آخر
مرة يكون في الأعلى.
"""
