أيقوناتها، ويحتفظ النوع الذي اخترته بتسميته، وتحصل شرائح الشخص والأيام والترتيب
على صف خاص بها.
"""

["2026-10-02-0828-uploads-tray"]
title = "تابع عمليات الرفع أثناء سيرها"
text = """
