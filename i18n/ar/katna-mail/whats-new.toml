"""

["2026-09-27-2042-activity"]
title = "النشاط للبريد المتتبَّع"
text = """
يعرض «النشاط» بجوار مربع البحث عدد رسائلك المتتبَّعة التي فُتحت وعدد
مرات متابعة روابطها، مع ترتيب سطور الموضوع حسب عدد مرات فتحها.
"""

["2026-09-27-2204-search-trigger-words"]
title = "ابحث في بريدك من KRunner باستخدام k"
text = """
اكتب k أو m ثم مسافة ثم ما تريد العثور عليه في KRunner أو بحث GNOME لتحصل
على النتائج نفسها التي يعرضها مربع البحث في Katna Mail، مثل «k budget».
واختر كلماتك الخاصة من «الإعدادات > عام».
"""

["2026-09-27-2224-activity-button"]
title = "النشاط بجوار مربع البحث"
text = """
يعدّ زر «النشاط» بجوار مربع البحث مرات الفتح والنقر الجديدة لبريدك
المتتبَّع، ويعرض من فتح ماذا والروابط التي تابعها؛ انقر أحدها لفتح تلك
الرسالة. وتعرض «التفاصيل» معدلات الفتح والنقر، ومرات الفتح حسب اليوم،
وأفضل سطور الموضوع لديك خلال آخر 7 أو 30 يومًا، أو كل الأوقات، أو تواريخ
تختارها. وتعرض الرسالة المُرسَلة الآن كم مرة فتحها كل شخص وتابع رابطًا.
"""

["2026-09-27-2239-mailbox-insights"]
title = "إحصاءات صندوق البريد"
text = """
تعرض «النشاط > التفاصيل» الآن أيضًا كم رسالة أرسلتَ واستلمتَ في الفترة،
وكم مرة تردّ أنت والآخرون وبأي سرعة، والأشخاص الذين تراسلهم أكثر، وفي أي
الأيام والساعات يصل بريدك. ويُحسب ذلك على كمبيوترك من البريد الموجود
أصلًا في Katna.
"""

["2026-09-28-0059-sign-in-with-google"]
title = "تسجيل الدخول باستخدام Google أو Microsoft"
text = """
أضف حساب Gmail أو Outlook بتسجيل الدخول على صفحة Google أو Microsoft
نفسها في متصفحك، دون كلمة مرور للتطبيقات. وتعمل الآن عناوين Outlook.com
وHotmail أيضًا. وإذا توقّف تسجيل الدخول عن العمل، تعرض ملاحظة أسفل النافذة
تسجيل الدخول مجددًا.
"""

["2026-09-28-0054-tracking-on-by-default"]
title = "التتبّع والإشعارات مفعّلة من البداية"
text = """
تبدأ الرسائل الجديدة والردود الآن وقد فُعّل فيها تتبّع الفتح والنقرات
وإشعار بالقراءة وإشعار بالتسليم؛ انقر زرًا بجانب المستلمين لإيقاف أحدها
لتلك الرسالة. يتطلب التتبّع أن تكون مسجّل الدخول إلى حساب Katna. إشعار
التسليم رسالة يرسلها إليك خادم بريدك عندما يستلم خادم كل مستلم الرسالة؛
ويظهر الزر باهتًا حيث لا يوفّرها خادم بريدك.
"""

["2026-09-28-0120-delivered-read-ticks"]
title = "علامات للتسليم والقراءة"
text = """
يعرض البريد الذي ترسله الآن علامات بجوار كل مستلم. علامة رمادية واحدة
تعني أن خادم بريده استلمها: من إشعار بالتسليم، أو، حيث لا ترسل خدمة بريدك
أي إشعار (Gmail)، عندما لا يعود أي إشعار بفشل التسليم خلال نصف ساعة.
وعلامتان بلون التمييز تعنيان أنه قرأها، من إشعار بالقراءة أو من تتبُّع
الفتح، والتحذير يعني أنها لم تُسلَّم. أشِر إلى علامة لترى متى وكيف. وتبقى
رسائل الإشعارات في بريدك ضمن «التحديثات»، دون إشعار.
"""

["2026-09-28-0143-gmail-new-mail-notifications"]
title = "إشعارات للبريد الجديد في Gmail"
text = """
البريد الجديد في بريد Gmail الوارد يعرض إشعارًا من جديد. كان Katna يفوته
البريد الذي يضعه Gmail في «كل البريد» لحظةً قبل البريد الوارد.
"""

["2026-09-28-0156-attachment-types"]
title = "البحث حسب نوع المرفق"
text = """
في خيارات البحث، يعرض «يحتوي على مرفق» الآن PDF وXLSX وODF وXLS وODS
وPPT وPPTX، و«مخصص» لأي امتداد آخر، مثل png أو avif. لا يظهر إلا البريد
الذي يحتوي على مرفق من نوع مختار.
"""

["2026-09-28-0106-original-colors"]
title = "الألوان الأصلية في السمة الداكنة"
text = """
في السمة الداكنة، يظهر البريد الذي يضبط ألوانه بنفسه بألوان داكنة. ويعرضه
الزر نصف الدائري الجديد في شريط أدوات جزء القراءة بألوان مُرسِله الأصلية،
ثم يعيده.
"""

["2026-09-28-0127-print-as-shown"]
title = "الطباعة تحفظ التنسيق"
text = """
يُطبع البريد كما يظهر في جزء القراءة، بجداوله وألوانه وحدوده وقوائمه
وصوره. ويمكن لمعاينة الطباعة ترك ألوان الخلفية لتوفير الحبر، أو طباعة
النص وحده باستخدام «نص بسيط».
"""

["2026-09-28-0141-ask-before-deleting"]
title = "السؤال قبل الحذف"
text = """
حذف عدة محادثات مرة واحدة يسأل الآن أولًا عن نقلها إلى المهملات. حدِّد
«لا تسأل مرة أخرى» لتجاوز السؤال، أو أعِد تشغيله من «الإعدادات > عام».
والحذف النهائي، في المهملات، يسأل دائمًا.
"""

["2026-09-28-0019-katna-for-windows"]
title = "Katna لنظام Windows"
text = """
يعمل Katna Mail الآن على Windows 10 و11 أيضًا، ويُثبَّت عبر Katna Setup
الخاص به، مع أيقونة علبة النظام والإشعارات والبدء عند تسجيل الدخول وفتح
روابط البريد في Katna.
"""

["2026-09-28-0236-chip-remove-always"]
title = "زر إزالة على كل عنوان"
text = """
صارت كل شريحة عنوان في «إلى» و«نسخة» و«نسخة مخفية» تعرض علامة x دائمًا،
فيمكنك إزالتها دون أن تشير إليها أولًا.
"""

["2026-09-28-0244-pill-format-bar"]
title = "شريط تنسيق أكثر استدارة"
text = """
صار شريط التنسيق في نافذة الإنشاء (Aa) على شكل كبسولة بحافة خفيفة، فيبدو
منفصلًا عن نصك في السمتين الفاتحة والداكنة.
"""

["2026-09-28-0325-long-threads-smooth"]
title = "سلاسل البريد الطويلة تُفتح بسرعة"
text = """
البريد المنسَّق الذي يقتبس ردودًا سابقة كثيرة، مثل سلسلة اقتباسات طويلة،
يُفتح الآن فورًا ويُمرَّر بسلاسة بدلًا من إبطاء النافذة كلها.
"""

["2026-09-28-0830-who-has-seen-it"]
title = "من رآها، خلف عين"
text = """
لم يعد فوق البريد الذي أرسلته مع التتبُّع مربع من الأسطر. فالعين بجوار
النجمة تتلوّن بلون التمييز عندما يفتحه أحد؛ أشِر إليها لترى من فتحه أو تابع
رابطًا فيه، ومتى.
"""

["2026-09-28-0831-contact-call-copy"]
title = "الاتصال والنسخ من تفاصيل جهة الاتصال"
text = """
في تفاصيل جهة الاتصال بجانب المحادثة، انقر رقم هاتف للاتصال به عبر تطبيق
الهاتف أو KDE Connect، أو استخدم زر النسخ بجانبه. ويمكن الآن أيضًا تحديد كل
نص اللوحة ونسخه.
"""

["2026-09-28-0848-quoted-text-hide-remove"]
title = "إخفاء البريد المقتبس في الرد أو إزالته"
text = """
صار الزر "..." أسفل الرد يخفي البريد المقتبس مجددًا بعد أن تفتحه. أشِر إليه
وانقر x في زاويته لإخراج البريد المقتبس من ردك؛ و«تراجع» أو Ctrl+Z يعيده.
ويبقى شريط أدوات الرد أيضًا في مكانه أثناء التمرير.
"""

["2026-09-28-0854-floating-folders"]
title = "مجلدات عائمة، وبحث أعرض"
text = """
عند إخفاء المجلدات، يفتحها إبقاء المؤشر على «إنشاء» أو «البريد» في لوحة
بعيدة عن الحواف، بسنّ صغير يشير إلى الزر. ويتسع مربع البحث ليملأ المكان الذي
تتركه المجلدات، ولم يعد النقر على المجلد الذي أنت فيه يجعل القائمة ترمش.
"""

["2026-09-28-0928-search-address-suggestions"]
title = "اقتراح العناوين في «خيارات البحث»"
text = """
صار الحقلان «من» و«إلى» في «خيارات البحث» يقترحان العناوين أثناء الكتابة،
كما تفعل «إلى» و«نسخة» و«نسخة مخفية» في نافذة الإنشاء. اختر واحدًا بالضغط
على Enter أو Tab أو بنقرة.
"""

["2026-09-28-0935-app-menu-reply-all-window"]
title = "«القائمة الرئيسية» في بطاقة الحساب، و«الرد على الكل» في نافذة خاصة"
text = """
في بطاقة الحساب زر ☰ بجانب «إدارة الحسابات». يفتح قوائم ملف وتحرير وعرض
وانتقال ورسالة والإعدادات والمساعدة نفسها التي تعرضها القائمة العامة لسطح
المكتب، لأسطح المكتب التي لا تعرض قائمة عامة. وصار «الرد على الكل» في إشعار
بريد جديد يفتح المحادثة في نافذة خاصة بها، جاهزة للكتابة، ويترك النافذة
الرئيسية في مكانها.
"""

["2026-09-28-1011-tray-brings-window-forward"]
title = "النقر على علبة النظام والإشعارات يجلب Katna Mail إلى الأمام"
text = """
صار النقر على أيقونة علبة النظام، أو على «فتح البريد الوارد» أو «رسالة جديدة»
أو «الإعدادات» في قائمتها، يجلب نافذة Katna Mail إلى الأمام على Wayland، حتى
لو كانت مصغّرة أو خلف نوافذ أخرى. والنقر على إشعار بريد جديد يفتح ذلك البريد،
حتى لو لم تعرضه قائمة «البريد الوارد».
"""

["2026-09-28-1053-send-countdown-reply-in-place"]
title = "عدّ تنازلي للإرسال، وردّك يبقى في المحادثة"
text = """
بعد «إرسال»، تعدّ حلقةٌ تتقلص مهلةَ التراجع بجانب «تراجع»، ثم تقول الملاحظة
أسفل النافذة «تم إرسال الرسالة» (مع صوت قصير) بمجرد خروج البريد. ويمكن إيقاف
الصوت من «الإعدادات > عام > الإرسال». والرد الذي تكتبه في محادثة يصير رسالة
في المكان الذي كتبته فيه. ولا يعرض رأسه إلا من يُرسَل إليهم؛ انقره لتظهر «من»
و«إلى» و«نسخة» و«نسخة مخفية». والسهم بجانب أيقونة الرد يبدّل بين «رد» و«الرد
على الكل» و«إعادة توجيه»، مع الإبقاء على ما كتبته.
"""

["2026-09-28-1110-search-options-narrow"]
title = "«خيارات البحث» تناسب النوافذ الضيقة"
text = """
في نافذة ضيقة أو قصيرة، صارت «خيارات البحث» تتسع للمساحة المتاحة، وتضع
التسميات فوق حقولها على الهاتف، وتتمرّر حين لا تتسع، فيبقى زر «بحث» دائمًا
في المتناول.
"""

["2026-09-28-1119-replies-from-right-account"]
title = "الردود تخرج من الحساب الصحيح"
text = """
صار «رد» أو «إعادة توجيه» على بريد فُتح من «البريد الوارد الموحّد» أو من
البحث يخرج من الحساب الذي وصل إليه البريد، لا من الحساب المختار تحت صورة
ملفك الشخصي.
"""

["2026-09-28-1436-calmer-search-box"]
title = "البحث يعرض اختصاره"
text = """
يعرض مربع البحث اختصار لوحة المفاتيح بجانب «البحث في البريد»، كما هو مضبوط
في «الإعدادات > الاختصارات». وعند النقر فيه يحتفظ بلونه ويُظهر حافة خافتة
بدلًا من أن يغمق مع ظل. كما صارت المجلدات التي تطفو فوق القائمة بعيدة عن
الحافة السفلية أيضًا.
"""

["2026-09-28-1450-clear-activity"]
title = "ترتيب «النشاط»"
text = """
أشر إلى فتح أو نقرة في «النشاط» واضغط × لإزالتها من القائمة، أو اضغط «مسح
الكل» لتبدأ من جديد. تظل مرات الفتح والنقرات الجديدة تظهر، ويظل تقرير
«التفاصيل» يحسب كل شيء.
"""

["2026-09-28-1541-round-logo"]
title = "شعار Katna المستدير الجديد"
text = """
لدى Katna شعار جديد: حرف k مكتوب بخط اليد على دائرة بلون أزرق مخضر، في
القائمة الرئيسية والشريط العلوي وشريط المهام. وتعرضه علبة النظام بلون واحد
يناسب لوحتك، وتعرض نافذتا «حول» و«الترحيب» اسم «katna mail» كاملًا.
"""

["2026-09-28-1546-contact-cards"]
title = "لوحة جهة اتصال أنظف"
text = """
تعرض لوحة جهة الاتصال الآن كل قسم في بطاقته الناعمة الخاصة، مع أزرار
دائرية تحت الاسم للمراسلة أو للبحث في بريدك معهم أو للاتصال بهم. تسرد
«المحادثات الأخيرة» أحدث قلة منها؛ اضغط «المزيد» لرؤية البقية و«أقل» لطيّها.
"""

["2026-09-28-1507-reply-box-recipients"]
title = "صندوق رد أنظف"
text = """
يعرض المستلمون الآن مع صورهم، ويجلس Cc وBcc معًا في زر صغير واحد. يؤدي
فتح مستلمي الرد إلى تكبير الصندوق نحو الأعلى بسلاسة، وتُفتح الرسالة
المقتبسة وتُغلق بسلاسة تحت خط متموج يمكنك النقر عليه لطيّها مرة أخرى.
"""

["2026-09-28-1620-softer-window-shadow"]
title = "ظل نافذة أنعم وأزرار بحجم KDE"
text = """
مع إطار نافذة Katna، صار الظل حول النافذة أضيق ويتلاشى تمامًا، دون الحافة
الصلبة التي كان يتركها بجانب النافذة. صارت أزرار النافذة الآن بحجم أزرار
KDE نفسها، وتقف بعيدًا عن جانب النافذة بقدر بُعدها عن أعلاها.
"""

["2026-09-28-1622-update-from-the-app"]
title = "تحديث Katna من داخل التطبيق"
text = """
تُنزّل Katna الآن الإصدارات الجديدة من تلقاء نفسها وتخبرك عند جاهزية
أحدها. اضغط «تحديث» في الإشعار أو في «حول»: سيقول Katna Mail إنه سيعيد
التشغيل، ويطلب كلمة مرورك، ويثبّت التحديث، ثم يفتح مجددًا حيث توقفت.
الإعدادات > عام > التحديثات يعطّل التنزيل التلقائي.
"""

["2026-09-28-1520-track-sealed-and-plain"]
title = "تتبُّع البريد الموقَّع والمشفَّر والنص العادي"
text = """
صارت العين الآن تعمل مع البريد الموقَّع والمشفَّر أيضًا: تُوقَّع أو تُشفَّر
نسخة كل مستلم على حدة، فيبقى التوقيع صالحًا. لا يستطيع النص العادي إظهار
الفتح، لكن روابطه تُتبَّع، فترى متى يتابع أحدهم رابطًا.
"""

["2026-09-28-1834-reply-after-closed-window"]
title = "الرد يبدأ من جديد بعد إغلاق نافذة الرسالة"
text = """
إغلاق رسالة كُتبت في نافذتها الخاصة يُبقيها الآن في المسودات، ويفتح «رد»
و«الرد على الكل» و«إعادة توجيه» رسالة جديدة من جديد بدلًا من استعادة
الرسالة القديمة.
"""

["2026-09-28-1852-frosted-search-bar"]
title = "شريط بحث بتأثير الزجاج المصنفر"
text = """
عند تفعيل الخلفية الضبابية، يترك شريط البحث الضبابية تمر من خلاله مثل
الشريط المحيط به، بدلًا من أن يستقر فوقها كحبة رمادية مصمتة.
"""

["2026-09-28-1906-scroll-to-switch-accounts"]
title = "مرّر فوق صورتك للتبديل بين الحسابات"
text = """
عند وضع المؤشر فوق صورة الحساب في الزاوية العلوية، أدِر عجلة الفأرة
للانتقال إلى الحساب التالي أو السابق، حسابًا واحدًا لكل نقرة. تنقلب
الصورة إلى الحساب الجديد كما ينقلب اسم التطبيق عند التبديل بين
التطبيقات، وكذلك عند اختيار حساب من البطاقة.
"""

["2026-09-28-1918-many-recipients"]
title = "مساحة لمستلمين كثيرين"
text = """
يستخدم المستلمون بعد السطر الأول الآن العرض كاملًا، وتتمرر القائمة
الطويلة ضمن بضعة أسطر، فتبقى الرسالة نفسها في المتناول دائمًا. عند
مغادرة الحقل ينطوي في سطر واحد، مثل «Kay, Sam, 19 آخر»؛ انقر عليه
لرؤيتهم جميعًا مرة أخرى.
"""

["2026-09-28-1952-activity-by-account"]
title = "تقرير النشاط لحساب واحد"
text = """
أصبح في تقرير النشاط منتقي للحسابات بجانب التواريخ. اختر كل الحسابات أو أحدها،
فتتبعه الرسائل المتتبَّعة والمعدلات والمخطط وسطور الموضوع وصندوق بريدك.
ويذكر التقرير الحساب المعروض ويتذكر اختيارك.
"""

["2026-09-28-2002-reader-arrows-always-shown"]
title = "«أحدث» و«أقدم» دائمًا على شريط الأدوات"
text = """
مهما ضاق جزء القراءة، يبقى العدّاد وسهما «أحدث» و«أقدم» ظاهرة على شريط أدواته.
أما الأزرار الأقل استخدامًا فتنتقل إلى قائمة «المزيد» واحدًا تلو الآخر، ومنها
مفتاحا تفاصيل جهة الاتصال والألوان الأصلية.
"""

["2026-09-28-2026-large-files-drive"]
title = "إرسال ملفات بأي حجم"
text = """
مع حساب سُجّل الدخول إليه عبر Google، يُرفع أي ملف يتجاوز حد البريد البالغ 25 ميغابايت
إلى Google Drive الخاص بك فور إرفاقه، وتحمل الرسالة رابطه، كما في Gmail. ويُشارَك مع
المستلمين عند الضغط على «إرسال»؛ ولا يسألك Katna إلا إذا تعذّر منح أحدهم حق الوصول.
"""

["2026-09-28-2059-recipient-list-scrolling"]
title = "قوائم المستلمين الطويلة أكثر سلاسة"
text = """
صار لقائمة المستلمين الطويلة شريط تمرير خاص بها وتتحرك سطرًا سطرًا، ولا تتابع المحادثة
التمرير إلا بعد أن تصل القائمة إلى نهايتها. ولم تعد الأزرار أسفلها تقفز عند إضافة
مستلمين.
"""

["2026-09-28-2106-check-for-new-mail"]
title = "التحقق من وجود بريد جديد"
text = """
انقر بزر الفأرة الأيمن على مجلد أو حساب في لوحة المجلدات لتختار «التحقق من وجود بريد
جديد» أو «وضع علامة «مقروءة» على الكل» أو مجلدًا جديدًا بداخله أو «إفراغ المهملات». وصار
«إعادة التحميل» فوق القائمة يجلب البريد من الخادم أيضًا. وأثناء تحقق Katna تدور الأسهم
على «إعادة التحميل» وبجانب «البريد الوارد»، ويظهر «جارٍ التحقق من وجود بريد جديد…» في
الأعلى إذا استغرق الأمر أكثر من لحظة.
"""

["2026-09-28-2101-large-files-onedrive"]
title = "إرسال الملفات الكبيرة عبر OneDrive"
text = """
تُرسل حسابات Outlook.com وHotmail وسائر حسابات Microsoft الآن الملفات التي تتجاوز حد
البريد كما تفعل حسابات Google: يُرفع الملف إلى OneDrive الخاص بك فور إرفاقه، وتحمل
الرسالة رابطه، كما في Outlook.
"""

["2026-09-28-2108-activity-checking"]
title = "لا مزيد من ومضة تسجيل الدخول في النشاط"
text = """
بعد تشغيل Katna مباشرةً، يعرض النشاط شريط تحميل رفيعًا أثناء التحقق من حساب Katna الخاص
بك، بدلًا من مطالبتك بتسجيل الدخول للحظة. كما يتحقق Katna من الحساب فور تشغيله، فيقصر
الانتظار.
"""

["2026-09-28-2130-update-dialog"]
title = "للتحديثات نافذتها الخاصة"
text = """
«مساعدة > التحقق من وجود تحديثات» يفتح نافذة خاصة بها. تعرض إصدارك بجانب الإصدار الجديد،
مع وقت بناء كل منهما وحجم التنزيل، وما الجديد في التحديث وكل تغيير منذ إصدارك.
"""

["2026-09-28-2204-faster-start"]
title = "بدء أسرع ومزامنة أسلس"
text = """
يفتح Katna Mail صندوق وارد كبيرًا أسرع بنحو الربع، وأثناء تنزيل البريد يحدّث القائمة مرة
لكل دفعة بدلًا من تحديثها بعد كل بضع رسائل، فيبقى التمرير والكتابة سلسين أثناء المزامنة.
"""

["2026-09-28-2111-link-addresses"]
title = "اعرف إلى أين يقودك الرابط"
text = """
مرّر المؤشر فوق رابط في رسالة فيظهر العنوان الذي يفتحه فعلًا في أسفل جزء القراءة،
مع إبراز اسم الموقع، أيًا كان نص الرابط. أما صور المُرسِل الذي تعرض صوره دائمًا
فلن تُحمَّل الآن إلا إذا أكد مزوّد بريدك أن الرسالة منه فعلًا.
"""

["2026-09-29-0213-coffee-button-play"]
title = "مسرحية صغيرة في «اشترِ لي فنجان قهوة»"
text = """
