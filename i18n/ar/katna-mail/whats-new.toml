["2026-09-27-1348-quiet-row-markers"]
title = "قائمة بريد أهدأ"
text = """
صار مربع التحديد والنجمة وعلامة «مهمة» في كل رسالة باهتةً، وتظهر بكامل
قوتها عندما تشير إلى السطر، كما في Gmail. أما الرسالة المحددة أو ذات
النجمة أو المهمة فتظهر دائمًا بألوانها الكاملة.
"""

["2026-09-27-1512-buy-me-a-coffee"]
title = "اشترِ لي فنجان قهوة"
text = """
