في Gmail. افتحها من «المسودات» لمتابعة الكتابة. زر المهملات وحده يتخلّص
منها، و«تراجع» يعيدها.
"""

["2026-09-27-1609-many-attachments"]
title = "مكان لمرفقات كثيرة"
text = """
