לוחצים על Ctrl+Shift+P ומקלידים כדי למצוא כל פעולה או הגדרה, ואז לוחצים
על Enter כדי להפעיל אותה. ליד כל פעולה מופיע קיצור המקלדת שלה, ומה
שהשתמשתם בו לאחרונה נמצא למעלה.
"""
