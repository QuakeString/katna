["2026-10-02-0210-conversation-summaries"]
title = "Podsumuj wątek"
text = """
Kliknij wątek prawym przyciskiem i wybierz Podsumuj albo naciśnij
Shift+S, aby obok pojawiła się karta mówiąca, czego dotyczy, co
ustalono i co czeka na ciebie, bez otwierania go i oznaczania jako
