zamknie.
"""

["2026-10-02-0150-chat-format-bar"]
title = "Pełniejszy pasek Aa w czatach"
text = """
Pasek Aa w polu odpowiedzi czatu ma teraz narzędzia z tworzenia
wiadomości: cofanie, czcionkę, rozmiar, wyrównanie i wcięcia, obok
