akcentu twojego pulpitu.
"""

["2026-10-02-0218-signature-details-on-card"]
title = "Dane z podpisu tam, gdzie ich miejsce"
text = """
Karta osoby nie pokazuje już jej podpisu jako bloku. Jego dane trafiają
