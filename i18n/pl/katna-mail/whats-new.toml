"""

["2026-10-03-1711-ring-centred"]
title = "Obwódki kont leżą równo"
text = """
Kolorowa obwódka wokół zdjęcia konta ma teraz taki sam odstęp z każdej
strony, przy dowolnym skalowaniu, zamiast wyglądać z jednej strony o piksel
grubiej.
"""

["2026-10-03-1717-signature-pictures"]
title = "Obrazy w podpisach znów się wczytują"
text = """
Obrazy z sieci, takie jak logo w podpisach z Gmaila, wczytują się teraz w
sieciach, które wcześnie zrywają połączenie z Google, zamiast zostawać
pustym polem.
"""

["2026-10-03-1723-import-signatures"]
title = "Przenieś swoje podpisy"
text = """
Ustawienia > Tworzenie > Podpisy > Importuj znajduje podpisy w Gmailu
oraz w Thunderbirdzie, Evolution i KMail na tym komputerze, razem z ich
logo. Zaznacz te, których chcesz; te, które już są w Katna, pozostają
niezaznaczone.
"""

["2026-10-03-1750-hover-folders-clean"]
title = "Czyste krawędzie folderów otwieranych z Utwórz"
text = """
W oknie wielkości tabletu foldery, które otwierają się po zatrzymaniu
kursora na Utwórz, nie pokazują już cienkich linii wzdłuż górnej i lewej
krawędzi.
"""

["2026-10-03-1757-chat-links"]
title = "Linki otwierają się z czatów"
text = """
W widoku czatu linki w wiadomości otwierają się kliknięciem, tak jak w
widoku poczty: jej własne linki oraz adresy stron i adresy e-mail
wpisane w tekście. Zatrzymaj wskaźnik na jednym, aby zobaczyć, dokąd
prowadzi. W widoku poczty wpisane adresy otwierają się teraz także w
wiadomościach zwykłym tekstem.
"""

["2026-10-03-1811-folds-glide"]
title = "Grupy kalendarzy zwijają się płynnie"
text = """
Kalendarze konta w bocznej kolumnie Kalendarza płynnie się teraz
rozwijają i zwijają, a małe strzałki przy zwijanych elementach (Więcej
na karcie kontaktu, osoby w czacie, konta w Aktywności, sedno odpowiedzi
AI) obracają się, zamiast przeskakiwać.
"""

["2026-10-03-1844-signature-layouts"]
title = "Podpisy z dwunastu układów"
text = """
Ustawienia > Tworzenie > Podpisy mają teraz dwanaście gotowych układów.
Raz wpisz swoje imię i nazwisko, numery, logo, zdjęcie i strony, wybierz
układ i kolor, i zobacz podpis tak, jak zobaczy go odbiorca: w trybie
jasnym, ciemnym lub jako zwykły tekst. Obrazy jadą w środku wiadomości,
więc wyświetlają się wszędzie.
"""

["2026-10-03-1850-copy-about-whats-new"]
title = "Kopiowanie z O Katna i Co nowego"
text = """
Tekst w oknach O Katna i Co nowego można teraz zaznaczać i kopiować jak w
przeglądarce: przeciągnij po nim, kliknij dwukrotnie słowo lub
trzykrotnie akapit, a potem Ctrl+C lub prawy przycisk > Kopiuj. Wersja
przyda się do wklejenia w zgłoszeniu błędu.
"""

["2026-10-03-1904-copy-version"]
title = "Skopiuj wersję jednym kliknięciem"
text = """
Zatrzymaj wskaźnik na numerze wersji w O Katna, Co nowego lub
Ustawieniach, a obok pojawi się mały przycisk kopiowania. Kopiuje
wersję, datę jej zbudowania i twój system, gotowe do wklejenia w
zgłoszeniu błędu.
"""

["2026-10-03-1924-settings-in-window"]
title = "Ustawienia znów obok poczty"
text = """
Ustawienia otwierają się znów w głównym oknie, w miejscu strony, na
której byłeś, a ich lista stron jest podzielona na Wszystkie aplikacje i
poszczególne aplikacje.
"""

["2026-10-03-1934-copy-any-text"]
title = "Kopiuj tekst wszędzie"
text = """
Tekst, który coś ci mówi, można teraz zaznaczać i kopiować w całej
Katna: nazwy i opisy ustawień, dane kontaktów i wydarzeń, stan kont,
komunikaty o błędach, notki na pustych stronach i okna dialogowe.
Przeciągnij po nim lub kliknij dwukrotnie słowo, a potem Ctrl+C lub
prawy przycisk > Kopiuj. Przyciski i klikane wiersze działają jak
dawniej.
"""

["2026-10-03-2011-calendar-tasks-switch-month-drag"]
title = "Zadania w Kalendarzu: pokaż lub ukryj, przeciągaj w widoku Miesiąc"
text = """
Boczna lista Kalendarza ma pod twoimi kalendarzami pole Zadania: odznacz
je, a zadania znikną z widoków Dzień, Tydzień, Miesiąc i Harmonogram, aż
znów je zaznaczysz. W widoku Miesiąc możesz teraz przeciągnąć zadanie na
inny dzień; zachowuje swoją godzinę, a Cofnij przywraca je na miejsce.
"""

["2026-10-03-2023-tasks-upcoming-completed-sort-select"]
title = "Nadchodzące, Ukończone, sortowanie i zaznaczanie w Zadaniach"
text = """
Zadania mają dwa nowe widoki. Nadchodzące pokazuje najbliższe dwa
tygodnie dzień po dniu, z zaległymi zadaniami na górze; przeciągnij
zadanie na inny dzień, aby je przenieść. Ukończone pokazuje wszystko, co
odhaczyłeś, według dni, a odznaczenie zadania przywraca je. Menu ⋮
każdej listy sortuje ją według daty, gwiazdki lub tytułu. Ctrl+kliknij
lub Shift+kliknij kilka zadań, aby za jednym razem je ukończyć,
przenieść, ustawić im datę, oznaczyć gwiazdką lub usunąć.
"""

["2026-10-03-2040-task-labels-and-files"]
title = "Etykiety i pliki w zadaniach"
text = """
Zadania przyjmują te same etykiety co notatki: dodaj je w szczegółach
zadania lub wpisz #dom w nowym zadaniu, a potem wybierz etykietę po
lewej, aby zobaczyć wszystkie zadania z nią. Upuść plik na zadanie, aby
go załączyć, a Dodaj do Zadań zachowuje załączniki wiadomości. Gwiazdka,
etykiety i pliki trafiają do Microsoft To Do i na twój serwer CalDAV, a
gwiazdka także do Zoho.
"""

["2026-10-03-2102-notes-pictures-reminders-history"]
title = "Notatki: obrazy, przypomnienia i historia"
text = """
Notatki przyjmują obrazy, przypominają o wybranej porze i przechowują 30
dni historii, którą możesz przywrócić. Ctrl+kliknij kilka notatek, aby
razem je przypiąć, pokolorować, oznaczyć etykietą lub zarchiwizować,
wpisz [[, aby połączyć jedną notatkę z drugą, i dodawaj cytaty, kod oraz
linie podziału. Wyślij notatkę pocztą albo zapisz ją jako Markdown lub
PDF, a gdy AI jest włączone, iskierka ją porządkuje, zamienia w listę
lub streszcza.
"""

["2026-10-03-2102-quick-capture"]
title = "Złap myśl z dowolnego miejsca"
text = """
Meta+Alt+T otwiera małą kartę nad tym, co właśnie robisz, aby dodać
zadanie, a Meta+Alt+N, aby zapisać notatkę. Wpisz „Zadzwoń do hydraulika
pt 18:00 #dom”, a plakietki pokażą rozpoznany dzień, etykietę, listę i
przypomnienie; kliknij jedną, aby ją zmienić. Tab przełącza między
Zadaniem a Notatką, Enter zapisuje. Jest to też w menu zasobnika oraz w
KRunnerze jako task: i note:.
"""

["2026-10-04-0102-soft-hovers"]
title = "Łagodniejsze podświetlenia"
text = """
Zatrzymanie wskaźnika na pasku aplikacji, polu wyboru, karcie i wielu
innych przyciskach płynnie rozjaśnia i wygasza teraz ich podświetlenie,
zamiast je po prostu włączać.
"""

["2026-10-04-0119-cards-lift"]
title = "Karty, które się unoszą"
text = """
Pliki, załączniki, foldery na Dysku, zaproszenia, podsumowania, pole
odpowiedzi i usługi pocztowe w Dodaj konto są teraz kartami z tą samą
miękką krawędzią i cieniem co reszta Katna, zamiast płaskiego obrysu.
"""

["2026-10-04-0119-notes-select-bar-matches"]
title = "Notatki: łagodniejsze karty w ruchu"
text = """
Notatki używają teraz tych samych kart, plakietek i pasków co reszta
Katna. Karty leżą na miękkim cieniu i delikatnie unoszą się pod
wskaźnikiem, nowe notatki płynnie się pojawiają, usunięte płynnie
znikają, a notatka otwiera się i zamyka krótkim powiększeniem. Pasek do
zaznaczania notatek ma ten sam zaokrąglony kształt co „Utwórz
notatkę”, więc zmienia się tylko jego zawartość. Wszystko to stosuje się
do ustawień Ogranicz ruch i Szybkość animacji.
"""

["2026-10-04-0128-header-labels"]
title = "Wszystkie etykiety otwartej wiadomości"
text = """
Otwarta wiadomość pokazuje teraz pod tematem wszystkie swoje plakietki,
jak w Gmail: Odebrane, Ważne, swoją kartę skrzynki odbiorczej, Oznaczone
gwiazdką oraz każdy folder lub etykietę, w których się znajduje. Wskaż
jedną, aby zdjąć ją jej znakiem ×, z możliwością cofnięcia.
"""

["2026-10-04-0150-settings-own-list"]
title = "Ustawienia mają okno dla siebie"
text = """
Gdy Ustawienia są otwarte, foldery się chowają, więc widzisz tylko
własną listę stron Ustawień obok wybranej strony. Wracają, gdy wyjdziesz.
"""

["2026-10-04-0154-summary-pill"]
title = "Spokojniejszy przycisk podsumowania i nagłówek, który zostaje na miejscu"
text = """
W widoku czatu iskierka podsumowania siedzi teraz we własnej małej
szarej pigułce obok przełącznika Czat i Poczta i robi się biała, gdy
podsumowanie jest widoczne. Podsumowanie płynnie się rozwija i zwija,
zamiast pojawiać się od razu. W widoku poczty i czatu nagłówek zostaje
teraz na górze, gdy wiadomości przewijają się pod nim, a wiersze listy
poczty tak samo wsuwają się pod jej górny pasek, matowe, gdy Rozmycie
jest włączone. Ustawienia > Eksperymentalne mają przełącznik Matowe
nagłówki, aby zostawić je jednolite.
"""

["2026-10-04-0204-tasks-motion"]
title = "Zadania w ruchu"
text = """
Odhaczenie zadania wypełnia jego kółko, przekreśla tytuł i zwija
wiersz. Nowe i usunięte zadania wsuwają się i wysuwają, przestawione
płynnie przesuwają się na swoje miejsce, a karty list lekko się unoszą,
gdy je wskazujesz.
"""

["2026-10-04-0225-shortcuts-dialog"]
title = "Skróty klawiszowe w jednym spojrzeniu"
text = """
Pomoc > Skróty klawiszowe lub klawisz ? pokazuje teraz wszystkie skróty w
małym oknie nad pocztą, z polem do wyszukiwania. Klawisze nadal zmienia
się w Ustawienia > Skróty.
"""

["2026-10-04-0305-unified-leave-out"]
title = "Pomiń skrzynkę odbiorczą we Wszystkich kontach"
text = """
Kliknij prawym przyciskiem skrzynkę odbiorczą konta pod Wszystkie konta i
wybierz Pomiń we wspólnej skrzynce odbiorczej: jej poczta przestaje
trafiać do wspólnej skrzynki, ale wiersz zostaje i otwiera tę skrzynkę.
Kliknij jej oko, aby ją przywrócić. W Ustawienia > Odebrane możesz też
wyłączyć ze Wszystkich kont całe konto.
"""

["2026-10-04-0310-leave-account-out"]
title = "Pomiń konto w aplikacji"
text = """
Ustawienia mają teraz stronę dla Kontaktów, Zadań i Notatek, a każda z
nich oraz Pliki pokazuje twoje konta z przełącznikiem. Wyłącz jedno, aby
pominąć to konto w aplikacji, a jego przypomnienia ucichną. Jego
elementy dalej się synchronizują, więc wracają, gdy tylko znów je
włączysz.
"""

["2026-10-04-0320-calendar-leave-account-out"]
title = "Pomiń konto w Kalendarzu"
text = """
Ustawienia > Kalendarz też pokazują twoje konta z przełącznikiem. Wyłącz
jedno, a jego kalendarze, wydarzenia i zadania znikną z Kalendarza, a
jego wydarzenia przestaną ci przypominać. Dalej się synchronizuje, więc
wraca, gdy tylko je włączysz.
"""

["2026-10-04-0327-contact-card-points-right"]
title = "Karty kontaktu otwierają się tam, gdzie kliknąłeś"
text = """
W wąskim oknie karta kontaktu otwierana z imienia lub zdjęcia osoby
wskazuje teraz dokładnie na nie, w widoku czatu i w widoku poczty, i
otwiera się płynnie także za pierwszym razem: Katna zaczyna wczytywać
dane osoby, gdy tylko zatrzymasz na nich wskaźnik. Drugie kliknięcie
tego samego imienia lub zdjęcia zamyka kartę.
"""

["2026-10-04-0336-files-card-corners"]
title = "Spokojniejsze karty plików"
text = """
Karty plików w Plikach i pod wiadomością leżą teraz na miękkim cieniu i
lekko się unoszą, gdy którąś wskażesz. Podgląd zostaje bez zmian:
rozmiar pliku płynnie pojawia się w jego lewym górnym rogu, a przyciski
w prawym górnym, na matowym szkle, więc nic nie podskakuje.
"""

["2026-10-04-0345-pane-tops-whole"]
title = "Górne krawędzie paneli nie są już ucięte"
text = """
Z własnym paskiem tytułu Katna górna krawędź i miękki cień listy poczty,
otwartej wiadomości i paneli bocznych są teraz widoczne w całości, gdy
okno nie jest zmaksymalizowane, zamiast wyglądać na płasko ucięte pod
górnym paskiem.
"""

["2026-10-04-0354-account-offline"]
title = "Przełącz konto w tryb offline"
