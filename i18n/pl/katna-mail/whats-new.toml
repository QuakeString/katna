tematem; w widoku czatu jest w pasku pod nagłówkiem. Każdy punkt wskazuje
wiadomość, z której pochodzi, a gdy od ostatniego czytania przyszła nowa
poczta, podsumowanie obejmuje tylko ją. Wymaga włączonej pomocy w pisaniu
z AI w Ustawienia > Tworzenie.
"""

["2026-10-02-0215-system-colors-follow-mode"]
title = "Jasny i ciemny działają z kolorami systemowymi"
text = """
Gdy Kolory są ustawione na Systemowy, a schemat pulpitu jest tylko ciemny
(lub tylko jasny), Ustawienia > Wygląd > Tryb znowu przełącza Katna między
