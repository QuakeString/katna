kolejność.
"""

["2026-09-27-0826-reset-cache"]
title = "Czyszczenie pamięci podręcznej"
text = """
Ustawienia > Ogólne > Wyczyść pamięć podręczną usuwa pocztę pobraną
przez Katna, zdjęcia nadawców i indeks wyszukiwania, a potem ponownie
