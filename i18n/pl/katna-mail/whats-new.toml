wyłania się od dołu, razem z obracającą się ikoną.
"""

["2026-10-03-0945-flat-row-hover"]
title = "Wyraźniejsze podświetlenie na liście poczty"
text = """
Wiersz pod kursorem nie unosi się już z miękkim cieniem. Zamiast tego
dostaje płaskie, nieco mocniejsze zabarwienie, więc jego krawędzie
pozostają ostre w jasnym i ciemnym motywie.
"""

["2026-10-03-0959-drawer-bounce-back"]
title = "Foldery wysuwają się ze sprężystością, z czystą krawędzią"
text = """
W telefonie lub tablecie foldery wysuwane z menu znów lekko się odbijają,
a wzdłuż ich krawędzi obok paska bocznego nie ma już cienia.
"""

["2026-10-03-1030-crisp-card-edges"]
title = "Ostrzejsze krawędzie kart w jasnym motywie"
text = """
W jasnym motywie lista poczty, otwarta wiadomość i inne karty mają teraz
cienką, ostrą krawędź i bardzo krótki cień zamiast miękkiego rozmycia, więc
odcinają się od strony tak wyraźnie jak w ciemnym motywie.
"""

["2026-10-03-1206-matching-choice-chips"]
title = "Pasujące do siebie przyciski wyboru"
text = """
Opcje w Opcjach wyszukiwania, Aktywności, pisaniu z AI i książkach
adresowych kontaktu to teraz jeden rodzaj przycisku: wszędzie tej samej
wielkości, z zaznaczeniem przy wybranym.
"""

["2026-10-03-1453-summary-folds-smoothly"]
title = "Podsumowanie zwija się płynnie"
text = """
Zwijanie i rozwijanie podsumowania rozmowy płynnie przechodzi teraz do
nowej wysokości, a jego strzałka obraca się razem z nim zamiast
przeskakiwać.
"""

["2026-10-03-1523-animation-speed"]
title = "Wybierz, jak szybko wszystko się porusza"
text = """
Ustawienia > Wygląd mają Szybkość animacji: zgodną z pulpitem albo własną
