adresem, jest zaznaczone na czerwono, a Wyślij najpierw prosi o
poprawkę.
"""

["2026-09-27-1253-start-at-login"]
title = "Katna uruchamia się po zalogowaniu"
text = """
Katna uruchamia się teraz po cichu, gdy się zalogujesz: poczta się
