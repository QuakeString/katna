"""

["2026-10-02-0236-chat-on-phones"]
title = "Czaty mieszczą się na telefonie"
text = """
W oknie wielkości telefonu czat (Ustawienia > Eksperymentalne) ma jeden
wiersz nagłówka z Wstecz i ⋮, a dymki zajmują więcej szerokości.
Przytrzymaj dymek, aby wysunąć jego menu od dołu, i stuknij nazwisko lub
zdjęcie, aby tak samo zobaczyć kartę osoby. Przesuń w dół albo stuknij
obok, aby je schować.
"""

["2026-10-02-0258-frost-stays-on-scroll"]
title = "Matowe tło stoi, gdy lista się przewija"
text = """
Na matowej liście, która się przewija, jak osoby w czacie czy długie menu,
