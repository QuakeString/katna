jednobarwne ikony, a obrazy, banery i stopki są pomijane.
"""

["2026-10-02-0225-chat-subject-line"]
title = "Zobacz, kiedy zmienia się temat czatu"
text = """
W czacie (Ustawienia > Eksperymentalne) mały wiersz na środku mówi teraz,
kiedy ktoś zmienił temat, tak jak mówi, kto kogo dodał.
"""

["2026-10-02-0225-no-blur-ghost"]
title = "Bez rozmytego ducha po zamknięciu okna"
text = """
Zamknięcie O Katna, Co nowego, Sprawdź aktualizacje albo dowolnego
