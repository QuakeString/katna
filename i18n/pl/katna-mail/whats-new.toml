title = "Kolor dla każdego konta"
text = """
Wybierz kolor dla każdego konta w Ustawienia > Konta albo kliknij konto
prawym przyciskiem w panelu folderów: jeden z siedmiu albo dowolny kolor z
tęczowego koła za nimi. Kropka przy każdym nadawcy we Wspólnej skrzynce
odbiorczej i obwódka wokół zdjęcia konta przyjmują ten kolor, a najechanie
na kropkę pokazuje nazwę konta. Każde konto zaczyna z własnym kolorem,
nigdy takim jak jedna z Kart skrzynki odbiorczej.
"""

["2026-10-02-1340-colors-button-mail-only"]
title = "Przycisk oryginalnych kolorów tylko tam, gdzie pomaga"
text = """
W ciemnym motywie przycisk Pokaż oryginalne kolory wysuwa się teraz, gdy
rozmowa jest wyświetlana jako Czat, i wraca w widoku Poczta.
"""

["2026-10-02-1340-logo-and-custom-accent"]
title = "Logo w twoich kolorach i dowolny akcent"
text = """
Logo Katna w oknie przyjmuje teraz twój kolor akcentu, w trybie jasnym i
ciemnym. A Ustawienia > Wygląd > Akcent kończy się teraz kołem kolorów:
kliknij je, aby wybrać dowolny akcent.
"""

["2026-10-02-1358-empty-reply-no-draft"]
title = "Puste odpowiedzi nie zostawiają wersji roboczej"
text = """
Odpowiedź, w którą kliknąłeś, ale nic nie napisałeś, w polu czatu lub pod
wiadomością, po prostu się zamyka, gdy ją opuścisz. Nie zostawia wersji
roboczej i nie wraca po przełączeniu między Czat i Poczta.
"""

["2026-10-02-1400-folder-right-click-selects"]
title = "Prawy przycisk otwiera folder"
text = """
Kliknięcie folderu prawym przyciskiem w panelu folderów zaznacza go teraz
i otwiera, zanim pojawi się menu, więc menu wyraźnie działa na folderze,
który widzisz.
"""

["2026-10-02-1405-viewer-arrows-hover"]
title = "Strzałki przeglądarki pozostają widoczne"
text = """
Strzałki po bokach przeglądarki załączników nie bledną już niemal do bieli,
gdy wskażesz je kursorem. Zamiast tego stają się odrobinę jaśniejsze,
więc pozostają dobrze widoczne na białej stronie.
"""

["2026-10-02-1432-account-colour-button"]
title = "Jeden przycisk koloru na konto"
text = """
Każde konto pokazuje teraz tylko swój kolor, na przycisku Kolor w
Ustawienia > Konta i w menu konta pod prawym przyciskiem. Kliknij go, aby
wybrać jeden z ośmiu kolorów albo dowolny własny, tuż w miejscu
kliknięcia.
"""

["2026-10-02-1443-reply-at-the-end"]
title = "Twoja odpowiedź zostaje na końcu"
text = """
Odpowiedź jest teraz zawsze na końcu rozmowy, nawet gdy najnowsza
wiadomość jest pokazana na górze. Przełączenie z Czat na Poczta przewija
do niej, z kursorem tam, gdzie go zostawiłeś.
"""

["2026-10-02-1451-card-shows-signer"]
title = "Karta pokazuje, kto podpisał otwartą wiadomość"
text = """
Karta osoby odczytuje teraz podpis otwartej wiadomości, a nie tylko
najnowszej. Gdy współpracownik podpisuje wiadomość ze wspólnego adresu,
takiego jak accounts@, karta pokazuje jego imię i nazwisko, stanowisko,
telefon i adres firmy z tej wiadomości.
"""

["2026-10-02-1510-search-click-away"]
title = "Kliknij gdziekolwiek, aby opuścić pole wyszukiwania"
text = """
Kliknięcie pustego miejsca na górnym pasku, obok pola wyszukiwania,
wyprowadza teraz z pola, tak jak kliknięcie listy poczty. Wyszukiwanie
pozostaje bez zmian.
"""

["2026-10-02-1515-empty-message-no-draft"]
title = "Bez pustych wersji roboczych"
text = """
Nowa wiadomość, którą przed zamknięciem znów opróżniłeś, nie zostaje już
w Wersjach roboczych, tak samo jak pusta odpowiedź w rozmowie.
"""

["2026-10-02-1513-dark-pages"]
title = "Ciemne strony w przeglądarce"
text = """
W trybie ciemnym przeglądarka załączników ma przycisk z półksiężycem,
który pokazuje jasne pliki PDF, dokumenty, prezentacje, arkusze i pliki
tekstowe w ciemnych barwach. Kolory zachowują swój odcień, zdjęcia na
stronie są przyciemniane, a nie zamieniane w negatyw, a zeskanowany papier
ciemnieje tak jak tekst. Katna zapamiętuje twój wybór dla kolejnego pliku.
"""

["2026-10-02-1522-window-corners"]
title = "Wybierz rogi i obramowanie okna"
text = """
Przy własnym pasku tytułu Katna Ustawienia > Eksperymentalne mają teraz
suwak Zaokrąglenie rogów, od kwadratowych po okrągłe, oraz przełącznik
Obramowanie z własnym kryciem. Gdy Własna siła rozmycia jest włączona,
suwak Krycie ustala też, ile przepuszcza rozmyte tło okna.
"""

["2026-10-02-1535-ctrl-shift-click-select"]
title = "Zaznaczaj wiadomości z Ctrl i Shift"
text = """
Kliknij wiadomość na liście z Ctrl, aby ją zaznaczyć, i klikaj z Ctrl
kolejne, aby je dodać. Kliknięcie z Shift zaznacza wszystkie wiadomości od
ostatnio klikniętej. Aby otworzyć wiadomość w osobnym oknie, kliknij ją
prawym przyciskiem i wybierz Otwórz w nowym oknie.
"""

["2026-10-02-1610-frosted-panes"]
title = "Matowe panele, czat i wyszukiwanie"
text = """
Gdy Rozmywaj tło okna jest włączone, lista poczty, otwarta wiadomość i
karta osoby też przepuszczają rozmycie, z suwakiem Krycie paneli. Miejsce
za dymkami czatu pokazuje go nieco więcej, a pole wyszukiwania pozostaje
matowe podczas pisania. Każde z nich ma własny przełącznik w Ustawienia >
Eksperymentalne.
"""

["2026-10-02-1618-fainter-hints"]
title = "Bledsze podpowiedzi w pustych polach"
text = """
Szara podpowiedź w pustym polu, taka jak „Odpowiedz…” pod czatem czy
„Przeszukaj pocztę”, jest teraz bledsza, więc nigdy nie wygląda jak
wpisany przez ciebie tekst.
"""

["2026-10-02-1642-drag-from-empty-space"]
title = "Przesuwaj okno za puste miejsce"
text = """
W systemie Linux możesz teraz przesuwać okno, przeciągając dowolne puste
miejsce na lewym pasku, w folderach lub na pasku nad pocztą, a nie tylko
górny pasek.
"""

["2026-10-02-1643-space-folds-folders"]
title = "Spacja zwija foldery"
text = """
Kliknij folder, który zawiera inne foldery, i naciśnij Spację, aby go
rozwinąć lub zwinąć, tak jak kliknięciem jego strzałki. Po kliknięciu
klawisze strzałek poruszają się też po panelu folderów, a Tab przechodzi
do listy poczty.
"""

["2026-10-02-1646-viewer-more-menu"]
title = "Przyciski przeglądarki mieszczą się w wąskim oknie"
text = """
W wąskim oknie przyciski u dołu przeglądarki załączników nie wychodzą już
poza nią. Te, które się nie mieszczą, trafiają do menu ⋮ Więcej: najpierw
obracanie, potem Dopasuj, a potem Ciemne strony. Numer strony i
powiększenie pozostają widoczne najdłużej.
"""

["2026-10-02-1743-activity-report-fits"]
title = "Raport aktywności mieści się w oknie"
text = """
Raport aktywności pozostaje teraz w oknie z równymi marginesami i przewija
się, gdy okno jest niskie, więc jego ostatnie wiersze nigdy nie są ucięte.
"""

["2026-10-02-1846-folders-and-labels"]
title = "Zmieniaj nazwy, usuwaj i przeciągaj do folderów"
text = """
Kliknij prawym przyciskiem utworzony przez siebie folder, aby zmienić jego
nazwę lub go usunąć; usunięcie najpierw przenosi jego pocztę do Kosza.
Przeciągnij wiadomości z listy na folder, aby je tam przenieść. Przenieś do
ma pole wyszukiwania: pisz, aby znaleźć folder albo utworzyć nowy i
przenieść do niego wiadomości. W Gmailu Oznacz etykietą dodaje etykiety do
wiadomości i je zdejmuje, a upuszczenie wiadomości na etykietę dodaje tę
etykietę.
"""

["2026-10-02-1928-mail-rules"]
title = "Reguły poczty"
text = """
Reguły same porządkują nową pocztę: według nadawcy, tematu lub słów
przenoszą ją, dodają etykietę, gwiazdkę, przekazują dalej lub wyciszają.
Utwórz regułę w Ustawienia > Foldery i reguły albo kliknij wiadomość prawym
przyciskiem i wybierz Utwórz regułę…, a przed zapisaniem zobacz, ilu
ostatnim wiadomościom odpowiada. W Przenieś do zaznacz „Zawsze przenoś tu
pocztę od …”, aby jednym kliknięciem przenieść obecną i przyszłą pocztę
nadawcy.
"""

["2026-10-02-2017-rules-on-the-server"]
title = "Reguły działające przy wyłączonym komputerze"
text = """
Reguły poczty działają teraz w Gmailu albo na twoim serwerze poczty, jeśli
obsługuje reguły Sieve, więc porządkują pocztę także w telefonie i wtedy,
gdy ten komputer jest wyłączony. Ustawienia > Foldery i reguły pokazują,
gdzie działa każda reguła i dlaczego któraś zostaje w Katna.
"""

["2026-10-03-0046-smooth-folded-tabs"]
title = "Zwinięte karty przełączają się płynnie"
text = """
Gdy wąskie okno zwija karty skrzynki odbiorczej do ikon, przełączanie kart
nie odbywa się już skokowo: opuszczana karta kurczy się z powrotem do
ikony, a jej nazwa znika, zaś otwierana rośnie, a jej nazwa się pojawia.
"""

["2026-10-03-0051-read-rows-frosted"]
title = "Przeczytane wiadomości też są matowe"
text = """
Przy włączonych matowych panelach przeczytane wiadomości pokazują teraz
matowe tło za listą tak jak nieprzeczytane, tylko w nieco innym odcieniu,
zamiast jednolitego pasa.
"""

["2026-10-03-0101-rounder-corners"]
title = "Bardziej zaokrąglone rogi okna"
text = """
Zaokrąglenie rogów w Ustawienia > Eksperymentalne sięga teraz 32 pikseli,
dwa razy więcej niż wcześniej, a liczbę możesz wpisać w polu obok suwaka.
"""

["2026-10-03-0113-viewer-round-corners"]
title = "Przeglądarka dopasowuje się do zaokrąglonych rogów"
text = """
Przy własnym pasku tytułu Katna i zaokrąglonych rogach przeglądarka
załączników zaokrągla teraz dolne rogi tak jak okno, zamiast pokazywać
kwadratowe szare rogi wystające poza krawędź okna.
"""

["2026-10-03-0147-chat-go-down"]
title = "Z powrotem do najnowszej wiadomości"
text = """
Gdy przewiniesz czat daleko w górę, w prawym dolnym rogu pojawia się
okrągły przycisk. Płynnie przenosi cię do najnowszej wiadomości i liczy
te, które w międzyczasie nadeszły.
"""

["2026-10-03-0147-chat-long-mails"]
title = "Długie wiadomości w czatach"
text = """
Przy długim dymku zdjęcie nadawcy zostaje na dole widocznej części, a
przyciski odpowiedzi, przypięcia i więcej pozostają w tej części, którą
widać. Kliknij tekst prawym przyciskiem, aby dotrzeć do nich wszystkich.
"""

["2026-10-03-0147-chat-scroll-bar"]
title = "Pasek przewijania w czatach"
text = """
Czaty mają ten sam dyskretny pasek przewijania co otwarta wiadomość,
widoczny, gdy kursor jest nad nimi.
"""

["2026-10-03-0147-chat-translate"]
title = "Tłumaczenie w czatach"
text = """
Wiadomość w innym języku proponuje tłumaczenie także w czacie, tak jak w
widoku Poczta. Kliknij dowolny dymek prawym przyciskiem i wybierz
Przetłumacz, aby przetłumaczyć go samodzielnie, a ponownie, aby pokazać
oryginał.
"""

["2026-10-03-0150-search-pill-hovers"]
title = "Równe podświetlenia na pasku wyszukiwania w telefonie"
text = """
W telefonie przycisk folderów i zdjęcie twojego konta są teraz
wyśrodkowane w zaokrąglonych końcach paska wyszukiwania, a każdy przycisk
na pasku ma takie samo okrągłe podświetlenie, w równej odległości od
krawędzi paska.
"""

["2026-10-03-0159-starter-rules"]
title = "Gotowe reguły"
text = """
Ustawienia > Foldery i reguły oferują teraz gotowe reguły, domyślnie
wyłączone: wyciszanie promocji, newslettery do folderu Czytanie, paragony,
przesyłki, bilety kolejowe i lotnicze (IRCTC, Air India, IndiGo i inne),
kody jednorazowe, alerty bezpieczeństwa, pocztę z serwisów
społecznościowych i zaproszenia z kalendarza. Włącz którąś, a zadziała na
wszystkich twoich kontach, w razie potrzeby tworząc foldery takie jak
Podróże. Reguły mogą też sprawdzać kartę skrzynki odbiorczej i to, czy
wiadomość przyszła z listy mailingowej.
"""

["2026-10-03-0200-chat-file-hover"]
title = "Łagodniejsze karty plików w czatach"
text = """
Plik w dymku czatu nie ciemnieje już pod kursorem. Lekko się unosi z
delikatnym zabarwieniem, a jego nazwa pozostaje czytelna.
"""

["2026-10-03-0210-opened-mail-stays-in-view"]
title = "Otwierana wiadomość pozostaje w widoku"
text = """
Gdy panel podglądu jest obok listy, kliknięta wiadomość zostaje tam, gdzie
była na liście, kiedy panel się otwiera, albo lista przewija się tylko
tyle, by pokazać ją w całości. Nie znika już z pola widzenia, niezależnie
od tego, czy otworzysz ją z listy, czy z wyników wyszukiwania.
"""

["2026-10-03-0212-about-header-stays"]
title = "O Katna zachowuje nagłówek w widoku"
text = """
Przewijanie okna O Katna zmniejsza teraz duże logo do małego w lewym
górnym rogu, z nazwą Katna, hasłem i wersją obok, a ten nagłówek zostaje
na miejscu, gdy reszta przewija się pod nim.
"""

["2026-10-03-0221-folded-tab-icon-settles"]
title = "Zwinięte karty zatrzymują się bez drgnięcia"
text = """
Gdy przełączasz się między zwiniętymi kartami skrzynki odbiorczej,
opuszczana karta zatrzymuje się teraz dokładnie tam, dokąd się skurczyła,
a jej ikona nie przesuwa się o piksel czy dwa po zakończeniu ruchu.
"""

["2026-10-03-0228-right-click-another-mail"]
title = "Wystarczy jedno kliknięcie prawym przyciskiem"
text = """
Gdy menu wiadomości lub folderu jest otwarte, kliknięcie prawym
przyciskiem innej wiadomości lub folderu zamyka teraz otwarte menu i od
razu otwiera nowe, bez potrzeby drugiego kliknięcia.
"""

["2026-10-03-0235-rule-editor-fits"]
title = "Edytor reguł się mieści"
text = """
W edytorze reguł długie słowa lub listy adresów zawijają się do kolejnych
wierszy zamiast być ucinane, „pasuje do wzorca” jest widoczne w całości,
a edytor pozostaje w oknie i przewija się, gdy ma wiele warunków.
"""

["2026-10-03-0235-soft-button-hover"]
title = "Łagodniejsze podświetlenie przycisków"
text = """
Wskazanie okrągłego przycisku łagodnie powiększa teraz jego koło od dwóch
trzecich rozmiaru i płynnie je wyświetla, a przyciski w kształcie pigułki,
takie jak Odpowiedz, pojawiają się nieco wolniej. Odsunięcie kursora
lekko zmniejsza koło, gdy znika.
"""

["2026-10-03-0249-account-ring"]
title = "Wyraźniejsza obwódka konta"
text = """
Kolorowa obwódka wokół zdjęcia każdego konta jest grubsza i nieco bardziej
odsunięta od zdjęcia, na górnym pasku, w menu konta i w Ustawieniach.
"""

["2026-10-03-0335-chat-picture-steady"]
title = "Stabilne zdjęcia w czatach"
text = """
Przewinięcie poza koniec czatu albo czat, którego nie da się przewijać,
nie sprawia już, że zdjęcie nadawcy i przyciski dymka podskakują.
"""

["2026-10-03-0355-no-hover-while-scrolling"]
title = "Spokojniejsze przewijanie listy poczty"
text = """
Podczas przewijania listy poczty wiadomości przesuwające się pod kursorem
nie podświetlają się już i nie pokazują przycisków. Tak jak w Gmailu,
wiadomość pod kursorem podświetla się, gdy przewijanie się zatrzyma.
"""

["2026-10-03-0541-rule-rows-drag"]
title = "Reguły przeciąga się jak konta"
text = """
W Ustawienia > Foldery i reguły przeciągnięcie reguły unosi teraz cały jej
wiersz, pozostałe reguły usuwają się jej z drogi, a ona zatrzymuje się
tam, gdzie ją puścisz, tak jak przy zmianie kolejności kont.
"""

["2026-10-03-0545-chat-go-down-aligned"]
title = "Przycisk przewijania w dół wyrównany"
text = """
W czatach okrągły przycisk, który przenosi do najnowszej wiadomości,
znajduje się teraz tuż nad przyciskiem wysyłania, w tej samej linii.
"""

["2026-10-03-0555-bottom-corners-round"]
title = "Zaokrąglone dolne rogi pozostają okrągłe"
text = """
Przy własnym pasku tytułu Katna i zaokrąglonych rogach dolne rogi okna nie
pokazują już kwadratu tła wystającego poza zaokrąglone obramowanie.
"""

["2026-10-03-0606-account-dot-only"]
title = "Spokojniejsza lista poczty"
text = """
Wiersze we Wspólnej skrzynce odbiorczej pokazują obok nadawcy tylko
kolorową kropkę konta. Najedź na kropkę, aby zobaczyć, do którego konta
należy wiadomość.
"""

["2026-10-03-0623-windows-updates"]
title = "Aktualizacje w systemie Windows"
text = """
Katna w systemie Windows aktualizuje się teraz sama. Co godzinę sprawdza,
czy są nowe wersje, pobiera je w tle i instaluje, gdy naciśniesz
Aktualizuj, a potem uruchamia się ponownie.
"""

["2026-10-03-0643-files-wildcard-search"]
title = "Symbole wieloznaczne w wyszukiwaniu Plików"
text = """
W Plikach wyszukanie *.pdf znajduje teraz każdy plik PDF, a * i ? działają
w dowolnym miejscu nazwy: faktura*2026* znajduje wszystkie faktury z 2026
roku. Działa to dla plików z twojej poczty oraz w Google Drive i OneDrive.
"""

["2026-10-03-0643-linux-package-updates"]
title = "Aktualizacje dla każdego pakietu Linux"
text = """
AppImage i archiwum tar dla Linuksa aktualizują się teraz same, tak jak
pakiet dla Arch. Przy pakiecie Fedory, Snap, Flatpak lub Nix Katna
informuje o nowej wersji i pokazuje jedno polecenie, które ją instaluje,
gotowe do skopiowania.
"""

["2026-10-03-0708-copy-codes"]
title = "Kopiuj kody z powiadomień"
text = """
Powiadomienie o nowej wiadomości z kodem logowania lub weryfikacyjnym ma
teraz przycisk Kopiuj, a powiadomienie z linkiem do weryfikacji lub
potwierdzenia adresu ma przycisk z nazwą witryny, którą otwiera. Przyciski
w powiadomieniach nie sprawiają już, że podskakująca ikona Katna podąża za
kursorem.
"""

["2026-10-03-0730-contact-card-popover"]
title = "Karta kontaktu w wąskich oknach"
text = """
Gdy w oknie nie ma miejsca na panel kontaktu, kliknięcie imienia lub
zdjęcia osoby otwiera nad wiadomością krótką kartę wskazującą miejsce
kliknięcia. Poszerz okno, a jej miejsce zajmie pełny panel.
"""

["2026-10-03-0733-compose-icon-turns"]
title = "Ikona dużego przycisku obraca się przy zmianie stron"
text = """
Przełączanie między Pocztą, Kalendarzem, Kontaktami, Zadaniami i
Notatkami nie zmienia już skokowo ikony na dużym przycisku u góry lewego
paska. Stara ikona obraca się i kurczy, a nowa się wyłania, również na
przycisku w telefonie.
"""

["2026-10-03-0746-sound-sets"]
title = "Zestawy dźwięków powiadomień"
text = """
Ustawienia > Powiadomienia mają teraz zestawy dźwięków: Ptaki, Natura,
Zwierzęta, Owady, Elektroniczne, Poranek, dzwonki Katna albo dźwięki
twojego pulpitu. Nowa poczta śpiewa jak rudzik, chyba że wybierzesz inny
zestaw. Każde zdarzenie może też mieć własny dźwięk lub wybrany przez
ciebie plik dźwiękowy.
"""

["2026-10-03-0750-chat-seen-ticks"]
title = "Kto zobaczył twoją wiadomość, w czatach"
text = """
W widoku czatu znaczniki przy wiadomościach wysłanych ze śledzeniem
zmieniają kolor, gdy ktoś je otworzy. Obok nich małe oko liczy otwarcia,
a link liczy kliknięte linki. Zatrzymaj na nich kursor, aby zobaczyć, kto
otworzył wiadomość lub kliknął link, tak jak pokazuje oko w widoku poczty.
"""

["2026-10-03-0834-drawer-edge-clean"]
title = "Bez linii obok wysuwanych folderów"
text = """
W telefonie lub tablecie foldery wysuwane z menu dosuwają się teraz do
krawędzi bez cienkiej linii migającej obok nich, gdy się zatrzymują.
"""

["2026-10-03-0845-chat-summary-button-hides"]
title = "Przycisk podsumowania znów je ukrywa"
text = """
W widoku czatu iskierka u góry ukrywa teraz podsumowanie, gdy jest
widoczne, i pokazuje je ponownie przy następnym kliknięciu, tak jak w
widoku poczty.
"""

["2026-10-03-0915-big-button-glides"]
title = "Duży przycisk płynnie przechodzi między stronami"
text = """
Gdy foldery są otwarte, przełączanie stron nie zmienia już skokowo
szerokości dużego przycisku u góry ani jego słowa. Przycisk płynnie
