W arkuszu kalkulacyjnym przeciągnij po komórkach albo kliknij literę
kolumny lub numer wiersza, a Ctrl+C skopiuje je tak, że wkleją się jako
komórki.
"""

["2026-09-27-1210-compose-beside-folders"]
title = "Utwórz przenosi się do folderów"
text = """
Utwórz jest teraz na górze listy folderów. Zwiń foldery, a przycisk
