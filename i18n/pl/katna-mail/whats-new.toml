się na Kalendarz, Kontakty i pozostałe, gdy przełączasz aplikacje.
"""

["2026-09-27-1143-select-all-unread"]
title = "Zaznacz całą nieprzeczytaną lub oznaczoną gwiazdką pocztę"
text = """
