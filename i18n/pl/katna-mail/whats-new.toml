pocztowym. Kod jest oczyszczany, jego obrazy są pobierane i dołączane do
wiadomości, a okno tworzenia pokazuje podpis dokładnie tak, jak zostanie
wysłany.
"""

["2026-10-03-1546-whats-new-header-stays"]
title = "Co nowego zachowuje nagłówek"
text = """
Przewijanie okna Co nowego przesuwa teraz tylko nowości: nagłówek zostaje
u góry, a Rozumiem na dole.
"""

["2026-10-03-1611-menus-fade-out"]
title = "Menu płynnie znikają"
text = """
Menu kontekstowe płynnie wygasa teraz przy zamykaniu, zamiast znikać
nagle.
"""

["2026-10-03-1625-list-stays-put"]
title = "Lista poczty nie przesuwa się, gdy otwierasz wiadomość"
text = """
Otwarcie wiadomości nie przesuwa już listy o wiersz w dół w folderach, w
