title = "Wspólna skrzynka odbiorcza"
text = """
Włącz Ustawienia > Konta > Wspólna skrzynka odbiorcza, aby widzieć
pocztę ze wszystkich kont razem. „Wszystkie konta” otwierają panel
folderów, z jednym folderem Odebrane, Nieprzeczytane, Oznaczone
gwiazdką, Ważne, Wysłane, Wersje robocze i innymi dla wszystkich kont;
strzałka obok każdego z nich rozwija po jednym wierszu na konto. Nazwa
każdego konta ma teraz strzałkę, która zwija jego foldery.
"""

["2026-09-27-1627-right-click-move-and-not-spam"]
title = "Menu kontekstowe dopasowane do folderu"
text = """
Wybranie folderu lub etykiety w Przenieś do w menu pod prawym
przyciskiem przenosi teraz pocztę, z opcją Cofnij, także z wyników
wyszukiwania. W folderze Spam zamiast Zgłoś spam jest To nie spam. Kosz
oferuje Przenieś do Odebranych i Usuń trwale, Archiwum oferuje Przenieś
do Odebranych, a Wersje robocze i Wysłane pomijają pozycje, które tam
nie mają sensu.
"""

["2026-09-27-1633-drag-accounts"]
title = "Przeciągnij konta, by ustawić kolejność"
text = """
W Ustawienia > Konta przeciąganie konta unosi teraz cały jego wiersz, a
pozostałe konta odsuwają się, robiąc miejsce. Przenieś w górę i Przenieś
w dół pojawiają się po wskazaniu wiersza.
"""

["2026-09-27-1637-drafts"]
title = "Wersje robocze zostają"
text = """
Zamknięcie pisanej wiadomości zapisuje ją teraz w Wersjach roboczych,
także na twoim serwerze poczty, jak w Gmailu. Otwórz ją z Wersji
roboczych, by pisać dalej. Tylko przycisk kosza ją odrzuca, a Cofnij ją
przywraca.
"""

["2026-09-27-1609-many-attachments"]
title = "Miejsce na wiele załączników"
text = """
Niezależnie od liczby załączonych plików lista przewija się teraz nad
paskiem z przyciskiem Wyślij, zamiast na niego nachodzić, pokazuje
najnowszy plik i podaje liczbę plików oraz ich łączny rozmiar.
"""

["2026-09-27-1628-select-on-screen-first"]
title = "Zaznaczanie nieprzeczytanej lub oznaczonej gwiazdką poczty jak w Gmailu"
text = """
Przeczytane, Nieprzeczytane, Oznaczone gwiazdką i Bez gwiazdki w menu
zaznaczania znów zaznaczają pasującą pocztę na ekranie. Wiersz nad listą
proponuje zaznaczenie wszystkich pasujących wątków w folderze, a Wyczyść
zaznaczenie to cofa.
"""

["2026-09-27-1632-leave-settings-by-folder"]
title = "Foldery wyprowadzają z Ustawień"
text = """
Gdy Ustawienia są otwarte, kliknięcie folderu lub ikony Poczta zamyka
teraz Ustawienia i otwiera ten folder, jak w Gmailu. Strzałka wstecz
nadal też działa.
"""

["2026-09-27-1641-drop-pictures-in-text"]
title = "Upuszczanie obrazów w tekście"
text = """
Gdy przeciągasz obraz nad wiadomość, kursor pokazuje, gdzie trafi, więc
możesz go upuścić w środku zdania. Inne pliki nadal pokazują obszar
upuszczania załączników, a upuszczanie działa teraz także po tym, jak
coś wpiszesz.
"""

["2026-09-27-1707-quick-quit"]
title = "Zakończ zamyka od razu"
text = """
Zakończ w menu ikony w zasobniku nie czeka już na pocztę, która wciąż
się synchronizuje lub indeksuje: Katna i jej ikona w zasobniku zamykają
się od razu, a reszta będzie kontynuowana przy następnym uruchomieniu
programu Katna.
"""

["2026-09-27-1715-contact-panel"]
title = "Dane kontaktu obok poczty"
text = """
W szerokim oknie karta obok otwartego wątku pokazuje teraz nadawcę:
telefon, stanowisko i firmę z podpisów, godzinę u tej osoby, ile poczty
wymieniliście, wasze ostatnie wątki i pliki między wami. Kliknij wątek
lub plik, aby go otworzyć, albo inną osobę z wątku, aby ją zobaczyć.
Dane pochodzą wyłącznie z poczty na tym komputerze. Przycisk kontaktu na
pasku narzędzi okienka odczytu ukrywa kartę.
"""

["2026-09-27-1640-storage-used"]
title = "Wykorzystane miejsce"
text = """
Na dole panelu folderów widać, jak bardzo zapełnione jest miejsce na pocztę
konta, np. „Wykorzystano 34% z 15 GB”, jeśli serwer poczty to podaje.
"""

["2026-09-27-1651-desktop-search"]
title = "Szukaj poczty w KRunnerze i wyszukiwaniu GNOME"
text = """
Wpisz imię w KRunnerze (Alt+Space) lub w wyszukiwaniu Podglądu GNOME, aby
napisać do tej osoby, skopiować jej adres lub znaleźć jej pocztę. Wiadomości
pojawiają się, gdy temat lub nadawca zawiera każde wpisane słowo; zacznij od
mail:, aby przeszukać całą pocztę, tak jak w polu wyszukiwania Katna Mail.
"""

["2026-09-27-1727-mail-templates"]
title = "Szablony często pisanych wiadomości"
text = """
Napisz wiadomość raz i zapisz ją nowym przyciskiem Szablony podczas pisania,
a potem jednym kliknięciem wstaw ją do dowolnej nowej wiadomości lub
odpowiedzi. Wpisz {first name}, {name} lub {my name}, a Katna uzupełni je dla
każdego odbiorcy. Szablony edytujesz, zmieniasz ich nazwy i usuwasz w sekcji
Ustawienia > Tworzenie.
"""

["2026-09-27-1724-server-send-later"]
title = "Zaplanowana poczta wychodzi przy wyłączonym komputerze"
text = """
Gdy serwer poczty potrafi przetrzymać wiadomość do ustalonej pory, jak
Stalwart, Zaplanuj wysłanie przekazuje mu ją teraz, gdy tylko zniknie
Cofnij, więc wychodzi na czas nawet przy wyłączonym komputerze. Menu
planowania mówi, czy wyśle ją serwer poczty, czy Katna.
"""

["2026-09-27-1730-softer-row-hover"]
title = "Lżejsze podświetlenie"
text = """
Wiersz pod wskaźnikiem na liście wiadomości unosi się teraz z delikatnym
cieniem, jak w Gmailu, zamiast ciemnego pasa pod spodem.
"""

["2026-09-27-1745-drag-recipients"]
title = "Przeciągaj adresy między Do, DW i UDW"
text = """
Przeciągnij plakietkę adresu do innego pola, aby ją przenieść; DW i UDW
otwierają się podczas przeciągania, nawet gdy są ukryte. Wskazanie
plakietki pokazuje x, które ją usuwa.
"""

["2026-09-27-1722-katna-account"]
title = "Konto Katna"
text = """
Ustawienia > Subskrypcja pozwalają utworzyć konto na własnym serwerze
Katna, z osobnym hasłem, nigdy hasłem do poczty. Będą go potrzebować
funkcje online Katna, takie jak potwierdzenia przeczytania i śledzenie
linków. Widać tam komputery, na których się zalogowano, i każdy z nich
można wylogować.
"""

["2026-09-27-1805-reopens-as-you-left-it"]
title = "Wszystko tam, gdzie było"
text = """
Po zamknięciu i ponownym otwarciu Katna Mail wraca aplikacja, folder i
karta skrzynki odbiorczej, które były otwarte, a także rozwinięte
foldery i to, czy panel folderów był zwinięty. Zakończenie Katna z
zasobnika systemowego uruchamia go od nowa.
"""

["2026-09-27-1724-snooze-and-reminders"]
title = "Odkładanie i przypomnienia o odpowiedzi"
text = """
Odłóż wątek zegarem w jego wierszu albo z menu pod prawym przyciskiem:
czeka w folderze Odłożone i wraca do Odebranych jako nieprzeczytany o
wybranej porze. Przy wysyłaniu strzałka obok Wyślij może przypomnieć, jeśli
nikt nie odpowie w ciągu 1, 3 lub 7 dni. Oba działają, gdy komputer jest
włączony, i nadrabiają zaległości po jego wybudzeniu.
"""

["2026-09-27-1717-translate-mail"]
title = "Czytaj pocztę w swoim języku"
text = """
Nad wiadomością w innym języku pojawia się teraz przycisk Przetłumacz, a
Pokaż oryginał przywraca ją. Katna rozpoznaje język na twoim komputerze;
tekst wiadomości trafia na własny serwer Katna do przetłumaczenia tylko
wtedy, gdy o to poprosisz. Ustawienia > Ogólne > Tłumaczenie pozwalają
wybrać twój język i języki, które mają być zawsze tłumaczone.
"""

["2026-09-27-1744-open-and-click-tracking"]
title = "Zobacz, kiedy poczta zostaje otwarta"
text = """
Włącz oko obok odbiorców, aby widzieć, kiedy każdy z nich otwiera twoją
wiadomość lub klika zawarty w niej link, albo poproś zamiast tego o
potwierdzenie przeczytania. Wysłana poczta pokazuje, kto ją otworzył, a
powiadomienie informuje o tym za pierwszym razem. Obie funkcje są
wyłączone dla każdej nowej wiadomości, a śledzenie wymaga konta Katna
(Ustawienia > Subskrypcja).
"""

["2026-09-27-2042-activity"]
title = "Aktywność śledzonej poczty"
text = """
Aktywność obok pola wyszukiwania pokazuje, ile twoich śledzonych
wiadomości otwarto i jak często klikano ich linki, a tematy są
uszeregowane według tego, jak często są otwierane.
"""

["2026-09-27-2204-search-trigger-words"]
title = "Przeszukuj pocztę z KRunnera za pomocą k"
text = """
Wpisz k lub m, spację, a potem to, czego szukasz, w KRunnerze lub
wyszukiwarce GNOME, aby dostać te same wyniki co w polu wyszukiwania
Katna Mail, na przykład „k budget”. Własne słowa wybierzesz w
Ustawienia > Ogólne.
"""

["2026-09-27-2224-activity-button"]
title = "Aktywność obok pola wyszukiwania"
text = """
Przycisk Aktywność obok pola wyszukiwania liczy nowe otwarcia i
kliknięcia śledzonej poczty i pokazuje, kto co otworzył i w które linki
kliknięto; kliknij pozycję, aby otworzyć tę wiadomość. Szczegóły pokazują
wskaźniki otwarć i kliknięć, otwarcia według dni i najlepsze tematy z
ostatnich 7 lub 30 dni, z całego okresu lub z wybranych dat. Wysłana
wiadomość pokazuje teraz, ile razy każda osoba ją otworzyła i kliknęła
link.
"""

["2026-09-27-2239-mailbox-insights"]
title = "Statystyki skrzynki"
text = """
Aktywność > Szczegóły pokazuje teraz także, ile poczty wysłano i
odebrano w danym okresie, jak często i jak szybko odpowiadasz ty i inni,
osoby, z którymi piszesz najczęściej, oraz w jakie dni i o jakich
godzinach przychodzi poczta. Wszystko jest liczone na twoim komputerze z
poczty, którą Katna już ma.
"""

["2026-09-28-0059-sign-in-with-google"]
title = "Logowanie przez Google lub Microsoft"
text = """
Dodaj konto Gmail lub Outlook, logując się na stronie Google lub
Microsoftu w przeglądarce, bez hasła do aplikacji. Adresy Outlook.com i
Hotmail też już działają. Jeśli logowanie przestanie działać, komunikat
na dole okna zaproponuje ponowne zalogowanie się.
"""

["2026-09-28-0054-tracking-on-by-default"]
title = "Śledzenie i potwierdzenia włączone od początku"
text = """
Nowe wiadomości i odpowiedzi mają teraz od początku włączone śledzenie
otwarć i kliknięć, potwierdzenie przeczytania i potwierdzenie
dostarczenia; kliknij przycisk obok odbiorców, aby wyłączyć któreś z
nich dla tej wiadomości. Śledzenie wymaga zalogowania się na konto
Katna. Potwierdzenie dostarczenia to e-mail, który serwer poczty wysyła
Ci, gdy serwer każdego odbiorcy przyjmie wiadomość; przycisk jest
wyszarzony, jeśli Twój serwer poczty ich nie oferuje.
"""

["2026-09-28-0120-delivered-read-ticks"]
title = "Znaczniki dostarczenia i przeczytania"
text = """
Wysłana poczta pokazuje teraz znaczniki obok każdego odbiorcy. Jeden
szary znacznik oznacza, że serwer poczty odbiorcy ją przyjął: według
potwierdzenia dostarczenia lub, gdy Twoja usługa poczty go nie wysyła
(Gmail), gdy w ciągu pół godziny nie przyszedł zwrot. Dwa znaczniki w
Twoim kolorze akcentu oznaczają, że wiadomość przeczytano, według
potwierdzenia przeczytania lub śledzenia otwarć, a ostrzeżenie oznacza,
że wiadomość została zwrócona. Wskaż znacznik, aby zobaczyć, kiedy i
jak. E-maile z potwierdzeniami zostają w skrzynce w zakładce
Powiadomienia i nie wyświetlają powiadomień.
"""

["2026-09-28-0143-gmail-new-mail-notifications"]
title = "Powiadomienia o nowej poczcie w Gmailu"
text = """
Nowa poczta w skrzynce Gmaila znów pokazuje powiadomienie. Wcześniej
umykała poczta, którą Gmail umieścił w folderze Wszystkie chwilę przed
folderem Odebrane.
"""

["2026-09-28-0156-attachment-types"]
title = "Szukaj według typu załącznika"
text = """
W Opcjach wyszukiwania „Ma załącznik” oferuje teraz PDF, XLSX, ODF, XLS,
ODS, PPT i PPTX oraz Niestandardowy dla każdego innego rozszerzenia, np.
png lub avif. Wyświetlana jest tylko poczta z załącznikiem wybranego
typu.
"""

["2026-09-28-0106-original-colors"]
title = "Oryginalne kolory w ciemnym motywie"
text = """
W ciemnym motywie poczta, która ustawia własne kolory, jest pokazywana w
ciemnych. Nowy przycisk z półkolem na pasku narzędzi okienka odczytu
pokazuje ją w oryginalnych kolorach nadawcy i z powrotem.
"""

["2026-09-28-0127-print-as-shown"]
title = "Wydruk zachowuje formatowanie"
text = """
Poczta drukuje się tak, jak wygląda w okienku odczytu, z tabelami,
kolorami, obramowaniami, listami i obrazami. Podgląd wydruku może pominąć
kolory tła, aby oszczędzić tusz, albo wydrukować sam tekst opcją Tylko
tekst.
"""

["2026-09-28-0141-ask-before-deleting"]
title = "Pytanie przed usunięciem"
text = """
Usunięcie kilku wątków naraz pyta teraz najpierw, czy przenieść je do
kosza. Zaznacz „Nie pytaj ponownie”, aby pominąć to pytanie, albo włącz
je znowu w Ustawienia > Ogólne. Trwałe usuwanie, w koszu, pyta zawsze.
"""

["2026-09-28-0019-katna-for-windows"]
title = "Katna dla Windows"
text = """
Katna Mail działa teraz także w systemach Windows 10 i 11, instalowana przez
własny Katna Setup, z ikoną w zasobniku systemowym, powiadomieniami,
uruchamianiem przy logowaniu i linkami e-mail otwieranymi w Katna.
"""

["2026-09-28-0236-chip-remove-always"]
title = "Przycisk usuwania przy każdym adresie"
text = """
Każdy adres w polach Do, DW i UDW zawsze pokazuje teraz swój x, więc możesz
go usunąć bez wcześniejszego wskazywania.
"""

["2026-09-28-0244-pill-format-bar"]
title = "Bardziej zaokrąglony pasek formatowania"
text = """
Pasek formatowania podczas tworzenia wiadomości (Aa) ma teraz kształt
pigułki z delikatną krawędzią, dzięki czemu odcina się od tekstu w jasnym i
ciemnym motywie.
"""

["2026-09-28-0325-long-threads-smooth"]
title = "Długie wątki otwierają się szybko"
text = """
Sformatowana poczta cytująca wiele wcześniejszych odpowiedzi, na przykład
długi łańcuch cytatów, otwiera się teraz od razu i przewija płynnie, zamiast
spowalniać całe okno.
"""

["2026-09-28-0830-who-has-seen-it"]
title = "Kto ją widział, ukryte za okiem"
text = """
Wysłana poczta ze śledzeniem nie ma już nad sobą ramki z wierszami. Oko obok
gwiazdki przybiera Twój kolor akcentu, gdy tylko ktoś otworzy wiadomość;
wskaż je, aby zobaczyć, kto ją otworzył lub kliknął link, i kiedy.
"""

["2026-09-28-0831-contact-call-copy"]
title = "Dzwonienie i kopiowanie z danych kontaktu"
text = """
W danych kontaktu obok wątku kliknij numer telefonu, aby zadzwonić przez
aplikację telefonu lub KDE Connect, albo użyj przycisku kopiowania obok.
Cały tekst panelu można też teraz zaznaczyć i skopiować.
"""

["2026-09-28-0848-quoted-text-hide-remove"]
title = "Ukrywanie lub usuwanie cytowanej wiadomości w odpowiedzi"
text = """
Przycisk "..." pod odpowiedzią teraz znowu ukrywa cytowaną wiadomość po jej
otwarciu. Wskaż go i kliknij x w jego rogu, aby usunąć cytowaną wiadomość z
odpowiedzi; Cofnij lub Ctrl+Z ją przywraca. Pasek narzędzi odpowiedzi
zostaje też na miejscu podczas przewijania.
"""

["2026-09-28-0854-floating-folders"]
title = "Pływające foldery i szersze wyszukiwanie"
text = """
Gdy foldery są ukryte, zatrzymanie wskaźnika na Utwórz lub Poczta otwiera je
jako panel odsunięty od krawędzi, z małym dzióbkiem wskazującym przycisk.
Pole wyszukiwania rośnie, wypełniając miejsce zwolnione przez foldery, a
kliknięcie folderu, w którym już jesteś, nie powoduje już mignięcia listy.
"""

["2026-09-28-0928-search-address-suggestions"]
title = "Opcje wyszukiwania podpowiadają adresy"
text = """
Pola Od i Do w oknie Opcje wyszukiwania podpowiadają teraz adresy podczas
pisania, tak jak Do, DW i UDW podczas tworzenia wiadomości. Wybierz adres
klawiszem Enter, Tab lub kliknięciem.
"""

["2026-09-28-0935-app-menu-reply-all-window"]
title = "Menu główne w karcie konta, Odpowiedz wszystkim we własnym oknie"
text = """
Karta konta ma przycisk ☰ obok Zarządzaj kontami. Otwiera te same menu Plik,
Edycja, Widok, Przejdź, Wiadomość, Ustawienia i Pomoc co globalne menu
pulpitu, dla środowisk, które go nie pokazują. Odpowiedz wszystkim w
powiadomieniu o nowej poczcie otwiera teraz wątek we własnym oknie, gotowy
do pisania, i zostawia główne okno tam, gdzie jest.
"""

["2026-09-28-1011-tray-brings-window-forward"]
title = "Kliknięcia w zasobniku i powiadomieniach przywołują Katna Mail na wierzch"
text = """
Kliknięcie ikony w zasobniku albo pozycji Otwórz Odebrane, Nowa wiadomość
lub Ustawienia w jej menu przywołuje teraz okno Katna Mail na wierzch w
Waylandzie, nawet gdy było zminimalizowane lub schowane za innymi oknami.
Kliknięcie powiadomienia o nowej poczcie otwiera tę wiadomość, nawet gdy
lista Odebrane jej nie pokazuje.
"""

["2026-09-28-1053-send-countdown-reply-in-place"]
title = "Wysyłanie odlicza czas, a odpowiedź zostaje w wątku"
text = """
Po kliknięciu Wyślij kurczący się pierścień obok Cofnij odlicza czas na
cofnięcie, a gdy wiadomość wyjdzie, komunikat pokazuje Wiadomość wysłana (z
krótkim dźwiękiem). Dźwięk można wyłączyć w Ustawienia > Ogólne > Wysyłanie.
Odpowiedź napisana w wątku zamienia się w wiadomość dokładnie tam, gdzie
powstała. Jej nagłówek pokazuje tylko, do kogo idzie; kliknij go, aby
zobaczyć Od, Do, DW i UDW. Strzałka obok ikony odpowiedzi przełącza między
Odpowiedz, Odpowiedz wszystkim i Przekaż dalej, zachowując to, co już
napisano.
"""

["2026-09-28-1110-search-options-narrow"]
title = "Opcje wyszukiwania mieszczą się w wąskich oknach"
text = """
W wąskim lub niskim oknie Opcje wyszukiwania zajmują teraz dostępną
szerokość, na telefonie umieszczają etykiety nad polami i przewijają się,
gdy się nie mieszczą, więc przycisk Szukaj jest zawsze pod ręką.
"""

["2026-09-28-1119-replies-from-right-account"]
title = "Odpowiedzi wychodzą z właściwego konta"
text = """
Po wybraniu Odpowiedz lub Przekaż dalej przy wiadomości otwartej ze Wspólnej
skrzynki odbiorczej lub z wyszukiwania odpowiedź wychodzi teraz z konta, na
które przyszła wiadomość, a nie z konta wybranego pod zdjęciem profilowym.
"""

["2026-09-28-1436-calmer-search-box"]
title = "Wyszukiwanie pokazuje swój skrót"
text = """
Pole wyszukiwania pokazuje swój skrót klawiszowy obok „Przeszukaj pocztę”,
zgodnie z ustawieniem w Ustawienia > Skróty. Po kliknięciu zachowuje swój
kolor i pokazuje delikatną krawędź, zamiast ciemnieć i rzucać cień. Foldery
unoszące się nad listą trzymają się teraz także z dala od dolnej krawędzi.
"""

["2026-09-28-1450-clear-activity"]
title = "Porządki w Aktywności"
text = """
Wskaż otwarcie lub kliknięcie w Aktywności i naciśnij ×, aby usunąć je z
listy, albo naciśnij Wyczyść wszystko, aby zacząć od nowa. Nowe otwarcia i
kliknięcia nadal się pojawiają, a raport Szczegóły nadal liczy wszystko.
"""

["2026-09-28-1541-round-logo"]
title = "Nowe okrągłe logo Katna"
text = """
Katna ma nowe logo: kursywne k na morskim kręgu, w menu aplikacji, na górnym
pasku i na pasku zadań. Zasobnik pokazuje je w jednym kolorze dopasowanym do
twojego panelu, a O Katna i strona powitalna pokazują „katna mail” w pełnym
brzmieniu.
"""

["2026-09-28-1546-contact-cards"]
title = "Przejrzystsze dane kontaktu"
text = """
Dane kontaktu pokazują teraz każdą część na osobnej miękkiej karcie, z
okrągłymi przyciskami pod imieniem i nazwiskiem, by napisać do tej osoby,
znaleźć z nią pocztę albo do niej zadzwonić. Ostatnie wątki pokazują kilka
najnowszych; naciśnij Więcej, by zobaczyć resztę, i Mniej, by je zwinąć.
"""

["2026-09-28-1507-reply-box-recipients"]
title = "Bardziej uporządkowane pole odpowiedzi"
text = """
Odbiorcy pokazują się teraz ze swoimi zdjęciami, a DW i UDW mieszczą się
razem w jednym małym przycisku. Otwarcie odbiorców odpowiedzi płynnie
powiększa pole ku górze, a cytowana wiadomość płynnie otwiera się i zamyka
pod falistą linią, którą można kliknąć, aby znów ją zwinąć.
"""

["2026-09-28-1620-softer-window-shadow"]
title = "Delikatniejszy cień okna i przyciski w rozmiarze KDE"
text = """
Z ramką okna Katna cień wokół okna jest węższy i całkowicie zanika, bez
twardej krawędzi, którą wcześniej zostawiał przy oknie. Przyciski okna mają
teraz taki sam rozmiar jak własne przyciski KDE i zachowują taki sam
odstęp od boku okna, jak od jego góry.
"""

["2026-09-28-1622-update-from-the-app"]
title = "Aktualizuj Katna z poziomu aplikacji"
text = """
Katna teraz sama pobiera nowe wersje i informuje, gdy jedna jest gotowa.
Naciśnij Aktualizuj w powiadomieniu albo w oknie O Katna: Katna Mail
zapowie, że się uruchomi ponownie, poprosi o hasło, zainstaluje
aktualizację i otworzy się ponownie w tym samym miejscu co wcześniej.
Automatyczne pobieranie wyłączysz w Ustawienia > Ogólne > Aktualizacje.
"""

["2026-09-28-1520-track-sealed-and-plain"]
title = "Śledzenie podpisanej, zaszyfrowanej i zwykłej tekstowej poczty"
text = """
Oko działa teraz też w przypadku podpisanej i zaszyfrowanej poczty: kopia
każdego odbiorcy jest podpisywana lub szyfrowana osobno, dzięki czemu
podpisy pozostają ważne. Poczta w zwykłym tekście nie pokazuje otwarć, ale
jej linki są śledzone, więc zobaczysz, kiedy ktoś kliknie któryś z nich.
"""

["2026-09-28-1834-reply-after-closed-window"]
title = "Odpowiedź zaczyna od nowa po zamknięciu okna wiadomości"
text = """
Zamknięcie wiadomości napisanej we własnym oknie zachowuje ją teraz w
Wersjach roboczych, a Odpowiedz, Odpowiedz wszystkim i Przekaż dalej znów
otwierają nową wiadomość zamiast przywracać starą.
"""

["2026-09-28-1852-frosted-search-bar"]
title = "Mrożony pasek wyszukiwania"
text = """
Gdy rozmyte tło jest włączone, pasek wyszukiwania przepuszcza rozmycie tak
jak otaczający go pasek, zamiast leżeć na nim jak jednolita szara pigułka.
"""

["2026-09-28-1906-scroll-to-switch-accounts"]
title = "Przewiń nad swoim zdjęciem, aby przełączyć konto"
text = """
Gdy wskaźnik jest nad zdjęciem konta w prawym górnym rogu, obróć kółko
myszy, aby przejść do następnego lub poprzedniego konta, po jednym koncie na
ząbek. Zdjęcie przewija się do nowego konta, tak jak nazwa aplikacji
przewija się przy zmianie aplikacji, a wybranie konta z karty przewija je
tak samo.
"""

["2026-09-28-1918-many-recipients"]
title = "Miejsce na wielu odbiorców"
text = """
Odbiorcy po pierwszym wierszu zajmują teraz całą szerokość, a długa lista
przewija się w kilku wierszach, więc sama wiadomość zawsze pozostaje w
zasięgu. Opuść pole, a zwinie się do jednego wiersza, na przykład "Kay, Sam,
jeszcze 19"; kliknij go, aby znów zobaczyć wszystkich.
"""

["2026-09-28-1952-activity-by-account"]
title = "Raport aktywności dla jednego konta"
text = """
Raport aktywności ma teraz wybór konta obok dat. Wybierz Wszystkie konta
albo jedno z nich, a śledzone wiadomości, wskaźniki, wykres, tematy i
Twoja skrzynka dostosują się do wyboru. Raport podaje, które konto
pokazuje, i zapamiętuje twój wybór.
"""

["2026-09-28-2002-reader-arrows-always-shown"]
title = "Nowsze i Starsze zawsze na pasku narzędzi"
text = """
Bez względu na to, jak wąski jest panel czytania, licznik oraz strzałki
Nowszy i Starszy zostają po prawej stronie jego paska narzędzi.
Najrzadziej używane przyciski przenoszą się zamiast tego jeden po drugim
do menu Więcej, w tym przełączniki danych kontaktu i oryginalnych kolorów.
"""

["2026-09-28-2026-large-files-drive"]
title = "Wysyłaj pliki dowolnej wielkości"
text = """
Na koncie zalogowanym przez Google plik przekraczający limit poczty 25 MB
trafia na Twój Google Drive od razu po dołączeniu, a wiadomość zawiera
jego link, jak w Gmailu. Po naciśnięciu Wyślij jest udostępniany
odbiorcom; Katna pyta tylko wtedy, gdy komuś nie można nadać dostępu.
"""

["2026-09-28-2059-recipient-list-scrolling"]
title = "Płynniejsze długie listy odbiorców"
text = """
Długa lista odbiorców ma teraz własny pasek przewijania i przesuwa się o
jeden wiersz naraz, a wątek przewija się dalej dopiero po dojściu do
końca listy. Dodawanie odbiorców nie powoduje już przeskakiwania
przycisków poniżej.
"""

["2026-09-28-2106-check-for-new-mail"]
title = "Sprawdź nową pocztę"
text = """
Kliknij prawym przyciskiem folder lub konto w panelu folderów, aby
wybrać „Sprawdź nową pocztę”, „Oznacz wszystkie jako przeczytane”, nowy
folder w środku lub „Opróżnij kosz”. „Odśwież” nad listą pobiera teraz
dane także z serwera. Gdy Katna sprawdza, strzałki obracają się przy
„Odśwież” i obok folderu Odebrane, a u góry pojawia się „Sprawdzanie
nowej poczty…”, jeśli trwa to dłużej niż chwilę.
"""

["2026-09-28-2101-large-files-onedrive"]
title = "Duże pliki przez OneDrive"
text = """
Konta Outlook.com, Hotmail i inne konta Microsoft wysyłają teraz pliki
przekraczające limit poczty tak jak konta Google: plik trafia na Twój
OneDrive od razu po dołączeniu, a wiadomość zawiera jego link, jak w
Outlooku.
"""

["2026-09-28-2108-activity-checking"]
title = "Koniec z mignięciem „Zaloguj się” w Aktywności"
text = """
Zaraz po uruchomieniu Katna Aktywność pokazuje cienki pasek ładowania
podczas sprawdzania konta Katna, zamiast na chwilę prosić o zalogowanie
się. Katna sprawdza też konto od razu po uruchomieniu, więc czekanie
jest krótsze.
"""

["2026-09-28-2130-update-dialog"]
title = "Aktualizacje we własnym oknie"
text = """
Pomoc > Sprawdź aktualizacje otwiera osobne okno. Pokazuje Twoją wersję
obok nowej, z datą zbudowania każdej i rozmiarem pobierania, co nowego
w aktualizacji oraz każdą zmianę od Twojej wersji.
"""

["2026-09-28-2204-faster-start"]
title = "Szybszy start, płynniejsza synchronizacja"
text = """
Katna Mail otwiera dużą skrzynkę odbiorczą o około jedną czwartą
szybciej, a podczas pobierania poczty odświeża listę raz na partię,
zamiast co kilka wiadomości, dzięki czemu przewijanie i pisanie pozostają
płynne podczas synchronizacji.
"""

["2026-09-28-2111-link-addresses"]
title = "Sprawdź, dokąd prowadzi link"
text = """
Zatrzymaj wskaźnik na linku w wiadomości, a adres, który faktycznie
otwiera, pojawi się u dołu okienka odczytu, z wyróżnioną nazwą witryny,
niezależnie od tekstu linku. Obrazy od nadawcy, od którego zawsze
pokazujesz obrazy, są teraz wczytywane tylko wtedy, gdy dostawca poczty
potwierdzi, że wiadomość rzeczywiście od niego pochodzi.
"""

["2026-09-29-0120-update-build-details"]
title = "Więcej o Twojej wersji"
text = """
Okno Aktualizacje pokazuje teraz ostatnią zmianę w każdej wersji, skąd
pochodzi Twoja kopia i kiedy Katna ostatnio sprawdzała dostępność
aktualizacji.
"""

["2026-09-29-0213-coffee-button-play"]
title = "Małe przedstawienie w przycisku Postaw mi kawę"
text = """
Zatrzymaj wskaźnik na przycisku Postaw mi kawę w oknie O Katna: prosi o
kawę, herbatę, pizzę, potem o zupełnie nic, zadowala się wodą i dziękuje
kilkoma iskierkami. Za każdym razem gra raz i stoi w miejscu, gdy
ograniczysz ruch.
"""

["2026-09-29-0215-update-checking-bar"]
title = "Czytelniejsze okno aktualizacji"
text = """
Gdy Katna szuka aktualizacji, widać przesuwający się pasek, a nowa
wersja wyróżnia się własnym kolorem obok tej, którą masz.
"""

["2026-09-29-0231-keys-beside-the-list"]
title = "Klawisze podążające za panelem, w którym jesteś"
text = """
Gdy wątek jest obok listy, strzałki w górę i w dół przesuwają się teraz
po liście i pokazują każdy wątek. Tab lub Enter wchodzi do wątku, gdzie
strzałki w górę i w dół go przewijają; Esc lub Shift+Tab wraca do listy.
F6 przełącza między panelami, jak w innych programach pocztowych.
"""

["2026-09-29-0258-folders-slide-open"]
title = "Foldery rozsuwają się i zasuwają"
text = """
Kliknięcie strzałki obok konta lub folderu w panelu folderów rozsuwa
teraz lub zasuwa jego zawartość, a foldery poniżej się z nią przesuwają,
zamiast skakać.
"""

["2026-09-29-0301-keys-menus-dialogs"]
title = "Foldery, menu i okna dialogowe z klawiatury"
text = """
Shift+Tab lub F6 prowadzi do panelu folderów, gdzie strzałki w górę i w
dół otwierają kolejne foldery, a Enter przechodzi do ich poczty.
Strzałki w górę i w dół poruszają się po każdym menu, a Enter wybiera.
Shift+F10 lub klawisz Menu otwiera menu prawego przycisku myszy dla
zaznaczonej wiadomości. Okna dialogowe przejmują klawisze po otwarciu:
Enter odpowiada, Esc anuluje, a Tab zostaje w ich wnętrzu. W nowej
wiadomości Ctrl+Enter wysyła z dowolnego pola, a Esc ją zamyka,
zachowując wersję roboczą.
"""

["2026-09-29-0309-clock-tasks"]
title = "Zadania w zegarze na pulpicie"
text = """
Kliknij zegar, aby dodać zadanie i odhaczać zadania. W Plasmie kliknij
zegar prawym przyciskiem myszy i wybierz Pokaż alternatywy, aby wybrać
Zegar cyfrowy Katna. W GNOME od następnego logowania pod kalendarzem
zegara pojawia się karta Zadania.
"""

["2026-09-29-0329-pages-by-keyboard"]
title = "Strony z klawiatury i z paska zadań"
text = """
Ctrl+1 do Ctrl+5 przełączają między Pocztą, Kalendarzem, Kontaktami,
Zadaniami i Notatkami, tak jak w Outlooku, a menu Przejdź też je
wyświetla. Kliknij prawym przyciskiem myszy Katna Mail na pasku zadań,
aby od razu otworzyć Kalendarz lub Kontakty.
"""

["2026-09-29-0412-tasks-page"]
title = "Katna Zadania"
text = """
Naciśnij Ctrl+4 lub wybierz Zadania po lewej: wszystkie listy obok
siebie jak w Google Tasks, z podzadaniami, gwiazdkami, terminami,
powtarzaniem i szczegółami. Listy synchronizują się z Google Tasks i
Microsoft To Do, a zadania z zegara na pulpicie też pojawiają się tutaj.
"""

["2026-09-29-0352-contacts"]
title = "Twoje kontakty ze wszystkich kont"
text = """
Kontakty na lewym pasku pokazują teraz osoby zapisane na Twoich kontach
Gmail i Outlook oraz na serwerach CardDAV, każdą tylko raz, nawet jeśli
przechowuje ją kilka kont, wraz z etykietami, zdjęciami i szczegółami.
Ich nazwy i zdjęcia widać także w poczcie i w podpowiedziach adresów.
"""

["2026-09-29-0350-katna-notes"]
title = "Katna Notatki"
text = """
Notatki na pasku bocznym otwierają teraz Katna Notatki, ułożone jak w
Google Keep. Utwórz notatkę lub listę kontrolną, nadaj jej kolor,
przypnij ją na górze i zaznaczaj elementy bezpośrednio na tablicy.
Notatki zapisują się w trakcie pisania; wyszukiwarka je znajduje;
Archiwum i Kosz odkładają je na bok, z opcją Cofnij.
"""

["2026-09-29-0412-notes-sync"]
title = "Notatki na każdym urządzeniu"
text = """
Notatki są teraz przechowywane w folderze Notatki na Twoim koncie
poczty, tam gdzie Notatki na iPhonie i Macu trzymają swoje, więc
podążają za Tobą na inne urządzenia i wracają z nich. Nazwa konta pod
notatką pokazuje, gdzie jest przechowywana; kliknij ją, aby przenieść
notatkę, albo zachowaj ją tylko na tym komputerze.
"""

["2026-09-29-0451-add-mail-to-tasks"]
title = "Dodawanie wiadomości do Zadań"
text = """
Naciśnij Shift+T, jak w Gmailu, albo wybierz Dodaj do Zadań po
kliknięciu wiadomości prawym przyciskiem myszy. Zadanie przejmuje temat
wiadomości, a jego znacznik Poczta w Zadaniach ponownie otwiera
wiadomość.
"""

["2026-09-29-0412-calendar"]
title = "Twój kalendarz obok poczty"
text = """
Kalendarz pokazuje Twoje kalendarze Google, Microsoft i inne w widoku
dnia, tygodnia, miesiąca lub jako harmonogram, ze skrótami klawiszowymi
Kalendarza Google. Przycisk kalendarza po prawej stronie poczty otwiera
plan dnia z przyciskiem Dołącz do rozmów. Zaloguj się ponownie na konto,
aby Katna mogła odczytać jego kalendarz.
"""

["2026-09-29-0442-contacts-edit"]
title = "Tworzenie i edytowanie kontaktów"
text = """
Utwórz kontakt na stronie Kontakty dodaje osobę do wybranego konta, a
Edytuj na stronie kontaktu zmienia ją także tam. Usuń ma opcję Cofnij, a
Google i Outlook przez pewien czas przechowują usunięte kontakty w
koszu.
"""

["2026-09-29-0538-notes-on-mail"]
title = "Notatki do wiadomości"
text = """
Kliknij wiadomość prawym przyciskiem myszy albo otwórz jej menu ⋮ i
wybierz Dodaj notatkę: nad wiadomością otworzy się notatka z tematem
jako tytułem. Notatki wiadomości widać pod tematem za każdym razem,
gdy otworzysz ją ponownie, a znacznik Poczta na notatce przenosi z
powrotem do wiadomości.
"""

["2026-09-29-0542-caldav-tasks"]
title = "Zadania na własnym serwerze poczty"
text = """
Konta logujące się hasłem przechowują teraz swoje zadania na serwerze
poczty, jeśli oferuje on CalDAV, dzięki czemu zadania widać także w
aplikacjach serwera i na telefonie.
"""

["2026-09-29-0521-calendar-edit"]
title = "Dodawanie i zmienianie wydarzeń"
text = """
Kliknij lub przeciągnij w kalendarzu albo naciśnij C, aby dodać
wydarzenie. Przeciągnij wydarzenie, aby je przenieść, lub jego dolną
krawędź, aby zmienić czas trwania, a otwórz je, aby zmienić godzinę,
powtarzanie, przypomnienia i gości albo dodać rozmowę w Meet lub Teams.
Odpowiadaj na zaproszenia przyciskami Tak, Nie lub Może. Cofnij
przywraca wszystko.
"""

["2026-09-29-0546-calendar-any-account"]
title = "Kalendarze z większej liczby kont"
text = """
Katna znajduje teraz kalendarze Yahoo, Zoho, iCloud, Fastmail, GMX i
innych kont, nawet gdy znajdują się na innym serwerze niż poczta.
Najpierw próbuje najlepszego sposobu dla każdego konta, a gdy jest
niedostępny, innego.
"""

["2026-09-29-0625-tasks-today"]
title = "Dziś w Zadaniach"
text = """
Dziś, w sekcji Wszystkie zadania, zbiera to, co ma termin dzisiaj, oraz
wszystko, co jest zaległe, ze wszystkich list, wraz z listą, w której
znajduje się każde zadanie. Zadanie dodane tam ma termin dzisiaj.
"""

["2026-09-29-0631-invitation-card"]
title = "Zaproszenia w Twojej poczcie"
text = """
Zaproszenie wyświetla się teraz jako karta na górze wiadomości: kiedy i
gdzie, kto je zorganizował, Twój dzień wokół niego z zaznaczonymi
kolizjami, Dołącz oraz Bierzesz udział? Tak, Nie lub Może, z odpowiedzią
prosto tam.
"""

["2026-09-29-0616-note-labels"]
title = "Etykiety w notatkach"
text = """
Przycisk etykiety w notatce dodaje do niej etykiety, tak jak w Keep.
Twoje etykiety są wymienione obok Notatek, a każda pokazuje tylko swoje
notatki. Edytuj etykiety pozwala zmieniać ich nazwy lub je usuwać, z
opcją Cofnij.
"""

["2026-09-29-0630-tasks-more-accounts"]
title = "Zadania z większej liczby kont"
text = """
Zadania synchronizują się teraz także z Yahoo, Zoho, iCloud, Fastmail i
innymi kontami, których zadania znajdują się na innym serwerze niż
poczta. Katna najpierw próbuje najlepszej metody dla każdego konta i
zapamiętuje tę, która działa.
"""

["2026-09-29-0607-contact-labels"]
title = "Etykiety kontaktów"
text = """
Przycisk Etykieta na stronie kontaktu włącza i wyłącza etykiety albo
tworzy nową, a ⋮ obok etykiety pozwala zmienić jej nazwę, usunąć ją lub
napisać do wszystkich, którzy ją mają. Etykiety pozostają
zsynchronizowane z Google Contacts i Outlookiem, a każda zmiana ma opcję
Cofnij.
"""

["2026-09-29-0640-add-to-contacts"]
title = "Dodawanie do kontaktów z poczty"
text = """
Panel kontaktu obok rozmowy ma przycisk Dodaj do kontaktów dla osoby,
której nie zapisano: jedno kliknięcie zapisuje imię i nazwisko, adres
oraz telefon, stanowisko i firmę z podpisu, z opcją Cofnij. Przy
zapisanej osobie ten sam przycisk otwiera ją na stronie Kontakty.
"""

["2026-09-29-0720-focus-time"]
title = "Czas na skupienie, nieobecność i miejsce pracy"
text = """
Nowe wydarzenie może być teraz Czasem na skupienie, wpisem Poza biurem
lub Miejscem pracy, tak jak w Google Calendar: wybierz to nad godzinami.
Google i Outlook rozpoznają je jako to, czym są, a w Katna mają własną
ikonę.
"""

["2026-09-29-0704-task-chips"]
title = "Zadania przy poczcie"
text = """
Wiadomość, z której utworzono zadanie, pokazuje teraz na liście termin
zadania, na czerwono, gdy jest po terminie. Kliknij go, aby otworzyć
zadanie.
