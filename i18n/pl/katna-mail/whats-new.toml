Zaznacz zaznaczają teraz każdą pasującą rozmowę w folderze, nie tylko te
widoczne na ekranie. Wiersz nad listą mówi, ile jest zaznaczonych, a
archiwizowanie, usuwanie, przenoszenie czy oznaczanie działa na
wszystkie.
"""

["2026-09-27-1228-fixes-on-hover"]
title = "Poprawki bez prawego kliknięcia"
text = """
Przytrzymaj wskaźnik na podkreślonym słowie albo je kliknij, a jego
