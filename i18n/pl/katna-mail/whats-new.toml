["2026-09-27-1242-whats-new-translated"]
title = "Nowości w Twoim języku"
text = """
Te informacje wyświetlają się teraz w języku ustawionym w Katna Mail. Tłumaczenia są wersjami roboczymi, więc daj nam znać, gdzie sformułowania mogą być lepsze.
