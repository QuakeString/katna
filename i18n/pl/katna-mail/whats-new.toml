["2026-09-27-1126-undo-anything"]
title = "Cofnij wszystko skrótem Ctrl+Z"
text = """
Coś przez pomyłkę zarchiwizowane, usunięte, przeniesione albo oznaczone
gwiazdką? Naciśnij Ctrl+Z lub Cofnij w komunikacie na dole, aby to
