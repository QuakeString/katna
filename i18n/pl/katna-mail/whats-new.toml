Ustawienia otwierają się na aplikacji, w której jesteś, a Kalendarz ma tam
swoje pierwsze ustawienia.
"""

["2026-10-03-1650-popovers-fade-out"]
title = "Okienka wyskakujące płynnie znikają"
text = """
Małe karty wskazujące to, czego dotyczą, takie jak karta kontaktu, kto
widział wiadomość, dzień w widoku Rok, własne daty wyszukiwania i
