"""

["2026-10-03-1628-drawer-top-clean"]
title = "Bez linii cienia nad wysuwanymi folderami"
text = """
W telefonie lub tablecie foldery wysuwane z menu nie mają już cienkiej
linii cienia wzdłuż górnej krawędzi, pod paskiem wyszukiwania.
"""

["2026-10-03-1631-toolbar-menus-fade-out"]
title = "Menu paska narzędzi też płynnie znikają"
text = """
Menu pod przyciskami paska narzędzi, takie jak Więcej i pole zaznaczania,
płynnie wygasają przy zamykaniu, zamiast znikać nagle.
"""

["2026-10-03-1632-settings-by-app"]
title = "Ustawienia uporządkowane według aplikacji"
text = """
Ustawienia mają teraz z boku listę stron: Wszystkie aplikacje dla tego, co
wspólne dla każdej aplikacji, a potem Poczta, Kalendarz i Pliki z ich
