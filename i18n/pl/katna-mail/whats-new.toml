jako tabelę, obraz lub zwykły tekst; Ctrl+Shift+V wkleja zwykły tekst.
Pliki skopiowane w programie Dolphin lub przeciągnięte na wiadomość są
załączane, a przy obrazach Katna pyta, czy mają trafić do treści, czy
jako załącznik.
"""

["2026-09-27-1300-new-logo"]
title = "Nowe logo Katna"
text = """
Katna ma teraz własne logo: কাটনা na karcie nad kopertą. Zobaczysz je w
menu aplikacji, na panelu, w zasobniku, na górnym pasku i w oknie O
Katna.
"""

["2026-09-27-1335-account-names-pictures-order"]
title = "Twoje konta, po twojemu"
text = """
Każde konto pokazuje teraz własną kolorową literę zamiast tego samego
zdjęcia dla wszystkich. W Ustawienia > Konta możesz wybrać zdjęcie dla
