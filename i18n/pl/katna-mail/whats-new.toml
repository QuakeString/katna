w Ustawienia > Ogólne > Pulpit.
"""

["2026-09-27-1215-paste-and-drop"]
title = "Wklejaj i upuszczaj w wiadomości, co chcesz"
text = """
Tekst skopiowany z aplikacji Word, LibreOffice lub ze strony
internetowej zachowuje czcionki, kolory i listy, a komórki z aplikacji
Excel, LibreOffice Calc lub Google Sheets trafiają do wiadomości jako
