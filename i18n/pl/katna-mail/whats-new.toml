albo by zwolnić miejsce na dysku; konta, ustawienia, wersje robocze i
Twoja poczta na serwerze zostają.
"""

["2026-09-27-1308-auto-advance"]
title = "Następna wiadomość otwiera się sama"
text = """
Usuń, zarchiwizuj lub przenieś czytaną wiadomość, a w jej miejscu
