title = "Wspólna skrzynka odbiorcza"
text = """
Włącz Ustawienia > Konta > Wspólna skrzynka odbiorcza, aby widzieć
pocztę ze wszystkich kont razem. „Wszystkie konta” otwierają panel
folderów, z jednym folderem Odebrane, Nieprzeczytane, Oznaczone
gwiazdką, Ważne, Wysłane, Wersje robocze i innymi dla wszystkich kont;
strzałka obok każdego z nich rozwija po jednym wierszu na konto. Nazwa
każdego konta ma teraz strzałkę, która zwija jego foldery.
"""

["2026-09-27-1627-right-click-move-and-not-spam"]
title = "Menu kontekstowe dopasowane do folderu"
text = """
Wybranie folderu lub etykiety w Przenieś do w menu pod prawym
przyciskiem przenosi teraz pocztę, z opcją Cofnij, także z wyników
wyszukiwania. W folderze Spam zamiast Zgłoś spam jest To nie spam. Kosz
oferuje Przenieś do Odebranych i Usuń trwale, Archiwum oferuje Przenieś
do Odebranych, a Wersje robocze i Wysłane pomijają pozycje, które tam
nie mają sensu.
"""

["2026-09-27-1633-drag-accounts"]
title = "Przeciągnij konta, by ustawić kolejność"
text = """
W Ustawienia > Konta przeciąganie konta unosi teraz cały jego wiersz, a
pozostałe konta odsuwają się, robiąc miejsce. Przenieś w górę i Przenieś
w dół pojawiają się po wskazaniu wiersza.
"""

["2026-09-27-1637-drafts"]
title = "Wersje robocze zostają"
text = """
Zamknięcie pisanej wiadomości zapisuje ją teraz w Wersjach roboczych,
także na twoim serwerze poczty, jak w Gmailu. Otwórz ją z Wersji
roboczych, by pisać dalej. Tylko przycisk kosza ją odrzuca, a Cofnij ją
przywraca.
"""

["2026-09-27-1609-many-attachments"]
title = "Miejsce na wiele załączników"
text = """
Niezależnie od liczby załączonych plików lista przewija się teraz nad
paskiem z przyciskiem Wyślij, zamiast na niego nachodzić, pokazuje
najnowszy plik i podaje liczbę plików oraz ich łączny rozmiar.
"""

["2026-09-27-1628-select-on-screen-first"]
title = "Zaznaczanie nieprzeczytanej lub oznaczonej gwiazdką poczty jak w Gmailu"
text = """
Przeczytane, Nieprzeczytane, Oznaczone gwiazdką i Bez gwiazdki w menu
zaznaczania znów zaznaczają pasującą pocztę na ekranie. Wiersz nad listą
proponuje zaznaczenie wszystkich pasujących wątków w folderze, a Wyczyść
zaznaczenie to cofa.
"""

["2026-09-27-1632-leave-settings-by-folder"]
title = "Foldery wyprowadzają z Ustawień"
text = """
Gdy Ustawienia są otwarte, kliknięcie folderu lub ikony Poczta zamyka
teraz Ustawienia i otwiera ten folder, jak w Gmailu. Strzałka wstecz
nadal też działa.
"""

["2026-09-27-1641-drop-pictures-in-text"]
title = "Upuszczanie obrazów w tekście"
text = """
Gdy przeciągasz obraz nad wiadomość, kursor pokazuje, gdzie trafi, więc
możesz go upuścić w środku zdania. Inne pliki nadal pokazują obszar
upuszczania załączników, a upuszczanie działa teraz także po tym, jak
coś wpiszesz.
"""

["2026-09-27-1707-quick-quit"]
title = "Zakończ zamyka od razu"
text = """
Zakończ w menu ikony w zasobniku nie czeka już na pocztę, która wciąż
się synchronizuje lub indeksuje: Katna i jej ikona w zasobniku zamykają
się od razu, a reszta będzie kontynuowana przy następnym uruchomieniu
programu Katna.
"""

["2026-09-27-1715-contact-panel"]
title = "Dane kontaktu obok poczty"
text = """
W szerokim oknie karta obok otwartego wątku pokazuje teraz nadawcę:
telefon, stanowisko i firmę z podpisów, godzinę u tej osoby, ile poczty
wymieniliście, wasze ostatnie wątki i pliki między wami. Kliknij wątek
lub plik, aby go otworzyć, albo inną osobę z wątku, aby ją zobaczyć.
Dane pochodzą wyłącznie z poczty na tym komputerze. Przycisk kontaktu na
pasku narzędzi okienka odczytu ukrywa kartę.
"""

["2026-09-27-1640-storage-used"]
title = "Wykorzystane miejsce"
text = """
Na dole panelu folderów widać, jak bardzo zapełnione jest miejsce na pocztę
konta, np. „Wykorzystano 34% z 15 GB”, jeśli serwer poczty to podaje.
"""

["2026-09-27-1651-desktop-search"]
title = "Szukaj poczty w KRunnerze i wyszukiwaniu GNOME"
text = """
Wpisz imię w KRunnerze (Alt+Space) lub w wyszukiwaniu Podglądu GNOME, aby
napisać do tej osoby, skopiować jej adres lub znaleźć jej pocztę. Wiadomości
pojawiają się, gdy temat lub nadawca zawiera każde wpisane słowo; zacznij od
mail:, aby przeszukać całą pocztę, tak jak w polu wyszukiwania Katna Mail.
"""

["2026-09-27-1727-mail-templates"]
title = "Szablony często pisanych wiadomości"
text = """
Napisz wiadomość raz i zapisz ją nowym przyciskiem Szablony podczas pisania,
a potem jednym kliknięciem wstaw ją do dowolnej nowej wiadomości lub
odpowiedzi. Wpisz {first name}, {name} lub {my name}, a Katna uzupełni je dla
każdego odbiorcy. Szablony edytujesz, zmieniasz ich nazwy i usuwasz w sekcji
Ustawienia > Tworzenie.
"""

["2026-09-27-1724-server-send-later"]
title = "Zaplanowana poczta wychodzi przy wyłączonym komputerze"
text = """
Gdy serwer poczty potrafi przetrzymać wiadomość do ustalonej pory, jak
Stalwart, Zaplanuj wysłanie przekazuje mu ją teraz, gdy tylko zniknie
Cofnij, więc wychodzi na czas nawet przy wyłączonym komputerze. Menu
planowania mówi, czy wyśle ją serwer poczty, czy Katna.
"""

["2026-09-27-1730-softer-row-hover"]
title = "Lżejsze podświetlenie"
text = """
Wiersz pod wskaźnikiem na liście wiadomości unosi się teraz z delikatnym
cieniem, jak w Gmailu, zamiast ciemnego pasa pod spodem.
"""

["2026-09-27-1745-drag-recipients"]
title = "Przeciągaj adresy między Do, DW i UDW"
text = """
Przeciągnij plakietkę adresu do innego pola, aby ją przenieść; DW i UDW
otwierają się podczas przeciągania, nawet gdy są ukryte. Wskazanie
plakietki pokazuje x, które ją usuwa.
"""

["2026-09-27-1722-katna-account"]
title = "Konto Katna"
text = """
Ustawienia > Subskrypcja pozwalają utworzyć konto na własnym serwerze
Katna, z osobnym hasłem, nigdy hasłem do poczty. Będą go potrzebować
funkcje online Katna, takie jak potwierdzenia przeczytania i śledzenie
linków. Widać tam komputery, na których się zalogowano, i każdy z nich
można wylogować.
"""

["2026-09-27-1805-reopens-as-you-left-it"]
title = "Wszystko tam, gdzie było"
text = """
Po zamknięciu i ponownym otwarciu Katna Mail wraca aplikacja, folder i
karta skrzynki odbiorczej, które były otwarte, a także rozwinięte
foldery i to, czy panel folderów był zwinięty. Zakończenie Katna z
zasobnika systemowego uruchamia go od nowa.
"""

["2026-09-27-1724-snooze-and-reminders"]
title = "Odkładanie i przypomnienia o odpowiedzi"
text = """
Odłóż wątek zegarem w jego wierszu albo z menu pod prawym przyciskiem:
czeka w folderze Odłożone i wraca do Odebranych jako nieprzeczytany o
wybranej porze. Przy wysyłaniu strzałka obok Wyślij może przypomnieć, jeśli
nikt nie odpowie w ciągu 1, 3 lub 7 dni. Oba działają, gdy komputer jest
włączony, i nadrabiają zaległości po jego wybudzeniu.
"""

["2026-09-27-1717-translate-mail"]
title = "Czytaj pocztę w swoim języku"
text = """
Nad wiadomością w innym języku pojawia się teraz przycisk Przetłumacz, a
Pokaż oryginał przywraca ją. Katna rozpoznaje język na twoim komputerze;
tekst wiadomości trafia na własny serwer Katna do przetłumaczenia tylko
wtedy, gdy o to poprosisz. Ustawienia > Ogólne > Tłumaczenie pozwalają
wybrać twój język i języki, które mają być zawsze tłumaczone.
"""

["2026-09-27-1744-open-and-click-tracking"]
title = "Zobacz, kiedy poczta zostaje otwarta"
text = """
Włącz oko obok odbiorców, aby widzieć, kiedy każdy z nich otwiera twoją
wiadomość lub klika zawarty w niej link, albo poproś zamiast tego o
potwierdzenie przeczytania. Wysłana poczta pokazuje, kto ją otworzył, a
powiadomienie informuje o tym za pierwszym razem. Obie funkcje są
wyłączone dla każdej nowej wiadomości, a śledzenie wymaga konta Katna
(Ustawienia > Subskrypcja).
"""

["2026-09-27-2042-activity"]
title = "Aktywność śledzonej poczty"
text = """
Aktywność obok pola wyszukiwania pokazuje, ile twoich śledzonych
wiadomości otwarto i jak często klikano ich linki, a tematy są
uszeregowane według tego, jak często są otwierane.
"""

["2026-09-27-2204-search-trigger-words"]
title = "Przeszukuj pocztę z KRunnera za pomocą k"
text = """
Wpisz k lub m, spację, a potem to, czego szukasz, w KRunnerze lub
wyszukiwarce GNOME, aby dostać te same wyniki co w polu wyszukiwania
Katna Mail, na przykład „k budget”. Własne słowa wybierzesz w
Ustawienia > Ogólne.
"""

["2026-09-27-2224-activity-button"]
title = "Aktywność obok pola wyszukiwania"
text = """
Przycisk Aktywność obok pola wyszukiwania liczy nowe otwarcia i
kliknięcia śledzonej poczty i pokazuje, kto co otworzył i w które linki
kliknięto; kliknij pozycję, aby otworzyć tę wiadomość. Szczegóły pokazują
wskaźniki otwarć i kliknięć, otwarcia według dni i najlepsze tematy z
ostatnich 7 lub 30 dni, z całego okresu lub z wybranych dat. Wysłana
wiadomość pokazuje teraz, ile razy każda osoba ją otworzyła i kliknęła
link.
"""

["2026-09-27-2239-mailbox-insights"]
title = "Statystyki skrzynki"
text = """
Aktywność > Szczegóły pokazuje teraz także, ile poczty wysłano i
odebrano w danym okresie, jak często i jak szybko odpowiadasz ty i inni,
osoby, z którymi piszesz najczęściej, oraz w jakie dni i o jakich
godzinach przychodzi poczta. Wszystko jest liczone na twoim komputerze z
poczty, którą Katna już ma.
"""

["2026-09-28-0059-sign-in-with-google"]
title = "Logowanie przez Google lub Microsoft"
text = """
Dodaj konto Gmail lub Outlook, logując się na stronie Google lub
Microsoftu w przeglądarce, bez hasła do aplikacji. Adresy Outlook.com i
Hotmail też już działają. Jeśli logowanie przestanie działać, komunikat
na dole okna zaproponuje ponowne zalogowanie się.
"""

["2026-09-28-0054-tracking-on-by-default"]
title = "Śledzenie i potwierdzenia włączone od początku"
text = """
Nowe wiadomości i odpowiedzi mają teraz od początku włączone śledzenie
otwarć i kliknięć, potwierdzenie przeczytania i potwierdzenie
dostarczenia; kliknij przycisk obok odbiorców, aby wyłączyć któreś z
nich dla tej wiadomości. Śledzenie wymaga zalogowania się na konto
Katna. Potwierdzenie dostarczenia to e-mail, który serwer poczty wysyła
Ci, gdy serwer każdego odbiorcy przyjmie wiadomość; przycisk jest
wyszarzony, jeśli Twój serwer poczty ich nie oferuje.
"""

["2026-09-28-0120-delivered-read-ticks"]
title = "Znaczniki dostarczenia i przeczytania"
text = """
Wysłana poczta pokazuje teraz znaczniki obok każdego odbiorcy. Jeden
szary znacznik oznacza, że serwer poczty odbiorcy ją przyjął: według
potwierdzenia dostarczenia lub, gdy Twoja usługa poczty go nie wysyła
(Gmail), gdy w ciągu pół godziny nie przyszedł zwrot. Dwa znaczniki w
Twoim kolorze akcentu oznaczają, że wiadomość przeczytano, według
potwierdzenia przeczytania lub śledzenia otwarć, a ostrzeżenie oznacza,
że wiadomość została zwrócona. Wskaż znacznik, aby zobaczyć, kiedy i
jak. E-maile z potwierdzeniami zostają w skrzynce w zakładce
Powiadomienia i nie wyświetlają powiadomień.
"""

["2026-09-28-0143-gmail-new-mail-notifications"]
title = "Powiadomienia o nowej poczcie w Gmailu"
text = """
Nowa poczta w skrzynce Gmaila znów pokazuje powiadomienie. Wcześniej
umykała poczta, którą Gmail umieścił w folderze Wszystkie chwilę przed
folderem Odebrane.
"""

["2026-09-28-0156-attachment-types"]
title = "Szukaj według typu załącznika"
text = """
W Opcjach wyszukiwania „Ma załącznik” oferuje teraz PDF, XLSX, ODF, XLS,
ODS, PPT i PPTX oraz Niestandardowy dla każdego innego rozszerzenia, np.
png lub avif. Wyświetlana jest tylko poczta z załącznikiem wybranego
typu.
"""

["2026-09-28-0106-original-colors"]
title = "Oryginalne kolory w ciemnym motywie"
text = """
W ciemnym motywie poczta, która ustawia własne kolory, jest pokazywana w
ciemnych. Nowy przycisk z półkolem na pasku narzędzi okienka odczytu
pokazuje ją w oryginalnych kolorach nadawcy i z powrotem.
"""

["2026-09-28-0127-print-as-shown"]
title = "Wydruk zachowuje formatowanie"
text = """
Poczta drukuje się tak, jak wygląda w okienku odczytu, z tabelami,
kolorami, obramowaniami, listami i obrazami. Podgląd wydruku może pominąć
kolory tła, aby oszczędzić tusz, albo wydrukować sam tekst opcją Tylko
tekst.
"""

["2026-09-28-0141-ask-before-deleting"]
title = "Pytanie przed usunięciem"
text = """
Usunięcie kilku wątków naraz pyta teraz najpierw, czy przenieść je do
kosza. Zaznacz „Nie pytaj ponownie”, aby pominąć to pytanie, albo włącz
je znowu w Ustawienia > Ogólne. Trwałe usuwanie, w koszu, pyta zawsze.
"""

["2026-09-28-0019-katna-for-windows"]
title = "Katna dla Windows"
text = """
Katna Mail działa teraz także w systemach Windows 10 i 11, instalowana przez
własny Katna Setup, z ikoną w zasobniku systemowym, powiadomieniami,
uruchamianiem przy logowaniu i linkami e-mail otwieranymi w Katna.
"""

["2026-09-28-0236-chip-remove-always"]
title = "Przycisk usuwania przy każdym adresie"
text = """
Każdy adres w polach Do, DW i UDW zawsze pokazuje teraz swój x, więc możesz
go usunąć bez wcześniejszego wskazywania.
"""

["2026-09-28-0244-pill-format-bar"]
title = "Bardziej zaokrąglony pasek formatowania"
text = """
Pasek formatowania podczas tworzenia wiadomości (Aa) ma teraz kształt
pigułki z delikatną krawędzią, dzięki czemu odcina się od tekstu w jasnym i
ciemnym motywie.
"""

["2026-09-28-0325-long-threads-smooth"]
title = "Długie wątki otwierają się szybko"
text = """
Sformatowana poczta cytująca wiele wcześniejszych odpowiedzi, na przykład
długi łańcuch cytatów, otwiera się teraz od razu i przewija płynnie, zamiast
spowalniać całe okno.
"""

["2026-09-28-0830-who-has-seen-it"]
title = "Kto ją widział, ukryte za okiem"
text = """
Wysłana poczta ze śledzeniem nie ma już nad sobą ramki z wierszami. Oko obok
gwiazdki przybiera Twój kolor akcentu, gdy tylko ktoś otworzy wiadomość;
wskaż je, aby zobaczyć, kto ją otworzył lub kliknął link, i kiedy.
"""

["2026-09-28-0831-contact-call-copy"]
title = "Dzwonienie i kopiowanie z danych kontaktu"
text = """
W danych kontaktu obok wątku kliknij numer telefonu, aby zadzwonić przez
aplikację telefonu lub KDE Connect, albo użyj przycisku kopiowania obok.
Cały tekst panelu można też teraz zaznaczyć i skopiować.
"""

["2026-09-28-0848-quoted-text-hide-remove"]
title = "Ukrywanie lub usuwanie cytowanej wiadomości w odpowiedzi"
text = """
Przycisk "..." pod odpowiedzią teraz znowu ukrywa cytowaną wiadomość po jej
otwarciu. Wskaż go i kliknij x w jego rogu, aby usunąć cytowaną wiadomość z
odpowiedzi; Cofnij lub Ctrl+Z ją przywraca. Pasek narzędzi odpowiedzi
zostaje też na miejscu podczas przewijania.
"""

["2026-09-28-0854-floating-folders"]
title = "Pływające foldery i szersze wyszukiwanie"
text = """
Gdy foldery są ukryte, zatrzymanie wskaźnika na Utwórz lub Poczta otwiera je
jako panel odsunięty od krawędzi, z małym dzióbkiem wskazującym przycisk.
Pole wyszukiwania rośnie, wypełniając miejsce zwolnione przez foldery, a
kliknięcie folderu, w którym już jesteś, nie powoduje już mignięcia listy.
"""

["2026-09-28-0928-search-address-suggestions"]
title = "Opcje wyszukiwania podpowiadają adresy"
text = """
Pola Od i Do w oknie Opcje wyszukiwania podpowiadają teraz adresy podczas
pisania, tak jak Do, DW i UDW podczas tworzenia wiadomości. Wybierz adres
klawiszem Enter, Tab lub kliknięciem.
"""

["2026-09-28-0935-app-menu-reply-all-window"]
title = "Menu główne w karcie konta, Odpowiedz wszystkim we własnym oknie"
text = """
Karta konta ma przycisk ☰ obok Zarządzaj kontami. Otwiera te same menu Plik,
Edycja, Widok, Przejdź, Wiadomość, Ustawienia i Pomoc co globalne menu
pulpitu, dla środowisk, które go nie pokazują. Odpowiedz wszystkim w
powiadomieniu o nowej poczcie otwiera teraz wątek we własnym oknie, gotowy
do pisania, i zostawia główne okno tam, gdzie jest.
"""

["2026-09-28-1011-tray-brings-window-forward"]
title = "Kliknięcia w zasobniku i powiadomieniach przywołują Katna Mail na wierzch"
text = """
Kliknięcie ikony w zasobniku albo pozycji Otwórz Odebrane, Nowa wiadomość
lub Ustawienia w jej menu przywołuje teraz okno Katna Mail na wierzch w
Waylandzie, nawet gdy było zminimalizowane lub schowane za innymi oknami.
Kliknięcie powiadomienia o nowej poczcie otwiera tę wiadomość, nawet gdy
lista Odebrane jej nie pokazuje.
"""

["2026-09-28-1053-send-countdown-reply-in-place"]
title = "Wysyłanie odlicza czas, a odpowiedź zostaje w wątku"
text = """
Po kliknięciu Wyślij kurczący się pierścień obok Cofnij odlicza czas na
cofnięcie, a gdy wiadomość wyjdzie, komunikat pokazuje Wiadomość wysłana (z
krótkim dźwiękiem). Dźwięk można wyłączyć w Ustawienia > Ogólne > Wysyłanie.
Odpowiedź napisana w wątku zamienia się w wiadomość dokładnie tam, gdzie
powstała. Jej nagłówek pokazuje tylko, do kogo idzie; kliknij go, aby
zobaczyć Od, Do, DW i UDW. Strzałka obok ikony odpowiedzi przełącza między
Odpowiedz, Odpowiedz wszystkim i Przekaż dalej, zachowując to, co już
napisano.
"""

["2026-09-28-1110-search-options-narrow"]
title = "Opcje wyszukiwania mieszczą się w wąskich oknach"
text = """
W wąskim lub niskim oknie Opcje wyszukiwania zajmują teraz dostępną
szerokość, na telefonie umieszczają etykiety nad polami i przewijają się,
gdy się nie mieszczą, więc przycisk Szukaj jest zawsze pod ręką.
"""

["2026-09-28-1119-replies-from-right-account"]
title = "Odpowiedzi wychodzą z właściwego konta"
text = """
Po wybraniu Odpowiedz lub Przekaż dalej przy wiadomości otwartej ze Wspólnej
skrzynki odbiorczej lub z wyszukiwania odpowiedź wychodzi teraz z konta, na
które przyszła wiadomość, a nie z konta wybranego pod zdjęciem profilowym.
"""

["2026-09-28-1436-calmer-search-box"]
title = "Wyszukiwanie pokazuje swój skrót"
text = """
Pole wyszukiwania pokazuje swój skrót klawiszowy obok „Przeszukaj pocztę”,
zgodnie z ustawieniem w Ustawienia > Skróty. Po kliknięciu zachowuje swój
kolor i pokazuje delikatną krawędź, zamiast ciemnieć i rzucać cień. Foldery
unoszące się nad listą trzymają się teraz także z dala od dolnej krawędzi.
"""

["2026-09-28-1450-clear-activity"]
title = "Porządki w Aktywności"
text = """
Wskaż otwarcie lub kliknięcie w Aktywności i naciśnij ×, aby usunąć je z
listy, albo naciśnij Wyczyść wszystko, aby zacząć od nowa. Nowe otwarcia i
kliknięcia nadal się pojawiają, a raport Szczegóły nadal liczy wszystko.
"""

["2026-09-28-1541-round-logo"]
title = "Nowe okrągłe logo Katna"
text = """
Katna ma nowe logo: kursywne k na morskim kręgu, w menu aplikacji, na górnym
pasku i na pasku zadań. Zasobnik pokazuje je w jednym kolorze dopasowanym do
twojego panelu, a O Katna i strona powitalna pokazują „katna mail” w pełnym
brzmieniu.
"""

["2026-09-28-1546-contact-cards"]
title = "Przejrzystsze dane kontaktu"
text = """
Dane kontaktu pokazują teraz każdą część na osobnej miękkiej karcie, z
okrągłymi przyciskami pod imieniem i nazwiskiem, by napisać do tej osoby,
znaleźć z nią pocztę albo do niej zadzwonić. Ostatnie wątki pokazują kilka
najnowszych; naciśnij Więcej, by zobaczyć resztę, i Mniej, by je zwinąć.
"""

["2026-09-28-1507-reply-box-recipients"]
title = "Bardziej uporządkowane pole odpowiedzi"
text = """
Odbiorcy pokazują się teraz ze swoimi zdjęciami, a DW i UDW mieszczą się
razem w jednym małym przycisku. Otwarcie odbiorców odpowiedzi płynnie
powiększa pole ku górze, a cytowana wiadomość płynnie otwiera się i zamyka
pod falistą linią, którą można kliknąć, aby znów ją zwinąć.
"""

["2026-09-28-1620-softer-window-shadow"]
title = "Delikatniejszy cień okna i przyciski w rozmiarze KDE"
text = """
Z ramką okna Katna cień wokół okna jest węższy i całkowicie zanika, bez
twardej krawędzi, którą wcześniej zostawiał przy oknie. Przyciski okna mają
teraz taki sam rozmiar jak własne przyciski KDE i zachowują taki sam
odstęp od boku okna, jak od jego góry.
"""

["2026-09-28-1622-update-from-the-app"]
title = "Aktualizuj Katna z poziomu aplikacji"
text = """
Katna teraz sama pobiera nowe wersje i informuje, gdy jedna jest gotowa.
Naciśnij Aktualizuj w powiadomieniu albo w oknie O Katna: Katna Mail
zapowie, że się uruchomi ponownie, poprosi o hasło, zainstaluje
aktualizację i otworzy się ponownie w tym samym miejscu co wcześniej.
Automatyczne pobieranie wyłączysz w Ustawienia > Ogólne > Aktualizacje.
"""

["2026-09-28-1520-track-sealed-and-plain"]
title = "Śledzenie podpisanej, zaszyfrowanej i zwykłej tekstowej poczty"
text = """
Oko działa teraz też w przypadku podpisanej i zaszyfrowanej poczty: kopia
każdego odbiorcy jest podpisywana lub szyfrowana osobno, dzięki czemu
podpisy pozostają ważne. Poczta w zwykłym tekście nie pokazuje otwarć, ale
jej linki są śledzone, więc zobaczysz, kiedy ktoś kliknie któryś z nich.
"""

["2026-09-28-1834-reply-after-closed-window"]
title = "Odpowiedź zaczyna od nowa po zamknięciu okna wiadomości"
text = """
Zamknięcie wiadomości napisanej we własnym oknie zachowuje ją teraz w
Wersjach roboczych, a Odpowiedz, Odpowiedz wszystkim i Przekaż dalej znów
otwierają nową wiadomość zamiast przywracać starą.
"""

["2026-09-28-1852-frosted-search-bar"]
title = "Mrożony pasek wyszukiwania"
text = """
Gdy rozmyte tło jest włączone, pasek wyszukiwania przepuszcza rozmycie tak
jak otaczający go pasek, zamiast leżeć na nim jak jednolita szara pigułka.
"""

["2026-09-28-1906-scroll-to-switch-accounts"]
title = "Przewiń nad swoim zdjęciem, aby przełączyć konto"
text = """
Gdy wskaźnik jest nad zdjęciem konta w prawym górnym rogu, obróć kółko
myszy, aby przejść do następnego lub poprzedniego konta, po jednym koncie na
ząbek. Zdjęcie przewija się do nowego konta, tak jak nazwa aplikacji
przewija się przy zmianie aplikacji, a wybranie konta z karty przewija je
tak samo.
"""

["2026-09-28-1918-many-recipients"]
title = "Miejsce na wielu odbiorców"
text = """
Odbiorcy po pierwszym wierszu zajmują teraz całą szerokość, a długa lista
przewija się w kilku wierszach, więc sama wiadomość zawsze pozostaje w
zasięgu. Opuść pole, a zwinie się do jednego wiersza, na przykład "Kay, Sam,
jeszcze 19"; kliknij go, aby znów zobaczyć wszystkich.
"""

["2026-09-28-1952-activity-by-account"]
title = "Raport aktywności dla jednego konta"
text = """
Raport aktywności ma teraz wybór konta obok dat. Wybierz Wszystkie konta
albo jedno z nich, a śledzone wiadomości, wskaźniki, wykres, tematy i
Twoja skrzynka dostosują się do wyboru. Raport podaje, które konto
pokazuje, i zapamiętuje twój wybór.
"""

["2026-09-28-2002-reader-arrows-always-shown"]
title = "Nowsze i Starsze zawsze na pasku narzędzi"
text = """
Bez względu na to, jak wąski jest panel czytania, licznik oraz strzałki
Nowszy i Starszy zostają po prawej stronie jego paska narzędzi.
Najrzadziej używane przyciski przenoszą się zamiast tego jeden po drugim
do menu Więcej, w tym przełączniki danych kontaktu i oryginalnych kolorów.
"""

["2026-09-28-2026-large-files-drive"]
title = "Wysyłaj pliki dowolnej wielkości"
text = """
Na koncie zalogowanym przez Google plik przekraczający limit poczty 25 MB
trafia na Twój Google Drive od razu po dołączeniu, a wiadomość zawiera
jego link, jak w Gmailu. Po naciśnięciu Wyślij jest udostępniany
odbiorcom; Katna pyta tylko wtedy, gdy komuś nie można nadać dostępu.
"""

["2026-09-28-2059-recipient-list-scrolling"]
title = "Płynniejsze długie listy odbiorców"
text = """
Długa lista odbiorców ma teraz własny pasek przewijania i przesuwa się o
jeden wiersz naraz, a wątek przewija się dalej dopiero po dojściu do
końca listy. Dodawanie odbiorców nie powoduje już przeskakiwania
przycisków poniżej.
"""

["2026-09-28-2106-check-for-new-mail"]
title = "Sprawdź nową pocztę"
text = """
Kliknij prawym przyciskiem folder lub konto w panelu folderów, aby
wybrać „Sprawdź nową pocztę”, „Oznacz wszystkie jako przeczytane”, nowy
folder w środku lub „Opróżnij kosz”. „Odśwież” nad listą pobiera teraz
dane także z serwera. Gdy Katna sprawdza, strzałki obracają się przy
„Odśwież” i obok folderu Odebrane, a u góry pojawia się „Sprawdzanie
nowej poczty…”, jeśli trwa to dłużej niż chwilę.
"""

["2026-09-28-2101-large-files-onedrive"]
title = "Duże pliki przez OneDrive"
text = """
Konta Outlook.com, Hotmail i inne konta Microsoft wysyłają teraz pliki
przekraczające limit poczty tak jak konta Google: plik trafia na Twój
OneDrive od razu po dołączeniu, a wiadomość zawiera jego link, jak w
Outlooku.
"""

["2026-09-28-2108-activity-checking"]
title = "Koniec z mignięciem „Zaloguj się” w Aktywności"
text = """
Zaraz po uruchomieniu Katna Aktywność pokazuje cienki pasek ładowania
podczas sprawdzania konta Katna, zamiast na chwilę prosić o zalogowanie
się. Katna sprawdza też konto od razu po uruchomieniu, więc czekanie
jest krótsze.
"""

["2026-09-28-2130-update-dialog"]
title = "Aktualizacje we własnym oknie"
text = """
Pomoc > Sprawdź aktualizacje otwiera osobne okno. Pokazuje Twoją wersję
obok nowej, z datą zbudowania każdej i rozmiarem pobierania, co nowego
w aktualizacji oraz każdą zmianę od Twojej wersji.
"""

["2026-09-28-2204-faster-start"]
title = "Szybszy start, płynniejsza synchronizacja"
text = """
Katna Mail otwiera dużą skrzynkę odbiorczą o około jedną czwartą
szybciej, a podczas pobierania poczty odświeża listę raz na partię,
zamiast co kilka wiadomości, dzięki czemu przewijanie i pisanie pozostają
płynne podczas synchronizacji.
"""

["2026-09-28-2111-link-addresses"]
title = "Sprawdź, dokąd prowadzi link"
text = """
Zatrzymaj wskaźnik na linku w wiadomości, a adres, który faktycznie
otwiera, pojawi się u dołu okienka odczytu, z wyróżnioną nazwą witryny,
niezależnie od tekstu linku. Obrazy od nadawcy, od którego zawsze
pokazujesz obrazy, są teraz wczytywane tylko wtedy, gdy dostawca poczty
potwierdzi, że wiadomość rzeczywiście od niego pochodzi.
"""

["2026-09-29-0120-update-build-details"]
title = "Więcej o Twojej wersji"
text = """
Okno Aktualizacje pokazuje teraz ostatnią zmianę w każdej wersji, skąd
pochodzi Twoja kopia i kiedy Katna ostatnio sprawdzała dostępność
aktualizacji.
"""

["2026-09-29-0213-coffee-button-play"]
title = "Małe przedstawienie w przycisku Postaw mi kawę"
text = """
Zatrzymaj wskaźnik na przycisku Postaw mi kawę w oknie O Katna: prosi o
kawę, herbatę, pizzę, potem o zupełnie nic, zadowala się wodą i dziękuje
kilkoma iskierkami. Za każdym razem gra raz i stoi w miejscu, gdy
ograniczysz ruch.
"""

["2026-09-29-0215-update-checking-bar"]
title = "Czytelniejsze okno aktualizacji"
text = """
Gdy Katna szuka aktualizacji, widać przesuwający się pasek, a nowa
wersja wyróżnia się własnym kolorem obok tej, którą masz.
"""

["2026-09-29-0231-keys-beside-the-list"]
title = "Klawisze podążające za panelem, w którym jesteś"
text = """
Gdy wątek jest obok listy, strzałki w górę i w dół przesuwają się teraz
po liście i pokazują każdy wątek. Tab lub Enter wchodzi do wątku, gdzie
strzałki w górę i w dół go przewijają; Esc lub Shift+Tab wraca do listy.
F6 przełącza między panelami, jak w innych programach pocztowych.
"""

["2026-09-29-0258-folders-slide-open"]
title = "Foldery rozsuwają się i zasuwają"
text = """
Kliknięcie strzałki obok konta lub folderu w panelu folderów rozsuwa
teraz lub zasuwa jego zawartość, a foldery poniżej się z nią przesuwają,
zamiast skakać.
"""

["2026-09-29-0301-keys-menus-dialogs"]
title = "Foldery, menu i okna dialogowe z klawiatury"
text = """
Shift+Tab lub F6 prowadzi do panelu folderów, gdzie strzałki w górę i w
dół otwierają kolejne foldery, a Enter przechodzi do ich poczty.
Strzałki w górę i w dół poruszają się po każdym menu, a Enter wybiera.
Shift+F10 lub klawisz Menu otwiera menu prawego przycisku myszy dla
zaznaczonej wiadomości. Okna dialogowe przejmują klawisze po otwarciu:
Enter odpowiada, Esc anuluje, a Tab zostaje w ich wnętrzu. W nowej
wiadomości Ctrl+Enter wysyła z dowolnego pola, a Esc ją zamyka,
zachowując wersję roboczą.
"""

["2026-09-29-0309-clock-tasks"]
title = "Zadania w zegarze na pulpicie"
text = """
Kliknij zegar, aby dodać zadanie i odhaczać zadania. W Plasmie kliknij
zegar prawym przyciskiem myszy i wybierz Pokaż alternatywy, aby wybrać
Zegar cyfrowy Katna. W GNOME od następnego logowania pod kalendarzem
zegara pojawia się karta Zadania.
"""

["2026-09-29-0329-pages-by-keyboard"]
title = "Strony z klawiatury i z paska zadań"
text = """
Ctrl+1 do Ctrl+5 przełączają między Pocztą, Kalendarzem, Kontaktami,
Zadaniami i Notatkami, tak jak w Outlooku, a menu Przejdź też je
wyświetla. Kliknij prawym przyciskiem myszy Katna Mail na pasku zadań,
aby od razu otworzyć Kalendarz lub Kontakty.
"""

["2026-09-29-0412-tasks-page"]
title = "Katna Zadania"
text = """
Naciśnij Ctrl+4 lub wybierz Zadania po lewej: wszystkie listy obok
siebie jak w Google Tasks, z podzadaniami, gwiazdkami, terminami,
powtarzaniem i szczegółami. Listy synchronizują się z Google Tasks i
Microsoft To Do, a zadania z zegara na pulpicie też pojawiają się tutaj.
"""

["2026-09-29-0352-contacts"]
title = "Twoje kontakty ze wszystkich kont"
text = """
Kontakty na lewym pasku pokazują teraz osoby zapisane na Twoich kontach
Gmail i Outlook oraz na serwerach CardDAV, każdą tylko raz, nawet jeśli
przechowuje ją kilka kont, wraz z etykietami, zdjęciami i szczegółami.
Ich nazwy i zdjęcia widać także w poczcie i w podpowiedziach adresów.
"""

["2026-09-29-0350-katna-notes"]
title = "Katna Notatki"
text = """
Notatki na pasku bocznym otwierają teraz Katna Notatki, ułożone jak w
Google Keep. Utwórz notatkę lub listę kontrolną, nadaj jej kolor,
przypnij ją na górze i zaznaczaj elementy bezpośrednio na tablicy.
Notatki zapisują się w trakcie pisania; wyszukiwarka je znajduje;
Archiwum i Kosz odkładają je na bok, z opcją Cofnij.
"""

["2026-09-29-0412-notes-sync"]
title = "Notatki na każdym urządzeniu"
text = """
Notatki są teraz przechowywane w folderze Notatki na Twoim koncie
poczty, tam gdzie Notatki na iPhonie i Macu trzymają swoje, więc
podążają za Tobą na inne urządzenia i wracają z nich. Nazwa konta pod
notatką pokazuje, gdzie jest przechowywana; kliknij ją, aby przenieść
notatkę, albo zachowaj ją tylko na tym komputerze.
"""

["2026-09-29-0451-add-mail-to-tasks"]
title = "Dodawanie wiadomości do Zadań"
text = """
Naciśnij Shift+T, jak w Gmailu, albo wybierz Dodaj do Zadań po
kliknięciu wiadomości prawym przyciskiem myszy. Zadanie przejmuje temat
wiadomości, a jego znacznik Poczta w Zadaniach ponownie otwiera
wiadomość.
"""

["2026-09-29-0412-calendar"]
title = "Twój kalendarz obok poczty"
text = """
Kalendarz pokazuje Twoje kalendarze Google, Microsoft i inne w widoku
dnia, tygodnia, miesiąca lub jako harmonogram, ze skrótami klawiszowymi
Kalendarza Google. Przycisk kalendarza po prawej stronie poczty otwiera
plan dnia z przyciskiem Dołącz do rozmów. Zaloguj się ponownie na konto,
aby Katna mogła odczytać jego kalendarz.
"""

["2026-09-29-0442-contacts-edit"]
title = "Tworzenie i edytowanie kontaktów"
text = """
Utwórz kontakt na stronie Kontakty dodaje osobę do wybranego konta, a
Edytuj na stronie kontaktu zmienia ją także tam. Usuń ma opcję Cofnij, a
Google i Outlook przez pewien czas przechowują usunięte kontakty w
koszu.
"""

["2026-09-29-0538-notes-on-mail"]
title = "Notatki do wiadomości"
text = """
Kliknij wiadomość prawym przyciskiem myszy albo otwórz jej menu ⋮ i
wybierz Dodaj notatkę: nad wiadomością otworzy się notatka z tematem
jako tytułem. Notatki wiadomości widać pod tematem za każdym razem,
gdy otworzysz ją ponownie, a znacznik Poczta na notatce przenosi z
powrotem do wiadomości.
"""

["2026-09-29-0542-caldav-tasks"]
title = "Zadania na własnym serwerze poczty"
text = """
Konta logujące się hasłem przechowują teraz swoje zadania na serwerze
poczty, jeśli oferuje on CalDAV, dzięki czemu zadania widać także w
aplikacjach serwera i na telefonie.
"""

["2026-09-29-0521-calendar-edit"]
title = "Dodawanie i zmienianie wydarzeń"
text = """
Kliknij lub przeciągnij w kalendarzu albo naciśnij C, aby dodać
wydarzenie. Przeciągnij wydarzenie, aby je przenieść, lub jego dolną
krawędź, aby zmienić czas trwania, a otwórz je, aby zmienić godzinę,
powtarzanie, przypomnienia i gości albo dodać rozmowę w Meet lub Teams.
Odpowiadaj na zaproszenia przyciskami Tak, Nie lub Może. Cofnij
przywraca wszystko.
"""

["2026-09-29-0546-calendar-any-account"]
title = "Kalendarze z większej liczby kont"
text = """
Katna znajduje teraz kalendarze Yahoo, Zoho, iCloud, Fastmail, GMX i
innych kont, nawet gdy znajdują się na innym serwerze niż poczta.
Najpierw próbuje najlepszego sposobu dla każdego konta, a gdy jest
niedostępny, innego.
"""

["2026-09-29-0625-tasks-today"]
title = "Dziś w Zadaniach"
text = """
Dziś, w sekcji Wszystkie zadania, zbiera to, co ma termin dzisiaj, oraz
wszystko, co jest zaległe, ze wszystkich list, wraz z listą, w której
znajduje się każde zadanie. Zadanie dodane tam ma termin dzisiaj.
"""

["2026-09-29-0631-invitation-card"]
title = "Zaproszenia w Twojej poczcie"
text = """
Zaproszenie wyświetla się teraz jako karta na górze wiadomości: kiedy i
gdzie, kto je zorganizował, Twój dzień wokół niego z zaznaczonymi
kolizjami, Dołącz oraz Bierzesz udział? Tak, Nie lub Może, z odpowiedzią
prosto tam.
"""

["2026-09-29-0616-note-labels"]
title = "Etykiety w notatkach"
text = """
Przycisk etykiety w notatce dodaje do niej etykiety, tak jak w Keep.
Twoje etykiety są wymienione obok Notatek, a każda pokazuje tylko swoje
notatki. Edytuj etykiety pozwala zmieniać ich nazwy lub je usuwać, z
opcją Cofnij.
"""

["2026-09-29-0630-tasks-more-accounts"]
title = "Zadania z większej liczby kont"
text = """
Zadania synchronizują się teraz także z Yahoo, Zoho, iCloud, Fastmail i
innymi kontami, których zadania znajdują się na innym serwerze niż
poczta. Katna najpierw próbuje najlepszej metody dla każdego konta i
zapamiętuje tę, która działa.
"""

["2026-09-29-0651-schedule-meeting"]
title = "Zaplanuj spotkanie z poziomu e-maila"
text = """
Kliknij rozmowę prawym przyciskiem myszy lub otwórz ⋮ i wybierz Zaplanuj
spotkanie: na stronie Kalendarz otworzy się nowe wydarzenie z tematem
jako tytułem i wszystkimi osobami z rozmowy jako gośćmi.
"""

["2026-09-29-0705-running-late"]
title = "Spóźniasz się? Powiadom wszystkich jednym kliknięciem"
text = """
Wydarzenie z gośćmi ma teraz Wyślij e-mail do gości, a od godziny przed
jego rozpoczęciem także Spóźniam się: e-mail do wszystkich, z konta tego
kalendarza, gotowy do wysłania.
"""

["2026-09-29-0607-contact-labels"]
title = "Etykiety kontaktów"
text = """
Przycisk Etykieta na stronie kontaktu włącza i wyłącza etykiety albo
tworzy nową, a ⋮ obok etykiety pozwala zmienić jej nazwę, usunąć ją lub
napisać do wszystkich, którzy ją mają. Etykiety pozostają
zsynchronizowane z Google Contacts i Outlookiem, a każda zmiana ma opcję
Cofnij.
"""

["2026-09-29-0640-add-to-contacts"]
title = "Dodawanie do kontaktów z poczty"
text = """
Panel kontaktu obok rozmowy ma przycisk Dodaj do kontaktów dla osoby,
której nie zapisano: jedno kliknięcie zapisuje imię i nazwisko, adres
oraz telefon, stanowisko i firmę z podpisu, z opcją Cofnij. Przy
zapisanej osobie ten sam przycisk otwiera ją na stronie Kontakty.
"""

["2026-09-29-0720-focus-time"]
title = "Czas na skupienie, nieobecność i miejsce pracy"
text = """
Nowe wydarzenie może być teraz Czasem na skupienie, wpisem Poza biurem
lub Miejscem pracy, tak jak w Google Calendar: wybierz to nad godzinami.
Google i Outlook rozpoznają je jako to, czym są, a w Katna mają własną
ikonę.
"""

["2026-09-29-0704-task-chips"]
title = "Zadania przy poczcie"
text = """
Wiadomość, z której utworzono zadanie, pokazuje teraz na liście termin
zadania, na czerwono, gdy jest po terminie. Kliknij go, aby otworzyć
zadanie.
"""

["2026-09-29-0638-other-contacts"]
title = "Inne kontakty"
text = """
W Kontaktach pojawiły się Inne kontakty: osoby, do których pisano z
Gmaila, ale nigdy ich nie zapisano, tak jak przechowuje je Gmail. Zapisz
każdą jednym kliknięciem, z opcją Cofnij, albo od razu napisz do niej
wiadomość.
"""

["2026-09-29-0745-answer-by-mail"]
title = "Odpowiadaj na zaproszenia z dowolnego konta"
text = """
Zaproszenie, które trafiło na konto bez kalendarza, ma teraz także Tak,
Nie i Może: Twoja odpowiedź trafia do organizatora e-mailem, a jego
kalendarz ją odnotowuje.
"""

["2026-09-29-0710-meeting-notes"]
title = "Notatki ze spotkań"
text = """
Otwórz wydarzenie w Kalendarzu i wybierz Notuj ze spotkania: otworzy się
notatka z tytułem wydarzenia, z listą uczestników i miejscem na zadania
do wykonania. Karta wydarzenia zawiera jego notatki, a znacznik
Wydarzenie w notatce przenosi z powrotem do danego dnia.
"""

["2026-09-29-0751-go-to-pdf-page"]
title = "Przejdź od razu do strony w pliku PDF"
text = """
Numer strony pod plikiem PDF jest teraz polem: kliknij go lub naciśnij
Ctrl+G, wpisz numer strony i naciśnij Enter, aby tam przejść.
"""

["2026-09-29-0715-tasks-on-calendar"]
title = "Zadania w kalendarzu"
text = """
Zadania z terminem są teraz widoczne w Kalendarzu: o swojej godzinie lub razem z wydarzeniami całodniowymi. Odhaczaj je tam, kliknij, aby otworzyć zadanie, albo przeciągnij je na inny dzień lub godzinę, aby zarezerwować na nie ten czas.
"""

["2026-09-29-0756-event-reminders"]
title = "Przypomnienia o wydarzeniach"
text = """
Wydarzenia przypominają o sobie powiadomieniem, nawet gdy Katna jest zamknięta. Przycisk Dołącz otwiera rozmowę wideo, a Drzemka 5 min przypomni o wydarzeniu ponownie za pięć minut.
"""

["2026-09-29-0758-contacts-merge-import"]
title = "Scalanie duplikatów oraz import i eksport kontaktów"
text = """
W Kontaktach jest teraz „Napraw i zarządzaj”: „Scal i napraw” znajduje osoby zapisane dwukrotnie (o tej samej nazwie lub tym samym numerze telefonu) i scala je jednym kliknięciem, z opcją „Cofnij”. „Importuj” wczytuje osoby z pliku vCard, pomijając te już zapisane, a „Eksportuj” zapisuje wszystkich lub jedną etykietę do pliku vCard.
"""

["2026-09-29-0835-contacts-birthdays-qr-print"]
title = "Urodziny w kalendarzu, kontakty jako kody QR"
text = """
Urodziny Twoich kontaktów są teraz widoczne w Kalendarzu, w kalendarzu Urodziny, który można odznaczyć. Strona kontaktu może pokazać go jako kod QR, który zapisuje aparat telefonu, oraz go wydrukować; „Drukuj” w sekcji „Napraw i zarządzaj” drukuje wszystkie widoczne osoby. Import wczytuje teraz także pliki CSV z Kontaktów Google i Outlooka, a KRunner i wyszukiwarka GNOME znajdują zapisane kontakty.
"""

["2026-09-29-0830-calendar-density-time-zones"]
title = "Gęstość Kalendarza i druga strefa czasowa"
text = """
Przycisk Opcje w Kalendarzu ustawia wysokość godzin (Dopasowana do ekranu, Wygodna lub Kompaktowa) i dodaje drugą strefę czasową obok Twojej, dla osób, które spotykasz za granicą.
"""

["2026-09-29-0809-video-calls"]
title = "Rozpocznij rozmowę wideo z wiadomości"
text = """
Kliknij konwersację prawym przyciskiem myszy lub otwórz ⋮ i wybierz Rozpocznij rozmowę wideo: rozmowa się otworzy, a do wszystkich w konwersacji trafi nowa wiadomość z linkiem. Konta Gmail używają Google Meet, pozostałe dostają pokój Jitsi Meet. Przy wiadomościach z linkiem do rozmowy w Meet, Teams, Zoom, Webex, Jitsi, WhatsApp lub Telegramie pojawia się teraz przycisk Dołącz.
"""

["2026-09-29-0815-note-line-task"]
title = "Zamień wiersz listy kontrolnej w zadanie"
text = """
Ustaw kursor na wierszu listy kontrolnej w notatce i wybierz Zamień w zadanie: wiersz trafi do Twoich zadań. Jego znacznik Notatka na stronie Zadania ponownie otwiera notatkę.
"""

["2026-09-29-0836-active-pane-stands-out"]
title = "Panel, w którym jesteś, się wyróżnia"
text = """
Obok listy tylko panel, który odbiera klawiaturę, zachowuje cień; lista, rozmowa lub panel kontaktu, z których nie korzystasz, cofa się z delikatniejszą krawędzią, a zmiana płynnie podąża za Twoim kliknięciem.
"""

["2026-09-29-0840-task-reminders"]
title = "Przypomnienia o zadaniach i powtarzanie"
text = """
Otwórz zadanie i wybierz Przypomnij: w momencie zadania, godzinę lub dzień wcześniej. Przypomnienie pojawia się nawet przy zamkniętym Katna, z przyciskami Oznacz jako wykonane i Drzemka. Odhaczenie zadania cyklicznego przywraca je teraz w następnym terminie.
"""

["2026-09-29-0849-tasks-in-desktop-search"]
title = "Znajdź zadania z poziomu pulpitu"
text = """
Wpisz kilka słów z zadania w KRunner lub w wyszukiwarce GNOME, a pojawi się ono w sekcji Zadania. Naciśnij Enter, a Katna otworzy je, gotowe do edycji.
"""

["2026-09-29-0832-clock-day-menu"]
title = "Dodawaj wydarzenia i zadania z zegara na pulpicie"
text = """
W Katna Digital Clock kliknij dzień w miesiącu prawym przyciskiem myszy,
aby dodać zadanie lub wydarzenie na ten dzień; wydarzenie otworzy się w
Kalendarzu Katna. Kliknięcie jednego z Twoich wydarzeń otwiera Kalendarz
na jego dniu.
"""

["2026-09-29-0855-type-an-event"]
title = "Wpisz wydarzenie w jednym wierszu"
text = """
Wpisz „Lunch z Anitą w piątek o 13:00 w Cafe Mocha” lub „Spotkanie
codziennie w dni robocze o 9:30” jako tytuł nowego wydarzenia, a
Kalendarz uzupełni dzień, godzinę, powtarzanie i miejsce w trakcie
pisania.
"""

["2026-09-29-0915-year-view"]
title = "Zobacz cały rok"
text = """
Kalendarz ma widok Roku: wszystkie dwanaście miesięcy naraz, z kropką
pod dniami, w których są wydarzenia. Naciśnij Y i kliknij dzień, aby go
otworzyć.
"""

["2026-09-29-0930-share-free-times"]
title = "Udostępnij swoje wolne terminy"
text = """
Udostępnij wolne terminy w opcjach Kalendarza tworzy wiadomość z listą
terminów, w których jesteś wolny w najbliższych dniach roboczych, gotową
do wysłania komukolwiek.
"""

["2026-09-29-0952-calendar-sets"]
title = "Zestawy kalendarzy"
text = """
Zapisz widoczne kalendarze jako zestaw, np. „Praca” lub „Rodzina”, za
pomocą + obok Zestawy kalendarzy. Jedno kliknięcie zestawu pokazuje jego
kalendarze i ukrywa pozostałe.
"""

["2026-09-29-0947-tasks-typed-quick-add"]
title = "Wpisz zadanie w jednym wierszu"
text = """
Dodaj zadanie, np. „Zadzwoń do banku jutro o 15:00” lub „Podlej kwiaty w
każdy poniedziałek o 8:00”, a Zadania ustawią za Ciebie dzień, godzinę i
powtarzanie, pokazując w trakcie pisania, co zrozumiały.
"""

["2026-09-29-1028-calendar-narrow-windows"]
title = "Kalendarz w wąskim oknie"
text = """
W wąskim oknie Kalendarz zachowuje na pasku przycisk Dzisiaj i daty, a
widoki przenosi do jednego menu. Godziny wydarzeń nie łamią się już w
połowie słowa, a Tab dociera do każdego przycisku i kalendarza.
"""

["2026-09-29-1039-contact-panel-tasks"]
title = "Zadania z tą osobą obok jej poczty"
text = """
Panel kontaktu obok konwersacji pokazuje teraz Twoje otwarte zadania
utworzone z wiadomości wymienianych z tą osobą. Zaznacz jedno, aby je
ukończyć, lub kliknij je, aby otworzyć je w Zadaniach.
"""

["2026-09-29-1046-contact-panel-meetings"]
title = "Twoje najbliższe spotkania z tą osobą"
text = """
Panel kontaktu obok konwersacji pokazuje teraz Twoje najbliższe
spotkania z tą osobą. Kliknij jedno, aby otworzyć je w Kalendarzu.
"""

["2026-09-29-1051-tasks-drag-to-list"]
title = "Przeciągnij zadanie na inną listę"
text = """
W Zadaniach przeciągnij zadanie na inną listę, aby je tam przenieść.
Cofnij przywraca je na miejsce.
"""

["2026-09-29-1111-tasks-search"]
title = "Szukaj w zadaniach"
text = """
W Zadaniach pole wyszukiwania u góry przeszukuje teraz Twoje zadania,
ich notatki i podzadania, a nie pocztę.
"""

["2026-09-29-1130-calendar-search"]
title = "Szukaj w wydarzeniach"
text = """
W Kalendarzu pole wyszukiwania u góry znajduje teraz wydarzenia po
tytule, miejscu, notatkach lub gościach, uporządkowane według daty.
Kliknij jedno, aby otworzyć je w jego dniu; Esc wraca do wyników.
"""

["2026-09-29-1045-note-formatting"]
title = "Formatowanie w notatkach"
text = """
Wybierz Formatowanie w notatce, aby użyć stylów Nagłówek 1, Nagłówek 2,
pogrubienia, kursywy i podkreślenia, jak w Keep. Tablica też je
pokazuje, a formatowanie trafia razem z notatką do folderu Notatki na
Twoim koncie poczty, skąd formatowanie z iPhone’a wraca teraz bez zmian.
"""

["2026-09-29-0934-custom-days-view"]
title = "Tylko kilka dni"
text = """
Kalendarz ma obok widoku Harmonogram Widok niestandardowy: 4 dni od
wybranego dnia albo dowolnie od 2 do 7. Naciśnij X, a liczbę dni wybierz
w Opcjach.
"""

["2026-09-29-0939-events-in-desktop-search"]
title = "Znajduj wydarzenia z pulpitu"
text = """
Wpisz nazwę wydarzenia w KRunner lub wyszukiwarce GNOME, aby zobaczyć,
kiedy odbędzie się najbliższe, i naciśnij Enter, aby otworzyć ten dzień
w Kalendarzu.
"""

["2026-09-29-1102-apps-on-a-phone"]
title = "Kalendarz, Kontakty, Zadania i Notatki na telefonie"
text = """
W wąskim oknie te strony dopasowują się teraz do ekranu tak jak Poczta:
ich boczna lista otwiera się przyciskiem menu, Kontakty pokazują każde
imię z adresem pod spodem, a Notatki układają po dwie karty w rzędzie.
"""

["2026-09-29-1236-agenda-button-top-bar"]
title = "Plan dnia z górnego paska"
text = """
Przycisk, który pokazuje plan dnia obok poczty, jest teraz na górnym
pasku, obok przycisku języka, a poczta zyskuje miejsce zajmowane dotąd
przez boczny pasek.
"""

["2026-09-29-1243-hide-side-panel-on-every-page"]
title = "Ukryj panel boczny na każdej stronie"
text = """
Przycisk menu w lewym górnym rogu zwija teraz panel boczny także w
Kalendarzu, Kontaktach, Zadaniach i Notatkach, wysuwając go tak jak
foldery Poczty. Każda strona pamięta, czy zostawiono go otwartym.
"""

["2026-09-29-1251-app-menu-on-a-phone"]
title = "Menu główne na telefonie"
text = """
Na telefonie menu główne pod zdjęciem konta otwiera Plik, Edycja, Widok
i resztę w miejscu, z wierszem Wstecz na górze, zamiast poza krawędzią
ekranu.
"""

["2026-09-29-1256-calendar-every-account"]
title = "Każde konto w Kalendarzu"
text = """
Boczna lista Kalendarza pokazuje teraz wszystkie Twoje konta. Gdy
kalendarze któregoś z nich nie mogą się wczytać, wiersz pod nim mówi
dlaczego i podaje jedno kliknięcie, które to naprawia, np. „Zaloguj się
ponownie, aby wyświetlić kalendarze”.
"""

["2026-09-29-1300-switch-account-stay-on-page"]
title = "Zmieniaj konto bez opuszczania strony"
text = """
Wybranie innego konta ze zdjęcia w prawym górnym rogu lub obrócenie nad
nim kółka myszy zostawia Cię teraz w Kalendarzu, Zadaniach, Kontaktach
lub Notatkach. Nowe elementy trafiają na to konto, a Poczta pokazuje je
po powrocie.
"""

["2026-09-29-1317-contacts-every-account"]
title = "Każde konto w Kontaktach"
text = """
Kontakty pokazują teraz wszystkie Twoje konta w sekcji Konta, z liczbą
osób na każdym; kliknij jedno, aby zobaczyć tylko jego osoby. Gdy
kontakty konta nie mogą się wczytać, wiersz pod nim mówi dlaczego i
podaje jedno kliknięcie, które to naprawia, np. „Zaloguj się ponownie,
aby wyświetlić kontakty” lub „Spróbuj ponownie”.
"""

["2026-09-29-1327-tasks-every-account"]
title = "Każde konto na stronie Zadania"
text = """
Każde konto jest teraz widoczne w panelu bocznym Zadań. Gdy zadania
konta nie mogą się wczytać, wiersz pod nim mówi dlaczego i daje jedno
kliknięcie, które to naprawia: ponowne zalogowanie lub ponowną próbę.
"""

["2026-09-29-1404-compose-dialogs-in-view"]
title = "Pytania przed wysłaniem są zawsze widoczne"
text = """
Pytania takie jak „Czy chcesz załączyć pliki?” otwierają się teraz na
środku okna, niezależnie od długości pisanej lub przekazywanej
wiadomości, więc nigdy nie chowają się niżej na stronie. Enter odpowiada
głównym przyciskiem, a Esc wraca do wiadomości.
"""

["2026-09-29-1530-mark-up-pdfs"]
title = "Adnotacje w plikach PDF"
text = """
Naciśnij pióro w przeglądarce PDF, aby wyróżnić, podkreślić, podkreślić
falistą linią lub przekreślić tekst albo rysować piórem w wybranym
kolorze. Cofnij za pomocą Ctrl+Z, usuń adnotację gumką, a potem zapisz
kopię z adnotacjami. Oryginalny załącznik pozostaje bez zmian.
"""

["2026-09-29-1557-calendar-accounts-why"]
title = "Dlaczego konto nie ma kalendarzy"
text = """
Gdy kalendarze konta się nie pokazują, Kalendarz podaje teraz, co
odpowiedział serwer, a „Spróbuj ponownie” od razu szuka ich jeszcze raz.
Konto Gmail lub Outlook dodane z hasłem proponuje zalogowanie się przez
Google lub Microsoft, czego wymagają ich kalendarze.
"""

["2026-09-29-1610-one-checkbox"]
title = "Pola wyboru z animowanym zaznaczeniem"
text = """
Każde pole wyboru w Katna Mail ma teraz ten sam rozmiar co okrągłe
przyciski obok. Znacznik rysuje się, gdy je zaznaczasz, i znika, gdy je
odznaczasz, tak samo w Ustawieniach, na liście poczty, w Kalendarzu,
Kontaktach, Notatkach i oknach dialogowych.
"""

["2026-09-29-1622-right-click-menu-fits"]
title = "Krótsze menu prawego przycisku, które zawsze się mieści"
text = """
Menu prawego przycisku na liście poczty trzyma codzienne działania na
górze, a resztę umieszcza w „Dalsze działania” (zadania, notatki,
spotkania, rozmowy) i „Więcej” (spam, ważność, przypięcie). Otwiera się
tam, gdzie klikniesz, i nie wychodzi poza okno; w niskim lub wąskim
oknie podmenu otwiera się w miejscu menu.
"""

["2026-09-29-1627-contacts-accounts-why"]
title = "Dlaczego konto nie ma kontaktów"
text = """
Gdy kontakty konta się nie pokazują, Kontakty podają teraz, co
odpowiedział serwer, a „Spróbuj ponownie” od razu szuka ich jeszcze raz.
Konto Gmail lub Outlook dodane z hasłem proponuje zalogowanie się przez
Google lub Microsoft, czego wymagają ich kontakty.
"""

["2026-09-29-1640-search-box-focus"]
title = "Pole wyszukiwania pokazuje, kiedy jest aktywne"
text = """
Pole wyszukiwania u góry dostaje obramowanie w kolorze akcentu, gdy w
nim piszesz, tak jak każde inne pole, a podpowiedź Ctrl+F usuwa się na
bok, dopóki nie zostawisz go pustego.
"""

["2026-09-29-1612-tasks-board-rows"]
title = "Każda lista zadań w zasięgu wzroku"
text = """
„Wszystkie zadania” pokazuje teraz obok siebie tyle list, ile mieści się
w oknie, z kolejnymi rzędami poniżej, więc do każdej listy da się
dotrzeć. Nowa lista przewija się do widoku, gdy tylko ją utworzysz.
"""

["2026-09-29-1653-smooth-attachment-paging"]
title = "Płynne przechodzenie między załącznikami"
text = """
Przechodzenie strzałkami do następnego lub poprzedniego załącznika w
przeglądarce już nie migocze. Przeglądarka pozostaje otwarta, a następny
plik zajmuje miejsce poprzedniego, gdy tylko jest gotowy.
"""

["2026-09-29-1656-drag-notes"]
title = "Przeciągaj notatki, aby ułożyć je po swojemu"
text = """
Przeciągnij notatkę na tablicy Notatek, aby ją przenieść, jak w Keep.
Pozostałe notatki płynnie odsuwają się, robiąc miejsce, a ona zostaje
tam, gdzie ją upuścisz. Ctrl+Z przywraca ją na miejsce. Karty układają
się teraz ciasno w kolumnach, bez przerw pod krótkimi notatkami.
"""

["2026-09-29-1707-calendar-right-click"]
title = "Prawy przycisk myszy w Kalendarzu"
text = """
Kliknij prawym przyciskiem wolny czas lub dzień, aby dodać tam wydarzenie,
czas na skupienie lub nieobecność w biurze. Kliknij prawym przyciskiem
wydarzenie, aby je edytować, zduplikować, usunąć, odpowiedzieć, dołączyć,
wysłać e-mail do gości, nadać mu kolor lub przenieść je do innego
kalendarza, a zadanie, aby je odhaczyć, oznaczyć gwiazdką, dać mu inny dzień
lub je usunąć. Cofnij wycofuje zmianę.
"""

["2026-09-29-1725-pdf-notes-and-text"]
title = "Notatki i tekst w plikach PDF"
text = """
Adnotacje w PDF obejmują teraz karteczki i pola tekstowe: kliknij stronę,
pisz i naciśnij Ctrl+Enter. Najedź na notatkę, aby ją przeczytać, albo
kliknij, aby ją zmienić. Odpowiedz wysyła kopię z adnotacjami od razu w
odpowiedzi na wiadomość.
"""

["2026-09-29-1657-tasks-drag-to-place"]
title = "Przeciągaj zadania, gdzie chcesz"
text = """
Przeciągnij zadanie w górę lub w dół listy albo do innej listy, a zadania w
tym miejscu rozsuną się, pokazując, gdzie trafi. Google Tasks zachowa nową
kolejność także na telefonie, a Cofnij odłoży zadanie z powrotem.
"""

["2026-09-29-1719-calendar-task-tab"]
title = "Dodawaj zadania z Kalendarza"
text = """
Karta nowego wydarzenia ma zakładkę Zadanie, jak w Kalendarzu Google. Kliknij
godzinę, wybierz Zadanie, a tytuł, dzień i godzina staną się zadaniem na
wybranej liście, z opisem, jeśli chcesz.
"""

["2026-09-29-1758-calendar-new-task-here"]
title = "Dodawaj zadania z Kalendarza"
text = """
Kliknij prawym przyciskiem wolny czas lub dzień w Kalendarzu i wybierz
Zadanie, aby dodać tam zadanie. Karta nowego wydarzenia otworzy się na
zakładce Zadanie z tym dniem i godziną już wpisanymi.
"""

["2026-09-30-0113-calendar-server-unreachable"]
title = "Kalendarze szukane ponownie po wolnym serwerze"
text = """
Gdy serwer kalendarzy konta nie odpowie na czas, Kalendarz mówi to teraz
wprost, a także czy utknęło połączenie, czy bezpieczne uzgadnianie, zamiast
„Nie znaleziono kalendarzy”. Ponawia próbę w ciągu kilku minut, a nie
godzin.
"""

["2026-09-30-0123-contact-files-fill"]
title = "Pliki kontaktu pokazują pobieranie"
text = """
Plik w panelu kontaktu, którego wiadomości nie ma jeszcze na tym
komputerze, wypełnia się teraz podczas pobierania, tak jak załączniki na
liście, a potem się otwiera.
"""

["2026-09-30-0135-new-account-mail-shows-as-it-arrives"]
title = "Poczta nowego konta pojawia się na bieżąco"
text = """
Po dodaniu konta jego Odebrane pobierają się najpierw i wypełniają na
twoich oczach, zamiast stać na „Pobieranie poczty…”, aż skończą się
wszystkie foldery. Pozostałe foldery wypełniają się tak samo.
"""

["2026-09-30-0159-checkbox-matches-icons"]
title = "Pola wyboru równo z ikonami"
text = """
Pola wyboru są nieco mniejsze, mają ten sam rozmiar co ikony gwiazdki
i etykiety obok nich na liście poczty. Klika się je równie łatwo,
a znacznik nadal się rysuje.
"""

["2026-09-30-0201-zoho-calendars"]
title = "Kalendarze Zoho przez własne połączenie Zoho"
text = """
Zoho udostępnia kalendarze innym aplikacjom na porcie, który blokuje
wiele sieci, więc po „Zaloguj się przez Zoho” Kalendarz czyta je zamiast
tego przez własne API Zoho. Twoje wydarzenia Zoho są widoczne obok
innych kalendarzy; zmienianie ich w Katna pojawi się później.
"""

["2026-09-30-0216-zoho-tasks"]
title = "Zadania Zoho"
text = """
Zaloguj się przez Zoho na koncie Zoho, a jego zadania z Zoho ToDo
pojawią się w Zadaniach, w obie strony: dodaj, edytuj, odhacz lub usuń
zadanie w Katna, a zmieni się też w Zoho.
"""

["2026-09-30-0224-checkbox-tick-centred"]
title = "Znacznik na środku przy każdym rozmiarze"
text = """
Przy skalowaniu powyżej 100% (Ustawienia > Wygląd > Skalowanie) znacznik
w polu wyboru był nieco przesunięty w górę i w lewo. Krawędzie pól
wyboru i okrągłych przycisków rosną teraz razem ze skalą, więc znacznik
jest na środku przy każdym rozmiarze.
"""

["2026-09-30-0230-edges-follow-scaling"]
title = "Obramowania rosną razem ze skalowaniem"
text = """
Przy skalowaniu powyżej lub poniżej 100% (Ustawienia > Wygląd) obramowanie
w kolorze akcentu aktywnego pola wyszukiwania i innych pól, a także
krawędzie kart wyboru i pierścieni zadań, rosną i maleją teraz razem z
resztą, zamiast pozostawać cienkie.
"""

["2026-09-30-0326-google-sign-in-network"]
title = "Logowanie przez Google w każdej sieci"
text = """
Logowanie przez Google nie kończy się już błędem „peer closed connection”
w sieciach, które wcześnie zrywają połączenie z Google. Jeśli na stronie
Google odznaczysz Gmail, Katna od razu to powie, zamiast zawieść później.
"""

["2026-09-30-0504-google-api-turned-off"]
title = "Informacja, które API Google jest wyłączone"
text = """
Gdy Google ma wyłączone jakieś API dla Katna, Kontakty, Kalendarz, Zadania
i pliki z Drive podają w krótkim wierszu, które to, z przyciskiem Włącz
otwierającym odpowiednią stronę Google, zamiast surowego błędu Google.
"""

["2026-09-30-0507-newest-mail-first"]
title = "Najnowsza poczta najpierw"
text = """
Po dodaniu konta Katna Mail pobiera teraz najpierw najnowszą pocztę, a
potem cofa się do starszej, więc dzisiejsze wiadomości od razu są na
górze Odebranych. Jeśli pobieranie zostanie przerwane, starsza poczta
dociągnie się następnym razem.
"""

["2026-09-30-0601-keyring-at-login"]
title = "Czekanie na portfel po zalogowaniu"
text = """
Jeśli KWallet lub GNOME Keyring jest jeszcze zablokowany, gdy Katna
startuje, a jego okno odblokowania zostało zamknięte, konta nie pokazują
już błędnego hasła. Czekają i same zaczynają synchronizację, gdy tylko
odblokujesz portfel, bez zamykania Katna. „Synchronizuj teraz” prosi
o ponowne odblokowanie.
"""

["2026-09-30-0606-pdf-rotate-and-top-bar"]
title = "Obracanie stron PDF"
text = """
Przeglądarka PDF obraca teraz strony zgodnie z ruchem wskazówek zegara lub
przeciwnie (Ctrl+R i Ctrl+Shift+R), a kopia z adnotacjami zapisuje się
tak, jak ją obróciłeś. Numer strony i powiększenie przeniosły się na górny
pasek, więc nic nie zasłania strony.
"""

["2026-09-30-0610-calendar-events-stay-put"]
title = "Wydarzenia zostają na miejscu"
text = """
Kliknięcie wydarzenia lub zadania w Kalendarzu, a potem zmiana widoku, nie
sprawia już, że podąża ono za kursorem. Wydarzenie przesuwa się teraz
tylko wtedy, gdy przytrzymasz przycisk i je przeciągasz, a zmiana widoku
lub strony, Esc albo otwarcie jego karty zostawiają je bez zmian.
"""

["2026-09-30-0620-checkbox-partial-centred"]
title = "Częściowo zaznaczone pola wyglądają równo"
text = """
Gdy zaznaczone są tylko niektóre wiadomości, kwadrat w polu „zaznacz
wszystko” ma teraz taki sam odstęp z każdej strony, przy dowolnej skali
interfejsu.
"""

["2026-09-30-0632-year-view-day-peek"]
title = "Plany dnia w widoku roku"
text = """
W widoku Rok w Kalendarzu zatrzymaj kursor na dniu z kropką, aby zobaczyć
jego wydarzenia i zadania w małym okienku obok, każde z ikoną mówiącą, czym
jest, i godziną. Kliknij jedno, aby je otworzyć, albo nazwę dnia, aby
otworzyć ten dzień. Na telefonie stuknij dzień.
"""

["2026-09-30-0650-notification-opens-own-window"]
title = "Powiadomienia otwierają wiadomość na wierzchu"
text = """
Kliknięcie powiadomienia o nowej poczcie otwiera tę wiadomość we własnym
oknie, na wierzchu, cokolwiek Katna akurat pokazuje. Odpowiedz wszystkim
otwiera ją z odpowiedzią gotową do pisania. Archiwizuj odkłada wiadomość
bez otwierania czegokolwiek i mówi o tym w krótkiej notce z Cofnij.
"""

["2026-09-30-0700-event-card-join-any-call"]
title = "Dołączaj do spotkań Teams i Zoom z Kalendarza"
text = """
Karta wydarzenia odnajduje teraz połączenie w opisie lub miejscu, więc
zaproszenie Microsoft Teams, Zoom, Webex, Jitsi lub Google Meet dostaje
u góry przycisk „Dołącz przez”. Adresy stron w opisie są linkami, linie
podkreślników zniknęły, a „Bierzesz udział?” zostaje na dole, gdy
szczegóły się przewijają.
"""

["2026-09-30-0715-click-away-closes-viewer"]
title = "Kliknij obok, aby zamknąć"
text = """
Kliknij przyciemnione miejsce wokół załącznika, aby zamknąć przeglądarkę,
zamiast sięgać po przycisk wstecz. Kliknięcia na samej stronie nadal
zaznaczają tekst i dodają adnotacje jak dotąd.
"""

["2026-09-30-0729-add-account-and-pop3"]
title = "Nowe Dodaj konto i POP3"
text = """
Dodawanie konta zaczyna się od dostawcy: Google, Yahoo, iCloud, Zoho,
Fastmail, GMX, Yandex lub dowolny inny. Katna mówi najpierw, czego dostawca
potrzebuje, pokazuje każdy krok podczas łączenia i kończy podsumowaniem
tego, co skonfigurowała. Działają też konta POP3, a w Ustawienia > Konta
wybierzesz, jak długo ich poczta zostaje na serwerze.
"""

["2026-09-30-0802-ctrl-wheel-zoom"]
title = "Powiększanie Ctrl i kółkiem"
text = """
W przeglądarce załączników przytrzymaj Ctrl i obróć kółko myszy, aby
powiększać i pomniejszać wokół kursora, albo zsuń palce na touchpadzie.
Działa to dla plików PDF, obrazów, plików tekstowych, arkuszy i dokumentów.
"""

["2026-09-30-0817-event-open-the-mail"]
title = "Otwórz wiadomość stojącą za wydarzeniem"
text = """
Wydarzenia, które Gmail utworzył z wiadomości, jak pociągi, loty i hotele,
mają na karcie przycisk Otwórz wiadomość. Otwiera on tę wiadomość w Katna
albo w Gmailu, gdy Katna jej nie ma. Zadanie utworzone z wiadomości też
otwiera ją ze swojej karty w Kalendarzu, a „Notuj ze spotkania” otwiera się
bez mrugnięcia.
"""

["2026-09-30-0843-calendar-side-panel-menus"]
title = "Zarządzaj kalendarzami z panelu bocznego"
text = """
Kliknij prawym przyciskiem kalendarz w panelu bocznym Kalendarza, aby
pokazać tylko jego, zmienić mu kolor, nazwę albo go usunąć. Kliknij prawym
przyciskiem nazwę konta, aby utworzyć w nim nowy kalendarz albo pokazać
lub ukryć wszystkie jego kalendarze. Zmiany trafiają do twojej usługi
pocztowej, więc widać je wszędzie, gdzie z niej korzystasz.
"""

["2026-09-30-1010-unread-list-keeps-open-mail"]
title = "Nieprzeczytana poczta zostaje otwarta"
text = """
Otwarcie wątku w Wszystkie konta > Nieprzeczytane już go od razu nie
zamyka. Przeczytanie oznacza go jako przeczytany, a on zostaje na liście,
dopóki go nie zamkniesz albo nie otworzysz innego.
"""

["2026-09-30-1045-tracked-mail-arrives"]
title = "Śledzona poczta znowu dociera"
text = """
Poczta wysłana ze śledzeniem mogła pojawić się w Wysłanych, nie docierając
do nikogo. Teraz trafia do każdego odbiorcy. Wiadomości utracone w ten
sposób trzeba wysłać ponownie.
"""

["2026-09-30-1114-no-checking-pill"]
title = "Koniec z dymkiem sprawdzania"
text = """
„Sprawdzanie nowej poczty…” nie wyskakuje już nad listą. Obracające się
strzałki na przycisku odświeżania i przy Odebranych każdego konta i tak
pokazują, że poczta jest sprawdzana, a nieudane sprawdzenie nadal mówi,
co poszło nie tak.
"""

["2026-09-30-1300-windows-sign-in-and-domains"]
title = "Logowanie przez Google w Windows"
text = """
Katna dla Windows oferuje teraz logowanie przez Google i Zoho, tak jak na
Linuksie, i przy dodawaniu konta wie, kto obsługuje pocztę w twojej
własnej domenie, na przykład adres Google Workspace.
"""

["2026-09-30-1511-mail-tables"]
title = "Tabele w poczcie czytelne jak należy"
text = """
Tabele w poczcie, takie jak lista zadań w powiadomieniu GitHub Actions,
zachowują kolumny obok siebie i wyrównują je między wierszami, zamiast
łamać nagłówek po jednej literze w wierszu. Widać też teraz linie
oddzielające części wiadomości.
"""

["2026-09-30-1550-taller-important-marker"]
title = "Wyższy znacznik ważności"
text = """
Znacznik ważności obok gwiazdki jest o 2 px wyższy, więc nie wygląda już
na zgnieciony obok gwiazdki i pola wyboru. Pozostaje wyśrodkowany w
wierszu.
"""

["2026-09-30-1617-folder-click-goes-to-top"]
title = "Z powrotem na górę listy"
text = """
Gdy lista poczty jest przewinięta o ekran w dół, okrągły przycisk w jej
prawym dolnym rogu wraca na górę. To samo robi kliknięcie folderu, w
którym już jesteś, na przykład Odebranych, jak w Gmailu, a także Home.
"""

["2026-09-30-1622-send-from-file-manager"]
title = "Wysyłaj pliki z menedżera plików"
text = """
Kliknij prawym przyciskiem pliki lub foldery w Dolphinie, Plikach GNOME
lub Eksploratorze Windows i wybierz „Wyślij przez Katna Mail”: otworzy
się nowa wiadomość z nimi w załączniku, a folder pójdzie jako zip. Gdy
masz więcej niż jedno konto pocztowe, wybierz w podmenu to, z którego
chcesz wysłać.
"""

["2026-09-30-1624-files-page"]
title = "Wszystkie pliki w jednym miejscu"
text = """
Nowa strona Pliki, na dole paska aplikacji, pokazuje wszystkie załączniki
ze wszystkich kont, od najnowszych. Zawęź ją do obrazów, PDF-ów lub
dokumentów, do jednego konta, osoby albo okresu, albo szukaj po nazwie,
nadawcy lub temacie. Kliknij plik prawym przyciskiem, aby zobaczyć więcej,
a „Pokaż wiadomość” przeniesie cię do wiadomości, z którą przyszedł.
"""

["2026-09-30-1643-dimmer-row-markers"]
title = "Spokojniejsza lista poczty"
text = """
Puste pole wyboru, gwiazdka lub znacznik ważności na liście poczty jest
przygaszony, dopóki kursor nie znajdzie się nad jego wierszem. Ustawione
gwiazdki i znaczniki zachowują swój kolor.
"""

["2026-09-30-1704-folder-arrows-on-hover"]
title = "Schludniejszy panel folderów"
text = """
Małe strzałki obok Odebranych, Oznaczonych gwiazdką i innych folderów
pokazują się tylko, gdy kursor jest nad danym folderem. Folder, który
rozwinąłeś, zachowuje swoją strzałkę.
"""

["2026-09-30-1712-arrow-keys-in-times"]
title = "Klawisze strzałek w polach godziny"
text = """
W „Wybierz datę i godzinę” oraz w godzinie zadania strzałki w górę i w
dół zmieniają część, w której stoi kursor: godzinę, minuty lub AM/PM.
"""

["2026-09-30-1742-check-one-folder"]
title = "Sprawdzaj nową pocztę w jednym folderze"
text = """
„Sprawdź nową pocztę” w menu folderu pod prawym przyciskiem sprawdza teraz
tylko ten folder, więc trwa to krótko. Na Odebranych konta w Wszystkie
konta sprawdza Odebrane tego konta, a na liście takiej jak Odebrane czy
Wysłane w Wszystkie konta sprawdza ten folder na każdym koncie.
"""

["2026-09-30-1742-frosted-viewer"]
title = "Lżejsza, matowa przeglądarka"
text = """
Górny pasek przeglądarki załączników jest smuklejszy i lżejszy, a strona,
powiększenie i obracanie leżą w jednym dymku. Wokół pliku Katna Mail
prześwituje rozmyta pod miękką ciemną zasłoną, a paski narzędzi też są
matowe. Rozmycie zależy od Ustawienia > Eksperymentalne; bez niego
przeglądarka używa zwykłej ciemnej zasłony.
"""

["2026-09-30-1752-touchpad-glide"]
title = "Przewijanie touchpadem z rozpędem"
text = """
Szybkie przesunięcie dwoma palcami po touchpadzie przewija dalej i
stopniowo zwalnia, jak w innych aplikacjach. Dotknij touchpada ponownie,
aby zatrzymać. W Wayland.
"""

["2026-09-30-1800-inbox-tabs-in-top-row"]
title = "Karty Odebranych w górnym wierszu"
text = """
Główne, Oferty, Społeczności i inne karty Odebranych są teraz w pasku w
górnym wierszu listy, każda z kolorową liczbą nieprzeczytanej poczty.
Podświetlenie przesuwa się na wybraną kartę, a kliknięcie otwartej karty
przewija jej listę na górę. Gdy lista jest wąska, pasek zajmuje osobny
wiersz i pokazuje ikony, zostawiając nazwę otwartej karty; na telefonie
jest w pasku listy, a Odśwież trafia do menu Więcej.
"""

["2026-09-30-1805-account-menu"]
title = "Informacje o koncie w menu pod prawym przyciskiem"
text = """
Kliknij prawym przyciskiem nazwę konta na liście folderów albo jego
Odebrane w Wszystkie konta, aby zobaczyć adres, czy konto jest
zsynchronizowane i kiedy było ostatnio sprawdzane, oraz ile miejsca
zajmuje. Stamtąd sprawdzisz te Odebrane, napiszesz nową wiadomość z tego
konta, otworzysz jego ustawienia albo zalogujesz się ponownie, gdy
logowanie wygasło.
"""

["2026-09-30-1819-glass-search-box"]
title = "Szklane pole wyszukiwania"
text = """
Przy włączonym rozmytym tle pole wyszukiwania jest z matowego szkła z
delikatną krawędzią, gdy z niego nie korzystasz, i staje się pełne, gdy
klikniesz w nie, aby pisać.
"""

["2026-09-30-1820-search-cancel-restores"]
title = "Anuluj wyszukiwanie, odzyskaj pocztę"
text = """
Esc lub wyczyszczenie pola wyszukiwania wraca teraz tam, gdzie byłeś: do
tego samego folderu, tego samego miejsca na liście i wiadomości, którą
miałeś otwartą. Otwórz zamiast tego wynik, a wyszukiwanie przejmie widok
jak dotąd.
"""

["2026-09-30-1840-first-run-window"]
title = "Przyjaźniejszy pierwszy start"
text = """
Podczas konfiguracji Katna Mail okno widać za stronami konfiguracji pod
lekką zasłoną: aplikacje, Utwórz i pole wyszukiwania, z miękkimi
zastępnikami tam, gdzie pojawią się foldery i poczta. Nowy krok proponuje
konto Katna i wymienia, co ono włącza (potwierdzenia odczytu, śledzenie
linków, Aktywność i tłumaczenie), albo możesz go pominąć.
"""

["2026-09-30-1850-windows-frame-and-blur"]
title = "Ramka i rozmycie Katna w Windows"
text = """
W Windows Katna Mail otwiera się teraz w obrębie ekranu, zmaksymalizowana,
gdy ekran jest mały. Ustawienia > Eksperymentalne potrafią rozmyć to, co
jest za oknem, a własna ramka Katna zamienia górny pasek w pasek tytułu
przy następnym uruchomieniu Katna Mail.
"""

["2026-09-30-1851-dark-depth"]
title = "Lepiej widoczne w ciemnych kolorach"
text = """
W ciemnych kolorach elementy unoszące się nad listą poczty są teraz o ton
jaśniejsze, z delikatną jasną krawędzią, bo cienie na ciemnym tle prawie
nie są widoczne. Przycisk powrotu na górę, menu, okno tworzenia i okna
dialogowe wyraźnie się wyróżniają. Jasne kolory wyglądają jak dotąd.
"""

["2026-09-30-1911-files-scrollbar"]
title = "Pasek przewijania na stronie Pliki"
text = """
Gdy plików jest więcej, niż się mieści, po prawej pojawia się cienki pasek
przewijania, kiedy przewijasz lub trzymasz kursor nad plikami, a potem
znika. Przeciągnij go, aby szybko przejść przez pliki, albo kliknij nad
nim lub pod nim, aby tam przeskoczyć.
"""

["2026-09-30-1919-tabs-keep-open-mail"]
title = "Zmiana karty nie zamyka otwartej wiadomości"
text = """
Gdy panel odczytu jest obok listy, wybranie innej karty Odebranych nie
zamyka już czytanej wiadomości; zmienia się lista, a wiadomość zostaje
otwarta.
"""

["2026-09-30-1925-inbox-tabs-centred"]
title = "Karty Odebranych na środku"
text = """
Karty Odebranych są teraz na środku górnego wiersza listy i odsuwają się
tylko tak daleko, jak wymagają tego jej przyciski.
"""

["2026-09-30-1945-page-box-arrow-keys"]
title = "Klawisze strzałek w polu strony"
text = """
W pliku PDF kliknij numer strony i naciśnij strzałkę w górę lub w dół,
aby przejść stronę wstecz lub dalej. Przytrzymaj klawisz, aby szybko
kartkować strony.
"""

["2026-09-30-1952-phone-bar-labels"]
title = "Nazwy aplikacji na telefonie zgodnie z ustawieniem"
text = """
Gdy nazwy aplikacji są wyłączone w Ustawieniach, pasek na dole okna
wielkości telefonu pokazuje teraz tylko ikony, wyśrodkowane, tak jak
boczny pasek.
"""

["2026-09-30-1955-account-menu-icons"]
title = "Ustawienia i język w menu konta"
text = """
Menu pod zdjęciem konta otwiera się teraz rzędem ikon: otwórz Ustawienia
lub zmień język. Flaga języka opuściła górny pasek, aby zrobić miejsce.
"""

["2026-09-30-2001-phone-tabs-fold"]
title = "Każda karta Odebranych w zasięgu"
text = """
Gdy okno jest wąskie, karty Odebranych płynnie się składają, zamiast
znikać: etykiety zmieniają się w większe ikony, potem liczniki usuwają się
na bok. Na telefonie karty rozkładają się na cały pasek, łatwe do
stuknięcia, z Więcej na końcu tego samego paska.
"""

["2026-09-30-2012-fit-and-page-arrows"]
title = "Dopasuj, strzałki stron i więcej w przeglądarce"
text = """
Przeglądarka załączników ma przycisk Dopasuj: strona PDF dopasowuje się do
wysokości okna, obraz do okna, a dokumenty, slajdy i arkusze do jego
szerokości. Obrazy mają też Rzeczywisty rozmiar i można je obracać.
Wskaż pole strony, aby zobaczyć małe strzałki do przejścia stronę wstecz
lub dalej, a slajdy mają własne pole.
"""

["2026-09-30-2019-folder-icon-colours"]
title = "Kolorowe ikony folderów"
text = """
Ikony w panelu folderów mają teraz kolory mówiące, co zawiera folder:
Nieprzeczytane niebieskie, Oznaczone gwiazdką żółte, Ważne bursztynowe,
Wysłane zielone, Spam czerwony, Wersje robocze fioletowe, a Odebrane w
kolorze akcentu twojego pulpitu. Liczniki poczty są w małych, bladych
dymkach.
"""

["2026-09-30-2040-tabs-no-slide"]
title = "Szybsze karty Odebranych"
text = """
Kliknięcie karty Odebranych od razu ją podświetla, tylko z falą
kliknięcia, zamiast przesuwać podświetlenie przez pozostałe karty.
"""

["2026-10-01-0145-files-tidy"]
title = "Schludniejsza strona Pliki"
text = """
Liczniki obok każdego rodzaju plików i każdego konta są teraz w takich
samych małych dymkach jak liczniki folderów w Poczcie. Linia pod tytułem
strony i wiersze plików zaczynają się i kończą przy tych samych
krawędziach.
"""

["2026-10-01-0147-today-marker-fits"]
title = "Dzisiejsza data mieści się w znaczniku"
text = """
W widoku Miesiąc w Kalendarzu znacznik dzisiejszego dnia mieści teraz całą
datę. Pierwszego dnia miesiąca staje się dymkiem wokół „01 paź”, zamiast
małego kółka, z którego wylewała się etykieta.
"""

["2026-10-01-0208-tab-counts-stay"]
title = "Liczniki kart zostają na miejscu"
text = """
Otwarcie karty Odebranych nie sprawia już, że pasek kart podskakuje.
Otwarta karta zachowuje licznik nowej poczty, który powoli blednie do
spokojnej szarości, i płynnie się chowa, gdy przeczytasz wszystko na tej
karcie.
"""

["2026-10-01-0225-files-keyboard"]
title = "Poruszaj się po plikach klawiaturą"
text = """
Na stronie Pliki strzałki przechodzą teraz między plikami, Home i End
skaczą do pierwszego i ostatniego, a Enter otwiera plik. W przeglądarce
otwartej stamtąd strzałki przechodzą do następnego pliku na stronie,
niezależnie od wiadomości, z którą przyszedł; Shift ze strzałką trzyma
się załączników tej samej wiadomości.
"""

["2026-10-01-0254-files-dates"]
title = "Wybierz dni na stronie Pliki"
text = """
Przycisk czasu na stronie Pliki otwiera teraz kalendarz dwóch miesięcy z
szybkimi wyborami, takimi jak Zeszły tydzień i Ten miesiąc. Kliknij dzień
albo przeciągnij od jednego dnia do drugiego, a pliki zmieniają się w
trakcie przeciągania. Potem obróć kółko myszy nad przyciskiem, aby
przesunąć ten sam okres wcześniej lub później.
"""

["2026-10-01-0256-color-schemes"]
title = "Schematy kolorów i kolory akcentu"
text = """
Ustawienia > Wygląd mają teraz osobne wybory Tryb, Kolory i Akcent.
Wybierz jasny lub ciemny, potem jeden z 14 schematów kolorów, takich jak
Przejrzysty, Nord, Solarized czy Catppuccin, albo zostaw schemat pulpitu. Każdy
działa w wersji jasnej i ciemnej, a na wierzch może trafić dowolny kolor
akcentu.
"""

["2026-10-01-0310-badge-counts-what-notifies"]
title = "Licznik na pasku zadań zgodny z powiadomieniami"
text = """
Licznik nieprzeczytanych na pasku zadań i w zasobniku liczy teraz tę samą
pocztę, o której dostajesz powiadomienia: kartę Główne w Odebranych.
Oferty, Społeczności, Powiadomienia i Fora już się do niego nie wliczają.
"""

["2026-10-01-0312-quiet-selected-row"]
title = "Spokojniej oznaczony otwarty folder"
text = """
Otwarty folder w Poczcie oraz otwarty widok w Kontaktach, Zadaniach,
Notatkach i Plikach jest teraz oznaczony miękką szarością zamiast koloru
akcentu, więc Utwórz i pasek aplikacji się wyróżniają, a ikony folderów
zachowują własne kolory.
"""

["2026-10-01-0315-desktop-schemes"]
title = "Schematy kolorów twojego pulpitu"
text = """
Ustawienia > Wygląd > Kolory wymieniają też własne schematy pulpitu:
każdy schemat kolorów zainstalowany w KDE Plasma, a w Windows jego kolory
i motywy kontrastu. Systemowy działa teraz w jasnej i ciemnej wersji także
w KDE, używając jasnego lub ciemnego odpowiednika twojego schematu, a Katna
podąża za kolorem akcentu Windows.
"""

["2026-10-01-0329-mute-folders"]
title = "Wycisz folder, kartę lub konto"
text = """
Dzwonek nad listą wycisza otwarty folder lub kartę Odebranych na godzinę,
do jutra rana albo do ponownego włączenia. Kliknij prawym przyciskiem
folder lub konto, aby zrobić to samo. Ustawienia > Powiadomienia pokazują,
które foldery powiadamiają, które liczą się na pasku zadań, i wszystko,
co wyciszone.
"""

["2026-10-01-0335-tray-style"]
title = "Ikona w zasobniku kolorowa lub jednobarwna"
text = """
Ustawienia > Ogólne > Pulpit > Kolorowa ikona w zasobniku wybiera kolory
Katna albo jeden kolor, jak pozostałe ikony panelu. Jednobarwna zostaje
jednobarwna przy nieprzeczytanej poczcie, a licznik nieprzeczytanych jest
zawsze czerwony. W Linuksie ikona w zasobniku jest domyślnie jednobarwna;
w Windows kolorowa.
"""

["2026-10-01-0354-mute-conversations"]
title = "Wycisz wątek lub nadawcę"
text = """
Dzwonek nad otwartym wątkiem go wycisza: nowe odpowiedzi już nie
powiadamiają ani nie zwiększają licznika na pasku zadań, a przekreślony
dzwonek oznacza wątek na liście. Kliknij wątek prawym przyciskiem i
wybierz Wycisz wątek lub Wycisz nadawcę albo naciśnij M.
"""

["2026-10-01-0410-your-color-schemes"]
title = "Stwórz własny schemat kolorów"
text = """
Ustawienia > Wygląd > Kolory > Dostosuj kopiuje używany schemat do
edytora: zmień dowolny z jego ośmiu kolorów w wersji jasnej i ciemnej,
zobacz w nich okno poczty, a Katna powie, co byłoby trudne do odczytania.
Importuj wczytuje plik schematu kolorów Katna lub KDE, a kliknięcie
prawym przyciskiem twojego schematu pozwala go edytować, zduplikować,
wyeksportować lub usunąć.
"""

["2026-10-01-0527-calendar-opens-on-week"]
title = "Kalendarz otwiera się na tygodniu"
text = """
Katna Calendar znowu otwiera się w widoku Tydzień, z nadchodzącymi dniami
w godzinach. Miesiąc, Dzień, Rok i pozostałe są o jedno kliknięcie na
górnym pasku.
"""

["2026-10-01-0552-lighter-count-on-open-row"]
title = "Liczniki widoczne na otwartym folderze"
text = """
Licznik obok otwartego folderu w Poczcie i obok otwartego rodzaju w
Plikach jest teraz w dymku jaśniejszym niż szarość wiersza, więc już w
nim nie tonie, w jasnej i ciemnej wersji.
"""

["2026-10-01-0652-files-leave-out-small-pictures"]
title = "Pliki pomijają logo z podpisów"
text = """
Strona Pliki nie zapełnia się już małymi logo i ikonami z podpisów
e-mail: obrazy poniżej 12 KB albo węższe lub niższe niż 100 pikseli
zostają przy swojej wiadomości. Oba limity zmienisz, albo pokażesz każdy
obraz, w Ustawienia > Domyślne aplikacje > Strona Pliki.
"""

["2026-10-01-0700-mute-from-contact"]
title = "Wycisz nadawcę z jego karty kontaktu"
text = """
Karta kontaktu obok wiadomości ma dzwonek jako pierwszy z przycisków:
wycisza wszystko od tego nadawcy, a przekreślony dzwonek po jego nazwisku
to pokazuje. Kliknij go ponownie, aby znowu go słyszeć.
"""

["2026-10-01-0803-select-hover-fits"]
title = "Schludniejszy przycisk zaznaczania"
text = """
Podświetlenie pod polem zaznaczania na górze listy poczty jest teraz tak
wysokie jak przyciski obok, jest tak samo odsunięte od boku karty jak od
jej góry, a jego rogi podążają za rogiem karty.
"""

["2026-10-01-0807-files-leave-out-signature-pictures"]
title = "Pliki pomijają też duże obrazy z podpisów"
text = """
Obraz, który ktoś wysyła w trzech lub więcej wątkach, jak baner czy
zdjęcie w podpisie, nie pokazuje się już na stronie Pliki, podobnie jak
ikony sieci społecznościowych, bez względu na rozmiar. Nadal widać je
przy ich wiadomości, a wyłączenie „Pomijaj małe obrazy” przywraca je
wszystkie.
"""

["2026-10-01-0830-muted-contact-mark"]
title = "Zobacz, kto jest wyciszony"
text = """
Przekreślony dzwonek stoi teraz za nazwiskiem wyciszonego nadawcy
wszędzie, gdzie się pojawia: na liście poczty, w otwartej wiadomości, w
Kontaktach, w polach Do i DW oraz ich podpowiedziach, na stronie Pliki,
wśród gości wydarzeń i w raporcie Aktywności. Koniec z zastanawianiem się,
czemu jego poczta milczy.
"""

["2026-10-01-0839-sounds"]
title = "Dźwięki nowej poczty, przypomnień i wysyłania"
text = """
Ustawienia > Powiadomienia mają sekcję Dźwięki: nowa poczta, przypomnienia,
poczta wracająca do Odebranych, poczta wysłana i niewysłana wybierają
dźwięk z pulpitu, odtwarzają go przyciskiem obok albo go wyłączają.
Dźwięki grają teraz także w KDE Plasma i milkną przy wyciszonej poczcie
oraz w trybie Nie przeszkadzać.
"""

["2026-10-01-0925-chat-view"]
title = "Czytaj wątki jak czat (eksperymentalne)"
text = """
Włącz Ustawienia > Eksperymentalne > Wątki jako czaty, a poczta między
ludźmi czyta się jak czat grupowy: dymek dla każdej wiadomości tylko z
tym, co napisano, twoje po prawej, obrazy i pliki jako multimedia czatu.
Cytowana poczta i podpisy czekają za ··· w każdym dymku, a kliknięcie
nazwiska pokazuje kartę osoby z jej podpisem. Odpowiadaj z pola na dole,
z Ctrl+Enter, paskiem formatowania za Aa i spinaczem do plików, szablonów
i podpisów. Biuletyny zachowują zwykły widok, a przełącznik Czat | Poczta
zmienia każdy wątek w jedną lub drugą stronę.
"""

["2026-10-01-0946-forward-keeps-files"]
title = "Przekazanie zachowuje pliki"
text = """
Przekazanie wiadomości zabiera teraz jej załączniki, widoczne pod
wiadomością, więc przed wysłaniem możesz usunąć dowolny z nich. Zmiana
przekazania na odpowiedź znowu je pomija.
"""

["2026-10-01-1009-forward-a-file"]
title = "Przekaż sam plik"
text = """
Przeglądarka załączników ma na górnym pasku przycisk Przekaż dalej:
tworzy nową wiadomość tylko z tym plikiem w załączniku, bez wiadomości,
z którą przyszedł. Pliki bez podglądu też oferują Przekaż dalej, podobnie
jak karty załączników pod otwartą wiadomością, obok Zapisz.
"""

["2026-10-01-1039-rephrase-with-ai"]
title = "Przeredaguj z AI"
text = """
Zaznacz tekst w wiadomości i naciśnij iskierkę obok niego albo Ctrl+J,
aby przepisać go jaśniej, krócej, przyjaźniej lub bardziej formalnie, a
potem Zastąp. Katna AI jest bezpłatna przez 30 dni, albo użyj własnego
klucza Google Gemini, OpenAI, Claude, Mistral, DeepSeek, OpenRouter lub
modelu na tym komputerze. AI może też dokańczać twoje zdania na szaro;
włącz to w Ustawienia > Tworzenie.
"""

["2026-10-01-1043-header-details-selectable"]
title = "Kopiuj ze szczegółów wiadomości"
text = """
Szczegóły pod „do mnie” można teraz zaznaczać i kopiować tak jak samą
wiadomość. Kliknij adres, aby zobaczyć kartę tej osoby obok wiadomości,
albo kliknij go prawym przyciskiem, aby wybrać Kopiuj adres. Wyciszone
osoby pokazują tam też swój przekreślony dzwonek.
"""

["2026-10-01-1112-left-bar-button"]
title = "Jeden duży przycisk i jedno zwijanie na każdej stronie"
text = """
Duży przycisk na górze lewego paska wygląda i stoi teraz tak samo na każdej
stronie i robi to, co należy do danej strony: Utwórz w Poczcie i Plikach,
Nowe wydarzenie, Nowy kontakt, Nowe zadanie i Nowa notatka. Zwinięcie
lewego paska zwija go wszędzie, a gdy jest zwinięty, przycisk każdej strony
czeka na górze paska aplikacji. Na telefonie jest to pływający przycisk.
"""

["2026-10-01-1115-color-picker"]
title = "Próbnik kolorów w edytorze schematów"
text = """
Kliknij kolor w edytorze schematów, a tuż obok otworzy się próbnik:
przeciągaj po kwadracie i pasku odcieni, wpisz wartość hex, użyj
ponownie kolorów schematu lub ostatnich wyborów albo pobierz kolor z
dowolnego miejsca ekranu pipetą w KDE i GNOME.
"""

["2026-10-01-1130-contact-card-folds-folders"]
title = "Karta kontaktu sama robi sobie miejsce"
text = """
W oknie zbyt wąskim na panel folderów i kartę kontaktu obok siebie karta
przy otwieraniu zwija teraz foldery, a te wracają, gdy karta się zamknie.
Foldery zwinięte przez ciebie pozostają zwinięte.
"""

["2026-10-01-1132-open-mail-scroll-bar"]
title = "Pasek przewijania w długich wiadomościach"
text = """
Długi wątek pokazuje teraz taki sam dyskretny pasek przewijania jak strona
Pliki, gdy go przewijasz lub na niego wskazujesz. Oba paski są teraz
cieńsze i rosną, gdy kursor się zbliża. Przeciągnij jeden albo kliknij
wzdłuż niego, aby przeskoczyć w dowolne miejsce.
"""

["2026-10-01-1240-contact-card-close"]
title = "Schowaj kartę kontaktu, zobacz, kto jest w czacie"
text = """
Karta kontaktu obok wątku ma ✕ w rogu, a ponowne kliknięcie zdjęcia lub
adresu tej samej osoby chowa kartę. W widoku czatu kliknięcie nagłówka
wypisuje wszystkich uczestników czatu z ich adresami i liczbą wiadomości,
które każdy wysłał.
"""

["2026-10-01-1241-two-blur-switches"]
title = "Rozmycie po twojemu"
text = """
Rozmycie ma teraz dwa przełączniki w Ustawienia > Eksperymentalne: jeden
dla tła okna i jeden dla menu i okien dialogowych. Matowe menu są domyślnie
włączone, nawet gdy tło okna pozostaje pełne.
"""

["2026-10-01-1502-fainter-row-lines"]
title = "Delikatniejsze linie między wiadomościami"
text = """
Linie między wiadomościami na liście są teraz bledsze, więc lista czyta
się jak jedna spokojna kolumna, w jasnej i ciemnej wersji.
"""

["2026-10-01-1505-contact-close-round"]
title = "Jeden przycisk zamykania dla każdego panelu"
text = """
✕ na karcie kontaktu to teraz ten sam okrągły przycisk co ✕ w otwartej
wiadomości, z tym samym szarym kółkiem, gdy na niego wskażesz.
"""

["2026-10-01-1525-thread-count"]
title = "Schludniejszy licznik wiadomości"
text = """
Liczba wiadomości w wątku stoi teraz obok nazwisk z małą ikoną czatu,
wyśrodkowana na linii nazwisk, zamiast uniesiona nad nią.
"""

["2026-10-01-1541-chat-attach-from-files"]
title = "Załączaj z Plików w czacie"
text = """
W czacie (Ustawienia > Eksperymentalne) spinacz ma Z Plików: wybierz
dowolny plik, który przyszedł lub wyszedł z twoją pocztą, z plikami tego
wątku na początku. Zaznacz kilka, obejrzyj jeden przyciskiem oka i sprawdź,
ile ważą wobec 25 MB, które zmieści wiadomość. Spinacz jest teraz w polu
odpowiedzi, a Aa otwiera smukły pasek tylko ze stylami, których potrzebuje
czat.
"""

["2026-10-01-1553-rephrase-card-text"]
title = "Przeredaguj działa z nowymi kluczami Gemini"
text = """
Przy włączonych matowych menu karta Przeredaguj (Ctrl+J) otwierała się
pusta; teraz jej propozycje pokazują się na matowym szkle. Google Gemini
używa teraz gemini-3.5-flash-lite, chyba że wpiszesz inny model, bo nowe
klucze Gemini nie mogą już używać 2.5 Flash-Lite, a błędny klucz mówi o
tym wprost.
"""

["2026-10-01-1624-rephrase-button"]
title = "Przeredaguj bez zaznaczania i szybsze propozycje"
text = """
Iskierka obok Formatowania na dole nowej wiadomości i w polu odpowiedzi
widoku czatu przeredagowuje wszystko, co napisałeś, gdy nic nie jest
zaznaczone, albo tylko zaznaczenie, gdy jest; Ctrl+J robi to samo.
Dłuższe propozycje z AI pojawiają się dużo szybciej, a pole Model w
Ustawienia > Tworzenie podpowiada modele twojej usługi w trakcie pisania.
"""

["2026-10-01-1626-dimmer-preview"]
title = "Spokojniejszy wiersz podglądu"
text = """
Tekst podglądu pod tematem każdej wiadomości na liście jest teraz bledszy,
więc nadawca i temat się wyróżniają, w jasnej i ciemnej wersji.
"""

["2026-10-01-1645-frosted-dialogs"]
title = "Matowe okna dialogowe"
text = """
Przy włączonych matowych menu i okienkach okna dialogowe też są z
matowego szkła: Dodaj konto pocztowe, O Katna, Co nowego, aktualizacje,
udostępnianie, podgląd wydruku, etykiety, pytania o usunięcie, karta
pierwszego uruchomienia i okno linku w tworzeniu wiadomości.
"""

["2026-10-01-1650-chat-pins"]
title = "Przypnij do 5 rzeczy w czacie"
text = """
W czacie (Ustawienia > Eksperymentalne) najedź na dymek i naciśnij
pinezkę albo kliknij plik prawym przyciskiem, aby trzymać go na górze.
Cienki pasek pod nagłówkiem pokazuje przypięte elementy: kliknij go, aby
przechodzić kolejno do każdego, albo otwórz listę, aby przeciągnąć je w
innej kolejności lub odpiąć. Przypięcia zostają na tym komputerze.
"""

["2026-10-01-1655-chat-signatures"]
title = "Czaty pomijają podpisy i stopki"
text = """
Dymki czatu pokazują teraz tylko to, co ludzie napisali. Pożegnania w
rodzaju „Pozdrawiam”, firmowe podpisy pod linią albo z adresami i
numerami telefonów oraz stopki z linkami do rezygnacji z subskrypcji lub
zastrzeżeniami czekają za dymkiem ···, razem z podpisem, który ktoś
powtarza w każdej wiadomości.
"""

["2026-10-01-1805-blur-amount"]
title = "Wybierz wygląd matowych menu"
text = """
Matowe menu i okna dialogowe są teraz wyraźniejsze i podążają za siłą
rozmycia KDE. Włącz Własną siłę rozmycia w Ustawienia > Eksperymentalne >
Rozmycie, aby samemu ustawić siłę rozmycia i krycie.
"""

["2026-10-01-1825-chat-company"]
title = "Gdzie pracują, na ich karcie"
text = """
W czacie (Ustawienia > Eksperymentalne) karta osoby ma teraz sekcję Firma:
czym firma się zajmuje, gdzie jest, od kiedy, oraz linki do jej strony i
profili, odczytane z jej strony głównej i Wikipedii. Zależy od
przełącznika Zdjęcia nadawców.
"""

["2026-10-02-0052-smooth-start-after-updates"]
title = "Płynny start po aktualizacjach"
text = """
Po aktualizacji Katna Mail nie mówi już, że nie udało się otworzyć
magazynu poczty, gdy przygotowuje twoją pocztę dla nowej wersji. Przez
tych kilka sekund pokazuje zwykły obrazek ładowania, a potem twoją pocztę.
"""

["2026-10-02-0106-calmer-dialogs"]
title = "Spokojniejsze okna dialogowe"
text = """
Matowe okna dialogowe są mniej przezroczyste niż menu, więc ruchliwa
lista poczty już przez nie nie prześwituje. O Katna, Co nowego i
Sprawdź aktualizacje otwierają się bez przyciemniania okna za nimi.
"""

["2026-10-02-0111-chat-pin-text"]
title = "Przypnij kilka słów z czatu"
text = """
W czacie (Ustawienia > Eksperymentalne) tekst w dymku można teraz
