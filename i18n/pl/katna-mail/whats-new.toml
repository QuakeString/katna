oznaczaniem jako przeczytane lub nieprzeczytane, i zatrzymuje wysłaną
wiadomość, dopóki trwa jeszcze czas na cofnięcie wysłania.
"""

["2026-09-27-1203-copy-from-attachments"]
title = "Kopiowanie z załączników"
text = """
Tekst w plikach PDF, dokumentach, slajdach i plikach tekstowych
