["2026-10-04-0336-files-card-corners"]
title = "Tarjetas de archivo más tranquilas"
text = """
Las tarjetas de archivo en Archivos y bajo un correo descansan ahora
sobre una sombra suave y se elevan un poco al señalarlas. La vista
