["2026-09-29-0756-event-reminders"]
title = "Recordatorios para tus eventos"
text = """
Ahora los eventos te avisan con una notificación, incluso con Katna cerrado. «Unirse» abre la videollamada y «Posponer 5 min» te lo recuerda de nuevo en cinco minutos.
