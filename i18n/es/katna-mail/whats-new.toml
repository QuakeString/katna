y la etiqueta Correo de una nota te lleva de vuelta al correo.
"""

["2026-09-29-0542-caldav-tasks"]
title = "Tareas en su propio servidor de correo"
text = """
Las cuentas que inician sesión con contraseña ahora guardan sus tareas
en su servidor de correo cuando este ofrece CalDAV, de modo que las
tareas también aparecen en las aplicaciones del propio servidor y en
el teléfono.
"""

["2026-09-29-0521-calendar-edit"]
title = "Añadir y cambiar eventos"
text = """
Haz clic o arrastra en el calendario, o pulsa C, para añadir un evento.
Arrastra un evento para moverlo o su borde inferior para cambiar su
duración, y ábrelo para cambiar la hora, la repetición, los
recordatorios y los invitados, o para añadir una llamada de Meet o
Teams. Responde a las invitaciones con Sí, No o Quizás. Deshacer lo
devuelve todo a su sitio.
"""

["2026-09-29-0546-calendar-any-account"]
title = "Calendarios de más cuentas"
text = """
Katna ahora encuentra los calendarios de Yahoo, Zoho, iCloud, Fastmail,
GMX y otras cuentas, incluso cuando están en otro servidor distinto al
del correo. Prueba primero el mejor método de cada cuenta y otro cuando
ese no está disponible.
"""

["2026-09-29-0625-tasks-today"]
title = "Hoy en Tareas"
text = """
Hoy, dentro de Todas las tareas, reúne lo que vence hoy y todo lo
vencido de todas las listas, con la lista en la que está cada una. Una
tarea añadida ahí vence hoy.
"""

["2026-09-29-0631-invitation-card"]
title = "Invitaciones en tu correo"
text = """
Una invitación ahora se muestra como una tarjeta en la parte superior
del correo: cuándo y dónde, quién la organizó, tu día alrededor con los
solapamientos marcados, Unirse y ¿Asistirás? Sí, No o Quizás, con
respuesta allí mismo.
"""

["2026-09-29-0616-note-labels"]
title = "Etiquetas en las notas"
text = """
El botón de etiqueta de una nota le pone etiquetas, como en Keep. Tus
