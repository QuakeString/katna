["2026-10-04-1525-unified-stacked-picture"]
title = "Todas las cuentas muestra todas las fotos"
text = """
Con Todas las cuentas abierto, la foto de arriba a la derecha es ahora
una pequeña pila con las fotos de tus cuentas, con +N para el resto, así
que la distingues de una sola cuenta de un vistazo. Señálala y las fotos
se separan con suavidad.
"""

["2026-10-04-2338-all-accounts-row"]
title = "Vuelve a Todas las cuentas desde el menú de la cuenta"
text = """
El menú de la cuenta empieza ahora con Todas las cuentas, con su número
de no leídos, así que un clic te lleva de vuelta después de elegir una
