ti.
"""

["2026-10-04-1510-dialogs-fit-phone"]
title = "Los diálogos caben en una ventana del tamaño de un teléfono"
text = """
Novedades, Acerca de, Actualizaciones, Combinaciones de teclas y los
demás diálogos caben ahora dentro de una ventana estrecha con el marco
