El botón Opciones del Calendario define la altura de las horas (Adaptable a tu pantalla, Cómoda o Compacta) y añade una segunda zona horaria junto a la tuya, para las personas con las que te reúnes en el extranjero.
"""

["2026-09-29-0809-video-calls"]
title = "Inicia una videollamada desde un correo"
text = """
Haz clic derecho en una conversación, o abre ⋮, y elige Iniciar una videollamada: la llamada se abre y se envía un correo nuevo con su enlace a todos los de la conversación. Las cuentas de Gmail usan Google Meet; las demás obtienen una sala de Jitsi Meet. Los correos con un enlace de llamada de Meet, Teams, Zoom, Webex, Jitsi, WhatsApp o Telegram ahora muestran un botón Unirse.
"""

["2026-09-29-0815-note-line-task"]
title = "Convierte una línea de lista en una tarea"
text = """
Coloca el cursor en una línea de lista de una nota y elige Convertir en tarea: la línea pasa a tus tareas. Su etiqueta Nota en la página Tareas vuelve a abrir la nota.
