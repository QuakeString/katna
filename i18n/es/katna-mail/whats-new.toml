["2026-09-29-0835-contacts-birthdays-qr-print"]
title = "Cumpleaños en el calendario, contactos como códigos QR"
text = """
Los cumpleaños de tus contactos ahora aparecen en el Calendario, en un calendario «Cumpleaños» que puedes desmarcar. La página de un contacto puede mostrarlo como un código QR que la cámara de un teléfono guarda, e imprimirlo; «Imprimir» en «Corregir y administrar» imprime a todas las personas que se ven. Además, la importación ahora lee también archivos CSV de Google Contactos y Outlook, y KRunner y la búsqueda de GNOME encuentran tus contactos guardados.
