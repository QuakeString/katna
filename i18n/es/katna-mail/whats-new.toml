correos se desplazan por debajo, y las filas de la lista de correos se
deslizan de la misma forma bajo su barra superior, esmeriladas cuando el
desenfoque está activado. Ajustes > Experimental tiene un interruptor
Cabeceras esmeriladas para mantenerlas opacas.
"""

["2026-10-04-0204-tasks-motion"]
title = "Tareas que se mueven"
text = """
Al marcar una tarea, su círculo se rellena, el título se tacha y la fila
se pliega. Las tareas nuevas y las eliminadas entran y salen
deslizándose, las que reordenas se desplazan suavemente a su sitio, y
las tarjetas de las listas se elevan un poco al señalarlas.
"""

["2026-10-04-0225-shortcuts-dialog"]
title = "Las combinaciones de teclas de un vistazo"
text = """
Ayuda > Combinaciones de teclas, o la tecla ?, muestra ahora todas las
combinaciones en una pequeña ventana sobre tu correo, con un cuadro para
buscar una. Las teclas se siguen cambiando en Ajustes > Combinaciones de
teclas.
"""

["2026-10-04-0305-unified-leave-out"]
title = "Deja unos Recibidos fuera de Todas las cuentas"
text = """
Haz clic derecho en los Recibidos de una cuenta bajo Todas las cuentas y
elige Excluir de Recibidos unificados: su correo deja de llenar los
Recibidos unificados, pero la fila se queda y abre esos Recibidos. Haz
clic en su ojo para volver a incluirlos. En Ajustes > Recibidos también
puedes sacar una cuenta entera de Todas las cuentas.
"""

["2026-10-04-0310-leave-account-out"]
title = "Deja una cuenta fuera de una aplicación"
text = """
Ajustes tiene ahora una página para Contactos, Tareas y Notas, y cada
una de ellas y Archivos enumera tus cuentas con un interruptor.
Desactiva una para dejar esa cuenta fuera de la aplicación; sus
recordatorios no te avisarán. Sus elementos se siguen sincronizando, así
que vuelven en cuanto la activas de nuevo.
"""

["2026-10-04-0320-calendar-leave-account-out"]
title = "Deja una cuenta fuera de Calendario"
text = """
Ajustes > Calendario también enumera tus cuentas con un interruptor.
Desactiva una y sus calendarios, eventos y tareas salen de Calendario, y
sus eventos dejan de avisarte. Se sigue sincronizando, así que vuelve en
cuanto la activas.
"""

["2026-10-04-0327-contact-card-points-right"]
title = "Las tarjetas de contacto se abren donde hiciste clic"
text = """
En una ventana estrecha, la tarjeta de contacto que se abre desde el
