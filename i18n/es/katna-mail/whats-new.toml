en claro, en oscuro o como texto sin formato. Las imágenes viajan dentro
del correo, así que se ven en todas partes.
"""

["2026-10-03-1850-copy-about-whats-new"]
title = "Copia desde Acerca de y Novedades"
text = """
El texto de Acerca de Katna y de Novedades ahora se puede seleccionar y
copiar como en un navegador: arrastra sobre él, haz doble clic en una
palabra o triple clic en un párrafo, y luego pulsa Ctrl+C o haz clic
derecho > Copiar. Viene bien para pegar la versión en un informe de
fallo.
"""

["2026-10-03-1904-copy-version"]
title = "Copia la versión con un clic"
text = """
Deja el puntero sobre la versión en Acerca de, Novedades o Ajustes y
aparece a su lado un pequeño botón de copiar. Copia la versión, cuándo
se compiló y tu sistema, listo para pegar en un informe de fallo.
"""

["2026-10-03-1924-settings-in-window"]
title = "Ajustes vuelve junto a tu correo"
text = """
Ajustes vuelve a abrirse dentro de la ventana principal, en lugar de la
página en la que estabas, con su lista de páginas agrupada en Todas las
aplicaciones y en cada aplicación.
"""

["2026-10-03-1934-copy-any-text"]
title = "Copia texto en cualquier sitio"
text = """
El texto que te dice algo ahora se puede seleccionar y copiar en todo
Katna: nombres y descripciones de ajustes, datos de contactos y eventos,
el estado de las cuentas, mensajes de error, notas de páginas vacías y
diálogos. Arrastra sobre él o haz doble clic en una palabra, y luego
pulsa Ctrl+C o haz clic derecho > Copiar. Los botones y las filas en los
que haces clic siguen como estaban.
"""

["2026-10-03-2011-calendar-tasks-switch-month-drag"]
title = "Tareas en el Calendario: muéstralas u ocúltalas, y arrástralas en Mes"
text = """
La lista lateral del Calendario tiene una casilla Tareas bajo tus
calendarios: desmárcala y las tareas salen de Día, Semana, Mes y Agenda
hasta que vuelvas a marcarla. En la vista Mes ahora puedes arrastrar una
tarea a otro día; conserva su hora, y Deshacer la devuelve a su sitio.
"""

["2026-10-03-2023-tasks-upcoming-completed-sort-select"]
title = "Próximas, Completadas, ordenar y seleccionar en Tareas"
text = """
Tareas tiene dos vistas nuevas. Próximas muestra las dos semanas
siguientes día a día, con las tareas vencidas arriba; arrastra una tarea
a otro día para moverla. Completadas muestra, por día, todo lo que
marcaste, y al desmarcar una tarea vuelve a su lista. El menú ⋮ de cada
lista la ordena por fecha, por estrella o por título. Haz Ctrl+clic o
Mayús+clic en varias tareas para completarlas, moverlas, ponerles fecha,
destacarlas o eliminarlas todas a la vez.
"""

["2026-10-03-2040-task-labels-and-files"]
title = "Etiquetas y archivos en las tareas"
text = """
Las tareas usan las mismas etiquetas que tus notas: añádelas en los
detalles de una tarea o escribe #casa en una tarea nueva, y elige una
etiqueta a la izquierda para ver todas las tareas que la llevan. Suelta
un archivo sobre una tarea para adjuntarlo, y Añadir a Tareas conserva
los adjuntos del correo. La estrella, las etiquetas y los archivos
llegan a Microsoft To Do y a tu servidor CalDAV, y la estrella a Zoho.
"""

["2026-10-03-2102-notes-pictures-reminders-history"]
title = "Notas: imágenes, recordatorios e historial"
text = """
Las notas admiten imágenes, te avisan a la hora que elijas y guardan 30
días de historial que puedes restaurar. Haz Ctrl+clic en varias notas
para fijarlas, darles color, etiquetarlas o archivarlas a la vez,
escribe [[ para enlazar una nota con otra, y añade citas, código y
separadores. Envía una nota por correo o guárdala como Markdown o PDF y,
con la IA activada, el destello la ordena, la convierte en lista o la
resume.
"""

["2026-10-03-2102-quick-capture"]
title = "Apunta una idea desde cualquier sitio"
text = """
Meta+Alt+T abre una pequeña tarjeta sobre lo que estés haciendo para
añadir una tarea, y Meta+Alt+N para tomar una nota. Escribe «Llamar al
fontanero vie 18:00 #casa» y unas fichas muestran el día, la etiqueta,
la lista y el recordatorio que ha entendido; haz clic en una para
cambiarla. Tab cambia entre Tarea y Nota, e Intro guarda. También está
en el menú de la bandeja del sistema, y en KRunner como task: y note:.
"""

["2026-10-04-0102-soft-hovers"]
title = "Resaltados más suaves"
text = """
Al dejar el puntero sobre la barra de aplicaciones, el cuadro de
selección, una pestaña y muchos otros botones, su resaltado ahora
aparece y desaparece con un fundido en lugar de encenderse de golpe.
"""

["2026-10-04-0119-cards-lift"]
title = "Tarjetas que se elevan"
text = """
Los archivos, los adjuntos, las carpetas de Drive, las invitaciones, los
resúmenes, el cuadro de respuesta y los servicios de correo de Añadir
cuenta son ahora tarjetas con el mismo borde suave y la misma sombra que
el resto de Katna, en lugar de un contorno plano.
"""

["2026-10-04-0119-notes-select-bar-matches"]
title = "Notas: tarjetas más suaves que se mueven"
text = """
Notas usa ahora las mismas tarjetas, fichas y barras que el resto de
Katna. Las tarjetas descansan sobre una sombra suave y se elevan un poco
bajo el puntero, las notas nuevas aparecen con un fundido, las
eliminadas se desvanecen, y una nota se abre y se cierra con un breve
zoom. La barra con la que seleccionas notas tiene la misma forma
redondeada que «Crear una nota», así que solo cambia su contenido. Todo
ello sigue Reducir el movimiento y Velocidad de las animaciones.
"""

["2026-10-04-0128-header-labels"]
title = "Todas las etiquetas en un correo abierto"
text = """
Un correo abierto muestra ahora todas sus fichas bajo el asunto, como
Gmail: Recibidos, Importantes, su pestaña de Recibidos, Destacados y
cada carpeta o etiqueta en la que está. Señala una para quitarla con su
×, con Deshacer.
"""

["2026-10-04-0150-settings-own-list"]
title = "Ajustes tiene la ventana para sí"
text = """
Mientras Ajustes está abierto, las carpetas se pliegan, así que solo ves
la propia lista de páginas de Ajustes junto a la página que elegiste.
Vuelven cuando sales.
"""

["2026-10-04-0154-summary-pill"]
title = "Un botón de resumen más discreto y una cabecera que no se mueve"
text = """
En la vista de chat, el destello del resumen está ahora en una pequeña
píldora gris propia junto al interruptor Chat | Correo, y se ilumina en
