calendarios.
"""

["2026-09-29-1039-contact-panel-tasks"]
title = "Tareas con esa persona, junto a su correo"
text = """
Los detalles del contacto junto a una conversación ahora muestran tus
tareas abiertas creadas a partir del correo con esa persona. Marca una
