"""

["2026-09-30-0650-notification-opens-own-window"]
title = "Las notificaciones abren el correo delante"
text = """
Hacer clic en una notificación de correo nuevo abre ese correo en una
ventana propia, delante, muestre lo que muestre Katna en ese momento.
Responder a todos lo abre con la respuesta lista para escribir. Archivar
guarda el correo sin abrir nada y lo dice en un aviso breve con Deshacer.
"""

["2026-09-30-0700-event-card-join-any-call"]
title = "Únete a llamadas de Teams y Zoom desde el Calendario"
text = """
La tarjeta de un evento ahora encuentra la llamada en su descripción o
lugar, así que una invitación de Microsoft Teams, Zoom, Webex, Jitsi o
