Deshacer.
"""

["2026-09-29-0630-tasks-more-accounts"]
title = "Tareas de más cuentas"
text = """
Las tareas ahora también se sincronizan con Yahoo, Zoho, iCloud,
Fastmail y otras cuentas cuyas tareas están en un servidor distinto al
de su correo. Katna prueba primero el mejor método de cada cuenta y
recuerda el que funciona.
"""

["2026-09-29-0651-schedule-meeting"]
title = "Programa una reunión desde un correo"
text = """
Haz clic derecho en una conversación, o abre ⋮, y elige Programar una
reunión: se abre un evento nuevo en la página Calendario con el asunto
como título y todas las personas de la conversación como invitados.
"""

["2026-09-29-0705-running-late"]
title = "¿Llegas tarde? Avisa a todos con un clic"
text = """
Un evento con invitados ahora tiene Enviar correo a los invitados y,
