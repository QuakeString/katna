"""

["2026-09-29-0607-contact-labels"]
title = "Etiquetas de contactos"
text = """
Etiqueta en la página de un contacto activa o desactiva etiquetas o crea
una nueva, y el ⋮ junto a una etiqueta la renombra, la elimina o escribe
