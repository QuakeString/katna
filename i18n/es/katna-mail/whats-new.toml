"""

["2026-09-29-1046-contact-panel-meetings"]
title = "Tus próximas reuniones con esa persona"
text = """
Los detalles del contacto junto a una conversación ahora muestran tus
próximas reuniones con esa persona. Haz clic en una para abrirla en el
Calendario.
"""

["2026-09-29-1051-tasks-drag-to-list"]
title = "Arrastra una tarea a otra lista"
text = """
En Tareas, arrastra una tarea a otra lista para moverla allí. Deshacer
la devuelve a su sitio.
"""

["2026-09-29-1111-tasks-search"]
title = "Busca en tus tareas"
text = """
En la página Tareas, el cuadro de búsqueda de arriba ahora busca en tus
tareas, sus notas y subtareas, en lugar de en tu correo.
"""

["2026-09-29-1130-calendar-search"]
title = "Busca en tus eventos"
text = """
En la página Calendario, el cuadro de búsqueda de arriba ahora encuentra
eventos por título, lugar, notas o invitados, ordenados por fecha. Haz
clic en uno para abrirlo en su día; Esc te devuelve a los resultados.
