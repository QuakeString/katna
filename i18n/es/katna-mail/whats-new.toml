["2026-09-29-0751-go-to-pdf-page"]
title = "Ir directamente a una página de un PDF"
text = """
El número de página bajo un PDF ahora es un cuadro: haz clic en él o
pulsa Ctrl+G, escribe una página y pulsa Intro para ir a ella.
"""

["2026-09-29-0715-tasks-on-calendar"]
title = "Tareas en el calendario"
text = """
Las tareas con fecha de vencimiento ahora aparecen en el Calendario, a su hora o junto con los eventos de todo el día. Márcalas como hechas allí, haz clic para abrir una o arrástrala a otro día u hora para reservar ese tiempo para ella.
