["2026-09-29-0947-tasks-typed-quick-add"]
title = "Escribe una tarea en una línea"
text = """
Añade una tarea como «Llamar al banco mañana 15:00» o «Regar las plantas
cada lunes 8:00», y Tareas fija el día, la hora y la repetición por ti,
mostrando lo que ha entendido mientras escribes.
"""

["2026-09-29-1028-calendar-narrow-windows"]
title = "El Calendario en una ventana estrecha"
