["2026-09-29-1317-contacts-every-account"]
title = "Todas las cuentas en Contactos"
text = """
Contactos ahora muestra todas tus cuentas en Cuentas, con cuántas
personas tiene cada una; haz clic en una para ver solo sus personas.
Cuando los contactos de una cuenta no pueden cargarse, una línea debajo
