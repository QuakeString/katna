"""

["2026-10-04-1223-outbox"]
title = "Una Bandeja de salida para el correo que no ha salido"
text = """
El correo que no se pudo enviar espera ahora en una Bandeja de salida
bajo Enviados, que solo aparece mientras haya algo en ella. Cada mensaje
dice el motivo con palabras sencillas, con Reintentar, Editar y
Eliminar. El correo que envías mientras la contraseña de una cuenta ha
cambiado o su sesión ha caducado espera ahí y sale en cuanto lo
arreglas, en lugar de fallar.
"""

["2026-10-04-1246-refused-changes"]
title = "Los cambios que el servidor rechazó ya no se deshacen en silencio"
text = """
Cuando un servidor de correo sigue rechazando un cambio, como mover un
mensaje a una carpeta eliminada en otro sitio, Katna lo deja como estaba
y ahora lo dice con palabras sencillas, con Detalles para ver la
respuesta del propio servidor.
"""

["2026-10-04-1250-phone-scroll-steady"]
title = "Lista estable en una ventana del tamaño de un teléfono"
text = """
Al desplazar rápido la lista de correos en una ventana del tamaño de un
teléfono, ya no se queda temblando arriba y abajo mientras las pestañas
se apartan.
"""

["2026-10-04-1309-needs-you-notifications"]
title = "Un solo aviso cuando una cuenta o un mensaje te necesita"
text = """
Cuando un servidor de correo rechaza tu contraseña, una sesión caduca o
un mensaje no se puede enviar, una notificación del escritorio lo dice
