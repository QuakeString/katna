ámbar también marca la cuenta en el panel de carpetas y sobre tu foto.
Cuando pierdes la conexión, una discreta línea dice que no tienes
conexión y que el correo que envíes esperará hasta que vuelvas.
"""

["2026-10-04-1110-contact-card-placeholder"]
title = "Las tarjetas de contacto se abren de una pieza"
text = """
Cuando los datos de una persona tardan un momento en cargarse, la
tarjeta de contacto que aparece sobre un nombre o una foto ahora se abre
