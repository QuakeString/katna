["2026-09-29-1236-agenda-button-top-bar"]
title = "La agenda del día, desde la barra superior"
text = """
El botón que muestra la agenda del día junto a tu correo ahora está en
la barra superior, al lado del botón de idioma, y el correo gana el
espacio que ocupaba la franja lateral.
"""

["2026-09-29-1243-hide-side-panel-on-every-page"]
title = "Oculta el panel lateral en todas las páginas"
text = """
El botón de menú de arriba a la izquierda ahora también pliega el panel
