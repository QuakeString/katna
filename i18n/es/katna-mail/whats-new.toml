Con la barra de título propia de Katna en Wayland, el contenido de la
ventana se queda quieto mientras arrastras un borde para cambiar su
tamaño, en lugar de temblar.
"""

["2026-10-04-0531-turn-apps-off"]
title = "Desactiva las aplicaciones que no usas"
text = """
Ajustes › Aplicaciones tiene un interruptor para Calendario, Contactos,
Tareas, Notas y Archivos, y al hacer clic derecho en una de la barra de
