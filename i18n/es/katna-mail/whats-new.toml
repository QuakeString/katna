["2026-09-29-1300-switch-account-stay-on-page"]
title = "Cambia de cuenta sin salir de la página"
text = """
Elegir otra cuenta desde tu foto arriba a la derecha, o girar la rueda
sobre ella, ahora te mantiene en Calendario, Tareas, Contactos o Notas.
Los elementos nuevos van a esa cuenta, y Correo la muestra cuando
vuelves.
