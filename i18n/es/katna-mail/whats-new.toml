su día.
"""

["2026-09-29-0855-type-an-event"]
title = "Escribe un evento en una línea"
text = """
Escribe «Comida con Anita viernes 1pm en Cafe Mocha» o «Reunión de
equipo cada día laborable 9:30» como título de un evento nuevo, y el
Calendario rellena el día, la hora, la repetición y el lugar mientras
escribes.
"""

["2026-09-29-0915-year-view"]
title = "Mira el año entero"
text = """
El Calendario tiene una vista de Año: los doce meses a la vez, con un
punto bajo los días que tienen eventos. Pulsa Y y haz clic en un día
para abrirlo.
"""

["2026-09-29-0930-share-free-times"]
title = "Comparte tus horas libres"
text = """
Compartir horas libres, en las opciones del Calendario, inicia un
mensaje que enumera cuándo estás libre en los próximos días laborables,
listo para enviarlo a quien quieras.
"""

["2026-09-29-0952-calendar-sets"]
title = "Grupos de calendarios"
text = """
Guarda los calendarios que estás mostrando como un grupo, como «Trabajo»
o «Familia», con + junto a Grupos de calendarios. Un clic en un grupo
muestra sus calendarios y oculta el resto.
