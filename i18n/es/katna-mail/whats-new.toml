["2026-10-05-1620-reply-tools-fold"]
title = "Las herramientas de respuesta caben en una ventana estrecha"
text = """
Cuando el panel de lectura o la ventana son estrechos, la barra de
formato y la fila junto a Enviar ya no se salen de la respuesta. Las
herramientas que no caben pasan a ⋮ Más, empezando por las menos usadas,
y en un teléfono Enviar muestra solo su icono.
"""

["2026-10-05-1637-read-receipts-out-of-the-list"]
title = "Las confirmaciones de lectura no aparecen en la lista de correos"
text = """
Una confirmación de lectura de un correo que enviaste ya no aparece en
la lista de correos como una línea «Leído: …». La conversación conserva
su propio asunto y su vista previa, y tu correo enviado muestra las
marcas.
"""

["2026-10-05-1640-windows-frost"]
title = "Cristal esmerilado en Windows"
text = """
Los menús, las ventanas emergentes, los diálogos, las barras del visor y
los paneles esmerilados desenfocan ahora lo que tienen debajo también en
Windows, con los mismos ajustes de Intensidad del desenfoque y Opacidad
que en Linux. Actívalo o desactívalo en Ajustes, Experimental, Menús y
diálogos esmerilados.
"""

["2026-10-06-0156-phone-activity"]
title = "Actividad en un teléfono"
text = """
En una ventana del tamaño de un teléfono, Actividad está ahora en la
barra de búsqueda junto a la foto de tu cuenta, con su número de
aperturas y clics nuevos. Su lista cabe dentro de la ventana.
"""

["2026-10-06-0215-pin-bar-no-jump"]
title = "Fijar no mueve el chat"
text = """
En la vista de chat, fijar o dejar de fijar un correo ya no hace saltar
la conversación, ni siquiera al final del todo: la barra de fijados
