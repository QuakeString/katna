["2026-09-29-1530-mark-up-pdfs"]
title = "Marca los PDF"
text = """
Pulsa el lápiz en el visor de PDF para resaltar, subrayar, marcar con
ondulado o tachar texto, o dibujar con un lápiz, en el color que elijas.
Deshaz con Ctrl+Z, borra una marca con el borrador y luego guarda una
copia marcada. El adjunto original queda como estaba.
"""

["2026-09-29-1557-calendar-accounts-why"]
title = "Por qué una cuenta no tiene calendarios"
text = """
Cuando los calendarios de una cuenta no aparecen, Calendario ahora dice
qué respondió el servidor, y Reintentar los vuelve a buscar al momento.
Una cuenta de Gmail u Outlook añadida con contraseña ofrece iniciar
sesión con Google o Microsoft, que es lo que necesitan sus calendarios.
"""

["2026-09-29-1610-one-checkbox"]
title = "Casillas que se marcan"
text = """
Cada casilla de Katna Mail tiene ahora el mismo tamaño que los botones
redondos de al lado. Su marca se dibuja al marcarla y se borra al
desmarcarla, tanto en Ajustes como en la lista de correo, Calendario,
Contactos, Notas y los diálogos.
"""

["2026-09-29-1622-right-click-menu-fits"]
title = "Un menú contextual más corto que siempre cabe"
text = """
El menú contextual de la lista de correo deja arriba las acciones de
todos los días y pone el resto en Hacer seguimiento (tareas, notas,
reuniones, llamadas) y Más (spam, importancia, fijar). Se abre donde
haces clic y se queda dentro de la ventana; en una ventana baja o
estrecha, un submenú se abre en el lugar del menú.
"""

["2026-09-29-1627-contacts-accounts-why"]
title = "Por qué una cuenta no tiene contactos"
text = """
Cuando los contactos de una cuenta no aparecen, Contactos ahora dice qué
respondió el servidor, y Reintentar los vuelve a buscar al momento. Una
cuenta de Gmail u Outlook añadida con contraseña ofrece iniciar sesión
con Google o Microsoft, que es lo que necesitan sus contactos.
"""

["2026-09-29-1640-search-box-focus"]
title = "El cuadro de búsqueda muestra cuándo está activo"
text = """
El cuadro de búsqueda de arriba se marca con un borde de color mientras
escribes en él, como cualquier otro campo, y su indicación Ctrl+F se
aparta hasta que lo dejas vacío.
"""

["2026-09-29-1612-tasks-board-rows"]
title = "Todas las listas de tareas a la vista"
text = """
Todas las tareas muestra ahora tantas listas una al lado de otra como
caben en la ventana, con más filas debajo, para que se pueda llegar a
todas. Una lista nueva se desplaza a la vista en cuanto la creas.
"""

["2026-09-29-1653-smooth-attachment-paging"]
title = "Paso suave entre archivos adjuntos"
text = """
Ir al archivo adjunto siguiente o anterior en el visor con las flechas
ya no parpadea. El visor sigue abierto y el siguiente archivo ocupa el
lugar del anterior en cuanto está listo.
"""

["2026-09-29-1656-drag-notes"]
title = "Arrastra las notas para ordenarlas"
text = """
Arrastra una nota en el tablero de Notas para moverla, como en Keep. Las
demás notas se apartan para hacerle sitio, y se queda donde la sueltas.
Ctrl+Z la devuelve. Las tarjetas ahora encajan en sus columnas, sin
huecos bajo las notas cortas.
"""

["2026-09-29-1707-calendar-right-click"]
title = "Clic derecho en el Calendario"
text = """
Haz clic derecho en una hora o un día libre para añadir allí un evento,
tiempo de concentración o fuera de la oficina. Haz clic derecho en un
evento para editarlo, duplicarlo, eliminarlo, responder, unirte,
escribir a los invitados, darle un color o moverlo a otro calendario, y
en una tarea para marcarla como hecha, destacarla, darle otro día o
eliminarla. Deshacer revierte un cambio.
"""

["2026-09-29-1725-pdf-notes-and-text"]
title = "Notas y texto en los PDF"
text = """
Al marcar un PDF ahora tienes notas adhesivas y cuadros de texto: haz
clic en la página, escribe y pulsa Ctrl+Enter. Pasa el puntero sobre una
nota para leerla o haz clic en ella para cambiarla. Responder envía tu
copia marcada directamente en una respuesta al mensaje.
"""

["2026-09-29-1657-tasks-drag-to-place"]
title = "Arrastra las tareas adonde quieras"
text = """
Arrastra una tarea hacia arriba o hacia abajo en su lista, o a otra
lista, y las tareas de allí se apartan para mostrar dónde quedará.
Google Tasks conserva el nuevo orden también en tu teléfono, y Deshacer
devuelve la tarea a su sitio.
"""

["2026-09-29-1719-calendar-task-tab"]
title = "Añadir una tarea desde el Calendario"
text = """
La tarjeta de evento nuevo tiene una pestaña Tarea, como en Google
Calendar. Haz clic en una hora, elige Tarea, y el título, el día y la
hora se convierten en una tarea en la lista que elijas, con una
descripción si quieres.
"""

["2026-09-29-1758-calendar-new-task-here"]
title = "Añadir una tarea desde el Calendario"
text = """
Haz clic derecho en una hora o un día libre del Calendario y elige
Tarea para añadir allí una tarea. La tarjeta de evento nuevo se abre en
su pestaña Tarea con ese día y esa hora ya puestos.
"""

["2026-09-30-0113-calendar-server-unreachable"]
title = "Los calendarios se vuelven a buscar tras un servidor lento"
text = """
Cuando el servidor de calendarios de una cuenta no responde a tiempo,
el Calendario ahora lo dice, y si se atascó la conexión o el protocolo
de seguridad, en lugar de “No se han encontrado calendarios”. Vuelve
a intentarlo en minutos en vez de horas.
"""

["2026-09-30-0123-contact-files-fill"]
title = "Los archivos del contacto muestran su descarga"
text = """
Un archivo de los detalles del contacto cuyo correo aún no está en este
ordenador ahora se va llenando mientras se descarga, como los adjuntos
de la lista, y luego se abre.
"""

["2026-09-30-0135-new-account-mail-shows-as-it-arrives"]
title = "El correo de una cuenta nueva aparece a medida que llega"
text = """
Después de añadir una cuenta, su bandeja de Recibidos se descarga
primero y se va llenando ante tus ojos, en vez de quedarse en «Obteniendo
tu correo…» hasta que termine cada carpeta. Las demás carpetas se llenan
de la misma forma.
"""

["2026-09-30-0159-checkbox-matches-icons"]
title = "Casillas a la altura de los iconos"
text = """
Las casillas son un poco más pequeñas, del mismo tamaño que los iconos de
estrella y etiqueta de al lado en la lista de correo. Son igual de fáciles
de pulsar, y su marca se sigue dibujando.
"""

["2026-09-30-0201-zoho-calendars"]
title = "Calendarios de Zoho por la conexión propia de Zoho"
text = """
Zoho ofrece los calendarios a otras apps por un puerto que muchas redes
bloquean, así que tras Iniciar sesión con Zoho, Calendario los lee por
la API propia de Zoho. Tus eventos de Zoho aparecen junto a tus otros
calendarios; cambiarlos desde Katna llegará más adelante.
"""

["2026-09-30-0216-zoho-tasks"]
title = "Tareas de Zoho"
text = """
Inicia sesión con Zoho en una cuenta de Zoho y sus tareas de Zoho ToDo
aparecen en Tareas, en ambos sentidos: añade, edita, marca como
completada o elimina una tarea en Katna y también cambia en Zoho.
"""

["2026-09-30-0224-checkbox-tick-centred"]
title = "Marcas centradas a cualquier tamaño"
text = """
Con Ajustes > Apariencia > Escala por encima del 100 %, la marca de una
casilla quedaba un poco arriba y a la izquierda. Los bordes de las
casillas y los botones redondos crecen ahora con la escala, así que la
marca queda centrada a cualquier tamaño.
"""

["2026-09-30-0230-edges-follow-scaling"]
title = "Los contornos crecen con la Escala"
text = """
Con la Escala de Ajustes > Apariencia por encima o por debajo del 100 %,
el contorno de color del cuadro de búsqueda y de los campos con el foco,
y los bordes de las tarjetas de opciones y de los anillos de tareas,
crecen y encogen ahora con todo lo demás en vez de quedarse finos.
"""

["2026-09-30-0326-google-sign-in-network"]
title = "Iniciar sesión con Google en cualquier red"
text = """
Iniciar sesión con Google ya no se detiene con «peer closed connection»
en redes que cortan pronto la conexión de Google. Si desmarcas Gmail en
la página de Google, Katna ahora lo dice en vez de fallar más tarde.
"""

["2026-09-30-0504-google-api-turned-off"]
title = "Dice qué API de Google está desactivada"
text = """
Cuando Google tiene una API desactivada para Katna, Contactos, Calendario,
Tareas y los archivos de Drive ahora dicen cuál en una línea breve, con
un botón Activar que abre su página de Google, en vez del error en bruto
de Google.
"""

["2026-09-30-0507-newest-mail-first"]
title = "El correo más reciente llega primero"
text = """
Al añadir una cuenta, Katna Mail descarga ahora primero tu correo más
reciente y luego va hacia el más antiguo, así que los mensajes de hoy
aparecen enseguida arriba de Recibidos. Si la descarga se interrumpe,
sigue con el correo antiguo la próxima vez.
"""

["2026-09-30-0601-keyring-at-login"]
title = "Espera a tu cartera al iniciar sesión"
text = """
Si KWallet o el Anillo de claves de GNOME siguen bloqueados cuando Katna
se inicia, y su ventana de desbloqueo está cerrada, tus cuentas ya no
muestran una contraseña incorrecta. Esperan y empiezan a sincronizarse
solas en cuanto desbloqueas la cartera, sin tener que cerrar Katna.
Sincronizar ahora vuelve a pedir que la desbloquees.
"""

["2026-09-30-0606-pdf-rotate-and-top-bar"]
title = "Girar páginas de PDF"
text = """
El visor de PDF ahora puede girar las páginas en el sentido de las agujas
del reloj o al contrario (Ctrl+R y Ctrl+Mayús+R), y una copia marcada se
guarda tal como la giraste. El número de página y el zoom pasan a la
barra superior, así que nada tapa la página.
"""

["2026-09-30-0610-calendar-events-stay-put"]
title = "Los eventos se quedan donde están"
text = """
Hacer clic en un evento o una tarea del Calendario y luego cambiar de
vista ya no lo deja siguiendo al puntero. Un evento ahora solo se mueve
mientras mantienes pulsado el botón y lo arrastras, y cambiar de vista o
