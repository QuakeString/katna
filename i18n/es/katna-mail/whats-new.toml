["2026-09-29-0934-custom-days-view"]
title = "Muestra solo unos días"
text = """
Calendario tiene una Vista personalizada junto a Agenda: 4 días desde el
día que elijas, o cualquier número de 2 a 7. Pulsa X y elige cuántos en
Opciones.
"""

["2026-09-29-0939-events-in-desktop-search"]
title = "Encuentra eventos desde el escritorio"
text = """
Escribe el nombre de un evento en KRunner o en la búsqueda de GNOME para
ver cuándo es el próximo, y pulsa Enter para abrir ese día en
Calendario.
"""

["2026-09-29-1102-apps-on-a-phone"]
title = "Calendario, Contactos, Tareas y Notas en un teléfono"
text = """
En una ventana estrecha, estas páginas ahora se ajustan a la pantalla
como lo hace Correo: su lista lateral se abre desde el botón de menú,
Contactos muestra cada nombre con la dirección debajo y Notas coloca dos
tarjetas en cada fila.
