abierto, y al desplazarte sobre la foto también se detiene en Todas las
cuentas.
"""

["2026-10-05-1257-service-starts-again"]
title = "Katna inicia su servicio en segundo plano por sí solo"
text = """
Si el servicio que sincroniza tu correo y muestra el icono de la bandeja
del sistema no está en marcha, Katna Mail lo vuelve a iniciar por sí
solo. No hace falta ningún terminal. Si aun así no arranca, una línea
sobre tu correo lo dice, con Volver a iniciar y los detalles para copiar
en un informe.
"""

["2026-10-05-1430-stuck-window-replaced"]
title = "Katna Mail se abre aunque una copia se haya quedado bloqueada"
text = """
Si Katna Mail dejó de responder en segundo plano, al volver a abrirlo
ahora se cierra la copia bloqueada y se abre una ventana nueva, en lugar
de no hacer nada.
"""

["2026-10-05-1605-read-receipts-as-ticks"]
title = "Las confirmaciones de lectura ya no aparecen como correo"
text = """
Cuando la aplicación de correo de alguien envía una confirmación de
lectura de un correo que enviaste, ya no aparece como un mensaje nuevo
