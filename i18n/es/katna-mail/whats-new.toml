"""

["2026-10-04-1511-solid-mail-list-bar"]
title = "Nada se desliza bajo las barras"
text = """
Los correos de la lista de correos, el correo abierto y las burbujas de
un chat empiezan ahora debajo de sus barras en lugar de deslizarse bajo
ellas, y las barras se quedan opacas. El interruptor Cabeceras
esmeriladas ha desaparecido, y con él las esquinas raras que traía.
"""

["2026-10-04-1525-menus-inside-window"]
title = "Los menús y la información emergente se quedan dentro de la ventana"
text = """
Con el marco de ventana propio de Katna, los menús del clic derecho, las
ventanas emergentes y la información emergente cerca de un borde ya no
