["2026-09-29-1327-tasks-every-account"]
title = "Todas las cuentas en la página Tareas"
text = """
Todas las cuentas aparecen ahora en el panel lateral de Tareas. Cuando
las tareas de una cuenta no pueden cargarse, una línea debajo dice por
