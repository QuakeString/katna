"""

["2026-10-04-1100-account-problems"]
title = "Ve y arregla los problemas de las cuentas en un solo sitio"
text = """
Cuando una cuenta te necesita, una línea en la parte superior de la
lista de correos dice con palabras sencillas qué ha pasado, con la
