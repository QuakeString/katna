["2026-10-03-1844-signature-layouts"]
title = "Firmas con doce diseños"
text = """
Ajustes > Redacción > Firmas tiene ahora doce diseños listos para usar.
Rellena una sola vez tu nombre, tus números, tu logotipo, tu foto y tus
