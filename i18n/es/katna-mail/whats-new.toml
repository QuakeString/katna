text = """
El pie del panel de carpetas muestra cuánto se ha llenado el
almacenamiento de correo de la cuenta, por ejemplo «34 % de 15 GB usado»,
cuando su servidor de correo lo indica.
"""

["2026-09-27-1651-desktop-search"]
title = "Busca correo desde KRunner y la búsqueda de GNOME"
text = """
Escribe un nombre en KRunner (Alt+Space) o en la búsqueda de Actividades
para escribir a esa persona, copiar su dirección o buscar su correo.
Aparecen los mensajes cuyo asunto o remitente contiene todas las palabras
que escribes; empieza con mail: para buscar en todo tu correo, como en el
cuadro de búsqueda de Katna Mail.
"""

["2026-09-27-1727-mail-templates"]
title = "Plantillas para el correo que escribes a menudo"
text = """
Escribe un mensaje una vez y guárdalo con el nuevo botón Plantillas de la
ventana de redacción; luego ponlo en cualquier correo nuevo o respuesta
con un clic. Escribe {first name}, {name} o {my name} y Katna los rellena
para cada destinatario. Edita, cambia de nombre o elimina plantillas en
Ajustes > Redacción.
"""

["2026-09-27-1724-server-send-later"]
title = "El correo programado sale con el ordenador apagado"
text = """
Cuando tu servidor de correo puede retener el correo hasta una hora
fijada, como hace Stalwart, Programar envío ahora le entrega el mensaje en
cuanto desaparece Deshacer, así que sale a su hora aunque este ordenador
esté apagado. El menú de programación indica si lo enviará tu servidor de
correo o Katna.
"""

["2026-09-27-1730-softer-row-hover"]
title = "Un resaltado más ligero"
text = """
La línea bajo el puntero en la lista de correos ahora se eleva con una
sombra tenue, como en Gmail, en lugar de una franja oscura debajo.
"""

["2026-09-27-1745-drag-recipients"]
title = "Arrastra direcciones entre Para, Cc y Cco"
text = """
Arrastra la ficha de una dirección a otro campo para moverla; Cc y Cco se
abren mientras arrastras, aunque estén ocultos. Al señalar una ficha
aparece una x que la quita.
"""

["2026-09-27-1722-katna-account"]
title = "Cuenta de Katna"
text = """
Ajustes > Suscripción te permite crear una cuenta en el propio
servidor de Katna, con su propia contraseña, nunca la de tu correo. Las
funciones en línea de Katna, como las confirmaciones de lectura y el
seguimiento de enlaces, la necesitarán. Puedes ver los ordenadores con
sesión iniciada y cerrar la sesión en cualquiera de ellos.
"""

["2026-09-27-1805-reopens-as-you-left-it"]
title = "De vuelta donde estabas"
text = """
Al cerrar Katna Mail y volver a abrirlo, recupera la aplicación, la
carpeta y la pestaña de Recibidos que tenías abiertas, las carpetas que
habías desplegado y si el panel de carpetas estaba plegado. Salir de Katna
desde la bandeja del sistema lo hace empezar de cero.
"""

["2026-09-27-1724-snooze-and-reminders"]
title = "Posponer y recordatorios de respuesta"
text = """
Pospón una conversación con el reloj de su línea o desde el menú del clic
derecho: espera en la carpeta Pospuestos y vuelve a Recibidos, sin leer,
a la hora que elegiste. Al enviar, la flecha junto a Enviar puede
recordártelo si nadie responde en 1, 3 o 7 días. Ambas funciones van
mientras el ordenador está encendido y se ponen al día cuando se reactiva.
"""

["2026-09-27-1717-translate-mail"]
title = "Lee el correo en tu idioma"
text = """
Un mensaje en otro idioma muestra ahora un botón Traducir encima, y
Mostrar original lo devuelve como estaba. Katna detecta el idioma en tu
ordenador; solo cuando lo pides, el texto del mensaje va al servidor
propio de Katna para traducirse. Ajustes > General > Traducción elige tu
idioma y los que se traducen siempre.
"""

["2026-09-27-1744-open-and-click-tracking"]
title = "Mira cuándo se abre tu correo"
text = """
Activa el ojo junto a los destinatarios para ver cuándo cada uno abre tu
mensaje o sigue un enlace que contiene, o pide en su lugar una
confirmación de lectura. El correo enviado muestra quién lo abrió, y una
notificación te avisa la primera vez. Ambos están desactivados en cada
mensaje nuevo, y el seguimiento necesita una cuenta de Katna (Ajustes >
Suscripción).
"""

["2026-09-27-2042-activity"]
title = "Actividad del correo con seguimiento"
text = """
Actividad, junto al cuadro de búsqueda, muestra cuántos de tus mensajes
con seguimiento se abrieron y cuántas veces se siguieron sus enlaces,
con tus asuntos ordenados según cuánto se abren.
"""

["2026-09-27-2204-search-trigger-words"]
title = "Busca en tu correo desde KRunner con k"
text = """
Escribe k o m, un espacio y luego lo que quieras encontrar en KRunner o en
la búsqueda de GNOME para obtener los mismos resultados que en el cuadro
de búsqueda de Katna Mail, como «k budget». Elige tus propias palabras en
Ajustes, en General.
"""

["2026-09-27-2224-activity-button"]
title = "Actividad junto al cuadro de búsqueda"
text = """
El botón Actividad, junto al cuadro de búsqueda, cuenta las nuevas
aperturas y clics de tu correo con seguimiento y muestra quién abrió qué y
qué enlaces siguió; haz clic en uno para abrir ese mensaje. Detalles
muestra las tasas de apertura y de clics, las aperturas por día y tus
mejores asuntos de los últimos 7 o 30 días, desde siempre o de las fechas
que elijas. Un mensaje enviado muestra ahora cuántas veces lo abrió cada
persona y siguió un enlace.
"""

["2026-09-27-2239-mailbox-insights"]
title = "Estadísticas de tu buzón"
text = """
Actividad > Detalles muestra ahora también cuánto correo enviaste y
recibiste en el periodo, cada cuánto y con qué rapidez respondes tú y
responden los demás, las personas con las que más te escribes y en qué
días y a qué horas llega tu correo. Se cuenta en tu ordenador a partir del
correo que Katna ya tiene.
"""

["2026-09-28-0059-sign-in-with-google"]
title = "Inicia sesión con Google o Microsoft"
text = """
Añade una cuenta de Gmail o de Outlook iniciando sesión en la propia
página de Google o de Microsoft en tu navegador, sin contraseña de
aplicación. Las direcciones de Outlook.com y Hotmail ya funcionan también.
Si un inicio de sesión deja de funcionar, un aviso en la parte inferior de
la ventana te ofrece volver a iniciar sesión.
"""

["2026-09-28-0054-tracking-on-by-default"]
title = "Seguimiento y confirmaciones activados desde el principio"
text = """
Los mensajes nuevos y las respuestas empiezan ahora con el seguimiento de
aperturas y clics, la confirmación de lectura y la confirmación de entrega
activados; haz clic en un botón junto a los destinatarios para desactivar
uno en ese mensaje. El seguimiento necesita que hayas iniciado sesión en
tu cuenta de Katna. Una confirmación de entrega es un correo que te envía
tu servidor de correo cuando el servidor de cada destinatario recibe el
mensaje; el botón aparece atenuado si tu servidor de correo no las ofrece.
"""

["2026-09-28-0120-delivered-read-ticks"]
title = "Marcas de entregado y leído"
text = """
El correo que envías muestra ahora marcas junto a cada destinatario. Una
marca gris significa que el servidor de correo del destinatario lo aceptó:
por una confirmación de entrega o, cuando tu servicio de correo no envía
ninguna (Gmail), porque no volvió ningún mensaje de error en media hora.
Dos marcas en tu color de acento significan que lo leyó, por una
confirmación de lectura o por el seguimiento de aperturas, y una
advertencia significa que rebotó. Apunta a una marca para ver cuándo y
cómo. Los correos de confirmación se quedan en tu buzón, en
«Notificaciones», sin mostrar una notificación.
"""

["2026-09-28-0143-gmail-new-mail-notifications"]
title = "Notificaciones del correo nuevo de Gmail"
text = """
El correo nuevo de una bandeja de Gmail vuelve a mostrar una
notificación. Antes Katna se perdía el correo que Gmail guardaba en
«Todos» un instante antes que en Recibidos.
"""

["2026-09-28-0156-attachment-types"]
title = "Busca por tipo de archivo adjunto"
text = """
En Opciones de búsqueda, «Con archivo adjunto» ahora ofrece PDF, XLSX,
ODF, XLS, ODS, PPT y PPTX, y Personalizado para cualquier otra
extensión, como png o avif. Solo se muestra el correo con un adjunto de
un tipo elegido.
"""

["2026-09-28-0106-original-colors"]
title = "Colores originales con un tema oscuro"
text = """
Con un tema oscuro, el correo que fija sus propios colores se muestra en
colores oscuros. El nuevo botón de medio círculo de la barra de
herramientas del panel de lectura lo muestra con los colores originales de
su remitente, y lo devuelve.
"""

["2026-09-28-0127-print-as-shown"]
title = "La impresión conserva el formato"
text = """
El correo se imprime como se ve en el panel de lectura, con sus tablas,
colores, bordes, listas e imágenes. La vista previa de impresión puede
omitir los colores de fondo para ahorrar tinta, o imprimir solo el texto
con Texto simple.
"""

["2026-09-28-0141-ask-before-deleting"]
title = "Preguntar antes de eliminar"
text = """
Al eliminar varias conversaciones a la vez, ahora se pregunta primero si
se mueven a la papelera. Marca «No volver a preguntar» para saltarte la
pregunta, o vuelve a activarla en Ajustes > General. La eliminación
definitiva, en la papelera, pregunta siempre.
"""

["2026-09-28-0019-katna-for-windows"]
title = "Katna para Windows"
text = """
Katna Mail ahora también funciona en Windows 10 y 11, instalado con su
propio Katna Setup, con el icono en la bandeja del sistema, notificaciones,
inicio al iniciar sesión y enlaces de correo que se abren en Katna.
"""

["2026-09-28-0236-chip-remove-always"]
title = "Botón de quitar en cada dirección"
text = """
Cada dirección en Para, Cc y Cco muestra ahora siempre su x, así que puedes
quitarla sin tener que apuntar antes a ella.
"""

["2026-09-28-0244-pill-format-bar"]
title = "Una barra de formato más redondeada"
text = """
La barra de formato al redactar (Aa) tiene ahora forma de píldora con un
borde tenue, para que se distinga de tu texto en los temas claro y oscuro.
"""

["2026-09-28-0325-long-threads-smooth"]
title = "Los hilos de correo largos se abren rápido"
text = """
El correo con formato que cita muchas respuestas anteriores, como un largo
hilo de citas, ahora se abre al instante y se desplaza con fluidez en lugar
de ralentizar toda la ventana.
"""

["2026-09-28-0830-who-has-seen-it"]
title = "Quién lo ha visto, tras un ojo"
text = """
El correo que envías con seguimiento ya no tiene un recuadro de líneas
encima. Un ojo junto a la estrella se vuelve de tu color de acento en cuanto
alguien lo abre; apunta a él para ver quién lo abrió o siguió un enlace, y
cuándo.
"""

["2026-09-28-0831-contact-call-copy"]
title = "Llamar y copiar desde los detalles del contacto"
text = """
En los detalles del contacto junto a una conversación, haz clic en un número
de teléfono para llamar con tu app de teléfono o KDE Connect, o usa el botón
de copiar que tiene al lado. Ahora también puedes seleccionar y copiar todo
el texto del panel.
"""

["2026-09-28-0848-quoted-text-hide-remove"]
title = "Ocultar o quitar el correo citado en una respuesta"
text = """
El botón "..." bajo una respuesta ahora vuelve a ocultar el correo citado
después de abrirlo. Apunta a él y haz clic en la x de su esquina para quitar
el correo citado de tu respuesta; Deshacer o Ctrl+Z lo devuelve. Además, la
barra de herramientas de la respuesta se queda en su sitio mientras te
desplazas.
"""

["2026-09-28-0854-floating-folders"]
title = "Carpetas flotantes y una búsqueda más ancha"
text = """
Con las carpetas ocultas, detenerte sobre Redactar o Correo las abre como un
panel separado de los bordes, con una pequeña muesca que apunta al botón. El
cuadro de búsqueda crece para ocupar el hueco que dejan las carpetas, y
hacer clic en la carpeta en la que ya estás ya no hace parpadear la lista.
"""

["2026-09-28-0928-search-address-suggestions"]
title = "Sugerencias de direcciones en Opciones de búsqueda"
text = """
De y Para en Opciones de búsqueda ahora sugieren direcciones mientras
escribes, igual que Para, Cc y Cco al redactar. Elige una con Intro, Tab o
un clic.
"""

["2026-09-28-0935-app-menu-reply-all-window"]
title = "Menú principal en la tarjeta de la cuenta, Responder a todos en su propia ventana"
text = """
La tarjeta de la cuenta tiene un botón ☰ junto a Gestionar cuentas. Abre los
mismos menús Archivo, Editar, Ver, Ir, Mensaje, Ajustes y Ayuda que el menú
global del escritorio, para los escritorios que no lo muestran. Responder a
todos en una notificación de correo nuevo ahora abre la conversación en su
propia ventana, lista para escribir, y deja la ventana principal donde está.
"""

["2026-09-28-1011-tray-brings-window-forward"]
title = "Los clics en la bandeja y en las notificaciones traen Katna Mail al frente"
text = """
Al hacer clic en el icono de la bandeja del sistema, o en Abrir Recibidos,
Nuevo mensaje o Preferencias en su menú, la ventana de Katna Mail pasa ahora
al frente en Wayland, aunque estuviera minimizada o detrás de otras
ventanas. Al hacer clic en una notificación de correo nuevo se abre ese
correo, aunque la lista de Recibidos no lo muestre.
"""

["2026-09-28-1053-send-countdown-reply-in-place"]
title = "Enviar hace una cuenta atrás, y tu respuesta se queda en la conversación"
text = """
Después de Enviar, un anillo que se encoge cuenta atrás el tiempo para
deshacer junto a Deshacer, y luego el aviso dice Mensaje enviado (con un
sonido breve) cuando el correo ya ha salido. Puedes desactivar el sonido en
Ajustes > General > Envío. Una respuesta escrita en una conversación se
convierte en un mensaje justo donde la escribiste. Su cabecera solo muestra
a quién va; haz clic en ella para ver De, Para, Cc y Cco. La flecha junto al
icono de respuesta cambia entre Responder, Responder a todos y Reenviar, y
conserva lo que has escrito.
"""

["2026-09-28-1110-search-options-narrow"]
title = "Las Opciones de búsqueda caben en ventanas estrechas"
text = """
En una ventana estrecha o baja, las Opciones de búsqueda ahora ocupan el
ancho disponible, colocan las etiquetas encima de sus campos en un teléfono
y se desplazan cuando no caben, para que el botón Buscar siempre esté a
mano.
"""

["2026-09-28-1119-replies-from-right-account"]
title = "Las respuestas salen de la cuenta correcta"
text = """
Al usar Responder o Reenviar en un correo abierto desde la Bandeja de
entrada unificada o desde la búsqueda, el mensaje sale ahora de la cuenta a
la que llegó el correo, no de la cuenta elegida bajo tu foto de perfil.
"""

["2026-09-28-1436-calmer-search-box"]
title = "La búsqueda muestra su atajo"
text = """
El cuadro de búsqueda muestra su combinación de teclas junto a «Buscar
correo», según lo establecido en Ajustes > Combinaciones de teclas. Al
hacer clic en él, conserva su color y muestra un borde tenue en lugar de
oscurecerse con una sombra. Las carpetas que flotan sobre la lista ahora
también se separan del borde inferior.
"""

["2026-09-28-1450-clear-activity"]
title = "Ordena Actividad"
text = """
Señala una apertura o un clic en Actividad y pulsa × para quitarlo de la
lista, o pulsa Borrar todo para empezar de cero. Las nuevas aperturas y
clics siguen apareciendo, y el informe Detalles sigue contándolo todo.
"""

["2026-09-28-1541-round-logo"]
title = "El nuevo logotipo redondo de Katna"
text = """
Katna tiene un nuevo logotipo: una k cursiva sobre un círculo verde azulado,
en el menú de aplicaciones, la barra superior y la barra de tareas. La
bandeja del sistema lo muestra en un color que combina con tu panel, y
Acerca de Katna y la página de bienvenida muestran «katna mail» completo.
"""

["2026-09-28-1546-contact-cards"]
title = "Detalles del contacto más claros"
text = """
Los detalles del contacto ahora muestran cada parte en su propia tarjeta
suave, con botones redondos bajo el nombre para escribirle a la persona,
buscar tu correo con ella o llamarla. Conversaciones recientes muestra las
últimas; pulsa Más para ver el resto y Menos para plegarlas.
"""

["2026-09-28-1507-reply-box-recipients"]
title = "Un cuadro de respuesta más ordenado"
text = """
Los destinatarios ahora se muestran con su foto, y Cc y Cco se juntan en un
solo botón pequeño. Abrir los destinatarios de una respuesta hace que el
cuadro crezca hacia arriba con suavidad, y el mensaje citado se abre y se
cierra con suavidad bajo una línea ondulada en la que puedes hacer clic
para volver a plegarlo.
"""

["2026-09-28-1620-softer-window-shadow"]
title = "Una sombra de ventana más suave y botones del tamaño de KDE"
text = """
Con el marco de ventana de Katna, la sombra alrededor de la ventana es más
ajustada y se desvanece por completo, sin el borde duro que dejaba antes
junto a la ventana. Los botones de la ventana ahora tienen el tamaño de los
propios de KDE, y quedan tan separados del lado de la ventana como de su
parte superior.
"""

["2026-09-28-1622-update-from-the-app"]
title = "Actualiza Katna desde la propia aplicación"
text = """
Katna ahora descarga las nuevas versiones por sí mismo y te avisa cuando
una está lista. Pulsa Actualizar en la notificación o en Acerca de Katna:
Katna Mail avisa de que se va a reiniciar, pide tu contraseña, instala la
actualización y se abre de nuevo donde lo dejaste. Ajustes > General >
Actualizaciones desactiva la descarga automática.
"""

["2026-09-28-1520-track-sealed-and-plain"]
title = "Seguimiento de correo firmado, cifrado y en texto sin formato"
text = """
El ojo ahora también funciona en el correo firmado y cifrado: la copia de
cada destinatario se firma o cifra por separado, así que las firmas siguen
siendo válidas. El correo en texto sin formato no puede mostrar aperturas,
pero sus enlaces sí se siguen, así que verás cuándo alguien sigue uno.
"""

["2026-09-28-1834-reply-after-closed-window"]
title = "Responder empieza de cero tras cerrar la ventana de un mensaje"
text = """
Al cerrar un mensaje escrito en su propia ventana, ahora se conserva en
Borradores, y Responder, Responder a todos y Reenviar vuelven a abrir un
mensaje nuevo en lugar de recuperar el anterior.
"""

["2026-09-28-1852-frosted-search-bar"]
title = "Una barra de búsqueda esmerilada"
text = """
Con el fondo desenfocado activado, la barra de búsqueda deja pasar el
desenfoque como la barra que la rodea, en lugar de quedar encima como una
píldora gris sólida.
"""

["2026-09-28-1906-scroll-to-switch-accounts"]
title = "Desplázate sobre tu imagen para cambiar de cuenta"
text = """
Con el puntero sobre la imagen de la cuenta, arriba a la derecha, gira la
rueda del ratón para pasar a la cuenta siguiente o anterior, una cuenta por
cada paso. La imagen se desplaza hasta la nueva cuenta, igual que el nombre
de la app se desplaza al cambiar de app, y elegir una cuenta en la tarjeta
lo hace de la misma manera.
"""

["2026-09-28-1918-many-recipients"]
title = "Espacio para muchos destinatarios"
text = """
Los destinatarios a partir de la primera línea ahora usan todo el ancho, y
una lista larga se desplaza dentro de unas pocas líneas, así que el propio
mensaje siempre queda al alcance. Sal del campo y se pliega a una línea,
como "Kay, Sam, 19 más"; haz clic para volver a verlos todos.
"""

["2026-09-28-1952-activity-by-account"]
title = "Informe de actividad de una cuenta"
text = """
El informe de actividad ahora tiene un selector de cuenta junto a las
fechas. Elige Todas las cuentas o una de ellas, y los mensajes con
seguimiento, las tasas, el gráfico, los asuntos y Tu buzón se ajustan a
tu elección. El informe indica qué cuenta muestra y recuerda tu elección.
"""

["2026-09-28-2002-reader-arrows-always-shown"]
title = "Más reciente y Más antigua siempre en la barra"
text = """
Por estrecho que sea el panel de lectura, el contador y las flechas Más
reciente y Más antigua siguen a la derecha de su barra de herramientas. En
cambio, los botones que menos usas pasan uno a uno al menú Más, incluidos
los interruptores de los datos del contacto y los colores originales.
"""

["2026-09-28-2026-large-files-drive"]
title = "Envía archivos de cualquier tamaño"
text = """
Con una cuenta que inició sesión con Google, un archivo que supera el
límite de 25 MB del correo va a tu Google Drive en cuanto lo adjuntas, y
el mensaje lleva su enlace, como en Gmail. Se comparte con tus
destinatarios al pulsar Enviar; Katna solo pregunta si no se puede dar
acceso a alguien.
"""

["2026-09-28-2059-recipient-list-scrolling"]
title = "Listas de destinatarios largas, más fluidas"
text = """
Una lista larga de destinatarios ahora tiene su propia barra de
desplazamiento y avanza de línea en línea; la conversación solo se
desplaza cuando la lista llega a su final. Al añadir destinatarios, los
botones de debajo ya no saltan.
"""

["2026-09-28-2106-check-for-new-mail"]
title = "Buscar correo nuevo"
text = """
Haz clic derecho en una carpeta o una cuenta del panel de carpetas para
elegir «Buscar correo nuevo», «Marcar todo como leído», una carpeta
nueva dentro o «Vaciar la papelera». «Actualizar», sobre la lista, ahora
también consulta el servidor. Mientras Katna busca, las flechas giran en
«Actualizar» y junto a Recibidos, y «Buscando correo nuevo…» aparece
arriba si tarda más de un momento.
"""

["2026-09-28-2101-large-files-onedrive"]
title = "Archivos grandes con OneDrive"
text = """
Outlook.com, Hotmail y otras cuentas de Microsoft ahora envían archivos
que superan el límite del correo igual que las cuentas de Google: el
archivo va a tu OneDrive en cuanto lo adjuntas, y el mensaje lleva su
enlace, como en Outlook.
"""

["2026-09-28-2108-activity-checking"]
title = "Adiós al destello de «Iniciar sesión» en Actividad"
text = """
Justo después de iniciarse Katna, Actividad muestra una fina barra de
carga mientras comprueba tu cuenta de Katna, en lugar de pedirte
brevemente que inicies sesión. Katna también comprueba la cuenta en
cuanto arranca, así que la espera es más corta.
"""

["2026-09-28-2130-update-dialog"]
title = "Las actualizaciones tienen su propia ventana"
text = """
Ayuda > Buscar actualizaciones abre una ventana propia. Muestra tu
versión junto a la nueva, con la fecha de compilación de cada una y el
tamaño de la descarga, las novedades de la actualización y todos los
cambios desde tu versión.
"""

["2026-09-28-2204-faster-start"]
title = "Inicio más rápido, sincronización más fluida"
text = """
Katna Mail abre una bandeja de entrada grande aproximadamente un cuarto
más rápido, y mientras se descarga el correo actualiza la lista una vez
por lote en lugar de cada pocos mensajes, así que el desplazamiento y la
escritura siguen fluidos durante una sincronización.
"""

