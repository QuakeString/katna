["2026-09-30-0715-click-away-closes-viewer"]
title = "Haz clic fuera para cerrar"
text = """
Haz clic en el espacio oscurecido alrededor de un adjunto para cerrar el
visor, en vez de buscar el botón de volver. Los clics sobre la propia
página siguen seleccionando texto y marcando como antes.
"""

["2026-09-30-0729-add-account-and-pop3"]
title = "Un nuevo Añadir cuenta, y POP3"
text = """
Añadir una cuenta empieza por tu proveedor: Google, Yahoo, iCloud, Zoho,
Fastmail, GMX, Yandex o cualquier otro. Katna dice primero lo que
necesita el proveedor, muestra cada paso mientras conecta y termina con
lo que ha configurado. Las cuentas POP3 también funcionan, y en Ajustes >
Cuentas eliges cuánto tiempo se queda su correo en el servidor.
"""

["2026-09-30-0802-ctrl-wheel-zoom"]
title = "Zoom con Ctrl y la rueda"
text = """
En el visor de adjuntos, mantén pulsado Ctrl y gira la rueda del ratón
para acercar y alejar alrededor del puntero, o pellizca en un panel
táctil. Funciona con PDF, imágenes, archivos de texto, hojas de cálculo y
documentos.
"""

["2026-09-30-0817-event-open-the-mail"]
title = "Abre el correo detrás de un evento"
text = """
Los eventos que Gmail creó a partir de un correo, como trenes, vuelos y
hoteles, tienen un botón Abrir el correo en su tarjeta. Abre ese correo
