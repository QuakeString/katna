"""

["2026-09-30-0620-checkbox-partial-centred"]
title = "Las casillas a medio marcar se ven parejas"
text = """
Cuando solo hay algunos mensajes seleccionados, el cuadrado dentro de la
casilla de seleccionar todo tiene ahora el mismo margen por cada lado,
sea cual sea la escala de la interfaz.
"""

["2026-09-30-0632-year-view-day-peek"]
title = "Los planes de un día desde la vista Año"
text = """
En la vista Año del Calendario, deja el puntero sobre un día con un punto
