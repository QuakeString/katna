crecer de golpe.
"""

["2026-10-04-1144-account-problems-settings"]
title = "Los problemas de las cuentas, también en Ajustes"
text = """
Ajustes › Cuentas dice ahora bajo el nombre de una cuenta qué le pasa,
como una contraseña rechazada, con la solución justo ahí.
"""

["2026-10-04-1147-subject-scrolls-again"]
title = "El asunto vuelve a desplazarse con el correo"
text = """
En la vista de correo, el asunto vuelve a desplazarse junto con los
correos, bajo una barra de herramientas sencilla. En la vista de chat,
