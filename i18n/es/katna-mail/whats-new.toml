["2026-09-29-0720-focus-time"]
title = "Tiempo de concentración, ausencia y ubicación de trabajo"
text = """
Ahora un evento nuevo puede ser Tiempo de concentración, Fuera de la
oficina o Ubicación de trabajo, como en Google Calendar: elígelo encima
