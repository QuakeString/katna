["2026-09-29-0849-tasks-in-desktop-search"]
title = "Encuentra tareas desde el escritorio"
text = """
Escribe unas palabras de una tarea en KRunner o en la búsqueda de GNOME y aparecerá en Tareas. Pulsa Intro y Katna la abre, lista para editar.
"""

["2026-09-29-0832-clock-day-menu"]
title = "Añade eventos y tareas desde el reloj del escritorio"
text = """
En Katna Digital Clock, haz clic derecho en un día del mes para añadir
una tarea o un evento para ese día; el evento se abre en el Calendario
