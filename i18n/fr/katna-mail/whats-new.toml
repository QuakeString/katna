"""

["2026-09-29-0213-coffee-button-play"]
title = "Une petite scène sur « Offrez-moi un café »"
text = """
Laissez le pointeur sur « Offrez-moi un café » dans « À propos de Katna
» : le bouton demande un café, un thé, une pizza, puis plus rien du
