nom du compte sous une note indique où elle est conservée ; cliquez
dessus pour la déplacer, ou gardez-la uniquement sur cet ordinateur.
"""

["2026-09-29-0451-add-mail-to-tasks"]
title = "Ajouter un message aux tâches"
text = """
Appuyez sur Maj+T, comme dans Gmail, ou choisissez Ajouter aux tâches en
