Sous GNOME, une carte Tâches s'affiche sous le calendrier de l'horloge
dès votre prochaine ouverture de session.
"""

["2026-09-29-0329-pages-by-keyboard"]
title = "Les pages au clavier et depuis la barre des tâches"
