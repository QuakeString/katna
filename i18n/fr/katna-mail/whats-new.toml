et toutes les modifications depuis votre version.
"""

["2026-09-28-2204-faster-start"]
title = "Démarrage plus rapide, synchronisation plus fluide"
text = """
Katna Mail ouvre une grande boîte de réception environ un quart plus
vite, et pendant le téléchargement du courrier, il met la liste à jour
