italique et souligné, comme dans Keep. Le tableau l’affiche aussi, et
elle suit la note jusqu’au dossier Notes de votre compte de messagerie,
où la mise en forme venue d’un iPhone revient désormais telle quelle.
"""

["2026-09-29-0934-custom-days-view"]
title = "N’afficher que quelques jours"
text = """
Calendrier a une Vue personnalisée à côté de Planning : 4 jours à partir
du jour choisi, ou n’importe quel nombre de 2 à 7. Appuyez sur X, et
choisissez combien dans Options.
"""

["2026-09-29-0939-events-in-desktop-search"]
title = "Trouver des événements depuis le bureau"
text = """
Tapez le nom d’un événement dans KRunner ou dans la recherche de GNOME
pour voir quand il a lieu la prochaine fois, et appuyez sur Enter pour
ouvrir ce jour dans Calendrier.
"""

["2026-09-29-1102-apps-on-a-phone"]
title = "Calendrier, Contacts, Tâches et Notes sur un téléphone"
text = """
Dans une fenêtre étroite, ces pages tiennent désormais à l’écran comme
Courrier : leur liste latérale s’ouvre depuis le bouton de menu,
Contacts affiche chaque nom avec l’adresse en dessous, et Notes dispose
deux cartes côte à côte.
"""

["2026-09-29-1236-agenda-button-top-bar"]
title = "L’agenda du jour, depuis la barre du haut"
text = """
Le bouton qui affiche l’agenda du jour à côté de votre courrier est
maintenant dans la barre du haut, près du bouton de langue, et le
courrier récupère la place qu’occupait la bande latérale.
"""

["2026-09-29-1243-hide-side-panel-on-every-page"]
title = "Masquer le panneau latéral sur chaque page"
text = """
Le bouton de menu en haut à gauche replie maintenant aussi le panneau
latéral dans Calendrier, Contacts, Tâches et Notes, en le faisant
glisser comme les dossiers de Courrier. Chaque page se souvient si vous
l’avez laissé ouvert.
"""

["2026-09-29-1251-app-menu-on-a-phone"]
title = "Le menu principal sur un téléphone"
text = """
Sur un téléphone, le menu principal derrière la photo du compte ouvre
Fichier, Édition, Affichage et le reste sur place, avec une ligne Retour
en haut, au lieu de déborder sur le côté de l’écran.
"""

["2026-09-29-1256-calendar-every-account"]
title = "Tous les comptes dans Calendrier"
text = """
La liste latérale de Calendrier affiche maintenant tous vos comptes.
Quand les calendriers de l’un d’eux ne se chargent pas, une ligne en
dessous dit pourquoi, avec le clic qui règle le problème, comme
« Reconnectez-vous pour afficher les calendriers ».
"""

["2026-09-29-1300-switch-account-stay-on-page"]
title = "Changer de compte sans quitter la page"
text = """
Choisir un autre compte depuis votre photo en haut à droite, ou tourner
la molette dessus, vous laisse maintenant sur Calendrier, Tâches,
Contacts ou Notes. Les nouveaux éléments vont dans ce compte, et
Courrier l’affiche quand vous y revenez.
"""

["2026-09-29-1317-contacts-every-account"]
title = "Tous les comptes dans Contacts"
text = """
Contacts liste maintenant tous vos comptes sous Comptes, avec le nombre
de personnes de chacun ; cliquez sur l’un d’eux pour ne voir que ses
personnes. Quand les contacts d’un compte ne se chargent pas, une ligne
en dessous dit pourquoi, avec le clic qui règle le problème, comme
« Reconnectez-vous pour afficher les contacts » ou « Réessayer ».
"""

["2026-09-29-1327-tasks-every-account"]
title = "Tous les comptes sur la page Tâches"
text = """
Chaque compte apparaît désormais dans le panneau latéral de Tâches.
Quand les tâches d’un compte ne se chargent pas, une ligne en dessous
dit pourquoi, avec un clic pour régler le problème : se reconnecter, ou
réessayer.
"""

["2026-09-29-1404-compose-dialogs-in-view"]
title = "Les questions avant l’envoi restent en vue"
text = """
Les questions comme « Vouliez-vous joindre des fichiers ? » s’ouvrent
désormais au milieu de la fenêtre, quelle que soit la longueur du
message que vous écrivez ou transférez, et ne sont donc jamais cachées
plus bas dans la page. Entrée répond avec le bouton principal et Échap
revient au message.
"""

["2026-09-29-1530-mark-up-pdfs"]
title = "Annoter les PDF"
text = """
Appuyez sur le stylo dans la visionneuse PDF pour surligner, souligner,
onduler ou barrer du texte, ou dessiner au stylo, dans la couleur de
votre choix. Annulez avec Ctrl+Z, effacez une annotation avec la gomme,
puis enregistrez une copie annotée. La pièce jointe d’origine reste
telle quelle.
"""

["2026-09-29-1557-calendar-accounts-why"]
title = "Pourquoi un compte n’a pas de calendriers"
text = """
Quand les calendriers d’un compte ne s’affichent pas, Calendrier indique
maintenant ce que le serveur a répondu, et Réessayer les recherche
aussitôt. Un compte Gmail ou Outlook ajouté avec un mot de passe propose
de se connecter avec Google ou Microsoft, ce dont ses calendriers ont
besoin.
"""

["2026-09-29-1610-one-checkbox"]
title = "Des cases qui se cochent"
text = """
Chaque case à cocher de Katna Mail a désormais la taille des boutons
ronds voisins. Sa coche se dessine quand vous la cochez et s’efface
quand vous la décochez, dans Paramètres, la liste des messages,
Calendrier, Contacts, Notes et les boîtes de dialogue.
"""

["2026-09-29-1622-right-click-menu-fits"]
title = "Un menu contextuel plus court qui tient toujours"
text = """
Le menu contextuel de la liste des messages garde les actions courantes
en haut et range le reste sous Assurer le suivi (tâches, notes,
réunions, appels) et Plus (spam, importance, épingler). Il s’ouvre là où
vous cliquez et reste dans la fenêtre ; dans une fenêtre basse ou
étroite, un sous-menu s’ouvre à la place du menu.
"""

["2026-09-29-1627-contacts-accounts-why"]
title = "Pourquoi un compte n’a pas de contacts"
text = """
Quand les contacts d’un compte ne s’affichent pas, Contacts indique
maintenant ce que le serveur a répondu, et Réessayer les recherche
aussitôt. Un compte Gmail ou Outlook ajouté avec un mot de passe propose
de se connecter avec Google ou Microsoft, ce dont ses contacts ont
besoin.
"""

["2026-09-29-1640-search-box-focus"]
title = "Le champ de recherche montre quand il est actif"
text = """
Le champ de recherche en haut prend un contour d’accent pendant que vous
y tapez, comme tous les autres champs, et son indication Ctrl+F s’efface
jusqu’à ce que vous le laissiez vide.
"""

["2026-09-29-1612-tasks-board-rows"]
title = "Toutes les listes de tâches en vue"
text = """
Toutes les tâches affiche désormais autant de listes côte à côte que la
fenêtre en contient, avec d’autres rangées en dessous, pour que chaque
liste soit accessible. Une nouvelle liste défile à l’écran dès que vous
la créez.
"""

["2026-09-29-1653-smooth-attachment-paging"]
title = "Passage fluide d’une pièce jointe à l’autre"
text = """
Passer à la pièce jointe suivante ou précédente dans la visionneuse avec
les flèches ne clignote plus. La visionneuse reste ouverte et le fichier
suivant prend la place du précédent dès qu’il est prêt.
"""

["2026-09-29-1656-drag-notes"]
title = "Faites glisser les notes pour les ranger"
text = """
Faites glisser une note sur le tableau de Notes pour la déplacer, comme
dans Keep. Les autres notes s’écartent pour lui faire de la place, et
elle reste là où vous la déposez. Ctrl+Z la remet en place. Les cartes
s’ajustent désormais dans leurs colonnes, sans vide sous les notes
courtes.
"""

["2026-09-29-1707-calendar-right-click"]
title = "Clic droit dans le Calendrier"
text = """
Faites un clic droit sur une heure ou un jour libre pour y ajouter un
événement, un temps de concentration ou une absence du bureau. Un clic
droit sur un événement permet de le modifier, le dupliquer, le
supprimer, y répondre, le rejoindre, écrire aux invités, le colorer ou
le déplacer vers un autre calendrier, et sur une tâche de la cocher, la
suivre, lui donner un autre jour ou la supprimer. Annuler revient sur
une modification.
"""

["2026-09-29-1725-pdf-notes-and-text"]
title = "Notes et texte sur les PDF"
text = """
L’annotation d’un PDF propose désormais des notes adhésives et des zones
de texte : cliquez sur la page, tapez votre texte et appuyez sur
Ctrl+Enter. Pointez sur une note pour la lire, ou cliquez dessus pour la
modifier. Répondre renvoie directement votre copie annotée dans une
réponse au message.
"""

["2026-09-29-1657-tasks-drag-to-place"]
title = "Glissez les tâches où vous voulez"
text = """
Faites glisser une tâche vers le haut ou le bas de sa liste, ou dans une
autre liste : les tâches s’écartent pour montrer où elle va se placer.
Google Tasks garde aussi le nouvel ordre sur votre téléphone, et Annuler
remet la tâche à sa place.
"""

["2026-09-29-1719-calendar-task-tab"]
title = "Ajouter une tâche depuis l’agenda"
text = """
La fiche de nouvel événement a un onglet Tâche, comme dans Google
Calendar. Cliquez sur une heure, choisissez Tâche, et le titre, le jour
et l’heure deviennent une tâche dans la liste de votre choix, avec une
description si vous le souhaitez.
"""

["2026-09-29-1758-calendar-new-task-here"]
title = "Ajouter une tâche depuis l’agenda"
text = """
Faites un clic droit sur une heure ou un jour libre du Calendrier et
choisissez Tâche pour y ajouter une tâche. La fiche de nouvel événement
s’ouvre sur son onglet Tâche, avec ce jour et cette heure déjà remplis.
"""

["2026-09-30-0113-calendar-server-unreachable"]
title = "Les calendriers sont recherchés à nouveau après un serveur lent"
text = """
Quand le serveur de calendriers d’un compte ne répond pas à temps, le
Calendrier le dit désormais, et précise si c’est la connexion ou
l’échange sécurisé qui a bloqué, au lieu de « Aucun calendrier
trouvé ». Il réessaie en quelques minutes plutôt qu’en quelques heures.
"""

["2026-09-30-0123-contact-files-fill"]
title = "Les fichiers du contact montrent leur téléchargement"
text = """
Un fichier des détails du contact dont le message n’est pas encore sur
cet ordinateur se remplit désormais pendant son téléchargement, comme
les pièces jointes de la liste, puis s’ouvre.
"""

["2026-09-30-0135-new-account-mail-shows-as-it-arrives"]
title = "Le courrier d’un nouveau compte s’affiche à son arrivée"
text = """
Après l’ajout d’un compte, sa Boîte de réception se télécharge en
premier et se remplit sous vos yeux, au lieu de rester sur « Récupération
de vos messages… » jusqu’à ce que chaque dossier soit terminé. Les autres
dossiers se remplissent de la même façon.
"""

["2026-09-30-0159-checkbox-matches-icons"]
title = "Des cases à la hauteur des icônes"
text = """
Les cases à cocher sont un peu plus petites, de la taille des icônes
d’étoile et de libellé voisines dans la liste des messages. Elles restent
aussi faciles à cliquer, et leur coche se dessine toujours.
"""

["2026-09-30-0201-zoho-calendars"]
title = "Les calendriers Zoho par la connexion propre à Zoho"
text = """
Zoho fournit les calendriers aux autres applications sur un port que
bloquent beaucoup de réseaux, donc après Se connecter avec Zoho,
Calendrier les lit plutôt par l’API propre à Zoho. Vos événements Zoho
s’affichent à côté de vos autres calendriers ; les modifier depuis Katna
viendra plus tard.
"""

["2026-09-30-0216-zoho-tasks"]
title = "Les tâches Zoho"
text = """
Connectez-vous avec Zoho sur un compte Zoho et ses tâches Zoho ToDo
s’affichent dans Tâches, dans les deux sens : ajoutez, modifiez, cochez
ou supprimez une tâche dans Katna, et elle change aussi dans Zoho.
"""

["2026-09-30-0224-checkbox-tick-centred"]
title = "Des coches centrées à toutes les tailles"
text = """
Avec Paramètres > Apparence > Mise à l’échelle au-delà de 100 %, la coche
d’une case se plaçait un peu en haut à gauche. Les bords des cases à
cocher et des boutons ronds suivent désormais l’échelle, et la coche est
centrée à toutes les tailles.
"""

["2026-09-30-0230-edges-follow-scaling"]
title = "Les contours suivent la mise à l’échelle"
text = """
Avec la Mise à l’échelle de Paramètres > Apparence au-dessus ou en dessous
de 100 %, le contour coloré du champ de recherche et des champs actifs,
ainsi que les bords des cartes de choix et des anneaux de tâches,
grandissent et rétrécissent désormais avec tout le reste au lieu de
rester fins.
"""

["2026-09-30-0326-google-sign-in-network"]
title = "Se connecter avec Google sur tous les réseaux"
text = """
Se connecter avec Google ne s’arrête plus sur « peer closed connection »
sur les réseaux qui coupent tôt la connexion de Google. Si vous décochez
Gmail sur la page de Google, Katna vous le dit désormais au lieu
d’échouer plus tard.
"""

["2026-09-30-0504-google-api-turned-off"]
title = "Indique quelle API Google est désactivée"
text = """
Quand Google a désactivé une API pour Katna, Contacts, Calendrier, Tâches
et les fichiers Drive indiquent désormais laquelle en une courte ligne,
avec un bouton Activer qui ouvre la page de Google correspondante, au
lieu de l’erreur brute de Google.
"""

["2026-09-30-0507-newest-mail-first"]
title = "Les messages les plus récents d’abord"
text = """
Quand vous ajoutez un compte, Katna Mail télécharge désormais d’abord vos
messages les plus récents, puis remonte vers les plus anciens : les
messages du jour s’affichent tout de suite en haut de la Boîte de
réception. Si le téléchargement est interrompu, il reprend les messages
plus anciens la fois suivante.
"""

["2026-09-30-0601-keyring-at-login"]
title = "Attend votre portefeuille à la connexion"
text = """
Si KWallet ou le trousseau GNOME est encore verrouillé au démarrage de
Katna et que sa fenêtre de déverrouillage est fermée, vos comptes
n’affichent plus de mot de passe incorrect. Ils attendent, puis se
synchronisent d’eux-mêmes dès que vous déverrouillez le portefeuille,
sans avoir à quitter Katna. Synchroniser maintenant demande de nouveau
à le déverrouiller.
"""

["2026-09-30-0606-pdf-rotate-and-top-bar"]
title = "Faites pivoter les pages PDF"
text = """
La visionneuse PDF peut désormais faire pivoter les pages dans le sens
des aiguilles d’une montre ou dans le sens inverse (Ctrl+R et
Ctrl+Shift+R), et une copie annotée est enregistrée telle que vous l’avez
