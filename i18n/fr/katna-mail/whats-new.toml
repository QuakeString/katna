"""

["2026-09-27-1715-contact-panel"]
title = "Les détails du contact à côté de vos messages"
text = """
Dans une fenêtre large, une carte à côté de la conversation ouverte
présente désormais l’expéditeur : son téléphone, son titre et son
entreprise tirés de ses signatures, son heure locale, le volume de
messages échangés, vos conversations récentes et les fichiers échangés.
Cliquez sur une conversation ou un fichier pour l’ouvrir, ou sur une autre
personne de la conversation pour l’afficher. Tout provient uniquement de
vos messages sur cet ordinateur. Le bouton de contact dans la barre
d’outils du volet de lecture masque la carte.
"""

["2026-09-27-1640-storage-used"]
title = "Espace utilisé"
text = """
Le bas du volet des dossiers indique à quel point l’espace de messagerie
du compte est rempli, par exemple « 34 % utilisés sur 15 Go », quand son
serveur de messagerie le communique.
"""

["2026-09-27-1651-desktop-search"]
title = "Trouver des messages depuis KRunner et la recherche GNOME"
text = """
Tapez un nom dans KRunner (Alt+Space) ou dans la recherche des Activités
pour écrire à cette personne, copier son adresse ou trouver ses messages.
Les messages apparaissent quand leur objet ou leur expéditeur contient
chaque mot tapé ; commencez par mail: pour chercher dans tous vos
messages, comme dans le champ de recherche de Katna Mail.
"""

["2026-09-27-1727-mail-templates"]
title = "Des modèles pour les messages que vous écrivez souvent"
text = """
Écrivez un message une fois et enregistrez-le avec le nouveau bouton
Modèles de la fenêtre de rédaction, puis insérez-le en un clic dans
n’importe quel nouveau message ou réponse. Écrivez {first name}, {name} ou
{my name} et Katna les remplit pour chaque destinataire. Modifiez,
renommez ou supprimez les modèles dans Paramètres > Rédaction.
"""

["2026-09-27-1724-server-send-later"]
title = "Les messages programmés partent même ordinateur éteint"
text = """
Quand votre serveur de messagerie peut retenir un message jusqu’à une
heure donnée, comme le fait Stalwart, Programmer l’envoi lui confie
désormais le message une fois Annuler disparu, pour qu’il parte à l’heure
même si cet ordinateur est éteint. Le menu de programmation indique si
c’est votre serveur de messagerie ou Katna qui l’enverra.
"""

["2026-09-27-1730-softer-row-hover"]
title = "Un survol plus léger"
text = """
La ligne sous le pointeur dans la liste de messages se soulève désormais
avec une ombre légère, comme dans Gmail, au lieu d’une bande sombre en
dessous.
"""

["2026-09-27-1745-drag-recipients"]
title = "Glissez les adresses entre À, Cc et Cci"
text = """
Faites glisser la pastille d’une adresse vers un autre champ pour la
déplacer ; Cc et Cci s’ouvrent pendant le glissement, même masqués.
Pointer une pastille affiche un x qui la retire.
"""

["2026-09-27-1722-katna-account"]
title = "Compte Katna"
text = """
Paramètres > Abonnement vous permet de créer un compte sur le serveur de
Katna lui-même, avec son propre mot de passe, jamais celui d’une
messagerie. Les fonctions en ligne de Katna, comme les accusés de lecture
et le suivi des liens, en auront besoin. Vous voyez les ordinateurs
connectés et pouvez déconnecter n’importe lequel d’entre eux.
"""

["2026-09-27-1805-reopens-as-you-left-it"]
title = "Là où vous en étiez"
text = """
Fermer Katna Mail puis le rouvrir rétablit l’application, le dossier et
l’onglet de la boîte de réception que vous aviez ouverts, les dossiers que
vous aviez dépliés et l’état replié ou non du volet des dossiers. Quitter
Katna depuis la zone de notification le fait repartir de zéro.
"""

["2026-09-27-1724-snooze-and-reminders"]
title = "Mise en attente et rappels de réponse"
text = """
Mettez une conversation en attente avec l’horloge de sa ligne ou depuis le
menu du clic droit : elle patiente dans le dossier En attente et revient
dans la boîte de réception, non lue, à l’heure choisie. À l’envoi, la
flèche à côté d’Envoyer peut vous le rappeler si personne ne répond sous
1, 3 ou 7 jours. Les deux fonctionnent tant que votre ordinateur est
allumé, et rattrapent leur retard à son réveil.
"""

["2026-09-27-1717-translate-mail"]
title = "Lisez vos messages dans votre langue"
text = """
Un message dans une autre langue affiche désormais un bouton Traduire
au-dessus, et Afficher l’original le rétablit. Katna détecte la langue
sur votre ordinateur ; le texte du message n’est envoyé au serveur de
Katna pour être traduit que si vous le demandez. Paramètres > Général >
Traduction choisit votre langue et celles à toujours traduire.
"""

["2026-09-27-1744-open-and-click-tracking"]
title = "Sachez quand vos messages sont ouverts"
text = """
Activez l’œil à côté des destinataires pour voir quand chacun ouvre
votre message ou suit un de ses liens, ou demandez plutôt un accusé de
lecture. Les messages envoyés indiquent qui les a ouverts, et une
notification vous prévient la première fois. Les deux sont désactivés
pour chaque nouveau message, et le suivi nécessite un compte Katna
(Paramètres > Abonnement).
"""

["2026-09-27-2042-activity"]
title = "Activité des messages suivis"
text = """
Activité, à côté du champ de recherche, montre combien de vos messages
suivis ont été ouverts et combien de fois leurs liens ont été suivis,
avec vos objets classés selon leur taux d’ouverture.
"""

["2026-09-27-2204-search-trigger-words"]
title = "Cherchez dans vos messages depuis KRunner avec k"
text = """
Tapez k ou m, une espace, puis ce que vous cherchez dans KRunner ou la
recherche de GNOME pour obtenir les mêmes résultats que dans le champ de
recherche de Katna Mail, par exemple « k budget ». Choisissez vos propres
mots dans Paramètres, sous Général.
"""

["2026-09-27-2224-activity-button"]
title = "Activité à côté du champ de recherche"
text = """
Le bouton Activité, à côté du champ de recherche, compte les nouvelles
ouvertures et les nouveaux clics de vos messages suivis et indique qui a
ouvert quoi et quels liens ont été suivis ; cliquez sur un élément pour
ouvrir ce message. Détails montre les taux d’ouverture et de clics, les
ouvertures par jour et vos meilleurs objets sur les 7 ou 30 derniers
jours, depuis le début ou entre les dates de votre choix. Un message
envoyé indique désormais combien de fois chaque personne l’a ouvert et a
suivi un lien.
"""

["2026-09-27-2239-mailbox-insights"]
title = "Statistiques de votre boîte aux lettres"
text = """
Activité > Détails montre aussi désormais combien de messages vous avez
envoyés et reçus sur la période, à quelle fréquence et à quelle vitesse
vous et les autres répondez, les personnes avec qui vous échangez le plus
et quels jours et à quelles heures arrivent vos messages. Le calcul se
fait sur votre ordinateur, à partir des messages que Katna a déjà.
"""

["2026-09-28-0059-sign-in-with-google"]
title = "Connexion avec Google ou Microsoft"
text = """
Ajoutez un compte Gmail ou Outlook en vous connectant sur la page même
de Google ou de Microsoft dans votre navigateur, sans mot de passe
d’application. Les adresses Outlook.com et Hotmail fonctionnent aussi
désormais. Si une connexion cesse de fonctionner, une note en bas de la
fenêtre propose de vous reconnecter.
"""

["2026-09-28-0054-tracking-on-by-default"]
title = "Suivi et accusés activés dès le départ"
text = """
Les nouveaux messages et les réponses démarrent désormais avec le suivi
des ouvertures et des clics, un accusé de lecture et un accusé de remise
activés ; cliquez sur un bouton à côté des destinataires pour en
désactiver un pour ce message. Le suivi nécessite d’être connecté à votre
compte Katna. Un accusé de remise est un e-mail que votre serveur de
messagerie vous envoie quand le serveur de chaque destinataire prend en
charge le message ; le bouton est grisé si votre serveur de messagerie
n’en propose pas.
"""

["2026-09-28-0120-delivered-read-ticks"]
title = "Des coches pour remis et lu"
text = """
Les messages que vous envoyez affichent maintenant des coches à côté de
chaque destinataire. Une coche grise signifie que son serveur de
messagerie l’a pris en charge : d’après un accusé de remise ou, quand
votre service de messagerie n’en envoie pas (Gmail), parce qu’aucun avis
de non-remise n’est revenu en une demi-heure. Deux coches dans votre
couleur d’accentuation signifient qu’il l’a lu, d’après un accusé de
lecture ou le suivi des ouvertures, et un avertissement signifie qu’il a
été rejeté. Pointez une coche pour voir quand et comment. Les accusés
reçus par e-mail restent dans votre boîte, dans
« Notifications », sans notification.
"""

["2026-09-28-0143-gmail-new-mail-notifications"]
title = "Des notifications pour les nouveaux messages Gmail"
text = """
Les nouveaux messages d’une boîte de réception Gmail affichent de nouveau
une notification. Katna laissait passer les messages que Gmail classait
dans « Tous les messages » juste avant la boîte de
réception.
"""

["2026-09-28-0156-attachment-types"]
title = "Recherche par type de pièce jointe"
text = """
Dans Options de recherche, « Contient une pièce jointe » propose
désormais PDF, XLSX, ODF, XLS, ODS, PPT et PPTX, ainsi que Personnalisé
pour toute autre extension, comme png ou avif. Seuls les messages ayant
une pièce jointe d’un type choisi s’affichent.
"""

["2026-09-28-0106-original-colors"]
title = "Les couleurs d’origine avec un thème sombre"
text = """
Avec un thème sombre, les messages qui définissent leurs propres couleurs
s’affichent en couleurs sombres. Le nouveau bouton en demi-cercle de la
barre d’outils du volet de lecture les affiche dans les couleurs d’origine
de l’expéditeur, puis revient en arrière.
"""

["2026-09-28-0127-print-as-shown"]
title = "L’impression garde la mise en forme"
text = """
Les messages s’impriment tels qu’ils apparaissent dans le volet de
lecture, avec leurs tableaux, couleurs, bordures, listes et images.
L’aperçu avant impression peut laisser de côté les couleurs d’arrière-plan
pour économiser l’encre, ou n’imprimer que le texte avec Texte simple.
"""

["2026-09-28-0141-ask-before-deleting"]
title = "Demander avant de supprimer"
text = """
Supprimer plusieurs conversations d’un coup demande maintenant d’abord si
elles doivent être placées dans la corbeille. Cochez « Ne plus demander »
pour passer la question, ou réactivez-la dans Paramètres > Général. La
suppression définitive, dans la corbeille, demande toujours.
"""

["2026-09-28-0019-katna-for-windows"]
title = "Katna pour Windows"
text = """
Katna Mail fonctionne désormais aussi sous Windows 10 et 11, installé par
son propre Katna Setup, avec l’icône dans la zone de notification, les
notifications, le lancement à l’ouverture de session et les liens de
messagerie qui s’ouvrent dans Katna.
"""

["2026-09-28-0236-chip-remove-always"]
title = "Un bouton de suppression sur chaque adresse"
text = """
Chaque adresse dans À, Cc et Cci affiche désormais toujours son x, pour que
vous puissiez la retirer sans devoir d’abord la pointer.
"""

["2026-09-28-0244-pill-format-bar"]
title = "Une barre de mise en forme plus arrondie"
text = """
La barre de mise en forme de la rédaction (Aa) a maintenant une forme de
pilule avec un léger contour, pour se détacher de votre texte en thème clair
comme en thème sombre.
"""

["2026-09-28-0325-long-threads-smooth"]
title = "Les longs fils de messages s’ouvrent vite"
text = """
Un message mis en forme qui cite de nombreuses réponses précédentes, comme
un long fil de citations, s’ouvre désormais tout de suite et défile avec
fluidité au lieu de ralentir toute la fenêtre.
"""

["2026-09-28-0830-who-has-seen-it"]
title = "Qui l’a vu, derrière un œil"
text = """
Les messages envoyés avec suivi n’ont plus d’encadré de lignes au-dessus. Un
œil à côté de l’étoile prend votre couleur d’accentuation dès que quelqu’un
ouvre le message ; pointez-le pour voir qui l’a ouvert ou a suivi un lien,
et quand.
"""

["2026-09-28-0831-contact-call-copy"]
title = "Appeler et copier depuis les détails du contact"
text = """
Dans les détails du contact à côté d’une conversation, cliquez sur un numéro
de téléphone pour l’appeler avec votre application de téléphone ou KDE
Connect, ou utilisez le bouton de copie à côté. Tout le texte du panneau
peut aussi être sélectionné et copié.
"""

["2026-09-28-0848-quoted-text-hide-remove"]
title = "Masquer ou supprimer le message cité dans une réponse"
text = """
Le bouton « ... » sous une réponse masque à nouveau le message cité après
que vous l’avez ouvert. Pointez-le et cliquez sur le x dans son coin pour
retirer le message cité de votre réponse ; Annuler ou Ctrl+Z le remet. La
barre d’outils de la réponse reste aussi en place pendant le défilement.
"""

["2026-09-28-0854-floating-folders"]
title = "Des dossiers flottants et une recherche plus large"
text = """
Quand les dossiers sont masqués, s’attarder sur Nouveau message ou Courrier
les ouvre dans un panneau détaché des bords, avec une petite encoche pointée
vers le bouton. Le champ de recherche s’agrandit pour occuper la place
laissée par les dossiers, et cliquer sur le dossier où vous êtes déjà ne
fait plus clignoter la liste.
"""

["2026-09-28-0928-search-address-suggestions"]
title = "Suggestions d’adresses dans Options de recherche"
text = """
De et À dans Options de recherche suggèrent désormais des adresses pendant
la saisie, comme À, Cc et Cci dans la rédaction. Choisissez-en une avec
Entrée, Tab ou un clic.
"""

["2026-09-28-0935-app-menu-reply-all-window"]
title = "Menu principal dans la carte du compte, Répondre à tous dans sa propre fenêtre"
text = """
La carte du compte a un bouton ☰ à côté de Gérer les comptes. Il ouvre les
mêmes menus Fichier, Édition, Affichage, Aller, Message, Paramètres et Aide
que le menu global du bureau, pour les bureaux qui n’en affichent pas.
Répondre à tous sur une notification de nouveau message ouvre maintenant la
conversation dans sa propre fenêtre, prête pour la saisie, et laisse la
fenêtre principale où elle est.
"""

["2026-09-28-1011-tray-brings-window-forward"]
title = "Un clic sur l’icône ou une notification met Katna Mail au premier plan"
text = """
Cliquer sur l’icône de la zone de notification, ou sur Ouvrir la boîte de
réception, Nouveau message ou Préférences dans son menu, met désormais la
fenêtre de Katna Mail au premier plan sous Wayland, même si elle était
réduite ou derrière d’autres fenêtres. Cliquer sur une notification de
nouveau message ouvre ce message, même quand la liste de la Boîte de
réception ne l’affiche pas.
"""

["2026-09-28-1053-send-countdown-reply-in-place"]
title = "Envoyer affiche un compte à rebours, et votre réponse reste dans la conversation"
text = """
Après Envoyer, un anneau qui rétrécit décompte le délai d’annulation à côté
d’Annuler, puis la note indique Message envoyé (avec un son bref) une fois
le message parti. Le son peut être désactivé dans Paramètres > Général >
Envoi. Une réponse écrite dans une conversation devient un message à
l’endroit même où vous l’avez écrite. Son en-tête n’indique que ses
destinataires ; cliquez dessus pour voir De, À, Cc et Cci. La flèche à côté
de l’icône de réponse passe de Répondre à Répondre à tous et à Transférer,
en gardant ce que vous avez écrit.
"""

["2026-09-28-1110-search-options-narrow"]
title = "Les Options de recherche s’adaptent aux fenêtres étroites"
text = """
Dans une fenêtre étroite ou basse, les Options de recherche prennent
désormais la largeur disponible, placent les libellés au-dessus de leurs
champs sur un téléphone et défilent quand elles ne tiennent pas, pour que le
bouton Rechercher reste toujours à portée de main.
"""

["2026-09-28-1119-replies-from-right-account"]
title = "Les réponses partent du bon compte"
text = """
Avec Répondre ou Transférer sur un message ouvert depuis la Boîte de
réception unifiée ou depuis la recherche, l’envoi part désormais du compte
qui a reçu le message, et non du compte choisi sous votre photo de profil.
"""

["2026-09-28-1436-calmer-search-box"]
title = "La recherche affiche son raccourci"
text = """
Le champ de recherche affiche son raccourci clavier à côté de « Rechercher
dans les messages », tel que défini dans Paramètres > Raccourcis. Quand
vous cliquez dedans, il garde sa couleur et affiche un léger contour au
lieu de s’assombrir avec une ombre. Les dossiers qui flottent au-dessus de
la liste se tiennent maintenant aussi à l’écart du bord inférieur.
"""

["2026-09-28-1450-clear-activity"]
title = "Faites le tri dans Activité"
text = """
Pointez une ouverture ou un clic dans Activité et appuyez sur × pour le
retirer de la liste, ou appuyez sur Tout effacer pour repartir de zéro. Les
nouvelles ouvertures et les nouveaux clics s’affichent toujours, et le
rapport Détails compte toujours tout.
"""

["2026-09-28-1541-round-logo"]
title = "Le nouveau logo rond de Katna"
text = """
Katna a un nouveau logo : un k cursif sur un cercle bleu-vert, dans le menu
des applications, la barre supérieure et la barre des tâches. La zone de
notification l’affiche dans une couleur adaptée à votre panneau, et À propos
de Katna et la page d’accueil affichent « katna mail » en entier.
"""

["2026-09-28-1546-contact-cards"]
title = "Des détails du contact plus clairs"
text = """
Les détails du contact affichent désormais chaque partie dans sa propre
carte douce, avec des boutons ronds sous le nom pour écrire à la personne,
retrouver vos messages avec elle ou l’appeler. Conversations récentes
affiche les dernières ; appuyez sur Plus pour voir le reste et sur Moins
pour les replier.
"""

["2026-09-28-1507-reply-box-recipients"]
title = "Une boîte de réponse plus soignée"
text = """
Les destinataires s’affichent désormais avec leur photo, et Cc et Cci
tiennent ensemble dans un petit bouton. Ouvrir les destinataires d’une
réponse agrandit la boîte vers le haut en douceur, et le message cité
s’ouvre et se referme en douceur sous une ligne ondulée sur laquelle vous
pouvez cliquer pour le replier de nouveau.
"""

["2026-09-28-1620-softer-window-shadow"]
title = "Une ombre de fenêtre plus douce et des boutons à la taille de KDE"
text = """
Avec le cadre de fenêtre de Katna, l’ombre autour de la fenêtre est plus
resserrée et s’estompe complètement, sans le bord dur qu’elle laissait
auparavant à côté de la fenêtre. Les boutons de la fenêtre ont désormais la
taille de ceux de KDE, et se tiennent aussi loin du bord de la fenêtre que
de son haut.
"""

["2026-09-28-1622-update-from-the-app"]
title = "Mettre à jour Katna depuis l’application"
text = """
Katna télécharge maintenant les nouvelles versions par lui-même et vous
prévient quand l’une d’elles est prête. Appuyez sur Mettre à jour dans la
notification ou dans À propos de Katna : Katna Mail annonce qu’il va
redémarrer, demande votre mot de passe, installe la mise à jour et se
rouvre là où vous en étiez. Paramètres > Général > Mises à jour désactive
le téléchargement automatique.
"""

["2026-09-28-1520-track-sealed-and-plain"]
title = "Suivi des messages signés, chiffrés et en texte brut"
text = """
L’œil fonctionne désormais aussi sur les messages signés et chiffrés : la
copie de chaque destinataire est signée ou chiffrée séparément, afin que les
signatures restent valides. Les messages en texte brut ne peuvent pas
indiquer les ouvertures, mais leurs liens sont suivis, afin que vous voyiez
quand quelqu’un en suit un.
"""

["2026-09-28-1834-reply-after-closed-window"]
title = "Répondre repart de zéro après la fermeture d'une fenêtre de message"
text = """
Fermer un message rédigé dans sa propre fenêtre le conserve désormais dans
Brouillons, et Répondre, Répondre à tous et Transférer ouvrent de nouveau un
nouveau message au lieu de rouvrir l'ancien.
"""

["2026-09-28-1852-frosted-search-bar"]
title = "Une barre de recherche givrée"
text = """
Lorsque l'arrière-plan flouté est activé, la barre de recherche laisse
passer le flou comme la barre qui l'entoure, au lieu de se poser dessus
comme une pastille grise opaque.
"""

["2026-09-28-1906-scroll-to-switch-accounts"]
title = "Faites défiler sur votre photo pour changer de compte"
text = """
Avec le pointeur sur la photo du compte, en haut à droite, tournez la
molette de la souris pour passer au compte suivant ou précédent, un compte
par cran. La photo défile vers le nouveau compte, comme le nom de l'app
défile quand vous changez d'app, et choisir un compte depuis la carte la
fait défiler de la même façon.
"""

["2026-09-28-1918-many-recipients"]
title = "De la place pour de nombreux destinataires"
text = """
Les destinataires après la première ligne utilisent maintenant toute la
largeur, et une longue liste défile sur quelques lignes, de sorte que le
message reste toujours accessible. Quittez le champ et il se replie sur une
ligne, par exemple "Kay, Sam, 19 de plus" ; cliquez dessus pour tout revoir.
"""

["2026-09-28-1952-activity-by-account"]
title = "Rapport d’activité pour un compte"
text = """
Le rapport d’activité a maintenant un sélecteur de compte à côté des
dates. Choisissez Tous les comptes ou l’un d’eux, et les messages suivis,
les taux, le graphique, les objets et Votre boîte aux lettres s’adaptent.
Le rapport indique quel compte il affiche et retient votre choix.
"""

["2026-09-28-2002-reader-arrows-always-shown"]
title = "Plus récent et Plus ancien toujours dans la barre d’outils"
text = """
Même dans un volet de lecture très étroit, le compteur et les flèches Plus
récent et Plus ancien restent à droite de sa barre d’outils. Les boutons
que vous utilisez le moins passent à la place, un par un, dans le menu
Plus, y compris les commutateurs des coordonnées du contact et des
couleurs d’origine.
"""

["2026-09-28-2026-large-files-drive"]
title = "Envoyez des fichiers de toute taille"
text = """
Avec un compte connecté à Google, un fichier dépassant la limite de 25 Mo
du courrier est placé dans votre Google Drive dès que vous le joignez, et
le message contient son lien, comme dans Gmail. Il est partagé avec vos
destinataires quand vous appuyez sur Envoyer ; Katna ne demande que si
l’accès ne peut pas être accordé à quelqu’un.
"""

["2026-09-28-2059-recipient-list-scrolling"]
title = "Listes de destinataires longues plus fluides"
text = """
Une longue liste de destinataires a désormais sa propre barre de
défilement et avance d’une ligne à la fois ; la conversation ne défile
qu’une fois la fin de la liste atteinte. L’ajout de destinataires ne
fait plus sauter les boutons en dessous.
"""

["2026-09-28-2106-check-for-new-mail"]
title = "Rechercher de nouveaux messages"
text = """
Faites un clic droit sur un dossier ou un compte dans le volet des
dossiers pour choisir « Rechercher de nouveaux messages », « Tout
marquer comme lu », un nouveau dossier à l’intérieur ou « Vider la
corbeille ». « Actualiser » au-dessus de la liste interroge désormais
aussi le serveur. Pendant la recherche, les flèches tournent sur
« Actualiser » et à côté de la boîte de réception, et « Recherche de
nouveaux messages… » s’affiche en haut si cela prend plus qu’un instant.
"""

["2026-09-28-2101-large-files-onedrive"]
title = "Gros fichiers via OneDrive"
