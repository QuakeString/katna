pour que rien ne cache la page.
"""

["2026-09-30-0610-calendar-events-stay-put"]
title = "Les événements restent à leur place"
text = """
Cliquer sur un événement ou une tâche du Calendrier puis changer de vue
ne le laisse plus suivre le pointeur. Un événement ne se déplace
désormais que tant que vous maintenez le bouton enfoncé en le faisant
glisser, et changer de vue ou de page, appuyer sur Échap ou ouvrir sa
fiche le remet en place sans modification.
"""

["2026-09-30-0620-checkbox-partial-centred"]
title = "Des cases partiellement cochées bien équilibrées"
text = """
Quand seuls certains messages sont sélectionnés, le carré dans la case
Tout sélectionner a désormais le même écart de chaque côté, quelle que
soit l’échelle de l’interface.
"""

["2026-09-30-0632-year-view-day-peek"]
title = "Le programme d’un jour depuis la vue Année"
text = """
Dans la vue Année du Calendrier, laissez le pointeur sur un jour marqué
d’un point pour voir ses événements et ses tâches dans une petite bulle
à côté, chacun avec une icône indiquant ce que c’est et son heure.
Cliquez sur l’un d’eux pour l’ouvrir, ou sur le nom du jour pour ouvrir
la journée. Sur un téléphone, touchez le jour.
"""

["2026-09-30-0650-notification-opens-own-window"]
title = "Les notifications ouvrent le message au premier plan"
text = """
Cliquer sur une notification de nouveau message ouvre ce message dans sa
propre fenêtre, au premier plan, quoi que Katna affiche à ce moment.
Répondre à tous l’ouvre avec la réponse prête à être saisie. Archiver
range le message sans rien ouvrir et l’indique dans une courte note avec
Annuler.
"""

["2026-09-30-0700-event-card-join-any-call"]
title = "Rejoignez les appels Teams et Zoom depuis le Calendrier"
text = """
La fiche d’un événement trouve désormais l’appel dans sa description ou
son lieu : une invitation Microsoft Teams, Zoom, Webex, Jitsi ou Google
Meet obtient un bouton « Rejoindre avec » en haut. Les adresses web de
la description sont des liens, les lignes de tirets bas ont disparu, et
Participez-vous ? reste en bas pendant que les détails défilent.
"""

["2026-09-30-0715-click-away-closes-viewer"]
title = "Cliquez à côté pour fermer"
text = """
Cliquez sur l’espace assombri autour d’une pièce jointe pour fermer la
visionneuse, au lieu d’aller chercher le bouton Retour. Les clics sur la
page elle-même sélectionnent toujours le texte et annotent comme avant.
"""

["2026-09-30-0729-add-account-and-pop3"]
title = "Un nouvel ajout de compte, et POP3"
text = """
L’ajout d’un compte commence par votre fournisseur : Google, Yahoo,
iCloud, Zoho, Fastmail, GMX, Yandex ou tout autre. Katna indique d’abord
ce dont le fournisseur a besoin, montre chaque étape pendant la
connexion et termine par ce qu’il a configuré. Les comptes POP3
fonctionnent aussi, et Paramètres > Comptes choisit combien de temps
leurs messages restent sur le serveur.
"""

["2026-09-30-0802-ctrl-wheel-zoom"]
title = "Zoomez avec Ctrl et la molette"
text = """
Dans la visionneuse de pièces jointes, maintenez Ctrl et tournez la
molette de la souris pour zoomer ou dézoomer autour du pointeur, ou
pincez sur un pavé tactile. Cela fonctionne pour les PDF, les images,
les fichiers texte, les feuilles de calcul et les documents.
"""

["2026-09-30-0817-event-open-the-mail"]
title = "Ouvrez le message à l’origine d’un événement"
text = """
Les événements que Gmail a créés à partir d’un message, comme les
trains, les vols et les hôtels, ont un bouton Ouvrir le message sur leur
fiche. Il ouvre ce message dans Katna, ou dans Gmail si Katna ne l’a
pas. Une tâche créée à partir d’un message ouvre aussi son message
depuis sa fiche dans le Calendrier, et Prendre des notes de réunion
s’ouvre sans clignoter.
"""

["2026-09-30-0843-calendar-side-panel-menus"]
title = "Gérez les calendriers depuis le panneau latéral"
text = """
Faites un clic droit sur un calendrier dans le panneau latéral du
Calendrier pour n’afficher que lui, changer sa couleur, le renommer ou
le supprimer. Un clic droit sur le nom d’un compte permet de créer un
nouveau calendrier dans ce compte ou d’afficher et masquer tous ses
calendriers. Les modifications vont à votre service de messagerie, et
apparaissent donc partout où vous l’utilisez.
"""

["2026-09-30-1010-unread-list-keeps-open-mail"]
title = "Les messages non lus restent ouverts"
text = """
Ouvrir une conversation dans Tous les comptes > Non lus ne la ferme plus
aussitôt. La lire la marque comme lue, et elle reste dans la liste
jusqu’à ce que vous la fermiez ou en ouvriez une autre.
"""

["2026-09-30-1045-tracked-mail-arrives"]
title = "Les messages suivis arrivent de nouveau"
text = """
Un message envoyé avec le suivi activé pouvait apparaître dans Messages
envoyés sans atteindre personne. Il part désormais à chaque destinataire. Les
messages perdus de cette façon doivent être renvoyés.
"""

["2026-09-30-1114-no-checking-pill"]
title = "Fini la pastille de vérification"
text = """
« Recherche de nouveaux messages… » n’apparaît plus par-dessus la liste.
Les flèches qui tournent sur le bouton Actualiser et sur la Boîte de
réception de chaque compte montrent déjà que le courrier est vérifié,
et une vérification qui échoue indique toujours ce qui n’a pas
fonctionné.
"""

["2026-09-30-1300-windows-sign-in-and-domains"]
title = "Se connecter avec Google sous Windows"
text = """
Katna pour Windows propose désormais Se connecter avec Google et Zoho,
comme sous Linux, et sait qui héberge le courrier de votre propre
domaine, comme une adresse Google Workspace, quand vous ajoutez le
compte.
"""

["2026-09-30-1511-mail-tables"]
title = "Les tableaux des messages s’affichent correctement"
text = """
Les tableaux des messages, comme la liste des tâches d’une notification
GitHub Actions, gardent leurs colonnes côte à côte et les alignent d’une
ligne à l’autre, au lieu de couper un titre à raison d’une lettre par
ligne. Les lignes de séparation entre les parties d’un message
s’affichent aussi désormais.
"""

["2026-09-30-1550-taller-important-marker"]
title = "Un marqueur Important plus haut"
text = """
Le marqueur Important à côté de l’étoile est plus haut de 2 px : il ne
paraît plus écrasé à côté de l’étoile et de la case à cocher. Il reste
centré dans la ligne.
"""

["2026-09-30-1617-folder-click-goes-to-top"]
title = "Retour en haut de la liste"
text = """
Dès que la liste des messages a défilé d’un écran, un bouton rond en bas
à droite la ramène en haut. Cliquer sur le dossier où vous êtes déjà,
comme la Boîte de réception, fait de même, comme dans Gmail, ainsi que
la touche Début.
"""

["2026-09-30-1622-send-from-file-manager"]
title = "Envoyez des fichiers depuis votre gestionnaire de fichiers"
text = """
Faites un clic droit sur des fichiers ou des dossiers dans Dolphin,
GNOME Fichiers ou l’Explorateur Windows et choisissez Envoyer avec Katna
Mail : un nouveau message s’ouvre avec ces éléments en pièces jointes,
et un dossier part sous forme de zip. Avec plusieurs comptes de
messagerie, choisissez celui d’envoi dans son sous-menu.
"""

["2026-09-30-1624-files-page"]
title = "Tous vos fichiers au même endroit"
text = """
La nouvelle page Fichiers, en bas de la barre des applications, affiche
toutes les pièces jointes de tous les comptes, les plus récentes
d’abord. Limitez-la aux images, aux PDF ou aux documents, à un compte, à
une personne ou à une période, ou cherchez par nom, expéditeur ou objet.
Faites un clic droit sur un fichier pour plus d’options, et Afficher le
message vous mène au message qui l’accompagnait.
"""

["2026-09-30-1643-dimmer-row-markers"]
title = "Une liste des messages plus calme"
text = """
Une case à cocher vide, une étoile ou un marqueur Important dans la
liste des messages reste plus pâle jusqu’à ce que le pointeur passe sur
sa ligne. Les étoiles et marqueurs activés gardent leur couleur.
"""

["2026-09-30-1704-folder-arrows-on-hover"]
title = "Un volet des dossiers plus net"
text = """
Les petites flèches à côté de Boîte de réception, Messages suivis et des
autres dossiers n’apparaissent que lorsque le pointeur est sur ce
dossier. Un dossier que vous avez déplié garde sa flèche.
"""

["2026-09-30-1712-arrow-keys-in-times"]
title = "Les flèches dans les champs d’heure"
text = """
Dans Choisir la date et l’heure, et dans l’heure d’une tâche, Haut et
Bas modifient la partie où se trouve le curseur : l’heure, les minutes
ou AM/PM.
"""

["2026-09-30-1742-check-one-folder"]
title = "Rechercher de nouveaux messages dans un seul dossier"
text = """
« Rechercher de nouveaux messages » dans le menu contextuel d’un dossier
ne vérifie désormais que ce dossier, et c’est donc rapide. Sur la Boîte
de réception d’un compte sous Tous les comptes, il vérifie la Boîte de
réception de ce compte, et sur une liste comme Boîte de réception ou
Messages envoyés sous Tous les comptes, il vérifie ce dossier dans chaque compte.
"""

["2026-09-30-1742-frosted-viewer"]
title = "Une visionneuse plus légère, en verre dépoli"
text = """
La barre du haut de la visionneuse de pièces jointes est plus fine et
plus claire, et la page, le zoom et la rotation tiennent sur une
pastille. Autour du fichier, Katna Mail apparaît flouté sous un voile
sombre et doux, et les barres d’outils sont dépolies aussi. Le flou suit
Paramètres > Expérimental ; sans lui, la visionneuse utilise un simple
voile sombre.
"""

["2026-09-30-1752-touchpad-glide"]
title = "Les gestes rapides sur le pavé tactile glissent"
text = """
Un geste rapide à deux doigts sur un pavé tactile continue de faire
défiler en ralentissant, comme dans les autres applications. Touchez à
nouveau le pavé tactile pour l’arrêter. Sous Wayland.
"""

["2026-09-30-1800-inbox-tabs-in-top-row"]
title = "Les onglets de la Boîte de réception sur la ligne du haut"
text = """
Principale, Promotions, Réseaux sociaux et les autres onglets de la
Boîte de réception tiennent désormais dans une barre en pastille sur la
ligne du haut de la liste, chacun avec le nombre coloré de ses messages
non lus. La surbrillance glisse vers l’onglet choisi, et cliquer sur
l’onglet ouvert ramène sa liste en haut. Quand la liste est étroite, la
barre prend sa propre ligne et affiche des icônes, en gardant le nom de
l’onglet ouvert ; sur un téléphone, elle se place dans la barre de la
liste, avec Actualiser dans le menu Plus.
"""

["2026-09-30-1805-account-menu"]
title = "Les infos du compte dans le menu contextuel"
text = """
Faites un clic droit sur le nom d’un compte dans la liste des dossiers,
ou sur sa Boîte de réception sous Tous les comptes, pour voir son
adresse, s’il est synchronisé, quand il a été vérifié pour la dernière
fois et l’espace de stockage qu’il utilise. De là, vous pouvez vérifier
cette Boîte de réception, écrire un nouveau message depuis ce compte,
ouvrir ses paramètres, ou vous reconnecter quand la connexion a expiré.
"""

["2026-09-30-1819-glass-search-box"]
title = "Un champ de recherche en verre"
text = """
Avec l’arrière-plan flouté activé, le champ de recherche est en verre
dépoli avec un bord discret tant que vous ne l’utilisez pas, et devient
opaque quand vous cliquez dedans pour taper.
"""

["2026-09-30-1820-search-cancel-restores"]
title = "Annulez une recherche, retrouvez vos messages"
text = """
Échap ou vider le champ de recherche vous ramène désormais là où vous
étiez : le même dossier, le même endroit dans la liste et le message que
vous aviez ouvert. Ouvrez plutôt un résultat, et la recherche prend le
relais comme avant.
"""

["2026-09-30-1840-first-run-window"]
title = "Un premier démarrage plus accueillant"
text = """
Pendant que vous configurez Katna Mail, la fenêtre apparaît derrière les
pages de configuration sous un voile léger : les applications, Nouveau
message et le champ de recherche, avec des espaces réservés discrets là
où vos dossiers et vos messages apparaîtront. Une nouvelle étape propose
un compte Katna et liste ce qu’il active (accusés de lecture, suivi des
liens, Activité et traduction), ou vous pouvez la passer.
"""

["2026-09-30-1850-windows-frame-and-blur"]
title = "Le cadre et le flou de Katna sous Windows"
text = """
Sous Windows, Katna Mail s’ouvre désormais à l’intérieur de l’écran,
agrandi quand l’écran est petit. Paramètres > Expérimental peut flouter
ce qui se trouve derrière la fenêtre, et le cadre propre à Katna fait de
la barre du haut la barre de titre la prochaine fois que vous ouvrez
Katna Mail.
"""

["2026-09-30-1851-dark-depth"]
title = "Plus lisible en couleurs sombres"
text = """
En couleurs sombres, ce qui flotte au-dessus de la liste des messages
est désormais un peu plus clair, avec un léger bord lumineux, car les
ombres se voient à peine sur un fond sombre. Le bouton Revenir en haut,
les menus, la fenêtre Nouveau message et les boîtes de dialogue
ressortent clairement. Les couleurs claires restent comme avant.
"""

["2026-09-30-1911-files-scrollbar"]
title = "Une barre de défilement sur la page Fichiers"
text = """
Quand il y a plus de fichiers que la place n’en permet, une fine barre
de défilement apparaît à droite pendant que vous faites défiler ou que
le pointeur est sur les fichiers, puis s’efface. Faites-la glisser pour
parcourir rapidement les fichiers, ou cliquez au-dessus ou en dessous
pour y sauter.
"""

["2026-09-30-1919-tabs-keep-open-mail"]
title = "Changer d’onglet garde le message ouvert"
text = """
Avec le volet de lecture à côté de la liste, choisir un autre onglet de
la Boîte de réception ne ferme plus le message que vous lisez ; la liste
change et le message reste ouvert.
"""

["2026-09-30-1925-inbox-tabs-centred"]
title = "Les onglets de la Boîte de réception au centre"
text = """
Les onglets de la Boîte de réception se placent désormais au centre de
la ligne du haut de la liste, et ne s’écartent que de ce dont ses
boutons ont besoin.
"""

["2026-09-30-1945-page-box-arrow-keys"]
title = "Les flèches dans le champ de page"
text = """
Dans un PDF, cliquez sur le numéro de page et appuyez sur Haut ou Bas
pour reculer ou avancer d’une page. Maintenez la touche pour feuilleter
les pages rapidement.
"""

["2026-09-30-1952-phone-bar-labels"]
title = "Les noms des applications sur téléphone suivent votre réglage"
text = """
Avec les noms des applications désactivés dans les Paramètres, la barre
en bas d’une fenêtre de la taille d’un téléphone n’affiche désormais que
les icônes, centrées, comme le fait le rail latéral.
"""

["2026-09-30-1955-account-menu-icons"]
title = "Paramètres et langue dans le menu du compte"
text = """
Le menu sous la photo de votre compte s’ouvre désormais sur une rangée
d’icônes : ouvrir les Paramètres ou changer de langue. Le drapeau de la
langue a quitté la barre du haut pour faire de la place.
"""

["2026-09-30-2001-phone-tabs-fold"]
title = "Chaque onglet de la Boîte de réception reste à portée"
text = """
Quand la fenêtre est étroite, les onglets de la Boîte de réception se
replient en douceur au lieu de disparaître : les libellés deviennent de
plus grandes icônes, puis les compteurs s’effacent. Sur un téléphone,
les onglets occupent toute la barre, faciles à toucher, avec Plus au
bout de la même pastille.
"""

["2026-09-30-2012-fit-and-page-arrows"]
title = "Ajuster, flèches de page et plus dans la visionneuse"
text = """
La visionneuse de pièces jointes a un bouton Ajuster : une page PDF
s’ajuste à la hauteur de la fenêtre, une image à la fenêtre, et les
documents, diapositives et feuilles de calcul à sa largeur. Les images
ont aussi Taille réelle et peuvent pivoter. Pointez sur le champ de page
pour afficher de petites flèches qui reculent ou avancent d’une page, et
les diapositives ont leur propre champ.
"""

["2026-09-30-2019-folder-icon-colours"]
title = "Des icônes de dossiers en couleur"
text = """
Les icônes du volet des dossiers ont désormais des couleurs qui disent
ce que contient chaque dossier : Non lus en bleu, Messages suivis en
jaune, Importants en ambre, Messages envoyés en vert, Spam en rouge, Brouillons
en violet, et Boîte de réception dans la couleur d’accentuation de
votre bureau. Les compteurs de messages tiennent dans de petites
pastilles discrètes.
"""

["2026-09-30-2040-tabs-no-slide"]
title = "Des onglets de Boîte de réception plus vifs"
text = """
Cliquer sur un onglet de la Boîte de réception le met désormais aussitôt
en surbrillance, avec la seule onde du clic, au lieu de faire glisser la
surbrillance par-dessus les autres onglets.
"""

["2026-10-01-0145-files-tidy"]
title = "Une page Fichiers plus nette"
text = """
Les compteurs à côté de chaque type de fichier et de chaque compte
tiennent désormais dans les mêmes petites pastilles que les compteurs
des dossiers dans Courrier. La ligne sous le titre de la page et les
lignes de fichiers commencent et finissent aussi aux mêmes bords.
"""

["2026-10-01-0147-today-marker-fits"]
title = "La date du jour tient dans son repère"
text = """
Dans la vue Mois du Calendrier, le repère d’aujourd’hui contient
désormais toute la date. Le 1er, il devient une pastille autour de
« 01 oct. » au lieu d’un petit cercle d’où le libellé débordait.
"""

["2026-10-01-0208-tab-counts-stay"]
title = "Les compteurs des onglets restent en place"
text = """
Ouvrir un onglet de la Boîte de réception ne fait plus sauter la barre
d’onglets. L’onglet ouvert garde son nombre de nouveaux messages, qui
passe lentement à un gris discret, et le compteur se replie en douceur
une fois que vous avez tout lu dans cet onglet.
"""

["2026-10-01-0225-files-keyboard"]
title = "Parcourez vos fichiers au clavier"
text = """
Sur la page Fichiers, les flèches passent désormais d’un fichier à
l’autre, Début et Fin vont au premier et au dernier, et Entrée en ouvre
un. Dans la visionneuse ouverte depuis là, les flèches passent au
fichier suivant de la page, quel que soit le message qui
l’accompagnait ; Maj et une flèche restent dans les pièces jointes du
même message.
"""

["2026-10-01-0254-files-dates"]
title = "Choisissez les jours sur la page Fichiers"
text = """
Le filtre de période de la page Fichiers ouvre désormais un calendrier
de deux mois avec des choix rapides comme La semaine dernière et Ce
mois-ci. Cliquez sur un jour, ou faites glisser d’un jour à un autre, et
les fichiers suivent pendant le glissement. Tournez ensuite la molette
de la souris sur le filtre pour décaler la même durée plus tôt ou plus
tard.
"""

["2026-10-01-0256-color-schemes"]
title = "Jeux de couleurs et couleurs d’accentuation"
text = """
Paramètres > Apparence propose désormais Mode, Couleurs et Accentuation
comme choix séparés. Choisissez clair ou sombre, puis l’un des 14 jeux
de couleurs, comme Clear, Nord, Solarized ou Catppuccin, ou gardez celui
de votre bureau. Chacun fonctionne en clair et en sombre, et n’importe
quelle couleur d’accentuation peut s’y ajouter.
"""

["2026-10-01-0310-badge-counts-what-notifies"]
title = "Le compteur de la barre des tâches suit vos notifications"
text = """
Le nombre de messages non lus sur la barre des tâches et dans la zone de
notification compte désormais les mêmes messages que ceux qui vous
notifient : l’onglet Principale de votre Boîte de réception. Promotions,
Réseaux sociaux, Notifications et Forums ne s’y ajoutent plus.
"""

["2026-10-01-0312-quiet-selected-row"]
title = "Un dossier ouvert plus discret"
text = """
Le dossier ouvert dans Courrier, et la vue ouverte dans Contacts,
Tâches, Notes et Fichiers, est désormais marqué d’un gris doux au lieu
de la couleur d’accentuation : Nouveau message et le rail des
applications ressortent, et les icônes de dossiers gardent leurs propres
couleurs.
"""

["2026-10-01-0315-desktop-schemes"]
title = "Les jeux de couleurs de votre bureau"
text = """
Paramètres > Apparence > Couleurs liste aussi les jeux propres à votre
bureau : chaque jeu de couleurs installé sur KDE Plasma, et sous Windows
ses propres couleurs et thèmes de contraste. Système fonctionne
désormais en clair et en sombre sur KDE aussi, en utilisant la version
claire ou sombre de votre jeu, et Katna suit la couleur d’accentuation
de Windows.
"""

["2026-10-01-0329-mute-folders"]
title = "Mettez en sourdine un dossier, un onglet ou un compte"
text = """
La cloche au-dessus de la liste met en sourdine le dossier ou l’onglet
de Boîte de réception ouvert pendant une heure, jusqu’à demain matin, ou
jusqu’à ce que vous la réactiviez. Faites un clic droit sur un dossier
ou un compte pour la même chose. Paramètres > Notifications montre
quels dossiers notifient et lesquels comptent sur la barre des tâches,
ainsi que tout ce qui est en sourdine.
"""

["2026-10-01-0335-tray-style"]
title = "Icône de la zone de notification en couleur ou monochrome"
text = """
Paramètres > Général > Bureau > Icône de la zone de notification en
couleur choisit les couleurs de Katna ou une seule couleur, comme les
autres icônes du tableau de bord. Une icône monochrome le reste avec des
messages non lus, et le nombre de non lus est toujours rouge. Sous
Linux, l’icône est monochrome par défaut ; sous Windows, elle est en
couleur.
"""

["2026-10-01-0354-mute-conversations"]
title = "Mettez en sourdine une conversation ou un expéditeur"
text = """
La cloche au-dessus d’une conversation ouverte la met en sourdine : les
nouvelles réponses ne vous notifient plus et ne s’ajoutent plus au
compteur de la barre des tâches, et une cloche barrée la signale dans
la liste. Faites un clic droit sur une conversation pour Mettre la
conversation en sourdine ou Mettre l’expéditeur en sourdine, ou appuyez
sur M.
"""

["2026-10-01-0410-your-color-schemes"]
title = "Créez votre propre jeu de couleurs"
text = """
Paramètres > Apparence > Couleurs > Personnaliser copie le jeu que vous
utilisez dans un éditeur : modifiez n’importe laquelle de ses huit
couleurs côté clair et côté sombre, voyez la fenêtre de courrier avec
elles, et Katna vous signale ce qui serait difficile à lire. Importer
accepte un fichier de jeu de couleurs Katna ou KDE, et un clic droit sur
votre jeu permet de le modifier, le dupliquer, l’exporter ou le
supprimer.
"""

["2026-10-01-0527-calendar-opens-on-week"]
title = "Le Calendrier s’ouvre sur la Semaine"
text = """
Katna Calendar s’ouvre de nouveau sur la vue Semaine, avec les jours à
venir heure par heure. Mois, Jour, Année et les autres sont à un clic
dans la barre du haut.
"""

["2026-10-01-0552-lighter-count-on-open-row"]
title = "Les compteurs ressortent sur le dossier ouvert"
text = """
Le compteur à côté du dossier ouvert dans Courrier, et à côté du type
ouvert dans Fichiers, tient désormais dans une pastille plus claire que
le gris de la ligne : il ne s’y fond plus, en clair comme en sombre.
"""

["2026-10-01-0652-files-leave-out-small-pictures"]
title = "Fichiers écarte les logos des signatures"
text = """
La page Fichiers ne se remplit plus des petits logos et icônes des
signatures de messages : les images de moins de 12 Ko, ou de moins de
100 pixels de large ou de haut, restent sous leur message. Modifiez ces
deux limites, ou affichez toutes les images, dans Paramètres >
Applications par défaut > Page Fichiers.
"""

["2026-10-01-0700-mute-from-contact"]
title = "Mettez un expéditeur en sourdine depuis sa fiche"
text = """
La fiche de contact à côté d’un message a une cloche en tête de ses
boutons : elle met en sourdine tout ce qui vient de cet expéditeur, et
une cloche barrée après son nom l’indique. Cliquez de nouveau dessus
pour recevoir à nouveau ses notifications.
"""

["2026-10-01-0803-select-hover-fits"]
title = "Un bouton de sélection plus net"
text = """
Le survol derrière la case de sélection en haut de la liste des messages
est désormais aussi haut que les boutons voisins, se tient aussi loin du
bord de la carte que de son haut, et ses coins suivent celui de la
carte.
"""

["2026-10-01-0807-files-leave-out-signature-pictures"]
title = "Fichiers écarte aussi les grandes images de signature"
text = """
Une image qu’une personne envoie dans trois conversations ou plus, comme
la bannière ou la photo de sa signature, n’apparaît plus sur la page
Fichiers, pas plus que les icônes de réseaux sociaux, quelle que soit
leur taille. Elles restent visibles sous leur message, et désactiver
« Exclure les petites images » les fait toutes revenir.
"""

["2026-10-01-0830-muted-contact-mark"]
title = "Voyez qui est en sourdine"
text = """
Une cloche barrée suit désormais le nom d’un expéditeur en sourdine
partout où il apparaît : la liste des messages, un message ouvert,
Contacts, les champs À et Cc et leurs suggestions, la page Fichiers, les
invités des événements et le rapport d’Activité. Plus besoin de vous
demander pourquoi ses messages restent silencieux.
"""

["2026-10-01-0839-sounds"]
title = "Des sons pour les nouveaux messages, les rappels et l’envoi"
text = """
Paramètres > Notifications a une section Sons : nouveau message,
rappels, message revenu dans la Boîte de réception, message envoyé et
message non envoyé choisissent chacun un son de votre bureau, le jouent
avec le bouton voisin, ou le désactivent. Les sons fonctionnent
désormais aussi sur KDE Plasma, et restent muets pour les messages en
sourdine et pendant Ne pas déranger.
"""

["2026-10-01-0925-chat-view"]
title = "Lisez les conversations comme des discussions (expérimental)"
text = """
Activez Paramètres > Expérimental > Conversations en mode discussion, et les
messages entre personnes se lisent comme une discussion de groupe : une
bulle par message avec seulement ce qui a été écrit, les vôtres à
droite, images et fichiers comme médias de discussion. Les citations et
les signatures attendent derrière ··· dans chaque bulle, et un clic sur
un nom affiche la fiche de la personne avec sa signature. Répondez
depuis le champ en bas, avec Ctrl+Enter, la barre de mise en forme
derrière Aa et le trombone pour les fichiers, les modèles et les
signatures. Les newsletters gardent l’affichage habituel, et le
sélecteur Discussion | Message bascule n’importe quelle conversation
dans un sens ou dans l’autre.
"""

["2026-10-01-0946-forward-keeps-files"]
title = "Transférer garde les fichiers"
text = """
Transférer un message emporte désormais ses pièces jointes, affichées
sous le message pour que vous puissiez retirer celles que vous voulez
avant l’envoi. Transformer le transfert en réponse les retire de
nouveau.
"""

["2026-10-01-1009-forward-a-file"]
title = "Transférez seulement le fichier"
text = """
La visionneuse de pièces jointes a un bouton Transférer dans sa barre du
haut : il commence un nouveau message avec seulement ce fichier joint,
sans le message qui l’accompagnait. Les fichiers sans aperçu proposent
aussi Transférer, tout comme les cartes de pièces jointes sous un
message ouvert, à côté d’Enregistrer.
"""

["2026-10-01-1039-rephrase-with-ai"]
title = "Reformuler avec l’IA"
text = """
Sélectionnez du texte dans un message et appuyez sur l’étincelle à côté,
ou sur Ctrl+J, pour le faire réécrire plus clair, plus court, plus
amical ou plus formel, puis Remplacer. Katna AI est gratuit pendant 30
jours, ou utilisez votre propre clé de Google Gemini, OpenAI, Claude,
Mistral, DeepSeek, OpenRouter ou un modèle sur cet ordinateur. L’IA peut
aussi terminer vos phrases en gris ; activez-la dans Paramètres >
Rédaction.
"""

["2026-10-01-1043-header-details-selectable"]
title = "Copiez depuis les détails d’un message"
text = """
Les détails sous « à moi » peuvent désormais être sélectionnés et copiés
comme le message lui-même. Cliquez sur une adresse pour voir la fiche de
cette personne à côté du message, ou faites un clic droit pour Copier
l’adresse. Les personnes en sourdine y affichent aussi leur cloche
barrée.
"""

["2026-10-01-1112-left-bar-button"]
title = "Un grand bouton, un repli, sur chaque page"
text = """
Le grand bouton en haut de la barre de gauche a désormais le même
aspect et la même place sur chaque page, et fait le travail propre à
cette page : Nouveau message dans Courrier et Fichiers, Nouvel
événement, Nouveau contact, Nouvelle tâche et Nouvelle note. Replier la
barre de gauche la replie partout, et pendant qu’elle est repliée, le
bouton de chaque page attend en haut du rail. Sur un téléphone, c’est
le bouton flottant.
"""

["2026-10-01-1115-color-picker"]
title = "Un sélecteur de couleur dans l’éditeur de jeux"
text = """
Cliquez sur une couleur dans l’éditeur de jeux de couleurs et un
sélecteur s’ouvre juste à côté : faites glisser sur le carré et la barre
de teinte, tapez une valeur hexadécimale, réutilisez les couleurs du jeu
ou vos choix récents, ou prenez une couleur n’importe où sur l’écran
avec la pipette sur KDE et GNOME.
"""

["2026-10-01-1130-contact-card-folds-folders"]
title = "La fiche de contact se fait de la place"
text = """
Dans une fenêtre trop étroite pour le volet des dossiers et la fiche de
contact côte à côte, la fiche replie désormais les dossiers à son
ouverture, et ils reviennent quand la fiche se ferme. Les dossiers que
vous repliez vous-même restent repliés.
"""

["2026-10-01-1132-open-mail-scroll-bar"]
title = "Une barre de défilement dans les longs messages"
text = """
Une longue conversation affiche désormais la même barre de défilement
discrète que la page Fichiers pendant que vous la faites défiler ou
pointez dessus. Les deux barres sont maintenant plus fines et
s’élargissent à l’approche du pointeur. Faites-en glisser une, ou
cliquez le long de celle-ci, pour sauter n’importe où.
"""

["2026-10-01-1240-contact-card-close"]
title = "Rangez la fiche de contact, voyez qui est dans une discussion"
text = """
La fiche de contact à côté d’une conversation a un ✕ dans son coin, et
cliquer de nouveau sur la photo ou l’adresse de la même personne range
la fiche. Dans la vue discussion, un clic sur l’en-tête liste tous les
participants avec leur adresse et le nombre de messages envoyés par
chacun.
"""

["2026-10-01-1241-two-blur-switches"]
title = "Le flou, à votre façon"
text = """
Le flou a désormais deux interrupteurs dans Paramètres, Expérimental :
un pour l’arrière-plan de la fenêtre et un pour les menus et les boîtes
de dialogue. Les menus dépolis sont activés par défaut, même quand
l’arrière-plan de la fenêtre reste opaque.
"""

["2026-10-01-1502-fainter-row-lines"]
title = "Des lignes plus discrètes entre les messages"
text = """
Les lignes entre les messages de la liste sont désormais plus pâles :
la liste se lit comme une seule colonne calme, en clair comme en
sombre.
"""

["2026-10-01-1505-contact-close-round"]
title = "Un seul bouton de fermeture pour tous les volets"
text = """
Le ✕ de la fiche de contact est désormais le même bouton rond que le ✕
