Échap ou Maj+Tab revient à la liste. F6 passe d’un volet à l’autre,
comme dans d’autres applications de messagerie.
"""

["2026-09-29-0258-folders-slide-open"]
title = "Les dossiers se déploient et se replient en douceur"
text = """
Un clic sur la flèche à côté d’un compte ou d’un dossier dans le volet
des dossiers déploie ou replie maintenant son contenu en douceur, les
