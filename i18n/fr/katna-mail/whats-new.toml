Les comptes Outlook.com, Hotmail et les autres comptes Microsoft
envoient désormais les fichiers dépassant la limite du courrier comme
les comptes Google : le fichier est placé dans votre OneDrive dès que
vous le joignez, et le message contient son lien, comme dans Outlook.
