прочитання або відстеженням відкриттів, а попередження — що лист
повернуто. Наведіть вказівник на позначку, щоб побачити, коли і як.
Листи-сповіщення лишаються у вашій поштовій скриньці в розділі
«Оновлення» й не показують спливних сповіщень.
"""

