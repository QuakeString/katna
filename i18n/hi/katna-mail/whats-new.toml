text = """
बाएँ रेल पर संपर्क अब आपके Gmail और Outlook खातों और CardDAV सर्वर में
सहेजे लोगों को दिखाता है, कई खातों में होने पर भी हर व्यक्ति एक ही बार,
लेबल, तस्वीरों और ब्योरे के साथ। उनके नाम और तस्वीरें आपके मेल और पते के
सुझावों में भी दिखते हैं।
"""

["2026-09-29-0350-katna-notes"]
title = "Katna नोट"
text = """
रेल पर नोट अब Katna नोट खोलता है, जो Google Keep की तरह बना है। नोट
या चेकलिस्ट लिखें, उसे रंग दें, सबसे ऊपर पिन करें, और आइटम सीधे
बोर्ड पर टिक करें। लिखते समय नोट सहेजे जाते हैं; खोज बॉक्स उन्हें
ढूंढता है; संग्रह और ट्रैश उन्हें रास्ते से हटा देते हैं, पूर्ववत
करने की सुविधा के साथ।
"""

["2026-09-29-0412-notes-sync"]
title = "हर डिवाइस पर नोट"
text = """
नोट अब आपके मेल खाते के Notes फ़ोल्डर में रहते हैं, जहां iPhone और Mac
के Notes अपने नोट रखते हैं, इसलिए वे आपके दूसरे डिवाइस तक पहुंचते हैं
और वहां से वापस भी आते हैं। नोट के नीचे खाते का नाम बताता है कि वह
