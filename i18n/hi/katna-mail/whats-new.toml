text = """
‘Katna के बारे में’ में “मुझे एक कॉफ़ी पिलाएँ” पर पॉइंटर रखें: वह कॉफ़ी
माँगता है, फिर चाय, पिज़्ज़ा, फिर कुछ भी नहीं, आख़िर में पानी पर मान
जाता है और कुछ चमक के साथ शुक्रिया कहता है। हर बार एक ही बार चलता है, और
मोशन कम करने की सेटिंग में स्थिर रहता है।
"""

["2026-09-29-0215-update-checking-bar"]
title = "ज़्यादा साफ़ अपडेट विंडो"
text = """
Katna अपडेट खोजता है तो एक चलती हुई पट्टी दिखती है, और नया संस्करण आपके
मौजूदा संस्करण के बगल में अपने अलग रंग में उभरकर दिखता है।
"""

["2026-09-29-0231-keys-beside-the-list"]
