title = "मिटाने से पहले पूछना"
text = """
एक साथ कई बातचीत मिटाने पर अब पहले पूछा जाता है कि उन्हें ट्रैश में ले
जाना है या नहीं। सवाल छोड़ने के लिए “फिर से न पूछें” पर टिक करें, या
सेटिंग > सामान्य में इसे फिर से चालू करें। ट्रैश में हमेशा के लिए मिटाने पर
हमेशा पूछा जाता है।
"""

["2026-09-28-0019-katna-for-windows"]
title = "Windows के लिए Katna"
text = """
Katna Mail अब Windows 10 और 11 पर भी चलता है। यह अपने खुद के Katna Setup से
इंस्टॉल होता है, और इसमें ट्रे आइकॉन, सूचनाएं, लॉग इन करने पर शुरू होना और
Katna में खुलने वाले मेल लिंक शामिल हैं।
"""

["2026-09-28-0236-chip-remove-always"]
title = "हर पते पर हटाने का बटन"
text = """
पाने वाले, Cc और Bcc में हर पते का चिप अब हमेशा अपना x दिखाता है, ताकि आप
पहले उस पर पॉइंटर ले जाए बिना उसे हटा सकें।
"""

["2026-09-28-0244-pill-format-bar"]
title = "ज़्यादा गोल फ़ॉर्मैटिंग बार"
text = """
मेल लिखते समय दिखने वाला फ़ॉर्मैटिंग बार (Aa) अब हल्के किनारे वाले कैप्सूल
के आकार का है, ताकि वह लाइट और डार्क दोनों थीम में आपके टेक्स्ट से अलग दिखे।
"""

["2026-09-28-0325-long-threads-smooth"]
title = "लंबे ईमेल थ्रेड जल्दी खुलते हैं"
text = """
कई पुराने जवाबों को कोट करने वाला फ़ॉर्मैट किया हुआ मेल, जैसे कोटेशन का लंबा
थ्रेड, अब पूरी विंडो को धीमा करने के बजाय तुरंत खुलता है और आसानी से स्क्रॉल
होता है।
"""

["2026-09-28-0830-who-has-seen-it"]
title = "किसने देखा, एक आंख के पीछे"
text = """
ट्रैकिंग के साथ भेजे गए मेल के ऊपर अब पंक्तियों वाला बॉक्स नहीं होता। स्टार
के पास की आंख किसी के इसे खोलते ही आपके एक्सेंट कलर में बदल जाती है; किसने
इसे खोला या कोई लिंक खोला, और कब, यह देखने के लिए उस पर पॉइंटर रोकें।
"""

["2026-09-28-0831-contact-call-copy"]
title = "संपर्क की जानकारी से कॉल और कॉपी"
text = """
बातचीत के पास वाली संपर्क की जानकारी में, फ़ोन नंबर पर क्लिक करके उसे अपने
फ़ोन ऐप या KDE Connect से कॉल करें, या उसके पास वाले कॉपी बटन का इस्तेमाल
करें। पैनल का सारा टेक्स्ट अब चुना और कॉपी भी किया जा सकता है।
"""

["2026-09-28-0848-quoted-text-hide-remove"]
title = "जवाब में कोट किया गया मेल छिपाएं या हटाएं"
text = """
जवाब के नीचे वाला “...” बटन अब खोलने के बाद कोट किए गए मेल को फिर से छिपा
देता है। कोट किए गए मेल को अपने जवाब से निकालने के लिए उस पर पॉइंटर रोकें और
उसके कोने के x पर क्लिक करें; “पहले जैसा करें” या Ctrl+Z उसे वापस ले आता है।
स्क्रॉल करते समय जवाब का टूलबार भी अपनी जगह पर बना रहता है।
"""

["2026-09-28-0854-floating-folders"]
title = "तैरते फ़ोल्डर और ज़्यादा चौड़ी खोज"
text = """
फ़ोल्डर छिपे होने पर, “लिखें” या “मेल” पर पॉइंटर रोकने से वे एक पैनल के रूप
में खुलते हैं जो किनारों से दूर रहता है, और एक छोटी नोक बटन की ओर इशारा करती
है। खोज बॉक्स फ़ोल्डरों की छोड़ी हुई जगह भरने के लिए बढ़ जाता है, और जिस
फ़ोल्डर में आप पहले से हैं उस पर क्लिक करने से अब सूची झपकती नहीं है।
"""

["2026-09-28-0928-search-address-suggestions"]
title = "खोज विकल्प में पतों के सुझाव"
text = """
खोज विकल्प में “भेजने वाला” और “पाने वाला” अब टाइप करते समय पते सुझाते हैं,
ठीक वैसे ही जैसे मेल लिखते समय पाने वाले, Cc और Bcc सुझाते हैं। Enter, Tab
या क्लिक से कोई एक चुनें।
"""

["2026-09-28-0935-app-menu-reply-all-window"]
title = "खाता कार्ड में मुख्य मेन्यू, सभी को जवाब अपनी विंडो में"
text = """
खाता कार्ड में “खाते प्रबंधित करें” के पास एक ☰ बटन है। यह वही फ़ाइल,
संपादन, देखें, जाएं, मैसेज, सेटिंग और सहायता मेन्यू खोलता है जो डेस्कटॉप के
ग्लोबल मेन्यू में होते हैं, उन डेस्कटॉप के लिए जो ग्लोबल मेन्यू नहीं दिखाते।
नए मेल की सूचना पर “सभी को जवाब दें” अब बातचीत को उसकी अपनी विंडो में, टाइप
करने के लिए तैयार, खोलता है और मुख्य विंडो को जहां है वहीं छोड़ देता है।
"""

["2026-09-28-1011-tray-brings-window-forward"]
title = "ट्रे और सूचना पर क्लिक करने से Katna Mail सामने आता है"
text = """
ट्रे आइकन पर, या उसके मेन्यू में “इनबॉक्स खोलें”, “नया मैसेज” या “सेटिंग” पर
क्लिक करने से अब Wayland पर Katna Mail की विंडो सामने आ जाती है, भले ही वह
छोटी की गई हो या दूसरी विंडो के पीछे हो। नए मेल की सूचना पर क्लिक करने से वह
मेल खुलता है, भले ही इनबॉक्स की सूची में वह न दिख रहा हो।
"""

["2026-09-28-1053-send-countdown-reply-in-place"]
title = "भेजने की उलटी गिनती, और आपका जवाब बातचीत में ही रहता है"
text = """
“भेजें” के बाद, “पहले जैसा करें” के पास एक सिकुड़ता घेरा पहले जैसा करने का समय
गिनता है, फिर मेल चले जाने पर नोट में “मैसेज भेजा गया” दिखता है (एक छोटी-सी
आवाज़ के साथ)। यह आवाज़ सेटिंग > सामान्य > भेजना में बंद की जा सकती है। बातचीत
में लिखा गया जवाब ठीक उसी जगह मैसेज बन जाता है जहां आपने उसे लिखा था। उसके
ऊपरी हिस्से में सिर्फ़ यह दिखता है कि वह किसे जा रहा है; “भेजने वाला”, “पाने
वाले”, Cc और Bcc के लिए उस पर क्लिक करें। जवाब आइकन के पास वाला तीर “जवाब
दें”, “सभी को जवाब दें” और “फ़ॉरवर्ड करें” के बीच बदलता है, और आपका लिखा हुआ
बना रहता है।
"""

["2026-09-28-1110-search-options-narrow"]
title = "खोज विकल्प संकरी विंडो में भी ठीक से दिखते हैं"
text = """
संकरी या छोटी विंडो में “खोज विकल्प” अब उपलब्ध जगह के हिसाब से चौड़े होते
हैं, फ़ोन पर लेबल अपने फ़ील्ड के ऊपर दिखाते हैं और जगह कम होने पर स्क्रॉल
होते हैं, ताकि “खोजें” बटन हमेशा पहुंच में रहे।
"""

["2026-09-28-1119-replies-from-right-account"]
title = "जवाब सही खाते से जाते हैं"
text = """
एकीकृत इनबॉक्स या खोज से खोले गए मेल पर “जवाब दें” या “फ़ॉरवर्ड करें” अब उसी
खाते से जाता है जिस पर मेल आया था, न कि आपकी प्रोफ़ाइल तस्वीर के नीचे चुने
गए खाते से।
"""

["2026-09-28-1436-calmer-search-box"]
title = "खोज अपना शॉर्टकट दिखाती है"
text = """
खोज बॉक्स “मेल खोजें” के पास अपना कीबोर्ड शॉर्टकट दिखाता है, जैसा सेटिंग >
शॉर्टकट में तय है। उसमें क्लिक करने पर वह अपना रंग बनाए रखता है और गहरा होकर
छाया दिखाने के बजाय हल्का-सा किनारा दिखाता है। सूची के ऊपर तैरते फ़ोल्डर अब
नीचे के किनारे से भी दूर रहते हैं।
"""

["2026-09-28-1450-clear-activity"]
title = "गतिविधि को साफ़-सुथरा रखें"
text = """
गतिविधि में किसी खोले जाने या क्लिक पर पॉइंटर ले जाएं और उसे सूची से हटाने
के लिए × दबाएं, या नए सिरे से शुरू करने के लिए “सभी हटाएं” दबाएं। नए खोले जाने
और क्लिक फिर भी दिखते हैं, और “विवरण” रिपोर्ट अब भी सब कुछ गिनती है।
"""

["2026-09-28-1541-round-logo"]
title = "Katna का नया गोल लोगो"
text = """
Katna का अब एक नया लोगो है: टील रंग के गोले पर एक स्क्रिप्ट “k”, जो ऐप
मेन्यू, ऊपरी बार और टास्कबार में दिखता है। ट्रे इसे उस एक रंग में दिखाता
है जो आपके पैनल से मेल खाता है, और “Katna के बारे में” व स्वागत पेज पूरा
“katna mail” दिखाते हैं।
"""

["2026-09-28-1546-contact-cards"]
title = "एक ज़्यादा साफ़ संपर्क पैनल"
text = """
संपर्क पैनल अब हर हिस्से को अपने अलग नरम कार्ड पर दिखाता है, नाम के नीचे
गोल बटन के साथ जिनसे उस व्यक्ति को मेल भेजें, उनका मेल खोजें या उन्हें
कॉल करें। हाल की बातचीत में सबसे नई कुछ बातचीत दिखती हैं; बाकी देखने के
लिए ज़्यादा दबाएं और उन्हें समेटने के लिए कम दबाएं।
"""

["2026-09-28-1507-reply-box-recipients"]
title = "एक ज़्यादा सुथरा जवाब बॉक्स"
text = """
पाने वाले अब अपनी तस्वीरों के साथ दिखते हैं, और Cc व Bcc एक छोटे बटन में
साथ रहते हैं। जवाब के पाने वालों को खोलने पर बॉक्स आराम से ऊपर की ओर
बड़ा होता है, और कोट किया गया मेल एक लहरदार रेखा के नीचे आराम से
खुलता-बंद होता है जिस पर क्लिक करके आप उसे फिर से समेट सकते हैं।
"""

["2026-09-28-1620-softer-window-shadow"]
title = "एक नरम विंडो परछाईं और KDE आकार के बटन"
text = """
Katna विंडो फ़्रेम के साथ, विंडो के चारों ओर की परछाईं अब ज़्यादा कसी
हुई है और पूरी तरह मिट जाती है, उस सख़्त किनारे के बिना जो वह पहले
विंडो के बगल में छोड़ जाती थी। विंडो के बटन अब KDE के अपने बटनों के
बराबर आकार के हैं, और विंडो के किनारे से उतनी ही दूरी पर रहते हैं
जितनी उसके ऊपर से।
"""

["2026-09-28-1622-update-from-the-app"]
title = "ऐप से ही Katna को अपडेट करें"
text = """
Katna अब अपने आप नए संस्करण डाउनलोड करता है और तैयार होने पर आपको
बताता है। सूचना में या “Katna के बारे में” में अपडेट दबाएं: Katna
Mail बताता है कि वह रीस्टार्ट होगा, आपका पासवर्ड मांगता है, अपडेट
इंस्टॉल करता है और वहीं से फिर खुलता है जहाँ आपने छोड़ा था। सेटिंग >
सामान्य > अपडेट अपने आप डाउनलोड होना बंद कर देता है।
"""

["2026-09-28-1520-track-sealed-and-plain"]
title = "हस्ताक्षरित, एन्क्रिप्ट किए गए और सादे टेक्स्ट मेल को ट्रैक करें"
text = """
अब आँख हस्ताक्षरित और एन्क्रिप्ट किए गए मेल पर भी काम करती है: हर पाने
वाले की कॉपी अलग से हस्ताक्षरित या एन्क्रिप्ट की जाती है, इसलिए हस्ताक्षर
मान्य रहते हैं। सादा टेक्स्ट मेल खोलना नहीं दिखा सकता, लेकिन उसके लिंक
ट्रैक होते हैं, इसलिए आप देखते हैं कि कोई कब कोई लिंक खोलता है।
"""

["2026-09-28-1834-reply-after-closed-window"]
title = "संदेश की विंडो बंद करने के बाद जवाब नया शुरू होता है"
text = """
अपनी अलग विंडो में लिखा संदेश बंद करने पर अब वह ड्राफ़्ट में रहता है, और
जवाब दें, सभी को जवाब दें व फ़ॉरवर्ड करें फिर से नया संदेश खोलते हैं,
पुराना वापस नहीं लाते।
"""

["2026-09-28-1852-frosted-search-bar"]
title = "धुंधली सर्च बार"
text = """
धुंधला बैकग्राउंड चालू होने पर सर्च बार आसपास की बार की तरह धुंधलापन
आर-पार दिखने देती है, ठोस स्लेटी गोली की तरह उस पर बैठी नहीं रहती।
"""

["2026-09-28-1906-scroll-to-switch-accounts"]
title = "खाता बदलने के लिए अपनी तस्वीर पर स्क्रोल करें"
text = """
पॉइंटर को ऊपर दाईं ओर खाते की तस्वीर पर रखकर माउस का व्हील घुमाएं तो
अगले या पिछले खाते पर पहुंचते हैं, हर क्लिक पर एक खाता। तस्वीर नए खाते
पर घूम जाती है, जैसे ऐप बदलने पर ऐप का नाम घूमता है, और कार्ड से खाता
चुनने पर भी वह इसी तरह घूमती है।
"""

["2026-09-28-1918-many-recipients"]
title = "कई पाने वालों के लिए जगह"
text = """
पहली पंक्ति के बाद के पाने वाले अब पूरी चौड़ाई इस्तेमाल करते हैं, और
