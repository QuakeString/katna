["2026-09-28-2130-update-dialog"]
title = "अपडेट की अपनी विंडो"
text = """
सहायता > अपडेट जाँचें एक अलग विंडो खोलता है। इसमें आपका संस्करण नए
संस्करण के बगल में दिखता है, साथ में दोनों के बनने का समय और डाउनलोड का
आकार, अपडेट में नया क्या है और आपके संस्करण के बाद के सभी बदलाव।
