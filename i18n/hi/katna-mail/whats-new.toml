["2026-09-28-2204-faster-start"]
title = "तेज़ शुरुआत, सहज सिंक"
text = """
Katna Mail बड़ा इनबॉक्स लगभग एक चौथाई तेज़ी से खोलता है, और मेल डाउनलोड
होते समय सूची को हर कुछ संदेशों के बाद नहीं, बल्कि हर बैच में एक बार
अपडेट करता है, इसलिए सिंक के दौरान स्क्रॉल और टाइपिंग सहज रहती है।
"""

["2026-09-28-2111-link-addresses"]
title = "देखें कि लिंक कहाँ जाता है"
text = """
किसी मैसेज में लिंक पर पॉइंटर रखें, तो लिंक के टेक्स्ट में चाहे
कुछ भी लिखा हो, वह असल में जो पता खोलता है वह रीडिंग पेन के नीचे
दिखता है, और साइट का नाम अलग से उभरा हुआ रहता है। जिस भेजने वाले
की इमेज आप हमेशा दिखाते हैं, उसकी इमेज अब तभी लोड होती हैं जब
आपका मेल प्रोवाइडर पुष्टि करता है कि मैसेज सच में उसी से आया है।
"""

["2026-09-29-0120-update-build-details"]
title = "आपके बिल्ड की और जानकारी"
text = """
अपडेट विंडो अब हर संस्करण का नवीनतम बदलाव बताती है, यह भी कि
आपकी कॉपी कहाँ से आई और Katna ने अपडेट की आखिरी बार कब जाँच
की।
"""

["2026-09-29-0213-coffee-button-play"]
