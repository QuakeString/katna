कंप्यूटर पर रखें।
"""

["2026-09-29-0451-add-mail-to-tasks"]
title = "मेल को टास्क में जोड़ें"
text = """
Gmail की तरह Shift+T दबाएं, या किसी मेल पर राइट-क्लिक करके टास्क में
जोड़ें चुनें। टास्क मेल का विषय लेता है, और टास्क में उसका मेल चिप
उसी मेल को फिर खोल देता है।
"""

["2026-09-29-0412-calendar"]
title = "आपका कैलेंडर, आपके मेल के बगल में"
text = """
कैलेंडर आपके Google, Microsoft और अन्य कैलेंडर को दिन, सप्ताह, महीने या
शेड्यूल के रूप में दिखाता है, Google Calendar के शॉर्टकट के साथ। मेल के
दाईं ओर कैलेंडर बटन दिन का एजेंडा खोलता है, कॉल के लिए शामिल हों के साथ।
Katna को किसी खाते का कैलेंडर पढ़ने देने के लिए उसमें फिर से साइन इन
करें।
"""

["2026-09-29-0442-contacts-edit"]
title = "संपर्क बनाएं और बदलें"
text = """
संपर्क पेज पर संपर्क बनाएं आपके चुने हुए खाते में किसी को जोड़ता है, और
संपर्क के पेज पर बदलाव करें से भी वहीं बदलाव हो जाता है। मिटाएं के साथ
