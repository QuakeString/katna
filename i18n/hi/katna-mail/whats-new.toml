text = """
Ctrl+4 दबाएं या बाईं ओर टास्क चुनें: Google Tasks की तरह हर सूची
अगल-बगल, सबटास्क, तारे, नियत दिन, दोहराव और ब्योरे के साथ। सूचियां
Google Tasks और Microsoft To Do से सिंक होती हैं, और डेस्कटॉप घड़ी
के टास्क भी यहां दिखते हैं।
"""

["2026-09-29-0352-contacts"]
