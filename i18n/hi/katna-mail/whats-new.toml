text = """
बातचीत सूची के बगल में खुली हो, तो ऊपर और नीचे तीर अब सूची में चलते हैं
और हर बातचीत दिखाते हैं। Tab या Enter बातचीत में ले जाता है, जहाँ ऊपर और
नीचे तीर उसे स्क्रॉल करते हैं; Esc या Shift+Tab वापस सूची में ले आता है।
