संपर्कों को कुछ समय तक अपने ट्रैश में रखते हैं।
"""

["2026-09-29-0538-notes-on-mail"]
title = "मेल पर नोट"
text = """
किसी मेल पर राइट-क्लिक करें या उसका ⋮ मेन्यू खोलें और नोट जोड़ें
चुनें: मेल के ऊपर विषय के नाम वाला एक नोट खुलता है। उस मेल को दोबारा
खोलने पर उसके नोट विषय के नीचे दिखते हैं, और नोट का मेल चिप आपको वापस
मेल तक ले जाता है।
"""

["2026-09-29-0542-caldav-tasks"]
title = "अपने मेल सर्वर पर टास्क"
text = """
पासवर्ड से साइन इन करने वाले खाते अब, जब मेल सर्वर CalDAV देता है, अपने
टास्क उसी सर्वर पर रखते हैं, इसलिए टास्क सर्वर के अपने ऐप में और फ़ोन पर
भी दिखते हैं।
