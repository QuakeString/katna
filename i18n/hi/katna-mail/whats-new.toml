text = """
फ़ोल्डर पेन में किसी खाते या फ़ोल्डर के बगल के तीर पर क्लिक करने पर उसके
अंदर की चीज़ें अब झटके से नहीं, बल्कि सरककर खुलती या बंद होती हैं, और
नीचे के फ़ोल्डर साथ-साथ खिसकते हैं।
"""

["2026-09-29-0301-keys-menus-dialogs"]
title = "फ़ोल्डर, मेन्यू और डायलॉग कीबोर्ड से"
text = """
Shift+Tab या F6 से फ़ोल्डर पेन तक पहुँचें, जहाँ ऊपर और नीचे तीर हर
फ़ोल्डर खोलते हैं और Enter उसके मेल पर ले जाता है। ऊपर और नीचे तीर किसी
भी मेन्यू में चलते हैं, और Enter चुनता है। Shift+F10 या मेन्यू कुंजी
चुने हुए मेल का राइट-क्लिक मेन्यू खोलती है। डायलॉग खुलते ही कुंजियाँ ले
लेते हैं: Enter जवाब देता है, Esc रद्द करता है, और Tab उनके अंदर ही रहता
है। नए मैसेज में Ctrl+Enter किसी भी फ़ील्ड से भेजता है और Esc उसे बंद
करता है, ड्राफ़्ट बचाकर।
"""

