text = """
घड़ी पर क्लिक करके टास्क जोड़ें और पूरे हुए टास्क पर निशान लगाएँ। Plasma
में घड़ी पर राइट-क्लिक करें और Katna डिजिटल घड़ी चुनने के लिए विकल्प
दिखाएँ चुनें। GNOME में अगली बार साइन-इन करने पर घड़ी के कैलेंडर के नीचे
टास्क कार्ड दिखता है।
"""

["2026-09-29-0329-pages-by-keyboard"]
title = "कीबोर्ड से और टास्कबार से पेज"
text = """
Ctrl+1 से Ctrl+5 मेल, कैलेंडर, संपर्क, टास्क और नोट के बीच बदलते हैं,
जैसे Outlook में, और जाएं मेन्यू में भी ये दिखते हैं। टास्कबार पर Katna
Mail पर राइट-क्लिक करके कैलेंडर या संपर्क सीधे खोलें।
"""

["2026-09-29-0412-tasks-page"]
