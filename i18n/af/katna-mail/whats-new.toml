"""

["2026-09-30-0159-checkbox-matches-icons"]
title = "Merkblokkies gelyk met die ikone"
text = """
Merkblokkies is 'n bietjie kleiner, so groot soos die ster- en etiketikone
langsaan in die e-poslys. Hulle is net so maklik om te klik, en die
regmerkie teken homself steeds in.
"""

["2026-09-30-0201-zoho-calendars"]
title = "Zoho-kalenders oor Zoho se eie verbinding"
text = """
Zoho bedien kalenders aan ander toepassings op 'n poort wat baie
netwerke blokkeer, dus lees Kalender hulle ná Meld aan met Zoho eerder
