'n Rekening byvoeg begin met jou verskaffer: Google, Yahoo, iCloud, Zoho, Fastmail, GMX, Yandex of enige ander. Katna sê eers wat die verskaffer nodig het, wys elke stap terwyl dit verbind, en eindig met wat dit opgestel het. POP3-rekeninge werk ook, en Instellings > Rekeninge kies hoe lank hul e-pos op die bediener bly.
