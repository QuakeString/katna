["2026-10-07-0505-follow-ups-in-chats"]
title = "Opvolge in Kletsaansig"
text = """
In Kletsaansig wys 'n opvolg wat wag om uit te gaan as 'n flou borrel aan die einde van die klets, met Wysig, Stuur nou en Stop. Om een te stel, regsklik op Stuur of hou dit in en kies Volg op as niemand antwoord nie.
"""

["2026-10-07-0603-remind-me"]
title = "Herinner my oor enige e-pos"
