"""

["2026-09-30-0843-calendar-side-panel-menus"]
title = "Bestuur kalenders vanuit die sypaneel"
text = """
Regsklik op 'n kalender in die Kalender se sypaneel om net dit te wys, sy kleur te verander, dit te hernoem of uit te vee. Regsklik op 'n rekening se naam om 'n nuwe kalender in daardie rekening te maak of al sy kalenders te wys en te versteek. Veranderinge gaan na jou e-posdiens, sodat hulle oral wys waar jy dit gebruik.
"""

["2026-09-30-1010-unread-list-keeps-open-mail"]
title = "Ongelese e-pos bly oop"
text = """
'n Gesprek oopmaak in Alle rekeninge > Ongelees maak dit nie meer dadelik toe nie. As jy dit lees, word dit as gelees gemerk, en dit bly in die lys totdat jy dit toemaak of 'n ander een oopmaak.
"""

["2026-09-30-1045-tracked-mail-arrives"]
title = "Gevolgde e-pos kom weer aan"
text = """
E-pos wat met naspoor aan gestuur is, kon in Gestuur wys sonder om iemand te bereik. Dit gaan nou na elke ontvanger. E-pos wat so verlore gegaan het, moet weer gestuur word.
"""

["2026-09-30-1114-no-checking-pill"]
title = "Geen kontrole-pil meer nie"
text = """
"Kyk tans vir nuwe e-pos…" spring nie meer oor die lys op nie. Die draaiende pyle op die herlaaiknoppie en op elke rekening se inkassie wys reeds dat e-pos nagegaan word, en 'n mislukte kontrole sê steeds wat verkeerd geloop het.
"""

["2026-09-30-1300-windows-sign-in-and-domains"]
title = "Meld met Google aan op Windows"
text = """
Katna vir Windows bied nou Meld aan met Google en Zoho, soos op Linux, en weet wie e-pos op jou eie domein huisves, soos 'n Google Workspace-adres, wanneer jy die rekening byvoeg.
"""

["2026-09-30-1511-mail-tables"]
title = "Tabelle in e-pos lees reg"
text = """
Tabelle in e-pos, soos die taaklys in 'n GitHub Actions-kennisgewing, hou hul kolomme langs mekaar en lyn hulle van ry tot ry op, in plaas daarvan om 'n opskrif een letter per reël te breek. Skeidingslyne tussen dele van 'n boodskap wys nou ook.
"""

["2026-09-30-1550-taller-important-marker"]
title = "Hoër Belangrik-merker"
text = """
Die Belangrik-merker langs die ster is 2 px hoër, sodat dit nie meer platgedruk lyk langs die ster en merkblokkie nie. Dit bly in die middel van die ry.
"""

["2026-09-30-1617-folder-click-goes-to-top"]
title = "Terug na bo in die lys"
text = """
Sodra die e-poslys 'n skerm af is, neem 'n ronde knoppie regs onder dit terug na bo. 'n Klik op die vouer waarin jy reeds is, soos Inkassie, doen dieselfde, soos in Gmail, en Home ook.
"""

["2026-09-30-1622-send-from-file-manager"]
title = "Stuur lêers uit jou lêerbestuurder"
text = """
Regsklik op lêers of vouers in Dolphin, GNOME Files of Windows Explorer en kies Stuur met Katna Mail: 'n nuwe boodskap maak oop met hulle aangeheg, en 'n vouer gaan as 'n zip. Met meer as een e-posrekening kies jy in sy subkieslys die een om van te stuur.
"""

["2026-09-30-1624-files-page"]
title = "Elke lêer op een plek"
text = """
Die nuwe Lêers-bladsy, onderaan die programbalk, wys elke aanhegsel van elke rekening, nuutste eerste. Beperk dit tot prente, PDF's of dokumente, tot een rekening, tot 'n persoon of 'n tyd, of soek volgens naam, sender of onderwerp. Regsklik op 'n lêer vir meer, en Wys die e-pos neem jou na die e-pos waarmee dit gekom het.
"""

["2026-09-30-1643-dimmer-row-markers"]
title = "Kalmer e-poslys"
text = """
'n Leë merkblokkie, ster of Belangrik-merker in die e-poslys is dowwer totdat die wyser oor sy ry is. Sterre en merkers wat gestel is, hou hul kleur.
"""

["2026-09-30-1704-folder-arrows-on-hover"]
title = "Netjieser vouerpaneel"
text = """
Die klein pyltjies langs Inkassie, Gester en die ander vouers wys net terwyl die wyser oor daardie vouer is. 'n Vouer wat jy oopgemaak het, hou sy pyltjie.
"""

["2026-09-30-1712-arrow-keys-in-times"]
title = "Pyltjiesleutels in tydblokkies"
text = """
In Kies datum en tyd, en in 'n taak se tyd, verander Op en Af die deel waarin die wyser is: die uur, die minute of vm./nm.
"""

["2026-09-30-1742-check-one-folder"]
title = "Kyk een vouer vir nuwe e-pos na"
text = """
"Kyk vir nuwe e-pos" in 'n vouer se regsklikkieslys gaan nou net daardie vouer na, so dit is vinnig. Op 'n rekening se inkassie onder Alle rekeninge gaan dit daardie rekening se inkassie na, en op 'n lys soos Inkassie of Gestuur onder Alle rekeninge gaan dit daardie vouer in elke rekening na.
"""

["2026-09-30-1742-frosted-viewer"]
title = "'n Ligter, matglas-kyker"
text = """
Die aanhegselkyker se boonste balk is skraler en ligter, en bladsy, zoem en draai sit op 'n pil. Rondom die lêer wys Katna Mail vaag onder 'n sagte donker sluier, en die nutsbalke is ook matglas. Die vaagheid volg Instellings > Eksperimenteel; daarsonder gebruik die kyker 'n gewone donker sluier.
"""

["2026-09-30-1752-touchpad-glide"]
title = "Raakpaneel-vee gly voort"
text = """
'n Vinnige twee-vinger-vee op 'n raakpaneel hou aan rol en word stadiger, soos in ander programme. Raak weer aan die raakpaneel om dit te stop. Op Wayland.
"""

["2026-09-30-1800-inbox-tabs-in-top-row"]
title = "Inkassie-oortjies in die boonste ry"
text = """
Primêr, Promosies, Sosiaal en die ander inkassie-oortjies sit nou in 'n pilbalk in die lys se boonste ry, elk met 'n gekleurde telling van sy ongelese e-pos. Die uitlig gly na die oortjie wat jy kies, en 'n klik op die oop oortjie neem sy lys terug na bo. Wanneer die lys smal is, kry die balk sy eie ry en wys ikone, terwyl die oop oortjie sy naam hou; op 'n foon sit dit in die lys se balk, met Herlaai in die Meer-kieslys.
"""

["2026-09-30-1805-account-menu"]
title = "Rekeninginligting in die regsklikkieslys"
text = """
Regsklik op 'n rekening se naam in die vouerlys, of sy inkassie onder Alle rekeninge, om sy adres te sien, of dit gesinkroniseer is en wanneer laas nagegaan, en hoeveel berging dit gebruik. Van daar kan jy daardie inkassie nagaan, 'n nuwe e-pos van daardie rekening skryf, sy instellings oopmaak, of weer aanmeld wanneer die aanmelding verval het.
"""

["2026-09-30-1819-glass-search-box"]
title = "'n Glas-soekblokkie"
text = """
Met die vaag agtergrond aan is die soekblokkie matglas met 'n dowwe rand terwyl jy dit nie gebruik nie, en word dit solied wanneer jy daarin klik om te tik.
"""

["2026-09-30-1820-search-cancel-restores"]
title = "Kanselleer 'n soektog, kry jou e-pos terug"
text = """
Escape of die soekblokkie skoonmaak gaan nou terug na waar jy was: dieselfde vouer, dieselfde plek in die lys en die e-pos wat jy oop gehad het. Maak eerder 'n resultaat oop en die soektog neem soos voorheen oor.
"""

["2026-09-30-1840-first-run-window"]
title = "'n Vriendeliker eerste begin"
text = """
Terwyl jy Katna Mail opstel, wys die venster agter die opstelblaaie onder 'n ligte sluier: die programme, Skryf en die soekblokkie, met sagte plekhouers waar jou vouers en e-pos sal verskyn. 'n Nuwe stap bied 'n Katna-rekening aan en lys wat dit aanskakel (leesbewyse, skakelnaspoor, Aktiwiteit en vertaling), of jy kan dit oorslaan.
"""

["2026-09-30-1850-windows-frame-and-blur"]
title = "Katna se raam en vaagheid op Windows"
text = """
Op Windows maak Katna Mail nou binne die skerm oop, gemaksimeer wanneer die skerm klein is. Instellings > Eksperimenteel kan vervaag wat agter die venster is, en Katna se eie raam maak die boonste balk die titelbalk die volgende keer dat jy Katna Mail oopmaak.
"""

["2026-09-30-1851-dark-depth"]
title = "Makliker om in donker kleure te sien"
text = """
In donker kleure is dinge wat oor die e-poslys sweef nou 'n tint ligter met 'n dowwe ligte rand, aangesien skaduwees skaars op 'n donker agtergrond wys. Die Terug na bo-knoppie, kieslyste, die Skryf-venster en dialoë staan duidelik uit. Ligte kleure lyk soos voorheen.
"""

["2026-09-30-1911-files-scrollbar"]
title = "'n Rolstaaf op die Lêers-bladsy"
text = """
Wanneer daar meer lêers is as wat pas, wys 'n dun rolstaaf regs terwyl jy rol of terwyl die wyser oor die lêers is, en vervaag dan. Sleep dit om vinnig deur die lêers te beweeg, of klik bo of onder dit om daarheen te spring.
"""

["2026-09-30-1919-tabs-keep-open-mail"]
title = "Oortjies wissel hou die oop e-pos"
text = """
Met die leesvenster langs die lys maak 'n ander inkassie-oortjie kies nie meer die e-pos toe wat jy lees nie; die lys verander en die e-pos bly oop.
"""

["2026-09-30-1925-inbox-tabs-centred"]
title = "Inkassie-oortjies in die middel"
text = """
Die inkassie-oortjies sit nou in die middel van die lys se boonste ry en skuif net so ver opsy as wat sy knoppies nodig het.
"""

["2026-09-30-1945-page-box-arrow-keys"]
title = "Pyltjiesleutels in die bladsyblokkie"
text = """
Klik in 'n PDF op die bladsynommer en druk Op of Af om 'n bladsy terug of vorentoe te gaan. Hou die sleutel in om vinnig deur bladsye te blaai.
"""

["2026-09-30-1952-phone-bar-labels"]
title = "Programname op 'n foon volg jou instelling"
text = """
Met programname afgeskakel in Instellings wys die balk onderaan 'n foongrootte-venster nou net die ikone, gesentreer, soos die syrelling doen.
"""

["2026-09-30-1955-account-menu-icons"]
title = "Instellings en taal in die rekeningkieslys"
text = """
Die kieslys onder jou rekeningprent maak nou oop met 'n ry ikone: maak Instellings oop of verander die taal. Die taalvlag het die boonste balk verlaat om plek te maak.
"""

["2026-09-30-2001-phone-tabs-fold"]
title = "Elke inkassie-oortjie bly binne bereik"
text = """
Wanneer die venster smal is, vou die inkassie-oortjies glad in plaas daarvan om te verdwyn: name word groter ikone, dan staan die tellings opsy. Op 'n foon versprei die oortjies oor die hele balk, maklik om op te tik, met Meer aan die einde van dieselfde pil.
"""

["2026-09-30-2012-fit-and-page-arrows"]
title = "Pas, bladsypyle en meer in die kyker"
text = """
Die aanhegselkyker het 'n Pas-knoppie: 'n PDF-bladsy pas by die venster se hoogte, 'n prent by die venster, en dokumente, skyfies en sigblaaie by sy breedte. Prente kry ook Werklike grootte en kan gedraai word. Wys na die bladsyblokkie vir klein pyltjies om 'n bladsy terug of vorentoe te gaan, en skyfies kry hul eie blokkie.
"""

["2026-09-30-2019-folder-icon-colours"]
title = "Kleurvolle vouerikone"
text = """
Die vouerpaneel se ikone het nou kleure wat sê wat elke vouer bevat: Ongelees blou, Gester geel, Belangrik amber, Gestuur groen, Strooipos rooi, Konsepte pers, en Inkassie in jou werkskerm se aksentkleur. E-postellings sit in klein, dowwe pille.
"""

["2026-09-30-2040-tabs-no-slide"]
title = "Vinniger inkassie-oortjies"
text = """
'n Klik op 'n inkassie-oortjie lig dit nou dadelik uit, met net die klik se rimpeling, in plaas daarvan om die uitlig oor die ander oortjies te laat gly.
"""

["2026-10-01-0145-files-tidy"]
title = "'n Netjieser Lêers-bladsy"
text = """
Die tellings langs elke soort lêer en elke rekening sit nou in dieselfde klein pille as die vouertellings in E-pos. Die lyn onder die bladsy se titel en die rye lêers begin en eindig ook by dieselfde rande.
"""

["2026-10-01-0147-today-marker-fits"]
title = "Vandag se datum pas in sy merker"
text = """
In die Kalender se Maand-aansig hou vandag se merker nou die hele datum. Op die 1ste word dit 'n pil om "01 Okt" in plaas van 'n klein sirkeltjie waaruit die etiket gemors het.
"""

["2026-10-01-0208-tab-counts-stay"]
title = "Oortjietellings bly staan"
text = """
'n Inkassie-oortjie oopmaak laat nie meer die oortjiebalk spring nie. Die oop oortjie hou sy telling van nuwe e-pos, wat stadig na 'n stil grys verdof, en die telling vou glad weg sodra jy alles in daardie oortjie gelees het.
"""

["2026-10-01-0225-files-keyboard"]
title = "Beweeg met die sleutelbord deur jou lêers"
text = """
Op die Lêers-bladsy beweeg die pyltjiesleutels nou tussen lêers, Home en End gaan na die eerste en laaste, en Enter maak een oop. In die kyker wat van daar oopgemaak is, gaan die pyltjies voort na die volgende lêer op die bladsy, met watter e-pos dit ook al gekom het; Shift en 'n pyltjie bly by die aanhegsels van dieselfde e-pos.
"""

["2026-10-01-0254-files-dates"]
title = "Kies die dae op die Lêers-bladsy"
text = """
Die tydskyfie op die Lêers-bladsy maak nou 'n kalender van twee maande oop met vinnige keuses soos Verlede week en Hierdie maand. Klik op 'n dag, of sleep van een dag na 'n ander, en die lêers volg terwyl jy sleep. Draai dan die muiswiel oor die skyfie om dieselfde tydsduur vroeër of later te skuif.
"""

["2026-10-01-0256-color-schemes"]
title = "Kleurskemas en aksentkleure"
text = """
Instellings > Voorkoms het nou Modus, Kleure en Aksent as aparte keuses. Kies lig of donker, dan enige van 14 kleurskemas, soos Clear, Nord, Solarized of Catppuccin, of hou jou werkskerm s'n. Elkeen werk in lig en donker, en enige aksentkleur kan bo-op gaan.
"""

["2026-10-01-0310-badge-counts-what-notifies"]
title = "Die taakbalktelling pas by jou kennisgewings"
text = """
Die ongelees-telling op die taakbalk en stelselbalk tel nou dieselfde e-pos wat jou in kennis stel: jou Inkassie se Primêr-oortjie. Promosies, Sosiaal, Opdaterings en Forums tel nie meer daarby nie.
"""

["2026-10-01-0312-quiet-selected-row"]
title = "'n Stiller oop vouer"
text = """
Die oop vouer in E-pos, en die oop aansig in Kontakte, Take, Notas en Lêers, word nou in 'n sagte grys gemerk in plaas van die aksentkleur, sodat Skryf en die programrelling uitstaan en die vouerikone hul eie kleure hou.
"""

["2026-10-01-0315-desktop-schemes"]
title = "Jou werkskerm se kleurskemas"
text = """
Instellings > Voorkoms > Kleure lys ook jou werkskerm se eie skemas: elke kleurskema wat op KDE Plasma geïnstalleer is, en op Windows sy eie kleure en Kontras-temas. Stelsel werk nou ook op KDE in lig en donker, met die ligte of donker maat van jou skema, en Katna volg Windows se aksentkleur.
"""

["2026-10-01-0329-mute-folders"]
title = "Demp 'n vouer, 'n oortjie of 'n rekening"
text = """
Die klokkie bo die lys demp die oop vouer of Inkassie-oortjie vir 'n uur, tot môreoggend, of totdat jy dit weer aanskakel. Regsklik op 'n vouer of 'n rekening vir dieselfde. Instellings › Kennisgewings wys watter vouers kennisgewings gee en watter op die taakbalk tel, en alles wat gedemp is.
"""

["2026-10-01-0335-tray-style"]
title = "Stelselbalkikoon in kleur of een kleur"
text = """
Instellings > Algemeen > Werkskerm > Stelselbalkikoon in kleur kies Katna se kleure of een kleur soos die paneel se ander ikone. Een kleur bly een kleur met ongelese e-pos, en die ongelees-telling is altyd rooi. Op Linux is die stelselbalkikoon by verstek een kleur; op Windows is dit in kleur.
"""

["2026-10-01-0354-mute-conversations"]
title = "Demp 'n gesprek of 'n sender"
text = """
Die klokkie bo 'n oop gesprek demp dit: nuwe antwoorde stel jou nie meer in kennis nie en tel nie by die taakbalktelling nie, en 'n deurgestreepte klokkie merk dit in die lys. Regsklik op 'n gesprek vir Demp gesprek of Demp sender, of druk M.
"""

["2026-10-01-0410-your-color-schemes"]
title = "Maak jou eie kleurskema"
text = """
Instellings > Voorkoms > Kleure > Pas aan kopieer die skema wat jy gebruik na 'n redigeerder: verander enige van sy agt kleure aan die ligte en die donker kant, sien die e-posvenster daarin, en Katna sê vir jou wat moeilik leesbaar sou wees. Voer in neem 'n Katna- of KDE-kleurskemalêer, en 'n regsklik op jou skema wysig, dupliseer, voer uit of vee dit uit.
"""

["2026-10-01-0527-calendar-opens-on-week"]
title = "Die Kalender maak op Week oop"
text = """
Katna Calendar maak weer op die Week-aansig oop, met die dae vorentoe in ure. Maand, Dag, Jaar en die ander is een klik weg in die boonste balk.
"""

["2026-10-01-0552-lighter-count-on-open-row"]
title = "Tellings staan uit op die oop vouer"
text = """
Die telling langs die oop vouer in E-pos, en langs die oop soort in Lêers, sit nou in 'n pil wat ligter is as die grys van die reël, sodat dit nie meer daarin wegsink nie, in lig en donker.
"""

["2026-10-01-0652-files-leave-out-small-pictures"]
title = "Lêers laat handtekeninglogo's weg"
text = """
Die Lêers-bladsy loop nie meer vol met die klein logo's en ikone wat in e-poshandtekeninge kom nie: prente onder 12 KB, of onder 100 pixels breed of hoog, bly onder hul e-pos. Verander albei grense, of wys elke prent, in Instellings > Verstekprogramme > Lêers-bladsy.
"""

["2026-10-01-0700-mute-from-contact"]
title = "Demp 'n sender vanaf hul kontakkaart"
text = """
Die kontakkaart langs 'n e-pos het 'n klokkie eerste onder sy knoppies: dit demp alles van daardie sender, en 'n deurgestreepte klokkie ná hul naam wys dit. Klik weer daarop om weer van hulle te hoor.
"""

["2026-10-01-0803-select-hover-fits"]
title = "'n Netjieser kies-knoppie"
text = """
Die sweef-agtergrond agter die kies-merkblokkie bo-aan die e-poslys is nou so hoog soos die knoppies langsaan, sit so ver van die kaart se rand as van sy bokant, en sy hoeke volg die kaart se eie hoek.
"""

["2026-10-01-0807-files-leave-out-signature-pictures"]
title = "Lêers laat ook groot handtekeningprente weg"
text = """
'n Prent wat iemand in drie of meer gesprekke stuur, soos die banier of foto in hul handtekening, wys nie meer op die Lêers-bladsy nie, en ook nie sosiale-netwerk-ikone nie, hoe groot ook al. Hulle wys steeds onder hul e-pos, en om "Laat klein prente weg" af te skakel bring hulle almal terug.
"""

["2026-10-01-0830-muted-contact-mark"]
title = "Sien wie gedemp is"
text = """
'n Deurgestreepte klokkie volg nou 'n gedempte sender se naam oral waar hulle wys: die e-poslys, 'n oop e-pos, Kontakte, die Aan- en Cc-blokkies en hul voorstelle, die Lêers-bladsy, geleentheidsgaste en die Aktiwiteit-verslag. Jy hoef nie meer te wonder hoekom hul e-pos stil bly nie.
"""

["2026-10-01-0839-sounds"]
title = "Klanke vir nuwe e-pos, herinneringe en stuur"
text = """
Instellings > Kennisgewings het 'n Klanke-afdeling: nuwe e-pos, herinneringe, e-pos terug in die inkassie, e-pos gestuur en e-pos nie gestuur nie kies elk 'n klank van jou werkskerm, speel dit met die knoppie langsaan, of skakel dit af. Klanke speel nou ook op KDE Plasma, en bly stil vir gedempte e-pos en tydens Moenie steur nie.
"""

["2026-10-01-0925-chat-view"]
title = "Lees gesprekke as klets (eksperimenteel)"
text = """
Skakel Instellings > Eksperimenteel > Gesprekke as kletse aan en e-pos tussen mense lees soos 'n groepklets: 'n borrel vir elke e-pos met net wat geskryf is, jou eie regs, prente en lêers as kletsmedia. Die aangehaalde e-pos en handtekeninge wag agter ··· in elke borrel, en 'n klik op 'n naam wys hul kaart met hul handtekening. Antwoord uit die blokkie onderaan, met Ctrl+Enter, die formateringsbalk agter Aa en die skuifspeld vir lêers, sjablone en handtekeninge. Nuusbriewe hou die gewone aansig, en die Klets | E-pos-skakelaar draai enige gesprek na enige kant.
"""

["2026-10-01-0946-forward-keeps-files"]
title = "Stuur aan hou die lêers"
text = """
As jy 'n boodskap aanstuur, kom sy aanhegsels nou saam, gewys onder die boodskap sodat jy enigeen kan afhaal voor jy stuur. As jy die aanstuur na 'n antwoord verander, word hulle weer weggelaat.
"""

["2026-10-01-1009-forward-a-file"]
title = "Stuur net die lêer aan"
text = """
Die aanhegselkyker het 'n Stuur aan-knoppie in sy boonste balk: dit begin 'n nuwe e-pos met net daardie lêer aangeheg, sonder die e-pos waarmee dit gekom het. Lêers sonder 'n voorskou bied ook Stuur aan, en so ook die aanhegselkaarte onder 'n oop e-pos, langs Stoor.
"""

["2026-10-01-1039-rephrase-with-ai"]
title = "Herformuleer met KI"
text = """
Kies teks in 'n boodskap en druk die vonkel langsaan, of Ctrl+J, om dit duideliker, korter, vriendeliker of formeler te laat herskryf, en dan Vervang. Katna AI is 30 dae gratis, of gebruik jou eie sleutel van Google Gemini, OpenAI, Claude, Mistral, DeepSeek, OpenRouter of 'n model op hierdie rekenaar. KI kan ook jou sinne in grys klaarmaak; skakel dit aan in Instellings > Skryf.
"""

["2026-10-01-1043-header-details-selectable"]
title = "Kopieer uit 'n e-pos se besonderhede"
text = """
Die besonderhede onder "aan my" kan nou gekies en gekopieer word soos die e-pos self. Klik op 'n adres om daardie persoon se kaart langs die e-pos te sien, of regsklik daarop vir Kopieer adres. Gedempte mense wys ook daar hul deurgestreepte klokkie.
"""

["2026-10-01-1112-left-bar-button"]
title = "Een groot knoppie, een invou, op elke bladsy"
text = """
Die groot knoppie bo-aan die linkerbalk lyk en sit nou dieselfde op elke bladsy en doen daardie bladsy se eie werk: Skryf in E-pos en Lêers, Nuwe geleentheid, Nuwe kontak, Nuwe taak en Nuwe nota. Om die linkerbalk in te vou, vou dit oral in, en terwyl dit ingevou is, wag elke bladsy se knoppie bo-aan die relling. Op 'n foon is dit die swewende knoppie.
"""

["2026-10-01-1115-color-picker"]
title = "'n Kleurkieser in die skemaredigeerder"
text = """
Klik op 'n kleur in die skemaredigeerder en 'n kieser maak reg langsaan oop: sleep oor die vierkant en die kleurtoonbalk, tik 'n hekswaarde, hergebruik die skema se eie kleure of onlangse keuses, of neem 'n kleur van enige plek op die skerm met die druppelaar op KDE en GNOME.
"""

["2026-10-01-1130-contact-card-folds-folders"]
title = "Kontakkaart maak sy eie plek"
text = """
In 'n venster te smal vir die vouerpaneel en die kontakkaart langs mekaar, vou die kaart nou die vouers weg wanneer dit oopmaak, en hulle kom terug wanneer die kaart toemaak. Vouers wat jy self invou, bly ingevou.
"""

["2026-10-01-1132-open-mail-scroll-bar"]
title = "'n Rolstaaf in lang e-posse"
text = """
'n Lang gesprek wys nou dieselfde stil rolstaaf as die Lêers-bladsy terwyl jy daardeur rol of daarna wys. Albei stawe is nou dunner en groei soos die wyser nader kom. Sleep een, of klik daarlangs, om enige plek heen te spring.
"""

["2026-10-01-1240-contact-card-close"]
title = "Bêre die kontakkaart, sien wie in 'n klets is"
text = """
Die kontakkaart langs 'n gesprek het 'n ✕ in sy hoek, en om weer op dieselfde persoon se prent of adres te klik, bêre die kaart. In die kletsaansig lys 'n klik op die kop almal in die klets met hul adres en hoeveel e-posse elkeen gestuur het.
"""

["2026-10-01-1241-two-blur-switches"]
title = "Vaagheid, soos jy wil"
text = """
Vaagheid het nou twee skakelaars in Instellings, Eksperimenteel: een vir die vensteragtergrond en een vir kieslyste en dialoë. Matglas-kieslyste is by verstek aan, selfs met die vensteragtergrond solied gelaat.
"""

["2026-10-01-1502-fainter-row-lines"]
title = "Stiller lyne tussen e-posse"
text = """
Die lyne tussen e-posse in die lys is nou dowwer, sodat die lys as een kalm kolom lees, in lig en donker.
"""

["2026-10-01-1505-contact-close-round"]
title = "Een toemaakknoppie vir elke paneel"
text = """
Die ✕ op die kontakkaart is nou dieselfde ronde knoppie as die ✕ op die oop e-pos, met dieselfde grys sirkel wanneer jy daarna wys.
"""

["2026-10-01-1525-thread-count"]
title = "'n Netjieser e-postelling"
text = """
Die aantal e-posse in 'n gesprek sit nou langs die name met 'n klein kletsikoon, gesentreer op die name se reël in plaas daarvan om daarbo uit te steek.
"""

["2026-10-01-1541-chat-attach-from-files"]
title = "Heg aan uit Lêers in 'n klets"
text = """
In 'n klets (Instellings > Eksperimenteel) het die skuifspeld Uit Lêers: kies enige lêer wat met jou e-pos gekom of gegaan het, met hierdie gesprek s'n eerste. Merk 'n paar, kyk na een met die oog, en sien hoe hulle opweeg teen die 25 MB wat 'n e-pos kan dra. Die skuifspeld sit nou binne die antwoordblokkie, en Aa maak 'n skraal balk oop met net die style wat 'n klets nodig het.
"""

["2026-10-01-1553-rephrase-card-text"]
title = "Herformuleer werk met nuwe Gemini-sleutels"
text = """
Met matglas-kieslyste aan het die Herformuleer-kaart (Ctrl+J) leeg oopgemaak; sy voorstelle wys nou oor die matglas. Google Gemini gebruik nou gemini-3.5-flash-lite tensy jy 'n ander model tik, aangesien nuwe Gemini-sleutels nie meer 2.5 Flash-Lite kan gebruik nie, en 'n verkeerde sleutel sê so.
"""

["2026-10-01-1624-rephrase-button"]
title = "Herformuleer sonder om te kies, en vinniger voorstelle"
text = """
'n Vonkel langs Formatering onderaan 'n nuwe boodskap, en in die kletsaansig se antwoordblokkie, herformuleer alles wat jy geskryf het wanneer niks gekies is nie, of net die keuse wanneer daar een is; Ctrl+J doen dieselfde. Langer voorstelle met KI kom baie gouer, en die Model-veld in Instellings > Skryf lys die modelle wat jou diens bied terwyl jy tik.
"""

["2026-10-01-1626-dimmer-preview"]
title = "'n Stiller voorskoureël"
text = """
Die voorskouteks onder elke e-pos se onderwerp in die lys is nou dowwer, sodat die sender en onderwerp uitstaan, in lig en donker.
"""

["2026-10-01-1645-frosted-dialogs"]
title = "Matglas-dialoë"
text = """
