Hou in die aanhegselkyker Ctrl in en draai die muiswiel om rondom die wyser in en uit te zoem, of knyp op 'n raakpaneel. Dit werk vir PDF's, prente, tekslêers, sigblaaie en dokumente.
"""

["2026-09-30-0817-event-open-the-mail"]
title = "Maak die e-pos agter 'n geleentheid oop"
text = """
