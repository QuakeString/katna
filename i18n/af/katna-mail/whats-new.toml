["2026-10-02-1340-logo-and-custom-accent"]
title = "Die logo kry jou kleure, en enige aksent wat jy wil"
text = """
Die Katna-logo in die venster dra nou jou aksentkleur, in lig en in donker. En Instellings > Voorkoms > Aksent eindig nou in 'n kleurwiel: klik daarop om enige aksent te kies wat jy wil.
"""

["2026-10-02-1358-empty-reply-no-draft"]
title = "Leë antwoorde laat geen konsep nie"
text = """
'n Antwoord waarin jy geklik het maar nooit geskryf het nie, in die kletsblokkie of onder 'n e-pos, maak nou eenvoudig toe wanneer jy dit verlaat. Dit hou geen konsep nie en kom nie terug wanneer jy tussen Klets en E-pos wissel nie.
"""

["2026-10-02-1400-folder-right-click-selects"]
title = "Regsklik maak die vouer oop"
text = """
As jy op 'n vouer in die vouerpaneel regsklik, word dit nou gekies en oopgemaak voordat sy kieslys wys, sodat die kieslys duidelik op die vouer werk wat jy sien.
"""

["2026-10-02-1405-viewer-arrows-hover"]
title = "Kyker se pyltjies bly sigbaar"
text = """
Die pyltjies aan die kante van die aanhegselkyker vervaag nie meer tot amper wit wanneer jy na hulle wys nie. Hulle word eerder 'n skakering ligter grys, sodat hulle maklik oor 'n wit bladsy te sien bly.
"""

["2026-10-02-1432-account-colour-button"]
title = "Een kleurknoppie per rekening"
text = """
Elke rekening wys nou net sy eie kleur, op 'n Kleur-knoppie in Instellings > Rekeninge en op die rekening se regsklikkieslys. Klik daarop om een van agt kleure of enige eie kleur te kies, net daar waar jy geklik het.
"""

["2026-10-02-1443-reply-at-the-end"]
title = "Jou antwoord bly aan die einde"
text = """
'n Antwoord sit nou altyd aan die einde van die gesprek, selfs as die nuutste e-pos eerste gewys word. As jy van Klets na E-pos wissel, rol dit af daarheen, met die wyser waar jy dit gelos het.
"""

["2026-10-02-1451-card-shows-signer"]
title = "Die kaart wys wie die oop e-pos onderteken het"
text = """
Die persoonkaart lees nou die handtekening van die e-pos wat jy oop het, nie net die nuutste een nie. Wanneer 'n kollega e-pos van 'n gedeelde adres soos accounts@ onderteken, wys die kaart hul naam, rol, foon en die maatskappy se adres uit daardie e-pos.
"""

["2026-10-02-1510-search-click-away"]
title = "Klik enige plek om die soekkassie te verlaat"
text = """
As jy op die leë spasie in die boonste balk langs die soekkassie klik, neem dit jou nou uit die kassie, net soos 'n klik op die e-poslys. Jou soektog bly soos dit is.
"""

["2026-10-02-1513-dark-pages"]
title = "Donker bladsye in die kyker"
text = """
In donker modus het die aanhegselkyker 'n halfmaanknoppie wat helder PDF's, dokumente, skyfies, sigblaaie en tekslêers donker wys. Kleure behou hul tint, foto's binne 'n bladsy word gedemp eerder as om negatiewe te word, en geskandeerde papier word donker soos teks. Katna onthou jou keuse vir die volgende lêer.
"""

["2026-10-02-1515-empty-message-no-draft"]
title = "Geen leë konsepte nie"
text = """
'n Nuwe boodskap wat jy weer leeggemaak het voordat jy dit toegemaak het, bly nie meer in Konsepte nie, net soos 'n leë antwoord in 'n gesprek.
"""

["2026-10-02-1522-window-corners"]
title = "Kies jou venster se hoeke en rand"
text = """
Met Katna se eie titelbalk het Instellings > Eksperimenteel nou 'n Hoekrondheid-skuifbalk, van vierkantig tot rond, en 'n Rand-skakelaar met sy eie ondeursigtigheid. Met Eie vervagingsterkte aan, stel die Ondeursigtigheid-skuifbalk nou ook hoeveel 'n vervaagde vensteragtergrond deurlaat.
"""

["2026-10-02-1535-ctrl-shift-click-select"]
title = "Kies e-pos met Ctrl en Shift"
text = """
Ctrl+klik op 'n e-pos in die lys om dit te kies, en Ctrl+klik op nog om hulle by te voeg. Shift+klik kies elke e-pos vanaf die laaste een waarop jy geklik het. Om 'n e-pos in sy eie venster oop te maak, regsklik daarop en kies Maak oop in nuwe venster.
"""

["2026-10-02-1610-frosted-panes"]
title = "Matglaspanele, klets en soek"
text = """
Met Vervaag die vensteragtergrond aan, laat die e-poslys, die oop e-pos en die persoonkaart nou ook die vervaging deur, met 'n Paneelondeursigtigheid-skuifbalk. Die ruimte agter 'n klets se borrels wys 'n bietjie meer daarvan, en die soekblokkie bly matglas terwyl jy tik. Elkeen het sy eie skakelaar in Instellings > Eksperimenteel.
"""

["2026-10-02-1618-fainter-hints"]
title = "Flouer wenke in leë blokkies"
text = """
Die grys wenk in 'n leë blokkie, soos "Antwoord aan…" onder 'n klets of "Soek e-pos", is nou flouer, sodat dit nooit lyk soos teks wat jy getik het nie.
"""

["2026-10-02-1642-drag-from-empty-space"]
title = "Skuif die venster vanaf leë spasie"
text = """
Op Linux kan jy nou die venster skuif deur enige leë spasie in die linkerbalk, die vouers of die balk bo jou e-pos te sleep, nie net die boonste balk nie.
"""

["2026-10-02-1643-space-folds-folders"]
title = "Spasie vou vouers"
text = """
Klik op 'n vouer wat vouers binne-in het, en druk dan Spasie om dit oop of toe te vou, net soos 'n klik op sy pyltjie. Ná 'n klik beweeg die pyltjiesleutels ook deur die vouerpaneel, en Tab gaan aan na die e-poslys.
"""

["2026-10-02-1646-viewer-more-menu"]
title = "Kykerkontroles pas in smal vensters"
text = """
In 'n smal venster bly die kontroles onderaan die aanhegselkyker nou daarbinne. Knoppies wat nie pas nie, skuif na 'n ⋮ Meer-kieslys: eers draai, dan Pas, dan Donker bladsye. Die bladsynommer en zoem bly die langste in sig.
"""

["2026-10-02-1743-activity-report-fits"]
title = "Aktiwiteitsverslag pas in die venster"
text = """
Die Aktiwiteitsverslag bly nou binne die venster met gelyke kantlyne, en rol wanneer die venster kort is, sodat sy laaste rye nooit afgesny word nie.
"""

["2026-10-02-1846-folders-and-labels"]
title = "Hernoem, vee uit en sleep na vouers"
text = """
Regsklik op 'n vouer wat jy gemaak het om dit te hernoem of uit te vee; uitvee skuif eers sy e-pos na Asblik. Sleep e-pos uit die lys op 'n vouer om dit daarheen te skuif. Skuif na het 'n soekblokkie: tik om 'n vouer te vind, of om 'n nuwe een te skep en die e-pos daarin te skuif. Op Gmail sit Etiketteer as etikette op e-pos en haal hulle af, en e-pos wat jy op 'n etiket laat val, kry daardie etiket.
"""

["2026-10-02-1928-mail-rules"]
title = "E-posreëls"
text = """
Reëls sorteer nuwe e-pos vanself: volgens sender, onderwerp of woorde skuif, etiketteer, ster, stuur aan of demp hulle dit. Maak een in Instellings > Vouers en reëls, of regsklik op 'n e-pos en kies Maak 'n reël…, en sien met hoeveel onlangse e-posse dit ooreenstem voordat jy stoor. Merk in Skuif na "Skuif altyd e-pos van … hierheen" om 'n sender se e-pos en hul toekomstige e-pos met een klik te skuif.
"""

["2026-10-02-2017-rules-on-the-server"]
title = "Reëls wat werk terwyl jou rekenaar af is"
text = """
E-posreëls werk nou op Gmail, of op jou e-posbediener wanneer dit Sieve-reëls aanvaar, sodat hulle e-pos ook op jou foon sorteer en terwyl hierdie rekenaar af is. Instellings > Vouers en reëls wys waar elke reël werk, en hoekom een in Katna bly.
"""

["2026-10-03-0046-smooth-folded-tabs"]
title = "Ingevoude oortjies wissel glad"
text = """
Wanneer 'n smal venster die inkassie-oortjies tot ikone invou, spring dit nie meer wanneer jy oortjies wissel nie: die oortjie wat jy verlaat, krimp terug na sy ikoon terwyl sy naam wegvervaag, en die een wat jy oopmaak, groei terwyl sy naam invervaag.
"""

["2026-10-03-0051-read-rows-frosted"]
title = "Gelese e-pos is ook matglas"
text = """
Met matglaspanele aan, wys e-pos wat jy gelees het nou die matglas agter die lys soos ongelese e-pos, net 'n skakering anders, in plaas van 'n soliede band.
"""

["2026-10-03-0101-rounder-corners"]
title = "Ronder vensterhoeke"
text = """
Hoekrondheid in Instellings > Eksperimenteel gaan nou tot 32 pixels, twee keer so rond as voorheen, en jy kan die getal in die blokkie langs die skuifbalk tik.
"""

["2026-10-03-0113-viewer-round-corners"]
title = "Kyker volg geronde vensterhoeke"
text = """
Met Katna se eie titelbalk en geronde hoeke rond die aanhegselkyker nou sy onderste hoeke af om by die venster te pas, in plaas van vierkantige grys hoeke verby die venster se rand te wys.
"""

["2026-10-03-0147-chat-go-down"]
title = "Terug na die nuutste e-pos"
text = """
As jy ver op in 'n klets gerol het, vervaag 'n ronde knoppie regs onder in. Dit gly jou terug na die nuutste e-pos en tel enige wat intussen gekom het.
"""

["2026-10-03-0147-chat-long-mails"]
title = "Lang e-posse in kletse"
text = """
Op 'n lang borrel bly die sender se prent onderaan wat jy sien, en die antwoord-, vasspeld- en meer-knoppies bly in die deel wat in sig is. Regsklik op die teks om almal te bereik.
"""

["2026-10-03-0147-chat-scroll-bar"]
title = "'n Rolbalk in kletse"
text = """
Kletse het dieselfde stil rolbalk as 'n oop e-pos, wat wys terwyl die wyser oor hulle is.
"""

["2026-10-03-0147-chat-translate"]
title = "Vertaal in kletse"
text = """
'n E-pos in 'n ander taal bied ook in die klets sy vertaling aan, soos in E-pos. Regsklik op enige borrel en kies Vertaal om dit self te vertaal, en weer om die oorspronklike te wys.
"""

["2026-10-03-0150-search-pill-hovers"]
title = "Egalige sweefeffekte in die foon se soekbalk"
text = """
Op 'n foon sit die vouersknoppie en jou rekeningprent nou gesentreer in die soekbalk se geronde punte, en elke knoppie in die balk het dieselfde ronde sweefeffek, eweredig van die balk se rand gespasieer.
"""

["2026-10-03-0159-starter-rules"]
title = "Beginreëls"
text = """
Instellings > Vouers en reëls bied nou klaargemaakte reëls, afgeskakel: demp promosies, nuusbriewe na Lees, kwitansies, aflewerings, trein- en vliegkaartjies (IRCTC, Air India, IndiGo en meer), eenmalige kodes, sekuriteitswaarskuwings, sosiale e-pos en kalenderuitnodigings. Skakel een aan en dit werk vir al jou rekeninge, en maak vouers soos Reis wanneer nodig. Reëls kan ook die inkassie-oortjie nagaan en of e-pos van 'n poslys gekom het.
"""

["2026-10-03-0200-chat-file-hover"]
title = "Sagter lêerkaarte in kletse"
text = """
'n Lêer in 'n kletsborrel word nie meer donker onder die wyser nie. Dit lig 'n bietjie met 'n flou tint, en sy naam bly maklik om te lees.
"""

["2026-10-03-0210-opened-mail-stays-in-view"]
title = "Die e-pos wat jy oopmaak, bly in sig"
text = """
Met die leespaneel langs die lys bly die e-pos waarop jy klik waar dit in die lys was terwyl die paneel oopgaan, of die lys rol net genoeg om dit heeltemal te wys. Dit glip nie meer uit sig nie, of jy dit uit die lys of uit soekresultate oopgemaak het.
"""

["2026-10-03-0212-about-header-stays"]
title = "Meer oor hou sy opskrif in sig"
