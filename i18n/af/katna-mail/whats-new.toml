Met Enkripteer aan word 'n ontvanger sonder 'n sleutel opgesoek in die sleutelgids van hul eie domein wanneer jy stuur. E-pos wat jy stuur, dra jou publieke sleutel (Autocrypt) wanneer GnuPG een vir jou adres het, en sleutels wat op dieselfde manier aankom, word gebruik om jou antwoorde te enkripteer. Geënkripteerde OpenPGP-e-pos versteek nou sy onderwerp totdat dit oopgemaak word.
