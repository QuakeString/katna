title = "Kontakbesonderhede langs jou e-pos"
text = """
In 'n breë venster wys 'n kaart langs die oop gesprek nou die afsender:
hul foon, titel en maatskappy uit hul handtekeninge, hul tyd van die dag,
hoeveel e-pos julle uitgeruil het, julle onlangse gesprekke en die lêers
tussen julle. Klik op 'n gesprek of 'n lêer om dit oop te maak, of op 'n
ander persoon in die gesprek om hulle te sien. Dit word net uit jou e-pos
op hierdie rekenaar gelees. Die kontakknoppie op die leesvenster se
nutsbalk versteek dit.
"""

["2026-09-27-1640-storage-used"]
title = "Berging gebruik"
text = """
Die voet van die vouerpaneel wys hoe vol die rekening se e-posberging is,
soos “34% van 15 GB gebruik”, wanneer sy e-posbediener dit meedeel.
"""

["2026-09-27-1651-desktop-search"]
title = "Vind e-pos vanuit KRunner en GNOME-soektog"
text = """
Tik 'n naam in KRunner (Alt+Space) of die Aktiwiteite-soektog om aan
daardie persoon te skryf, hul adres te kopieer of hul e-pos te vind.
Boodskappe verskyn wanneer hul onderwerp of sender elke woord bevat wat jy
tik; begin met mail: om al jou e-pos te deursoek, soos in Katna Mail se
soekveld.
"""

["2026-09-27-1727-mail-templates"]
title = "Sjablone vir e-pos wat jy gereeld skryf"
text = """
Skryf 'n boodskap een keer en stoor dit met die nuwe Sjablone-knoppie in
die skryfvenster, en plaas dit dan met een klik in enige nuwe e-pos of
antwoord. Skryf {first name}, {name} of {my name} en Katna vul dit vir
elke ontvanger in. Wysig, hernoem of vee sjablone uit in Instellings >
Skryf.
"""

["2026-09-27-1724-server-send-later"]
title = "Geskeduleerde e-pos gaan uit met jou rekenaar af"
text = """
Wanneer jou e-posbediener e-pos tot 'n vasgestelde tyd kan hou, soos
Stalwart kan, gee Skeduleer stuur die boodskap nou aan hom sodra Ontdoen
weg is, sodat dit betyds uitgaan selfs as hierdie rekenaar af is. Die
skeduleerkieslys sê of jou e-posbediener of Katna dit sal stuur.
"""

["2026-09-27-1730-softer-row-hover"]
title = "'n Ligter sweefeffek"
text = """
Die reël onder die wyser in die e-poslys lig nou op met 'n dowwe skaduwee,
soos in Gmail, in plaas van 'n donker band daaronder.
"""

["2026-09-27-1745-drag-recipients"]
title = "Sleep adresse tussen Aan, Cc en Bcc"
text = """
Sleep 'n adresskyfie na 'n ander veld om dit te skuif; Cc en Bcc gaan oop
terwyl jy sleep, selfs as hulle versteek is. As jy na 'n skyfie wys,
verskyn 'n x wat dit verwyder.
"""

["2026-09-27-1722-katna-account"]
title = "Katna-rekening"
text = """
Instellings > Intekening laat jou 'n rekening op Katna se eie bediener
skep, met sy eie wagwoord, nooit 'n e-poswagwoord nie. Katna se aanlyn
funksies, soos leesbewyse en skakelnasporing, sal dit nodig hê. Jy kan die
aangemelde rekenaars sien en enigeen van hulle afmeld.
"""

["2026-09-27-1805-reopens-as-you-left-it"]
title = "Terug waar jy was"
text = """
As jy Katna Mail toemaak en weer oopmaak, kom die toep, die vouer en die
inkassie-oortjie wat jy oop gehad het terug, asook die vouers wat jy
oopgemaak het en of die vouerpaneel ingevou was. As jy Katna uit die
stelselbalk afsluit, begin dit weer van voor af.
"""

["2026-09-27-1724-snooze-and-reminders"]
title = "Sluimer en antwoordherinneringe"
text = """
Sluimer 'n gesprek met die horlosie op sy reël of uit die regsklikmenu:
dit wag in die Gesluimer-vouer en kom ongelees terug na die Inkassie op
die tyd wat jy gekies het. Wanneer jy stuur, kan die pyltjie langs Stuur
jou herinner as niemand binne 1, 3 of 7 dae antwoord nie. Albei werk
terwyl jou rekenaar aan is, en haal in nadat dit wakker word.
"""

["2026-09-27-1717-translate-mail"]
title = "Lees e-pos in jou taal"
text = """
'n Boodskap in 'n ander taal wys nou 'n Vertaal-knoppie daarbo, en Wys
oorspronklike bring dit terug. Katna herken die taal op jou rekenaar; net
wanneer jy vra, gaan die boodskap se teks na Katna se eie bediener om
vertaal te word. Instellings > Algemeen > Vertaling kies jou taal en dié
wat altyd vertaal word.
"""

["2026-09-27-1744-open-and-click-tracking"]
title = "Sien wanneer e-pos oopgemaak word"
text = """
Skakel die oog by die ontvangers aan om te sien wanneer elkeen jou
boodskap oopmaak of 'n skakel daarin volg, of vra eerder 'n leesbewys.
Gestuurde e-pos wys wie dit oopgemaak het, en 'n kennisgewing laat jou
die eerste keer weet. Albei is af vir elke nuwe boodskap, en nasporing
het 'n Katna-rekening nodig (Instellings > Intekening).
"""

["2026-09-27-2042-activity"]
title = "Aktiwiteit vir nagespoorde e-pos"
text = """
Aktiwiteit langs die soekkassie wys hoeveel van jou nagespoorde
boodskappe oopgemaak is en hoe dikwels hul skakels gevolg is, met jou
onderwerpreëls gerangskik volgens hoe dikwels hulle oopgemaak word.
"""

["2026-09-27-2204-search-trigger-words"]
title = "Deursoek jou e-pos vanuit KRunner met k"
text = """
Tik k of m, 'n spasie en dan wat jy wil vind in KRunner of die
GNOME-soektog om dieselfde resultate as Katna Mail se soekkassie te kry,
soos “k budget”. Kies jou eie woorde in Instellings onder Algemeen.
"""

["2026-09-27-2224-activity-button"]
title = "Aktiwiteit langs die soekkassie"
text = """
Die Aktiwiteit-knoppie langs die soekkassie tel nuwe oopmaak en klikke van
jou nagespoorde e-pos en wys wie wat oopgemaak het en watter skakels hulle
gevolg het; klik op een om daardie boodskap oop te maak. Besonderhede wys
die oopmaak- en klikkoerse, oopmaak per dag en jou beste onderwerpreëls vir
die laaste 7 of 30 dae, alle tye of datums wat jy kies. 'n Gestuurde
boodskap wys nou hoeveel keer elke persoon dit oopgemaak en 'n skakel
gevolg het.
"""

["2026-09-27-2239-mailbox-insights"]
title = "Insigte in jou posbus"
text = """
Aktiwiteit > Besonderhede wys nou ook hoeveel e-pos jy in die tydperk
gestuur en ontvang het, hoe dikwels en hoe vinnig jy en ander antwoord, die
mense met wie jy die meeste skryf, en op watter dae en ure jou e-pos
aankom. Dit word op jou rekenaar getel uit die e-pos wat Katna reeds het.
"""

["2026-09-28-0059-sign-in-with-google"]
title = "Meld aan met Google of Microsoft"
text = """
Voeg 'n Gmail- of Outlook-rekening by deur op Google of Microsoft se eie
bladsy in jou blaaier aan te meld, sonder 'n programwagwoord. Outlook.com-
en Hotmail-adresse werk nou ook. As 'n aanmelding ophou werk, bied 'n nota
onderaan die venster aan om weer aan te meld.
"""

["2026-09-28-0054-tracking-on-by-default"]
title = "Nasporing en bewyse van die begin af aan"
text = """
Nuwe boodskappe en antwoorde begin nou met oopmaak- en kliknasporing, 'n
leesbewys en 'n afleweringsbewys aangeskakel; klik 'n knoppie langs die
ontvangers om een vir daardie boodskap af te skakel. Nasporing vereis dat
jy by jou Katna-rekening aangemeld is. 'n Afleweringsbewys is 'n e-pos wat
jou e-posbediener vir jou stuur wanneer elke ontvanger se bediener die
boodskap neem; die knoppie is grys waar jou e-posbediener dit nie aanbied
nie.
"""

["2026-09-28-0120-delivered-read-ticks"]
title = "Merkies vir afgelewer en gelees"
text = """
Pos wat jy gestuur het, wys nou merkies langs elke ontvanger. Een grys
merkie beteken hul e-posbediener het dit geneem: uit 'n afleweringsbewys,
of, waar jou e-posdiens geen een stuur nie (Gmail), wanneer geen
afleweringsfout binne 'n halfuur teruggekom het nie. Twee merkies in jou
aksentkleur beteken hulle het dit gelees, uit 'n leesbewys of
oopmaaknasporing, en 'n waarskuwing beteken dit is teruggestuur. Wys na 'n
merkie om te sien wanneer en hoe. Bewys-e-posse bly in jou posbus onder
“Opdaterings”, sonder 'n kennisgewing.
"""

["2026-09-28-0143-gmail-new-mail-notifications"]
title = "Kennisgewings vir nuwe Gmail-pos"
text = """
Nuwe pos in 'n Gmail-inkassie wys weer 'n kennisgewing. Katna het
voorheen pos gemis wat Gmail 'n oomblik voor die inkassie in
“Alle pos” geplaas het.
"""

["2026-09-28-0156-attachment-types"]
title = "Soek volgens aanhegseltipe"
text = """
In Soekopsies bied “Het aanhegsel” nou PDF, XLSX, ODF, XLS, ODS, PPT en
PPTX, en Pasgemaak vir enige ander uitbreiding, soos png of avif. Slegs
e-pos met 'n aanhegsel van 'n gekose tipe word gewys.
"""

["2026-09-28-0106-original-colors"]
title = "Oorspronklike kleure in 'n donker tema"
text = """
In 'n donker tema word e-pos wat sy eie kleure stel, in donker kleure
gewys. Die nuwe halfsirkel-knoppie op die leesvenster se nutsbalk wys dit
in sy sender se oorspronklike kleure, en weer terug.
"""

["2026-09-28-0127-print-as-shown"]
title = "Druk hou die formatering"
text = """
E-pos druk soos dit in die leesvenster lyk, met sy tabelle, kleure, rame,
lyste en prente. Die drukvoorskou kan agtergrondkleure uitlaat om ink te
spaar, of met Eenvoudige teks net die teks druk.
"""

["2026-09-28-0141-ask-before-deleting"]
title = "Vra voordat uitgevee word"
text = """
Om verskeie gesprekke gelyk uit te vee, vra nou eers of hulle na die
asblik geskuif moet word. Merk “Vra nie weer nie” om die vraag oor te
slaan, of skakel dit weer aan in Instellings > Algemeen. Om permanent uit
te vee, in die asblik, vra altyd.
"""

["2026-09-28-0019-katna-for-windows"]
title = "Katna vir Windows"
text = """
Katna Mail werk nou ook op Windows 10 en 11, geïnstalleer deur sy eie Katna
Setup, met die stelselbalkikoon, kennisgewings, begin by aanmelding en
e-posskakels wat in Katna oopmaak.
"""

["2026-09-28-0236-chip-remove-always"]
title = "Verwyderknoppie op elke adres"
text = """
Elke adresskyfie in Aan, Cc en Bcc wys nou altyd sy x, sodat jy dit kan
verwyder sonder om eers daarna te wys.
"""

["2026-09-28-0244-pill-format-bar"]
title = "'n Ronder formateringsbalk"
text = """
Die formateringsbalk wanneer jy skryf (Aa) is nou pilvormig met 'n dowwe
rand, sodat dit in ligte en donker temas apart van jou teks staan.
"""

["2026-09-28-0325-long-threads-smooth"]
title = "Lang gesprekke maak vinnig oop"
text = """
Geformateerde e-pos wat baie vroeëre antwoorde aanhaal, soos 'n lang reeks
aanhalings, maak nou dadelik oop en rol glad, in plaas daarvan om die hele
venster te vertraag.
"""

["2026-09-28-0830-who-has-seen-it"]
title = "Wie dit gesien het, agter 'n oog"
text = """
E-pos wat jy met nasporing gestuur het, het nie meer 'n blok reëls daarbo
nie. 'n Oog langs die ster kry jou aksentkleur sodra iemand dit oopmaak; wys
daarna om te sien wie dit oopgemaak of 'n skakel gevolg het, en wanneer.
"""

["2026-09-28-0831-contact-call-copy"]
title = "Bel en kopieer uit kontakbesonderhede"
text = """
Klik in die kontakbesonderhede langs 'n gesprek op 'n telefoonnommer om dit
met jou foonprogram of KDE Connect te bel, of gebruik die kopieerknoppie
langsaan. Al die paneel se teks kan nou ook gekies en gekopieer word.
"""

["2026-09-28-0848-quoted-text-hide-remove"]
title = "Versteek of verwyder die aangehaalde e-pos in 'n antwoord"
text = """
Die “...”-knoppie onder 'n antwoord versteek nou weer die aangehaalde e-pos
nadat jy dit oopgemaak het. Wys daarna en klik op die x op sy hoek om die
aangehaalde e-pos uit jou antwoord te haal; Ontdoen of Ctrl+Z sit dit terug.
Die antwoord se nutsbalk bly ook staan terwyl jy rol.
"""

["2026-09-28-0854-floating-folders"]
title = "Vouers wat sweef, en 'n wyer soektog"
text = """
Met die vouers versteek, maak rus op Skryf of E-pos hulle oop as 'n paneel
wat weg van die rande staan, met 'n klein keep wat na die knoppie wys. Die
soekkassie groei om die ruimte te vul wat die vouers laat, en om op die
vouer te klik waarin jy reeds is, laat die lys nie meer flikker nie.
"""

["2026-09-28-0928-search-address-suggestions"]
title = "Adresvoorstelle in Soekopsies"
text = """
Van en Aan in Soekopsies stel nou adresse voor terwyl jy tik, net soos Aan,
Cc en Bcc wanneer jy skryf. Kies een met Enter, Tab of 'n klik.
"""

["2026-09-28-0935-app-menu-reply-all-window"]
title = "Hoofkieslys in die rekeningkaart, Antwoord almal in sy eie venster"
text = """
Die rekeningkaart het 'n ☰-knoppie langs Bestuur rekeninge. Dit maak
dieselfde kieslyste Lêer, Wysig, Aansig, Gaan, Boodskap, Instellings en Hulp
oop as die werkskerm se globale kieslys, vir werkskerms wat nie een wys nie.
Antwoord almal op 'n kennisgewing van nuwe e-pos maak nou die gesprek in sy
eie venster oop, gereed om te tik, en los die hoofvenster waar dit is.
"""

["2026-09-28-1011-tray-brings-window-forward"]
title = "Klik op die stelselbalk of 'n kennisgewing bring Katna Mail na vore"
text = """
As jy op die stelselbalkikoon klik, of op Maak Inkassie oop, Nuwe boodskap
of Instellings in sy kieslys, bring dit nou die Katna Mail-venster na vore
op Wayland, selfs as dit geminimeer of agter ander vensters was. As jy op 'n
kennisgewing van nuwe e-pos klik, maak dit daardie e-pos oop, selfs as die
Inkassie-lys dit nie wys nie.
"""

["2026-09-28-1053-send-countdown-reply-in-place"]
title = "Stuur tel af, en jou antwoord bly in die gesprek"
text = """
Ná Stuur tel 'n krimpende ring die ontdoentyd langs Ontdoen af, en sodra die
e-pos weg is, sê die boodskapstrook Boodskap gestuur (met 'n kort klank).
Die klank kan afgeskakel word in Instellings > Algemeen > Stuur. 'n Antwoord
wat jy in 'n gesprek skryf, word 'n boodskap net daar waar jy dit geskryf
het. Sy kop wys net aan wie dit gaan; klik daarop vir Van, Aan, Cc en Bcc.
Die pyltjie langs die antwoordikoon wissel tussen Antwoord, Antwoord almal
en Stuur aan, en hou wat jy geskryf het.
"""


["2026-09-28-1110-search-options-narrow"]
title = "Soekopsies pas in smal vensters"
text = """
In 'n smal of kort venster word Soekopsies nou so breed as wat daar plek is,
sit dit op 'n foon die etikette bo hul velde en rol dit as dit nie pas nie,
sodat die Soek-knoppie altyd binne bereik is.
"""

["2026-09-28-1119-replies-from-right-account"]
title = "Antwoorde gaan uit van die regte rekening"
text = """
Antwoord of Stuur aan op e-pos wat uit die Verenigde inkassie of uit soek
oopgemaak is, stuur nou van die rekening waarheen die e-pos gekom het, nie
die rekening wat onder jou profielprent gekies is nie.
"""

["2026-09-28-1436-calmer-search-box"]
title = "Soek wys sy kortpad"
text = """
Die soekkassie wys sy kortpad langs "Soek e-pos", soos gestel in Instellings
> Kortpaaie. Wanneer jy daarin klik, behou dit sy kleur en wys 'n dowwe rand
in plaas daarvan om donkerder te word met 'n skaduwee. Die vouers wat oor
die lys sweef, staan nou ook weg van die onderste rand.
"""

["2026-09-28-1450-clear-activity"]
title = "Ruim Aktiwiteit op"
text = """
Wys na 'n oopmaak of klik in Aktiwiteit en druk × om dit van die lys af te
haal, of druk Vee alles uit om skoon te begin. Nuwe oopmaak en klikke
verskyn steeds, en die Besonderhede-verslag tel steeds alles.
"""

["2026-09-28-1541-round-logo"]
title = "Katna se nuwe ronde logo"
text = """
Katna het 'n nuwe logo: 'n geskrewe "k" op 'n titaankleurige sirkel —
in die toepassingskieslys, die boonste balk en die paneel. Die
stelselbalk wys dit in een kleur wat by jou paneel pas, en Meer oor
Katna en die verwelkoming wys "katna mail" voluit.
"""

["2026-09-28-1546-contact-cards"]
title = "'n Netter kontakpaneel"
text = """
Die kontakpaneel wys nou elke deel op sy eie sagte kaart, met ronde
knoppies onder die naam om vir die persoon te skryf, e-pos met hulle
te soek of hulle te bel. Onlangse gesprekke wys die jongste paar;
druk Meer om die res te sien en Minder om dit weer weg te vou.
"""

["2026-09-28-1507-reply-box-recipients"]
title = "'n Netter antwoordboks"
text = """
Ontvangers wys nou met hul prentjies, en Cc en Bcc sit saam in een klein
knoppie. Wanneer jy die ontvangers van 'n antwoord oopmaak, groei die
boks glad na bo, en die aangehaalde boodskap maak glad oop en toe onder
'n golwende lyn waarop jy kan klik om dit weer weg te vou.
"""

["2026-09-28-1620-softer-window-shadow"]
title = "'n Sagter vensterskaduwee en KDE-grootte knoppies"
text = """
Met die Katna-vensterraam is die skaduwee om die venster nou smaller
en verdwyn heeltemal, sonder die harde rand wat dit voorheen langs die
venster gelaat het. Die vensterknoppies is nou dieselfde grootte as
KDE s'n, en staan net so ver van die kant van die venster as van sy
bokant.
"""

["2026-09-28-1622-update-from-the-app"]
title = "Dateer Katna op vanuit die program"
text = """
Katna laai nou uit eie beweging nuwe weergawes af en laat jou weet
wanneer een gereed is. Druk Opdateer in die kennisgewing of by "Meer
oor": Katna Mail sê dit gaan herbegin, vra jou wagwoord, installeer
die opdatering en maak weer oop waar jy opgehou het. Instellings >
Algemeen > Opdaterings skakel die outomatiese aflaai af.
"""

["2026-09-28-1520-track-sealed-and-plain"]
title = "Nasporing van onderteken, geënkripteerde en gewone-teks-e-pos"
text = """
Die oog werk nou ook op onderteken en geënkripteerde e-pos: elke ontvanger
se kopie word apart onderteken of geënkripteer, sodat handtekeninge geldig
bly. Gewone-teks-e-pos kan nie oopmaak wys nie, maar sy skakels word
nagespoor, sodat jy sien wanneer iemand een volg.
"""

["2026-09-28-1834-reply-after-closed-window"]
title = "Antwoord begin weer van voor af nadat 'n boodskapvenster gesluit is"
text = """
As jy 'n boodskap sluit wat in sy eie venster geskryf is, bly dit nou in
Konsepte, en Antwoord, Antwoord almal en Stuur aan maak weer 'n nuwe
boodskap oop in plaas daarvan om die ou een terug te bring.
"""

["2026-09-28-1852-frosted-search-bar"]
title = "'n Ryperige soekbalk"
text = """
Met die vaag agtergrond aan, laat die soekbalk die vaagheid deur soos die
balk daaromheen, in plaas daarvan om as 'n soliede grys pil daarop te sit.
"""

["2026-09-28-1906-scroll-to-switch-accounts"]
title = "Rol oor jou prent om van rekening te wissel"
text = """
Met die wyser oor die rekeningprent regs bo, draai die muiswiel om na die
volgende of vorige rekening te gaan, een rekening per kliek. Die prent rol
na die nuwe rekening, soos die program se naam rol wanneer jy van program
wissel, en as jy 'n rekening op die kaart kies, rol dit op dieselfde manier.
"""

["2026-09-28-1918-many-recipients"]
title = "Ruimte vir baie ontvangers"
text = """
Ontvangers ná die eerste reël gebruik nou die hele breedte, en 'n lang lys
rol binne 'n paar reëls, sodat die boodskap self altyd bereikbaar bly.
Verlaat die veld en dit vou op tot een reël, soos "Kay, Sam, 19 meer"; klik
daarop om almal weer te sien.
"""

["2026-09-28-1952-activity-by-account"]
title = "Aktiwiteitsverslag vir een rekening"
text = """
Die aktiwiteitsverslag het nou ’n rekeningkieser langs die datums. Kies
Alle rekeninge of een daarvan, en die nagespoorde boodskappe, koerse,
grafiek, onderwerpreëls en Jou posbus volg jou keuse. Die verslag sê
watter rekening dit wys en onthou jou keuse.
"""

["2026-09-28-2002-reader-arrows-always-shown"]
title = "Nuwer en Ouer altyd op die nutsbalk"
text = """
Hoe smal die leesruit ook al is, die teller en die Nuwer- en Ouer-pyle bly
regs op sy nutsbalk. Die knoppies wat jy die minste gebruik, skuif eerder
een vir een na die Meer-kieslys, insluitend die kontakbesonderhede- en
oorspronklike kleure-skakelaars.
"""

["2026-09-28-2026-large-files-drive"]
title = "Stuur lêers van enige grootte"
text = """
Met 'n rekening wat met Google aangemeld is, gaan 'n lêer bo die 25
MB-poslimiet na jou Google Drive sodra jy dit heg, en die boodskap bevat
die skakel, soos in Gmail. Dit word met jou ontvangers gedeel wanneer jy
Stuur druk; Katna vra net as iemand nie toegang gegee kan word nie.
"""

["2026-09-28-2059-recipient-list-scrolling"]
title = "Gladder lang ontvangerlyste"
text = """
'n Lang lys ontvangers het nou sy eie rolstaaf en beweeg een reël op 'n
slag; die gesprek rol eers verder wanneer die lys sy einde bereik. As jy
ontvangers byvoeg, spring die knoppies daaronder nie meer nie.
"""

