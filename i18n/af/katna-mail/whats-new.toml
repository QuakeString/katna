na die kopie van voor die opdatering. Wat nou daar is, word eers in 'n
vouer gehou, so niks gaan verlore nie. Kopieer foutsporingsverslag, ook in
Meer oor Katna, versamel wat 'n foutverslag nodig het.
"""

["2026-10-08-0911-text-direction"]
title = "E-pos in Arabies en Hebreeus lees in sy eie rigting"
text = """
