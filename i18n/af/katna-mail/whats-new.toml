Matglas-dialoë is meer solied as kieslyste, sodat 'n besige e-poslys nie meer daardeur wys nie. Meer oor, Wat's nuut en Gaan opdaterings na maak oop sonder om die venster agter hulle donker te maak.
"""

["2026-10-02-0111-chat-pin-text"]
title = "Speld 'n paar woorde uit 'n klets vas"
text = """
In 'n klets (Instellings > Eksperimenteel) kan die teks in 'n borrel nou gekies en gekopieer word soos enige e-pos. Regsklik op woorde wat jy in een borrel gekies het en kies Speld bo vas om hulle in die klets se speldbalk te hou.
