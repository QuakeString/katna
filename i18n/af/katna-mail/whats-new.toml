e-pos klik wat reeds oop is.
"""

["2026-10-08-0824-safe-mode"]
title = "Veilige modus as 'n opdatering skeefloop"
text = """
Katna kopieer jou data voordat 'n opdatering dit verander. As die
opdatering Katna nie laat begin nie, maak dit in veilige modus oop: jou
