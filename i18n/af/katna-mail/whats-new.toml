"""

["2026-10-02-0236-chat-on-phones"]
title = "Klets pas op 'n foon"
text = """
In 'n foongrootte-venster hou 'n klets (Instellings > Eksperimenteel) by een kopry met Terug en ⋮, en sy borrels gebruik meer van die breedte. Hou 'n borrel in om sy kieslys van onder af op te bring, en tik op 'n naam of prent om daardie persoon se kaart op dieselfde manier te sien. Vee enigeen af of tik daarbuite om dit weg te bêre.
"""

["2026-10-02-0258-frost-stays-on-scroll"]
