"""

["2026-10-02-0525-quieter-compose"]
title = "'n Kalmer Skryf-venster"
text = """
Die Nuwe boodskap-venster sweef met 'n eweredige spasie van die venster se rande. Aan, Cc, Bcc en Van sit saam sonder lyne tussen hulle, ontvangers is sag gevulde skyfies, en Van is een stil reël. Enkripsie, ondertekening, naspoor en leesbewyse deel een klein groep, en die skryfnutsgoed sit op 'n sagte balk langs Stuur.
"""

["2026-10-02-0553-upload-to-drive"]
title = "Laai op na Google Drive uit Lêers"
text = """
Met 'n Google Drive oop in Lêers word die Skryf-knoppie Laai op. Klik daarop om lêers na die oop vouer te stuur, of gebruik sy pyltjie om 'n hele vouer op te laai. Die eerste keer, druk Laat toe sodat Katna lêers by jou skyf mag voeg.
"""

["2026-10-02-0555-reply-from-summary"]
