'n Boodskap wat jy skryf, stoor homself nou elke paar sekondes in Konsepte, en "Konsep gestoor" wys stilletjies langs sy titel. 'n Dowwe etiket langs jou handtekening noem dit; klik daarop om 'n ander een te kies. Die Skryf-venster se hoek lyn ook op met die kaart langsaan.
"""

["2026-10-02-0654-attach-from-drive"]
title = "Heg aan uit Google Drive"
text = """
Skryf se skuifspeld maak nou die Lêers-kieser oop, dieselfde een as die klets se Uit Lêers, met jou Google Drive langs jou e-poslêers en Hierdie rekenaar… vir enigiets anders. Lêers wat pas, gaan in die e-pos; groot lêers en Google Docs gaan as 'n skakel, gedeel met die ontvangers wanneer jy stuur.
