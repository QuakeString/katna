Wanneer jy 'n rekening byvoeg, laai Katna Mail nou eers jou mees onlangse e-pos af en werk dan terug na ouer e-pos, sodat vandag se boodskappe dadelik bo-aan die inkassie wys. As die aflaai onderbreek word, gaan dit volgende keer voort met die ouer e-pos.
"""

["2026-09-30-0601-keyring-at-login"]
title = "Wag vir jou beursie by aanmelding"
text = """
As KWallet of GNOME Keyring nog gesluit is wanneer Katna begin, en sy ontsluitvenster is toe, wys jou rekeninge nie meer 'n verkeerde wagwoord nie. Hulle wag en begin vanself sinkroniseer sodra jy die beursie ontsluit, sonder dat jy Katna hoef af te sluit. Sinkroniseer vra nou weer om dit te ontsluit.
