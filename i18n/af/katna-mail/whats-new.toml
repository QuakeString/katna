Meld aan met Google stop nie meer met "peer closed connection" op netwerke wat Google se verbinding vroeg laat val nie. As jy Gmail op Google se bladsy ontmerk, sê Katna dit nou in plaas daarvan om later te misluk.
"""

["2026-09-30-0504-google-api-turned-off"]
title = "Sê watter Google-API af is"
text = """
Wanneer Google 'n API vir Katna afgeskakel het, sê Kontakte, Kalender, Take en Drive-lêers nou in 'n kort reël watter een, met 'n Skakel aan-knoppie wat Google se bladsy daarvoor oopmaak, in plaas van Google se rou foutboodskap.
"""

["2026-09-30-0507-newest-mail-first"]
title = "Nuutste e-pos kom eerste"
