'n Gesluimerde gesprek kom dadelik terug wanneer iemand daarin skryf. In Kies datum en tyd kan jy "tue 3pm" of "in 2 hours" tik. 'n Nuwe e-pos se kennisgewing kan dit vir 'n uur of tot môre sluimer.
"""

["2026-10-07-0802-your-snooze-times"]
title = "Sluimer op jou manier"
