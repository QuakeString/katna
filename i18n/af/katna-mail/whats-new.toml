title = "Speld tot 5 dinge in 'n klets vas"
text = """
In 'n klets (Instellings > Eksperimenteel), laat die wyser oor 'n borrel rus en druk die speld, of regsklik op 'n lêer, om dit bo te hou. 'n Dun balk onder die kop wys jou vasgespelde items: klik daarop om na elkeen om die beurt te spring, of maak die lys oop om hulle in volgorde te sleep of te ontspeld. Vasgespelde items bly op hierdie rekenaar.
"""

