'n Geleentheid se kaart vind nou die oproep in sy beskrywing of plek, sodat 'n Microsoft Teams-, Zoom-, Webex-, Jitsi- of Google Meet-uitnodiging bo-aan 'n "Sluit aan met"-knoppie kry. Webadresse in die beskrywing is skakels, die reëls onderstrepies is weg, en Gaan jy? bly onderaan terwyl die besonderhede rol.
