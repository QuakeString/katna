["2026-10-08-0737-key-details"]
title = "Sien wie 'n boodskap onderteken het"
text = """
Klik op die handtekeningreël van 'n ondertekende of geënkripteerde boodskap om die ondertekenaar se sleutel te sien: naam, adres, vingerafdruk en datums, met Kopieer vingerafdruk. 'n Boodskap wat onderteken is met 'n sleutel wat jy nie het nie, bied Soek sleutel op, en 'n sleutel wat iemand aanheg, maak oop as Voer hierdie sleutel in? met Ontdoen daarna.
"""

["2026-10-08-0759-sender-check-banners"]
title = "Waarskuwings oor vervalste e-pos"
text = """
Wanneer 'n boodskap jou e-posdiensverskaffer se senderkontroles druip,
sê 'n rooi banier dat dit dalk nie is van wie dit beweer nie, met
Besonderhede, Lyk veilig en Skuif na strooipos. Sy prente bly versteek en
sy skakels vra voordat hulle oopmaak. 'n Sender wat niks bevestig het nie,
kry 'n klein "?" op hul prent.
"""

["2026-10-08-0810-restart-after-update"]
title = "Herbegin wanneer Katna opgedateer is"
