title = "Kennisgewings maak die e-pos voor oop"
text = """
'n Klik op 'n kennisgewing van nuwe e-pos maak daardie e-pos in sy eie venster voor alles oop, wat Katna ook al op daardie oomblik wys. Antwoord almal maak dit oop met die antwoord gereed om te tik. Argiveer bêre die e-pos sonder om iets oop te maak en sê so in 'n kort nota met Ontdoen.
