"""

["2026-10-02-0218-signature-details-on-card"]
title = "Handtekeningbesonderhede waar hulle hoort"
text = """
'n Persoon se kaart wys nie meer hul handtekening as 'n blok nie. Sy besonderhede gaan waar hulle hoort: elke telefoonnommer, gemerk selfoon, direk of faks, in die kontakbesonderhede, en die maatskappy se groep, kantore, webwerf en bladsye in die Maatskappy-afdeling. Sosiale bladsye wys as klein eenkleurige ikone, en prente, baniere en voetskrifte word weggelaat.
"""

["2026-10-02-0225-chat-subject-line"]
title = "Sien wanneer 'n klets se onderwerp verander"
