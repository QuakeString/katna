["2026-10-07-0110-follow-up-for-you"]
title = "Opvolge wat hulself stuur"
text = """
In die kieslys langs Stuur kan Volg op as niemand antwoord nie nou 'n kort opvolg vir jou stuur wanneer niemand antwoord nie: skryf dit een keer, kies wanneer, en kies of dit nog een keer moet probeer. Dit gaan uit op weeksdae in werksure, stop sodra iemand antwoord (outomatiese antwoorde tel nie), en wag vir jou eerder as om laat uit te gaan as jou rekenaar af was. 'n Skyfie langs Stuur wys wat gestel is. Of hou dit by 'n herinnering, nou met enige datum wat jy kies.
"""

["2026-10-07-0117-drawer-logo"]
title = "Katna-logo in die laai"
text = """
Op 'n foon wys die laai met jou vouers nou die Katna-logo langs sy naam, in jou aksentkleur, in plaas van 'n gewone koevert. Op 'n tablet, waar die boonste balk hulle reeds wys, begin die laai met jou vouers.
"""

["2026-10-07-0118-clock-popup"]
title = "'n Netjieser werkskermhorlosie"
text = """
