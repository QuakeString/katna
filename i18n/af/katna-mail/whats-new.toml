As jy in Meer oor rol, krimp die groot logo nou tot 'n kleintjie links bo, met Katna, sy leuse en die weergawe langsaan, en daardie opskrif bly op sy plek terwyl die res daaronder rol.
"""

["2026-10-03-0221-folded-tab-icon-settles"]
title = "Ingevoude oortjies kom tot rus sonder 'n stampie"
text = """
Wanneer jy tussen ingevoude inkassie-oortjies wissel, kom die oortjie wat jy verlaat nou presies tot rus waar dit heen gekrimp het, sonder dat sy ikoon 'n pixel of twee skuif wanneer die beweging eindig.
"""

["2026-10-03-0228-right-click-another-mail"]
title = "Een regsklik is genoeg"
text = """
Met 'n e-pos of vouer se kieslys oop, maak 'n regsklik op 'n ander e-pos of vouer nou die oop kieslys toe en die nuwe een dadelik oop, in plaas daarvan dat 'n tweede regsklik nodig is.
"""

["2026-10-03-0235-rule-editor-fits"]
title = "Reëlredigeerder pas"
text = """
In die reëlredigeerder loop lang woorde of adreslyste oor na meer reëls in plaas daarvan om afgesny te word, "pas by die patroon" wys volledig, en die redigeerder bly binne die venster en rol wanneer dit baie voorwaardes het.
"""

["2026-10-03-0235-soft-button-hover"]
title = "Sagter sweefeffek op knoppies"
text = """
As jy na 'n ronde knoppie wys, groei sy sirkel nou saggies van twee derdes van sy grootte en vervaag dit in, en pilknoppies soos Antwoord vervaag 'n bietjie stadiger in. As jy wegbeweeg, krimp die sirkel 'n bietjie terug terwyl dit vervaag.
"""

["2026-10-03-0249-account-ring"]
title = "'n Duideliker rekeningring"
text = """
Die gekleurde ring om elke rekening se prent is dikker, met 'n bietjie meer spasie tussen dit en die prent, in die boonste balk, die rekeningkieslys en Instellings.
"""

["2026-10-03-0335-chat-picture-steady"]
title = "Stil prente in kletse"
text = """
As jy verby die einde van 'n klets rol, of in 'n klets met niks om te rol nie, spring die sender se prent en die borrel se knoppies nie meer nie.
"""

["2026-10-03-0355-no-hover-while-scrolling"]
title = "Kalmer rol in die e-poslys"
text = """
Terwyl jy die e-poslys rol, lig e-posse wat onder die wyser verbygaan nie meer op en wys hul knoppies nie. Soos in Gmail lig die e-pos onder die wyser op sodra die rol stop.
"""

["2026-10-03-0541-rule-rows-drag"]
title = "Reëls sleep soos rekeninge"
text = """
In Instellings > Vouers en reëls lig 'n reël se hele ry nou op wanneer jy dit sleep, die ander reëls skuif uit sy pad, en dit kom tot rus waar jy los, net soos wanneer jy rekeninge herrangskik.
"""

["2026-10-03-0545-chat-go-down-aligned"]
title = "Afknoppie in lyn"
text = """
In kletse sit die ronde knoppie wat jou na die nuutste e-pos neem nou reg bo die stuurknoppie, op dieselfde lyn.
"""

["2026-10-03-0555-bottom-corners-round"]
title = "Geronde onderste hoeke bly rond"
text = """
Met Katna se eie titelbalk en geronde hoeke wys die venster se onderste hoeke nie meer 'n vierkant van sy agtergrond verby die geronde rand nie.
"""

["2026-10-03-0606-account-dot-only"]
title = "'n Stiller e-poslys"
text = """
Reëls in die verenigde inkassie wys net die rekening se gekleurde kolletjie langs die sender. Wys na die kolletjie om te sien aan watter rekening die e-pos behoort.
"""

["2026-10-03-0623-windows-updates"]
title = "Opdaterings op Windows"
text = """
Katna op Windows dateer homself nou op. Dit kyk elke uur vir nuwe weergawes, laai hulle in die agtergrond af en installeer hulle wanneer jy Opdateer druk, en maak dan weer oop.
"""

["2026-10-03-0643-files-wildcard-search"]
title = "Plekhouers in Lêers-soektog"
text = """
In Lêers vind 'n soektog na *.pdf nou elke PDF, en * en ? werk enige plek in 'n naam: faktuur*2026* vind elke faktuur van 2026. Dit werk vir jou e-pos se lêers en in Google Drive en OneDrive.
"""

["2026-10-03-0643-linux-package-updates"]
title = "Opdaterings vir elke Linux-pakket"
text = """
Die AppImage en die Linux-tarball dateer hulself nou op soos die Arch-pakket. Met die Fedora-pakket, Snap, Flatpak of Nix sê Katna vir jou wanneer 'n nuwe weergawe uit is en wys die een opdrag wat dit installeer, gereed om te kopieer.
"""

["2026-10-03-0708-copy-codes"]
title = "Kopieer kodes uit kennisgewings"
text = """
'n Nuwe-e-pos-kennisgewing met 'n aanmeld- of verifikasiekode het nou 'n Kopieer-knoppie daarvoor, en een met 'n skakel om jou adres te verifieer of te bevestig het 'n knoppie wat die webwerf noem wat dit oopmaak. Knoppies op kennisgewings laat nie meer 'n springende Katna-ikoon die muiswyser volg nie.
"""

["2026-10-03-0730-contact-card-popover"]
title = "Kontakkaart in smal vensters"
text = """
Wanneer die venster nie plek vir die kontakpaneel het nie, maak 'n klik op 'n persoon se naam of prent 'n kort kaart oor die e-pos oop, wat wys na waar jy geklik het. Maak die venster wyer en die volle paneel neem sy plek in.
"""

["2026-10-03-0733-compose-icon-turns"]
title = "Die groot knoppie se ikoon draai as jy bladsye wissel"
text = """
As jy tussen E-pos, Kalender, Kontakte, Take en Notas wissel, ruil die ikoon op die groot knoppie bo-aan die linkerbalk nie meer in een sprong om nie. Die ou ikoon draai weg en krimp terwyl die nuwe een indraai, ook op 'n foon se knoppie.
"""

["2026-10-03-0746-sound-sets"]
title = "Stelle kennisgewingklanke"
text = """
Instellings > Kennisgewings het nou stelle klanke: Voëls, Natuur, Diere, Insekte, Elektronies, Oggend, Katna se klokkies, of jou werkskerm s'n. Nuwe e-pos sing soos 'n roodborsie tensy jy 'n ander stel kies. Enige gebeurtenis kan ook sy eie klank hê, of 'n klanklêer wat jy kies.
"""

["2026-10-03-0750-chat-seen-ticks"]
title = "Wie jou e-pos gesien het, in kletse"
text = """
In die kletsaansig word die regmerkies op e-pos wat jy met nasporing gestuur het, gekleur sodra iemand dit oopmaak. Langsaan tel 'n klein oog die keer dat dit oopgemaak is en 'n skakel die skakels wat gevolg is. Laat die wyser daarop rus om te sien wie dit oopgemaak of 'n skakel gevolg het, soos die oog in die e-posaansig wys.
"""

["2026-10-03-0834-drawer-edge-clean"]
title = "Geen lyn langs die inskuifvouers nie"
text = """
Op 'n foon of tablet kom die vouers wat uit die kieslys inskuif nou teen die rand tot rus sonder dat 'n dun lyn langs hulle flits terwyl hulle tot rus kom.
"""

["2026-10-03-0845-chat-summary-button-hides"]
title = "Die opsommingknoppie versteek dit weer"
text = """
In die kletsaansig versteek die vonkel bo-aan nou die opsomming wanneer dit wys, en wys dit weer met die volgende klik, soos in die e-posaansig.
"""

["2026-10-03-0915-big-button-glides"]
title = "Die groot knoppie gly tussen bladsye"
text = """
Wanneer die vouers oop is, spring die groot knoppie bo-aan nie meer na sy nuwe breedte wanneer jy bladsye wissel nie, en ruil dit nie sy woord in een sprong om nie. Die knoppie skuif saggies na sy nuwe breedte terwyl die ou woord opwaarts wegvervaag en die nuwe een inrys, saam met die draaiende ikoon.
"""

["2026-10-03-0945-flat-row-hover"]
title = "'n Skerper sweefeffek in die e-poslys"
text = """
Die reël onder die wyser lig nie meer op met 'n sagte skaduwee nie. Dit kry eerder 'n plat, effens sterker tint, sodat sy rande skerp bly in lig en donker.
"""

["2026-10-03-0959-drawer-bounce-back"]
title = "Vouers skuif in met hul wip, met 'n skoon rand"
text = """
Op 'n foon of tablet het die vouers wat uit die kieslys inskuif hul klein wip terug, en geen skaduwee lê langs hul rand by die balk nie.
"""

["2026-10-03-1030-crisp-card-edges"]
title = "Skerper kaartrande in ligte kleure"
text = """
In ligte kleure het die e-poslys, die oop e-pos en die ander kaarte nou 'n fyn, skerp rand en 'n baie kort skaduwee in plaas van 'n sagte vervaging, sodat hulle so skerp van die bladsy uitstaan soos in donker kleure.
"""

["2026-10-03-1206-matching-choice-chips"]
title = "Keuseskyfies wat pas"
text = """
Die keuses in Soekopsies, Aktiwiteit, KI-skryfwerk en 'n kontak se adresboeke is nou een soort skyfie: oral dieselfde grootte, met 'n regmerkie op die gekose een.
"""

["2026-10-03-1453-summary-folds-smoothly"]
title = "'n Opsomming wat glad vou"
text = """
As jy 'n gesprek se opsomming in- of oopvou, gly dit nou na sy nuwe hoogte, en sy pyltjie draai saam in plaas daarvan om te spring.
"""

["2026-10-03-1523-animation-speed"]
title = "Kies hoe vinnig dinge beweeg"
text = """
Instellings > Voorkoms het 'n Animasiespoed: volg die werkskerm se spoed, of kies Katna s'n, van Vinniger tot Stadiger. Verminder beweging volg ook die werkskerm, of kan altyd of nooit aan wees.
"""

["2026-10-03-1536-paste-signature-html"]
title = "Plak 'n handtekening se HTML"
text = """
Instellings > Skryf > Handtekeninge het Plak HTML, vir 'n handtekening wat op 'n handtekeningwebwerf of in 'n ander e-posprogram ontwerp is. Dit word skoongemaak, sy prente word afgelaai en binne die e-pos saamgedra, en die skryfvenster wys dit presies soos dit gestuur sal word.
"""

["2026-10-03-1546-whats-new-header-stays"]
title = "Wat's nuut hou sy opskrif"
text = """
As jy in Wat's nuut rol, beweeg nou net die hoogtepunte: die opskrif bly bo-aan en Reg so bly onderaan.
"""

["2026-10-03-1611-menus-fade-out"]
title = "Kieslyste vervaag weg"
text = """
'n Regsklikkieslys vervaag nou wanneer dit toemaak, in plaas daarvan om te verdwyn.
"""

["2026-10-03-1625-list-stays-put"]
