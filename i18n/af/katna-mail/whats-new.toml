["2026-10-07-0359-waiting-for-reply"]
title = "Sien wat op 'n antwoord wag"
text = """
E-pos wat jy met 'n opvolg of 'n herinnering gestuur het, word onder Wag gelys, onder Gestuur. Hul reëls wys 'n skyfie met wat volgende gebeur en wanneer, in Wag en ook in jou Inkassie. Maak een oop om die opvolg na 'n ander tyd te skuif, dit nou te stuur, of dit te stop.
