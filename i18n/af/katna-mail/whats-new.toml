"""

["2026-10-02-0210-conversation-summaries"]
title = "Som 'n gesprek op"
text = """
Regsklik op 'n gesprek en kies Som op, of druk Shift+S, vir 'n kaart langsaan wat sê waaroor dit gaan, wat besluit is en wat op jou wag, sonder om dit oop te maak of as gelees te merk. In 'n oop gesprek sit die vonkel daarbo die opsomming onder die onderwerp; in die kletsaansig sit dit in 'n strook onder die kop. Elke punt noem die e-pos waaruit dit kom, en wanneer nuwe e-pos gekom het sedert jy laas gelees het, dek die opsomming net dit. Dit het skryfhulp met KI aan nodig in Instellings > Skryf.
"""

["2026-10-02-0215-system-colors-follow-mode"]
title = "Lig en Donker werk met Stelsel-kleure"
text = """
