agtergronddiens self na die nuwe weergawe sodra dit nie e-pos stuur nie.
'n Klein pil onderaan die e-poslys bied dan Herbegin aan, wat die nuwe
Katna Mail in sy plek oopmaak. × versteek dit tot die volgende opdatering.
"""

["2026-10-08-0813-calmer-mail-open"]
title = "'n E-pos oopmaak is kalmer"
text = """
