title = "Folder membawa anda keluar dari Tetapan"
text = """
Semasa Tetapan dibuka, klik folder atau ikon Mel kini menutup Tetapan
dan membuka folder itu, seperti dalam Gmail. Anak panah kembali masih
berfungsi juga.
"""

["2026-09-27-1641-drop-pictures-in-text"]
title = "Lepaskan gambar ke dalam teks"
text = """
Menyeret gambar ke atas mesej menunjukkan kursor di tempat ia akan
mendarat, jadi anda boleh melepaskannya di tengah ayat. Fail lain masih
menunjukkan kawasan lepas untuk lampiran, dan lepasan kini berfungsi
selepas anda menaip.
"""

["2026-09-27-1707-quick-quit"]
title = "Keluar menutup serta-merta"
text = """
Keluar dalam menu ikon dulang tidak lagi menunggu mel yang masih
disegerakkan atau diindeks: Katna dan ikon dulangnya ditutup
serta-merta, dan selebihnya diteruskan apabila Katna dimulakan lagi.
"""

["2026-09-27-1715-contact-panel"]
title = "Butiran kenalan di sebelah mel anda"
text = """
Dalam tetingkap yang lebar, sebuah kad di sebelah perbualan yang dibuka
kini menunjukkan pengirim: telefon, jawatan dan syarikat mereka daripada
tandatangan mereka, waktu mereka sekarang, berapa banyak mel yang telah
anda bertukar, perbualan terkini anda dan fail antara anda. Klik
perbualan atau fail untuk membukanya, atau orang lain dalam perbualan
untuk melihat mereka. Ia dibaca daripada mel anda pada komputer ini
sahaja. Butang kenalan pada bar alat anak tetingkap bacaan
menyembunyikannya.
"""

["2026-09-27-1640-storage-used"]
title = "Storan yang digunakan"
text = """
Bahagian bawah anak tetingkap folder menunjukkan setakat mana storan mel
akaun sudah penuh, seperti “34% daripada 15 GB digunakan”, apabila pelayan
melnya memberitahu.
"""

["2026-09-27-1651-desktop-search"]
title = "Cari mel daripada KRunner dan carian GNOME"
text = """
Taip nama dalam KRunner (Alt+Space) atau carian Aktiviti untuk menulis kepada
orang itu, menyalin alamatnya atau mencari melnya. Mesej muncul apabila subjek
atau pengirimnya mengandungi setiap perkataan yang anda taip; mulakan dengan
mail: untuk mencari semua mel anda, seperti dalam kotak carian Katna Mail.
"""

["2026-09-27-1727-mail-templates"]
title = "Templat untuk mel yang kerap anda tulis"
text = """
Tulis mesej sekali dan simpan dengan butang Templat baharu semasa mengarang,
kemudian masukkan ke dalam mana-mana mel baharu atau balasan dengan satu klik.
Tulis {first name}, {name} atau {my name} dan Katna mengisinya untuk setiap
penerima. Sunting, namakan semula atau padam templat dalam Tetapan > Karang.
"""

["2026-09-27-1724-server-send-later"]
title = "Mel berjadual dihantar walaupun komputer anda dimatikan"
text = """
Apabila pelayan mel anda boleh menahan mel hingga masa yang ditetapkan,
seperti Stalwart, Jadualkan penghantaran kini menyerahkan mesej kepadanya
sebaik sahaja Buat asal hilang, jadi ia dihantar tepat pada masanya
walaupun komputer ini dimatikan. Menu jadual memberitahu sama ada pelayan
mel anda atau Katna yang akan menghantarnya.
"""

["2026-09-27-1730-softer-row-hover"]
title = "Tudingan yang lebih ringan"
text = """
Baris di bawah penuding dalam senarai mel kini terangkat dengan bayang
samar, seperti dalam Gmail, dan bukan jalur gelap di bawahnya.
"""

["2026-09-27-1745-drag-recipients"]
title = "Seret alamat antara Kepada, Sk dan Skt"
text = """
Seret cip alamat ke medan lain untuk memindahkannya; Sk dan Skt terbuka
semasa anda menyeret, walaupun tersembunyi. Menuding pada cip
menunjukkan x yang mengalih keluarnya.
"""

["2026-09-27-1722-katna-account"]
title = "Akaun Katna"
text = """
Tetapan > Langganan membolehkan anda mencipta akaun pada pelayan Katna
sendiri, dengan kata laluannya sendiri, bukan kata laluan mel. Ciri
dalam talian Katna, seperti resit baca dan penjejakan pautan, akan
memerlukannya. Anda boleh melihat komputer yang telah log masuk dan
melog keluar mana-mana daripadanya.
"""

["2026-09-27-1805-reopens-as-you-left-it"]
title = "Kembali di tempat anda tadi"
text = """
Menutup Katna Mail dan membukanya semula mengembalikan apl, folder dan
tab peti masuk yang anda buka, folder yang anda kembangkan dan sama ada
anak tetingkap folder dilipat. Keluar daripada Katna melalui dulang
sistem memulakannya semula dari awal.
"""

["2026-09-27-1724-snooze-and-reminders"]
title = "Tunda dan peringatan balasan"
text = """
Tunda perbualan dengan jam pada barisnya atau dari menu klik kanan: ia
menunggu dalam folder Ditunda dan kembali ke Peti Masuk, belum dibaca,
pada masa yang anda pilih. Semasa menghantar, anak panah di sebelah
Hantar boleh mengingatkan anda jika tiada sesiapa membalas dalam 1, 3
atau 7 hari. Kedua-duanya berfungsi semasa komputer anda hidup, dan
menyusul selepas ia bangun semula.
"""

["2026-09-27-1717-translate-mail"]
title = "Baca mel dalam bahasa anda"
text = """
Mesej dalam bahasa lain kini menunjukkan butang Terjemahkan di atasnya,
dan Tunjukkan asal mengembalikannya. Katna mengenal pasti bahasa pada
komputer anda; teks mesej hanya dihantar ke pelayan Katna sendiri untuk
diterjemahkan apabila anda memintanya. Tetapan > Umum > Terjemahan
memilih bahasa anda dan bahasa yang sentiasa diterjemahkan.
"""

["2026-09-27-1744-open-and-click-tracking"]
title = "Lihat bila mel dibuka"
text = """
Hidupkan mata di sebelah penerima untuk melihat bila setiap seorang
membuka mesej anda atau mengikuti pautan di dalamnya, atau minta resit
baca sebagai gantinya. Mel yang dihantar menunjukkan siapa yang telah
membukanya, dan pemberitahuan memaklumkan anda pada kali pertama.
Kedua-duanya dimatikan untuk setiap mesej baharu, dan penjejakan
memerlukan akaun Katna (Tetapan > Langganan).
"""

["2026-09-27-2042-activity"]
title = "Aktiviti untuk mel yang dijejaki"
text = """
Aktiviti di sebelah kotak carian menunjukkan berapa banyak mesej anda
yang dijejaki telah dibuka dan berapa kerap pautannya diikuti, dengan
baris subjek anda disusun mengikut kekerapan ia dibuka.
"""

["2026-09-27-2204-search-trigger-words"]
title = "Cari mel anda dari KRunner dengan k"
text = """
Taip k atau m, satu ruang, kemudian apa yang hendak dicari dalam KRunner
atau carian GNOME untuk mendapat hasil yang sama seperti kotak carian
Katna Mail, contohnya “k budget”. Pilih perkataan anda sendiri dalam
Tetapan > Umum.
"""

["2026-09-27-2224-activity-button"]
title = "Aktiviti di sebelah kotak carian"
text = """
Butang Aktiviti di sebelah kotak carian mengira pembukaan dan klik baharu
pada mel anda yang dijejaki dan menyenaraikan siapa membuka apa dan
pautan mana yang diikuti; klik satu untuk membuka mesej itu. Butiran
menunjukkan kadar buka dan kadar klik, pembukaan mengikut hari dan baris
subjek terbaik anda bagi 7 atau 30 hari lepas, sepanjang masa atau
tarikh pilihan anda. Mesej yang dihantar kini menunjukkan berapa kali
setiap orang membukanya dan mengikuti pautan.
"""

["2026-09-27-2239-mailbox-insights"]
title = "Wawasan peti mel"
text = """
Aktiviti > Butiran kini turut menunjukkan berapa banyak mel yang anda
hantar dan terima dalam tempoh itu, berapa kerap anda dan orang lain
membalas dan berapa pantas, orang yang paling kerap anda utusi mel, dan
pada hari serta jam apa mel anda tiba. Ia dikira pada komputer anda
daripada mel yang sudah ada dalam Katna.
"""

["2026-09-28-0059-sign-in-with-google"]
title = "Log masuk dengan Google atau Microsoft"
text = """
Tambah akaun Gmail atau Outlook dengan log masuk di halaman Google atau
Microsoft sendiri dalam pelayar anda, tanpa kata laluan aplikasi. Alamat
Outlook.com dan Hotmail kini berfungsi juga. Jika log masuk berhenti
berfungsi, satu nota di bahagian bawah tetingkap menawarkan untuk log
masuk semula.
"""

["2026-09-28-0054-tracking-on-by-default"]
title = "Penjejakan dan resit dihidupkan dari awal"
text = """
Mesej dan balasan baharu kini bermula dengan penjejakan pembukaan dan
klik, resit baca dan resit penghantaran dihidupkan; klik butang di
sebelah penerima untuk mematikan salah satunya bagi mesej itu.
Penjejakan memerlukan anda log masuk ke akaun Katna anda. Resit
penghantaran ialah e-mel yang dihantar oleh pelayan mel anda apabila
pelayan setiap penerima menerima mesej itu; butang itu dikelabukan jika
pelayan mel anda tidak menyediakannya.
"""

["2026-09-28-0120-delivered-read-ticks"]
title = "Tanda untuk mel yang sampai dan dibaca"
text = """
Mel yang anda hantar kini menunjukkan tanda di sebelah setiap penerima.
Satu tanda kelabu bermaksud pelayan mel mereka telah menerimanya:
daripada resit penghantaran, atau, jika perkhidmatan mel anda tidak
menghantarnya (Gmail), apabila tiada lantunan kembali dalam masa
setengah jam. Dua tanda dalam warna aksen anda bermaksud mereka telah
membacanya, daripada resit baca atau penjejakan pembukaan, dan amaran
bermaksud ia melantun. Halakan penuding pada tanda untuk melihat bila
dan bagaimana. E-mel resit kekal dalam peti mel anda di bawah Kemas
kini, tanpa pemberitahuan.
"""

["2026-09-28-0143-gmail-new-mail-notifications"]
title = "Pemberitahuan untuk mel Gmail baharu"
text = """
Mel baharu dalam peti masuk Gmail kini menunjukkan pemberitahuan semula.
Dahulu Katna terlepas mel yang Gmail failkan dalam Semua Mel sejurus
sebelum peti masuk.
"""

["2026-09-28-0156-attachment-types"]
title = "Cari mengikut jenis lampiran"
text = """
Dalam Pilihan carian, “Ada lampiran” kini menawarkan PDF, XLSX, ODF,
XLS, ODS, PPT dan PPTX, serta Tersuai untuk sebarang sambungan lain,
seperti png atau avif. Hanya mel yang mempunyai lampiran jenis yang
dipilih akan dipaparkan.
"""

["2026-09-28-0106-original-colors"]
title = "Warna asal dalam tema gelap"
text = """
Dalam tema gelap, mel yang menetapkan warnanya sendiri dipaparkan dengan
warna gelap. Butang separuh bulatan baharu pada bar alat anak tetingkap
bacaan memaparkannya dengan warna asal pengirimnya, dan kembali semula.
"""

["2026-09-28-0127-print-as-shown"]
title = "Cetakan mengekalkan format"
text = """
Mel dicetak sebagaimana ia kelihatan dalam anak tetingkap bacaan, dengan
jadual, warna, sempadan, senarai dan gambarnya. Pratonton cetakan boleh
meninggalkan warna latar belakang untuk menjimatkan dakwat, atau mencetak
teks sahaja dengan Teks sahaja.
"""

["2026-09-28-0141-ask-before-deleting"]
title = "Tanya sebelum memadam"
text = """
Memadam beberapa perbualan sekali gus kini bertanya dahulu sama ada
hendak mengalihkannya ke Sampah. Tandakan “Jangan tanya lagi” untuk
melangkau soalan itu, atau hidupkannya semula dalam Tetapan > Umum.
Pemadaman selama-lamanya, dalam Sampah, sentiasa bertanya.
"""

["2026-09-28-0019-katna-for-windows"]
title = "Katna untuk Windows"
text = """
Katna Mail kini turut berjalan pada Windows 10 dan 11, dipasang oleh Katna
Setup sendiri, dengan ikon dulang sistem, pemberitahuan, mula semasa log
masuk dan pautan mel yang dibuka dalam Katna.
"""

["2026-09-28-0236-chip-remove-always"]
title = "Butang alih keluar pada setiap alamat"
text = """
Setiap cip alamat dalam Kepada, Sk dan Skt kini sentiasa menunjukkan x-nya,
jadi anda boleh mengalih keluarnya tanpa menuding padanya dahulu.
"""

["2026-09-28-0244-pill-format-bar"]
title = "Bar pemformatan yang lebih bulat"
text = """
Bar pemformatan semasa mengarang (Aa) kini berbentuk pil dengan tepi yang
samar, jadi ia terpisah daripada teks anda dalam tema cerah dan gelap.
"""

["2026-09-28-0325-long-threads-smooth"]
title = "Perbualan mel yang panjang dibuka dengan pantas"
text = """
Mel berformat yang memetik banyak balasan terdahulu, seperti rangkaian
petikan yang panjang, kini dibuka serta-merta dan ditatal dengan lancar
tanpa melambatkan seluruh tetingkap.
"""

["2026-09-28-0830-who-has-seen-it"]
title = "Siapa yang telah melihatnya, di sebalik mata"
text = """
Mel yang anda hantar dengan penjejakan tidak lagi mempunyai kotak berisi
baris di atasnya. Mata di sebelah bintang bertukar kepada warna aksen anda
sebaik sahaja seseorang membukanya; tuding padanya untuk melihat siapa yang
membukanya atau mengikuti pautan, dan bila.
"""

["2026-09-28-0831-contact-call-copy"]
title = "Panggil dan salin daripada butiran kenalan"
text = """
Dalam butiran kenalan di sebelah perbualan, klik nombor telefon untuk
memanggilnya dengan apl telefon anda atau KDE Connect, atau gunakan butang
salin di sebelahnya. Semua teks dalam panel itu kini boleh dipilih dan
disalin juga.
"""

["2026-09-28-0848-quoted-text-hide-remove"]
title = "Sembunyikan atau alih keluar mel petikan dalam balasan"
text = """
Butang “...” di bawah balasan kini menyembunyikan semula mel petikan selepas
anda membukanya. Tuding padanya dan klik x di penjurunya untuk mengeluarkan
mel petikan daripada balasan anda; Buat asal atau Ctrl+Z mengembalikannya.
Bar alat balasan juga kekal di tempatnya semasa anda menatal.
"""

["2026-09-28-0854-floating-folders"]
title = "Folder yang terapung, dan carian yang lebih lebar"
text = """
Apabila folder disembunyikan, meletakkan penuding pada Karang atau Mel
membukanya sebagai panel yang terpisah daripada tepi, dengan takuk kecil
yang menuding ke butang itu. Kotak carian membesar untuk mengisi ruang yang
ditinggalkan folder, dan mengklik folder yang sedang anda buka tidak lagi
membuatkan senarai berkelip.
"""

["2026-09-28-0928-search-address-suggestions"]
title = "Cadangan alamat dalam Pilihan carian"
text = """
Daripada dan Kepada dalam Pilihan carian kini mencadangkan alamat semasa
anda menaip, sama seperti Kepada, Sk dan Skt semasa mengarang. Pilih satu
dengan Enter, Tab atau klik.
"""

["2026-09-28-0935-app-menu-reply-all-window"]
title = "Menu utama dalam kad akaun, Balas semua dalam tetingkap sendiri"
text = """
Kad akaun mempunyai butang ☰ di sebelah Urus akaun. Ia membuka menu Fail,
Sunting, Lihat, Pergi, Mesej, Tetapan dan Bantuan yang sama seperti menu
global desktop, untuk desktop yang tidak memaparkannya. Balas semua pada
pemberitahuan mel baharu kini membuka perbualan dalam tetingkapnya sendiri,
sedia untuk menaip, dan membiarkan tetingkap utama di tempatnya.
"""

["2026-09-28-1011-tray-brings-window-forward"]
title = "Klik dulang sistem dan pemberitahuan membawa Katna Mail ke hadapan"
text = """
Mengklik ikon dulang sistem, atau Buka Peti Masuk, Mesej Baharu atau Tetapan
dalam menunya, kini membawa tetingkap Katna Mail ke hadapan pada Wayland,
walaupun ia diminimumkan atau berada di belakang tetingkap lain. Mengklik
pemberitahuan mel baharu membuka mel itu, walaupun senarai Peti Masuk tidak
memaparkannya.
"""

["2026-09-28-1053-send-countdown-reply-in-place"]
title = "Hantar mengira detik, dan balasan anda kekal dalam perbualan"
text = """
Selepas Hantar, gelang yang mengecil mengira detik masa untuk membuat asal
di sebelah Buat asal, kemudian pemberitahuan ringkas memaparkan Mesej
dihantar (dengan bunyi pendek) sebaik sahaja mel keluar. Bunyi ini boleh
dimatikan dalam Tetapan > Umum > Penghantaran. Balasan yang ditulis dalam
perbualan bertukar menjadi mesej tepat di tempat anda menulisnya. Bahagian
atasnya hanya menunjukkan kepada siapa ia dihantar; klik untuk Daripada,
Kepada, Sk dan Skt. Anak panah di sebelah ikon balas bertukar antara Balas,
Balas semua dan Majukan, sambil mengekalkan apa yang anda tulis.
"""


["2026-09-28-1110-search-options-narrow"]
title = "Pilihan carian muat dalam tetingkap sempit"
text = """
Dalam tetingkap yang sempit atau pendek, Pilihan carian kini melebar
mengikut ruang yang ada, meletakkan label di atas medannya pada telefon dan
boleh ditatal apabila tidak muat, jadi butang Cari sentiasa dalam capaian.
"""

["2026-09-28-1119-replies-from-right-account"]
title = "Balasan dihantar dari akaun yang betul"
text = """
Balas atau Majukan pada mel yang dibuka dari Peti masuk bersatu atau dari
carian kini dihantar dari akaun yang menerima mel itu, bukan akaun yang
dipilih di bawah gambar profil anda.
"""

["2026-09-28-1436-calmer-search-box"]
title = "Carian menunjukkan pintasannya"
text = """
Kotak carian menunjukkan pintasan papan kekuncinya di sebelah "Cari mel",
seperti yang ditetapkan dalam Tetapan > Pintasan. Apabila diklik, ia
mengekalkan warnanya dan menunjukkan pinggir yang samar, bukannya menjadi
lebih gelap dengan bayang. Folder yang terapung di atas senarai kini juga
tidak lagi rapat dengan pinggir bawah.
"""

["2026-09-28-1450-clear-activity"]
title = "Kemaskan Aktiviti"
text = """
Tuding pada pembukaan atau klik dalam Aktiviti dan tekan × untuk membuangnya
daripada senarai, atau tekan Kosongkan semua untuk bermula semula. Pembukaan
dan klik baharu masih akan muncul, dan laporan Butiran masih mengira
semuanya.
"""

["2026-09-28-1541-round-logo"]
title = "Logo bulat baharu Katna"
text = """
Katna kini mempunyai logo baharu: huruf "k" bergaya tulisan tangan di
atas bulatan warna teal — dalam menu aplikasi, bar atas dan panel.
Dulang menunjukkannya dalam satu warna yang sesuai dengan panel anda,
manakala Perihal Katna dan alu-aluan menunjukkan "katna mail" secara
penuh.
"""

["2026-09-28-1546-contact-cards"]
title = "Kad butiran kenalan yang lebih kemas"
text = """
Kad butiran kenalan kini menunjukkan setiap bahagian pada kad
lembutnya sendiri, dengan butang bulat di bawah nama untuk
menghantar e-mel kepada orang itu, mencari e-mel dengan mereka atau
memanggil mereka. Perbualan terkini menunjukkan beberapa yang
terbaharu; tekan Lagi untuk melihat selebihnya dan Kurang untuk
melipatnya semula.
"""

["2026-09-28-1507-reply-box-recipients"]
title = "Kotak balasan yang lebih kemas"
text = """
Penerima kini dipaparkan dengan gambar mereka, dan Sk serta Skt
disatukan dalam satu butang kecil. Membuka penerima balasan
mengembangkan kotak ke atas dengan lancar, dan mesej petikan terbuka
dan tertutup dengan lancar di bawah garis berombak yang boleh anda
klik untuk melipatnya semula.
"""

["2026-09-28-1620-softer-window-shadow"]
title = "Bayang tetingkap yang lebih lembut dan butang bersaiz KDE"
text = """
Dengan bingkai tetingkap Katna, bayang di sekeliling tetingkap kini
lebih nipis dan pudar sepenuhnya, tanpa bucu tajam yang dahulu
ditinggalkan di sisi tetingkap. Butang tetingkap kini sebesar butang
KDE sendiri, dan berjarak sama daripada sisi tetingkap seperti
daripada bahagian atasnya.
"""

["2026-09-28-1622-update-from-the-app"]
title = "Kemas kini Katna dari dalam aplikasi"
text = """
Katna kini memuat turun versi baharu dengan sendirinya dan
memberitahu anda apabila satu sedia. Tekan Kemas kini dalam
pemberitahuan atau dalam Perihal: Katna Mail memberitahu ia akan
mulakan semula, meminta kata laluan anda, memasang kemas kini dan
buka semula di tempat anda berhenti. Tetapan > Umum > Kemas kini
mematikan muat turun automatik.
"""

["2026-09-28-1520-track-sealed-and-plain"]
title = "Menjejaki mel yang ditandatangani, disulitkan dan teks biasa"
text = """
Mata kini turut berfungsi pada mel yang ditandatangani dan disulitkan:
salinan setiap penerima ditandatangani atau disulitkan secara berasingan,
supaya tandatangan kekal sah. Mel teks biasa tidak dapat menunjukkan
pembukaan, tetapi pautannya dijejaki, supaya anda nampak bila seseorang
mengikuti salah satu daripadanya.
"""

["2026-09-28-1834-reply-after-closed-window"]
title = "Balas bermula baharu selepas tetingkap mesej ditutup"
text = """
Menutup mesej yang ditulis dalam tetingkapnya sendiri kini mengekalkannya
dalam Draf, dan Balas, Balas semua serta Majukan membuka mesej baharu semula
dan bukannya membawa kembali yang lama.
"""

["2026-09-28-1852-frosted-search-bar"]
title = "Bar carian berkaca"
text = """
Apabila latar belakang kabur dihidupkan, bar carian membiarkan kekaburan
menembusinya seperti bar di sekelilingnya, bukannya terletak di atasnya
sebagai pil kelabu pepejal.
"""

["2026-09-28-1906-scroll-to-switch-accounts"]
title = "Tatal di atas gambar anda untuk bertukar akaun"
text = """
Dengan penuding di atas gambar akaun di bahagian kanan atas, putar roda
tetikus untuk beralih ke akaun seterusnya atau sebelumnya, satu akaun bagi
setiap klik. Gambar bergulir ke akaun baharu, seperti nama apl bergulir
apabila anda bertukar apl, dan memilih akaun daripada kad menggulirkannya
dengan cara yang sama.
"""

["2026-09-28-1918-many-recipients"]
title = "Ruang untuk ramai penerima"
text = """
Penerima selepas baris pertama kini menggunakan seluruh lebar, dan senarai
panjang menatal dalam beberapa baris, supaya mesej itu sendiri sentiasa
