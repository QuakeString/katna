title = "Mel yang dijejaki sampai semula"
text = """
Mel yang dihantar dengan penjejakan dihidupkan boleh muncul dalam Dihantar
tanpa sampai kepada sesiapa. Kini ia dihantar kepada setiap penerima. Mel
yang hilang dengan cara ini perlu dihantar semula.
"""

["2026-09-30-1114-no-checking-pill"]
title = "Tiada lagi pil semakan"
text = """
“Menyemak mel baharu…” tidak lagi muncul di atas senarai. Anak panah
berpusing pada butang muat semula dan pada peti masuk setiap akaun sudah
menunjukkan bahawa mel sedang disemak, dan semakan yang gagal masih
menyatakan apa yang tidak kena.
"""

["2026-09-30-1300-windows-sign-in-and-domains"]
title = "Log masuk dengan Google pada Windows"
text = """
Katna untuk Windows kini menawarkan Log masuk dengan Google dan Zoho,
seperti pada Linux, dan mengenal pasti siapa yang mengehos mel pada domain
anda sendiri, seperti alamat Google Workspace, apabila anda menambah akaun.
"""

["2026-09-30-1511-mail-tables"]
title = "Jadual dalam mel dipaparkan dengan betul"
text = """
Jadual dalam mel, seperti senarai kerja dalam pemberitahuan GitHub Actions,
mengekalkan lajurnya bersebelahan dan menyelaraskannya dari baris ke baris,
dan tidak lagi memecahkan tajuk kepada satu huruf setiap baris. Garis
pemisah antara bahagian mesej kini turut dipaparkan.
"""

["2026-09-30-1550-taller-important-marker"]
title = "Penanda Penting yang lebih tinggi"
text = """
Penanda Penting di sebelah bintang kini 2 px lebih tinggi, jadi ia tidak
lagi kelihatan terhimpit di sebelah bintang dan kotak semak. Ia kekal di
tengah baris.
"""

["2026-09-30-1617-folder-click-goes-to-top"]
title = "Kembali ke atas senarai"
text = """
Sebaik sahaja senarai mel ditatal ke bawah satu skrin, butang bulat di
bahagian bawah kanannya membawanya kembali ke atas. Mengklik folder yang
sedang anda buka, seperti Peti Masuk, melakukan perkara yang sama, seperti
dalam Gmail, begitu juga kekunci Home.
"""

["2026-09-30-1622-send-from-file-manager"]
title = "Hantar fail dari pengurus fail anda"
text = """
Klik kanan fail atau folder dalam Dolphin, GNOME Files atau Windows
Explorer dan pilih Hantar dengan Katna Mail: mesej baharu dibuka dengan
fail itu dilampirkan, dan folder dihantar sebagai zip. Jika anda ada lebih
daripada satu akaun mel, pilih akaun penghantar dalam submenunya.
"""

["2026-09-30-1624-files-page"]
title = "Setiap fail di satu tempat"
text = """
Halaman Fail yang baharu, di bahagian bawah bar apl, menunjukkan setiap
lampiran daripada setiap akaun, yang terbaharu dahulu. Hadkan kepada
gambar, PDF atau dokumen, kepada satu akaun, seseorang atau satu tempoh
masa, atau cari mengikut nama, pengirim atau subjek. Klik kanan fail untuk
pilihan lain, dan Tunjukkan mel membawa anda ke mel yang disertainya.
"""

["2026-09-30-1643-dimmer-row-markers"]
title = "Senarai mel yang lebih tenang"
text = """
Kotak semak kosong, bintang atau penanda Penting dalam senarai mel lebih
malap sehingga penuding berada di atas barisnya. Bintang dan penanda yang
ditetapkan mengekalkan warnanya.
"""

["2026-09-30-1704-folder-arrows-on-hover"]
title = "Anak tetingkap folder yang lebih kemas"
text = """
Anak panah kecil di sebelah Peti Masuk, Dibintangi dan folder lain hanya
muncul semasa penuding berada di atas folder itu. Folder yang telah anda
kembangkan mengekalkan anak panahnya.
"""

["2026-09-30-1712-arrow-keys-in-times"]
title = "Kekunci anak panah dalam kotak masa"
text = """
Dalam Pilih tarikh & masa, dan dalam masa tugas, Atas dan Bawah mengubah
bahagian tempat kursor berada: jam, minit atau AM/PM.
"""

["2026-09-30-1742-check-one-folder"]
title = "Semak mel baharu dalam satu folder"
text = """
“Semak mel baharu” dalam menu klik kanan folder kini hanya menyemak folder
itu, jadi ia pantas. Pada peti masuk akaun di bawah Semua Akaun, ia
menyemak peti masuk akaun itu, dan pada senarai seperti Peti Masuk atau
Dihantar di bawah Semua Akaun, ia menyemak folder itu dalam setiap akaun.
"""

["2026-09-30-1742-frosted-viewer"]
title = "Pemapar kaca fros yang lebih ringan"
text = """
Bar atas pemapar lampiran lebih langsing dan lebih ringan, dan halaman, zum
dan putaran terletak pada satu pil. Di sekeliling fail, Katna Mail
kelihatan kabur di bawah tirai gelap yang lembut, dan bar alat juga
menjadi kaca fros. Kesan kabur mengikut Tetapan > Percubaan; tanpanya,
pemapar menggunakan tirai gelap biasa.
"""

["2026-09-30-1752-touchpad-glide"]
title = "Kibasan pad sentuh meluncur"
text = """
Kibasan pantas dua jari pada pad sentuh terus menatal dan perlahan-lahan
berhenti, seperti dalam apl lain. Sentuh pad sentuh sekali lagi untuk
menghentikannya. Pada Wayland.
"""

["2026-09-30-1800-inbox-tabs-in-top-row"]
title = "Tab peti masuk di baris atas"
text = """
Utama, Promosi, Sosial dan tab peti masuk yang lain kini terletak dalam
bar pil di baris atas senarai, masing-masing dengan kiraan berwarna bagi
mel yang belum dibaca. Serlahan menggelongsor ke tab yang anda pilih, dan
mengklik tab yang terbuka membawa senarainya kembali ke atas. Apabila
senarai sempit, bar itu mengambil barisnya sendiri dan menunjukkan ikon,
sambil mengekalkan nama tab yang terbuka; pada telefon ia terletak dalam
bar senarai, dengan Muat semula dalam menu Lagi.
"""

["2026-09-30-1805-account-menu"]
title = "Maklumat akaun dalam menu klik kanan"
text = """
Klik kanan nama akaun dalam senarai folder, atau peti masuknya di bawah
Semua Akaun, untuk melihat alamatnya, sama ada ia disegerakkan dan bila
kali terakhir disemak, serta berapa banyak storan yang digunakannya. Dari
situ anda boleh menyemak peti masuk itu, menulis mel baharu daripada
akaun itu, membuka tetapannya, atau log masuk semula apabila log masuk
telah tamat tempoh.
"""

["2026-09-30-1819-glass-search-box"]
title = "Kotak carian kaca"
text = """
Dengan latar belakang kabur dihidupkan, kotak carian menjadi kaca fros
dengan tepi yang samar semasa tidak digunakan, dan menjadi padu apabila
anda mengkliknya untuk menaip.
"""

["2026-09-30-1820-search-cancel-restores"]
title = "Batalkan carian, dapatkan semula mel anda"
text = """
Escape atau mengosongkan kotak carian kini membawa anda kembali ke tempat
asal: folder yang sama, kedudukan yang sama dalam senarai dan mel yang
anda buka. Jika anda membuka hasil carian, carian itu mengambil alih
seperti sebelum ini.
"""

["2026-09-30-1840-first-run-window"]
title = "Permulaan pertama yang lebih mesra"
text = """
Semasa anda menyediakan Katna Mail, tetingkap kelihatan di belakang
halaman persediaan di bawah tirai cerah: apl, Karang dan kotak carian,
dengan ruang letak lembut di tempat folder dan mel anda akan muncul.
Langkah baharu menawarkan akaun Katna dan menyenaraikan apa yang
dihidupkannya (resit baca, penjejakan pautan, Aktiviti dan terjemahan),
atau anda boleh melangkauinya.
"""

["2026-09-30-1850-windows-frame-and-blur"]
title = "Bingkai dan kesan kabur Katna pada Windows"
text = """
Pada Windows, Katna Mail kini dibuka di dalam skrin, dimaksimumkan jika
skrin kecil. Tetapan > Percubaan boleh mengaburkan apa yang di belakang
tetingkap, dan bingkai Katna sendiri menjadikan bar atas sebagai bar
tajuk pada kali seterusnya anda membuka Katna Mail.
"""

["2026-09-30-1851-dark-depth"]
title = "Lebih jelas dalam warna gelap"
text = """
Dalam warna gelap, unsur yang terapung di atas senarai mel kini sedikit
lebih cerah dengan tepi cerah yang samar, kerana bayang hampir tidak
kelihatan pada latar gelap. Butang Kembali ke atas, menu, tetingkap
Karang dan dialog kelihatan dengan jelas. Warna cerah kekal seperti
sebelum ini.
"""

["2026-09-30-1911-files-scrollbar"]
title = "Bar tatal pada halaman Fail"
text = """
Apabila fail terlalu banyak untuk dimuatkan, bar tatal nipis muncul di
sebelah kanan semasa anda menatal atau semasa penuding berada di atas
fail, kemudian pudar. Seretnya untuk bergerak melalui fail dengan pantas,
atau klik di atas atau di bawahnya untuk melompat ke situ.
"""

["2026-09-30-1919-tabs-keep-open-mail"]
title = "Bertukar tab mengekalkan mel yang terbuka"
text = """
Dengan anak tetingkap bacaan di sebelah senarai, memilih tab peti masuk
yang lain tidak lagi menutup mel yang sedang anda baca; senarai berubah
dan mel kekal terbuka.
"""

["2026-09-30-1925-inbox-tabs-centred"]
title = "Tab peti masuk di tengah"
text = """
Tab peti masuk kini terletak di tengah baris atas senarai, dan hanya
beralih ke tepi sejauh yang diperlukan oleh butangnya.
"""

["2026-09-30-1945-page-box-arrow-keys"]
title = "Kekunci anak panah dalam kotak halaman"
text = """
Dalam PDF, klik nombor halaman dan tekan Atas atau Bawah untuk pergi ke
halaman sebelumnya atau seterusnya. Tahan kekunci untuk menyelak halaman
dengan pantas.
"""

["2026-09-30-1952-phone-bar-labels"]
title = "Nama apl pada telefon mengikut tetapan anda"
text = """
Dengan nama apl dimatikan dalam Tetapan, bar di bahagian bawah tetingkap
bersaiz telefon kini hanya menunjukkan ikon, di tengah, seperti rel sisi.
"""

["2026-09-30-1955-account-menu-icons"]
title = "Tetapan dan bahasa dalam menu akaun"
text = """
Menu di bawah gambar akaun anda kini dibuka dengan sebaris ikon: buka
Tetapan atau tukar bahasa. Bendera bahasa telah meninggalkan bar atas
untuk memberi ruang.
"""

["2026-09-30-2001-phone-tabs-fold"]
title = "Setiap tab peti masuk kekal dalam capaian"
text = """
Apabila tetingkap sempit, tab peti masuk melipat dengan lancar dan tidak
lagi tersembunyi: label bertukar menjadi ikon yang lebih besar, kemudian
kiraan beralih ke tepi. Pada telefon, tab merentangi seluruh bar, mudah
diketik, dengan Lagi di hujung pil yang sama.
"""

["2026-09-30-2012-fit-and-page-arrows"]
title = "Muat, anak panah halaman dan banyak lagi dalam pemapar"
text = """
Pemapar lampiran mempunyai butang Muat: halaman PDF dimuatkan pada
ketinggian tetingkap, gambar pada tetingkap, dan dokumen, slaid serta
hamparan pada lebarnya. Gambar juga mendapat Saiz sebenar dan boleh
diputar. Halakan penuding ke kotak halaman untuk anak panah kecil bagi
pergi ke halaman sebelumnya atau seterusnya, dan slaid mendapat kotaknya
sendiri.
"""

["2026-09-30-2019-folder-icon-colours"]
title = "Ikon folder berwarna-warni"
text = """
Ikon dalam anak tetingkap folder kini mempunyai warna yang menunjukkan
kandungan setiap folder: Belum dibaca biru, Dibintangi kuning, Penting
ambar, Dihantar hijau, Spam merah, Draf ungu, dan Peti Masuk dalam warna
aksen desktop anda. Kiraan mel terletak dalam pil kecil yang samar.
"""

["2026-09-30-2040-tabs-no-slide"]
title = "Tab peti masuk yang lebih pantas"
text = """
Mengklik tab peti masuk kini menyerlahkannya serta-merta, dengan hanya
riak klik, dan serlahan tidak lagi menggelongsor merentasi tab lain.
"""

["2026-10-01-0145-files-tidy"]
title = "Halaman Fail yang lebih kemas"
text = """
Kiraan di sebelah setiap jenis fail dan setiap akaun kini terletak dalam
pil kecil yang sama seperti kiraan folder dalam Mel. Garis di bawah tajuk
halaman dan baris fail juga bermula dan berakhir pada tepi yang sama.
"""

["2026-10-01-0147-today-marker-fits"]
title = "Tarikh hari ini muat dalam penandanya"
text = """
Dalam paparan Bulan Kalendar, penanda hari ini kini memuatkan seluruh
tarikh. Pada hari pertama bulan, ia menjadi pil di sekeliling “01 Okt”,
bukan bulatan kecil yang labelnya terkeluar.
"""

["2026-10-01-0208-tab-counts-stay"]
title = "Kiraan tab kekal di tempatnya"
text = """
Membuka tab peti masuk tidak lagi membuat bar tab melompat. Tab yang
terbuka mengekalkan kiraan mel baharunya, yang perlahan-lahan pudar
menjadi kelabu tenang, dan kiraan itu melipat dengan lancar sebaik sahaja
anda membaca semua dalam tab itu.
"""

["2026-10-01-0225-files-keyboard"]
title = "Bergerak melalui fail dengan papan kekunci"
text = """
Pada halaman Fail, kekunci anak panah kini bergerak antara fail, Home dan
End pergi ke yang pertama dan terakhir, dan Enter membuka fail. Dalam
pemapar yang dibuka dari situ, anak panah pergi ke fail seterusnya pada
halaman, daripada mel mana pun ia datang; Shift dan anak panah kekal
dengan lampiran mel yang sama.
"""

["2026-10-01-0254-files-dates"]
title = "Pilih hari pada halaman Fail"
text = """
Cip masa pada halaman Fail kini membuka kalendar dua bulan dengan pilihan
pantas seperti Minggu lepas dan Bulan ini. Klik satu hari, atau seret dari
satu hari ke hari lain, dan fail berubah mengikut seretan anda. Kemudian
putar roda tetikus di atas cip untuk mengalihkan tempoh yang sama lebih
awal atau lebih lewat.
"""

["2026-10-01-0256-color-schemes"]
title = "Skema warna dan warna aksen"
text = """
Tetapan > Penampilan kini mempunyai Mod, Warna dan Aksen sebagai pilihan
berasingan. Pilih cerah atau gelap, kemudian mana-mana daripada 14 skema
warna, seperti Jernih, Nord, Solarized atau Catppuccin, atau kekalkan
skema desktop anda. Setiap satu berfungsi dalam cerah dan gelap, dan apa
sahaja warna aksen boleh diletakkan di atasnya.
"""

["2026-10-01-0310-badge-counts-what-notifies"]
title = "Kiraan bar tugas sepadan dengan pemberitahuan anda"
text = """
Kiraan belum dibaca pada bar tugas dan dulang kini mengira mel yang sama
yang memberitahu anda: tab Utama dalam Peti Masuk anda. Promosi, Sosial,
Kemas kini dan Forum tidak lagi menambahnya.
"""

["2026-10-01-0312-quiet-selected-row"]
title = "Folder terbuka yang lebih tenang"
text = """
Folder yang terbuka dalam Mel, dan paparan yang terbuka dalam Kenalan,
Tugas, Nota dan Fail, kini ditanda dengan kelabu lembut dan bukan warna
aksen, jadi Karang dan rel apl lebih menonjol dan ikon folder mengekalkan
warnanya sendiri.
"""

["2026-10-01-0315-desktop-schemes"]
title = "Skema warna desktop anda"
text = """
Tetapan > Penampilan > Warna juga menyenaraikan skema desktop anda
sendiri: setiap skema warna yang dipasang pada KDE Plasma, dan pada
Windows, warnanya sendiri serta tema Kontras. Sistem kini berfungsi dalam
cerah dan gelap pada KDE juga, menggunakan pasangan cerah atau gelap bagi
skema anda, dan Katna mengikut warna aksen Windows.
"""

["2026-10-01-0329-mute-folders"]
title = "Senyapkan folder, tab atau akaun"
text = """
Loceng di atas senarai menyenyapkan folder atau tab Peti Masuk yang
terbuka selama sejam, hingga pagi esok, atau hingga anda menghidupkannya
semula. Klik kanan folder atau akaun untuk perkara yang sama. Tetapan >
Pemberitahuan menunjukkan folder mana yang memberitahu dan yang dikira
pada bar tugas, serta semua yang disenyapkan.
"""

["2026-10-01-0335-tray-style"]
title = "Ikon dulang berwarna atau satu warna"
text = """
Tetapan > Umum > Desktop > Ikon dulang berwarna memilih warna Katna atau
satu warna seperti ikon lain pada panel. Satu warna kekal satu warna
apabila ada mel belum dibaca, dan kiraan belum dibaca sentiasa merah.
Pada Linux, ikon dulang adalah satu warna secara lalai; pada Windows ia
berwarna.
"""

["2026-10-01-0354-mute-conversations"]
title = "Senyapkan perbualan atau pengirim"
text = """
Loceng di atas perbualan yang terbuka menyenyapkannya: balasan baharu
tidak lagi memberitahu anda atau menambah kiraan bar tugas, dan loceng
berpangkah menandainya dalam senarai. Klik kanan perbualan untuk
Senyapkan perbualan atau Senyapkan pengirim, atau tekan M.
"""

["2026-10-01-0410-your-color-schemes"]
title = "Cipta skema warna anda sendiri"
text = """
Tetapan > Penampilan > Warna > Sesuaikan menyalin skema yang anda gunakan
ke dalam penyunting: tukar mana-mana daripada lapan warnanya pada sisi
cerah dan gelap, lihat tetingkap mel dalam warna itu, dan Katna
memberitahu anda apa yang sukar dibaca. Import mengambil fail skema warna
Katna atau KDE, dan klik kanan pada skema anda boleh menyunting,
menduplikasi, mengeksport atau memadamnya.
"""

["2026-10-01-0527-calendar-opens-on-week"]
title = "Kalendar dibuka pada Minggu"
text = """
Katna Calendar dibuka pada paparan Minggu semula, dengan hari-hari akan
datang dalam jam. Bulan, Hari, Tahun dan yang lain hanya sekali klik di
bar atas.
"""

["2026-10-01-0552-lighter-count-on-open-row"]
title = "Kiraan menonjol pada folder yang terbuka"
text = """
Kiraan di sebelah folder yang terbuka dalam Mel, dan di sebelah jenis yang
terbuka dalam Fail, kini terletak dalam pil yang lebih cerah daripada
kelabu baris itu, jadi ia tidak lagi tenggelam, dalam cerah dan gelap.
"""

["2026-10-01-0652-files-leave-out-small-pictures"]
title = "Fail mengetepikan logo tandatangan"
text = """
Halaman Fail tidak lagi dipenuhi logo dan ikon kecil yang datang dalam
tandatangan e-mel: gambar di bawah 12 KB, atau kurang daripada 100 piksel
lebar atau tinggi, kekal di bawah melnya. Ubah kedua-dua had, atau
tunjukkan setiap gambar, dalam Tetapan > Apl lalai > Halaman Fail.
"""

["2026-10-01-0700-mute-from-contact"]
title = "Senyapkan pengirim dari kad kenalannya"
text = """
Kad kenalan di sebelah mel mempunyai loceng sebagai butang pertamanya: ia
menyenyapkan semua daripada pengirim itu, dan loceng berpangkah selepas
namanya menunjukkannya. Klik sekali lagi untuk menerima berita daripada
mereka semula.
"""

["2026-10-01-0803-select-hover-fits"]
title = "Butang pilih yang lebih kemas"
text = """
Latar tuding di belakang kotak semak pilih di bahagian atas senarai mel
kini setinggi butang di sebelahnya, berada sejauh dari tepi kad seperti
dari bahagian atasnya, dan bucunya mengikut bucu kad itu sendiri.
"""

["2026-10-01-0807-files-leave-out-signature-pictures"]
title = "Fail turut mengetepikan gambar tandatangan yang besar"
text = """
Gambar yang dihantar oleh seseorang dalam tiga perbualan atau lebih,
seperti sepanduk atau foto dalam tandatangannya, tidak lagi muncul pada
halaman Fail, begitu juga ikon rangkaian sosial, walau sebesar mana pun.
Ia masih muncul di bawah melnya, dan mematikan “Abaikan gambar kecil”
mengembalikan semuanya.
"""

["2026-10-01-0830-muted-contact-mark"]
title = "Lihat siapa yang disenyapkan"
text = """
Loceng berpangkah kini mengikuti nama pengirim yang disenyapkan di
mana-mana sahaja ia muncul: senarai mel, mel yang terbuka, Kenalan, kotak
Kepada dan Sk serta cadangannya, halaman Fail, tetamu acara dan laporan
Aktiviti. Tiada lagi tertanya-tanya mengapa mel mereka senyap.
"""

["2026-10-01-0839-sounds"]
title = "Bunyi untuk mel baharu, peringatan dan penghantaran"
text = """
Tetapan > Pemberitahuan mempunyai bahagian Bunyi: mel baharu, peringatan,
mel yang kembali ke peti masuk, mel dihantar dan mel tidak dihantar
masing-masing memilih bunyi daripada desktop anda, memainkannya dengan
butang di sebelahnya, atau mematikannya. Bunyi kini dimainkan pada KDE
Plasma juga, dan kekal senyap untuk mel yang disenyapkan dan semasa
Jangan Ganggu.
"""

["2026-10-01-0925-chat-view"]
title = "Baca perbualan sebagai sembang (percubaan)"
text = """
Hidupkan Tetapan > Percubaan > Perbualan sebagai sembang dan mel antara
orang dibaca seperti sembang kumpulan: satu gelembung bagi setiap mel
dengan hanya apa yang ditulis, gelembung anda di sebelah kanan, serta
gambar dan fail sebagai media sembang. Mel yang dipetik dan tandatangan
menunggu di sebalik ··· dalam setiap gelembung, dan klik pada nama
menunjukkan kad orang itu bersama tandatangannya. Balas dari kotak di
bawah, dengan Ctrl+Enter, bar pemformatan di sebalik Aa dan klip kertas
untuk fail, templat dan tandatangan. Surat berita mengekalkan paparan
biasa, dan suis Sembang | Mel menukar mana-mana perbualan ke mana-mana
paparan.
"""

["2026-10-01-0946-forward-keeps-files"]
title = "Majukan mengekalkan fail"
text = """
Memajukan mesej kini membawa lampirannya sekali, ditunjukkan di bawah
mesej supaya anda boleh mengalih keluar mana-mana sebelum menghantar.
Menukar majukan kepada balasan akan mengetepikannya semula.
"""

["2026-10-01-1009-forward-a-file"]
title = "Majukan fail itu sahaja"
text = """
Pemapar lampiran mempunyai butang Majukan di bar atasnya: ia memulakan mel
baharu dengan hanya fail itu dilampirkan, tanpa mel asalnya. Fail tanpa
pratonton juga menawarkan Majukan, begitu juga kad lampiran di bawah mel
yang terbuka, di sebelah Simpan.
"""

["2026-10-01-1039-rephrase-with-ai"]
