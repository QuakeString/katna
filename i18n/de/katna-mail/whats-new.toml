"""

["2026-09-29-1045-note-formatting"]
title = "Formatierung in Notizen"
text = """
Wählen Sie in einer Notiz Formatierung für Überschrift 1, Überschrift 2,
fett, kursiv und unterstrichen, wie in Keep. Die Pinnwand zeigt sie
auch, und sie wandert mit der Notiz in den Ordner Notizen Ihres
E-Mail-Kontos, wo Formatierung von einem iPhone jetzt so zurückkommt,
wie sie war.
"""

["2026-09-29-0934-custom-days-view"]
title = "Nur ein paar Tage anzeigen"
text = """
Der Kalender hat neben der Terminübersicht eine eigene Ansicht: 4 Tage
ab dem gewählten Tag, oder beliebig zwischen 2 und 7. Drücken Sie X, und
wählen Sie die Anzahl in Optionen.
"""

["2026-09-29-0939-events-in-desktop-search"]
title = "Termine vom Desktop aus finden"
text = """
Geben Sie den Namen eines Termins in KRunner oder der Suche von GNOME
ein, um zu sehen, wann er als Nächstes stattfindet, und drücken Sie
Enter, um diesen Tag im Kalender zu öffnen.
"""

["2026-09-29-1102-apps-on-a-phone"]
title = "Kalender, Kontakte, Aufgaben und Notizen auf dem Telefon"
text = """
In einem schmalen Fenster passen diese Seiten jetzt so auf den
Bildschirm wie E-Mail: Ihre Seitenliste öffnet sich über die Menütaste,
Kontakte zeigt jeden Namen mit der Adresse darunter, und Notizen legt
zwei Karten nebeneinander.
"""

["2026-09-29-1236-agenda-button-top-bar"]
title = "Die Tagesübersicht in der oberen Leiste"
text = """
Die Taste, die die Tagesübersicht neben Ihrer E-Mail zeigt, sitzt jetzt
in der oberen Leiste neben der Sprachtaste, und die E-Mail bekommt den
Platz, den der seitliche Streifen belegt hat.
"""

["2026-09-29-1243-hide-side-panel-on-every-page"]
title = "Die Seitenleiste auf jeder Seite ausblenden"
text = """
Die Menütaste oben links klappt die Seitenleiste jetzt auch in Kalender,
Kontakte, Aufgaben und Notizen ein und schiebt sie weg wie die Ordner in
E-Mail. Jede Seite merkt sich, ob Sie sie offen gelassen haben.
"""

["2026-09-29-1251-app-menu-on-a-phone"]
title = "Das Hauptmenü auf dem Telefon"
text = """
Auf dem Telefon öffnet das Hauptmenü hinter dem Kontobild Datei,
Bearbeiten, Ansicht und den Rest an Ort und Stelle, mit einer Zeile
Zurück oben, statt seitlich über den Bildschirmrand hinaus.
"""

["2026-09-29-1256-calendar-every-account"]
title = "Jedes Konto im Kalender"
text = """
Die Seitenliste des Kalenders zeigt jetzt alle Ihre Konten. Wenn die
Kalender eines Kontos nicht laden, sagt eine Zeile darunter, warum, mit
dem einen Klick, der es behebt, etwa „Erneut anmelden, um Kalender
anzuzeigen“.
"""

["2026-09-29-1300-switch-account-stay-on-page"]
title = "Konto wechseln, ohne die Seite zu verlassen"
text = """
Wenn Sie über Ihr Bild oben rechts ein anderes Konto wählen oder darüber
am Mausrad drehen, bleiben Sie jetzt in Kalender, Aufgaben, Kontakte
oder Notizen. Neue Einträge gehen an dieses Konto, und E-Mail zeigt es,
wenn Sie zurückkehren.
"""

["2026-09-29-1317-contacts-every-account"]
title = "Jedes Konto in Kontakte"
text = """
Kontakte listet jetzt alle Ihre Konten unter Konten auf, jeweils mit der
Zahl der Personen darin; klicken Sie auf eines, um nur dessen Personen
zu sehen. Wenn die Kontakte eines Kontos nicht laden, sagt eine Zeile
darunter, warum, mit dem einen Klick, der es behebt, etwa „Erneut
anmelden, um Kontakte anzuzeigen“ oder „Erneut versuchen“.
"""

["2026-09-29-1327-tasks-every-account"]
title = "Jedes Konto auf der Seite Aufgaben"
text = """
Jedes Konto erscheint jetzt in der Seitenleiste von Aufgaben. Wenn die
Aufgaben eines Kontos nicht laden, sagt eine Zeile darunter, warum, mit
einem Klick, der es behebt: erneut anmelden oder erneut versuchen.
"""

["2026-09-29-1404-compose-dialogs-in-view"]
title = "Fragen vor dem Senden bleiben im Blick"
text = """
Fragen wie „Wollten Sie Dateien anhängen?“ öffnen sich jetzt in der
Mitte des Fensters, egal wie lang die Nachricht ist, die Sie schreiben
oder weiterleiten, sodass sie nie weiter unten auf der Seite verborgen
sind. Eingabe antwortet mit der Hauptschaltfläche, und Esc führt zurück
zur Nachricht.
"""

["2026-09-29-1530-mark-up-pdfs"]
title = "PDFs markieren"
text = """
Drücken Sie im PDF-Betrachter auf den Stift, um Text hervorzuheben, zu
unterstreichen, mit einer Wellenlinie zu versehen oder durchzustreichen,
oder zeichnen Sie mit einem Stift, in der Farbe Ihrer Wahl. Rückgängig
mit Strg+Z, eine Markierung entfernen Sie mit dem Radierer, dann
speichern Sie eine markierte Kopie. Der ursprüngliche Anhang bleibt, wie
er war.
"""

["2026-09-29-1557-calendar-accounts-why"]
title = "Warum ein Konto keine Kalender hat"
text = """
Wenn die Kalender eines Kontos nicht erscheinen, sagt der Kalender
jetzt, was der Server geantwortet hat, und Erneut versuchen sucht sofort
erneut danach. Ein mit Passwort hinzugefügtes Gmail- oder Outlook-Konto
bietet an, sich mit Google oder Microsoft anzumelden, was dessen
Kalender brauchen.
"""

["2026-09-29-1610-one-checkbox"]
title = "Kontrollkästchen mit Häkchen"
text = """
Jedes Kontrollkästchen in Katna Mail ist jetzt so groß wie die runden
Tasten daneben. Sein Häkchen zeichnet sich beim Ankreuzen ein und
verschwindet beim Leeren wieder, in Einstellungen, der Mailliste,
Kalender, Kontakte, Notizen und Dialogen gleichermaßen.
"""

["2026-09-29-1622-right-click-menu-fits"]
title = "Ein kürzeres Kontextmenü, das immer passt"
text = """
Das Kontextmenü der Mailliste behält die alltäglichen Aktionen oben und
legt den Rest unter Nachverfolgen (Aufgaben, Notizen, Besprechungen,
Anrufe) und Mehr (Spam, Wichtigkeit, Anheften). Es öffnet sich dort, wo
Sie klicken, und bleibt im Fenster; in einem niedrigen oder schmalen
Fenster öffnet sich ein Untermenü an der Stelle des Menüs.
"""

["2026-09-29-1627-contacts-accounts-why"]
title = "Warum ein Konto keine Kontakte hat"
text = """
Wenn die Kontakte eines Kontos nicht erscheinen, sagt Kontakte jetzt,
was der Server geantwortet hat, und Erneut versuchen sucht sofort erneut
danach. Ein mit Passwort hinzugefügtes Gmail- oder Outlook-Konto bietet
an, sich mit Google oder Microsoft anzumelden, was dessen Kontakte
brauchen.
"""

["2026-09-29-1640-search-box-focus"]
title = "Das Suchfeld zeigt, wenn es aktiv ist"
text = """
Das Suchfeld oben bekommt beim Tippen einen farbigen Rand wie jedes
andere Feld, und sein Hinweis Strg+F tritt zur Seite, bis Sie es leer
lassen.
"""

["2026-09-29-1612-tasks-board-rows"]
title = "Jede Aufgabenliste im Blick"
text = """
Alle Aufgaben zeigt jetzt so viele Listen nebeneinander, wie ins Fenster
passen, mit weiteren Reihen darunter, sodass jede Liste erreichbar ist.
Eine neue Liste rollt ins Bild, sobald Sie sie anlegen.
"""

["2026-09-29-1653-smooth-attachment-paging"]
title = "Flüssiges Blättern zwischen Anhängen"
text = """
Das Wechseln zum nächsten oder vorherigen Anhang im Betrachter mit den
Pfeilen flackert nicht mehr. Der Betrachter bleibt offen, und die
nächste Datei ersetzt die vorige, sobald sie bereit ist.
"""

["2026-09-29-1656-drag-notes"]
title = "Notizen per Ziehen ordnen"
text = """
Ziehen Sie eine Notiz auf der Pinnwand von Notizen, um sie zu
verschieben, wie in Keep. Die anderen Notizen gleiten beiseite, um Platz
zu machen, und sie bleibt dort, wo Sie sie ablegen. Strg+Z legt sie
zurück. Karten sitzen jetzt dicht in ihren Spalten, ohne Lücken unter
kurzen Notizen.
"""

["2026-09-29-1707-calendar-right-click"]
title = "Rechtsklick im Kalender"
text = """
Klicken Sie mit der rechten Maustaste auf eine freie Zeit oder einen
Tag, um dort einen Termin, eine Fokuszeit oder eine Abwesenheit
anzulegen. Ein Rechtsklick auf einen Termin bearbeitet, dupliziert,
löscht oder beantwortet ihn, tritt ihm bei, schreibt den Gästen, färbt
ihn ein oder verschiebt ihn in einen anderen Kalender; auf eine Aufgabe
hakt er sie ab, markiert sie mit einem Stern, gibt ihr einen anderen Tag
oder löscht sie. Rückgängig nimmt eine Änderung zurück.
"""

["2026-09-29-1725-pdf-notes-and-text"]
title = "Notizen und Text auf PDFs"
text = """
Beim Markieren eines PDFs gibt es jetzt Haftnotizen und Textfelder:
Klicken Sie auf die Seite, tippen Sie und drücken Sie Strg+Eingabe.
Zeigen Sie auf eine Notiz, um sie zu lesen, oder klicken Sie darauf, um
sie zu ändern. Antworten schickt Ihre markierte Kopie direkt in einer
Antwort auf die Nachricht zurück.
"""

["2026-09-29-1657-tasks-drag-to-place"]
title = "Aufgaben dorthin ziehen, wo Sie sie wollen"
text = """
Ziehen Sie eine Aufgabe in ihrer Liste nach oben oder unten oder in eine
andere Liste, und die Aufgaben dort gleiten beiseite, um zu zeigen, wo
sie landet. Google Tasks übernimmt die neue Reihenfolge auch auf Ihrem
Telefon, und Rückgängig legt die Aufgabe zurück.
"""

["2026-09-29-1719-calendar-task-tab"]
title = "Eine Aufgabe aus dem Kalender anlegen"
text = """
Die Karte für einen neuen Termin hat einen Tab „Aufgabe“, wie in Google
Calendar. Klicken Sie auf eine Zeit, wählen Sie „Aufgabe“, und Titel,
Tag und Uhrzeit werden zu einer Aufgabe in der Liste Ihrer Wahl, auf
Wunsch mit einer Beschreibung.
"""

["2026-09-29-1758-calendar-new-task-here"]
title = "Eine Aufgabe aus dem Kalender anlegen"
text = """
Klicken Sie im Kalender mit der rechten Maustaste auf eine freie Zeit
oder einen Tag und wählen Sie „Aufgabe“, um dort eine Aufgabe anzulegen.
Die Karte für einen neuen Termin öffnet sich im Tab „Aufgabe“, mit
diesem Tag und dieser Uhrzeit schon eingetragen.
"""

["2026-09-30-0113-calendar-server-unreachable"]
title = "Kalender suchen nach einem langsamen Server erneut"
text = """
Wenn der Kalenderserver eines Kontos nicht rechtzeitig antwortet, sagt
der Kalender das jetzt, und ob die Verbindung oder der sichere
Handshake hängen blieb, statt „Keine Kalender gefunden“. Er versucht
es innerhalb von Minuten erneut statt erst nach Stunden.
"""

["2026-09-30-0123-contact-files-fill"]
title = "Dateien eines Kontakts zeigen ihren Download"
text = """
Eine Datei in den Kontaktdetails, deren Mail noch nicht auf diesem
Computer ist, füllt sich jetzt beim Herunterladen, wie Anhänge in der
Liste, und öffnet sich dann.
"""

["2026-09-30-0135-new-account-mail-shows-as-it-arrives"]
title = "E-Mails eines neuen Kontos erscheinen, sobald sie eintreffen"
text = """
Nachdem Sie ein Konto hinzugefügt haben, wird zuerst sein Posteingang
heruntergeladen und füllt sich vor Ihren Augen, statt bei „Ihre E-Mails
werden abgerufen…“ zu bleiben, bis jeder Ordner fertig ist. Andere
Ordner füllen sich auf dieselbe Weise.
"""

["2026-09-30-0159-checkbox-matches-icons"]
title = "Kontrollkästchen auf Höhe der Symbole"
text = """
Kontrollkästchen sind etwas kleiner, so groß wie die Stern- und
Label-Symbole daneben in der Mailliste. Sie lassen sich genauso leicht
anklicken, und das Häkchen zeichnet sich weiterhin ein.
"""

["2026-09-30-0201-zoho-calendars"]
title = "Zoho-Kalender über Zohos eigene Verbindung"
text = """
Zoho stellt Kalender für andere Apps über einen Port bereit, den viele
Netzwerke sperren, deshalb liest der Kalender sie nach Mit Zoho anmelden
stattdessen über Zohos eigene API. Deine Zoho-Termine erscheinen neben
deinen anderen Kalendern; sie aus Katna zu ändern, kommt später.
"""

["2026-09-30-0216-zoho-tasks"]
title = "Zoho-Aufgaben"
text = """
Melde dich bei einem Zoho-Konto mit Mit Zoho anmelden an, und seine
Zoho-ToDo-Aufgaben erscheinen in Aufgaben, in beide Richtungen: Lege in
Katna eine Aufgabe an, bearbeite, erledige oder lösche sie, und sie
ändert sich auch in Zoho.
"""

["2026-09-30-0224-checkbox-tick-centred"]
title = "Häkchen in der Mitte, bei jeder Größe"
text = """
Mit Einstellungen > Darstellung > Skalierung über 100 % saß das Häkchen
eines Kontrollkästchens etwas zu weit oben links. Die Ränder von
Kontrollkästchen und runden Tasten wachsen jetzt mit der Skalierung,
sodass das Häkchen bei jeder Größe mittig sitzt.
"""

["2026-09-30-0230-edges-follow-scaling"]
title = "Umrisse wachsen mit der Skalierung"
text = """
Ist die Skalierung unter Einstellungen > Darstellung über oder unter
100 %, wachsen und schrumpfen der Akzentrand des aktiven Suchfelds und
der Felder sowie die Ränder von Auswahlkarten und Aufgabenringen jetzt
mit allem anderen, statt dünn zu bleiben.
"""

["2026-09-30-0326-google-sign-in-network"]
title = "Mit Google anmelden in jedem Netzwerk"
text = """
Mit Google anmelden bricht nicht mehr mit „peer closed connection“ ab,
in Netzwerken, die die Verbindung zu Google früh trennen. Wenn Sie auf
der Seite von Google den Haken bei Gmail entfernen, sagt Katna das
jetzt, statt später zu scheitern.
"""

["2026-09-30-0504-google-api-turned-off"]
title = "Zeigt, welche Google-API aus ist"
text = """
Wenn Google eine API für Katna ausgeschaltet hat, sagen Kontakte,
Kalender, Aufgaben und Drive-Dateien jetzt in einer kurzen Zeile,
welche es ist, mit einer Schaltfläche Einschalten, die die passende
Seite von Google öffnet, statt Googles rohe Fehlermeldung zu zeigen.
"""

["2026-09-30-0507-newest-mail-first"]
title = "Neueste E-Mails zuerst"
text = """
Wenn Sie ein Konto hinzufügen, lädt Katna Mail jetzt zuerst Ihre
neuesten E-Mails herunter und arbeitet sich dann zu älteren vor, sodass
die heutigen Nachrichten sofort oben im Posteingang stehen. Wird der
Download unterbrochen, holt es die älteren E-Mails beim nächsten Mal.
"""

["2026-09-30-0601-keyring-at-login"]
title = "Wartet bei der Anmeldung auf Ihre Brieftasche"
text = """
Ist KWallet oder der GNOME-Schlüsselbund beim Start von Katna noch
gesperrt und das Entsperrfenster geschlossen, zeigen Ihre Konten kein
falsches Passwort mehr an. Sie warten und beginnen von selbst zu
synchronisieren, sobald Sie die Brieftasche entsperren, ohne dass Sie
Katna beenden müssen. Synchronisieren bittet jetzt erneut ums Entsperren.
"""

["2026-09-30-0606-pdf-rotate-and-top-bar"]
title = "PDF-Seiten drehen"
text = """
Der PDF-Betrachter kann Seiten jetzt im oder gegen den Uhrzeigersinn
drehen (Strg+R und Strg+Umschalt+R), und eine markierte Kopie wird so
gespeichert, wie Sie sie gedreht haben. Seitenzahl und Zoom sind in die
obere Leiste gewandert, sodass nichts die Seite verdeckt.
"""

["2026-09-30-0610-calendar-events-stay-put"]
title = "Termine bleiben, wo sie sind"
text = """
Wer im Kalender auf einen Termin oder eine Aufgabe klickt und dann die
Ansicht wechselt, hat ihn nicht mehr am Mauszeiger hängen. Ein Termin
bewegt sich jetzt nur, solange Sie die Taste gedrückt halten und ihn
ziehen, und ein Wechsel von Ansicht oder Seite, Esc oder das Öffnen
seiner Karte setzt ihn unverändert zurück.
"""

["2026-09-30-0620-checkbox-partial-centred"]
title = "Teilweise angehakte Kästchen sehen gleichmäßig aus"
text = """
Wenn nur einige Nachrichten ausgewählt sind, hat das Quadrat im
Kästchen „Alle auswählen“ jetzt auf jeder Seite denselben Abstand, bei
jeder Skalierung der Oberfläche.
"""

["2026-09-30-0632-year-view-day-peek"]
title = "Die Pläne eines Tages in der Jahresansicht"
text = """
Ruhen Sie in der Jahresansicht des Kalenders mit dem Mauszeiger auf
einem Tag mit Punkt, um seine Termine und Aufgaben in einem kleinen
Fenster daneben zu sehen, jeweils mit einem Symbol für die Art und mit
Uhrzeit. Klicken Sie auf einen Eintrag, um ihn zu öffnen, oder auf den
Namen des Tages, um den Tag zu öffnen. Auf dem Handy tippen Sie auf den
Tag.
"""

["2026-09-30-0650-notification-opens-own-window"]
title = "Benachrichtigungen öffnen die E-Mail im Vordergrund"
text = """
Ein Klick auf eine Benachrichtigung über neue E-Mails öffnet die E-Mail
in einem eigenen Fenster im Vordergrund, egal was Katna gerade zeigt.
Allen antworten öffnet sie mit der Antwort bereit zum Tippen. Archivieren
legt die E-Mail ab, ohne etwas zu öffnen, und sagt das in einer kurzen
Meldung mit Rückgängig.
"""

["2026-09-30-0700-event-card-join-any-call"]
title = "Teams- und Zoom-Anrufen aus dem Kalender beitreten"
text = """
Die Karte eines Termins findet den Anruf jetzt in Beschreibung oder Ort,
sodass eine Einladung zu Microsoft Teams, Zoom, Webex, Jitsi oder Google
Meet oben eine Schaltfläche „Mit … teilnehmen“ bekommt. Webadressen in der
Beschreibung sind Links, die Zeilen aus Unterstrichen sind verschwunden,
und Teilnehmen? bleibt unten, während die Details scrollen.
"""

["2026-09-30-0715-click-away-closes-viewer"]
title = "Daneben klicken zum Schließen"
text = """
Klicken Sie auf den abgedunkelten Bereich um einen Anhang, um den
Betrachter zu schließen, statt zur Zurück-Taste zu greifen. Klicks auf
die Seite selbst markieren wie bisher Text und Anmerkungen.
"""

["2026-09-30-0729-add-account-and-pop3"]
title = "Ein neues Konto hinzufügen, und POP3"
text = """
Ein Konto hinzuzufügen beginnt mit Ihrem Anbieter: Google, Yahoo,
iCloud, Zoho, Fastmail, GMX, Yandex oder einem anderen. Katna sagt
zuerst, was der Anbieter braucht, zeigt jeden Schritt beim Verbinden und
endet mit dem, was es eingerichtet hat. POP3-Konten funktionieren auch,
und unter Einstellungen > Konten legen Sie fest, wie lange ihre E-Mails
auf dem Server bleiben.
"""

["2026-09-30-0802-ctrl-wheel-zoom"]
title = "Zoomen mit Strg und dem Mausrad"
text = """
Halten Sie im Anhangsbetrachter Strg gedrückt und drehen Sie das
Mausrad, um rund um den Mauszeiger hinein- und herauszuzoomen, oder
ziehen Sie zwei Finger auf dem Touchpad auseinander. Das funktioniert
bei PDFs, Bildern, Textdateien, Tabellen und Dokumenten.
"""

["2026-09-30-0817-event-open-the-mail"]
title = "Die E-Mail hinter einem Termin öffnen"
text = """
Termine, die Gmail aus einer E-Mail angelegt hat, etwa Züge, Flüge und
Hotels, bekommen auf ihrer Karte die Schaltfläche E-Mail öffnen. Sie
öffnet diese E-Mail in Katna, oder in Gmail, wenn Katna sie nicht hat.
Eine aus einer E-Mail angelegte Aufgabe öffnet ihre E-Mail auch von
ihrer Karte im Kalender aus, und Besprechungsnotizen erstellen öffnet
sich ohne Flackern.
"""

["2026-09-30-0843-calendar-side-panel-menus"]
title = "Kalender in der Seitenleiste verwalten"
text = """
Klicken Sie in der Seitenleiste des Kalenders mit der rechten Maustaste
auf einen Kalender, um nur ihn anzuzeigen, seine Farbe zu ändern, ihn
umzubenennen oder zu löschen. Ein Rechtsklick auf den Namen eines Kontos
legt in diesem Konto einen neuen Kalender an oder blendet alle seine
Kalender ein und aus. Änderungen gehen an Ihren E-Mail-Dienst, sodass
sie überall erscheinen, wo Sie ihn nutzen.
"""

["2026-09-30-1010-unread-list-keeps-open-mail"]
title = "Ungelesene E-Mails bleiben offen"
text = """
Eine Konversation unter Alle Konten > Ungelesen schließt sich beim
Öffnen nicht mehr sofort. Beim Lesen wird sie als gelesen markiert und
bleibt in der Liste, bis Sie sie schließen oder eine andere öffnen.
"""

["2026-09-30-1045-tracked-mail-arrives"]
title = "Verfolgte E-Mails kommen wieder an"
text = """
Mit eingeschaltetem Tracking gesendete E-Mails konnten unter Gesendet
erscheinen, ohne jemanden zu erreichen. Sie gehen jetzt an jeden
Empfänger. So verlorene E-Mails müssen erneut gesendet werden.
"""

["2026-09-30-1114-no-checking-pill"]
title = "Keine Prüfen-Meldung mehr"
text = """
„Auf neue E-Mails wird geprüft…“ erscheint nicht mehr über der Liste.
Die drehenden Pfeile auf der Aktualisieren-Taste und am Posteingang
jedes Kontos zeigen bereits, dass E-Mails abgerufen werden, und eine
fehlgeschlagene Prüfung sagt weiterhin, was schiefging.
"""

["2026-09-30-1300-windows-sign-in-and-domains"]
title = "Mit Google anmelden unter Windows"
text = """
Katna für Windows bietet jetzt Mit Google und Mit Zoho anmelden an, wie
unter Linux, und erkennt beim Hinzufügen des Kontos, wer die E-Mails
Ihrer eigenen Domain bereitstellt, etwa bei einer
Google-Workspace-Adresse.
"""

["2026-09-30-1511-mail-tables"]
title = "Tabellen in E-Mails richtig lesbar"
text = """
Tabellen in E-Mails, etwa die Jobliste in einer Benachrichtigung von
GitHub Actions, behalten ihre Spalten nebeneinander und richten sie von
Zeile zu Zeile aus, statt eine Überschrift Buchstabe für Buchstabe
umzubrechen. Trennlinien zwischen Teilen einer Nachricht erscheinen
jetzt auch.
"""

["2026-09-30-1550-taller-important-marker"]
title = "Höhere Wichtig-Markierung"
text = """
Die Wichtig-Markierung neben dem Stern ist 2 px höher und wirkt neben
Stern und Kontrollkästchen nicht mehr gestaucht. Sie bleibt mittig in
der Zeile.
"""

["2026-09-30-1617-folder-click-goes-to-top"]
title = "Zurück zum Anfang der Liste"
text = """
Ist die E-Mail-Liste eine Bildschirmhöhe weit gescrollt, bringt sie eine
runde Taste unten rechts zurück an den Anfang. Ein Klick auf den Ordner,
in dem Sie schon sind, etwa Posteingang, tut dasselbe, wie in Gmail, und
ebenso die Taste Pos1.
"""

["2026-09-30-1622-send-from-file-manager"]
title = "Dateien aus dem Dateimanager senden"
text = """
Klicken Sie in Dolphin, GNOME Dateien oder dem Windows Explorer mit der
rechten Maustaste auf Dateien oder Ordner und wählen Sie Mit Katna Mail
senden: Eine neue Nachricht öffnet sich mit ihnen als Anhang, und ein
Ordner geht als ZIP mit. Mit mehr als einem E-Mail-Konto wählen Sie im
Untermenü, von welchem Sie senden.
"""

["2026-09-30-1624-files-page"]
title = "Alle Dateien an einem Ort"
text = """
Die neue Seite Dateien, unten in der App-Leiste, zeigt jeden Anhang aus
jedem Konto, die neuesten zuerst. Schränken Sie sie auf Bilder, PDFs
oder Dokumente, auf ein Konto, eine Person oder einen Zeitraum ein, oder
suchen Sie nach Name, Absender oder Betreff. Ein Rechtsklick auf eine
Datei bietet mehr, und E-Mail anzeigen führt zur E-Mail, mit der sie
kam.
"""

["2026-09-30-1643-dimmer-row-markers"]
title = "Ruhigere E-Mail-Liste"
text = """
Ein leeres Kontrollkästchen, ein Stern oder eine Wichtig-Markierung in
der E-Mail-Liste ist blasser, bis der Mauszeiger über der Zeile ist.
Gesetzte Sterne und Markierungen behalten ihre Farbe.
"""

["2026-09-30-1704-folder-arrows-on-hover"]
title = "Aufgeräumtere Ordnerleiste"
text = """
Die kleinen Pfeile neben Posteingang, Markiert und den anderen Ordnern
erscheinen nur, solange der Mauszeiger über dem Ordner ist. Ein
aufgeklappter Ordner behält seinen Pfeil.
"""

["2026-09-30-1712-arrow-keys-in-times"]
title = "Pfeiltasten in Zeitfeldern"
text = """
In Datum und Uhrzeit wählen und bei der Uhrzeit einer Aufgabe ändern
Nach oben und Nach unten den Teil, in dem der Cursor steht: Stunde,
Minuten oder AM/PM.
"""

["2026-09-30-1742-check-one-folder"]
title = "Einen einzelnen Ordner auf neue E-Mails prüfen"
text = """
„Auf neue E-Mails prüfen“ im Kontextmenü eines Ordners prüft jetzt nur
diesen Ordner und ist daher schnell. Am Posteingang eines Kontos unter
Alle Konten prüft es den Posteingang dieses Kontos, und an einer Liste
wie Posteingang oder Gesendet unter Alle Konten prüft es diesen Ordner
in jedem Konto.
"""

["2026-09-30-1742-frosted-viewer"]
title = "Ein leichterer, gefrosteter Betrachter"
text = """
Die obere Leiste des Anhangsbetrachters ist schmaler und heller, und
Seite, Zoom und Drehen sitzen auf einer Pille. Rund um die Datei
erscheint Katna Mail verschwommen unter einem weichen dunklen Schleier,
und auch die Werkzeugleisten sind gefrostet. Die Unschärfe folgt
Einstellungen > Experimentell; ohne sie nutzt der Betrachter einen
schlichten dunklen Schleier.
"""

["2026-09-30-1752-touchpad-glide"]
title = "Touchpad-Wischer gleiten aus"
text = """
Ein schnelles Wischen mit zwei Fingern auf dem Touchpad scrollt weiter
und wird langsamer, wie in anderen Apps. Berühren Sie das Touchpad
erneut, um es anzuhalten. Unter Wayland.
"""

["2026-09-30-1800-inbox-tabs-in-top-row"]
title = "Posteingangs-Tabs in der oberen Zeile"
text = """
Allgemein, Werbung, Soziale Netzwerke und die anderen Posteingangs-Tabs
sitzen jetzt in einer Pillenleiste in der oberen Zeile der Liste, jeder
mit einer farbigen Zahl seiner ungelesenen E-Mails. Die Hervorhebung
gleitet zum gewählten Tab, und ein Klick auf den offenen Tab bringt
seine Liste an den Anfang. Ist die Liste schmal, bekommt die Leiste eine
eigene Zeile und zeigt Symbole, wobei der offene Tab seinen Namen
behält; auf dem Handy sitzt sie in der Leiste der Liste, mit
Aktualisieren im Menü Mehr.
"""

["2026-09-30-1805-account-menu"]
title = "Kontoinfos im Kontextmenü"
text = """
Klicken Sie mit der rechten Maustaste auf den Namen eines Kontos in der
Ordnerliste oder auf seinen Posteingang unter Alle Konten, um seine
Adresse zu sehen, ob es synchron ist, wann es zuletzt geprüft wurde und
wie viel Speicher es belegt. Von dort aus können Sie diesen Posteingang
prüfen, eine neue E-Mail von diesem Konto schreiben, seine Einstellungen
öffnen oder sich erneut anmelden, wenn die Anmeldung abgelaufen ist.
"""

["2026-09-30-1819-glass-search-box"]
title = "Ein Suchfeld aus Glas"
text = """
Mit eingeschaltetem verschwommenem Hintergrund ist das Suchfeld
gefrostetes Glas mit einem zarten Rand, solange Sie es nicht benutzen,
und wird undurchsichtig, wenn Sie zum Tippen hineinklicken.
"""

["2026-09-30-1820-search-cancel-restores"]
title = "Suche abbrechen, E-Mails zurück"
text = """
Esc oder das Leeren des Suchfelds bringt Sie jetzt dorthin zurück, wo
Sie waren: in denselben Ordner, an dieselbe Stelle der Liste und zur
E-Mail, die Sie offen hatten. Öffnen Sie stattdessen ein Ergebnis,
übernimmt die Suche wie bisher.
"""

["2026-09-30-1840-first-run-window"]
title = "Ein freundlicherer erster Start"
text = """
Während Sie Katna Mail einrichten, ist das Fenster hinter den
Einrichtungsseiten unter einem hellen Schleier zu sehen: die Apps,
Schreiben und das Suchfeld, mit sanften Platzhaltern, wo Ihre Ordner und
E-Mails erscheinen werden. Ein neuer Schritt bietet ein Katna-Konto an
und nennt, was es einschaltet (Lesebestätigungen, Link-Verfolgung,
Aktivität und Übersetzung), oder Sie überspringen ihn.
"""

["2026-09-30-1850-windows-frame-and-blur"]
title = "Katnas Rahmen und Unschärfe unter Windows"
text = """
Unter Windows öffnet sich Katna Mail jetzt innerhalb des Bildschirms,
maximiert, wenn der Bildschirm klein ist. Einstellungen > Experimentell
kann verschwimmen lassen, was hinter dem Fenster liegt, und Katnas
eigener Rahmen macht die obere Leiste zur Titelleiste, sobald Sie Katna
Mail das nächste Mal öffnen.
"""

["2026-09-30-1851-dark-depth"]
title = "Besser sichtbar in dunklen Farben"
text = """
In dunklen Farben sind Dinge, die über der E-Mail-Liste schweben, jetzt
eine Spur heller und haben einen zarten hellen Rand, da Schatten auf
dunklem Hintergrund kaum sichtbar sind. Die Taste Nach oben, Menüs, das
Schreibfenster und Dialoge heben sich deutlich ab. Helle Farben sehen
aus wie bisher.
"""

["2026-09-30-1911-files-scrollbar"]
title = "Eine Bildlaufleiste auf der Seite Dateien"
text = """
Gibt es mehr Dateien, als hineinpassen, erscheint rechts eine schmale
Bildlaufleiste, während Sie scrollen oder der Mauszeiger über den
Dateien ist, und blendet sich dann aus. Ziehen Sie sie, um schnell durch
die Dateien zu gehen, oder klicken Sie darüber oder darunter, um dorthin
zu springen.
"""

["2026-09-30-1919-tabs-keep-open-mail"]
title = "Tabwechsel behält die offene E-Mail"
text = """
Mit dem Lesebereich neben der Liste schließt die Wahl eines anderen
Posteingangs-Tabs nicht mehr die E-Mail, die Sie lesen; die Liste ändert
sich, und die E-Mail bleibt offen.
"""

["2026-09-30-1925-inbox-tabs-centred"]
title = "Posteingangs-Tabs in der Mitte"
text = """
Die Posteingangs-Tabs sitzen jetzt in der Mitte der oberen Zeile der
Liste und weichen nur so weit aus, wie ihre Schaltflächen es brauchen.
"""

["2026-09-30-1945-page-box-arrow-keys"]
title = "Pfeiltasten im Seitenfeld"
text = """
Klicken Sie in einem PDF auf die Seitenzahl und drücken Sie Nach oben
oder Nach unten, um eine Seite zurück oder vor zu gehen. Halten Sie die
Taste, um schnell durch die Seiten zu blättern.
"""

["2026-09-30-1952-phone-bar-labels"]
title = "App-Namen auf dem Handy folgen Ihrer Einstellung"
text = """
Sind die App-Namen in den Einstellungen ausgeschaltet, zeigt die Leiste
am unteren Rand eines handygroßen Fensters jetzt nur die Symbole,
zentriert, wie die seitliche Leiste.
"""

["2026-09-30-1955-account-menu-icons"]
title = "Einstellungen und Sprache im Kontomenü"
text = """
Das Menü unter Ihrem Kontobild beginnt jetzt mit einer Reihe von
Symbolen: Einstellungen öffnen oder die Sprache ändern. Die
Sprachflagge hat die obere Leiste verlassen, um Platz zu machen.
"""

["2026-09-30-2001-phone-tabs-fold"]
title = "Jeder Posteingangs-Tab bleibt erreichbar"
text = """
Ist das Fenster schmal, falten sich die Posteingangs-Tabs sanft
zusammen, statt zu verschwinden: Beschriftungen werden zu größeren
Symbolen, dann treten die Zahlen zur Seite. Auf dem Handy verteilen sich
die Tabs über die ganze Leiste, leicht zu tippen, mit Mehr am Ende
derselben Pille.
"""

["2026-09-30-2012-fit-and-page-arrows"]
title = "Einpassen, Seitenpfeile und mehr im Betrachter"
text = """
Der Anhangsbetrachter hat eine Schaltfläche Einpassen: Eine PDF-Seite
passt sich der Fensterhöhe an, ein Bild dem Fenster, und Dokumente,
Folien und Tabellen der Breite. Bilder bekommen außerdem Originalgröße
und lassen sich drehen. Zeigen Sie auf das Seitenfeld, um kleine Pfeile
für eine Seite zurück oder vor zu sehen, und Folien bekommen ein eigenes
Feld.
"""

["2026-09-30-2019-folder-icon-colours"]
title = "Bunte Ordnersymbole"
text = """
Die Symbole der Ordnerleiste haben jetzt Farben, die sagen, was jeder
Ordner enthält: Ungelesen blau, Markiert gelb, Wichtig bernsteinfarben,
Gesendet grün, Spam rot, Entwürfe lila und Posteingang in der
Akzentfarbe Ihrer Arbeitsumgebung. E-Mail-Zahlen sitzen in kleinen,
blassen Pillen.
"""

["2026-09-30-2040-tabs-no-slide"]
title = "Schnellere Posteingangs-Tabs"
text = """
Ein Klick auf einen Posteingangs-Tab hebt ihn jetzt sofort hervor, nur
mit der Welle des Klicks, statt die Hervorhebung über die anderen Tabs
gleiten zu lassen.
"""

["2026-10-01-0145-files-tidy"]
title = "Eine aufgeräumtere Seite Dateien"
text = """
Die Zahlen neben jeder Dateiart und jedem Konto sitzen jetzt in
denselben kleinen Pillen wie die Ordnerzahlen in E-Mail. Die Linie unter
dem Seitentitel und die Dateizeilen beginnen und enden außerdem an
denselben Kanten.
"""

["2026-10-01-0147-today-marker-fits"]
title = "Das heutige Datum passt in seine Markierung"
text = """
In der Monatsansicht des Kalenders fasst die Markierung für heute jetzt
das ganze Datum. Am 1. wird sie zu einer Pille um „01. Okt.“ statt eines
kleinen Kreises, aus dem die Beschriftung herausragte.
"""

["2026-10-01-0208-tab-counts-stay"]
title = "Tab-Zahlen bleiben stehen"
text = """
Das Öffnen eines Posteingangs-Tabs lässt die Tableiste nicht mehr
springen. Der offene Tab behält seine Zahl neuer E-Mails, die langsam zu
einem ruhigen Grau verblasst, und die Zahl verschwindet sanft, sobald
Sie alles in diesem Tab gelesen haben.
"""

["2026-10-01-0225-files-keyboard"]
title = "Mit der Tastatur durch Ihre Dateien"
text = """
Auf der Seite Dateien wechseln die Pfeiltasten jetzt zwischen Dateien,
Pos1 und Ende gehen zur ersten und letzten, und Eingabe öffnet eine. Im
von dort geöffneten Betrachter gehen die Pfeile zur nächsten Datei auf
der Seite weiter, egal mit welcher E-Mail sie kam; Umschalt und ein
Pfeil bleiben bei den Anhängen derselben E-Mail.
"""

["2026-10-01-0254-files-dates"]
title = "Die Tage auf der Seite Dateien wählen"
text = """
Der Zeit-Chip auf der Seite Dateien öffnet jetzt einen Kalender mit zwei
Monaten und Schnellauswahlen wie Letzte Woche und Dieser Monat. Klicken
Sie auf einen Tag oder ziehen Sie von einem Tag zum anderen, und die
Dateien folgen schon beim Ziehen. Drehen Sie dann das Mausrad über dem
Chip, um denselben Zeitraum früher oder später zu verschieben.
"""

["2026-10-01-0256-color-schemes"]
title = "Farbschemata und Akzentfarben"
text = """
Einstellungen > Darstellung hat jetzt Modus, Farben und Akzent als
getrennte Auswahl. Wählen Sie hell oder dunkel, dann eines von 14
Farbschemata wie Clear, Nord, Solarized oder Catppuccin, oder behalten
Sie das Ihrer Arbeitsumgebung. Jedes funktioniert hell und dunkel, und
jede Akzentfarbe lässt sich darüberlegen.
"""

["2026-10-01-0310-badge-counts-what-notifies"]
title = "Die Zahl in der Taskleiste passt zu Ihren Benachrichtigungen"
text = """
Die Zahl ungelesener E-Mails in Taskleiste und Systemabschnitt zählt
jetzt dieselben E-Mails, die Sie benachrichtigen: den Tab Allgemein
Ihres Posteingangs. Werbung, Soziale Netzwerke, Benachrichtigungen und
Foren zählen nicht mehr mit.
"""

["2026-10-01-0312-quiet-selected-row"]
title = "Ein ruhigerer offener Ordner"
text = """
Der offene Ordner in E-Mail und die offene Ansicht in Kontakte,
Aufgaben, Notizen und Dateien sind jetzt in sanftem Grau statt in der
Akzentfarbe markiert, sodass Schreiben und die App-Leiste hervortreten
und die Ordnersymbole ihre eigenen Farben behalten.
"""

["2026-10-01-0315-desktop-schemes"]
title = "Die Farbschemata Ihrer Arbeitsumgebung"
text = """
Einstellungen > Darstellung > Farben listet auch die eigenen Schemata
Ihrer Arbeitsumgebung: jedes unter KDE Plasma installierte Farbschema
und unter Windows dessen eigene Farben und Kontrastdesigns. System
funktioniert jetzt auch unter KDE hell und dunkel, mit dem hellen oder
dunklen Gegenstück Ihres Schemas, und Katna folgt der Akzentfarbe von
Windows.
"""

["2026-10-01-0329-mute-folders"]
title = "Einen Ordner, Tab oder ein Konto stummschalten"
text = """
Die Glocke über der Liste schaltet den offenen Ordner oder
Posteingangs-Tab für eine Stunde, bis morgen früh oder bis Sie sie
wieder einschalten stumm. Ein Rechtsklick auf einen Ordner oder ein
Konto bietet dasselbe. Einstellungen › Benachrichtigungen zeigt, welche
Ordner benachrichtigen und welche in der Taskleiste zählen, und alles
Stummgeschaltete.
"""

["2026-10-01-0335-tray-style"]
title = "Symbol im Systemabschnitt farbig oder einfarbig"
text = """
Einstellungen > Allgemein > Arbeitsumgebung > Farbiges Symbol im
Systemabschnitt wählt Katnas Farben oder eine Farbe wie die anderen
Symbole der Leiste. Einfarbig bleibt auch bei ungelesenen E-Mails
einfarbig, und die Zahl ungelesener E-Mails ist immer rot. Unter Linux
ist das Symbol standardmäßig einfarbig, unter Windows farbig.
"""

["2026-10-01-0354-mute-conversations"]
title = "Eine Konversation oder einen Absender stummschalten"
text = """
Die Glocke über einer offenen Konversation schaltet sie stumm: Neue
Antworten benachrichtigen Sie nicht mehr und zählen nicht mehr in der
Taskleiste, und eine durchgestrichene Glocke markiert sie in der Liste.
Ein Rechtsklick auf eine Konversation bietet Konversation stummschalten
oder Absender stummschalten, oder drücken Sie M.
"""

["2026-10-01-0410-your-color-schemes"]
title = "Ein eigenes Farbschema erstellen"
text = """
Einstellungen > Darstellung > Farben > Anpassen kopiert Ihr aktuelles
Schema in einen Editor: Ändern Sie jede seiner acht Farben auf der
hellen und der dunklen Seite, sehen Sie das E-Mail-Fenster darin, und
Katna sagt Ihnen, was schwer lesbar wäre. Importieren übernimmt eine
Farbschema-Datei von Katna oder KDE, und ein Rechtsklick auf Ihr Schema
bearbeitet, dupliziert, exportiert oder löscht es.
"""

["2026-10-01-0527-calendar-opens-on-week"]
title = "Der Kalender öffnet sich in der Woche"
text = """
Katna Calendar öffnet sich wieder in der Wochenansicht, mit den
kommenden Tagen in Stunden. Monat, Tag, Jahr und die anderen sind einen
Klick entfernt in der oberen Leiste.
"""

["2026-10-01-0552-lighter-count-on-open-row"]
title = "Zahlen heben sich am offenen Ordner ab"
text = """
Die Zahl neben dem offenen Ordner in E-Mail und neben der offenen Art in
Dateien sitzt jetzt in einer Pille, die heller ist als das Grau der
Zeile, sodass sie nicht mehr darin versinkt, in hell und dunkel.
"""

["2026-10-01-0652-files-leave-out-small-pictures"]
title = "Dateien lässt Signaturlogos weg"
text = """
Die Seite Dateien füllt sich nicht mehr mit den kleinen Logos und
Symbolen aus E-Mail-Signaturen: Bilder unter 12 KB oder unter 100 Pixel
breit oder hoch bleiben unter ihrer E-Mail. Ändern Sie beide Grenzen
oder zeigen Sie jedes Bild unter Einstellungen > Standard-Apps > Seite
Dateien.
"""

["2026-10-01-0700-mute-from-contact"]
title = "Einen Absender von seiner Kontaktkarte aus stummschalten"
text = """
Die Kontaktkarte neben einer E-Mail hat als erste Schaltfläche eine
Glocke: Sie schaltet alles von diesem Absender stumm, und eine
durchgestrichene Glocke hinter dem Namen zeigt das an. Klicken Sie
erneut darauf, um wieder von ihm zu hören.
"""

["2026-10-01-0803-select-hover-fits"]
title = "Eine aufgeräumtere Auswahltaste"
text = """
Die Hervorhebung hinter dem Auswahlkästchen oben in der E-Mail-Liste ist
jetzt so hoch wie die Schaltflächen daneben, hat zum Rand der Karte
denselben Abstand wie nach oben, und ihre Ecken folgen der Ecke der
Karte.
"""

["2026-10-01-0807-files-leave-out-signature-pictures"]
title = "Dateien lässt auch große Signaturbilder weg"
text = """
Ein Bild, das jemand in drei oder mehr Konversationen schickt, etwa das
Banner oder Foto in seiner Signatur, erscheint nicht mehr auf der Seite
Dateien, ebenso wenig Symbole sozialer Netzwerke, egal wie groß. Unter
ihrer E-Mail sind sie weiterhin zu sehen, und wer „Kleine Bilder
auslassen“ ausschaltet, bekommt sie alle zurück.
"""

["2026-10-01-0830-muted-contact-mark"]
title = "Sehen, wer stummgeschaltet ist"
text = """
Eine durchgestrichene Glocke folgt jetzt dem Namen eines
stummgeschalteten Absenders überall, wo er erscheint: in der
E-Mail-Liste, einer offenen E-Mail, Kontakte, den Feldern An und Cc und
ihren Vorschlägen, der Seite Dateien, bei Termingästen und im Bericht
Aktivität. Kein Rätseln mehr, warum seine E-Mails still bleiben.
"""

["2026-10-01-0839-sounds"]
title = "Töne für neue E-Mails, Erinnerungen und das Senden"
text = """
Einstellungen > Benachrichtigungen hat einen Bereich Töne: Neue E-Mails,
Erinnerungen, E-Mails zurück im Posteingang, gesendete und nicht
gesendete E-Mails wählen jeweils einen Ton Ihrer Arbeitsumgebung,
spielen ihn mit der Taste daneben ab oder schalten ihn aus. Töne
erklingen jetzt auch unter KDE Plasma und bleiben bei stummgeschalteten
E-Mails und während Nicht stören still.
"""

["2026-10-01-0925-chat-view"]
title = "Konversationen als Chats lesen (experimentell)"
text = """
Schalten Sie Einstellungen > Experimentell > Konversationen als Chats
ein, und E-Mails zwischen Menschen lesen sich wie ein Gruppenchat: eine
Blase pro E-Mail mit nur dem, was geschrieben wurde, Ihre eigenen
rechts, Bilder und Dateien als Chat-Medien. Zitierte E-Mails und
Signaturen warten hinter ··· in jeder Blase, und ein Klick auf einen
Namen zeigt die Karte der Person mit ihrer Signatur. Antworten Sie im
Feld unten, mit Strg+Eingabe, der Formatleiste hinter Aa und der
Büroklammer für Dateien, Vorlagen und Signaturen. Newsletter behalten
die gewohnte Ansicht, und der Schalter Chat | E-Mail stellt jede
Konversation auf die eine oder andere Art um.
"""

["2026-10-01-0946-forward-keeps-files"]
title = "Weiterleiten behält die Dateien"
text = """
Beim Weiterleiten einer Nachricht kommen ihre Anhänge jetzt mit und
stehen unter der Nachricht, sodass Sie vor dem Senden jeden davon
entfernen können. Wird die Weiterleitung zur Antwort, bleiben sie
wieder weg.
"""

["2026-10-01-1009-forward-a-file"]
title = "Nur die Datei weiterleiten"
text = """
Der Anhangsbetrachter hat in seiner oberen Leiste eine Schaltfläche
Weiterleiten: Sie beginnt eine neue E-Mail mit nur dieser Datei als
Anhang, ohne die E-Mail, mit der sie kam. Dateien ohne Vorschau bieten
ebenfalls Weiterleiten an, ebenso die Anhangskarten unter einer offenen
E-Mail, neben Speichern.
"""

["2026-10-01-1039-rephrase-with-ai"]
title = "Umformulieren mit KI"
text = """
Markieren Sie Text in einer Nachricht und drücken Sie den Funken daneben
oder Strg+J, um ihn klarer, kürzer, freundlicher oder förmlicher
umschreiben zu lassen, dann Ersetzen. Katna AI ist 30 Tage kostenlos,
oder nutzen Sie Ihren eigenen Schlüssel von Google Gemini, OpenAI,
Claude, Mistral, DeepSeek, OpenRouter oder ein Modell auf diesem
Computer. KI kann Ihre Sätze auch in Grau vervollständigen; schalten Sie
das unter Einstellungen > Verfassen ein.
"""

["2026-10-01-1043-header-details-selectable"]
title = "Aus den Details einer E-Mail kopieren"
text = """
Die Details unter „an mich“ lassen sich jetzt wie die E-Mail selbst
markieren und kopieren. Klicken Sie auf eine Adresse, um die Karte der
Person neben der E-Mail zu sehen, oder klicken Sie mit der rechten
Maustaste für Adresse kopieren. Stummgeschaltete Personen zeigen dort
ebenfalls ihre durchgestrichene Glocke.
"""

["2026-10-01-1112-left-bar-button"]
title = "Eine große Taste, ein Einklappen, auf jeder Seite"
text = """
Die große Taste oben in der linken Leiste sieht jetzt auf jeder Seite
gleich aus, sitzt gleich und erledigt die Aufgabe der Seite: Schreiben
in E-Mail und Dateien, Neuer Termin, Neuer Kontakt, Neue Aufgabe und
Neue Notiz. Das Einklappen der linken Leiste gilt überall, und solange
sie eingeklappt ist, wartet die Taste jeder Seite oben in der schmalen
Leiste. Auf dem Handy ist sie die schwebende Taste.
"""

["2026-10-01-1115-color-picker"]
title = "Eine Farbauswahl im Schema-Editor"
text = """
Klicken Sie im Schema-Editor auf eine Farbe, und direkt daneben öffnet
sich eine Auswahl: Ziehen Sie über das Quadrat und den Farbtonbalken,
tippen Sie einen Hex-Wert, nutzen Sie die Farben des Schemas oder zuletzt
gewählte, oder nehmen Sie unter KDE und GNOME mit der Pipette eine Farbe
von irgendwo auf dem Bildschirm.
"""

["2026-10-01-1130-contact-card-folds-folders"]
title = "Die Kontaktkarte schafft sich Platz"
text = """
In einem Fenster, das zu schmal für Ordnerleiste und Kontaktkarte
