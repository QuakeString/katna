title = "Beenden schließt sofort"
text = """
Beenden im Menü des Symbols im Systemabschnitt wartet nicht mehr auf
E-Mails, die noch synchronisiert oder indiziert werden: Katna und sein
Symbol schließen sofort, und der Rest wird beim nächsten Start von Katna
fortgesetzt.
"""

["2026-09-27-1715-contact-panel"]
title = "Kontaktdetails neben Ihren E-Mails"
text = """
In einem breiten Fenster zeigt jetzt eine Karte neben der geöffneten
Unterhaltung den Absender: Telefon, Titel und Firma aus den Signaturen,
die Ortszeit, wie viele E-Mails Sie ausgetauscht haben, Ihre letzten
Unterhaltungen und die Dateien zwischen Ihnen. Klicken Sie auf eine
Unterhaltung oder Datei, um sie zu öffnen, oder auf eine andere Person der
Unterhaltung, um sie anzuzeigen. Die Angaben stammen nur aus Ihren E-Mails
auf diesem Computer. Der Kontaktknopf in der Leiste des Lesebereichs
blendet die Karte aus.
"""

["2026-09-27-1640-storage-used"]
title = "Belegter Speicher"
text = """
Unten im Ordnerbereich steht, wie voll der E-Mail-Speicher des Kontos ist,
etwa „34 % von 15 GB belegt“, wenn sein Mailserver das mitteilt.
"""

["2026-09-27-1651-desktop-search"]
title = "E-Mails aus KRunner und der GNOME-Suche finden"
text = """
Tippen Sie in KRunner (Alt+Leertaste) oder in der Aktivitäten-Suche einen
Namen ein, um dieser Person zu schreiben, ihre Adresse zu kopieren oder
ihre E-Mails zu finden. Nachrichten erscheinen, wenn ihr Betreff oder
Absender jedes eingetippte Wort enthält; beginnen Sie mit mail:, um alle
Ihre E-Mails zu durchsuchen, wie im Suchfeld von Katna Mail.
"""

["2026-09-27-1727-mail-templates"]
title = "Vorlagen für E-Mails, die Sie oft schreiben"
text = """
Schreiben Sie eine Nachricht einmal und speichern Sie sie mit dem neuen
Knopf Vorlagen im Fenster zum Verfassen; danach fügen Sie sie mit einem
Klick in jede neue E-Mail oder Antwort ein. Schreiben Sie {first name},
{name} oder {my name}, und Katna füllt sie für jeden Empfänger aus.
Vorlagen bearbeiten, umbenennen oder löschen Sie unter Einstellungen >
Verfassen.
"""

["2026-09-27-1724-server-send-later"]
title = "Geplante E-Mails gehen auch bei ausgeschaltetem Computer raus"
text = """
Wenn Ihr Mailserver E-Mails bis zu einem festgelegten Zeitpunkt
zurückhalten kann, wie Stalwart, übergibt Senden planen die Nachricht
jetzt an ihn, sobald Rückgängig verschwunden ist. So geht sie pünktlich
hinaus, auch wenn dieser Computer aus ist. Das Menü zum Planen zeigt, ob
Ihr Mailserver oder Katna sie sendet.
"""

["2026-09-27-1730-softer-row-hover"]
title = "Eine leichtere Hervorhebung"
text = """
Die Zeile unter dem Mauszeiger in der E-Mail-Liste hebt sich jetzt mit
einem zarten Schatten ab, wie in Gmail, statt mit einem dunklen Band
darunter.
"""

["2026-09-27-1745-drag-recipients"]
title = "Adressen zwischen An, Cc und Bcc ziehen"
text = """
Ziehen Sie einen Adress-Chip in ein anderes Feld, um ihn zu verschieben;
Cc und Bcc öffnen sich beim Ziehen, auch wenn sie ausgeblendet sind.
Zeigen Sie auf einen Chip, erscheint ein x, das ihn entfernt.
"""

["2026-09-27-1722-katna-account"]
title = "Katna-Konto"
text = """
Unter Einstellungen > Abonnement erstellen Sie ein Konto auf dem eigenen
Server von Katna, mit eigenem Passwort, nie einem E-Mail-Passwort. Die
Online-Funktionen von Katna, etwa Lesebestätigungen und Link-Tracking,
werden es brauchen. Sie sehen die angemeldeten Computer und können jeden
davon abmelden.
"""

["2026-09-27-1805-reopens-as-you-left-it"]
title = "Wieder da, wo Sie waren"
text = """
Wenn Sie Katna Mail schließen und wieder öffnen, kommen die App, der
Ordner und der Posteingangs-Tab zurück, die Sie offen hatten, dazu die
aufgeklappten Ordner und ob der Ordnerbereich eingeklappt war. Wird Katna
über das Symbol im Systemabschnitt beendet, startet es frisch.
"""

["2026-09-27-1724-snooze-and-reminders"]
title = "Zurückstellen und Erinnerungen an Antworten"
text = """
Stellen Sie eine Konversation mit der Uhr in ihrer Zeile oder über das
Kontextmenü zurück: Sie wartet im Ordner Zurückgestellt und kommt zur
gewählten Zeit ungelesen in den Posteingang zurück. Beim Senden kann Sie
der Pfeil neben Senden erinnern, wenn innerhalb von 1, 3 oder 7 Tagen
niemand antwortet. Beides funktioniert, solange Ihr Computer an ist, und
holt Verpasstes nach, wenn er aufwacht.
"""

["2026-09-27-1717-translate-mail"]
title = "E-Mails in Ihrer Sprache lesen"
text = """
Über einer Nachricht in einer anderen Sprache steht jetzt ein Knopf zum
Übersetzen, und Original anzeigen holt sie zurück. Katna erkennt die
Sprache auf Ihrem Computer; nur wenn Sie darum bitten, geht der Text der
Nachricht zur Übersetzung an Katnas eigenen Server. Unter Einstellungen >
Allgemein > Übersetzung wählen Sie Ihre Sprache und die Sprachen, die
immer übersetzt werden.
"""

["2026-09-27-1744-open-and-click-tracking"]
title = "Sehen, wann E-Mails geöffnet werden"
text = """
Schalten Sie das Auge neben den Empfängern ein, um zu sehen, wann jeder
Ihre Nachricht öffnet oder einem Link darin folgt, oder fordern Sie
stattdessen eine Lesebestätigung an. Gesendete E-Mails zeigen, wer sie
geöffnet hat, und beim ersten Mal meldet es eine Benachrichtigung. Beides
ist bei jeder neuen Nachricht aus, und die Verfolgung braucht ein
Katna-Konto (Einstellungen > Abonnement).
"""

["2026-09-27-2042-activity"]
title = "Aktivität für verfolgte E-Mails"
text = """
Aktivität neben dem Suchfeld zeigt, wie viele Ihrer verfolgten
Nachrichten geöffnet wurden und wie oft ihre Links aufgerufen wurden,
mit Ihren Betreffzeilen danach sortiert, wie oft sie geöffnet werden.
"""

["2026-09-27-2204-search-trigger-words"]
title = "E-Mails aus KRunner mit k durchsuchen"
text = """
Geben Sie in KRunner oder der GNOME-Suche k oder m, ein Leerzeichen und
dann das Gesuchte ein, etwa „k budget“, um dieselben Ergebnisse wie im
Suchfeld von Katna Mail zu erhalten. Eigene Wörter wählen Sie in den
Einstellungen unter Allgemein.
"""

["2026-09-27-2224-activity-button"]
title = "Aktivität neben dem Suchfeld"
text = """
Der Knopf Aktivität neben dem Suchfeld zählt neue Öffnungen und Klicks
Ihrer verfolgten E-Mails und listet auf, wer was geöffnet hat und welche
Links aufgerufen wurden; ein Klick auf einen Eintrag öffnet die Nachricht.
Details zeigt die Öffnungs- und Klickraten, Öffnungen pro Tag und Ihre
besten Betreffzeilen für die letzten 7 oder 30 Tage, den gesamten
Zeitraum oder selbst gewählte Daten. Eine gesendete Nachricht zeigt jetzt,
wie oft jede Person sie geöffnet und einen Link aufgerufen hat.
"""

["2026-09-27-2239-mailbox-insights"]
title = "Einblicke ins Postfach"
text = """
Aktivität > Details zeigt jetzt auch, wie viele E-Mails Sie im Zeitraum
gesendet und empfangen haben, wie oft und wie schnell Sie und andere
antworten, mit wem Sie am meisten schreiben und an welchen Tagen und zu
welchen Uhrzeiten Ihre E-Mails eintreffen. Gezählt wird auf Ihrem
Computer aus den E-Mails, die Katna bereits hat.
"""

["2026-09-28-0059-sign-in-with-google"]
title = "Anmelden mit Google oder Microsoft"
text = """
Fügen Sie ein Gmail- oder Outlook-Konto hinzu, indem Sie sich auf der
eigenen Seite von Google oder Microsoft in Ihrem Browser anmelden, ganz
ohne App-Passwort. Auch Adressen von Outlook.com und Hotmail funktionieren
jetzt. Wenn eine Anmeldung nicht mehr funktioniert, bietet ein Hinweis
unten im Fenster an, sich erneut anzumelden.
"""

["2026-09-28-0054-tracking-on-by-default"]
title = "Verfolgung und Bestätigungen von Anfang an"
text = """
Neue Nachrichten und Antworten beginnen jetzt mit eingeschalteter
Verfolgung von Öffnungen und Klicks, Lesebestätigung und
Zustellbestätigung; klicken Sie auf eine Schaltfläche neben den
Empfängern, um eine davon für diese Nachricht auszuschalten. Für die
Verfolgung müssen Sie bei Ihrem Katna-Konto angemeldet sein. Eine
Zustellbestätigung ist eine E-Mail, die Ihr E-Mail-Server Ihnen schickt,
wenn der Server jedes Empfängers die Nachricht annimmt; die Schaltfläche
ist ausgegraut, wenn Ihr E-Mail-Server sie nicht anbietet.
"""

["2026-09-28-0120-delivered-read-ticks"]
title = "Häkchen für zugestellt und gelesen"
text = """
Gesendete E-Mails zeigen jetzt Häkchen neben jedem Empfänger. Ein graues
Häkchen heißt, dass sein E-Mail-Server sie angenommen hat: aus einer
Zustellbestätigung oder, wenn Ihr E-Mail-Dienst keine sendet (Gmail), wenn
innerhalb einer halben Stunde keine Unzustellbarkeitsnachricht zurückkam.
Zwei Häkchen in Ihrer Akzentfarbe heißen, dass sie gelesen wurde, aus
einer Lesebestätigung oder der Öffnungsverfolgung, und eine Warnung heißt,
sie war unzustellbar. Zeigen Sie auf ein Häkchen, um zu sehen, wann und
wie. Bestätigungs-E-Mails bleiben im Postfach unter Benachrichtigungen,
ohne dass eine Benachrichtigung erscheint.
"""

["2026-09-28-0143-gmail-new-mail-notifications"]
title = "Benachrichtigungen für neue Gmail-E-Mails"
text = """
Neue E-Mails in einem Gmail-Posteingang zeigen wieder eine
Benachrichtigung. Katna hat bisher E-Mails übersehen, die Gmail einen
Moment vor dem Posteingang in Alle Nachrichten einsortiert hat.
"""

["2026-09-28-0156-attachment-types"]
title = "Nach Anhangstyp suchen"
text = """
In den Suchoptionen bietet „Mit Anhang“ jetzt PDF, XLSX, ODF, XLS, ODS,
PPT und PPTX sowie Benutzerdefiniert für jede andere Dateiendung, etwa
png oder avif. Angezeigt werden nur E-Mails mit einem Anhang eines
gewählten Typs.
"""

["2026-09-28-0106-original-colors"]
title = "Originalfarben bei dunklem Design"
text = """
Bei dunklem Design werden E-Mails, die eigene Farben setzen, in dunklen
Farben angezeigt. Der neue Halbkreis-Knopf in der Werkzeugleiste des
Lesebereichs zeigt sie in den Originalfarben des Absenders – und wieder
zurück.
"""

["2026-09-28-0127-print-as-shown"]
title = "Der Ausdruck behält die Formatierung"
text = """
E-Mails werden so gedruckt, wie sie im Lesebereich aussehen: mit Tabellen,
Farben, Rahmen, Listen und Bildern. Die Druckvorschau kann
Hintergrundfarben weglassen, um Tinte zu sparen, oder mit Einfacher Text
nur den Text drucken.
"""

["2026-09-28-0141-ask-before-deleting"]
title = "Fragen vor dem Löschen"
text = """
Wenn Sie mehrere Konversationen auf einmal löschen, wird jetzt zuerst
gefragt, ob sie in den Papierkorb sollen. Setzen Sie ein Häkchen bei
„Nicht mehr fragen“, um die Frage zu überspringen, oder schalten Sie sie
unter Einstellungen > Allgemein wieder ein. Beim endgültigen Löschen im
Papierkorb wird immer gefragt.
"""

["2026-09-28-0019-katna-for-windows"]
title = "Katna für Windows"
text = """
Katna Mail läuft jetzt auch unter Windows 10 und 11, installiert mit dem
eigenen Katna Setup, mit Symbol im Infobereich, Benachrichtigungen, Start
bei der Anmeldung und E-Mail-Links, die sich in Katna öffnen.
"""

["2026-09-28-0236-chip-remove-always"]
title = "Entfernen-Knopf an jeder Adresse"
text = """
Jede Adresse in An, Cc und Bcc zeigt jetzt immer ihr x, sodass Sie sie
entfernen können, ohne zuerst darauf zu zeigen.
"""

["2026-09-28-0244-pill-format-bar"]
title = "Eine rundere Formatierungsleiste"
text = """
Die Formatierungsleiste beim Schreiben (Aa) hat jetzt Pillenform mit einem
feinen Rand und hebt sich so im hellen wie im dunklen Design von Ihrem Text
ab.
"""

["2026-09-28-0325-long-threads-smooth"]
title = "Lange E-Mail-Verläufe öffnen sich schnell"
text = """
Formatierte E-Mails, die viele frühere Antworten zitieren, etwa ein langer
Zitatverlauf, öffnen sich jetzt sofort und scrollen flüssig, statt das ganze
Fenster auszubremsen.
"""

["2026-09-28-0830-who-has-seen-it"]
title = "Wer sie gesehen hat, hinter einem Auge"
text = """
Gesendete E-Mails mit Verfolgung haben keinen Kasten mit Zeilen mehr
darüber. Ein Auge neben dem Stern nimmt Ihre Akzentfarbe an, sobald jemand
die E-Mail öffnet; zeigen Sie darauf, um zu sehen, wer sie geöffnet oder
einen Link aufgerufen hat, und wann.
"""

["2026-09-28-0831-contact-call-copy"]
title = "Anrufen und kopieren aus den Kontaktdetails"
text = """
Klicken Sie in den Kontaktdetails neben einer Unterhaltung auf eine
Telefonnummer, um sie mit Ihrer Telefon-App oder KDE Connect anzurufen, oder
nutzen Sie den Kopierknopf daneben. Der gesamte Text der Karte lässt sich
jetzt auch markieren und kopieren.
"""

["2026-09-28-0848-quoted-text-hide-remove"]
title = "Zitierte E-Mail in einer Antwort ausblenden oder entfernen"
text = """
Der Knopf "..." unter einer Antwort blendet die zitierte E-Mail jetzt wieder
aus, nachdem Sie sie geöffnet haben. Zeigen Sie darauf und klicken Sie auf
das x an seiner Ecke, um die zitierte E-Mail aus Ihrer Antwort zu nehmen;
Rückgängig oder Ctrl+Z holt sie zurück. Außerdem bleibt die Werkzeugleiste
der Antwort beim Scrollen an ihrem Platz.
"""

["2026-09-28-0854-floating-folders"]
title = "Schwebende Ordner und eine breitere Suche"
text = """
Sind die Ordner ausgeblendet, öffnet das Verweilen auf Schreiben oder E-Mail
sie als Bereich mit Abstand zu den Rändern und einer kleinen Spitze, die auf
den Knopf zeigt. Das Suchfeld wächst in den Platz, den die Ordner freigeben,
und ein Klick auf den Ordner, in dem Sie schon sind, lässt die Liste nicht
mehr aufblitzen.
"""

["2026-09-28-0928-search-address-suggestions"]
title = "Adressvorschläge in den Suchoptionen"
text = """
Von und An in den Suchoptionen schlagen jetzt beim Tippen Adressen vor,
genau wie An, Cc und Bcc beim Schreiben. Wählen Sie eine mit Enter, Tab oder
einem Klick.
"""

["2026-09-28-0935-app-menu-reply-all-window"]
title = "Hauptmenü in der Kontokarte, Allen antworten im eigenen Fenster"
text = """
Die Kontokarte hat einen ☰-Knopf neben Konten verwalten. Er öffnet dieselben
Menüs Datei, Bearbeiten, Ansicht, Gehe zu, Nachricht, Einstellungen und
Hilfe wie das globale Menü der Arbeitsumgebung, für Arbeitsumgebungen, die
keins anzeigen. Allen antworten in einer Benachrichtigung über neue E-Mails
öffnet die Unterhaltung jetzt in einem eigenen Fenster, bereit zum Tippen,
und lässt das Hauptfenster, wo es ist.
"""

["2026-09-28-1011-tray-brings-window-forward"]
title = "Klicks auf Systemabschnitt und Benachrichtigungen holen Katna Mail nach vorn"
text = """
Ein Klick auf das Symbol im Systemabschnitt oder auf Posteingang öffnen,
Neue Nachricht oder Einstellungen in seinem Menü holt das Fenster von Katna
Mail unter Wayland jetzt nach vorn, auch wenn es minimiert oder hinter
anderen Fenstern war. Ein Klick auf eine Benachrichtigung über neue E-Mails
öffnet diese E-Mail, auch wenn die Liste im Posteingang sie nicht zeigt.
"""

["2026-09-28-1053-send-countdown-reply-in-place"]
title = "Senden zählt herunter, und Ihre Antwort bleibt in der Unterhaltung"
text = """
Nach Senden zählt ein schrumpfender Ring neben Rückgängig die Frist zum
Rückgängigmachen herunter, dann meldet der Hinweis Nachricht gesendet (mit
einem kurzen Ton), sobald die E-Mail unterwegs ist. Den Ton können Sie unter
Einstellungen > Allgemein > Senden ausschalten. Eine Antwort, die Sie in
einer Unterhaltung schreiben, wird genau dort zur Nachricht, wo Sie sie
geschrieben haben. Ihr Kopf zeigt nur, an wen sie geht; ein Klick darauf
zeigt Von, An, Cc und Bcc. Der Pfeil neben dem Antwortsymbol wechselt
zwischen Antworten, Allen antworten und Weiterleiten und behält, was Sie
geschrieben haben.
"""

["2026-09-28-1110-search-options-narrow"]
title = "Suchoptionen passen in schmale Fenster"
text = """
In einem schmalen oder niedrigen Fenster werden die Suchoptionen jetzt so
breit, wie Platz ist, setzen auf einem Smartphone die Beschriftungen über
ihre Felder und scrollen, wenn sie nicht passen, sodass die Schaltfläche
Suchen immer erreichbar bleibt.
"""

["2026-09-28-1119-replies-from-right-account"]
title = "Antworten gehen vom richtigen Konto aus"
text = """
Antworten und Weiterleiten senden bei E-Mails, die Sie im Gemeinsamen
Posteingang oder aus der Suche geöffnet haben, jetzt von dem Konto, an das
die E-Mail ging, nicht von dem Konto, das unter Ihrem Profilbild ausgewählt
ist.
"""

["2026-09-28-1436-calmer-search-box"]
title = "Die Suche zeigt ihre Tastenkombination"
text = """
Das Suchfeld zeigt seine Tastenkombination neben „In E-Mails suchen“, wie
unter Einstellungen > Tastenkombinationen festgelegt. Wenn Sie
hineinklicken, behält es seine Farbe und zeigt einen dezenten Rand, statt
dunkler zu werden und einen Schatten zu werfen. Die Ordner, die über der
Liste schweben, halten jetzt auch Abstand zum unteren Rand.
"""

["2026-09-28-1450-clear-activity"]
title = "Aktivität aufräumen"
text = """
Zeigen Sie in Aktivität auf eine Öffnung oder einen Klick und drücken Sie
×, um den Eintrag aus der Liste zu nehmen, oder drücken Sie Alle entfernen,
um neu anzufangen. Neue Öffnungen und Klicks erscheinen weiterhin, und der
Bericht Details zählt weiterhin alles.
"""

["2026-09-28-1541-round-logo"]
title = "Katnas neues rundes Logo"
text = """
Katna hat ein neues Logo: ein k in Schreibschrift auf einem türkisfarbenen
Kreis, im Anwendungsmenü, in der oberen Leiste und in der Kontrollleiste.
Der Systemabschnitt zeigt es in einer Farbe, die zu Ihrem Panel passt, und
Über Katna und die Willkommensseite zeigen „katna mail“ ausgeschrieben.
"""

["2026-09-28-1546-contact-cards"]
title = "Übersichtlichere Kontaktdetails"
text = """
Die Kontaktdetails zeigen jetzt jeden Teil in einer eigenen weichen Karte,
mit runden Knöpfen unter dem Namen, um der Person zu schreiben, Ihre Mail
mit ihr zu finden oder sie anzurufen. Letzte Konversationen zeigt die
neuesten paar; drücken Sie Mehr, um den Rest zu sehen, und Weniger, um sie
wieder einzuklappen.
"""

["2026-09-28-1507-reply-box-recipients"]
title = "Ein aufgeräumteres Antwortfeld"
text = """
Empfänger werden jetzt mit ihren Bildern angezeigt, und Cc und Bcc liegen
zusammen in einer kleinen Schaltfläche. Das Öffnen der Empfänger einer
Antwort lässt das Feld sanft nach oben wachsen, und die zitierte Nachricht
öffnet und schließt sich sanft unter einer wellenförmigen Linie, auf die
Sie klicken können, um sie wieder einzuklappen.
"""

["2026-09-28-1620-softer-window-shadow"]
title = "Ein weicherer Fensterschatten und KDE-große Knöpfe"
text = """
Mit dem Katna-Fensterrahmen ist der Schatten um das Fenster enger und
verblasst vollständig, ohne die harte Kante, die er zuvor neben dem Fenster
hinterließ. Die Fensterknöpfe haben jetzt die Größe der eigenen Knöpfe von
KDE und halten denselben Abstand zur Seite des Fensters wie zu dessen
oberem Rand.
"""

["2026-09-28-1622-update-from-the-app"]
title = "Katna aus der App heraus aktualisieren"
text = """
Katna lädt jetzt selbstständig neue Versionen herunter und sagt Ihnen
Bescheid, wenn eine bereit ist. Drücken Sie Aktualisieren in der
Benachrichtigung oder unter Über Katna: Katna Mail kündigt an, dass es neu
startet, fragt nach Ihrem Passwort, installiert das Update und öffnet sich
wieder dort, wo Sie aufgehört haben. Einstellungen > Allgemein > Updates
schaltet den automatischen Download aus.
"""

["2026-09-28-1520-track-sealed-and-plain"]
title = "Verfolgung für signierte, verschlüsselte und Nur-Text-E-Mails"
text = """
Das Auge funktioniert jetzt auch bei signierten und verschlüsselten E-Mails:
Die Kopie jedes Empfängers wird einzeln signiert oder verschlüsselt, sodass
Signaturen gültig bleiben. Nur-Text-E-Mails können keine Öffnungen anzeigen,
aber ihre Links werden verfolgt, sodass Sie sehen, wenn jemand einem folgt.
"""

["2026-09-28-1834-reply-after-closed-window"]
title = "Antworten beginnt neu, nachdem ein Nachrichtenfenster geschlossen wurde"
text = """
Wenn Sie eine Nachricht schließen, die in einem eigenen Fenster geschrieben
wurde, bleibt sie jetzt in den Entwürfen. Antworten, Allen antworten und
Weiterleiten öffnen wieder eine neue Nachricht, statt die alte
zurückzubringen.
"""

["2026-09-28-1852-frosted-search-bar"]
title = "Eine milchglasartige Suchleiste"
text = """
Bei eingeschaltetem verschwommenem Hintergrund lässt die Suchleiste den
Weichzeichner durch, so wie die Leiste um sie herum, statt als einfarbige
graue Kapsel darauf zu liegen.
"""

["2026-09-28-1906-scroll-to-switch-accounts"]
title = "Über Ihrem Bild scrollen, um das Konto zu wechseln"
text = """
Halten Sie den Zeiger über das Kontobild oben rechts und drehen Sie das
Mausrad, um zum nächsten oder vorherigen Konto zu wechseln, pro Rastschritt
ein Konto. Das Bild rollt zum neuen Konto, so wie der Name der App beim
Wechseln zwischen Apps rollt, und wenn Sie ein Konto auf der Karte
auswählen, rollt es genauso.
"""

["2026-09-28-1918-many-recipients"]
title = "Platz für viele Empfänger"
text = """
Empfänger nach der ersten Zeile nutzen jetzt die ganze Breite, und eine
lange Liste scrollt innerhalb weniger Zeilen, sodass die Nachricht selbst
immer erreichbar bleibt. Verlassen Sie das Feld, klappt es auf eine Zeile
zusammen, etwa "Kay, Sam, 19 weitere"; ein Klick darauf zeigt wieder alle.
"""

["2026-09-28-1952-activity-by-account"]
title = "Aktivitätsbericht für ein Konto"
text = """
Der Aktivitätsbericht hat jetzt neben den Daten eine Kontoauswahl. Wählen
Sie Alle Konten oder eines davon, und die verfolgten Nachrichten, Raten,
das Diagramm, die Betreffzeilen und Ihr Postfach richten sich danach. Der
Bericht nennt das angezeigte Konto und merkt sich Ihre Wahl.
"""

["2026-09-28-2002-reader-arrows-always-shown"]
title = "Neuer und Älter immer in der Symbolleiste"
text = """
Egal wie schmal die Leseansicht ist: Der Zähler und die Pfeile Neuer und
Älter bleiben rechts in ihrer Symbolleiste. Die Schaltflächen, die Sie am
seltensten nutzen, wandern stattdessen nach und nach in das Menü Mehr,
darunter auch die Schalter für Kontaktdetails und Originalfarben.
"""

["2026-09-28-2026-large-files-drive"]
title = "Dateien in jeder Größe senden"
text = """
Bei einem mit Google angemeldeten Konto landet eine Datei über dem
Mail-Limit von 25 MB sofort nach dem Anhängen in Ihrem Google Drive, und
die Nachricht enthält ihren Link, wie in Gmail. Beim Senden wird sie für
Ihre Empfänger freigegeben; Katna fragt nur nach, wenn jemandem kein
Zugriff gegeben werden kann.
"""

["2026-09-28-2059-recipient-list-scrolling"]
title = "Flüssigeres Scrollen in langen Empfängerlisten"
text = """
Eine lange Empfängerliste hat jetzt eine eigene Bildlaufleiste und
bewegt sich Zeile für Zeile; die Konversation scrollt erst weiter, wenn
die Liste ihr Ende erreicht hat. Beim Hinzufügen von Empfängern springen
die Schaltflächen darunter nicht mehr.
"""

["2026-09-28-2106-check-for-new-mail"]
title = "Auf neue E-Mails prüfen"
text = """
Klicken Sie im Ordnerbereich mit der rechten Maustaste auf einen Ordner
oder ein Konto, um „Auf neue E-Mails prüfen“, „Alle als gelesen
markieren“, einen neuen Ordner darin oder „Papierkorb leeren“ zu wählen.
„Aktualisieren“ über der Liste ruft jetzt auch Neues vom Server ab.
Während Katna prüft, drehen sich die Pfeile bei „Aktualisieren“ und
neben dem Posteingang, und „Auf neue E-Mails wird geprüft…“ erscheint
oben, wenn es länger dauert.
"""

["2026-09-28-2101-large-files-onedrive"]
title = "Große Dateien über OneDrive"
text = """
Outlook.com, Hotmail und andere Microsoft-Konten senden Dateien über dem
Mail-Limit jetzt wie Google-Konten: Die Datei landet sofort nach dem
Anhängen in Ihrem OneDrive, und die Nachricht enthält ihren Link, wie in
Outlook.
"""

["2026-09-28-2108-activity-checking"]
title = "Kein „Anmelden“-Aufblitzen mehr in Aktivität"
text = """
Direkt nach dem Start zeigt Aktivität einen dünnen Ladebalken, während
Ihr Katna-Konto geprüft wird, statt kurz zur Anmeldung aufzufordern.
Katna prüft das Konto außerdem schon beim Start, sodass die Wartezeit
kürzer ist.
"""

["2026-09-28-2130-update-dialog"]
title = "Updates bekommen ein eigenes Fenster"
text = """
Hilfe > Nach Updates suchen öffnet ein eigenes Fenster. Es zeigt Ihre
Version neben der neuen, mit dem Erstellungsdatum beider und der
Downloadgröße, dazu die Neuigkeiten des Updates und jede Änderung seit
Ihrer Version.
"""

["2026-09-28-2204-faster-start"]
title = "Schnellerer Start, flüssigeres Synchronisieren"
text = """
Katna Mail öffnet einen großen Posteingang etwa ein Viertel schneller,
und während Mails heruntergeladen werden, wird die Liste nur einmal pro
Stapel aktualisiert statt nach jeweils wenigen Nachrichten. So bleiben
Scrollen und Tippen bei einer Synchronisierung flüssig.
"""

["2026-09-28-2111-link-addresses"]
title = "Sehen, wohin ein Link führt"
text = """
Halten Sie den Mauszeiger über einen Link in einer Nachricht, dann
erscheint am unteren Rand des Lesebereichs die Adresse, die er
tatsächlich öffnet, wobei der Name der Website hervorgehoben ist, egal
was der Linktext sagt. Bilder von einem Absender, von dem Sie immer
Bilder anzeigen, werden jetzt nur noch geladen, wenn Ihr E-Mail-Anbieter
bestätigt, dass die Nachricht wirklich von ihm stammt.
"""

["2026-09-29-0120-update-build-details"]
title = "Mehr über Ihren Build"
text = """
Das Fenster „Updates“ nennt jetzt die letzte Änderung jeder Version,
zeigt, woher Ihre Kopie stammt, und wann Katna zuletzt nach Updates
gesucht hat.
"""

["2026-09-29-0213-coffee-button-play"]
title = "Ein kleines Theaterstück bei „Spendieren Sie mir einen Kaffee“"
text = """
Halten Sie den Mauszeiger in „Über Katna“ auf „Spendieren Sie mir einen
Kaffee“: Der Knopf bittet um Kaffee, Tee, Pizza, dann um gar nichts,
gibt sich mit Wasser zufrieden und sagt mit ein paar Funken Danke. Es
läuft jedes Mal einmal ab und bleibt bei reduzierter Bewegung ruhig.
"""

["2026-09-29-0215-update-checking-bar"]
title = "Ein übersichtlicheres Update-Fenster"
text = """
Während Katna nach Updates sucht, läuft ein Balken, und die neue Version
hebt sich in einer eigenen Farbe neben der Version ab, die Sie haben.
"""

["2026-09-29-0231-keys-beside-the-list"]
title = "Tasten, die dem Bereich folgen, in dem Sie sind"
text = """
Steht die Unterhaltung neben der Liste, bewegen ↑ und ↓ jetzt die
Auswahl in der Liste und zeigen jede Unterhaltung an. Tab oder
Eingabetaste wechselt in die Unterhaltung, wo ↑ und ↓ sie scrollen; Esc
oder Umschalt+Tab führt zurück zur Liste. F6 wechselt zwischen den
Bereichen, wie in anderen Mailprogrammen.
"""

["2026-09-29-0258-folders-slide-open"]
title = "Ordner öffnen und schließen sich mit einem Gleiten"
text = """
Ein Klick auf den Pfeil neben einem Konto oder Ordner im Ordnerbereich
lässt jetzt den Inhalt auf- oder zugleiten, und die Ordner darunter
rutschen mit, statt zu springen.
"""

["2026-09-29-0301-keys-menus-dialogs"]
title = "Ordner, Menüs und Dialoge per Tastatur"
text = """
Mit Umschalt+Tab oder F6 erreichen Sie den Ordnerbereich, wo ↑ und ↓
jeden Ordner öffnen und die Eingabetaste zu seinen Mails wechselt. ↑ und
↓ bewegen sich durch jedes Menü, die Eingabetaste wählt aus.
Umschalt+F10 oder die Menütaste öffnet das Kontextmenü der ausgewählten
Mail. Dialoge übernehmen die Tasten, sobald sie sich öffnen: Die
Eingabetaste antwortet, Esc bricht ab, und Tab bleibt in ihnen. In einer
neuen Nachricht sendet Strg+Eingabetaste aus jedem Feld, und Esc
schließt sie und behält einen Entwurf.
"""

["2026-09-29-0309-clock-tasks"]
title = "Aufgaben in Ihrer Desktop-Uhr"
text = """
Klicken Sie auf die Uhr, um eine Aufgabe hinzuzufügen und Aufgaben
abzuhaken. Unter Plasma klicken Sie mit der rechten Maustaste auf die
Uhr und wählen Alternativen anzeigen, um Katna Digitaluhr auszuwählen.
Unter GNOME erscheint ab Ihrer nächsten Anmeldung eine Aufgabenkarte
unter dem Kalender der Uhr.
"""

["2026-09-29-0329-pages-by-keyboard"]
title = "Seiten per Tastatur und aus der Taskleiste"
text = """
Mit Strg+1 bis Strg+5 wechseln Sie zwischen E-Mail, Kalender, Kontakten,
Aufgaben und Notizen, wie in Outlook, und das Menü Gehe zu listet sie
ebenfalls auf. Klicken Sie in der Taskleiste mit der rechten Maustaste
auf Katna Mail, um direkt den Kalender oder die Kontakte zu öffnen.
"""

["2026-09-29-0412-tasks-page"]
title = "Katna Aufgaben"
text = """
Drücken Sie Strg+4 oder wählen Sie links Aufgaben: alle Listen
nebeneinander wie in Google Tasks, mit Unteraufgaben, Markierungen,
Fälligkeitstagen, Wiederholungen und Details. Die Listen werden mit
Google Tasks und Microsoft To Do synchronisiert, und Aufgaben von der
Desktop-Uhr erscheinen hier ebenfalls.
"""

["2026-09-29-0352-contacts"]
title = "Ihre Kontakte, aus jedem Konto"
text = """
Kontakte in der linken Leiste zeigt jetzt die Personen, die in Ihren
Gmail- und Outlook-Konten und auf CardDAV-Servern gespeichert sind, jede
nur einmal, auch wenn mehrere Konten sie enthalten, mit Labels, Bildern
und ihren Details. Ihre Namen und Bilder erscheinen auch in Ihren
E-Mails und in den Adressvorschlägen.
"""

["2026-09-29-0350-katna-notes"]
title = "Katna Notizen"
text = """
Notizen in der linken Leiste öffnet jetzt Katna Notizen, aufgebaut wie
Google Keep. Schreiben Sie eine Notiz oder eine Checkliste, geben Sie
ihr eine Farbe, heften Sie sie oben an und haken Sie Einträge direkt auf
der Pinnwand ab. Notizen werden beim Tippen gespeichert; das Suchfeld
findet sie; Archiv und Papierkorb halten sie aus dem Weg, mit
Rückgängig.
"""

["2026-09-29-0412-notes-sync"]
title = "Notizen auf jedem Gerät"
text = """
Notizen liegen jetzt im Ordner Notizen Ihres E-Mail-Kontos, wo auch die
Notizen von iPhone und Mac liegen. So folgen sie Ihnen auf Ihre anderen
Geräte und kommen von dort zurück. Der Kontoname unter einer Notiz
zeigt, wo sie gespeichert ist; klicken Sie darauf, um die Notiz zu
verschieben, oder behalten Sie sie nur auf diesem Computer.
"""

["2026-09-29-0451-add-mail-to-tasks"]
title = "E-Mail zu Aufgaben hinzufügen"
text = """
Drücken Sie Umschalt+T wie in Gmail oder wählen Sie Zu Aufgaben
hinzufügen, wenn Sie mit der rechten Maustaste auf eine E-Mail klicken.
Die Aufgabe übernimmt den Betreff der E-Mail, und ihr E-Mail-Chip in
Aufgaben öffnet die E-Mail wieder.
"""

["2026-09-29-0412-calendar"]
title = "Ihr Kalender, neben Ihren E-Mails"
text = """
Kalender zeigt Ihre Google-, Microsoft- und anderen Kalender nach Tag,
Woche, Monat oder als Terminübersicht an, mit den Tastenkürzeln von Google
Calendar. Die Kalender-Schaltfläche rechts neben Ihren E-Mails öffnet die
Tagesübersicht, mit „Teilnehmen“ für Anrufe. Melden Sie sich erneut bei
einem Konto an, damit Katna dessen Kalender lesen darf.
"""

["2026-09-29-0442-contacts-edit"]
title = "Kontakte erstellen und ändern"
text = """
Mit Kontakt erstellen auf der Kontakte-Seite legen Sie jemanden in dem
Konto an, das Sie auswählen, und mit Bearbeiten auf der Seite eines
Kontakts ändern Sie ihn ebenfalls dort. Löschen lässt sich mit
Rückgängig zurücknehmen, und Google und Outlook bewahren gelöschte
Kontakte noch eine Zeit lang in ihrem Papierkorb auf.
"""

["2026-09-29-0538-notes-on-mail"]
title = "Notizen zu einer E-Mail"
text = """
Klicken Sie mit der rechten Maustaste auf eine E-Mail oder öffnen Sie
ihr Menü ⋮ und wählen Sie Notiz hinzufügen: Eine Notiz mit dem Betreff
als Titel öffnet sich über der E-Mail. Ihre Notizen erscheinen unter
dem Betreff, wenn Sie die E-Mail wieder öffnen, und das Chip E-Mail
einer Notiz führt Sie zurück zur E-Mail.
"""

["2026-09-29-0542-caldav-tasks"]
title = "Aufgaben auf Ihrem eigenen Mailserver"
text = """
Konten, die sich mit einem Passwort anmelden, speichern ihre Aufgaben
jetzt auf ihrem Mailserver, wenn dieser CalDAV anbietet. So erscheinen
die Aufgaben auch in den eigenen Apps des Servers und auf dem Handy.
"""

["2026-09-29-0521-calendar-edit"]
title = "Termine hinzufügen und ändern"
text = """
Klicken oder ziehen Sie im Kalender oder drücken Sie C, um einen Termin
hinzuzufügen. Ziehen Sie einen Termin, um ihn zu verschieben, oder
seinen unteren Rand, um die Dauer zu ändern, und öffnen Sie ihn, um
Zeit, Wiederholung, Erinnerungen und Gäste zu ändern oder einen Meet-
oder Teams-Anruf hinzuzufügen. Beantworten Sie Einladungen mit Ja, Nein
oder Vielleicht. Mit Rückgängig stellen Sie alles wieder her.
"""

["2026-09-29-0546-calendar-any-account"]
title = "Kalender von mehr Konten"
text = """
Katna findet jetzt die Kalender von Yahoo, Zoho, iCloud, Fastmail, GMX
und anderen Konten, auch wenn sie auf einem anderen Server liegen als
die E-Mails. Es probiert zuerst den besten Weg jedes Kontos und einen
anderen, wenn dieser nicht verfügbar ist.
"""

["2026-09-29-0625-tasks-today"]
title = "Heute in Aufgaben"
text = """
„Heute“ unter „Alle Aufgaben“ sammelt aus allen Listen, was heute fällig
oder überfällig ist, samt der Liste, in der sich jede Aufgabe befindet.
Eine dort hinzugefügte Aufgabe ist heute fällig.
"""

["2026-09-29-0631-invitation-card"]
title = "Einladungen in Ihrer E-Mail"
text = """
Eine Einladung erscheint jetzt als Karte oben in der E-Mail: wann und
wo, wer sie organisiert hat, Ihr Tag drumherum mit markierten
Überschneidungen, Teilnehmen und Teilnehmen? Ja, Nein oder Vielleicht,
direkt dort beantwortet.
"""

["2026-09-29-0616-note-labels"]
title = "Labels für Notizen"
text = """
Über die Label-Schaltfläche an einer Notiz versehen Sie sie wie in Keep
mit Labels. Ihre Labels stehen neben „Notizen“ und zeigen jeweils nur
ihre Notizen. Mit „Labels bearbeiten“ benennen Sie sie um oder löschen
sie, mit „Rückgängig“.
"""

["2026-09-29-0630-tasks-more-accounts"]
title = "Aufgaben von mehr Konten"
text = """
Aufgaben werden jetzt auch mit Yahoo, Zoho, iCloud, Fastmail und anderen
Konten synchronisiert, deren Aufgaben auf einem anderen Server liegen
als ihre E-Mails. Katna probiert zuerst den besten Weg jedes Kontos aus
und merkt sich den, der funktioniert.
"""

["2026-09-29-0651-schedule-meeting"]
title = "Besprechung aus einer E-Mail planen"
text = """
Klicken Sie mit der rechten Maustaste auf eine Unterhaltung oder öffnen
Sie ⋮ und wählen Sie Besprechung planen: Auf der Seite Kalender öffnet
sich ein neuer Termin mit dem Betreff als Titel und allen Beteiligten
der Unterhaltung als Gästen.
"""

["2026-09-29-0705-running-late"]
title = "Verspätet? Alle mit einem Klick informieren"
text = """
Ein Termin mit Gästen hat jetzt E-Mail an Gäste und ab einer Stunde vor
dem Beginn Ich verspäte mich: eine E-Mail an alle, vom Konto dieses
Kalenders, versandfertig.
"""

["2026-09-29-0607-contact-labels"]
title = "Labels für Kontakte"
text = """
Label auf der Seite eines Kontakts setzt Labels oder erstellt ein neues,
und über ⋮ neben einem Label benennen Sie es um, löschen es oder
schreiben allen darin. Labels bleiben mit Google Contacts und Outlook
abgeglichen, und jede Änderung lässt sich mit Rückgängig zurücknehmen.
"""

["2026-09-29-0640-add-to-contacts"]
title = "Aus der E-Mail zu Kontakten hinzufügen"
text = """
Das Kontaktfeld neben einer Unterhaltung bietet Zu Kontakten hinzufügen
für jemanden, den Sie nicht gespeichert haben: Ein Klick speichert Name,
Adresse sowie Telefon, Position und Firma aus der Signatur, mit
Rückgängig. Bei einem gespeicherten Kontakt öffnet dieselbe Schaltfläche
ihn auf der Seite Kontakte.
"""

["2026-09-29-0720-focus-time"]
title = "Fokuszeit, Abwesenheit und Arbeitsort"
text = """
Ein neuer Termin kann jetzt Fokuszeit, Abwesend oder ein Arbeitsort
sein, wie in Google Calendar: Wählen Sie es über den Zeiten aus. Google
und Outlook erkennen sie als das, was sie sind, und in Katna erscheinen
sie mit eigenem Symbol.
"""

["2026-09-29-0704-task-chips"]
title = "Aufgaben zu Ihren Mails"
text = """
Eine Mail, aus der Sie eine Aufgabe gemacht haben, zeigt in der Liste
jetzt das Fälligkeitsdatum der Aufgabe, in Rot, sobald sie überfällig
ist. Ein Klick öffnet die Aufgabe.
"""

["2026-09-29-0638-other-contacts"]
title = "Weitere Kontakte"
text = """
Kontakte hat jetzt Weitere Kontakte: Personen, denen Sie aus Gmail
geschrieben, aber nie gespeichert haben, so wie Gmail sie aufbewahrt.
Speichern Sie jede Person mit einem Klick, mit Rückgängig, oder
schreiben Sie ihr direkt eine Mail.
"""

["2026-09-29-0745-answer-by-mail"]
title = "Einladungen von jedem Konto beantworten"
text = """
Eine Einladung, die bei einem Konto ohne Kalender eingegangen ist, hat
jetzt ebenfalls Ja, Nein und Vielleicht: Ihre Antwort geht per E-Mail an
den Organisator, und dessen Kalender vermerkt sie.
"""

["2026-09-29-0710-meeting-notes"]
title = "Besprechungsnotizen"
text = """
Öffnen Sie im Kalender ein Event und wählen Sie „Besprechungsnotizen
erstellen“: Es öffnet sich eine Notiz mit dem Titel des Events, mit den
Teilnehmern und Platz für Aufgaben. Die Karte des Events listet seine
Notizen auf, und der Chip „Event“ in einer Notiz führt Sie zurück zum
Tag.
"""

["2026-09-29-0751-go-to-pdf-page"]
title = "Direkt zu einer PDF-Seite springen"
text = """
Die Seitenzahl unter einer PDF ist jetzt ein Feld: Klicken Sie darauf
oder drücken Sie Strg+G, geben Sie eine Seite ein und drücken Sie die
Eingabetaste, um dorthin zu springen.
"""

["2026-09-29-0715-tasks-on-calendar"]
title = "Aufgaben im Kalender"
text = """
Aufgaben mit Fälligkeitstag erscheinen jetzt im Kalender, zu ihrer Uhrzeit oder bei den ganztägigen Events des Tages. Haken Sie sie dort ab, klicken Sie, um eine zu öffnen, oder ziehen Sie sie auf einen anderen Tag oder eine andere Uhrzeit, um diese Zeit dafür zu blocken.
"""

["2026-09-29-0756-event-reminders"]
title = "Erinnerungen für Ihre Events"
text = """
Events erinnern Sie jetzt mit einer Benachrichtigung, auch wenn Katna geschlossen ist. „Teilnehmen“ öffnet den Videoanruf, und „5 Min. zurückstellen“ erinnert Sie fünf Minuten später erneut.
"""

["2026-09-29-0758-contacts-merge-import"]
title = "Duplikate zusammenführen sowie Kontakte importieren und exportieren"
text = """
Unter „Korrigieren und verwalten“ in Kontakte findet „Zusammenführen und korrigieren“ doppelt gespeicherte Personen (mit demselben Namen oder derselben Telefonnummer) und führt sie mit einem Klick zusammen, mit „Rückgängig“. „Importieren“ holt Personen aus einer vCard-Datei und lässt bereits gespeicherte aus, und „Exportieren“ speichert alle oder ein Label als vCard-Datei.
"""

["2026-09-29-0835-contacts-birthdays-qr-print"]
title = "Geburtstage im Kalender, Kontakte als QR-Codes"
text = """
Die Geburtstage Ihrer Kontakte erscheinen jetzt im Kalender, in einem Kalender „Geburtstage“, den Sie abwählen können. Die Seite eines Kontakts kann ihn als QR-Code anzeigen, den die Kamera eines Smartphones speichert, und ihn drucken; „Drucken“ unter „Korrigieren und verwalten“ druckt alle angezeigten Personen. Der Import liest jetzt auch CSV-Dateien aus Google Kontakte und Outlook, und KRunner und die GNOME-Suche finden Ihre gespeicherten Kontakte.
"""

["2026-09-29-0830-calendar-density-time-zones"]
title = "Kalender: Zeitzonen und Dichte"
text = """
Mit der Optionen-Schaltfläche im Kalender legen Sie fest, wie hoch die Stunden sind (An Bildschirm anpassen, Komfortabel oder Kompakt), und fügen neben Ihrer eigenen eine zweite Zeitzone hinzu, für Menschen, die Sie im Ausland treffen.
"""

["2026-09-29-0809-video-calls"]
title = "Videoanruf aus einer Mail starten"
text = """
Klicken Sie mit der rechten Maustaste auf eine Unterhaltung oder öffnen Sie ⋮ und wählen Sie Videoanruf starten: Der Anruf wird geöffnet, und eine neue Mail mit dem Link geht an alle in der Unterhaltung. Gmail-Konten nutzen Google Meet, andere erhalten einen Jitsi-Meet-Raum. Bei Mails mit einem Link zu einem Anruf über Meet, Teams, Zoom, Webex, Jitsi, WhatsApp oder Telegram erscheint jetzt die Schaltfläche Teilnehmen.
"""

["2026-09-29-0815-note-line-task"]
title = "Eine Checklistenzeile zur Aufgabe machen"
text = """
Setzen Sie den Cursor in einer Notiz auf eine Checklistenzeile und wählen Sie Zur Aufgabe machen: Die Zeile landet in Ihren Aufgaben. Über den Chip Notiz auf der Seite Aufgaben öffnen Sie die Notiz wieder.
"""

["2026-09-29-0836-active-pane-stands-out"]
title = "Der Bereich, in dem Sie sind, hebt sich ab"
text = """
Neben der Liste behält nur der Bereich, der die Tastatureingaben erhält, seinen Schatten; die Liste, die Unterhaltung oder das Kontaktfeld, das Sie gerade nicht nutzen, tritt mit einem schwächeren Rand zurück, und die Änderung folgt Ihnen sanft, wenn Sie klicken.
"""

["2026-09-29-0840-task-reminders"]
title = "Aufgabenerinnerungen und Wiederholungen"
text = """
Öffnen Sie eine Aufgabe und wählen Sie Erinnern: zur festgelegten Zeit, eine Stunde oder einen Tag vorher. Die Erinnerung erscheint auch bei geschlossenem Katna, mit Als erledigt markieren und Zurückstellen. Wenn Sie eine wiederkehrende Aufgabe abhaken, kommt sie jetzt am nächsten Tag wieder.
"""

["2026-09-29-0849-tasks-in-desktop-search"]
title = "Aufgaben über den Desktop finden"
text = """
Tippen Sie in KRunner oder in der Suche von GNOME ein paar Wörter einer Aufgabe ein, und sie erscheint unter Aufgaben. Drücken Sie die Eingabetaste, und Katna öffnet sie, bereit zum Bearbeiten.
"""

["2026-09-29-0832-clock-day-menu"]
title = "Termine und Aufgaben über die Desktop-Uhr hinzufügen"
text = """
Klicken Sie in Katna Digital Clock mit der rechten Maustaste auf einen
Tag im Monat, um für diesen Tag eine Aufgabe oder einen Termin
hinzuzufügen; der Termin öffnet sich im Kalender von Katna. Ein Klick
auf einen Ihrer Termine öffnet den Kalender an diesem Tag.
"""

["2026-09-29-0855-type-an-event"]
title = "Einen Termin in einer Zeile eingeben"
text = """
Geben Sie als Titel eines neuen Termins „Mittagessen mit Anita Freitag
13 Uhr im Cafe Mocha“ oder „Standup jeden Werktag 9:30“ ein, und der
Kalender füllt Tag, Uhrzeit, Wiederholung und Ort beim Tippen aus.
"""

["2026-09-29-0915-year-view"]
title = "Das ganze Jahr im Blick"
text = """
Der Kalender hat eine Jahresansicht: alle zwölf Monate auf einmal, mit
einem Punkt unter den Tagen, an denen Termine liegen. Drücken Sie Y und
klicken Sie auf einen Tag, um ihn zu öffnen.
"""

["2026-09-29-0930-share-free-times"]
title = "Freie Zeiten teilen"
text = """
Freie Zeiten teilen in den Optionen des Kalenders beginnt eine
Nachricht, die auflistet, wann Sie in den nächsten Werktagen frei sind,
bereit zum Senden an beliebige Personen.
"""

["2026-09-29-0952-calendar-sets"]
title = "Kalendergruppen"
text = """
Speichern Sie die angezeigten Kalender als Gruppe, etwa „Arbeit“ oder
„Familie“, mit + neben Kalendergruppen. Ein Klick auf eine Gruppe zeigt
ihre Kalender und blendet die übrigen aus.
"""

["2026-09-29-0947-tasks-typed-quick-add"]
title = "Eine Aufgabe in einer Zeile eingeben"
text = """
Fügen Sie eine Aufgabe wie „Bank anrufen morgen 15 Uhr“ oder „Pflanzen
gießen jeden Montag 8 Uhr“ hinzu, und Aufgaben setzt Tag, Uhrzeit und
Wiederholung für Sie und zeigt beim Tippen, was es verstanden hat.
"""

["2026-09-29-1028-calendar-narrow-windows"]
title = "Kalender im schmalen Fenster"
text = """
In einem schmalen Fenster behält der Kalender „Heute“ und die Daten in
seiner Leiste und legt die Ansichten in ein Menü. Terminzeiten brechen
nicht mehr mitten im Wort um, und Tab erreicht jeden Knopf und jeden
Kalender.
"""

["2026-09-29-1039-contact-panel-tasks"]
title = "Aufgaben mit ihnen, neben ihrer Mail"
text = """
Die Kontaktdetails neben einer Unterhaltung listen jetzt Ihre offenen
Aufgaben auf, die aus Mails mit dieser Person entstanden sind. Haken Sie
eine ab, um sie zu erledigen, oder klicken Sie darauf, um sie in
Aufgaben zu öffnen.
"""

["2026-09-29-1046-contact-panel-meetings"]
title = "Ihre nächsten Termine mit ihnen"
text = """
Die Kontaktdetails neben einer Unterhaltung zeigen jetzt Ihre nächsten
Termine mit dieser Person. Klicken Sie auf einen, um ihn im Kalender zu
öffnen.
"""

["2026-09-29-1051-tasks-drag-to-list"]
title = "Aufgabe in eine andere Liste ziehen"
text = """
Ziehen Sie in Aufgaben eine Aufgabe auf eine andere Liste, um sie
dorthin zu verschieben. Rückgängig legt sie zurück.
"""

["2026-09-29-1111-tasks-search"]
title = "Ihre Aufgaben durchsuchen"
text = """
Auf der Seite Aufgaben durchsucht das Suchfeld oben jetzt Ihre Aufgaben,
deren Notizen und Unteraufgaben statt Ihrer Mail.
"""

["2026-09-29-1130-calendar-search"]
title = "Ihre Termine durchsuchen"
text = """
Auf der Seite Kalender findet das Suchfeld oben jetzt Termine nach
Titel, Ort, Notizen oder Gästen, nach Datum sortiert. Klicken Sie auf
