["2026-09-27-1512-buy-me-a-coffee"]
title = "Spendieren Sie mir einen Kaffee"
text = """
Wenn Katna Ihnen nützlich ist: Unter Über Katna gibt es jetzt den Knopf
Spendieren Sie mir einen Kaffee.
"""

["2026-09-27-1615-from-row"]
title = "Wählen Sie, von wem eine Nachricht kommt"
text = """
Neue Nachrichten zeigen jetzt unter An eine Zeile Von. Klicken Sie auf
ihren Pfeil, um von einem anderen Ihrer Konten zu senden. Neue E-Mails
beginnen mit Ihrem ersten Konto, außer Sie wählen unter Einstellungen >
Verfassen > Neue Nachrichten senden von ein anderes Standardkonto.
"""

["2026-09-27-1621-unified-inbox"]
title = "Gemeinsamer Posteingang"
text = """
Schalten Sie Einstellungen > Konten > Gemeinsamer Posteingang ein, um
