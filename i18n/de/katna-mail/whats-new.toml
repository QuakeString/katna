["2026-09-27-1637-drafts"]
title = "Entwürfe bleiben erhalten"
text = """
Schließen Sie eine Nachricht, die Sie gerade schreiben, wird sie jetzt
in Entwürfe gespeichert, auch auf Ihrem Mailserver, wie in Gmail. Öffnen
