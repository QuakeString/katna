["2026-09-27-0826-reset-cache"]
title = "Cache zurücksetzen"
text = """
Einstellungen > Allgemein > Cache zurücksetzen löscht die von Katna
heruntergeladenen E-Mails, die Absenderbilder und den Suchindex und lädt
