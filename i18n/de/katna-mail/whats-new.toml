Entwürfe und Ihre E-Mails auf dem Server bleiben erhalten.
"""

["2026-09-27-1308-auto-advance"]
title = "Die nächste E-Mail öffnet sich von selbst"
text = """
Wenn Sie die E-Mail, die Sie gerade lesen, löschen, archivieren oder
verschieben, öffnet sich an ihrer Stelle die nächste, statt dass sich
der Lesebereich schließt. Rückgängig holt die E-Mail zurück und öffnet
