Sie stattdessen die vorherige öffnen lassen oder zur Liste zurückkehren.
"""

["2026-09-27-1348-quiet-row-markers"]
title = "Eine ruhigere E-Mail-Liste"
text = """
Kontrollkästchen, Markierung und Wichtig-Symbol jeder E-Mail sind jetzt
gedimmt und erscheinen in voller Stärke, wenn Sie auf die Zeile zeigen,
