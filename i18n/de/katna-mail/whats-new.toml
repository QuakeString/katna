["2026-09-27-1609-many-attachments"]
title = "Platz für viele Anhänge"
text = """
Egal wie viele Dateien Sie anhängen: Die Liste scrollt jetzt über der Senden-Leiste, statt sie zu überdecken, zeigt die neueste Datei und nennt die Anzahl der Dateien und ihre Gesamtgröße.
