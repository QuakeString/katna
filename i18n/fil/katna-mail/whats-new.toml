["2026-09-27-1201-recipient-chips"]
title = "Mga tatanggap bilang chip"
text = """
Nagiging chip na pangalan lang ang ipinapakita ang mga address sa Para
kay, Cc at Bcc. Ipinapakita ng arrow sa isang chip ang address nito, at
sa pag-double click ay mae-edit mo ito. Minamarkahan nang pula ang
anumang hindi valid na address, at hinihiling ng Ipadala na ayusin mo
muna ito.
"""

["2026-09-27-1253-start-at-login"]
title = "Nagsisimula ang Katna sa pag-log in"
text = """
Tahimik nang nagsisimula ang Katna kapag nag-log in ka: nagsi-sync ang
mail, at lumalabas ang mga notification ng bagong mail at ang icon sa
system tray nang hindi binubuksan ang window. I-off ito, o ipabukas din
ang window, sa Mga setting > Pangkalahatan > Desktop.
"""

["2026-09-27-1215-paste-and-drop"]
title = "I-paste at i-drop ang kahit ano sa mensahe"
text = """
Napapanatili ng text na kinopya mula sa Word, LibreOffice o isang web
page ang mga font, kulay at listahan nito, at pumapasok bilang
talahanayan ang mga cell mula sa Excel, LibreOffice Calc o Google Sheets.
Sa isang maliit na bar sa ilalim ng in-paste mo, puwede mo itong gawing
talahanayan, larawan o plain text; nagpe-paste ng plain text ang
Ctrl+Shift+V. Ina-attach ang mga file na kinopya sa Dolphin o dinrag
papunta sa mensahe, at tinatanong ng mga larawan kung sa text sila
ilalagay o bilang attachment.
"""

["2026-09-27-1300-new-logo"]
title = "Bagong logo ng Katna"
text = """
May sariling logo na ang Katna: কাটনা sa isang card sa ibabaw ng sobre.
Makikita mo ito sa menu ng app, sa panel, sa system tray, sa itaas na bar
at sa Tungkol sa Katna.
"""

["2026-09-27-1335-account-names-pictures-order"]
title = "Ang mga account mo, sa paraang gusto mo"
text = """
Ipinapakita na ng bawat account ang sarili nitong may-kulay na titik sa
halip na iisang larawan para sa lahat. Sa Mga setting > Mga Account,
puwede kang pumili ng larawan para sa bawat isa, palitan ang pangalan
