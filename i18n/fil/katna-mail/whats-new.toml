paperclip para sa mga file, template at signature. Nananatili sa karaniwang
view ang mga newsletter, at inililipat ng switch na Chat | Mail ang anumang
usapan sa alinmang paraan.
"""

["2026-10-01-0946-forward-keeps-files"]
title = "Kasama ang mga file sa pagpapasa"
