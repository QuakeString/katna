Ginagawa nitong sagot ang parehong card: pumili ng ideya o sabihin kung ano
ang dapat nitong sabihin, baguhin ang draft kung gusto mo, saka Ipadala, o
Buksan ito sa usapan para ituloy ang pagsusulat. Naghihintay sa reply box
ang sagot na isinara mo nang hindi ipinapadala. Bumubukas na rin ang card
kung saan ka nag-click.
"""

["2026-10-02-0559-draft-saved-signature-tag"]
title = "Nase-save ang mga draft habang nagsusulat ka"
text = """
Kusa nang nase-save sa Mga Draft ang mensaheng sinusulat mo bawat ilang
segundo, at tahimik na lumalabas ang “Na-save ang draft” sa tabi ng pamagat
nito. Pinapangalanan ng malabong tag sa tabi ng signature mo ang signature;
i-click ito para pumili ng iba. Nakahanay na rin ang sulok ng window ng
Mag-compose sa card sa tabi nito.
"""

["2026-10-02-0654-attach-from-drive"]
title = "Mag-attach mula sa Google Drive"
text = """
Binubuksan na ng paperclip ng Mag-compose ang picker ng Mga File, kapareho ng
Mula sa Mga File ng chat, kasama ang Google Drive mo sa tabi ng mga mail file
mo at ang Ang computer na ito… para sa iba pa. Pumapasok sa mail ang mga
file na kasya; ipinapadala bilang link ang malalaking file at Google Docs,
na ibinabahagi sa mga recipient kapag nagpadala ka.
"""

["2026-10-02-0734-peek-and-reply-in-notifications"]
title = "Sumilip at sumagot mula sa notification"
text = """
May Silipin na ang notification ng bagong mail, na nagpapakita ng mismong
mail sa parehong notification, at Sumagot, kung saan ita-type mo ang sagot
mo mismo roon at pipindutin ang Ipadala. Ipinapadala ito mula sa account na
pinagdatingan ng mail, pagkatapos ng oras mo sa I-undo ang pagpapadala;
binubuksan ito ng I-undo sa Katna Mail para ituloy ang pagsusulat. Sa
Linux, may sarili na ring mas malakas na tunog ang bagong mail; pumili ng
iba sa Mga setting > Mga Notification.
"""

["2026-10-02-0735-drive-viewer-opens-at-once"]
title = "Agad bumubukas ang mga file sa Drive"
text = """
Ang pagbukas ng file mula sa drive mo ay agad na naglalabas ng viewer, na
may umiikot na arko hanggang dumating ang file. Tumatanggap na ng sarili
nilang click ang mga abiso sa ibaba ng window, kaya hindi na kini-click ng
Isara ang nasa ilalim nila.
"""

["2026-10-02-0740-smaller-updates"]
title = "Mas maliliit na update"
text = """
Ang nagbago lang ang dina-download na ng mga update, kadalasan ilang
megabyte sa halip na ang buong package. Binubuo ng Katna ang bagong bersyon
mula sa mayroon ka at sinusuri ito bago i-install, at dina-download ang
buong package kapag hindi nito kaya.
"""

["2026-10-02-0755-faint-lines-everywhere"]
title = "Malalabong linya saanman"
text = """
Sa light mode, kasinlabo na ng mga linya sa pagitan ng mga mail ang bawat
linya sa pagitan ng mga bagay, sa ilalim ng mga header at sa paligid ng mga
card, kasama ang card ng buod. Pinapanatili ng mga field, chip at button
ang malinaw nilang outline.
"""

["2026-10-02-0756-ai-replies-signed"]
title = "Nagtatapos sa signature mo ang mga sagot ng AI"
text = """
Hindi na nagtatapos sa “Best regards” at sa pangalan mo ang mga sagot at
tala na isinulat ng AI. Ang signature mo na ang lumalagda sa mga ito: sa
sagot ng card ng buod, pinipili ng signature tag sa ilalim ng text kung
alin, gaya sa Mag-compose.
"""

["2026-10-02-0801-unified-inbox-tabs"]
title = "Mga tab sa pinag-isang inbox"
text = """
May mga tab na rin ang inbox ng lahat ng account mo: Pangunahin, Mga
Promosyon, Social, Mga Update at Mga Forum, na nasa tab ng uri nito ang
mail ng bawat account. Ipinapakita ng tuldok sa tabi ng bawat nagpadala
kung saang account dumating ang mail. Pumili ng isang account sa ilalim
nito para makita ang sariling mga tab ng account na iyon, o pumili ng
ibang set sa Mga setting > Inbox.
"""

["2026-10-02-0805-feeds-removed"]
title = "Wala na ang Feeds sa kaliwang bar"
text = """
Hindi na magbabasa ang Katna ng mga RSS at Atom feed, kaya umalis na sa bar
sa kaliwa ang button na Feeds at ang page nitong “Malapit na”. Nananatili
sa Mga File ang Ctrl+7.
"""

["2026-10-02-0820-drive-bin-and-rename"]
title = "I-rename at itapon ang mga file sa drive"
text = """
Sa Mga File, may I-rename at Ilipat sa basurahan na sa menu ng
file o folder sa Google Drive o OneDrive mo. Tina-type ng I-rename ang
bagong pangalan sa mismong lugar (F2), at may I-undo ang Ilipat sa
basurahan (Del).
"""

["2026-10-02-0827-files-chips-on-phones"]
title = "Kasya sa phone ang mga chip ng Mga File"
text = """
Sa phone, hindi na naputol sa gilid ang mga chip ng pahina ng Mga File.
Tumutupi sa mga icon nila ang mga uri ng file, pinapanatili ng pinili mo
ang label nito, at may sariling row ang mga chip ng tao, araw at
pagkakasunod-sunod.
"""

["2026-10-02-0828-uploads-tray"]
title = "Tingnan ang mga upload mo habang umuusad"
text = """
Lumalabas na sa isang tray sa kanang ibaba ang mga file na ina-upload mo
sa Google Drive o OneDrive, bawat isa may singsing na napupuno habang
umaakyat ito at ang natitirang oras. Kanselahin ang isa o lahat, itupi ang
tray, at i-click ang tapos nang file para buksan ang folder nito.
"""

["2026-10-02-0838-drive-share"]
title = "Ibahagi ang mga file sa drive mula sa Katna"
text = """
Ang Ibahagi… sa menu ng file sa Google Drive o OneDrive sa Mga File ay
nagbubukas ng dialog na Ibahagi: magdagdag ng mga tao bilang Viewer,
Commenter o Editor, palitan o alisin ang mga may access na, at buksan ito
sa sinumang may link. Ini-email lang sila ng drive kapag nilagyan mo ito ng
tsek.
"""

["2026-10-02-0909-soft-search-box"]
title = "Mas malambot na search box"
text = """
Mas magaan ang search box sa itaas: napakalabong gilid at laman habang hindi
mo ito ginagamit, at puting field na may malambot na accent na gilid habang
nagta-type ka, sa halip na abong pill na may makapal na may-kulay na singsing.
"""

["2026-10-02-0942-hourly-update-check"]
title = "Mas maagang dumarating ang mga update"
text = """
Tumitingin na ang Katna ng bagong bersyon bawat oras at kaagad pagkagising ng iyong computer mula sa sleep, kaya mabilis na dumarating ang notification ng update pagkatapos ng release.
"""

["2026-10-02-0958-faint-lines-dark"]
title = "Malalabong linya rin sa dark mode"
text = """
Sa dark mode, kasinlabo na ng sa light mode ang mga linya sa pagitan ng mga mail, sa ilalim ng mga header at sa paligid ng mga card. Nananatiling malinaw ang outline ng mga field, chip at button.
"""

["2026-10-02-1200-smaller-updates-after-a-break"]
title = "Maliliit na update kahit lumaktaw ka"
text = """
Nananatiling maliit ang mga update kahit lumaktaw ka ng isa o dalawang araw
ng mga bagong bersyon. Humahakbang na ang Katna mula sa bersyong nasa iyo
sa mga naunang bersyon, ilang megabyte bawat isa, sa halip na i-download
muli ang buong package.
"""

["2026-10-02-1218-replied-arrow"]
title = "Tingnan kung aling mail ang nasagot mo"
text = """
Ipinapakita ng maliit na arrow ng pagsagot sa isang linya ng listahan ng
mail na sinagot mo ito: ikaw ang sumulat ng pinakabagong mail sa pag-uusap,
dito man o sa web. Nawawala ito kapag sumagot sila ulit.
"""

["2026-10-02-1219-tray-icon-follows-dark"]
title = "Sumusunod sa light at dark ang tray icon"
text = """
Nagbabago na ang isang-kulay na tray icon kasabay ng iyong panel sa sandaling
lumipat ka sa pagitan ng light at dark, sa halip na maghintay ng bagong mail.
"""

["2026-10-02-1220-reply-ideas-breathe"]
title = "Makikitang paparating na ang mga ideya ng sagot"
text = """
Habang hinihingi ang mga ideya ng sagot, sa Sumagot ng isang buod o sa
Sumulat ng sagot, humihinga na ang mga hugis nila gaya ng sa buod mismo
habang isinusulat ito. Ipinapakita rin ng card ng buod kung ilang mail ang
nasa pag-uusap habang hinihingi ito, hindi 0.
"""

["2026-10-02-1223-files-corners-and-share-close"]
title = "Mas malinis na sulok sa Mga File"
text = """
Kapag itinapat ang pointer sa file na may puting preview, hindi na sumisilip
ang puti sa itaas na mga sulok ng card, bilugan na rin sa itaas ang nakatuping
tray ng mga upload, at may button na pansara sa sulok ang dialog na Ibahagi.
"""

["2026-10-02-1251-search-clear-keeps-mail"]
title = "Nananatiling bukas ang mail mo kapag ni-clear ang paghahanap"
text = """
Magbukas ng mail mula sa mga resulta ng paghahanap at i-clear ang paghahanap
gamit ang X: nananatiling bukas ang mail habang bumabalik ang iyong folder,
sa halip na tumiklop pabalik sa listahan.
"""

["2026-10-02-1255-rounded-sheet-corners"]
title = "Bilugang sulok sa mga spreadsheet"
text = """
Bilugan na sa lahat ng apat na sulok ang spreadsheet sa viewer ng
attachment. Dati, pinaparisukat ang mga ito ng abong letra ng column sa
itaas at ng mga tab ng sheet sa ibaba.
"""

["2026-10-02-1256-clean-card-details"]
title = "Malinis na detalye ng contact sa mga card"
text = """
Hindi na nagpapakita ng ligaw na asterisk o marka ng link sa angle bracket
ang mga numero ng telepono, address at iba pang detalyeng kinuha sa lagda.
Kapag pumirma ang isang katrabaho sa mail mula sa pinagsasaluhang address
gaya ng accounts@, detalye lang ng kumpanya ang itinatago ng card, hindi ang
numero o titulo ng katrabahong iyon.
"""

["2026-10-02-1303-open-attached-files"]
title = "Tingnan ang inilakip mo"
text = """
I-click ang file na nakalakip sa mensaheng isinusulat mo para buksan ito sa
viewer ng Katna, kung saan din nabubuksan ang mga natanggap na file, at
tiyaking tamang file ito. Ang file na ipinadala bilang link ng Google Drive
o OneDrive ay nabubuksan sa drive.
"""

["2026-10-02-1307-settings-scroll-bar"]
title = "Scroll bar sa Mga setting"
text = """
May parehong manipis na scroll bar na ngayon ang bawat tab ng Mga setting
gaya ng sa bukas na mail at sa Mga File: lumalabas ito habang nag-i-scroll
ka o itinatapat ang pointer sa pahina, at puwede mo itong i-drag.
"""

["2026-10-02-1248-account-colors"]
title = "Sariling kulay para sa bawat account"
text = """
Pumili ng kulay para sa bawat account sa Mga setting > Mga Account, o
i-right-click ang account sa pane ng folder: isa sa pito, o kahit anong
kulay mula sa gulong ng bahaghari na kasunod nila. Iyon ang magiging kulay
ng tuldok sa tabi ng bawat sender sa pinag-isang inbox at ng singsing sa
paligid ng larawan ng account, at kapag itinapat ang pointer sa tuldok,
lumalabas ang pangalan ng account. May sariling kulay ang bawat account
mula sa simula, hindi kailanman kapareho ng sa isang tab ng inbox.
"""

["2026-10-02-1340-colors-button-mail-only"]
title = "Ang button ng orihinal na kulay, kung saan lang ito may silbi"
text = """
Sa madilim na tema, dumudulas na ngayon palayo ang button na Ipakita ang
orihinal na mga kulay habang chat ang anyo ng pag-uusap, at dumudulas itong
pabalik sa Mail.
"""

["2026-10-02-1340-logo-and-custom-accent"]
title = "Kulay mo na ang logo, at kahit anong accent na gusto mo"
text = """
Suot na ngayon ng logo ng Katna sa window ang iyong kulay ng accent, sa
maliwanag man o madilim. At may gulong ng kulay na sa dulo ng Mga setting
> Hitsura > Accent: i-click ito para pumili ng kahit anong accent na gusto
mo.
"""

["2026-10-02-1358-empty-reply-no-draft"]
title = "Walang draft ang mga sagot na walang laman"
text = """
Ang sagot na kinlik mo pero hindi mo sinulatan, sa chat box man o sa ilalim
ng isang mail, ay basta nang nagsasara kapag iniwan mo ito. Hindi na ito
nagtatabi ng draft at hindi na bumabalik kapag lumipat ka sa pagitan ng
Chat at Mail.
"""

["2026-10-02-1400-folder-right-click-selects"]
title = "Binubuksan ng right-click ang folder"
text = """
Kapag ni-right-click ang isang folder sa pane ng folder, pinipili at
binubuksan na muna ito bago lumabas ang menu nito, kaya malinaw na sa
folder na nakikita mo gumagana ang menu.
"""

["2026-10-02-1405-viewer-arrows-hover"]
title = "Nananatiling kita ang mga arrow ng viewer"
text = """
Hindi na halos pumuputi ang mga arrow sa gilid ng viewer ng attachment
kapag itinapat mo ang pointer sa mga ito. Sa halip, nagiging mas mapusyaw
na abo ang mga ito nang kaunti, kaya madali pa rin silang makita sa ibabaw
ng puting pahina.
"""

["2026-10-02-1432-account-colour-button"]
title = "Iisang button ng kulay sa bawat account"
text = """
Sariling kulay na lang nito ang ipinapakita ng bawat account, sa button na
Kulay sa Mga setting > Mga Account at sa right-click menu ng account.
I-click ito para pumili ng isa sa walong kulay o ng sarili mong kulay,
mismo kung saan ka nag-click.
"""

["2026-10-02-1443-reply-at-the-end"]
title = "Nasa dulo ang iyong sagot"
text = """
Laging nasa dulo ng pag-uusap ang sagot ngayon, kahit pinakabagong mail ang
unang ipinapakita. Kapag lumipat mula sa Chat papuntang Mail, nag-i-scroll
pababa rito, nasa iniwan mong puwesto ang cursor.
"""

["2026-10-02-1451-card-shows-signer"]
title = "Ipinapakita ng card kung sino ang pumirma sa bukas na mail"
text = """
Binabasa na ngayon ng card ng contact ang lagda ng mail na bukas mo, hindi
lang ng pinakabago. Kapag pumirma ang isang katrabaho sa mail mula sa
pinagsasaluhang address gaya ng accounts@, ipinapakita ng card ang kanyang
pangalan, tungkulin, telepono at ang address ng kumpanya mula sa mail na
iyon.
"""

["2026-10-02-1510-search-click-away"]
title = "Mag-click kahit saan para umalis sa search box"
text = """
Kapag kinlik ang bakanteng espasyo sa itaas na bar, sa tabi ng search box,
lalabas ka na ngayon sa box, gaya ng pag-click sa listahan ng mail.
Nananatili ang iyong paghahanap.
"""

["2026-10-02-1515-empty-message-no-draft"]
title = "Wala nang draft na walang laman"
text = """
Ang bagong mensaheng binura mo ulit ang laman bago isinara ay hindi na
naiiwan sa Mga Draft, gaya ng sagot na walang laman sa isang pag-uusap.
"""

["2026-10-02-1513-dark-pages"]
title = "Madidilim na pahina sa viewer"
text = """
Sa madilim na mode, may button na hugis-kalahating buwan ang viewer ng
attachment na nagpapakitang madilim sa maliliwanag na PDF, dokumento,
slide, sheet at text file. Nananatili ang kulay ng mga kulay, pinalalabo
lang ang mga larawan sa loob ng pahina sa halip na gawing negatibo, at
dumidilim ang na-scan na papel gaya ng text. Tinatandaan ng Katna ang
pinili mo para sa susunod na file.
"""

["2026-10-02-1522-window-corners"]
title = "Piliin ang mga sulok at border ng iyong window"
text = """
Kapag sariling title bar ng Katna ang gamit, may slider na ngayon ang Mga
setting > Pang-eksperimento na Pagkabilog ng sulok, mula parisukat hanggang
bilog, at switch na Border na may sariling opacity. Kapag naka-on
ang Sariling dami ng blur, itinatakda na rin ng slider na Opacity kung gaano
karami ang tumatagos sa malabong background ng window.
"""

["2026-10-02-1535-ctrl-shift-click-select"]
title = "Pumili ng mga mail gamit ang Ctrl at Shift"
text = """
Mag-Ctrl+click sa isang mail sa listahan para piliin ito, at mag-Ctrl+click
pa sa iba para idagdag ang mga ito. Pinipili ng Shift+click ang bawat mail
mula sa huling kinlik mo. Para buksan ang mail sa sarili nitong window,
i-right-click ito at piliin ang Buksan sa bagong window.
"""

["2026-10-02-1610-frosted-panes"]
title = "Mga frosted na pane, chat at paghahanap"
text = """
Kapag naka-on ang Palabuin ang background ng window, tumatagos na rin ang
blur sa listahan ng mail, sa bukas na mail at sa card ng tao, may slider pa
na Opacity ng pane. Mas kita na ito nang kaunti sa likod ng mga bubble
ng chat, at nananatiling frosted ang search box habang nagta-type ka. May
sariling switch ang bawat isa sa Mga setting > Pang-eksperimento.
"""

["2026-10-02-1618-fainter-hints"]
title = "Mas malabong pahiwatig sa mga walang lamang box"
text = """
Mas malabo na ngayon ang abong pahiwatig sa walang lamang box, gaya ng
“Sumagot kay…” sa ilalim ng chat o “Maghanap sa mail”, kaya hindi na ito
napagkakamalang text na tinype mo.
"""

["2026-10-02-1642-drag-from-empty-space"]
title = "Ilipat ang window mula sa bakanteng espasyo"
text = """
Sa Linux, puwede mo nang ilipat ang window sa pag-drag ng kahit anong
bakanteng espasyo sa kaliwang bar, sa mga folder o sa bar sa itaas ng iyong
mail, hindi lang sa itaas na bar.
"""

["2026-10-02-1643-space-folds-folders"]
title = "Tinitiklop ng Space ang mga folder"
text = """
I-click ang folder na may mga folder sa loob, saka pindutin ang Space para
buksan o itiklop ito, gaya ng pag-click sa arrow nito. Pagkatapos ng isang
click, gumagalaw na rin sa pane ng folder ang mga arrow key, at lumilipat
ang Tab sa listahan ng mail.
"""

["2026-10-02-1646-viewer-more-menu"]
title = "Kasya ang mga kontrol ng viewer sa makitid na window"
text = """
Sa makitid na window, nananatili na sa loob ng viewer ng attachment ang mga
kontrol sa ibaba nito. Lumilipat sa menu na ⋮ Higit pa ang mga button na
hindi kasya: una ang pag-ikot, saka ang Ikasya, saka ang Madidilim na
pahina. Ang numero ng pahina at ang zoom ang pinakamatagal na nakikita.
"""

["2026-10-02-1743-activity-report-fits"]
title = "Kasya sa window ang ulat ng Aktibidad"
text = """
Nananatili na ngayon sa loob ng window ang ulat ng Aktibidad na may pantay
na margin, at nag-i-scroll ito kapag maikli ang window, kaya hindi na
napuputol ang mga huling hilera nito.
"""

["2026-10-02-1846-folders-and-labels"]
title = "Palitan ang pangalan, burahin at i-drag sa mga folder"
text = """
I-right-click ang folder na ginawa mo para palitan ang pangalan nito o
burahin ito; inililipat muna sa Basurahan ang mail nito kapag binura. I-drag
ang mail mula sa listahan papunta sa isang folder para ilipat ito roon. May
search box na ang Ilipat sa: mag-type para maghanap ng folder, o para
gumawa ng bago at ilipat doon ang mail. Sa Gmail, naglalagay at nag-aalis ng
label sa mail ang Lagyan ng label, at nagdaragdag ng label ang pag-drop ng
mail dito.
"""

["2026-10-02-1928-mail-rules"]
title = "Mga panuntunan sa mail"
text = """
Kusang inaayos ng mga panuntunan ang bagong mail: ayon sa sender, subject o
mga salita, inililipat, nilalagyan ng label, ini-star, ipinapasa o
pinatatahimik nila ito. Gumawa ng isa sa Mga setting > Mga folder at
panuntunan, o i-right-click ang isang mail at piliin ang Gumawa ng
panuntunan…, at tingnan kung ilang kamakailang mail ang tumutugma bago mo
i-save. Sa Ilipat sa, i-tik ang “Palaging ilipat dito ang mail mula kay …”
para ilipat sa isang click ang mail ng isang sender at ang mga susunod pa
niyang mail.
"""

["2026-10-02-2017-rules-on-the-server"]
title = "Mga panuntunang gumagana kahit patay ang computer"
text = """
Gumagana na ngayon ang mga panuntunan sa mail sa Gmail, o sa iyong mail
server kapag tumatanggap ito ng mga panuntunang Sieve, kaya naaayos din ang
mail sa iyong phone at habang patay ang computer na ito. Ipinapakita ng Mga
setting > Mga folder at panuntunan kung saan gumagana ang bawat panuntunan,
at kung bakit nananatili ang isa sa Katna.
"""

["2026-10-03-0046-smooth-folded-tabs"]
title = "Maayos na lumilipat ang mga nakatiklop na tab"
text = """
Kapag itinitiklop ng makitid na window ang mga tab ng inbox bilang mga icon,
hindi na biglang lumilipat ang mga tab: lumiliit pabalik sa icon nito ang
tab na iniwan mo habang naglalaho ang pangalan nito, at lumalaki ang
binuksan mo habang lumilitaw ang pangalan nito.
"""

["2026-10-03-0051-read-rows-frosted"]
title = "Frosted na rin ang nabasang mail"
text = """
Kapag naka-on ang mga frosted na pane, ipinapakita na rin ng mail na nabasa
mo ang frost sa likod ng listahan gaya ng hindi pa nabasang mail, iba lang
nang kaunti ang kulay, sa halip na buong guhit.
"""

["2026-10-03-0101-rounder-corners"]
title = "Mas bilog na sulok ng window"
text = """
Umaabot na ngayon sa 32 pixel ang Pagkabilog ng sulok sa Mga setting >
Pang-eksperimento, dalawang beses na mas bilog kaysa dati, at puwede mong
i-type ang numero sa box sa tabi ng slider.
"""

["2026-10-03-0113-viewer-round-corners"]
title = "Sumusunod ang viewer sa bilog na sulok ng window"
text = """
Kapag sariling title bar ng Katna at bilog na sulok ang gamit, binibilog na
ngayon ng viewer ng attachment ang mga sulok sa ibaba nito para tumugma sa
window, sa halip na magpakita ng parisukat na abong sulok lampas sa gilid ng
window.
"""

["2026-10-03-0147-chat-go-down"]
title = "Bumalik sa pinakabagong mail"
text = """
Kapag malayo na ang na-scroll mo pataas sa isang chat, may bilog na button
na lumilitaw sa kanang ibaba. Dinadala ka nito pabalik sa pinakabagong mail
at binibilang nito ang mga dumating habang wala ka roon.
"""

["2026-10-03-0147-chat-long-mails"]
title = "Mahahabang mail sa mga chat"
text = """
Sa mahabang bubble, nananatili ang larawan ng sender sa ibaba ng nakikita
mo, at nananatili ang mga button ng sagot, pin at higit pa sa bahaging
nakikita. I-right-click ang text para maabot ang lahat ng ito.
"""

["2026-10-03-0147-chat-scroll-bar"]
title = "Scroll bar sa mga chat"
text = """
May parehong tahimik na scroll bar na ang mga chat gaya ng bukas na mail, na
lumalabas habang nakatapat ang pointer sa mga ito.
"""

["2026-10-03-0147-chat-translate"]
title = "Pagsasalin sa mga chat"
text = """
Inaalok na rin sa chat ang salin ng mail na nasa ibang wika, gaya sa Mail.
I-right-click ang kahit anong bubble at piliin ang Isalin para ikaw mismo
ang magsalin, at muli para ipakita ang orihinal.
"""

["2026-10-03-0150-search-pill-hovers"]
title = "Pantay na hover sa search bar ng phone"
text = """
Sa phone, nasa gitna na ngayon ng mga bilog na dulo ng search bar ang button
ng mga folder at ang larawan ng iyong account, at pare-parehong bilog na
hover ang bawat button sa bar, pantay ang layo mula sa gilid nito.
"""

["2026-10-03-0159-starter-rules"]
title = "Mga panimulang panuntunan"
text = """
Nag-aalok na ngayon ang Mga setting > Mga folder at panuntunan ng mga
handang panuntunan, na naka-off: tahimik na promosyon, mga newsletter sa
Babasahin, mga resibo, mga delivery, ticket ng tren at eroplano (IRCTC, Air
India, IndiGo at iba pa), mga one-time code, mga security alert, social na
mail at mga imbitasyon sa kalendaryo. I-on ang isa at gagana ito sa lahat
ng iyong account, at gagawa ito ng mga folder gaya ng Biyahe kapag
kailangan. Kaya rin ng mga panuntunan na tingnan ang tab ng inbox at kung
galing sa mailing list ang mail.
"""

["2026-10-03-0200-chat-file-hover"]
title = "Mas malambot na card ng file sa mga chat"
text = """
Hindi na dumidilim ang file sa bubble ng chat kapag itinapat ang pointer.
Bahagya itong umaangat na may mahinang kulay, at madali pa ring basahin ang
pangalan nito.
"""

["2026-10-03-0210-opened-mail-stays-in-view"]
title = "Nananatiling kita ang mail na binuksan mo"
text = """
Kapag nasa tabi ng listahan ang pane ng pagbabasa, nananatili sa dati
nitong puwesto sa listahan ang mail na kinlik mo habang bumubukas ang pane,
o nag-i-scroll ang listahan nang sapat lang para makita ito nang buo. Hindi
na ito nawawala sa paningin, mula man sa listahan o sa mga resulta ng
paghahanap mo ito binuksan.
"""

["2026-10-03-0212-about-header-stays"]
title = "Nananatiling kita ang header ng Tungkol"
text = """
Kapag nag-scroll sa Tungkol, lumiliit na ngayon ang malaking logo at
nagiging maliit sa kaliwang itaas, katabi ang Katna, ang tagline nito at
ang bersyon, at nananatili sa puwesto ang header na iyon habang nag-i-scroll
sa ilalim nito ang iba pa.
"""

["2026-10-03-0221-folded-tab-icon-settles"]
title = "Hindi na umuusog ang mga nakatiklop na tab"
text = """
Kapag lumipat ka sa pagitan ng mga nakatiklop na tab ng inbox, humihinto na
ngayon ang tab na iniwan mo mismo sa laking kinaliitan nito, nang hindi
umuusog ng isa o dalawang pixel ang icon nito pagkatapos ng galaw.
"""

["2026-10-03-0228-right-click-another-mail"]
title = "Sapat na ang isang right-click"
text = """
Kapag bukas ang menu ng isang mail o folder, ang pag-right-click sa ibang
mail o folder ay nagsasara na ngayon sa bukas na menu at agad na nagbubukas
ng bago, sa halip na kailanganin ang pangalawang right-click.
"""

["2026-10-03-0235-rule-editor-fits"]
title = "Kasya ang editor ng panuntunan"
text = """
Sa editor ng panuntunan, bumababa na sa mas maraming linya ang mahahabang
salita o listahan ng address sa halip na maputol, buong nakikita ang
“tumutugma sa pattern”, at nananatili ang editor sa loob ng window, na
nag-i-scroll kapag marami itong kondisyon.
"""

["2026-10-03-0235-soft-button-hover"]
title = "Mas malambot na hover sa mga button"
text = """
Kapag itinapat ang pointer sa isang bilog na button, marahan na ngayong
lumalaki ang bilog nito mula sa dalawang-katlo ng laki nito habang
lumilitaw, at medyo mas mabagal lumitaw ang mga pill button gaya ng
Sumagot. Kapag inalis ang pointer, bahagyang lumiliit pabalik ang bilog
habang naglalaho.
"""

["2026-10-03-0249-account-ring"]
title = "Mas malinaw na singsing ng account"
text = """
Mas makapal na ang may-kulay na singsing sa paligid ng larawan ng bawat
account, at mas may puwang na nang kaunti sa pagitan nito at ng larawan, sa
itaas na bar, sa menu ng account at sa Mga setting.
"""

["2026-10-03-0335-chat-picture-steady"]
title = "Hindi na tumatalon ang mga larawan sa chat"
text = """
Ang pag-scroll lampas sa dulo ng chat, o sa chat na walang ma-scroll, ay
hindi na nagpapatalon sa larawan ng sender at sa mga button ng bubble.
"""

["2026-10-03-0355-no-hover-while-scrolling"]
title = "Mas kalmadong pag-scroll sa listahan ng mail"
text = """
Habang nag-i-scroll ka sa listahan ng mail, hindi na umiilaw at hindi na
nagpapakita ng mga button ang mga mail na dumaraan sa ilalim ng pointer.
Gaya sa Gmail, umiilaw ang mail sa ilalim ng pointer kapag huminto na ang
pag-scroll.
"""

["2026-10-03-0541-rule-rows-drag"]
title = "Nadi-drag ang mga panuntunan gaya ng mga account"
text = """
Sa Mga setting > Mga folder at panuntunan, inaangat na ngayon ng pag-drag
sa panuntunan ang buong hilera nito, umuusog ang ibang panuntunan para
bigyan ito ng daan, at pumupuwesto ito kung saan mo ito binitawan, gaya ng
pag-aayos ng pagkakasunod-sunod ng mga account.
"""

["2026-10-03-0545-chat-go-down-aligned"]
title = "Nakahanay na ang button pababa"
text = """
Sa mga chat, ang bilog na button na nagdadala sa iyo sa pinakabagong mail
ay nasa mismong itaas na ng button ng pagpapadala, sa iisang linya.
"""

["2026-10-03-0555-bottom-corners-round"]
title = "Nananatiling bilog ang mga sulok sa ibaba"
text = """
Kapag sariling title bar ng Katna at bilog na sulok ang gamit, hindi na
nagpapakita ang mga sulok sa ibaba ng window ng parisukat ng background
nito lampas sa bilog na border.
"""

["2026-10-03-0606-account-dot-only"]
title = "Mas tahimik na listahan ng mail"
text = """
Ang mga linya sa pinag-isang inbox ay nagpapakita na lang ng may-kulay na
tuldok ng account sa tabi ng sender. Itapat ang pointer sa tuldok para
makita kung saang account galing ang mail.
"""

["2026-10-03-0623-windows-updates"]
title = "Mga update sa Windows"
text = """
Kusa nang nag-a-update ang Katna sa Windows. Tumitingin ito ng bagong
bersyon kada oras, dina-download ang mga ito sa background at ini-install
kapag pinindot mo ang I-update, saka muling bumubukas.
"""

["2026-10-03-0643-files-wildcard-search"]
title = "Mga wildcard sa paghahanap sa Mga File"
text = """
Sa Mga File, nahahanap na ngayon ng paghahanap sa *.pdf ang bawat PDF, at
gumagana ang * at ? saanman sa pangalan: nahahanap ng invoice*2026* ang
bawat invoice ng 2026. Gumagana ito sa mga file ng iyong mail at sa Google
Drive at OneDrive.
"""

["2026-10-03-0643-linux-package-updates"]
title = "Mga update para sa bawat Linux package"
text = """
Kusa nang nag-a-update ang AppImage at ang Linux tarball gaya ng Arch
package. Sa Fedora package, Snap, Flatpak o Nix, sinasabi sa iyo ng Katna
kapag may bagong bersyon at ipinapakita ang iisang command na mag-i-install
nito, handang kopyahin.
"""

["2026-10-03-0708-copy-codes"]
title = "Kopyahin ang mga code mula sa notification"
text = """
May button na Kopyahin na ngayon ang notification ng bagong mail na may
code para sa pag-sign in o beripikasyon, at ang may link para i-verify o
kumpirmahin ang iyong address ay may button na nagsasabi ng site na
bubuksan nito. Hindi na nagpapasunod sa mouse pointer ng tumatalbog na icon
ng Katna ang mga button sa notification.
"""

["2026-10-03-0730-contact-card-popover"]
title = "Card ng contact sa makitid na window"
text = """
Kapag walang puwang sa window para sa pane ng contact, ang pag-click sa
pangalan o larawan ng isang tao ay nagbubukas ng maikling card sa ibabaw ng
mail, nakaturo sa kung saan ka nag-click. Palaparin ang window at ang buong
pane ang papalit dito.
"""

["2026-10-03-0733-compose-icon-turns"]
title = "Umiikot ang icon ng malaking button habang lumilipat ka ng pahina"
text = """
Ang paglipat sa pagitan ng Mail, Kalendaryo, Mga Contact, Mga Gawain at Mga
Tala ay hindi na biglang nagpapalit ng icon sa malaking button sa itaas ng
kaliwang bar. Umiikot palayo at lumiliit ang lumang icon habang umiikot
papasok ang bago, pati sa button ng phone.
"""

["2026-10-03-0746-sound-sets"]
title = "Mga set ng tunog ng notification"
text = """
May mga set na ng tunog ang Mga setting > Mga Notification: Mga Ibon,
Kalikasan, Mga Hayop, Mga Insekto, Elektroniko, Umaga, mga kampana ng Katna,
o ang sarili ng iyong desktop. Umaawit na parang robin ang bagong mail
maliban kung pumili ka ng ibang set. Puwede ring magkaroon ng sariling tunog
ang kahit anong event, o ng sound file na pipiliin mo.
"""

["2026-10-03-0750-chat-seen-ticks"]
title = "Sino ang nakakita ng iyong mail, sa mga chat"
text = """
Sa chat view, nagkakakulay ang mga tsek sa mail na ipinadala mo nang may
tracking kapag may nagbukas nito. Sa tabi ng mga ito, binibilang ng maliit
na mata ang mga pagbukas at ng link ang mga link na sinundan. Ipatong ang
pointer sa mga ito para makita kung sino ang nagbukas o sumunod sa link,
gaya ng ipinapakita ng mata sa mail view.
"""

["2026-10-03-0834-drawer-edge-clean"]
title = "Walang linya sa tabi ng dumudulas na mga folder"
text = """
Sa phone o tablet, humihinto na ngayon sa gilid ang mga folder na dumudulas
mula sa menu nang walang manipis na linyang kumikislap sa tabi nila habang
pumupuwesto.
"""

["2026-10-03-0845-chat-summary-button-hides"]
title = "Itinatago na ulit ito ng button ng buod"
text = """
Sa chat view, itinatago na ngayon ng kislap sa itaas ang buod kapag
nakikita ito, at ipinapakita ulit sa susunod na click, gaya sa mail view.
"""

["2026-10-03-0915-big-button-glides"]
title = "Dumudulas ang malaking button sa pagitan ng mga pahina"
text = """
Kapag bukas ang mga folder, hindi na biglang nag-iiba ang lapad ng malaking
button sa itaas o ang salita nito kapag lumipat ng pahina. Marahang
lumilipat ang button sa bago nitong lapad habang pataas na naglalaho ang
lumang salita at umaangat papasok ang bago, kasabay ng umiikot na icon.
"""

["2026-10-03-0945-flat-row-hover"]
title = "Mas malinaw na hover sa listahan ng mail"
text = """
Hindi na umaangat na may malambot na anino ang linya sa ilalim ng pointer.
Sa halip, nagkakaroon ito ng patag at medyo mas matingkad na kulay, kaya
nananatiling matalas ang mga gilid nito sa maliwanag at madilim.
"""

["2026-10-03-0959-drawer-bounce-back"]
title = "Dumudulas ang mga folder na may talbog, malinis ang gilid"
text = """
Sa phone o tablet, bumalik na ang maliit na talbog ng mga folder na
dumudulas mula sa menu, at wala nang anino sa gilid nila sa tabi ng rail.
"""

["2026-10-03-1030-crisp-card-edges"]
title = "Mas matalas na gilid ng card sa maliwanag na kulay"
text = """
Sa maliwanag na kulay, may pino at matalas na gilid na ngayon at napakaikling
anino ang listahan ng mail, ang bukas na mail at ang iba pang card sa halip
na malambot na blur, kaya kasinglinaw na silang namumukod sa pahina gaya sa
madilim na kulay.
"""

["2026-10-03-1206-matching-choice-chips"]
title = "Magkakatugmang chip ng pagpipilian"
text = """
Iisang chip na ngayon ang mga pagpipilian sa Mga opsyon sa paghahanap,
Aktibidad, pagsusulat gamit ang AI at mga address book ng isang contact:
pare-pareho ang laki saanman, may tsek sa napili.
"""

["2026-10-03-1453-summary-folds-smoothly"]
title = "Buod na maayos na tumitiklop"
text = """
Ang pagtiklop o pagbukas ng buod ng isang pag-uusap ay marahan nang
dumudulas sa bago nitong taas, at umiikot kasabay nito ang arrow sa halip
na tumalon.
"""

["2026-10-03-1523-animation-speed"]
title = "Piliin kung gaano kabilis gumalaw ang mga bagay"
text = """
May Bilis ng animation na ang Mga setting > Hitsura: sundin ang bilis ng
desktop, o pumili ng sariling bilis ng Katna, mula Mas mabilis hanggang Mas
mabagal. Sumusunod din sa desktop ang Bawasan ang galaw, o puwede itong
laging naka-on o laging naka-off.
"""

["2026-10-03-1536-paste-signature-html"]
title = "I-paste ang HTML ng isang lagda"
text = """
May I-paste ang HTML na ang Mga setting > Mag-compose > Mga lagda, para sa
lagdang dinisenyo sa isang website ng lagda o sa ibang mail app. Nililinis
ito, dina-download ang mga larawan nito at isinasama sa loob ng mail, at
ipinapakita ito ng window ng pag-compose nang eksakto kung paano ito
ipapadala.
"""

["2026-10-03-1546-whats-new-header-stays"]
title = "Nananatili ang heading ng Ano’ng bago"
text = """
Kapag nag-scroll sa Ano’ng bago, ang mga highlight na lang ang gumagalaw:
nananatili sa itaas ang heading at sa ibaba ang Sige.
"""

["2026-10-03-1611-menus-fade-out"]
title = "Naglalaho ang mga menu"
text = """
Naglalaho na ngayon ang right-click menu kapag nagsasara ito, sa halip na
biglang mawala.
"""

["2026-10-03-1625-list-stays-put"]
title = "Hindi gumagalaw ang listahan ng mail kapag nagbukas ka ng mail"
text = """
Hindi na naitutulak pababa nang isang linya ang listahan kapag nagbukas ng
mail sa mga folder kung saan may mga mail na nagpapakita ng attachment.
Nananatili ang listahan mismo kung saan mo ito na-scroll.
"""

["2026-10-03-1628-drawer-top-clean"]
title = "Walang linya ng anino sa itaas ng dumudulas na mga folder"
text = """
Sa phone o tablet, wala nang manipis na linya ng anino sa itaas ng mga
folder na dumudulas mula sa menu, sa ilalim ng search bar.
"""

["2026-10-03-1631-toolbar-menus-fade-out"]
title = "Naglalaho na rin ang mga menu ng toolbar"
text = """
Ang mga menu sa ilalim ng mga button ng toolbar, gaya ng Higit pa at ng box
ng pagpili, ay naglalaho na kapag nagsasara sa halip na biglang mawala.
"""

["2026-10-03-1632-settings-by-app"]
title = "Mga setting na nakaayos ayon sa app"
text = """
May listahan na ng mga pahina sa gilid ang Mga setting: Lahat ng app para
sa pinagsasaluhan ng bawat app, saka Mail, Kalendaryo at Mga File para sa
sarili nilang setting, at bumubukas sa ilalim ng Mail ang mga pahina nito.
Bumubukas ang Mga setting sa app na kinaroroonan mo, at nandoon na ang mga
unang setting ng Kalendaryo.
"""

["2026-10-03-1650-popovers-fade-out"]
title = "Naglalaho ang mga popover"
text = """
Ang maliliit na card na nakaturo sa pinagmulan nila, gaya ng card ng
contact, kung sino ang nakakita ng mail, isang araw sa view na Taon, mga
sariling petsa sa paghahanap at ang pamili ng kulay, ay naglalaho na kapag
nagsasara sa halip na biglang mawala.
"""

["2026-10-03-1711-ring-centred"]
title = "Pantay ang mga singsing ng account"
text = """
Pare-pareho na ngayon ang puwang sa bawat gilid ng may-kulay na singsing sa
paligid ng larawan ng iyong account, sa kahit anong scaling, sa halip na
magmukhang isang pixel na mas makapal ang isang gilid.
"""

["2026-10-03-1717-signature-pictures"]
title = "Lumalabas na ulit ang mga larawan sa lagda"
text = """
Lumalabas na ngayon ang mga larawan mula sa web, gaya ng mga logo sa mga
lagda ng Gmail, sa mga network na maagang pumuputol sa koneksyon sa Google,
sa halip na manatiling walang lamang box.
"""

["2026-10-03-1723-import-signatures"]
title = "Dalhin ang iyong mga lagda"
text = """
Hinahanap ng Mga setting > Mag-compose > Mga lagda > Mag-import ang mga
lagda sa Gmail, at sa Thunderbird, Evolution at KMail sa computer na ito, kasama
ang mga logo nila. I-tik ang mga gusto mo; hindi naka-tik ang mga nasa
Katna na.
"""

["2026-10-03-1750-hover-folders-clean"]
title = "Malinis na gilid ng mga folder na binuksan mula sa Mag-compose"
text = """
Sa window na kasinlaki ng tablet, wala nang manipis na linya sa itaas at
kaliwang gilid ng mga folder na bumubukas kapag ipinatong mo ang pointer sa
Mag-compose.
"""

["2026-10-03-1757-chat-links"]
title = "Nabubuksan ang mga link mula sa chat"
text = """
Sa chat view, nabubuksan na sa isang click ang mga link ng mail, gaya sa
mail view: ang sarili nitong mga link, at mga web at mail address na
nakasulat sa text. Ipatong ang pointer sa isa para makita kung saan ito
papunta. Nabubuksan na rin ang mga nakasulat na address sa plain-text na
mail sa mail view.
"""

["2026-10-03-1811-folds-glide"]
title = "Maayos na tumitiklop ang mga grupo ng kalendaryo"
text = """
Marahan nang bumubukas at sumasara ang mga kalendaryo ng isang account sa
gilid na column ng Kalendaryo, at umiikot na sa halip na bumaligtad ang
maliliit na arrow sa mga natitiklop (ang Higit pa sa card ng contact, ang
mga tao sa chat, ang mga account sa Aktibidad, ang diwa ng sagot ng AI).
"""

["2026-10-03-1844-signature-layouts"]
title = "Mga lagda mula sa labindalawang layout"
text = """
May labindalawang handang layout na ang Mga setting > Mag-compose > Mga
lagda. Punan nang isang beses ang iyong pangalan, mga numero, logo, larawan
at mga pahina, pumili ng layout at kulay, at tingnan ito gaya ng makikita
ng babasa, maliwanag, madilim o bilang plain text. Kasama sa loob ng mail
ang mga larawan, kaya lumalabas ang mga ito saanman.
"""

["2026-10-03-1850-copy-about-whats-new"]
title = "Kumopya mula sa Tungkol at Ano’ng bago"
text = """
Napipili at nakokopya na ang mga salita sa Tungkol sa Katna at Ano’ng bago,
gaya sa browser: i-drag sa ibabaw ng mga ito, i-double-click ang isang
salita o i-triple-click ang isang talata, saka Ctrl+C o i-right-click >
Kopyahin. Madaling i-paste ang bersyon sa ulat ng bug.
"""

["2026-10-03-1904-copy-version"]
title = "Kopyahin ang bersyon sa isang click"
text = """
Ipatong ang pointer sa bersyon sa Tungkol, Ano’ng bago o Mga setting at
lalabas sa tabi nito ang maliit na button ng pagkopya. Kinokopya nito ang
bersyon, kung kailan ito binuo at ang iyong system, handang i-paste sa ulat
ng bug.
"""

["2026-10-03-1924-settings-in-window"]
title = "Nasa tabi na ulit ng iyong mail ang Mga setting"
text = """
Bumubukas na ulit ang Mga setting sa loob ng pangunahing window, kapalit ng
pahinang kinaroroonan mo, na nakagrupo ang listahan ng mga pahina nito sa
Lahat ng app at sa bawat app.
"""

["2026-10-03-1934-copy-any-text"]
title = "Kumopya ng text kahit saan"
text = """
Napipili at nakokopya na ngayon sa buong Katna ang text na may sinasabi sa
iyo: mga pangalan at paglalarawan ng setting, mga detalye ng contact at
event, status ng account, mga mensahe ng error, mga tala sa walang lamang
pahina at mga dialog. I-drag sa ibabaw nito o i-double-click ang isang
salita, saka Ctrl+C o i-right-click > Kopyahin. Walang nagbago sa mga
button at hilera na kinikilik mo.
"""

["2026-10-03-2011-calendar-tasks-switch-month-drag"]
title = "Mga gawain sa Kalendaryo: ipakita o itago, i-drag sa Buwan"
text = """
May box na Mga Gawain na ang listahan sa gilid ng Kalendaryo, sa ilalim ng
iyong mga kalendaryo: alisin ang tsek nito at mawawala ang mga gawain sa
Araw, Linggo, Buwan at Iskedyul hanggang i-tik mo ulit. Sa view na Buwan,
puwede mo nang i-drag ang isang gawain sa ibang araw; nananatili ang oras
nito, at ibinabalik ito ng I-undo.
"""

["2026-10-03-2023-tasks-upcoming-completed-sort-select"]
title = "Paparating, Tapos na, pag-aayos at pagpili sa Mga Gawain"
text = """
May dalawang bagong view ang Mga Gawain. Ipinapakita ng Paparating ang
susunod na dalawang linggo, araw-araw, na nasa itaas ang mga lampas na sa
takdang araw; i-drag ang isang gawain sa ibang araw para ilipat ito.
Ipinapakita ng Tapos na ang lahat ng tinsek mo, ayon sa araw, at
naibabalik ang gawain kapag inalis ang tsek nito. Kayang ayusin ng menu na
⋮ ng bawat listahan ang mga ito ayon sa petsa, star o pamagat.
Mag-Ctrl+click o Shift+click sa ilang gawain para tapusin, ilipat,
lagyan ng petsa, i-star o i-delete ang lahat nang sabay-sabay.
"""

["2026-10-03-2040-task-labels-and-files"]
title = "Mga label at file sa mga gawain"
text = """
Tumatanggap ang mga gawain ng parehong mga label gaya ng iyong mga tala:
idagdag ang mga ito sa detalye ng gawain o i-type ang #home sa bagong
gawain, at pumili ng label sa kaliwa para makita ang bawat gawaing may
ganito. Mag-drop ng file sa isang gawain para ilakip ito, at pinananatili
ng Idagdag sa Mga Gawain ang mga attachment ng mail. Napupunta ang star,
mga label at mga file sa Microsoft To Do at sa iyong CalDAV server, at ang
star sa Zoho.
"""

["2026-10-03-2102-notes-pictures-reminders-history"]
title = "Mga Tala: mga larawan, paalala at kasaysayan"
text = """
Tumatanggap ng larawan ang mga tala, nagpapaalala sa oras na pipiliin mo,
at nag-iingat ng 30 araw ng kasaysayang puwede mong ibalik. Mag-Ctrl+click
sa ilang tala para sabay-sabay na i-pin, kulayan, lagyan ng label o
i-archive ang mga ito, i-type ang [[ para i-link ang isang tala sa iba, at
magdagdag ng mga sipi, code at divider. Ipadala ang tala bilang mail o
i-save ito bilang Markdown o PDF, at kapag naka-on ang AI, inaayos, ginagawang
listahan o binubuod ito ng kislap.
"""

["2026-10-03-2102-quick-capture"]
title = "Isulat agad ang naisip mo, saanman"
text = """
Nagbubukas ang Meta+Alt+T ng maliit na card sa ibabaw ng ginagawa mo para
