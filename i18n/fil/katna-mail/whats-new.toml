itaas, at umiikot ang pangalan sa Kalendaryo, Mga Contact at iba pa
habang lumilipat ka ng app.
"""

["2026-09-27-1143-select-all-unread"]
title = "Piliin ang lahat ng hindi pa nabasa o naka-star"
text = """
Tsine-check na ngayon ng Nabasa na, Hindi pa nabasa, Naka-star at Walang
