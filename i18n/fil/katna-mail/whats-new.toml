Mahalaga, Naipadala, Mga Draft at iba pa para sa lahat ng account;
binubuksan ng arrow sa tabi ng bawat isa ang isang linya bawat account.
May arrow na ngayon ang pangalan ng bawat account na nagtitiklop sa mga
folder nito.
"""

["2026-09-27-1627-right-click-move-and-not-spam"]
title = "Mga right-click menu na angkop sa bawat folder"
text = """
Ang pagpili ng folder o label sa ilalim ng Ilipat sa sa right-click menu
ay naglilipat na ngayon ng mail, may I-undo, pati mula sa mga resulta ng
paghahanap. Sa Spam, nagiging Hindi spam ang Iulat bilang spam. May
Ilipat sa Inbox at I-delete nang permanente ang Basurahan, may Ilipat sa
Inbox ang Archive, at hindi na ipinapakita ng Mga Draft at Naipadala ang
mga item na hindi angkop doon.
"""

["2026-09-27-1633-drag-accounts"]
title = "I-drag ang mga account para iayos"
text = """
Sa Mga setting > Mga Account, ang pag-drag ng account ay iniaangat na
ngayon ang buong row nito, at gumigilid ang ibang account para
magbigay-daan. Lumalabas ang Iakyat at Ibaba kapag itinuro mo ang isang
row.
"""

["2026-09-27-1637-drafts"]
title = "Naitatabi ang mga draft"
text = """
Kapag isinara mo ang mensaheng sinusulat mo, sine-save na ito ngayon sa
Mga Draft, pati sa iyong mail server, gaya sa Gmail. Buksan ito mula sa
Mga Draft para ituloy ang pagsusulat. Ang button ng basurahan lang ang
nagtatapon nito, at ibinabalik ito ng I-undo.
"""

["2026-09-27-1609-many-attachments"]
title = "May puwang para sa maraming attachment"
text = """
Gaano man karami ang file na i-attach mo, nag-i-scroll na ngayon ang listahan sa itaas ng bar ng Ipadala sa halip na matakpan ito, ipinapakita ang pinakabagong file, at sinasabi kung ilan ang file at ang kabuuang laki nila.
"""

["2026-09-27-1628-select-on-screen-first"]
title = "Piliin ang hindi pa nabasa o naka-star, gaya ng sa Gmail"
text = """
Tsine-check na ulit ng Nabasa na, Hindi pa nabasa, Naka-star at Walang
star sa menu na Piliin ang tumutugmang mail sa screen. Nag-aalok ang isang
linya sa itaas ng listahan na piliin ang bawat tumutugmang usapan sa
folder, at ina-undo ito ng I-clear ang pagpili.
"""

["2026-09-27-1632-leave-settings-by-folder"]
title = "Inaalis ka ng mga folder sa Mga setting"
text = """
Kapag bukas ang Mga setting, isinasara na ngayon ng pag-click sa isang
folder o sa icon ng Mail ang Mga setting at binubuksan ang folder na iyon,
gaya ng sa Gmail. Gumagana pa rin ang back arrow.
"""

["2026-09-27-1641-drop-pictures-in-text"]
title = "I-drop ang mga larawan sa text"
text = """
Kapag nag-drag ka ng larawan sa ibabaw ng mensahe, may lumalabas na caret kung saan ito lalapag, kaya maaari mo itong i-drop sa gitna ng pangungusap. Ipinapakita pa rin ng ibang file ang drop area para sa mga attachment, at gumagana na ang pag-drop kahit nakapag-type ka na.
"""

["2026-09-27-1707-quick-quit"]
title = "Agad na nagsasara ang Umalis"
text = """
Hindi na naghihintay ang Umalis sa menu ng icon sa system tray sa mail na
nagsi-sync o ini-index pa: agad na nagsasara ang Katna at ang icon nito sa
tray, at itutuloy ang natitira sa susunod na pagbukas ng Katna.
"""

["2026-09-27-1715-contact-panel"]
title = "Detalye ng contact sa tabi ng iyong mail"
text = """
Sa malapad na window, may card na ngayon sa tabi ng bukas na usapan na
nagpapakita ng nagpadala: ang kanilang phone, titulo at kumpanya mula sa
kanilang mga signature, ang oras nila ngayon, gaano karaming mail ang
napagpalitan ninyo, ang mga kamakailang usapan ninyo at ang mga file sa
pagitan ninyo. I-click ang isang usapan o file para buksan ito, o ang
ibang tao sa usapan para makita sila. Binabasa lang ito mula sa mail mo sa
computer na ito. Itinatago ito ng contact button sa toolbar ng pane ng
pagbabasa.
"""

["2026-09-27-1640-storage-used"]
title = "Nagamit na storage"
text = """
Ipinapakita sa ibaba ng pane ng folder kung gaano na kapuno ang mail
storage ng account, gaya ng “34% ng 15 GB ang nagamit”, kapag sinasabi ito
ng mail server nito.
"""

["2026-09-27-1651-desktop-search"]
title = "Maghanap ng mail mula sa KRunner at sa GNOME search"
text = """
Mag-type ng pangalan sa KRunner (Alt+Space) o sa search ng Activities para
sumulat sa taong iyon, kopyahin ang address niya o hanapin ang mail niya.
Lumalabas ang mga mensahe kapag nasa paksa o nagpadala nito ang bawat
salitang tina-type mo; magsimula sa mail: para maghanap sa lahat ng mail
mo, gaya sa search box ng Katna Mail.
"""

["2026-09-27-1727-mail-templates"]
title = "Mga template para sa mail na madalas mong isinusulat"
text = """
Isulat nang isang beses ang mensahe at i-save ito gamit ang bagong button
na Mga template sa window ng pag-compose, pagkatapos ay ilagay ito sa
anumang bagong mail o sagot sa isang click. Isulat ang {first name},
{name} o {my name} at pupunan ito ng Katna para sa bawat tatanggap.
I-edit, palitan ang pangalan o i-delete ang mga template sa Mga setting >
Mag-compose.
"""

["2026-09-27-1724-server-send-later"]
title = "Naipapadala ang naka-iskedyul na mail kahit naka-off ang computer mo"
text = """
Kapag kayang hawakan ng iyong mail server ang mail hanggang sa itinakdang
oras, gaya ng Stalwart, ipinapasa na ngayon ng I-iskedyul ang pagpapadala
ang mensahe rito kapag nawala na ang I-undo, kaya naipapadala ito sa oras
kahit naka-off ang computer na ito. Sinasabi ng menu ng iskedyul kung ang
iyong mail server o ang Katna ang magpapadala nito.
"""

["2026-09-27-1730-softer-row-hover"]
title = "Mas magaan na hover"
text = """
Umaangat na ngayon nang may malabong anino ang linyang nasa ilalim ng
pointer sa listahan ng mail, gaya sa Gmail, sa halip na madilim na guhit
sa ilalim nito.
"""

["2026-09-27-1745-drag-recipients"]
title = "I-drag ang mga address sa pagitan ng Para kay, Cc at Bcc"
text = """
I-drag ang chip ng address sa ibang field para ilipat ito; bumubukas ang
Cc at Bcc habang nagda-drag ka, kahit nakatago ang mga ito. Kapag itinuro
mo ang isang chip, may lalabas na x na nag-aalis dito.
"""

["2026-09-27-1722-katna-account"]
title = "Katna account"
text = """
Sa Mga setting > Subscription, makakagawa ka ng account sa sariling
server ng Katna, na may sariling password, hindi kailanman password ng
mail. Kakailanganin ito ng mga online na feature ng Katna, gaya ng mga
read receipt at pag-track ng link. Makikita mo ang mga computer na
naka-sign in at mai-sign out ang alinman sa mga ito.
"""

["2026-09-27-1805-reopens-as-you-left-it"]
title = "Balik kung nasaan ka"
text = """
Kapag isinara at binuksan ulit ang Katna Mail, babalik ang app, ang folder
at ang tab ng inbox na bukas mo, ang mga folder na binuksan mo at kung
nakatupi ang pane ng folder. Kapag ini-quit ang Katna mula sa system tray,
magsisimula ito nang bago.
"""

["2026-09-27-1724-snooze-and-reminders"]
title = "Snooze at mga paalala sa sagot"
text = """
I-snooze ang isang pag-uusap gamit ang orasan sa linya nito o mula sa
right-click menu: maghihintay ito sa folder na Naka-snooze at babalik sa
Inbox, hindi pa nababasa, sa oras na pinili mo. Kapag nagpapadala, ang
arrow sa tabi ng Ipadala ay puwedeng magpaalala sa iyo kung walang sumagot
sa loob ng 1, 3 o 7 araw. Parehong gumagana habang naka-on ang computer
mo, at humahabol pagkagising nito.
"""

["2026-09-27-1717-translate-mail"]
title = "Basahin ang mail sa wika mo"
text = """
Ang mensaheng nasa ibang wika ay may button na ngayon sa itaas nito para
isalin, at ibinabalik ito ng Ipakita ang orihinal. Tinutukoy ng Katna ang
wika sa computer mo; kapag hiniling mo lang saka napupunta ang text ng
mensahe sa sariling server ng Katna para isalin. Sa Mga setting >
Pangkalahatan > Pagsasalin mo pinipili ang wika mo at ang mga wikang
palaging isasalin.
"""

["2026-09-27-1744-open-and-click-tracking"]
title = "Alamin kung kailan binuksan ang mail"
text = """
I-on ang mata sa tabi ng mga tatanggap para makita kung kailan binubuksan
ng bawat isa ang mensahe mo o sinusundan ang isang link dito, o humingi
na lang ng read receipt. Ipinapakita ng naipadalang mail kung sino ang
nagbukas nito, at sinasabihan ka ng isang notification sa unang
pagkakataon. Parehong naka-off ang mga ito sa bawat bagong mensahe, at
kailangan ng Katna account para sa tracking (Mga setting > Subscription).
"""

["2026-09-27-2042-activity"]
title = "Aktibidad ng naka-track na mail"
text = """
Ipinapakita ng Aktibidad sa tabi ng search box kung ilan sa mga
naka-track mong mensahe ang nabuksan at kung gaano kadalas sinundan ang
mga link nila, kasama ang mga subject line mo na nakaayos ayon sa kung
gaano kadalas binubuksan ang mga ito.
"""

["2026-09-27-2204-search-trigger-words"]
title = "Hanapin ang mail mo mula sa KRunner gamit ang k"
text = """
I-type ang k o m, isang space, at pagkatapos ang hahanapin sa KRunner o sa
GNOME search para makuha ang parehong resulta ng search box ng Katna Mail,
gaya ng “k budget”. Pumili ng sarili mong mga salita sa Mga setting sa
ilalim ng Pangkalahatan.
"""

["2026-09-27-2224-activity-button"]
title = "Aktibidad sa tabi ng search box"
text = """
Binibilang ng button na Aktibidad sa tabi ng search box ang mga bagong
pagbukas at pag-click sa naka-track mong mail, at inililista kung sino ang
nagbukas ng ano at aling mga link ang sinundan nila; i-click ang isa para
buksan ang mensaheng iyon. Ipinapakita ng Mga detalye ang open rate at
click rate, ang mga pagbukas bawat araw at ang pinakamahuhusay mong
subject line para sa huling 7 o 30 araw, lahat ng panahon o mga petsang
pipiliin mo. Ipinapakita na ngayon ng naipadalang mensahe kung ilang
beses ito binuksan ng bawat tao at sinundan ang isang link.
"""

["2026-09-27-2239-mailbox-insights"]
title = "Mga insight sa mailbox"
text = """
Ipinapakita na rin ngayon ng Aktibidad > Mga detalye kung gaano karaming
mail ang ipinadala at natanggap mo sa panahong iyon, kung gaano kadalas at
kabilis sumasagot ka at ang iba, ang mga taong pinakamadalas mong
sinusulatan, at kung anong mga araw at oras dumarating ang mail mo.
Binibilang ito sa computer mo mula sa mail na nasa Katna na.
"""

["2026-09-28-0059-sign-in-with-google"]
title = "Mag-sign in gamit ang Google o Microsoft"
text = """
Magdagdag ng Gmail o Outlook account sa pag-sign in sa sariling page ng
Google o Microsoft sa iyong browser, nang walang app password. Gumagana na
rin ang mga address ng Outlook.com at Hotmail. Kapag huminto sa paggana ang
isang sign-in, may note sa ibaba ng window na nag-aalok na mag-sign in ulit.
"""

["2026-09-28-0054-tracking-on-by-default"]
title = "Naka-on ang tracking at mga receipt mula sa simula"
text = """
Nagsisimula na ngayon ang mga bagong mensahe at reply na naka-on ang
pag-track ng pagbukas at pag-click, isang read receipt at isang delivery
receipt; mag-click ng button sa tabi ng mga tatanggap para i-off ang isa
para sa mensaheng iyon. Kailangang naka-sign in ka sa iyong Katna account
para sa tracking. Ang delivery receipt ay isang email na ipinapadala sa
iyo ng mail server mo kapag natanggap ng server ng bawat tatanggap ang
mensahe; naka-gray out ang button kapag hindi ito inaalok ng mail server
mo.
"""

["2026-09-28-0120-delivered-read-ticks"]
title = "Mga tsek para sa nakarating at nabasa"
text = """
May mga tsek na ngayon sa tabi ng bawat tatanggap sa mail na ipinadala
mo. Ang isang kulay-abong tsek ay nangangahulugang tinanggap ito ng mail
server nila: mula sa delivery receipt, o, kapag wala nitong ipinapadala
ang mail service mo (Gmail), kapag walang mensaheng bumalik sa loob ng
kalahating oras. Ang dalawang tsek sa accent color mo ay nangangahulugang
binasa nila ito, mula sa read receipt o open tracking, at ang babala ay
nangangahulugang hindi ito nakarating. Ituro ang isang tsek para makita
kung kailan at paano. Nananatili sa mailbox mo ang mga email ng receipt sa
ilalim ng “Mga Update”, nang walang notification.
"""

["2026-09-28-0143-gmail-new-mail-notifications"]
title = "Mga notification para sa bagong mail sa Gmail"
text = """
May notification na muli ang bagong mail sa inbox ng Gmail. Dati ay hindi
nahuhuli ng Katna ang mail na inilalagay ng Gmail sa
“Lahat ng Mail” sandali bago ito mapunta sa inbox.
"""

["2026-09-28-0156-attachment-types"]
title = "Maghanap ayon sa uri ng attachment"
text = """
Sa Mga opsyon sa paghahanap, nag-aalok na ngayon ang “May attachment” ng
PDF, XLSX, ODF, XLS, ODS, PPT at PPTX, at Custom para sa kahit anong
ibang extension, gaya ng png o avif. Mail lang na may attachment ng
napiling uri ang lumalabas.
"""

["2026-09-28-0106-original-colors"]
title = "Orihinal na mga kulay sa madilim na tema"
text = """
Sa madilim na tema, ipinapakita sa madidilim na kulay ang mail na may
sariling mga kulay. Ipinapakita ito ng bagong button na kalahating bilog sa
toolbar ng pane ng pagbabasa sa orihinal na mga kulay ng nagpadala, at
ibinabalik ito.
"""

["2026-09-28-0127-print-as-shown"]
title = "Pinapanatili ng pag-print ang pormat"
text = """
Nakaprint ang mail gaya ng hitsura nito sa pane ng pagbabasa, kasama ang
mga talahanayan, kulay, border, listahan at larawan nito. Puwedeng iwan ng
preview ng pag-print ang mga kulay ng background para makatipid sa tinta,
o i-print ang teksto lang sa Simpleng teksto.
"""

["2026-09-28-0141-ask-before-deleting"]
title = "Magtanong bago i-delete"
text = """
Kapag nag-delete ka ng maraming pag-uusap nang sabay-sabay, nagtatanong na
muna ito kung ililipat ang mga ito sa Basurahan. I-tik ang “Huwag nang
magtanong” para laktawan ang tanong, o i-on itong muli sa Mga setting >
Pangkalahatan. Palaging nagtatanong ang permanenteng pag-delete sa
Basurahan.
"""

["2026-09-28-0019-katna-for-windows"]
title = "Katna para sa Windows"
text = """
Tumatakbo na rin ang Katna Mail sa Windows 10 at 11, na ini-install ng
sarili nitong Katna Setup, kasama ang tray icon, mga notification,
pagsisimula sa pag-login at pagbubukas ng mga mail link sa Katna.
"""

["2026-09-28-0236-chip-remove-always"]
title = "Button na pang-alis sa bawat address"
text = """
Palagi nang ipinapakita ng bawat address chip sa Para kay, Cc at Bcc ang x
nito, kaya maaalis mo ito nang hindi muna itinatapat ang pointer dito.
"""

["2026-09-28-0244-pill-format-bar"]
title = "Mas bilugang formatting bar"
text = """
Hugis-pill na ngayon ang formatting bar sa pag-compose (Aa), na may malabong
gilid, kaya hiwalay ito sa teksto mo sa light at dark na tema.
"""

["2026-09-28-0325-long-threads-smooth"]
title = "Mabilis nang nagbubukas ang mahahabang usapan"
text = """
Agad nang nagbubukas at maayos nang nag-i-scroll ang naka-format na mail na
sumisipi ng maraming naunang sagot, gaya ng mahabang serye ng mga sipi, sa
halip na pabagalin ang buong window.
"""

["2026-09-28-0830-who-has-seen-it"]
title = "Kung sino ang nakakita nito, sa likod ng isang mata"
text = """
Wala nang kahon ng mga linya sa itaas ng mail na ipinadala mo nang may
tracking. Nagiging accent color mo ang mata sa tabi ng bituin kapag may
nagbukas nito; itapat ang pointer dito para makita kung sino ang nagbukas
nito o sumunod sa isang link, at kailan.
"""

["2026-09-28-0831-contact-call-copy"]
title = "Tumawag at kumopya mula sa detalye ng contact"
text = """
Sa detalye ng contact sa tabi ng isang usapan, i-click ang isang numero ng
telepono para tawagan ito gamit ang phone app mo o KDE Connect, o gamitin
ang button na pangkopya sa tabi nito. Mapipili at makokopya na rin ang lahat
ng teksto sa panel.
"""

["2026-09-28-0848-quoted-text-hide-remove"]
title = "Itago o alisin ang siniping mail sa isang sagot"
text = """
Itinatago na muli ng button na “...” sa ilalim ng isang sagot ang siniping
mail pagkatapos mo itong buksan. Itapat ang pointer dito at i-click ang x sa
sulok nito para alisin ang siniping mail sa sagot mo; ibinabalik ito ng
I-undo o Ctrl+Z. Nananatili rin sa puwesto ang toolbar ng sagot habang
nag-i-scroll ka.
"""

["2026-09-28-0854-floating-folders"]
title = "Mga folder na lumulutang, at mas malapad na paghahanap"
text = """
Kapag nakatago ang mga folder, binubuksan ang mga ito bilang panel na
hiwalay sa mga gilid kapag ipinatong mo ang pointer sa Mag-compose o Mail,
na may maliit na bingaw na nakaturo sa button. Lumalaki ang search box para
punan ang espasyong iniiwan ng mga folder, at hindi na kumukurap ang
listahan kapag na-click mo ang folder na kinaroroonan mo na.
"""

["2026-09-28-0928-search-address-suggestions"]
title = "Mga mungkahing address sa Mga opsyon sa paghahanap"
text = """
Nagmumungkahi na ng mga address ang Mula kay at Para kay sa Mga opsyon sa
paghahanap habang nagta-type ka, gaya ng Para kay, Cc at Bcc sa pag-compose.
Pumili ng isa gamit ang Enter, Tab o isang click.
"""

["2026-09-28-0935-app-menu-reply-all-window"]
title = "Pangunahing menu sa account card, Sumagot sa lahat sa sarili nitong window"
text = """
May ☰ button ang account card sa tabi ng Pamahalaan ang mga account.
Binubuksan nito ang parehong mga menu na File, I-edit, Tingnan, Pumunta,
Mensahe, Mga Setting at Tulong gaya ng global menu ng desktop, para sa mga
desktop na hindi nagpapakita nito. Binubuksan na ngayon ng Sumagot sa lahat
sa notification ng bagong mail ang usapan sa sarili nitong window, handa
nang pag-type-an, at iniiwan ang pangunahing window kung nasaan ito.
"""

["2026-09-28-1011-tray-brings-window-forward"]
title = "Dinadala sa harap ang Katna Mail ng click sa tray at notification"
text = """
Kapag na-click ang icon sa system tray, o ang Buksan ang Inbox, Bagong
Mensahe o Mga Setting sa menu nito, dinadala na ngayon sa harap ang window
ng Katna Mail sa Wayland, kahit naka-minimize ito o nasa likod ng ibang mga
window. Kapag na-click ang notification ng bagong mail, binubuksan nito ang
mail na iyon, kahit hindi ito ipinapakita ng listahan ng Inbox.
"""

["2026-09-28-1053-send-countdown-reply-in-place"]
title = "Nagbibilang pababa ang Ipadala, at nananatili sa usapan ang sagot mo"
text = """
Pagkatapos ng Ipadala, binibilang pababa ng lumiliit na bilog ang oras para
mag-undo sa tabi ng I-undo, saka sasabihin ng maikling abiso na Naipadala
ang mensahe (may maikling tunog) kapag nakaalis na ang mail. Mapapatay ang
tunog sa Mga setting > Pangkalahatan > Pagpapadala. Nagiging mensahe ang
sagot na isinulat sa isang usapan mismo kung saan mo ito isinulat.
Ipinapakita lang ng itaas nito kung para kanino ito; i-click ito para sa
Mula kay, Para kay, Cc at Bcc. Nagpapalit ang arrow sa tabi ng icon ng sagot
sa pagitan ng Sumagot, Sumagot sa lahat at Ipasa, nang hindi nawawala ang
naisulat mo.
"""


["2026-09-28-1110-search-options-narrow"]
title = "Kasya na ang Mga opsyon sa paghahanap sa makikitid na window"
text = """
Sa makitid o maikling window, lumalapad na ngayon ang Mga opsyon sa
paghahanap ayon sa lugar na mayroon, inilalagay ang mga label sa itaas ng
kanilang field sa phone at nag-i-scroll kapag hindi kasya, kaya laging abot-
kamay ang button na Maghanap.
"""

["2026-09-28-1119-replies-from-right-account"]
title = "Lumalabas ang mga sagot mula sa tamang account"
text = """
Ang Sumagot o Ipasa sa mail na binuksan mula sa Pinag-isang inbox o mula sa
paghahanap ay ipinapadala na ngayon mula sa account na tumanggap ng mail,
hindi sa account na napili sa ilalim ng larawan ng iyong profile.
"""

["2026-09-28-1436-calmer-search-box"]
title = "Ipinapakita ng paghahanap ang shortcut nito"
text = """
Ipinapakita ng search box ang keyboard shortcut nito sa tabi ng "Maghanap sa
mail", ayon sa nakatakda sa Mga setting > Mga Shortcut. Kapag na-click,
pinapanatili nito ang kulay nito at nagpapakita ng malabong gilid sa halip
na dumilim nang may anino. Hindi na rin dumidikit sa ibabang gilid ang mga
folder na nakalutang sa ibabaw ng listahan.
"""

["2026-09-28-1450-clear-activity"]
title = "Ayusin ang Aktibidad"
text = """
Ituro ang isang pagbukas o pag-click sa Aktibidad at pindutin ang × para
alisin ito sa listahan, o pindutin ang I-clear lahat para magsimula muli.
Lalabas pa rin ang mga bagong pagbukas at pag-click, at binibilang pa rin ng
ulat na Mga detalye ang lahat.
"""

["2026-09-28-1541-round-logo"]
title = "Bagong bilog na logo ng Katna"
text = """
May bagong logo na ang Katna: sulat-kamay na "k" sa ibabaw ng isang
teal na bilog — sa menu ng app, sa itaas na bar at sa panel.
Ipinapakita ito ng system tray sa iisang kulay na bagay sa panel mo,
habang buong ipinapakita ng Tungkol sa Katna at ng welcome page ang
pangalang "katna mail".
"""

["2026-09-28-1546-contact-cards"]
title = "Mas malinis na card ng contact"
text = """
Ipinapakita na ngayon ng card ng contact ang bawat bahagi sa sarili
nitong malambot na card, may mga bilog na button sa ilalim ng
pangalan para magpadala ng email sa tao, hanapin ang mail kasama
nila o tawagan sila. Ipinapakita ng Mga kamakailang pag-uusap ang
pinakabago; pindutin ang Higit pa para makita ang iba, at ang
Mas kaunti para itago ulit ang mga ito.
"""

["2026-09-28-1507-reply-box-recipients"]
title = "Mas maayos na reply box"
text = """
Ipinapakita na ngayon ang mga recipient kasama ang kanilang litrato,
at pinagsama sa isang maliit na button ang Cc at Bcc. Ang pagbukas sa
mga recipient ng reply ay dahan-dahang nagpapalaki sa box paakyat, at
ang sinipi na mensahe ay dahan-dahang bumubukas at nagsasara sa
ilalim ng isang kulot na linya na puwede mong i-click para itago itong
muli.
"""

["2026-09-28-1620-softer-window-shadow"]
title = "Mas malambot na anino ng window at mga button na kasing-laki ng KDE"
text = """
Gamit ang window frame ng Katna, mas manipis na ngayon ang anino sa
paligid ng window at unti-unting nawawala nang tuluyan, wala nang
matigas na gilid na naiiwan dati sa tabi ng window. Ang mga button ng
window ay kasing-laki na ngayon ng sa KDE, at kasing-layo sa gilid ng
window gaya ng layo nito sa itaas.
"""

["2026-09-28-1622-update-from-the-app"]
title = "I-update ang Katna mula sa app"
text = """
Awtomatiko na ngayong dina-download ng Katna ang mga bagong bersyon
at sinasabihan ka kapag handa na ang isa. Pindutin ang I-update sa
notification o sa Tungkol: sasabihin ng Katna Mail na mag-re-restart
ito, hihingin ang password mo, iini-install ang update, at magbubukas
ulit sa kinahinto mo. Ino-off ng Mga setting > Pangkalahatan > Mga
Update ang awtomatikong pag-download.
"""

["2026-09-28-1520-track-sealed-and-plain"]
title = "Pag-track sa nilagdaan, na-encrypt, at plain text na mail"
text = """
Gumagana na rin ngayon ang mata sa nilagdaan at na-encrypt na mail:
nila-lagdaan o ine-encrypt ang kopya ng bawat tatanggap nang hiwalay, kaya
nananatiling valid ang mga lagda. Hindi maipapakita ng plain text na mail
ang mga pagbukas, pero naka-track ang mga link nito, kaya makikita mo kapag
sinundan ng isang tao ang isa dito.
"""

["2026-09-28-1834-reply-after-closed-window"]
title = "Nagsisimula muli ang Sumagot pagkatapos isara ang window ng mensahe"
text = """
Ang pagsara ng mensaheng isinulat sa sarili nitong window ay pananatilihin
na ito sa Mga Draft, at ang Sumagot, Sumagot sa lahat at Ipasa ay muling
magbubukas ng bagong mensahe sa halip na ibalik ang luma.
"""

["2026-09-28-1852-frosted-search-bar"]
title = "Isang frosted na search bar"
text = """
Kapag naka-on ang malabong background, pinapadaan ng search bar ang blur
tulad ng bar sa paligid nito, sa halip na nakapatong dito bilang solidong
kulay-abong pill.
"""

["2026-09-28-1906-scroll-to-switch-accounts"]
title = "I-scroll ang iyong larawan para magpalit ng account"
text = """
Habang nasa ibabaw ng larawan ng account sa kanang itaas ang pointer,
paikutin ang gulong ng mouse para lumipat sa susunod o nakaraang account,
isang account bawat click. Gumugulong ang larawan papunta sa bagong account,
tulad ng paggulong ng pangalan ng app kapag lumilipat ka ng app, at ganoon
din kapag pumili ka ng account mula sa card.
"""

["2026-09-28-1918-many-recipients"]
title = "May puwang para sa maraming tatanggap"
text = """
Ang mga tatanggap pagkatapos ng unang linya ay gumagamit na ng buong lapad,
at ang mahabang listahan ay nag-i-scroll sa loob ng ilang linya, kaya laging
abot-kamay ang mismong mensahe. Lumabas sa field at ito ay magiging isang
linya na lang, tulad ng "Kay, Sam, 19 pa"; i-click ito para makita ulit
silang lahat.
"""

["2026-09-28-1952-activity-by-account"]
title = "Ulat ng aktibidad para sa isang account"
text = """
May account picker na ngayon ang ulat ng aktibidad sa tabi ng mga petsa.
Piliin ang Lahat ng account o isa sa mga ito, at susunod ang mga naka-track
na mensahe, rate, chart, subject line at Ang mailbox mo. Sinasabi ng ulat
kung aling account ang ipinapakita nito at naaalala nito ang pinili mo.
"""

["2026-09-28-2002-reader-arrows-always-shown"]
title = "Laging nasa toolbar ang Mas bago at Mas luma"
text = """
Gaano man kakitid ang reading pane, mananatili sa kanan ng toolbar nito
ang counter at ang mga arrow na Mas bago at Mas luma. Isa-isang lilipat sa
menu na Higit pa ang mga button na pinakabihira mong gamitin, kasama ang
mga switch para sa detalye ng contact at orihinal na kulay.
"""

["2026-09-28-2026-large-files-drive"]
title = "Magpadala ng file na kahit gaano kalaki"
text = """
Sa account na naka-sign in gamit ang Google, ang file na lampas sa 25 MB
na limitasyon ng mail ay mapupunta sa iyong Google Drive sa sandaling
i-attach mo ito, at dala ng mensahe ang link nito, tulad sa Gmail.
Ibinabahagi ito sa iyong mga tatanggap kapag pinindot mo ang Ipadala;
magtatanong lang ang Katna kung may hindi mabigyan ng access.
"""

["2026-09-28-2059-recipient-list-scrolling"]
title = "Mas maayos na mahahabang listahan ng tatanggap"
text = """
May sarili nang scroll bar ang mahabang listahan ng mga tatanggap at
isang linya lang ang usad nito; magpapatuloy lang ang pag-scroll ng
pag-uusap kapag naabot na ng listahan ang dulo nito. Hindi na tumatalon
ang mga button sa ibaba kapag nagdagdag ng tatanggap.
"""

["2026-09-28-2106-check-for-new-mail"]
title = "Tingnan kung may bagong mail"
text = """
I-right-click ang isang folder o account sa pane ng mga folder para sa
“Tingnan kung may bagong mail”, “Markahan lahat bilang nabasa na”,
bagong folder sa loob nito, o “Alisin ang laman ng Basurahan”. Kumukuha
na rin sa server ang “I-refresh” sa itaas ng listahan. Habang nagsusuri
ang Katna, umiikot ang mga arrow sa “I-refresh” at sa tabi ng Inbox, at
lalabas sa itaas ang “Tinitingnan kung may bagong mail…” kapag tumagal
nang higit sa sandali.
"""

["2026-09-28-2101-large-files-onedrive"]
title = "Malalaking file sa pamamagitan ng OneDrive"
text = """
Ang mga account na Outlook.com, Hotmail, at iba pang Microsoft ay
nagpapadala na ngayon ng file na lampas sa limitasyon ng mail tulad ng
mga Google account: mapupunta ang file sa iyong OneDrive sa sandaling
i-attach mo ito, at dala ng mensahe ang link nito, tulad sa Outlook.
"""

["2026-09-28-2108-activity-checking"]
title = "Wala nang kislap ng Sign in sa Aktibidad"
text = """
Pagkasimula ng Katna, magpapakita ang Aktibidad ng manipis na loading
bar habang sinusuri ang iyong Katna account, sa halip na saglit kang
hilingang mag-sign in. Sinusuri rin ng Katna ang account sa mismong
pagsisimula nito, kaya mas maikli ang paghihintay.
"""

["2026-09-28-2130-update-dialog"]
title = "May sariling window na ang mga update"
text = """
Ang Tulong > Suriin ang mga Update ay nagbubukas ng sarili nitong
window. Ipinapakita nito ang bersyon mo katabi ng bago, kung kailan
ginawa ang bawat isa at gaano kalaki ang download, ano’ng bago sa
update, at bawat pagbabago mula sa bersyon mo.
"""

["2026-09-28-2204-faster-start"]
title = "Mas mabilis na simula, mas maayos na pag-sync"
text = """
Mga isang-kapat na mas mabilis na nabubuksan ng Katna Mail ang malaking
inbox, at habang dina-download ang mail, isang beses kada batch nito
ina-update ang listahan sa halip na pagkatapos ng bawat ilang mensahe,
kaya nananatiling maayos ang pag-scroll at pag-type habang nagsi-sync.
"""

["2026-09-28-2111-link-addresses"]
title = "Alamin kung saan patungo ang isang link"
text = """
Ilagay ang pointer sa isang link sa mensahe at lalabas sa ibaba ng pane
ng pagbabasa ang address na talagang binubuksan nito, na may
naka-highlight na pangalan ng site, anuman ang sinasabi ng teksto ng
link. Ang mga larawan mula sa nagpadalang palagi mong ipinapakita ang
mga larawan ay ilo-load na ngayon lamang kapag kinumpirma ng iyong mail
provider na talagang galing sa kanya ang mensahe.
"""

["2026-09-29-0120-update-build-details"]
title = "Higit pa tungkol sa iyong build"
text = """
Ipinapakita na ngayon ng window na Mga Update ang pinakabagong pagbabago
ng bawat bersyon, kung saan galing ang iyong kopya, at kung kailan
huling tumingin ang Katna ng mga update.
"""

["2026-09-29-0213-coffee-button-play"]
title = "Munting dula sa Ilibre ako ng kape"
text = """
Ipatong ang pointer sa Ilibre ako ng kape sa Tungkol sa Katna: hihingi
ito ng kape, tsaa, pizza, tapos wala na talaga, magkakasya sa tubig at
magpapasalamat na may kaunting kislap. Minsan lang ito tumutugtog sa
bawat pagkakataon at hindi gagalaw kung binawasan mo ang galaw.
"""

["2026-09-29-0215-update-checking-bar"]
title = "Mas malinaw na Update window"
text = """
May gumagalaw na bar habang tumitingin ang Katna ng mga update, at
namumukod ang bagong bersyon sa sarili nitong kulay sa tabi ng bersyong
mayroon ka.
"""

["2026-09-29-0231-keys-beside-the-list"]
title = "Mga key na sumusunod sa pane na kinaroroonan mo"
text = """
Kapag nasa tabi ng listahan ang usapan, gumagalaw na ngayon ang Up at
Down sa listahan at ipinapakita ang bawat usapan. Papasok sa usapan ang
Tab o Enter, kung saan ini-scroll ito ng Up at Down; babalik sa listahan
ang Esc o Shift+Tab. Lumilipat ang F6 sa pagitan ng mga pane, tulad sa
ibang mail app.
"""

["2026-09-29-0258-folders-slide-open"]
title = "Dumudulas na bumubukas at sumasara ang mga folder"
text = """
Kapag kinlik ang arrow sa tabi ng account o folder sa pane ng folder,
dumudulas na ngayong bumubukas o sumasara ang laman nito, at sumasabay
ang mga folder sa ibaba, sa halip na tumalon.
"""

["2026-09-29-0301-keys-menus-dialogs"]
title = "Mga folder, menu at dialog gamit ang keyboard"
text = """
Dinadala ka ng Shift+Tab o F6 sa pane ng folder, kung saan binubuksan ng
Up at Down ang bawat folder at pumupunta ang Enter sa mail nito.
Gumagalaw ang Up at Down sa anumang menu, at pumipili ang Enter.
Binubuksan ng Shift+F10 o ng Menu key ang right-click menu ng napiling
mail. Kinukuha ng mga dialog ang mga key pagbukas nila: sumasagot ang
Enter, nagka-cancel ang Esc, at nananatili sa loob nila ang Tab. Sa
bagong mensahe, nagpapadala ang Ctrl+Enter mula sa anumang field at
isinasara ito ng Esc habang pinananatili ang draft.
"""

["2026-09-29-0309-clock-tasks"]
title = "Mga gawain sa desktop clock mo"
text = """
I-click ang orasan para magdagdag ng gawain at i-tsek ang mga natapos.
Sa Plasma, i-right-click ang orasan at piliin ang Ipakita ang mga
Alternatibo para piliin ang Katna Digital Clock. Sa GNOME, may lalabas
na card ng Mga Gawain sa ilalim ng kalendaryo ng orasan simula sa
susunod mong pag-sign in.
"""

["2026-09-29-0329-pages-by-keyboard"]
title = "Mga pahina gamit ang keyboard at mula sa taskbar"
text = """
Ang Ctrl+1 hanggang Ctrl+5 ay nagpapalipat-lipat sa Mail, Kalendaryo,
Mga Contact, Mga Gawain, at Mga Tala, tulad sa Outlook, at nakalista rin
ang mga ito sa menu na Pumunta. I-right-click ang Katna Mail sa taskbar
para direktang buksan ang Kalendaryo o Mga Contact.
"""

["2026-09-29-0412-tasks-page"]
title = "Katna Mga Gawain"
text = """
Pindutin ang Ctrl+4 o piliin ang Mga Gawain sa kaliwa: lahat ng listahan
nang magkakatabi tulad ng sa Google Tasks, may mga subtask, star, due
date, pag-uulit at mga detalye. Nagsi-sync ang mga listahan sa Google
Tasks at Microsoft To Do, at lumalabas din dito ang mga gawain mula sa
orasan ng desktop.
"""

["2026-09-29-0352-contacts"]
title = "Ang iyong mga contact, mula sa bawat account"
text = """
Ang Mga Contact sa kaliwang bar ay naglilista na ngayon ng mga taong
naka-save sa iyong mga Gmail at Outlook account at sa mga CardDAV
server, isang beses lang kahit maraming account ang may hawak sa kanila,
kasama ang mga label, larawan, at detalye nila. Lumalabas din ang mga
pangalan at larawan nila sa iyong mail at sa mga mungkahi ng address.
"""

["2026-09-29-0350-katna-notes"]
title = "Katna Mga Tala"
text = """
Ang Mga Tala sa gilid ay nagbubukas na ngayon ng Katna Mga Tala, na
hango ang ayos sa Google Keep. Magtala o gumawa ng checklist, bigyan ito
ng kulay, i-pin sa itaas, at i-tick ang mga item mismo sa board.
Awtomatikong nase-save ang mga tala habang nagta-type ka; nahahanap sila
ng search box; inaalis sila sa daan ng Archive at Trash, na may Undo.
"""

["2026-09-29-0412-notes-sync"]
title = "Mga Tala sa bawat device"
text = """
Nasa folder na ng Mga Tala ng iyong mail account ang mga tala, kung saan
din itinatago ng Notes sa iPhone at Mac ang kanila, kaya sumusunod ang
mga ito sa iba mong device at bumabalik mula roon. Ipinapakita ng
pangalan ng account sa ilalim ng tala kung saan ito nakatago; i-click
ito para ilipat ang tala, o itago ito sa computer na ito lang.
"""

["2026-09-29-0451-add-mail-to-tasks"]
title = "Magdagdag ng mail sa Mga Gawain"
text = """
Pindutin ang Shift+T, tulad sa Gmail, o piliin ang Idagdag sa Mga Gawain
kapag nag-right-click ka sa isang mail. Kinukuha ng gawain ang paksa ng
mail, at muling binubuksan ng chip nitong Mail sa Mga Gawain ang mail.
"""

["2026-09-29-0412-calendar"]
title = "Ang iyong kalendaryo, katabi ng iyong mail"
text = """
Ipinapakita ng Kalendaryo ang iyong mga kalendaryo sa Google, Microsoft
at iba pa ayon sa araw, linggo, buwan o bilang iskedyul, gamit ang mga
key ng Google Calendar. Binubuksan ng button ng kalendaryo sa kanan ng
iyong mail ang agenda ng araw, na may Sumali para sa mga tawag. Mag-sign
in muli sa isang account para mabasa ng Katna ang kalendaryo nito.
"""

["2026-09-29-0442-contacts-edit"]
title = "Gumawa at magbago ng mga contact"
text = """
Ang Gumawa ng contact sa page na Mga Contact ay nagdaragdag ng tao sa
account na pipiliin mo, at ang I-edit sa page ng isang contact ay
nagbabago rin sa kanila roon. May I-undo ang I-delete, at pansamantalang
itinatago ng Google at Outlook ang mga na-delete na contact sa kanilang
trash.
"""

["2026-09-29-0538-notes-on-mail"]
title = "Mga tala sa isang mail"
text = """
Mag-right-click sa isang mail, o buksan ang ⋮ menu nito, at piliin ang
Magdagdag ng tala: may bubukas na tala sa ibabaw ng mail na ang
pamagat ay ang subject. Lalabas ang mga tala nito sa ilalim ng subject
tuwing bubuksan mo ulit ang mail na iyon, at ibinabalik ka ng chip na
Mail ng isang tala sa mail.
"""

["2026-09-29-0542-caldav-tasks"]
title = "Mga gawain sa sarili mong mail server"
text = """
Ang mga account na nagsa-sign in gamit ang password ay itinatago na
ngayon ang kanilang mga gawain sa mail server kung nag-aalok ito ng
CalDAV, kaya lumalabas din ang mga gawain sa sariling mga app ng
server at sa telepono.
"""

["2026-09-29-0521-calendar-edit"]
title = "Magdagdag at magbago ng mga event"
text = """
Mag-click o mag-drag sa kalendaryo, o pindutin ang C, para magdagdag ng
event. I-drag ang event para ilipat ito o ang ibabang gilid nito para
baguhin ang haba, at buksan ito para baguhin ang oras, pag-ulit, mga
paalala at mga bisita o magdagdag ng Meet o Teams call. Sagutin ang mga
imbitasyon ng Oo, Hindi o Baka. Ibinabalik ng I-undo ang lahat.
"""

["2026-09-29-0546-calendar-any-account"]
title = "Mga kalendaryo mula sa mas maraming account"
text = """
Nahahanap na ng Katna ang mga kalendaryo ng Yahoo, Zoho, iCloud,
Fastmail, GMX at iba pang account, kahit nasa ibang server ang mga ito
kaysa sa mail. Sinusubukan muna nito ang pinakamahusay na paraan ng
bawat account at ang isa pa kapag hindi available ang paraang iyon.
"""

["2026-09-29-0625-tasks-today"]
title = "Ngayon sa Mga Gawain"
text = """
Ang Ngayon, sa ilalim ng Lahat ng gawain, ay nagtitipon ng mga due
ngayon at anumang lampas na sa takda mula sa lahat ng listahan, kasama
ang listahang kinaroroonan ng bawat isa. Ang gawaing idinagdag doon ay
due ngayon.
"""

["2026-09-29-0631-invitation-card"]
title = "Mga imbitasyon sa mail mo"
text = """
Lumalabas na ngayon ang imbitasyon bilang card sa itaas ng mail: kailan
at saan, sino ang nag-organisa, ang araw mo sa paligid nito na may
markang mga salungatan, Sumali, at Pupunta ka ba? Oo, Hindi o Baka, na
masasagot mismo doon.
"""

["2026-09-29-0616-note-labels"]
title = "Mga label sa mga tala"
text = """
Ang button ng label sa isang tala ay naglalagay ng mga label dito, tulad
sa Keep. Nakalista ang iyong mga label sa tabi ng Mga Tala, at bawat isa
ay nagpapakita lang ng mga tala nito, at ang I-edit ang mga label ay
nagpapalit ng pangalan o nagtatanggal sa mga ito, kasama ang I-undo.
"""

["2026-09-29-0630-tasks-more-accounts"]
title = "Mga gawain mula sa mas maraming account"
text = """
Nagsi-sync na rin ngayon ang mga gawain sa Yahoo, Zoho, iCloud, Fastmail
at iba pang account na nasa ibang server ang mga gawain kaysa sa
kanilang mail. Sinusubukan muna ng Katna ang pinakamahusay na paraan ng
bawat account at naaalala ang gumagana.
"""

["2026-09-29-0651-schedule-meeting"]
title = "Mag-iskedyul ng pulong mula sa isang mail"
text = """
I-right-click ang isang usapan, o buksan ang ⋮, at piliin ang
Mag-iskedyul ng pulong: may bagong kaganapang magbubukas sa pahina ng
Kalendaryo na ang paksa ang pamagat at ang lahat ng nasa usapan ang mga
bisita.
"""

["2026-09-29-0705-running-late"]
title = "Mahuhuli? Sabihan ang lahat sa isang click"
text = """
May Mag-mail sa mga bisita na ngayon ang kaganapang may mga bisita at,
mula isang oras bago ito magsimula, Mahuhuli ako: isang mail sa lahat,
mula sa account ng kalendaryong iyon, handa nang ipadala.
"""

["2026-09-29-0607-contact-labels"]
title = "Mga label ng contact"
text = """
Ang Label sa pahina ng isang contact ay nagmamarka at nag-aalis ng mga
label o gumagawa ng bago, at ang ⋮ sa tabi ng isang label ay nagpapalit
ng pangalan nito, nagde-delete nito o nagsusulat sa lahat ng nasa loob
nito. Nananatiling naka-sync ang mga label sa Google Contacts at
Outlook, at may I-undo ang bawat pagbabago.
"""

["2026-09-29-0640-add-to-contacts"]
title = "Idagdag sa mga contact mula sa mail"
text = """
Ang panel ng contact sa tabi ng isang usapan ay may Idagdag sa mga
contact para sa taong hindi mo pa nase-save: isang click ang magse-save
ng pangalan, address, at telepono, titulo at kumpanya mula sa lagda
nila, kasama ang I-undo. Para sa taong naka-save na, binubuksan sila ng
parehong button sa pahina ng Mga Contact.
"""

["2026-09-29-0720-focus-time"]
title = "Focus time, wala sa opisina at lokasyon ng trabaho"
text = """
Ang bagong event ay maaari nang maging Focus time, Wala sa opisina o
Lokasyon ng trabaho, tulad sa Google Calendar: piliin ito sa itaas ng
mga oras. Nakikilala ito ng Google at Outlook kung ano talaga ito, at
may sarili itong icon sa Katna.
"""

["2026-09-29-0704-task-chips"]
title = "Mga gawain sa iyong mail"
text = """
Ang mail na ginawa mong gawain ay nagpapakita na ngayon ng takdang araw
ng gawain sa listahan, na pula kapag huli na. I-click ito para buksan
ang gawain.
"""

["2026-09-29-0638-other-contacts"]
title = "Iba pang contact"
text = """
May Iba pang contact na ang Mga Contact: mga taong na-email mo mula sa
Gmail pero hindi mo pa nase-save, gaya ng pag-iingat ng Gmail sa kanila.
I-save ang sinuman sa isang click, may I-undo, o magsimula agad ng email
sa kanila.
"""

["2026-09-29-0745-answer-by-mail"]
title = "Sagutin ang mga imbitasyon mula sa anumang account"
text = """
Ang imbitasyong dumating sa account na walang kalendaryo ay may Oo,
Hindi, at Baka na rin: ipapadala ang sagot mo sa organizer sa
pamamagitan ng email, at minamarkahan ito ng kalendaryo nila.
"""

["2026-09-29-0710-meeting-notes"]
title = "Mga tala ng pulong"
text = """
Magbukas ng event sa Calendar at piliin ang Gumawa ng tala ng pulong:
magbubukas ang isang tala na may pamagat ng event, kasama ang mga dadalo
at lugar para sa mga aksyon. Nakalista sa card ng event ang mga tala
nito, at ibinabalik ka ng chip na Event ng isang tala sa araw na iyon.
"""

["2026-09-29-0751-go-to-pdf-page"]
title = "Diretso sa isang pahina ng PDF"
text = """
Ang numero ng pahina sa ilalim ng isang PDF ay isa nang kahon: i-click
ito o pindutin ang Ctrl+G, mag-type ng pahina, at pindutin ang Enter
para pumunta roon.
"""

["2026-09-29-0715-tasks-on-calendar"]
title = "Mga gawain sa kalendaryo"
text = """
Lumalabas na sa Kalendaryo ang mga gawaing may due date, sa oras nila o kasama ng mga event na buong araw. I-tick ang mga ito roon, i-click para buksan ang isa, o i-drag sa ibang araw o oras para i-block ang oras na iyon para sa gawain.
"""

["2026-09-29-0756-event-reminders"]
title = "Mga paalala para sa iyong mga event"
text = """
Ipinapaalala na ngayon ng mga event ang sarili nila sa pamamagitan ng notification, kahit sarado ang Katna. Binubuksan ng Sumali ang video call, at ipapaalala ka ulit ng I-snooze nang 5 min pagkalipas ng limang minuto.
"""

["2026-09-29-0758-contacts-merge-import"]
title = "Pagsamahin ang mga duplicate, mag-import at mag-export ng mga contact"
text = """
May Ayusin at pamahalaan na ang Mga Contact: hinahanap ng Pagsamahin at ayusin ang mga taong dalawang beses na-save (parehong pangalan o numero ng telepono) at pinagsasama sila sa isang click, may I-undo. Nagdadala ang I-import ng mga tao mula sa vCard file at hindi isinasama ang mga naka-save na, at sine-save ng I-export ang lahat, o isang label, bilang vCard file.
"""

["2026-09-29-0835-contacts-birthdays-qr-print"]
title = "Mga kaarawan sa kalendaryo, mga contact bilang QR code"
text = """
Makikita na ngayon sa Kalendaryo ang mga kaarawan ng iyong mga contact, sa kalendaryong Mga kaarawan na maaari mong alisan ng check. Maipapakita ng pahina ng contact ang contact bilang QR code na sine-save ng camera ng telepono, at maipi-print ito; ang I-print sa ilalim ng Ayusin at pamahalaan ay nagpi-print ng lahat ng nakikita. Nababasa na rin ng pag-import ang mga CSV file mula sa Google Contacts at Outlook, at nahahanap ng KRunner at ng paghahanap ng GNOME ang iyong mga naka-save na contact.
"""

["2026-09-29-0830-calendar-density-time-zones"]
title = "Densidad ng Kalendaryo at pangalawang time zone"
text = """
Itinatakda ng button na Mga opsyon sa Kalendaryo kung gaano kataas ang mga oras (Tumutugon sa iyong screen, Kumportable, o Compact) at nagdaragdag ng pangalawang time zone sa tabi ng sa iyo, para sa mga taong nakikilala mo sa ibang bansa.
"""

["2026-09-29-0809-video-calls"]
title = "Magsimula ng video call mula sa isang mail"
text = """
I-right-click ang isang usapan, o buksan ang ⋮, at piliin ang Magsimula ng video call: magbubukas ang call, kasama ang bagong mail na may link nito para sa lahat sa usapan. Ang mga Gmail account ay gumagamit ng Google Meet; ang iba ay nakakakuha ng Jitsi Meet room. Ang mga mail na may link ng call sa Meet, Teams, Zoom, Webex, Jitsi, WhatsApp o Telegram ay may Sumali button na ngayon.
"""

["2026-09-29-0815-note-line-task"]
title = "Gawing gawain ang isang linya ng checklist"
text = """
Ilagay ang cursor sa isang linya ng checklist sa isang tala at piliin ang Gawing gawain: mapupunta ang linya sa iyong mga gawain. Ang chip na Tala sa pahina ng Mga Gawain ay muling nagbubukas ng tala.
"""

["2026-09-29-0836-active-pane-stands-out"]
title = "Namumukod ang pane na kinaroroonan mo"
text = """
Sa tabi ng listahan, tanging ang pane na tumatanggap ng keyboard ang nagpapanatili ng anino nito; ang listahan, ang usapan o ang panel ng contact na hindi mo ginagamit ay umuurong na may mas mahinang gilid, at marahang sumusunod sa iyo ang pagbabago habang nagki-click ka.
"""

["2026-09-29-0840-task-reminders"]
