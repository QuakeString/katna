Gaano man karami ang file na i-attach mo, nag-i-scroll na ngayon ang listahan sa itaas ng bar ng Ipadala sa halip na matakpan ito, ipinapakita ang pinakabagong file, at sinasabi kung ilan ang file at ang kabuuang laki nila.
