Baguhin ito anumang oras sa Mga setting > Feedback ng user.
"""

["2026-09-27-0536-older-attachments-open"]
title = "Agad nabubuksan ang attachment ng lumang mail"
text = """
Kapag nag-click ka sa attachment ng lumang mail na wala pa sa computer
na ito, dina-download ito: napupuno ang attachment habang nagda-download,
saka nagbubukas.
"""

["2026-09-27-0556-reading-options"]
title = "Basahin ang mga usapan sa paraang gusto mo"
text = """
Kaya ng Mga setting > Pangkalahatan > Pagbabasa na ipakita muna ang
pinakabagong mensahe, buksan ang buong header ng bawat mensahe, at
