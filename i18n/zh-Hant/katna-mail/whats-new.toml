開啟設定 > 帳戶 > 整合收件匣，即可一併查看所有帳戶的郵件。\
資料夾窗格頂端的「所有帳戶」為全部帳戶提供同一個收件匣、未讀取、\
已加星號、重要、寄件備份、草稿等；按一下每個項目旁的箭頭，\
即可依帳戶逐行展開。每個帳戶的名稱旁現在也有箭頭，\
可將其資料夾收合起來。
"""

["2026-09-27-1627-right-click-move-and-not-spam"]
title = "右鍵選單配合各個資料夾"
text = """
在右鍵選單的「移至」下選擇資料夾或標籤，現在會實際移動郵件，並可「復原」，\
在搜尋結果中也適用。在「垃圾郵件」中，「檢舉垃圾郵件」會變成「非垃圾郵件」。\
「垃圾桶」提供「移至收件匣」和「永久刪除」，「封存」提供「移至收件匣」，\
「草稿」和「寄件備份」則不再顯示不適用的項目。
"""

["2026-09-27-1633-drag-accounts"]
title = "拖曳帳戶調整順序"
text = """
在設定 > 帳戶中，拖曳帳戶時現在會提起整列，其他帳戶會滑到一旁騰出空間。\
指向某一列時會顯示「上移」和「下移」。
"""

["2026-09-27-1637-drafts"]
title = "草稿會保留"
text = """
關閉正在撰寫的郵件時，現在會像 Gmail 一樣儲存到「草稿」，也會儲存到你的\
郵件伺服器上。從「草稿」開啟即可繼續撰寫。只有垃圾桶按鈕會捨棄它，\
「復原」可以把它找回來。
"""

["2026-09-27-1609-many-attachments"]
title = "為大量附件留出空間"
text = """
無論附加多少個檔案，附件清單現在都會在「傳送」列上方捲動，而不會蓋住它；\
清單會顯示最新的檔案，並註明共有多少個檔案及其總大小。
"""

["2026-09-27-1628-select-on-screen-first"]
title = "像 Gmail 一樣選取未讀取或已加星號的郵件"
text = """
「選取」選單中的「已讀取」「未讀取」「已加星號」和「未加星號」又會勾選\
畫面上符合的郵件。清單上方的一行文字可讓你選取資料夾中所有符合的會話群組，\
「清除選取」可復原此操作。
"""

["2026-09-27-1632-leave-settings-by-folder"]
title = "資料夾帶你離開設定"
text = """
開啟設定時，按一下資料夾或「郵件」圖示現在會關閉設定並開啟該資料夾，\
與 Gmail 一樣。「返回」箭頭也仍然可用。
"""

["2026-09-27-1641-drop-pictures-in-text"]
title = "將圖片拖入內文"
text = """
將圖片拖曳到郵件上方時，會顯示插入點，標明圖片將落在何處，\
因此可以把圖片放到句子中間。其他檔案仍會顯示附件的拖放區域，\
而且現在輸入文字後也能拖放。
"""

["2026-09-27-1707-quick-quit"]
title = "「結束」立即關閉"
text = """
系統匣圖示選單中的「結束」不再等待仍在同步或建立索引的郵件：\
Katna 及其系統匣圖示會立即關閉，其餘工作將在下次啟動 Katna 時繼續。
"""

["2026-09-27-1715-contact-panel"]
title = "郵件旁的聯絡人詳細資料"
text = """
在較寬的視窗中，開啟的會話群組旁現在會有一張卡片顯示寄件者：\
來自其簽名的電話、職稱和公司、對方當地的時間、你們往來郵件的數量、\
你們最近的會話群組，以及你們之間的檔案。按一下會話群組或檔案即可開啟，\
按一下會話群組中的其他人即可查看其資訊。這些資訊僅讀取自這台電腦上你的郵件。\
閱讀窗格工具列上的聯絡人按鈕可將其隱藏。
"""

["2026-09-27-1640-storage-used"]
title = "已用儲存空間"
text = """
當郵件伺服器提供相關資訊時，資料夾窗格底部會顯示帳戶郵件儲存空間的使用情況，\
例如「已使用 15 GB 中的 34%」。
"""

["2026-09-27-1651-desktop-search"]
title = "從 KRunner 和 GNOME 搜尋中尋找郵件"
text = """
在 KRunner（Alt+Space）或「活動」搜尋中輸入姓名，即可寫郵件給此人、複製其地址或尋找其郵件。\
主旨或寄件者包含你輸入的每個字詞的郵件都會顯示出來；以 mail: 開頭即可搜尋你的所有郵件，\
與 Katna Mail 的搜尋框相同。
"""

["2026-09-27-1727-mail-templates"]
title = "常寫郵件的範本"
text = """
郵件只要寫一次，再用撰寫視窗中新增的「範本」按鈕儲存，\
之後按一下即可將其放入任何新郵件或回覆中。寫下 {first name}、{name} 或 {my name}，\
Katna 會為每位收件者自動填入。可在設定 > 撰寫中編輯、重新命名或刪除範本。
"""

["2026-09-27-1724-server-send-later"]
title = "電腦關機時排定的郵件也能寄出"
text = """
如果你的郵件伺服器能把郵件保留到指定時間（例如 Stalwart），\
排定傳送時間現在會在復原按鈕消失後把郵件交給伺服器，\
即使這台電腦已關機，郵件也會準時寄出。\
排程選單會說明將由你的郵件伺服器還是 Katna 傳送。
"""

["2026-09-27-1730-softer-row-hover"]
title = "更輕盈的懸停效果"
text = """
郵件清單中指標所在的那一列現在會帶著淡淡的陰影浮起，就像 Gmail 一樣，\
不再在下方顯示一條深色橫條。
"""

["2026-09-27-1745-drag-recipients"]
title = "在收件者、副本和密件副本之間拖曳地址"
text = """
把地址膠囊拖曳到另一個欄位即可移動；拖曳時，即使副本和密件副本已隱藏也會展開。\
指標移到膠囊上時會顯示一個 x，按一下即可移除。
