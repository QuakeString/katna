title = "내 언어로 메일 읽기"
text = """
다른 언어로 된 메일 위에 이제 번역 버튼이 표시되고, 원문 보기를 누르면
원래대로 돌아갑니다. 언어는 내 컴퓨터에서 감지하며, 번역을 요청할 때만
메일 본문이 Katna 자체 서버로 전송되어 번역됩니다. 설정 > 기본설정 >
번역에서 내 언어와 항상 번역할 언어를 고를 수 있습니다.
"""

["2026-09-27-1744-open-and-click-tracking"]
title = "메일을 언제 열었는지 확인"
text = """
받는사람 옆의 눈 아이콘을 켜면 받는사람이 각각 언제 메일을 열거나 메일
속 링크를 클릭했는지 볼 수 있고, 대신 읽음 확인을 요청할 수도 있습니다.
보낸 메일에 누가 열었는지 표시되고, 처음 열었을 때 알림으로 알려
줍니다. 두 기능 모두 새 메일마다 꺼져 있으며, 추적하려면 Katna 계정이
필요합니다(설정 > 구독).
"""

["2026-09-27-2042-activity"]
title = "추적한 메일의 활동"
text = """
검색창 옆의 활동에서 추적한 메일 중 몇 통이 열렸는지, 링크가 얼마나
자주 클릭되었는지 볼 수 있고, 제목은 자주 열린 순서대로 표시됩니다.
"""

["2026-09-27-2204-search-trigger-words"]
title = "KRunner에서 k로 메일 검색"
text = """
KRunner나 GNOME 검색에 k 또는 m, 공백, 찾을 내용을 차례로 입력하면(예: “k budget”) Katna Mail
검색창과 같은 결과를 볼 수 있습니다. 원하는 단어는 설정의 기본설정에서 고를 수 있습니다.
"""

["2026-09-27-2224-activity-button"]
title = "검색창 옆의 활동"
text = """
검색창 옆의 활동 버튼에 추적한 메일의 새 열람과 클릭 수가 표시되고, 누가
어떤 메일을 열었는지와 어떤 링크를 클릭했는지 목록으로 볼 수 있습니다.
항목을 클릭하면 해당 메일이 열립니다. 세부정보에서는 최근 7일이나 30일,
전체 기간 또는 직접 고른 날짜의 열람률과 클릭률, 날짜별 열람 수, 가장
성과가 좋은 제목을 볼 수 있습니다. 이제 보낸 메일에 각 사람이 몇 번 열고
링크를 클릭했는지도 표시됩니다.
"""

["2026-09-27-2239-mailbox-insights"]
title = "메일함 분석"
text = """
이제 활동 > 세부정보에서 기간 중 보내고 받은 메일 수, 나와 다른 사람이
얼마나 자주, 얼마나 빨리 답장하는지, 가장 많이 주고받는 사람, 메일이
도착하는 요일과 시간대도 볼 수 있습니다. 집계는 Katna에 이미 있는 메일로
이 컴퓨터에서 이루어집니다.
"""

["2026-09-28-0059-sign-in-with-google"]
title = "Google 또는 Microsoft로 로그인"
text = """
브라우저에서 Google이나 Microsoft의 자체 페이지에 로그인해 앱 비밀번호 없이
Gmail 또는 Outlook 계정을 추가할 수 있습니다. 이제 Outlook.com과 Hotmail
주소도 사용할 수 있습니다. 로그인이 더 이상 되지 않으면 창 아래쪽의 알림에서
다시 로그인할 수 있습니다.
"""

["2026-09-28-0054-tracking-on-by-default"]
title = "처음부터 켜져 있는 추적과 확인"
text = """
이제 새 메시지와 답장은 열람 및 클릭 추적, 읽음 확인, 배달 확인이 켜진 상태로 시작합니다. 받는사람 옆의 버튼을 클릭하면 해당
메시지에서 하나씩 끌 수 있습니다. 추적을 사용하려면 Katna 계정에 로그인해 있어야 합니다. 배달 확인은 각 받는사람의 서버가
메시지를 받았을 때 메일 서버가 보내 주는 이메일이며, 메일 서버가 이를 지원하지 않으면 버튼이 회색으로 표시됩니다.
"""

["2026-09-28-0120-delivered-read-ticks"]
title = "전달과 읽음 표시"
text = """
보낸 메일에 받는사람마다 체크 표시가 나타납니다. 회색 체크 하나는 상대의
메일 서버가 메일을 받았다는 뜻으로, 배달 확인으로 알 수 있거나, 배달 확인을
보내지 않는 메일 서비스(Gmail)에서는 30분 안에 반송 메일이 돌아오지 않은
경우입니다. 강조 색상 체크 두 개는 읽음 확인이나 열람 추적으로 상대가
읽었다는 뜻이고, 경고 표시는 반송되었다는 뜻입니다. 체크 표시에 포인터를
올리면 언제 어떻게 확인했는지 볼 수 있습니다. 확인 메일은 알림 없이
받은편지함의 “업데이트”에 남습니다.
"""

["2026-09-28-0143-gmail-new-mail-notifications"]
title = "새 Gmail 메일 알림"
text = """
Gmail 받은편지함에 새 메일이 오면 다시 알림이 표시됩니다. 예전에는 Gmail이
받은편지함보다 조금 먼저 “전체보관함”에 넣은 메일을 Katna가
놓쳤습니다.
"""

["2026-09-28-0156-attachment-types"]
title = "첨부파일 형식으로 검색"
text = """
검색 옵션의 “첨부파일 있음”에서 이제 PDF, XLSX, ODF, XLS, ODS, PPT, PPTX와 함께 png나 avif
같은 다른 확장자를 위한 직접 지정을 고를 수 있습니다. 선택한 형식의 첨부파일이 있는 메일만 표시됩니다.
"""

["2026-09-28-0106-original-colors"]
title = "어두운 테마에서도 원래 색상으로"
text = """
어두운 테마에서는 자체 색상을 지정한 메일이 어두운 색상으로 표시됩니다.
읽기 창 도구 모음의 새로운 반원 버튼으로 보낸사람이 지정한 원래 색상으로
바꾸거나 다시 되돌릴 수 있습니다.
"""

["2026-09-28-0127-print-as-shown"]
title = "인쇄해도 서식이 그대로"
text = """
메일은 읽기 창에서 보이는 대로, 표와 색상, 테두리, 목록, 그림까지 그대로
인쇄됩니다. 인쇄 미리보기에서 잉크를 아끼려고 배경을 빼거나, 텍스트만으로
본문만 인쇄할 수 있습니다.
"""

["2026-09-28-0141-ask-before-deleting"]
title = "삭제하기 전에 확인"
text = """
여러 대화를 한 번에 삭제할 때 이제 휴지통으로 이동할지 먼저 확인합니다.
“다시 묻지 않기”에 체크하면 이 확인을 건너뛰고, 설정 > 기본설정에서 다시
켤 수 있습니다. 휴지통에서 영구삭제할 때는 항상 확인합니다.
"""

["2026-09-28-0019-katna-for-windows"]
title = "Windows용 Katna"
text = """
이제 Katna Mail을 Windows 10과 11에서도 사용할 수 있습니다. 전용 Katna
Setup으로 설치하며, 트레이 아이콘, 알림, 로그인할 때 시작, Katna에서 열리는
메일 링크를 모두 지원합니다.
"""

["2026-09-28-0236-chip-remove-always"]
title = "모든 주소에 삭제 버튼"
text = """
받는사람, 참조, 숨은참조의 주소 칩에 이제 항상 x가 표시되므로, 먼저 포인터를
올리지 않아도 주소를 삭제할 수 있습니다.
"""

["2026-09-28-0244-pill-format-bar"]
title = "더 둥글어진 서식 도구 모음"
text = """
편지쓰기의 서식 도구 모음(Aa)이 이제 은은한 테두리가 있는 알약 모양이라,
밝은 테마와 어두운 테마 모두에서 본문과 구분됩니다.
"""

["2026-09-28-0325-long-threads-smooth"]
title = "긴 메일 대화도 빠르게"
text = """
긴 인용이 이어지는 대화처럼 이전 답장을 많이 인용한 서식 있는 메일이 이제 창
전체를 느리게 만들지 않고 바로 열리며 부드럽게 스크롤됩니다.
"""

["2026-09-28-0830-who-has-seen-it"]
title = "누가 봤는지는 눈 아이콘으로"
text = """
추적을 켜고 보낸 메일 위에 더 이상 여러 줄짜리 상자가 표시되지 않습니다.
누군가 메일을 열면 별표 옆의 눈 아이콘이 강조 색상으로 바뀌고, 포인터를
올리면 누가 메일을 열거나 링크를 클릭했는지, 그리고 언제인지 볼 수 있습니다.
"""

["2026-09-28-0831-contact-call-copy"]
title = "연락처 세부정보에서 전화 걸기와 복사"
text = """
대화 옆의 연락처 세부정보에서 전화번호를 클릭하면 전화 앱이나 KDE Connect로
전화를 걸 수 있고, 옆의 복사 버튼으로 복사할 수도 있습니다. 이제 패널의 모든
텍스트를 선택하고 복사할 수 있습니다.
"""

["2026-09-28-0848-quoted-text-hide-remove"]
title = "답장에서 인용된 메일 숨기기 또는 삭제"
text = """
답장 아래의 "..." 버튼으로 한 번 펼친 인용된 메일을 다시 숨길 수 있습니다.
버튼에 포인터를 올리고 모서리의 x를 클릭하면 인용된 메일을 답장에서 뺄 수
있으며, 실행취소나 Ctrl+Z로 되돌릴 수 있습니다. 또한 스크롤해도 답장 도구
모음이 제자리에 머뭅니다.
"""

["2026-09-28-0854-floating-folders"]
title = "떠 있는 폴더와 더 넓어진 검색"
text = """
폴더를 숨긴 상태에서 편지쓰기나 메일에 포인터를 올려 두면 가장자리에서
떨어진 패널로 폴더가 열리고, 작은 꼭지가 버튼을 가리킵니다. 검색창은 폴더가
비운 공간만큼 넓어지고, 이미 보고 있는 폴더를 클릭해도 더 이상 목록이
깜박이지 않습니다.
"""

["2026-09-28-0928-search-address-suggestions"]
title = "검색 옵션에서 주소 추천"
text = """
이제 검색 옵션의 보낸사람과 받는사람도 편지쓰기의 받는사람, 참조,
숨은참조처럼 입력하는 동안 주소를 추천합니다. Enter, Tab 또는 클릭으로
선택하세요.
"""

["2026-09-28-0935-app-menu-reply-all-window"]
title = "계정 메뉴에 기본 메뉴, 전체답장은 별도 창에서"
text = """
계정 메뉴의 계정 관리 옆에 ☰ 버튼이 생겼습니다. 데스크톱의 전역 메뉴와 같은
파일, 편집, 보기, 이동, 메일, 설정, 도움말 메뉴가 열리므로, 전역 메뉴를
표시하지 않는 데스크톱에서도 쓸 수 있습니다. 새 메일 알림의 전체답장은 이제
대화를 별도의 창에서 열어 바로 입력할 수 있게 하고, 기본 창은 그대로 둡니다.
"""

["2026-09-28-1011-tray-brings-window-forward"]
title = "트레이와 알림을 클릭하면 Katna Mail이 앞으로"
text = """
이제 Wayland에서도 트레이 아이콘이나 그 메뉴의 받은편지함 열기, 새
메일, 설정을 클릭하면 Katna Mail 창이 최소화되어 있거나 다른 창 뒤에
있어도 맨 앞으로 옵니다. 새 메일 알림을 클릭하면 받은편지함 목록에 보이지
않는 메일이라도 그 메일이 열립니다.
"""

["2026-09-28-1053-send-countdown-reply-in-place"]
title = "보내기 카운트다운, 대화 안에 남는 답장"
text = """
보내기를 누르면 실행취소 옆에서 줄어드는 원이 취소할 수 있는 시간을 보여
주고, 메일이 전송되면 메일을 보냈습니다가 표시되며 짧은 소리가 납니다. 이
소리는 설정 > 기본설정 > 보내기에서 끌 수 있습니다. 대화에서 쓴 답장은 쓴
자리에서 그대로 메시지가 됩니다. 머리글에는 받는 사람만 표시되며, 클릭하면
보낸사람, 받는사람, 참조, 숨은참조가 나타납니다. 답장 아이콘 옆의 화살표로
답장, 전체답장, 전달을 전환할 수 있으며, 쓴 내용은 그대로 유지됩니다.
"""

["2026-09-28-1110-search-options-narrow"]
title = "좁은 창에 맞춰지는 검색 옵션"
text = """
이제 좁거나 낮은 창에서는 검색 옵션이 남은 공간에 맞게 넓어지고, 휴대폰에서는
레이블을 입력란 위에 두며, 다 들어가지 않으면 스크롤되므로 검색 버튼에 언제나
손이 닿습니다.
"""

["2026-09-28-1119-replies-from-right-account"]
title = "올바른 계정에서 보내는 답장"
text = """
통합 받은편지함이나 검색에서 연 메일에 답장하거나 전달하면 이제 프로필 사진
아래에서 고른 계정이 아니라 그 메일을 받은 계정에서 보냅니다.
"""

["2026-09-28-1436-calmer-search-box"]
title = "단축키를 보여 주는 검색"
text = """
검색창의 메일 검색 옆에 설정 > 단축키에서 정한 단축키가 표시됩니다. 클릭하면
더 어두워지고 그림자가 생기는 대신 색은 그대로 두고 옅은 테두리를 보여
줍니다. 목록 위에 떠 있는 폴더도 이제 아래쪽 가장자리에서 떨어져 있습니다.
"""

["2026-09-28-1450-clear-activity"]
title = "활동 정리하기"
text = """
활동에서 열람이나 클릭에 포인터를 올리고 ×를 누르면 목록에서 사라지고,
모두 지우기를 누르면 처음부터 새로 시작합니다. 새 열람과 클릭은 계속
표시되며, 세부정보 보고서는 여전히 모든 항목을 집계합니다.
"""

["2026-09-28-1541-round-logo"]
title = "Katna의 새 둥근 로고"
text = """
Katna에 새 로고가 생겼습니다. 청록색 원 위에 필기체 k를 넣은 모양으로, 앱 메뉴, 상단 바, 작업 표시줄에
표시됩니다. 트레이에서는 패널에 어울리는 단색으로 보이며, Katna 정보와 환영 화면에는 "katna mail"이라는
이름이 그대로 표시됩니다.
"""

["2026-09-28-1546-contact-cards"]
title = "더 깔끔해진 연락처 패널"
text = """
이제 연락처 패널의 각 부분이 부드러운 카드로 나뉘어 표시됩니다. 이름 아래 둥근 버튼으로 그 사람에게 메일을
보내거나, 그 사람과 주고받은 메일을 찾거나, 전화를 걸 수 있습니다. 최근 대화에는 가장 최근 몇 개만 표시되며, 더
보기를 누르면 나머지를 볼 수 있고 접기를 누르면 다시 접힙니다.
"""

["2026-09-28-1507-reply-box-recipients"]
title = "더 깔끔해진 답장 상자"
text = """
받는사람이 이제 사진과 함께 표시되고, 참조와 숨은참조는 작은 버튼 하나에 모였습니다. 답장의 받는사람을
펼치면 상자가 위쪽으로 부드럽게 늘어나고, 인용된 텍스트는 클릭해서 다시 접을 수 있는 물결선 아래에서
부드럽게 열리고 닫힙니다.
"""

["2026-09-28-1620-softer-window-shadow"]
title = "더 부드러운 창 그림자와 KDE 크기의 버튼"
text = """
Katna 창 테두리를 사용할 때, 창 주위의 그림자가 더 촘촘해지고 창 옆에 남아 있던 딱딱한 경계 없이
완전히 사라집니다. 창 버튼은 이제 KDE 자체 버튼과 같은 크기이며, 창 위쪽에서만큼 옆쪽에서도 같은
간격을 두고 놓입니다.
"""

["2026-09-28-1622-update-from-the-app"]
title = "앱에서 바로 Katna 업데이트하기"
text = """
이제 Katna가 새 버전을 스스로 다운로드하고 준비되면 알려 줍니다. 알림이나 Katna 정보에서 업데이트를
누르면 Katna Mail은 다시 시작한다고 알린 다음 비밀번호를 요청하고, 업데이트를 설치하고 하던 곳에서
다시 엽니다. 설정 > 기본설정 > 업데이트에서 자동 다운로드를 끌 수 있습니다.
"""

["2026-09-28-1520-track-sealed-and-plain"]
title = "서명된 메일, 암호화된 메일, 일반 텍스트 메일도 추적"
text = """
눈 아이콘이 이제 서명된 메일과 암호화된 메일에서도 작동합니다. 각 받는사람의
사본은 각각 따로 서명되거나 암호화되므로 서명은 계속 유효합니다. 일반 텍스트
메일은 열람을 표시할 수 없지만 링크는 추적되므로, 누군가 링크를 클릭하면
알 수 있습니다.
"""

["2026-09-28-1834-reply-after-closed-window"]
title = "메시지 창을 닫은 뒤에는 답장이 새로 시작됩니다"
text = """
별도 창에서 쓰던 메시지를 닫으면 이제 임시보관함에 보관되며, 답장, 전체답장, 전달은
이전 메시지를 다시 불러오지 않고 새 메시지를 엽니다.
"""

["2026-09-28-1852-frosted-search-bar"]
title = "반투명 검색창"
text = """
흐린 배경을 켜면 검색창이 단단한 회색 알약 모양으로 얹혀 있지 않고, 주변 바처럼
흐림 효과를 그대로 투과시킵니다.
"""

["2026-09-28-1906-scroll-to-switch-accounts"]
title = "사진 위에서 스크롤해 계정 전환"
text = """
오른쪽 위의 계정 사진에 포인터를 올리고 마우스 휠을 돌리면 다음 또는 이전 계정으로
이동하며, 한 칸에 계정 하나씩 넘어갑니다. 앱을 전환할 때 앱 이름이 굴러 바뀌는
것처럼 사진도 새 계정으로 굴러 바뀌고, 카드에서 계정을 고를 때도 똑같이 굴러
바뀝니다.
"""

["2026-09-28-1918-many-recipients"]
title = "많은 받는사람을 위한 공간"
text = """
첫 줄 이후의 받는사람이 이제 전체 너비를 사용하고, 긴 목록은 몇 줄 안에서
스크롤되므로 메시지 본문이 항상 손 닿는 곳에 있습니다. 필드를 벗어나면 “Kay,
Sam, 외 19명”처럼 한 줄로 접히고, 클릭하면 다시 모두 볼 수 있습니다.
"""

["2026-09-28-1952-activity-by-account"]
title = "계정별 활동 보고서"
text = """
활동 보고서에서 날짜 옆에 계정 선택기가 생겼습니다. 모든 계정 또는 계정 하나를
고르면 추적한 메일, 열람률과 클릭률, 차트, 열람률순 제목, 내 메일함이 모두 그에 따라
바뀝니다. 보고서에는 표시 중인 계정이 나타나고 선택한 내용은 기억됩니다.
"""

["2026-09-28-2002-reader-arrows-always-shown"]
title = "최신과 이전 버튼이 항상 도구 모음에 표시"
text = """
읽기 창이 아무리 좁아져도 카운터와 최신·이전 화살표는 도구 모음 오른쪽에 그대로 남습니다. 대신 가장 적게 쓰는 버튼부터 하나씩 더보기 메뉴로
들어가며, 연락처 세부정보와 원래 색상 스위치도 포함됩니다.
"""

["2026-09-28-2026-large-files-drive"]
title = "어떤 크기의 파일이든 보내기"
text = """
Google로 로그인한 계정에서는 메일 한도인 25 MB를 넘는 파일을 첨부하는 즉시 Google Drive에 올라가고, Gmail처럼 메일에는 그
링크가 포함됩니다. 보내기를 누르면 받는사람에게 공유되며, 접근 권한을 줄 수 없는 사람이 있을 때만 Katna가 물어봅니다.
"""

["2026-09-28-2059-recipient-list-scrolling"]
title = "긴 받는사람 목록이 더 부드러워졌습니다"
text = """
받는사람 목록이 길면 전용 스크롤 막대가 생기고 한 줄씩 움직이며, 목록 끝에 닿은 뒤에야 대화가 스크롤됩니다. 받는사람을 추가해도 아래 버튼이 더 이상 튀지
않습니다.
"""

["2026-09-28-2106-check-for-new-mail"]
title = "새 메일 확인"
text = """
폴더 창에서 폴더나 계정을 마우스 오른쪽 버튼으로 클릭하면 “새 메일 확인”, “모두 읽음으로 표시”, 그 안에 새 폴더 만들기, “휴지통 비우기”를 사용할
수 있습니다. 목록 위의 “새로고침”도 이제 서버에서 가져옵니다. Katna가 확인하는 동안 “새로고침”과 받은편지함 옆의 화살표가 돌고, 시간이 조금 걸리면
맨 위에 “새 메일을 확인하는 중…”이 표시됩니다.
"""

["2026-09-28-2101-large-files-onedrive"]
title = "OneDrive로 큰 파일 보내기"
text = """
Outlook.com, Hotmail 등 Microsoft 계정에서도 Google 계정처럼 메일 한도를 넘는 파일을 보낼 수 있습니다. 파일을 첨부하는
즉시 OneDrive에 올라가고, Outlook처럼 메일에는 그 링크가 포함됩니다.
"""

["2026-09-28-2108-activity-checking"]
title = "Activity에서 로그인 화면이 깜빡이지 않습니다"
text = """
Katna를 시작한 직후 Activity는 Katna 계정을 확인하는 동안 잠깐 로그인을 요청하는 대신 얇은 로딩 막대를 표시합니다. 또한 Katna가
시작되자마자 계정을 확인하므로 대기 시간이 더 짧아졌습니다.
"""

["2026-09-28-2130-update-dialog"]
title = "업데이트 전용 창"
text = """
도움말 > 업데이트 확인을 누르면 전용 창이 열립니다. 현재 버전과 새 버전을 나란히 보여 주며,
각 버전의 빌드 시각과 다운로드 크기, 이번 업데이트의 새로운 기능, 현재 버전 이후의 모든
변경 사항을 확인할 수 있습니다.
"""

["2026-09-28-2204-faster-start"]
title = "더 빨라진 시작, 더 부드러운 동기화"
text = """
Katna Mail이 큰 받은편지함을 약 4분의 1 더 빠르게 열고, 메일을 내려받는 동안 몇 통마다
목록을 갱신하는 대신 묶음마다 한 번만 갱신하므로 동기화 중에도 스크롤과 입력이 부드럽습니다.
"""

["2026-09-28-2111-link-addresses"]
title = "링크가 가리키는 곳 확인"
text = """
메일 속 링크에 포인터를 올리면 링크에 표시된 글과 상관없이 실제로 열리는 주소가 읽기 창 아래쪽에
표시되고 사이트 이름이 눈에 띄게 강조됩니다. 이미지를 항상 표시하도록 한 보낸사람의 이미지는 이제
메일 제공업체가 해당 메일이 실제로 그 보낸사람에게서 온 것임을 확인한 경우에만 불러옵니다.
"""

["2026-09-29-0120-update-build-details"]
title = "빌드에 대한 더 많은 정보"
text = """
업데이트 창에 이제 각 버전의 최근 변경 사항, 현재 사본의 출처, Katna가 마지막으로 업데이트를
확인한 시각이 표시됩니다.
"""

["2026-09-29-0213-coffee-button-play"]
title = "‘커피 한 잔 사 주기’의 작은 연극"
text = """
Katna 정보에서 ‘커피 한 잔 사 주기’에 포인터를 올려 두면 커피, 차, 피자를 차례로 조르다가 결국 아무것도 필요 없다고 하고, 물로 만족한 뒤 반짝임과 함께 고마움을
전합니다. 매번 한 번만 재생되며, 동작 줄이기를 켜면 움직이지 않습니다.
"""

["2026-09-29-0215-update-checking-bar"]
title = "한결 알아보기 쉬워진 업데이트 창"
text = """
업데이트를 확인하는 동안 진행 표시줄이 움직이고, 새 버전은 지금 쓰는 버전 옆에 별도의 색으로 눈에 띕니다.
"""

["2026-09-29-0231-keys-beside-the-list"]
title = "지금 있는 창에 맞게 움직이는 키"
text = """
목록 옆에 대화를 표시할 때 ↑와 ↓는 목록 안에서 이동하며 각 대화를 보여 줍니다. Tab 또는 Enter를 누르면 대화로 들어가고, 대화에서는 ↑와 ↓로 스크롤합니다. Esc
또는 Shift+Tab을 누르면 목록으로 돌아갑니다. F6은 다른 메일 앱처럼 창 사이를 이동합니다.
"""

["2026-09-29-0258-folders-slide-open"]
title = "폴더가 스르륵 열리고 닫힙니다"
text = """
폴더 창에서 계정이나 폴더 옆의 화살표를 누르면 내용이 툭 바뀌지 않고 스르륵 열리거나 닫히며, 아래의 폴더도 함께 미끄러지듯 움직입니다.
"""

["2026-09-29-0301-keys-menus-dialogs"]
title = "폴더, 메뉴, 대화상자를 키보드로"
text = """
Shift+Tab 또는 F6으로 폴더 창에 이동하면 ↑와 ↓로 폴더를 하나씩 열고 Enter로 해당 메일로 갑니다. 모든 메뉴에서 ↑와 ↓로 이동하고 Enter로 선택합니다.
Shift+F10 또는 메뉴 키로 선택한 메일의 마우스 오른쪽 버튼 메뉴를 엽니다. 대화상자는 열리면 키 입력을 받습니다. Enter로 확인하고 Esc로 취소하며 Tab은 대화상자
안에서만 이동합니다. 새 메시지에서는 어느 입력란에서든 Ctrl+Enter로 보내고 Esc로 닫으면 임시보관함에 저장됩니다.
"""

["2026-09-29-0309-clock-tasks"]
title = "바탕화면 시계에서 할 일 확인"
text = """
시계를 클릭해 할 일을 추가하고 완료 표시를 할 수 있습니다. Plasma에서는 시계를 마우스 오른쪽 버튼으로 클릭하고 "대체 항목 표시"를 선택해 Katna 디지털 시계를
고르세요. GNOME에서는 다음 로그인부터 시계의 달력 아래에 할 일 카드가 표시됩니다.
"""

["2026-09-29-0329-pages-by-keyboard"]
title = "키보드와 작업 표시줄로 페이지 이동"
text = """
Ctrl+1부터 Ctrl+5까지 누르면 Outlook처럼 메일, 캘린더, 연락처, 할 일, 메모 사이를 전환할 수 있으며, 이동 메뉴에도 나열됩니다. 작업 표시줄의
Katna Mail을 마우스 오른쪽 버튼으로 클릭하면 캘린더나 연락처를 바로 열 수 있습니다.
"""

["2026-09-29-0412-tasks-page"]
title = "Katna 할 일"
text = """
Ctrl+4를 누르거나 왼쪽에서 할 일을 선택하세요. Google Tasks처럼 모든 목록이 나란히 표시되며,
하위 할 일, 별표, 기한, 반복, 세부정보를 지원합니다. 목록은 Google Tasks 및 Microsoft To Do와
동기화되고, 데스크톱 시계의 할 일도 여기에 표시됩니다.
"""

["2026-09-29-0352-contacts"]
title = "모든 계정의 연락처를 한곳에"
text = """
왼쪽 레일의 연락처에 Gmail 및 Outlook 계정과 CardDAV 서버에 저장된 사람들이 표시됩니다. 여러 계정에 같은 사람이 있어도 한 번만 나오며 라벨, 사진, 세부정보도 볼 수 있습니다.
이름과 사진은 메일과 주소 추천에도 표시됩니다.
"""

["2026-09-29-0350-katna-notes"]
title = "Katna 메모"
text = """
왼쪽 레일의 메모를 누르면 Google Keep처럼 구성된 Katna 메모가 열립니다. 메모나 체크리스트를 작성하고, 색상을 지정하고, 맨 위에 고정하고, 보드에서 바로 항목을 체크할 수 있습니다. 메모는 입력하는 대로 저장되며, 검색창으로 찾을 수 있습니다. 보관처리와 휴지통으로 메모를 치워 둘 수 있고, 실행 취소도 지원합니다.
"""

["2026-09-29-0412-notes-sync"]
title = "모든 기기의 메모"
text = """
이제 메모는 메일 계정의 메모 폴더에 저장됩니다. iPhone과 Mac의 메모 앱이 사용하는 바로 그 폴더이므로, 메모가 다른 기기로 따라가고 그쪽에서 바꾼 내용도 돌아옵니다. 메모 아래에 표시되는 계정 이름이 저장 위치이며, 클릭하면 메모를 옮기거나 이 컴퓨터에만 보관할 수 있습니다.
"""

["2026-09-29-0451-add-mail-to-tasks"]
title = "메일을 할 일에 추가"
text = """
Gmail처럼 Shift+T를 누르거나 메일을 마우스 오른쪽 버튼으로 클릭해 할 일에 추가를 선택하세요. 할 일에는 메일 제목이 입력되고, 할 일의 메일 칩을 누르면 그 메일이 다시 열립니다.
"""

["2026-09-29-0412-calendar"]
title = "메일 옆에서 확인하는 내 캘린더"
text = """
캘린더에서 Google, Microsoft 등의 캘린더를 일, 주, 월 단위나 일정 목록으로 보고 Google 캘린더의 단축키를 그대로 쓸 수 있습니다. 메일 오른쪽의 캘린더 버튼을 누르면 그날의 일정이 열리며 통화에는 참여 버튼이 표시됩니다.
Katna가 캘린더를 읽을 수 있게 하려면 계정에 다시 로그인하세요.
"""

["2026-09-29-0442-contacts-edit"]
title = "연락처 만들기와 수정"
text = """
연락처 페이지의 연락처 만들기로 선택한 계정에 사람을 추가할 수 있고, 연락처 페이지의 수정으로 같은 곳에서 내용을 바꿀 수 있습니다. 삭제에는 실행취소가 있으며, Google과 Outlook은 삭제한 연락처를 한동안 휴지통에 보관합니다.
"""

["2026-09-29-0538-notes-on-mail"]
title = "메일에 메모 남기기"
text = """
메일을 마우스 오른쪽 버튼으로 클릭하거나 ⋮ 메뉴를 열어 메모 추가를 선택하면 제목을 이름으로 한 메모가 메일 위에 열립니다.
그 메일을 다시 열 때마다 메모가 제목 아래에 표시되며, 메모의 메일 칩을 누르면 메일로 돌아갑니다.
"""

["2026-09-29-0542-caldav-tasks"]
title = "내 메일 서버의 할 일"
text = """
비밀번호로 로그인하는 계정은 메일 서버가 CalDAV를 지원하면 이제 할 일을 메일 서버에 보관합니다.
그래서 서버 자체 앱과 휴대전화에도 할 일이 표시됩니다.
"""

["2026-09-29-0521-calendar-edit"]
title = "일정 추가 및 변경"
text = """
캘린더를 클릭하거나 드래그하거나 C 키를 눌러 일정을 추가하세요. 일정을 드래그하면 이동하고 아래쪽 가장자리를 드래그하면 길이가 바뀌며,
일정을 열면 시간, 반복, 알림, 게스트를 바꾸거나 Meet 또는 Teams 통화를 추가할 수 있습니다.
초대에는 예, 아니요, 미정으로 응답할 수 있습니다. 실행취소하면 모든 것이 원래대로 돌아갑니다.
"""

["2026-09-29-0546-calendar-any-account"]
title = "더 많은 계정의 캘린더"
text = """
이제 Katna가 Yahoo, Zoho, iCloud, Fastmail, GMX 등 다른 계정의 캘린더도 찾아 줍니다. 캘린더가 메일과 다른 서버에 있어도 마찬가지입니다.
각 계정에 가장 알맞은 방법을 먼저 시도하고, 그 방법을 쓸 수 없으면 다른 방법을 시도합니다.
"""

["2026-09-29-0625-tasks-today"]
title = "할 일의 ‘오늘’"
text = """
‘모든 할 일’ 아래의 ‘오늘’에는 모든 목록에서 오늘 마감이거나 기한이 지난 할 일이 각 할 일이 속한 목록과 함께 모입니다.
여기서 추가한 할 일은 오늘 마감입니다.
"""

["2026-09-29-0631-invitation-card"]
title = "메일 속 초대장"
text = """
이제 초대장이 메일 맨 위에 카드로 표시됩니다. 일시와 장소, 주최자, 그 앞뒤의 하루 일정(겹치는 일정은 표시됨), 참여,
그리고 참석하시나요? 예, 아니요 또는 미정 응답까지 그 자리에서 할 수 있습니다.
"""

["2026-09-29-0616-note-labels"]
title = "메모 라벨"
text = """
메모의 라벨 버튼으로 라벨을 지정할 수 있습니다. Keep와 같습니다. 라벨은 메모 옆에 목록으로 표시되며, 선택하면 해당 메모만 보입니다.
라벨 수정에서 이름을 바꾸거나 삭제할 수 있고, 실행 취소도 됩니다.
"""

["2026-09-29-0630-tasks-more-accounts"]
title = "더 많은 계정의 할 일"
text = """
이제 할 일도 Yahoo, Zoho, iCloud, Fastmail 등 메일과 다른 서버에 할 일이 있는 계정과 동기화됩니다.
Katna는 계정마다 가장 좋은 방법을 먼저 시도하고, 작동한 방법을 기억합니다.
"""

["2026-09-29-0651-schedule-meeting"]
title = "메일에서 바로 회의 예약"
text = """
대화를 마우스 오른쪽 버튼으로 클릭하거나 ⋮를 열고 회의 예약을 선택하면, 캘린더 페이지에서 새 일정이 열리며
제목이 일정 제목이 되고 대화 속 모든 사람이 게스트로 추가됩니다.
"""

["2026-09-29-0705-running-late"]
title = "늦나요? 한 번의 클릭으로 모두에게 알리세요"
text = """
게스트가 있는 일정에 이제 게스트에게 이메일 보내기가 있고, 시작 1시간 전부터는 늦는 중도 표시됩니다.
해당 캘린더의 계정으로 모두에게 보낼 메일이 바로 보낼 수 있는 상태로 열립니다.
