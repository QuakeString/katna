text = """
목록 옆에서는 키 입력을 받는 창만 그림자를 유지합니다. 사용하지 않는 목록, 대화 또는 연락처 패널은 더 옅은 테두리로 물러나고, 클릭하면 그 변화가 부드럽게 따라옵니다.
