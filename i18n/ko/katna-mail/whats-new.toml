연락처 페이지에서는 휴대전화 카메라로 저장할 수 있는 QR 코드로 공유하거나 인쇄할 수 있으며, 수정 및 관리의 인쇄는 표시 중인 모든 연락처를 인쇄합니다.
가져오기는 이제 Google 연락처와 Outlook의 CSV 파일도 읽고, KRunner와 GNOME 검색에서도 저장된 연락처를 찾을 수 있습니다.
"""

["2026-09-29-0830-calendar-density-time-zones"]
title = "캘린더 밀도와 보조 시간대"
text = """
캘린더의 설정 버튼으로 시간의 높이(화면에 맞게 조정, 편안하게, 간결하게)를 정하고, 해외에서 만나는 사람들을 위해 내 시간대 옆에 보조 시간대를 추가할 수 있습니다.
"""

["2026-09-29-0809-video-calls"]
