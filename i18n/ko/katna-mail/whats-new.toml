이제 더 옅어져, 직접 입력한 텍스트처럼 보이지 않습니다.
"""

["2026-10-02-1642-drag-from-empty-space"]
title = "빈 공간을 끌어 창 이동"
text = """
이제 Linux에서는 상단 바뿐 아니라 왼쪽 막대, 폴더, 메일 위의 막대에 있는 빈
공간을 끌어서도 창을 이동할 수 있습니다.
"""

["2026-10-02-1643-space-folds-folders"]
