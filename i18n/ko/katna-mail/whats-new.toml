"""

["2026-09-29-1039-contact-panel-tasks"]
title = "메일 옆에서 보는 그 사람과의 할 일"
text = """
대화 옆의 연락처 패널에 이제 그 사람과 주고받은 메일로 만든 미완료 할 일이 표시됩니다. 체크하면 완료되고, 클릭하면 할 일에서 열립니다.
"""

["2026-09-29-1046-contact-panel-meetings"]
