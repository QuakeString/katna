폴더가 펼쳐지거나 접힙니다. 클릭한 뒤에는 화살표 키로 폴더 창 안을 이동할 수
있고, Tab 키를 누르면 메일 목록으로 넘어갑니다.
"""

["2026-10-02-1646-viewer-more-menu"]
title = "좁은 창에도 맞는 뷰어 컨트롤"
text = """
좁은 창에서도 이제 첨부 파일 뷰어 아래쪽의 컨트롤이 뷰어 안에 머뭅니다. 들어가지
않는 버튼은 ⋮ 더보기 메뉴로 옮겨지며, 회전이 먼저, 그다음 맞추기, 어두운
페이지 순서입니다. 페이지 번호와 확대/축소는 가장 오래 화면에 남습니다.
"""

["2026-10-02-1743-activity-report-fits"]
title = "창에 맞는 활동 보고서"
text = """
이제 활동 보고서가 고른 여백을 두고 창 안에 머물며, 창이 낮으면 스크롤되므로
마지막 행이 잘리지 않습니다.
"""

["2026-10-02-1846-folders-and-labels"]
title = "폴더 이름 바꾸기, 삭제, 끌어 놓기"
text = """
직접 만든 폴더를 마우스 오른쪽 버튼으로 클릭해 이름을 바꾸거나 삭제할 수
있습니다. 삭제하면 그 안의 메일은 먼저 휴지통으로 옮겨집니다. 목록에서 메일을
폴더로 끌어 놓으면 그 폴더로 이동합니다. 이동에는 검색창이 있어, 입력해서
폴더를 찾거나 새 폴더를 만들어 메일을 바로 옮길 수 있습니다. Gmail에서는
라벨 지정으로 메일에 라벨을 붙이거나 뗄 수 있고, 메일을 라벨에 놓으면 그
라벨이 붙습니다.
"""

["2026-10-02-1928-mail-rules"]
title = "메일 규칙"
text = """
규칙은 새 메일을 알아서 정리합니다. 보낸사람, 제목, 단어를 기준으로 메일을
이동하고, 라벨을 붙이고, 별표를 표시하고, 전달하거나 조용히 둡니다. 설정 >
폴더 및 규칙에서 만들거나, 메일을 마우스 오른쪽 버튼으로 클릭하고 규칙
만들기…를 고르세요. 저장하기 전에 최근 메일 중 몇 개가 해당되는지 볼 수
있습니다. 이동에서 “…의 메일을 항상 여기로 이동”에 체크하면 한 번의 클릭으로
보낸사람의 메일과 앞으로 올 메일을 모두 옮깁니다.
"""

["2026-10-02-2017-rules-on-the-server"]
title = "컴퓨터가 꺼져 있어도 실행되는 규칙"
text = """
이제 메일 규칙이 Gmail에서, 또는 Sieve 규칙을 지원하는 메일 서버에서 실행되므로
휴대전화의 메일도, 이 컴퓨터가 꺼져 있는 동안의 메일도 정리됩니다. 설정 >
폴더 및 규칙에서 각 규칙이 어디서 실행되는지, 그리고 어떤 규칙이 Katna에만
남는 이유를 볼 수 있습니다.
"""

["2026-10-03-0046-smooth-folded-tabs"]
title = "부드럽게 전환되는 접힌 탭"
