클릭하거나 Ctrl+G를 누르고 페이지를 입력한 뒤 Enter를 누르면 바로 이동합니다.
"""

["2026-09-29-0715-tasks-on-calendar"]
title = "캘린더에 표시되는 할 일"
text = """
기한이 있는 할 일이 이제 캘린더에 표시됩니다. 시간이 있으면 그 시간에, 없으면 종일 일정과 함께 나타납니다.
캘린더에서 바로 완료 표시를 하거나, 클릭해서 열거나, 다른 날짜나 시간으로 끌어 그 시간을 할 일에 확보할 수 있습니다.
