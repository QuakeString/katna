text = """
대화를 마우스 오른쪽 버튼으로 클릭하거나 ⋮를 열어 화상 통화 시작을 고르면 통화가 열리고, 그 링크가 담긴 새 메일이 대화의 모든 사람에게 작성됩니다.
Gmail 계정은 Google Meet을, 다른 계정은 Jitsi Meet 회의실을 사용합니다.
Meet, Teams, Zoom, Webex, Jitsi, WhatsApp, Telegram 통화 링크가 있는 메일에는 이제 참여 버튼이 표시됩니다.
