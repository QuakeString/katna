연락처에 수정 및 관리가 생겼습니다. 병합 및 수정은 두 번 저장된 사람(이름이나 전화번호가 같은 사람)을 찾아 한 번의 클릭으로 병합하며, 실행취소도 할 수 있습니다.
가져오기는 vCard 파일에서 사람을 불러오되 이미 저장된 사람은 제외하고, 내보내기는 모든 연락처 또는 라벨 하나를 vCard 파일로 저장합니다.
"""

["2026-09-29-0835-contacts-birthdays-qr-print"]
title = "캘린더에 생일 표시, QR 코드로 연락처 공유"
text = """
