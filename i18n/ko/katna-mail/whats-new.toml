text = """
할 일을 열고 알림을 선택하면 정시, 1시간 전 또는 하루 전에 알려 줍니다. Katna를 닫아 두어도 알림이 표시되며 완료로 표시와 다시 알림 버튼을 쓸 수 있습니다. 반복되는 할 일을 완료하면 이제 다음 날짜에 다시 나타납니다.
"""

["2026-09-29-0849-tasks-in-desktop-search"]
title = "데스크톱에서 할 일 찾기"
text = """
KRunner나 GNOME 검색에 할 일의 단어 몇 개를 입력하면 할 일 아래에 표시됩니다. Enter 키를 누르면 Katna가 해당 할 일을 열어 바로 편집할 수 있습니다.
"""

["2026-09-29-0832-clock-day-menu"]
title = "바탕화면 시계에서 일정과 할 일 추가"
text = """
Katna 디지털 시계에서 달력의 날짜를 마우스 오른쪽 버튼으로 클릭하면 그날의 할 일이나 일정을 추가할 수 있습니다. 일정은 Katna 캘린더에서 열립니다. 내 일정을 클릭하면 캘린더에서 해당 날짜가 열립니다.
"""

["2026-09-29-0855-type-an-event"]
title = "일정을 한 줄로 입력"
text = """
새 일정의 제목에 "금요일 오후 1시 Anita와 점심 장소 Cafe Mocha" 또는 "평일 매일 오전 9:30 스탠드업"처럼 입력하면 캘린더가 입력하는 동안 날짜, 시간, 반복, 장소를 채워 줍니다.
"""

["2026-09-29-0915-year-view"]
title = "한눈에 보는 1년"
text = """
캘린더에 연 보기가 생겼습니다. 열두 달을 한 번에 보여 주고 일정이 있는 날 아래에 점이 표시됩니다. Y 키를 누르고 날짜를 클릭하면 그날이 열립니다.
"""

["2026-09-29-0930-share-free-times"]
title = "빈 시간 공유하기"
text = """
캘린더 설정에서 빈 시간 공유를 선택하면 앞으로 며칠간의 근무일에 비는 시간을 나열한 메시지가 만들어지며 누구에게나 바로 보낼 수 있습니다.
"""

["2026-09-29-0952-calendar-sets"]
title = "캘린더 세트"
text = """
캘린더 세트 옆의 +를 눌러 표시 중인 캘린더를 "업무"나 "가족" 같은 세트로 저장할 수 있습니다. 세트를 한 번 클릭하면 해당 캘린더만 표시되고 나머지는 숨겨집니다.
"""

["2026-09-29-0947-tasks-typed-quick-add"]
title = "할 일을 한 줄로 입력"
text = """
"내일 오후 3시 은행에 전화" 또는 "매주 월요일 오전 8시 화분에 물 주기"처럼 할 일을 추가하면 할 일에서 날짜, 시간, 반복을 알아서 설정해 주며, 입력하는 동안 인식한 내용을 보여 줍니다.
"""

["2026-09-29-1028-calendar-narrow-windows"]
