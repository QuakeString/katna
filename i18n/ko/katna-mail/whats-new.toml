설정 > 모양의 배율을 100%보다 크거나 작게 하면, 포커스된 검색창과 입력란의
강조 색상 테두리, 선택 카드와 할 일 고리의 테두리도 얇게 남지 않고 다른
요소와 함께 커지고 작아집니다.
"""

["2026-09-30-0326-google-sign-in-network"]
title = "어떤 네트워크에서도 Google로 로그인"
text = """
Google 연결을 일찍 끊는 네트워크에서도 Google로 로그인이 더 이상 “peer
closed connection”으로 멈추지 않습니다. Google 페이지에서 Gmail 체크를
해제하면 나중에 실패하는 대신 Katna가 바로 알려 줍니다.
"""

["2026-09-30-0504-google-api-turned-off"]
title = "꺼진 Google API를 알려 줍니다"
text = """
Google에서 Katna용 API가 꺼져 있으면 연락처, 캘린더, 할 일, Drive 파일이
Google의 원래 오류 대신 어떤 API인지 짧은 한 줄로 알려 주고, 해당 Google
페이지를 여는 켜기 버튼을 보여 줍니다.
"""

["2026-09-30-0507-newest-mail-first"]
title = "최신 메일부터 먼저"
text = """
계정을 추가하면 Katna Mail이 가장 최근 메일부터 다운로드한 뒤 오래된
메일로 거슬러 올라가므로, 오늘 받은 메일이 곧바로 받은편지함 맨 위에
표시됩니다. 다운로드가 중단되면 다음에 오래된 메일을 이어서 받습니다.
"""

["2026-09-30-0601-keyring-at-login"]
title = "로그인할 때 지갑을 기다립니다"
text = """
Katna가 시작될 때 KWallet이나 GNOME Keyring이 아직 잠겨 있고 잠금 해제
창이 닫혀 있어도, 계정에 비밀번호 오류가 더 이상 표시되지 않습니다.
계정은 기다렸다가 지갑을 잠금 해제하는 즉시 저절로 동기화를 시작하므로
Katna를 종료할 필요가 없습니다. 이제 동기화할 때 다시 잠금 해제를
요청합니다.
"""

["2026-09-30-0606-pdf-rotate-and-top-bar"]
title = "PDF 페이지 회전"
text = """
PDF 뷰어에서 이제 페이지를 시계 방향이나 반시계 방향으로 돌릴 수
있으며(Ctrl+R, Ctrl+Shift+R), 표시를 더한 사본도 돌린 방향 그대로
저장됩니다. 페이지 번호와 확대/축소가 상단 바로 옮겨져 페이지를 가리지
않습니다.
"""

["2026-09-30-0610-calendar-events-stay-put"]
title = "일정이 제자리에 머뭅니다"
text = """
캘린더에서 일정이나 할 일을 클릭한 뒤 보기를 바꿔도 더 이상 포인터를
따라다니지 않습니다. 이제 일정은 버튼을 누른 채 끌 때만 움직이며, 보기나
페이지를 바꾸거나 Esc를 누르거나 카드를 열면 바뀌지 않은 채 제자리로
돌아갑니다.
"""

["2026-09-30-0620-checkbox-partial-centred"]
title = "일부 선택된 체크박스가 반듯하게"
text = """
일부 메일만 선택했을 때, 전체 선택 체크박스 안의 사각형이 인터페이스 배율과
관계없이 모든 방향으로 같은 간격을 둡니다.
"""

["2026-09-30-0632-year-view-day-peek"]
title = "연 보기에서 하루 일정 엿보기"
text = """
캘린더의 연 보기에서 점이 있는 날에 포인터를 올려 두면, 그날의 일정과 할
일이 옆의 작은 팝오버에 종류를 알려 주는 아이콘과 시간과 함께 표시됩니다.
항목을 클릭하면 열리고, 날짜 이름을 클릭하면 그날이 열립니다. 휴대전화에서는
날짜를 탭하세요.
"""

["2026-09-30-0650-notification-opens-own-window"]
title = "알림에서 메일을 맨 앞에 열기"
text = """
새 메일 알림을 클릭하면 Katna가 무엇을 보여 주고 있든 그 메일이 별도의
창으로 맨 앞에 열립니다. 전체답장은 바로 입력할 수 있는 답장과 함께 메일을
엽니다. 보관처리는 아무것도 열지 않고 메일을 치우며, 실행취소가 있는 짧은
알림으로 알려 줍니다.
"""

["2026-09-30-0700-event-card-join-any-call"]
title = "캘린더에서 Teams와 Zoom 통화 참여"
text = """
이제 일정 카드가 설명이나 장소에서 통화 링크를 찾아내므로, Microsoft
Teams, Zoom, Webex, Jitsi, Google Meet 초대에 “…(으)로 참여” 버튼이 맨 위에
표시됩니다. 설명의 웹 주소는 링크가 되고, 밑줄로 된 줄은 사라졌으며,
세부정보를 스크롤하는 동안 참석하시나요?는 아래쪽에 머뭅니다.
"""

["2026-09-30-0715-click-away-closes-viewer"]
title = "바깥쪽을 클릭해 닫기"
text = """
첨부파일 주변의 어두운 공간을 클릭하면 뒤로 버튼을 찾지 않아도 뷰어가
닫힙니다. 페이지 자체를 클릭하면 예전처럼 텍스트를 선택하고 표시를 할 수
있습니다.
"""

["2026-09-30-0729-add-account-and-pop3"]
title = "새로워진 계정 추가와 POP3"
text = """
계정 추가는 이제 메일 서비스 선택부터 시작합니다: Google, Yahoo, iCloud,
Zoho, Fastmail, GMX, Yandex 또는 그 밖의 서비스. Katna는 서비스에 먼저
필요한 것을 알려 주고, 연결하는 동안 각 단계를 보여 주며, 마지막에 설정한
내용을 알려 줍니다. POP3 계정도 사용할 수 있으며, 설정 > 계정에서 메일을
서버에 얼마나 오래 남겨 둘지 정할 수 있습니다.
"""

["2026-09-30-0802-ctrl-wheel-zoom"]
title = "Ctrl과 휠로 확대/축소"
text = """
첨부파일 뷰어에서 Ctrl을 누른 채 마우스 휠을 돌리면 포인터를 중심으로
확대/축소되며, 터치패드에서는 손가락을 오므리거나 벌리면 됩니다. PDF, 사진,
텍스트 파일, 스프레드시트, 문서에서 모두 작동합니다.
"""

["2026-09-30-0817-event-open-the-mail"]
title = "일정의 바탕이 된 메일 열기"
text = """
기차, 항공편, 호텔처럼 Gmail이 메일에서 만든 일정의 카드에 메일 열기
버튼이 생겼습니다. 그 메일을 Katna에서 열고, Katna에 없으면 Gmail에서
엽니다. 메일에서 만든 할 일도 캘린더의 카드에서 그 메일을 열 수 있으며,
회의 메모 작성은 깜빡임 없이 열립니다.
"""

["2026-09-30-0843-calendar-side-panel-menus"]
title = "사이드 패널에서 캘린더 관리"
text = """
캘린더의 사이드 패널에서 캘린더를 마우스 오른쪽 버튼으로 클릭하면 그
캘린더만 표시하거나, 색을 바꾸거나, 이름을 바꾸거나, 삭제할 수 있습니다.
계정 이름을 마우스 오른쪽 버튼으로 클릭하면 그 계정에 새 캘린더를 만들거나
모든 캘린더를 표시하거나 숨길 수 있습니다. 변경 사항은 메일 서비스에
반영되므로 서비스를 쓰는 모든 곳에 나타납니다.
"""

["2026-09-30-1010-unread-list-keeps-open-mail"]
title = "읽지 않은 메일이 열린 채로"
text = """
모든 계정 > 읽지 않음에서 대화를 열어도 더 이상 바로 닫히지 않습니다.
읽으면 읽음으로 표시되고, 닫거나 다른 대화를 열 때까지 목록에 남아
있습니다.
"""

["2026-09-30-1045-tracked-mail-arrives"]
title = "추적한 메일이 다시 제대로 도착"
text = """
추적을 켜고 보낸 메일이 보낸편지함에는 표시되지만 아무에게도 도착하지 않을
수 있었습니다. 이제 모든 받는 사람에게 전송됩니다. 이렇게 사라진 메일은 다시
보내야 합니다.
"""

["2026-09-30-1114-no-checking-pill"]
title = "확인 중 표시가 사라졌습니다"
text = """
“새 메일을 확인하는 중…”이 더 이상 목록 위에 나타나지 않습니다. 새로고침 버튼과
각 계정의 받은편지함에서 도는 화살표가 이미 메일을 확인 중임을 보여 주며,
확인에 실패하면 여전히 무엇이 잘못되었는지 알려 줍니다.
"""

["2026-09-30-1300-windows-sign-in-and-domains"]
title = "Windows에서 Google로 로그인"
text = """
Windows용 Katna도 이제 Linux에서처럼 Google과 Zoho로 로그인을 제공하며,
계정을 추가할 때 Google Workspace 주소처럼 자체 도메인의 메일을 어디서
호스팅하는지 알아냅니다.
"""

["2026-09-30-1511-mail-tables"]
title = "메일 속 표가 제대로 보입니다"
text = """
GitHub Actions 알림의 작업 목록 같은 메일 속 표가 제목을 한 줄에 한 글자씩
쪼개는 대신 열을 나란히 유지하고 행마다 가지런히 맞춥니다. 메일의 각 부분을
나누는 구분선도 이제 표시됩니다.
"""

["2026-09-30-1550-taller-important-marker"]
title = "더 길어진 중요 표시"
text = """
별표 옆의 중요 표시가 2px 길어져 별표와 체크박스 옆에서 더 이상 눌려 보이지
않습니다. 줄 가운데에 그대로 놓입니다.
"""

["2026-09-30-1617-folder-click-goes-to-top"]
title = "목록 맨 위로"
text = """
메일 목록을 한 화면 이상 내리면 오른쪽 아래에 둥근 버튼이 나타나 목록 맨
위로 돌아갑니다. Gmail처럼 받은편지함 등 이미 보고 있는 폴더를 클릭하거나
Home 키를 눌러도 같습니다.
"""

["2026-09-30-1622-send-from-file-manager"]
title = "파일 관리자에서 파일 보내기"
text = """
Dolphin, GNOME Files 또는 Windows 탐색기에서 파일이나 폴더를 마우스 오른쪽
버튼으로 클릭하고 Katna Mail로 보내기를 고르세요. 파일이 첨부된 새 메일이
열리고, 폴더는 zip으로 첨부됩니다. 메일 계정이 여러 개라면 하위 메뉴에서
보낼 계정을 고르세요.
"""

["2026-09-30-1624-files-page"]
title = "모든 파일을 한곳에서"
text = """
앱 바 아래쪽의 새 파일 페이지에서 모든 계정의 모든 첨부파일을 최신순으로
볼 수 있습니다. 사진, PDF, 문서만 보거나, 계정 하나, 사람, 기간으로
좁히거나, 이름, 보낸사람, 제목으로 검색하세요. 파일을 마우스 오른쪽 버튼으로
클릭하면 더 많은 기능이 있고, 메일 보기를 누르면 그 파일이 함께 온 메일로
이동합니다.
"""

["2026-09-30-1643-dimmer-row-markers"]
title = "더 차분해진 메일 목록"
text = """
메일 목록에서 비어 있는 체크박스, 별표, 중요 표시는 포인터가 그 줄 위에
올 때까지 더 흐리게 보입니다. 설정된 별표와 표시는 색을 유지합니다.
"""

["2026-09-30-1704-folder-arrows-on-hover"]
title = "더 깔끔해진 폴더 창"
text = """
받은편지함, 별표편지함 등 폴더 옆의 작은 화살표는 포인터가 그 폴더 위에
있을 때만 나타납니다. 펼친 폴더는 화살표를 계속 보여 줍니다.
"""

["2026-09-30-1712-arrow-keys-in-times"]
title = "시간 입력란에서 화살표 키"
text = """
날짜 및 시간 선택과 할 일의 시간에서 위쪽, 아래쪽 화살표 키로 커서가 있는
부분, 즉 시, 분 또는 오전/오후를 바꿀 수 있습니다.
"""

["2026-09-30-1742-check-one-folder"]
title = "폴더 하나만 새 메일 확인"
text = """
폴더의 오른쪽 클릭 메뉴에 있는 “새 메일 확인”이 이제 그 폴더만 확인하므로
빠릅니다. 모든 계정 아래 계정의 받은편지함에서는 그 계정의 받은편지함을,
모든 계정 아래 받은편지함이나 보낸편지함 같은 목록에서는 각 계정의 그
폴더를 확인합니다.
"""

["2026-09-30-1742-frosted-viewer"]
title = "더 가볍고 반투명한 뷰어"
text = """
첨부파일 뷰어의 상단 바가 더 얇고 밝아졌으며, 페이지, 확대/축소, 회전은
알약 모양 버튼 위에 모였습니다. 파일 주변에는 Katna Mail이 부드럽고 어두운
막 아래 흐리게 보이고, 도구 모음도 반투명 유리처럼 바뀝니다. 흐림 효과는
설정 > 실험실을 따르며, 끄면 뷰어는 평범한 어두운 막을 사용합니다.
"""

["2026-09-30-1752-touchpad-glide"]
title = "터치패드로 튕기면 미끄러지듯 스크롤"
text = """
터치패드에서 두 손가락으로 빠르게 튕기면 다른 앱처럼 스크롤이 이어지다가
천천히 멈춥니다. 터치패드를 다시 건드리면 멈춥니다. Wayland에서 작동합니다.
"""

["2026-09-30-1800-inbox-tabs-in-top-row"]
title = "맨 윗줄에 놓인 받은편지함 탭"
text = """
기본, 프로모션, 소셜 등 받은편지함 탭이 이제 목록 맨 윗줄의 알약 모양 바에
놓이고, 탭마다 읽지 않은 메일 수가 색으로 표시됩니다. 고른 탭으로 강조
표시가 미끄러져 이동하고, 열린 탭을 다시 클릭하면 목록 맨 위로 돌아갑니다.
목록이 좁으면 바가 별도의 줄을 차지하고 아이콘으로 바뀌되 열린 탭의 이름은
유지하며, 휴대전화에서는 목록의 바에 놓이고 새로고침은 더보기 메뉴로
들어갑니다.
"""

["2026-09-30-1805-account-menu"]
title = "오른쪽 클릭 메뉴에서 계정 정보"
text = """
폴더 목록의 계정 이름이나 모든 계정 아래 그 계정의 받은편지함을 마우스
오른쪽 버튼으로 클릭하면 주소, 동기화 상태와 마지막 확인 시간, 사용 중인
저장 공간을 볼 수 있습니다. 여기서 그 받은편지함을 확인하거나, 그 계정으로
새 메일을 쓰거나, 계정 설정을 열거나, 로그인이 만료되었을 때 다시 로그인할
수 있습니다.
"""

["2026-09-30-1819-glass-search-box"]
title = "유리 같은 검색창"
text = """
창 배경 흐리게를 켜면 검색창은 쓰지 않는 동안 옅은 테두리의 반투명 유리처럼
보이고, 클릭해 입력하면 불투명하게 바뀝니다.
"""

["2026-09-30-1820-search-cancel-restores"]
title = "검색을 취소하면 메일이 그대로"
text = """
Esc를 누르거나 검색창을 비우면 이제 보던 곳으로 돌아갑니다. 같은 폴더, 목록의
같은 위치, 열어 두었던 메일 그대로입니다. 대신 검색 결과를 열면 예전처럼
검색 화면이 이어집니다.
"""

["2026-09-30-1840-first-run-window"]
title = "더 친근한 첫 시작"
text = """
Katna Mail을 설정하는 동안 설정 페이지 뒤로 창이 옅은 막 아래 비쳐 보입니다.
앱, 편지쓰기, 검색창이 보이고, 폴더와 메일이 나타날 자리에는 부드러운
자리 표시가 있습니다. 새 단계에서 Katna 계정을 제안하고 그것으로 켜지는
기능(읽음 확인, 링크 추적, 활동, 번역)을 보여 주며, 건너뛸 수도 있습니다.
"""

["2026-09-30-1850-windows-frame-and-blur"]
title = "Windows에서 Katna 창 테두리와 흐린 배경"
text = """
Windows에서 Katna Mail이 이제 화면 안쪽에서 열리고, 화면이 작으면 최대화된
채로 열립니다. 설정 > 실험실에서 창 뒤를 흐리게 할 수 있으며, Katna 자체
창 테두리를 켜면 다음에 Katna Mail을 열 때 상단 바가 제목 표시줄이 됩니다.
"""

["2026-09-30-1851-dark-depth"]
title = "어두운 색에서 더 잘 보이게"
text = """
어두운 배경에서는 그림자가 거의 보이지 않으므로, 어두운 색에서 메일 목록
위에 뜨는 요소가 이제 한 단계 밝고 옅은 밝은 테두리를 가집니다. 맨 위로
버튼, 메뉴, 편지쓰기 창, 대화상자가 또렷하게 드러납니다. 밝은 색은 예전과
같습니다.
"""

["2026-09-30-1911-files-scrollbar"]
title = "파일 페이지의 스크롤 막대"
text = """
파일이 한 화면을 넘으면 스크롤하는 동안이나 포인터가 파일 위에 있을 때
오른쪽에 얇은 스크롤 막대가 나타났다가 사라집니다. 막대를 끌어 파일 사이를
빠르게 이동하거나, 막대 위나 아래를 클릭해 그곳으로 건너뛰세요.
"""

["2026-09-30-1919-tabs-keep-open-mail"]
title = "탭을 바꿔도 열린 메일은 그대로"
text = """
읽기 창이 목록 옆에 있을 때 다른 받은편지함 탭을 골라도 읽던 메일이 더 이상
닫히지 않습니다. 목록만 바뀌고 메일은 열린 채로 있습니다.
"""

["2026-09-30-1925-inbox-tabs-centred"]
title = "가운데에 놓인 받은편지함 탭"
text = """
받은편지함 탭이 이제 목록 맨 윗줄 가운데에 놓이고, 버튼에 필요한 만큼만
옆으로 비켜납니다.
"""

["2026-09-30-1945-page-box-arrow-keys"]
title = "페이지 입력란에서 화살표 키"
text = """
PDF에서 페이지 번호를 클릭하고 위쪽이나 아래쪽 화살표 키를 누르면 이전
페이지나 다음 페이지로 이동합니다. 키를 누르고 있으면 페이지를 빠르게
넘깁니다.
"""

["2026-09-30-1952-phone-bar-labels"]
title = "휴대전화의 앱 이름도 설정을 따릅니다"
text = """
설정에서 앱 이름을 끄면, 휴대전화 크기 창의 아래쪽 바도 이제 사이드 레일처럼
아이콘만 가운데 정렬해 보여 줍니다.
"""

["2026-09-30-1955-account-menu-icons"]
title = "계정 메뉴에서 설정과 언어"
text = """
계정 사진 아래의 메뉴가 이제 아이콘 한 줄로 시작합니다. 설정을 열거나 언어를
바꿀 수 있습니다. 자리를 만들기 위해 언어 국기는 상단 바에서 빠졌습니다.
"""

["2026-09-30-2001-phone-tabs-fold"]
title = "모든 받은편지함 탭을 언제나 손쉽게"
text = """
창이 좁아지면 받은편지함 탭이 숨는 대신 부드럽게 접힙니다. 이름이 더 큰
아이콘으로 바뀌고, 이어서 개수가 비켜납니다. 휴대전화에서는 탭이 바 전체에
펼쳐져 탭하기 쉽고, 같은 알약 모양 바 끝에 더보기가 있습니다.
"""

["2026-09-30-2012-fit-and-page-arrows"]
title = "뷰어의 맞춤, 페이지 화살표 등"
text = """
첨부파일 뷰어에 맞춤 버튼이 생겼습니다. PDF 페이지는 창 높이에, 사진은 창에,
문서, 슬라이드, 스프레드시트는 창 너비에 맞춥니다. 사진은 실제 크기로 보고
돌릴 수도 있습니다. 페이지 입력란을 가리키면 이전·다음 페이지로 가는 작은
화살표가 나타나고, 슬라이드에도 전용 입력란이 생겼습니다.
"""

["2026-09-30-2019-folder-icon-colours"]
title = "알록달록한 폴더 아이콘"
text = """
폴더 창의 아이콘이 이제 각 폴더의 내용을 알려 주는 색을 띱니다. 읽지 않음은
파란색, 별표편지함은 노란색, 중요는 호박색, 보낸편지함은 초록색, 스팸함은
빨간색, 임시보관함은 보라색이며, 받은편지함은 데스크톱의 강조 색상을
따릅니다. 메일 수는 작고 옅은 알약 모양 안에 표시됩니다.
"""

["2026-09-30-2040-tabs-no-slide"]
title = "더 빨라진 받은편지함 탭"
text = """
받은편지함 탭을 클릭하면 이제 강조 표시가 다른 탭을 가로질러 미끄러지는
대신, 클릭의 물결 효과만 남기고 곧바로 강조됩니다.
"""

["2026-10-01-0145-files-tidy"]
title = "더 깔끔해진 파일 페이지"
text = """
파일 종류와 계정 옆의 개수가 이제 메일의 폴더 개수와 같은 작은 알약 모양
안에 표시됩니다. 페이지 제목 아래의 선과 파일 줄도 같은 가장자리에서
시작하고 끝납니다.
"""

["2026-10-01-0147-today-marker-fits"]
title = "오늘 날짜가 표시 안에 쏙"
text = """
캘린더의 월 보기에서 오늘 표시가 이제 날짜 전체를 담습니다. 1일에는 글자가
삐져나오던 작은 원 대신 “10월 1일”을 감싸는 알약 모양이 됩니다.
"""

["2026-10-01-0208-tab-counts-stay"]
title = "탭의 개수가 그대로"
text = """
받은편지함 탭을 열어도 더 이상 탭 바가 들썩이지 않습니다. 열린 탭은 새 메일
수를 그대로 보여 주다가 천천히 차분한 회색으로 바래고, 그 탭의 메일을 모두
읽으면 개수가 부드럽게 접혀 사라집니다.
"""

["2026-10-01-0225-files-keyboard"]
title = "키보드로 파일 사이 이동"
text = """
파일 페이지에서 이제 화살표 키로 파일 사이를 이동하고, Home과 End로 처음과
마지막 파일로 가며, Enter로 파일을 엽니다. 여기서 연 뷰어에서는 화살표 키가
어느 메일에 딸린 파일이든 페이지의 다음 파일로 넘어가고, Shift와 화살표
키를 누르면 같은 메일의 첨부파일 안에서만 이동합니다.
"""

["2026-10-01-0254-files-dates"]
title = "파일 페이지에서 날짜 고르기"
text = """
파일 페이지의 기간 칩이 이제 두 달짜리 캘린더와 지난주, 이번 달 같은 빠른
선택을 엽니다. 하루를 클릭하거나 한 날짜에서 다른 날짜로 끌면, 끄는 동안
파일 목록이 따라 바뀝니다. 그런 다음 칩 위에서 마우스 휠을 돌리면 같은 길이만큼
기간을 앞이나 뒤로 옮길 수 있습니다.
"""

["2026-10-01-0256-color-schemes"]
title = "색 구성표와 강조 색상"
text = """
설정 > 모양에서 이제 모드, 색상, 강조 색상을 따로 고릅니다. 밝게나 어둡게를
고른 다음 Clear, Nord, Solarized, Catppuccin 등 14가지 색 구성표 중 하나를
고르거나 데스크톱의 구성표를 그대로 쓰세요. 각 구성표는 밝게와 어둡게에서
모두 쓸 수 있고, 어떤 강조 색상이든 얹을 수 있습니다.
"""

["2026-10-01-0310-badge-counts-what-notifies"]
title = "작업 표시줄의 개수가 알림과 일치"
text = """
작업 표시줄과 트레이의 읽지 않은 메일 수가 이제 알림을 보내는 메일, 즉
받은편지함의 기본 탭만 셉니다. 프로모션, 소셜, 업데이트, 포럼은 더 이상
개수에 더해지지 않습니다.
"""

["2026-10-01-0312-quiet-selected-row"]
title = "더 차분해진 열린 폴더 표시"
text = """
메일의 열린 폴더와 연락처, 할 일, 메모, 파일의 열린 보기가 이제 강조 색상
대신 옅은 회색으로 표시되므로, 편지쓰기와 앱 레일이 돋보이고 폴더 아이콘은
고유한 색을 유지합니다.
"""

["2026-10-01-0315-desktop-schemes"]
title = "데스크톱의 색 구성표"
text = """
설정 > 모양 > 색상에는 데스크톱 자체의 구성표도 나옵니다. KDE Plasma에 설치된
모든 색 구성표와 Windows의 색 및 대비 테마입니다. 이제 KDE에서도 시스템이
구성표의 밝은 짝이나 어두운 짝을 써서 밝게와 어둡게 모두에서 작동하며,
Katna는 Windows의 강조 색상을 따릅니다.
"""

["2026-10-01-0329-mute-folders"]
title = "폴더, 탭, 계정 알림 끄기"
text = """
목록 위의 종 버튼으로 열린 폴더나 받은편지함 탭의 알림을 1시간 동안, 내일
아침까지 또는 다시 켤 때까지 끌 수 있습니다. 폴더나 계정을 마우스 오른쪽
버튼으로 클릭해도 됩니다. 설정 > 알림에서 어떤 폴더가 알림을 보내고 작업
표시줄 개수에 포함되는지, 그리고 알림을 끈 모든 항목을 볼 수 있습니다.
"""

["2026-10-01-0335-tray-style"]
title = "컬러 또는 단색 트레이 아이콘"
text = """
설정 > 기본설정 > 데스크톱 > 트레이 아이콘 컬러로 표시에서 Katna의 색을 쓸지,
패널의 다른 아이콘처럼 한 가지 색을 쓸지 고릅니다. 단색은 읽지 않은 메일이
있어도 단색을 유지하고, 읽지 않은 메일 수는 항상 빨간색입니다. Linux에서는
트레이 아이콘이 기본적으로 단색이고, Windows에서는 컬러입니다.
"""

["2026-10-01-0354-mute-conversations"]
title = "대화나 보낸사람 알림 끄기"
text = """
열린 대화 위의 종 버튼으로 그 대화의 알림을 끕니다. 새 답장이 와도 알림이
오지 않고 작업 표시줄 개수에도 더해지지 않으며, 목록에는 줄이 그어진 종이
표시됩니다. 대화를 마우스 오른쪽 버튼으로 클릭해 대화 알림 끄기나 보낸사람
알림 끄기를 고르거나 M을 누르세요.
"""

["2026-10-01-0410-your-color-schemes"]
title = "나만의 색 구성표 만들기"
text = """
설정 > 모양 > 색상 > 맞춤설정은 사용 중인 구성표를 편집기로 복사합니다.
밝은 쪽과 어두운 쪽의 여덟 가지 색을 각각 바꾸고, 그 색으로 메일 창을 미리
보며, 읽기 어려운 부분이 있으면 Katna가 알려 줍니다. 가져오기로 Katna나
KDE 색 구성표 파일을 불러올 수 있고, 내 구성표를 마우스 오른쪽 버튼으로
클릭하면 편집, 복제, 내보내기, 삭제를 할 수 있습니다.
"""

["2026-10-01-0527-calendar-opens-on-week"]
title = "캘린더가 주 보기로 열립니다"
text = """
Katna Calendar가 다시 주 보기로 열려 앞으로의 날들을 시간 단위로 보여
줍니다. 월, 일, 연 등 다른 보기는 상단 바에서 클릭 한 번이면 됩니다.
"""

["2026-10-01-0552-lighter-count-on-open-row"]
title = "열린 폴더의 개수가 또렷하게"
text = """
메일의 열린 폴더 옆, 파일의 열린 종류 옆에 있는 개수가 이제 그 줄의 회색보다
밝은 알약 모양 안에 놓여, 밝게와 어둡게 모두에서 줄에 묻히지 않습니다.
"""

["2026-10-01-0652-files-leave-out-small-pictures"]
title = "파일 페이지에서 서명 로고 제외"
text = """
파일 페이지가 더 이상 이메일 서명에 딸린 작은 로고와 아이콘으로 가득 차지
않습니다. 12KB 미만이거나 너비나 높이가 100픽셀 미만인 사진은 메일 아래에만
남습니다. 두 기준을 바꾸거나 모든 사진을 표시하려면 설정 > 기본 앱 > 파일
페이지로 가세요.
"""

["2026-10-01-0700-mute-from-contact"]
title = "연락처 카드에서 보낸사람 알림 끄기"
text = """
메일 옆 연락처 카드의 버튼 맨 앞에 종 버튼이 생겼습니다. 그 보낸사람의 모든
메일 알림을 끄며, 이름 뒤에 줄이 그어진 종이 표시됩니다. 다시 클릭하면
알림을 다시 받습니다.
"""

["2026-10-01-0803-select-hover-fits"]
title = "더 깔끔해진 선택 버튼"
text = """
메일 목록 맨 위 선택 체크박스 뒤의 마우스오버 배경이 이제 옆 버튼들과 높이가
같고, 카드 위쪽과 같은 거리만큼 카드 가장자리에서 떨어져 있으며, 모서리는
카드의 모서리를 따릅니다.
"""

["2026-10-01-0807-files-leave-out-signature-pictures"]
title = "파일 페이지에서 큰 서명 사진도 제외"
text = """
누군가 서명의 배너나 사진처럼 세 개 이상의 대화에서 보낸 사진과 소셜 네트워크
아이콘은 크기와 관계없이 더 이상 파일 페이지에 표시되지 않습니다. 메일
아래에는 여전히 표시되며, “작은 사진 제외”를 끄면 모두 다시 나타납니다.
"""

["2026-10-01-0830-muted-contact-mark"]
title = "알림을 끈 사람 한눈에 보기"
text = """
알림을 끈 보낸사람의 이름 뒤에는 이제 어디서든 줄이 그어진 종이 붙습니다.
메일 목록, 열린 메일, 연락처, 받는사람과 참조 입력란과 그 추천 목록, 파일
페이지, 일정 참석자, 활동 보고서에 표시됩니다. 왜 그 사람의 메일이 조용한지
