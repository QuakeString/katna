메일 목록에서 줄의 체크박스, 별표, 중요 표시가 포인터를 올리기 전까지 옅게
표시됩니다. 이미 설정된 별표와 표시는 이전과 같이 보입니다.
"""

["2026-10-06-1448-activity-beside-calendar"]
title = "다른 버튼과 함께 놓인 활동"
text = """
넓은 창에서 활동 버튼이 이제 캘린더, 설정과 함께 오른쪽에 놓입니다. 모든
계정을 열면 계정 사진들이 포인터를 올릴 때 옆의 버튼을 움직이지 않고
펼쳐집니다.
"""

["2026-10-06-1524-search-fills-bar"]
title = "더 길어진 검색창"
text = """
넓은 창에서 검색창이 이제 중간에서 멈추지 않고 오른쪽 버튼까지 이어집니다. 검색
옵션은 검색창 아래 가운데에 열리며 보기 편한 너비를 유지합니다.
"""

["2026-10-07-0110-follow-up-for-you"]
title = "알아서 보내지는 후속 메일"
text = """
보내기 옆 메뉴의 답장이 없으면 후속 조치가 이제 아무도 답하지 않을 때 짧은 후속
메일을 대신 보낼 수 있습니다. 한 번 써 두고, 언제 보낼지 고르고, 한 번 더
시도할지 정하세요. 후속 메일은 평일 근무 시간에 보내지고, 누군가 답장하면
바로 멈추며(자동 응답은 제외), 컴퓨터가 꺼져 있었다면 늦게 보내지 않고 확인을
기다립니다. 보내기 옆의 칩에 설정 내용이 표시됩니다. 알림 받기만 설정할 수도
있으며, 이제 원하는 날짜를 아무 때나 고를 수 있습니다.
"""

["2026-10-07-0117-drawer-logo"]
title = "서랍의 Katna 로고"
text = """
휴대전화에서 폴더가 있는 서랍에 이제 평범한 봉투 대신 강조 색상의 Katna 로고가
이름 옆에 표시됩니다. 상단 바에 이미 표시되는 태블릿에서는 서랍이 폴더로
시작합니다.
"""

["2026-10-07-0118-clock-popup"]
title = "더 깔끔해진 데스크톱 시계"
text = """
Katna Digital Clock에서 시간대가 이제 맨 위의 날짜 옆에 놓이고, 할 일 목록은
제목을 클릭하면 접힙니다. 일정을 추가하면 앱 전체 대신 작은 새 일정 창이
열립니다. 동기화가 잠시 끊긴 뒤 새 할 일이 두 번 표시되는 문제도
해결되었습니다.
"""

["2026-10-07-0232-mcp-server"]
title = "AI 어시스턴트가 메일을 사용하도록 허용"
text = """
설정 > MCP 서버에서 Claude Desktop, Claude Code, LM Studio처럼 이 컴퓨터에 있는
AI 어시스턴트가 메일을 검색하고 읽고, 확인할 수 있도록 임시보관 메일을 저장하게
할 수 있습니다. 직접 켜기 전까지는 꺼져 있습니다. 어시스턴트가 볼 계정을 고르고,
어시스턴트에 붙여넣을 내용을 복사하고, 최근에 한 일을 확인하세요.
어시스턴트는 메일을 보내거나 삭제하거나 옮기지 않습니다.
"""

["2026-10-07-0359-waiting-for-reply"]
title = "답장을 기다리는 메일 보기"
text = """
후속 메일이나 리마인더를 설정해 보낸 메일은 보낸편지함 아래의 대기 중에
표시됩니다. 대기 중과 받은편지함의 줄에 다음에 무슨 일이 언제 일어나는지 알려
주는 칩이 있습니다. 메일을 열면 후속 메일을 다른 시간으로 옮기거나, 지금
보내거나, 멈출 수 있습니다.
"""

["2026-10-07-0505-follow-ups-in-chats"]
title = "채팅 보기의 후속 메일"
text = """
채팅 보기에서 보낼 예정인 후속 메일은 채팅 끝에 옅은 말풍선으로 표시되며, 수정,
지금 보내기, 중지를 할 수 있습니다. 설정하려면 보내기를 마우스 오른쪽 버튼으로
클릭하거나 길게 누르고 답장이 없으면 후속 조치를 고르세요.
"""

["2026-10-07-0603-remind-me"]
title = "어떤 메일이든 리마인더 받기"
text = """
메일에서 H를 누르거나 다시 알림 옆의 알림 받기를 사용하면, 메일은 그 자리에 둔
채 원하는 시간에 알림을 받을 수 있습니다. 메일에 어떤 날까지 해야 할 일이 적혀
있으면 Katna가 그 전날 아침을 제안합니다. 리마인더는 할 일에 할 일로 저장되어 알림
아래에 표시되며, 메일의 줄에도 나타납니다. B는 다시 알림입니다.
"""

["2026-10-07-0718-snooze-extras"]
title = "누군가 답장하면 알아채는 다시 알림"
text = """
다시 알림을 설정한 대화는 누군가 거기에 답장하면 바로 돌아옵니다. 날짜 및 시간
선택에서 “tue 3pm”이나 “in 2 hours”처럼 입력할 수 있습니다. 새 메일 알림에서
한 시간 동안이나 내일까지 다시 알림을 설정할 수도 있습니다.
"""

["2026-10-07-0802-your-snooze-times"]
title = "내 방식대로 다시 알림"
text = """
설정 > 받은편지함에서 오늘 늦게, 내일, 이번 주말, 다음 주가 언제인지 정하고,
원하는 시간을 직접 추가할 수 있습니다. 다시 알림 항목은 메일이 돌아오는 시간별로
메일을 보여 줍니다. 휴대전화에서는 줄을 왼쪽으로 밀면 다시 알림이 설정됩니다.
"""

["2026-10-07-0913-pick-date-in-place"]
title = "클릭한 곳에서 날짜 선택"
text = """
날짜 및 시간 선택이 이제 창 가운데의 상자 대신 다시 알림 및 알림 받기 메뉴 안으로
밀려 들어옵니다. 뒤로 화살표를 누르면 시간 목록으로 돌아갑니다.
"""

["2026-10-07-0953-nudges"]
title = "아무도 답하지 않은 질문이 다시 나타남"
text = """
무언가를 물었지만 사흘 동안 답이 없는 보낸 메일은 “3일 전에 보냄. 후속
조치할까요?”와 함께 받은편지함 맨 위로 돌아옵니다. 클릭하면 후속 메일을 보낼 수
있고, x를 누르면 치울 수 있습니다. 설정 > 받은편지함에서 끌 수 있습니다.
"""

["2026-10-08-0128-settings-menu-tint"]
title = "설정에 전용 메뉴가 생김"
text = """
설정 왼쪽의 페이지 목록에 위에서 아래로 은은한 색조가 들어가, 읽고 있는
페이지와 구분됩니다.
"""

["2026-10-08-0136-schedule-pick-in-place"]
title = "예약 전송에서 그 자리에서 날짜 선택"
text = """
예약 전송과 답장이 없으면 후속 조치의 날짜 및 시간 선택이 이제 메일 위에 뜨는
상자 대신, 다시 알림처럼 연 메뉴 안으로 밀려 들어옵니다. 뒤로 화살표나 Esc를
누르면 시간 목록으로 돌아갑니다.
"""

["2026-10-08-0141-tray-icon-follows-colors-after-login"]
title = "로그인 직후부터 패널에 맞는 트레이 아이콘"
text = """
KDE Plasma에서 단색 트레이 아이콘이 이제 로그인 직후부터 패널 색을 따르고,
밝은 테마와 어두운 테마를 바꿀 때마다 Katna를 다시 시작하지 않아도 함께
바뀝니다.
"""

["2026-10-08-0153-search-attachment-types"]
title = "도면과 사진 검색"
text = """
검색 옵션에 새 첨부 파일 형식 두 가지가 추가되었습니다. AutoCAD 도면(및 DXF)을
위한 DWG와 사진 및 그림을 위한 이미지입니다. 이제 XLSX로 예전 XLS 파일도,
PPTX로 PPT 파일도 찾을 수 있어 형식마다 버튼이 하나씩입니다.
"""

["2026-10-08-0157-menus-one-of-each-pair"]
title = "해당하는 항목만 보여 주는 메뉴"
text = """
더보기 메뉴에 짝을 이루는 두 항목이 함께 나오지 않습니다. 읽은 메일에는 읽지
않음으로 표시, 별표가 있는 메일에는 별표 삭제, 중요한 메일에는 중요하지
않음으로 표시, 고정된 메일에는 고정 해제가 나옵니다. 상태가 서로 다른 메일을
여러 개 선택하면 모두 같은 상태로 맞추는 항목이 나오며, 오른쪽 클릭 메뉴에서도
마찬가지입니다.
"""

["2026-10-08-0210-settings-card-edge"]
title = "카드 위에 놓인 설정"
text = """
밝은 테마에서 설정 페이지에 이제 메일 목록과 같은 얇은 테두리와 부드러운
그림자가 생겨, 뒤의 창과 구분됩니다.
"""

["2026-10-08-0212-steady-app-buttons"]
title = "더 부드러워진 앱 버튼"
text = """
왼쪽 앱 레일이나 휴대전화의 아래쪽 바에서 앱을 클릭해도 더 이상 흔들리지
않습니다. 누를 때의 물결이 끝까지 퍼지고, 버튼 크기는 그대로인 채 선택 표시
알약이 가운데에서부터 커집니다.
"""

["2026-10-08-0232-account-card-pages"]
title = "계정 카드 안에서 밀려 들어오는 메뉴"
text = """
☰ 메뉴와 언어 목록이 이제 갑자기 나타나는 대신 계정 카드 안으로 밀려
들어오며, 오른쪽의 뒤로 버튼으로 돌아갈 수 있습니다.
"""

["2026-10-08-0618-app-card-edges"]
title = "모든 앱이 같은 카드 위에"
text = """
캘린더, 연락처, 할 일, 메모, 파일도 이제 메일과 설정처럼 얇은 테두리와
부드러운 그림자가 있는 카드 위에 놓입니다.
"""

["2026-10-08-0621-capture-keys-on-gnome"]
title = "GNOME에서도 빠른 기록 단축키"
text = """
할 일을 위한 Meta+Alt+T와 메모를 위한 Meta+Alt+N이 이제 GNOME에서도 작동합니다.
처음에는 GNOME이 Katna에 이 키를 허용할지 묻고, 키는 GNOME 설정에서 바꿀 수
있습니다.
"""

["2026-10-08-0629-movable-markup-tools"]
title = "옮길 수 있는 마크업 도구"
text = """
PDF에 마크업할 때 도구 끝의 점을 드래그하면 도구를 페이지 위 어디로든 옮길
수 있어, 표시하는 부분을 가리지 않습니다. 점을 두 번 클릭하면 원래 자리로
돌아갑니다.
"""

["2026-10-08-0641-screen-readers"]
title = "화면 낭독기 지원"
text = """
Orca 등 화면 낭독기가 이제 Katna Mail을 읽을 수 있습니다. 메일 목록, 폴더,
열린 메일, 버튼, 메뉴, 스위치, 대화상자를 읽어 줍니다.
"""

["2026-10-08-0641-send-feedback"]
title = "의견 보내기"
text = """
도움말 > 의견 보내기(빠른 설정과 설정 > 사용자 의견에도 있음)로 문제나
아이디어를 Katna에 바로 보낼 수 있습니다. 전송되는 내용에서 보내기 전에
정확한 텍스트를 확인할 수 있으며, 답장받을 이메일은 선택사항입니다.
"""

["2026-10-08-0641-usage-statistics"]
title = "원하면 보내는 익명 사용 통계"
text = """
설정 > 사용자 의견에 직접 켜기 전까지는 꺼져 있는 새 스위치가 생겼습니다.
켜면 일주일에 한 번 어떤 기능을 사용했는지 여부만 보내, 가장 많이 쓰는 기능에
가장 많은 정성을 들일 수 있습니다. 이 페이지에는 집계되는 모든 항목과 이번 주
보고서가 표시됩니다.
"""

["2026-10-08-0655-more-results-on-server"]
title = "서버에 있는 오래된 메일도 검색"
text = """
오래된 메일은 전체가 다운로드되지 않아 여기서는 내용을 검색할 수 없습니다.
이제 입력을 잠시 멈추거나 Enter 키를 누르면 Katna가 메일 서버에도 물어보고,
찾은 메일을 서버의 추가 결과 아래에 표시합니다.
"""

["2026-10-08-0657-search-unspaced-scripts"]
title = "태국어, 라오어, 크메르어, 버마어 검색"
text = """
태국어, 라오어, 크메르어, 버마어 메일에서 문장에 단어 사이 띄어쓰기가 없어도
검색으로 단어를 찾을 수 있습니다.
"""

["2026-10-08-0704-wrap-between-words"]
title = "긴 줄은 단어 사이에서 줄바꿈"
text = """
아랍어, 힌디어와 기타 인도 문자, 태국어, 라오어, 크메르어, 버마어 텍스트가
이제 단어 중간이 아니라 단어 사이에서 줄바꿈되며, 중국어와 일본어 줄은 더
이상 닫는 문장 부호로 시작하지 않습니다.
"""

["2026-10-08-0755-press-fills-buttons"]
title = "버튼 전체를 채우는 누름 효과"
text = """
칩이나 테두리 버튼을 클릭하면 이제 안쪽에 작은 알약 모양이 나타나는 대신
버튼의 가장자리와 모서리까지 꽉 채워집니다.
"""

["2026-10-08-0802-command-palette"]
title = "명령 팔레트"
text = """
Ctrl+Shift+P를 누르고 입력하면 어떤 작업이나 설정이든 찾을 수 있으며, Enter
키를 누르면 실행됩니다. 각 작업에는 단축키가 함께 표시되고, 최근에 사용한
항목이 맨 위에 나옵니다.
"""

["2026-10-08-0641-encryption-finds-keys"]
title = "암호화 메일이 키를 자동으로 찾기"
text = """
“암호화”가 켜져 있으면, 키가 없는 받는사람은 보낼 때 그 사람의 도메인 키
디렉터리에서 찾아봅니다. GnuPG에 내 주소의 키가 있으면 보내는 메일에 공개 키가
함께 실리고(Autocrypt), 같은 방식으로 받은 키는 답장을 암호화하는 데 사용됩니다.
암호화된 OpenPGP 메일은 이제 열기 전까지 제목이 숨겨집니다.
"""

["2026-10-08-0737-key-details"]
title = "메일에 서명한 사람 확인"
text = """
서명되거나 암호화된 메일의 서명 줄을 클릭하면 서명자의 키 정보(이름, 주소, 지문,
날짜)와 함께 “지문 복사” 버튼이 표시됩니다. 내게 없는 키로 서명된 메일에는 “키 찾기”가
표시되고, 다른 사람이 첨부한 키는 “이 키를 가져올까요?”로 열리며 가져온 뒤에
실행취소할 수 있습니다.
"""
