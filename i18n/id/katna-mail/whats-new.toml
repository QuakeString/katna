"""

["2026-10-01-0700-mute-from-contact"]
title = "Bisukan pengirim dari kartu kontaknya"
text = """
Kartu kontak di samping email punya lonceng sebagai tombol pertamanya:
lonceng ini membisukan semua email dari pengirim itu, dan lonceng bercoret
