dengan Lainnya di ujung kapsul yang sama.
"""

["2026-09-30-2012-fit-and-page-arrows"]
title = "Sesuaikan, panah halaman, dan lainnya di penampil"
text = """
Penampil lampiran punya tombol Sesuaikan: halaman PDF disesuaikan ke tinggi
jendela, gambar ke jendela, dan dokumen, slide, serta spreadsheet ke
lebarnya. Gambar juga mendapat Ukuran asli dan bisa diputar. Arahkan ke
kotak halaman untuk memunculkan panah kecil untuk mundur atau maju satu
halaman, dan slide mendapat kotaknya sendiri.
"""

["2026-09-30-2019-folder-icon-colours"]
title = "Ikon folder berwarna"
text = """
Ikon di panel folder kini punya warna yang menunjukkan isi setiap folder:
Belum dibaca biru, Berbintang kuning, Penting jingga, Terkirim hijau, Spam
