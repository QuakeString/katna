pun asalnya; Shift dan panah tetap di lampiran email yang sama.
"""

["2026-10-01-0254-files-dates"]
title = "Pilih hari di halaman File"
text = """
Chip waktu di halaman File kini membuka kalender dua bulan dengan pilihan
