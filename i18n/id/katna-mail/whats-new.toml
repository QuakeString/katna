"""

["2026-10-01-0807-files-leave-out-signature-pictures"]
title = "File juga mengabaikan gambar tanda tangan besar"
text = """
Gambar yang dikirim seseorang di tiga percakapan atau lebih, seperti
banner atau foto di tanda tangannya, tidak lagi muncul di halaman File,
