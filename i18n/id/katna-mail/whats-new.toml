Langkah baru menawarkan akun Katna dan mencantumkan apa yang diaktifkannya
(tanda terima baca, pelacakan link, Aktivitas, dan terjemahan), atau Anda
bisa melewatinya.
"""

["2026-09-30-1850-windows-frame-and-blur"]
title = "Bingkai dan efek buram Katna di Windows"
text = """
Di Windows, Katna Mail kini terbuka di dalam layar, dimaksimalkan jika
layarnya kecil. Setelan > Eksperimental bisa memburamkan yang ada di
belakang jendela, dan bingkai milik Katna mengubah bilah atas menjadi bilah
judul saat Katna Mail dibuka berikutnya.
"""

["2026-09-30-1851-dark-depth"]
title = "Lebih jelas dalam warna gelap"
text = """
Dalam warna gelap, elemen yang mengambang di atas daftar email kini sedikit
lebih terang dengan tepi terang yang samar, karena bayangan hampir tidak
