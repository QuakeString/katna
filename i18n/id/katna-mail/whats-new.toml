Newsletter tetap memakai tampilan biasa, dan sakelar Chat | Email
mengubah percakapan mana pun ke salah satunya.
"""

["2026-10-01-0946-forward-keeps-files"]
title = "Teruskan membawa file"
text = """
Meneruskan pesan kini ikut membawa lampirannya, ditampilkan di bawah pesan
sehingga Anda bisa melepas yang mana saja sebelum mengirim. Mengubah
penerusan menjadi balasan akan meninggalkan lampiran itu lagi.
"""

["2026-10-01-1009-forward-a-file"]
title = "Teruskan filenya saja"
text = """
Penampil lampiran punya tombol Teruskan di bilah atasnya: tombol ini
memulai email baru dengan hanya file itu terlampir, tanpa email asalnya.
File tanpa pratinjau juga menawarkan Teruskan, begitu pula kartu lampiran
di bawah email yang terbuka, di samping Simpan.
"""

["2026-10-01-1039-rephrase-with-ai"]
title = "Tulis ulang dengan AI"
text = """
Pilih teks dalam pesan lalu tekan ikon kilau di sampingnya, atau Ctrl+J,
agar teks ditulis ulang dengan lebih jelas, lebih singkat, lebih ramah, atau
lebih formal, lalu Ganti. Katna AI gratis selama 30 hari, atau pakai kunci
Anda sendiri dari Google Gemini, OpenAI, Claude, Mistral, DeepSeek,
OpenRouter, atau model di komputer ini. AI juga bisa melengkapi kalimat
Anda dalam warna abu-abu; aktifkan di Setelan > Tulis.
"""

["2026-10-01-1043-header-details-selectable"]
title = "Salin dari detail email"
text = """
Detail di bawah “kepada saya” kini bisa dipilih dan disalin seperti isi
email. Klik alamat untuk melihat kartu orang itu di samping email, atau klik
kanan untuk Salin alamat. Orang yang dibisukan juga menampilkan lonceng
bercoretnya di sana.
