"""

["2026-10-01-0147-today-marker-fits"]
title = "Tanggal hari ini muat dalam penandanya"
text = """
Di tampilan Bulan pada Kalender, penanda hari ini kini memuat seluruh
tanggal. Pada tanggal 1, penanda menjadi kapsul di sekitar “01 Okt”, bukan
lingkaran kecil yang labelnya meluap keluar.
"""

["2026-10-01-0208-tab-counts-stay"]
title = "Jumlah di tab tetap di tempat"
text = """
Membuka tab kotak masuk tidak lagi membuat bilah tab melompat. Tab yang
terbuka tetap menampilkan jumlah email barunya, yang perlahan memudar
menjadi abu-abu tenang, dan jumlah itu terlipat dengan mulus begitu Anda
sudah membaca semua email di tab itu.
"""

["2026-10-01-0225-files-keyboard"]
title = "Jelajahi file Anda dengan keyboard"
text = """
Di halaman File, tombol panah kini berpindah antarfile, Home dan End menuju
