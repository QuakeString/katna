dan Tampilkan email membawa Anda ke email asalnya.
"""

["2026-09-30-1643-dimmer-row-markers"]
title = "Daftar email lebih tenang"
text = """
Kotak centang kosong, bintang, atau penanda Penting di daftar email tampak
lebih redup sampai penunjuk berada di atas barisnya. Bintang dan penanda
yang sudah diatur tetap berwarna.
"""

["2026-09-30-1704-folder-arrows-on-hover"]
title = "Panel folder lebih rapi"
text = """
Panah kecil di samping Kotak Masuk, Berbintang, dan folder lain hanya
muncul saat penunjuk berada di atas folder itu. Folder yang sudah Anda buka
