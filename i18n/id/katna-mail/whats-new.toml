["2026-09-30-1742-frosted-viewer"]
title = "Penampil yang lebih ringan dan buram"
text = """
Bilah atas penampil lampiran kini lebih ramping dan terang, dan halaman,
zoom, serta putar ada dalam satu kapsul. Di sekitar file, Katna Mail tampak
buram di bawah selubung gelap yang lembut, dan bilah alatnya juga buram.
Efek buram mengikuti Setelan > Eksperimental; tanpanya penampil memakai
selubung gelap polos.
"""

["2026-09-30-1752-touchpad-glide"]
title = "Usapan touchpad meluncur"
text = """
Usapan cepat dua jari di touchpad terus menggulir lalu melambat, seperti di
aplikasi lain. Sentuh touchpad lagi untuk menghentikannya. Di Wayland.
"""

["2026-09-30-1800-inbox-tabs-in-top-row"]
title = "Tab kotak masuk di baris atas"
text = """
Utama, Promosi, Sosial, dan tab kotak masuk lainnya kini berada di bilah
kapsul pada baris atas daftar, masing-masing dengan jumlah email belum
dibaca yang berwarna. Sorotan bergeser ke tab yang Anda pilih, dan mengklik
