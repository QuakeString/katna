"""

["2026-09-30-1925-inbox-tabs-centred"]
title = "Tab kotak masuk di tengah"
text = """
Tab kotak masuk kini berada di tengah baris atas daftar, dan hanya bergeser
sejauh yang dibutuhkan tombol-tombolnya.
"""

["2026-09-30-1945-page-box-arrow-keys"]
title = "Tombol panah di kotak halaman"
text = """
Di PDF, klik nomor halaman lalu tekan Atas atau Bawah untuk mundur atau maju
satu halaman. Tahan tombolnya untuk membalik halaman dengan cepat.
"""

["2026-09-30-1952-phone-bar-labels"]
title = "Nama aplikasi di ponsel mengikuti setelan Anda"
text = """
Dengan nama aplikasi dinonaktifkan di Setelan, bilah di bagian bawah jendela
seukuran ponsel kini hanya menampilkan ikon, di tengah, seperti rel samping.
"""

["2026-09-30-1955-account-menu-icons"]
title = "Setelan dan bahasa di menu akun"
text = """
Menu di bawah gambar akun Anda kini dibuka dengan sebaris ikon: buka Setelan
