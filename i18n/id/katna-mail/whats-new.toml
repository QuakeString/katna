melompat ke sana.
"""

["2026-09-30-1919-tabs-keep-open-mail"]
title = "Berpindah tab tetap membiarkan email terbuka"
text = """
Dengan panel baca di samping daftar, memilih tab kotak masuk lain tidak
lagi menutup email yang sedang Anda baca; daftarnya berubah dan email tetap
