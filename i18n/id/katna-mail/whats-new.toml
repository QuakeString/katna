["2026-10-01-1132-open-mail-scroll-bar"]
title = "Bilah gulir di email panjang"
text = """
Percakapan panjang kini menampilkan bilah gulir tenang yang sama dengan
halaman File saat Anda menggulir atau mengarahkan penunjuk ke sana. Kedua
bilah kini lebih tipis dan membesar saat penunjuk mendekat. Seret, atau klik
