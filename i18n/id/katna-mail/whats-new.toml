ruang.
"""

["2026-09-30-2001-phone-tabs-fold"]
title = "Setiap tab kotak masuk tetap terjangkau"
text = """
Saat jendela sempit, tab kotak masuk melipat dengan mulus, bukan
bersembunyi: label berubah menjadi ikon yang lebih besar, lalu jumlahnya
