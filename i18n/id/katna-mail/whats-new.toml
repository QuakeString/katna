Keluar di menu ikon baki tidak lagi menunggu email yang masih
disinkronkan atau diindeks: Katna dan ikon bakinya langsung tertutup,
dan sisanya dilanjutkan saat Katna dimulai lagi.
"""

["2026-09-27-1715-contact-panel"]
title = "Detail kontak di samping email Anda"
text = """
Di jendela yang lebar, sebuah kartu di samping percakapan yang terbuka
kini menampilkan pengirimnya: telepon, jabatan, dan perusahaannya dari
tanda tangan mereka, waktu setempat mereka, seberapa banyak email yang
Anda saling kirim, percakapan terbaru Anda, dan file di antara Anda.
Klik percakapan atau file untuk membukanya, atau orang lain dalam
percakapan untuk melihatnya. Informasi ini hanya dibaca dari email Anda
di komputer ini. Tombol kontak di bilah alat panel baca
menyembunyikannya.
"""

["2026-09-27-1640-storage-used"]
title = "Penyimpanan terpakai"
text = """
Bagian bawah panel folder kini menampilkan seberapa penuh penyimpanan
email akun, misalnya “34% dari 15 GB terpakai”, jika server emailnya
memberitahukannya.
"""

["2026-09-27-1651-desktop-search"]
title = "Cari email dari KRunner dan penelusuran GNOME"
text = """
Ketik nama di KRunner (Alt+Space) atau penelusuran Aktivitas untuk
menulis kepada orang itu, menyalin alamatnya, atau mencari emailnya.
Pesan muncul jika subjek atau pengirimnya memuat setiap kata yang Anda
ketik; awali dengan mail: untuk menelusuri semua email Anda, seperti di
kotak penelusuran Katna Mail.
"""

["2026-09-27-1727-mail-templates"]
title = "Template untuk email yang sering Anda tulis"
text = """
Tulis pesan sekali, lalu simpan dengan tombol Template yang baru di
jendela tulis, lalu masukkan ke email baru atau balasan mana pun dengan
sekali klik. Tulis {first name}, {name}, atau {my name} dan Katna
mengisinya untuk setiap penerima. Edit, ganti nama, atau hapus template
di Setelan > Tulis.
"""

["2026-09-27-1724-server-send-later"]
title = "Email terjadwal terkirim meski komputer mati"
text = """
Jika server email Anda bisa menahan email hingga waktu yang ditentukan,
seperti Stalwart, Jadwalkan pengiriman kini menyerahkan pesan ke server
setelah Urungkan hilang, sehingga pesan terkirim tepat waktu meski
komputer ini mati. Menu jadwal menyebutkan apakah server email Anda atau
Katna yang akan mengirimnya.
"""

["2026-09-27-1730-softer-row-hover"]
title = "Sorotan yang lebih ringan"
text = """
Baris di bawah penunjuk di daftar email kini terangkat dengan bayangan
tipis, seperti di Gmail, sebagai ganti pita gelap di bawahnya.
"""

["2026-09-27-1745-drag-recipients"]
title = "Seret alamat antara Kepada, Cc, dan Bcc"
text = """
Seret chip alamat ke kolom lain untuk memindahkannya; Cc dan Bcc terbuka
saat Anda menyeret, bahkan saat tersembunyi. Mengarahkan penunjuk ke chip
menampilkan x untuk menghapusnya.
"""

["2026-09-27-1722-katna-account"]
title = "Akun Katna"
text = """
Setelan > Langganan memungkinkan Anda membuat akun di server Katna sendiri,
dengan sandinya sendiri, tidak pernah sandi email. Fitur online Katna,
seperti tanda terima baca dan pelacakan tautan, akan memerlukannya. Anda
bisa melihat komputer yang masuk dan mengeluarkan salah satunya.
"""

["2026-09-27-1805-reopens-as-you-left-it"]
title = "Kembali ke tempat semula"
text = """
Menutup Katna Mail lalu membukanya lagi akan mengembalikan aplikasi, folder,
dan tab kotak masuk yang Anda buka, folder yang Anda bentangkan, serta
apakah panel folder dilipat. Keluar dari Katna lewat baki sistem akan
memulainya dari awal.
"""

["2026-09-27-1724-snooze-and-reminders"]
title = "Tunda dan pengingat balasan"
text = """
Tunda percakapan dengan jam di barisnya atau dari menu klik kanan:
percakapan menunggu di folder Ditunda dan kembali ke Kotak Masuk, belum
dibaca, pada waktu yang Anda pilih. Saat mengirim, panah di samping Kirim
dapat mengingatkan Anda jika tidak ada yang membalas dalam 1, 3, atau 7
hari. Keduanya bekerja selama komputer Anda menyala, dan menyusul setelah
komputer bangun.
"""

["2026-09-27-1717-translate-mail"]
title = "Baca email dalam bahasa Anda"
text = """
Pesan dalam bahasa lain kini menampilkan tombol Terjemahkan di atasnya,
dan Tampilkan asli mengembalikannya. Katna mengenali bahasanya di komputer
Anda; teks pesan baru dikirim ke server Katna sendiri untuk diterjemahkan
saat Anda memintanya. Setelan > Umum > Terjemahan memilih bahasa Anda dan
bahasa yang selalu diterjemahkan.
"""

["2026-09-27-1744-open-and-click-tracking"]
title = "Lihat kapan email dibuka"
text = """
Aktifkan ikon mata di samping penerima untuk melihat kapan masing-masing
membuka pesan Anda atau mengikuti link di dalamnya, atau minta tanda
terima baca sebagai gantinya. Email terkirim menunjukkan siapa yang
membukanya, dan notifikasi memberi tahu Anda pertama kalinya. Keduanya
nonaktif untuk setiap pesan baru, dan pelacakan memerlukan akun Katna
(Setelan > Langganan).
"""

["2026-09-27-2042-activity"]
title = "Aktivitas untuk email yang dilacak"
text = """
Aktivitas di samping kotak penelusuran menunjukkan berapa banyak pesan
terlacak Anda yang dibuka dan seberapa sering link-nya diikuti, dengan
subjek diurutkan menurut seberapa sering dibuka.
"""

["2026-09-27-2204-search-trigger-words"]
title = "Telusuri email Anda dari KRunner dengan k"
text = """
Ketik k atau m, spasi, lalu yang ingin dicari di KRunner atau penelusuran
GNOME untuk mendapatkan hasil yang sama dengan kotak penelusuran
Katna Mail, seperti “k budget”. Pilih kata Anda sendiri di Setelan, di
bawah Umum.
"""

["2026-09-27-2224-activity-button"]
title = "Aktivitas di samping kotak penelusuran"
text = """
Tombol Aktivitas di samping kotak penelusuran menghitung pembukaan dan
klik baru pada email terlacak Anda serta menampilkan siapa membuka apa
dan link mana yang diikuti; klik salah satunya untuk membuka pesan itu.
Detail menampilkan tingkat dibuka dan tingkat klik, jumlah dibuka per
hari, dan subjek terbaik Anda untuk 7 atau 30 hari terakhir, sepanjang
waktu, atau tanggal pilihan Anda. Pesan terkirim kini menunjukkan berapa
kali setiap orang membukanya dan mengikuti link.
"""

["2026-09-27-2239-mailbox-insights"]
title = "Wawasan kotak surat"
text = """
Aktivitas > Detail kini juga menampilkan berapa banyak email yang Anda
kirim dan terima dalam periode itu, seberapa sering dan seberapa cepat
Anda dan orang lain membalas, orang yang paling sering berkirim email
dengan Anda, serta hari dan jam email Anda masuk. Semuanya dihitung di
komputer Anda dari email yang sudah ada di Katna.
"""

["2026-09-28-0059-sign-in-with-google"]
title = "Masuk dengan Google atau Microsoft"
text = """
Tambahkan akun Gmail atau Outlook dengan masuk di halaman Google atau
Microsoft sendiri di browser Anda, tanpa sandi aplikasi. Alamat Outlook.com
dan Hotmail kini juga bisa digunakan. Jika proses masuk berhenti berfungsi,
catatan di bagian bawah jendela menawarkan untuk masuk lagi.
"""

["2026-09-28-0054-tracking-on-by-default"]
title = "Pelacakan dan tanda terima aktif sejak awal"
text = """
Pesan baru dan balasan kini dimulai dengan pelacakan buka dan klik, tanda
terima baca, dan tanda terima pengiriman dalam keadaan menyala; klik
tombol di samping penerima untuk mematikan salah satunya untuk pesan itu.
Pelacakan mengharuskan Anda masuk ke akun Katna Anda. Tanda terima
pengiriman adalah email yang dikirim server email Anda saat server setiap
penerima menerima pesan; tombolnya berwarna abu-abu jika server email Anda
tidak menyediakannya.
"""

["2026-09-28-0120-delivered-read-ticks"]
title = "Tanda centang untuk sampai dan dibaca"
text = """
Email yang Anda kirim kini menampilkan tanda centang di samping setiap
penerima. Satu centang abu-abu berarti server email penerima sudah
menerimanya: dari tanda terima pengiriman, atau, jika layanan email Anda
tidak mengirimkannya (Gmail), saat tidak ada pemberitahuan gagal kirim
yang kembali dalam setengah jam. Dua centang dengan warna aksen Anda
berarti pesan sudah dibaca, dari tanda terima baca atau pelacakan buka,
dan tanda peringatan berarti pesan gagal terkirim. Arahkan penunjuk ke
sebuah centang untuk melihat kapan dan bagaimana. Email tanda terima tetap
ada di kotak surat Anda di “Pembaruan”, tanpa notifikasi.
"""

["2026-09-28-0143-gmail-new-mail-notifications"]
title = "Notifikasi untuk email Gmail baru"
text = """
Email baru di Kotak Masuk Gmail kembali memunculkan notifikasi.
Sebelumnya Katna melewatkan email yang disimpan Gmail di
“Semua Email” sesaat sebelum masuk ke Kotak Masuk.
"""

["2026-09-28-0156-attachment-types"]
title = "Telusuri menurut jenis lampiran"
text = """
Di Opsi penelusuran, “Ada lampiran” kini menawarkan PDF, XLSX, ODF, XLS,
ODS, PPT, dan PPTX, serta Kustom untuk ekstensi lain apa pun, seperti
png atau avif. Hanya email dengan lampiran jenis yang dipilih yang
ditampilkan.
"""

["2026-09-28-0106-original-colors"]
title = "Warna asli dalam tema gelap"
text = """
Dalam tema gelap, email yang mengatur warnanya sendiri ditampilkan dengan
warna gelap. Tombol setengah lingkaran yang baru di toolbar panel baca
menampilkannya dengan warna asli pengirimnya, dan kembali lagi.
"""

["2026-09-28-0127-print-as-shown"]
title = "Hasil cetak menjaga formatnya"
text = """
Email tercetak seperti tampilannya di panel baca, lengkap dengan tabel,
warna, garis tepi, daftar, dan gambarnya. Pratinjau cetak bisa mengabaikan
warna latar belakang untuk menghemat tinta, atau mencetak teksnya saja
dengan Teks sederhana.
"""

["2026-09-28-0141-ask-before-deleting"]
title = "Tanya sebelum menghapus"
text = """
Menghapus beberapa percakapan sekaligus kini bertanya lebih dahulu apakah
percakapan itu dipindahkan ke Sampah. Centang “Jangan tanya lagi” untuk
melewati pertanyaannya, atau aktifkan kembali di Setelan > Umum.
Penghapusan selamanya, di Sampah, selalu bertanya.
"""

["2026-09-28-0019-katna-for-windows"]
title = "Katna untuk Windows"
text = """
Katna Mail kini juga berjalan di Windows 10 dan 11, dipasang dengan Katna
Setup miliknya sendiri, lengkap dengan ikon baki sistem, notifikasi, mulai
otomatis saat login, dan link email yang terbuka di Katna.
"""

["2026-09-28-0236-chip-remove-always"]
title = "Tombol hapus di setiap alamat"
text = """
Setiap chip alamat di Kepada, Cc, dan Bcc kini selalu menampilkan tanda
x-nya, sehingga Anda bisa menghapusnya tanpa mengarahkan penunjuk ke sana
terlebih dahulu.
"""

["2026-09-28-0244-pill-format-bar"]
title = "Bilah format yang lebih bulat"
text = """
Bilah format saat menulis email (Aa) kini berbentuk pil dengan tepi tipis,
sehingga terpisah dari teks Anda di tema terang maupun gelap.
"""

["2026-09-28-0325-long-threads-smooth"]
title = "Percakapan email panjang terbuka cepat"
text = """
Email berformat yang mengutip banyak balasan sebelumnya, seperti rangkaian
kutipan yang panjang, kini langsung terbuka dan bergulir dengan mulus
alih-alih memperlambat seluruh jendela.
"""

["2026-09-28-0830-who-has-seen-it"]
title = "Siapa yang sudah melihatnya, di balik ikon mata"
text = """
Email yang Anda kirim dengan pelacakan tidak lagi memiliki kotak berisi
baris di atasnya. Ikon mata di samping bintang berubah ke warna aksen Anda
begitu seseorang membukanya; arahkan penunjuk ke sana untuk melihat siapa
yang membukanya atau mengikuti link, dan kapan.
"""

["2026-09-28-0831-contact-call-copy"]
title = "Telepon dan salin dari detail kontak"
text = """
Di detail kontak di samping percakapan, klik nomor telepon untuk
meneleponnya dengan aplikasi telepon atau KDE Connect, atau gunakan tombol
salin di sebelahnya. Semua teks di panel itu kini juga bisa dipilih dan
disalin.
"""

["2026-09-28-0848-quoted-text-hide-remove"]
title = "Sembunyikan atau hapus email kutipan dalam balasan"
text = """
Tombol “...” di bawah balasan kini menyembunyikan lagi email kutipan setelah
Anda membukanya. Arahkan penunjuk ke sana dan klik x di sudutnya untuk
mengeluarkan email kutipan dari balasan Anda; Urungkan atau Ctrl+Z
mengembalikannya. Toolbar balasan juga tetap di tempatnya saat Anda
menggulir.
"""

["2026-09-28-0854-floating-folders"]
title = "Folder yang melayang, dan penelusuran yang lebih lebar"
text = """
Saat folder disembunyikan, mengarahkan penunjuk ke Tulis atau Email
membukanya sebagai panel yang berjarak dari tepi, dengan takik kecil yang
menunjuk ke tombolnya. Kotak penelusuran melebar mengisi ruang yang
ditinggalkan folder, dan mengklik folder yang sedang Anda buka tidak lagi
membuat daftar berkedip.
"""

["2026-09-28-0928-search-address-suggestions"]
title = "Saran alamat di Opsi penelusuran"
text = """
Dari dan Kepada di Opsi penelusuran kini menyarankan alamat saat Anda
mengetik, sama seperti Kepada, Cc, dan Bcc saat menulis email. Pilih salah
satu dengan Enter, Tab, atau klik.
"""

["2026-09-28-0935-app-menu-reply-all-window"]
title = "Menu utama di kartu akun, Balas semua di jendelanya sendiri"
text = """
Kartu akun kini punya tombol ☰ di samping Kelola akun. Tombol ini membuka
menu Berkas, Sunting, Tampilan, Pergi, Pesan, Setelan, dan Bantuan yang sama
dengan menu global desktop, untuk desktop yang tidak menampilkannya. Balas
semua pada notifikasi email baru kini membuka percakapan di jendelanya
sendiri, siap untuk diketik, dan membiarkan jendela utama tetap di
tempatnya.
"""

["2026-09-28-1011-tray-brings-window-forward"]
title = "Klik baki sistem dan notifikasi membawa Katna Mail ke depan"
text = """
Mengklik ikon baki sistem, atau Buka Kotak Masuk, Pesan Baru, atau Setelan
di menunya, kini membawa jendela Katna Mail ke depan di Wayland, bahkan saat
jendela itu diminimalkan atau berada di belakang jendela lain. Mengklik
notifikasi email baru membuka email itu, bahkan saat daftar Kotak Masuk
tidak menampilkannya.
"""

["2026-09-28-1053-send-countdown-reply-in-place"]
title = "Kirim menghitung mundur, dan balasan Anda tetap di percakapan"
text = """
Setelah Kirim, cincin yang menyusut menghitung mundur waktu untuk
mengurungkan di samping Urungkan, lalu notifikasi singkat menampilkan Pesan
terkirim (dengan suara singkat) setelah email terkirim. Suara ini bisa
dimatikan di Setelan > Umum > Pengiriman. Balasan yang ditulis di percakapan
berubah menjadi pesan tepat di tempat Anda menulisnya. Bagian atasnya hanya
menampilkan kepada siapa balasan itu dikirim; klik untuk melihat Dari,
Kepada, Cc, dan Bcc. Panah di samping ikon balas beralih antara Balas, Balas
semua, dan Teruskan, tanpa menghapus yang sudah Anda tulis.
"""

["2026-09-28-1110-search-options-narrow"]
title = "Opsi penelusuran muat di jendela sempit"
text = """
Di jendela yang sempit atau pendek, Opsi penelusuran kini melebar sesuai
ruang yang ada, menaruh label di atas kolomnya di ponsel, dan dapat digulir
saat tidak muat, sehingga tombol Telusuri selalu terjangkau.
"""

["2026-09-28-1119-replies-from-right-account"]
title = "Balasan terkirim dari akun yang tepat"
text = """
Balas atau Teruskan pada email yang dibuka dari Kotak masuk gabungan atau
dari pencarian kini terkirim dari akun yang menerima email itu, bukan akun
yang dipilih di bawah gambar profil Anda.
"""

["2026-09-28-1436-calmer-search-box"]
title = "Pencarian menampilkan pintasannya"
text = """
Kotak pencarian menampilkan pintasan keyboard di samping "Telusuri email",
sesuai yang diatur di Setelan > Pintasan. Saat diklik, warnanya tetap dan
hanya muncul tepi tipis, bukan menjadi lebih gelap dengan bayangan. Folder
yang mengambang di atas daftar kini juga tidak lagi menempel di tepi bawah.
"""

["2026-09-28-1450-clear-activity"]
title = "Rapikan Aktivitas"
text = """
Arahkan ke item dibuka atau diklik di Aktivitas lalu tekan × untuk
menghapusnya dari daftar, atau tekan Hapus semua untuk memulai dari awal.
Item dibuka dan diklik yang baru tetap muncul, dan laporan Detail tetap
menghitung semuanya.
"""

["2026-09-28-1541-round-logo"]
title = "Logo bulat baru Katna"
text = """
Katna kini punya logo baru: huruf "k" bergaya tulisan tangan di atas
lingkaran teal — di menu aplikasi, bilah atas, dan panel. Ikon di baki
sistem tampil dalam satu warna yang cocok dengan panel Anda, sementara
Tentang Katna dan layar sambutan menampilkan "katna mail" secara utuh.
"""

["2026-09-28-1546-contact-cards"]
title = "Panel kontak yang lebih rapi"
text = """
Panel kontak kini menampilkan setiap bagian dalam kartunya sendiri
yang lembut, dengan tombol bulat di bawah nama untuk mengirim email
ke orang itu, mencari email dengan mereka, atau meneleponnya.
Percakapan terbaru menampilkan beberapa yang terbaru; tekan Lainnya
untuk melihat sisanya dan Lebih sedikit untuk menyembunyikannya lagi.
"""

["2026-09-28-1507-reply-box-recipients"]
title = "Kotak balasan yang lebih rapi"
text = """
Penerima kini ditampilkan dengan foto mereka, dan Cc serta Bcc
digabung dalam satu tombol kecil. Membuka penerima balasan membuat
kotak tumbuh ke atas dengan mulus, dan pesan yang dikutip terbuka dan
tertutup dengan mulus di bawah garis bergelombang yang bisa Anda klik
untuk melipatnya kembali.
"""

["2026-09-28-1620-softer-window-shadow"]
title = "Bayangan jendela yang lebih lembut dan tombol seukuran KDE"
text = """
Dengan bingkai jendela Katna, bayangan di sekitar jendela kini lebih
tipis dan memudar sepenuhnya, tanpa tepi tajam yang sebelumnya ada di
samping jendela. Tombol jendela kini seukuran tombol KDE sendiri, dan
berjarak sama dari sisi jendela seperti dari bagian atasnya.
"""

["2026-09-28-1622-update-from-the-app"]
title = "Perbarui Katna dari dalam aplikasi"
text = """
Katna kini mengunduh versi baru dengan sendirinya dan memberi tahu
Anda saat sudah siap. Tekan Perbarui di notifikasi atau di Tentang:
Katna Mail akan memberi tahu bahwa ia akan memulai ulang, meminta
sandi Anda, memasang pembaruan, lalu terbuka lagi seperti sebelumnya.
Setelan > Umum > Pembaruan mematikan unduhan otomatis.
"""

["2026-09-28-1520-track-sealed-and-plain"]
title = "Melacak email yang ditandatangani, dienkripsi, dan teks biasa"
text = """
Ikon mata sekarang juga berfungsi pada email yang ditandatangani dan
dienkripsi: salinan setiap penerima ditandatangani atau dienkripsi secara
terpisah, sehingga tanda tangan tetap valid. Email teks biasa tidak dapat
menampilkan pembukaan, tetapi link-nya dilacak, sehingga Anda melihat saat
seseorang mengikuti salah satunya.
"""

["2026-09-28-1834-reply-after-closed-window"]
title = "Balas dimulai baru setelah jendela pesan ditutup"
text = """
Menutup pesan yang ditulis di jendelanya sendiri kini menyimpannya di Draf,
dan Balas, Balas semua, serta Teruskan membuka pesan baru lagi, bukan
mengembalikan pesan yang lama.
"""

["2026-09-28-1852-frosted-search-bar"]
title = "Bilah penelusuran berkaca buram"
text = """
Saat latar belakang buram aktif, bilah penelusuran meneruskan efek buram
seperti bilah di sekelilingnya, bukan duduk di atasnya sebagai pil abu-abu
pekat.
"""

["2026-09-28-1906-scroll-to-switch-accounts"]
title = "Gulir di atas gambar Anda untuk beralih akun"
text = """
Dengan penunjuk di atas gambar akun di kanan atas, putar roda mouse untuk
pindah ke akun berikutnya atau sebelumnya, satu akun per klik. Gambar
bergulir ke akun baru, seperti nama aplikasi bergulir saat Anda beralih
aplikasi, dan memilih akun dari kartu membuatnya bergulir dengan cara yang
sama.
"""

["2026-09-28-1918-many-recipients"]
title = "Ruang untuk banyak penerima"
text = """
Penerima setelah baris pertama kini memakai seluruh lebar, dan daftar
panjang bergulir dalam beberapa baris, sehingga pesannya sendiri selalu
terjangkau. Tinggalkan kolom dan ia melipat menjadi satu baris, seperti
"Kay, Sam, 19 lagi"; klik untuk melihat semuanya lagi.
"""

["2026-09-28-1952-activity-by-account"]
title = "Laporan aktivitas untuk satu akun"
text = """
Laporan aktivitas kini punya pemilih akun di samping tanggal. Pilih
Semua akun atau salah satunya, dan pesan yang dilacak, tingkat, grafik,
subjek, serta Kotak surat Anda akan mengikuti. Laporan menyebutkan akun
yang ditampilkan dan mengingat pilihan Anda.
"""

["2026-09-28-2002-reader-arrows-always-shown"]
title = "Panah Lebih baru dan Lebih lama selalu tampil di bilah alat"
text = """
Selebar apa pun panel baca, penghitung dan panah Lebih baru serta Lebih
