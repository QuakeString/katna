"""

["2026-10-01-0925-chat-view"]
title = "Baca percakapan sebagai chat (eksperimental)"
text = """
Aktifkan Setelan > Eksperimental > Percakapan sebagai chat, dan email
antarorang terbaca seperti chat grup: satu gelembung untuk setiap email
