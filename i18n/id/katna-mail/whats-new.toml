"""

["2026-09-30-1911-files-scrollbar"]
title = "Bilah gulir di halaman File"
text = """
Jika file terlalu banyak untuk muat, bilah gulir tipis muncul di kanan saat
Anda menggulir atau saat penunjuk berada di atas file, lalu memudar. Seret
