kanan pada skema Anda untuk mengedit, menduplikat, mengekspor, atau
menghapusnya.
"""

["2026-10-01-0527-calendar-opens-on-week"]
title = "Kalender terbuka di Minggu"
text = """
Katna Calendar kembali terbuka di tampilan Minggu, dengan hari-hari ke depan
dalam jam. Bulan, Hari, Tahun, dan lainnya tinggal sekali klik di bilah
atas.
"""

["2026-10-01-0552-lighter-count-on-open-row"]
title = "Jumlah menonjol di folder yang terbuka"
text = """
Jumlah di samping folder yang terbuka di Email, dan di samping jenis yang
terbuka di File, kini ada dalam kapsul yang lebih terang dari abu-abu
