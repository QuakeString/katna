di atas rel. Di ponsel, tombol ini menjadi tombol mengambang.
"""

["2026-10-01-1115-color-picker"]
title = "Pemilih warna di editor skema"
text = """
Klik sebuah warna di editor skema dan pemilih warna terbuka tepat di
sampingnya: seret di kotak dan bilah rona, ketik nilai heks, pakai lagi
warna skema itu atau pilihan terbaru, atau ambil warna dari mana saja di
layar dengan pipet di KDE dan GNOME.
"""

["2026-10-01-1130-contact-card-folds-folders"]
title = "Kartu kontak memberi ruang sendiri"
text = """
Di jendela yang terlalu sempit untuk panel folder dan kartu kontak secara
berdampingan, kartu kini melipat folder saat terbuka, dan folder kembali
saat kartu ditutup. Folder yang Anda lipat sendiri tetap terlipat.
