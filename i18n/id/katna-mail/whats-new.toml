text = """
Jumlah belum dibaca di taskbar dan baki sistem kini menghitung email yang
sama dengan yang memberi notifikasi: tab Utama di Kotak Masuk Anda.
Promosi, Sosial, Pembaruan, dan Forum tidak lagi menambah jumlahnya.
"""

["2026-10-01-0312-quiet-selected-row"]
title = "Folder terbuka yang lebih tenang"
text = """
Folder yang terbuka di Email, dan tampilan yang terbuka di Kontak, Tugas,
Catatan, dan File, kini ditandai dengan abu-abu lembut, bukan warna aksen,
