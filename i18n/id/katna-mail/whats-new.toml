["2026-10-01-0803-select-hover-fits"]
title = "Tombol pilih yang lebih rapi"
text = """
Sorotan di balik kotak centang pilih di atas daftar email kini setinggi
tombol di sampingnya, berjarak sama dari tepi kartu seperti dari atasnya,
