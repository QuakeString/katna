mengikuti warna aksen Windows.
"""

["2026-10-01-0329-mute-folders"]
title = "Bisukan folder, tab, atau akun"
text = """
Lonceng di atas daftar membisukan folder atau tab Kotak Masuk yang terbuka
selama satu jam, sampai besok pagi, atau sampai Anda mengaktifkannya lagi.
Klik kanan folder atau akun untuk hal yang sama. Setelan > Notifikasi
menunjukkan folder mana yang memberi notifikasi dan mana yang dihitung di
taskbar, serta semua yang dibisukan.
"""

["2026-10-01-0335-tray-style"]
