"""

["2026-09-30-2040-tabs-no-slide"]
title = "Tab kotak masuk lebih cepat"
text = """
Mengklik tab kotak masuk kini langsung menyorotnya, hanya dengan riak
klik, bukan menggeser sorotan melewati tab lain.
"""

["2026-10-01-0145-files-tidy"]
title = "Halaman File lebih rapi"
text = """
Jumlah di samping setiap jenis file dan setiap akun kini ada dalam kapsul
kecil yang sama dengan jumlah folder di Email. Garis di bawah judul halaman
