"""

["2026-09-30-1840-first-run-window"]
title = "Awal yang lebih ramah"
text = """
Saat Anda menyiapkan Katna Mail, jendelanya tampak di belakang halaman
penyiapan di bawah selubung tipis: aplikasi, Tulis, dan kotak pencarian,
