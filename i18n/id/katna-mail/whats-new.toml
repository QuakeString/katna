bilah ini mendapat barisnya sendiri dan menampilkan ikon, dengan nama tab
yang terbuka tetap terlihat; di ponsel, bilah ini ada di bilah daftar,
dengan Muat ulang di menu Lainnya.
"""

["2026-09-30-1805-account-menu"]
title = "Info akun di menu klik kanan"
text = """
Klik kanan nama akun di daftar folder, atau kotak masuknya di bawah Semua
Akun, untuk melihat alamatnya, apakah sudah tersinkron dan kapan terakhir
diperiksa, serta berapa banyak penyimpanan yang dipakai. Dari situ Anda
bisa memeriksa kotak masuk itu, menulis email baru dari akun itu, membuka
setelannya, atau masuk lagi saat sesi masuk sudah kedaluwarsa.
"""

["2026-09-30-1819-glass-search-box"]
title = "Kotak pencarian kaca"
text = """
Dengan latar belakang buram aktif, kotak pencarian berupa kaca buram dengan
