email, pilih akun pengirim di submenunya.
"""

["2026-09-30-1624-files-page"]
title = "Semua file di satu tempat"
text = """
Halaman File yang baru, di bagian bawah bilah aplikasi, menampilkan setiap
lampiran dari setiap akun, yang terbaru lebih dulu. Persempit ke gambar,
