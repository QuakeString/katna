Instellingen > Opstellen.
"""

["2026-10-02-0430-compose-beside-reply"]
title = "Opstellen terwijl een antwoord half af is"
text = """
Opstellen opent nu een nieuw bericht, ook terwijl je een antwoord schrijft,
in de chat of onder het gesprek. Het antwoord wacht zoals je het liet en
komt terug als het nieuwe bericht verzonden of gesloten is, of als je
klikt om weer op dat gesprek te antwoorden.
"""

["2026-10-02-0436-mark-unread-icon"]
title = "Een duidelijker pictogram voor Markeren als ongelezen"
text = """
Markeren als ongelezen toont nu een envelop met een stip, in menu's, in de
