["2026-10-02-0755-faint-lines-everywhere"]
title = "Overal vage lijnen"
text = """
In de lichte modus is elke lijn tussen dingen, onder koppen en rond kaarten
nu even vaag als de lijnen tussen e-mails, ook op de samenvattingskaart.
Velden, chips en knoppen houden hun duidelijke rand.
"""

["2026-10-02-0756-ai-replies-signed"]
title = "AI-antwoorden eindigen met je handtekening"
text = """
Antwoorden en notities die AI schrijft, eindigen niet meer met ‘Met
vriendelijke groet’ en je naam. Je handtekening ondertekent ze: in het
