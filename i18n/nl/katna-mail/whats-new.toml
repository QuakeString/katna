ernaast.
"""

["2026-10-02-0654-attach-from-drive"]
title = "Bijvoegen uit Google Drive"
text = """
De paperclip van Opstellen opent nu de bestandskiezer, dezelfde als Uit
Bestanden in de chat, met je Google Drive naast je e-mailbestanden en
Deze computer… voor al het andere. Bestanden die passen, gaan mee in de
e-mail; grote bestanden en Google Docs gaan als link, gedeeld met de
ontvangers als je verzendt.
"""

["2026-10-02-0734-peek-and-reply-in-notifications"]
title = "Bekijken en beantwoorden vanuit de melding"
text = """
Een melding van nieuwe e-mail heeft nu Bekijken, dat de e-mail zelf in
