bestand om het te openen, of op een andere persoon uit het gesprek om
die te bekijken. Alles komt alleen uit je e-mail op deze computer. De
contactknop op de werkbalk van het leesvenster verbergt de kaart.
"""

["2026-09-27-1640-storage-used"]
title = "Gebruikte opslag"
text = """
Onderaan het mappenvenster zie je hoe vol de e-mailopslag van het account
is, zoals ‘34% van 15 GB gebruikt’, als de mailserver dat doorgeeft.
"""

["2026-09-27-1651-desktop-search"]
title = "E-mail vinden vanuit KRunner en GNOME-zoeken"
text = """
Typ een naam in KRunner (Alt+Space) of het zoekveld van Activiteiten om die
persoon te mailen, het adres te kopiëren of de e-mail te vinden. Berichten
verschijnen als het onderwerp of de afzender elk woord bevat dat je typt; begin
met mail: om in al je e-mail te zoeken, zoals in het zoekvak van Katna Mail.
"""

["2026-09-27-1727-mail-templates"]
title = "Sjablonen voor e-mail die je vaak schrijft"
text = """
Schrijf een bericht één keer en sla het op met de nieuwe knop Sjablonen bij
het opstellen, en zet het daarna met één klik in elke nieuwe e-mail of elk
antwoord. Schrijf {first name}, {name} of {my name} en Katna vult ze voor elke
ontvanger in. Bewerk, hernoem of verwijder sjablonen in
Instellingen > Opstellen.
"""

["2026-09-27-1724-server-send-later"]
title = "Geplande e-mail gaat ook weg als je computer uit staat"
text = """
Als je mailserver e-mail kan vasthouden tot een ingesteld tijdstip, zoals
Stalwart dat kan, geeft Verzending plannen het bericht nu aan de server
zodra Ongedaan maken weg is, zodat het op tijd weggaat, ook als deze
computer uit staat. Het planningsmenu zegt of je mailserver of Katna het
verzendt.
"""

["2026-09-27-1730-softer-row-hover"]
title = "Een lichtere hover"
text = """
De regel onder de aanwijzer in de e-maillijst komt nu omhoog met een
vage schaduw, net als in Gmail, in plaats van een donkere band eronder.
"""

["2026-09-27-1745-drag-recipients"]
title = "Adressen slepen tussen Aan, Cc en Bcc"
text = """
Sleep een adreschip naar een ander veld om het te verplaatsen; Cc en Bcc
gaan open terwijl je sleept, ook als ze verborgen zijn. Als je naar een
chip wijst, verschijnt een x die het verwijdert.
"""

["2026-09-27-1722-katna-account"]
title = "Katna-account"
text = """
Met Instellingen > Abonnement maak je een account op de eigen server
van Katna, met een eigen wachtwoord, nooit een e-mailwachtwoord. De
onlinefuncties van Katna, zoals leesbevestigingen en linktracking,
hebben het nodig. Je ziet welke computers zijn aangemeld en kunt elk
ervan afmelden.
"""

["2026-09-27-1805-reopens-as-you-left-it"]
title = "Terug waar je was"
text = """
Als je Katna Mail sluit en weer opent, komen de app, de map en het
inbox-tabblad die je open had terug, net als de mappen die je had
uitgeklapt en of het mappenvenster was ingeklapt. Afsluiten van Katna
vanuit het systeemvak start het opnieuw.
"""

["2026-09-27-1724-snooze-and-reminders"]
title = "Snoozen en herinneringen bij geen antwoord"
text = """
Snooze een gesprek met de klok op de regel of vanuit het rechtsklikmenu:
het wacht in de map Gesnoozed en komt op het gekozen tijdstip ongelezen
terug in de Inbox. Bij het verzenden kan de pijl naast Verzenden je
herinneren als niemand binnen 1, 3 of 7 dagen antwoordt. Beide werken
terwijl je computer aan staat, en halen de achterstand in zodra hij weer
wakker wordt.
"""

["2026-09-27-1717-translate-mail"]
title = "E-mail lezen in je eigen taal"
text = """
Een bericht in een andere taal toont nu een knop Vertalen erboven, en
Origineel tonen brengt het terug. Katna herkent de taal op je computer;
alleen als je erom vraagt gaat de tekst van het bericht naar de eigen
server van Katna om vertaald te worden. Instellingen > Algemeen >
Vertaling kiest je taal en de talen die altijd vertaald worden.
"""

["2026-09-27-1744-open-and-click-tracking"]
title = "Zien wanneer e-mail geopend wordt"
text = """
Zet het oog bij de ontvangers aan om te zien wanneer elk van hen je
bericht opent of een link erin volgt, of vraag in plaats daarvan een
leesbevestiging. Verzonden e-mail laat zien wie hem geopend heeft, en een
melding laat het je de eerste keer weten. Beide staan uit voor elk nieuw
bericht, en volgen vereist een Katna-account (Instellingen > Abonnement).
"""

["2026-09-27-2042-activity"]
title = "Activiteit voor gevolgde e-mail"
text = """
Activiteit naast het zoekvak toont hoeveel van je gevolgde berichten
zijn geopend en hoe vaak hun links zijn gevolgd, met je onderwerpregels
gerangschikt op hoe vaak ze worden geopend.
"""

["2026-09-27-2204-search-trigger-words"]
title = "Zoek in je e-mail vanuit KRunner met k"
text = """
Typ k of m, een spatie en dan wat je zoekt in KRunner of de
GNOME-zoekfunctie, en je krijgt dezelfde resultaten als in het zoekvak
van Katna Mail, zoals ‘k budget’. Kies je eigen woorden in
Instellingen > Algemeen.
"""

["2026-09-27-2224-activity-button"]
title = "Activiteit naast het zoekvak"
text = """
De knop Activiteit naast het zoekvak telt nieuwe keren dat je gevolgde
e-mail is geopend of aangeklikt en laat zien wie wat heeft geopend en
welke links zijn gevolgd; klik erop om dat bericht te openen. Details
toont het openings- en klikpercentage, openingen per dag en je beste
onderwerpregels voor de afgelopen 7 of 30 dagen, altijd of de datums die
je kiest. Een verzonden bericht laat nu zien hoe vaak iedereen het heeft
geopend en een link heeft gevolgd.
"""

["2026-09-27-2239-mailbox-insights"]
title = "Inzicht in je mailbox"
text = """
Activiteit > Details laat nu ook zien hoeveel e-mail je in die periode
hebt verzonden en ontvangen, hoe vaak en hoe snel jij en anderen
antwoorden, met wie je het vaakst mailt en op welke dagen en uren je
e-mail binnenkomt. Het wordt op je computer geteld uit de e-mail die
Katna al heeft.
"""

["2026-09-28-0059-sign-in-with-google"]
title = "Aanmelden met Google of Microsoft"
text = """
Voeg een Gmail- of Outlook-account toe door je aan te melden op de eigen
pagina van Google of Microsoft in je browser, zonder app-wachtwoord.
Adressen van Outlook.com en Hotmail werken nu ook. Werkt een aanmelding
niet meer, dan biedt een melding onder in het venster aan om je opnieuw
aan te melden.
"""

["2026-09-28-0054-tracking-on-by-default"]
title = "Volgen en bevestigingen meteen aan"
text = """
Nieuwe berichten en antwoorden beginnen nu met het volgen van openen en
klikken, een leesbevestiging en een ontvangstbevestiging aan; klik op
een knop naast de ontvangers om er een voor dat bericht uit te zetten.
Voor het volgen moet je aangemeld zijn bij je Katna-account. Een
ontvangstbevestiging is een e-mail die je mailserver je stuurt wanneer
de server van elke ontvanger het bericht aanneemt; de knop is grijs als
je mailserver ze niet aanbiedt.
"""

["2026-09-28-0120-delivered-read-ticks"]
title = "Vinkjes voor afgeleverd en gelezen"
text = """
Mail die je hebt verstuurd toont nu vinkjes naast elke ontvanger. Eén
grijs vinkje betekent dat hun mailserver het heeft aangenomen: volgens
een ontvangstbevestiging, of, waar je maildienst die niet stuurt
(Gmail), als er binnen een half uur geen bounce terugkwam. Twee vinkjes
in je accentkleur betekenen dat ze het hebben gelezen, volgens een
leesbevestiging of het volgen van openen, en een waarschuwing betekent
dat het is teruggestuurd. Wijs een vinkje aan om te zien wanneer en hoe.
Bevestigingsmails blijven in je mailbox onder Updates, zonder melding.
"""

["2026-09-28-0143-gmail-new-mail-notifications"]
title = "Meldingen voor nieuwe Gmail-mail"
text = """
Nieuwe mail in een Gmail-inbox geeft nu weer een melding. Katna miste
eerder mail die Gmail een moment vóór de inbox in Alle berichten had
gezet.
"""

["2026-09-28-0156-attachment-types"]
title = "Zoeken op type bijlage"
text = """
In Zoekopties biedt ‘Heeft bijlage’ nu PDF, XLSX, ODF, XLS, ODS, PPT en
PPTX, en Aangepast voor elke andere extensie, zoals png of avif. Alleen
e-mail met een bijlage van een gekozen type wordt getoond.
"""

["2026-09-28-0106-original-colors"]
title = "Originele kleuren in een donker thema"
text = """
In een donker thema wordt e-mail met eigen kleuren in donkere kleuren
getoond. De nieuwe knop met de halve cirkel in de werkbalk van het
leesvenster laat hem zien in de originele kleuren van de afzender, en
weer terug.
"""

["2026-09-28-0127-print-as-shown"]
title = "Afdrukken houdt de opmaak"
text = """
E-mail wordt afgedrukt zoals hij in het leesvenster te zien is, met zijn
tabellen, kleuren, randen, lijsten en afbeeldingen. Het afdrukvoorbeeld
kan achtergrondkleuren weglaten om inkt te sparen, of met Alleen tekst
alleen de tekst afdrukken.
"""

["2026-09-28-0141-ask-before-deleting"]
title = "Vragen voor het verwijderen"
text = """
Als je meerdere gesprekken tegelijk verwijdert, wordt nu eerst gevraagd
of ze naar de Prullenbak mogen. Vink ‘Niet meer vragen’ aan om de vraag
over te slaan, of zet hem weer aan bij Instellingen > Algemeen.
Definitief verwijderen, in de Prullenbak, vraagt altijd.
"""

["2026-09-28-0019-katna-for-windows"]
title = "Katna voor Windows"
text = """
Katna Mail draait nu ook op Windows 10 en 11, geïnstalleerd met een eigen
Katna Setup, met het pictogram in het systeemvak, meldingen, starten bij
aanmelden en maillinks die in Katna openen.
"""

["2026-09-28-0236-chip-remove-always"]
title = "Verwijderknop op elk adres"
text = """
Elk adres in Aan, Cc en Bcc toont nu altijd zijn x, zodat je het kunt
verwijderen zonder er eerst naar te wijzen.
"""

["2026-09-28-0244-pill-format-bar"]
title = "Een rondere opmaakbalk"
text = """
De opmaakbalk bij het opstellen (Aa) heeft nu de vorm van een pil met een
vage rand, zodat hij in lichte en donkere thema's loskomt van je tekst.
"""

["2026-09-28-0325-long-threads-smooth"]
title = "Lange e-mailreeksen openen snel"
text = """
Opgemaakte e-mail die veel eerdere antwoorden citeert, zoals een lange reeks
citaten, opent nu meteen en scrolt soepel in plaats van het hele venster te
vertragen.
"""

["2026-09-28-0830-who-has-seen-it"]
title = "Wie het heeft gezien, achter een oog"
text = """
Verzonden e-mail met volgen heeft er geen blok met regels meer boven. Een
oog naast de ster krijgt je accentkleur zodra iemand het bericht opent; wijs
het aan om te zien wie het heeft geopend of een link heeft gevolgd, en
wanneer.
"""

["2026-09-28-0831-contact-call-copy"]
title = "Bellen en kopiëren vanuit de contactgegevens"
text = """
Klik in de contactgegevens naast een gesprek op een telefoonnummer om het te
bellen met je telefoon-app of KDE Connect, of gebruik de kopieerknop
ernaast. Alle tekst in het paneel kan nu ook geselecteerd en gekopieerd
worden.
"""

["2026-09-28-0848-quoted-text-hide-remove"]
title = "Geciteerde e-mail in een antwoord verbergen of verwijderen"
text = """
De knop "..." onder een antwoord verbergt de geciteerde e-mail nu weer nadat
je hem hebt geopend. Wijs hem aan en klik op de x op de hoek om de
geciteerde e-mail uit je antwoord te halen; Ongedaan maken of Ctrl+Z zet hem
terug. De werkbalk van het antwoord blijft ook op zijn plaats terwijl je
scrolt.
"""

["2026-09-28-0854-floating-folders"]
title = "Zwevende mappen en een bredere zoekbalk"
text = """
Zijn de mappen verborgen, dan opent rusten op Opstellen of E-mail ze als een
paneel dat los van de randen staat, met een kleine punt die naar de knop
wijst. Het zoekvak groeit in de ruimte die de mappen vrijlaten, en klikken
op de map waarin je al zit laat de lijst niet meer knipperen.
"""

["2026-09-28-0928-search-address-suggestions"]
title = "Adressuggesties in Zoekopties"
text = """
Van en Aan in Zoekopties stellen nu adressen voor terwijl je typt, net zoals
Aan, Cc en Bcc bij het opstellen. Kies er een met Enter, Tab of een klik.
"""

["2026-09-28-0935-app-menu-reply-all-window"]
title = "Hoofdmenu in de accountkaart, Allen beantwoorden in een eigen venster"
text = """
De accountkaart heeft een ☰-knop naast Accounts beheren. Die opent dezelfde
menu's Bestand, Bewerken, Beeld, Ga, Bericht, Instellingen en Help als het
globale menu van de desktop, voor desktops die er geen tonen. Allen
beantwoorden in een melding van nieuwe e-mail opent het gesprek nu in een
eigen venster, klaar om te typen, en laat het hoofdvenster waar het is.
"""

["2026-09-28-1011-tray-brings-window-forward"]
title = "Klikken op het systeemvak en op meldingen halen Katna Mail naar voren"
text = """
Klikken op het pictogram in het systeemvak, of op Inbox openen, Nieuw
bericht of Instellingen in het menu ervan, haalt het venster van Katna Mail
nu naar voren op Wayland, ook als het geminimaliseerd was of achter andere
vensters lag. Klikken op een melding van nieuwe e-mail opent die e-mail, ook
als de lijst van de Inbox hem niet toont.
"""

["2026-09-28-1053-send-countdown-reply-in-place"]
title = "Verzenden telt af, en je antwoord blijft in het gesprek"
text = """
Na Verzenden telt een krimpende ring naast Ongedaan maken de tijd om
ongedaan te maken af, en daarna toont de melding Bericht verzonden (met een
kort geluid) zodra de e-mail weg is. Het geluid kun je uitzetten in
Instellingen > Algemeen > Verzenden. Een antwoord dat je in een gesprek
schrijft, wordt een bericht precies waar je het schreef. De kop toont alleen
aan wie het gaat; klik erop voor Van, Aan, Cc en Bcc. De pijl naast het
antwoordpictogram wisselt tussen Beantwoorden, Allen beantwoorden en
Doorsturen, en houdt vast wat je schreef.
"""

["2026-09-28-1110-search-options-narrow"]
title = "Zoekopties passen in smalle vensters"
text = """
In een smal of laag venster worden de Zoekopties nu zo breed als de ruimte
toelaat, staan de labels op een telefoon boven hun velden en scrollen ze als
ze niet passen, zodat de knop Zoeken altijd binnen bereik is.
"""

["2026-09-28-1119-replies-from-right-account"]
title = "Antwoorden gaan uit van het juiste account"
text = """
Met Beantwoorden of Doorsturen bij een e-mail die je opent vanuit de
Gecombineerde inbox of vanuit zoeken, gaat het bericht nu uit vanaf het
account waar de e-mail binnenkwam, niet vanaf het account dat onder je
profielfoto is gekozen.
"""

["2026-09-28-1436-calmer-search-box"]
title = "Zoeken toont zijn sneltoets"
text = """
Het zoekvak toont zijn sneltoets naast ‘Zoeken in e-mail’, zoals ingesteld
in Instellingen > Sneltoetsen. Klik je erin, dan houdt het zijn kleur en
toont het een vage rand in plaats van donkerder te worden met een schaduw.
De mappen die boven de lijst zweven, blijven nu ook vrij van de onderrand.
"""

["2026-09-28-1450-clear-activity"]
title = "Ruim Activiteit op"
text = """
Wijs in Activiteit iets aan dat geopend of aangeklikt is en druk op × om
het uit de lijst te halen, of druk op Alles wissen om opnieuw te beginnen.
Wat nieuw geopend of aangeklikt wordt, verschijnt nog steeds, en het
overzicht Details telt nog steeds alles.
"""

["2026-09-28-1541-round-logo"]
title = "Katna’s nieuwe ronde logo"
text = """
Katna heeft een nieuw logo: een cursieve k op een blauwgroene cirkel, in het
appmenu, de bovenbalk en de taakbalk. Het systeemvak toont het in één kleur
die bij je paneel past, en Over Katna en de welkomstpagina tonen ‘katna
mail’ voluit.
"""

["2026-09-28-1546-contact-cards"]
title = "Overzichtelijkere contactgegevens"
text = """
De contactgegevens tonen nu elk onderdeel in een eigen zachte kaart, met
ronde knoppen onder de naam om de persoon te mailen, je mail met hen te
vinden of te bellen. Recente gesprekken toont de laatste paar; druk op Meer
om de rest te zien en op Minder om ze weer in te klappen.
"""

["2026-09-28-1507-reply-box-recipients"]
title = "Een opgeruimder antwoordvak"
text = """
Ontvangers tonen nu met hun foto, en Cc en Bcc staan samen in één kleine
knop. Het openen van de ontvangers van een antwoord laat het vak soepel
omhoog groeien, en het geciteerde bericht opent en sluit soepel onder een
golvende lijn waarop je kunt klikken om het weer in te klappen.
"""

["2026-09-28-1620-softer-window-shadow"]
title = "Een zachtere vensterschaduw en KDE-grote knoppen"
text = """
Met het Katna-vensterkader is de schaduw rond het venster strakker en
vervaagt volledig, zonder de harde rand die hij vroeger naast het venster
achterliet. De vensterknoppen hebben nu dezelfde grootte als die van KDE,
en houden evenveel afstand tot de zijkant van het venster als tot de
bovenkant.
"""

["2026-09-28-1622-update-from-the-app"]
title = "Werk Katna vanuit de app bij"
text = """
Katna downloadt nu zelf nieuwe versies en laat het weten zodra er een
klaarstaat. Druk op Bijwerken in de melding of in Over Katna: Katna Mail
laat weten dat het herstart, vraagt om je wachtwoord, installeert de update
en opent opnieuw waar je gebleven was. Instellingen > Algemeen > Updates
schakelt het automatisch downloaden uit.
"""

["2026-09-28-1520-track-sealed-and-plain"]
title = "Volgen van ondertekende, versleutelde en platte-tekst-e-mail"
text = """
Het oog werkt nu ook bij ondertekende en versleutelde e-mail: de kopie van
elke ontvanger wordt afzonderlijk ondertekend of versleuteld, zodat
handtekeningen geldig blijven. E-mail in platte tekst kan geen openingen
tonen, maar de links erin worden wel gevolgd, zodat je ziet wanneer iemand
er een volgt.
"""

["2026-09-28-1834-reply-after-closed-window"]
title = "Beantwoorden begint opnieuw na het sluiten van een berichtvenster"
text = """
Als u een bericht sluit dat in een eigen venster is geschreven, blijft het
nu in Concepten staan, en Beantwoorden, Allen beantwoorden en Doorsturen
openen weer een nieuw bericht in plaats van het oude terug te halen.
"""

["2026-09-28-1852-frosted-search-bar"]
title = "Een bevroren zoekbalk"
text = """
Met de wazige achtergrond aan laat de zoekbalk de vervaging door, net als de
balk eromheen, in plaats van als een effen grijze pil erop te liggen.
"""

["2026-09-28-1906-scroll-to-switch-accounts"]
title = "Scroll over uw afbeelding om van account te wisselen"
text = """
Houd de aanwijzer boven de accountafbeelding rechtsboven en draai aan het
muiswiel om naar het volgende of vorige account te gaan, één account per
klik. De afbeelding rolt naar het nieuwe account, zoals de naam van de app
rolt als u van app wisselt, en een account kiezen op de kaart laat hem op
dezelfde manier rollen.
"""

["2026-09-28-1918-many-recipients"]
title = "Ruimte voor veel ontvangers"
text = """
Ontvangers na de eerste regel gebruiken nu de volle breedte, en een lange
lijst scrolt binnen enkele regels, zodat het bericht zelf altijd binnen
bereik blijft. Verlaat u het veld, dan klapt het in tot één regel, zoals
"Kay, Sam, 19 meer"; klik erop om ze weer allemaal te zien.
"""

["2026-09-28-1952-activity-by-account"]
title = "Activiteitenrapport voor één account"
text = """
Het activiteitenrapport heeft nu een accountkiezer naast de datums. Kies
Alle accounts of één ervan, en de gevolgde berichten, percentages, de
grafiek, de onderwerpregels en Je mailbox volgen je keuze. Het rapport
zegt welk account het toont en onthoudt je keuze.
"""

["2026-09-28-2002-reader-arrows-always-shown"]
title = "Nieuwer en Ouder altijd in de werkbalk"
text = """
Hoe smal het leesvenster ook is, de teller en de pijlen Nieuwer en Ouder
blijven rechts in de werkbalk staan. De knoppen die je het minst gebruikt
verhuizen in plaats daarvan één voor één naar het menu Meer, inclusief de
schakelaars voor contactgegevens en originele kleuren.
"""

["2026-09-28-2026-large-files-drive"]
title = "Verstuur bestanden van elke grootte"
text = """
Met een account dat met Google is aangemeld gaat een bestand boven de
mailgrens van 25 MB direct na het bijvoegen naar je Google Drive, en het
bericht bevat de link, net als in Gmail. Het wordt met je ontvangers
gedeeld als je op Verzenden drukt; Katna vraagt alleen iets als iemand
geen toegang kan krijgen.
"""

["2026-09-28-2059-recipient-list-scrolling"]
title = "Soepelere lange ontvangerslijsten"
text = """
Een lange lijst met ontvangers heeft nu een eigen schuifbalk en schuift
regel voor regel; het gesprek scrolt pas verder als de lijst het einde
bereikt. Als je ontvangers toevoegt, springen de knoppen eronder niet
meer.
"""

["2026-09-28-2106-check-for-new-mail"]
title = "Controleren op nieuwe e-mail"
text = """
Klik met de rechtermuisknop op een map of account in het mappenpaneel
voor ‘Controleren op nieuwe e-mail’, ‘Alles markeren als gelezen’, een
nieuwe map erin of ‘Prullenbak legen’. ‘Vernieuwen’ boven de lijst haalt
nu ook gegevens van de server op. Terwijl Katna controleert, draaien de
pijlen op ‘Vernieuwen’ en naast Inbox, en bovenaan staat ‘Controleren op
nieuwe e-mail…’ als het langer dan even duurt.
"""

["2026-09-28-2101-large-files-onedrive"]
title = "Grote bestanden via OneDrive"
text = """
Outlook.com, Hotmail en andere Microsoft-accounts versturen bestanden
boven de mailgrens nu net als Google-accounts: het bestand gaat direct
na het bijvoegen naar je OneDrive, en het bericht bevat de link, net als
in Outlook.
"""

["2026-09-28-2108-activity-checking"]
title = "Geen Aanmelden-flits meer in Activiteit"
text = """
Direct na het starten van Katna toont Activiteit een dunne laadbalk
