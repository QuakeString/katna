Druk op Ctrl+4 of kies links Taken: alle lijsten naast elkaar zoals in
Google Tasks, met subtaken, sterren, vervaldagen, herhalingen en
details. Lijsten worden gesynchroniseerd met Google Tasks en Microsoft
To Do, en taken van de bureaubladklok verschijnen hier ook.
"""

["2026-09-29-0352-contacts"]
title = "Je contacten, uit elk account"
text = """
Contacten in de balk links toont nu de mensen die zijn opgeslagen in je
Gmail- en Outlook-accounts en op CardDAV-servers, elk één keer, ook als
