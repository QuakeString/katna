"""

["2026-10-02-0740-smaller-updates"]
title = "Kleinere updates"
text = """
Updates downloaden nu alleen wat er veranderd is, meestal een paar
megabyte in plaats van het hele pakket. Katna bouwt de nieuwe versie uit
de versie die je hebt en controleert die voor de installatie, en
downloadt het volledige pakket als dat niet lukt.
