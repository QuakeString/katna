een gewoon e-mailpictogram lijkt.
"""

["2026-10-02-0452-fainter-pane-lines"]
title = "Rustigere werkbalken en tabbladen"
text = """
In de lichte modus zijn de lijnen onder de werkbalken en de kop van de
open e-mail, en boven Beantwoorden en Doorsturen, even vaag als de lijnen
