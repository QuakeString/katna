["2026-09-27-1651-desktop-search"]
title = "Encontre e-mails pelo KRunner e pela pesquisa do GNOME"
text = """
Digite um nome no KRunner (Alt+Space) ou na pesquisa de Atividades para
escrever para essa pessoa, copiar o endereço dela ou encontrar os e-mails
dela. As mensagens aparecem quando o assunto ou o remetente tem todas as
palavras digitadas; comece com mail: para pesquisar todos os seus e-mails,
como na caixa de pesquisa do Katna Mail.
"""

["2026-09-27-1727-mail-templates"]
title = "Modelos para os e-mails que você escreve sempre"
text = """
Escreva uma mensagem uma vez e salve-a com o novo botão Modelos ao escrever,
depois coloque-a em qualquer e-mail novo ou resposta com um clique. Escreva
{first name}, {name} ou {my name} e o Katna preenche para cada destinatário.
Edite, renomeie ou exclua modelos em Configurações > Escrever.
"""

["2026-09-27-1724-server-send-later"]
title = "E-mail programado sai com o computador desligado"
text = """
Quando o seu servidor de e-mail consegue segurar mensagens até um horário
definido, como o Stalwart, Programar envio agora entrega a mensagem a
ele assim que o Desfazer some, então ela sai na hora certa mesmo com
este computador desligado. O menu de programação diz se quem vai enviar
é o seu servidor de e-mail ou o Katna.
"""

["2026-09-27-1730-softer-row-hover"]
title = "Um destaque mais leve"
text = """
A linha sob o ponteiro na lista de e-mails agora se ergue com uma sombra
suave, como no Gmail, em vez de uma faixa escura embaixo dela.
"""

["2026-09-27-1745-drag-recipients"]
title = "Arraste endereços entre Para, Cc e Cco"
text = """
Arraste um chip de endereço para outro campo para movê-lo; Cc e Cco abrem
enquanto você arrasta, mesmo quando ocultos. Apontar para um chip mostra
um x que o remove.
"""

["2026-09-27-1722-katna-account"]
title = "Conta Katna"
text = """
Em Configurações > Assinatura você cria uma conta no servidor do
próprio Katna, com senha própria, nunca uma senha de e-mail. Os recursos
on-line do Katna, como confirmações de leitura e rastreamento de links,
vão precisar dela. Você vê os computadores conectados e pode desconectar
qualquer um deles.
"""

["2026-09-27-1805-reopens-as-you-left-it"]
title = "De volta onde você parou"
text = """
Ao fechar o Katna Mail e abri-lo de novo, voltam o app, a pasta e a guia
da Caixa de entrada que estavam abertos, as pastas que você tinha
expandido e se o painel de pastas estava recolhido. Sair do Katna pela
bandeja do sistema o reinicia do zero.
"""

["2026-09-27-1724-snooze-and-reminders"]
title = "Adiar e lembretes de resposta"
text = """
Adie uma conversa com o relógio na linha dela ou pelo menu do botão
direito: ela espera na pasta Adiados e volta para a Caixa de entrada, não
lida, no horário que você escolheu. Ao enviar, a seta ao lado de Enviar
pode lembrar você se ninguém responder em 1, 3 ou 7 dias. Os dois
funcionam enquanto o computador está ligado e põem tudo em dia quando ele
volta do modo de suspensão.
"""

["2026-09-27-1717-translate-mail"]
title = "Leia e-mails no seu idioma"
text = """
Uma mensagem em outro idioma agora mostra um botão Traduzir acima dela,
e Mostrar original a traz de volta. O Katna detecta o idioma no seu
computador; o texto da mensagem só vai para o servidor do próprio Katna
para ser traduzido quando você pede. Configurações > Geral > Tradução
escolhe o seu idioma e os que serão sempre traduzidos.
"""

["2026-09-27-1744-open-and-click-tracking"]
title = "Saiba quando um e-mail é aberto"
text = """
Ative o olho ao lado dos destinatários para ver quando cada um abre sua
mensagem ou acessa um link nela, ou peça uma confirmação de leitura. Os
e-mails enviados mostram quem os abriu, e uma notificação avisa você na
primeira vez. Os dois vêm desativados em toda mensagem nova, e o
rastreamento precisa de uma conta Katna (Configurações > Assinatura).
"""

["2026-09-27-2042-activity"]
title = "Atividade dos e-mails rastreados"
text = """
Atividade, ao lado da caixa de pesquisa, mostra
quantas das suas mensagens rastreadas foram abertas e
com que frequência os links delas foram acessados, com
seus assuntos em ordem de quantas vezes são abertos.
"""

["2026-09-27-2204-search-trigger-words"]
title = "Pesquise seus e-mails pelo KRunner com k"
text = """
Digite k ou m, um espaço e depois o que procura no KRunner ou na
pesquisa do GNOME para ter os mesmos resultados da caixa de pesquisa do
Katna Mail, como “k budget”. Escolha suas próprias palavras em
Configurações > Geral.
"""

["2026-09-27-2224-activity-button"]
title = "Atividade ao lado da caixa de pesquisa"
text = """
O botão Atividade, ao lado da caixa de pesquisa, conta as novas aberturas
e cliques dos seus e-mails rastreados e lista quem abriu o quê e quais
links acessou; clique em um item para abrir a mensagem. Detalhes mostra
as taxas de abertura e de cliques, as aberturas por dia e seus melhores
assuntos nos últimos 7 ou 30 dias, em todo o período ou nas datas que
você escolher. Uma mensagem enviada agora mostra quantas vezes cada
pessoa a abriu e acessou um link.
"""

["2026-09-27-2239-mailbox-insights"]
title = "Estatísticas da caixa de correio"
text = """
Atividade > Detalhes agora também mostra quantos e-mails você enviou e
recebeu no período, com que frequência e rapidez você e os outros
respondem, as pessoas com quem você mais troca e-mails e em quais dias e
horários seus e-mails chegam. Tudo é contado no seu computador, a partir
dos e-mails que o Katna já tem.
"""

["2026-09-28-0059-sign-in-with-google"]
title = "Login com Google ou Microsoft"
text = """
Adicione uma conta do Gmail ou do Outlook fazendo login na própria
página do Google ou da Microsoft no navegador, sem senha de app.
Endereços do Outlook.com e do Hotmail também funcionam agora. Se um
login parar de funcionar, um aviso na parte de baixo da janela oferece
fazer login de novo.
"""

["2026-09-28-0054-tracking-on-by-default"]
title = "Rastreamento e confirmações ativados desde o início"
text = """
Novas mensagens e respostas agora começam com o rastreamento de
aberturas e cliques, a confirmação de leitura e a confirmação de entrega
ativados; clique em um botão ao lado dos destinatários para desativar um
deles naquela mensagem. O rastreamento exige login na sua conta Katna.
Uma confirmação de entrega é um e-mail que seu servidor de e-mail envia
quando o servidor de cada destinatário recebe a mensagem; o botão fica
desativado quando seu servidor de e-mail não oferece esse recurso.
"""

["2026-09-28-0120-delivered-read-ticks"]
title = "Tiques de entregue e lido"
text = """
Os e-mails que você enviou agora mostram tiques ao lado de cada
destinatário. Um tique cinza significa que o servidor de e-mail da
pessoa o aceitou: por uma confirmação de entrega ou, quando seu serviço
de e-mail não envia uma (Gmail), quando nenhuma devolução voltou em meia
hora. Dois tiques na sua cor de destaque significam que a pessoa leu,
por uma confirmação de leitura ou pelo rastreamento de aberturas, e um
aviso significa que ele foi devolvido. Aponte para um tique para ver
quando e como. Os e-mails de confirmação ficam na sua caixa de correio
em Atualizações, sem notificação.
"""

["2026-09-28-0143-gmail-new-mail-notifications"]
title = "Notificações de novos e-mails do Gmail"
text = """
Novos e-mails em uma caixa de entrada do Gmail voltam a mostrar uma
notificação. O Katna deixava passar e-mails que o Gmail colocava em
Todos os e-mails um instante antes da caixa de entrada.
"""

["2026-09-28-0156-attachment-types"]
title = "Pesquise por tipo de anexo"
text = """
Em Opções de pesquisa, “Com anexo” agora oferece PDF, XLSX, ODF, XLS,
ODS, PPT e PPTX, e Personalizado para qualquer outra extensão, como png
ou avif. Só aparecem e-mails com um anexo de um tipo escolhido.
"""

["2026-09-28-0106-original-colors"]
title = "Cores originais em um tema escuro"
text = """
Com um tema escuro, o e-mail que define as próprias cores é mostrado em
cores escuras. O novo botão de meio círculo na barra de ferramentas do
painel de leitura o mostra nas cores originais do remetente, e de volta.
"""

["2026-09-28-0127-print-as-shown"]
title = "A impressão mantém a formatação"
text = """
O e-mail é impresso como aparece no painel de leitura, com suas tabelas,
cores, bordas, listas e imagens. A visualização de impressão pode deixar
de fora as cores de fundo para economizar tinta, ou imprimir só o texto
com Somente texto.
"""

["2026-09-28-0141-ask-before-deleting"]
title = "Perguntar antes de excluir"
text = """
Excluir várias conversas de uma vez agora pergunta primeiro se elas devem
ir para a Lixeira. Marque “Não perguntar novamente” para pular a pergunta,
ou ative-a de novo em Configurações > Geral. A exclusão permanente, na
Lixeira, sempre pergunta.
"""

["2026-09-28-0019-katna-for-windows"]
title = "Katna para Windows"
text = """
O Katna Mail agora também funciona no Windows 10 e 11, instalado pelo
próprio Katna Setup, com o ícone na bandeja do sistema, notificações, início
ao entrar na sessão e links de e-mail abrindo no Katna.
"""

["2026-09-28-0236-chip-remove-always"]
title = "Botão de remover em cada endereço"
text = """
Cada endereço em Para, Cc e Cco agora sempre mostra o seu x, para você
removê-lo sem ter que apontar para ele antes.
"""

["2026-09-28-0244-pill-format-bar"]
title = "Uma barra de formatação mais arredondada"
text = """
A barra de formatação ao escrever (Aa) agora tem forma de pílula com uma
borda suave, para se destacar do seu texto nos temas claro e escuro.
"""

["2026-09-28-0325-long-threads-smooth"]
title = "Longas sequências de e-mails abrem rápido"
text = """
E-mails formatados que citam muitas respostas anteriores, como uma longa
sequência de citações, agora abrem na hora e rolam com suavidade em vez de
deixar a janela inteira lenta.
"""

["2026-09-28-0830-who-has-seen-it"]
title = "Quem viu, atrás de um olho"
text = """
Os e-mails enviados com rastreamento não têm mais uma caixa de linhas acima
deles. Um olho ao lado da estrela fica na sua cor de destaque assim que
alguém abre o e-mail; aponte para ele para ver quem abriu ou acessou um
link, e quando.
"""

["2026-09-28-0831-contact-call-copy"]
title = "Ligar e copiar nos detalhes do contato"
text = """
Nos detalhes do contato ao lado de uma conversa, clique em um número de
telefone para ligar pelo app de telefone ou pelo KDE Connect, ou use o botão
de copiar ao lado. Todo o texto do painel agora também pode ser selecionado
e copiado.
"""

["2026-09-28-0848-quoted-text-hide-remove"]
title = "Ocultar ou remover o e-mail citado em uma resposta"
text = """
O botão "..." abaixo de uma resposta agora oculta de novo o e-mail citado
depois que você o abre. Aponte para ele e clique no x do canto para tirar o
e-mail citado da sua resposta; Desfazer ou Ctrl+Z o traz de volta. A barra
de ferramentas da resposta também fica no lugar enquanto você rola.
"""

["2026-09-28-0854-floating-folders"]
title = "Pastas flutuantes e uma pesquisa mais larga"
text = """
Com as pastas ocultas, parar o ponteiro sobre Escrever ou E-mail as abre
como um painel afastado das bordas, com uma pequena ponta apontando para o
botão. A caixa de pesquisa cresce para ocupar o espaço que as pastas deixam,
e clicar na pasta em que você já está não faz mais a lista piscar.
"""

["2026-09-28-0928-search-address-suggestions"]
title = "Sugestões de endereço em Opções de pesquisa"
text = """
De e Para em Opções de pesquisa agora sugerem endereços enquanto você
digita, do mesmo jeito que Para, Cc e Cco ao escrever. Escolha um com Enter,
Tab ou um clique.
"""

["2026-09-28-0935-app-menu-reply-all-window"]
title = "Menu principal no cartão da conta, Responder a todos em uma janela própria"
text = """
O cartão da conta tem um botão ☰ ao lado de Gerenciar contas. Ele abre os
mesmos menus Arquivo, Editar, Exibir, Ir, Mensagem, Configurações e Ajuda do
menu global da área de trabalho, para ambientes que não mostram um.
Responder a todos numa notificação de novo e-mail agora abre a conversa em
uma janela própria, pronta para digitar, e deixa a janela principal onde
está.
"""

["2026-09-28-1011-tray-brings-window-forward"]
title = "Cliques na bandeja e nas notificações trazem o Katna Mail para a frente"
text = """
Clicar no ícone da bandeja, ou em Abrir a Caixa de entrada, Nova mensagem ou
Preferências no menu dele, agora traz a janela do Katna Mail para a frente
no Wayland, mesmo quando ela estava minimizada ou atrás de outras janelas.
Clicar numa notificação de novo e-mail abre esse e-mail, mesmo que a lista
da Caixa de entrada não o mostre.
"""

["2026-09-28-1053-send-countdown-reply-in-place"]
title = "Enviar faz uma contagem regressiva, e sua resposta fica na conversa"
text = """
Depois de Enviar, um anel que encolhe faz a contagem regressiva do tempo
para desfazer ao lado de Desfazer, e então o aviso diz Mensagem enviada (com
um som curto) assim que o e-mail sai. O som pode ser desativado em
Configurações > Geral > Envio. Uma resposta escrita numa conversa vira uma
mensagem bem onde você a escreveu. O cabeçalho dela mostra só para quem ela
vai; clique nele para ver De, Para, Cc e Cco. A seta ao lado do ícone de
resposta alterna entre Responder, Responder a todos e Encaminhar, mantendo o
que você escreveu.
"""

["2026-09-28-1110-search-options-narrow"]
title = "As Opções de pesquisa cabem em janelas estreitas"
text = """
Em uma janela estreita ou baixa, as Opções de pesquisa agora ocupam a
largura disponível, colocam os rótulos acima dos campos no celular e rolam
quando não cabem, para que o botão Pesquisar esteja sempre ao alcance.
"""

["2026-09-28-1119-replies-from-right-account"]
title = "Respostas saem da conta certa"
text = """
Ao usar Responder ou Encaminhar em um e-mail aberto na Caixa de entrada
unificada ou na pesquisa, a mensagem agora sai da conta que recebeu o
e-mail, e não da conta escolhida sob sua foto de perfil.
"""

["2026-09-28-1436-calmer-search-box"]
title = "A pesquisa mostra seu atalho"
text = """
A caixa de pesquisa mostra seu atalho de teclado ao lado de “Pesquisar
e-mail”, conforme definido em Configurações > Atalhos. Ao clicar nela, ela
mantém a cor e mostra uma borda suave em vez de escurecer com uma sombra.
As pastas que flutuam sobre a lista agora também ficam afastadas da borda
inferior.
"""

["2026-09-28-1450-clear-activity"]
title = "Organize a Atividade"
text = """
Aponte para uma abertura ou um clique em Atividade e pressione × para
tirá-lo da lista, ou pressione Limpar tudo para começar do zero. Novas
aberturas e cliques continuam aparecendo, e o relatório Detalhes continua
contando tudo.
"""

["2026-09-28-1541-round-logo"]
title = "O novo logotipo redondo do Katna"
text = """
O Katna tem um novo logotipo: um k cursivo em um círculo verde-azulado, no
menu de aplicativos, na barra superior e na barra de tarefas. A bandeja
mostra o logotipo em uma cor que combina com seu painel, e Sobre o Katna e a
página de boas-vindas mostram “katna mail” por extenso.
"""

["2026-09-28-1546-contact-cards"]
title = "Detalhes do contato mais organizados"
text = """
Os detalhes do contato agora mostram cada parte em seu próprio cartão suave,
com botões redondos abaixo do nome para escrever para a pessoa, buscar seus
e-mails com ela ou ligar. Conversas recentes mostra as mais recentes;
pressione Mais para ver o resto e Menos para recolhê-las.
"""

["2026-09-28-1507-reply-box-recipients"]
title = "Uma caixa de resposta mais organizada"
text = """
Os destinatários agora aparecem com suas fotos, e Cc e Cco ficam juntos em
um botão pequeno. Abrir os destinatários de uma resposta faz a caixa
crescer para cima suavemente, e a mensagem citada abre e fecha suavemente
sob uma linha ondulada em que você pode clicar para recolhê-la de novo.
"""

["2026-09-28-1620-softer-window-shadow"]
title = "Uma sombra de janela mais suave e botões do tamanho do KDE"
text = """
Com a moldura de janela do Katna, a sombra ao redor da janela é mais
estreita e desaparece por completo, sem a borda dura que deixava antes ao
lado da janela. Os botões da janela agora têm o tamanho dos do KDE, e ficam
tão afastados da lateral da janela quanto do topo.
"""

["2026-09-28-1622-update-from-the-app"]
title = "Atualize o Katna a partir do app"
text = """
O Katna agora baixa novas versões sozinho e avisa quando uma está pronta.
Pressione Atualizar na notificação ou em Sobre o Katna: o Katna Mail avisa
que vai reiniciar, pede sua senha, instala a atualização e abre de novo de
onde você parou. Configurações > Geral > Atualizações desativa o download
automático.
"""

["2026-09-28-1520-track-sealed-and-plain"]
title = "Rastreamento de e-mails assinados, criptografados e em texto simples"
text = """
O olho agora também funciona em e-mails assinados e criptografados: a cópia
de cada destinatário é assinada ou criptografada separadamente, para que as
assinaturas continuem válidas. E-mails em texto simples não podem mostrar
aberturas, mas seus links são rastreados, para que você veja quando alguém
acessa um.
"""

["2026-09-28-1834-reply-after-closed-window"]
title = "Responder recomeça do zero depois de fechar a janela de uma mensagem"
text = """
Fechar uma mensagem escrita em sua própria janela agora a mantém em
Rascunhos, e Responder, Responder a todos e Encaminhar voltam a abrir uma
mensagem nova em vez de trazer a antiga de volta.
"""

["2026-09-28-1852-frosted-search-bar"]
title = "Uma barra de pesquisa fosca"
text = """
Com o fundo desfocado ativado, a barra de pesquisa deixa o desfoque passar
como a barra ao redor dela, em vez de ficar por cima como uma pílula cinza
sólida.
"""

["2026-09-28-1906-scroll-to-switch-accounts"]
title = "Role sobre a sua imagem para trocar de conta"
text = """
Com o ponteiro sobre a imagem da conta, no canto superior direito, gire a
roda do mouse para ir à conta seguinte ou anterior, uma conta por clique. A
imagem rola até a nova conta, como o nome do app rola quando você troca de
app, e escolher uma conta no cartão a faz rolar do mesmo jeito.
"""

["2026-09-28-1918-many-recipients"]
title = "Espaço para muitos destinatários"
text = """
Os destinatários depois da primeira linha agora usam toda a largura, e uma
lista longa rola dentro de poucas linhas, de modo que a própria mensagem
sempre fica ao alcance. Saia do campo e ele se recolhe em uma linha, como
"Kay, Sam, mais 19"; clique nele para ver todos de novo.
"""
