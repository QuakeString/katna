ditt schema, och Katna följer Windows accentfärg.
"""

["2026-10-01-0329-mute-folders"]
title = "Tysta en mapp, en flik eller ett konto"
text = """
Klockan över listan tystar den öppna mappen eller inkorgsfliken i en
timme, till i morgon bitti eller tills du slår på den igen. Högerklicka
