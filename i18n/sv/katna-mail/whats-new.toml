"""

["2026-09-27-1651-desktop-search"]
title = "Hitta e-post från KRunner och GNOME-sökningen"
text = """
Skriv ett namn i KRunner (Alt+Space) eller sökningen i Aktiviteter för att
skriva till den personen, kopiera adressen eller hitta mejlen. Meddelanden
visas när ämnet eller avsändaren innehåller varje ord du skriver; börja med
mail: för att söka i all din e-post, som i Katna Mails sökruta.
"""

["2026-09-27-1727-mail-templates"]
title = "Mallar för mejl du ofta skriver"
text = """
Skriv ett meddelande en gång och spara det med den nya knappen Mallar när du
skriver, och lägg sedan in det i vilket nytt mejl eller svar som helst med ett
klick. Skriv {first name}, {name} eller {my name} så fyller Katna i dem för
varje mottagare. Redigera, byt namn på eller radera mallar i
Inställningar > Skriva.
"""

["2026-09-27-1724-server-send-later"]
title = "Schemalagda mejl går iväg även när datorn är avstängd"
text = """
När din e-postserver kan hålla kvar mejl till en bestämd tid, som
Stalwart kan, lämnar Schemalägg nu över meddelandet till den så snart
Ångra har försvunnit, så att det går iväg i tid även när den här datorn
är avstängd. Schemaläggningsmenyn visar om din e-postserver eller Katna
skickar det.
"""

["2026-09-27-1730-softer-row-hover"]
title = "En lättare hovring"
text = """
Raden under pekaren i mejllistan lyfts nu med en svag skugga, som i
Gmail, i stället för ett mörkt band under den.
"""

["2026-09-27-1745-drag-recipients"]
title = "Dra adresser mellan Till, Kopia och Dold kopia"
text = """
Dra en adressbricka till ett annat fält för att flytta den; Kopia och Dold
kopia öppnas medan du drar, även när de är dolda. När du pekar på en
bricka visas ett x som tar bort den.
"""

["2026-09-27-1722-katna-account"]
title = "Katna-konto"
text = """
Under Inställningar > Abonnemang kan du skapa ett konto på Katnas egen
server, med ett eget lösenord, aldrig ett e-postlösenord. Katnas
onlinefunktioner, som läskvitton och länkspårning, kommer att behöva
det. Du ser vilka datorer som är inloggade och kan logga ut vilken som
helst av dem.
"""

["2026-09-27-1805-reopens-as-you-left-it"]
title = "Tillbaka där du var"
text = """
När du stänger Katna Mail och öppnar det igen kommer appen, mappen och
inkorgsfliken du hade öppna tillbaka, liksom mapparna du hade fällt ut
och om mappfönstret var hopfällt. Avslutar du Katna från systemfältet
startar det från början.
"""

["2026-09-27-1724-snooze-and-reminders"]
title = "Snooza och påminnelser om svar"
text = """
Snooza en konversation med klockan på dess rad eller från
högerklicksmenyn: den väntar i mappen Snoozade och kommer tillbaka till
Inkorgen, oläst, vid den tid du valde. När du skickar kan pilen bredvid
Skicka påminna dig om ingen svarar inom 1, 3 eller 7 dagar. Båda fungerar
medan datorn är på och tar igen det som missats när den vaknar.
"""

["2026-09-27-1717-translate-mail"]
title = "Läs e-post på ditt språk"
text = """
Ett meddelande på ett annat språk visar nu en Översätt-knapp ovanför,
och Visa original tar tillbaka det. Katna känner igen språket på din
dator; bara när du ber om det skickas meddelandets text till Katnas egen
server för att översättas. Inställningar > Allmänt > Översättning väljer
ditt språk och de språk som alltid ska översättas.
"""

["2026-09-27-1744-open-and-click-tracking"]
title = "Se när e-post öppnas"
text = """
Slå på ögat vid mottagarna för att se när var och en öppnar ditt
meddelande eller följer en länk i det, eller be om ett läskvitto i
stället. Skickad e-post visar vem som har öppnat den, och en avisering
berättar det första gången. Båda är av för varje nytt meddelande, och
spårning kräver ett Katna-konto (Inställningar > Abonnemang).
"""

["2026-09-27-2042-activity"]
title = "Aktivitet för spårad e-post"
text = """
Aktivitet bredvid sökrutan visar hur många av dina spårade meddelanden
som har öppnats och hur ofta deras länkar har följts, med dina
ämnesrader rangordnade efter hur ofta de öppnas.
"""

["2026-09-27-2204-search-trigger-words"]
title = "Sök i din e-post från KRunner med k"
text = """
Skriv k eller m, ett mellanslag och sedan det du letar efter i KRunner
eller GNOME-sökningen för att få samma resultat som i sökrutan i
Katna Mail, till exempel ”k budget”. Välj dina egna ord under
Inställningar > Allmänt.
"""

["2026-09-27-2224-activity-button"]
title = "Aktivitet bredvid sökrutan"
text = """
Knappen Aktivitet bredvid sökrutan räknar nya öppningar och klick i din
spårade e-post och listar vem som öppnade vad och vilka länkar de
följde; klicka på en för att öppna meddelandet. Detaljer visar
öppnings- och klickfrekvens, öppningar per dag och dina bästa ämnesrader
för de senaste 7 eller 30 dagarna, all tid eller datum du väljer. Ett
skickat meddelande visar nu hur många gånger varje person har öppnat det
och följt en länk.
"""

["2026-09-27-2239-mailbox-insights"]
title = "Insikter om brevlådan"
text = """
Aktivitet > Detaljer visar nu också hur mycket e-post du skickade och
tog emot under perioden, hur ofta och hur snabbt du och andra svarar,
vilka du skriver mest med och vilka dagar och timmar din e-post kommer
in. Det räknas på din dator från den e-post som Katna redan har.
"""

["2026-09-28-0059-sign-in-with-google"]
title = "Logga in med Google eller Microsoft"
text = """
Lägg till ett Gmail- eller Outlook-konto genom att logga in på Googles
eller Microsofts egen sida i webbläsaren, utan applösenord. Adresser på
Outlook.com och Hotmail fungerar nu också. Om en inloggning slutar
fungera erbjuder en notis längst ned i fönstret att logga in igen.
"""

["2026-09-28-0054-tracking-on-by-default"]
title = "Spårning och kvitton på från början"
text = """
Nya meddelanden och svar börjar nu med spårning av öppningar och klick,
läskvitto och leveranskvitto påslagna; klicka på en knapp bredvid
mottagarna för att stänga av något av dem för det meddelandet. Spårning
kräver att du är inloggad på ditt Katna-konto. Ett leveranskvitto är ett
mejl som din e-postserver skickar dig när varje mottagares server tar
emot meddelandet; knappen är nedtonad där din e-postserver inte erbjuder
dem.
"""

["2026-09-28-0120-delivered-read-ticks"]
title = "Bockar för levererat och läst"
text = """
Mejl du har skickat visar nu bockar bredvid varje mottagare. En grå bock
betyder att deras e-postserver tog emot det: från ett leveranskvitto,
eller, där din e-posttjänst inte skickar några (Gmail), när ingen studs
kom tillbaka inom en halvtimme. Två bockar i din accentfärg betyder att
de har läst det, från ett läskvitto eller spårning av öppningar, och en
varning betyder att det studsade. Peka på en bock för att se när och
hur. Kvittomejl stannar i din brevlåda under Uppdateringar, utan
avisering.
"""

["2026-09-28-0143-gmail-new-mail-notifications"]
title = "Aviseringar för ny Gmail-post"
text = """
Ny post i en Gmail-inkorg visar nu en avisering igen. Katna missade
tidigare post som Gmail lade i Alla mail en stund före inkorgen.
"""

["2026-09-28-0156-attachment-types"]
title = "Sök efter typ av bilaga"
text = """
I Sökalternativ erbjuder ”Har bilaga” nu PDF, XLSX, ODF, XLS, ODS, PPT
och PPTX, och Anpassat för alla andra filtillägg, till exempel png eller
avif. Bara e-post med en bilaga av en vald typ visas.
"""

["2026-09-28-0106-original-colors"]
title = "Originalfärger i ett mörkt tema"
text = """
I ett mörkt tema visas e-post som har egna färger i mörka färger. Den
nya halvcirkelknappen i läsrutans verktygsfält visar den i avsändarens
originalfärger, och tillbaka igen.
"""

["2026-09-28-0127-print-as-shown"]
title = "Utskriften behåller formateringen"
text = """
E-post skrivs ut som den ser ut i läsrutan, med sina tabeller, färger,
kanter, listor och bilder. Förhandsgranskningen kan utesluta
bakgrundsfärger för att spara bläck, eller skriva ut enbart texten med
Endast text.
"""

["2026-09-28-0141-ask-before-deleting"]
title = "Fråga innan radering"
text = """
När flera konversationer raderas samtidigt frågar Katna Mail nu först om
de ska flyttas till papperskorgen. Kryssa i ”Fråga inte igen” för att
hoppa över frågan, eller slå på den igen under Inställningar > Allmänt.
Permanent radering, i papperskorgen, frågar alltid.
"""

["2026-09-28-0019-katna-for-windows"]
title = "Katna för Windows"
text = """
Katna Mail körs nu även på Windows 10 och 11, installerat med sitt eget
Katna Setup, med ikonen i meddelandefältet, aviseringar, start vid
inloggning och e-postlänkar som öppnas i Katna.
"""

["2026-09-28-0236-chip-remove-always"]
title = "Ta bort-knapp på varje adress"
text = """
Varje adress i Till, Kopia och Dold kopia visar nu alltid sitt x, så att du
kan ta bort den utan att först peka på den.
"""

["2026-09-28-0244-pill-format-bar"]
title = "Ett rundare formateringsfält"
text = """
Formateringsfältet när du skriver (Aa) är nu format som ett piller med en
svag kant, så att det skiljer sig från din text i både ljust och mörkt tema.
"""

["2026-09-28-0325-long-threads-smooth"]
title = "Långa mejltrådar öppnas snabbt"
text = """
Formaterade mejl som citerar många tidigare svar, som en lång citattråd,
öppnas nu direkt och rullar mjukt i stället för att göra hela fönstret
långsamt.
"""

["2026-09-28-0830-who-has-seen-it"]
title = "Vem som har sett det, bakom ett öga"
text = """
Mejl du har skickat med spårning har inte längre en ruta med rader ovanför.
Ett öga bredvid stjärnan får din accentfärg så fort någon öppnar mejlet;
peka på ögat för att se vem som öppnade det eller följde en länk, och när.
"""

["2026-09-28-0831-contact-call-copy"]
title = "Ring och kopiera från kontaktuppgifterna"
text = """
I kontaktuppgifterna bredvid en konversation klickar du på ett telefonnummer
för att ringa det med din telefonapp eller KDE Connect, eller använder
kopieringsknappen bredvid. All text i panelen kan nu också markeras och
kopieras.
"""

["2026-09-28-0848-quoted-text-hide-remove"]
title = "Dölj eller ta bort det citerade mejlet i ett svar"
text = """
Knappen "..." under ett svar döljer nu det citerade mejlet igen när du har
öppnat det. Peka på knappen och klicka på x:et i hörnet för att ta bort det
citerade mejlet ur ditt svar; Ångra eller Ctrl+Z lägger tillbaka det.
Svarets verktygsfält stannar också kvar medan du rullar.
"""

["2026-09-28-0854-floating-folders"]
title = "Svävande mappar och en bredare sökning"
text = """
När mapparna är dolda öppnas de som en panel fri från kanterna när du vilar
pekaren på Skriv eller E-post, med en liten spets som pekar mot knappen.
Sökrutan växer och fyller utrymmet som mapparna lämnar, och ett klick på
mappen du redan är i får inte längre listan att blinka.
"""

["2026-09-28-0928-search-address-suggestions"]
title = "Adressförslag i Sökalternativ"
text = """
Från och Till i Sökalternativ föreslår nu adresser medan du skriver, på
samma sätt som Till, Kopia och Dold kopia när du skriver ett mejl. Välj en
med Enter, Tab eller ett klick.
"""

["2026-09-28-0935-app-menu-reply-all-window"]
title = "Huvudmeny i kontokortet, Svara alla i ett eget fönster"
text = """
Kontokortet har en ☰-knapp bredvid Hantera konton. Den öppnar samma menyer
Arkiv, Redigera, Visa, Gå, Meddelande, Inställningar och Hjälp som
skrivbordets globala meny, för skrivbord som inte visar någon. Svara alla i
en avisering om nytt mejl öppnar nu konversationen i ett eget fönster, redo
att skriva i, och låter huvudfönstret stanna där det är.
"""

["2026-09-28-1011-tray-brings-window-forward"]
title = "Klick i systemfältet och på aviseringar tar fram Katna Mail"
text = """
Ett klick på ikonen i systemfältet, eller på Öppna Inkorgen, Nytt meddelande
eller Inställningar i dess meny, lägger nu Katna Mail-fönstret överst på
Wayland, även när det var minimerat eller bakom andra fönster. Ett klick på
en avisering om nytt mejl öppnar det mejlet, även när listan i Inkorgen inte
visar det.
"""

["2026-09-28-1053-send-countdown-reply-in-place"]
title = "Skicka räknar ner, och ditt svar stannar i konversationen"
text = """
Efter Skicka räknar en krympande ring ner tiden för att ångra bredvid Ångra,
och sedan visar notisen längst ner Meddelandet har skickats (med ett kort
ljud) när mejlet har gått iväg. Ljudet kan stängas av i Inställningar >
Allmänt > Skicka. Ett svar som du skriver i en konversation blir ett
meddelande precis där du skrev det. Dess huvud visar bara vem det går till;
klicka på det för Från, Till, Kopia och Dold kopia. Pilen bredvid
svarsikonen växlar mellan Svara, Svara alla och Vidarebefordra och behåller
det du har skrivit.
"""

["2026-09-28-1110-search-options-narrow"]
title = "Sökalternativ får plats i smala fönster"
text = """
I ett smalt eller lågt fönster blir Sökalternativ nu så breda som utrymmet
tillåter, lägger etiketterna ovanför fälten på en telefon och rullar när de
inte får plats, så att knappen Sök alltid finns inom räckhåll.
"""

["2026-09-28-1119-replies-from-right-account"]
title = "Svar skickas från rätt konto"
text = """
Med Svara eller Vidarebefordra på e-post som du har öppnat från Gemensam
inkorg eller från sökningen skickas meddelandet nu från kontot som e-posten
kom till, inte från kontot som är valt under din profilbild.
"""

["2026-09-28-1436-calmer-search-box"]
title = "Sökningen visar sitt kortkommando"
text = """
Sökrutan visar sitt kortkommando bredvid ”Sök i e-post”, enligt
inställningen i Inställningar > Kortkommandon. När du klickar i den
behåller den sin färg och visar en svag kant i stället för att bli mörkare
med en skugga. Mapparna som svävar över listan håller sig nu också fria
från nederkanten.
"""

["2026-09-28-1450-clear-activity"]
title = "Städa i Aktivitet"
text = """
Peka på en öppning eller ett klick i Aktivitet och tryck på × för att ta
bort det från listan, eller tryck på Rensa allt för att börja om. Nya
öppningar och klick visas fortfarande, och rapporten Detaljer räknar
fortfarande med allt.
"""

["2026-09-28-1541-round-logo"]
title = "Katnas nya runda logotyp"
text = """
Katna har en ny logotyp: ett kursivt k på en blågrön cirkel, i programmenyn,
den övre raden och aktivitetsfältet. Systemfältet visar den i en färg som
passar din panel, och Om Katna och välkomstsidan visar ”katna mail” fullt
ut.
"""

["2026-09-28-1546-contact-cards"]
title = "Tydligare kontaktuppgifter"
text = """
Kontaktuppgifterna visar nu varje del i ett eget mjukt kort, med runda
knappar under namnet för att skriva till personen, hitta din e-post med dem
eller ringa. Senaste konversationer visar de senaste; tryck på Mer för att
se resten och på Mindre för att fälla ihop dem.
"""

["2026-09-28-1507-reply-box-recipients"]
title = "En snyggare svarsruta"
text = """
Mottagare visas nu med sina bilder, och Kopia och Dold kopia ligger
tillsammans i en liten knapp. Att öppna mottagarna för ett svar gör att
rutan mjukt växer uppåt, och det citerade meddelandet öppnas och stängs
mjukt under en vågig linje som du kan klicka på för att fälla ihop det
igen.
"""

["2026-09-28-1620-softer-window-shadow"]
title = "En mjukare fönsterskugga och knappar i KDE-storlek"
text = """
Med Katnas fönsterram är skuggan runt fönstret smalare och tonas bort
helt, utan den hårda kant den tidigare lämnade bredvid fönstret.
Fönsterknapparna har nu samma storlek som KDE:s egna, och håller lika
långt avstånd till fönstrets sida som till dess topp.
"""

["2026-09-28-1622-update-from-the-app"]
title = "Uppdatera Katna från appen"
text = """
Katna hämtar nu nya versioner av sig själv och säger till dig när en är
redo. Tryck på Uppdatera i aviseringen eller i Om Katna: Katna Mail
berättar att det kommer starta om, ber om ditt lösenord, installerar
uppdateringen och öppnas igen där du var. Inställningar > Allmänt >
Uppdateringar stänger av den automatiska hämtningen.
"""

["2026-09-28-1520-track-sealed-and-plain"]
title = "Spårning av signerad, krypterad och oformaterad e-post"
text = """
Ögat fungerar nu även på signerad och krypterad e-post: varje mottagares
kopia signeras eller krypteras för sig, så att signaturer förblir giltiga.
Oformaterad e-post kan inte visa öppningar, men dess länkar spåras, så du
ser när någon följer en.
"""

["2026-09-28-1834-reply-after-closed-window"]
title = "Svara börjar om efter att ett meddelandefönster stängts"
text = """
Om du stänger ett meddelande som skrivits i ett eget fönster ligger det nu
kvar i Utkast, och Svara, Svara alla och Vidarebefordra öppnar åter ett nytt
meddelande i stället för att hämta tillbaka det gamla.
"""

["2026-09-28-1852-frosted-search-bar"]
title = "Ett frostat sökfält"
text = """
När den suddiga bakgrunden är på släpper sökfältet igenom suddigheten,
precis som fältet runt omkring, i stället för att ligga ovanpå som en
enfärgad grå pill.
"""

["2026-09-28-1906-scroll-to-switch-accounts"]
title = "Rulla över din bild för att byta konto"
text = """
Håll pekaren över kontobilden uppe till höger och vrid på mushjulet för att
gå till nästa eller föregående konto, ett konto per hack. Bilden rullar till
det nya kontot, som appens namn rullar när du byter app, och när du väljer
ett konto från kortet rullar den på samma sätt.
"""

["2026-09-28-1918-many-recipients"]
title = "Plats för många mottagare"
text = """
Mottagare efter den första raden använder nu hela bredden, och en lång lista
rullar inom några få rader, så att själva meddelandet alltid finns inom
räckhåll. Lämna fältet så viks det ihop till en rad, till exempel "Kay, Sam,
19 till"; klicka på det för att se alla igen.
"""

["2026-09-28-1952-activity-by-account"]
title = "Aktivitetsrapport för ett konto"
text = """
Aktivitetsrapporten har nu en kontoväljare bredvid datumen. Välj Alla
konton eller ett av dem, så följer de spårade meddelandena,
frekvenserna, diagrammet, ämnesraderna och Din brevlåda ditt val.
Rapporten anger vilket konto den visar och minns ditt val.
"""

["2026-09-28-2002-reader-arrows-always-shown"]
title = "Nyare och Äldre alltid i verktygsfältet"
text = """
Hur smalt läsfönstret än är ligger räknaren och pilarna Nyare och Äldre
kvar till höger i dess verktygsfält. De knappar du använder minst flyttas
i stället in i menyn Mer, en i taget, även omkopplarna för
kontaktuppgifter och originalfärger.
"""

["2026-09-28-2026-large-files-drive"]
title = "Skicka filer av vilken storlek som helst"
text = """
Med ett konto som är inloggat med Google hamnar en fil över e-postgränsen
på 25 MB i din Google Drive så fort du bifogar den, och meddelandet
innehåller dess länk, som i Gmail. Den delas med mottagarna när du trycker
på Skicka; Katna frågar bara om någon inte kan få åtkomst.
"""

["2026-09-28-2059-recipient-list-scrolling"]
title = "Smidigare långa mottagarlistor"
text = """
En lång lista med mottagare har nu ett eget rullningsfält och rör sig en
rad i taget; konversationen rullar vidare först när listan nått sitt
slut. När du lägger till mottagare hoppar knapparna under inte längre.
"""

["2026-09-28-2106-check-for-new-mail"]
title = "Sök efter ny e-post"
text = """
Högerklicka på en mapp eller ett konto i mappfönstret för att välja ”Sök
efter ny e-post”, ”Markera alla som lästa”, en ny mapp inuti eller ”Töm
papperskorgen”. ”Uppdatera” ovanför listan hämtar nu även från servern.
Medan Katna söker snurrar pilarna på ”Uppdatera” och bredvid Inkorgen,
och ”Söker efter ny e-post…” visas överst om det tar mer än en stund.
"""

["2026-09-28-2101-large-files-onedrive"]
title = "Stora filer via OneDrive"
text = """
Outlook.com, Hotmail och andra Microsoft-konton skickar nu filer över
e-postgränsen på samma sätt som Google-konton: filen hamnar i din
OneDrive så fort du bifogar den, och meddelandet innehåller dess länk,
som i Outlook.
"""

["2026-09-28-2108-activity-checking"]
title = "Slut på Logga in-blinkningen i Aktivitet"
text = """
Direkt när Katna startar visar Aktivitet ett tunt laddningsfält medan
ditt Katna-konto kontrolleras, i stället för att kort be dig logga in.
Katna kontrollerar också kontot så snart det startar, så väntan blir
kortare.
"""

["2026-09-28-2130-update-dialog"]
title = "Uppdateringar får ett eget fönster"
text = """
Hjälp > Sök efter uppdateringar öppnar ett eget fönster. Det visar din
version bredvid den nya, med när var och en byggdes och hur stor
hämtningen är, vad som är nytt i uppdateringen och varje ändring sedan
din version.
"""

["2026-09-28-2204-faster-start"]
title = "Snabbare start, smidigare synkronisering"
text = """
Katna Mail öppnar en stor inkorg ungefär en fjärdedel snabbare, och medan
post hämtas uppdateras listan en gång per omgång i stället för efter
varje par meddelanden, så att rullning och skrivning förblir smidiga
under en synkronisering.
"""

["2026-09-28-2111-link-addresses"]
title = "Se vart en länk leder"
text = """
Håll pekaren över en länk i ett meddelande så visas adressen som den
faktiskt öppnar längst ned i läsrutan, med webbplatsens namn framhävt,
oavsett vad länkens text säger. Bilder från en avsändare du alltid visar
bilder från läses nu bara in när din e-postleverantör bekräftar att
meddelandet verkligen kommer från den avsändaren.
"""

["2026-09-29-0120-update-build-details"]
title = "Mer om ditt bygge"
text = """
Fönstret Uppdateringar visar nu senaste ändringen i varje version, var
din kopia kommer ifrån och när Katna senast sökte efter uppdateringar.
"""

["2026-09-29-0213-coffee-button-play"]
title = "Ett litet skådespel i Bjud mig på en kaffe"
text = """
Låt pekaren vila på Bjud mig på en kaffe i Om Katna: knappen ber om
kaffe, te, pizza, sedan om ingenting alls, nöjer sig med vatten och
säger tack med några gnistor. Det spelas en gång varje gång och står
still om du har minskat rörelse.
"""

["2026-09-29-0215-update-checking-bar"]
title = "Ett tydligare uppdateringsfönster"
text = """
Ett rörligt streck visas medan Katna söker efter uppdateringar, och den
nya versionen sticker ut i en egen färg bredvid den du har.
"""

["2026-09-29-0231-keys-beside-the-list"]
title = "Tangenter som följer fönstret du är i"
text = """
Med konversationen bredvid listan flyttar Upp och Ned nu i listan och
visar varje konversation. Tab eller Retur går in i konversationen, där
Upp och Ned rullar den; Esc eller Skift+Tab går tillbaka till listan. F6
växlar mellan fönstren, som i andra e-postprogram.
"""

["2026-09-29-0258-folders-slide-open"]
title = "Mappar glider upp och igen"
text = """
När du klickar på pilen bredvid ett konto eller en mapp i mappfönstret
glider nu innehållet upp eller igen, och mapparna under glider med, i
stället för att hoppa.
"""

["2026-09-29-0301-keys-menus-dialogs"]
title = "Mappar, menyer och dialogrutor med tangentbordet"
text = """
Skift+Tab eller F6 tar dig till mappfönstret, där Upp och Ned öppnar
varje mapp och Retur går till dess e-post. Upp och Ned flyttar genom
alla menyer, och Retur väljer. Skift+F10 eller menytangenten öppnar
högerklicksmenyn för det markerade e-postmeddelandet. Dialogrutor tar
över tangenterna när de öppnas: Retur svarar, Esc avbryter och Tab
stannar inuti dem. I ett nytt meddelande skickar Ctrl+Retur från vilket
fält som helst och Esc stänger det och behåller ett utkast.
"""

["2026-09-29-0309-clock-tasks"]
title = "Uppgifter i skrivbordsklockan"
text = """
Klicka på klockan för att lägga till en uppgift och bocka av uppgifter.
I Plasma högerklickar du på klockan och väljer Visa alternativ för att
välja Katna digitalklocka. I GNOME visas ett Uppgifter-kort under
klockans kalender från och med nästa inloggning.
"""

["2026-09-29-0329-pages-by-keyboard"]
title = "Sidor med tangentbordet och från aktivitetsfältet"
text = """
Ctrl+1 till Ctrl+5 växlar mellan E-post, Kalender, Kontakter, Uppgifter
och Anteckningar, som i Outlook, och menyn Gå listar dem också.
Högerklicka på Katna Mail i aktivitetsfältet för att öppna Kalender
eller Kontakter direkt.
"""

["2026-09-29-0412-tasks-page"]
title = "Katna Uppgifter"
text = """
Tryck på Ctrl+4 eller välj Uppgifter till vänster: alla listor sida vid
sida som i Google Tasks, med deluppgifter, stjärnor, förfallodagar,
upprepningar och information. Listorna synkroniseras med Google Tasks
och Microsoft To Do, och uppgifter från skrivbordsklockan visas också
här.
"""

["2026-09-29-0352-contacts"]
title = "Dina kontakter, från alla konton"
text = """
Kontakter i vänsterfältet listar nu personerna som är sparade i dina
Gmail- och Outlook-konton och på CardDAV-servrar, en gång var även när
flera konton har dem, med etiketter, bilder och deras uppgifter. Deras
namn och bilder visas också i din e-post och i adressförslagen.
"""

["2026-09-29-0350-katna-notes"]
title = "Katna Anteckningar"
text = """
Anteckningar i sidofältet öppnar nu Katna Anteckningar, upplagt som
Google Keep. Skriv en anteckning eller en checklista, ge den en färg,
fäst den överst och bocka av objekt direkt på tavlan. Anteckningar
sparas medan du skriver; sökrutan hittar dem; Arkiv och Papperskorgen
håller dem ur vägen, med Ångra.
"""

["2026-09-29-0412-notes-sync"]
title = "Anteckningar på alla enheter"
text = """
Anteckningar ligger nu i mappen Anteckningar på ditt e-postkonto, där
Anteckningar på iPhone och Mac förvarar sina, så de följer med dig till
dina andra enheter och kommer tillbaka därifrån. Kontots namn under en
anteckning visar var den sparas; klicka på det för att flytta
anteckningen, eller behåll den bara på den här datorn.
"""

["2026-09-29-0451-add-mail-to-tasks"]
title = "Lägg till ett e-postmeddelande i Uppgifter"
text = """
Tryck på Skift+T, som i Gmail, eller välj Lägg till i Uppgifter när du
högerklickar på ett e-postmeddelande. Uppgiften får meddelandets ämne,
och dess E-post-chip i Uppgifter öppnar meddelandet igen.
"""

["2026-09-29-0412-calendar"]
title = "Din kalender, bredvid din e-post"
text = """
Kalender visar dina Google-, Microsoft- och andra kalendrar per dag,
vecka, månad eller som schema, med Google Kalenders kortkommandon.
Kalenderknappen till höger om din e-post öppnar dagens agenda, med Anslut
för samtal. Logga in på ett konto igen så att Katna kan läsa dess
kalender.
"""

["2026-09-29-0442-contacts-edit"]
title = "Skapa och ändra kontakter"
text = """
Skapa kontakt på sidan Kontakter lägger till någon i det konto du
väljer, och Redigera på en kontakts sida ändrar kontakten där också.
Radera har en Ångra, och Google och Outlook sparar raderade kontakter i
sin papperskorg en tid.
"""

["2026-09-29-0538-notes-on-mail"]
title = "Anteckningar om ett e-postmeddelande"
text = """
Högerklicka på ett e-postmeddelande, eller öppna dess meny ⋮, och välj
Lägg till en anteckning: en anteckning med ämnet som rubrik öppnas
över meddelandet. Anteckningarna visas under ämnet varje gång du
öppnar meddelandet igen, och etiketten E-post på en anteckning tar dig
tillbaka till meddelandet.
"""

["2026-09-29-0542-caldav-tasks"]
title = "Uppgifter på din egen e-postserver"
text = """
Konton som loggar in med lösenord sparar nu sina uppgifter på
e-postservern när den erbjuder CalDAV, så att uppgifterna också visas
i serverns egna appar och på telefonen.
"""

["2026-09-29-0521-calendar-edit"]
title = "Lägg till och ändra händelser"
text = """
Klicka eller dra i kalendern, eller tryck på C, för att lägga till en
händelse. Dra en händelse för att flytta den eller dess nedre kant för
att ändra längden, och öppna den för att ändra tid, upprepning,
påminnelser och gäster eller lägga till ett Meet- eller Teams-samtal.
Svara på inbjudningar med Ja, Nej eller Kanske. Ångra ställer tillbaka
allt.
"""

["2026-09-29-0546-calendar-any-account"]
title = "Kalendrar från fler konton"
text = """
Katna hittar nu kalendrarna för Yahoo, Zoho, iCloud, Fastmail, GMX och
andra konton, även när de ligger på en annan server än e-posten. Den
provar först varje kontos bästa sätt och ett annat när det inte är
tillgängligt.
"""

["2026-09-29-0625-tasks-today"]
title = "I dag i Uppgifter"
text = """
I dag, under Alla uppgifter, samlar det som förfaller i dag och allt som
är försenat från alla listor, med listan som varje uppgift finns i. En
uppgift som läggs till där förfaller i dag.
"""

["2026-09-29-0631-invitation-card"]
title = "Inbjudningar i din e-post"
text = """
En inbjudan visas nu som ett kort överst i e-postmeddelandet: när och
var, vem som arrangerar den, din dag runt omkring med krockar markerade,
Anslut och Kommer du? Ja, Nej eller Kanske, som du kan besvara direkt
där.
"""

["2026-09-29-0616-note-labels"]
title = "Etiketter på anteckningar"
text = """
Etikettknappen på en anteckning sätter etiketter på den, som i Keep.
Dina etiketter listas bredvid Anteckningar och visar var och en bara
sina anteckningar, och Redigera etiketter byter namn på eller raderar
dem, med Ångra.
"""

["2026-09-29-0630-tasks-more-accounts"]
title = "Uppgifter från fler konton"
text = """
Uppgifter synkroniseras nu även med Yahoo, Zoho, iCloud, Fastmail och
andra konton vars uppgifter finns på en annan server än e-posten. Katna
prövar varje kontos bästa metod först och kommer ihåg den som fungerar.
"""

["2026-09-29-0651-schedule-meeting"]
title = "Boka ett möte från ett mejl"
text = """
Högerklicka på en konversation, eller öppna ⋮, och välj Boka ett möte:
en ny händelse öppnas på sidan Kalender med ämnet som titel och alla i
konversationen som gäster.
"""

["2026-09-29-0705-running-late"]
title = "Försenad? Meddela alla med ett klick"
text = """
En händelse med gäster har nu Skicka e-post till gäster och, från en
timme innan den börjar, Jag är försenad: ett mejl till alla, från den
kalenderns konto, klart att skickas.
"""

["2026-09-29-0607-contact-labels"]
title = "Kontaktetiketter"
text = """
Etikett på en kontakts sida bockar etiketter av och på eller skapar en
ny, och ⋮ bredvid en etikett byter namn på den, raderar den eller
skriver till alla på den. Etiketterna hålls i takt med Google Contacts
och Outlook, och varje ändring har en Ångra.
"""

["2026-09-29-0640-add-to-contacts"]
title = "Lägg till i kontakter från e-posten"
text = """
Kontaktpanelen bredvid en konversation har Lägg till i kontakter för
någon du inte har sparat: ett klick sparar namn, adress och telefon,
titel och företag från signaturen, med Ångra. För någon som redan är
sparad öppnar samma knapp personen på sidan Kontakter.
"""

["2026-09-29-0720-focus-time"]
title = "Fokustid, frånvaro och arbetsplats"
text = """
En ny händelse kan nu vara Fokustid, Frånvaro eller en Arbetsplats, som
i Google Calendar: välj det ovanför tiderna. Google och Outlook ser dem
som vad de är, och i Katna visas de med en egen ikon.
"""

["2026-09-29-0704-task-chips"]
title = "Uppgifter i din e-post"
text = """
Ett mejl som du har gjort till en uppgift visar nu uppgiftens
förfallodag i listan, i rött när den är försenad. Klicka på den för att
öppna uppgiften.
"""

["2026-09-29-0638-other-contacts"]
title = "Övriga kontakter"
text = """
Kontakter har nu Övriga kontakter: personer du har mejlat från Gmail men
aldrig sparat, precis som Gmail behåller dem. Spara vem som helst med
ett klick, med Ångra, eller börja ett mejl till dem.
"""

["2026-09-29-0745-answer-by-mail"]
title = "Svara på inbjudningar från vilket konto som helst"
text = """
En inbjudan som kom till ett konto utan kalender har nu också Ja, Nej
och Kanske: ditt svar skickas till arrangören med e-post, och
arrangörens kalender registrerar det.
"""

["2026-09-29-0710-meeting-notes"]
title = "Mötesanteckningar"
text = """
Öppna en händelse i Kalendern och välj Anteckna mötet: en anteckning med
händelsens titel öppnas, med deltagarna och plats för åtgärder.
Händelsens kort listar dess anteckningar, och chipet Händelse i en
anteckning tar dig tillbaka till dagen.
"""

["2026-09-29-0751-go-to-pdf-page"]
title = "Gå direkt till en PDF-sida"
text = """
Sidnumret under en PDF är nu en ruta: klicka på den eller tryck på
Ctrl+G, skriv en sida och tryck på Retur för att hoppa dit.
"""

["2026-09-29-0715-tasks-on-calendar"]
title = "Uppgifter i kalendern"
text = """
Uppgifter med förfallodag visas nu i Kalendern, vid sin tid eller bland dagens heldagshändelser. Bocka av dem där, klicka för att öppna en eller dra den till en annan dag eller tid för att reservera den tiden åt den.
"""

["2026-09-29-0756-event-reminders"]
title = "Påminnelser för dina händelser"
text = """
Händelser påminner dig nu med en avisering, även när Katna är stängt. Anslut öppnar videosamtalet och Snooza 5 min påminner dig igen om fem minuter.
"""

["2026-09-29-0758-contacts-merge-import"]
title = "Sammanfoga dubbletter, importera och exportera kontakter"
text = """
Kontakter har Åtgärda och hantera: Sammanfoga och åtgärda hittar personer som sparats två gånger (samma namn eller telefonnummer) och sammanfogar dem med ett klick, med Ångra. Importera hämtar personer från en vCard-fil och utelämnar dem som redan finns, och Exportera sparar alla, eller en etikett, som en vCard-fil.
"""

["2026-09-29-0835-contacts-birthdays-qr-print"]
title = "Födelsedagar i kalendern, kontakter som QR-koder"
text = """
Dina kontakters födelsedagar visas nu i Kalender, i en kalender som heter Födelsedagar och som du kan bocka ur. En kontakts sida kan visa kontakten som en QR-kod som en telefons kamera sparar, och skriva ut den; Skriv ut under Åtgärda och hantera skriver ut alla som visas. Importen läser nu också CSV-filer från Google Kontakter och Outlook, och KRunner och GNOME-sökning hittar dina sparade kontakter.
"""

["2026-09-29-0830-calendar-density-time-zones"]
title = "Kalenderns täthet och en andra tidszon"
text = """
Alternativknappen i Kalender styr hur höga timmarna är (Anpassas efter skärmen, Bekväm eller Kompakt) och lägger till en andra tidszon vid sidan av din egen, för de du möter utomlands.
"""

["2026-09-29-0809-video-calls"]
title = "Starta ett videosamtal från ett mejl"
text = """
Högerklicka på en konversation, eller öppna ⋮, och välj Starta ett videosamtal: samtalet öppnas, med ett nytt mejl med länken till alla i konversationen. Gmail-konton använder Google Meet; andra får ett Jitsi Meet-rum. Mejl med en samtalslänk till Meet, Teams, Zoom, Webex, Jitsi, WhatsApp eller Telegram visar nu en Anslut-knapp.
"""

["2026-09-29-0815-note-line-task"]
title = "Gör en checklistrad till en uppgift"
text = """
Placera markören på en checklistrad i en anteckning och välj Gör till uppgift: raden hamnar bland dina uppgifter. Dess Anteckning-chip på sidan Uppgifter öppnar anteckningen igen.
"""

["2026-09-29-0836-active-pane-stands-out"]
title = "Den ruta du är i sticker ut"
text = """
Bredvid listan behåller bara den ruta som har tangentbordet sin skugga; listan, konversationen eller kontaktpanelen som du inte använder sjunker tillbaka med en svagare kant, och ändringen följer dig mjukt när du klickar.
"""

["2026-09-29-0840-task-reminders"]
title = "Uppgiftspåminnelser och upprepningar"
text = """
Öppna en uppgift och välj Påminn mig: när det är dags, en timme eller en dag före. Påminnelsen visas även när Katna är stängt, med Markera som klar och Snooza. När du bockar av en återkommande uppgift kommer den nu tillbaka nästa dag.
"""

["2026-09-29-0849-tasks-in-desktop-search"]
title = "Hitta uppgifter från skrivbordet"
text = """
Skriv några ord ur en uppgift i KRunner eller GNOME:s sökning så visas den under Uppgifter. Tryck på Retur så öppnar Katna den, redo att redigeras.
"""

["2026-09-29-0832-clock-day-menu"]
title = "Lägg till händelser och uppgifter från skrivbordsklockan"
text = """
I Katna Digital Clock högerklickar du på en dag i månaden för att lägga
till en uppgift eller en händelse den dagen; händelsen öppnas i Katnas
Kalender. Klickar du på en av dina händelser öppnas Kalender på den
dagen.
"""

["2026-09-29-0855-type-an-event"]
title = "Skriv en händelse på en rad"
text = """
Skriv ”Lunch med Anita fredag 13 på Cafe Mocha” eller ”Stand-up varje
vardag 9:30” som titel på en ny händelse, så fyller Kalender i dag, tid,
upprepning och plats medan du skriver.
"""

["2026-09-29-0915-year-view"]
title = "Se hela året"
text = """
Kalender har en årsvy: alla tolv månaderna på en gång, med en prick
under dagar som har händelser. Tryck på Y och klicka på en dag för att
öppna den.
"""

["2026-09-29-0930-share-free-times"]
title = "Dela dina lediga tider"
text = """
Dela lediga tider i Kalenders alternativ startar ett meddelande som
listar när du är ledig de närmaste arbetsdagarna, redo att skickas till
vem som helst.
"""

["2026-09-29-0952-calendar-sets"]
title = "Kalenderuppsättningar"
text = """
Spara kalendrarna du visar som en uppsättning, till exempel ”Arbete”
eller ”Familj”, med + bredvid Kalenderuppsättningar. Ett klick på en
uppsättning visar dess kalendrar och döljer resten.
"""

["2026-09-29-0947-tasks-typed-quick-add"]
title = "Skriv en uppgift på en rad"
text = """
Lägg till en uppgift som ”Ring banken i morgon kl. 15” eller ”Vattna
blommorna varje måndag kl. 8”, så ställer Uppgifter in dagen, tiden och
upprepningen åt dig och visar vad den har förstått medan du skriver.
"""

["2026-09-29-1028-calendar-narrow-windows"]
title = "Kalender i ett smalt fönster"
text = """
I ett smalt fönster behåller Kalender Idag och datumen i sitt fält och
samlar vyerna i en meny. Händelsetider bryts inte längre mitt i ord, och
Tab når varje knapp och kalender.
"""

["2026-09-29-1039-contact-panel-tasks"]
title = "Uppgifter med dem, bredvid deras e-post"
text = """
Kontaktpanelen bredvid en konversation listar nu dina öppna uppgifter
som skapats från e-post med den personen. Bocka av en för att slutföra
den, eller klicka på den för att öppna den i Uppgifter.
"""

["2026-09-29-1046-contact-panel-meetings"]
title = "Dina nästa möten med dem"
text = """
Kontaktpanelen bredvid en konversation visar nu dina nästa möten med
den personen. Klicka på ett för att öppna det i Kalender.
"""

["2026-09-29-1051-tasks-drag-to-list"]
title = "Dra en uppgift till en annan lista"
text = """
I Uppgifter drar du en uppgift till en annan lista för att flytta den
dit. Ångra lägger tillbaka den.
"""

["2026-09-29-1111-tasks-search"]
title = "Sök i dina uppgifter"
text = """
På sidan Uppgifter söker sökrutan högst upp nu i dina uppgifter, deras
anteckningar och deluppgifter i stället för i din e-post.
"""

["2026-09-29-1130-calendar-search"]
title = "Sök i dina händelser"
text = """
På sidan Kalender hittar sökrutan högst upp nu händelser efter rubrik,
plats, anteckningar eller gäster, listade efter datum. Klicka på en för
att öppna den på dess dag; Esc tar dig tillbaka till resultaten.
"""

["2026-09-29-1045-note-formatting"]
title = "Formatering i anteckningar"
text = """
Välj Formatering i en anteckning för Rubrik 1, Rubrik 2, fet, kursiv och
understruken text, som i Keep. Tavlan visar den också, och den följer
med anteckningen till mappen Anteckningar i ditt e-postkonto, där
formatering från en iPhone nu kommer tillbaka som den var.
"""

["2026-09-29-0934-custom-days-view"]
title = "Visa bara några dagar"
text = """
Kalender har en Anpassad vy bredvid Schema: 4 dagar från dagen du
väljer, eller allt från 2 till 7. Tryck på X och välj hur många i
Alternativ.
"""

["2026-09-29-0939-events-in-desktop-search"]
title = "Hitta händelser från skrivbordet"
text = """
Skriv en händelses namn i KRunner eller GNOME:s sökning för att se när
den inträffar nästa gång, och tryck på Enter för att öppna den dagen i
Kalender.
"""

["2026-09-29-1102-apps-on-a-phone"]
title = "Kalender, Kontakter, Uppgifter och Anteckningar på en telefon"
text = """
I ett smalt fönster får de här sidorna nu plats på skärmen som E-post:
sidolistan öppnas från menyknappen, Kontakter visar varje namn med
adressen under, och Anteckningar lägger två kort bredvid varandra.
"""

["2026-09-29-1236-agenda-button-top-bar"]
title = "Dagens agenda från det övre fältet"
text = """
Knappen som visar dagens agenda bredvid din e-post finns nu i det övre
fältet, bredvid språkknappen, och e-posten får utrymmet som sidoremsan
tog.
"""

["2026-09-29-1243-hide-side-panel-on-every-page"]
title = "Dölj sidopanelen på varje sida"
text = """
Menyknappen uppe till vänster fäller nu ihop sidopanelen även i
Kalender, Kontakter, Uppgifter och Anteckningar och skjuter undan den
som den gör med mapparna i E-post. Varje sida kommer ihåg om du lämnade
den öppen.
"""

["2026-09-29-1251-app-menu-on-a-phone"]
title = "Huvudmenyn på en telefon"
text = """
På en telefon öppnar huvudmenyn bakom kontobilden Arkiv, Redigera, Visa
och resten på plats, med en Tillbaka-rad överst, i stället för utanför
skärmens kant.
"""

["2026-09-29-1256-calendar-every-account"]
title = "Alla konton i Kalender"
text = """
Sidolistan i Kalender visar nu alla dina konton. När ett kontos
kalendrar inte kan läsas in säger en rad under det varför, med det enda
klick som löser det, till exempel ”Logga in igen för att visa
kalendrar”.
"""

["2026-09-29-1300-switch-account-stay-on-page"]
title = "Byt konto utan att lämna sidan"
text = """
Om du väljer ett annat konto från din bild uppe till höger, eller vrider
på hjulet över den, stannar du nu kvar i Kalender, Uppgifter, Kontakter
eller Anteckningar. Nya objekt hamnar i det kontot, och E-post visar det
när du går tillbaka.
"""

["2026-09-29-1317-contacts-every-account"]
title = "Alla konton i Kontakter"
text = """
Kontakter visar nu alla dina konton under Konton, med hur många personer
varje konto har; klicka på ett för att bara se dess personer. När ett
kontos kontakter inte kan läsas in säger en rad under det varför, med
det enda klick som löser det, till exempel ”Logga in igen för att visa
kontakter” eller ”Försök igen”.
"""

["2026-09-29-1327-tasks-every-account"]
title = "Alla konton på sidan Uppgifter"
text = """
Alla konton visas nu i sidopanelen i Uppgifter. När ett kontos uppgifter
inte kan läsas in säger en rad under det varför, med ett klick som löser
det: logga in igen eller försök igen.
"""

["2026-09-29-1404-compose-dialogs-in-view"]
title = "Frågor före sändning syns alltid"
text = """
Frågor som ”Tänkte du bifoga filer?” öppnas nu mitt i fönstret, hur
långt meddelandet du skriver eller vidarebefordrar än är, så att de
aldrig göms längre ned på sidan. Enter svarar med huvudknappen och Esc
går tillbaka till meddelandet.
"""

["2026-09-29-1530-mark-up-pdfs"]
title = "Märk upp PDF-filer"
text = """
Tryck på pennan i PDF-visaren för att överstryka, understryka, stryka
under med vågig linje eller genomstryka text, eller rita med en penna, i
den färg du väljer. Ångra med Ctrl+Z, sudda ut en markering med
suddgummit och spara sedan en uppmärkt kopia. Den ursprungliga bilagan
förblir som den var.
"""

["2026-09-29-1557-calendar-accounts-why"]
title = "Varför ett konto saknar kalendrar"
text = """
När ett kontos kalendrar inte visas säger Kalender nu vad servern
svarade, och ”Försök igen” letar efter dem igen direkt. Ett Gmail- eller
Outlook-konto som lagts till med lösenord erbjuder inloggning med Google
eller Microsoft, vilket deras kalendrar kräver.
"""

["2026-09-29-1610-one-checkbox"]
title = "Kryssrutor som bockas i"
text = """
Varje kryssruta i Katna Mail är nu lika stor som de runda knapparna
bredvid. Bocken ritas fram när du markerar rutan och suddas bort när du
avmarkerar den, i Inställningar, e-postlistan, Kalender, Kontakter,
Anteckningar och dialogrutor.
"""

["2026-09-29-1622-right-click-menu-fits"]
title = "En kortare högerklicksmeny som alltid får plats"
text = """
E-postlistans högerklicksmeny har de vardagliga åtgärderna överst och
lägger resten under Följ upp (uppgifter, anteckningar, möten, samtal)
och Mer (skräppost, viktigt, fäst). Den öppnas där du klickar och håller
sig inom fönstret; i ett lågt eller smalt fönster öppnas en undermeny i
menyns ställe.
"""

["2026-09-29-1627-contacts-accounts-why"]
title = "Varför ett konto saknar kontakter"
text = """
När ett kontos kontakter inte visas säger Kontakter nu vad servern
svarade, och ”Försök igen” letar efter dem igen direkt. Ett Gmail- eller
Outlook-konto som lagts till med lösenord erbjuder inloggning med Google
eller Microsoft, vilket deras kontakter kräver.
"""

["2026-09-29-1640-search-box-focus"]
title = "Sökrutan visar när den är aktiv"
text = """
Sökrutan högst upp får en accentkant medan du skriver i den, precis som
alla andra fält, och dess Ctrl+F-tips flyttar undan tills du lämnar den
tom.
"""

["2026-09-29-1612-tasks-board-rows"]
title = "Alla uppgiftslistor syns"
text = """
”Alla uppgifter” visar nu så många listor sida vid sida som får plats i
fönstret, med fler rader nedanför, så att varje lista går att nå. En ny
lista rullas fram så fort du skapar den.
"""

["2026-09-29-1653-smooth-attachment-paging"]
title = "Mjuk bläddring mellan bilagor"
text = """
Att gå till nästa eller föregående bilaga i visaren med pilarna flimrar
inte längre. Visaren förblir öppen och nästa fil tar den förras plats så
snart den är klar.
"""

["2026-09-29-1656-drag-notes"]
title = "Dra anteckningar i ordning"
text = """
Dra en anteckning på tavlan i Anteckningar för att flytta den, som i
Keep. De andra anteckningarna glider undan för att ge plats, och den
stannar där du släpper den. Ctrl+Z lägger tillbaka den. Korten sitter nu
tätt i sina kolumner, utan luckor under korta anteckningar.
"""

["2026-09-29-1707-calendar-right-click"]
title = "Högerklicka i Kalender"
text = """
Högerklicka på en ledig tid eller dag för att lägga till en händelse,
fokustid eller frånvaro där. Högerklicka på en händelse för att
redigera, duplicera, radera, svara, ansluta, skicka e-post till
gästerna, färga den eller flytta den till en annan kalender, och på en
uppgift för att bocka av den, stjärnmärka den, ge den en annan dag eller
radera den. Ångra tar tillbaka en ändring.
"""

["2026-09-29-1725-pdf-notes-and-text"]
title = "Anteckningar och text i PDF-filer"
text = """
När du märker upp en PDF finns nu fästisar och textrutor: klicka på
sidan, skriv och tryck på Ctrl+Enter. Håll pekaren över en anteckning
för att läsa den, eller klicka på den för att ändra den. Svara skickar
den uppmärkta kopian direkt tillbaka i ett svar på meddelandet.
"""

["2026-09-29-1657-tasks-drag-to-place"]
title = "Dra uppgifter dit du vill ha dem"
text = """
Dra en uppgift uppåt eller nedåt i listan, eller till en annan lista,
och uppgifterna där glider undan för att visa var den hamnar. Google
Tasks behåller den nya ordningen på telefonen också, och Ångra lägger
tillbaka uppgiften.
"""

["2026-09-29-1719-calendar-task-tab"]
title = "Lägg till en uppgift från Kalender"
text = """
Kortet för ny händelse har en flik Uppgift, som i Google Kalender.
Klicka på en tid, välj Uppgift, så blir titeln, dagen och tiden en
uppgift i den lista du väljer, med en beskrivning om du vill.
"""

["2026-09-29-1758-calendar-new-task-here"]
title = "Lägg till en uppgift från Kalender"
text = """
Högerklicka på en ledig tid eller dag i Kalender och välj Uppgift för
att lägga till en uppgift där. Kortet för ny händelse öppnas på fliken
Uppgift med den dagen och tiden redan ifyllda.
"""

["2026-09-30-0113-calendar-server-unreachable"]
title = "Kalendrar försöker igen efter en långsam server"
text = """
När ett kontos kalenderserver inte svarar i tid säger Kalender nu det,
och om det var anslutningen eller den säkra handskakningen som fastnade,
i stället för "Inga kalendrar hittades". Den försöker igen inom några
minuter i stället för timmar.
"""

["2026-09-30-0123-contact-files-fill"]
title = "Kontaktens filer visar nedladdningen"
text = """
En fil i kontaktpanelen vars e-post inte finns på den här datorn än
fylls nu medan den laddas ned, som bilagorna i listan gör, och öppnas
sedan.
"""

["2026-09-30-0135-new-account-mail-shows-as-it-arrives"]
title = "Ett nytt kontos e-post visas allt eftersom den kommer in"
text = """
När du har lagt till ett konto hämtas dess inkorg först och fylls på
medan du tittar, i stället för att stå på ”Hämtar din e-post…” tills
alla mappar är klara. Andra mappar fylls på på samma sätt.
"""

["2026-09-30-0159-checkbox-matches-icons"]
title = "Kryssrutorna ligger i nivå med ikonerna"
text = """
Kryssrutorna är lite mindre, lika stora som stjärn- och etikettikonerna
bredvid dem i e-postlistan. De är lika lätta att klicka på som förut, och
bocken ritas fortfarande fram.
"""

["2026-09-30-0201-zoho-calendars"]
title = "Zoho-kalendrar via Zohos egen anslutning"
text = """
Zoho delar kalendrar med andra appar på en port som många nätverk
blockerar, så efter Logga in med Zoho läser Kalender dem via Zohos eget
API i stället. Dina Zoho-händelser visas bredvid dina andra kalendrar;
att ändra dem från Katna kommer senare.
"""

["2026-09-30-0216-zoho-tasks"]
title = "Zoho-uppgifter"
text = """
Logga in med Zoho på ett Zoho-konto så visas dess uppgifter i Zoho ToDo
i Uppgifter, åt båda hållen: lägg till, redigera, bocka av eller ta bort
en uppgift i Katna så ändras den i Zoho också.
"""

["2026-09-30-0224-checkbox-tick-centred"]
title = "Bocken hamnar i mitten i alla storlekar"
text = """
Med Skalning i Inställningar > Utseende över 100 % hamnade bocken i en
kryssruta lite upp och till vänster. Kanterna på kryssrutor och runda
knappar växer nu med skalan, så bocken hamnar i mitten i alla storlekar.
"""

["2026-09-30-0230-edges-follow-scaling"]
title = "Konturerna växer med Skalning"
text = """
Med Skalning i Inställningar > Utseende över eller under 100 % växer och
krymper nu accentkonturen runt den aktiva sökrutan och fälten, och
kanterna på valkort och uppgiftsringar, med allt annat i stället för att
förbli tunna.
"""

["2026-09-30-0326-google-sign-in-network"]
title = "Logga in med Google på alla nätverk"
text = """
Logga in med Google stoppar inte längre med ”peer closed connection” på
nätverk som bryter Googles anslutning i förtid. Om du bockar ur Gmail på
Googles sida säger Katna nu det i stället för att misslyckas senare.
"""

["2026-09-30-0504-google-api-turned-off"]
title = "Säger vilket Google-API som är avstängt"
text = """
När Google har ett API avstängt för Katna säger Kontakter, Kalender,
Uppgifter och Drive-filer nu vilket på en kort rad, med en knapp
Slå på som öppnar Googles sida för det, i stället för Googles råa
felmeddelande.
"""

["2026-09-30-0507-newest-mail-first"]
title = "Den nyaste e-posten kommer först"
text = """
När du lägger till ett konto hämtar Katna Mail nu din senaste e-post
först och arbetar sig sedan bakåt till äldre e-post, så att dagens
meddelanden syns högst upp i inkorgen direkt. Om hämtningen avbryts
fortsätter den med den äldre e-posten nästa gång.
"""

["2026-09-30-0601-keyring-at-login"]
title = "Väntar på din plånbok vid inloggning"
text = """
Om KWallet eller GNOME Keyring fortfarande är låst när Katna startar och
dess upplåsningsfönster stängs, visar dina konton inte längre fel
lösenord. De väntar och börjar synkronisera av sig själva så fort du
låser upp plånboken, utan att du behöver avsluta Katna. Synkronisera ber
nu om att låsa upp den igen.
"""

["2026-09-30-0606-pdf-rotate-and-top-bar"]
title = "Vrid PDF-sidor"
text = """
PDF-visaren kan nu vrida sidor medsols eller motsols (Ctrl+R och
Ctrl+Shift+R), och en uppmärkt kopia sparas som du vred den. Sidnumret
och zoomen har flyttat till den övre raden, så att inget täcker sidan.
"""

["2026-09-30-0610-calendar-events-stay-put"]
title = "Händelser stannar där de är"
text = """
Att klicka på en händelse eller uppgift i Kalender och sedan byta vy får
den inte längre att följa pekaren. En händelse flyttas nu bara medan du
håller ned knappen och drar den, och att byta vy eller sida, trycka på
Esc eller öppna dess kort lägger tillbaka den oförändrad.
"""

["2026-09-30-0620-checkbox-partial-centred"]
title = "Delvis ikryssade rutor ser jämna ut"
text = """
När bara vissa meddelanden är markerade har fyrkanten i rutan Markera
alla nu lika stort mellanrum på alla sidor, oavsett skalning.
"""

["2026-09-30-0632-year-view-day-peek"]
title = "Se en dags planer från årsvyn"
text = """
I Kalenders årsvy kan du vila pekaren på en dag med en prick för att se
dess händelser och uppgifter i en liten ruta bredvid, var och en med en
ikon som visar vad den är och dess tid. Klicka på en för att öppna den,
eller på dagens namn för att öppna dagen. På en telefon trycker du på
dagen.
"""

["2026-09-30-0650-notification-opens-own-window"]
title = "Aviseringar öppnar e-posten överst"
text = """
Att klicka på en avisering om ny e-post öppnar e-postmeddelandet i ett
eget fönster, överst, vad Katna än visar för stunden. Svara alla öppnar
det med svaret redo att skriva. Arkivera lägger undan e-posten utan att
öppna något och säger det i en kort notis med Ångra.
"""

["2026-09-30-0700-event-card-join-any-call"]
title = "Anslut till Teams- och Zoom-samtal från Kalender"
text = """
En händelses kort hittar nu samtalet i beskrivningen eller platsen, så
att en inbjudan till Microsoft Teams, Zoom, Webex, Jitsi eller Google
Meet får en knapp ”Anslut med” högst upp. Webbadresser i beskrivningen
är länkar, raderna av understreck är borta, och Kommer du? stannar
längst ned medan detaljerna rullar.
"""

["2026-09-30-0715-click-away-closes-viewer"]
title = "Klicka utanför för att stänga"
text = """
Klicka på det dämpade området runt en bilaga för att stänga visaren, i
stället för att leta efter bakåtknappen. Klick på själva sidan markerar
fortfarande text och märker upp som förut.
"""

["2026-09-30-0729-add-account-and-pop3"]
title = "En ny Lägg till konto, och POP3"
text = """
Att lägga till ett konto börjar med din leverantör: Google, Yahoo,
iCloud, Zoho, Fastmail, GMX, Yandex eller någon annan. Katna säger först
vad leverantören behöver, visar varje steg medan den ansluter och
avslutar med vad den har konfigurerat. POP3-konton fungerar också, och i
Inställningar > Konton väljer du hur länge deras e-post ligger kvar på
servern.
"""

["2026-09-30-0802-ctrl-wheel-zoom"]
title = "Zooma med Ctrl och hjulet"
text = """
Håll ned Ctrl i bilagevisaren och vrid på mushjulet för att zooma in och
ut runt pekaren, eller nyp på en pekplatta. Det fungerar för PDF-filer,
bilder, textfiler, kalkylblad och dokument.
"""

["2026-09-30-0817-event-open-the-mail"]
title = "Öppna e-posten bakom en händelse"
text = """
Händelser som Gmail har skapat från ett e-postmeddelande, som tåg, flyg
och hotell, får en knapp Öppna e-postmeddelandet på sitt kort. Den
öppnar meddelandet i Katna, eller i Gmail när Katna inte har det. En
uppgift som skapats från ett e-postmeddelande öppnar också sitt
meddelande från sitt kort i Kalender, och Anteckna mötet öppnas utan att
blinka.
"""

["2026-09-30-0843-calendar-side-panel-menus"]
title = "Hantera kalendrar från sidopanelen"
text = """
Högerklicka på en kalender i Kalenders sidopanel för att visa bara den,
ändra dess färg, byta namn på den eller radera den. Högerklicka på ett
kontos namn för att skapa en ny kalender i det kontot eller visa och
dölja alla dess kalendrar. Ändringarna sparas hos din e-posttjänst, så
de syns överallt där du använder den.
"""

["2026-09-30-1010-unread-list-keeps-open-mail"]
title = "Oläst e-post förblir öppen"
text = """
Att öppna en konversation i Alla konton > Olästa stänger den inte längre
direkt. När du läser den markeras den som läst, och den stannar i listan
tills du stänger den eller öppnar en annan.
"""

["2026-09-30-1045-tracked-mail-arrives"]
title = "Spårad e-post kommer fram igen"
text = """
E-post som skickades med spårning på kunde visas i Skickat utan att nå
någon. Den går nu ut till alla mottagare. E-post som gått förlorad på
det här sättet behöver skickas igen.
"""

["2026-09-30-1114-no-checking-pill"]
title = "Ingen mer kontrollbubbla"
text = """
”Söker efter ny e-post…” dyker inte längre upp över listan. De snurrande
pilarna på uppdateringsknappen och på varje kontos inkorg visar redan
att e-post hämtas, och en misslyckad kontroll säger fortfarande vad som
gick fel.
"""

["2026-09-30-1300-windows-sign-in-and-domains"]
title = "Logga in med Google på Windows"
text = """
Katna för Windows erbjuder nu Logga in med Google och Zoho, precis som
på Linux, och vet vem som hanterar e-posten på din egen domän, till
exempel en Google Workspace-adress, när du lägger till kontot.
"""

["2026-09-30-1511-mail-tables"]
title = "Tabeller i e-post visas rätt"
text = """
Tabeller i e-post, som jobblistan i en avisering från GitHub Actions,
håller sina kolumner sida vid sida och linjerar dem från rad till rad, i
stället för att bryta en rubrik med en bokstav per rad. Skiljelinjer
mellan delar av ett meddelande visas nu också.
"""

["2026-09-30-1550-taller-important-marker"]
title = "Högre Viktigt-markör"
text = """
Viktigt-markören bredvid stjärnan är 2 px högre, så den ser inte längre
hoptryckt ut bredvid stjärnan och kryssrutan. Den förblir centrerad i
raden.
"""

["2026-09-30-1617-folder-click-goes-to-top"]
title = "Tillbaka till början av listan"
text = """
När e-postlistan har rullats en skärm ned tar en rund knapp nere till
höger den tillbaka till början. Att klicka på mappen du redan är i, till
exempel Inkorgen, gör samma sak, som i Gmail, och det gör Home också.
"""

["2026-09-30-1622-send-from-file-manager"]
title = "Skicka filer från filhanteraren"
text = """
Högerklicka på filer eller mappar i Dolphin, GNOME Filer eller
Utforskaren i Windows och välj Skicka med Katna Mail: ett nytt
meddelande öppnas med dem bifogade, och en mapp skickas som zip. Med
fler än ett e-postkonto väljer du vilket du skickar från i undermenyn.
"""

["2026-09-30-1624-files-page"]
title = "Alla filer på ett ställe"
text = """
Den nya sidan Filer, längst ned i appraden, visar alla bilagor från alla
konton, de nyaste först. Begränsa till bilder, PDF-filer eller dokument,
till ett konto, en person eller en tid, eller sök efter namn, avsändare
eller ämne. Högerklicka på en fil för mer, och Visa e-postmeddelandet
tar dig till det meddelande den kom med.
"""

["2026-09-30-1643-dimmer-row-markers"]
title = "Lugnare e-postlista"
text = """
En tom kryssruta, stjärna eller Viktigt-markör i e-postlistan är dämpad
tills pekaren är över dess rad. Satta stjärnor och markörer behåller sin
färg.
"""

["2026-09-30-1704-folder-arrows-on-hover"]
title = "Snyggare mappanel"
text = """
De små pilarna bredvid Inkorgen, Stjärnmärkt och de andra mapparna visas
bara medan pekaren är över den mappen. En mapp du har fällt ut behåller
sin pil.
"""

["2026-09-30-1712-arrow-keys-in-times"]
title = "Piltangenter i tidsrutor"
text = """
I Välj datum och tid, och i en uppgifts tid, ändrar Upp och Ned den del
markören står i: timmen, minuterna eller FM/EM.
"""

["2026-09-30-1742-check-one-folder"]
title = "Sök efter ny e-post i en mapp"
text = """
”Sök efter ny e-post” i en mapps högerklicksmeny kontrollerar nu bara
den mappen, så det går snabbt. På ett kontos inkorg under Alla konton
kontrollerar den det kontots inkorg, och på en lista som Inkorgen eller
Skickat under Alla konton kontrollerar den den mappen i varje konto.
"""

["2026-09-30-1742-frosted-viewer"]
title = "En lättare, frostad visare"
text = """
Bilagevisarens övre rad är smalare och ljusare, och sida, zoom och
vridning ligger i en bubbla. Runt filen syns Katna Mail suddigt under en
mjuk mörk slöja, och verktygsraderna är också frostade. Oskärpan följer
Inställningar > Experimentellt; utan den använder visaren en enkel mörk
slöja.
"""

["2026-09-30-1752-touchpad-glide"]
title = "Snabba svep på pekplattan glider"
text = """
Ett snabbt svep med två fingrar på en pekplatta fortsätter att rulla och
saktar in, som i andra appar. Rör vid pekplattan igen för att stoppa. På
Wayland.
"""

["2026-09-30-1800-inbox-tabs-in-top-row"]
title = "Inkorgsflikar i den översta raden"
text = """
Primär, Kampanjer, Socialt och de andra inkorgsflikarna ligger nu i en
bubbelrad i listans översta rad, var och en med ett färgat antal olästa
meddelanden. Markeringen glider till fliken du väljer, och att klicka på
den öppna fliken tar dess lista tillbaka till början. När listan är smal
får raden en egen rad och visar ikoner, med den öppna flikens namn kvar;
på en telefon ligger den i listans rad, med Uppdatera i menyn Mer.
"""

["2026-09-30-1805-account-menu"]
title = "Kontoinformation i högerklicksmenyn"
text = """
Högerklicka på ett kontos namn i mapplistan, eller dess inkorg under
Alla konton, för att se dess adress, om det är synkroniserat och när det
senast kontrollerades, och hur mycket lagringsutrymme det använder.
Därifrån kan du söka efter ny e-post i inkorgen, skriva ett nytt
meddelande från kontot, öppna dess inställningar eller logga in igen när
inloggningen har gått ut.
"""

["2026-09-30-1819-glass-search-box"]
title = "En sökruta av glas"
text = """
Med suddig bakgrund på är sökrutan av frostat glas med en svag kant
medan du inte använder den, och blir helt fylld när du klickar i den för
att skriva.
"""

["2026-09-30-1820-search-cancel-restores"]
title = "Avbryt en sökning och få tillbaka din e-post"
text = """
Esc eller att tömma sökrutan tar dig nu tillbaka dit du var: samma mapp,
samma plats i listan och det meddelande du hade öppet. Öppna i stället
ett resultat så tar sökningen över som förut.
"""

["2026-09-30-1840-first-run-window"]
title = "En vänligare första start"
text = """
Medan du konfigurerar Katna Mail syns fönstret bakom
konfigurationssidorna under en lätt slöja: apparna, Skriv och sökrutan,
med mjuka platshållare där dina mappar och din e-post kommer att visas.
Ett nytt steg erbjuder ett Katna-konto och listar vad det slår på
(läskvitton, länkspårning, Aktivitet och översättning), eller så kan du
hoppa över det.
"""

