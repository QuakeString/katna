text = """
Frostade dialogrutor är mer täckande än menyer, så att en full
e-postlista inte längre syns igenom dem. Om, Nyheter och Sök efter
uppdateringar öppnas utan att mörka fönstret bakom.
"""

["2026-10-02-0111-chat-pin-text"]
title = "Fäst några ord från en chatt"
text = """
I en chatt (Inställningar > Experimentellt) kan texten i en bubbla nu
markeras och kopieras som i vilket meddelande som helst. Högerklicka på
ord du har markerat i en bubbla och välj Fäst högst upp för att behålla
dem i chattens fästrad.
"""

["2026-10-02-0124-event-editor-clear"]
title = "Händelseredigeraren är fri från Ny händelse"
text = """
Vänsterpanelens knapp Ny händelse ligger inte längre över titeln på en
händelse du skriver eller ändrar i den fullständiga redigeraren. Den
kommer tillbaka när redigeraren stängs.
"""

["2026-10-02-0150-chat-format-bar"]
title = "En fylligare Aa-rad i chattar"
text = """
Chattens svarsruta har nu skrivfönstrets verktyg i Aa-raden: ångra,
teckensnitt, storlek, justering och indrag, bredvid de stilar den hade.
I ett smalt fönster bryts den till en andra rad. Färgknappen visar din
textfärg och markeringsfärg sida vid sida, i skrivfönstret också.
"""

["2026-10-02-0210-conversation-summaries"]
title = "Sammanfatta en konversation"
text = """
Högerklicka på en konversation och välj Sammanfatta, eller tryck på
Shift+S, för ett kort bredvid som säger vad den handlar om, vad som har
bestämts och vad som väntar på dig, utan att öppna den eller markera den
som läst. I en öppen konversation lägger gnistan ovanför den
sammanfattningen under ämnet; i chattvyn ligger den i en remsa under
rubriken. Varje punkt anger vilket meddelande den kommer från, och när
ny e-post har kommit sedan du senast läste täcker sammanfattningen bara
den. Det kräver att skrivhjälp med AI är på i Inställningar > Skriva.
"""

["2026-10-02-0215-system-colors-follow-mode"]
title = "Ljust och mörkt fungerar med Systemfärger"
text = """
Med Färger inställt på System och ett skrivbordsschema som bara är mörkt
(eller bara ljust) växlar Inställningar > Utseende > Läge nu Katna
mellan ljust och mörkt igen: den andra sidan använder Katnas egna färger
i skrivbordets accentfärg.
"""

["2026-10-02-0218-signature-details-on-card"]
title = "Signaturuppgifter där de hör hemma"
text = """
En persons kort visar inte längre signaturen som ett block. Uppgifterna
hamnar där de hör hemma: varje telefonnummer, märkt mobil, direkt eller
fax, bland kontaktuppgifterna, och företagets koncern, kontor, webbplats
och sidor i avsnittet Företag. Sociala sidor visas som små enfärgade
ikoner, och bilder, banderoller och sidfötter utelämnas.
"""

["2026-10-02-0225-chat-subject-line"]
title = "Se när en chatts ämne ändras"
text = """
I en chatt (Inställningar > Experimentellt) säger nu en liten rad i
mitten när någon har ändrat ämnet, på samma sätt som den säger vem som
lade till vem.
"""

["2026-10-02-0225-no-blur-ghost"]
title = "Inget suddigt spöke när en dialogruta stängs"
text = """
Att stänga Om, Nyheter, Sök efter uppdateringar eller någon frostad
dialogruta eller meny lämnar inte längre kvar en suddig fläck ett
ögonblick: oskärpan tonar bort med dialogrutan.
"""

["2026-10-02-0236-chat-on-phones"]
title = "Chattar passar en telefon"
text = """
I ett fönster i telefonstorlek håller sig en chatt (Inställningar >
Experimentellt) till en rubrikrad med Tillbaka och ⋮, och dess bubblor
använder mer av bredden. Håll på en bubbla för att ta fram dess meny
nedifrån, och tryck på ett namn eller en bild för att se personens kort
på samma sätt. Svep ned endera eller tryck utanför för att stänga den.
"""

["2026-10-02-0258-frost-stays-on-scroll"]
title = "Frostningen ligger still när en lista rullar"
text = """
I en frostad lista som rullar, som personerna i en chatt eller en lång
meny, ligger den frostade bakgrunden nu kvar på plats medan raderna
rullar över den.
"""

["2026-10-02-0301-rephrase-card-above-tools"]
title = "Omformulera ligger ovanför formateringsraden"
text = """
Kortet Omformulera öppnas nu precis ovanför formateringsraden, i
svarsrutan och i skrivfönstret, i stället för över e-postlistan. Dra i
det lilla handtaget högst upp för att flytta det ur vägen; det öppnas på
sin vanliga plats igen nästa gång.
"""

["2026-10-02-0306-fainter-lines-light"]
title = "Svagare linjer i ljust läge"
text = """
I ljust läge är linjerna mellan meddelandena i listan och mellan
meddelandena i ett öppet e-postmeddelande svagare, så att sidan ser
lugnare ut.
"""

["2026-10-02-0315-card-button-bar"]
title = "Personkortet håller knapparna inom räckhåll"
text = """
Rulla personkortet så glider dess knappar upp i en smal frostad rad
bredvid stängningsknappen, med en liten bild av personen.
Stängningsknappen ligger inte längre över det du läser.
"""

["2026-10-02-0412-button-hover"]
title = "Knappar reagerar mjukt på pekaren"
text = """
När du pekar på en knapp växer dess runda bakgrund nu från mitten och
tonar in, som i Gmail, och tonar snabbt bort när du går vidare. Svara,
Vidarebefordra och andra bubbelknappar tonar in mjukt.
"""

["2026-10-02-0425-chat-draft-to-mail"]
title = "Ditt chattsvar följer med dig till E-post"
text = """
Att byta en chatt till E-post medan du skriver ett svar rullar nu ned
till svaret med markören kvar i det, och att byta tillbaka behåller det
också.
"""

["2026-10-02-0425-write-reply"]
title = "Skriv ett svar med AI"
text = """
Medan ett svar eller en vidarebefordran fortfarande är tom skriver
gnistan bredvid Formatering (eller Ctrl+J) det åt dig. Välj en av tre
idéer hämtade från konversationen, eller säg med egna ord vad det ska
säga, välj sedan Infoga för utkastet och ändra det du vill. När du
börjar skriva omformulerar gnistan igen. Det kräver att skrivhjälp med
AI är på i Inställningar > Skriva.
"""

["2026-10-02-0430-compose-beside-reply"]
title = "Skriv medan ett svar är halvskrivet"
text = """
Skriv öppnar nu ett nytt meddelande även medan du skriver ett svar, i
chatten eller under konversationen. Svaret väntar som du lämnade det och
kommer tillbaka när det nya meddelandet har skickats eller stängts,
eller när du klickar för att svara på konversationen igen.
"""

["2026-10-02-0436-mark-unread-icon"]
title = "En tydligare ikon för Markera som oläst"
text = """
Markera som oläst visar nu ett kuvert med en prick, i menyer, i
verktygsraderna och på ett meddelandes hovringsknappar, så att den inte
längre ser ut som en vanlig e-postikon.
"""

["2026-10-02-0452-fainter-pane-lines"]
title = "Lugnare verktygsrader och flikar"
text = """
I ljust läge är linjerna under verktygsraderna och det öppna
meddelandets rubrik, och ovanför Svara och Vidarebefordra, lika svaga
som linjerna mellan meddelanden. Bakgrunden bakom inkorgsflikarna är
också ljusare.
"""

["2026-10-02-0453-google-drive-in-files"]
title = "Din Google Drive i Filer"
text = """
Filer visar nu varje Google-kontos lagringsutrymme under Molnlagring i
sidokolumnen. Öppna dess mappar, sök i det och öppna, bifoga eller ladda
ned en fil direkt där. Första gången trycker du på Tillåt så att Katna
får läsa din Drive.
"""

["2026-10-02-0515-rephrase-subject"]
title = "Omformulera ämnet"
text = """
När du har skrivit ett ämne erbjuder en gnista i slutet av raden tre
andra sätt att säga det, skrivna utifrån ämnet och vad ditt meddelande
säger hittills. Välj ett för att använda det; Ångra lägger tillbaka det
du skrev. Det kräver att skrivhjälp med AI är på i Inställningar >
Skriva.
"""

["2026-10-02-0525-quieter-compose"]
title = "Ett lugnare skrivfönster"
text = """
Fönstret Nytt meddelande svävar med jämnt avstånd till fönstrets kanter.
Till, Kopia, Dold kopia och Från sitter ihop utan linjer emellan,
mottagarna är mjukt fyllda brickor, och Från är en diskret rad.
Kryptering, signering, spårning och kvitton delar en liten grupp, och
skrivverktygen sitter på en mjuk rad bredvid Skicka.
"""

["2026-10-02-0553-upload-to-drive"]
title = "Ladda upp till Google Drive från Filer"
text = """
Med en Google Drive öppen i Filer blir knappen Skriv till Ladda upp.
Klicka på den för att skicka filer till den öppna mappen, eller använd
dess pil för att ladda upp en hel mapp. Första gången trycker du på
Tillåt så att Katna får lägga till filer i din Drive.
"""

["2026-10-02-0555-reply-from-summary"]
title = "Svara från sammanfattningen"
text = """
Sammanfattningskortet du öppnar med ett högerklick har nu Svara. Det gör
om samma kort till ett svar: välj en idé eller säg vad det ska säga,
ändra utkastet om du vill och välj sedan Skicka, eller Öppna det i
konversationen för att fortsätta skriva. Ett svar du stänger utan att
skicka väntar i svarsrutan. Kortet öppnas nu också där du klickade.
"""

["2026-10-02-0559-draft-saved-signature-tag"]
title = "Utkast sparas medan du skriver"
text = """
Ett meddelande du skriver sparar sig nu självt i Utkast med några
sekunders mellanrum, och ”Utkastet har sparats” visas diskret bredvid
titeln. En svag etikett bredvid signaturen visar dess namn; klicka på
den för att välja en annan. Skrivfönstrets hörn linjerar nu också med
kortet bredvid.
"""

["2026-10-02-0654-attach-from-drive"]
title = "Bifoga från Google Drive"
text = """
Gemet i skrivfönstret öppnar nu filväljaren i Filer, samma som chattens
Från Filer, med din Google Drive bredvid dina e-postfiler och Den här
datorn… för allt annat. Filer som får plats läggs i meddelandet; stora
filer och Google Docs skickas som en länk, delad med mottagarna när du
skickar.
"""

["2026-10-02-0734-peek-and-reply-in-notifications"]
title = "Kika och svara från aviseringen"
text = """
En avisering om ny e-post har nu Kika, som visar själva meddelandet i
samma avisering, och Svara, där du skriver ditt svar direkt där och
trycker på Skicka. Det skickas från kontot meddelandet kom till, efter
din tid för Ångra skicka; Ångra öppnar det i Katna Mail så att du kan
skriva vidare. På Linux har ny e-post också en egen, tydligare signal;
välj en annan i Inställningar > Aviseringar.
"""

["2026-10-02-0735-drive-viewer-opens-at-once"]
title = "Drive-filer öppnas direkt"
text = """
Att öppna en fil från din Drive tar fram visaren direkt, med en
snurrande båge tills filen är här. Notiser längst ned i fönstret tar nu
emot sina egna klick, så att Stäng inte längre klickar på det som ligger
under dem.
"""

["2026-10-02-0740-smaller-updates"]
title = "Mindre uppdateringar"
text = """
Uppdateringar hämtar nu bara det som har ändrats, oftast några megabyte
i stället för hela paketet. Katna bygger den nya versionen utifrån den
du har och kontrollerar den före installationen, och hämtar hela paketet
när det inte går.
"""

["2026-10-02-0755-faint-lines-everywhere"]
title = "Svaga linjer överallt"
text = """
I ljust läge är varje linje mellan saker, under rubriker och runt kort
nu lika svag som linjerna mellan meddelanden, även på
sammanfattningskortet. Fält, brickor och knappar behåller sin tydliga
kontur.
"""

["2026-10-02-0756-ai-replies-signed"]
title = "AI-svar slutar med din signatur"
text = """
Svar och anteckningar som skrivits av AI slutar inte längre med ”Vänliga
hälsningar” och ditt namn. Din signatur skriver under dem i stället: i
sammanfattningskortets svar väljer signaturetiketten under texten
vilken, som i skrivfönstret.
"""

["2026-10-02-0801-unified-inbox-tabs"]
title = "Flikar i den gemensamma inkorgen"
text = """
Inkorgen för alla dina konton har nu också flikar: Primär, Kampanjer,
Socialt, Uppdateringar och Forum, med varje kontos e-post i fliken för
sin typ. En prick bredvid varje avsändare visar vilket konto ett
meddelande kom från. Välj ett konto under den för att se det kontots
egna flikar, eller välj en annan uppsättning i Inställningar > Inkorg.
"""

["2026-10-02-0805-feeds-removed"]
title = "Flöden har tagits bort från vänsterpanelen"
text = """
Katna kommer inte att läsa RSS- och Atom-flöden ändå, så knappen Flöden
och dess sida ”kommer snart” har lämnat panelen till vänster. Filer
behåller Ctrl+7.
"""

["2026-10-02-0820-drive-bin-and-rename"]
title = "Byt namn på och släng filer i molnlagringen"
text = """
I Filer har en fil eller mapp i din Google Drive eller OneDrive nu Byt
namn och Flytta till papperskorgen i sin meny. Byt namn låter dig skriva
över namnet på plats (F2), och Flytta till papperskorgen (Del) kommer
med Ångra.
"""

["2026-10-02-0827-files-chips-on-phones"]
title = "Filers brickor passar på telefoner"
text = """
På en telefon klipps brickorna på sidan Filer inte längre av vid kanten.
Filtyperna fälls ihop till sina ikoner, där den du har valt behåller sin
etikett, och brickorna för person, dagar och ordning får en egen rad.
"""

["2026-10-02-0828-uploads-tray"]
title = "Se dina uppladdningar medan de pågår"
text = """
Filer du laddar upp till Google Drive eller OneDrive visas nu i en låda
nere till höger, var och en med en ring som fylls medan den laddas upp
och tiden som återstår. Avbryt en eller alla, fäll undan lådan och
klicka på en färdig fil för att öppna dess mapp.
"""

["2026-10-02-0838-drive-share"]
title = "Dela filer i molnlagringen från Katna"
text = """
Dela… i menyn för en Google Drive- eller OneDrive-fil i Filer öppnar en
dialogruta Dela: lägg till personer som Läsare, Kommentator eller
Redigerare, ändra eller ta bort vem som redan har åtkomst, och öppna den
för alla som har länken. Molntjänsten skickar e-post till dem bara om du
kryssar för det.
"""

["2026-10-02-0909-soft-search-box"]
title = "En mjukare sökruta"
text = """
Sökrutan högst upp är lättare: en mycket svag kant och fyllning medan du
inte använder den, och ett vitt fält med en mjuk accentkant medan du
skriver, i stället för den grå bubblan med en tjock färgad ring.
"""
