"""

["2026-10-02-0315-card-button-bar"]
title = "Kadi ya mtu huweka vitufe vyake karibu"
text = """
Sogeza kadi ya mtu na vitufe vyake huteleza juu kuingia kwenye upau mwembamba wenye ukungu kando ya kitufe cha kufunga, pamoja na picha ndogo ya mtu huyo. Kitufe cha kufunga hakikai tena juu ya unachosoma.
