["2026-10-02-0412-button-hover"]
title = "Vitufe huitikia kiashiria kwa ulaini"
text = """
Unapoelekeza kwenye kitufe, mandharinyuma yake ya mviringo sasa hukua kutoka katikati na kujitokeza polepole, kama katika Gmail, na hufifia haraka unapoondoka. Jibu, Sambaza na vitufe vingine vya kidonge hujitokeza kwa upole.
