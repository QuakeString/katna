Katika orodha yenye ukungu inayosogezwa, kama watu walio kwenye gumzo au menyu ndefu, mandharinyuma yenye ukungu sasa hubaki mahali pake huku safu zikisogea juu yake.
"""

["2026-10-02-0301-rephrase-card-above-tools"]
title = "Andika upya hukaa juu ya upau wa uumbizaji"
text = """
Kadi ya Andika upya sasa hufunguka juu kidogo ya upau wa uumbizaji, kwenye kisanduku cha jibu na katika Tunga, badala ya juu ya orodha ya barua. Ikokote kwa kishikio kidogo kilicho juu yake ili kuiondoa njiani; hufunguka mahali pake pa kawaida tena wakati ujao.
