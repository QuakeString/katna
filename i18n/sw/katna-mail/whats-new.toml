["2026-10-02-0425-chat-draft-to-mail"]
title = "Jibu lako la gumzo hukufuata hadi Barua"
text = """
Kubadilisha gumzo kuwa Barua ukiwa unaandika jibu sasa husogeza chini hadi kwenye jibu huku kishale chako kikiwa bado ndani yake, na kurudi pia hulihifadhi.
