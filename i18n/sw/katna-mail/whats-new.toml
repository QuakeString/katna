finyu zaidi na kufifia kikamilifu, bila ile kingo ngumu ambayo hapo awali
iliacha kando ya dirisha. Vitufe vya dirisha sasa vina ukubwa wa vile vya
KDE mwenyewe, na hukaa mbali na kando ya dirisha kama vile vilivyo mbali
na sehemu yake ya juu.
"""

["2026-09-28-1622-update-from-the-app"]
title = "Sasisha Katna kutoka kwenye programu"
text = """
Katna sasa hupakua matoleo mapya yenyewe na kukuambia toleo linapokuwa
tayari. Bofya Sasisha kwenye arifa au kwenye Kuhusu: Katna Mail itasema
