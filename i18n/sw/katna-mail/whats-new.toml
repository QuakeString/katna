["2026-09-28-1852-frosted-search-bar"]
title = "Upau wa utafutaji wenye ukungu wa kioo"
text = """
Mandharinyuma yenye ukungu yakiwashwa, upau wa utafutaji huruhusu ukungu
upite kama upau unaouzunguka, badala ya kukaa juu yake kama kidonge cha
kijivu thabiti.
"""

["2026-09-28-1906-scroll-to-switch-accounts"]
title = "Sogeza juu ya picha yako kubadilisha akaunti"
text = """
Kielekezi kikiwa juu ya picha ya akaunti juu kulia, zungusha gurudumu la
kipanya kwenda akaunti inayofuata au iliyotangulia, akaunti moja kwa
kila mbofyo. Picha huviringika hadi akaunti mpya, kama jina la programu
linavyoviringika unapobadilisha programu, na kuchagua akaunti kutoka
kwenye kadi kunaviringika vivyo hivyo.
"""

["2026-09-28-1918-many-recipients"]
title = "Nafasi kwa wapokeaji wengi"
text = """
Wapokeaji baada ya mstari wa kwanza sasa hutumia upana wote, na orodha
ndefu husogezwa ndani ya mistari michache, hivyo barua yenyewe hubaki
karibu kila wakati. Ukiondoka kwenye sehemu hiyo hukunjwa hadi mstari
mmoja, kama “Kay, Sam, wengine 19”; ibofye kuona wote tena.
"""

["2026-09-28-1952-activity-by-account"]
title = "Ripoti ya shughuli kwa akaunti moja"
text = """
Ripoti ya shughuli sasa ina kichagua akaunti kando ya tarehe. Chagua Akaunti zote
au moja kati yake, na ujumbe unaofuatiliwa, viwango, chati, mada na Kisanduku chako
cha barua vyote hufuata. Ripoti hueleza ni akaunti gani inaonyesha na hukumbuka chaguo lako.
"""

["2026-09-28-2002-reader-arrows-always-shown"]
title = "“Mpya zaidi” na “Ya zamani zaidi” daima kwenye upau wa zana"
text = """
Kidirisha cha kusoma kiwe chembamba kiasi gani, kaunta na mishale ya Mpya zaidi na
Ya zamani zaidi hubaki upande wa kulia wa upau wake wa zana. Vitufe unavyotumia kwa
nadra hamishiwa kwenye menyu ya Zaidi kimoja baada ya kingine, ikiwemo swichi za
maelezo ya mwasiliani na rangi asili.
"""

["2026-09-28-2026-large-files-drive"]
title = "Tuma faili za ukubwa wowote"
text = """
Ukiwa umeingia kwa Google, faili lenye ukubwa zaidi ya kikomo cha barua cha 25 MB huenda
kwenye Google Drive yako mara tu unapoliambatisha, na ujumbe hubeba kiungo chake, kama
Gmail. Hushirikiwa na wapokeaji unapobonyeza Tuma; Katna huuliza tu ikiwa mtu hawezi
kupewa ufikiaji.
"""

["2026-09-28-2059-recipient-list-scrolling"]
title = "Orodha ndefu za wapokeaji zenye mwendo laini zaidi"
text = """
Orodha ndefu ya wapokeaji sasa ina upau wake wa kusogeza na husogea mstari mmoja kwa
wakati, na mazungumzo huendelea kusogea tu orodha inapofika mwisho. Kuongeza wapokeaji
hakufanyi tena vitufe vilivyo chini kuruka.
"""

["2026-09-28-2106-check-for-new-mail"]
title = "Kagua barua mpya"
text = """
Bofya kulia folda au akaunti kwenye kidirisha cha folda ili upate “Kagua barua mpya”,
“Tia alama zote kuwa zimesomwa”, folda mpya ndani yake, au “Safisha Tupio”. “Onyesha
upya” juu ya orodha sasa pia huleta kutoka kwa seva. Katna inapokagua, mishale kwenye
“Onyesha upya” na kando ya Kikasha huzunguka, na “Inakagua barua mpya…” huonekana juu
ikichukua muda zaidi ya kitambo.
"""

["2026-09-28-2101-large-files-onedrive"]
title = "Faili kubwa kupitia OneDrive"
text = """
Akaunti za Outlook.com, Hotmail na akaunti nyingine za Microsoft sasa hutuma faili
zinazozidi kikomo cha barua kama akaunti za Google: faili huenda kwenye OneDrive yako
mara tu unapoliambatisha, na ujumbe hubeba kiungo chake, kama Outlook.
"""

["2026-09-28-2108-activity-checking"]
title = "Hakuna tena mwako wa kuingia kwenye Shughuli"
text = """
Mara tu Katna inapoanza, Shughuli huonyesha upau mwembamba wa kupakia wakati inakagua
akaunti yako ya Katna, badala ya kukuomba uingie kwa muda mfupi. Katna pia hukagua akaunti
mara inapoanza, kwa hivyo kusubiri ni kwa muda mfupi zaidi.
"""

["2026-09-28-2130-update-dialog"]
title = "Masasisho yana dirisha lake"
text = """
Usaidizi > Kagua masasisho hufungua dirisha lake lenyewe. Linaonyesha toleo lako kando
ya jipya, pamoja na lini kila moja lilijengwa na ukubwa wa upakuaji, kipya katika
sasisho na kila badiliko tangu toleo lako.
"""

["2026-09-28-2204-faster-start"]
title = "Kuanza haraka, usawazishaji laini"
text = """
Katna Mail hufungua kikasha kikubwa kwa haraka kwa takriban robo, na barua
zinapopakuliwa husasisha orodha mara moja kwa kila kundi badala ya baada ya kila jumbe
chache, kwa hivyo kusogeza na kuandika hubaki laini wakati wa usawazishaji.
"""

["2026-09-28-2111-link-addresses"]
title = "Ona kiungo kinaelekea wapi"
text = """
Weka kielekezi juu ya kiungo kwenye ujumbe na anwani inayofunguliwa kikweli huonekana chini ya kidirisha cha kusoma,
huku jina la tovuti likionekana wazi, bila kujali maandishi ya kiungo yanasema nini. Picha kutoka kwa mtumaji ambaye
unamwonyesha picha kila wakati sasa hupakiwa tu mtoa huduma wako wa barua anapothibitisha kuwa ujumbe huo umetoka kwake kweli.
"""

["2026-09-29-0120-update-build-details"]
title = "Zaidi kuhusu muundo wako"
text = """
Dirisha la Masasisho sasa linataja badiliko la hivi karibuni la kila toleo, linasema nakala yako
ilitoka wapi na Katna ilikagua masasisho mara ya mwisho lini.
"""

["2026-09-29-0213-coffee-button-play"]
title = "Igizo dogo ndani ya Ninunulie kahawa"
text = """
Weka kielekezi juu ya Ninunulie kahawa katika Kuhusu Katna: inaomba kahawa, chai, pizza, kisha
hakuna kabisa, inaridhika na maji na kusema asante kwa mimuliko michache. Huchezwa mara moja kila
wakati, na hubaki tuli ukipunguza mwendo.
"""

["2026-09-29-0215-update-checking-bar"]
title = "Dirisha la masasisho lililo wazi zaidi"
text = """
Upau unaokimbia huonekana wakati Katna inakagua masasisho, na toleo jipya hujitokeza kwa rangi yake
kando ya toleo ulilo nalo.
"""

["2026-09-29-0231-keys-beside-the-list"]
title = "Vitufe vinavyofuata kidirisha ulichomo"
text = """
Mazungumzo yakiwa kando ya orodha, ↑ na ↓ husogea kwenye orodha na kuonyesha kila mazungumzo. Tab au
Enter huingia kwenye mazungumzo, ambapo ↑ na ↓ huyasogeza; Esc au Shift+Tab hurudi kwenye orodha. F6
husogea kati ya vidirisha, kama katika programu nyingine za barua.
"""

["2026-09-29-0258-folders-slide-open"]
title = "Folda hutelezesha kufunguka na kufungika"
text = """
Kubofya mshale kando ya akaunti au folda kwenye kidirisha cha folda sasa hutelezesha kufungua au
kufunga vilivyomo, huku folda za chini zikiteleza pamoja, badala ya kuruka.
"""

["2026-09-29-0301-keys-menus-dialogs"]
title = "Folda, menyu na vidirisha vya mazungumzo kwa kibodi"
text = """
Shift+Tab au F6 hufikia kidirisha cha folda, ambapo ↑ na ↓ hufungua kila folda na Enter huenda
kwenye barua zake. ↑ na ↓ husogea kwenye menyu yoyote, na Enter huchagua. Shift+F10 au kitufe cha
menyu hufungua menyu ya kubofya kulia ya barua iliyochaguliwa. Madirisha ya mazungumzo hupokea
vitufe yanapofunguka: Enter hujibu, Esc hughairi, na Tab hubaki ndani yake. Kwenye ujumbe mpya,
Ctrl+Enter hutuma kutoka sehemu yoyote na Esc huufunga, ukihifadhi rasimu.
"""

["2026-09-29-0309-clock-tasks"]
title = "Majukumu kwenye saa ya eneo-kazi lako"
text = """
Bofya saa ili kuongeza jukumu na kutia alama kwenye majukumu yaliyokamilika. Kwenye Plasma,
bofya kulia saa kisha uchague Onyesha Mbadala ili kuchagua Saa ya Kidijitali ya Katna. Kwenye
GNOME, kadi ya Majukumu huonekana chini ya kalenda ya saa kuanzia utakapoingia tena.
"""

["2026-09-29-0329-pages-by-keyboard"]
title = "Kurasa kwa kibodi na kutoka kwenye upau wa kazi"
text = """
Ctrl+1 hadi Ctrl+5 hubadilisha kati ya Barua, Kalenda, Anwani, Majukumu na Madokezo, kama kwenye
Outlook, na menyu ya Nenda huorodhesha kurasa hizo pia. Bofya kulia Katna Mail kwenye upau wa
kazi ili kufungua Kalenda au Anwani mara moja.
"""

["2026-09-29-0412-tasks-page"]
title = "Katna Majukumu"
text = """
Bonyeza Ctrl+4 au chagua Majukumu upande wa kushoto: orodha zote kando kwa kando kama katika Google Tasks,
zikiwa na majukumu madogo, nyota, siku za kukamilisha, marudio na maelezo. Orodha husawazishwa na Google Tasks
na Microsoft To Do, na majukumu kutoka saa ya eneo-kazi pia yanaonekana hapa.
"""

["2026-09-29-0352-contacts"]
title = "Anwani zako, kutoka kwa kila akaunti"
text = """
Anwani kwenye reli ya kushoto sasa huorodhesha watu waliohifadhiwa kwenye akaunti zako za Gmail na Outlook na kwenye seva za CardDAV,
mara moja kila mmoja hata akaunti kadhaa zikiwahifadhi, pamoja na lebo, picha na maelezo yao.
Majina na picha zao pia huonekana kwenye barua zako na kwenye mapendekezo ya anwani.
"""

["2026-09-29-0350-katna-notes"]
title = "Katna Madokezo"
text = """
Chagua Madokezo kwenye upau wa kando ili kufungua Katna Madokezo, yaliyopangwa kama Google Keep. Andika dokezo au orodha ya kukagua, lipe rangi, liambatishe juu, na uteue vipengee moja kwa moja kwenye ubao.
Madokezo huhifadhiwa unapoandika; kisanduku cha kutafuta hulipata; Kumbukumbu na Tupio huyaweka kando, pamoja na Tendua.
"""

["2026-09-29-0412-notes-sync"]
title = "Madokezo kwenye kila kifaa"
text = """
Madokezo sasa yanakaa kwenye folda ya Madokezo ya akaunti yako ya barua, mahali ambapo Notes za iPhone na Mac huhifadhi yake, kwa hivyo yanakufuata hadi kwenye vifaa vyako vingine na kurudi kutoka huko.
Jina la akaunti chini ya dokezo linaonyesha mahali lilipohifadhiwa; libofye ili kuhamisha dokezo, au liweke kwenye kompyuta hii pekee.
"""

["2026-09-29-0451-add-mail-to-tasks"]
title = "Ongeza barua kwenye Majukumu"
text = """
Bonyeza Shift+T, kama kwenye Gmail, au bofya kulia barua na uchague Ongeza kwenye Majukumu.
Jukumu huchukua mada ya barua, na chipu yake ya Barua kwenye Majukumu hufungua barua hiyo tena.
"""

["2026-09-29-0412-calendar"]
title = "Kalenda yako, kando ya barua zako"
text = """
Kalenda huonyesha kalenda zako za Google, Microsoft na nyinginezo kwa siku, wiki, mwezi au kama ratiba, ukitumia vitufe vya Google Calendar.
Kitufe cha kalenda upande wa kulia wa barua zako hufungua ratiba ya siku, kikiwa na Jiunge kwa simu za mkutano.
Ingia tena kwenye akaunti ili Katna isome kalenda yake.
"""

["2026-09-29-0442-contacts-edit"]
title = "Kuunda na kubadilisha anwani"
text = """
Unda anwani kwenye ukurasa wa Anwani huongeza mtu kwenye akaunti unayochagua, na Hariri kwenye ukurasa wa anwani huibadilisha huko pia.
Futa ina Tendua, na Google na Outlook huweka anwani zilizofutwa kwenye tupio kwa muda.
"""

["2026-09-29-0538-notes-on-mail"]
title = "Madokezo kwenye barua"
text = """
Bofya kulia barua, au fungua menyu yake ya ⋮, kisha uchague Ongeza dokezo: dokezo lenye kichwa cha mada ya barua hufunguka juu ya barua.
Madokezo yake huonekana chini ya mada kila unapofungua barua hiyo tena, na chip ya Barua ya dokezo hukurudisha kwenye barua.
"""

["2026-09-29-0542-caldav-tasks"]
title = "Majukumu kwenye seva yako ya barua"
text = """
Akaunti zinazoingia kwa nenosiri sasa huweka majukumu yake kwenye seva ya barua inapotoa CalDAV,
kwa hivyo majukumu pia huonekana kwenye programu za seva yenyewe na kwenye simu.
"""

["2026-09-29-0521-calendar-edit"]
title = "Ongeza na ubadilishe matukio"
text = """
Bofya au buruta kwenye kalenda, au bonyeza C, ili kuongeza tukio. Buruta tukio ili kulihamisha au ukingo wake wa chini ili kubadilisha urefu wake,
kisha lifungue ili kubadilisha muda, marudio, vikumbusho, wageni au kuongeza simu ya Meet au Teams.
Jibu mialiko kwa Ndiyo, Hapana au Labda. Tendua hurudisha kila kitu.
"""

["2026-09-29-0546-calendar-any-account"]
title = "Kalenda kutoka akaunti zaidi"
text = """
Sasa Katna hupata kalenda za Yahoo, Zoho, iCloud, Fastmail, GMX na akaunti nyingine, hata zikiwa kwenye seva tofauti na ya barua.
Hujaribu njia bora ya kila akaunti kwanza, na njia nyingine ikiwa hiyo imezimwa.
"""

["2026-09-29-0625-tasks-today"]
title = "“Leo” katika Majukumu"
text = """
“Leo”, chini ya “Majukumu yote”, hukusanya yanayostahili leo na yaliyochelewa kutoka orodha zote, pamoja na orodha ya kila moja.
Jukumu linaloongezwa hapo litastahili leo.
"""

["2026-09-29-0631-invitation-card"]
title = "Mialiko kwenye barua yako"
text = """
Mwaliko sasa unaonekana kama kadi juu ya barua: lini na wapi, nani aliyeuandaa, siku yako kuuzunguka ikiwa na alama ya mgongano wowote, Jiunge,
na Utaenda? Ndiyo, Hapana au Labda, vyote vikijibiwa papo hapo.
"""

["2026-09-29-0616-note-labels"]
title = "Lebo kwenye madokezo"
text = """
Kitufe cha lebo kwenye dokezo huliwekea lebo, kama kwenye Keep. Lebo zako zimeorodheshwa kando ya “Madokezo”, kila moja ikionyesha madokezo yake tu.
“Hariri lebo” hubadilisha majina au kuzifuta, pamoja na Tendua.
"""

["2026-09-29-0630-tasks-more-accounts"]
title = "Majukumu kutoka akaunti zaidi"
text = """
Majukumu sasa yanasawazishwa pia na Yahoo, Zoho, iCloud, Fastmail na akaunti nyingine ambazo majukumu yake yako kwenye seva tofauti na ya barua.
Katna hujaribu njia bora ya kila akaunti kwanza na hukumbuka ile inayofanya kazi.
"""

["2026-09-29-0651-schedule-meeting"]
title = "Panga mkutano kutoka kwa barua"
text = """
Bofya-kulia mazungumzo, au fungua ⋮, kisha chagua Panga mkutano: tukio jipya hufunguka kwenye ukurasa wa Kalenda
likiwa na mada kama kichwa chake na kila mtu kwenye mazungumzo kama mgeni.
"""

["2026-09-29-0705-running-late"]
title = "Umechelewa? Waambie wote kwa mbofyo mmoja"
text = """
Tukio lenye wageni sasa lina Tuma barua pepe kwa wageni, na kuanzia saa moja kabla halijaanza, Nimechelewa:
barua kwa kila mtu, kutoka akaunti ya kalenda hiyo, tayari kutumwa.
"""

["2026-09-29-0607-contact-labels"]
title = "Lebo za anwani"
text = """
Weka lebo kwenye ukurasa wa anwani huwasha na kuzima lebo au kuunda mpya, na ⋮ kando ya lebo hubadilisha jina lake, kuifuta au kuandikia kila mtu aliye ndani yake.
Lebo huendana na Google Contacts na Outlook, na kila mabadiliko yana Tendua.
"""

["2026-09-29-0640-add-to-contacts"]
title = "Ongeza kwenye anwani kutoka Barua"
text = """
Paneli ya anwani kando ya mazungumzo ina Ongeza kwenye anwani kwa mtu ambaye hujamhifadhi: mbofyo mmoja huhifadhi jina lake, anwani yake na simu, cheo na kampuni kutoka kwenye sahihi yake, pamoja na Tendua.
Kwa mtu aliyehifadhiwa, kitufe hicho hicho humfungua kwenye ukurasa wa Anwani.
"""

["2026-09-29-0720-focus-time"]
title = "Muda wa kuzingatia, Nje ya ofisi na Mahali pa kazi"
text = """
Tukio jipya sasa linaweza kuwa Muda wa kuzingatia, Nje ya ofisi au Mahali pa kazi, kama katika Google Calendar: chagua juu ya nyakati.
Google na Outlook huviona kama vilivyo, na katika Katna vinaonekana kwa aikoni yake yenyewe.
"""

["2026-09-29-0704-task-chips"]
title = "Majukumu kwenye barua yako"
text = """
Barua uliyoibadilisha kuwa jukumu sasa inaonyesha siku ya mwisho ya jukumu kwenye orodha, kwa rangi nyekundu likishachelewa.
Ibofye ili kufungua jukumu.
"""

["2026-09-29-0638-other-contacts"]
title = "Anwani nyingine"
text = """
Anwani sasa ina Anwani nyingine: watu ambao umewatumia barua pepe kutoka Gmail lakini hukuwahi kuwahifadhi, jinsi Gmail inavyowaweka.
Mhifadhi yeyote kwa mbofyo mmoja, ukiwa na Tendua, au anza barua pepe kwake.
"""

["2026-09-29-0745-answer-by-mail"]
title = "Jibu mialiko kutoka akaunti yoyote"
text = """
Mwaliko uliofika kwenye akaunti isiyo na kalenda sasa una Ndiyo, Hapana na Labda pia:
jibu lako hutumwa kwa mwandaaji kwa barua pepe, na kalenda yake huliweka alama.
"""

["2026-09-29-0710-meeting-notes"]
title = "Madokezo ya mkutano"
text = """
Fungua tukio kwenye Kalenda kisha uchague Andika madokezo ya mkutano: dokezo lenye jina la tukio hufunguka, likiwa na orodha ya waliohudhuria na nafasi ya hatua za kuchukua.
Kadi ya tukio huorodhesha madokezo yake, na chipu ya Tukio kwenye dokezo hukurudisha kwenye siku hiyo.
"""

["2026-09-29-0751-go-to-pdf-page"]
title = "Nenda moja kwa moja kwenye ukurasa wa PDF"
text = """
Nambari ya ukurasa chini ya PDF sasa ni kisanduku:
kibofye au bonyeza Ctrl+G, andika nambari ya ukurasa kisha bonyeza Enter ili kuruka hadi huko.
"""

["2026-09-29-0715-tasks-on-calendar"]
title = "Majukumu kwenye kalenda"
text = """
Majukumu yenye siku ya kukamilika sasa yanaonekana kwenye Kalenda, kwa wakati wake au pamoja na matukio ya siku nzima.
Unaweza kuyatia alama kuwa yamekamilika hapo hapo, kubofya ili kufungua, au kuyaburuza hadi siku au wakati mwingine ili kutenga muda huo kwa ajili yake.
"""

["2026-09-29-0756-event-reminders"]
title = "Vikumbusho vya matukio yako"
text = """
Matukio sasa hukukumbusha kwa arifa, hata wakati Katna imefungwa.
Jiunge hufungua simu ya video, na Ahirisha dakika 5 hukukumbusha tena baada ya dakika tano.
"""

["2026-09-29-0758-contacts-merge-import"]
title = "Unganisha anwani zinazojirudia, leta na hamisha"
text = """
Anwani sasa zina Rekebisha na udhibiti: Unganisha na urekebishe hutafuta watu waliohifadhiwa mara mbili (jina au nambari ya simu sawa) na kuwaunganisha kwa mbofyo mmoja, pamoja na Tendua.
Leta huingiza watu kutoka faili ya vCard, ikiwaacha wale waliohifadhiwa tayari, na Hamisha huhifadhi kila mtu, au lebo moja, kama faili ya vCard.
