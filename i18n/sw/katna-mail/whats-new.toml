["2026-10-08-0641-encryption-finds-keys"]
title = "Barua zilizosimbwa hupata funguo"
text = """
Simba ikiwa imewashwa, ufunguo wa mpokeaji usiye nao hutafutwa katika saraka ya funguo ya kikoa chake mwenyewe unapotuma. Barua unazotuma hubeba ufunguo wako wa umma (Autocrypt) GnuPG inapokuwa na mmoja wa anwani yako, na funguo zinazofika kwa njia hiyo hiyo hutumika kusimba majibu yako. Barua za OpenPGP zilizosimbwa sasa huficha mada yake hadi zifunguliwe.
"""

["2026-10-08-0737-key-details"]
