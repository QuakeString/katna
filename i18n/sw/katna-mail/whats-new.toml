Kufunga Kuhusu, Kilicho kipya, Kagua masasisho au kidirisha au menyu yoyote yenye ukungu hakuachi tena kiraka cha ukungu nyuma kwa muda mfupi: ukungu hufifia pamoja na kidirisha.
"""

["2026-10-02-0236-chat-on-phones"]
title = "Gumzo hutosha kwenye simu"
text = """
Katika dirisha la ukubwa wa simu, gumzo (Mipangilio > Majaribio) hubaki na safu moja ya kichwa yenye Rudi na ⋮, na viputo vyake hutumia upana zaidi. Shikilia kiputo kuleta menyu yake kutoka chini, na gusa jina au picha kuona kadi ya mtu huyo kwa njia hiyo hiyo. Telezesha yoyote kati yake chini au gusa nje ili kuiweka kando.
"""

["2026-10-02-0258-frost-stays-on-scroll"]
title = "Ukungu hubaki palepale orodha inaposogezwa"
