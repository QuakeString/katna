tena mahali ulipoacha. Mipangilio > Jumla > Masasisho huzima upakuaji wa
kiotomatiki.
"""

["2026-09-28-1520-track-sealed-and-plain"]
title = "Fuatilia barua zenye sahihi, zilizosimbwa na za maandishi matupu"
text = """
Jicho sasa linafanya kazi kwenye barua zenye sahihi na zilizosimbwa pia:
nakala ya kila mpokeaji husainiwa au kusimbwa kando, kwa hivyo sahihi
zinabaki halali. Barua ya maandishi matupu haiwezi kuonyesha kufunguliwa,
lakini viungo vyake vinafuatiliwa, kwa hivyo unaona mtu anapofuata kiungo.
"""

["2026-09-28-1834-reply-after-closed-window"]
title = "Jibu huanza upya baada ya kufunga dirisha la ujumbe"
text = """
Kufunga barua iliyoandikwa kwenye dirisha lake sasa kunaiweka kwenye
Rasimu, na Jibu, Jibu wote na Sambaza hufungua barua mpya tena badala ya
kurudisha ile ya zamani.
