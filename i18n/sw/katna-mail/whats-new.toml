kwenye kitufe kimoja kidogo. Kufungua wapokeaji wa jibu hukuza kisanduku
juu kwa upole, na ujumbe uliyonukuliwa hufunguka na kufungwa kwa upole
chini ya mstari wa mawimbi unaoweza kubofya ili kuukunja tena.
"""

["2026-09-28-1620-softer-window-shadow"]
title = "Kivuli laini zaidi cha dirisha na vitufe vya ukubwa wa KDE"
text = """
