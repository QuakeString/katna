[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tools/*"]
# Patched third-party crates (see [patch.crates-io]); not ours to lint.
exclude = ["vendor"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Minimum supported Rust version. We always build with the latest stable
# (see rust-toolchain.toml); raise this deliberately when we need newer Rust.
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/QuakeString/katna"
publish = false

[workspace.dependencies]
katna-core = { path = "crates/katna-core" }
katna-store = { path = "crates/katna-store" }
katna-import = { path = "crates/katna-import" }
katna-meta = { path = "crates/katna-meta" }
katna-sync = { path = "crates/katna-sync" }
katna-search = { path = "crates/katna-search" }
katna-org = { path = "crates/katna-org" }
katna-render = { path = "crates/katna-render" }
katna-dav = { path = "crates/katna-dav" }
katna-dbus = { path = "crates/katna-dbus" }
katna-notify = { path = "crates/katna-notify" }
katna-platform = { path = "crates/katna-platform" }
katna-chrome = { path = "crates/katna-chrome" }
katna-ui = { path = "crates/katna-ui" }

# Third-party crates. Pin minor versions; upgrade deliberately.
async-channel = "2.5"
async-io = "2.6"
async-net = "2.0"
async-signal = "0.2"
blake3 = "1.8"
futures-lite = "2.6"
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
jiff = { version = "0.2.37", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
html5ever = "0.40.1"
levenshtein_automata = "0.2.1"
mail-parser = "0.11.9"
# Secret Service client; async-std selects zbus/async-io, not tokio.
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
rusqlite = { version = "0.40", features = ["bundled"] }
# Password prompts without echo (katnactl).
rpassword = "7.5"
rustls-platform-verifier = "0.7"
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2.0"
tantivy-fst = "0.5.0"
tantivy = { version = "0.26.2", default-features = false, features = ["mmap", "lz4-compression", "stemmer"] }
tempfile = "3.27"
thiserror = "2.0"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-segmentation = "1.13"
# async-io, so zbus runs on the same executor family as katna-sync.
zbus = { version = "5.19", default-features = false, features = ["async-io"] }
zstd = "0.14"

# Pimalaya protocol crates: exact versions, because they break often
# (docs/spikes/s2-pimalaya-io.md, problem 9). Only katna-sync uses them.
# imap-codec and imap-types come in through io-imap; they are listed so a
# `cargo update` cannot move them to the next alpha.
imap-codec = { version = "=2.0.0-alpha.9", default-features = false }
imap-types = { version = "=2.0.0-alpha.7", default-features = false }
io-imap = { version = "=0.6.0", default-features = false }
io-sasl = { version = "=0.1.0", default-features = false }
io-smtp = { version = "=0.3.0", default-features = false }

# GUI: exact pins (docs/ARCHITECTURE.md §20). GPUI is only allowed in the UI
# crates (deny.toml). The crate is imported as `gpui`.
gpui = { package = "gpui-pre", version = "=0.3.6" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.6", features = ["wayland", "x11"] }
# GPUI's Linux backend, for `set_kde_appmenu` from the patched copy below.
gpui-linux = { package = "gpui-pre-linux", version = "=0.3.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# D-Bus plumbing is not hot; build it for size to keep katna-daemon within
# its budget (ci/size-budgets.txt).
[profile.release.package.zbus]
opt-level = "s"

[profile.release.package.zvariant]
opt-level = "s"

[profile.release.package.oo7]
opt-level = "s"

[profile.release.package.ashpd]
opt-level = "s"

# IMAP parsing waits on the network anyway.
[profile.release.package.imap-codec]
opt-level = "s"

[profile.release.package.imap-types]
opt-level = "s"

[profile.release.package.io-imap]
opt-level = "s"

# Only log filters and rare regex searches use these.
[profile.release.package.regex-automata]
opt-level = "s"

[profile.release.package.regex-syntax]
opt-level = "s"

# GPUI's Linux backend with KDE global menu support (the window carries the
# app's dbusmenu address). vendor/gpui-pre-linux/KATNA.md lists the changes;
# drop this when upstream GPUI has an equivalent.
[patch.crates-io]
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
