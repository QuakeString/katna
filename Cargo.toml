[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tools/*", "server/*"]
# Patched third-party crates (see [patch.crates-io]); not ours to lint.
exclude = ["vendor"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Minimum supported Rust version. We always build with the latest stable
# (see rust-toolchain.toml); raise this deliberately when we need newer Rust.
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/QuakeString/katna"
publish = false

[workspace.dependencies]
katna-core = { path = "crates/katna-core" }
katna-store = { path = "crates/katna-store" }
katna-import = { path = "crates/katna-import" }
katna-meta = { path = "crates/katna-meta" }
katna-sync = { path = "crates/katna-sync" }
katna-search = { path = "crates/katna-search" }
katna-org = { path = "crates/katna-org" }
katna-render = { path = "crates/katna-render" }
katna-preview = { path = "crates/katna-preview" }
katna-dav = { path = "crates/katna-dav" }
katna-dbus = { path = "crates/katna-dbus" }
katna-notify = { path = "crates/katna-notify" }
katna-crypto = { path = "crates/katna-crypto" }
katna-platform = { path = "crates/katna-platform" }
katna-chrome = { path = "crates/katna-chrome" }
katna-ui = { path = "crates/katna-ui" }
katna-i18n = { path = "crates/katna-i18n" }
katna-translate = { path = "crates/katna-translate" }

# Third-party crates. Pin minor versions; upgrade deliberately.
async-channel = "2.5"
async-io = "2.6"
async-net = "2.0"
async-signal = "0.2"
blake3 = "1.8"
# Frame addresses for crash reports of stripped binaries (katna-core).
backtrace = "0.3.76"
emojis = "0.9"
futures-lite = "2.6"
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Pure-Rust PDF rasterizer for the attachment viewer (katna-preview).
hayro = "0.7.1"
calamine = "0.36.1"
# Office 97–2003 compound files: Word (.doc) and PowerPoint (.ppt) previews.
cfb = "0.15"
quick-xml = "0.41"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
# The version GPUI decodes pictures with; no extra formats of our own.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
resvg = { version = "0.46", default-features = false }
fontdb = { version = "0.23", default-features = false, features = ["fs", "memmap"] }
# Printing: lays a conversation out as a PDF for the print portal.
krilla = { version = "0.8", default-features = false, features = ["simple-text", "raster-images"] }
# The shaper krilla draws with, to measure lines the same way.
rustybuzz = "0.20"
jiff = { version = "0.2.37", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
html5ever = "0.40.1"
levenshtein_automata = "0.2.1"
mail-parser = "0.11.9"
# Secret Service client; async-std selects zbus/async-io, not tokio.
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
# Windows Credential Manager, where the daemon keeps passwords on Windows.
keyring-core = "1.0"
windows-native-keyring-store = "1.1"
# The Windows registry: start at login, the mail handler, Setup.
winreg = "0.56"
rusqlite = { version = "0.40", features = ["bundled"] }
# Password prompts without echo (katnactl).
rpassword = "7.5"
rustls-platform-verifier = "0.7"
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2.0"
spellbook = "0.4"
# Grammar checking. Without the thesaurus, which Katna does not use.
harper-core = { version = "2.11", default-features = false, features = ["concurrent"] }
tantivy-fst = "0.5.0"
tantivy = { version = "0.26.2", default-features = false, features = ["mmap", "lz4-compression", "stemmer"] }
tempfile = "3.27"
thiserror = "2.0"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-segmentation = "1.13"
# Which language a message is in, for automatic translation (katna-translate).
whatlang = "0.18"
# async-io, so zbus runs on the same executor family as katna-sync.
zbus = { version = "5.19", default-features = false, features = ["async-io"] }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "open_uri", "print"] }
zstd = "0.14"
# Languages (docs/ARCHITECTURE.md §13.10): Fluent for the interface's text,
# ICU4X for dates and numbers in the user's formats.
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"
icu_locale_core = { version = "2.3", features = ["alloc"] }
icu_datetime = "2.3"
icu_decimal = "2.3"
icu_calendar = "2.3"
icu_time = "2.3"
# ICU4X's text output, for patterns ICU4X's formatters don't offer.
writeable = "0.6"
# Formatters shared between threads (the daemon and GPUI both use them).
icu_provider = { version = "2.3", features = ["sync"] }

# Katna Server (server/katna-server) only: HTTP, its runtime and PostgreSQL.
# None of these may reach the daemon or the apps.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
deadpool-postgres = "0.14.2"
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }
sha2 = "0.10.9"
getrandom = "0.3"
# Katna accounts: password hashes and the mail with sign-up and reset codes.
argon2 = { version = "0.5.3", default-features = false, features = ["std"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "tokio1-rustls-tls"] }
http-body-util = "0.1.5"
# Katna Server passing translation requests to LibreTranslate.
hyper = { version = "1.11", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
tower = { version = "0.5.3", features = ["util"] }

# Pimalaya protocol crates: exact versions, because they break often
# (docs/spikes/s2-pimalaya-io.md, problem 9). Only katna-sync uses them.
# imap-codec and imap-types come in through io-imap; they are listed so a
# `cargo update` cannot move them to the next alpha.
imap-codec = { version = "=2.0.0-alpha.9", default-features = false }
imap-types = { version = "=2.0.0-alpha.7", default-features = false }
io-imap = { version = "=0.6.0", default-features = false }
io-sasl = { version = "=0.1.0", default-features = false }
io-smtp = { version = "=0.3.0", default-features = false }

# GUI: exact pins (docs/ARCHITECTURE.md §20). GPUI is only allowed in the UI
# crates (deny.toml). The crate is imported as `gpui`.
gpui = { package = "gpui-pre", version = "=0.3.6" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.6", features = ["wayland", "x11"] }
# GPUI's Linux backend, for `set_kde_appmenu` from the patched copy below.
gpui-linux = { package = "gpui-pre-linux", version = "=0.3.6", default-features = false }
# GPUI's renderer, for the backdrop blur marker from the patched copy below.
gpui-wgpu = { package = "gpui-pre-wgpu", version = "=0.3.6" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Katna Mail keeps its function names (not line tables), so crash reports
# and `coredumpctl` stacks are readable (docs/ARCHITECTURE.md §19.2): about
# 8 MB within its budget. The daemon cannot afford it and stays stripped.
[profile.release.package.katna-mail]
strip = "debuginfo"

# D-Bus plumbing is not hot; build it for size to keep katna-daemon within
# its budget (ci/size-budgets.txt).
[profile.release.package.zbus]
opt-level = "s"

[profile.release.package.zvariant]
opt-level = "s"

[profile.release.package.oo7]
opt-level = "s"

[profile.release.package.ashpd]
opt-level = "s"

# IMAP parsing waits on the network anyway.
[profile.release.package.imap-codec]
opt-level = "s"

[profile.release.package.imap-types]
opt-level = "s"

[profile.release.package.io-imap]
opt-level = "s"

# Only log filters and rare regex searches use these.
[profile.release.package.regex-automata]
opt-level = "s"

[profile.release.package.regex-syntax]
opt-level = "s"

# GPUI's Linux backend with KDE global menu support (the window carries the
# app's dbusmenu address) and compositor blur, and GPUI's renderer with a
# backdrop blur for frosted menus and popovers. vendor/*/KATNA.md lists the
# changes; drop these when upstream GPUI has an equivalent.
[patch.crates-io]
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
