#
# Local mail and calendar servers for Katna development and integration
# tests. See dev/README.md. Test use only: fixed passwords, self-signed TLS,
# and every port is bound to 127.0.0.1. Host ports can be changed with the
# KATNA_*_PORT variables listed in dev/README.md.

name: katna-dev

services:
  # IMAP, JMAP, SMTP, CalDAV, CardDAV and Sieve in one server.
  stalwart:
    image: docker.io/stalwartlabs/stalwart:v0.16
    environment:
      # Log in as admin without the first-run web wizard. seed.py uses it.
      STALWART_RECOVERY_ADMIN: admin:katna-dev
      STALWART_HOSTNAME: stalwart.katna.test
    volumes:
      - ./stalwart/config.json:/etc/stalwart/config.json:ro
      - stalwart-data:/var/lib/stalwart
    ports:
      - "127.0.0.1:${KATNA_STALWART_SMTP_PORT:-10025}:25" # SMTP (STARTTLS)
      - "127.0.0.1:${KATNA_STALWART_SUBMISSIONS_PORT:-10465}:465" # SMTP submission (implicit TLS)
      - "127.0.0.1:${KATNA_STALWART_IMAPS_PORT:-10993}:993" # IMAP (implicit TLS)
      - "127.0.0.1:${KATNA_STALWART_POP3S_PORT:-10995}:995" # POP3 (implicit TLS)
      - "127.0.0.1:${KATNA_STALWART_SIEVE_PORT:-14190}:4190" # ManageSieve
      - "127.0.0.1:${KATNA_STALWART_HTTP_PORT:-18080}:8080" # HTTP: JMAP, CalDAV, CardDAV, web admin
      - "127.0.0.1:${KATNA_STALWART_HTTPS_PORT:-18443}:443" # HTTPS: same as above

  # The most common real-world IMAP server. Static passdb: any user name,
  # one shared password.
  dovecot:
    image: docker.io/dovecot/dovecot:2.4.5
    environment:
      USER_PASSWORD: katna-dev
    volumes:
      - ./dovecot/katna.conf:/etc/dovecot/conf.d/zz-katna.conf:ro
      - dovecot-data:/srv/vmail
    ports:
      - "127.0.0.1:${KATNA_DOVECOT_IMAP_PORT:-20143}:31143" # IMAP (STARTTLS optional)
      - "127.0.0.1:${KATNA_DOVECOT_IMAPS_PORT:-20993}:31993" # IMAP (implicit TLS)
      - "127.0.0.1:${KATNA_DOVECOT_POP3_PORT:-20110}:31110" # POP3 (STLS optional)
      - "127.0.0.1:${KATNA_DOVECOT_SUBMISSION_PORT:-20587}:31587" # submission, relayed to Mailpit
      - "127.0.0.1:${KATNA_DOVECOT_SIEVE_PORT:-24190}:34190" # ManageSieve

  # Simple CalDAV/CardDAV reference server.
  radicale:
    image: docker.io/tomsquest/docker-radicale:3.8.1.0
    volumes:
      - ./radicale/config:/config/config:ro
      - ./radicale/users:/config/users:ro
      - radicale-data:/data
    ports:
      - "127.0.0.1:${KATNA_RADICALE_PORT:-5232}:5232"

  # Catches all outgoing mail from Stalwart and Dovecot.
  mailpit:
    image: docker.io/axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:${KATNA_MAILPIT_SMTP_PORT:-1025}:1025" # SMTP, no auth
      - "127.0.0.1:${KATNA_MAILPIT_HTTP_PORT:-8025}:8025" # web UI and API

  # Creates accounts and loads sample mail, events and contacts, then exits.
  seed:
    image: docker.io/library/python:3.13-alpine
    command: ["python3", "/seed/seed.py"]
    volumes:
      - ./seed:/seed:ro
    depends_on:
      - stalwart
      - dovecot
      - radicale
      - mailpit
    restart: "no"

volumes:
  stalwart-data:
  dovecot-data:
  radicale-data:
