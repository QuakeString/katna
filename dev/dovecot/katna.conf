#
# Katna dev overrides for the official dovecot/dovecot image.
# Loaded after the image's own conf.d files. Test use only.

# IPv4 only: many container hosts have no IPv6 and Dovecot refuses to start
# when it cannot bind "::".
listen = *

# The image serves IMAP, submission, LMTP and Sieve; add POP3.
protocols {
  pop3 = yes
}

# Allow LOGIN/AUTHENTICATE PLAIN on the non-TLS ports so tests can talk to
# the server without TLS. STARTTLS still works (snakeoil certificate).
auth_allow_cleartext = yes

# The image uses a static passdb: any user name works, and USER_PASSWORD
# (set in compose.yaml) is the password for every account.

hostname = dovecot.katna.test

# Mail sent through the submission service goes to Mailpit.
submission_relay_host = mailpit
submission_relay_port = 1025
submission_relay_trusted = yes
submission_relay_ssl = no

# An archive folder, so Archive can be tried as on Gmail (All Mail) or any
# server with a \Archive folder.
namespace inbox {
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

# A 1 GB storage quota per user, so clients can read it (IMAP QUOTA).
mail_plugins {
  quota = yes
}
protocol imap {
  mail_plugins {
    imap_quota = yes
  }
}
quota "User quota" {
  storage_size = 1G
}
