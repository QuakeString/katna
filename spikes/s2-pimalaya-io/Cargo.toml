# Spike S2 (docs/IMPLEMENTATION_PLAN.md §4): throw-away code, kept out of the
# main workspace so its dependencies do not affect cargo-deny or size budgets.
[package]
name = "s2-pimalaya-io"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
io-imap = { version = "0.6", default-features = false }
io-smtp = { version = "0.3", default-features = false }
io-sasl = { version = "0.1", default-features = false }
async-io = "2"
async-net = "2"
futures-lite = "2"
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
smol = "2"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
