name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["archlinux:latest", "ubuntu:26.04"]
    steps:
      - name: Install system packages (Arch)
        if: startsWith(matrix.image, 'archlinux')
        run: pacman -Syu --noconfirm --needed base-devel git curl libxkbcommon libxkbcommon-x11 fontconfig freetype2 dbus
      - name: Install system packages (Ubuntu)
        if: startsWith(matrix.image, 'ubuntu')
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev libfreetype-dev \
            dbus-daemon
      - uses: actions/checkout@v4
      - name: Install Rust (version from rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig-dev libfreetype-dev
      - run: rustup toolchain install
      - run: cargo build --release --workspace --bins --locked
      - run: ci/check-sizes.sh
