name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["archlinux:latest", "ubuntu:26.04"]
    steps:
      - name: Install system packages (Arch)
        if: startsWith(matrix.image, 'archlinux')
        run: pacman -Syu --noconfirm --needed base-devel git curl libxkbcommon libxkbcommon-x11 fontconfig freetype2 dbus gnupg jq
      - name: Install system packages (Ubuntu)
        if: startsWith(matrix.image, 'ubuntu')
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev libfreetype-dev \
            dbus-daemon gnupg gpgsm jq
      - uses: actions/checkout@v4
      - name: Install Rust (version from rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: ci/gen-credits.sh --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # Katna Server's tests against a real PostgreSQL.
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: katna
          POSTGRES_PASSWORD: katna
          POSTGRES_DB: katna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U katna"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      KATNA_SERVER_TEST_DATABASE_URL: postgres://katna:katna@localhost:5432/katna_test
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo test --locked -p katna-server -- --include-ignored

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig-dev libfreetype-dev
      - run: rustup toolchain install
      - run: cargo build --release --workspace --bins --locked
      # Build the non-GUI binaries again on their own, as the Arch package
      # does: in a whole-workspace build they get the extra features GPUI
      # turns on in shared crates (zbus portals, regex, log), which they
      # never use.
      - run: cargo build --release --locked -p katna-daemon -p katnactl -p katna-search-cli -p katna-bench
      - run: ci/check-sizes.sh
