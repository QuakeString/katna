name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Secondary (secondary.yml) runs the Ubuntu or the Windows jobs alone,
  # after each push to main, beside this Arch run and never gating it.
  workflow_call:
    inputs:
      platform:
        description: "ubuntu or windows: only that platform's tests; empty: Arch's, as on main (release.yml)"
        type: string
        required: false
        default: ""

# A newer push to a pull request cancels its older run; runs on main all
# finish, since they save the build caches pull requests start from.
concurrency:
  group: ci-${{ inputs.platform }}${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Nobody reads CI's debug info; without it builds are faster and the
  # caches smaller.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

# Read-only by default; the jobs that publish ask for more themselves.
permissions:
  contents: read

jobs:
  # Whether the pull request changes anything that is built or tested. A
  # pull request that only edits docs/ (except docs/credits.json, which the
  # app embeds) skips the builds; every job still reports, so required
  # checks pass.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [[ -n "$PR" ]] && files=$(gh pr diff "$PR" --name-only) && [[ -n "$files" ]]; then
            if ! grep -qvE '^docs/' <<<"$files" && ! grep -qx 'docs/credits.json' <<<"$files"; then
              code=false
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  check:
    name: check (${{ matrix.image }})
    needs: changes
    if: inputs.platform != 'windows'
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ inputs.platform == 'ubuntu' && fromJSON('["ubuntu:26.04"]') || fromJSON('["archlinux:latest", "ubuntu:26.04"]') }}
    env:
      # Pull requests and main are gated on Arch only; here the Ubuntu job
      # skips its steps (and still reports, for required checks) unless the
      # workflow is run by hand or by Secondary.
      CODE: ${{ (startsWith(matrix.image, 'ubuntu') && github.event_name != 'workflow_dispatch' && inputs.platform != 'ubuntu') && 'false' || needs.changes.outputs.code }}
    steps:
      - name: Install system packages (Arch)
        if: startsWith(matrix.image, 'archlinux') && env.CODE == 'true'
        run: pacman -Syu --noconfirm --needed base-devel git curl zstd libxkbcommon libxkbcommon-x11 fontconfig freetype2 dbus gnupg jq
      - name: Install system packages (Ubuntu)
        if: startsWith(matrix.image, 'ubuntu') && env.CODE == 'true'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config zstd \
            libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev libfreetype-dev \
            dbus-daemon gnupg gpgsm jq
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.CODE == 'true'
      # Tried again on a dropped connection: one reset from
      # static.rust-lang.org once failed main's CI and held back the package.
      - name: Install Rust (version from rust-toolchain.toml)
        if: env.CODE == 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh \
              && sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain none; then
              break
            fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install
        if: env.CODE == 'true'
      # Dependencies built on main; our own crates are always rebuilt.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: env.CODE == 'true'
        with:
          key: ${{ matrix.image }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
        if: env.CODE == 'true'
      - run: ci/gen-credits.sh --check
        if: env.CODE == 'true'
      - run: ci/check-tokens.sh
        if: env.CODE == 'true'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: env.CODE == 'true'
      - run: cargo test --workspace --locked
        if: env.CODE == 'true'

  # Katna on Windows 10 and later (docs/ARCHITECTURE.md §27): the whole
  # workspace except Katna Server builds with GPUI's Windows backend, and
  # the tests run there. Only when the workflow is run by hand or by
  # Secondary, as for Ubuntu above.
  windows:
    needs: changes
    if: (github.event_name == 'workflow_dispatch' || inputs.platform == 'windows') && needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --exclude katna-server --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude katna-server --locked --no-fail-fast
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/dbus
          key: windows-dbus-${{ hashFiles('ci/windows-dbus.ps1') }}
      - name: Build dbus-daemon
        run: ci/windows-dbus.ps1
      - name: Katna's session bus starts katna-daemon
        shell: pwsh
        run: |
          cargo build --locked -p katna-daemon
          Copy-Item target\dbus\* target\debug\deps
          Copy-Item target\debug\katna-daemon.exe target\debug\deps
          $env:APPDATA = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\katna\Roaming"
          $env:LOCALAPPDATA = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\katna\Local"
          cargo test --locked -p katna-dbus --test windows_bus -- --ignored

  # Katna Server's tests against a real PostgreSQL.
  server:
    needs: changes
    if: needs.changes.outputs.code == 'true' && !inputs.platform
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: katna
          POSTGRES_PASSWORD: katna
          POSTGRES_DB: katna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U katna"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      KATNA_SERVER_TEST_DATABASE_URL: postgres://katna:katna@localhost:5432/katna_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked -p katna-server -- --include-ignored
      - name: Tracked sending against a running server
        env:
          DATABASE_URL: postgres://katna:katna@localhost:5432/katna_test
          KATNA_SERVER_LISTEN: 127.0.0.1:8080
          KATNA_TEST_TRACKING_URL: http://127.0.0.1:8080
          KATNA_TEST_SERVER_LOG: /tmp/katna-server.log
          # No SMTP relay here: the test reads the codes from the log.
          KATNA_SERVER_DEV_MAILER: log
          NO_COLOR: "1"
        run: |
          cargo build --locked -p katna-server
          target/debug/katna-server > /tmp/katna-server.log 2>&1 &
          for _ in $(seq 60); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          cargo test --locked -p katna-sync --test outbox -- --ignored tracked_mail_with_a_real_server

  deny:
    if: ${{ !inputs.platform }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  # The release binaries, built in two jobs side by side: every binary of
  # the workspace (Katna Mail and Katna Calendar are measured from this
  # one), and the non-GUI binaries on their own, as the Arch package builds
  # them. In a whole-workspace build they get the extra features GPUI turns
  # on in shared crates (zbus portals, regex, log), which they never use.
  size-build:
    name: size build (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && !inputs.platform
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - part: workspace
            args: --workspace --bins
            keep: katna-mail katna-calendar
          - part: non-GUI
            args: -p katna-daemon -p katnactl -p katna-search-cli -p katna-bench
            keep: katna-daemon katnactl katna-search-cli katna-bench
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install GPUI build dependencies
        if: matrix.part == 'workspace'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig-dev libfreetype-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.part }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked ${{ matrix.args }}
      - name: Keep the measured binaries
        run: mkdir bins && for bin in ${{ matrix.keep }}; do cp "target/release/$bin" bins/; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: size-${{ matrix.part }}
          path: bins/
          retention-days: 1

  size:
    needs: [changes, size-build]
    if: always() && needs.changes.result == 'success' && !inputs.platform
    runs-on: ubuntu-latest
    steps:
      - name: Builds failed
        if: needs.size-build.result != 'success' && needs.changes.outputs.code == 'true'
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.changes.outputs.code == 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.changes.outputs.code == 'true'
        with:
          pattern: size-*
          merge-multiple: true
          path: target/release
      - run: ci/check-sizes.sh
        if: needs.changes.outputs.code == 'true'
