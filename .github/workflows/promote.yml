name: Promote to stable

# Releases a beta as stable (docs/RELEASING.md): the beta's files, copied
# unchanged, become the release `vX.Y.Z` on the beta's commit and the
# rolling `stable-latest`. Nothing is rebuilt, so what was tested is what
# ships. Run by hand (Actions > Promote to stable > Run workflow); the copy
# waits in the `stable` environment until a required reviewer approves.
on:
  workflow_dispatch:
    inputs:
      beta:
        description: "The beta to release, e.g. v1.2.0-beta.3"
        type: string
        required: true

concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      release: ${{ steps.check.outputs.release }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BETA: ${{ inputs.beta }}
        run: |
          if [[ ! $BETA =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.([1-9][0-9]*)$ ]]; then
            echo "::error::$BETA is not vX.Y.Z-beta.N"
            exit 1
          fi
          release=${BETA%-beta.*}
          api="repos/$GH_REPO"
          # Without a required reviewer GitHub would run the copy at once.
          reviewers=$(gh api "$api/environments/stable" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' 2>/dev/null || echo 0)
          if [[ $reviewers == 0 ]]; then
            echo "::error::The stable environment has no required reviewer (Settings > Environments > stable; docs/RELEASING.md)"
            exit 1
          fi
          beta=$(gh api "$api/releases/tags/$BETA") || {
            echo "::error::$BETA has no release; release.yml publishes each beta"
            exit 1
          }
          if [[ $(jq -r '.draft' <<<"$beta") != false ]]; then
            echo "::error::$BETA's release is a draft"
            exit 1
          fi
          if gh api "$api/git/ref/tags/$release" > /dev/null 2>&1; then
            echo "::error::$release is out already"
            exit 1
          fi
          # The newest beta of the version: a fix found during the soak
          # makes a new beta, and that one is what ships.
          newest=$(gh api --paginate "$api/releases" --jq '.[].tag_name' |
            grep -E "^${release//./\\.}-beta\.[0-9]+$" | sort -t. -k4,4n | tail -n1)
          if [[ $newest != "$BETA" ]]; then
            echo "::error::$newest is newer than $BETA"
            exit 1
          fi
          sha=$(gh api "$api/commits/refs/tags/$BETA" --jq .sha)
          {
            echo "release=$release"
            echo "sha=$sha"
          } | tee -a "$GITHUB_OUTPUT"

  promote:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: stable
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.check.outputs.release }}
    permissions:
      contents: write
    env:
      BETA: ${{ inputs.beta }}
      RELEASE: ${{ needs.check.outputs.release }}
      SHA: ${{ needs.check.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: src
          sparse-checkout: |
            ci
            packaging/keys
          persist-credentials: false
      - name: Download the beta's files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$BETA" -D out
          cd out
          ls -l
          sha256sum -c SHA256SUMS
          if [[ -f SHA256SUMS.minisig ]]; then
            sudo apt-get install -y -qq minisign > /dev/null
            minisign -V -m SHA256SUMS -p ../src/packaging/keys/katna-update.pub
          fi
      - name: Write the release notes
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/stable-latest"
          cat > notes.md <<EOF
          Katna ${RELEASE#v}: the files of \`$BETA\`, unchanged
          (commit $SHA). \`stable-latest\` always holds the newest release.

          - **Arch:** add \`[katna]\` with \`Server = $base\` to
            \`/etc/pacman.conf\` (packaging/README.md), then
            \`sudo pacman -Syu katna-git\`
          - **Windows 10 and 11:** KatnaSetup.exe
          - **Fedora:** \`sudo dnf install $base/katna-x86_64.rpm\`
          - **Ubuntu 22.04+ and Debian 12+:** \`sudo apt install ./katna_amd64.deb\`
          - **AppImage, Snap, Flatpak, any other Linux:** as for
            \`linux-latest\` (packaging/README.md)

          SHA256SUMS lists every file's SHA-256.
          EOF
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash src/ci/publish-release.sh --latest "$RELEASE" "$SHA" "Katna ${RELEASE#v}" notes.md out
          bash src/ci/publish-release.sh --rolling --prerelease stable-latest "$SHA" \
            "Katna stable (newest: ${RELEASE#v})" notes.md out
