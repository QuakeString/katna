name: Arch package

# Builds packaging/arch/PKGBUILD in an Arch container. On main it replaces
# the `arch-latest` pre-release with the new package and a pacman repository
# database, so Arch users install and update Katna without building it
# (packaging/README.md, "Prebuilt package").

on:
  push:
    branches: [main]
    # Nothing under docs/ goes into the package except the credits the
    # About dialog embeds, so docs-only pushes keep the current package.
    paths:
      - "**"
      - "!docs/**"
      - "docs/credits.json"
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/arch-package.yml"
  workflow_dispatch:

# On main a running build always finishes and publishes; GitHub keeps
# only the newest push waiting behind it, so busy stretches of merges no
# longer cancel every build and leave arch-latest stale. A newer push to
# a pull request still cancels its older run.
concurrency:
  group: arch-package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 120
    env:
      # Shared by the build user and root, so rust-cache (which runs as
      # root) sees the toolchain and the downloaded crates. The build
      # directory is set below, beside the checkout.
      RUSTUP_HOME: /opt/rustup
      CARGO_HOME: /opt/cargo
    steps:
      # The package's depends and makedepends (rustup provides cargo), so
      # makepkg finds them all installed and needs no sudo.
      - name: Install build tools and dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rustup \
            dbus fontconfig freetype2 gcc-libs glibc libglvnd libxcb \
            libxkbcommon libxkbcommon-x11 polkit vulkan-icd-loader wayland
      - uses: actions/checkout@v4
        with:
          # pkgver counts the commits.
          fetch-depth: 0
      # makepkg refuses to run as root.
      - name: Create the build user
        run: |
          useradd --create-home builder
          # packaging/arch/PKGBUILD builds here instead of in its own
          # fresh clone, so the cache below applies.
          target=$(realpath -m ../katna-target)
          echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"
          mkdir -p "$RUSTUP_HOME" "$CARGO_HOME" "$target"
          chown -R builder: "$GITHUB_WORKSPACE" "$RUSTUP_HOME" "$CARGO_HOME" "$target"
          git config --system --add safe.directory '*'
      - name: Install Rust
        run: |
          runuser -u builder -- env HOME=/home/builder \
              RUSTUP_HOME="$RUSTUP_HOME" CARGO_HOME="$CARGO_HOME" bash -euc '
            rustup toolchain install stable --profile minimal
            rustup default stable
            # The components rust-toolchain.toml names, so rust-cache (run
            # as root in the checkout) has nothing to install.
            rustup toolchain install
          '
      # Dependencies built on main; Katna's own crates are always rebuilt.
      - uses: Swatinem/rust-cache@v2
        with:
          key: arch-package
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: ". -> ../katna-target"
      - name: Hand the restored cache to the build user
        run: |
          chown -R builder: "$RUSTUP_HOME" "$CARGO_HOME" "$CARGO_TARGET_DIR"
      - name: Build the package
        env:
          # "Sign in with Google/Microsoft" (katna_core::ids); unset hides
          # the buttons, as in pull requests from forks.
          KATNA_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.KATNA_GOOGLE_OAUTH_CLIENT_ID }}
          KATNA_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.KATNA_GOOGLE_OAUTH_CLIENT_SECRET }}
          KATNA_MICROSOFT_OAUTH_CLIENT_ID: ${{ secrets.KATNA_MICROSOFT_OAUTH_CLIENT_ID }}
        run: |
          runuser -u builder -- env HOME=/home/builder \
              RUSTUP_HOME="$RUSTUP_HOME" CARGO_HOME="$CARGO_HOME" \
              CARGO_TARGET_DIR="$CARGO_TARGET_DIR" \
              KATNA_GOOGLE_OAUTH_CLIENT_ID="$KATNA_GOOGLE_OAUTH_CLIENT_ID" \
              KATNA_GOOGLE_OAUTH_CLIENT_SECRET="$KATNA_GOOGLE_OAUTH_CLIENT_SECRET" \
              KATNA_MICROSOFT_OAUTH_CLIENT_ID="$KATNA_MICROSOFT_OAUTH_CLIENT_ID" \
              bash -euc '
            # makepkg clones the checked-out branch; pull request
            # checkouts have none.
            git checkout -B makepkg-ci
            cd packaging/arch
            makepkg --noconfirm
          '
      - name: Make the pacman repository
        run: |
          mkdir out
          pkg=$(cd packaging/arch && ls katna-git-*.pkg.tar.zst)
          cp "packaging/arch/$pkg" out/
          # The same package under a name that does not change, for a
          # one-off download.
          cp "packaging/arch/$pkg" out/katna-git-x86_64.pkg.tar.zst
          cd out
          # What Katna Mail's updates read (katna_core::update::Manifest):
          # the version, the file under its fixed name, its SHA-256 and
          # size.
          version=$(pacman -Qp "$pkg" | cut -d' ' -f2)
          version=${version%-*}
          file=katna-git-x86_64.pkg.tar.zst
          sha=$(sha256sum "$file" | cut -d' ' -f1)
          size=$(stat -c %s "$file")
          printf '{"version":"%s","file":"%s","sha256":"%s","size":%s}\n' \
            "$version" "$file" "$sha" "$size" > katna-update.json
          cat katna-update.json
          repo-add katna.db.tar.gz "$pkg"
          # Release assets cannot be symlinks.
          rm katna.db katna.files
          cp katna.db.tar.gz katna.db
          cp katna.files.tar.gz katna.files
          ls -l
      - name: Install it and run it
        run: |
          pacman -U --noconfirm out/katna-git-x86_64.pkg.tar.zst
          for bin in katna-mail katna-daemon katnactl; do
            if ldd "/usr/bin/$bin" | grep 'not found'; then exit 1; fi
          done
          katnactl --help > /dev/null
          test -x /usr/lib/katna/katna-update-helper
          # The manifest names the version the package reports.
          test "$(katna-mail --version)" = \
            "katna-mail $(sed 's/.*"version":"\([^"]*\)".*/\1/' out/katna-update.json)"
          pacman -Ql katna-git
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: out/
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: arch-package-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: out
      - name: Update the arch-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          base="https://github.com/$GH_REPO/releases/download/arch-latest"
          cat > notes.md <<EOF
          Katna Mail built from \`main\` at $GITHUB_SHA for Arch Linux (x86_64).
          Replaced on every push to \`main\`.

          **Install once:**

          \`\`\`sh
          curl -LO $base/katna-git-x86_64.pkg.tar.zst
          sudo pacman -U katna-git-x86_64.pkg.tar.zst
          \`\`\`

          **Or add it as a pacman repository**, so \`pacman -Syu\` keeps it
          up to date. Append to \`/etc/pacman.conf\`:

          \`\`\`ini
          [katna]
          SigLevel = Optional TrustAll
          Server = $base
          \`\`\`

          then \`sudo pacman -Syu katna-git\`.

          The package is not signed. See \`packaging/README.md\` for starting
          the background service and adding an account.
          EOF
          # The release is updated in place, never deleted and created
          # again: on 2026-09-28 a delete and create seconds apart left it
          # a draft (every download 404) although gh reported success.
          # Replacing it in place also keeps the files downloadable while
          # the new ones go up.
          tag=arch-latest
          api="repos/$GH_REPO"
          if gh api "$api/git/ref/tags/$tag" > /dev/null 2>&1; then
            gh api -X PATCH "$api/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api -X POST "$api/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
          fi
          # Drafts included: the list is the only place they show.
          ids=$(gh api --paginate "$api/releases" --jq ".[] | select(.tag_name == \"$tag\") | .id")
          id=$(head -n1 <<<"$ids")
          for extra in $(tail -n +2 <<<"$ids"); do
            gh api -X DELETE "$api/releases/$extra"
          done
          fields=(-f tag_name="$tag" -f target_commitish="$GITHUB_SHA"
                  -f name="Katna for Arch Linux (latest main)"
                  -F body=@notes.md -F draft=false -F prerelease=true)
          if [[ -n "$id" ]]; then
            gh api -X PATCH "$api/releases/$id" "${fields[@]}" > /dev/null
          else
            id=$(gh api -X POST "$api/releases" "${fields[@]}" --jq .id)
          fi
          # The new package first and the repository database last, so the
          # database never names a package that is not there yet.
          cd out
          pkg=$(ls katna-git-*.pkg.tar.zst | grep -vxF katna-git-x86_64.pkg.tar.zst)
          others=$(ls | grep -vxF -e "$pkg" -e 'katna.db' -e 'katna.db.tar.gz')
          gh release upload "$tag" --clobber "$pkg"
          gh release upload "$tag" --clobber $others
          gh release upload "$tag" --clobber katna.db.tar.gz katna.db
          # Earlier builds' packages.
          gh api "$api/releases/$id/assets" --paginate --jq '.[] | "\(.id) \(.name)"' |
            while read -r asset name; do
              [[ -e "$name" ]] || gh api -X DELETE "$api/releases/assets/$asset"
            done
      # Fails the run unless the release is public and every file downloads,
      # retrying for a while in case GitHub is slow to show the change.
      - name: Check the release is public and complete
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          base="https://github.com/$GH_REPO/releases/download/arch-latest"
          for attempt in $(seq 10); do
            ok=true
            release=$(gh api "repos/$GH_REPO/releases/tags/arch-latest" 2>/dev/null) || ok=false
            if $ok && [[ $(jq -r .draft <<<"$release") != false ]]; then ok=false; fi
            if $ok && [[ $(jq -r .target_commitish <<<"$release") != "$GITHUB_SHA" ]] &&
               [[ $(gh api "repos/$GH_REPO/git/ref/tags/arch-latest" --jq .object.sha) != "$GITHUB_SHA" ]]; then
              ok=false
            fi
            for file in out/*; do
              $ok || break
              name=$(basename "$file")
              size=$(curl -fsSL -o /dev/null -w '%{size_download}' "$base/$name") || { ok=false; break; }
              [[ "$size" == "$(stat -c %s "$file")" ]] || ok=false
            done
            if $ok; then echo "arch-latest is public with all $(ls out | wc -l) files"; exit 0; fi
            echo "Not public and complete yet (attempt $attempt); trying to publish it again"
            id=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == "arch-latest") | .id' | head -n1)
            [[ -n "$id" ]] && gh api -X PATCH "repos/$GH_REPO/releases/$id" -F draft=false -f tag_name=arch-latest > /dev/null || true
            sleep 15
          done
          echo "::error::arch-latest is still a draft or missing files; pacman cannot update"
          exit 1
