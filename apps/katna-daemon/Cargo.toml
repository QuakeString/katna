[package]
name = "katna-daemon"
description = "Katna background service: sync, indexing, scheduling, notifications and the D-Bus API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
katna-core.workspace = true
katna-store.workspace = true
katna-meta.workspace = true
katna-sync.workspace = true
katna-import.workspace = true
katna-search.workspace = true
katna-org.workspace = true
katna-dav.workspace = true
jiff.workspace = true
katna-dbus.workspace = true
# Without the "format" feature, whose ICU4X data is large: the few
# numbers in the daemon's text show as Western digits.
katna-i18n.workspace = true
katna-notify.workspace = true
# SHA-256 of downloaded updates (already in the tree through rustls).
ring.workspace = true
katna-platform.workspace = true
katna-translate.workspace = true
katna-ai.workspace = true
async-channel.workspace = true
async-io.workspace = true
async-signal.workspace = true
futures-lite.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true
thiserror.workspace = true
tracing.workspace = true
zbus.workspace = true

# The Secret Service keyring exists only on Linux and the BSDs; Windows keeps
# passwords in its Credential Manager.
[target.'cfg(unix)'.dependencies]
oo7.workspace = true

# The file managers' menu entry on Windows lives in the registry.
[target.'cfg(windows)'.dependencies]
winreg.workspace = true

[build-dependencies]
winresource.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
