title = "Menus, dialogs and New Message by keyboard"
text = """
Up and Down move through any menu, and Enter picks. Shift+F10 or the Menu
key opens the right-click menu of the selected mail. Dialogs take the keys
when they open: Enter answers, Esc cancels, and Tab stays inside them. In
a new message, Ctrl+Enter sends from any field and Esc closes it, keeping
a draft.
"""
