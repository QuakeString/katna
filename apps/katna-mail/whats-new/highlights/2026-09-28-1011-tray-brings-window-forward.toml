title = "Tray and notification clicks bring Katna Mail forward"
text = """
Clicking the tray icon, or Open Inbox, New Message or Preferences in its
menu, now brings the Katna Mail window to the front on Wayland, even when
it was minimized or behind other windows. Clicking a new-mail
notification opens that mail, even when the Inbox list does not show it.
"""
