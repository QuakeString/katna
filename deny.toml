# cargo-deny configuration: licenses, bans and advisories.
# Katna is GPL-3.0-or-later; every dependency license must be compatible.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # Unmaintained (not vulnerable) crates pulled in by GPUI (gpui-pre 0.3.6).
    # Revisit when GPUI is upgraded (docs/spikes/S1-window-chrome.md).
    { id = "RUSTSEC-2024-0436", reason = "paste: via gpui-pre (image/exr, metal); unmaintained, no known vulnerability" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz: via gpui-pre (usvg); unmaintained, no known vulnerability" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: via gpui-pre (fontdb, rustybuzz); unmaintained, no known vulnerability" },
    # Unmaintained (not vulnerable) crate pulled in by Harper's grammar rules.
    { id = "RUSTSEC-2025-0141", reason = "bincode 2: via harper-core (harper-brill, burn); unmaintained, no known vulnerability" },
    # zip 8 flaws, fixed only in zip 9. Katna and calamine are on zip 9;
    # zip 8 comes in only through harper-core (2.11 up to 3.2 need ^8.6),
    # which opens its own bundled rule packs in memory with
    # ZipArchive::new (src/weirpack), never calls extract() or
    # ZipStreamReader, and enables neither aes-crypto nor legacy-zip, so none
    # applies. Remove when harper-core moves to zip 9.
    { id = "RUSTSEC-2026-0367", reason = "zip 8: SUID/SGID kept by extract(); never called" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8: symlinks escape in extract(); never called" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8: permissions through symlinks in extract(); never called" },
    { id = "RUSTSEC-2026-0429", reason = "zip 8: symlink size abort in extract(); never called" },
    { id = "RUSTSEC-2026-0545", reason = "zip 8: AES authentication; aes-crypto feature off" },
    { id = "RUSTSEC-2026-0546", reason = "zip 8: chained symlinks escape in extract(); never called" },
    { id = "RUSTSEC-2026-0547", reason = "zip 8: legacy Shrink/Reduce/Implode preallocation; legacy-zip feature off" },
    { id = "RUSTSEC-2026-0548", reason = "zip 8: ZipStreamReader names; never used" },
    # Unmaintained (not vulnerable), no replacement release: chrono comes in
    # through GPUI, calamine, zip, rusqlite and katna-sync (IMAP dates).
    # Revisit when the dependencies move to jiff or time.
    { id = "RUSTSEC-2026-0543", reason = "chrono: unmaintained, no known vulnerability; via GPUI, calamine, zip, rusqlite, katna-sync" },
    # Unmaintained (not vulnerable): folded into zbus 6, but zbus 5 still
    # comes in through GPUI (accesskit_unix, ashpd, oo7). Revisit with zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6; via zbus 5; no known vulnerability" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6; via zbus 5; no known vulnerability" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6; via zbus 5; no known vulnerability" },
]

[licenses]
confidence-threshold = 0.9
# Allow-list entries not used yet (few dependencies so far) are fine.
unused-allowed-license = "allow"
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    # libbz2-rs-sys (via GPUI's HTTP client): permissive, GPL-compatible.
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
    # quoted_printable (via lettre, Katna Server's mail): public-domain-like.
    "0BSD",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # GPUI types stay in the UI crates (docs/ARCHITECTURE.md §3, §20).
    # katna-daemon must never depend on GPUI.
    # GPUI's own platform crates depend on gpui-pre too; the platform crate
    # is banned the same way, so the chain still ends in a UI crate.
    { crate = "gpui-pre", wrappers = ["katna-ui", "katna-chrome", "katna-mail", "katna-calendar", "katna-setup", "gpui-pre-platform", "gpui-pre-linux", "gpui-pre-wgpu", "gpui-pre-apple", "gpui-pre-macos", "gpui-pre-windows", "gpui-pre-web"], reason = "GPUI is only allowed in UI crates" },
    { crate = "gpui-pre-platform", wrappers = ["katna-ui", "katna-chrome", "katna-mail", "katna-calendar", "katna-setup"], reason = "GPUI is only allowed in UI crates" },
    # Katna Server's HTTP and database crates stay in the server.
    { crate = "axum", wrappers = ["katna-server"], reason = "server only" },
    { crate = "tokio-postgres", wrappers = ["katna-server", "deadpool-postgres"], reason = "server only" },
    { crate = "deadpool-postgres", wrappers = ["katna-server"], reason = "server only" },
    { crate = "lettre", wrappers = ["katna-server"], reason = "server only" },
    { crate = "argon2", wrappers = ["katna-server"], reason = "server only" },
    # TLS is rustls only (docs/ARCHITECTURE.md §19).
    { crate = "openssl-sys", reason = "use rustls" },
    { crate = "native-tls", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
