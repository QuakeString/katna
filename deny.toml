# cargo-deny configuration: licenses, bans and advisories.
# Katna is GPL-3.0-or-later; every dependency license must be compatible.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # Unmaintained (not vulnerable) crates pulled in by GPUI (gpui-pre 0.3.6).
    # Revisit when GPUI is upgraded (docs/spikes/S1-window-chrome.md).
    { id = "RUSTSEC-2024-0436", reason = "paste: via gpui-pre (image/exr, metal); unmaintained, no known vulnerability" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz: via gpui-pre (usvg); unmaintained, no known vulnerability" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: via gpui-pre (fontdb, rustybuzz); unmaintained, no known vulnerability" },
    # Unmaintained (not vulnerable) crate pulled in by Harper's grammar rules.
    { id = "RUSTSEC-2025-0141", reason = "bincode 2: via harper-core (harper-brill, burn); unmaintained, no known vulnerability" },
]

[licenses]
confidence-threshold = 0.9
# Allow-list entries not used yet (few dependencies so far) are fine.
unused-allowed-license = "allow"
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    # libbz2-rs-sys (via GPUI's HTTP client): permissive, GPL-compatible.
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # GPUI types stay in the UI crates (docs/ARCHITECTURE.md §3, §20).
    # katna-daemon must never depend on GPUI.
    # GPUI's own platform crates depend on gpui-pre too; the platform crate
    # is banned the same way, so the chain still ends in a UI crate.
    { crate = "gpui-pre", wrappers = ["katna-ui", "katna-chrome", "katna-mail", "katna-calendar", "gpui-pre-platform", "gpui-pre-linux", "gpui-pre-wgpu", "gpui-pre-apple", "gpui-pre-macos", "gpui-pre-windows", "gpui-pre-web"], reason = "GPUI is only allowed in UI crates" },
    { crate = "gpui-pre-platform", wrappers = ["katna-ui", "katna-chrome", "katna-mail", "katna-calendar"], reason = "GPUI is only allowed in UI crates" },
    # Katna Server's HTTP and database crates stay in the server.
    { crate = "axum", wrappers = ["katna-server"], reason = "server only" },
    { crate = "tokio-postgres", wrappers = ["katna-server", "deadpool-postgres"], reason = "server only" },
    { crate = "deadpool-postgres", wrappers = ["katna-server"], reason = "server only" },
    { crate = "lettre", wrappers = ["katna-server"], reason = "server only" },
    { crate = "argon2", wrappers = ["katna-server"], reason = "server only" },
    # TLS is rustls only (docs/ARCHITECTURE.md §19).
    { crate = "openssl-sys", reason = "use rustls" },
    { crate = "native-tls", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
