[package]
name = "katna-platform"
description = "Desktop integration: portals, desktop detection, settings, tray and badges."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
katna-core.workspace = true
futures-lite.workspace = true
serde.workspace = true
tracing.workspace = true
zbus.workspace = true

# Windows: the notification-area icon, global shortcuts, toasts, the
# Credential Manager, the registry and playing sounds.
[target.'cfg(windows)'.dependencies]
async-channel.workspace = true
global-hotkey.workspace = true
tray-icon.workspace = true
keyring-core.workspace = true
windows-native-keyring-store.workspace = true
winreg.workspace = true
winit.workspace = true
windows = { workspace = true, features = [
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "Media_Core",
    "Media_Playback",
    "UI_Notifications",
] }

[lints]
workspace = true
