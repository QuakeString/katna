[package]
name = "katna-i18n"
description = "Languages: the text of the user interface, the system language, and dates and numbers in the user's formats."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Dates and numbers with ICU4X. The daemon formats neither, so it leaves
# this out and stays small.
format = ["dep:icu_datetime", "dep:icu_decimal", "dep:icu_calendar", "dep:icu_time", "dep:icu_provider", "dep:jiff", "dep:writeable"]

[dependencies]
fluent-bundle.workspace = true
unic-langid.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
icu_locale_core.workspace = true
icu_datetime = { workspace = true, optional = true }
icu_decimal = { workspace = true, optional = true }
icu_calendar = { workspace = true, optional = true }
icu_time = { workspace = true, optional = true }
icu_provider = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
writeable = { workspace = true, optional = true }

[dev-dependencies]
fluent-syntax.workspace = true

[lints]
workspace = true
